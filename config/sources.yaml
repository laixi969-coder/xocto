# 采集源配置。改这里不用改代码。
# enabled: false 的源直接跳过。

http:
  timeout_seconds: 25
  # 带上项目地址：源站运维觉得我们抓得不对时有地方找人，而不是直接把 UA 拉黑
  user_agent: "x-octo/0.1 (+https://github.com/laixi969-coder/xocto)"
  retries: 2

sources:

  # V2EX 的 AI SaaS 与开发者发布帖：补上中文生态中尚未进入榜单、
  # 但已有公开产品链接和早期讨论的项目。帖子只作独立证据，产品官网用于去重。
  v2ex:
    enabled: true
    lookback_hours: 96
    nodes:
      - name: "aisaas"
        strict: false
      - name: "programmer"
        strict: true

  # ModelScope：中文开源生态的早期模型与工具采用信号。基础模型仍需经过
  # 编辑层判断，不能因为下载量或热度自动进入机会库。
  modelscope:
    enabled: true
    lookback_hours: 120
    limit: 100
    min_likes: 3
    min_downloads: 25

  # Product Hunt 的 AI 分类 feed。每天新品，是最主要的"新应用"来源。
  # 噪音大，但胜在全、快。
  producthunt:
    enabled: true
    # 有 PRODUCTHUNT_TOKEN 环境变量时走官方接口，能多拿到：
    #   真实官网（feed 只给它自己的页面链接）、票数、官方分类。
    # 没有 token 就自动退回下面的 feed，功能照常只是信息少。
    # 申请：producthunt.com/v2/oauth/applications（免费，五分钟）
    use_api: true
    max_pages: 4
    feed_url: "https://www.producthunt.com/feed?category=ai"
    # feed 只给 50 条，且按"最近有动静"排序而不是按发布时间，
    # 窗口卡太紧会捞不到东西（实测 48 小时只剩 4 条，7 天有 31 条）。
    # 每天跑的话增量仍然只有当天新发的，重复的由去重层兜住。
    lookback_hours: 168

  # Hacker News。开发者自荐（Show HN）质量高于 PH，
  # 且能看到还没做营销的早期项目。走 Algolia 公共接口，无需密钥。
  hackernews:
    enabled: true
    lookback_hours: 36
    queries:
      # 开发者自荐新品。实测 3 分门槛会进来 40+ 条且大半没人看，
      # 5 分能压到 15 条左右 —— 真有人关注的项目 36 小时内都过得了 5 分。
      - tags: "show_hn"
        query: ""
        min_points: 5
      # Launch HN = YC 公司的正式发布，一年就那么几十个，含金量最高
      - tags: "launch_hn"
        query: ""
        min_points: 1
      # 上了一定热度的 AI 讨论。这条会捞回大量新闻报道，
      # 采集器会自动把新闻标记出来、不放进产品池，只留给趋势那一节。
      - tags: "story"
        query: "AI"
        min_points: 40
      - tags: "story"
        query: "LLM agent"
        min_points: 25
      - tags: "story"
        query: "coding agent"
        min_points: 20
      - tags: "story"
        query: "MCP"
        min_points: 20
      # 行业原生切口：与 GitHub 的关键词发现并行。这里的讨论、发布和创始人
      # 自荐常会比通用 AI 产品平台更早暴露具体工作被重新产品化的信号。
      - tags: "story"
        query: "AI logistics"
        min_points: 8
      - tags: "story"
        query: "AI legal"
        min_points: 8
      - tags: "story"
        query: "AI accounting"
        min_points: 8
      - tags: "story"
        query: "AI construction"
        min_points: 8
      - tags: "story"
        query: "AI manufacturing"
        min_points: 8
      - tags: "story"
        query: "AI healthcare"
        min_points: 8
      - tags: "story"
        query: "AI insurance"
        min_points: 8
      - tags: "story"
        query: "AI agriculture"
        min_points: 8

  # GitHub 新建仓库里涨星快的。开源项目往往比闭源产品早半年
  # 暴露出一个方向能不能成。每日 Actions 用短期 GITHUB_TOKEN 扩大搜索面；
  # 本地未配置时自动退回匿名 API，功能不受阻。
  github:
    enabled: true
    created_within_days: 21
    min_stars: 40
    queries:
      - "ai agent"
      - "ai workflow"
      # "llm application" 实测 0 条 —— 没人这么写。用大家真在用的词。
      - "llm app"
      - "mcp server"
      - "coding agent"
      - "ai video"
      - "ai voice"
      - "ai search"
      - "ai education"
      - "ai healthcare"
      - "ai legal"
      - "ai sales"
      # 不只盯着 agent / coding：真正的 AI+ 机会会先在行业工作流里露头。
      # 每条查询都足够具体，避免 “AI for business” 这种泛词又把通用工具捞回来。
      - "ai accounting"
      - "ai insurance"
      - "ai logistics"
      - "ai construction"
      - "ai real estate"
      - "ai manufacturing"
      - "ai procurement"
      - "ai security"
      - "ai agriculture"
      - "ai energy"
      - "ai government"
    # 第二条发现链路：专题不会受项目名称和营销文案影响。新专题在发现漏口后加进来。
    topics:
      - "dsh"
      - "dsh-plugin"
      - "mcp"
      - "ai-agents"
      - "ai-coding"
      - "ai-search"
      - "generative-ai"
      - "computer-use"
    # 第三条发现链路：发布几天内已经爆发的项目无论关键词为何都必须复核。
    breakout:
      enabled: true
      within_days: 3
      min_stars: 5000
    # 第四条发现链路：重点发布方的新仓库按创建时间扫，不依赖 Search。
    official_organizations:
      - "deepseek-ai"
      - "openai"
      - "anthropics"
      - "xai-org"
    # 重点官方仓库的新 Release 会作为日报的行业背景，而非伪装成新产品。
    # 只保留稳定、与 AI 应用生态直接相关的官方仓库；不需要 token。
    release_lookback_hours: 72
    official_releases:
      - "openai/openai-python"
      - "anthropics/anthropic-sdk-python"
      - "huggingface/transformers"
      - "vercel/ai"
      - "langchain-ai/langchain"
      - "microsoft/autogen"
      - "mistralai/client-python"
      - "ollama/ollama"
      - "ggerganov/llama.cpp"
      - "google-gemini/generative-ai-python"
      - "cohere-ai/cohere-python"
      - "microsoft/semantic-kernel"
      - "run-llama/llama_index"
      - "langgenius/dify"

  # Hugging Face Hub。公开 API 不需要密钥；Spaces 偏应用，Models 偏基础能力。
  # 只收近期新建、且已有最低社区信号的项目，避免把镜像和试验仓库塞满产品池。
  huggingface:
    enabled: true
    lookback_hours: 72
    limit: 1000
    spaces:
      enabled: true
      min_likes: 2
    models:
      enabled: true
      min_likes: 5
      min_downloads: 50

  # 公司一手博客和 changelog。全部只补充日报背景，不进产品池。
  # 与市场观察分开统计：公司更新源全挂不应掩盖独立研究源的故障，反之亦然。
  officialfeeds:
    enabled: true
    lookback_hours: 72
    max_parallel_feeds: 6
    feeds:
      - name: "OpenAI"
        url: "https://openai.com/news/rss.xml"
      - name: "Hugging Face"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "Google AI"
        url: "https://blog.google/technology/ai/rss/"
      - name: "Google DeepMind"
        url: "https://deepmind.google/blog/rss.xml"
      - name: "Meta"
        url: "https://www.meta.com/blog/rss/"
      - name: "Cohere"
        url: "https://cohere.com/blog/rss.xml"
      - name: "Vercel"
        url: "https://vercel.com/changelog/rss.xml"
      - name: "AWS Machine Learning"
        url: "https://aws.amazon.com/blogs/machine-learning/feed/"
      - name: "NVIDIA"
        url: "https://blogs.nvidia.com/feed/"
      - name: "Apple Machine Learning"
        url: "https://machinelearning.apple.com/rss.xml"
      - name: "GitHub AI"
        url: "https://github.blog/ai-and-ml/feed/"

  # 独立研究、开发者观察与行业媒体：补齐产品平台和代码库天然覆盖不到的
  # 采用、分发、成本与市场结构信号。它们不是公司公告，也不直接当作产品。
  # 采集器默认标为 independent，健康检查会作为单独的 marketfeeds 源报警。
  marketfeeds:
    enabled: true
    lookback_hours: 72
    max_parallel_feeds: 6
    feeds:
      - name: "Latent Space"
        url: "https://www.latent.space/feed"
      - name: "One Useful Thing"
        url: "https://www.oneusefulthing.org/feed"
      - name: "Interconnects"
        url: "https://www.interconnects.ai/feed"
      - name: "Import AI"
        url: "https://importai.substack.com/feed"
      - name: "Understanding AI"
        url: "https://www.understandingai.org/feed"
      - name: "Benedict Evans"
        url: "https://www.ben-evans.com/benedictevans?format=rss"
      - name: "Exponential View"
        url: "https://www.exponentialview.co/feed"
      - name: "SemiAnalysis"
        url: "https://www.semianalysis.com/feed"
      - name: "TechCrunch AI"
        url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      - name: "The Verge AI"
        url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      - name: "MIT Technology Review AI"
        url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"
      - name: "a16z"
        url: "https://feeds.feedburner.com/AndreessenHorowitz"
      - name: "Simon Willison"
        url: "https://simonwillison.net/atom/everything/"

  # AICPB（AI 产品榜）。中文世界唯一能拿到真实数据的源。
  # 性质和上面三个不同：它给的不是"刚冒出来的新东西"，而是
  # "已经跑出规模的东西 + 真实访问量/月活 + 环比"。
  # 增长率榜上的异常值（比如环比 +3479%）就是最强的信号。
  # 榜单月度更新，每天抓也无妨，重复的由去重层兜住。
  aicpb:
    enabled: true
    rankings:
      # 中国增长率榜 —— 找国产新势力，最该看的一个
      - "china-ai-growth-rate-ranking"
      # 中国总榜 —— 看存量格局
      - "china-ai-rankings"
      # 全球增长率榜 —— 和中国榜对照着看
      - "ai-global-growth-rate-ranking"
      # 全球 APP 增速榜 —— iOS / 海外 Google Play / 国内安卓的月活与环比。
      # 图中 WorkBuddy、Dootchi、Viggle 等就在这个专页，不在上面的网页榜里。
      - "ai-global-growth-rate-ranking/apps"
      # vibe coding 细分榜 —— 存量头部（Lovable、Bolt 等）走这里进来，
      # 它们已过高增长期，全球增长率榜捞不到。榜单月度更新，重复由去重层兜住。
      - "vibe-coding-rankings"
      # AI Agent 细分榜 —— 存量头部 Agent 产品（Manus、Cursor 类）走这里进来。
      - "ai-agent-rankings"
      - "ai-search-rankings"
      - "ai-video-generators-rankings"
      - "ai-ppt-rankings"
      - "ai-chatbot-rankings"

  # ---- 以下暂未启用 ----

  reddit:
    enabled: false
    note: "免登录 JSON 接口已被封，需要注册 OAuth app 才能接。等有明确需要再做。"

  ycombinator:
    enabled: false
    note: "公司目录是动态加载页，抓取脆弱且一年只更新两批。优先级低。"
