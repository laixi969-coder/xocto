# 采集源配置。改这里不用改代码。
# enabled: false 的源直接跳过。

http:
  timeout_seconds: 25
  # 带上项目地址：源站运维觉得我们抓得不对时有地方找人，而不是直接把 UA 拉黑
  user_agent: "x-octo/0.1 (+https://github.com/laixi969-coder/xocto)"
  retries: 2

sources:

  # Product Hunt 的 AI 分类 feed。每天新品，是最主要的"新应用"来源。
  # 噪音大，但胜在全、快。
  producthunt:
    enabled: true
    # 有 PRODUCTHUNT_TOKEN 环境变量时走官方接口，能多拿到：
    #   真实官网（feed 只给它自己的页面链接）、票数、官方分类。
    # 没有 token 就自动退回下面的 feed，功能照常只是信息少。
    # 申请：producthunt.com/v2/oauth/applications（免费，五分钟）
    use_api: true
    max_pages: 4
    feed_url: "https://www.producthunt.com/feed?category=ai"
    # feed 只给 50 条，且按"最近有动静"排序而不是按发布时间，
    # 窗口卡太紧会捞不到东西（实测 48 小时只剩 4 条，7 天有 31 条）。
    # 每天跑的话增量仍然只有当天新发的，重复的由去重层兜住。
    lookback_hours: 168

  # Hacker News。开发者自荐（Show HN）质量高于 PH，
  # 且能看到还没做营销的早期项目。走 Algolia 公共接口，无需密钥。
  hackernews:
    enabled: true
    lookback_hours: 36
    queries:
      # 开发者自荐新品。实测 3 分门槛会进来 40+ 条且大半没人看，
      # 5 分能压到 15 条左右 —— 真有人关注的项目 36 小时内都过得了 5 分。
      - tags: "show_hn"
        query: ""
        min_points: 5
      # Launch HN = YC 公司的正式发布，一年就那么几十个，含金量最高
      - tags: "launch_hn"
        query: ""
        min_points: 1
      # 上了一定热度的 AI 讨论。这条会捞回大量新闻报道，
      # 采集器会自动把新闻标记出来、不放进产品池，只留给趋势那一节。
      - tags: "story"
        query: "AI"
        min_points: 40
      - tags: "story"
        query: "LLM agent"
        min_points: 25

  # GitHub 新建仓库里涨星快的。开源项目往往比闭源产品早半年
  # 暴露出一个方向能不能成。走公共 Search API，匿名有速率限制但够用。
  github:
    enabled: true
    created_within_days: 21
    min_stars: 40
    queries:
      - "ai agent"
      - "ai workflow"
      # "llm application" 实测 0 条 —— 没人这么写。用大家真在用的词。
      - "llm app"
    # 第二条发现链路：专题不会受项目名称和营销文案影响。新专题在发现漏口后加进来。
    topics:
      - "dsh"
      - "dsh-plugin"
    # 第三条发现链路：发布几天内已经爆发的项目无论关键词为何都必须复核。
    breakout:
      enabled: true
      within_days: 3
      min_stars: 5000
    # 第四条发现链路：重点发布方的新仓库按创建时间扫，不依赖 Search。
    official_organizations:
      - "deepseek-ai"

  # AICPB（AI 产品榜）。中文世界唯一能拿到真实数据的源。
  # 性质和上面三个不同：它给的不是"刚冒出来的新东西"，而是
  # "已经跑出规模的东西 + 真实访问量/月活 + 环比"。
  # 增长率榜上的异常值（比如环比 +3479%）就是最强的信号。
  # 榜单月度更新，每天抓也无妨，重复的由去重层兜住。
  aicpb:
    enabled: true
    rankings:
      # 中国增长率榜 —— 找国产新势力，最该看的一个
      - "china-ai-growth-rate-ranking"
      # 中国总榜 —— 看存量格局
      - "china-ai-rankings"
      # 全球增长率榜 —— 和中国榜对照着看
      - "ai-global-growth-rate-ranking"
      # 全球 APP 增速榜 —— iOS / 海外 Google Play / 国内安卓的月活与环比。
      # 图中 WorkBuddy、Dootchi、Viggle 等就在这个专页，不在上面的网页榜里。
      - "ai-global-growth-rate-ranking/apps"
      # vibe coding 细分榜 —— 存量头部（Lovable、Bolt 等）走这里进来，
      # 它们已过高增长期，全球增长率榜捞不到。榜单月度更新，重复由去重层兜住。
      - "vibe-coding-rankings"
      # AI Agent 细分榜 —— 存量头部 Agent 产品（Manus、Cursor 类）走这里进来。
      - "ai-agent-rankings"
      # 还有二十多个细分榜可加，比如：
      #   ai-search-rankings
      #   ai-video-generators-rankings / ai-ppt-rankings

  # ---- 以下暂未启用 ----

  reddit:
    enabled: false
    note: "免登录 JSON 接口已被封，需要注册 OAuth app 才能接。等有明确需要再做。"

  ycombinator:
    enabled: false
    note: "公司目录是动态加载页，抓取脆弱且一年只更新两批。优先级低。"
