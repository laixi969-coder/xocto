[project]
name = "xocto"
version = "0.1.0"
description = "全球 AI 应用雷达：每日采集 + 商业分析"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    # 生成静态站用。模板引擎和 Markdown 渲染标准库确实没有，
    # 手写这两样出错概率远高于引入成熟库。
    "jinja2>=3.1",
    "mistune>=3.0",
]

[project.scripts]
xocto = "xocto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xocto"]
