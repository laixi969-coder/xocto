name: 每日采集

# 每天北京时间 06:17 跑一次；brief 会在没有新候选时幂等跳过。
# 时间点是倒推出来的：读者要在早上 7 点看到写好的简报，所以采集、判断、建站
# 都在同一个工作流里连续完成；不能依赖某台电脑或另一条人工触发的任务。
# 不放在整点：GitHub 官方明确说整点负载最高，定时容易迟到甚至被丢弃。
# 代价说清楚：6:17 对应美西前一天下午，Product Hunt 当天的榜单
# 还差几个小时才收摊，票数比原来 9 点那版更"生"一点。
on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      revise_daily_brief:
        description: "增补当天候选并重写日报（保留既有观察）"
        required: false
        default: false
        type: boolean
      retry_date:
        description: "重跑指定北京日期的判断（YYYY-MM-DD；不重新采集）"
        required: false
        default: ""
        type: string

# 需要写权限才能把采集结果提交回仓库
permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 全量候选按批完成双语 `/req`；候选多的日子（200+ 条）解释、完整判断、
    # 市场核验和建站加起来可能接近三小时，超时太短会把当天的判断砍半。
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen

      - name: 采集
        run: |
          if [ -n "${{ inputs.retry_date }}" ]; then
            echo "重跑指定日期的判断，不重新采集"
          else
            uv run xocto collect
          fi
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          # Actions 内置的短期 token 提升 GitHub 搜索限额，让关键词、专题、发布方
          # 和 Release 能同时跑完；它只在本次 runner 内可见。
          GITHUB_TOKEN: ${{ github.token }}

      - name: 清掉过老的原始存档
        run: |
          if [ -z "${{ inputs.retry_date }}" ]; then
            uv run xocto prune --keep-days 30
          fi

      - name: 看看现状
        run: uv run xocto status

      # 首页的“是否已有初判”不能依赖一次模型请求成功。先把公开证据能支持
      # 的已知与未知写入；后面的编辑层只负责将它升级为更具体的判断。
      - name: 写入基础 /req 初判
        run: |
          if [ -n "${{ inputs.retry_date }}" ]; then
            uv run xocto seed-req --date "${{ inputs.retry_date }}"
          else
            uv run xocto seed-req
          fi

      - name: 提交并推送
        run: |
          git config user.name  "x-octo bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 没有变化就什么都不做，避免刷一堆空提交
          if git diff --staged --quiet; then
            echo "今天没有新东西，跳过提交"
            exit 0
          fi
          # 按北京日期写，跟存档文件名对齐 —— 这一跑在 UTC 上是前一天。
          git commit -m "chore: 每日采集 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          # 判断层兜底采集可能刚好也在推。先尝试直推；远端前进时只在当前
          # 这一个提交上 rebase 后重试，不因为一次竞态丢掉当天结果。
          if ! git push origin HEAD:main; then
            if git pull --rebase origin main; then
              git push origin HEAD:main || echo "::warning::重试推送仍失败，交由下一次运行合并"
            else
              git rebase --abort
              echo "::warning::远端有竞争写入且无法自动合并，放弃本次采集提交（下次采集会重新抓取并去重）"
            fi
          fi

      # 放在采集提交之后：单源失败不能丢掉当天原始存档，但必须让任务变红。
      # 不在编辑前构建英文站：采集原文可以是中文，只有双语编辑完成后才
      # 生成并检查公开页面，避免未翻译的原始字段阻断整条每日流程。
      - name: 检查采集有没有静默变质
        # 单源挂了不能丢掉当天简报和站点。先记红灯，发布完成后再让任务失败。
        # 历史重跑刻意不采集“今天”，因此不能用只检查今天原始存档的健康规则。
        id: health
        continue-on-error: true
        if: ${{ inputs.retry_date == '' }}
        run: uv run xocto health

      # 判断层调用模型 API；密钥只存在于 GitHub Actions Secrets，
      # 不依赖任何人的电脑、Codex 或 Claude Code 登录态。
      - name: 每日判断与双语简报
        id: brief
        continue-on-error: true
        run: |
          run_brief() {
            if [ -n "${{ inputs.retry_date }}" ]; then
              uv run xocto brief --date "${{ inputs.retry_date }}" --force
            elif [ "${{ inputs.revise_daily_brief }}" = "true" ]; then
              uv run xocto brief --force
            else
              uv run xocto brief
            fi
          }
          if ! run_brief; then
            echo "::warning::第一次编辑未完成；保留原始数据并立即完整重试一次。"
            run_brief
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 默认 deepseek-v4-flash；可在 Secrets 中显式覆盖模型名。
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          # 可选备用链。DeepSeek 请求或 JSON 连续失败时依次切换 Gemini、GLM；
          # 设 MODEL_PROVIDER=gemini 或 glm 可临时切换主模型。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}

      - name: 中英文市场核验
        id: market
        continue-on-error: true
        if: ${{ steps.brief.outcome == 'success' }}
        run: |
          if [ -n "${{ inputs.retry_date }}" ]; then
            uv run xocto market --date "${{ inputs.retry_date }}"
          else
            uv run xocto market
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}

      - name: 高价值项目完整 /req 判断
        id: full_req
        continue-on-error: true
        if: ${{ steps.brief.outcome == 'success' }}
        run: |
          if [ -n "${{ inputs.retry_date }}" ]; then
            uv run xocto req --date "${{ inputs.retry_date }}"
          else
            uv run xocto req
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}

      # 模型判断、市场观察和完整 /req 都是已经通过各自结构校验的数据资产。
      # 先单独保存它们，再进入静态站渲染；这样一个页面级门禁失败不会抹掉
      # 前面十分钟已经完成的研究结果，修复后也不必从头调用全部模型。
      - name: 保存判断数据
        if: ${{ always() && steps.brief.outcome == 'success' }}
        run: |
          git add data/pool data/reports data/reviews data/markets data/evidence data/events
          if git diff --staged --quiet; then
            echo "判断数据没有新变化，跳过提交"
          else
            git commit -m "chore: 保存每日判断 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      # 案例管线独立于产品池：采集 Starter Story / TrustMRR，富化后写
      # data/casestudies/。放在建站之前 —— 案例详情页要进当天的静态站。
      # 失败不阻塞日报，下一轮会对未富化的记录自动重试。
      - name: 真实生意案例管线
        id: cases
        continue-on-error: true
        run: uv run xocto cases
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}

      - name: 生成网站（日报结果）
        run: uv run xocto build

      - name: 检查当日交付是否存在
        id: freshness
        continue-on-error: true
        run: |
          target_date="${{ inputs.retry_date }}"
          if [ -z "$target_date" ]; then
            target_date="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          fi
          test -s "data/raw/$target_date.jsonl"
          test -s "data/reports/$target_date.md"
          test -s "data/reports/en/$target_date.md"

      - name: 记录编辑降级
        if: ${{ steps.brief.outcome == 'failure' }}
        run: |
          echo "::warning::模型编辑未完成；已发布基于公开证据的基础 /req 初判，下一次运行会自动重试深化判断。"

      - name: 复算日报发布约束
        # 检查失败也要出站：更新不能停。红灯留到最后，不把大门关上。
        id: design
        continue-on-error: true
        run: python3 scripts/check_design.py

      - name: 提交并推送日报
        if: ${{ always() }}
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "日报没有新变化，跳过提交"
            exit 0
          fi
          # 撞车后遗留的冲突标记绝不能进仓库（曾污染过产品池）。
          if git grep --cached -l "^<<<<<<< HEAD" -- data/ | grep -q .; then
            echo "::error::暂存区存在未解决的冲突标记，拒绝提交"
            git diff --staged --name-only | head -20
            exit 1
          fi
          if [ "${{ steps.brief.outcome }}" = "success" ]; then
            commit_label="每日判断"
          else
            commit_label="每日降级构建"
          fi
          git commit -m "chore: $commit_label $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          if ! git push origin HEAD:main; then
            if git pull --rebase origin main; then
              git push origin HEAD:main || echo "::warning::重试推送仍失败，交由下一次运行合并"
            else
              git rebase --abort
              echo "::warning::远端有竞争写入且无法自动合并，放弃本次提交"
            fi
          fi

      - name: 核验线上中英文交付
        id: deployment
        continue-on-error: true
        if: ${{ steps.freshness.outcome == 'success' }}
        env:
          RETRY_DATE: ${{ inputs.retry_date }}
        run: |
          target_date="$RETRY_DATE"
          if [ -z "$target_date" ]; then
            target_date="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          fi
          python3 scripts/check_deployment.py --date "$target_date"

      # 用户先得到当日站点；采集、判断或页面检查失败仍必须亮红灯。
      - name: 检查判断链是否完整
        if: ${{ always() }}
        run: |
          failed=""
          if [ "${{ steps.health.outcome }}" = "failure" ]; then failed="$failed health"; fi
          if [ "${{ steps.brief.outcome }}" = "failure" ]; then failed="$failed brief"; fi
          if [ "${{ steps.market.outcome }}" = "failure" ]; then failed="$failed market"; fi
          if [ "${{ steps.full_req.outcome }}" = "failure" ]; then failed="$failed full_req"; fi
          if [ "${{ steps.freshness.outcome }}" = "failure" ]; then failed="$failed freshness"; fi
          if [ "${{ steps.design.outcome }}" = "failure" ]; then failed="$failed design"; fi
          if [ "${{ steps.deployment.outcome }}" = "failure" ]; then failed="$failed deployment"; fi
          if [ -n "$failed" ]; then
            echo "以下阶段未完成，但当日站点如有新内容已推送：$failed"
            exit 1
          fi
