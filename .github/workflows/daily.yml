name: 每日采集

# 每天北京时间早上 6:17 跑一次。
# 时间点是倒推出来的：读者要在早上 7 点看到写好的简报，所以采集、判断、建站
# 都在同一个工作流里连续完成；不能依赖某台电脑或另一条人工触发的任务。
# 不放在整点：GitHub 官方明确说整点负载最高，定时容易迟到甚至被丢弃。
# 代价说清楚：6:17 对应美西前一天下午，Product Hunt 当天的榜单
# 还差几个小时才收摊，票数比原来 9 点那版更"生"一点。
on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      revise_daily_brief:
        description: "增补当天候选并重写日报（保留既有观察）"
        required: false
        default: false
        type: boolean

# 需要写权限才能把采集结果提交回仓库
permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen

      - name: 采集
        run: uv run xocto collect
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          # Actions 内置的短期 token 提升 GitHub 搜索限额，让关键词、专题、发布方
          # 和 Release 能同时跑完；它只在本次 runner 内可见。
          GITHUB_TOKEN: ${{ github.token }}

      - name: 清掉过老的原始存档
        run: uv run xocto prune --keep-days 30

      - name: 生成网站（采集结果）
        run: uv run xocto build

      - name: 复算站点约束
        run: python3 scripts/check_design.py

      - name: 看看现状
        run: uv run xocto status

      - name: 提交并推送
        run: |
          git config user.name  "x-octo bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 没有变化就什么都不做，避免刷一堆空提交
          if git diff --staged --quiet; then
            echo "今天没有新东西，跳过提交"
            exit 0
          fi
          # 按北京日期写，跟存档文件名对齐 —— 这一跑在 UTC 上是前一天。
          git commit -m "chore: 每日采集 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          # 判断层兜底采集可能刚好也在推。先尝试直推；远端前进时只在当前
          # 这一个提交上 rebase 后重试，不因为一次竞态丢掉当天结果。
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # 放在采集提交之后：单源失败不能丢掉当天原始存档，但必须让任务变红。
      - name: 检查采集有没有静默变质
        run: uv run xocto health

      # 判断层直接调用 DeepSeek API；密钥只存在于 GitHub Actions Secrets，
      # 不依赖任何人的电脑、Codex 或 Claude Code 登录态。
      - name: DeepSeek 每日判断与双语简报
        run: |
          if [ "${{ inputs.revise_daily_brief }}" = "true" ]; then
            uv run xocto brief --force
          else
            uv run xocto brief
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 可选；默认 deepseek-v4-pro。需要控制成本时在 Secrets 中设为 flash 模型。
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}

      - name: 中英文市场核验
        run: uv run xocto market
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}

      - name: 高价值项目完整 /req 判断
        run: uv run xocto req
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}

      - name: 生成网站（日报结果）
        run: uv run xocto build

      - name: 复算日报发布约束
        run: python3 scripts/check_design.py

      - name: 提交并推送日报
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "日报没有新变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 每日判断 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
