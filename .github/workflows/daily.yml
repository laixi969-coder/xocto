name: 每日采集

# 每天北京时间早上 6 点跑一次。
# 时间点是倒推出来的：读者要在早上 7 点看到写好的简报，而写简报的那一步
# （云端 Claude 的 routine，见 README「每天怎么自动更新」）在 7 点整触发，
# 所以采集必须赶在它前面落地，留一小时余量给 GitHub 的排队延迟。
# 代价说清楚：6 点对应美西前一天下午 3 点，Product Hunt 当天的榜单
# 还差几个小时才收摊，票数比原来 9 点那版更"生"一点。
on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 次日北京时间 06:00
  workflow_dispatch:       # 也可以随时手动点一下

# 需要写权限才能把采集结果提交回仓库
permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖
        run: uv sync --frozen

      - name: 采集
        run: uv run xocto collect

      - name: 清掉过老的原始存档
        run: uv run xocto prune --keep-days 30

      - name: 生成网站
        run: uv run xocto build

      - name: 看看现状
        run: uv run xocto status

      - name: 提交并推送
        run: |
          git config user.name  "x-octo bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 没有变化就什么都不做，避免刷一堆空提交
          if git diff --staged --quiet; then
            echo "今天没有新东西，跳过提交"
            exit 0
          fi
          # 按北京日期写，跟存档文件名对齐 —— 这一跑在 UTC 上是前一天。
          git commit -m "chore: 每日采集 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push

      # 刻意放在提交推送之后。
      # 采集层单源失败不中断，好处是当天照样有产出，代价是没人会被通知 ——
      # 源站改版、加反爬、换域名这三种都表现为"安静地返回 0 条"，
      # 站点每天照常更新，不查就永远发现不了。
      # 放在最后是因为它会让 job 变红：要是放在提交之前，
      # 一变红当天的原始存档就推不上去，而那是唯一不能丢的东西。
      - name: 检查采集有没有静默变质
        run: uv run xocto health
