  fact: "三折叠，走向日常。 \n \n  作者｜张勇毅  \n  编辑｜靖宇  \n \n 华为 Mate XT2  非凡大师，作为一款放在当下仍然算是顶级旗舰的三折叠，我用了几天之后，我最强的感受是：没什么特别强的感受。\
    \ \n 但这其实并不是在说 HUAWEI Mate XT 2 非凡大师「平庸」。恰恰相反：两年前我第一次体验到初代 Mate XT 的时候，围过来的人会想上手摸一摸、想看它怎么折；这一次没有。它就是一台手机，只是能展开成一块\
    \ 10.2 英寸的屏。 \n 对一台两万块的三折叠来说，今天的不惊讶，反而成了一个反常的事。 \n \n HUAWEI Mate XT 2 非凡大师展开态｜图片来源：极客公园 \n 我的判断是，这个形态已经开始逐渐成熟了，就像当初普通的折叠屏手机也经历过这样一个过程一样。\
    \ \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n   从奇观，到日常   \n \n 成熟这个词在硬件上有很具体的含义：它不是指发明了什么新东西，而是指过去那些必须忍受的妥协，随着技术的演进与迭代与时间的推移，被一个一个消解掉。\
    \ \n 对于仍然处于发展早期的三折叠手机，这两年消掉的妥协可以列一张清单。但这一代有意思的地方在于，清单上最要紧的几项不是一项项修出来的，是换了一种折法，一次全消掉。 \n 前两代 Mate XT\
    \ 用的是 Z 字折：三段屏一内一外，像把一张纸折成 Z。这个折法有一个绕不开的前提，折起来之后，柔性屏必须有一段露在外面充当外屏。 \n 三折叠早期的大部分妥协，都是从这一个前提派生出来的。 \n\
    \ 最早，柔性屏得能往两个方向弯，材料难度比书本式折叠高一档，这是第一代最硬的技术攻关。露在外面的那一段柔性屏没法上玻璃盖板，怕刮，折痕也在外面。折起来的时候中间那一段前后都被盖住，相机模组只能放在两端的一段上，展开之后就偏在一侧，握着一边轻一边重。\
    \ \n 这一代换成了展翼，也有人叫它 G 型或 U 型：两翼向内合拢，把柔性屏整个包在里面。 \n 现在，柔性屏只需要单向内折，它和我们最常见的普通折叠屏手机用的是同一类技术。折起来之后露在外面的只有背板和一块独立的外屏，这块外屏第一次可以用玻璃盖板，也就是玄武昆仑玻璃，6.5\
    \ 英寸、屏占比 92.8%，比上一代那段 6.4 英寸的柔性屏高了六个多点，合上之后终于像一台正常的直板机。相机模组回到了机身中间，爱范儿在首发上手里专门写"
