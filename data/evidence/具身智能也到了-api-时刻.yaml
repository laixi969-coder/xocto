  fact: 具身智能的 API 时刻意味着部分具身模型已经开始具备跨本体迁移、在一定范围内适应新任务的能力。 作者｜Li Yuan 编辑｜郑玄 具身智能，也到了 API 时刻？ 过去，想知道一个具身模型有多强，往往要看它在发布视频里完成了什么任务。不过，这条线正在松动。
    就在近期，一些公司开始把另一种检验方式交到开发者手里：接上你自己的机器人，试着把你的任务做出来。 10 月，Physical Intelligence（PI）开放了模型 API 测试。开发者可以上传自己的机器人数据，在平台上微调模型，再通过云端推理驱动机器人。PI
    表示，一家公司，用这套服务迭代了四天，让双臂机器人开始为自身的零部件去毛刺。 同月，Dream Labs 推出 Dream API，将机器人模型推理按作业时长计费，并提供面向开发者数据的模型微调服务。让机器人调用云端模型，正在成为一种可以试用、适配和购买的服务。
    国内，11 月 3 日，原力灵机升级了 Dexmal MaaS，将重点放在模型进入具体场景所需的后训练上：开发者可以在同一平台完成数据上传、模型训练和部署，再根据真机执行中的失败继续改进。 这些动作让具身智能行业出现了一个值得关注的变化。过去，我们常常听到一些公司宣称自己在某个场景正在寻求落地突破。而现在，模型公司开始尝试把自己积累的能力，交给不同硬件、不同任务背后的开发者使用。具身模型的竞争，也由此延伸到一个更实际的问题：别人能不能拿它做成应用？
    这一步比语言模型开放 API 要重得多。机器人需要适配自己的身体，理解现场的物体和流程，还要在执行出错时把任务接着做下去。把模型交到外部开发者手里，就意味着让它走出熟悉的实验环境，接受不同本体和真实任务的检验。这需要模型能力作为底气，也需要公司有信心把尚未解决的问题暴露出来，在使用中继续改进。
    未来具身智能的形态，或许就会在这些尝试中逐渐清晰。 01 为什么是现在？ 本体厂商提供身体、模型公司提供基础能力，开发者围绕场景构建应用，是行业早已讨论过的一种分工。不过在过往，借助通用模型构建具身应用，仍然往往是一个愿景。
    如今，几家公司相继开放 API，开始把这种设想变成开发者可以上手的服务。为什么是现在？ 或许有几点原因。 首先，一部分具身模型开始具备跨本体迁移、在一定范围内适应新任务的能力。 过去，教机器人完成一个新任务，往往意味着围绕特定硬件开发
