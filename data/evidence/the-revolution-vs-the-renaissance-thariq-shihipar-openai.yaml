  fact: AI can make software cheap enough to produce by the thousand and still give you more time to make
    one thing feel right. At AI Engineer CODE, Thariq Shihipar shows how those two futures can coexist.
    In his fighting game, he edits the size of a rock in the /human folder and immediately tries the throw.
    He also built a Mac Dock that switched modes, used it, and realized he cared more about noticing when
    he got distracted. We get into what Thariq changed his mind about with coding agents, how a decision
    model can choose from actions a designer defines, and who gets to decide which experiments deserve
    the compute. Thariq announced his move to OpenAI after we recorded. Sponsored by Jira by Atlassian.
