    \ SaaS 网页版——用户线上注册、在线订阅、自动扣费、支持子账"
- id: ev-3cdb7668bd828e89
  project_slug: svgstat
  url: https://www.v2ex.com/t/1242538
  title: 杀死那个“自嗨”的工匠
  published_at: '2026-09-16T14:14:24Z'
  collected_at: '2026-09-17T00:32:38Z'
  source_kind: product
  tier: independent
  fact: "昨天，表弟给我发消息，说他最近折腾闲鱼业务跑通了。\r\n\r\n但有个麻烦。\r\n\r\n他每天得不停地刷闲鱼，盯着那几类商品，有合适的就赶紧下单。时间久了，人有点扛不住。\r\n\r\
    \n他问我：“哥哥，能不能用 AI 快速搞个软件，帮我把这件事自动化？”\r\n\r\n我第一反应是，可以。\r\n\r\n现在 AI 写代码很快。如果事情不复杂，花不了多少时间，顺手帮他弄一下也没什么。\r\
    \n\r\n晚上，我开始研究。\r\n\r\n抓取商品，分析，监控。\r\n\r\n弄着弄着，验证码弹出来了。\r\n\r\n要处理反爬，接着还有下单。\r\n\r\n再一看时间，凌晨两点。\r\n\
    \r\n我合上电脑，去睡了。\r\n\r\n躺下以后，脑子却没有停。\r\n\r\n数据怎么抓，验证码怎么处理，监控多久跑一次，下单做到哪一步……\r\n\r\n这是干了十几年技术留下来的习惯。\r\
    \n\r\n看到一个问题，就忍不住往下拆。\r\n\r\n拆着拆着，问题就变成了方案。\r\n\r\n方案再往下拆，就变成了代码。\r\n\r\n这种感觉我太熟了。\r\n\r\n我也知道，只要继续花时间，这个东西大概率真能做出来。\r\
    \n\r\n可不知道为什么，昨晚我突然不太想继续了。\r\n\r\n我想起了前几天刚刚结束的那场合作。\r\n\r\n---\r\n\r\n方斌当时说我“太固执”的时候，我其实是不服的。\r\n\r\
    \n我在这行干了十几年，他以前做房产销售。\r\n\r\n软件应该怎么做，架构应该怎么搭，一个系统为什么不能今天提需求、明天就零报错，这些事情我觉得自己当然比他懂。\r\n\r\n直到现在，这一点我也没觉得自己判断错了。\r\
    \n\r\n甚至知道他们去武汉找了另一家技术团队以后，我心里还有过一个很确定的念头：\r\n\r\n系统全在我脑子里，他们接不走。\r\n\r\n这句话我没有说出来。\r\n\r\n但当时确实这么想过。\r\
    \n\r\n现在再回头看，我发现自己当时最在意的，还是这个东西到底做得够不够好。\r\n\r\n至于它最后怎么卖、谁来卖，我想得少得多。\r\n\r\n---\r\n\r\n这些年，我一直很在意把东西做好。\r\
    \n\r\n不是“能用”就行，而是最好从底层就是对的。\r\n\r\n能自己做的，坚决不用现成的。\r\n\r\n做这套跨境上架系统也是一样。\r\n\r\n卖家看到的，无非是把 1688 的商品采集下来，处理图片和商品信息，再发布到\
    \ Ozon 、Wildberries 。\r\n\r\n但到了我这里，很快就会想到多租户、负载、数据边界这些东西。  \r\n\r\n商品事实和渠道草稿要分层，原始数据不能被平台字段污染；不同数据库要有对应的\
    \ Schem"
