  fact: 本文首发于 Founder Park 公众号 · 2022 年 12 月 2 日   和家用清洁机器人不同，商用清洁赛道是一个尚待爆发的赛道，随着老龄化带来的服务业从业人数下降，以及商用场景对于清洁的高要求，对于清洁机器人的需求只会急剧增加。    在麦岩智能的创始人
    & CEO 李宇浩看来，商用清洁机器人和家用的发展差距，主要原因在于 「一定会先从简单场景或是一些对技术要求没那么高的场景开始做商业化。所有技术基本上都是这么来的，因为技术本身迭代需要时间。」 现在技术已经成熟，需求也有了，剩下的就是「满足市场、喂养市场」了。    尤其不同的是，麦岩智能的产品是面向高端商务场景，为此他们在产品里甚至使用了主动降噪功能，高端商务场景对于清洁机器人的需求到底是怎样的？清洁机器人是彻底不需要人类了吗？以及，商务清洁机器人的市场何时才会爆发？关于这些问题，我们也和李宇浩进行了探讨。                   现实情况下人口红利确实没有了，而且也不能让老人一直干下去，服务行业劳动力短缺非常严重。    在历史上，无论是汽车代替马车，还是织布机代替纺织工人，或是农业机械代替了农民，每次科技变革都会存在争议，但没有一次例外，都是让大家的生活变得更好。    某种意义上，一定会先从简单场景或是一些对技术要求没那么高的场景开始做商业化。所有技术基本上都是这么来的，因为技术本身迭代需要时间。    我们现在是什么状态？整个行业加起来都满足不了需求的
    1%。在这种情况下，谈（竞争）这件事过于早了。    只有年出货量达到 10 万以上，才能满足客户的相当一部分需求。如果在百万量台级的市场去考虑，起码一年要 10 万台才能撬动市场。                    01           商用清洁机器人         是即将爆发的新赛道       Founder
