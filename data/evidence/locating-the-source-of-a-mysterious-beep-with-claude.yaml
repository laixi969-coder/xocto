  fact: 'Our house has a box room, full of boxes that we still haven''t unpacked from our last move. A
    couple of weeks ago something in that room started intermittently beeping . The beeps were far enough
    apart that standing in the room and trying to determine the source of the noise was frustrating, and
    I really didn''t want to dig through every one of those boxes. So I had Claude Code build Beep Locator
    , a software system for triangulating the source of a mysterious beep using multiple devices scattered
    around the room. Here''s what Beep Locator looks like after it has been running for a while: You run
    Python web server to show the primary UI, and then use the QR code or URL to connect as many devices
    as you can spare to act as listeners - I was using two iPads, a phone, a MacBook Pro and a Surface
    Ultra. The devices then play noises to each other to help estimate their locations. This didn''t work
    particularly well, so I added a "Rough mode" where you can drag their icons around in the space to'
