  fact: 'By Daniel Kjellén A first venture usually follows a well-worn playbook: a gap in the market,
    obsessive refinement of concept and pitch, eventual conviction that the solution is as bulletproof
    as it is revolutionary. Then, the dreaded phase of product-market fit. Instead of building the future
    of an entire industry, you find yourself forced to focus on a narrow use case and spend the first
    invaluable years proving that your idea can make money and scale. The grand vision gets put on pause.
    For most founders, this journey is the only one available. After all, investors are betting on someone
    who has never built a company before, so a small check and a narrow product limit what everyone stands
    to lose. But some ambitions need total commitment from the start, and having built a company before
    helps when taking them on. Lessons from the front line Daniel Kjellén, CEO and co-founder of Freda.
