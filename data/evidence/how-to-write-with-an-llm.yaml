  fact: "How To Write With An LLM   \nThomas Ptacek on using LLMs as copyeditors, not as writing assistants:\
    \ \n \n  Rule Number One: You may not use a single word an LLM suggests to you.  \n [...] I think\
    \ that as a form of intellectual personal protective equipment you should adopt the rule that any\
    \ specific turn of phrase an LLM suggests is off limits. Be strict about the rule! \n \n I won't let\
    \ LLMs write content for my blog, but I use them for fact-checking, spelling and grammar and as an\
    \ occasional thesaurus (see  my proofreading prompt ). \n The rule to never use a turn of phrase suggested\
    \ by an LLM feels good to me. The text has that weird smell to it, and it's also a good principle\
    \ to help stay disciplined. \n Later in this piece Thomas shows a screenshot of his personal LLM copyediting\
    \ tool (see also  this Twitter thread ), and provides a prompt to help kickstart building your own.\n\
    \n\n     Tags:  thomas-ptacek ,  writing ,  ai ,  generative-ai ,  llms"
