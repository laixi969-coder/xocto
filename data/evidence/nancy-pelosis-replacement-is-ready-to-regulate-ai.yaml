  fact: As a California state senator, Scott Wiener authored legislation aimed at curbing the risks of
    advanced AI. Now, after winning a tight congressional race for former Speaker of the House Nancy Pelosi’s
    open San Francisco seat, he could play a key role in setting federal AI policy. I spoke with Wiener
    on Friday, only a few hours after he had been declared the victor. But he was already thinking about
    AI risk. The previous day, the AI nonprofit METR had released a report that had been widely interpreted
    as evidence that Anthropic had achieved recursive self-improvement, a phenomenon in which AI meaningfully
    contributes to its own advancement and AI progress potentially spins out of control. “It’s very concerning,”
    Wiener said, citing the report as evidence that we are quickly running out of time to regulate AI.
    “It was my hope that Congress would take decisive action before [the end of] this year,” he said.
    “That does not appear to be happening.” Wiener has been increasingly focused on AI
