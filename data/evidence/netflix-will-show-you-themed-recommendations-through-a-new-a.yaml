  fact: Netflix's TV app is getting a new "AI Discover" tab where the company will show experimental,
    AI-powered features to help you find new shows and movies to watch. The first of these experiments
    surfaces content based around themes, like "Something Light," "Family Movie Night," or "Quick Watches."
    When you pick a theme, Netflix will show you recommendations that match it. If you don't like a recommendation,
    you can tell that to Netflix, and the app will remember it. The company says that AI Discover is powered
    by "a new intelligence layer we've been building that responds to what members tell us in real time
