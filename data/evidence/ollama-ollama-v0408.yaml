    \ /></p>\r\n\r\n## Recursive Flint\r\n\r\n[Flint](https://ollama.com/library/flint) brings Recursive's\
    \ coding model to Ollama. It is designed for the work coding agents do across a repository: understanding\
    \ unfamiliar code, tracing bugs, implementing features, and adding tests. Reasoning, multi-turn tool\
    \ use, and a 262K-token context window support longer tasks across files and tool interactions.\r\n\
    \r\nFlint is an Apache 2.0-licensed, 40B-parameter mixture-of-experts model with approximately 2.5B\
    \ parameters active per token. In its [release evaluations](https://huggingface.co/RecursiveSI/flint#evaluation),\
    \ Recursive reports 54.9% on Terminal-Bench 2.1 and 74.2% on SWE-bench Verified.\r\n\r\n```sh\r\n\
    ollama run flint\r\n```\r\n\r\n\r\nNote: Flint is supported on MacOS.  Other GPU support will be enabled\
