  fact: 'By Anurag Gurtu When a company delays its IPO to show investors better numbers, that’s a strategy.
    When the NYC pension fund publicly asks you to delay it over AI safety concerns, your chief rival’s
    CEO calls his own IPO “ill-advised” and postpones it until at least next year, tech stocks are sliding
    on open-weight model fears, and your own prospectus warns of “existential risks to humanity” from
    the product you’re selling, that’s not a strategy. That’s a market sending you a message. Anthropic
    ‘s numbers are extraordinary. Its third-quarter 2026 revenue was reportedly $16.8 billion — up 45%
    quarter on quarter. That means the company’s annualized revenue run rate is roughly $67 billion. What
    the S-1 actually says Anurag Gurtu, co-founder and CEO of Airrived. Here are the numbers from Anthropic’s
    leaked prospectus : $4.6 billion: Anthropic’s full-year 2025 revenue. $7.33 billion : What Anthropic
    spent on compute and infrastructure in 2025 alone — more than its total revenue. $42 billion'
