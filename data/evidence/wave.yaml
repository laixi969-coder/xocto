  fact: Governments need modern solutions to serve the public while keeping sensitive information under
    their control. Open models provide a path forward, letting governments evaluate them, adapt them to
    local languages and public services, run them on infrastructure they control, apply their own safeguards
    and keep sensitive data within controlled environments. Some open models go further, with the datasets
    they were trained on published so governments can verify if training data was licensed, biased or
    compliant. NVIDIA partners and European governments are teaming to bring advanced models to boost
    the efficiency of public administration while retaining control of data and infrastructure. Several
    are also building editions of the NVIDIA Nemotron-Personas collection , the partner-grounded datasets
    behind NeMo User Sim , NVIDIA’s open source library for population-scale user simulation that dynamically
    evaluates and trains models and agents in local languages. Read All NVIDIA in Europe Announc
