  fact: "OpenAI 首席执行官：今年不会上市，不能冒哪怕 10% 杀死所有人的风险 \n OpenAI 首席执行官 Sam Altman 在接受采访时表示，这家人工智能公司专注于解决围绕 AI\
    \ 技术的安全担忧，今年不会上市。 \n Altman 表示，今年进行首次公开募股「时机不合适」，公司要到明年才会上市。 \n 「我认为，哪怕冒着 10% 的在本十年结束前杀死所有人的风险，都是不可接受的，」Altman\
    \ 说，「我认为，我们正在进入一个新时代，就像过去迈入其他时代时一样，我们需要采取不同的行动，确保我们所做的事情能够让这一理念造福全人类，同时也要确保没有任何人承担哪怕接近这种程度的风险。」（来源：环球市场播报）\
    \ \n   \n 苹果 iPhone 18 Pro 与 Pro Max 正式开启全球预购 \n 在秋季新品发布会落幕数日之后，苹果公司新一代直板旗舰手机 iPhone 18 Pro 与 iPhone\
    \ 18 Pro Max 于 9 月 12 日正式在全球数十个国家和地区同步开启预订。 \n   \n 作为今年苹果直板机型中的绝对顶配主力，两款新机携台积电首发 2 纳米制程打造的 A20 Pro\
    \ 芯片、机械可变光圈相机模组以及全面重构的端侧人工智能体验登场，首批预订订单预计将于 9 月 18 日星期五起正式发货交付并同步开启线下零售。 \n 从预购初期的渠道反馈与出货排期来看，尽管面临着起售价的上调，核心科技极客与高端存量用户对\
    \ 2 纳米先进制程算力与专业影像升级的追逐依然狂热，多款热门大容量配色版本的预计送达时间在短短几十分钟内便已顺延数周，预示着该系列在高端市场的强劲吸金势头。（来源：IT 之家） \n   \n\
    \ 上市 4 分钟锁单破万台！小米澎程今天全国交付：网友最关心的不是车，是雷总去哪开门 \n 9 月 12 日，小米澎程系列正式在全国开启交付，首批交付服务直接覆盖全国 75 座城市（据官方数据，澎程系列上市后\
    \ 4 分钟锁单突破 10000 台。），绝大多数预定用户在家附近就能完成全部提车流程，不用特意跨城跑特定交付点。 \n 不少网友这段时间都抱着强烈的好奇心，猜测小米创始人雷军这次会现身哪座城市的交付现场，亲手为首批提车的澎程车主打开车门，复刻此前小米汽车交付的经典名场面。\
    \ \n 网友的这份期待完全有充足的来由。时间回溯到 2024 年 4 月 3 日，小米 SU7 的首批交付仪式"
