  fact: 'Nvidia has defended a coalition created to develop and share tools for AI safety and cyber defence
    and avoid a repeat of the OpenAI Hugging Face hack, when questioned that participants would sidestep
    it in an AI land grab. The US chip powerhouse announced the creation of the Open Secure Al Alliance,
    whose members include leading European tech companies Mistral, Hugging Face, and UiPath, in July this
    year, just days after the Hugging Face incident. The coalition is designed to develop and share tools
    for AI safety and cybersecurity. Other members include Microsoft, Adobe and Dell but not Google, Anthropic,
    Meta and OpenAI, according to the alliance website. Mark Weatherford, head of cybersecurity policy,
    Nvidia, described the genesis of the alliance. He said: “There are a lot of conversations going on
