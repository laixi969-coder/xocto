  fact: Venture funding into fintech startups slid 21.4% year over year in the third quarter of 2026,
    while deal count fell nearly 31%, Crunchbase data shows, pointing to a narrower funding market with
    fewer rounds and continued reliance on large transactions. All told, fintech startups raised $10.6
    billion globally in the third quarter of 2026, down 28.4% from $14.9 billion in Q2 2026 and 21.4%
    from $13.5 billion in Q3 2025. The pullback comes as investors draw sharper distinctions between companies
    attracting capital and those struggling to raise, according to QED Investors partner Laura Bock .
    “The market remains bifurcated — AI vs. not and market leaders vs. not,” she said. Forerunner founder
    Kirsten Green similarly described capital concentrating in fewer, larger rounds, with infrastructure,
    payments and stablecoin rails attracting investor interest, supported by greater regulatory clarity.
    Deal count drops Notably, deal count in Q3 was the lowest in the quarters covered by our analysis,
