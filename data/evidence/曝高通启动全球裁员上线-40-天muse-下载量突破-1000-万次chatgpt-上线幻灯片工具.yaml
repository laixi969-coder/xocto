  fact: DeepSeek 开源大规模云服务推理框架 10 月 20 日下午，DeepSeek 宣布，在此前开源一系列大模型、TileLang 编译工具及推理算子库的基础上，决定进一步将内部推理框架
    DeepInfer 全面开源。 DeepSeek 称，基于 DeepInfer，已实现 DeepSeek V4.1 Flash 高吞吐、低延迟的大规模推理服务。未来，DeepSeek 新模型的推理代码及后续优化也将在此持续更新。
    券有商分析师认为，开源模型与 Agent 工具链的持续完善，有望降低应用开发成本，推动 AICoding 向游戏开发、3D 内容制作、企业软件及自动化工作流等场景扩展，具备开发者入口和应用生态的平台有望优先受益。（来源：证券时报）
    上线 40 天，Muse 下载量突破 1000 万 市场情报机构 Sensor Tower 的最新数据显示，Meta 的人工智能助手 Muse 自 9 月推出以来，累计下载量达 1090 万次，其中美国地区下载量为
    1020 万次。 迄今为止仅有另外 11 款应用达成过这一上线后的里程碑，上一款实现该成绩的正是 Meta 的 Threads，时间为 2023 年 7 月。 另据数据显示，Muse 的用户留存表现优于
    ChatGPT、Claude、Grok 等 AI 竞品。（来源：IT之家） 华为引望、宁德时代合作换电车型拟 2027 年上市 10 月 20 日，媒体报道称华为引望与宁德时代、时代电服合作正推进首批车型的开发，涉及五款新车，计划
    2027 年上市。有报道表示，首款采用巧克力换电的车型为东风与华为合作的奕境品牌旗下产品。 引望成立于 2024 年，承接华为原智能汽车解决方案业务，向车企提供智能驾驶、智能座舱、车控等系统及部件。
    而宁德时代正在通过技术合作、股权投资等方式扩大换电业务规模。赛豆科技旗下 AIVA 品牌首款量产车 AIVA ME7 将采用换电模式，宁德时代提供电池技术及充换电体系支持，具体方案还在规划中。（来源：晚点
    Auto、财联社） 曝高通将启动全球裁员 据路透社报道，高通 CEO 克里斯蒂亚诺·安蒙近期在一份内部备忘录中告知员工，公司将在年度员工评估后，开展以绩效为重点的全球裁员，相关通知将于 11 月开始发出。
    安蒙表示，此举旨在建立更强的绩效文化，并解决公司持续未能达到预期的情况。备忘录未披露
