  title: 1 分钟售罄、发货排到明年，iPhone Duo 卖爆背后的真相
  published_at: '2026-10-17T02:46:16Z'
  collected_at: '2026-10-18T00:04:10Z'
  source_kind: market_signal
  tier: independent
  fact: 人们已经很多年没见过，苹果的新品被这样抢了。 10 月 16 日晚 8 点，苹果首款折叠屏 iPhone Duo 开启预购。社交媒体上流传的说法是， 开售 1 分钟，全型号库存就空了，京东、天猫页面相继显示售罄
    。 大约 40 分钟后， 苹果官网的预计送达时间已经跳到了 2027 年 1 月底 。 几个小时后，大洋彼岸的美国东部时间上午 8 点，同样的剧情再演一遍。分析师 Max Weinbach 在 X
    上说，纽约及周边、康涅狄格州的门店大约 3 分钟就被抢光。半小时内，美国所有配置的交付日期都变成了 1 月 25 日。eBay 上，一台 2TB 版的预购机挂出了 5000 美元的成交价，比官方价格高出
    1800 美元。 这不是中国市场独有的狂热，而是一场苹果新品全球同步的抢购。 iPhone Duo 卖爆的背后，真的是产品太牛，创新性十足，还是产能不足逼出的热卖？ 「秒罄」这两个字，其实藏着两个完全不同的故事。一个关于需求，一个关于产能。
    太整齐的交付日期 先看一个容易被忽略的细节。 iPhone Duo 这次在美国、中国、英国、德国、日本、印度等约 70 个国家和地区同步开启预购 。开售之后，美国和英国最早的交付日期都是 1 月
    25 日，国行显示的是 1 月底。 市场规模、消费习惯、竞争格局完全不同的几个国家，交付日期却几乎对齐。 这更像是苹果在全球范围内按配额统一分货的结果，而不是各地需求恰好一样旺。 换句话说，首批能放出来的货就那么多，分到每个市场的量都不大，哪里都是几分钟被抢完。
    这一点从黄牛市场也能看出来。 国内顶配机型的加价被报到 7000 元以上，甚至有说法称破万 ；美国 1TB 和 2TB 两个版本的转售价都比官方价格高出约 1800 美元。以 2TB 版来算，美国的溢价幅度大约是五成多，和国内的情况相差无几。
    两边的「热度」高度相似，恰恰说明真正决定热度上限的，是供给。 让人遗憾的产能 如果把时间拨回到一个多月前，iPhone Duo 的产能问题其实早有端倪。 日经亚洲 8 月底的报道称， 苹果当时每天只能生产「几百台」iPhone
    Duo ，远远低于一款常规 iPhone 新品的爬坡节奏。9 月中旬，界面新闻援引供应链消息称，富士康的组装良率只比 60% 高一点，要提升到成熟水平，可能还需要半年到一年。 问题的核心，在那枚特殊设计的铰链上。
