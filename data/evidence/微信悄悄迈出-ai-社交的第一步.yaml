  fact: "头图来源：视觉中国、ChatGPT 生成 \n   \n 最近，微信开始小范围测试一项新的「小微 AI 社交」功能。 \n 用户如果想联系一位朋友，可以先把诉求告诉自己的「小微」。小微找到对方的小微后，会说明此次沟通的话题，并向对方本人请求授权。获得同意后，两个小微先行交流；遇到需要用户作出选择或者确认的地方，再分别回来提醒各自的主人。\
    \ \n 这和「帮我给某某发一条微信」并不相同。 \n 代发消息仍然由用户决定说什么，AI 只是代替用户点击发送。小微 AI 社交中，用户交给 AI 的是一个目的。如何发起询问、交换哪些信息、怎样归纳分歧，部分沟通过程已经交给两个\
    \ AI 完成。 \n 据极客公园实测，两个小微之间的交流不会出现在双方原有的微信聊天框中，而是留在小微内部的独立空间。AI 没有直接进入私人对话，而是在两名用户之间建立了一条代理通道。 \n 不过，小微目前仍处于小范围测试阶段，相关功能尚未全面开放。从产品完成度看，这还是一次早期实验。但它触及的问题是，当\
    \ AI 能够代表这个人与另一个人的 AI 沟通，社交平台连接的对象就开始从「人和人」扩展为「人的代理与人的代理」。 \n 对于微信而言，这是一条最有优势、也最不能冒进的 AI 路线。 \n 熟人关系链，是微信做\
    \ Agent 最现实的入口 \n 过去，AI 进入社交产品，主要承担内容辅助的角色：生成文案、润色回复或者总结聊天记录。AI 可以帮助用户说话，但很少真正参与人与人之间的沟通。 \n 今年以来，个人\
    \ Agent 以及 Agent 之间相互交流的产品实验开始增多。 \n OpenClaw 让更多用户看到，AI 可以连接工具、持续运行并代表用户执行任务；Elys、Second Me 等产品则尝试用用户的经历、兴趣和表达习惯训练数字分身，让\
    \ AI 帮助筛选信息、寻找对象并完成初步互动。 \n 不过，让 AI 代表用户社交，首先要解决身份和关系从哪里来的问题。 \n 对于一个新平台而言，用户不仅要重新建立关系，还要提供足够多的个人信息，并相信\
    \ AI 能够准确表达自己的想法。即使两个 Agent 产生了大量互动，也不能保证这种互动最终会变成两个真人之间的关系。AI 分身可以被快速生成，真实的信任却很难从零开始。 \n 微信不需要解决这一层冷启动。\
    \ \n 截至 2026 年第二季度，微信及 WeChat 合并月活跃账户数达到 14.39 亿。用户的"
