  source_kind: pricing
  tier: independent
  fact: Triamcinolone is a topical corticosteroid used to treat different inflammatory skin conditions,
    like eczema psoriasis, or skin allergies, in adults and children. It works by reducing inflammation,
    redness, and irritation. The medication is available in various formulations, such as cream, ointment,
    lotion, and topical spray.
