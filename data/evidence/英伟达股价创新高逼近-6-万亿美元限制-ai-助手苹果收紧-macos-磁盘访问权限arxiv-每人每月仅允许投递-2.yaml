  fact: "英伟达股价创新高，逼近 6 万亿美元 \n 英伟达股价自 5 月以来首次创下历史新高，在两个月的抛售导致市值蒸发逾 1 万亿美元后，投资者重新涌入该股。这家全球市值最高的上市公司股价周五上涨\
    \ 2.9%，较 7 月底低点累计反弹近 25%。 \n 英伟达股价今年迄今上涨约 27%，有望连续第四年实现两位数涨幅。目前公司市值约为 5.7 万亿美元，距离成为历史上首家市值达到 6 万亿美元的公司不到\
    \ 3000 亿美元。（来源：环球市场播报） \n   \n 腾讯 WorkBuddy 内置模型独家支持 Space Bunny \n 10 月 2 日消息，腾讯 WorkBuddy 宣布内置模型独家支持\
    \ Space Bunny。 \n 据介绍，Space Bunny 是一款匿名 Flash 大模型，具备极速推理、强大的编码能力，原生支持文本、图像、视频输入，思考深度可调，上下文长达 1M。WorkBuddy\
    \ 国内独家接入，2026 年 10 月 2 日至 10 月 7 日间可享限时折扣。 \n 2026 年 9 月 27 日，Space Bunny 在 OpenRouter 的 Token 调用量约\
    \ 3.99 万亿，在 OpenCode 约 8.3 万亿，均位居第一，连续霸榜三天。（来源：IT 之家） \n AI 代理能力增强带来新的隐私安全风险，苹果收紧 macOS「完全磁盘访问」权限\
    \ \n 苹果近日宣布将进一步收紧 macOS 中的「完全磁盘访问」（Full Disk Access）权限控制，并计划增加新的安全机制，以降低 AI 代理获得大范围系统数据访问权限后可能产生的隐私风险。\
    \ \n 苹果表示，「完全磁盘访问」最初主要是为了让备份等软件能够正常工作，但随着能够自主操作电脑的 AI 代理越来越普及，这一权限所带来的风险正在明显上升。 \n macOS 目前已经允许用户在系统设置的「隐私与安全性」中手动授予应用「完全磁盘访问」权限。获得这一权限后，应用可以访问用户电脑中的大量敏感数据，包括文件、邮件、信息以及浏览历史等内容。苹果长期以来一直要求这类权限必须经过用户主动授权。\
    \ \n 苹果认为，当 AI 代理获得这种级别的系统访问能力后，其潜在影响已经不同于传统应用，因此用户必须更加明确地知道自己究竟授予了应用什么权限。 \n 随着越来越多 AI 产品开始直接进入桌面操作系统，如何让代理拥有完成复杂任务"
