  fact: Nvidia is investing in four German startups, it said yesterday, as part of a multi-billion-dollar
    investment across Europe, as the chip company's charm offensive across the continent continues. The
    US chip giant is investing in AI robotics startup Agile Robots , AI healthtech startup Avelios Medical
    , AI audio startup Mirelo and space technology startup Reflex Aerospace . Nvidia is an existing investor
    in German startups n8n and Black Forest Labs. The four new investments, for an undisclosed size, follow
    recent startup investments Nvidia has announced in France and the UK, as its CEO and co-founder Jensen
    Huang takes part in a whirlwind tour of Europe, which also included a visit to Sweden. The investments
    are part of a nearly $10bn investment by Nvidia across European tech, investing in startups, universities,
    and research institutions, as Nvidia looks to maintain momentum behind AI by investing across the
