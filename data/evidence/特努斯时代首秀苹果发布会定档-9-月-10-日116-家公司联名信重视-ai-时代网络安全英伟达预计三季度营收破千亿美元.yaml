  fact: "特努斯首秀开启 iPhone 18 Pro / Ultra 系列新篇章，苹果发布会官宣定档 9 月 10 日 \n 8 月 27 日消息，苹果官方宣布将于当地时间 9 月 9 日（北京时间\
    \ 9 月 10 日凌晨 1 点）举行秋季新品发布会，主题为「惊喜闪耀」（Surprise and shine）。 \n 这将是约翰 · 特努斯（John Ternus）于 9 月 1 日正式接任苹果\
    \ CEO 后的首场发布会，预计将推出全新一代 iPhone 18 Pro / Max 以及 Ultra 系列折叠屏新机。后续，苹果还将于明年春季推出 iPhone 18 基础版及 iPhone\
    \ 18e 等新品。 \n 结合此前爆料，iPhone 18 Pro 系列预计为常规升级，外观几乎不变，主要亮点包括： \n \n 首发 2nm 工艺的 A20 Pro 芯片，能效与性能提升； \n\
    \ 后置主摄有望升级可变光圈镜头； \n 采用苹果自研 C2 蜂窝调制解调器； \n 灵动岛打孔面积可能缩小； \n 新配色； \n 受内存芯片持续短缺影响，售价可能较前代大幅上涨。 \n \n\
    \   \n 正如大家所想到的那样，本次发布会的绝对主角将是苹果首款折叠屏 iPhone。据多方爆料，该设备采用横向书本式宽折叠设计，闭合状态下外屏约 5.5 英寸，展开后内屏约 7.6 英寸，展开后类似\
    \ iPad。 \n 其机身采用钛合金框架与超薄设计，屏幕折痕控制出色。因机身厚度限制，该设备可能放弃 Face ID，转而采用集成于电源键的 Touch ID，且后置可能仅配备双摄、无长焦镜头。该设备起售价预计在\
    \ 1,999 美元至 2,500 美元（注：现汇率约合 13,467 元至 16,843 元人民币）之间。（来源：IT 之家） \n   \n   \n 黄仁勋谈英伟达 70%增长指引：如果供给没约束，增速会远高于\
