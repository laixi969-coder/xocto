  fact: "The fact that AI wrote 1M LOC and then refined it over the course of the next couple of months\
    \ to produce a reliable piece of software that is currently running on millions of developer machines\
    \ is absolutely mind blowing. And you can say, “well it’s not that impressive because they had an\
    \ oracle to compare against, so it was simple to go from one language to another”, but I think that’s\
    \ selling this entire thing short. If you can build a verification system and give proper direction,\
    \ AI can produce a highly complex, highly sophisticated piece of software and it can continue to refine\
    \ it until it just works.  \n —  Paul Dix , The end of programming \n\n     Tags:  coding-agents ,\
    \  ai-assisted-programming ,  generative-ai ,  bun ,  ai ,  llms"
