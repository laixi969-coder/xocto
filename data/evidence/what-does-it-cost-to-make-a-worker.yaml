  fact: Azeem’s sketchbook is an experimental format we’re trialing for paying members, where we share
    raw research notes, early frameworks, and unfinished ideas that haven’t been fully polished. They
    are the earliest indication of what I’m thinking through. Here is another peek into my sketchbook.
    I’m trying to understand the economic trade-off between getting work done by an AI or a human. One
    way of doing this is to look at tasks in the economy and see how much it costs a human to do them
    compared to a machine. Another way is to view the worker as an entity the economy needs, and to consider
    the minimum cost of creating one. (Of course, humans are much more than that, but I’m limiting the
    frame purely to economics here.) Those costs include the parenting, educating, and feeding from bairn
    to adult. We can then compare that to the cost of bringing in a machine capable of doing the same
    types of work using AI. AI is manufactured intelligence . That is not the same intelligence that we
