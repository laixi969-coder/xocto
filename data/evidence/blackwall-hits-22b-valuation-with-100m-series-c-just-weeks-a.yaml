  fact: Web traffic management platform Blackwall today announced it has raised $100 million in Series
    C at a valuation of $2.2 billion. Last month it was reported that Blackwall reached a €1 billion valuation
    and ranked fifth in TopTech 2026, the annual ranking of Estonia's 30 most valuable tech companies.
    AVP , who join existing investors Dawn Capital , MMC Ventures and Tera Ventures , led the round. The
    new round of financing accelerates Blackwall's objective to build a global traffic management ecosystem
    around its hosting-provider network. By connecting providers, infrastructure and technology, Blackwall
    aims to provide greater control over how internet traffic is managed, secured and monetised. Currently
    spanning bot mitigation, DDoS protection, web application firewall, load balancing, server-side encryption
    and management of agentic AI traffic, which is rapidly taking over the Internet, Blackwall is deployed
