  fact: By Richard Anton Panics and pile-ons are a familiar pattern in the public markets, with a herd
    mentality wiping value from companies in an instant. Trading can swiftly become a barometer of emotions,
    rather than a well-informed gauge of value. We have seen this play out with AI’s impact on software
    companies and the supposed end of the Software as a Service business model. The doom-laden talk of
    the SaaSpocalypse was noise, with little signal, and most traders were initially unable to distinguish
    between a company that will thrive in the AI age and one that will be decimated by it. The SaaSpocalypse
    didn’t reveal the end of software. It revealed the limits of public markets in judging its value.
    This pattern erodes trust in the public markets. For companies, being publicly owned may no longer
    be appealing, and founders considering an exit may not view an initial public offering as the ultimate
