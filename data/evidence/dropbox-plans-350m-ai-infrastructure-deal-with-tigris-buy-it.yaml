  fact: Dropbox announced Thursday plans to acquire Tigris Data for $350 million in a transaction the
    company told Crunchbase News would mark its largest acquisition since its founding in 2007. Founded
    by former Uber engineers, Sunnyvale, California-based Tigris is building a network of localized data
    storage centers that it claims can meet the distributed compute needs of modern AI workloads. Tigris
    has raised about $31.9 million since its founding in 2021, per Crunchbase data . Its October 2025
    Series A brought in $25 million from lead investor Spark Capital , with participation from Andreessen
    Horowitz and Basis Set Ventures , which also led its seed round. Other earlier backers include General
    Catalyst . Co-founder and CEO Ovais Tariq told TechCrunch at the time of its Series A that the startup
    had grown 8x every year since its founding in November 2021. The planned deal would give Dropbox a
