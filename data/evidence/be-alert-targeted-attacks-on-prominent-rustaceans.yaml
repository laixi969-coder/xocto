  fact: "Be alert: targeted attacks on prominent Rustaceans   \nImportant warning from Adam Harvey and\
    \ the crates security team: \n \n We believe that there is an ongoing campaign targeting rust-lang\
    \ members and owners of popular crates that is attempting to compromise devices and accounts in order\
    \ to use them to publish malware. \n A video call is set up for something positive — maybe for a job,\
    \ maybe for a project, maybe for a contract opportunity — and then that's used as a vector to either\
    \ get the target to install something on their computer (such as a purportedly missing audio codec)\
    \ or execute another command (for example, via putting a command on the clipboard). \n \n Last month\
    \ this trick was used in a successful  supply chain attack against the array ref crate , among others.\
    \ \n Any piece of software that depends on open source (which is almost  every  piece of software)\
    \ has a network of human beings who are potential attack vectors - everyone with publishing rights\
    \ to any of the packages in"
