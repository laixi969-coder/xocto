  fact: "On Friday I gave the closing keynote at the  WeAreDevelopers World Congress North America  in\
    \ San Jose. I tied together the key trends from the past year into a chronological exploration of\
    \ everything that happened in 2026. The video  is on YouTube ; here are my annotated slides and notes\
    \ to accompany the talk. \n\n     \n\n \n   \n    # \n I'm going to give a lightning tour of everything\
    \ that has happened so far in 2026. The year isn't over yet! \n   \n \n\n \n   \n    # \n   For me,\
    \ 2026 started a couple of months earlier in November 2025. \n   \n \n\n \n   \n    # \n   November\
    \ saw the release of two important models: Claude Opus 4.5 and GPT-5.1. \n As is usually the case\
    \ with new models, these were incremental improvements on the models that came before them. \n But\
    \ every now and then when a model improves, it crosses an invisible line where something that didn't\
    \ really work starts working. \n In this case, the thing that started working was their coding agents.\
    \ Claude Code had been around since February"
