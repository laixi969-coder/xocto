    能力有了长足的成长 ，现在他们想自己主导。于是他们主动提出来想自己做， 我们还是支持他们 。  另外，博主透露，余承东亮相合肥，主要是去江淮开会，尊界车型矩阵布局有望提速。     鸿蒙智行在今年
