  fact: 送别「济公」！表演艺术家游本昌去世，享年 93 岁  9 月 24 日消息，据央视新闻今日报道，中国国家话剧院表演艺术家、一级演员游本昌，因病在北京去世。     游本昌出生于 1933
    年，享年 93 岁。他生前长期从事戏剧表演，在《济公》等作品中塑造了许多深受人民群众喜爱的艺术形象。1951 年，从南京市私立钟英中学（现南京市钟英中学）毕业后加入南京文工团。1985 年，在演了
    79 个「小角色」后， 首次出演主角——「济公」 ，凭该角色被大众所知。1994 年成立北京本昌艺术传播中心，制作二十集电视系列剧《济公游记》，并担任导演、主演、出品人。  2023 年，他出演了王家卫导演的电视剧《繁花》，作为男配角与主角阿宝形成师徒合作关系，在剧中担任其经商导师与幕后军师，贡献了许多「教科书式」的表演名场面。《繁花》播出后，他饰演的「爷叔」深受观众喜爱，游本昌再次爆火。（来源：CnBeta）     华为余承东首度回应问界品牌合作模式调整：赛力斯主动提出想自己主导，我们支持他们  9
