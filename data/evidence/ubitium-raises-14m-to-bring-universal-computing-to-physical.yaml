  fact: Semiconductor startup Ubitium has raised $14 million in new seed funding to develop its universal
    processor for autonomous machines and other physical AI applications. The round was led by Ibex Investors
    , with participation from OpenOcean, existing investors KBC Focus Fund, Runa Capital and Inflection,
    and Florian Seibel, co-founder and co-CEO of Quantum Systems, who invested personally. The investment
    brings Ubitium's total seed funding to $18 million since its founding in 2024 and follows the development
    of its first chip, which demonstrated signal processing, AI inference and real-time control using
    a single processor architecture. Ubitium is developing a processor for physical AI applications, including
    robots, drones, vehicles and industrial equipment. These systems need to process sensor data, make
