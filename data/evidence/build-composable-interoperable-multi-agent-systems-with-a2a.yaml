  fact: Agents in multi-agent systems that span organizational boundaries often need to collaborate in
    a composable, interoperable way, with agents that other organizations build and run. They need a way
    to discover each other, communicate, and exchange tasks without exposing internals or requiring the
    same framework on both sides. The Agent-to-Agent (A2A) protocol addresses this constraint. Without
    A2A, building composable multi-agent systems across organizational boundaries requires custom integration
    code for each customer and framework. Independent software vendors (ISVs) can instead build composable,
    interoperable agents that work with the A2A-compatible frameworks their customers already use. While
    we frame this post around the ISV use case, the pattern also applies to organizations that expose
    agents across boundaries, whether to partners, customers, or internal teams that use different frameworks.
