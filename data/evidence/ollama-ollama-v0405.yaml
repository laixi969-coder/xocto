  fact: "## NVIDIA Nemotron 3.5 Super\r\n\r\n[NVIDIA Nemotron 3.5 Super](https://ollama.com/library/nemotron-3.5-super)\
    \ is a vision-language model for coding, reasoning, tool use, and document understanding. It pairs\
    \ a 120B-parameter hybrid Mamba-2/Transformer mixture-of-experts backbone (12B active per token) with\
    \ a C-RADIO vision encoder, and supports tool calling, an on/off thinking mode, and context up to\
    \ 1M tokens.\r\n\r\n```\r\nollama run nemotron-3.5-super\r\n```\r\n\r\nA compact sibling, [Nemotron\
    \ 3.5 Bolt](https://ollama.com/library/nemotron-3.5-bolt), distills Super down to 74B parameters (9B\
    \ active) tuned to fit a 24 GB NVIDIA GPU for everyday agentic tasks, with speculative decoding via\
    \ its included drafter.\r\n\r\n## What's Changed\r\n* Decision models are now available on cloud —\
    \ use `clef:cloud` and `clef-flash:cloud` to run decision models through ollama.com cloud without\
    \ pulling them locally\r\n* Continuing an OpenAI-compatible Responses conversation that includes custom\
    \ tool calls no longer fails wit"
