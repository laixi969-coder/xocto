  fact: When enterprise data sits behind a corporate firewall or in a private on-premises data center,
    there’s no direct network path from AWS, even though the AI agents and dashboards in Amazon Quick
    can query virtually any data source. Administrators must make sure their sensitive enterprise data
    isn’t exposed to the public internet while being accessible for AI-driven insights and actions. For
    many enterprises, routing traffic over the public internet introduces unacceptable risk. Regulatory
    frameworks such as HIPAA, FedRAMP, and PCI-DSS often mandate that sensitive data remain within controlled
    network boundaries. Even where compliance isn’t the primary driver, exposing internal data paths increases
    the attack surface, complicates audit trails and introduces variable latency that can degrade the
    user experience. This walkthrough shows you how to connect on-premises data sources to Amazon Quick
    privately, without traffic traversing the public internet. It assumes you already have AWS Direct
