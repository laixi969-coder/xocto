  title: AI 时代的「4399」，可把我玩嗨了｜AI 上新
  published_at: '2026-09-12T13:03:04Z'
  collected_at: '2026-09-13T00:01:15Z'
  source_kind: market_signal
  tier: independent
  fact: "打开 Pocket 的前十分钟，我以为自己打开了一个 Instagram 版的 4399。 \n 不久前，Meta 在美国正式推出了 Pocket。Pocket 的玩法很好理解，用户不用写代码，只要告诉\
    \ AI「我想做一个什么东西」，几十秒后就能得到一个可以直接操作的小游戏、小工具或者互动页面。 \n 做完以后，它就像发帖一样，发到了 Pocket 的信息流里，其他人刷到后，可以直接玩、评论、转发，或者拿去修改成自己的版本。\
    \ \n 打开 Pocket 后刷到的小游戏｜图片来源：Pocket \n 如果按照一个游戏玩家的标准去看，Pocket 上绝大多数的内容，很难称得上是「游戏」。它们画面普遍简单，玩法也没有多少深度，有些东西十几秒就能体验完。\
    \ \n 但奇怪的是，我还是一直往下刷，停不下来…… \n   01   \n  不就是几个简陋小游戏吗？  \n Pocket 的页面，更像社交媒体，而不是 Steam 或 4399 式的游戏库。页面上没有动作、射击、解谜等游戏分类，我也不用挑选游戏，就是「刷到哪条玩哪条」。\
    \ \n 这和我平时玩游戏的思路完全不同。我打开 Steam，会从游戏库，点进游戏介绍页面，看它的玩法够不够有趣、系统有没有深度，再看看玩家们的评价。 \n 但在 Pocket 里，只有单纯的「下滑\
    \ - 玩一下」，每个页面都让我好奇「这是什么？」。 \n   \n  每一次下滑确实有「开盲盒」的感觉｜图片来源：Pocket  \n 这种好奇，很大一部分来自，Pocket 里的游戏，简单到不像这个时代的产物。\
    \ \n Pocket 里最常刷到的是那种最基础的手机小游戏：比如疯狂点击屏幕，看你一秒钟能按多少次；点哪里，哪里就出现动效动画，又或者像《Flappy Bird》，点屏幕让角色保持「起飞」，还有早期电子游戏里常见的弹球、乒乓、打砖块。\
    \ \n   \n  当年爆火的《Flappy Bird》的 3D 版｜图片来源：Pocket  \n 还有一些甚至谈不上什么规则，比如在屏幕不同位置放几个按钮，每点一下发出一种声音，最后让你自己拼出一段音乐。\
    \ \n 稍微复杂一点的，会调用手机本身的陀螺仪，比如让你倾斜手机，控制一颗弹珠慢慢滚到终点。 \n 玩这些东西的时候，我总会想到 iOS 7、8 前后智能手机小游戏大量冒出来的那几年。 \n 那时候一个玩法可以非常单纯，画面也不复杂，只要把触摸屏、重力感应这些手机"
