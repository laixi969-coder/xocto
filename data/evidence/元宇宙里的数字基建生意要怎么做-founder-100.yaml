  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 1 日                  如果说 VR 看房还只是元宇宙和房地产的首次接触，最近的「虚拟地产热」可能是房地产正式进军元宇宙了。         早在
    2020 年 5 月，加拿大的艺术家 Krista Kim 完成了全球第一个 NFT 数字空间 Mars House，之后以约 50 万美元的高价售出。而歌手林俊杰曾经以 12.3 万美元的价格买了三块虚拟地产。更加夸张的是，2021
    年 12 月，Sandbox 上的一块虚拟土地被卖了 430 万美元，打破了「元宇宙」房地产价格的纪录。         虚拟地产火热背后其实是「空间」对于元宇宙的必要性被愈加看中，就像现实生活一样，不仅需要人、货币，还需要空间和场景。         但空间如何构建？将实体三维物理空间进行「克隆」是一个好的选择。在这个方向上，「众趣科技」是国内的头部公司。他们已经在云端完成了数百万套空间数字化的克隆重建，涉及房地产、文旅和建筑等多个领域，并积累了超过
    2 亿平方米的三维数字空间数据。         最近，我们邀请了众趣科技创始人&CEO 高翔，一起聊了聊 3D 空间数字化和数字空间的未来。                 3D 重建是对物理世界的物体进行数字化的过程，大型场景的
    3D 重建一直是业界的难点。    众趣希望通过数据而不是设备本身为客户带来更多价值。企业的初衷不是在设备上创造高利润，而是希望通过生成 3D 数据帮助客户产生价值。    当行业的 know-how
    处于未知状态时，首位客户提出的需求就是行业的 know-how。客户能够帮助企业完善行业的方案，促使产品落地。    我们更像是元宇宙的开发商，为各种行业提供建筑空间。空间的使用取决于下游的客户。    克隆数字空间将成为数字资产，其自身的空间唯一性价值属性决定了这一步的发展。                 01    3D
