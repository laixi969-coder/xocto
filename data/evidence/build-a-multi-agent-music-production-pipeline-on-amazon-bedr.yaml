  fact: Amazon Bedrock AgentCore Runtime Instances gives multi-agent workflows AWS managed EC2 infrastructure
    with GPUs, persistent volumes, and multi-day sessions. In this post, we deploy a three-agent music
    production pipeline where the agents colocate on one GPU instance, share a filesystem, and hand work
    to each other to produce a finished track.
