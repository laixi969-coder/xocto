  fact: 'OpenAI''s ChatGPT Atlas browser is gone , but now ChatGPT''s Google Chrome extension is getting
    some upgrades that allow it to use the browser tabs you already have open. With the extension installed,
    OpenAI says ChatGPT can now view your browser tabs when you tag Chrome in ChatGPT''s web or desktop
    app, posting a demo video showing someone asking ChatGPT to compare the three tabs they have open
    with sofas they''re considering. A few big upgrades for Chrome users today! We''re bringing the power
    of computer use to anyone who uses Chrome. First up: ChatGPT can now use your tabs in Chrome to make
    answers more useful and get things done for you. If … Read the full story at The Verge.'
