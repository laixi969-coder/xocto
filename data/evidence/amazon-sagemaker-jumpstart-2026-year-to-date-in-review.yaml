  fact: 'Amazon SageMaker JumpStart is a machine learning (ML) hub within Amazon SageMaker AI that provides
    access to a curated catalog of AI models, solution templates, and example notebooks. It reduces the
    time it takes to go from model selection to deployment. You can use it to evaluate open source large
    language models (LLMs), deploy a vision model for document understanding, or fine-tune a compact model
    on your own data. SageMaker JumpStart serves three primary use cases: Model discovery and evaluation
    — Browse hundreds of foundation models (FMs) from providers like Alibaba (Qwen), NVIDIA, Google, Mistral,
    Cohere, IBM, and more. Each model card includes architecture details, benchmarks, licensing information,
    and sample notebooks. One-click deployment — Deploy your choice of model to a SageMaker real-time
    inference endpoint with pre-configured settings optimized for your workload (low cost, low latency,
    throughput, or balanced). No manual container or instance configuration required. Model'
