  fact: Named to Madrona's 2026 Intelligent Applications 40 (Enabler stage). Together, the 45 2026 winners
    have raised $410 billion since their founding, more than 25 times the roughly $16 billion the inaugural
    2021 cohort had raised by fall of 2021. Together they show voice moving from point products to serious
    infrastructure, not just a feature bolted onto an app. Baseten, Together AI, Fireworks, Fal, and OpenRouter
    are all roughly doubling or more their valuations year over year as demand for GPU capacity and multi-model
    routing outstrips supply, and although all well-funded there is not yet one clear winner pulling away.
