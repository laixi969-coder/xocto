  fact: 'Agentic automation, software that reasons and adapts to complete tasks, is showing up on AI center
    of excellence (AI CoE) roadmaps. But the standard way companies justify automation investments, hours
    saved times labor cost minus build cost, was designed for rule-based tools like robotic process automation
    (RPA). That model misses most of the value agents create. In this post, we introduce a framework AI
    CoE leaders can use to build a business case that captures the full value of agentic automation. You
    will learn why the RPA-era ROI model falls short, how to measure the value it misses, and which workflows
