  fact: 'From November 30th to December 4th, Amazon Web Services (AWS) will hold its annual premier learning
    event: re:Invent . At this event, attendees will become stronger and more proficient in various areas
    of AWS technology through a variety of experiences: keynotes given by AWS leaders, interactive working
    sessions led by AWS experts, and fun, immersive activities such as live entertainment and games at
    re:Play . There are over 2,000 learning sessions that focus on specific topics at various skill levels,
    and the AI/ML (AIM) track has more than 140 unique sessions for you to choose from. We’re here to
    help you identify the sessions that best fit your needs. Even if you can’t join in person, you can
    catch up with many of the sessions on demand and even watch the keynotes live. The basics: Session
    types If you can join us, then remember that we offer several types of sessions that can help maximize
    your learning in a variety of AWS topics. re:Invent attendees can choose to attend breakouts,'
