  fact: You can deploy OpenFold3-preview from Amazon SageMaker JumpStart . The OpenFold Consortium and
    the AlQuraishi Lab at Columbia University developed OpenFold3 as an open source biomolecular structure
    prediction model. With a few lines of code, you can typically deploy OpenFold3 into your own AWS account.
    You can then predict the 3D structures of proteins, DNA, RNA, small-molecule ligands, and the complexes
    they form. The endpoint runs with network isolation, which you can use to help keep your sequences
    within your AWS account. Computational drug discovery teams now use structure prediction as a core
