  fact: This week Microsoft offered a voluntary exit to around 60,000 employees across the US, UK, Canada,
    and India – about 27% of its 223,000 workers. Even vice presidents are within reach. This isn’t a
    round of layoffs, though it may be the prelude to one. Is AI behind it? That’s the usual reading.
    It comes in two versions. The first is that capital spending is heading to $170 billion, up from $23
    billion five years ago; Microsoft needs to cut staff to pay for data centers. The second is that the
    company has become AI-pilled, and agentic loops are running rings around headcount. There is a more
    mundane explanation too. Like many tech firms, Microsoft hired hard during Covid; maybe now it needs
    to work off the bloat. But none of these fit the facts. It’s no to Covid and not-yet for AI. That
    leaves one last rationale… the company is more productive than ever, and it is betting it can go much
    further. Subscribe now The facts that get in the way of the story Microsoft’s revenues and headcount
