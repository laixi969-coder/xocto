  fact: Numeracle has raised $28 million from Edison Partners to help businesses whose calls are incorrectly
    labeled as spam or blocked by phone carriers, it tells Crunchbase News exclusively. The McLean, Virginia-based
    company verifies businesses and links their identities to the phone numbers they use to contact customers.
    It shares that information with the systems carriers use to screen calls and works to remove incorrect
    labels. Rebekah Johnson, founder and CEO of Numericle. (Courtesy photo) The financing brings Numeracle’s
    total funding to $34.8 million since its 2018 inception. That total includes a $6.8 million Series
    A raised in December 2023, founder and CEO Rebekah Johnson told Crunchbase News in an interview. Edison
    was the sole investor in the new round. Numeracle declined to disclose its valuation. The company
    says it has roughly 4,000 business customers and about 85 employees. It became profitable this year,
