  fact: With the launch of AWS Batch support for Amazon SageMaker Training jobs, customers gained a new
    fully managed way to queue, schedule, and retry machine learning (ML) training workloads without building
    their own infrastructure. Instead, they use the queuing and scheduling features of AWS Batch. As organizations
    scale their artificial intelligence and machine learning (AI/ML) operations and onboard more teams,
    coordinating access to shared graphics processing unit (GPU) capacity can introduce additional communication,
    coordination, and configuration overhead for administrators. This overhead includes setting up separate
    queues, adjusting capacity limits, and carefully orchestrating the right workloads to get the right
    resources at the right time. A core value proposition of AWS Batch is helping customers increase utilization
