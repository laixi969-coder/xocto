  title: 从手腕到雪鞋，运动可穿戴探索下一个可能 | 对话 Heygo
  published_at: '2026-11-25T06:45:34Z'
  collected_at: '2026-11-26T04:11:00Z'
  source_kind: market_signal
  tier: independent
  fact: 随身可穿戴，是智能硬件领域里一个非常清晰且明确的产品方向。 背后的逻辑，是把硬件「传感化」，用传感器在物理世界里拿到过去模型很难获得的上下文数据，再经过 AI 处理，最终兑现成高价值的个人服务。
    落在具体产品上，目前已经可以看到两个「超级共识」的形态： 一类是以语音采集为抓手的个人效率工具，代表公司 Plaud 目前估值已经突破百亿；另一类是个人健康监测设备，这个赛道里既有超级巨头苹果旗下的
    Apple Watch，也已经出现了 WHOOP、Oura 这样的新锐独角兽企业。 所以，对新晋入场的创业者们而言，要想在激烈竞争的共识里找到机会， 大概率需要找到一个新的「非共识」切口：要么是新的数据，要么是新的场景。
    2025 年在深圳成立的 Heygo，正是希望在单板滑雪这个垂直场景里，重新挖掘数据的价值。 创始人 Edward 是一个有着 7 年雪龄的资深滑雪用户。在他看来，滑雪一直缺少一把评估表现的「尺子」。教练只能隔着雪服凭经验判断，AI
    看不懂全景相机拍的视频，智能手表能记下心率和里程，却读不懂一次换刃…… 而单板滑雪的所有身体动作，最后都会通过双脚传到雪板上。所以，看明白了脚上的数据，就能让 AI 理解每一趟滑行。 这成为了 Heygo
    创业的起点。产品的硬件构型并不复杂，两个夹在雪鞋外侧的传感器，加一个装着 AI 教练的手机 App。为了建立起可信的评价体系，Heygo 和各国的专业滑雪教练一起，在真实雪场里采集、标注了超过 200
    万个弯的滑行数据，训练出一套通用的单板模型。用户滑行时能听到实时语音提醒，滑完一趟就能拿到评分和下一趟的练习建议，就像身边跟着一位教练。 今年 10 月，Heygo 首款产品 S1 全球上市交付，硬件售价为
    289 美元（国内售价 1699 元），并在海外提供 139 美元每年的软件订阅服务。上线以来，已收获数千个真实订单。 一支因为爱滑雪聚到一起的团队，在垂直场景里探索通过数据找到「非共识」的新场景。我们觉得，Heygo
    的创业故事或许能给其他硬件创业者一些启发。 以下是 Hardwire 和 Heygo 创始人吴振华（Edward）的访谈，经编辑整理。 访谈、整理 | siqi 编辑 | 靖宇 给滑雪打个分 Hardwire：先用最简单的话说说，Heygo
    是个什么东西？ Edward ：两个夹在雪鞋外侧的传感器，加一个手机
