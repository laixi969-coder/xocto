  fact: AI agents that interact with enterprise APIs on behalf of users need to maintain user identity
    throughout the request chain. Without identity propagation, API calls arrive at downstream services
    as the application itself rather than the user who initiated the action. This breaks audit trails,
    bypasses user-level access controls, and violates the principle of least privilege. Amazon Bedrock
    AgentCore is a platform to build, connect, and optimize agents at scale, with any framework or model.
    This post shows how to configure AgentCore Gateway , a capability of Amazon Bedrock AgentCore, for
    an on-behalf-of (OBO) token exchange with Microsoft Entra ID. An AI agent can then call the ServiceNow
    REST API while preserving the calling user’s identity. You configure the token exchange on the gateway
    target, and AgentCore Gateway performs the exchange on each request. The pattern can be applied to
    other REST APIs protected by OAuth. In production, you can additionally pair identity propagation
