  fact: YGO , a company developing an AI-powered platform connecting travel companies with airlines, hotels
    and tour operators, has raised €8 million in a Series A funding round led by Ventech , with participation
    from Sake Bosch, Caesar Capital and business angels. Founded by Julian Kögel , Willi Ibbeken and Sebastian
    Kreutzberger , YGO provides AI infrastructure designed to help travel companies integrate AI-powered
    search, recommendations, customer service and booking capabilities into their existing systems. Its
    platform connects travel suppliers with both traditional booking channels and emerging AI assistants,
    allowing companies to offer their services without replacing their existing technology infrastructure.
    YGO's platform uses AI to organise and structure fragmented hotel and travel product information,
    making it easier for AI systems to understand and process available offerings. This enables personalised
