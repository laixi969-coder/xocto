  fact: "苹果确认：美版 iPhone 18 Pro Max 有问题 \n 北京时间 10 月 3 日，彭博社报道称，苹果公司表示，AT&T 的问题已导致部分 iPhone 18 Pro Max\
    \ 用户无法拨打电话、访问数据或在联网时收发短信。目前尚不清楚有多少人遇到此问题。受影响的用户发现，除非连接到 Wi-Fi 网络，否则他们的设备基本无法使用。 \n 苹果公司已发布运营商设置更新，并推出了\
    \ iOS 操作系统的新版本 27.0.1，以防止该问题进一步蔓延。运营商设置修复程序将在未来 14 天内自动为 AT&T 用户下载，但苹果仍建议消费者立即安装任何可用的软件更新。 \n 苹果发言人在提供给彭博社的一份声明中表示：「我们已发现一个影响少数\
    \ AT&T 网络 iPhone 18 Pro Max 用户的故障，可能导致设备失去服务并无法拨打电话。」报道称，对于已经受到影响的用户，唯一的解决办法是更换手机，使用苹果或 AT&T 提供的新设备。\
    \ \n 报道提到，在美国销售的 iPhone 18 Pro Max 与其他新款机型有一点不同：它搭载的是由高通公司制造的蜂窝基带。包括较小的 iPhone 18 Pro 在内的所有其他版本，均配备苹果自研的\
    \ C2 基带。根据用户报告，只有 iPhone 18 Pro Max 受到了 AT&T 这一漏洞的影响。（来源：新浪科技） \n   \n 英伟达 Vera Rubin NVL72 跑出 4.8\
    \ 倍 Token 吞吐 \n  AI 云服务商 CoreWeave 近日宣布，英伟达 Vera Rubin NVL72 系统已在 CoreWeave Cloud 正式投入生产，AI 软件公司 Cognition\
    \ 成为首个在该平台运行生产工作负载的客户。  \n Cognition 在 Vera Rubin NVL72 上运行 SWE-2 推理任务， 实测总 Token 吞吐量较 GB200 NVL72\
    \ 提升高达 4.8 倍。 在强化学习场景中，每 GPU 输出 Token 吞吐量也达到 GB200 NVL72 的 3.8 倍 ，意味着 Devin 可同时处理更多会话并加速多步推理。 在 DeepSeek-R1\
    \ 推理基准测试中，Vera Rubin NVL72 每兆瓦 Token 吞吐量达到 GB200 NVL72 的 10 倍， 在相同电力消耗下可产出更多智能输出。"
