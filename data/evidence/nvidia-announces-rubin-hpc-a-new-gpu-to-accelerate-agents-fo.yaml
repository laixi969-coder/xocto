  fact: Announced today at SC26, NVIDIA Rubin HPC is a new GPU in the NVIDIA Vera Rubin platform designed
    to accelerate simulation and data processing for science, engineering and analytics workflows. As
    agents help scientists and engineers explore more candidate materials, molecules and designs, they
    rely on simulations to test those ideas and guide their next steps. Rubin HPC will accelerate those
    simulations, shortening the path from exploration to scientific discovery and industrial design. The
    Rubin HPC GPU features a record number of CUDA cores — more than 50,000 on a single GPU — as well
    as a sparse data acceleration capability that keeps those cores fed with data, and accelerates GPU-to-GPU
    connectivity with seventh-generation NVIDIA NVLink interconnect technology. Read All NVIDIA Announcements
