  fact: "2026 诺贝尔物理学奖揭晓：把一立方公里南极冰变成望远镜，打开「中微子天文学」 \n 10 月 6 日，2026 年诺贝尔物理学奖授予比利时裔美国物理学家 Francis Halzen，以表彰其「对\
    \ IceCube 中微子天文台的决定性贡献，以及发现来自天体的高能中微子」。 \n Halzen 领导建设的 IceCube 位于南极，把超过 一立方公里的透明冰层本身变成粒子探测器：5000\
    \ 多个光学传感器被埋入超过两公里深的冰层，通过捕捉中微子极少数与物质碰撞时产生的微弱光线，反推出粒子的来源。 \n 与传统望远镜利用光观察宇宙不同，中微子几乎可以不受阻碍地穿过物质，因此能够携带超新星、黑洞等极端宇宙事件的信息。\
    \ \n IceCube 的成果由此建立了「中微子天文学」这一新的宇宙观测窗口。（来源：NSF、Reuters） \n 距 6 万亿美元仅一步之遥，英伟达市值达 5.8 万亿美元，创历史新高 \n\
    \ 10 月 6 日消息，当地时间上午 9 点 30 分，纳斯达克市场开盘。开盘钟声敲响后的二十分钟左右，英伟达（NVDA）市值达到 5.82 万亿美元（现汇率约合 39.08 万亿元人民币），创下历史新高，同时距\
    \ 6 万亿美元（现汇率约合 40.29 万亿元人民币）仅有一步之遥。 \n 今日开盘时，英伟达股价为 242.10 美元（现汇率约合 1,626 元人民币），最高 243.37 美元（现汇率约合\
    \ 1,634 元人民币），最低 240.76 美元（现汇率约合 1,617 元人民币）。 \n 同时，英伟达股价于美东时间 10 月 5 日星期一再度刷新历史纪录，收盘报 238.90 美元（现汇率约合\
    \ 1,604 元人民币），单日上涨 2.12%，连续第三个交易日以收盘价创历史新高。如果继续上涨，英伟达有望成为全球首家市值达 6 万亿美元的公司。（来源：IT 之家） \n   \n 消息称\
    \ DeepSeek 新一轮融资接近锁定至少 800 亿元，腾讯控股和宁德时代重金投入 \n 10 月 6 日消息，据彭博社援引知情人士消息称，中国人工智能公司 DeepSeek 最新一轮融资已接近收官，锁定至少\
    \ 800 亿元人民币（约 120 亿美元），远超其最初设定的约 500 亿元融资目标。根据已签署的投资条款清单，最终融资规模有望逼近 1000 亿元。 \n 腾讯控股和宁德时代是承诺出资金额最高的投资"
