  fact: "Tool:   Kākāpō Party  \n         I gave presented a closing keynote for the  WeAreDevelopers\
    \ World Congress North America  yesterday. As  a STAR moment  I decided to weave in references to\
    \ the record breaking  kākāpō breeding season  we had in 2026. \n For my closing slide I wanted to\
    \ celebrate, and I had seen some buzz around how good Claude Opus 5.5 was at creating pixel art animations.\
    \ So I rounded up three Kakapo photos from Google image search and dropped them into Claude with this\
    \ prompt: \n \n  Here are some photos of kakapo parrots just to remind you what they look like  \n\
    \  I need you to make an animation in animated pixel art on HTML 5 canvas of obviously pixel art kakapo\
    \ jumping up and down having a party with confetti and suchlike - there should be at least 20 of them\
    \  \n \n Here's  the transcript , and this is the  resulting page . It's pretty great! \n I wanted\
    \ to embed it in a Keynote presentation file, so I downloaded the HTML and told a local Claude Code\
    \ session: \n \n  Make me"
