  fact: "Graham Dumpleton's new monkey patching package  wrapture  is shaping up to be an indispensable\
    \ tool for Python developers. I'm not sure why I've seen so little buzz about it! \n Graham has been\
    \ posting new tutorials for it almost daily since  the initial release  on August 31st. Here's everything\
    \ he's published so far: \n \n  Introducing wrapture  - a new monkey patching library that serves\
    \ both testing and observability (think New Relic style tracing) at the same time. \n  Unit testing\
    \ with wrapture  - how to use it for the same kinds of thing as  unittest.mock . \n  Recording calls\
    \ with wrapture   - recording method calls as timelines and processing and displaying them as trees.\
    \ \n  Phased behaviour in wrapture   - arranging patched methods to change behavior across multiple\
    \ calls. \n  Beyond callables in wrapture  - monkey patching attributes, dictionaries, generators.\
    \ \n  Live tracing with wrapture   - tracing a live application to see exactly how it works. \n  Zero-code\
    \ tracing with wraptu"
