  title: Jev 之后，中国团队开始深挖 AI 的「直觉层」
  published_at: '2026-10-04T11:41:48Z'
  collected_at: '2026-10-05T00:56:27Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜桦林舞王 \n 编辑｜靖宇 \n   \n \n 9 月 15 日，前 OpenAI 研究员 Diogo Almeida 创办的 TypeSafe AI 发布了 Jev。这款模型不写一个字，只做判断。\
    \ \n 两周之后，整个行业都在做同一件事。OpenAI 在开发者日上推出 Decisions API，Cloudflare 在 10 月 1 日开源了 Clef，亚马逊也放出了 Strands\
    \ Decider。 \n 国内同样没闲着，上海人工智能实验室开源了多模态决策模型 Intern-Decision。 \n 9 月 30 日，一家成立不到五个月的上海公司 StartLux（原点星辉）发布了开源的\
    \ StartLux-Decision，并宣称在公开评测中超过 Jev。 \n  一个新品类在两周内从「首发」走到「群战」，这种速度在大模型行业也不多见。  \n 而 StartLux 背后的掌舵人，是盛大网络联合创始人陈大年。\
    \ \n   \n 被 Jev 点燃的「直觉」 \n 要理解这轮热潮，得先说清楚决策模型到底在干什么。 \n TypeSafe 把 Jev 称为「System One 模型」，名字取自卡尼曼的《思考，快与慢》。系统一是人快速、直觉的那部分思维，系统二负责慢思考。过去两年的大模型，几乎都在往系统二的方向卷，推理链更长，思考更深。\
    \ \n 但 Agent 真正跑起来之后，情况不太一样。一个 Agent 任务里，密集发生的往往不是深度推理，而是大量琐碎判断。这张工单该分给哪个团队，这条命令能不能放行，页面上下一步该点哪个按钮，任务到底完成没有。\
    \ \n 过去这些判断要么交给大模型「顺便」做，生成一段文字再解析；要么写死成规则，覆盖不了长尾。前者又慢又贵，后者不够聪明。 \n Jev 的做法是只回答带预设选项的问题，单选、打分或者是非题，直接返回带概率的结构化结果。定价是每百万输入\
    \ token 0.042 美元，输出免费。 \n  可以说，Jev 把「判断」从「生成」里剥离出来，做成了一种廉价、高频的基础设施。  \n 市场反应很直接。Vercel 披露，Jev 上线 24\
    \ 小时内，其 AI Gateway 上 13% 的付费用户就用上了它，是此前任何模型发布的两倍。TypeSafe 用经济学家杰文斯的名字给模型命名，暗指那条著名的悖论，一样东西越便宜，需求反而越大。\
    \ \n 不过 Jev 有一个明显"
