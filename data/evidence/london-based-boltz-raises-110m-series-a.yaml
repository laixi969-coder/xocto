  fact: London-based AI drug discovery startup Boltz has raised a $110m Series A funding round, less than
    a year after emerging out of stealth. Boltz is an AI research startup that develops AI models to speed
    up drug discovery. It was spun out of MIT in the US but is now located in London, employing 40 AI
    researchers in the capital's King's Cross district. Bessemer Venture Partners led the round, with
    existing investors including Andreessen Horowitz, Amplify Partners, Zetta Venture Partners and Obvious
    Ventures participating. New investors include Greycroft, F-Prime Capital, Hummingbird and Benchling,
    joining Nvidia, which also announced an investment earlier this year during Jensen Huang’s visit to
    the UK . It follows Boltz raising a $28m seed round at the start of the year. The startup builds software
    which helps pharmaceutical and biotech researchers design potential drugs and decide which candidates
