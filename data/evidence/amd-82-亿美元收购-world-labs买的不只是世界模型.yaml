  title: AMD 82 亿美元收购 World Labs，买的不只是世界模型
  published_at: '2026-09-29T11:21:44Z'
  collected_at: '2026-09-30T01:18:45Z'
  source_kind: market_signal
  tier: independent
  fact: "9 月 3 日，英伟达宣布以约 130 亿美元收购 Hugging Face。25 天后，AMD 宣布以约 82 亿美元收购李飞飞创办的 World Labs。 \n 两笔交易放在一起看，更觉得有意思。CNBC\
    \ 最新的报道提到，Hugging Face 在被英伟达拿下之前，AMD 和 Salesforce 都曾表达过收购兴趣。 \n  没抢到 AI 世界里最大的模型「集散地」，AMD 转身买下了一支造模型的顶级团队。\
    \  \n  根据 AMD 的公告，这是一笔全股票交易 ，预计在 2026 年底前完成交割，仍需通过监管审批。交割之后，李飞飞将出任 AMD 执行副总裁兼首席科学家，直接向 CEO 苏姿丰汇报。\
    \ \n 这也是 AMD 历史上第二大收购，仅次于 2022 年约 500 亿美元拿下的赛灵思。 \n 除了科技圈最有分量的两位华裔女性联手外，很多人的第一反应是——AMD 要押注世界模型了，但这个判断只对了一半。\
    \ \n   01   \n  「不做模型生意」的模型收购  \n 作为一家 AI 基建公司，AMD 从来不靠卖模型赚钱，它卖的是 CPU、GPU 和越来越完整的数据中心系统。 \n 这笔交易真正的逻辑，藏在\
    \ AMD 自己的表述里。 \n 公告写得很直白，随着 AI 扩展到推理、机器人、仿真和物理 AI，算力基础设施面对的需求越来越多样， World Labs 的模型经验，将帮助 AMD 更深入地理解工作负载如何演变，进而塑造未来的技术路线图\
    \ 。 \n AMD CEO 苏姿丰在接受彭博采访时说得更简单，「你对端到端理解得越深，造出来的系统就越好」。 \n 一位分析师的评价很到位，「这是一笔买人才和模型洞察的交易，不是买收入。」 \n\
    \  换句话说，AMD 花 82 亿美元买的不是一个产品，而是一扇能提前几年看到未来算力需求的窗户。  \n 芯片的设计周期以年计，今天定下的架构，要两三年后才会在数据中心里跑起来。如果等模型公司把新需求摆到面前再去适配，芯片公司永远慢半拍。把一支前沿模型团队放进自己家里，等于在研发链条的最上游装了一个传感器。\
    \ \n 两位传奇女性的联手，也不是临时起意。 \n World Labs 与 AMD 从去年开始就在 AMD GPU 上合作做模型训练和推理优化，李飞飞还登上了今年 1 月 AMD 的 CES\
    \ 主题演讲台。她在宣布消息时称苏姿丰是「很好的朋友」，也是 Worl"
