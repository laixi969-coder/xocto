    In The Loop。 👇                       作者｜  Li Yuan            8 月，具身智能圈最热闹的一件事是宇树机器人上市。    对大多数人来说，宇树的形象非常鲜明：春晚上跳舞的机器人，以及那些流畅得不像机器的动作。人形机器人的价值感，很大程度上正是由这些动作建立起来的。    那么，让机器人动得这么好，究竟有多难？    机器人首先得有一副足够好的身体硬件。构型是否接近人，电机的摩擦和转子惯量是否足够小，量产一致性是否稳定，都会影响动作最终呈现出来的效果。这也是宇树最难被绕开的优势。    而在算法这一侧，整个行业的能力正在快速变好。     去年，行业里基本还是一个动作训练一个策略，换一支舞就要重新训练，能做好拟人行走已经算不错。今年，运动基座模型开始出现。     一个模型看过足够多的人类动作后，即使没有专门练过，也能跟上新动作。上传一段视频，几分钟内提取动作，在仿真里看一遍，再部署到实机，整套流程半小时就能走完。宇树自己也在做这类模型。    这带来最直接的变化，可能是会跳舞的机器人越来越多。大家都能更快学会一套新动作，只是受硬件差异影响，不会跳得一样好。      而再往前一步，或者还对机器人的未来形态产生影响。    今天，大多数做操作的机器人还坐在桌前，只动两只手。但真正的通用人形需要上下半身一起工作。     Figure
    机器人的做法是把全身运动控制和操作都放在自己公司里，一路打通。    而如果全身运动控制可以从外部拿到，一家只做双臂操作的公司，理论上可以直接接上另一家公司的全身模型，让机器人从桌前站起来。       通用基座运动模型到底意味着什么？    我们最近和桥介数物聊了聊。这家公司正在做的，就是一个通用的全身运动控制模型——让不同品牌、
