- id: ev-7da1e99fddca5be9
  project_slug: autoresearch
  url: https://zhuanlan.zhihu.com/p/2021862280338350393
  title: Karpathy的AutoResearch指南：用AI智能体自动化机器学习实验
  published_at: ''
  collected_at: '2026-09-01T01:47:08Z'
  source_kind: customer_case
  tier: independent
  fact: AutoResearch 是一款开源 Python 工具，可让 AI 智能体在 无需人工干预 的情况下，于单张 GPU 上自主运行机器学习实验。 它循环执行「提出假设→训练→评估」流程，仅保留能降低验证损失的修改，项目采用
    MIT 开源协议。 这 并非超参数调优。 Optuna、Ray Tune 等工具仅在预定义的 参数空间 内搜索；而 AutoResearch 赋予智能体 任意修改代码 的自由，其搜索空间完全由 大语言模型
    （LLM）的能力决定，这让它成为一款与现有工具截然不同的全新品类。
