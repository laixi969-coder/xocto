  fact: My mother broke her hip in late 2022, and it triggered a long process of moving out of a house
    she’d owned since 1987. During the final stretch of cleaning out the place in late 2024, I found myself
    passing time by composing nonsense songs in my head. “Nasty rotten rusty moldy trash,” I sang to myself
    repeatedly as I hauled bag after bag of moldy garden supplies out of her dank basement. I’ve recorded
    music for both personal fun and public release for decades — first using a 16-track digital recorder
    two decades ago , and using Logic Pro more recently. So I often keep audio notes of song scraps in
    Voice Memos on my iPhone for later development with vocals, guitars, piano, and drums I play or sequence
    myself. A man holds some trash. (Photo by Dacharlie via Getty Images) So on that day in November 2024,
