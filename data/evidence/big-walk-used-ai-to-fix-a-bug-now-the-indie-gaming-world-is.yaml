  fact: The last few years have seen significant debate over the widespread use of AI-powered tools in
    game development and the responsible disclosure of that usage to players. That debate has exploded
    into a full-blown controversy in the indie game development space this week, as Big Walk developer
    House House has publicly and belatedly disclosed minimal AI use in its popular co-operative puzzle
    exploration game. This particular controversy has been brewing behind the scenes for months, as judges
    and jury members for the prestigious Independent Games Festival Awards discussed the issue in private
    discussion groups. But the debate started to break into public view on Monday when 19 members of the
    50-plus-member jury released a signed statement outlining a stance "declining to vote for any game
