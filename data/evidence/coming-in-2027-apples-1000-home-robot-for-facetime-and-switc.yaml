  fact: Apple’s new CEO, John Ternus, is apparently pushing the tech company’s development of household
    robots—and the first to debut may be a home robot designed to autonomously roam around while supporting
    FaceTime calls and switching lights on whenever a person enters the room. People who worked on Apple’s
    robotic projects told The Information that the AI-driven home robot, code-named J595, could be named
    HomeView Ultra in line with Apple’s new HomeView stationary smart display . The company is reportedly
    aiming to launch the robotic product with a possible price tag of $1,000 or more by 2027, although
    development delays may push that back to 2028. The earliest prototypes of the home robot first came
    out in 2018 and received approval from former Apple CEO Tim Cook to continue the project. The Information
    describes Apple’s engineers as trying to give the robot more capabilities beyond being a “fancy way
