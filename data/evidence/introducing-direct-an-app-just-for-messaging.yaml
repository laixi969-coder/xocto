  fact: 'Today, we’re introducing Direct, a new messaging app brought to you by Instagram for chatting
    one-on-one or in groups with friends and family. People rely on messaging to stay in touch with friends
    and family, and we built Direct to provide a dedicated space for these close connections. Direct has
    creative, customizable messaging tools made to make chats unique to you, including: Draw: Draw and
    sketch directly inside your chat threads. Notes: Catch quick updates from friends right at the top
    of your inbox. Stickers: Create custom stickers to express yourself and share with friends and family.
    Voice Effects: Add fun audio effects like crowd laughter or underwater sounds to your replies. Themes:
