  fact: 'A request to modernize an application often starts with a technology question: Which framework
    should replace the old one? Before you choose, find out what still works. Then collect evidence that
    can act as a regression net for that behavior and show where modernization is necessary. I used an
    evidence-first method on four public applications, from a small Node.js game to a large Java enterprise
    resource planning (ERP) application. Each needed a different treatment, but the way I collected evidence,
    chose the next experiment, and decided on possible proof points was repeatable. This post walks through
    that process so you can apply it to one application of your own. It also shows how to encode the procedure
    in a GitHub Copilot agent skill while keeping architectural judgment with the people responsible for
    the system. Build evidence before choosing a target The label on an application rarely tells you enough.
    “Java microservices” doesn’t tell you which Java Development Kit (JDK) runs in'
