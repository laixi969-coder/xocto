  fact: 'Voice cloning in Amazon Polly is now generally available as a gated release. Give Amazon Polly
    a few minutes of audio recordings from a speaker who has agreed to have their voice cloned, and Amazon
    Polly builds your own cloned voice in that speaker’s voice. The cloned voices run on the Amazon Polly
    generative engine, which delivers similar naturalness and accuracy as the rest of the generative voices.
    Amazon Polly voice cloning launches with seven languages: English, Spanish, German, French, Italian,
    Portuguese, and Hindi. Each cloned voice speaks the language it was recorded in. The cloned voices
    are automatically encrypted and access-controlled: only you can access your cloned voices. Amazon
    Polly voice cloning is available in all the AWS Regions supported by the Amazon Polly generative engine,
    including the AWS GovCloud (US) Region. Access is already enabled for select Amazon Polly customers.
    Others can reach out to their AWS account team or apply for access to get access. With this'
