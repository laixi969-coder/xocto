  fact: 'By Nacho De Marco Today’s venture capital ecosystem looks markedly different from even just five
    years ago. Most significantly, a small number of AI companies are now attracting the vast majority
    of available venture capital. In Q1 2026, just four companies collectively raised $188 billion , which
    alone accounted for 65% of total global venture investment, per Crunchbase data. Meanwhile, in that
    same quarter, just 20% of global VC funding went to non-AI firms . Deal count was also down 30%, meaning
    that checks are being made out to fewer companies all around. So what happens to startups when the
    VC route is all but closed? I built a company into a multibillion-dollar business without any venture
    funding. Here’s a few lessons I picked up along the way: Prioritize customers and revenue, not fundraising
    Nacho De Marco, founding GP of BDev Ventures, and chairman of BairesDev. Many founders unknowingly
    treat fundraising as a measure of success. But while it’s useful, funding doesn’t result'
