  fact: UK-based preventative health startup Stride has raised £4.6 million in seed funding to further
    develop its diagnostics-driven health platform and support international expansion. The round includes
    investment from Arāya Ventures, Morgan Stanley Inclusive & Sustainable Ventures, Better Ventures,
    Innovate UK and an a16z Scout Fund investor, alongside a group of angel investors. Launched in May
    2024 by Andrew Steele , an Olympic medallist and co-founder of DNAfit, Stride offers a preventative
    health membership that combines DNA, blood and gut health testing with personalised insights. The
    platform aims to help individuals better understand their health data, track changes over time and
