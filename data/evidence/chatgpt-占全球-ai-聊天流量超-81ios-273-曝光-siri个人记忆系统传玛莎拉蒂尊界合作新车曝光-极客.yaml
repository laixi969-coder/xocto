  fact: 8 天从零搓出操作系统：Anthropic 最强 Claude Fable / Mythos 5.2 AI 模型登场，API 调用费下降 20% 11 月 10 日消息， Anthropic
    昨日（11 月 9 日）官宣推出 Claude Fable 5.2 和 Claude Mythos 5.2， 两款模型基于同一底层模型，前者面向普通用户并内置网络安全与生物安全防护，后者则面向通过审核的网络安全和生命科学机构开放，用于高风险的专业应用。
    定价方面，Claude Fable 5.2 每 100 万词元（Token）输入费用为 8 美元（IT 之家注：现汇率约合 53.4 元人民币），每 100 万词元（Token）输出费用为 40
    美元（现汇率约合 267.2 元人民币）。作为对比，Claude Fable 5.1 的每 100 万词元输入 / 输出价格分别为 10 美元（现汇率约合 66.8 元人民币）和 50 美元（现汇率约合
    334 元人民币）， 按此计算 5.2 版本的 API 调用费用下调 20%。 生成速度方面，官方表示相比 Claude Fable 5.1，最新 Claude Fable 5.2 模型生成速度最高提升
    30%，而且在可选「快速模式」下，生成速度最高再提升至 2.5 倍，但价格相应更高。 在预发布测试中，Fable 5.2 完成了多项引人注目的任务：设计出三款可实际运行的电子设备，包括语音助手中枢、USB
    会议音箱和手持虚拟宠物；协调逾 1,000 个子智能体， 在 8 天内从零构建出可在笔记本电脑启动的原型操作系统 ；并以约 1,000 个代理在 30 小时内完成费马大定理的 Lean 形式化证明，远快于此前
    11 天的纪录。 科学研究也被列为重点。Anthropic 表示，Fable 5.2 解决了两个与黑洞物理及全息对偶相关的开放问题；Mythos 5.2 则提出预测腺相关病毒衣壳整体结构的新方法，在测试中对
    34 个衣壳成功建模 28 个，可能为基因治疗研发提速。 目前，Fable 5.2 已在 AWS、Google Cloud 和 Microsoft Azure 等平台开放；Mythos 5.2 则需通过
    Cyber 或 Life Sciences 验证计划申请使用。（来源：网易科技） 研究显示 OpenAI ChatGPT
