  fact: 11 月 9 日晚, 里斯本。近两万人的体育场里，一位中国创始人用中文讲起了飞行汽车。 这是 Web Summit 开幕式的主舞台。台上的人是小鹏汇天创始人赵德力, 舞台两侧停着他带来的产品:分体式飞行汽车「陆地航母」的陆行体和飞行器。据小鹏汇天介绍,
    这是首个登上 Web Summit 主舞台的飞行汽车企业。 比产品本身更值得注意的, 是这次出场的方式:中文演讲, 主舞台, 面对全球创业者、投资人和监管从业者。 一场不太一样的「出海」 Web
    Summit 创立于 2009 年, 常被称为「科技界的奥林匹克」。马斯克、微软总裁布拉德·史密斯、英国前首相布莱尔都在这里演讲过。今年的参会者来自 150 多个国家和地区, 超过 7 万人,2000
    多家媒体到场。 对创业公司来说, 这里是找钱、找合作、找话语权的地方。 今年的中国面孔格外多:小米、腾讯、稀宇科技、智元机器人、宇树科技、银河通用、优必选都在里斯本。开幕式入场环节, 各国代表手持国旗进场,
    走在最前面的是中国和东道主葡萄牙。 官方的说法是, 中国企业正在「从走出去到扛大旗」。这个表述有宣传味, 但背后的变化是真实的。早期出海, 卖的是产品, 比的是性价比和渠道。现在的出海, 开始争的是赛道规则、技术路线和叙事权。
    另一个信号来自主办方。据稿件披露,Web Summit 正在布局东亚, 计划在中国内地落地相关峰会活动。顶级科技会议开始「向东看」, 也说明中国企业在前沿赛道上已经是它绕不开的一方。 陆地航母：先解决「飞行汽车怎么用」
    飞行汽车喊了很多年, 卡住的往往不是飞起来, 而是飞完以后:飞行器放哪、怎么挪、怎么充能。小鹏汇天把这三件事概括为「移动难、停放难、补能难」,「陆地航母」就是对着它们设计的。 核心思路是分体:一台车加一台飞行器。
    两部分靠车载自动分合机构连接, 约 5 分钟即可完成自动分离与结合。陆行体采用三轴六轮六驱布局, 搭载 800V 碳化硅增程动力,CLTC 综合续航超过 1000 公里。飞行体用「四轴合一」的单杆操纵方式,
    目的是降低驾驶门槛。使用场景上, 它既能满足个人娱乐飞行, 也能用于应急救援、巡逻巡检等公共服务。 这条路线的逻辑是, 地面部分负责解决路上的问题, 飞行器只在需要的时候升空。它不是让一台机器同时做好两件事,
