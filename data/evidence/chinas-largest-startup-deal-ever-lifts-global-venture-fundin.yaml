  fact: Global venture funding in October totaled $59 billion, a 45% jump from a year earlier, per Crunchbase
    data, in large part due to a record-setting deal for China’s DeepSeek . The company’s $15.9 billion
    funding round marked the largest-ever venture deal for a Chinese company ever, and came in the same
    month that two other frontier labs raised blockbuster Series A rounds totaling at or close to $1 billion.
    The bulk of October’s venture funding was invested in the two leading countries for startup investment,
    with companies based in the U.S. and China raising $28 billion and $20.6 billion last month, respectively.
    The last time more than $20 billion was invested in China in a single month was June 2018, when Ant
    Group raised $14 billion in its Series C funding. Funding concentration Funding concentrated in seven
    companies that raised billion-dollar rounds, accounting for just over 40% of October’s venture funding.
