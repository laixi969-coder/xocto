- id: ev-97c6bc350ce54188
  project_slug: github-3
  url: https://www.v2ex.com/t/1239311
  title: 一语成美图的 SKILL
  published_at: '2026-09-03T12:21:34Z'
  collected_at: '2026-09-03T14:36:21Z'
  source_kind: product
  tier: independent
  fact: "想在文档里配张图，手写 SVG 太费时间，画图工具导出来的东西进不了 git ，Mermaid 又是把排版交给引擎，你说不上话。`svg-diagram` 走的是第三条路：你用一句话说要什么图，agent\
    \ 手写一份 SVG 给你，直接放进 README 或文档站就能用。\r\n\r\n下面每张图都是这么来的，附上当时说的那句话。图里全是中文标签，不用额外配字体。\r\n\r\n## 装上\r\n\
    \r\n```bash\r\nnpx skills add bybit-exchange/svg-diagram -g\r\n```\r\n\r\n嫌记不住命令，把这句话丢给你的 agent 也一样：\r\
    \n\r\n```\r\n帮我装一下 svg-diagram skill： https://github.com/bybit-exchange/svg-diagram\r\n运行 npx skills\
    \ add bybit-exchange/svg-diagram -g\r\n```\r\n\r\n它会认出你本机装了哪些 agent ，按各家的约定写好路径。Claude Code 在 `~/.claude/skills/`，Codex\
    \ 、Cursor 、Gemini CLI 、Copilot 、opencode 、Antigravity 共用 `~/.agents/skills/`，其它四十多个 agent 各按自己的目录。去掉\
    \ `-g` 就只装进当前项目。\r\n\r\n装完开一个新会话，说「画一张 XX 架构图」。agent 应该主动说它在用 `svg-diagram`。没说就是没触发，重开一次会话再试。\r\n\r\
    \n## 开口的时候说清五件事\r\n\r\n图画歪，多半是信息没给够。这五项给齐，第一版基本就能直接用：\r\n\r\n- 要哪种图。架构图、流程图、泳道图、时序图，说法不同，骨架就不同\r\n\
    - 有哪些框，谁跟谁并列、谁在谁下游、哪几个要圈成一组\r\n- 方向。自上而下，还是从左到右\r\n- 颜色想区分什么。按层、按角色、按成功失败，你不说它就自己挑，挑的未必是你想强调的那条线\r\
    \n- 最终多宽。要进 README 就说 700–800 ，窄栏文档说 500–600\r\n\r\n一个能直接改着用的模板：\r\n\r\n```\r\n画一张中文<图种类>：<一句话主题>。\r\
    \n<第一组> = A / B / C ；<第二组> = D / E ；<第三组> = F 。\r\n方向<自上而下 /"
- id: ev-b1d1904a722a9d4a
  project_slug: github-3
  url: https://www.v2ex.com/t/1239308
  title: 为了让团队里每个人的 AI 之间可以更好的协作和共享业务上下文，我做了一个开源产品
  published_at: '2026-09-03T12:14:08Z'
  collected_at: '2026-09-03T14:36:21Z'
  source_kind: product
  tier: independent
  fact: "## 背景\r\n\r\n现在我们的团队里，运营、售后等角色也都在用 AI 辅助解决问题和开发网站，网站用于解决自己的工作中遇到的问题或者团队的问题，或者给外部用户做的功能。\r\n\r\
    \n一开始都很好，解放了研发的很多精力，但是紧接着就是：\r\n研发需要帮助团队进行部署，\r\n研发需要授权各种 ak sk 给团队，\r\n非技术人员和 AI 沟通开发网站时，有些技术决策只能求助研发\r\
    \n团队里的每个成员需要给其他人补充自己角色上的业务上下文以帮助他人的 AI 完成工作。\r\n\r\n为了解决这些公司里实际存在的问题，我做了一个产品：\r\n\r\n## 解决的问题\r\n\r\
    \n- 让每个成员的 AI 独立完成交付：一名成员——即使不编写代码——从开发到上线所需的 Skill 、MCP 配置、环境变量、数据库账号与部署能力，均由平台按权限直接下发至其本地 AI ；缺少权限即时申请，缺少上下文即时求助，无需自行搭建环境、无需四处索取密钥、无需等待他人配合。\r\
    \n- 集中管理：Skill 、MCP 配置、环境变量、数据库账号与部署能力统一纳管，不再分散于各成员本地。\r\n- 权限管控：资源级授权、元数据可见 + 取值受控、申请审批流、审计日志。\r\n\
    - 能力分发：角色模板批量套用，CLI / MCP 自动同步至本地 AI 工作环境。\r\n- 人机协作求助：AI 可主动向团队成员求助，答复沉淀为经验 Skill ，团队知识持续累积。\r\n\r\
    \n\r\n**这个产品不一定适合每个团队，这是完全从我们团队的需求中诞生的，并不是一个足够通用的产品，每个团队可能都有自己的解决这些问题的方法。**\r\n\r\n\r\n\U0001F449\
    开源地址： https://github.com/othorizon/easy-agent-team\r\n\r\n\r\n这个产品已经在团队里运行了一段时间，功能也一直在随着实际场景需求持续迭代中，决定现在发出来是因为想听到更多声音，看一下大家都是怎么解决这些问题的，当然也非常欢迎大家去体验一下这个产品。"
