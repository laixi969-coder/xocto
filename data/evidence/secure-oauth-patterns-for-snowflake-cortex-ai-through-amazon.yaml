  fact: 'Enterprises today need a clear way to extend their authentication and authorization controls
    into the agentic layer, often requiring either broad service account permissions or custom-built auth
    integrations that add operational overhead. When an AI agent running on Amazon Bedrock AgentCore (a
    platform to build, connect, and optimize agents at scale, with any framework or model) needs to call
    the Snowflake-managed MCP server (which exposes Snowflake Cortex Agents as one of its tool types)
    through the Model Context Protocol (MCP), the first question enterprises must answer is: how does
    the agent authenticate? In this post, we walk through three Open Authorization (OAuth) configurations
    we tested on Amazon Bedrock AgentCore Identity , a capability of Amazon Bedrock AgentCore: Snowflake
    OAuth (per-user, no external Identity Provider, or IdP), three-legged OAuth with a third-party Identity
    Provider (corporate single sign-on, or SSO), and two-legged OAuth with a third-party Identity Provide'
