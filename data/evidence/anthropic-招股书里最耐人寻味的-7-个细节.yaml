  fact: "作者｜Techno 之王 \n 编辑｜靖宇 \n   \n \n 当地时间 9 月 28 日，外媒披露了一份 Anthropic 的 IPO 招股书。 \n 先要说清楚这份文件的性质。它并不是\
    \ Anthropic 主动公开的版本。今年 6 月，Anthropic 以公益公司身份向美国证交会秘密递交了 S-1 注册声明草案，为普通股首次公开发行做准备。按照规则，公司要在向机构投资者路演前至少\
    \ 15 天公开递交修订版 S-1，完整财务数据到那时才会被外界看到。路透此次看到的是一份尚未公开的版本， Anthropic 对此拒绝置评 。 \n 这意味着其中的数字仍可能随证交会的审阅意见调整，不少细节也只能通过路透的转述窥见一角。\
    \ \n 但如果这份文件大体反映了 Anthropic 最终交给公开市场的样子，它的分量很难被高估。这次上市的估值目标，是 Anthropic 自己 5 月估算的 9650 亿美元的两倍以上，也就是超过\
    \ 2 万亿美元。 \n  这是 ChatGPT 引爆这轮 AI 浪潮近四年来，第一家把完整账本摊给公众投资人的前沿大模型实验室。  \n 在此之前，这场 AI 竞赛的资金一直由风投、主权财富基金和科技巨头承担，外界只能从零散的年化收入和融资估值里拼凑这些公司的经营状况。现在，账本第一次有了审计口径。\
    \ \n 极客公园从招股书中，挑出了 7 个最值得细看的地方。 \n 被误读的 420 亿美元亏损 \n 招股书里最先被传播的数字，是 2025 年约 420 亿美元的净亏损。 \n 这个数字很容易被读成「一年烧掉\
    \ 420 亿美元」，实际并非如此。其中约 340 亿美元是一笔会计费用，反映的是那些未来可能转换成 Anthropic 股票的融资工具估值上升，而不是公司经营业务花掉的钱。 \n 这就产生了一个反直觉的结果。\
    \ Anthropic 越值钱，它在账面上「亏」得就越多 。2025 年恰好是它估值暴涨的一年，这笔费用也被同步放大。 \n 真正反映经营状况的是另一组数字。收入从 3.86 亿美元增长到 45.9\
    \ 亿美元，增幅 1088%；经营亏损则从 29.8 亿美元扩大到 80.6 亿美元。 \n 收入涨了约 12 倍，经营亏损扩大不到 3 倍，规模效应确实在出现。但一年 80 亿美元的经营亏损，放在任何一家准备上市的公司身上，都是需要反复解释的数字。\
    \ \n 650 亿美元年化收入的坑 \n 招"
