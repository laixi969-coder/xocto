  title: 离开剪映后创业，她想把一支设计团队装进 AI 工作台
  published_at: '2026-08-26T07:10:12Z'
  collected_at: '2026-08-29T03:43:29Z'
  source_kind: market_signal
  tier: independent
  fact: "头图来源：OJO 官网 \n   \n 极客公园获悉，前剪映中国负责人张琪智已离职创业，创办 AI 产品原型设计工作台 OJO，并于近日完成近亿元首轮融资，由顺为资本、联想创投联合投资，高鹄资本担任独家财务顾问。\
    \ \n 这是张琪智离开字节跳动后的第一个创业项目。她于 2017 年加入脸萌担任产品经理，2018 年随团队进入字节，此后长期参与剪映相关产品与业务。 \n 在外界看来，她在剪映的经历是理解这次创业的重要背景：经历了一款工具产品从\
    \ 0 到 1、再到大规模增长后寻找新曲线的完整过程。而当 Claude Code、Codex、Cursor 等 coding agent 让「做出一个产品」越来越容易，她把注意力转向了产品生产链路中另一处尚未被充分解决的断点——设计判断，以及这种判断如何在产品、设计与开发之间连续传递。\
    \ \n OJO 将自己定义为「Design Agent Team Workspace」。用户可以在一个工作台中，用自然语言完成产品思考、界面设计、迭代和代码交付。它所要回答的问题是：当 UI 生成、设计编辑和设计转代码逐渐普及后，一层连接设计与开发的工作台，为什么仍值得成为独立产品？\
    \ \n 张琪智的答案是，模型越强，越需要系统把能力调度到具体场景。OJO 希望把产品定义、视觉设计、交互迭代与代码交付放进一条连续流程，减少判断在角色交接中被稀释。 \n 这仍是一个等待市场验证的答案。\
    \ \n 离开剪映，等到「自己和技术都准备好」 \n 2025 年之前，张琪智在字节的职业路径颇为顺利。尽管长期在剪映业务线，她持续面对新的问题：从工具产品到全球化，从产品增长到收入和用户心智。变化发生在\
    \ 2025 年，业务进入相对稳定期后，她第一次明显感到，自己的输入开始小于输出。 \n 创业的想法因此出现，但她始终谨慎。大厂里已有成熟的组织网络，负责人更重要的工作是判断方向与推进速度；创业则意味着连组织本身都要从零搭起。她真正等待的是两个条件同时成熟：自己愿意建立一支新团队，模型能力也足以改写产品与设计之间的协作方式。\
    \ \n   \n 图片来源：OJO \n 剪映给了她一张关于产品规模的「地图」。在她看来，0 到 1 与 1 到 100 是两种完全不同的状态。剪映推出海外版 CapCut 和 PC 端时，许多决策都是团队捕捉到早期信号后快速试做、上线，再根据反馈判断是否加大投入。0\
    \ 到 1 的关键，"
