  fact: "比如我们想要深入了解 https://saveto.ai/ 这个网站具体是什么人群在使用，他们有什么需求和抱怨，以及还有哪些痛点没被满足。\r\n\r\n第一，这个 skill 会通过网站背后的用户需求，去各平台收集有此类需求的用户的真实讨论和原话，然后用故事的形式，还原出用户群体的世界，让你在做产品之前，先沉浸式的成为用户本人，那么在以后做功能，写文案，设计转化流程，设计自传播，产品冷启动找用户的时候，都更能游刃有余。\r\
    \n\r\n第二，它会从用户口中，和 google 搜索结果中，尽可能多的寻找解决这个需求的其他产品并分析其功能，然后根据用户现有的讨论和抱怨，找到目前市面上的产品还没解决的问题点，我们的产品就可以从此切入，做第一个，仅此一个的产品，这样的产品发布到用户聚集的社媒平台，应该会有更强烈的自传播意愿\r\
    \n\r\n\r\nskill 分享： https://github.com/cxf37905-max/research-website-demand\r\n\r\n\r\n\r\n上面是我做这个\
    \ skill 的原意，下面是此 skill 对于 https://saveto.ai/ 这个网站的输出结果：\r\n\r\n\r\n# 一、沉浸式理解所有不同用户群体\r\n\r\n本轮现有研究记录共整理\
    \ 44 个需求与用户讨论来源，并另外核验目标产品、竞品、官方规则和受限线索。由于旧记录没有为每一位发言者保存可公开复核的统一用户去重键，本报告不编造“独立用户总数”；能够确认的来源数、帖子赞同和渠道分布在各观点旁分别说明。正式证据主要覆盖\
    \ Reddit 多个职业/学习社区、Hacker News 、Adobe 与 Microsoft/Google 官方社区、Trustpilot 、G2 和扩展商店。Saveto.ai 本身仍没有找到符合标准的独立公开用户评价。\r\
    \n\r\n下面的人物均为多位相容公开用户经历的综合创作，不是单一真实个人、真实采访或逐字访谈。叙事性姓名和转场用于帮助理解；会改变商业判断的任务、痛点、损失、决策和结果均受公开证据约束。\r\n\
    \r\n## 用户群体一：被长课程和考试倒计时夹住的学生\r\n\r\n> **证据覆盖：**这个群体的核心判断至少得到 6 个独立用户讨论来源支持，覆盖 4 个 Reddit 学习/教师社区；另有\
    \ YouTube 官方规则和产品页面提供背景。主要痛点在多个独立帖子中重复出现，但用户材料仍集中于 Reddit ，跨平台与非英语市场的保守独立用户下限未能从旧记录完整回算。\r\n\r\n假设她叫\
    \ Maya ，是一名英语并非母语的护理专业学生。晚上十一点，她打开一段 58 分钟的病理学录播，旁边还有 PDF 、老师的幻灯片和明早要交的小测。她不是懒，也不是“不想学习”；恰恰相反，她怕漏掉一句会出现在考试里的定义，所以每听到陌生名词就暂停、倒回、切到笔记软件，再用自己的话重写。视频才走了二十分钟，墙上"
