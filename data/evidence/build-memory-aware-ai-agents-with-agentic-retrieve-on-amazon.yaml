  fact: Users of a knowledge-grounded application expect it to remember them, not only to search well.
    They ask follow-up questions that make sense only in the context of the previous turn. They expect
    an answer about a policy or a procedure to reflect what they told the application about themselves
    last month. And they still expect every answer to be grounded in the documents they are allowed to
    read, with citations. Whether the application is a customer support assistant, a document chat inside
    a SaaS product, or an internal assistant over company policies, the expectation is the same. Meeting
    that expectation is hard, because the context that would sharpen a search lives outside the knowledge
    base. A user’s location, role, or product tier was often mentioned in an unrelated conversation weeks
    ago. To use it, the application has to store every conversation, extract durable facts from it, decide
