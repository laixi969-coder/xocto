  url: https://zed.dev/
  title: Zed Industries
  published_at: '2026-08-31T15:00:01+00:00'
  collected_at: '2026-09-10T16:51:24Z'
  source_kind: product
  tier: first_party
  fact: Named to Madrona's 2026 Intelligent Applications 40 (Early stage). Nearly every category and stage
    bucket includes at least one company applying AI agents to a specific job to be done and owning a
    domain, from IT service management with Serval and customer service with Sierra to marketing operations
    with Gradial, sales with Clay, legal work with Legora, medicine with OpenEvidence, software engineering
    with Cognition, CodeRabbit, and Zed, CRM with Clarify, quote-to-cash with Roadrunner, and design with
    Paper. Add in Cognition (Windsurf), CodeRabbit, and Zed, and it becomes clear that AI-assisted and
    AI-driven coding is quietly pulling in some of the largest checks on the entire list.
