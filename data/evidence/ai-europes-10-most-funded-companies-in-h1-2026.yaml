  fact: European AI funding in H1 2026 was characterised by a high concentration of capital in a few large
    transactions, alongside a broad base of smaller investments. Several rounds exceeded €500 million,
    highlighting the capital-intensive nature of advanced AI research and infrastructure development.
    At the same time, numerous seed and pre-seed rounds reflected continued investment in early-stage
    AI companies. Geographically, the UK led in both funding value and deal activity, followed by France
    and Germany. Together, these three markets attracted the vast majority of capital, while smaller investments
    across the Netherlands, Spain, Switzerland, the Nordics and Central and Eastern Europe reflected the
    broader geographical spread of Europe's AI ecosystem. The industry also showed increasing diversification,
    with funding supporting AI models, computing hardware and data infrastructure, alongside applications
