  fact: "Anthropic 与 Akamai 达成 7 年 116 亿美元协议，扩充 CPU 算力 \n 9 月 26 日消息，云计算、网络安全、内容交付企业 Akamai 当地时间 24 日宣布大幅扩展与\
    \ Anthropic 的合作关系，两家公司签署了一份为期 7 年、价值 116 亿美元（现汇率约合 779.2 亿元人民币）的合同。 \n 根据协议，Akamai 将以其分布式人工智能基础设施和软件满足\
    \ Anthropic 日益增长的 CPU 工作负载需求。这 116 亿美元承诺对应 Akamai 的 55 亿美元额外总资本支出。双方还可将合同扩大最多 90 亿美元。 \n 作为两家企业加强战略合作的一部分，Akamai\
    \ 已向 Anthropic 发行认股权证，允许 Anthropic 购买 Akamai 至多 5% 的已发行普通股，其中 2% 与本次承诺绑定、剩余 3% 则和后续的追加承诺相关。（来源：IT\
    \ 之家） \n   \n SK 海力士旗下 Solidigm 最快明年在美 IPO，估值或高达 1500 亿美元 \n SK 海力士旗下美国子公司 Solidigm 正在评估上市计划，潜在估值最高达\
    \ 1500 亿美元，有望成为美国半导体史上规模最大的 IPO。 \n 据路透援引知情人士透露，Solidigm 本周已与多家投行举行竞标会议，就 IPO 承销角色展开角逐，标志着上市进程迈出实质性一步。\
    \ \n 该公司计划最早于明年完成上市，目标募资规模约 150 亿美元。消息人士提醒，包括交易规模和时间表在内的相关计划仍处于早期阶段，可能因市场状况而调整。 \n 据彭博报道，今年 8 月，Solidigm\
    \ 与 CoreWeave 达成多年期协议，向后者提供企业级固态硬盘（SSD）容量。Solidigm 的其他客户还包括 Vast Data、戴尔和腾讯。 \n 若最终成行，此次上市将为这家专注于\
    \ NAND 闪存和企业级固态硬盘的公司提供独立估值，同时借助人工智能基础设施投资热潮吸引市场资金。 \n AI 相关需求持续推动半导体硬件股上涨，Solidigm 所在赛道正处于这一趋势的核心位置。\
    \ \n 在推进上市计划的同时，Solidigm 亦在考虑扩大本土生产能力。据媒体此前报道，该公司正评估在美国建设 NAND 闪存芯片工厂的方案，纽约州北部已成为选址的主要候选地。（来源：华尔街见闻）\
