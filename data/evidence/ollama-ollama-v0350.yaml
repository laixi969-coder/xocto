  fact: "## Decision models\r\n\r\nOllama now supports decision models through `/v1/systemone`, based\
    \ on [TypeSafe’s Jev API](https://typesafe.ai).\r\n\r\nDecision models return choices, probabilities,\
    \ and scores instead of text. Use them for tasks such as ticket triage, model routing, and content\
    \ classification.\r\n\r\nAvailable models:\r\n- [**Nimble**](https://ollama.com/library/nimble) from\
    \ Bespoke Labs\r\n- [**Tev1**](https://ollama.com/library/tev1) from Together AI\r\n\r\n```sh\r\n\
    ollama pull nimble\r\n```\r\n\r\nSend context and one or more questions:\r\n\r\n```sh\r\ncurl http://localhost:11434/v1/systemone\
    \ \\\r\n  -H 'Content-Type: application/json' \\\r\n  -d '{\r\n    \"model\": \"nimble\",\r\n    \"\
    state\": \"Our checkout has returned 500 errors since 9am.\",\r\n    \"questions\": {\r\n      \"\
    label\": {\r\n        \"type\": \"choice\",\r\n        \"instructions\": \"Which label fits this ticket?\"\
    ,\r\n        \"criteria\": {\r\n          \"billing\": \"Payments and refunds\",\r\n          \"bug\"\
    : \"Software errors\",\r\n          \"account\": \"Login and account access\""
