  fact: 作者｜桦林舞王 编辑｜靖宇 Agent 能进门了，也能付钱了。 Agent 替用户「消费」的时代，终于到来了。 美国时间 2026 年 11 月 13 日，两家公司两场发布会同天发生。一边是企业级对话式智能体公司
    Sierra 联合 Meta 正式发布个 人代理协议 Poppy v1.0，解决助手怎么「进门」的问题 ；另一边是 OpenAI 推出面向个人助手 dots 的 ChatGPT Wallet， 解决助手怎么「付钱」的问题
    。 同一天打通进门和结账，本身就足够耐人寻味。更值得留意的，是站在两套方案背后的同一批名字。Visa 和 Mastercard 同时出现在两边的名单里，Shopify、Stripe 这些掌管电商与支付基础设施的公司，则站在
    Poppy 的核心伙伴之列。 Agent 的下一场竞争，表面上看是巨头抢入口，底层的暗线却是一场围绕商业通道的提前占位。 01 个人 Agent 协议，PPP Sierra 与 Meta 联合发布个人代理协议
    Poppy v1.0｜图片来源：Sierra 官方博客 过去，个人助手访问企业网站只能像个隐身访客，商家看不清来者是谁，更不敢把查订单、改地址、订机票或金融预审这类敏感操作交给它。 Meta 和
    Sierra 推出的 Poppy 要解决的核心就是信任 ，它让企业在接到请求时，能用密码学手段确认三件事——来敲门的是哪个助手、它代表哪位用户、到底拿了多少权限。 Poppy 协议的核心，是「门牌」、「地基」和「双向授权」。
    「门牌」 。接入 Poppy 的企业，会在网站标准路径/.well-known/poppy 下放一份配置文件。你可以把它想象成贴在店铺门口的访客指南，写清楚开放了哪些通信端点、怎么登录、允许执行哪些操作。助手找上门时，不用再去瞎猜网页按钮怎么点，先看门牌就能按规矩办事。
    「地基」 。Poppy 没有推翻互联网现有的通信方式，它直接建立在 OAuth 授权、HTTPS 加密传输、OpenAPI 以及模型上下文协议之上。如果用户只是查商品价格，助手可以作为匿名访客对话；一旦涉及账户操作，就必须走授权登录，让企业验明正身。
    「双向授权」 。用户这一端可以决定，向助手开放只读权限，还是允许修改信息与交易；企业那一端则划定外部助手在自家地盘上最多能走多远。两边都点头，一次交互才算成立。 从发布信息来看，Sie
