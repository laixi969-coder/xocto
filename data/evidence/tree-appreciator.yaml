  fact: 'Tool: Tree Appreciator Another game experiment with Claude. This one used the default Claude
    iPhone app (chat mode, not Claude Code mode) where I prompted Claude Opus 5.5 Max with: Build a three
    js game called "Tree appreciator" - it shows you two algorithmically generated trees and the game
    mechanics is about appreciating the differences between them. Think hard about how to make sure it
    is both fun and beautiful. Somewhat embarrassingly given my recent talk , I''ve found that telling
    Opus 5.5 "make sure it is fun" works uncomfortably well. In this case Claude crunched for 3 hours
    and 7 minutes before retuning a cosy little spot-the-difference game with music and animation and
    achievements that''s quite compelling to play. Tags: game-design , javascript , ai , generative-ai
    , llms , claude , vibe-coding , three-js'
