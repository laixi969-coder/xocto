  fact: Accenture has acquired Sagacity , a UK-based data and customer intelligence firm. Founded in 2005
    and headquartered in London, Sagacity brings differentiated data assets, AI-enabled technology and
    deep customer intelligence expertise. The company specialises in analysing customer data to help businesses
    better understand customer behaviour and improve their services. Its team of more than 140 employees
    will join Accenture, bringing expertise in data analytics, AI, and customer intelligence. The acquisition
    directly addresses growing client demand to connect data, AI and operations infrastructure into programmes
    that drive measurable business results, and thus help organisations turn customer insight into more
