  fact: 'Release: datasette-vega 0.7 A new release of Datasette''s longest untouched plugin, for rendering
    charts (using Vega-Lite ) against data in a table or custom query. The last release was in July 2018!
    I finally bumped it for compatibility with the latest Datasette alphas, plus some cosmetic tweaks
    to make it work better with Datasette Lite . (Datasette Lite just gained the ability to run JavaScript
    plugins like this! I''ll write more about that soon.) Since it works with Datasette Lite, the live
    demo in the README now links to this demo on Datasette Lite . Tags: datasette , visualisation , datasette-lite'
