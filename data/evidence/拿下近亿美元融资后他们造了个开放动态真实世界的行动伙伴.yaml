  fact: 作者｜苏子华 编辑｜郑玄 博尔赫斯 写过一则著名的寓言。一个帝国的制图师们绘制了一张与领土等大的地图，精确到每一寸土地、每一条河流。后代人发现这张地图毫无用处，把它弃置在荒野中，任其腐烂。
    真正在一个地方走路的人，靠的从来不是一张一比一的图纸，而是脚底的感觉、眼睛的判断，以及走错了再调整的能力。 具身智能行业正在上演这则寓言的现实版。 过去两年，人形机器人学会了跳舞、翻跟头、弹钢琴。但一个略显尴尬的事实是，这些编排的动作，大多是提前反复排练，且发生在受控的封闭环境里。如果放在现实社会的开放环境中，这些机器人该怎么办，它们到底能帮你干什么？
    费莫一科技 （PHYMI）试图回答这个命题。成立初期便完成近亿美元种子轮融资，由 IDG 资本领投，云启资本、滴滴出行、复星锐正、耀途资本、禾赛科技跟投。融资消息仅公布一个月后，它便推出首款行动伙伴。
    行动伙伴 Sagi｜图片来源：PHYMI 10 月 28 日，Sagi（萨其玛）正式发布，是行业内首个定位「行动伙伴」的 Physical Agent。Sagi 采用 四轮足 、人形上身、背着小型货箱的机器人，英文名取自人马座。辨识度鲜明的身体，它没有追求像人，围绕长程移动、操作与承载共同设计；「行动伙伴」则定义了它与人的关系：理解人的目标，能够独立担当，也能够相互协作。
    但它具备极其实用、且当下行业里极为罕见的能力：接收一个目标，然后在一个开放、动态、真实的场景里，将跨场景移动与物品操作连接起来，遇到需要判断或帮助的情况，再通过 LINK 与人协作，持续推进任务，完成全流程交付。
    费莫一创始人 刘念邱 ，此前是元戎启行的技术合伙人、董事，亲历高阶自动驾驶从 L4 研发运营走向规模化量产的关键阶段，参与无图智驾方案落地，以及技术体系向端到端模型、 VLA 大模型演进。再往前，他是英特尔的高级工程师，做过智能硬件的连续创业者。
    在具身智能赛道愈发拥挤的 2026 年，PHYMI 没有追求酷炫 demo，而是选了一条看似朴实、实则困难得多的路。在刘念邱看来，「开放场景才是真正的考场。」 为什么是「行动伙伴」？ 费莫一的第一款产品，绕开了行业里最普遍的叙事。
    刘念邱告诉极客公园，更希望用「伙伴」来定义他们推出的 Physical Agent，「因为我们首先关心的是，用户希望它帮助自己完成什么，以及它能够创造什么价值。」 在他看来，Phys
