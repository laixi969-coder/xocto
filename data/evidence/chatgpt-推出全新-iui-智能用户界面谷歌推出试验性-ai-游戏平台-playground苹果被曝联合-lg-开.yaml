  fact: "2026 年诺贝尔化学奖公布：二人因解开不对称有机合成难题获奖，其中一位 96 岁高龄 \n 10 月 7 日，2026 年诺贝尔化学奖正式公布，瑞典皇家科学院决定将 2026 年诺贝尔化学奖授予亨利\
    \ ·B· 卡甘（Henri B. Kagan）和硖合宪三（Kenso Soai），「表彰他们在不对称有机合成中发现非线性效应和自催化现象。」 \n 有些分子，例如氨基酸，以两种变体形式存在，互为镜像。然而，生物体只包含这些镜像之一。像这样的化学不对称性是如何出现的，长期以来对化学家来说一直是个谜。\
    \ \n   \n 亨利 ·B· 卡甘和硖合宪三因发现这一难题的解决方案而荣获 2026 年诺贝尔化学奖。 \n 亨利 ·B· 卡甘（1930 年出生于法国，当前 96 岁，隶属法国奥尔赛省巴黎南大学）发现了一种操纵化学反应的新方法，可以创建比之前假设的更多的镜像。他的发现对于化学家来说是革命性的，可以帮助开发用于制造药物、香料、香味和新材料的反应。\
    \ \n 硖合宪三（1950 年出生于日本广岛，当前 76 岁，隶属东京理科大学）设计了首个仅形成其中一个潜在镜像的化学反应。除了生命本身，没有人曾实现过这样的壮举。诺贝尔奖官方表示，Soai 反应是有史以来最壮观的化学实验之一。（来源：IT\
