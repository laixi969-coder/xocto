  fact: Mika Games , a gaming investment company founded by Wargaming co-founder Nick Katselapov, has
    raised $10 million in a funding round led by Flint Capital , with participation from several new and
    existing investors. Early-stage mobile game studios often struggle to secure financing for user acquisition,
    as funding providers typically require an established marketing track record. This can include several
    months of campaign data, between $300,000 and $500,000 in previous marketing spending, and evidence
    of predictable returns. Mika Games aims to address this gap by investing in studios before their user
    acquisition performance has been fully established. Its model combines equity investment to support
