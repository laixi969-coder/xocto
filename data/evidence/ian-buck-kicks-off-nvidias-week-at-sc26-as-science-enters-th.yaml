  fact: NVIDIA’s Ian Buck kicked off the company’s week at SC26 in Chicago on Monday with new tools for
    AI agents, software that can plan experiments, run code and check results on researchers’ own systems.
    In NVIDIA’s special address, Buck announced Nemotron for Science , the Rubin HPC GPU and an expanded
    Vera CPU platform for high-performance computing . He also detailed a new collaboration in quantum
    computing with IBM and Fermi National Accelerator Laboratory . “The frontier of computing and the
    new scientific stack is going to be simulation, as always, but combined with AI and the future of
    quantum,” said Buck, vice president of hyperscale and high-performance computing at NVIDIA. Buck opened
    the talk by looking back to his first public talk on CUDA, at an SC06 tutorial in Tampa, Florida,
    20 years ago. NVIDIA now offers more than 1,000 CUDA-X libraries , he said. Open Models for Science
