  fact: "美国 ip 网页能打开，但是登录不上,这个页面打不开： https://auth.muse.ai/aymh/?origin=https%3A%2F%2Fmuse.ai\r\n\r\n都下载的客户端还是直接在网页里使用？\r\
    \n\r\n1 、https://www.hyperbrowser.ai/ 注册的，进去也没有要验证啥的，直接邮箱和验证码就登录了，但是登录后聊天页面要求绑定 gmail 账号，打开是登录 gmail,感觉不安全就没有登录，推出了\r\
    \n2 、手机用美 ip ，用 gmail 注册后就是进入 waitlist 。"
