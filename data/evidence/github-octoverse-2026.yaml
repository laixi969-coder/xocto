  fact: 'GitHub Octoverse 2026 I''m at GitHub Universe today (GitHub gave me a free ticket through their
    "GitHub Stars" program). EVP Jay Parikh just announced this year''s Octoverse report, and highlighted
    these numbers in particular: This is a pretty stark representation of the impact of agentic engineering
    on GitHub. In 2026, merged pull requests tripled in less than a year to 220 million per month. Commits
    more than tripled to 7.38 billion per month, with most of that increase in the second half of this
    year. New repository rate doubled this year, to 30.3 million per month. The report includes new numbers
    by industry, and breaks out numbers for repositories that involve "interoperability or reverse engineering".
    The methodology section includes notes about how they did this: Top countries by pushes to public
    repositories, adjusted by profile location . Pushes from each country were summed across the Octoverse
    year. To adjust for biases caused by VPN usage, LLM classification was used to extra'
