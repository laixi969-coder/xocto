  fact: "头图来源：视觉中国 \n 两家中国大模型公司，在五天里先后交出了上市后的首份中报。 \n MiniMax 先出：上半年收入 1.17 亿美元，同比增长 283%；8 月 ARR 超过 8\
    \ 亿美元。智谱随后公布：上半年收入 9.54 亿元人民币，同比增长近 400%；8 月 ARR 达到 16 亿美元。 \n 如果只看 ARR，结论似乎很简单：智谱更高，MiniMax 紧随其后；两家公司都在讲\
    \ Token 调用量暴涨、企业客户增加、模型能力开始换来收入。 \n 把数字放回财报，事情会变得复杂一些。 \n 智谱上半年确认收入约 1.42 亿美元，MiniMax 为 1.17 亿美元，两者实际收入规模相差不远；两家的经调整亏损也几乎相同，都接近\
    \ 3 亿美元。ARR 代表某个时点的收入速度，但无法直接替代收入、毛利和现金流。 \n 两家公司都还没有走到盈利那一页。两份中报里，「期内亏损收窄」都受到上市后优先股转换带来的会计因素影响；如果剥开这层，研发和经营投入其实仍然在高位。\
    \ \n 不一样的是两家公司正在把模型卖向哪里。 \n 智谱的 API 收入已经占到总收入的 86.5%，它开始把模型推到 Coding、网安和长程任务的工作现场；MiniMax 的企业服务收入快速增长，同时保留着全球化、多模态和\
    \ AI 原生产品的基本盘，它更关心如何把每一单位智能做得更便宜，让更多用户、更多 Agent 和更多创作场景消费它。 \n 两份中报，展现的是中国大模型商业化的一次分层。 \n 一、 智谱：本地化退潮，API\
    \ 已成主引擎 \n 先看智谱的中报。上半年营收 9.54 亿元，同比增长 399.7%，已超过 2025 年全年 7.24 亿元；毛利 2.52 亿元，毛利率 26.4%；研发支出 21.31\
    \ 亿元，同比增长 33.6%。 \n   \n 图片来源：智谱中报 \n 增长背后是业务结构的明显转换。开放平台与 API 业务收入 8.25 亿元，同比增长 2735.7%，占总收入 86.5%——\
    \ 去年同期这个数字只有 15.2%。过去承担基本盘的本地化部署退到更靠后的位置：企业通用模型相关收入 6704 万元，同比下降 54.6%。 \n 智谱正在从 \"把模型部署进客户机房、签一笔项目确认一笔收入\"\
    ，转向 \"把模型放在云上、按调用量持续收费\"。前者更像传统项目生意，强调交付、安全和客户关系；后者依赖模型能力、开"
