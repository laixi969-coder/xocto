  fact: 作者｜Lilyann 编辑｜靖宇 网上冲浪这么多年，你一定有过这样的经历：想取消一项自动续费，却怎么都找不到入口；明明是商家多扣了钱，申请退款却要层层转接；为了几十块钱，和客服解释半个小时，最后听到一句「非常抱歉，暂时无法为您处理」。
    钱不一定很多，但就是咽不下这口气。更憋屈的是，你明明有道理，却没时间跟它耗。企业有一整套客服系统，而你可能只有一个午休时间。 现在，这种不对称的关系，终于迎来改变了。 AI，尤其是 Personal
    AI 的出现，让消费者可以把这些生活琐事，交给 AI 来处理，无论是邮件往来，或者是 App 上的申诉，Agent 都能一键代劳。 但是，新的问题，也出现了。 好消息是，AI 终于可以替你打客服电话了。坏消息是，电话那头可能也是
    AI。 一边是企业派出的 AI 客服，一边是消费者派出的 AI 助理。双方不知疲倦地讨论一笔十几美元的账单争议，真正的消费者早就去忙别的了，只剩两个 AI 还在礼貌地交涉。 听起来像个黑色幽默，但在
    2026 年的硅谷，这已经是创业公司认真研究的商业问题。 10 月，企业客服 AI 公司 Decagon 推出了 Personal Agent Gateway，试图让消费者的 AI 助理直接与企业客服系统沟通。它甚至专门发表文章，讨论一种前所未有的客户：
    「永远不会疲倦的客户」（The Customer Who Never Gets Tired）。 Personal Agent Gateway 框架｜图源：Decagon 一个真人被拒绝退款，可能再问两次就放弃了。但一个
    AI 呢？它可以查找政策、整理证据、寻找其他解决办法，直到把事情办成，或者确定确实办不了。 最近，一款名为 Pine Computer 的产品在硅谷科技圈引起了关注。10 月，Pine AI 发布了一套专门为
    AI 设计的云端计算环境，相关 X 帖子迅速传播。据团队介绍，帖子在发布当天获得了约 240 万次浏览。11 月，Pine 团队又发布了 Pine Phone。它让 AI 在操作网页、处理文件的过程中，也能直接拨打真实世界的电话。
    极客公园与 Pine AI 联合创始人兼 CTO 孙雨润，在 NUS 在硅谷举办的新全球企业家论坛聊了聊。 Pine 成立于 2024 年 6 月，核心团队来自实时音视频公司声网 Agora，已完成
    2500 万美元
