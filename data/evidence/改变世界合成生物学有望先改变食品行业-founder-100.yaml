  fact: 本文首发于 Founder Park 公众号 · 2022 年 12 月 28 日   合成生物会如何影响我们？    美国素肉生产公司 Impossible Foods 推出的「人造肉」，可能首次让大众意识到了合成生物的用途。不过在当下，「   日常生活中合成生物学的产品没有特别多，大  部分还属于『原材料供应』，离终端消费者还有一定距离。     」国内合成生  物公司倍生生物的联合创始人康康这么说道。      与大众的认知不同，倍生生物并没有选择大宗化工方向设计产品，而是投入到了食品赛道，使用合成生物技术研发了低度酒饮料，主要原因是创始人们喜欢喝酒，对酒有鉴赏能力，还有一个原因是，「
    让品牌方感知，生物技术是可以改变食品这样一个非常传统的行业的 」。    随着基因编辑、基因合成等技术的进步，以及人工智能的加入，2021 年以来，合成生物行业发展到了一个新的商业阶段，从 2021
    年到 2022 年 3 月份，国内就有 16 家合成生物企业完成融资，融资总额超 25 亿元。如何看待合成生物学和计算机、人工智能的结合？以及合成生物公司的壁垒到底是什么？    以及，合成生物学什么时候会为行业带来历史性的变革？针对这些问题，我们和康康进行了一场长聊。                     日常生活中合成生物学的产品也没有特别多，大部分成熟应用是「用生物法替代化工来实现特定原料的生产」。    整个人类理解生命的过程是一个逆向工程，跟计算机的
    bottom-up 往上搭建的模式不太一样。    只有拥抱新的技术，拥抱新的生产工艺，拥抱从研发到生产的整个链条的升级，才能拥抱未来。而不是说把所有的钱花在烧钱、做品牌运营，你就有未来。    架构化的基因组显然是一个非常强大的壁垒，因为任何人想要构建这种架构化的基因组，都需要耗费巨大的时间、成本和人力。                    01           合成生物学产品         尚未大规模进入日常       Founder
