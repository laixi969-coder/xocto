  fact: Oslo-based Solvera has raised $6.3 million in a pre-seed funding round to develop its AI-native
    engineering firm for the construction industry. The round was led by Seedcamp , with participation
    from Construct Venture, Inception Fund, Momentum, Obos Ventures, PSV Tech, Sondo, and The Nordic Web
    Ventures, alongside angel investors including Spacemaker founders Anders Kvåle and Håvard Haukeland.
    Founded by Arif Mirza (CEO), Pål Rasmussen (CTO), and Thorvald Thorsnes (CCO), Solvera is building
    an engineering firm that combines AI technology with the expertise of experienced building engineers.
    Rather than offering software licences or charging for consulting hours, the company provides end-to-end
    engineering services, taking projects from initial requirements and constraints through to coordinated,
    construction-ready designs. At the centre of its approach is a purpose-built operating system that
