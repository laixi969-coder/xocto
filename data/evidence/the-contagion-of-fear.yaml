  fact: "The contagion of fear   \nBryan Cantrill responds to the  tweet by former Anthropic employee\
    \ Jacob Coxon  confirming that many Anthropic researchers believe AI \"could kill us all by the end\
    \ of the decade\". \n Bryan shares a story of his own youthful mistakes causing unjustified panic\
    \ among less technical peers, and warns against doing the same: \n \n These ghoulish claims strike\
    \ brazenly at the hearth, and given the obvious importance of AI, it is unsurprising that they have\
    \ leapt into the mainstream, with people asking the natural question:  how would that happen?  The\
    \ answers always rely on hand-wavy extrapolation into the future; for example, Jacob Coxon cites \"\
    hacking critical infrastructure\" and \"extinction-level bioweapons\" without further elaboration.\
    \ But Coxon is not an expert on critical infrastructure, nor on bioweapons — nor, for that matter,\
    \ on extinction. [...] \n That said, we should not expect the public to understand LLMs, critical\
