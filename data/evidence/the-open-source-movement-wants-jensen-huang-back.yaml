    Nvidia began circulating on social media, and by Monday it listed some notable signatories, including
    Elon Musk and several influential Nvidia researchers. But comb through the more than 115,000 names
    and you’ll notice a significant faction of Huang’s supporters—higher-ups from Hugging Face, a hub
    for sharing AI models, and venture capital firms Andreessen Horowitz and Sequoia Capital—come from
    a particular slice of the tech world. These names have a vested interest in the development of open-source
    AI, models that, unlike ChatGPT or Claude, can be downloaded and run independent of large tech companies.
