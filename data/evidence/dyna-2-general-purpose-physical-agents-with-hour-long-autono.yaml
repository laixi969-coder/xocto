  fact: 'Watch along AIE NYC and join us at AIE CODE in SF next month! This episode includes a live demo
    of the Taku robot that is best enjoyed on YouTube . Last month, Dyna made waves by announcing Dyna-2
    , a world-action model pre-trained on one million hours of human video, claiming several new scaling
    laws on human data across four orders of magnitude . They have now followed up the model with a physical
    robot agent, Dyna-2.1 , that has to be seen to be believed: In his talk at AIE this year, Jason talked
    about how the real challenge for robotics in the real world is reliable, long-horizon autonomy , and
    how Dyna got its models to a 99.4% success rate folding restaurant napkins for 24 hours straight,
    including recovering after it pulled over the whole stack. From training a world-action model on over
    one million hours of human video to deploying robots that fold thousands of napkins daily at Din Tai
    Fung , Dyna Robotics is pushing physical AI beyond impressive demos and into real-world prod'
