  fact: 'More money is pouring into Series A rounds, but it isn’t opening the door to more startups. U.S.
    companies have raised $42 billion at that stage this year through October, up roughly 60% year over
    year, while deal counts remain on pace with the past few years, Crunchbase data shows. The numbers
    point to an increasingly divided early-stage market. AI is fueling demand for capital and helping
    some startups grow at unprecedented speeds, while others struggle to turn their first customers into
    repeatable sales. Investors are responding by moving in opposite directions: Some are writing much
    larger checks at seed to get ahead of the competition, while others are waiting until Series B or
    beyond for clearer evidence that a business is taking off. (At Series B, too, we’re seeing a similar
    trend of fewer but larger deals.) That leaves companies still proving their growth potential navigating
    a Series A funding crunch even as capital floods into the fastest-growing businesses. The low point
