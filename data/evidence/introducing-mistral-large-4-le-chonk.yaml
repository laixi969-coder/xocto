  fact: "Introducing Mistral Large 4: Le chonk   \nMistral are back in the game. Today they're releasing\
    \ a preview of Mistral Large 4, a 1 trillion parameter, 49 billion active parameter model trained\
    \ on their own cluster of 3,800 NVIDIA Grace Blackwell GPUs. \n The preview is available via their\
    \ API. They promise to release the open weights model at the \"end of this month\". \n The model only\
    \ supports two reasoning levels - \"none\" and \"high\" - via the Mistral API. Here are  both pelicans\
    \  - the \"high\" one looks better, though surprisingly it only used 2,717 output tokens compared\
    \ to \"none\" which used 3,275: \n   \n On Artificial Analysis  it scores 38 , just behind DeepSeek\
    \ 4.1 Flash, which is a 552B model. It's a  huge  improvement on last December's Mistral Large 3,\
    \ which drew  this terrible pelican  and  scored 9 on AA . \n It's certainly not a Fable-class model,\
    \ but it's great to see Mistral put out a model that's back to being maybe about 6 months behind the\
    \ frontier.\n\n       Via  Hacker News"
