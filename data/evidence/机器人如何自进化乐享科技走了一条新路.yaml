  title: 机器人如何自进化，乐享科技走了一条新路
  published_at: '2026-09-20T07:15:14Z'
  collected_at: '2026-09-21T00:17:16Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Li Yuan  \n  编辑｜郑玄  \n \n 最近，乐享科技因为一个颇大胆的 claim，引发了不少关注：它提出，其具身智能模型以太大模型能够在部署和执行过程中持续更新，并将这种能力概括为「自进化」，是全球首个能自进化的具身智能模型。\
    \ \n 自进化是一个容易引起争议的说法。「进化」究竟是模型参数发生了变化，还是进行了任务的临时调整？在多大程度上这样的调整能够变成可迁移的新能力？一个模型能够适配不同场景和不同身体，又应该被理解为工程层面的泛化，还是更强意义上的持续成长？在机器人行业仍然需要解决稳定执行问题的阶段，「自进化」显然是一个需要被谨慎对待的判断。\
    \ \n 近日，乐享科技又进行了一场户外直播。按照直播前公布的目标，搭载 Aether 以太大模型的机器人要在户外接受随机点单，完成包括食材和工具处理、烤制、翻面、上菜在内的烧烤任务，并应对临时打断、需求临时增加和场景变化。\
    \ \n 在现场超 30 位专业媒体和线上超 550 万观众的见证下，实际呈现的过程并非每一步都顺利。 \n 机器人完成了部分自主烧烤操作，也出现了停顿、失败和重新调整。乐享科技似乎并不回避这些不完美：它想展示的重点，不是机器人在一个固定流程里零失误地把烧烤做完，而是任务和环境发生变化之后，机器人能否继续寻找信息、调整动作，再把任务推进下去。两个机器人本体全程互相传递任务信息、自主思考决策并合理分工协作。\
    \ \n \n 一场直播当然不能回答关于「自进化」的所有问题，但这种展示方式至少体现出一种相对开放的态度：机器人可以失败，真正需要观察的是失败之后会发生什么。 \n 对机器人来说，「自进化」不能只是一个好听的词。它至少要回答三个问题：第一，机器人能不能发现现实和自己预测之间的偏差；第二，它能不能判断哪些经验值得留下、哪些应该忘掉；第三，它能不能把一次任务、一个场景和一具身体上的经验，迁移到新的任务、场景和身体上。\
    \ \n 当数字世界的 AI 开始讨论自进化，物理世界的 AI 有没有自进化，或许是下一个时代最重要的问题。 \n 为此，我们和乐享科技背后的团队聊了聊他们的模型思路。 \n   \n \n \n\
    \ \n \n \n   01   \n \n \n \n  \n \n \n \n    不是更会模仿，    \n    而是能不能理解真实世界    \n \n 过去几年，具身智能最常见的思路，是把视觉、语言和动作连接起来：机器人看到环境，接收任务，"
