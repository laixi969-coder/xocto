  fact: 'Belgian healthtech company IntelliProve has raised €2.7 million in a seed funding round led by
    Miles Ahead , with participation from Wit-Gele Kruis , imec.istart and several business angels. IntelliProve
    develops software that enables standard cameras in smartphones, laptops and other devices to measure
    health indicators without requiring additional equipment or physical contact. Through a 30-second
    facial scan, the technology provides six biomarkers: heart rate, heart rate variability (HRV), respiratory
    rate, systolic and diastolic blood pressure, and resonant breathing. Healthcare systems face growing
    pressure from ageing populations, staff shortages and rising demand for care. Traditional health monitoring
    often requires dedicated equipment and professional assistance, making these services harder to scale.
    IntelliProve aims to address this by enabling users to measure vital signs remotely through cameras
    in everyday devices. The company''s technology uses remote photoplethysmography'
