  fact: 'We think "did a human read the code?" is an imprecise proxy for "what could go wrong with this
    change, and which check—automated or human—is the right one to catch it?" Asking that question also
    changed when review happens. Before, review was a gate at the end of the road: write the code, open
    a PR, wait for your colleague. Now, review runs continuously, more like spellcheck while you write.
    Most changes have been reviewed and fixed by Claude at least once before a human is asked to look.
    This catches most routine mistakes, and saves team attention for higher-level questions and scrutiny.
    — Addy Osmani, Morgan Westlee Lunt, and Qing Wang , How the Claude Code team does code review Tags:
