  fact: Cities generate enormous amounts of data from cameras, sensors and operational systems, but turning
    it into useful action — for planning, maintenance and public services — remains a challenge. Physical
    and agentic AI offer new ways to close that gap, from digital twins for infrastructure planning to
    vision and service agents, while keeping local governments in control of how sensitive data is processed
    and used. Building on initiatives announced at GTC Berlin , NVIDIA and its partners are expanding
    physical AI and AI agents to cities worldwide. Shared computing infrastructure gives city departments,
    neighboring municipalities and local developers a common foundation to build on — extending services
    without each organization having to acquire and manage resources of their own. Agentic AI for Cities
