  title: 从数据到智能，再到进化：Agent正在重写AI基础设施
  published_at: '2026-10-01T03:21:33Z'
  collected_at: '2026-10-02T01:42:13Z'
  source_kind: market_signal
  tier: independent
  fact: "一个工程师写完数据处理代码，点下提交，然后去喝了杯咖啡。十几分钟甚至几十分钟之后，他才回到屏幕前看结果、改代码、再提交。这条「等待— 反馈」的空隙，过去一直是数据平台默认的节奏。 \n\
    \ Agent 没有这个空隙。它拿到一次结果，立刻验证，紧接着并发地去试第二种、第三种方案，飞快拿到反馈，再发起下一轮调用。 \n 人用平台，发过来的是一个相对确定的任务，算完、给结果、走人；Agent\
    \ 用平台，会不停地换着法子去完成你交代的那个目标。压力就这样被放大了—— 管控的压力和隐形计算的压力，会十倍、百倍地往上翻。 \n 这正在成为 2026 年云计算需要面对的一种新负载。 \n AI\
    \ 正在深入「把模型用起来」的阶段。模型一旦长成 Agent，它就不再是一个躺在那里等你调用的接口，而更像一个会自己找数据、自己拆任务、自己并发试错、自己一直跑下去的数字员工。它制造出来的负载，和过去十几年云平台习惯承载的那种负载，完全是两回事。\
    \ \n 阿里云智能集团首席技术官李飞飞在云栖大会上把智能体落地拆成三个词：Model 决定智能的上限，Context 决定 Agent 读不读得懂你的业务，Harness 决定它能不能真正调起工具、把事做完、并且一直跑下去。想同时喂饱这三样，光把一个模型做大做强，远远不够。\
    \ \n 数据流动起来产生智能，智能以 Agent 的形态落进业务，业务跑起来又产生新的数据和新负载，回过头再推着整个系统往前走。飞轮转得快不快，取决于三件事—— 模型生产的效率、智能落地的效率、系统自我进化的效率。\
    \ \n 今年云栖大会上，阿里云做的事，就是沿着这三个效率，把从数据入湖、训练集生产、模型训练、推理服务，一直到系统自己优化自己的整条链路，一次性升级了一遍。 \n 贯穿这些升级的，是阿里云所强调的「芯云模一体」：让芯片、云平台与模型逐渐走向协同设计，打通从原始数据到业务决策的全栈。\
    \ \n 当模型走进真实世界，数据先成了瓶颈 \n AI 进入物理世界之后，数据首先发生了变化。 \n 过去的大模型主要处理文本和代码。自动驾驶、具身智能和科学计算面对的却是视频、点云、运动轨迹和传感信号。原始数据很容易积累，真正困难的是把这些数据清洗、质检、标注并转换成模型可以使用的训练集。\
    \ \n 穹彻智能首席科学家吕峻在接受采访时提到，具身智能的数据以视频和点云为主，从采集完成到进入训练，中间可能经过几十道处理。一次数据版本"
