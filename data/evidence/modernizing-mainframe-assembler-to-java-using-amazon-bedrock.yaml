  fact: Imagine a batch job that has run every night for decades without failing, and the only person
    who understands its code is about to retire. We have seen this situation again and again while working
    with banking, insurance, and airline customers. Their Assembler programs still run critical business
    operations, but fewer people can read them each year. Rewriting them by hand takes years, risks breaking
    business rules nobody remembers writing, and still depends on the same experts who are leaving. Amazon
