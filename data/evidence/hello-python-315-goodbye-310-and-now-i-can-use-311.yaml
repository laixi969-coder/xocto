  fact: 'Python 3.15 is here ! Here''s the essential What''s new in Python 3.15 guide, this year curated
    by 3.14 and 3.15 release manager Hugo van Kemenade. As someone who builds open source software that
    works in every supported Python version, I get to say goodbye to Python 3.10 and start embracing features
    from Python 3.11. First, some highlights from Python 3.15. Explicit lazy imports I''m most excited
    about Explicit lazy imports from PEP 810 . These let you import modules like so: lazy import json
    lazy from pathlib import Path The module will then be imported the first time those symbols are used
    in the code that follows. My LLM CLI tool implements plugins. I had to recommend manual lazy imports
    in the plugin author documentation, because simply installing plugins that used heavy dependencies
    such as sentence_transformers could add multiple seconds to every invocation of the llm command. Lazy
    imports directly address this startup cost. Unpacking in comprehensions The new [*sublist for sublist'
