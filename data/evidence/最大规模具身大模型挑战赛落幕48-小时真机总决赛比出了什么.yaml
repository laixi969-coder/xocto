  fact: 开发者围绕同一块基础模型进行实验，让模型直面成功的方法、失败的经验和真实世界的问题。 作者｜Li Yuan 编辑｜ 郑玄 最大规模具身大模型挑战赛总决赛结果出炉，排名第三的队伍 SST 只额外采集了
    13 条数据。 他们没有大量补数据，而是让 DeepSeek 先理解任务，再用视觉分割模型标出目标物体，最后交给 LingBot-VLA 2.0 完成动作，并在真机评测中拿到 65.87 分。 通用大模型与具身模型的协同在这里变得很具体：DeepSeek
    负责弄清楚要做什么，具身基础模型帮机器人找准操作对象、做出动作。 11 月 16 日，首届蚂蚁灵波具身大模型挑战赛在上海张江收官。经过线上初赛，15 支战队进入为期 48 小时的线下总决赛。所有队伍使用同一款开源模型
    LingBot-VLA 2.0、同一款松灵 COBOT MAGIC 机器人和统一的现场算力，完成蔬果摆放、化妆品收纳和双臂清扫三项任务。 起点相同，解法不限：有人重采数据，有人调整模型的训练和推理方式，也有人接入通用大模型、视觉分割或仿真工具。48
    小时里，15 支队伍要回答的是同一个问题：面对真实桌面上的物体，怎样让已有的模型把这件事做成？ 01 当胜负开始取决于如何使用数据 纵观整场比赛，有一点十分有趣：几乎每支队伍都提到了数据工程的重要性。
    LingBot-VLA 2.0 已经具备基本的视觉理解、指令理解和动作生成能力。参赛者不必在 48 小时里重新训练一个机器人大脑，而可以直接判断模型已经会什么、会在哪些情况下失败，再决定应该补什么数据、怎样训练。
    冠军团队 TARS 首先给三项任务分出了难易。经过测试，他们发现，水果摆放和化妆品收纳的主要问题，是现场的无关物体容易干扰判断。团队因此引入大模型识别目标和干扰物，再遮挡无关区域，让机器人更专注于当前任务。团队介绍，这套方法让第一项任务实现了
    10 次全部成功。 他们把更多时间和数据留给了最难的双臂清扫。簸箕抓取不稳，团队便重新选择抓持位置并补采数据；机械臂伸远、负重后会下坠，他们又测量不同负重下的偏差，对动作进行补偿。此外，团队还将单步训练时间从约
    15 秒压缩到 3.4 秒，为现场迭代争取时间。最终，TARS 以 82 分拿到第一名。 排名第三的 SST 走的是「少而准」的路线。除了在推理时接入 DeepSeek 和视觉分割模型，他们还冻结了部分预
