    \ Go 写的 nxs 。可以用它给自己的程序接一个能读文件、改代码、跑命令的 Agent ，也可以接自定义工具。\r\n\r\n支持单次任务和多轮会话，提供 MCP 、Hooks 和工具权限配置。模型可以通过\
    \ Anthropic 兼容接口接入，也支持 OpenAI Chat Completions / Responses 。平台 wheel 带了 nxs 和 rg ，覆盖 macOS 、Linux\
    \ 、Windows 的 x86_64 和 ARM64 。\r\n\r\n项目在这里。\r\n\r\n- [GitHub]( https://github.com/nexus-research-lab/nexus-agent-sdk-python)\r\
    \n- [Python SDK 文档]( https://www.nexusos.cn/docs/sdk-python)\r\n\r\nPython 3.11+，先安装并配置模型 Key 。\r\n\
    \r\n```bash\r\npip install nexus-agent-sdk-python\r\nexport ANTHROPIC_API_KEY=\"你的 API Key\"\r\n```\r\
    \n\r\n下面这个例子读取当前目录的 README ，不开放写文件或执行命令的权限。\r\n\r\n```python\r\nimport asyncio\r\nfrom nexus_agent_sdk\
    \ import NexusAgentOptions, query\r\n\r\nasync def main():\r\n    options = NexusAgentOptions(\r\n\
    \        cwd=\".\",\r\n        tools=[\"Read\", \"Glob\", \"Grep\"],\r\n        allowed_tools=[\"\
    Read\", \"Glob\", \"Grep\"],\r\n    )\r\n    async for message in query(\r\n        prompt=\"找到并阅读当前项目的\
    \ README ，用中文介绍这个项目。\",\r\n        options=options,"
