  title: 求 Star | 会组队，也会自进化：最强多智能体系统 Raven 已开源
  published_at: '2026-09-28T14:02:48Z'
  collected_at: '2026-09-29T01:57:41Z'
  source_kind: product
  tier: independent
  fact: "电脑里安装了这么多 Agent ，能不能有一个 Agent 调度其他所有 Agent 去完成任何任务？做得不够好时，能不能自己改进 Agent ？\r\n\r\n我们 EverMind\
    \ 做的 Raven ，就是为了实现多智能体协作和 Harness 自进化。\r\n\r\n接到任务后，Raven 会画出一张任务图：谁负责调研，谁写代码，哪些工作可以同时做，成果又该交给谁。Raven\
    \ 内置研究、编程、设计和持续执行 Agent ，也能接入第三方 Agent ，让不同专长在同一个项目里接力。\r\n\r\n我们还想让这支团队持续变强。Agent 的表现取决于它的 harness：它看什么上下文、怎么规划、能用哪些工具、如何判断工作已经完成。Raven\
    \ Evolver 会分析失败的执行过程，尝试调整这些工作方式，再通过评测筛选有效改动。同一个模型，也能因为 harness 改进而做得更好。\r\n\r\n这套思路已经有了看得见的成果：从一份需求文档出发，Raven\
    \ 自主工作约 4 天，经过 42 轮规划、开发与验收，交付了一款可玩的 Godot 4 第一人称射击游戏，连海报、演示文稿和网站也一起做了。在深度调研、软件工程、数据分析、视觉设计、AI4AI\
    \ 、AI4S 任务上，自进化 Raven 全部刷爆榜单！\r\n\r\nGitHub： https://github.com/EverMind-AI/Raven  项目还在快速生长，求 Star\U0001F97A\
    ，欢迎来试用、提 Issue 、贡献代码。\r\n\r\n机器之心： https://mp.weixin.qq.com/s/u9Pnht2mHluZH_FS5tnbAg\r\n\r\n我们也在招多智能体系统研发实习生。\
    \ 如果你对多 Agent 协作、harness 自进化和长任务执行感兴趣，想亲手把这些能力做进开源系统，欢迎私信我或发送简历到 xuedizhan17@mails.ucas.ac.cn"
