  title: 开源分享 ProxyLane - 拖拽即透明代理的开源工具
  published_at: '2026-09-15T06:42:44Z'
  collected_at: '2026-09-16T00:20:34Z'
  source_kind: product
  tier: independent
  fact: "把你要走代理的应用(例如 chatgpt.exe ，cmd.exe )拖到这个工具启动，被启动的应用以及其子进程才会走过你指定的代理 Profile 。不使用全局 Tun ，不修改系统全局代理设置，其他应用进程不影响。\r\
    \n\r\n例如打开 ProxyLane ，设置一个 profile （通常是你的梯纸的 HTTP/Socks5 协议的代理地址和端口）。\r\n然后往 ProxyLane 界面拖入 chatgpt.exe\
    \ 就可以， 如果拖入 cmd 启动这个命令行窗口，这个窗口里执行的 codex 、git 、curl 、npm 、pip 甚至浏览器等等自动透明代理。\r\n\r\nhttps://github.com/threatexpert/ProxyLane\r\
    \n\r\n这个代码库有 90%以上的 C++代码是多年前手搓的，一直自己用。最近用 AI 优化了一下易用性，感觉值得分享一下。"
