  title: 大家是有啥薅免费模型羊毛的路子吗
  published_at: '2026-09-27T14:40:23Z'
  collected_at: '2026-09-28T00:46:38Z'
  source_kind: product
  tier: independent
  fact: "想问一下各位 V 友有啥免费又好用的模型可以薅羊毛的么？\r\n\r\n最近这几个月一直在高强度开发 [DataZen](!https://github.com/flyxl/datazen)。之前一直用公司用\
    \ cursor 年费套餐，模型额度用完之后还可以免费用 composer 2.5 。现在 cursor 不让续订年费套餐，套餐大幅缩水，完全不够用来开发 DataZen ，只能自己想办法。刚开始用了几天的\
    \ DS 的 API ，不过账单实在是忍不了，于是各种找免费模型。当时正好 opencode 在搞 DS flash 的免费赠送活动，于是下载了 opencode 桌面版，搞了一波，但免费额度也不够日常开发用。好在公司又续费了一个月的\
    \ cursor 套餐，正好赶上 gemini 3.8 flash 在 cursor 上免费用，又使劲薅了一阵，但好景不长，cursor 年费套餐续费是临时方案，cursor 官方只给我们公司用\
    \ 10 天……\r\n\r\n后来 ox-alpha 很火，同时上线 opencode 和 openrouter 。opencode 免费模型按照 ip 有每日限额，openrouter 是按\
    \ api key 做限额，于是用不同账号搞了好几个 key 轮着用，不过 glm 5.3 flash 确实给力，开发效率高不少，那段时间高强度使用上了不少功能，也解决了不少 bug 。\r\n\r\
    \n再后来就是用 opencode muse spark 1.3 和 mimo v2.5 。最近也在用 mimo 2.6 flash ，不过感觉效果也就一般，现在都不太想用，用 mimo 2.5\
    \ 的时间反而更多一些。现在用的 space-bunny-free ，效果也还行。\r\n\r\n不过说实话，免费模型和头部模型差距是挺大的，之前试用了 astra 和 5.6 sol 都挺强的，开发效率真的是高出一大截……\r\
    \n\r\n另外，为了用 opencode 免费模型搞 DataZen ，我还自己搞了个 DSH 插件（ opencode 真的很拉，尤其是多 agent 协作）\r\n\r\n最近也在薅 qoder\
    \ 的羊毛，用 qwen3.8 flash （ qoder 桌面版也很拉，反正不适合我的多 agent 工作流）\r\n\r\n感觉除了 opencode 和 qoder ，好像也没啥能用的免费平台，不是\
    \ toke"
