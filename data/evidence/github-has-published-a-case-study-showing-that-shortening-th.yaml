  title: Claude Code 国内使用完整指南：不用科学上网， 5 分钟跑通
  published_at: '2026-09-29T09:22:35Z'
  collected_at: '2026-09-30T01:18:10Z'
  source_kind: product
  tier: independent
  fact: "背景：自己有 2 个 Claude Pro 账号轮着用，5 小时限制一到就得 `/login` 重登，非常烦。\r\n\r\n试过社区的 cc-switch ，但它核心是切 API 供应商配置，加两个官方\
    \ OAuth 账号时第二个会把第一个覆盖掉。Claude Code 1.0.61 之后支持 `--settings` 手动指定配置文件，也能用，就是每次都要敲路径。\r\n\r\n于是索性做了个小工具，叫\
    \ Claude Launcher ，专门解决官方多账号切换的问题。\r\n\r\n## 它做了什么\r\n\r\n- **每个账号一个独立加密 profile**，互不覆盖\r\n- **列表点一下就切号**，自动把对应\
    \ token 写入 Claude Code 的共享凭证\r\n- **双向 token 同步**：Claude Code 后台刷新的新 token 会同步回 profile ，下次启动用最新的\r\
    \n- **自动安装 Claude Code**（首次使用免手动配置）\r\n- **Windows 自动检测并安装 Git Bash**\r\n- UI 里选模型 / 权限模式 / effort\
    \ / `--continue`，自动拼启动参数\r\n- macOS / Linux / Windows 三端可用\r\n\r\n![[Pasted image 20260420160914.png]]\r\
    \n\r\n## 技术栈\r\n\r\nGo + Wails ，原生窗口，启动快，不吃内存。\r\n\r\nProfile 用 AES 加密 + 机器 ID 绑定，换机失效（避免 profile\
    \ 文件被直接复制走）。\r\n\r\n启动终端的方式按平台区分：\r\n- macOS：`osascript` 调 Terminal.app\r\n- Linux：gnome-terminal\
    \ → xterm → konsole 依次 fallback\r\n- Windows：`git-bash.exe -c`，支持代理环境变量\r\n\r\n## 使用流程\r\n\r\n1. OAuth\
    \ 登录 Claude 账号（或从本机 Keychain / `.credentials.json` 一键导入）\r\n2. 给 profile 命名\r\n3. 想加第二个账号？列表页点「添加账号」走一遍流程即可\r\
    \n4. 切号：列表页点目标 profile → 选目录 → 开始\r\n![[Pasted image 20"
- id: ev-300778030cc8d8be
  project_slug: github-has-published-a-case-study-showing-that-shortening-th
  url: https://www.v2ex.com/t/1246111
  title: 从 WebView 到原生桌面：开源终端工具 NyaTerm 2.0
  published_at: '2026-10-02T03:57:49Z'
  collected_at: '2026-10-03T01:12:25Z'
  source_kind: product
  tier: independent
  fact: "NyaTerm 2.0 ，轻装上阵，全新出发！\r\n\r\n之前发 NyaTerm 的时候，我提过它是受 WindTerm 启发做的一个开源终端管理工具。\r\n\r\n这一个多月 1.x\
    \ 其实一直没停，还在持续修问题、补功能。\r\n\r\n不过与此同时，我又给自己挖了个更大的坑：\r\n\r\n**把 NyaTerm 用 Rust + GPUI 重新做一遍。**\r\n\r\n\
    现在这个版本已经放出来一段时间了，也迭代了几个 Preview ，感觉差不多可以单独介绍一下。\r\n\r\nNyaTerm 2.0 预览版： https://github.com/nyakang/nyaterm/releases/tag/v2.0.0-preview.4\r\
    \n项目地址： https://github.com/nyakang/nyaterm\r\n官网： https://nyaterm.app\r\n\r\n\r\n![image]( https://cdn.nodeimage.com/i/VKY7PuxKa6P6QquHbGxdVsknOtKySHRw.png)\r\
    \n\r\n\r\n为什么要重做？\r\n\r\n倒不是 1.x 不能用了。\r\n\r\n现在的稳定版基于 Tauri / WebView ，功能其实已经比较完整，但做得越多，越苦于 Webview\
    \ 的性能，Terminal 这种实时快速刷新的场景，还是更适合真正的原生桌面架构。收益也很明显，一直头疼的关键词高亮性能问题得到了解决，之前一些在 Tauri 框架不好实现的特性也可以大展拳脚。\r\
    \n\r\n\r\n\r\n所以后来干脆开了 2.0 这条线，试着用 Rust + GPUI 做一个真正原生的版本。\r\n\r\n刚开始其实就是个“大号 Demo”。\r\n\r\n先把窗口跑起来，再把\
    \ Terminal 塞进去，然后 SSH 、标签页、分屏、SFTP……一点一点往回补。\r\n\r\n做到现在，终于开始有点像 NyaTerm 了。\r\n\r\n目前常用的这些东西基本都已经陆续搬过来了：\r\
    \n\r\n- SSH 、Telnet 、本地终端\r\n- 多标签、分屏\r\n- SFTP 和文件管理\r\n- RDP / VNC\r\n- Docker 、进程管理\r\n- AI Assistant\r\
    \n- Cloud Sync\r\n- 快捷命令、凭据管理等\r\n\r\n当然，**能用和好用还是两回事。**\r\n\r\n最近几个 Preview 很多时间其实都花在一些特别细碎的地方。"
- id: ev-e818eadd1d24992f
