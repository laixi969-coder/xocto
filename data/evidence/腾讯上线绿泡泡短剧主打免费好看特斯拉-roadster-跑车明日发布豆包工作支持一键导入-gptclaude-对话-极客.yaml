  fact: 155 款应用拒绝豆包助手 AI 自动化操作 10 月 14 日，豆包手机助手《屏幕自动化操作声明协议》（SAEP）30 天公示期结束，官方公布名单显示，已有 155 款第三方应用拒绝 AI
    自动化操作，腾讯、阿里、美团、快手旗下多款产品，连同 Kimi、DeepSeek 等 AI 产品均在名单内，堪称互联网头部厂商的集体表态。 SAEP 协议核心是将 AI 屏幕自动操作的选择权交还应用开发者，开发者可自主决定是否允许豆包助手执行屏幕识别、模拟点击等操作。公示期内应用默认不开放权限；公示结束后，未明确拒绝的应用将按风险分级逐步开放，拒绝方后续也可随时调整声明。该自动化权限仅影响
    AI 代操作，不影响用户手动使用 App。 此前，努比亚 NaviX Ultra 搭载豆包手机助手发售，就出现过设备触发游戏风控等冲突，这类矛盾过去长期处于隐性博弈状态。本次拒绝名单基本集中在拥有独立流量闭环的平台，安全风险、流量主权是核心考量。SAEP
    把隐性冲突转为公开规则协商，标志移动端 AI 入口权博弈正式开启。行业认为，这只是智能体时代生态确权的起点，后续权限细化、责任划分、利益分配仍需多方持续磨合。（来源：极客公园） 相关报道： 第一款
    AI 手机，被半个互联网「拒」了 腾讯上线绿泡泡短剧 近日，腾讯低调上线绿泡泡短剧，主打「免费好剧，一点就看」。 绿泡泡的界面分为「免费剧场」「刷一刷」和「我的」三部分。「免费剧场」下设「AI 剧」「真人剧」「每日上新」「动漫剧」「本周必看」「百万播放」等栏目。点开中间入口「刷一刷」，上下滑动即进入沉浸式推荐流。剧集全部免费，但会在剧集之间插入广告。
    《短剧小程序用户协议》显示，服务签订主体为深圳市腾讯计算机系统有限公司。协议同时写明，短剧均来自第三方提供方，包括第三方小程序、短剧制作方、授权发行方等，由其授权本服务展示、播放。 和红果短剧相比，绿泡泡的社交印记更重。除了常规排行榜，首页还有「朋友在看」的短剧推荐，以及标注「北京的朋友都在看」的地区热门榜。腾讯方面表示，为提供个性化内容，会收集用户的浏览、观看、分享、点赞、评论、收藏等记录，以及朋友看过的剧目。经过程序分析后，平台会预测用户的偏好，朋友在看什么，直接影响给相关用户推什么。
    这并非腾讯首次下场做短剧。2021 年 12 月，腾讯视频发布业内首个微短剧品牌「十分剧场」，当时它只是长视频
