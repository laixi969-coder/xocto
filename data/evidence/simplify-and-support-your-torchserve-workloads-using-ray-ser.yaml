  fact: TorchServe is no longer maintained, leaving teams to own the entire GPU inference stack. The AWS
    Ray Serve Deep Learning Container is a supported, pre-tested container with the framework, GPU drivers,
    and serving layer already assembled. This post walks through deploying a vision-language model on
    Amazon EKS using the Ray Serve DLC on a single GPU node.
