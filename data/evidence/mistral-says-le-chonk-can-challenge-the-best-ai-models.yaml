  fact: As tensions mount over who gets access to top-end artificial intelligence , French company Mistral
    has released a new freely available model that it claims can compete with the very best from the US
    and China. The new 1 trillion-parameter model, Mistral Large 4—nicknamed Le Chonk—can be used and
    customized by anyone. It’s currently available in preview, with a final version to follow by the end
    of the month. Though Le Chonk is built to compete with leading general-purpose models, it’s optimized
    specifically for coding and cyberdefense, as well as tasks particular to manufacturing, finance, electrical
    engineering, and other niches. “There are a lot of areas where the other labs will not focus that
    much,” Guillaume Lample, cofounder and chief scientist at Mistral, tells WIRED. “There are so many
    domains in which you can improve models.” Read full article Comments
