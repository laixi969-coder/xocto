- id: ev-e9a645cbe38faa11
  project_slug: 当-ai-开始理解人不是标签阿里妈妈如何重构广告定向
  url: http://www.geekpark.net/news/369777
  title: 当 AI 开始理解「人不是标签」：阿里妈妈如何重构广告定向
  published_at: '2026-09-03T05:30:32Z'
  collected_at: '2026-09-03T14:36:52Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Cynthia  \n  编辑｜郑玄  \n   \n 2026 年夏天，林氏家居想卖一张布艺床。 \n 然后，阿里妈妈万相点睛给它找到了一群电竞玩家。并建议他们投放那些搜索过「电竞房布置」「游戏房改造」「RGB\
    \ 灯带」「二次元痛房」的用户。 \n 对于林氏家居这样一家诞生于互联网、长期依赖数据经营的头部品牌来说，这是个让人匪夷所思的抉择。 \n 过去，林氏家居品牌已经积累了超过 5500 万全平台粉丝、上万款在售\
    \ SKU 以及一千余家线下门店，是行业里公认的爆款制造机。 \n 而在传统的匹配逻辑下，一张床最自然的消费者应该来自装修、新婚、换房，以及近期购买过家电家居的人。因此， 广告系统用预设的标签匹配受众，商家投流选择装修、家具、地板之类的关联词汇，就成为了团队刻在肌肉中的记忆。相应的，一个搜索电竞房布置的年轻人，怎么看都不像一张床最优先应该争取的消费者。\
    \ \n  但常识并不能在一个存量市场中带来增长。  \n 而  万相点睛  看到的并不是「电竞」这个标签，而是标签背后的一整套消费意图：它发现，这群年轻人为了获得更好的游戏体验，本身就有很强的消费意愿：他们会购买人体工学椅、4K\
    \ 显示器、RGB 氛围灯，把自己的房间改造成一个更舒服、更沉浸、也更符合个人审美的空间。 \n 顺着这条消费链继续推理，对 PC 游戏玩家来说，一张可以舒服躺平的床，是整个电竞房体验的一部分；对于手游玩家而言，床甚至不只是休息场景，靠在柔软的布艺床上玩游戏，本身就是一种更舒适的游戏体验。换句话说他们是在为一种生活方式消费。\
    \ \n 想通这一层，团队当即拍板：投！ \n 最终的结果也超过了很多人的预料。  新客点击占比超 80%+，新客成交金额占比高达 83%。 精准选中新客群之外，最令团队惊喜的是：在此之前，还没有任何一个家居品牌发现这片蓝海，因此团队的加购成本还不到传统装修人群的\
    \ 1/3  。 \n 于是，一张柔软的布艺床，和电竞建立了联系。在这之后，这套打法甚至还被扩展到床头柜品类，帮助林氏家居发现了要收纳睡眠保健品并且拿取方便的助眠新目标客群  。  \n  一个全新的系统，也让广告从存量博弈走向了\
    \ AI 驱动的增量时代，并让发现新人群，创造新增量成为可能。  \n   \n   \n  01  \n  为什么传统广告定向越来越难找到新增量  \n 数字广告并不是到了大模型时代才开始依赖算法。\
    \ \n  近 20 年，"
