  fact: 'Presented by Gravitee     Agent complexity is the insidious shadow lurking inside enterprises
    right now that needs a light shone on it.  That’s because enterprises don''t deploy a single agent
    and watch it run, they deploy fleets, each one calling APIs, calling other agents, reaching into applications
    that were never built with a machine decision-maker in mind. That''s the failure mode that should
    keep you up at night: a windy, complicated system nobody can see clearly enough to govern. But why
    do things get so opaque so quickly?  Add a second agent to a system, and you''ve added one connection.
    Add a tenth, and you haven''t added ten connections, you''ve potentially added dozens, because now
    any agent might call any other, and each of those calls can trigger a call somewhere else. Complexity
    doesn''t creep up with agent headcount. It compounds with the number of paths between agents, and
    nobody''s job is to draw that graph. A support ticket that used to touch one system might now pass
