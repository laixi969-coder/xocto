  fact: 'Companies around the world are building on the NVIDIA DSX AI Factory Platform to plan, simulate
    and run the grid and the AI factory as one system, from the substation to the rack. Their adoption
    of the platform responds to an acute problem. Power is now the biggest bottleneck in infrastructure.
    More than $300 billion in equipment is backlogged, and over 200 gigawatts of projects are waiting
    in U.S. interconnection queues. One root cause of the bottleneck is siloed systems. The grid, the
    facility and the compute inside have long been designed independently from one another, creating the
    conditions for delays, risk and stranded capacity. Read All NVIDIA in Europe Announcements To help
    address this, NVIDIA DSX brings these systems together: NVIDIA DSX Sim and SimReady assets from leading
    energy manufacturers let engineers simulate the grid, substation and AI factory together, validating
    generators, switchgear, power systems and cooling before breaking ground. NVIDIA DSX Flex syncs AI
    fact'
