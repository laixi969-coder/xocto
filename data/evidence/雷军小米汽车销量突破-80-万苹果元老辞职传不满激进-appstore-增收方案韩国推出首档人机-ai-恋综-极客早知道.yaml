  fact: "雷军：小米汽车累计交付量超过 80 万辆 \n 9 月 7 日消息，小米创办人、董事长兼 CEO 雷军刚刚宣布， 小米汽车累计交付量超过 80 万辆 。 \n 据本月早些时候报道，2026\
    \ 年 8 月，小米汽车交付量持续超过 30,000 台。小米汽车表示， 正全力为小米澎程上市交付做准备 。 \n 另外，在 7 月 30 日的小米澎程技术发布会上，小米创办人、董事长兼 CEO\
    \ 雷军表示，2 年半的时间，小米汽车发布了两款车—— 小米 SU7 和小米 YU7。这两款车都成了爆品，并且累计交付 70 多万台 。 \n 小米汽车 2026 年各月交付量如下： \n \n\
    \ 1 月交付量超 39,000 台 \n 2 月交付量超 20,000 台 \n 3 月交付量超 20,000 台 \n 4 月交付量超 30,000 台 \n 5 月交付量超 30,000 台\
    \ \n 6 月交付量超 30,000 台 \n 7 月交付量超 30,000 台 \n 8 月交付量超 30,000 台 \n \n （来源：IT 之家） \n   \n   \n OpenAI\
    \ 宣布已经实现「自动化 AI 研究实习生」 \n 9 月 6 日消息，OpenAI 发布博客宣布，已经达成去年秋季定下的 自动化 AI 研究实习生 目标，同时披露 AI 智能体参与内部科研的实际情况，提出\
    \ AGI 要造福人类，需要公开讨论与民主治理。 \n 官方指出，仅披露个别风险事件并不充分，公众需要了解前沿实验室内部顶尖 AI 的开发过程，才能有效参与 AI 发展决策。这套 AI 研究实习生可在人类监督下执行明确科研任务，完成资深研究员数日的工作量；OpenAI\
    \ 计划在 2028 年 3 月冲击全自动 AI 研究员目标。但研究方向取舍、模型扩容、暂停、部署的全部决定权仍归人类，AI 仅负责执行任务。 \n 2026 年以来，OpenAI 研究员大规模并发使用编码智能体，代码产出与实验数量显著上涨，但\
    \ AI 代理无法解决全部研发瓶颈，科研整体进度不会随代理用量线性增长。 \n OpenAI 表示，自动化 AI 研究可以降低高阶智能使用成本，协助解决对齐问题、搭建 AI 安全防线，但不应盲目推进快速递归自我改进（RSI），技术节奏取决于人类管控能力与社会风险判断。目前行业尚无安全实现完整对齐\
    \ RSI 的成熟方案，能力提升与安全对齐未必同步，一旦出现严重安全风险，公司会"
