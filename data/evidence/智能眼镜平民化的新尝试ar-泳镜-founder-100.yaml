  fact: 本文首发于 Founder Park 公众号 · 2022 年 11 月 3 日   智能眼镜一直是智能可穿戴领域里备受期待的设备，2013 年谷歌开始推出的谷歌眼镜系列虽然没能成功，但是也没能阻挡巨头们对于智能眼镜的热情。Facebook
    在 2021 年推出了自家的智能眼镜 Ray-Ban Stories，小米也在今年推出了主打拍照的米家眼镜，就  连苹果，也一直传言要推出自己的 AR 眼镜。    而一些新的创业者，则开始尝试为智能眼镜寻找一些更落地更平民化的使用场景。    比如光粒科技推出的
    Holoswim2 智能泳镜，结合了传统泳镜与防水手表的功能，在用户游泳过程中实时监控泳姿和各种身体数据。至于为什么选择泳镜赛道， 「全世界至少有 6.3 亿游泳爱好者，群体基数很大。AR泳镜产品的推出可以极大地改变人们的生活。」
    光粒科技的创始人&CEO 张卓鹏是这么说的。    在张卓鹏看来，解决所谓 AR 内容匮乏的问题，可以换个思路。「将当前的生态内容，如计算机时代的移动手机和智能手机时代的内容，搬运到智能眼镜上，足以让智能眼镜流行起来。」不一定非要局限于
    3D 内容。    智能泳镜会提供哪些独特的功能？目前 AR 眼镜的技术发展到哪一步了？商业化的前景又在哪里？关于这些问题，我们也和张卓鹏聊了聊。    AR 眼镜的平民化时代，或许即将到来。                   AR
    泳镜本质上是一个更定制化的游泳教练，并且比目前的真人教练更了解客户的身体数据。    行业无需将内容框定在 3D 和与现实交互中，当前时代的主要内容仍以 2D 为主。将 2D 内容移植到眼镜上已经能够成就一个巨大的飞跃。    如果
    AR 不被理解为增强现实，而是被定义为辅助显示，那么这个时间节点很快就会出现，甚至在 2024 年之前就会流行起来。                    01           Holoswim2
    智能泳镜       的不同之处       Founder Park：介绍下 Holoswim2 智能泳镜？        张卓鹏    ：和普通泳镜相比，外观上两者差别不大。然而，AR 护目镜添加了一些光学模块和电子组件，数据可以在游泳过程中实时呈现给用户，其自身的运动传感器可以记录全部运动数据并提供实时分析。    除了监测泳姿、距离和速度外
