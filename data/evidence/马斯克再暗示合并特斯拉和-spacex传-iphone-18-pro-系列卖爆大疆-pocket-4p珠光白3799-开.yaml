  fact: "全球首款 AI 智能体手机努比亚 NaviX Ultra 上市：5999 元起，首销销售额「一秒破亿」 \n 9 月 16 日，中兴旗下努比亚今日下午正式发布 NaviX Ultra，官方称其为「全球首款\
    \ AI 智能体手机」，也被外界称为「第二代豆包手机」，标志着 AI 智能体手机从工程样机迈入规模化量产商用阶段。发布前该机京东单平台预约量已突破 37 万台，它是第一台搭载豆包手机助手消费者版的机器，现货开售后官方公布首销销售额\
    \ 「一秒破亿」。此前，京东的预约量已经过了 36 万台。 \n 售价方面，12GB+512GB 版本 5999 元、16GB+512GB 版本 6499 元、16GB+1TB 版本 7499 元，全系\
    \ 512GB 起步，叠加国补后到手价 5499 元起。 \n 硬件搭载第五代骁龙 8 至尊版移动平台，首发长鑫存储速率达 10667Mbps 的 LPDDR5X 内存（系国产 10667Mbps\
    \ 高速 LPDDR5X 首次量产应用），机身厚 7.62mm，内置 7100mAh 电池，支持 90W 有线与 50W 无线快充，配备 2 亿像素主摄，可选幻梦、蓝境、黑、白四款配色。 \n \
    \  \n AI 能力是这台手机的核心。努比亚总裁倪飞提出 AI 智能体手机的四项能力维度——「听得懂、能干活、记得住、够安全」，对应响应、执行、记忆、安全。机器搭载行业首个集成指纹识别的独立 AI\
    \ 按键，用户完成身份校验后无需解锁即可直接执行 AI 任务。（来源：极客公园） \n   \n 黄仁勋和特朗普拒绝协同放缓 AI 发展的提议 \n 9 月 16 日，据媒体报道，上周末，Anthropic\
    \ 的达里奥・阿莫代伊、OpenAI 的萨姆・奥特曼以及埃隆・马斯克公开呼吁行业协同放缓研发节奏，妥善应对 AI 带来的各类风险。 \n 而英伟达 CEO 黄仁勋则在采访里表示，安全和创新并不矛盾，已经发生的安全事件应该按照工程问题进行根因分析，通过技术、流程和测试加以控制。\
    \ \n 对于近年来频繁出现的 AI「末日预测」，黄仁勋列举了「放射科医生将被 AI 取代、90% 的代码将在短期内由 AI 生成、50% 的初级岗位即将消失」等此前被证明并不准确的判断。他认为，这类预测缺乏足够的科学依据，也不应该被用来制造社会恐慌。\
