  fact: Humanoid robots remain unproven at scale and have not yet achieved widespread commercialization,
    compared with industrial robots that have decades of proven track records in warehouses and factories.
    That frank acknowledgment is among the risks outlined in a securities filing by Agility Robotics—the
    first dedicated developer of humanoid robots to become a publicly traded company in the United States.
    The robotics company, headquartered in Salem, Oregon, previously became the first to achieve full-time
    commercial deployment of humanoid robots at a customer warehouse in 2024. Now, Agility’s public listing
    on the Nasdaq stock exchange as of November 5 has come with financial disclosures detailing how the
    company plans to build a business around renting out or selling humanoid robots to perform manual
    labor. “When we are doing robots as a service, it is much lower risk for customers to use it because
