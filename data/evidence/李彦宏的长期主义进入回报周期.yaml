  title: 李彦宏的长期主义，进入回报周期
  published_at: '2026-09-24T11:34:07Z'
  collected_at: '2026-09-25T00:34:10Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜cola  \n  编辑｜郑玄  \n \n  9 月 21 日，百度创始人李彦宏在内部活动上为技术团队颁发「百度最高奖」。两支入围团队均获奖，各获 100 万美元奖励。  \n\
    \  其中，天池团队面向万亿级 MoE 大模型，自主研发百度天池超节点架构；dodo 团队是通过打造企业 AI 员工。  \n 它们代表着百度当下两条重要的技术探索：基于 昆仑芯 的天池超节点，向更大规模的\
    \ AI 基础设施深入；以及让 Agent 真正进入组织。 \n 但如果把时间轴再往前拉，百度今天的 AI 故事，还有一条更早埋下的技术伏笔——昆仑芯。 \n 2010 年前后，百度搜索业务的服务器集群规模随流量高速扩张，海外进口芯片单片成本高达上万美元，持续攀升的算力开支不断挤压业务利润空间。这份成本压力，倒逼百度启动了\
    \ AI 加速器的自研探索。 \n 没有人在一开始就预判到，这场造芯之路会跨过十余年的周期，中间要穿过外界的质疑、技术的反复迭代、商业化的重重关卡。 \n 从内部低调摸索 FPGA、CPU、GPU\
    \ 加速方案，到成立深度学习研究院 IDL 集中攻坚；从 2018 年第一代昆仑芯片正式对外亮相，到业务拆分成立独立公司、数万片芯片落地各行各业、点亮国内首个全自研 3 万卡集群，再到递交上市申请，昆仑芯走出一条时间跨度极长的成长链路。\
    \ \n  李彦宏在颁奖时说，天池团队获得最高奖「很可能是一段漫长的征程的开始」。而透过昆仑芯的故事，我们也得以看清百度究竟是如何把「长期主义」从一句口号，落地为一连串连续的战略动作。  \n \n\
    \ \n \n \n \n   01   \n \n \n \n  \n \n \n \n     一笔成本账，百度踏上自研芯片之路     \n \n 2010 年，中国互联网还处在另一种叙事里。\
    \ \n 智能手机开始普及，移动互联网的大门刚刚打开。创业者和资本关心的是流量入口、移动应用和商业模式，很少有人讨论大模型，更不会有人知道，未来的 AI 训练将需要由数万张加速卡组成的集群。 \n\
    \ 在这样的背景下，一家公司决定自己研究芯片，并不是一个显而易见的选择。 \n 芯片研发投入大、周期长，流片失败可能意味着前期投入归零。即使芯片成功做出来，也要继续解决软件适配、系统部署和下一代产品迭代。对于互联网公司而言，直接采购成熟产品通常是更快的选择。\
    \ \n 但百度也有一个芯片创业公司不一定具备的条件：它拥有数量足够大、运行时间足"
