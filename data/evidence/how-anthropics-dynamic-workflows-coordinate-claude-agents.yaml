  fact: 'CJ Avilla and Harrison Stall, Members of Technical Staff at Anthropic, at AI Engineer NYC today.
    The AI Engineer New York 2026 conference kicked off this morning with a series of workshops, including
    Anthropic discussing how to orchestrate its Claude Managed Agents . Of particular interest was a brand
    new feature, announced on Friday , called dynamic workflows — or simply “flows,” as the presenters
    repeatedly called it. Flows are defined as “a new type of multiagent orchestration, built for your
    most ambitious workloads.” CJ Avilla and Harrison Stall , both Members of Technical Staff at Anthropic
    , began by invoking some operating system projects of the past — from Ken Thompson building the original
    Unix operating system, through to Linux evolving from one person (Linus Torvalds) to layers of trusted
    maintainers . The lesson: agents need the same level of organization in order to do the types of big,
    ambitious projects Anthropic envisions for dynamic workflows. Sponsored by Union.ai Bu'
