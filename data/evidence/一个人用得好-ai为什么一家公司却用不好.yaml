  title: 一个人用得好 AI，为什么一家公司却用不好？
  published_at: '2026-11-05T09:15:38Z'
  collected_at: '2026-11-06T02:27:21Z'
  source_kind: market_signal
  tier: independent
  fact: 作者｜老 S 编辑｜郑玄 今天的 Agent，已经能够独立完成不少具体的工作。 写方案、写代码、做分析报告，过去可能需要员工花费几天才能完成的任务，如今 Agent 往往能在较短时间里交出不错的结果。
    但在企业里，完成一份方案，可能只是一项工作的开始。比如，Agent 可以很快制定一份员工考核方案。但要用它真正完成一次考核，还需要获取员工的考勤、业绩等数据，处理特殊情况，并经过业务负责人和 HR
    的确认，才能最终确定绩效。 能够交付阶段性的工作产物，和能进入真实业务、创造实际价值，是两回事。 随着 Agent 能力快速进化，企业开始面对一个新的问题： 如何让这些越来越能干的 AI，真正参与到现有的工作体系中？
    在今年的腾讯全球数字生态大会上，腾讯专门设置了 AI 产品发布台，用两天时间、七场议题、40 多场产品发布，集中展示企业 AI 从应用到基础设施的一系列新能力。 腾讯集团高级执行副总裁、云与智慧产业事业群
    CEO 汤道生在大会上提出，腾讯将围绕办公协同、数据管理和业务执行三大场景，持续开放 WorkBuddy Agent 平台能力，帮助企业打造可运营、可进化的智能生产力系统。 从应用、数据、安全到工程，腾讯此次集中展示的一系列产品和技术能力，正是希望让
    Agent 不仅能够完成任务，还能真正进入企业的业务流程，成为持续创造价值的生产力。 01 一个人用得好 AI， 不等于一家公司用得好 AI 随着大模型和 AI Coding 工具的发展，软件开发的门槛正在快速降低。一些过去需要技术团队专门开发的内部工具，如今几天就能完成，业务人员也开始有机会直接创造自己需要的
    Agent。 但问题是， 一个人用得好的 Agent，并不意味着整个团队都能用好。 个人可以根据自己的需求配置工具、调整工作流，但企业需要考虑更多：Agent 能否接入原有系统、访问所需数据？不同员工、Agent
    的权限如何管理？一个人摸索出的好方法，怎样才能让其他人直接使用？ 腾讯云副总经理、WorkBuddy 企业产品负责人张曦耀在大会上提出，个人提效并不等于组织变强，两者之间隔着的是一整套组织能力。
    WorkBuddy 企业版此次升级，正是试图降低这道门槛。 相比个人使用 Agent，企业版更强调连接、管理和规模化应用。此次发布的四项升级中，开放平台让 WorkBuddy 能够连接企业微信、第三方
