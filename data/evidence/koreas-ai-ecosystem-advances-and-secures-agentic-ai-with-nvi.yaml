    AI agents for employee productivity and enterprise workflows . A key component of the NVIDIA Open
    Agent Safety Platform, OpenShell provides a secure runtime with sandboxed execution and policy-based
    controls to safeguard sensitive data, manage access to enterprise tools and govern autonomous agent
    actions. AIM Intelligence , a Korean AI security company, is integrating its Starfort agent control
