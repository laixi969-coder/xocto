  fact: 'Teams building AI agents on AWS use a range of frameworks, including LangGraph, LangChain, Strands
    Agents, and Amazon Bedrock AgentCore. Each framework records agent execution in its own way, so the
    structure of messages, tool calls, and handoffs between agents differs from one to the next. Evaluation
    tooling tends to follow the same boundaries: teams build metrics, scoring logic, and result storage
    against a single framework’s trace format, and they must rebuild them when they switch frameworks
    or run agents on more than one. This coupling makes a basic development question harder to answer:
    did a change to the prompt, model, or tools improve the agent? Answering it requires consistent metrics
    across versions of an agent and a shared record of past results to compare against. Agent quality
    also spans several dimensions that a single accuracy score does not capture: tool calling, response
    quality, responsible AI, performance, multi-turn conversation, multi-agent coordination, and reaso'
