  fact: Energy technology startup Linkener has raised €7.5 million in a funding round led by Klima Energy
    Transition Fund, Alantra’s energy transition fund, with existing shareholder GoHub Ventures remaining
    on board. Linkener has developed an Intelligent Energy Management System (SIGE) that uses proprietary
    remote metering technology to help businesses and organisations monitor, analyse and optimise their
    energy consumption. The platform allows customers to track consumption using their own data, digitise
    and validate energy bills, analyse supply contracts and receive alerts and recommendations to identify
    potential savings and better manage energy costs. Alongside its technology platform, Linkener supports
    businesses in implementing energy-saving projects, having completed more than 400 solar and battery
    storage installations across Spain. The company serves over 2,000 customers and manages 10,000 energy
