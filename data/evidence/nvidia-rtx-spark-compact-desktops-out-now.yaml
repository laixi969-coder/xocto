  fact: New NVIDIA RTX Spark compact desktops from ASUS, Dell and MSI are available today, bringing local
    AI agents, image and video generation, and model fine-tuning to a dedicated Windows PC. With up to
    128GB of unified memory and NVIDIA’s AI software stack, these systems provide room for larger local
    models alongside RTX-accelerated creative and development tools. A dedicated desktop can keep agents
    and scheduled tasks running while a laptop travels or handles other work. Alongside the new desktops,
    an expanding software ecosystem brings more creative and development workflows to RTX Spark laptops
    and compact desktops. Native Windows on Arm applications from Adobe, the NVIDIA DLSS Ray Reconstruction
    feature in Blender and local generation workflows in ComfyUI expand what creators and developers can
