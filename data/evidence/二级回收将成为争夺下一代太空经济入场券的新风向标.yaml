  title: 二级回收，将成为争夺下一代太空经济入场券的「新风向标」
  published_at: '2026-11-23T07:49:06Z'
  collected_at: '2026-11-24T06:03:57Z'
  source_kind: market_signal
  tier: independent
  fact: 美国中部时间 11 月 14 日，星舰飞船在结束约 22.5 小时的轨道飞行后返回地球，被发射塔机械臂捕获。这是人类航天史上第一次完成了轨道级大载重飞船的回收工程验证，二级回收也第一次有了成功案例。
    在一些业内人士看来，这不是一次普通的「回收动作」。 二级回收真正影响的，可能是太空经济的成本曲线。 全可重复使用、大规模天地往返运输一旦跑通，人类进入太空并返回地球的成本有望明显下降，太空旅游、太空算力、太空基建也将随之打开新的空间。
    有观点判断，拐点已至，窗口期正在到来；对中国商业航天而言，追赶的紧迫性也随之上升。 业内常有一种误读：把星舰当成一枚传统意义上的「火箭」，进而把二级回收理解成一级回收的翻版。事实上，此次「筷子」接住的是星舰飞船，所谓二级回收，回收的也是这艘飞船。
    一级回收和二级回收，并不在同一个技术命题里。一级分离时速度约 2 公里/秒，返回全程 6 到 7 分钟；二级则要从约 7.8 公里/秒的轨道速度再入大气层，闯过热防护、通信黑障、气动减速和精准着陆等重重难关，返回过程长达
    30 分钟~1 小时。也正因如此， 两者的技术谱系并不相同：二级回收的关键是无动力受控再入，技术底座是载人飞船；火箭一级返回走的则是有动力返回的技术路线 。相比之下，二级回收的难度更高，二者不宜混为一谈。
    01 技术谱系是载人飞船， 人才稀缺是共性瓶颈 二级回收之所以难，在于它本质上是轨道级的再入，需要完成一次载人飞船技术谱系上的工程跃迁： 再入气动、热防护、黑障通信、姿控飞控、着陆缓冲、安全逃逸，每一项关键技术的门槛都不低。而真正做过这套体系的人本就不多，人才池天然有限
    。在国内，把星舰二级载人飞船回收路线当作主线、 自成立起便专注这一技术谱系的商业团队并不多，穿越者是其中较为清晰的一家。 公开资料显示，穿越者成立于 2023 年 1 月，是国内较早明确对标星舰二级载人飞船回收路线、专注研制全可复用重型天地往返载人运输系统并推进规模化太空运营的商业载人航天企业。
    从成立之初，团队便把可复用载人飞船的二级回收作为主攻方向，围绕飞船总体设计、再入返回与着陆缓冲等关键环节持续投入。 这条路径的早期选择，近两年在工程验证中陆续有了回应。以着陆缓冲环节为例，外界近期颇为关注「特斯拉飞车」采用的高压冷气反推方案，而穿越者对该方案的验证其实更早。记者了解到，作为国内首个把这一方案用于载人飞
