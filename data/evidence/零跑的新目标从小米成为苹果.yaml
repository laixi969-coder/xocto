  project_slug: 零跑的新目标从小米成为苹果
  url: http://www.geekpark.net/news/370765
  title: 零跑的新目标：从「小米」成为「苹果」
  published_at: '2026-09-21T15:11:23Z'
  collected_at: '2026-09-22T00:50:51Z'
  source_kind: market_signal
  tier: independent
  fact: "这一次，零跑主动放弃了「第一」的位置，并表示将全力「争当第三」。 \n 在零跑 2026 技术日上，零跑汽车创始人朱江明只用了一次「新势力」这个词，说的是「零跑的销量长期处于新势力的前列」。而真正报出排名时，他换了一套坐标：「国内新能源汽车品牌销量的前三名，全球新能源汽车品牌销量的前四名。」\
    \ \n  「第一」前面的定语是「新势力」 ，通常指 2015 年前后成立、带着互联网思维造车的那批公司。零跑从 2025 年 5 月登上这张榜的头名之后就几乎没下来过，最近两个月月交付连续突破\
    \ 10 万台，8 月交付 10.3 万台，同比增长 80.7%。 \n  「第三」前面的定语，则换成了「全球新能源品牌」 。今年 1 到 8 月，零跑累计交付超过 56 万台，其中 13 万台卖去海外；8\
    \ 月国内新能源品牌零售榜上，它排在比亚迪、吉利之后；放到全球看，前面也只多了一个特斯拉。 \n 同样的交付量，放进不同的榜单，衡量它的尺子就换了一把。 \n 换一张牌桌，企业要面临和解决的问题也要跟着升维：\
    \ \n 过去十年，零跑回答的是怎么把一台车做得又好又便宜；接下来它得回答的是，拿什么去和全球车企竞争。而这种竞争的胜负手，往往不在台面上，而是藏在看不见的地方。 \n   \n  非典型新势力\
    \  \n 成立于 2015 年的零跑汽车，是一家特别的「非典型新势力车企」。 \n 朱江明这些年一直强调的那句「电动车是一个 70% 由电子器件组成的电子产品」，虽然不如马斯克的「四轮机器人」理论性感，但的确是\
    \ 10 年前所有「新势力」车企起步的源头：看到了「电子取代机械」这个由技术变革带来的长期机会。 \n 但在具体的品牌打法上，零跑又和同一批成立的其他三家明星公司「蔚小理」有着很大的不同。或者说，相比于那些来自互联网行业的友商们，零跑在成立之初根本就没有\
    \ ToC 的概念。 \n 创始人朱江明在成立零跑之前，在电子行业工作了 30 多年，对把一个产品拆开应该如何优化很有经验，但组装起来怎么推销，他并没有太多经验和思路。 \n 如今，十多年的时间过去，朱江明依然经常强调：\
    \ 零跑的车应该做到「好而不贵」，而「情绪价值」这件事，不是零跑最先考虑的 。 \n   \n 零跑创始人朱江明 | 图片来源：零跑汽车 \n 于是，这家「新势力」延续了汽车行业百年以来最朴素的思考逻辑，把造车拆成了一道成本问题：同样的体验，在技术、管理等层面，用创新"
