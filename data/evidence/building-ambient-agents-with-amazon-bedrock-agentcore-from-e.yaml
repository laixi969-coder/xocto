  fact: Ambient agents respond to events such as an Amazon S3 upload, a schedule, or an alert instead
    of waiting for a chat prompt. This post walks through building framework-agnostic ambient agents on
    Amazon Bedrock AgentCore using Amazon SQS, AWS Lambda, and Amazon DynamoDB, with a single ask_human
    tool and a Jobs page for human-in-the-loop review.
