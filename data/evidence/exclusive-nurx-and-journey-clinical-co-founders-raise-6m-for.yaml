  fact: Siggy has raised $6 million in pre-seed funding to build a mental health service that uses AI
    to collect patients’ histories and track progress between appointments with licensed clinicians, the
    startup told Crunchbase News exclusively. The company brings together two founders who previously
    built businesses that help patients get treatment outside a traditional doctor’s office. Jonathan
    Sabbagh co-founded Journey Clinical , which supports practices offering ketamine-assisted psychotherapy,
    and Edvard Engesæth co-founded Nurx , which provides birth control and other healthcare services online.
    Village Global led the financing for New York-based Siggy. Notably, several investors in the round
    previously backed one or both founders. They include Albert Wenger of Union Square Ventures , Mercury
    co-founder Immad Akhund , and Cityblock Health co-founder Toyin Ajayi , through Coalition Operators
    . Other participants include PsyMed Ventures , Mystic Ventures and Gokul Rajaram . Jonathan Sabbag
