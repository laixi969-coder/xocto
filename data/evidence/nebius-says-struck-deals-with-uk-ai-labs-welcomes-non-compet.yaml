  fact: European AI infrastructure company Nebius says it has struck deals with a number of early-stage
    UK AI labs as it looks to accelerate its compute and infrastructure offering in the UK. Nebius, which
    is sometimes referred to as a neocloud, builds and operates data centres, packing them with GPUs,
    then offers access to these data centres to AI and enterprise companies needing compute power, as
    well as offering them specialised software to run AI applications. Earlier this year, Nebius announced
    a £1.7bn UK build-out across new sites, along wtth an expansion of its London hub, which is its major
    European R&D and go-to-market hub. Nebius, which is headquartered in Amsterdam and has bagged multi-billion-dollar
    contracts with Meta and Microsoft to supply them with AI infrastructure, has four data centre sites
    in the UK. Nebius, which has also struck compute deals with Revolut and Prima Mente, also has its
    own data centres in Finland and France. Nebius general manager, EMEA, Gary Tierney, said
