  title: AI 硬件创业者，疯狂涌入手机的背面
  published_at: '2026-09-18T14:07:09Z'
  collected_at: '2026-09-19T00:21:45Z'
  source_kind: market_signal
  tier: independent
  fact: "头图来源：产品小红书账号、官网 \n   \n 过去一年，AI 硬件创业者开始扎堆手机背面。 \n Plaud 的 AI 录音卡累计出货突破百万台。2026 年 6 月，Plaud 宣布\
    \ ARR 达到 1 亿美元、服务超过 200 万专业用户；截至 9 月，公司最新披露的全球用户数已超过 250 万。另一边，做磁吸电子纸屏的阅星曈完成近 5000 万元 A 轮追加融资，顺为、经纬、博裕和小红书等老股东继续跟投；极稚科技则称，其无源墨水屏手机壳已经卖出超过\
    \ 14 万只，其中八成销往海外。 \n 销量和融资之外，新的产品还在不断冒出来。Flowtica 在 IFA 展出集录音、电子纸和会议待办于一体的 Verso；获得线性资本天使投资的 NOOKLAB，准备推出支持持续收音的\
    \ AI 随身屏 Moonphase Flip；极稚科技也计划用 Sloth 从静态墨水屏进入 OLED、麦克风和虚拟宠物。 \n 大厂的动作更快。钉钉、出门问问、科大讯飞和 360 相继进入 AI\
    \ 录音卡市场；荣耀、海信和影石，则分别从磁吸副屏、可拆卸电子纸和影像配件的方向试探手机背面的可能性。与此同时，华强北已经把基础录音卡的价格压到一两百元。 \n 一个原本以手机壳、卡包和充电宝为主的配件位置，突然挤进了录音公司、电子纸创业者、消费电子团队、互联网大厂和手机厂商。它们给出的答案并不相同：有人想把它做成录音工具，有人放上一块低干扰屏幕，有人想做虚拟宠物，也有人试图把录音、显示和\
    \ Agent 全部装进去。 \n 这些公司争夺的不只是一个新品类，更是手机上所剩不多的高频携带位置。一部手机的背面很难同时挂着录音卡、阅读屏、充电宝和 AI 宠物。当越来越多产品要求用户把自己长期留在这里，它们之间就不再只是功能差异，而会形成直接的产品和战略竞争。\
    \ \n 这也是手机背面今天值得被重新关注的原因。 \n MagSafe 早已让用户习惯把配件吸在手机背后，但这一轮变化，是 AI 硬件开始借助这个成熟位置寻找自己的入口。Plaud 率先证明，独立\
    \ AI 工具可以在这里获得百万台规模和持续付费；屏幕产品的增长和融资，则让另一种可能浮现出来：手机背面或许不只负责采集信息，也可以成为 AI 向用户返回结果的第二界面。 \n 一场围绕几厘米空间的竞争，已经从配件生意进入\
    \ AI 硬件创业的中心。 \n 一、手机背面的「隐藏金矿」 \n 较早让市场意"
