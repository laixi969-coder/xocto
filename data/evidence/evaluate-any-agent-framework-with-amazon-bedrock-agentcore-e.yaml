  fact: Amazon Bedrock AgentCore Evaluations decouples agent evaluation from the framework you build on.
    As long as your agent emits OpenTelemetry telemetry, the service can score it, whether you use LangGraph,
    LlamaIndex, the OpenAI Agents SDK, Google ADK, the Claude Agent SDK, or Strands Agents. This post
    explains how the framework-agnostic contract works.
