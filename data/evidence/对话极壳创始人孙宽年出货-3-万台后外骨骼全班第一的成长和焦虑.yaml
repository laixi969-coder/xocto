  project_slug: 对话极壳创始人孙宽年出货-3-万台后外骨骼全班第一的成长和焦虑
  url: http://www.geekpark.net/news/370150
  title: 对话极壳创始人孙宽：年出货 3 万台后，外骨骼「全班第一」的成长和焦虑
  published_at: '2026-09-10T11:41:33Z'
  collected_at: '2026-09-11T00:10:53Z'
  source_kind: market_signal
  tier: independent
  fact: "在刚刚结束的 IFA 柏林国际消费电子展上，几乎每家机器人公司的展台上，都会摆上一台可穿戴外骨骼设备。就像 10 年前，很多互联网新锐创业者都喜欢在办公桌上摆一台无人机。这既是对这个品类「前沿」的认可，也表露出某种对市场增长的看好。\
    \ \n 2025 年被认为是「消费级外骨骼元年」。今年，这个行业迅速涌入了上百个新玩家。 \n 极壳 Hypershell 去年的全球出货量超过了 3 万台，是这个细分领域里公认的头号玩家。创始人孙宽认为，这仍然是一个相对早期和小众的品类，现有的产品体验还有大量提升的空间。\
    \ \n 在孙宽看来，竞争并不是当下驱动行业创新的核心动力。他希望跨越鸿沟，把外骨骼产品的目标用户从户外、老年等几个特定群体，推向「国民级」的消费市场。 \n 9 月，极壳在 IFA 发布了行业首个髋膝一体化的下肢外骨骼新品\
    \ Halo。这个项目的研发起始于 2023 年，但很长一段时间里没有满意的进展。孙宽告诉我们，核心变化来源于团队今年的一次调整，「还是同样的研发团队，聚焦目标之后，之前做了两年多的东西，很快就看到了突破」。\
    \ \n 对这位 90 后创始人来说，考验不只是死磕研发和技术。这是一个全新的品类，没有先例可循。他要带着一个还在不断扩大的组织，在竞争越来越激烈的赛道里，朝确定的目标前进。 \n 以下是 Hardwire\
    \ 和极壳创始人孙宽的访谈，经编辑整理。 \n   \n 访谈、整理 | siqi \n 编辑 | 郑玄 \n   \n  Part.1：创业进入「深水区」  \n   \n  Hardwire：听说最近非常忙，主要是为新品（Halo）发布做准备吗？\
    \  \n  孙宽 ：大部分工作跟新品有关，也有一些其他思考。相较于上次我们见面的时候，感觉创业逐渐走到了深水区。 \n   \n  Hardwire：怎么理解「深水区」？  \n  孙宽 ：今年之前，公司的核心目标是验证品类的\
    \ PMF。需要我们找到对可穿戴外骨骼产品有需求的用户，并且让他们高频地使用，我觉得第一阶段我们做得不错。 \n 今年的目标是推动这个品类从早期的极客用户走向大众市场，走进更多人的生活。这带来了很多方面的挑战，需要我们对用户、商业、增长有更多了解，要想办法把用户了解产品、体验产品的阻力变得更低，所以我们近期也开了线下店。\
    \ \n   \n  Hardwire：产品方面的变化有哪些？  \n  孙宽 ：消费级外骨骼是一个非常新的品类"
