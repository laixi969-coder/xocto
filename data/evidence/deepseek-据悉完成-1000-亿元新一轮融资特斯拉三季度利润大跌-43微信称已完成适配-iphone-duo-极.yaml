  fact: DeepSeek 新一轮融资筹得约 1000 亿 10 月 22 日，有市场消息称，国内大模型公司 DeepSeek 拟在最新一轮融资中筹得约 1000 亿元人民币 ( 约 150 亿美元
    )，腾讯和宁德时代为本轮出资最多的投资方，交易预计在未来数日内正式完成。 截至目前，DeepSeek 及腾讯等相关投资方均未公开回应。记者从接近公司和投资方的多个信源交叉求证，确认上述消息属实。
    消息人士透露，本轮募资目标最初设定为 500 亿元，此后经多轮上调至约 1000 亿元，目前尚未官宣，最终金额仍未完全确定。 这笔资金将继续用于模型训练、算力建设和人才招募，以支撑 DeepSeek
    参与全球竞争。也有部分消息人士判断，本轮融资将为公司筹备中的科创板 IPO 铺平道路。（来源：上海证券报） SpaceX 据报洽谈接入美国至少 8 万座基站，准备建立全国性移动通信网络 据彭博社
    10 月 22 日报道，SpaceX 正在与美国移动通信基础设施企业洽谈，希望获得至少 8 万座地面通信站点的使用权。 这项计划可能帮助 SpaceX 建立覆盖美国全国的移动通信网络，进一步拓展
    Starlink 的业务范围。 过去，Starlink 主要通过卫星提供宽带互联网服务，并逐步发展卫星直连手机业务。如果 SpaceX 能够获得大量地面通信站点的使用权，就有机会将卫星通信与传统地面移动网络结合。
    目前相关合作仍处于谈判阶段，尚未公布最终协议。（来源：彭博社） Anthropic 冲刺史上规模最大 IPO 10 月 22 日，据财联社援引知情人士消息，Anthropic 最快将于当地时间本周五向美国
    SEC 公开提交 S-1 招股说明书，这是这家 AI 公司冲刺史上规模最大 IPO 的核心程序性节点。 早在今年 6 月，Anthropic 就已秘密提交 IPO 草案，此前一个月完成的 650
    亿美元 H 轮融资，也为上市奠定了资本基础。该轮融资投后估值达 9650 亿美元，由 Altimeter Capital、Dragoneer、Greenoaks 和红杉资本领投。Anthropic
    的估值也超越 OpenAI，后者在今年 3 月的投后估值为 8520 亿美元。 很长一段时间里，华尔街主流机构的乐观预期是，Anthropic 有望以 2 万亿美元估值上市，募资规模最高可达 1000
    亿美元
