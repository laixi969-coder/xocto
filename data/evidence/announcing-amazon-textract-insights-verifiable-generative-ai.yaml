  fact: Organizations across financial services, insurance, healthcare, and the public sector depend on
    document processing. They turn scanned files and paper forms into structured data their systems can
    act on. As generative AI has matured, these organizations want more than accurate text extraction.
    They want to describe the information they need in their own words and get dependable, auditable answers
    from complex documents. Today, we are announcing the general availability of Amazon Textract Insights
    , a new generative AI feature of Amazon Textract available through a new API within Amazon Textract.
    With Amazon Textract Insights, you describe the fields you want in natural language and submit a document
    or a mixed, multi-document packet. You receive structured results in which each value carries a confidence
    score and page-level grounding, with no model training required. The challenge of extracting data
