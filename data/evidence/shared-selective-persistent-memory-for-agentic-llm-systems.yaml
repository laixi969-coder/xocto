  fact: 'Agentic LLM systems that generate code through multi-turn tool use face a fundamental context
    problem: each session starts from zero, discarding the configuration choices, domain constraints,
    data schemas, and tool-use patterns that made previous sessions productive. Naively persisting entire
    conversation histories is both token-inefficient and counterproductive—irrelevant context degrades
    generation quality. We introduce shared selective persistent memory, a memory architecture for agentic
    systems that identifies and retains four categories of reusable context—task specifications, data…'
