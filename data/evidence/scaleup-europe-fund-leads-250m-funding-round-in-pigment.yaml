  fact: French enterprise software startup Pigment has raised $250m at a $2.3bn valuation, it said today,
    in a funding round led by the EU's new €5bn ($5.6bn) investment fund aimed at scaling up future European
    tech giants. Paris-based Pigment offers enterprises a business planning platform, helping businesses
    plan finances, operations and forecasting. It competes against the likes of Microsoft Excel, SAP,
    IBM and Anaplan. Pigment’s Series E round was led by the Scaleup Europe Fund, managed by EQT, with
    participation from World Innovation Labs, a Palo Alto and Tokyo-headquartered VC fund. Existing investors,
    including Greenoaks, Iconiq, IVP, and Meritech also participated, along with investment from Nvidia,
    which has previously been announced. It follows Pigment’s Series D $145m funding round in 2024, led
    by Iconiq. Pigment's customers include big businesses like Siemens and Unilever as well as newer tech
    companies such as Anthropic and ElevenLabs. Pigment, which leverages AI in its offering,
