  fact: 'Fine-tuning a large language model (LLM) today usually forces a tradeoff between training loop
    control and operational simplicity. With fully managed services you select a base model, provide data
    and hyperparameters, and the service owns everything else, which works well when a standard, prepackaged
    recipe fits your problem. Less managed services give you more control, but you also manage more of
    the underlying infrastructure and training frameworks. Sometimes a standard recipe isn’t enough: you
    need a custom loss or data curriculum for supervised fine-tuning (SFT), your own preference optimization,
    a reinforcement learning (RL) reward function, or an alignment algorithm published last week. As soon
    as you need to shape the training procedure yourself, you take on that infrastructure work to gain
    algorithmic freedom. Today, serverless model customization in Amazon SageMaker AI expands with training
    session APIs, which remove that tradeoff by drawing the abstraction boundary one level'
