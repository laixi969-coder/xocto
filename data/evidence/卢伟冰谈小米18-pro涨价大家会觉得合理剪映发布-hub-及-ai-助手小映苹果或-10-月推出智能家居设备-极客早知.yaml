  fact: "B 站上线 AI 无限竞技场测评榜：GPT-6 Astra 现居榜首 \n 9 月 20 日，B 站宣布上线「AI 无限竞技场」大模型测评榜，并同步公布了首轮模型排行榜。据 B 站介绍，「AI\
    \ 无限竞技场」是一个汇集了 B 站 UP 主 AI 大模型测评的竞技广场，由各领域 UP 主对上百个大模型的真实场景实测构成，涵盖代码、推理、协作、知识等多种测评主题。 \n 其中 GPT-6\
    \ Astra 在 10 个 UP 主测评中拿下榜首，打败 GLM-5.3 获得榜首次数冠军；前 5 名中，国产大模型占据 3 席。 \n 不同于传统跑分评测，B 站 AI 无限竞技场不设主题或测评维度限制，来自各个分区的\
    \ UP 主们以真实工作流、专业应用、趣味脑洞等自主命题，在同题 PK 中直观呈现各模型的实际表现差异。 \n   \n 榜单涵盖 DeepSeek、Kimi、ChatGPT、Claude、Gemini、豆包、千问、Hy、MiniMax\
    \ 等主流模型对比测评，排名实时更新，持续面向全站 UP 主开放报名。（来源：ITBears） \n   \n iPhone 18 Pro 上市首日出现死机问题，苹果回应正调查 \n 9 月 20\
    \ 日，据 CNMO 科技从韩媒获悉，苹果新款手机 iPhone 18 Pro 系列被曝出现设备突然关机后自动重启的「Panic Full」现象，反映相关问题的用户接连不断。 \n 据业内人士 9\
    \ 月 20 日透露，在拥有约 241 万会员的 iPhone 用户社区「阿沙莫」中，接连出现 iPhone 18 Pro 和 iPhone 18 Pro Max 遭遇 Panic Full 现象的帖子。Panic\
    \ Full 现象是指iPhone设备停止响应后自动关机并意外重新开机的现象。 \n   \n 一名用户称，在进入需要 Face ID 认证的银行应用或照片应用「最近删除」项目后，反复使 Face\
    \ ID 识别失败，即可重现设备关机现象。该用户表示，用手遮住 Face ID 传感器部分尝试认证，反复进行放手再遮挡的操作后，屏幕出现「请重试」提示，随后设备即自动重启。该用户称经多次测试，同一现象反复出现。\
    \ \n 科技 YouTube 频道「ZUYONI」也表示，在收到 iPhone 18 Pro 用户举报后检查了正在使用的产品，确认发生了 Panic Full。该频道称，日常使用中尚未"
