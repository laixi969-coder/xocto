  fact: Companies getting real results from AI aren’t only using foundation models (FMs) off the shelf.
    They’re customizing open-weight models using post-training techniques such as reinforcement learning.
    A model trained on your business context, product catalog, or clinical vocabulary will be more accurate
    for your task and cost less to run. When you build agents, your data, workflows, evaluations, and
    success criteria also shape how the model behaves. However, model customization is difficult. You
    must choose the right technique, set up and manage GPU infrastructure, and, for agents, build environments
    for multi-turn reinforcement learning. We launched Amazon SageMaker AI serverless model customization
    to solve these challenges, and today, we’re expanding it with the general availability launch of training
    sessions. With training sessions you get control over the post-training logic without managing the
