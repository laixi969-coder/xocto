  title: AI 时代，「种草」这件事会变成什么样？
  published_at: '2026-09-07T13:01:05Z'
  collected_at: '2026-09-07T15:53:16Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜靖宇   \n 互联网时代，鲜有一个网站或者应用，能像小红书一样在不停的转换身份和功能的进化中，穿越周期。 \n 对于现在的网民来说，你几乎能在小红书上面搜索到各种小妙招。它还是攻略集宝鉴，哪里旅游不踩坑全部奉献给小伙伴。\
    \ \n 当然，没人能忘了，这是国内公认的「种草」平台，甚至，「种草」这两个字的本源，就来自小红书本身。 \n 在 AI 时代，信息和内容以指数级的增速被生产出来，一方面确实拉低了「种草内容」的创作门槛，但另一方面，AIGC\
    \ 内容的泛滥，也让用户对平台内容产生了「过敏」，降低了对于内容的信任。 \n 对于营销从业者来说，这可能是一个新时代的挑战。 \n 如何在 AI 时代，让品牌能够更精准的找到目标用户，更重要的是，如何让品牌在这样一个内容泛滥的时期，重新赢得用户的「信任」？\
    \ \n 不久前，极客公园请到了小红书种草产品负责人许晴、悦普集团 COO 鲍白白，进行了一场深入的探讨，想要弄清，在 AI 时代，「种草」这件事将会如何进化？品牌又该如何借助平台的力量，重新获得来自用户的「信任」？\
    \ \n 本场对谈精华要点： \n AI 越擅长「完美」，人越渴望那种有取舍、有态度、带着主观温度的表达。 \n AI 发展得越厉害，人与人之间信任的经营会变得更难能可贵。 \n 小红书对应的商业产品在解决的问题，就是帮助品牌从追流量转向经营用户。\
    \ \n 把繁琐的工作交给AI处理，把人解放出来，去做更多有创意、有价值的事情。 \n 下面是本场对谈的文字记录： \n     01   \n  AI 如何影响消费决策   \n  极客公园：两位在日常生活里，有没有哪个瞬间让你们真正感觉到，AI\
    \ 改变了自己做消费决策的方式？  \n  许晴：  AI 现在已经进到了我每一个稍微大一点消费额的决策链路中。比如我最近在看扫地机器人，我会告诉AI说家里有宠物、在北京、预算大概 4000 块钱，你建议我怎么选，分别有什么优缺点。它会给一个非常严格的对比报告，三款产品分别有什么优点、什么缺点。但你说看到这个我就知道该怎么买吗？也不完全是。我可能还是会去小红书里面看一看，有没有人在吐槽它是不是缠毛发，是不是边角扫不干净，或者它跨越障碍的能力非常差。\
    \ \n 你会去看真实用户有没有吐槽，做完这一步之后我可能才会说 OK ，就定了，就买这个产品。所以 AI 现在在我的决策链条中，基本上就是帮我做初筛，不需要我自己去搜集非常多"
