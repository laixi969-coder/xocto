  fact: "GPT-6 曝光，OpenAI 总裁说：AGI 来了 \n 当地时间 9 月 3 日，GPT-6 Astra 正式发布。OpenAI 总裁 Greg Brockman 在发布会结束后，说了一句在\
    \ AI 行业极为罕见的话：「我个人认为，我们可能已经到达 AGI 了，我觉得就是这个模型。」 \n OpenAI 给 Astra 起了个简洁的 slogan：「Anything you can\
    \ do on a computer, Astra can do for you.（你在电脑上能做的任何事，Astra 都能替你做。）」 \n 新模型可以像人一样，直接「看」屏幕上的像素，然后移动鼠标、敲击键盘，完成操作。\
    \ \n 给 Astra 一张电路原理图，它在 KiCad 里完成了元器件布局和铜线走线，整个过程用时 2 分 54 秒。 \n 另一个演示是三维建模，Astra 在 Blender 里搭建了一栋房子的模型，然后将其导入\
    \ Unreal Engine 5，生成了一个可以实时漫游的建筑场景。 \n OpenAI 还公布了两个内部计时案例。「寻找猫咪临时看护」这类需要大量网络搜索、信息比对、汇总成文档的任务，Astra\
    \ 用了 5 分 27 秒，OpenAI 给出的人类对照基线是 30 分钟。「求职准备」这类需要搜索岗位、匹配简历、整理申请流程的综合任务，Astra 用了 2 分 51 秒，人类基线是 5 小时。\
