  fact: 美国时间 11 月 12 日美股开盘前， 英伟达 官方 宣布，黄仁勋辞去总裁、首席执行官和董事会成员职务，即刻生效 。 首席财务官科莱特·克雷斯（Colette Kress）出任临时 CEO，同时继续兼管财务；董事哈维·琼斯（Harvey
    C. Jones）出任董事会主席。董事会已经开始物色正式 CEO，公司内外的人选都会考虑。 黄仁勋 1993 年和两位合伙人创办英伟达， 从那时起一直是这家公司的 CEO，到今天 33 年 。 消息公布后，英伟达股价在盘前下跌
    10%。 从报道到辞职 虽然外界众说纷纭，但这份公告中并没有直接写辞职理由，只简单感谢了黄仁勋「 对公司和行业不可估量的贡献 」。 10 月 29 日，《纽约时报》报道，美国情报官员认为，与黄仁勋关系密切的女商人
    Alice Huang 曾任新加坡数据中心公司 Megaspeed 的董事总经理，而 Megaspeed 是英伟达的客户，被指帮受美国出口管制地区拿到英伟达的 AI 芯片。外交部随后否认，称报道纯属捏造。
    11 月 8 日是周日，黄仁勋给员工发了一封信，承认自己有婚外情：「我对妻子不忠。我的行为伤害了她和我们的孩子，我做的事没有任何借口。」信里没有说对方是谁。 这封信在英伟达官网公开了全文｜图片来源：英伟达
    同一天，英伟达董事会宣布启动独立调查，由独立董事组成的委员会在外部律师协助下，查他是否成了外国情报行动的目标。声明写明，董事会「没有理由认为国家安全或英伟达的机密受到了损害」，并且「对 Jensen
    和他的管理团队有信心」。 11 月 10 日，独立董事们宣布请曾任纽约南区代理联邦检察官的 Joon H. Kim 和他所在的律所 Wachtell Lipton 来做这项调查。 11 月 11
    日，《纽约时报》又报道了黄仁勋的另一段婚外情，对象是一位直接向他汇报的英伟达副总裁。当天美股收盘后，《华尔街日报》报道董事会正准备撤换他，路透社随后证实。英伟达股价白天还收涨 2.9%，报 173.73
    美元，盘后一度跌掉 8.6%。 不到一天，公告就发了出来。董事会用的词是「辞职」，彭博社的标题则写他被董事会撤换。 从第一篇报道到这份公告，只有 14 天｜图片来源：英伟达 接任董事长的琼斯 1993
