    later, OpenAI published a proof of the Cycle Double Cover (CDC) problem , then solutions to ten more
    open problems by July. And a proof of Navier Stokes in September. Anthropic published a formalization
    of the fermat's last theorem , and advanced bounds on Reimann's hypothesis . The models are suddenly
    good at math. The question that interests me is whether we can predict what kinds of problems these
