  fact: 'In just a few years, generative AI has changed the face of enterprise analytics, notably by making
    analytics accessible to users across the organization. Agentic AI promises to do even more, by automating
    entire workflows and taking actions based on agent insights. But there is a problem: The quality of
    insights that agents currently generate leaves much to be desired. Fewer than half of agent-generated
    insights at the organizations surveyed for this report lead to business improvement. And while most
    respondents praise the quality of their agents’ descriptive insights, reviews of their prescriptive
    insights—those on which actions are based—are decidedly mixed. DOWNLOAD THE REPORT Failure to produce
    insights that improve the business deprives organizations of their desired return on investment in
    agentic analytics. Worse, flawed insights that trigger incorrect actions can cause reputational or
