  title: '[开源自荐] 做了个 VS Code 扩展：快速安装更新 CLI、左右并行会话，还能让模型生成图标和图片'
  published_at: '2026-10-31T10:34:30Z'
  collected_at: '2026-11-01T01:10:23Z'
  source_kind: product
  tier: independent
  fact: "最近把自己做的 **Claude Code Config Helper（LLS CCAI）** 更新到了 **3.2.81**，想分享一下，也听听大家的使用建议。\r\n\r\n这是一个围绕\
    \ Claude CLI 做的 VS Code 扩展。最初主要是方便管理模型提供商和配置，后来自己用得越来越多，就把开发中几个经常需要切换工具的步骤放到了一起。\r\n\r\n这次主要更新了三块。\r\
    \n\r\n### 一、在扩展里安装、更新 CLI\r\n\r\n不想每次配置环境都重新查安装命令，所以做了内置引导。\r\n\r\n安装扩展后，点击 **VS Code 左侧工具栏里形似字母 A\
    \ 的 LLS CCAI 图标**，就可以进入配置：\r\n\r\n- 下载并验证 CLI，或者直接选择已经安装的 CLI。\r\n- 配置自己的模型提供商和密钥。\r\n- 选择工作区使用的模型，开始聊天。\r\
    \n\r\n后续在设置里检查更新，确认后下载安装，进度直接在界面里显示。\r\n\r\n支持官方 npm 来源，也可以选择 npmmirror 镜像。不会覆盖外部安装的 CLI，托管更新会保留旧版本文件。\r\
    \n\r\n### 二、左右两个独立会话，并行处理任务\r\n\r\n自己开发时经常碰到这种情况：主对话正在实现功能，突然需要查一个报错或整理接口，又不想把主对话聊乱。\r\n\r\n所以加了「并行会话」：**左右各放一个聊天，中间留给代码。**\r\
    \n\r\n比如：\r\n\r\n- 右侧写功能，左侧分析报错。\r\n- 右侧实现页面，左侧整理接口字段。\r\n- 一边修改代码，一边梳理测试场景。\r\n\r\n两个会话分别保留上下文、模型选择和权限设置，也可以使用不同模型。\r\
    \n\r\n这里不是自动多 Agent 编排，就是两个独立会话。**上下文分开，但工作区文件不会自动隔离**，需要自己安排好分工，避免同时修改同一个文件。\r\n\r\n### 三、内置图片 MCP：用户提需求，模型负责写提示词并生成\r\
    \n\r\n不只是文章配图，**图标、插画、封面、背景素材**等，也可以直接在聊天里提出需求。\r\n\r\n比如：\r\n\r\n> 给这个记账应用生成一枚简洁的图标，颜色跟当前界面一致，小尺寸下也要容易辨认。\r\
    \n\r\n用户不用先自己写一大段生图提示词。**聊天模型结合当前需求和项目上下文组织提示词，再调用配置好的图片模型生成**，尺寸等参数也由模型按需求提交。\r\n\r\n图片工具支持两种配置方式：\r\
    \n\r\n- **已有提供商**：选择支持图片"
