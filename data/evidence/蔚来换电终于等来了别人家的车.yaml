  project_slug: 蔚来换电终于等来了别人家的车
  url: http://www.geekpark.net/news/371233
  title: 蔚来换电，终于等来了「别人家的车」
  published_at: '2026-09-28T12:40:54Z'
  collected_at: '2026-09-30T01:18:45Z'
  source_kind: market_signal
  tier: independent
  fact: "过去一年，蔚来似乎有意在新车发布时不再过分强调「换电」的重要性。以笔者自己的体感而言，无论是新车发布会，还是线下门店里用户的讨论度，换电都不再是「最重要的那一个话题点」。 \n 但换电退到了幕后，却没有影响蔚来的新车销量：第三代\
    \ ES8 上市 12 个月销量突破 15 万台，ES9 上市 4 个月累计交付突破 3 万台。 \n 现在，换电这件事又有了新进展。 \n 9 月 28 日，在中秋假期后的第一个工作日，蔚来的能源业务迎来了一个重要的合作伙伴。吉利控股将以旗下易易互联\
    \ 100% 的股权，加上 6.4 亿元现金，入股蔚来能源。交易完成后，吉利控股持有蔚来能源 30% 的股权；易易互联的营运车辆换电业务并入蔚来能源；双方共建统一的 C 端换电技术和标准，吉利将开发面向\
    \ C 端的换电车型。另外在充电领域，蔚来也反向入股了吉利旗下的浩瀚能源，持股 10%。 \n 「换电」正在从蔚来过去卖车的「卖点」，走向一门独立的生意。 \n   \n  比钱更重要的，是「规模」\
    \  \n 6.4 亿元，对蔚来并不算一笔「大钱」。 \n 截至今年二季度末，蔚来集团的现金储备是 567 亿元，这笔钱大约只占 1%。而且，蔚来已经连续几个季度实现了正向经营现金流。蔚来现阶段最缺的，显然不是现金。\
    \ \n 所以，这并不是一次单纯的「找钱」和「融资」。 \n   \n 合作发布会签约现场 | 图片来源：蔚来 \n 本质上，换电是一门非常讲究规模效应的生意。换电站建好的那一刻，土地、设备、电池、运维等成本就基本确定了。运营能否赚钱，主要取决于每天的服务量。\
    \ \n 蔚来创始人李斌很喜欢用「云服务」来类比换电这门在汽车领域相对比较新的生意。云服务的逻辑是：前期必须投入重资产部署服务器，后期租户越多，前期投入的服务器成本才能被摊薄，直至打平甚至盈利。\
    \ \n 换电站的账也是这么算的。蔚来高层此前曾经透露，第四代换电站单站每天约 40-50 次换电，就能基本实现盈亏平衡；在长三角等核心用户区域，已经有换电站达到了这个水平。 \n 要让更多车开进换电站，核心思路有两条：\
    \ 一条是自己多卖车，这是蔚来过去几年一直在做的；另一条就是争取早日让换电从「非共识」变成「共识」，让其他品牌的车早日复用蔚来的换电体系 。 \n 易易互联过去的主业，就是给出租车、网约车这类 B\
    \ 端营运车辆换电。截至去年 4 月，它运营的换电站超过 470 座。 \n 而营运车"
