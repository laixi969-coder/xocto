  fact: 'At Natera , a leader in cell-free DNA (cfDNA) testing, keeping lab instruments up and running
    is critical, because equipment downtime disrupts sample processing. Natera’s lab engineering team,
    led by Ariel Jirau worked with AWS to build SWARM (Systematic Workflow Analytics and Resolutions Manager),
    an agentic AI system for lab operations. This post walks through how the Natera team built an agentic
    AI system for lab operations using Amazon Bedrock AgentCore that captures and deploys institutional
    knowledge at scale. It describes the full architecture, from knowledge base construction to automated
    system deployment and evaluation, so you can apply the same patterns to your own operational workflows.
    SWARM delivers about 130x faster first response time and 96.2 percent automated coverage across support
    tickets, giving engineers immediate access to institutional knowledge the moment a ticket arrives.
