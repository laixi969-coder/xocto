  title: 逛完 WRC，我们发现机器人行业最该回答的 5 个问题
  published_at: '2026-09-03T15:25:38Z'
  collected_at: '2026-09-04T00:06:58Z'
  source_kind: market_signal
  tier: independent
  fact: "8 月 19 日，北京亦庄的空气里飘着一种奇怪的兴奋，这是 2026 世界机器人大会开幕的日子。300 多家企业、2000 多件展品，几乎把具身智能行业能拿出的东西都搬到了这里：大模型、本体、关键零部件、数据，应有尽有。\
    \ \n 开幕当天，宇树科技敲钟上市，盘中市值一度冲破 4000 亿元，这可能是过去十年，中国机器人行业最接近「资本狂欢」的一天。过去，机器人公司更多活在实验室、融资新闻和 Demo 视频里；而宇树的上市，第一次给这个仍处在早期的赛道钉下了一个资本锚点。\
    \ \n 除此之外，云深处科技进入交易所受理或审核环节；智元机器人则于 2026 年 7 月确认启动赴港上市流程。一级市场的热，正在向二级市场传导，具身智能不再只是技术想象，也开始被要求回答收入、交付、毛利和规模化的问题。\
    \ \n 逛完整个展区，跟我们此前预料的一样，今年没有让所有人「哇」的时刻，更多的是 demo 的展示。宇树没有展示刚刚发布的、原地跳高 2 米、奔跑速度 12.66 米/秒的「超人」，展台上更多是已有产品在解锁新动作；众擎把八角笼搬进了会场，维他动力用二次元偶像的方式整活……热闹是真热闹，但很少有人再讲「颠覆性突破」这四个字了。\
    \ \n 比起继续追问「什么时候会有奇迹」，更值得追问的是几个更朴素的问题：机器人是不是只能长成人的样子？具身智能的「通用性」到底走到了哪一步？数据，正在从一门算法生意，变成一门硬件生意吗？那些藏在指尖、关节和电机里的关键部件，又往前走了几步?\
    \ \n 带着这些问题，我们在展馆里走了一圈，也和多家代表性公司深聊。它们不一定都最会制造声量，却分别代表了这个赛道正在发生的关键变化：本体形态的分化，通用模型的竞争，数据闭环的重构，以及关键零部件逼近「最后一厘米」。\
    \ \n 银河通用的展台上，轮式、重载和双足三种完全不同形态的机器人，跑的是同一套具身基础大模型；维他动力反过来从真实使用场景出发，倒推出了它的第一款人形机器人 Vbot ATOM；自变量在物流分拣场景里，把效率做到了每小时\
    \ 1816 件、准确率超过 98%；帕西尼，则把最初只解决「触觉」的技术方案，扩展成了覆盖全身的感知网络…… \n 具身智能仍然早期，甚至比很多人期待的更早期。它正进入一个更艰难、也更有价值的阶段，谁能把模型、本体、零部件和工程能力一个闭环，谁才可能成为下一阶段真正有价值的公司。\
    \ \n  1.机器人是不是只能是人"
