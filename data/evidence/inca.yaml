  fact: 'https://about.fb.com/wp-content/uploads/2026/10/cnib_x_meta___ms4_-_rev_4_picture_lockcc_fr-2160p.mp4
    Nous croyons que l’avenir appartient à tous. C’est pourquoi Meta s’associe à INCA, un organisme à
    but non lucratif fondé en 1918 qui aide les personnes atteintes de cécité au Canada à réaliser leurs
    rê ves, afin de permettre à davantage de personnes aveugles, sourdes et aveugles ou ayant une basse
    vision au Canada de bénéficier des avantages des lunettes IA. L’objectif de ce partenariat est d’aider
    ces personnes à explorer les possibilités offertes par les technologies portables basées sur l’IA
    et de s’appuyer sur les connaissances, l’expertise et l’expérience vécue de la communauté pour façonner
    un avenir plus accessible. Le financement de Meta soutiendra INCA dans quatre domaines : Être à l’écoute
    de la communauté: mobiliser des personnes à travers le Canada pour comprendre leurs expériences et
    la manière dont les lunettes IA peuvent favoriser une plus grande autonomie dans la vie qu'
