  fact: 陶哲轩提出「数学 2.0」：AI 解题之外，还要帮助人理解证明 10 月 11 日，数学家陶哲轩公开了在加州理工学院的演讲《数学 2.0》。他认为，AI 正在降低部分数学问题的求解成本，使数学研究逐渐从「证明稀缺」走向「证明富足」。但目前多数前沿问题仍未解决，不能只凭公开传播的成功案例判断
    AI 的整体能力。 陶哲轩指出，得到正确证明，并不意味着研究者理解了证明为何成立，或掌握了可用于其他问题的新方法。他主张用 AI 寻找更易理解的证明、整理分散的研究成果，并对大量数学问题开展系统分析。例如，等式理论项目通过人类与自动化工具协作，对超过
    2200 万个命题作出了判定。 对于 AI 解题能力的评估，他还呼吁公开计算资源消耗、失败尝试等信息。在陶哲轩看来，未来数学研究既要利用 AI 扩展探索范围，也要保留人类对证明及其现实应用的理解和判断。（来源：机器之心）
    Claude 爆发大规模封号潮：半年封杀 1140 万个账号申诉后仅 4.2 万翻案 10 月 11 日，据媒体报道，近期 Claude 账号封禁问题引发开发者讨论。受到关注的一项数据来自 Anthropic
    今年 7 月发布的报告：2026 年上半年，平台累计封禁约 1140 万个账号；收到约 39.8 万次申诉，其中约 4.2 万次申诉成功。报告未披露完整的封禁原因分布，仅凭这些数字也无法判断近期封号是否增加，但申诉结果使平台的封禁标准和复核机制受到关注。
    Anthropic 列出的违规情形包括利用服务从事违法活动、侵犯隐私，以及违反地区使用限制等。今年上半年，Anthropic 还向相关儿童安全组织提交了超过 1.5 万起报告。 此外，Anthropic
    近期修订了 Claude 使用政策，计划自 11 月 12 日起禁止用户在没有明显目的的情况下，反复对模型实施极端残忍行为。公司称，新规针对的是极端情形；用户表达不满、反驳模型、创作黑暗题材内容，以及开展模型测试与研究，不属于该项禁令的范围。（来源：快科技）
