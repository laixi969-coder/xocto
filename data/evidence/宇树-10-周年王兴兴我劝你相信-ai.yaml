  fact: 10 月 22 日，杭州国际博览中心热闹非常，不仅人多，而且机器人也特别多。 这是 2026 年宇树科技举办的世界物理 AI 大会的现场，从四足机器人到人形机器人，你甚至可以说这里是全球「机器人密度」最高的地方。
    2026 年，也是宇树科技创立的第十年。有意思的是，在今天的舞台上，宇树科技创始人王兴兴，在谈机器人之外，聊的最多的就是当下最火热的 AI。 他不仅劝所有人要「相信 AI」，而且还反思，觉得自己「相信
    AI 还相信得不够」 。 为什么这家中国、乃至全球机器人行业中最有实力的公司掌舵者，会这么说？物理 AI 的拐点，真的要到来了吗？ 必须相信 AI 在王兴兴 36 分钟的演讲中，宇树自己的产品只占了开头和结尾。中间最长的一段，王兴兴在做一件事——劝人相信
    AI。 从 AI 攻下了一批顶尖数学难题，「人类最智慧的金字塔的尖端」已经被击穿；到 AI 逆向工程让「传统软件公司的壁垒没了」；AI 视频里人物的表情和情绪「比真人演的还好很多」；顶尖大模型公司内部「已经实现了模型的自进化」。
    「这不是闹着玩的」。他的结论是，以当下的模型能力，哪怕不再进步，信息世界也已经被「完全击穿」。 然后他说了一句不太像上市公司董事长会说的话，「 我感觉我自己还不够相信，还不够坚定 」。 这不是即兴发挥。十天前的上海工博会上，他已经当众「认错」过一次，「过去十几年我犯的最大的错误，就是对
    AI 的相信还不太够」。他还给过一个倍数，5 年前或 10 年前你喜欢、相信 AI 的程度，「现在乘 10 倍都不为过」。 王兴兴在会上探讨物理 AI 的未来｜图片来源：宇树科技 更直观的变化在时间表上。今年
    8 月的世界机器人大会，王兴兴对具身智能「ChatGPT 时刻」的预期还是快则 2 到 3 年、慢则 5 到 10 年；两个月后，这个窗口被他压缩成「1 到 2 年，慢的话 2 到 3 年」。至于随便把一台宇树机器人带进陌生的家里，一句话让它把房间收拾好，「快的话可能明年就可以实现」。工博会上他说得更直白，「明年
    GPT-7 出来，可能直接把具身智能问题打穿」。 一个硬件出身的工程师，在两个月里成了全场最激进的 AI 布道者。这看上去像一次认知突变，但把宇树最近半年的处境摊开来看， 他的「相信」几乎是一道必答题。
