  fact: "The Creative Spirit of Who Framed Roger Rabbit   \nI love  Who Framed Roger Rabbit , the 1988\
    \ movie by Robert Zemeckis. I haven't watched it in quite a few years, and Cypress Frankenfeld just\
    \ pointed out this sequence from early in the movie: \n   \n \n It's a pelican riding a bicycle! \n\
    \ Look closely and you'll note that the pelican is animated while the bicycle is a real bicycle. Apparently\
    \ they filled the wheels with water to add stability, then set it running and guided it with a cable.\
    \ \n Cypress  gathered more details  on the scene. What a delight.\n\n       Via  @cypressf.bsky.social\
    \   \n\n\n     Tags:  animation ,  film ,  pelican-riding-a-bicycle"
