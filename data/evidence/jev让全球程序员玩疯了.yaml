  fact: "作者｜宇航猿  \n  编辑｜靖宇  \n   \n 智能家居社区 Home Assistant 最近出现了一个名为 HA-Jev 的插件。 \n 它的逻辑极其简单，传感器读取洗衣机的功率变化与洗衣房门的状态，然后抛出一个问题给模型，「洗衣机洗完了，衣服是不是被忘在里面了？」模型不输出任何文字分析，只返回一个概率值。当置信度超过\
    \ 0.8 时，手机就会弹出一则取衣提醒。 \n   \n  HA-Jev 仅仅用来提醒用户洗完的衣服是不是还留在洗衣机里｜图片来源：pitchhut  \n  一次判断耗时几十毫秒，花费 0.000015\
    \ 美元  。 \n 插件开发者在论坛里留下一句意味深长的话，「我过去一直在用大语言模型回答根本不需要它的问题。衣服忘没忘拿是一个判断，不是一篇八股文。」 \n 这句话恰好刺中了当前生成式 AI\
    \ 的痛处。过去四年，整个行业把几乎所有的算力、资本和工程资源，都压在「教模型说出更流畅的人话」上。大家习惯了用百亿甚至千亿参数的庞然大物，先吐出一长串思考过程，再包装成礼貌体贴的自然语言，最后让开发者用复杂的正则表达式把需要的答案抠出来。\
    \ \n 直到前 OpenAI 研究员 Diogo Almeida 带着他的新模型 Jev 登场。这个被称为「System One」的模型没有嘴巴，不生成任何文字，只输出概率判断。 \n 上线不过数天，\
    \  全球开发者围绕它疯狂砸出了近五百个开源项目  。这可能是 Openclaw 之后，最让人们兴奋的新项目。 \n 大家忽然发现，一旦剥离大模型的表达欲，原本昂贵而臃肿的 AI 应用，突然轻快得像一阵风。\
    \ \n  01  \n  大模型的「神经元」  \n 如果把过去调用 GPT-5 或 Claude 的过程比作雇佣一位全知全能的哲学家，来帮你盯监控，那么开发者们现在用 Jev 所做的事，更像是给流水线装上了无数个廉价且反应灵敏的神经元。\
    \ \n 在最耗费算力的 Agent 基础设施领域，这种变化几乎是颠覆性的。 \n 过去开发者处理超长上下文，最常用的手段是让大模型做摘要。开发者 Tamara Tran 换了个思路，写了一个 Jev\
    \ 插件用来压缩 Claude Code 的上下文。它不做任何归纳总结，而是逐条给历史工具调用的相关性打分，只要分值低于阈值，直接整条剔除。 \n   \n  用 Jev 插件用来压缩 Claude\
    \ Code 的上下文｜图片来源：X"
