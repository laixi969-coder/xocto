  fact: Google DeepMind and Alphabet’s cloud service, Google Cloud , will provide up to 200 top European
    scientific researchers with direct access to its frontier models, together with $3 million in compute
    credits, Google said today. The tech giant says the move will mean that researchers will gain direct
    access to its leading scientific tools, including AlphaFold 3, WeatherNext, AlphaGenome, AlphaEvolve,
    and AlphaEarth Foundations. Google said the move is aimed at speeding up the pace of European innovation
    and rubber-stamping Europe’s scientific competitiveness. Google said researchers will be equipped
    to tackle complex challenges faster, from predicting extreme weather patterns to mapping molecular
    structures, ensuring that European science remains vibrant and at the forefront of discovery. The
    US tech giant did not specify which researchers would get access to its frontier models. Several London-based
    AI labs, founded by former DeepMind scientists, have come out of stealth this year. Inef
