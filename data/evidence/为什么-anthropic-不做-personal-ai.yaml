  fact: 不久前，9 月 29 日的 OpenAI DevDay 开发者日，舞台上飘出了几个圆滚滚的小气泡。 它们叫 dots，是 OpenAI 最新的个人 agent。每个 dot 跑在 GPT-6
    Astra 上，拥有一台独立的云端电脑和浏览器，用户关掉 ChatGPT 之后，它还在后台继续干活。OpenAI 对它的描述是： 「 built to handle everything 」，什么都能接。
    三周前的 9 月 8 日， Meta 推出了 Muse，同样有独立的云端虚拟机，同样能在后台持续工作，同样顶着一个萌萌的卡通形象，而且直接住进了 WhatsApp。市场的反馈相当热烈，Apptopia
    的估算显示，Muse 上线 12 天全平台装机量约 280 万，一度冲上美区 App Store 总榜第一。 OpenAI CEO Sam Altman 发布个人助理 dots｜图片来源：PCMag
    再算上 Google 的 Gemini Spark 和 SpacexAI 的 Grok Bot， 「always-on 个人 agent」成了 2026 年秋天最拥挤的赛道 。 不过，名单里少了一个名字。
    Anthropic，这家靠 Claude Code 把 agent 做到最出圈的公司，至今没有一款能和 dots、Muse 正面对标的消费级产品。 没有可爱的形象，没有「你的专属 AI 分身」，也没在任何发布会上宣布过要做。
    这家拥有最好的模型、最懂 agent 的公司，为什么偏偏不做个人 agent？ 01 A 社的分布式个人 AI 其实， 在「always-on agent」这件事上，Anthropic 不但没有缺席，甚至比
    OpenAI 更早亮出了底牌。 6 月 23 日，比 dots 早了整整三个月，Anthropic 发布了 Claude Tag。 它是一个住在 Slack 频道里的 Claude，团队成员只要
    @ 一下，就能把任务交给它。和普通聊天机器人不同，一个频道里只有一个共享的 Claude，有自己的身份和记忆，谁都能看到它在忙什么，A 同事交代的活，B 同事可以接着往下推。 它也会主动干活。Claude
    Tag 会在没人提问时给出建议，还会去跟进那些已经沉寂下来的讨论串。Anthropic 自己给出了一个很夸张的数字，公司产品团队 65% 的代码，出自内部版本
