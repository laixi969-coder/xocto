  fact: 本文首发于 Founder Park 公众号 · 2022 年 8 月 15 日   对于创业公司来说，如何搭建好的企业文化一直是个难题。         而且，好的企业文化也不是一劳永逸的，随着企业的发展和扩张，如何持续改进公司的企业文化，让新人更好适应企业的文化，也是一件不容易的事。好的企业文化能让交流事半功倍，同事们彼此认同，为着同一个目标努力。         而不好的企业文化，则会成为交流的绊脚石，或者员工大量离职的某种诱因。         如何构建企业文化，今天这篇文章从实践的角度，辅佐以大量的案例，比如没有伴随公司发展的
    Wework 的企业文化和伴随公司发展的推特的企业文化的不同，还探讨了其中比较关键的如何沟通，如何践行企业文化等。             编译来源   ：How to Design (and Redesign)
    the Practices of Company Culture    作者 ：梅丽莎·戴姆勒（Melissa Daimler）   翻译 ：孙薇  梅丽莎·戴姆勒是网课提供商 Udemy 公司的首席学习官，Udemy
    是提供成人新兴技能为主的在线课程公司，于 2021 年在纳斯达克上市，上市首日市值 38 亿美元。  梅丽莎·戴姆勒曾在 Wework、推特和 Adobe 公司担任过负责人，同时也开设了自己的精品咨询与培训业务。             10
    人团队和 100 人团队需要的企业文化是不一样的。      刚毕业的大学生可能喜欢周五晚上的团建，已婚人士则不是这么看的。      对于企业负责人来说，永远不要觉得沟通过多，那可能意味着只是刚刚好。      良好的沟通不单单是信息更新，而是关乎彼此的连接。      不是所有信息都需要即时回复，保持异步沟通更有助于保持工作效率。            「昨日的成功，会是明日的镀金牢笼。」——彼得·布洛克         在思考文化落地时，我常会想起一则「炖肉准则」（Pot
    Roast Principle）寓言：曾有个世代相传的传统，要将炖肉的两头切掉。直到外孙女问起祖母关于这个传统的起因时，她发现真正的原因只是祖母的烤盘太小了，不把炖肉两头切掉，就放不进去。         这也是传统和规章制度世代传承的方式。我们观察、学习、原样执行，但不问根由。当公司还年轻时
