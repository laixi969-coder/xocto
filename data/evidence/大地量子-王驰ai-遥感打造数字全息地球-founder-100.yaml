    世纪 60 年代兴起的卫星遥感技术，如今正在很多领域发挥作用。        在《自然》杂志评选的 2020 年十大科学发现中，「卫星图像绘制地球树木地图」名列其中。国际上多个科研机构的二十几名科学家合作完成了一项看似不可能的任务：利用卫星遥感图像，详细描绘出西非地区
    130 多万平方公里区域内超过 18 亿棵树的位置和树冠大小。     同样的技术，也可以用来监测粮食长势、分布等变化，用来了解水域分布、水污染情况、洪涝灾害等。     2013 年，国内外学者开始用深度学习的方法进行智能遥感解译的研究并取得了诸多研究成果。     2020
    年，国内科技公司大地量子作为唯一一家中国企业名列由美国非营利组织「Radiant Earth Foundation」发布的「2020 全球机器学习地球观测市场地图」。2021 年，大地量子再次被纳入「2021
    全球机器学习地球观测市场地图」。     关于遥感卫星技术的发展，以及 AI 技术在遥感数据中的应用，我们和大地量子的创始人 & CEO 王驰聊了聊，还讨论了他们的「 订阅式数字地球  PaaS  服务
    」。                  最终愿景是做一个全息地球，记录过去、观察现在、预测未来。    「订阅式数字地球 PaaS 服务」的核心是平台的 PaaS 服务和底层数据的不断更新。    遥感卫星技术的发展依赖商用航天领域的发展，目前的数据以开源卫星和商业卫星数据为主。    这是个全球化的市场，也面临来自全球的竞争，但核心的竞争还是技术上的数据处理和提取。    行业的技术进步与
