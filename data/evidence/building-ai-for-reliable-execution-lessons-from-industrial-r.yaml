  fact: 'When you think of robotics and AI, you probably first think of full humanoid robots like Figure’s
    AI-powered machines and 1X’s NEO home robots . Those may well be the future, but arguably more important
    in 2026 is industrial robots — which are typically not humanoids. Standard Bots claims to be “America’s
    largest AI-native industrial robot manufacturer.” It recently raised $200 million at a $1 billion
    valuation, in a series C round led by General Catalyst and RoboStrategy, a fund focused on robotics.
    Its customers include NASA, Amazon and Lockheed Martin. We spoke to Evan Beard , co-founder and CEO,
    and Leif Jentoft , Head of AI, to find out more about Standard Bots’ AI stack and how its models work.
