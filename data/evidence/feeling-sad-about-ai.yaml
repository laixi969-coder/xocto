  fact: "My comment  on  Feeling sad about AI  — Hacker News.  I'm not sure how useful it is to say this,\
    \ but I think a lot of people (myself included, a few years ago now) have been through this moment\
    \ of existential crisis and come out the other side. \n The initial reaction, when some coding agent\
    \ does a piece of work that would have taken you a week in an hour and does it  well , is to be very\
    \ disheartened by it. \n Once you come to terms with the idea that translating an exact specification\
    \ into decent code isn't a unique skill any more, you can start looking at the larger set of problems\
    \ that you face as a software engineer and realize that there is  so much left , and your existing\
    \ skill and experience mean you can master these new tools, provide value, and execute at a level\
    \ far greater than anyone who is just getting started building software using agents without any of\
    \ your depth. \n If you don't want your profession to change at all then you're going to have a tough\
    \ time with this - but"
