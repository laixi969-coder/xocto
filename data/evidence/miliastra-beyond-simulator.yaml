  title: 现在 AI 是不是逐渐能取代很多高水平程序员了
  published_at: '2026-10-13T00:35:14Z'
  collected_at: '2026-10-13T03:03:52Z'
  source_kind: product
  tier: independent
  fact: "一句话，codex 帮我把光追加入到了我正在开发的游戏引擎中，感觉我已经不用干啥了。\r\n这在以前好像是很难想象的。\r\n\r\n目标是给 vulkan 渲染器加上光追，但一次就写对，并完美整合到现有代码中，这种能力其实已经说明了\
    \ AI 对很多代码的理解度不再比人类差了。下面是我发的视频，大伙可以看下效果：\r\n\r\n [我只说了“要有光”，codex 就帮我加好了光追]  https://www.bilibili.com/video/BV1sHpX6EEci/?share_source=copy_web&vd_source=dc379818946312063729495537a1e411\r\
    \n\r\n\r\nP.S 我正在设计适合 AI 开发游戏的游戏引擎，项目已开源 https://github.com/EVEngine/EVEngine\r\nC++20 + Vulkan +\
    \ Webgpu 实现，类型 love2d 风格，但功能更强大，喜欢的朋友多多支持。"
- id: ev-db55ba523ce8210e
  project_slug: miliastra-beyond-simulator
  url: https://www.v2ex.com/t/1251538
  title: 1024 程序员节 - EVEngine 引擎实战，做个进击的大肥鱼
  published_at: '2026-10-24T11:39:17Z'
  collected_at: '2026-10-25T00:21:00Z'
  source_kind: product
  tier: independent
  fact: "今天是程序员节，用最近开发的 AI 游戏引擎整个活，进击的大肥鱼横版游戏制作实战（上）。\r\n没有写代码，全程由几个 agent 完成绝大部分工作。我就负责监督+试玩。\r\n\r\n\
    详细视频请看： [ [自研引擎]  1024 程序员节游戏 Demo 实战-大肥鱼和她的朋友们]  https://www.bilibili.com/video/BV1FfHK6CEbb/?share_source=copy_web&vd_source=dc379818946312063729495537a1e411\r\
    \n\r\n游戏背景，大肥鱼邀请她的朋友去海边玩耍时，被海边的虾兵蟹将和恶龙欺负了，于是她们决定清理一下海滩。好吧，我不胡扯了。\r\n\r\n总之，一个简单的横版 demo ，花了约 2 小时时间由\
    \ codex 调用 EVEngine 制作（中间一些 AI 自己调试的过程我给剪掉了），主要是展示一下 EVEngine 开发游戏的工作流程。\r\n\r\n引擎已经开源： https://github.com/EVEngine/EVEngine\r\
    \n项目主页： https://evengine.github.io/\r\n喜欢的朋友别忘记 star 一下，多多支持。"
