  fact: 搭载 PROLED XDR 显示屏的 MacBook Pro｜图片来源：Apple 2010 年 10 月 20 日，乔布斯在苹果「Back to the Mac」发布会上，给触屏笔记本下过一个结论：「我们做过大量用户测试，结果证明这行不通。触控表面不该竖着放。演示效果很好，但用一会儿你就会累，用久了，胳膊都要掉下来。这行不通，人体工学上糟透了。」
    16 年后的今天凌晨，苹果发布了第一台带触屏的 Mac：搭载 PROLED XDR 显示屏的 MacBook Pro，14 英寸和 16 英寸两个尺寸，芯片是 M5 Pro 和 M5 Max。国行
    14 英寸 22999 元起，16 英寸 27999 元起，10 月 30 日上午 9 点开始预购，比美国晚一天多，11 月 6 日发售。 14 英寸和 16 英寸两个尺寸，刘海换成了灵动岛｜图片来源：Apple
    芯片还是今年 3 月发布的那一代。原来那款 mini-LED 屏的 MacBook Pro 没有下架，两条产品线并排卖，起步配置一模一样：14 英寸 M5 Pro 都是 24GB 内存、1TB 存储，mini-LED
    版国行 19999 元，触屏版 22999 元。16 英寸和 M5 Max 版也一样，官网上同配置的两台，每一档都差 3000 元；在美国，差的是 400 美元。 芯片、内存、硬盘都一样，这 3000
    元买到的是三样东西：一块 OLED 屏，一块能用手指点的屏，一个更轻的机身。14 英寸重 1.38 千克，比同芯片的 mini-LED 版轻 220 克；16 英寸 1.82 千克，轻了 320
    克。 16 英寸 1.82 千克，14 英寸 1.38 千克（图中为英制磅数）｜图片来源：Apple 手指能做的事 发布前一天，彭博社记者古尔曼发了一条帖子：苹果花了差不多 20 年告诉大家，触屏笔记本在人体工学上很糟，手臂会累，结果明天它还是要做，而且对自己说过的这个问题完全没有回应。最后他补了一句：不管怎样，我很期待。
    看完新闻稿，他说对了一半。 苹果给手指安排的事，都是短促的动作：滑动滚动网页，双指缩放照片，在两个 Keynote 文稿之间拖幻灯片，轻点两下让窗口铺满屏幕，轻轻一扫把窗口贴到屏幕一侧。再往专业一点，是在整块屏上画画，在
