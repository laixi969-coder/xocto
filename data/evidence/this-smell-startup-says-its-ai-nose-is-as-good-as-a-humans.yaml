  fact: In a lab near Newark Airport in New Jersey, a team of around 30 experienced human sniffers are
    slowly working their way through every odor on Earth. Their careful notes—“nutty,” “peachy,” “marine”—are
    cross-referenced with a chemical analysis to create a rich set of training data for what AI startup
    Osmo calls the world’s first foundation model for smell. The company’s goal, says founder Alex Wiltschko,
    is “to give computers a sense of smell.” “Scent molecules are really the only language most species
    on this planet can speak,” he says. “Most species can’t communicate with sound or visually, so it
    truly is Earth’s original language. And it’s incredibly powerful for us, from a memory and an emotional
    standpoint. You can smell something once and remember it for the rest of your life. You can smell
    something on the street and be pulled back to high school.” In the last few months, Wiltschko claims,
