  fact: "> [!WARNING]\r\n> **Self-hosted deployments using the bundled Weaviate must complete a manual,\
    \ staged upgrade before starting 1.17.1.** The bundled Weaviate server moves from `1.27.0` to `1.39.2`\
    \ — 12 minor versions — and skipping minors **is unsupported**. Pulling and restarting can silently\
    \ and permanently break vector search. See Upgrade Guide below. Fresh deployments, external Weaviate,\
    \ and other vector stores are unaffected.\r\n\r\n### New Features\r\n\r\n**Dataset-Scoped Knowledge\
