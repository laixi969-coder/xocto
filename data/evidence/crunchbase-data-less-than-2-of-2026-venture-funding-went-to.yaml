  fact: For the past few decades, the vast majority of U.S. startup funding has consistently gone to companies
    in blue states or purple states, where Democrats control all or some statewide offices. But with Tuesday’s
    election results, the investment divide between blue, purple and red states has grown even more pronounced.
    So far this year, less than 2% of all startup investment has gone to companies in post-election red
    states, defined as those that will have both a Republican governor and two Republican U.S. senators.
    The red states’ share is much smaller than in years’ past due to five states shifting to purple. Of
    those, the largest venture hub is Texas, which shifted to purple with the election of Democratic Senator
    James Talarico and Governor Gina Hinojosa, followed by Ohio. This year, as of Election Day, startups
    in the remaining 17 red states 1 , which are home to nearly a quarter of Americans, had collectively
