  fact: A London-based AI company co-founded by a former Google DeepMind research lead and AlphaGo co-creator
    is launching today, pursuing a “compute-efficient” alternative path to Anthropic and OpenAI’s frontier
    AI models in progressing AI. Thore Graepel, who left Google DeepMind this summer, is launching AI
    company Metis Reasoning , which is understood to be initially raising tens of millions of dollars,
    marking the latest AI company springing up out of London. Graepel, who is a co-creator of AlphaGo,
    an AI programme developed by Google DeepMind which made history by defeating human players at the
    Chinese board game of Go, and his co-founders have put together a 12-strong team. The team is made
    up of researchers, mathematicians, robotics experts and tech entrepreneurs to pursue a different approach
