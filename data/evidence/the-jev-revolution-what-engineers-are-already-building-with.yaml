  fact: 'Today at the AI Engineer Code Summit , the main theme was system one models — non-generative
    models that return structured choices, scores, or probabilities. They’re also typically much faster
    and cheaper than reasoning LLMs (a.k.a. system two models). And who better to give an inspirational
    rallying cry for system one models than Diogo Almeida , co-founder and CEO of TypeSafe AI . Almeida
    was lead creator of Jev , the product that kicked off this trend less than two months ago. Jev was
    an instant revelation for AI engineers when it was released in September. In a podcast with Latent
    Space on launch (which quickly became our most popular episode of the year), Almeida explained the
    core problem with making LLMs the heart of software: reliability . In his keynote at AIE Code today,
    he took it a step further by claiming that Jev is “reliable intelligence” that should be used for
