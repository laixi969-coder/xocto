  fact: Updating the Amazon Sagemaker AI real-time endpoint configuration (changing the instance type,
    instance count, or environment variables) causes deployments through AWS CloudFormation or the AWS
    Cloud Development Kit (AWS CDK) to fail. SageMaker AI requires you to deregister the scalable target
    before updating the endpoint, but when you deregister it, CloudFormation can’t track the AWS Application
    Auto Scaling resources. In this post, we show you how to use a reusable CDK construct with AWS CloudFormation
    custom resources to orchestrate deregister and register auto scaling automatically during endpoint
    updates. You can update your endpoint configuration and auto scaling parameters in a single deployment
    without manual intervention. Why this problem occurs When you deploy a SageMaker AI endpoint with
