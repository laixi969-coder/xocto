  fact: We’re announcing the availability of Forum in Indonesia—a purpose-built app for people who want
    to go deeper on Facebook Groups. Forum brings your Facebook Groups into one dedicated app, making
    it easier to join conversations, find answers and participate in discussions that interest you. It
    is available to download on Android and will be available soon on iOS. Just log in with your Facebook
    account to find your groups and discover new ones. “Facebook has always been about connecting people.
    In Indonesia, we see how communities play an important role in bringing people together around shared
    interests, experiences, and needs. Through our conversations with local Facebook Group admins, we
    recognize the importance of making it easier for them to nurture these connections and support meaningful
    interactions. With Forum, we hope to better support Indonesia’s vibrant communities for its members
    and the admins who help them thrive,” said Pieter Lydian, Country Managing Director Meta for Indo
