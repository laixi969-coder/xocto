  fact: 'Sign language processing systems have traditionally operated at the sentence level, ignoring
    critical discourse phenomena fundamental to sign language comprehension. We introduce DiscoSign, a
    computational approach for discourse-aware text to sign language gloss translation grounded in linguistic
    research. We address three key phenomena within our modular Large Language Model (LLM)-based translation
    framework: (i) spatial coreference resolution, where entities maintain consistent spatial locations
