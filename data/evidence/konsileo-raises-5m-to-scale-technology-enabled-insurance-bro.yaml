  fact: UK-chartered insurance broker Konsileo has raised £5 million in equity funding. The investment
    was led by long-term shareholders Committed Capital and ACF Investors. Launched in 2017, Konsileo
    is a technology-enabled commercial insurance broker providing insurance and risk management services
    to businesses across the UK. The company employs more than 220 people and arranges more than £85 million
    in annual insurance premiums. Technology sits at the centre of Konsileo’s broking model. The company
    has developed its own end-to-end platform to automate administrative tasks, embed compliance checks
    and improve the quality of risk information captured by brokers. Konsileo says the platform reduces
    process effort by half, allowing brokers to spend more time working with clients. Its technology also
