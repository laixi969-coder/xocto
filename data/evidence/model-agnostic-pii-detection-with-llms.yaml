  fact: A configurable, model-agnostic detector that turns any large language model on Amazon Bedrock
    into a PII detector. Because the entities to detect live in a prompt rather than in code, one detector
    adapts to new entity types without retraining, and it outperforms an off-the-shelf tool across five
    public corpora and nine LLM-based detectors.
