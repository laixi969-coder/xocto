  fact: YouTube is adding a "Made with AI" label to tracks that were "altered or fully generated" using
    AI, with a similar approach to its existing process for applying AI labels to videos . It doesn't
    sound like this will apply to any and all use of AI tools in making music, but according to YouTube,
    it includes things like "using a generative model to create the composition and vocals." In its rules
    for music partners who upload their songs, YouTube lays out how to disclose generative AI use, and
    says that if there's no disclosure, it may use "other signals" to decide if a song is AI-generated.
