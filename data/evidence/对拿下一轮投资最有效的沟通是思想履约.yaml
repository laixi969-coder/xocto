  title: 对拿下一轮投资最有效的沟通，是「思想履约」
  published_at: '2026-09-19T04:10:23Z'
  collected_at: '2026-09-20T00:09:45Z'
  source_kind: market_signal
  tier: independent
  fact: "最近有个创业者找我交流的时候，聊到团队接下来还要做进一步的融资，很认真地问了我一个问题：这次做对外传播也是希望能对融资有帮助，你有什么建议？ \n 我当时听完，先跟他说了两个目睹了好几代创业者后的观察：\
    \ \n 首先，咱要个心理预期：绝大部分情况下，第一笔投资是你最好拿的那笔钱。 \n 第二，凡是能被公关轻易影响的投资人，大概率都不是对你未来最至关重要的投资人。 \n 真正愿意笃定你，给你出大钱的机构，以及真正愿意押上青春和自身能力的顶级人才，从来都不是被\
    \ PR 搞定的。 \n  看过那么多创业者的历程后，我发现那些优秀  投资人  要被打动，  底层  其实  有个「A-B-C 连线」的方法论 。然后我就给他讲了当年王兴的故事。 \n 回到当年千团大战最热的时候，所有对手都在疯狂投站台广告、发补贴、烧钱抢地盘，甚至当时的「领头羊」拉手网都自信到倒排出了上市日期。王兴却说：「团购投广告和烧钱这事算不过账，商业模式跑不通，不能这么花。」\
    \ \n 那时候整个行业包括他公司内部都是一片质疑：你不烧钱，别人一统江湖了，你账上留着钱有什么用？大家都觉得美团在这场竞争中悬了。 \n 后来王兴甚至为了证明公司不是没钱烧，被逼得发布会上直接亮出了银行流水单——账上确实趴着\
    \ 7000 万，证明他真不是没钱，是真的不烧。 \n 结果拉手网倒在上市前三个月，原因很简单，因为算不过账，商业模式跑不通。最后是美团一统了团购的江湖。 \n 在这个转折点发生之前，王兴说什么，外界都打着大大的问号，但在这个转折点发生之后，似乎全世界都服了——大家发现，全世界都错了，王兴是对的。\
    \ \n 王兴自此拿到了高维度的信任资产。 \n 所以等美团面临外卖大战时，即便后来阿里进场力挺饿了么，王兴却换了一套和当年截然相反的逻辑：「今天要把钱给到最有效率的人去烧。比如我。」结果投资人认了，给钱让他直面阿里的炮火，结果他就是拿下了市场老大的地位。\
    \ \n 所以为什么那时候投资人信他？这 100% 不是 PR 做得有多好，而是因为他此前积累下的那个「信用」，大家真的信他了。 \n 讲完王兴的故事，我跟这位创业者拆解了下背后的逻辑： 真正决定你能不能拿到深层信任的，不是单点的公关发声，而是你在时间轴上的「A-B-C\
    \ 连线」。  \n   \n  A 点（历史决策）：  你在充满不确定性、大家甚至看不懂的时候，下了什么注？为什么这么选？ \n  B 点（客观结果"
