  fact: "My comment  on  There's No Limit to How Bad Code Can Get  — Lobste.rs.   [In reply to a comment\
    \ about burning it down to start from scratch when technical debt becomes overwhelming]  \n In my\
    \ experience it's  so rare  for that to work. \n You announce the old thing is irrecoverably drowning\
    \ in tech debt. You spin up a team to rewrite it from scratch. Work begins. \n Meanwhile the old thing\
    \ remains a moving target: it's running the core business, so changes are still necessary. The developers\
    \ working on it know that it's going to be made obsolete by the new thing soon, so they don't have\
    \ any incentive to go beyond the smallest effort possible to add the new features. Technical debt\
    \ continues to mount. \n Meanwhile, the team working on the new thing are ambitious and probably a\
    \ little naive. They start out at a great pace - it's greenfield after all - but as time progresses\
    \ it becomes apparent that nobody fully understands the behavior and scope of the thing they are replacing.\
