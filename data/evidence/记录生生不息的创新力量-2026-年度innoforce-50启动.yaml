    范式变化： 不是对既有产品、技术或组织模式的局部优化，而是在关键路径上形成新的解法。 2. 创造新可能： 能够打开过去难以实现、难以商业化的新场景、新市场，为用户、行业或社会创造新的增长空间。 真实价值
