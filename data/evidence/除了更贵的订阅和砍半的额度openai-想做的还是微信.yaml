  title: 除了更贵的订阅和砍半的额度，OpenAI 想做的还是「微信」
  published_at: '2026-09-29T18:59:48Z'
  collected_at: '2026-09-30T01:18:45Z'
  source_kind: market_signal
  tier: independent
  fact: "模型越来越便宜，付费给的用量却砍了半 \n \n  作者｜Alan  \n \n 北京时间 9 月 30 日凌晨，OpenAI 开完了它口中「迄今规模最大的一届」开发者大会。官方汇总页上一共列了\
    \ 25 项发布，从新模型、新 API，一路排到给企业买软件用的应用市场。 \n \n 现场最安静的一刻，出现在 Sam Altman 讲到 ChatGPT Pro 会员调整的时候。台下没有一个人鼓掌。\
    \ \n 调整本身不复杂：每月 200 美元的 Pro 200 价格不变，新订阅的用量缩水；另外新增一档 Pro 500，每月 500 美元，用量是 Plus 的 25 倍，外加一个个人套餐里只有它能用的提速档\
    \ Astra Ultrafast。 \n 那一阵沉默，比 25 项发布里的任何一项都更能说明今天的本质主题：这场大会真正改掉的，是 ChatGPT 收钱的方式：它不再按一个聊天软件收费，开始按一个「员工」收费，干多少活、干多快，都明码标价。\
    \ \n \n 月费和用量，都是 Plus 的 25 倍｜图片来源：OpenAI \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n   AI 开始领工资\
    \   \n \n 和之前预热的一样，毫不意外今天 OpenAI 这次把最大的篇幅留给了 dots，官方中文页面也保留了这个英文名。 \n \n 按官方说法，每个「dot」都由 GPT-6 Astra\
    \ 驱动，有一台自己的云端电脑和浏览器，能连接 4,000 多个应用，全天候运行。 \n \n 用法其实也很像派活。你给它一个目标，划定哪些操作它可以自己做主，它就会主动开工。它可以待在 ChatGPT、Slack\
    \ 和 Teams 里，OpenAI 产品负责人 Tibo（Thibault Sottiaux）在现场发推说，它干活的时候，你还能直接给它打电话。 \n OpenAI 描述它的原话，是「能够持续承担职责的智能体」，还设想未来多个\
    \ dot 组成团队，协同为你工作。 \n 「承担职责」这四个字挑得很准。过去的 AI 助手是你问一句、它答一句；dot 的设定是你不在的时候，它也在干活。这更像招聘启事里的写法，而不是软件说明书。\
    \ \n \n dots 先只给每月 100 美元起的 Pro｜图片来源：OpenAI \n dot 的门槛不低。个人用户里只有 Pro 套餐能用，Tibo 特别说明包括每月 100 美元的 Pro"
