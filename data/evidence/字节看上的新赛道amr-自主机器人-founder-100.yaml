  fact: 本文首发于 Founder Park 公众号 · 2022 年 8 月 12 日                 每个传统行业都值得进行数字化改造，带来新的需求和发展契机。         餐饮已经被改造，下一个，似乎轮到仓储物流了。         曾经
    AGV 自主导引机器人作为物流科技的体现被大肆报道。现在 AMR 自主移动机器人凭借其优势，正在逐渐取代 AGV 机器人的地位，成为更加智能的「搬运工」。         属于 AMR 的时代正在来临。         这个领域也出现了众多被资本热捧的创业公司，Syrius炬星便是其中引人关注的一家。在发展路径上，Syrius炬星有些另类，先出海到机器人巨头林立的日本市场，积累经验之后又回到了国内。而这家公司的创始人兼
    CEO 蒋超，是原谷歌 Google X 实验室 Project Tango 项目负责人，这样的背景似乎让他和另外一些同领域创业者有着不同的思考方式。         最近，我们邀请到了蒋超，一起聊聊
    AMR 自主移动机器人的发展和未来。                 先天的地理条件和消费背景决定了美国是大型仓储，而国内更多是小物流的快速中转。    工业自动化机器人领先的日本，在智能化时代有些落伍。    AMR
    是可以称为智能化的机器人，而 AGV 某种程度上只是自动引导小车。    RaaS 模式是配合 AMR 机器人的新销售模式，成本更低，更容易拓展。    Syrius炬星提供的是物流能力，而不是单纯的物流工具。    无人化仓库可能是终局，但不可一蹴而就。               01    AMR   是    工业智能化机器人新方向        Founder
