  fact: Today, I’m talking with Hayden Field, The Verge ’s senior AI reporter, about the Anthropic IPO
    for the third and final episode in our series about AI in real life. The AI lab behind Claude went
    public on the Nasdaq last Thursday. The numbers are gigantic, but not really that important for this
    conversation, except to say that Anthropic has become one of the most valuable companies on the planet.
    The real story is what happens now — and whether Anthropic can continue to thread the needle of caring
    about and investing in AI safety while also being a public company beholden to shareholders. Oh, and
    it also continuously growing the amount of money it makes so it can keep paying its ever-increasing
    compute bills, which total roughly $900 billion over the coming years. All of these ideas sit in a
