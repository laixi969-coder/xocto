  fact: NVIDIA and Korea’s Ministry of Science and ICT (MSIT) are expanding their collaboration across
    the country’s sovereign AI ecosystem, from AI semiconductors and data center infrastructure to talent,
    startups, models, agents and security. The collaboration lays the groundwork for Korean NPU and XPU
    companies to explore participation in the NVIDIA NVLink Fusion ecosystem, and includes NVIDIA training
    and certification programs, hackathons and technical seminars to strengthen GPU utilization. Through
    Korea’s AI for All initiative, NVIDIA will collaborate with three selected consortia and four leading
    Korean foundation model builders, using NVIDIA Dynamo software to optimize and scale AI inference.
    In addition, NVIDIA today announced a collaboration with SK Telecom and Rebellions, supported by MSIT,
    to advance sovereign AI infrastructure for Korean models and workloads with NVIDIA NVLink Fusion.
    Read more in the press release .
