  fact: My longest running agent testbed has been building the Interconnects Dashboard — an aggregator
    of all of the best data on open model adoption and performance from across the web. This dashboard
    is freely available and becoming quite useful. Still, all the measurements we have on open model adoption
    are incredibly imprecise. We have noisy platform metrics, marketing-related metrics from startups,
    and imperfect public evaluations. It takes an informed eye to figure out where things are going. These
    research notes are my current best approximations of where we stand. As with most things on Interconnects,
    our goal is to build well more value than we capture, so the data on the dashboard will remain free
    for the foreseeable future. These notes will be more raw than many of my articles, a place for sharing
    what I’m mulling over but don’t have complete evidence for (yet). They will be primarily paid, enabling
