  fact: 'Today, I’m talking to Kevin Roose, journalist and author of the new book The AGI Chronicles ,
    which details the recent and explosive transformation of the AI industry. Kevin was a longtime New
    York Times reporter and host of the popular podcast Hard Fork , but he and friend of the show Casey
    Newton just left the Times to start the all-new tech podcast Machine Gods , which launched last week
    . Kevin and I talked about launching Machine Gods and what it’s like to go from The New York Times
    to being an independent creator — and then of course we talked about the book, which is an excellently
    reported dive into the companies racing to build artificial general intelligence. I wanted to get
    a sense from Kevin of what it was like to report this, to try and understand these characters and
    this moment in time, and where it all goes next. Fair warning: This conversation takes a pretty philosophical
    turn at the end, but I think you’ll find it a really worthwhile back-and-forth. Okay: Kevin Roose'
