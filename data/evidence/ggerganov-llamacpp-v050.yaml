  fact: "## Overview\r\n\r\nThis release focuses on backend performance and correctness, broader model\
    \ coverage, and more robust server/router operation. It adds HRM-Text (DFM Mimir 1B) support, MiMo-V2.6\
    \ and HunyuanOCR conversion support, ggml 0.25.0 backend improvements, multi-address HTTP binding,\
    \ image outputs from function calls, and several chat parser/UI fixes.\r\n\r\n### Highlights\r\n\r\
    \n- Accelerate CUDA `conv2d` with implicit GEMM ([#29135](https://github.com/ggml-org/llama.cpp/pull/29135))\r\
    \n- Add Metal MoE and SSM_CONV fusion optimizations ([#28948](https://github.com/ggml-org/llama.cpp/pull/28948))\r\
    \n- Allow the server to bind to multiple addresses ([#28690](https://github.com/ggml-org/llama.cpp/pull/28690))\r\
    \n\r\n### API changes\r\n\r\n- Add `llama_adapter_lora_init_from_file_ptr()` for loading LoRA from\
    \ an open FILE ([#28993](https://github.com/ggml-org/llama.cpp/pull/28993))\r\n- Document `llama_model_load_from_file_ptr()`\
    \ as reading from the current position and requiring aligned mmap ([#28993](http"
