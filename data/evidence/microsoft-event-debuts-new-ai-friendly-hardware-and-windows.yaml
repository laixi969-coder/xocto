  fact: In its first live event in two years, Microsoft today announced its newest Surface laptop, outlined
    a host of changes coming to Windows 11, and shared a vision of how local-AI and agentic workflows
    could reshape personal computing for those in the dev community as well as home enthusiasts. Surface
    Laptop Ultra Originally teased in May 2026 , the new Surface Laptop Ultra will be Microsoft's first
    offering to take advantage of the new Nvidia RTX Spark SoC (system on a chip). The device has a starting
    price of $2,599 and comes in various SoC and memory configurations, with either a 5120-core or 6144-core
    Blackwell GPU and up to 128GB of LPDDR5x unified memory. It will begin shipping on October 16 and
    is available for preorder now. While the new Ultra is clearly focused on the developer crowd, graphical
    performance was highlighted during the presentation to show off just how capable the laptop can be.
