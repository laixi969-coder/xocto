  fact: This is a monthly column that runs down five interesting startup funding deals that may have flown
    under the radar. Check out our previous entry here . From teaching robots to do everyday household
    chores to using lasers to track satellites in space, this month’s crop of interesting startup deals
    spans some decidedly different corners of tech. Other startups that caught our eye are working on
    making cement production less polluting, turning agricultural waste into a useful tool for carbon
    removal, and helping independent video game developers get their product in front of more players.
