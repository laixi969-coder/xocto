  fact: Kimi K3.1 Pro Highspeed from Moonshot AI is now available on Amazon Bedrock . Part of Moonshot
    AI’s new K3.1 series, it’s a post-trained version of Kimi K3 with the same 3T-class open-weight architecture
    and 1-million-token context window, trained with substantially more post-training compute. According
    to Moonshot AI, that extra training targets long-horizon agentic work and fewer factual errors. It
    also improves professional tasks such as financial modeling and office documents, and coding for game
    engines, 3D scenes, and computer-aided design (CAD) scripts. Kimi K3.1 Pro Highspeed generates output
    tokens at a higher rate and Moonshot AI reports 2–3 times the speed of Kimi K3.1 Pro. Kimi K3.1 Pro
    Highspeed uses the same endpoint, APIs, and features as Kimi K3 on Amazon Bedrock. If you already
    build with Kimi K3, you can try it by changing the model ID in your existing code. Kimi K3.1 Pro Highspeed
