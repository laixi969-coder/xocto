  project_slug: 麒麟-9050-pro-现身余承东秀英文华为新三折叠太有活了
  url: http://www.geekpark.net/news/369954
  title: 麒麟 9050 Pro 现身、余承东秀英文，华为新三折叠太有活了
  published_at: '2026-09-07T09:13:27Z'
  collected_at: '2026-09-07T15:53:16Z'
  source_kind: market_signal
  tier: independent
  fact: "「Super Intelligent！Super cool！」 \n 你很难想到，华为终端 BG 董事长 余承东，会在正式场合突然充满自信的飙英文。 \n   \n 余承东在发布会上展示华为\
    \ Mate XT2 非凡大师三折叠手机｜图片来源：极客公园 \n 9 月 7 日的华为秋季全场景发布会上，余承东在介绍当天的重磅新品华为 Mate XT2 非凡大师时，突然用英语评价起了这款产品，「超级智能、超级酷」，翻译过来就是英文版的「遥遥领先」。\
    \ \n   \n 余承东公布华为 Mate XT2 非凡大师三折叠手机售价｜图片来源：极客公园 \n 作为隔年更新的第二代三折叠手机，19999 元起的华为Mate XT2 非凡大师固然是当天最大的亮点，但比产品本身更让人激动的，是余承东在介绍产品搭载的芯片时，团队将「麒麟\
    \ 9050 Pro」的大字打在了屏幕上。 \n 搭配上自研的 GPU、NPU等全套组合，Mate XT2 非凡大师代表华为已经基本有了「芯片自信」。 \n    真旗舰，真非凡  \n 作为全球首家推出三折叠手机的厂商，华为在三折叠上有显然的「领跑自信」，即便外国友商推出类似产品时，面对华为三折叠\
    \ 100 万台的销量，也很难不「徒呼奈何」。 \n 但如果细究起来，华为 Mate XTs 三折叠手机至少在硬件上，还有很大的改进空间。 \n 首先「N」字型的折叠方式，其实非常「不直觉」，极客公园在上手体验的时候，前几个小时每次折叠手机时候，都要先回忆一下，到底应该先折哪里。\
    \ \n 这个痛点在新版产品上被彻底解决了，Mate XT2 非凡大师的折叠采用了「先左后右」的左右折叠和开合的方式，操作体验要比上一代更直觉，更方便。 \n 采用了新的铰链结构和更坚固的内外屏玻璃和材质，Mate\
    \ XT2 非凡大师更加坚固，但同时华为团队又能在此基础上，还把手机尺寸削薄了 1 毫米，也是神人。 \n   \n 麒麟 9050 Pro 芯片的现身，无疑是发布会的高潮｜图片来源：极客公园 \n\
    \ 但说实话，和 Mate XT2 非凡大师本身硬件上的创新相比，此次产品搭载的华为麒麟 9050 Pro 芯片，可以说是全场亮点——受困于制裁，过去几年华为对于新品搭载的芯片多少有点讳莫如深，但今天的发布会上，麒麟9050\
    \ Pro 的字样，被做成大字打在公屏上，从某种意义上代表， 对于华为来说，可能不仅意味芯片已经不再是卡脖子的元素"
