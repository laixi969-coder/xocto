  fact: How should security leaders preserve human oversight as AI agents take on more work? Permissions
    establish which actions agents can take, but a permitted action can still warrant a person’s judgment.
    Requiring approval for every step might seem like the safest approach, yet multi-step tasks can produce
    repeated prompts , even for routine actions. Research on security warnings shows that attention and
    adherence can decline with repetition. The challenge isn’t to require more approvals, but to preserve
    attention for decisions that need human review. Smart Approvals in Amazon Quick addresses this challenge
    by reviewing eligible actions within your existing controls. It evaluates each proposed action against
    the user’s request and either approves it automatically or returns it to the user for review. It does
    this without granting additional permissions or removing required human approvals. Security leaders
