  fact: After weeks of backlash —and a failed attempt to quell it —Meta has indefinitely delayed plans
    to update its commercial terms and require Meta Business account users to allow extensive AI training
    on external websites linked on Facebook. "We're pausing the ‌changes ⁠as we continue to engage with
    stakeholders and ​take ​our ⁠time to get this right. ​In the ​meantime, ⁠our existing terms remain
    in ⁠effect," a Meta spokesperson told Reuters. Soon after Meta notified business account holders of
    the upcoming changes, legal experts warned Nieman Lab that the vague language could allow the company
    to ignore scraping preferences specified in robots.txt files and exhaustively crawl vast amounts of
    off-Facebook content for AI training. Since virtually every news publisher has a Facebook page, Nieman
    Lab sounded the alarm that Meta could potentially avoid millions in licensing fees if the TOS update
    happened as planned. Read full article Comments
