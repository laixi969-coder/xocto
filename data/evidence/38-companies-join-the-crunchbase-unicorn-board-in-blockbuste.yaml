  fact: A total of 38 companies joined The Crunchbase Unicorn Board in September, adding $71 billion in
    value to the board. Semiconductors, financial services and space technology led for new counts with
    the remainder hailing from a broad swath of industries including biotech, AI infrastructure, AI training,
    security and frontier labs. Twenty-one of last month’s new unicorns are U.S. headquartered. Six new
    unicorns joined the board from China and three from the U.K., while Canada, Saudi Arabia, Japan, Israel,
    Italy, Finland, Germany and Bulgaria each added one new unicorn. Through September, 311 companies
    have joined the board so far this year, putting 2026 on track to be the second-highest year for new
    unicorn creation, following only the venture peak year of 2021, when counts topped 600. Several companies
    already on the board stand out for significant valuation increases via new raises last month. They
