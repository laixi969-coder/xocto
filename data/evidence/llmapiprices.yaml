  fact: "最近在整理 LLM API Prices  https://llmapiprices.com/ 的模型数据时，关注到了 TypeSafe AI 推出的 Jev 。TypeSafe AI\
    \ 推出的 Jev ，思路和 GPT 、Claude 这类大模型不太一样。\r\n\r\n它不主打聊天和长文本生成，而是专门做结构化决策：你提前定义好选项，Jev 返回每个选项的评分和概率。\r\n\
    \r\n比如：\r\n\r\nPASS          0.92\r\nFAIL          0.06\r\nNEEDS_REVIEW  0.02\r\n\r\n这种方式特别适合 AI Agent\
    \ 、任务路由、内容分类、自动审核、风险判断等场景。\r\n\r\n官方公布的性能最高可达 250K tokens/s 、1,200 RPM 。\r\n\r\n如果你正在做 Agent 或自动化工作流，这个项目值得看看。"
