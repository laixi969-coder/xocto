  fact: 'German energytech unicorn 1KOMMA5° has reached a valuation of $1.35 billion in its latest financing
    round as it prepares to increase investment in its AI-powered energy management business. The Hamburg-based
    company plans to invest more than €100 million in its energy AI platform, Heartbeat, in 2027. Heartbeat
    AI is designed to automate energy management processes, including electricity trading, billing, and
    metering, as part of the company''s broader focus on home electrification. 1KOMMA5° is also considering
    expanding into the United States next year, with CEO Philipp Schröder pointing to strong investor
    interest as a factor behind the potential move . Speaking to Reuters, Schröder said: "We''re considering
    entering the US, because we''ve seen how much drive and how much interest from investors is actually
    behind that." The company is also keeping the possibility of a US initial public offering under consideration.
