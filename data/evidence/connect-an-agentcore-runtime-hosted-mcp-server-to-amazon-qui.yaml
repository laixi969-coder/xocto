  fact: In this post, you will learn how to deploy and host your MCP server in AgentCore Runtime and integrate
    it with Amazon Quick, along with the prerequisites. With this pattern, you promote reusability and
    avoid duplication of AI tools, so clients can reuse commonly used tools and agents exposed through
    an MCP server instead of authoring them from scratch again. Your customers get a way to use your product
    inside Amazon Quick (chat agents and workflows) without building custom connectors for every use case.
