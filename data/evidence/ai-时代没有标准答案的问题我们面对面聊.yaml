  title: AI 时代没有标准答案的问题，我们面对面聊
  published_at: '2026-11-06T12:09:13Z'
  collected_at: '2026-11-07T01:57:09Z'
  source_kind: market_signal
  tier: independent
  fact: 我们刚刚官宣了极客公园创新大会 2027 的首批嘉宾。 今天，再来揭晓「小场深谈」的最新进展。 10 月底，我们在「小场深谈」的预热文章里做了一次调研，请大家投票选出最想聊的话题。最终，我们选定了最受关注的五组主题，设下了五场专场，每一场都从大家最想聊的那个问题开始。
    这五场专场，恰好瞄向当下行业最受关注、也最要紧的议题上：Personal AI 怎么接管日常、AI 创作怎么重写内容、具身智能怎么走进现实、硬件与制造怎么长出「新图纸」、AI 落地怎么用结果说话。
    每一场，三组话题，深谈 + 现场问答，80 分钟左右。场子都不大，百余人左右。 IF 2026「小场深谈」现场 还记得去年的「小场深谈」，有人刚从大厂跳槽、正用 AI 做自己的第一款产品，当场把困惑摊给嘉宾；有精神科医生，追问做陪伴机器人的创业者：你希望它把人带回现实交往，还是给这个家添一个新成员？——现场的发问，往往带着一个人具体的处境，比文字更触动人心。
    今年五场「小场深谈」的主题与要讨论的核心议题已经基本确认： Day1 Personal AI 是如今最热门的创投叙事，每个人都有不同的理解。但能真正谈论这个话题的创业者并不多。 我们将邀请行业内最受关注、获一线资本加持，且已经有实践成果的先行者，到场激辩，带来他们的「非共识」：
    Personal AI 到底能帮普通人做什么？为谁解决什么需求、能接手哪些日常事情，为什么有人持续用它？ 从海外产品看，我们愿意把多少事情交给 AI？信任的边界在哪里？ 从「记住我」到「帮到我」：AI
    如何用个人数据真正发挥作用？ Personal AI 还可以从哪些场景切入？哪些才通向更长久的生命力？ Day1 从创作方法到发行变现，从短片、剧集、3D 动画到线下音乐会，AI 正在重写内容生产的每一个环节。
    作为当下国内 AI 创作领域最具代表性的平台之一，极客公园将与共创伙伴即梦AI，把话筒交给最懂它的人——本场邀请即梦上的最佳实践者，那些最有资格讲、也玩得最出彩的创作者，到场分享他们的真实玩法。
    当人人都能生成影像，创作的价值如何被重新认识？新进入者与专业创作者，分别带来了什么？ AI 创作正从「生成一个片段」走向「完成一部作品」——新的内容格式从哪里长出来？ 门槛消失之后，审美、故事与生活经验，这些藏在幕后的人的能力，正在怎样被重新定价？
    Day1 机器人从演示走向落地
