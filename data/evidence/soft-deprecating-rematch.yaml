  fact: "Soft-deprecating re.match()   \nPython has a concept of  soft deprecation , where APIs are marked\
    \ as \"should no longer be used to write new code\" without any promise/threat to remove them in the\
    \ future. \n Python 3.15 release manager Hugo van Kemenade describes how in the upcoming 3.15 release\
    \ soft deprecation has come for the venerable but deeply confusing  re.match()  function. It's now\
    \ available with the much clearer alternative  re.prefixmatch()  name - reflecting how it anchors\
    \ at the beginning of the string but not the end. \n Most of the time you probably want  re.search()\
    \  (match this pattern anywhere in the string) or  re.fullmatch()  (match the entire string) instead.\n\
    \n       Via  Lobste.rs   \n\n\n     Tags:  python ,  regular-expressions"
