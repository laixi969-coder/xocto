  fact: Jensen Huang is considering a comeback as Nvidia’s chief executive, as allies in Silicon Valley
    pressure the company’s board to reinstate him days after the tech executive resigned over reports
    he had affairs with a suspected Chinese spy and a subordinate. Huang has discussed with confidants
    the possibility of returning, according to multiple people familiar with the matter—even as an independent
    probe by Nvidia’s board investigates the conduct that led to a spectacular leadership crisis at the
    $4 trillion chip company this week. One Huang ally told the FT they were putting together a “war room”
    of Silicon Valley executives to lobby for the former Nvidia chief’s return and would try to garner
    support from the White House. Read full article Comments
