  fact: 本文首发于 Founder Park 公众号 · 2022 年 10 月 20 日   今年 9 月 22 日，辉凌制药（Ferring Pharmaceuticals）宣布旗下药物 RBX2660
    的疗效和安全性已经获得美国 FDA 咨询委员会的高票赞同，距离获批上市越来越近。    微生物制药领域即将进入商业化阶段。    从 2007 年美国启动人类微生物组计划开始，微生态医药以及微生物相关技术的发展就进入了加速阶段。在政策的推动下，Evelo、Finch、Seres、Rebiotix
    等一大批微生物制药明星企业涌现出来。据不完全统计，全球微生态制药公司已经超过了 50 家，其中有 30 余家已经累计吸金超过 30 亿美元，辉瑞、罗氏、强生  等 跨国制药巨头也纷纷布局微生态制药赛道。     国内的微生态制药行业处于快速起步的阶段，在去年
    12 月刚完成  1 亿美元 B 轮系列融资的未知君 就是其中的代表公司，其药物研发思路是 AI + BT（生物科技）模式。未知君专注于肠道微生物治疗 AI 制药研发，研发的粪菌移植药物 XBI-302
    已经获得 FDA 临床试验的 IND 批准，目前已有四条药物管线进入临床研发阶段。    微生物治疗相比传统治疗优势在哪里？AI 是如何助力微生态药物研发的？以及，在微生态药物研发赛道，国内企业的优势又在哪里？    9
    月 30 日，在极客公园的 Rebuild 2022，极客公园创始人 & 总裁 张鹏和未知君联合创始人 & CEO 谭验一起，聊了聊国内微生态制药的现状及商业发展前景。       谭验做客极客公园的「Rebuild」栏目
    | 来源：直播截图        01       微生物治疗相比传统治疗        更安全、更长效        张鹏：肠道微生物和人的身体健康以及疾病之间，有哪些关联？        谭验    ：300
    多年前，列文虎克发明显微镜，第一次在显微镜下发现微生物。后来人类发现了抗生素，第一次发现可以杀死病原的微生物，这是人类历史上非常大的一次进步。抗生素出现后，人类寿命有了非常大的延长。几十年前，一些肿瘤病人在感染病原菌之后，肿瘤会缩小，那时不知道原理，后来才发现是因为感染了微生物、病原菌，免疫系统激活之后，会杀死肿瘤细胞。这一发现也为我们带来了如今的免疫治疗。    2007
