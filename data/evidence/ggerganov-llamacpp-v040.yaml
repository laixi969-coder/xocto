  fact: "## Overview\r\n\r\nllama.cpp 0.4.0 adds initial Qwen3.8-Flash-Next and Nemotron-3-Puzzle support,\
    \ on-demand tensor reading, per-slot server context limits, video input options, and a ggml update\
    \ to 0.23.0 with major sparse flash attention and RDMA work.\r\n\r\n### API changes\r\n\r\n- Added\
    \ `llama_lazy_mode` and `lazy_mode` ([#27794](https://github.com/ggml-org/llama.cpp/pull/27794)).\r\
    \n- Added `max_buf_size` to quantize params ([#27795](https://github.com/ggml-org/llama.cpp/pull/27795)).\r\
    \n- Bumped session/state versions for KV-cell token tracking ([#27762](https://github.com/ggml-org/llama.cpp/pull/27762)).\r\
    \n- Added `mtmd_input_part` and `mtmd_tokenize_from_parts()` ([#28250](https://github.com/ggml-org/llama.cpp/pull/28250)).\r\
