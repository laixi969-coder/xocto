  title: 躺起编程：我给 VS Code 做了个扩展，躺在沙发上也能用手机接着和 Claude Code 写代码，从查看测试结果到追问报错，不用远程桌面，也不用重新解释项目上下文
  published_at: '2026-11-22T23:04:40Z'
  collected_at: '2026-11-23T02:45:54Z'
  source_kind: product
  tier: independent
  fact: "![截图](https://zhinengdev.oss-ap-northeast-1.aliyuncs.com/x-phone-vscode-demo.jpg)\r\n\r\n最想离开工位的时候，往往是刚让\
    \ Claude Code 跑完一轮修改、正在等测试结果的时候。人可以先去沙发上躺一会儿，可要是测试挂了，只想追问一句「哪条断言没过」，难道还得起身回电脑前？\r\n\r\n我给自己做的 VS Code\
    \ 扩展 **Claude Code Config Helper（LLS CCAI）** 加了一个「远程办公」入口，就是为了这几句话。电脑留在书桌上，手机用浏览器打开同一个项目、同一段对话。从手机发出的下一条消息，会进入电脑上的\
    \ Claude Code 会话；等它回复，手机也能看到结果。这就是我说的**躺起编程**。\r\n\r\n## 躺在沙发上，适合做什么？\r\n\r\n我不想把桌面 IDE 缩成巴掌大。真要对照两个文件看几十行差异，我还是会回电脑前。手机最顺手的是**看结果、给方向，以及及时喊停**。拿测试失败举个例子，在同一个会话里可以这样接：\r\
    \n\r\n> **在电脑前：** 跑一下这个项目的测试，先不要改代码。  \r\n> **到了沙发上：** 把第一条失败用例的预期值和实际值列给我。  \r\n> **如果还没看清原因：** 先停在这里，我回电脑看差异，不用继续改。\r\
    \n\r\n中间不用把终端输出复制到另一个聊天窗口，也不用在手机上拖鼠标找那一行报错。关键不是让手机写得比键盘快，而是离开键盘以后，那一句有用的追问还能接得上。\r\n\r\n## 为什么不用远程桌面，或者直接在手机上开个\
    \ AI 聊天？\r\n\r\n这三种方式都能用，但解决的不是同一个问题。想点某个设置、看浏览器里一个按钮有没有错位，远程桌面更合适；想问一个和项目无关的语法问题，手机上新开一个聊天就够了。我想做的是第三件事：**接着电脑上刚才的工作说下一句话**。\r\
    \n\r\n比如测试输出了两条错误，我只想问「第二条和第一条是不是同一个原因？」。这句话在新聊天里几乎没意义：哪两条？哪个项目？刚才跑的是什么命令？但在刚跑完测试的那段会话里，「第二条」有指向，不用先把一屏日志从电脑搬到手机。对我来说，能省掉的是这一趟来回，不是那几个字的输入时间。\r\
    \n\r\n## 一个具体例子：月底到期的测试为什么红了？\r\n\r\n下面拿「领取一个月体验」做个例子：假设你正在做这个功能"
