  url: http://www.geekpark.net/news/370328
  title: 给 AI 发外设，戴森派摄像头进嘴、绿联给充电宝开了扇窗
  published_at: '2026-09-15T06:01:55Z'
  collected_at: '2026-09-16T00:21:06Z'
  source_kind: market_signal
  tier: independent
  fact: "AI 正在把所有硬件重新做一遍，这句话说了三年，这周轮到了一把牙刷。 \n 今天，IFA 柏林开展，一千九百个品牌都在不同角度展示自己的创新力，连戴森都掏出了一款牙刷来告诉行业，我也能用\
    \ AI 玩出花样，牙刷 Dyson CameraJe 刷头下藏着一颗 1 毫米的摄像头，每秒盯着你哪颗牙没刷干净。联想打造了个人智能体 Qira，横跨着电脑、手机、手表等多设备生态。你在哪里，智能体跟随服务到哪里。\
    \ \n 我们发现，不少公司想明白了一件事，与其从零生一个新物种，不如顺手改造一个老物件。牙刷、手表、鼠标、充电宝，全是用了几十年的东西，AI 不负责发明它们，AI 负责把它们重做一遍。改造，正在比发明更快地成为这个秋天的硬件主题。\
    \ \n 正当一批人忙着证明无处不 AI 的时候，也有人对 AI 不屑一顾。电子纸徽章 TICKEY 不发光，充一次电能挂两个月。一位创客造的相机，按下快门吐出一张永不褪色的电子纸照片。「我用技术还原物品本身」也成为当下造物的一条思路。\
    \ \n 我们还注意到手机背后的磁吸接口正在长出新物种。磁吸墨水屏、磁吸充电宝，磁吸拍照神器，IFA 上，绿联甚至给自家的磁吸充电宝开了透明天窗，既想要屏，也想要充电功能。大家对手机内的功能升级审美疲劳时，开始琢磨手机外的其他玩法了。手机背面，或许正在变成手机硬件的下一个配货架。\
    \ \n 以下，是「造物 100」栏目第 5 期推荐的最新造物。 \n Violoop：给 AI 找工位，配了一套键盘和鼠标 \n 所有公司都在教 AI 找接口，深圳的 Bvio 反着来，选择给\
    \ AI 造一个工位，并配上了一套键盘和鼠标。 \n Violoop 是一个手掌大小、带触摸屏的小盒子，HDMI 线抓取你的屏幕画面，USB 口模拟真实键鼠。把它插上任何一台 Windows、Mac\
    \ 或 Linux 电脑，AI 就能像人一样看着屏幕、动手操作。一些传统没有接口的老软件，AI 都能打开。9 月 4 日在 IFA 柏林全球首秀，Kickstarter 定档 9 月 15 日，早鸟价\
    \ 399 美元，零售价 699 美元，10 月发货。 \n 该团队 CEO Jaylen He 是 YC W19 的连续创业者，CTO 出身 MIT，此前在 ADI 给 Xbox 和 HoloLens\
    \ 设计过芯片。今年 3 月，团队一个月内连拿两轮融资，IFA 首秀当天官宣种子轮累计 20"
