  title: 我又做了一份 AI 顶会论文数据集，可喂给 agent 做技术选型，需要自取
  published_at: '2026-08-25T11:56:36Z'
  collected_at: '2026-08-25T22:45:06Z'
  source_kind: product
  tier: independent
  fact: "上次我做了一份 2023 年的 AI 论文数据集，有 7000 多篇，没想到还挺受欢迎的\U0001F449https://www.v2ex.com/t/1229793?p=1#reply9\
    \ ，还有老哥问我啥时候更新。所以今天我又来了。\r\n\r\n这次我整理了 2024 年的四大 AI 顶会论文，总共 9817 篇。在等更新的各位可以自取啦\U0001F449https://huggingface.co/datasets/JensCS/top-ml-conference-papers-2024\r\
    \n\r\nhttps://i.imgur.com/zIpVT53.png\r\n\r\n这次收录的论文来自四场 AI 顶会：\r\n\r\n- NeurIPS 2024：3960 篇\r\n\r\
    \n- CVPR 2024：2692 篇\r\n\r\n- ICLR 2024：2251 篇\r\n\r\n- ACL 2024：914 篇\r\n\r\n机器学习、计算机视觉、自然语言处理，过去一年几个最活跃的\
    \ AI 研究方向，基本都在这里了。\r\n\r\nhttps://i.imgur.com/1UNwgMc.png\r\n\r\n这份数据集并不是一份只有标题和摘要的目录。每篇论文都整理了研究领域、具体任务、核心问题、主要创新、方法、基线和实验结果，算下来一共\
    \ 24 个字段。\r\n\r\n数据里还留着论文的原文片段和对应的章节位置。看到一个实验结果，可以顺着位置查一下它是写在主实验、消融实验，还是附录里，不用只信一句脱离上下文的总结了。\r\n\r\
    \n接下来我大概讲下怎么用。\r\n\r\n平时我们想知道一个方向最近在研究什么，通常要从搜论文开始。但是搜论文你只能搜到一些很浅层的信息，比方说主题、摘要什么的，AI 论文常常涉及到的基线啊、测评集、试验条件啥的，你还是要去自己翻。你读十篇还能靠耐心，面对几千篇论文，靠人一篇篇翻就不太现实了。\r\
    \n\r\n所以这时候，你就可以拿到这份数据集，作为一份可以直接筛选和比较的研究材料，去加快你的工作进度。\r\n\r\n比如你正在找下一个实验方向，那么你可以先选定任务，再把相关论文的核心问题、主要创新、基线和关键指标摆在一起看。这样哪些问题已经被研究烂了，哪些假设还没有充分验证不可靠，以及哪些方法只在少数数据集上成立，一对比看得清清楚楚。沿着这些缺口继续追，就有机会找到值得验证的新问题。\r\
    \n\r\n你也可以把这批数据直接交给 Research Agent 。让它先梳理某个方向的技术路线，归纳不同论文共同依赖的假设，寻找尚未覆盖的场景或相互矛盾的结论，再据此整理 research\
    \ gap ，提出下一步可验证的实验方向。因为数据里保留了原文片段和章节位置，Agent 给出的判断还能继续回到论文中核对，而不是只剩一段没有出处的总结。\r\n\r\n如果不搞科研，那做技术选型也能用上。你可以先找出使用同一评测集的论文，再核对模型规模、基线和实验条件。论文里都说自己效果好，但如果训练资源、数据和"
