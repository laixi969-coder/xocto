  fact: 大模型融资还在继续，新的押注转向了能边听、边看、边说的 AI。 作者｜Li Yuan 编辑｜ 郑玄 想象这样一个家庭场景。 孩子正在玩玩具，突然，厨房里「哐」的一声，玻璃碎了，紧接着传来孩子的声音：「不是我。」语速很快，尾音压得很低，有点紧张。两秒后，一只猫从厨房门口窜出来，钻进了沙发底下。
    今天的模型，能分别识别这些信息。转写模型能记下孩子的话，音频模型能听出是玻璃碎裂，视觉模型能认出那只猫。但把这些能力叠在一起，模型仍然不知道刚才发生了什么。 那声脆响是从哪个方向来的？碎玻璃、那句急着撇清的「不是我」、逃窜的猫，是不是同一件事？厨房地上有没有碎片，孩子是不是正光着脚站在旁边？AI
    需要把声音、画面、人物和前后发生的事情联系起来，在信息还不完整时作出判断，必要时继续观察或向人确认。 但这比识别一行命令、一段语音、一帧画面复杂得多。 过去几年，大模型越来越擅长处理被写进文档、代码和
    Prompt 的世界。但这份能力有一个前提：有人先理解现实，再把它整理成模型读得懂的输入，模型随后完成推理和回答。进入真实世界以后，这两件事需要同时发生—— 模型既要持续理解一个仍在变化的现场，也要在现场继续发生时迅速回应，并根据新情况随时调整。
    10 月 12 日，模思智能宣布完成超 10 亿元 Pre-A 轮融资，由华控基金领投，主要投资方包括国开科创、上海科创基金、新微资本、徐汇资本、追光硬科技创投、临港策源基金等，元禾控股、上海国投旗下上海科创集团、星连资本等老股东持续投资。这轮融资距离天使轮官宣只隔了半年左右。
    这家由复旦大学 特聘教授、上海创智学院副院长 邱锡鹏 教授创立 、成立不到两年的公司，瞄准 的正是 这里，公司 将其定义为 构建情境智能。 「我对下一代 AI 的一个判断是，它会从回答问题走向持续在场。模型不只是等人输入，而是要持续理解人和环境，在合适的时候回应、行动。我们现在做全模态实时交互，就是在解决这件事。」邱锡鹏表示。
    模思从声音开始，逐步拓展至视觉理解、音视频生成和实时交互。据公司披露，2026 年以来，它围绕语音、视觉和实时多模态连续发布了 20 多个模型，其中包括多个开源模型。其中 7 月开源的 MOSS-VL-Realtime
    已经能持续接收视频流，画面一变，判断就跟着更新。 过去几年，大模型越来越擅长回答一个已经提出的问题；接下来，或许更它还要学会理解
