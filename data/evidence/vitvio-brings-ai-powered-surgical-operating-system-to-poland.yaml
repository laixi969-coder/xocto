  fact: US-European founded startup VitVio is bringing its AI-powered surgical operating system, Vetro,
    to Poland for the first time through a new partnership with the University Clinical Centre in Gdańsk
    (UCK), one of the country's largest public teaching hospitals. Founded in 2024 by Thomas Knox (CEO),
    Dr Peter Rennert (CTO), Maks Kozarzewski (COO), and Aleks Pajewski (CPO), VitVio uses computer vision
    and ambient sensing to create a real-time, 3D representation of operating rooms. Vetro uses AI agents
    to automate tasks such as logging surgical milestones, identifying delays, and providing real-time
    information to hospital coordinators. I spoke to Maks Kozarzewski, co-founder and COO of VitVio, to
    learn more. Starting with orthopaedics and neurosurgery The initial deployment at UCK Gdańsk will
    involve a small number of operating rooms across orthopaedics and neurosurgery. Following the pilot,
