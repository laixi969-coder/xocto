- id: ev-e0d1a7cdc75e0931
  project_slug: ps5lm
  url: https://github.com/cobanov/PS5LM
  title: 'GitHub - cobanov/PS5LM: llama.cpp on a jailbroken PS5: run any GGUF ...'
  published_at: ''
  collected_at: '2026-10-18T00:29:14Z'
  source_kind: pain
  tier: independent
  fact: 'Earlier PS5 LLM work hand-writes GPU kernels for one model at a time. PS5LM ports llama.cpp itself,
    so every architecture and every quantization llama.cpp supports comes along: Qwen, Llama, Mistral,
    Gemma, from 1-bit to 8-bit. Qwen 3.8''s smallest open model is 27B, and only the 2 to 3 bit quants
    fit in the console''s memory, which llama.cpp already has.'
