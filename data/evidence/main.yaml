  fact: Modern AI systems are being deployed in complex domains such as medicine, science, and law, where
    there is often not a single correct answer given the observed evidence. Such systems must be able
    to represent and update uncertain beliefs about the world as new evidence arrives to make rational
    decisions. We introduce the novel technique of studying LLMs as information processing rules and utilize
    the information processing gap—the deviation from Bayes updates—to study the internal (in)consistencies
    of how LLMs update their probabilistic beliefs from evidence. Our extensive experiments evaluate…
