  fact: Go Eve , a joint spin-out from University College Dublin (UCD) and Imperial College London, has
    secured £750,000 in funding from Innovate UK and private investors to further develop its electric
    vehicle (EV) charging technology. The funding will support an 18-month project focused on improving
    DockChain, the company’s patented technology that enables a single DC fast charger to serve multiple
    parking bays. Supported by NovaUCD, Go Eve has developed DockChain to help fleet operators expand
    their EV charging capacity without installing a separate fast charger at every parking bay. The technology
    allows multiple vehicles to remain plugged in while a compatible charger serves them sequentially,
    one at a time. This approach can reduce the number of chargers and the electrical infrastructure required,
    potentially lowering installation costs and accelerating deployment. The new project will focus on
