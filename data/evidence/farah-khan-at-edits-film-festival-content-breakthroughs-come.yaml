  fact: Today the curtains came down on the Edits Film Festival in Mumbai, in the presence of filmmaker
    Farah Khan, festival judges Ahsaas Channa, Dolly Singh, Nikhil Taneja and Rajeev Masand and over 100
    content creators in the audience. The festival awarded its winners – Ishank Gupta ( @filmmaker.ishank
    ), Sanya Rohillaa ( @bunniestbunnytoeverbunnny ) and Ahsan Vazir ( @ahsan_vazir__ ) for their great
    storytelling and use of Edits for editing their content. Top Submissions from the festival Submissions
    for the Edits Film Festival commenced in August, where in a duration of 45 days, you were encouraged
    to submit a piece of content made from unpolished videos in your camera roll, and edited using Edits,
    Instagram’s video editing app. While the Official Selection played at the festival demonstrated this,
