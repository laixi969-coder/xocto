  fact: 本文首发于 Founder Park 公众号 · 2022 年 11 月 28 日   一款科技潮玩的发布会，却选在了有着悠久历史的  福建华安土楼，对此，星奇世界的创始人 & CEO 张子楠是这么说的，
    「我们是做科技潮玩的，一定要把潮的感觉、有标新力的感觉传递出去。」 体育场可能合适但不够潮，他们更想玩出场。    说起无人机必会想到大疆，而与此相比，穿越机则是一个更小众，大众更不了解的赛道。星奇世界将穿越机定位为科技潮玩，并且试图将其打造成一款所有人都能享受的科技产品。但是面临的现实问题依然有很多。    如何让大众接受小众穿越机的概念？如何从技术和产品实现上真正将穿越机做成科技潮玩，以及，让所有人都能享受到穿越机的本质价值？    关于这些问题，以及星奇世界对于穿越机赛道的更多想法，我们和星奇世界的三位创始人进行了一场详谈。     参与本次采访的嘉宾有：     星奇世界
