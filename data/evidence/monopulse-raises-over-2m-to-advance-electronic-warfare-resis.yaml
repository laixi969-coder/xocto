  fact: Danish-Lithuanian Unmanned aerial vehicle manufacturer MNP Technologijos, operating under the
    Monopulse brand, has raised over €2 million from investors in Lithuania and abroad. Investors included
    Coinvest Capital, Plug and Play, and NGL Ventures, whose angel syndicate contributed €560,000 from
    68 investors, its largest syndicate to date. Founded in 2021, Monopulse develops advanced reconnaissance
    drones for NATO militaries, and its technology covers both aerial and water-based surveillance. Its
    technology focuses on making drones more reliable in electronic warfare environments, where communications
    and navigation signals can be disrupted or jammed. Monopulse combines aerospace engineering, electronics,
    sensor fusion, computer vision, and AI to develop drones capable of maintaining communications or
    operating autonomously when signals are lost. Its products include the Falcon MK3S drone platform,
