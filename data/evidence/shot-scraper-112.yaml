  fact: "Release:   shot-scraper 1.12  \n         I've added WebP support to my  shot-scraper  screenshot\
    \ automation tool. You can now take a WebP screenshot of a web page like this: \n  shot-scraper https://simonwillison.net\
    \ -o screenshot.webp --quality 80\n  \n The  --quality  option sets the quality - without that option\
    \ the WebP file will be lossless. \n In my experience WebP screenshots are almost always significantly\
    \ smaller in file size than their JPEG or PNG equivalents. See  the PR  for some examples. \n I shipped\
    \ this feature so I could use it to generate the screenshot  for my new commit-rewriter tool . \n\
    \    \n    \n         Tags:  playwright ,  shot-scraper"
