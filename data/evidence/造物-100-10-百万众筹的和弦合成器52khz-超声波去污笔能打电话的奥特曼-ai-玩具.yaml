  fact: 这周苹果发了新一代 HomePod mini，149 美元，10 月 30 日开卖，真正的新 Siri 要等之后的软件更新才到。科技巨头正抢着在假日季前，把 AI 小设备摆上货架。 大公司的打法很统一，
    先造一个入口，再把 AI 慢慢塞进去 。但这周名单里的产品，走的是另一条路。NOPIA 把乐理做了只有一个八度的键盘，按一个键出一整个和弦。InstaSpot 把超声波清洗机缩成一支 65 克的笔。Nothing
    在耳机上加了一个物理开关，可以一键切换道监听调音模式。这些原本属于专业设备的能力，正在被一件件压进可以随手带的小东西里。 而且它们做的方向越来越窄，这样意味着不用跟大厂比算力，只要把一个小痛点解得足够深。众筹页上的数字也说明有人买单，NOPIA
    的目标是 5 万美元，最后筹到 161.9 万。不过用户得足够认这个痛点，才肯为一件只做一件事的东西付 650 美元。在众筹之后更考验小公司的是交付能力，NOPIA 要等到 2027 年初才发货。把能力下放到口袋里不难，难的是让它在口袋里待得住。
    以下，是「造物 100」栏目第 9 期推荐的最新造物。 降噪耳机 Nothing Headphone (1) Pro：每边三个单元，价格涨了 100 美元 Nothing 9 月 28 日发布了头戴降噪耳机
    Headphone (1) Pro，399 美元，比一代贵了整整 100 美元，9 月 29 日起在官网、亚马逊和 Best Buy 开卖。Nothing 在告诉音乐人，这副耳机也可以拿来干活，不只是拿来好看。
    这 100 美元花在哪了？最直观的是发声单元，每边从一个 40 毫米动圈，变成了三个：一个管低音的动圈，一个管中频的动圈，再加一个 xMEMS 高音单元，等于每边请了三个人分工。降噪麦克风从六颗加到十颗，官方称平均降噪量强了
    5 分贝，覆盖的频段宽了 40%。电池 1060mAh，官方称开降噪能用 30 小时，关降噪 68 小时，充 5 分钟能听 2 到 4 小时。另外支持 LDAC 和 Hi-Res，蓝牙 6.1，带
    Auracast。 外观还是那个透明的路子，但材料升级了。铝合金框架配钛合金头梁，透明耳罩换成了 9H 的熊猫玻璃，9H 说的是耐刮硬度，对一副要天天丢进包里的耳机来说，这个升级很实在。 软件和调音是和伦敦的
    Metropolis Studio
