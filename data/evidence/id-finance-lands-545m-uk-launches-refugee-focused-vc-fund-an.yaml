  fact: 'This week, we tracked more than 65 tech funding deals worth over €1.8 billion and over 5 exits,
    M&A transactions, rumours, and related news stories across Europe. Europe has spent years talking
    about making it easier to build and scale startups across borders. EU Inc was supposed to deliver
    a practical solution: a single, pan-European company framework. But after months of negotiations,
    campaigners warn that key provisions have been stripped away, threatening to undermine the reform
    before it even launches. With the stakes high, EU Inc supporters are calling on founders, investors,
    and the wider tech ecosystem to speak up and put pressure on policymakers. Learn how you can help.
