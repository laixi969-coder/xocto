  fact: Anyone who has even tangentially associated with computer programming knows that modern AI coding
    assistants and agents can be incredibly efficient at generating huge amounts of functional code .
    But coders making use of those tools also know better than to trust the accuracy of that code , meaning
    substantial effort needs to be spent reviewing any AI-generated output. A recent study of actual coding
    practices across hundreds of firms finds that human code review forms a significant "bottleneck" for
    the overall efficiency of AI coding tools, resulting in "little evidence that firms increase software
    output or reduce employment" by using them. Any efficiency increased during the actual coding phase,
    the study authors find, is "absorbed by downstream constraints in the production process"; as "the
    code review process significantly increases in length, pull requests are more likely to require revisions,
