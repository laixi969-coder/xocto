  fact: 作者｜徐珊 编辑｜郑玄 11 月 12 日，执掌英伟达 33 年的黄仁勋因被曝两段婚外情，突然辞去 CEO、总裁及董事职务，即刻生效。 硅谷，迎来一场剧烈的风暴。 11 月 17 日，黄仁勋在社交媒体发声，为给董事会制造麻烦深表后悔，同时明确递出话头，只要符合股东、员工与公司的最佳利益，
    他随时愿意回归 。这封声明让英伟达股价在 27 分钟内从 150.45 美元跳涨至 155.35 美元。然而同一天的财报电话会上，董事会主席哈维·琼斯冷硬地关上了门，宣布一致接受辞职，「无意让他复任
    CEO」，并透露已聘请猎头公司海德思哲寻找继任者。 资本市场和科技圈，随即用最暴烈的方式投了反对票。 黄仁勋离开后的 7 个交易日里，英伟达股价连跌约 28%，市值蒸发约 1.16 万亿美元 。与此同时，一个名为「Stand
    with Jensen」的请愿网站在 8 天内收集了约 20.45 万个签名。 到了 11 月 23 日，仅仅过去 11 天，英伟达董事会推翻了自己六天前的公开表态。 周末连开两次会后，董事会全票通过决议，恢复黄仁勋的一切原有职务
    。 当天，加州圣克拉拉总部的大厅和多层阳台上挤满了数百名员工，人们举着手机欢呼鼓掌，高喊着「Jensen！Jensen！」和「开工吧」。收盘时，英伟达暴涨 31.48%，单日市值暴增约 9544
    亿美元，总市值重新站回约 3.99 万亿美元。 员工发帖：if you come for the king, you best not miss（如果敢动王，那就别失手）｜图片来源：X@aburducky
    快讯的喧嚣已经散去，人们的情绪和股市，在这不到 2 周的时间里，玩了一把超级过山车。 但这 11 天的极限拉扯，把英伟达乃至整个 AI 产业，平时被万亿市值掩盖的脆弱结构，展现得一清二楚。 01
    三次「归去来」 硅谷历史上从不缺超级创始人的「归去来」，但把黄仁勋的 11 天放进历史坐标系里，会发现权力博弈的底层逻辑已经彻底变了。 1985 年，史蒂夫·乔布斯在与苹果 CEO 约翰·斯卡利的权力斗争中落败，被董事会剥夺职权后出走。他创办
    NeXT，直到 1996 年底苹果收购 NeXT，才在 1997 年重新回到苹果出任临时 CEO。 那一次，乔布斯走了整整 12 年 。 当时的商业世界里，现代企业制度的规矩大过创始人光环，哪怕苹果后来步履维艰
