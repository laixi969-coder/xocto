  fact: NVIDIA builds tools to enable safe agents across the stack . The NVIDIA OpenShell Reference Architecture,
    announced today , is part of NVIDIA’s growing portfolio of technologies that enables organizations
    to safely deploy agents at scale. NVIDIA Confidential Computing is the infrastructure layer that protects
    the models and data those agents depend on while running. Today, NVIDIA is expanding that layer with
    Confidential Bare Metal, a new deployment option with NVIDIA Confidential Computing that enables frontier
    model builders to run sensitive workloads on dedicated third-party infrastructure while retaining
    control of their models and data. NVIDIA is introducing new platform security controls that protect
    data in transit, measure platform integrity and enforce hardware-level access restrictions. These
    new controls let frontier model builders use bare-metal instances to own and operate their bespoke
