  fact: "我做了一个浏览器端的小工具 The Hotel Lobby AI，用两张已获授权的成年人照片，或者一张同时包含两人的清晰照片，生成一段 Hotel Lobby 风格的双人说唱短视频。\r\
    \n\r\n目前已经开放登录、积分购买、生成、私有结果播放和下载。Standard 720p、12 秒的一次生成消耗 10 积分；生成或交付确认失败时会退回本次消耗的积分。生成时间会受模型和队列影响，不承诺固定时长。\r\
    \n\r\n我现在主要想听听大家对两个问题的反馈：\r\n1. 两张照片的准备说明是否够清楚；\r\n2. 场景和 Prompt 设置有没有让人不知道怎么选的地方。\r\n\r\n网站： https://thehotellobbyai.com/\r\
    \n使用说明： https://thehotellobbyai.com/how-it-works\r\n\r\n说明：我是这个工具的制作者。"
