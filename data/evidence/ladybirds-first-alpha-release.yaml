  fact: 'Ladybird is an astonishingly ambitious project: a new browser, in 2026, with its own implementation
    of most of the key components - HTML parsing, CSS engine, layout, JavaScript, even WebAssembly. It
    still uses a few external components - things like HarfBuzz for text shaping, Skia for 2D graphics,
    ffmpeg for video, and SQLite for the things you do with SQLite. Everything else is part of Ladybird,
    or code brought in from Ladybird''s even more ambitious predecessor project SerenityOS . This morning
    the Ladybird project released their first alpha , which means you can now install the browser (on
    macOS or Linux) without having to compile it yourself! I''ve been trying it out today, and it''s very
    impressive. It feels fast, the UI is lightweight and intuitive, and most of the websites I''ve tried
