  title: AI 时代少有人类阅读，我开始建自己的独立站，但真的是 49 年入国军吗
  published_at: '2026-10-31T01:06:13Z'
  collected_at: '2026-10-31T01:36:29Z'
  source_kind: product
  tier: independent
  fact: "前几天，我在一个平台发了条动态，预告自己在做的一个写作发布工具。底下有人说没啥用，不如做个抢优惠券的；也有人说别自嗨。\r\n\r\n我没有生气，也没往心里去，但它让我想了很久。平台上的读者来自四面八方，关心的东西差别很大，同一件事在不同的人眼里，价值完全不同，这很正常。我真正在意的是另一件事：我想写的东西，是不是只能放进推荐流里，等一个不确定的结果？\r\
    \n\r\n这让我重新审视了一个老问题：在 AI 时代，个人博客还有什么位置，能起什么作用。\r\n\r\n先说难听的：我知道现在开独立博客很傻。\r\n\r\n平台有推荐，AI 有摘要，人连搜索结果都懒得点。新域名没有权重，没有外链，没有推荐位，写一篇长文发出去，阅读量个位数是常态。这不是“内容不够好”的问题，是分发结构就这样。所以问题不是“博客还有没有价值”，而是：**在一个人人都不直接访问网站的时代，我为什么还要建一个自己的站？**\r\
    \n\r\n![site-home-light]( https://cdn.jsdelivr.net/gh/kingshuaishuai/ys-imgs@main/quirepub/4dfc71519187e9dc8176a7145ec7e6a4.png)\r\
    \n*yishuai.wang 的首页。*\r\n\r\n这看起来确实像 49 年入国军。\r\n\r\n## 这个比喻，成立一半\r\n\r\n成立的一半是：**如果把独立站当流量生意做，那它就是逆风局。**\
    \ 靠 SEO 等自然流量、靠广告联盟变现、靠批量更新维持权重——这套玩法在 AI 把内容供给打到无限之后，基本没有胜算。AI 一秒能生成的通稿，你写十篇也没人看，搜索引擎也未必收录。这个意义上，49\
    \ 年入国军不是玩笑。\r\n\r\n不成立的一半是：**49 年入国军是押注一个正在崩塌的旧秩序；我不是押注“独立博客会重新成为流量中心”。** 我不认为独立站会回到 2010 年那种“写博客—被搜索引擎收录—拿流量—接广告”的黄金年代。那个年代确实结束了。\r\
    \n\r\n我押的是另一件事：**AI 内容越泛滥，一手经历、真实项目、可验证署名，可能越稀缺。**\r\n\r\n现在下结论还太早。AI 可以帮我查资料、改代码、润色句子，但它没有做过我做的项目，没有踩过我踩的坑，没有在四个月里对着分页排版一个像素一个像素地改。它写不出“我当时为什么决定不用现成方案”这种判断，因为它没有“当时”。但这套东西到底有没有人认"
