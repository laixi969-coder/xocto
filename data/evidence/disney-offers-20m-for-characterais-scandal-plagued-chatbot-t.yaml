  fact: In a bankruptcy proceeding that kicked off yesterday, Disney has offered to buy some of the technology
    that powers the controversy-plagued chatbot Character.AI. Disney is willing to pay $20 million for
    “a non-exclusive perpetual license” of certain Character Technologies intellectual property, the chatbot
    maker said in a press release that did not go into much further detail on which assets Disney wanted.
    The move may be surprising. In September 2025, Disney joined others in publicly criticizing Character.AI
    for stealing content and harming kids. Specifically, Disney sent a strongly worded cease-and-desist
    letter that accused Character Technologies of weaponizing Disney characters “in a way that could damage
    its brand long term,” Axios reported . Read full article Comments
