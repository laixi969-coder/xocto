  fact: Named to Madrona's 2026 Intelligent Applications 40 (Enabler stage). Baseten, Together AI, Fireworks,
    Fal, and OpenRouter are all roughly doubling or more their valuations year over year as demand for
    GPU capacity and multi-model routing outstrips supply, and although all well-funded there is not yet
    one clear winner pulling away. The dominance of this Enabler sub-segment is in sharp contrast to the
    2025 Enablers list, where there were only two inference play winners (Together and Fal).
