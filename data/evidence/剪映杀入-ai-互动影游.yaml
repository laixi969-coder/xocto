  title: 剪映，杀入 AI 互动影游
  published_at: '2026-09-23T07:32:36Z'
  collected_at: '2026-09-24T00:31:16Z'
  source_kind: market_signal
  tier: independent
  fact: "头图来源：剪映 \n 9 月 20 日，剪映在「AI 新创作发布会」上，集中更新了专业版、移动端和创作者生态。 \n 专业版新增一站式创作工作台「剪映 Hub」，由无限画布和多轨编辑器组成。用户可以从一句话、一个参考视频或者一份文档开始，在画布上整理思路、生成脚本和分镜，调用即梦、小云雀等平台生成图片、视频和声音，再把初剪结果送入时间线继续修改。\
    \ \n 智能创作 Agent「剪映助手」进入了具体的剪辑工程，可以整理素材、删减口播、纠正字幕、检索补充画面和包装视频。在手机上，这个助手被称为「小映」，面向生活记录、内容创作和商品营销等场景。\
    \ \n 剪映还调整了模板和会员体系。模板可以用自然语言改写内容，成熟创作者可以把自己的工作流沉淀为 Skill。新的 AI Ultra 会员每月包含 22100 点 AI 积分和剪映 SVIP\
    \ 权益，连续包月定价 199 元，首发期为 99 元。 \n 这些产品放在一起，反映出剪映对自身位置的一次调整。它并没有再做一个独立的 AI 视频生成平台，生成仍然由即梦、小云雀等产品完成，剪映想做的是接住这些模型产生的素材，把此前分散的构思、素材管理和后期编辑放进一套创作工程。\
    \ \n 发布会上还有一个出人意料的产品。剪映首次展示了 AI 互动影游创作平台 ICG Studio，希望让创作者从一份剧本出发，做出能够观看、选择和探索的互动故事。 \n Hub 是在补齐视频创作的流程，ICG\
    \ Studio 则把剪映的边界向外推了一步。 \n AI 生成之后，剪映要把素材变成作品 \n 过去两年，AI 视频模型的进步主要体现在生成效果上。人物能否保持一致，动作是否自然，镜头可以生成多长，声音和口型能不能对上，这些能力决定了一段画面有没有观看价值。\
    \ \n 但对做过 AI 视频的人而言，一段能看的素材，距离一条能发布的作品还有不短的距离。 \n 人物神态可能对了，背景质感却不够；构图和动作都不错，镜头却短了两秒；几个片段单独看都能用，连在一起之后，人物位置、情绪和光线又接不上。创作者要在多个平台之间反复生成、下载和导入，版本越来越多，最后连自己也记不清哪一次生成最接近想要的结果。\
    \ \n 剪映 Hub 处理的就是这一段流程。 \n 用户在画布上展开脚本、参考图和素材，剪映助手帮助生成、整理和粗剪，多轨编辑器继续完成字幕、声音、节奏和包装。已经做对的画面可以保留下来，不满意的部分再局部"
