  fact: Copenhagen-based AI startup Plinto has raised €2.9 million in a funding round from People Ventures
    and Emblem to further develop its AI-powered financial transaction monitoring platform, expand its
    enterprise customer base and support its first steps into international markets. Founded in early
    2025 by Jakob Nielsen , Nermina Suljevic and Sebastian Rehnby , Plinto develops AI agents that help
    companies identify and resolve errors in financial transactions. The platform automates checks that
    finance teams typically perform manually, helping ensure that transactions comply with contracts,
    budgets and internal policies. Plinto integrates with companies' existing systems, including enterprise
    resource planning (ERP) software, documents, banking systems and communication tools such as Slack
    and Microsoft Teams. Its AI agents check transactions against agreed terms, investigate discrepancies
