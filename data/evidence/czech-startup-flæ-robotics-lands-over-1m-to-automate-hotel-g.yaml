  fact: Czech technology company FLÆ Robotics has raised more than €1 million in seed funding from Purple
    Ventures and Garage Angels to further develop its AI-powered hospitality platform, BE-A, and support
    international expansion. Founded by Filip Linek , FLÆ Robotics develops BE-A, an AI hospitality agent
    designed to automate routine guest communication, reservations and front-office tasks for hotels.
    The platform operates around the clock, handling enquiries through WhatsApp, email, web chat and phone
    calls. Through integrations with hotel management systems, BE-A can check room availability, manage
    reservations and provide information about hotel services. It also categorises incoming messages and
    directs requests to the appropriate teams or workflows, helping hotel staff reduce administrative
    work and focus on guests who require personal attention. The platform is currently used by more than
