  fact: "​  \n 苹果新任 CEO 约翰·特努斯在 X 平台发布首条动态向关注者问好 \n 苹果首席执行官约翰·特努斯正式加入社交平台 X，并发布了个人账号的首条动态。正如外界预料的那样，这条仅有「hello」五个字母的简短消息迅速获得大量关注。苹果历任首席执行官通常都具备一定的社交属性，而在当代，这往往也意味着拥有社交媒体账号。因此，随着特努斯正式接任苹果掌舵人，他也开设了自己的\
    \ X 账号。 \n 目前，账号 @johnternus 已经上线，并在特努斯担任苹果首席执行官的首个正式工作日公开亮相。根据账号资料显示，该账号早在 2026 年 6 月便已私下创建，但目前只发布过一条动态，内容是全部使用小写字母书写的「hello」。\
    \ \n 尚不清楚特努斯是在谨慎尝试进入社交媒体，还是有意借鉴苹果在用户启用新设备时使用问候语的传统。考虑到他此前几乎没有社交媒体活动记录，这两个原因可能兼而有之。 \n 这条只有五个字母的动态，在发布后极短时间内便为账号带来了巨大关注。截至报道发布时，这条动态上线约\
    \ 35 分钟，已经获得约 74.8 万次浏览、3.1 万次点赞、3600 次转发和 5000 条评论。（来源：cnBeta） \n   \n 谷歌发布 TimesFM-3，3.3 亿参数即可进行零样本多变量时间序列预测\
    \ \n 9 月 1 日消息，谷歌发布 TimesFM-3 模型，这是该公司时间序列基础模型系列的第三代产品。拥有原生多变量预测、双注意力机制、连续补丁掩码等特性，可进行零样本多变量时间序列预测。\
    \ \n 据了解，TimesFM-3 拥有 3.3 亿个参数，并在包含超 1 万亿个时间点的真实世界和合成时间序列语料库进行预训练。TimesFM-3 继承前代的高效性和零样本泛化能力，以零样本形式增强复杂多元场景支持。\
    \ \n 同时，该模型可联合预测多个共同演化的时间序列，捕捉其中的依赖关系，提升整体准确率，无需针对特定任务微调，该模型原生支持特性如下：多目标预测：同时预测多个相关时间序列（例如联合预测不同品牌的冰淇淋）。该模型支持所有目标的点预测和分位数预测；过去协变量：纳入仅从历史角度已知的特征（例如过去人流量）；过去-未来（动态）协变量：利用已知的未来事件来指导预测（例如计划促销活动或天气预报）。（来源：IT\
    \ 之家） \n   \n Anthropic 发布 Claude Fable 5.1 和 Myt"
