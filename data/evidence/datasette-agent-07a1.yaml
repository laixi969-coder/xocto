  fact: 'Release: datasette-agent 0.7a1 I small improvement to Datasette Agent : chat sessions can open
    an iframe side panel, and that panel can then navigate to different pages. This version improves navigation
    by fragment hashes, for deeper integration with other Datasette plugins that update fragment hashes
    when the user interacts with the plugin in a way that changes state. I built this in order to fix
    some bugs with the much more exciting datasette-charts 0.2a0 release . Tags: datasette-agent , datasette'
