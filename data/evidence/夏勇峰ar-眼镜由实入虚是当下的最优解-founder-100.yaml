  fact: 本文首发于 Founder Park 公众号 · 2022 年 11 月 29 日   作为小米生态链产品里的第一款 AR 眼镜产品，8 月份开始众筹的米家眼镜相机，最终的众筹金额超过 1000
    万元，位列 2022 年小米生态链产品众筹 NO.1。在蜂巢  科技创始人夏勇峰看来，「超出了我们的预期，也证明了大家仍然愿意为新产品投票」。    从《商业价值》杂志主笔到小米生态链副总裁、小米手机部部门总经理，再到后来的自主创业，夏勇峰认为自己一直关注的是长期性市场，之所以入局
    AR，是因为这是一个 「在当时大家尚不明晰，大公司也尚未进场，但在科技上对人类发展非常重要，是长期目标非常明确的市场」 。    对于这款产品，夏勇峰自称为 「自 10 年前 Google Glass
    发布以来，当下AR眼镜的最优解」 ，为什么如此自信？以及米家眼镜为什么会选择「由实化虚」，做一款生产力工具产品，在米家眼镜相机众筹成功后，我们跟夏勇峰进行了一场详聊。     欢迎在小宇宙收听本次采访的音频版本                         米家眼镜是自
    10 年前 Google Glass 发布以来，当下 AR 眼镜的最优解。    工具是米家眼镜的核心，我们将其定义为「特定人群的生产力工具」。    所谓移动的智能终端从肩膀上背一个笔记本才正式开始。随着技术不断的进步，产品逐渐小型化，从肩膀到膝盖，再到手上，下一步自然是头部。    元宇宙并不等同于虚拟宇宙，我们仍然需要立足于现实世界生活。                      01           米家眼镜         是当下
    AR 眼镜的最优解           Founder Park：为什么说「米家眼镜是自 10 年前 Google Glass 发布以来，当下 AR 眼镜的最优解」？        夏勇峰    ：首先，它之所以是最优解，是主要取决于它的三个功能。第一个功能是一个足够好的相机。当用户在现实世界中时，它可以帮助用户探索、发现和记录。第二个功能是光机。目前，米家眼镜相机的光机具有全球最高的入眼量。它可以使屏幕小到让用户在现实生活中随时移动，还可以使屏幕足够明亮，以便用户在任何环境下都能清楚地看到屏幕。第三个功能是一体机，自由摆脱了连线和线材，接触即可使用。它还具有强大的运算能力和软件拓展能力
