  fact: 'Amazon SageMaker JumpStart gives you hundreds of open-weight foundation models you can deploy
    quickly. That choice is powerful, but it also creates a real question: Which model should you start
    with? Comparing models usually means reading model cards one at a time and hunting for benchmark scores
    that different sources published under different conditions. Then you still must guess how each model
    will perform, and what it will cost, for your use case. Today we are launching the Amazon SageMaker
    JumpStart Model Leaderboard , a new way to compare JumpStart models side by side on quality, speed,
    and cost, directly in Amazon SageMaker Studio. In this post, we explain what the leaderboard shows,
    define the key terms in plain language, and walk through how to go from a shortlist to a deployed
    model. What is the JumpStart Model Leaderboard? The leaderboard is a new view of the JumpStart base
    models page in SageMaker Studio, right next to the Categories and All models views. It uses the same
