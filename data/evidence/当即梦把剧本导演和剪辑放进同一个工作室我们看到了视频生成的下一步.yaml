  fact: 对于短剧创作者来说，最不缺的可能就是新的故事灵感。 在日常创作中，一个新的人物设定、一段有冲突的情节，甚至刷到的一条社会新闻，都可能成为下一部短剧的起点。 但短剧行业的生产节奏越来越快。团队可能同时推进多个项目，既要保证已有剧集的更新，又要不断寻找新题材、开发新故事；好创意从提出到真正变成作品，中间还需要经历剧本创作、人物设定、分镜设计、视频生成和后期剪辑等一系列环节。
    如果有个工具，能够直接从 idea 出发，把后续的制作流程串联起来，会怎么样？ 这正是即梦在尝试解决的问题。 从一个故事灵感出发，即梦可以辅助完善人物设定、剧情冲突和剧本，并自动拆解分镜；进入制作阶段，创作者可以像导演一样安排人物站位、运镜，并在正式生成前预演整场戏；视频生成后，还能局部修改镜头、复用人物与场景资产，持续制作后续剧集。
    这些，是即梦在 10 月 26 日上线的「短剧工作室」想要实现的体验——即梦将剧本创作、角色与场景资产管理、分镜设计、视频生成和后期编辑串联起来。 这两年，AI 视频模型的激烈竞争，让生成一段高质量视频逐渐成为日常。当视频生成质量已经能够满足越来越多影视创作场景的需求，竞争的焦点也开始转向创作工具，持续完善创作流程，进一步缩短从一个想法到一部完整作品的距离。
    01 所有创作，都发生在同一个项目里 今年以来，随着视频生成模型的飞速进化，用 AI 完成一部剧集不再是空话，也是越来越多内容创作者尝试的方向。据媒体援引中国网络视听协会的数据，今年上半年，各平台上线的微短剧中，AI
    内容占比已经超过 74%。换句话说，每上线四部短剧，就有接近三部涉及 AI 内容。 对于创作者来说，想用 AI 制作一部短剧，依旧并不简单：先用大语言模型写剧本，再整理人物设定、生成角色参考图，接着将故事拆解成几十甚至上百个分镜。等到视频素材准备完毕，还要导入剪辑软件，重新调整节奏、完成配音和后期制作。
    AI 固然能够生成质量很高的画面，创作者仍然需要花费大量精力，将这些分散的素材和工作组织起来。 而这恰好是「即梦短剧工作室」最想要解决的问题，让创作者能够在同一个项目中完成从剧本到视频的制作。 从最开始的创作起点出发，即梦提供了三种：从一句话灵感开始创作、将小说等已有
    IP 改编为短剧，或者直接导入完整剧本。 如果只有初步想法，可以交给 DreamScript 剧本模型继续完善。它能够围绕故事设定，
