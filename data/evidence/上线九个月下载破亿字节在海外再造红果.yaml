  fact: 头图来源：视觉中国 上线不到一年，字节跳动旗下的短剧 App PineDrama，累计下载量已经突破 1 亿次。 10 月 12 日，Sensor Tower 的一组数据让短剧赛道再添热度：字节跳动旗下海外短剧应用
    PineDrama 累计下载量已突破 1 亿次，日活跃用户约 700 万，仅 2026 年 9 月单月下载量就超过 1200 万次。 距离这款产品正式上线，才刚过去 9 个月。在全球累计下载破亿的
    7 款独立短剧 App 里，PineDrama 是唯一一款上线不足一年的新品。这让人很自然地联想到它的国内「前辈」——红果短剧，那个用三年时间做到日活 1.68 亿、超过四家长视频平台总和的现象级产品。
    字节已经用红果在国内把免费短剧做成了大众娱乐产品，如今，它能否在海外再做一遍？ 从红果到 PineDrama：一套验证过的模式出海 PineDrama 的诞生，本身就是字节短剧战略的自然延伸。 2025
    年 12 月，当国内的红果短剧已经跑出月活超 2 亿、单月播放量逼近百亿的成绩时，字节在海外悄然上线了这款独立短剧应用，首批落地巴西、美国、印尼等市场，支持 TikTok 账号一键登录。 从产品形态到商业模式，PineDrama
    几乎是把红果的成功路径完整复刻了过去：全剧集免费观看、靠广告变现，搭配看剧领金币的轻激励机制，彻底拿掉了用户的付费门槛。 这和当时海外短剧市场的主流玩法完全不同。在 PineDrama 入场之前，ReelShort、DramaBox
    等头部玩家普遍采用"前几集免费引流、后续单集付费解锁"的模式，靠用户充值打赏实现收入，本质上是把国内早期的付费短剧模式搬到了海外。 图片来源：TikTok PineDrama 选了一条更激进的路——用免费换规模。这背后是字节对自己流量体系的自信：用户在
    TikTok 刷到几十秒的短剧高光片段，被强冲突的剧情抓住情绪，点一下链接就能跳转到 PineDrama 看全集，从种草到留存的整个获客闭环，几乎都在字节生态内部完成。 这套打法在国内已经被红果验证过。2023
    年 8 月红果上线时，行业主流还是付费解锁，红果靠免费+广告的模式迅速起量，上线不到一年日活就突破 3000 万，2025 年春节期间累计观看人次达到 6 亿，甚至超过了同期全国电影春节档的观影人次。如今
    PineDrama 在海外走的，几乎是一模
