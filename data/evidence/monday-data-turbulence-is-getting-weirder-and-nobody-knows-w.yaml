  fact: Hello, here. I was on a long-haul red-eye flight last week that hit turbulence so bad it was hard
    to sleep. Being a scientist, I started looking into turbulence data to understand what it is and how
    it’s changed over time. What surprised me was where conditions favored clear-air turbulence, the kind
    of turbulence that often forms near jet streams and that ordinary onboard weather radar can’t detect.
    It accounted for 29% of turbulence-related accidents on US airlines between 2009 and 2018 1 . From
    August through October this year, the pattern departed further from the long-term trend than in any
    other year I examined. Read more
