  fact: 作者｜Wildcard 编辑｜靖宇 11 月 5 日，OpenAI 前 CTO Mira Murati 创立的 Thinking Machines Lab（简称 TML）同一天出了两条新闻。
    当天，公司发布了第二代模型 Inkling 2 Small，第三方评测机构 Artificial Analysis（AA）给的评价相当高：权重放出后，它将成为「 中国以外得分最高的开放权重模型 」。同一天，据报道，这家公司正以
    400 亿美元的投前估值筹集 50 亿美元新融资。 TML 在 2025 年 2 月对外亮相，至今一年半多。这期间，他们拿过 a16z 领投的 20 亿美元种子轮，也经历了联合创始人 Andrew
    Tulloch 转投 Meta，以及联合创始人 Barret Zoph、Luke Metz 等人今年 1 月回归 OpenAI 的动荡，之后由 PyTorch 联合创始人 Soumith Chintala
    接任 CTO。 今年 1 月还有报道称， 团队 以约 500 亿美元估值融资的谈判陷入停滞 。新一轮融资能不能谈成，很大程度上要看二代模型的成色。 翻开 Inkling 2 Small 的技术博客，跑分表和架构图之外，最意味深长的是一行交代训练数据来源的文字：
    预训练后半程的数据，大部分采样自更早的模型，其中点名了月之暗面的 Kimi K3 。 01 594B 的「Small」，强在哪 「Small」这个词在大模型行业里正在不断膨胀。 TML 今年 7
    月发布的初代开放权重模型 Inkling 有 975B 总参数，两周后的 Inkling Small 是 276B。到了第二代， Inkling 2 Small 的总参数量翻了一倍多，达到 594B，每次推理激活
    17B 。它是 MoE 架构，支持 100 万上下文和可调的思考力度，能看图，但不支持初代 Inkling 具备的音频输入。 训练流程相当重。预训练第一阶段，团队在英伟达 GB300 NVL72
    机架上用 68 小时、以原生 NVFP4（4 比特浮点）精度吞下 8.4 万亿 token；第二阶段再喂 3.8 万亿 token 的高质量新数据；最后两个阶段用合计约 3540 亿 token
