  fact: Named to Madrona's 2026 Intelligent Applications 40 (Mid stage). Granola and Fireflies.ai all
    started as individual productivity tools built around meeting notes and transcription, and each is
    now explicitly repositioning toward becoming the enterprise knowledge layer for its customers. A second
    theme is voice and meeting capture as a wedge, with Wispr Flow, Granola, and adjacently HeyGen for
    video, where individual-productivity products are racing to become enterprise knowledge layers.
