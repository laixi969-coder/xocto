  fact: 'Amazon Quick custom permissions let you enforce least-privilege access by toggling features per
    user. This post walks through four patterns to automate custom permissions across the user lifecycle:
    a RegisterUser API parameter, account and role defaults, event-driven Amazon EventBridge and AWS Lambda
    automation, and a retroactive batch update script.'
