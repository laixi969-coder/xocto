  fact: 'Moyai statue A line of moyai in Nakama, Fukuoka. In Japan, a moyai statue (Japanese: モヤイ像, Hepburn:
    moyaizō) is a type of stone statue created in the Japanese village of Niijima. The statues, which
    were created to promote awareness of Niijima, are themed and modeled after the moai of Easter Island.'
