  fact: NVIDIA and Microsoft are extending their full-stack collaboration to help organizations build,
    customize and deploy intelligent applications — from next-generation infrastructure on Azure to industrial
    systems and Windows PCs. At Microsoft Ignite , the companies are expanding access to Azure virtual
    machines powered by NVIDIA Vera Rubin NVL72 systems, as well as adding customer availability to NVIDIA
    open models and customization capabilities through Microsoft Foundry, and new options for running
    AI at the edge, where businesses generate and use their data. Microsoft is also using NVIDIA technologies
    to accelerate its own models and services, including NVIDIA Dynamo inference software for post-training
    and NVIDIA RTX PRO 6000 Blackwell GPUs for Bing search models. NVIDIA Vera Rubin NVL72 Running in
