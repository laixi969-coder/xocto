  fact: 'In today’s world, all professional employees use AI, whether it’s candidates submitting highly
    polished CVs with 100% perfect fit with your job description to AI-generated work. In this environment,
    how can we promote the right employees and how do we hire the best canidates when everyone appears
    to be perfect? Imagine this: You’re hiring a financial analyst and give two finalists the same AI-generated
    acquisition memo. It reads beautifully and recommends buying a company at what looks like a reasonable
    price. There’s one problem. The model counted the same revenue twice. One candidate improves the slides.
    The other asks for the source data, spots the error and changes the recommendation. If I’d asked for
    a polished take-home assignment and used AI to grade it, I might have hired the better slide editor.
    AI has become a significant part of how people apply for jobs and how they do that work. Using AI
    to police that behavior is a losing game. Employers have more to gain by making AI use'
