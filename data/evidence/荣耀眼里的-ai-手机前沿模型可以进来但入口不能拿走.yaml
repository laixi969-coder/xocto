  title: 荣耀眼里的 AI 手机：前沿模型可以进来，但入口不能拿走
  published_at: '2026-11-25T05:02:43Z'
  collected_at: '2026-11-26T04:11:00Z'
  source_kind: market_signal
  tier: independent
  fact: 作者｜张勇毅 编辑｜郑玄 11 月 23 日下午，荣耀在武汉发布了荣耀 700 系列，包括 700S、700 和 700 Pro 三款机型，补贴后 2899 元起，11 月 27 日开售。发布会上，全系
    2 亿像素主摄、9000mAh 电池和背面那块 1.72 英寸小屏占了不少篇幅。 AI 手机助手 YOYO 豆包，这一代在荣耀 700 上有了专属的背屏显示载体｜图片来源：极客公园 但真正让手机圈竖起耳朵的，是荣耀官方通稿里的一个新称呼。荣耀手机上的
    AI 助手一直叫 YOYO，到了荣耀 700 系列，它的正式名称变成了「AI 手机助手 YOYO 豆包」。 此前市面上搭载豆包手机助手的手机只有努比亚两代产品，荣耀 700 系列成了第二款搭载豆包的手机，只不过豆包在这台手机上的位置，和在努比亚手机上并不一样。
    AI 能力，从手机正面到背面 荣耀 700 系列的 AI 能力，大半围绕这次机身背面的「AI 灵动背屏」和「YOYO 豆包」展开。 按荣耀官方介绍，新机首发了「AI 定制随心贴」，对助手说一句想要的画面，生成的图片就能贴到背屏上，平时看到喜欢的图片或表情包，长按拖一下也能放上去。官方通稿同时提到语音通话和英语陪练两项核心功能。
    这块小屏也承接了不少日常需求。航班、打车、快递和外卖的进度，不点亮主屏就能在背面看到，用后置主摄自拍时背屏能当取景框，背屏上的传感器还能在一分钟内测出心率和血氧。荣耀 CEO 李健在会后采访中表示，「产品的价值不只是让用户拥有更多功能，更是让用户拥有更多表达自己的方式」。
    荣耀 700 系列的背屏玩法｜图片来源：荣耀 关于把 AI 放上背屏是不是噱头，荣耀终端有限公司产品线总裁方飞在采访中强调，AI 只是技术，用户买单的是真实场景和体验。方飞直言，「AI 很强大，但是普通老百姓找不到，不会用。」把背屏做成「一个非常浅的入口」，思路倒是直指痛点。
    翻看整场发布会和公开材料，荣耀并没有提到「YOYO 豆包」可以替用户在第三方 App 里操作或与之类似的 GUI 能力。眼下能看到的，还主要是围绕背屏和基于模型对话能力展开实现的 AI 手机功能。
    但有一点很清楚，无论 AI 手机的模型供应方是谁，普通用户其实不在意后台接的是哪家。李健在采访里也对媒体坦言「你用什么模型其实不重要，它核心的问题是给用户带来什么样的体验。」真正能打动用户的，永远是抬手
