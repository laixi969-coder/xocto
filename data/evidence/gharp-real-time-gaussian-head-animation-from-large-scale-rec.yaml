  fact: 'We present GHARP (Real-time Gaussian Head Animation from Large-scale Reconstruction Prior), a
    method that animates 3D human heads in real time from a few input images of a subject and a driving
    expression signal. We decouple the problem into an identity stage that builds a representation of
    the subject’s geometry and appearance offline, and an animation stage that predicts expression-dependent
    residuals on top of it at runtime. This separation offers a favorable trade-off with respect to fidelity,
    quality and runtime: the identity stage can be expensive while the animation stage runs a…'
