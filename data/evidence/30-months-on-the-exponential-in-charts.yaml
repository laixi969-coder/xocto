  fact: My second book on AI, Co-Existence, is out today (and you can get it here ), 30 months after the
    release of Co-Intelligence in early 2024. Looking back across the gap between these books is a good
    way to get a sense of AI progress. And, thanks to AI, I can describe this progress with some quite
    lovely charts. Making the charts is itself a good indicator of how far things have come. In the era
    of chatbots, the era of Co-Intelligence , I would have had to work back-and-forth with an AI in a
    chat window, guiding it through each new step. In the current era of agentic AI that I cover in Co-Existence
    , I delegated the work and let the AI handle it. In this case, I used Opus 5.5 in Claude Projects,
    which allows you to talk to a single “orchestrator” agent that then spins off additional agents as
    needed, giving them instructions and relaying information back to you. Getting the work done was straightforward.
