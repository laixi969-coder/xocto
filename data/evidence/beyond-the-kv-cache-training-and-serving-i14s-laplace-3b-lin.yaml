  fact: Most large language models (LLMs) use transformer architectures with softmax attention. During
    inference, their key-value (KV) cache grows with the conversation or document context. This can reduce
    concurrency, increase serving cost, and force agentic applications to discard useful history. i14
    designed Laplace 3B as a linear attention alternative. Its recurrent state stays at 29.5 MB per sequence,
    independent of context length. Working with AWS, i14 used native PyTorch support through TorchNeuron
    Native to bring this custom architecture to AWS Trainium2 . This preserved its Gated Linear Attention
    (GLA) design and Muon optimizer. On one trn2.48xlarge instance, Laplace 3B trained at about 120,000
    tokens per second. The model served 11,544 output tokens per second across 1,280 concurrent sequences.
    This post explains the model design, the changes i14 made for Trainium2, and the training and inference
    results. About i14 i14 is an AI research and technology company that develops model arch
