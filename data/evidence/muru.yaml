  fact: 'Muru Graham Dumpleton started mod_wsgi 20 years ago, and has been thinking about the ideal way
    to serve Python web applications in production ever since. Muru is his new, AI-assisted Rust server
    that aims to provide the best possible tools for running ASGI and WSGI Python apps both in development
    and production. As he did with wrapture , he''s been publishing an extraordinarily detailed account
    of the project as he works on it - as part of his development process. Here''s everything he''s published
    so far, all in the last three weeks: 2026-11-04 — Twenty years of mod_wsgi, and what comes next 2026-11-05
    — A first look at Muru 2026-11-07 — Muru: looking inside the workers 2026-11-08 — Muru: how it fits
    together 2026-11-09 — Muru: import once, fork many 2026-11-10 — Muru: HTTPS in development 2026-11-11
    — Muru: WSGI and ASGI together 2026-11-11 — AI as a lifestyle choice 2026-11-12 — Muru: releases,
    not restarts 2026-11-13 — Muru: canaries without a service mesh 2026-11-14 — Muru: a better'
