  fact: Today, Meta, Coinbase, Google, Microsoft, OpenAI, Starlink, Adobe, and other leading tech companies
    announced the results of a major joint operation with law enforcement to disrupt criminal scam networks
    based in West African nations, including Nigeria and Ghana. Hosted by the National Crime Agency (NCA)
    in London in partnership with the US Department of Justice, the FBI, and several US federal agencies,
    the operation marked the latest and largest instance of tech companies coming together with law enforcement
    around the world to share information, take down sophisticated criminals, and help protect people
    from online scams. This is the first joint disruption to broadly target criminal scam networks in
    the West Africa region. Scam centers based in Nigeria, Ghana, and other nations in the region are
    generally more decentralized and less industrial than those in southeast Asia. Criminals are continually
