  fact: 'Companies build agentic AI platforms to govern the applications, tools, skills, models, and storage
    that agents use. The nondeterministic nature of generative AI models introduces a complexity that
    previous software development practices didn’t anticipate. Consider a real estate app that generates
    property listings from retrieved data: does it accurately reflect the property, or hallucinate features
    that don’t exist? Or a customer service agent grounded on internal knowledge bases: can you verify
    that it doesn’t surface confidential information? Until recently, responsible AI (RAI) was model-centric,
    scoped to the machine learning development lifecycle: training, testing, and inference. Models didn’t
    reason, use tools, or take actions. When the conversation extended to model-powered systems, it covered
    statistically bounded situations you could test against known inputs. Generative AI powered applications
    and agents changed this. The systems now reason, act, compose tools dynamically,'
