  fact: At SC26, an annual supercomputing conference taking place this week in Chicago, NVIDIA is introducing
    the DGX Spark HPC Developer Kit for researchers, academics and developers. The kit is a four-node
    cluster of NVIDIA DGX Spark systems , each connected directly to its two neighbors in a ring, with
    an NVIDIA HPC SDK installation playbook coming soon. Researchers get a place at their desk to run
    multi-node scientific workloads, AI models and agents, instead of waiting for time on a shared GPU
    cluster. The kit puts the GB10 Grace Blackwell Superchip on researchers’ desks. A Supercomputing Lab
    on Any Desk The DGX Spark Developer Kit changes how researchers work. Read All NVIDIA Announcements
    From SC26 It scales from one system, or node, to four — linked directly to one another over NVIDIA
    ConnectX-7 networking, with no network switch to buy or set up. At four nodes, it provides 512GB of
    combined memory and 20TB of NVMe storage that provides researchers more capacity to distribute models
