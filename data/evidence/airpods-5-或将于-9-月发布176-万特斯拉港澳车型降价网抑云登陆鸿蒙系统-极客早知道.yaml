  fact: "SK 海力士 CEO：内存短缺或将持续至 2030 年 \n SK 海力士预计，当前的内存短缺局面可能会持续到 2030 年底，市场目前尚未出现明显的需求放缓迹象。SK 海力士首席执行官郭鲁勋在公司位于美国印第安纳州的新封装工厂奠基仪式后表示，即使未来市场开始降温，也更可能表现为供应紧张状况逐步缓解，而不是像过去那样出现内存价格突然崩跌的情况。\
    \ \n 该公司此前曾预计，面向普通市场的 DRAM 供应紧张将持续至 2028 年，此次最新表态意味着这一预期进一步延长。 \n   \n 郭鲁勋指出，内存产品已经逐渐摆脱单纯商品化零部件的属性。人工智能产业快速发展，推动客户转向定制化\
    \ DRAM 和高带宽内存（HBM）方案。这种需求结构使制造商更容易预测未来订单，也降低了过去因供应过剩而引发剧烈价格下跌的可能性。（来源：CnBeta） \n   \n 小米 18 Fold 首发长鑫\
    \ LPDDR6 内存，央视财经报道称「中国半导体两个好消息」 \n 8 月 30 日消息，小米昨日官宣，Xiaomi 18 Fold 全球首发长鑫 LPDDR6 内存，9 月见。 \n   \n\
    \ 央视新闻官方微博昨日发文报道「从「芯」到「存」，从单点技术突破到产业链协同发力！ 中国半导体两个好消息 」： \n 据长鑫科技在 2026 年半年度报告中披露，公司自主研发的 LPDDR6 芯片性能较上一代\
    \ LPDDR5X 实现全面跃升。 \n 8 月 24 日，小米首款 AI 旗舰 SoC 玄戒 O3 正式发布，行业首发支持 LPDDR6。8 月 28 日，长鑫存储技术有限公司开通了官方微博，该账号首个关注的账号便是小米手机。（来源：IT\
    \ 之家） \n 华为徐直军谈鸿蒙生态临界点：突破 1 亿用户就如同核裂变「临界质量」或者飞机起飞「离地速度」 \n 8 月 30 日消息，由全球智慧物联网联盟（GIIC）主办、鸿蒙生态服务（深圳）有限公司承办的鸿蒙生态大会\
    \ 2026 已于 8 月 28 日在深圳会展中心（福田）举行。华为公司副董事长、轮值董事长徐直军出席大会并发表题为「鸿蒙生态建设是一场没有终点的马拉松」的致辞。 \n   \n 徐直军表示，鸿蒙生态今年突破一亿用户的规模临界点，会进入增长新阶段：\
    \ \n 徐直军还认为， 鸿蒙生态在中国已经「站稳」了，但鸿蒙离最终成功还有两个硬的考验 ，一个是把握 AI 时代机遇，让鸿蒙终端的智能化竞争力"
