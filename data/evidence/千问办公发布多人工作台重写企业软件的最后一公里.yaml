  title: 千问办公发布多人工作台，重写企业软件的最后一公里
  published_at: '2026-09-09T07:07:04Z'
  collected_at: '2026-09-10T05:13:56Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Cynthia  \n  编辑｜郑玄  \n \n 2026 年 2 月 3 日，由 Anthropic 带头，华尔街替 SaaS 写好了讣告。 \n 几天前，Anthropic\
    \ 正式官宣把 Claude Cowork 的插件能力扩展到法律、销售、金融等知识工作。与普通聊天机器人不同，这些插件可以携带部门工作流、调用外部工具和数据，并按照预设规则完成一段具体工作。 \n\
    \ 市场很快把这种能力翻译成了另一个词：替代。2 月 3 日，高盛一篮子美国软件股单日下跌 6%；彭博统计，当天软件、金融服务和资产管理相关股票合计蒸发约 2850 亿美元。一天之后，Wind 香港\
    \ SaaS 指数又下跌 6.39%，板块总市值缩水近 150 亿港元。 \n  七个月后，这个问题又进一步从资本市场蔓延到了产品端。  \n 9 月 7 日，千问办公上线多人工作台。用户不再先选择我要做\
    \ CRM 或者我要做项目管理，只要说清有哪些角色、每个人要做什么、需要保存哪些数据。系统据此生成一个可以在线发布的协作应用，带角色权限、云端数据库和管理后台，最多支持百人同时在线。 \n   \n\
    \ 「千问办公」产品首页 \n 在这背后，数据库、权限、后台、状态流转这些过去构成一套专业企业软件的基本零件，开始由 Agent 根据一段业务描述临时组装出来。 \n 而这，也让这 SaaS 与企业办公\
    \ Agent 之间的关系变得更加微妙：过去二十年，SaaS 解决了一个巨大的问题：寻找企业办公的公约数，然后将软件低成本复用，统一升级、云端部署、订阅收费，软件公司的边际交付成本因此大幅下降。\
    \ \n 但它始终没有彻底解决另一个问题： 软件怎么低成本地适配一家具体公司甚至一段具体的业务流程。但办公 Agent 做到了。  \n   01   \n  国产 SaaS，为什么 20 年了还没爆发？\
    \  \n 中国 SaaS 大概是科技行业里最擅长过元年的赛道。 \n 至少在 2007 年前后，SaaS 就已经逐渐在国内成为显学。那时中国管理软件市场还是一个很有江湖气的世界：南金蝶、北用友。两家公司从财务软件一路打到\
    \ ERP，全国铺销售、实施和服务团队。 \n 到了 2015 年，伴随移动互联网、云计算和资本进入，行业再次迎来公认的大规模扩张期，中国 SaaS 市场规模就已经达到 10.5 亿美元，同比增长\
    \ 30%。研究机构们，后来也将这一年称为中国 SaaS"
