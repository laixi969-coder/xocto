  fact: In Panton, Vermont, population 660, town clerk Kyle Rowe did it all. He crafted budgets, paid
    vendors, handled property tax disputes, and served as the town’s zoning supervisor and presiding elections
    officer. During morning office hours at the town hall—a wood-frame structure built as a church in
    1858—he also fielded public records requests. Recently, he got rather busy. Panton used to get a request
    every year or so from a company called SmartProcure for “all purchasing records,” covering everything
    from road salt to computers to toilet paper. Last year, those requests started coming quarterly. Then
    different companies began making more specific requests, like records of every purchase related to
    emergency road flares. These targeted inquiries started coming monthly or more. “I’m happy to answer
    public records requests from people,” says Rowe, who recently moved into a position at a nearby town.
