  fact: 2025 年，Lovart 作为全球首款设计 Agent 开始出现在各大设计师社区。第一次用 AI 能力把整个设计流程串联起来。从最初的设计思路、到最终图片或视频的设计物料，终于被完整的放到一块画布上完成。
    随着在生成能力和指令遵循程度上的进步，AI 越发能够满足人们现实世界的真实需求，muse 此时带起关于 personal agent 的讨论显得恰逢其时。AI 在能力上已经具备了可观的解决问题的能力，下一步就是如何个性化的解决「我」的问题，以及更主动的解决问题。
    放到设计里，Personal Agent 带来了一些新的想象力。比如一套物料做完，下一个项目还会来。设计师喜欢什么配色、哪些版式已被否过，总不能每次开工都重新交代，那它能否持续性的理解设计师的风格变化？又或者设计前期调研、每周做一批物料这些日常的重复性工作，能不能也交代一次，让
    AI 往后按时做？ 这些事决定了，眼下 AI 能把设计这件事推动到什么地步。 设计体系里，到现在用过 Lovart 的专业创作者已经达到数千万，它或许是当下最适合回答这个问题的，在迭代到 Lovart
    2.0 后，它拿出了全球首个个人设计 agent——Arti。 01 Arti，个人设计 Agent Arti 不只是一个工具，而是一个真正接住完整设计工作的个人设计 Agent。 你交给它一个完整的设计需求，它不只负责生成，还会主动去调研、找参考。甚至它会查看画布检查信息有没有遗漏、排版有哪些地方需要调整，并根据你的反馈继续修改。这当中反复出现的工作也会被整理成
    Skill，下次再遇到相似的需求，它就能沿用这些做法，省下重新交代和重复操作的工夫。 但在这之前，Arti 在设计领域首先要迈过的门槛，是对于设计师的个人风格和设计 taste 的理解。这也是为什么
    Arti 是从 「 记忆 」 功能诞生的。 进入 Arti 的第一件事，是告诉 Agent 你是谁。 你需要先告诉 Arti 你从事的领域，比如电商、营销、内容创作或者其他的行业，然后就会进入下一步更细致的询问页面——我第一次体验
    Arti 的时候正好有一位在日化消费品牌做过设计师的朋友坐在旁边，所以我借着他的人设，选择的是电商。 Arti 会问的非常细节，除了主要做的设计物料种类，还会询问我作为设计师的身份，是甲方、乙方或者接单的独立设计师。对应不同场景下，Arti
