- id: ev-7573b3184f0f2d72
  project_slug: quoting-rick-brewster
  url: https://simonwillison.net/2026/Sep/2/rick-brewster/
  title: Quoting Rick Brewster
  published_at: '2026-09-02T05:50:57Z'
  collected_at: '2026-09-02T14:32:03Z'
  source_kind: market_signal
  tier: independent
  fact: "Direct2D has always been the biggest hurdle for Paint.NET on WINE, and it's clear that it will\
    \ never be completed enough for Paint.NET's use. And I can't just \"disable\" the use of Direct2D.\
    \ So, instead,  Paint.NET now has an internal, from-scratch, clean-room reverse-engineered rewrite\
    \ of Direct2D that it uses on WINE  (triggered by using  /wine ). It lives in  PaintDotNet.Windows.Direct2D1.Managed.dll\
    \ . This was written by our good friend  Claude , without whom this would NOT have been possible and\
    \ would NEVER have happened. [...] \n Most of this code is, as they say, \"vibe coded.\" By that I\
    \ mean that it has not been thoroughly reviewed, it's more \"trust me bro\" style. I cannot possibly\
    \ review 180,000 lines of code, it's just way way  way  too much. For reference, the rest of Paint.NET\
    \ is about 700,000 lines of code and I've been working on it for over 20 years. [...] \n At times,\
    \ Claude was working with the fury of 10 freshly unshackled Einstein genius-level 10x coders. And\
    \ other times"
