    Late last month, Anthropic released a report arguing that the model GLM-5.3 poses a major cyberattack
    risk. The report’s core concern is that the powerful new model, released in August by the Chinese
    company Z.ai, is freely available for anyone to download and modify. Anthropic’s assertion is only
    the latest move in a long-running debate about whether frontier AI models should be made open, like
    GLM-5.3, or should stay locked behind the doors of the frontier labs. These days, much of the debate
