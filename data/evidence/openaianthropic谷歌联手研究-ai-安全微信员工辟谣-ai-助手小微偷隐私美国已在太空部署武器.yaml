  fact: "因加大 AI 投入 报道称字节跳动 2026 上半年净利润下降 \n 据报道，由于加大了在人工智能领域的投资，字节跳动 2026 年上半年净利润同比出现下降。同时，受 TikTok 等海外业务推动，字节跳动上半年营收同比增长\
    \ 30%，海外收入占比再创新高。字节跳动未对以上数据置评。 \n 在净利润下降的同时，字节跳动的净利润率也出现了持续下滑。此前有外媒曾报道，字节跳动 2023 年净利润率为 26%，2024 年为\
    \ 21%。而从最新数据看，字节跳动在 2026 年上半年的净利润率进一步下降至 16.7% 左右。 \n 报道称，字节跳动近期从银行获得约 300 亿美元贷款，这是该公司有史以来规模最大的一笔贷款，可为其不断飙升的\
    \ AI 投资提供资金支持。而字节跳动在国内最大的竞争对手们也正在募资，为自身的人工智能布局提供资金支持。阿里巴巴正寻求通过大规模配股募集约 100 亿美元，用于人工智能基础设施建设支出。智谱 AI\
    \ 于近日启动了总额 50 亿美元的股权及可转债发行，以支撑其人工智能相关投入。（来源：新浪科技） \n   \n 「三巨头」联手，OpenAI、Anthropic、谷歌 Deepmind 开始合作研究\
    \ AI 安全措施 \n 9 月 15 日消息，随着美国各界对 AI 可能威胁经济和国家安全的担忧不断升温，OpenAI 开始与主要竞争对手 Anthropic 和谷歌 DeepMind 合作研究\
    \ AI 安全措施，进一步推动行业共同应对潜在风险。 \n OpenAI 全球政策主管克里斯 · 莱恩透露，公司与 Anthropic 和谷歌围绕 AI 安全问题的接触持续了数周。OpenAI 认为，三家公司开展这类协调并不需要专门获得反垄断豁免。「\
    \ 尝试合作、优先保障安全，对大家都更好 。」 \n 当地时间上周六，Anthropic CEO 达里奥 · 阿莫迪发表了一篇 3800 词的长文，呼吁放缓最先进 AI 系统的研发，让研究人员有更多时间了解潜在威胁，也让\
    \ AI 生存风险迅速进入公众讨论。OpenAI CEO 萨姆 · 奥尔特曼和 SpaceXAI 负责人埃隆 · 马斯克很快对阿莫迪的主张 表达支持 。（来源：新浪财经） \n 美光展示全球首个\
