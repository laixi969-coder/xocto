  fact: Swedish legal AI outfit Legora today said it has raised $550 million at an $8.8bn valuation, just
    six months after completing its last funding round. The Series E funding round was led by Boston-based
    investment firm Atreides Management, a new invetstor, and brings on board a slew of other new investors.
    It propels Legora’s valuation to $8.8bn from $5.6bn six months ago when it completed its $600m Series
    D funding round. New investors coming on board in the round include Baron Capital, Capital Group,
    Fidelity, Glade Brook Capital Partners, and JP Morgan. Existing investors taking part in the round
    include Accel, Benchmark, Bessemer Venture Partners, General Catalyst, Iconiq, Insight Venture Partners,
    Redpoint Ventures, Salesforce Ventures, and Sands Capital. Legora said it built the round around investors
    with a long term view, bringing together long-term holders with strategic investors, and institutions
