  fact: On Thursday, Pennsylvania Governor Josh Shapiro signed the Artificial Intelligence Deceptive Advertising
    Act into law, requiring disclosures on AI-generated ads. The law requires any ad - whether it's a
    still image, video, audio, or text - that "has been significantly modified or generated by artificial
    intelligence" to include a label in the same format as the ad itself. That applies to TV commercials
    from multi-billion-dollar companies , as well as restaurants' ugly, crowded flyers about their wing
