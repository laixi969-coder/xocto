  fact: Keeping a shared Slurm cluster for foundation model development in sync entails keeping several
    separately maintained pieces of configuration matched to what’s running on the nodes. The cluster’s
    shape lives on multiple configuration files, its software in custom scripts, its network topology
    in files that must be edited as nodes change, and its users in a roster that an administrator must
    maintain and rerun. Over time these pieces drift away from what’s actually running, and nothing tells
    you when they do. We believe cluster configurations should be managed the way you manage the rest
    of your AWS infrastructure. You declare what you want through an API or the console, AWS validates
    it before it’s applied, the cluster is kept in that state continuously, and you can see whether it’s
    working. During 2026, Amazon SageMaker HyperPod brought that approach to Slurm clusters, with API-driven
    Slurm configuration, AMI-based configuration, continuous provisioning, automatic topology management,
