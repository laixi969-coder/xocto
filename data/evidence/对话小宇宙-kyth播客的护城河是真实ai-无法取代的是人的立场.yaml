  title: 对话小宇宙 kyth：播客的护城河是真实，AI 无法取代的是人的立场
  published_at: '2026-09-15T07:10:42Z'
  collected_at: '2026-09-16T00:21:06Z'
  source_kind: market_signal
  tier: independent
  fact: "头图来源：小宇宙 \n   \n 过去一年，播客被推到了内容行业的聚光灯下。 \n B 站拿出 10 亿元流量扶持视频播客，罗永浩、鲁豫等名人带着数小时的长对谈进入市场。小红书也在持续补齐视频与音频播客能力，抖音精选则通过自制节目试水长对谈。那些原本只在播客听众中流动的内容，被剪成短视频切片，登上热搜和推荐流。\
    \ \n 商业化也在加速。2025 年，小宇宙合作品牌数量同比增长 422%，商业收入增长 760%，实现变现的播客数量增长 356%。一个过去长期被称为「小众」「慢热」，甚至需要创作者「为爱发电」的行业，开始出现做大的迹象。\
    \ \n 但新的问题也随之而来。 \n 名人、机构和平台资源不断进入，意味着更多用户和商业预算，也意味着流量进一步向头部聚集。视频让播客更容易传播，却可能把一种以声音、陪伴和长期信任为基础的内容，再次带回对点击率和注意力的竞争中。\
    \ \n 当播客不再只是「小众爱好」，它将变成什么？当小宇宙开始承接更大的用户、内容和商业需求，它又该如何避免成为另一个追逐流量的内容平台？ \n 小宇宙 CEO Kyth 给出的答案是：小宇宙想要的不是「小而美」，而是「强而久」。\
    \ \n 「强」意味着让更多内容被发现，让更多创作者获得收入，让听众、创作者和品牌形成一个真正运转起来的生态；「久」则意味着，当一轮风口和流量过去，创作者仍然愿意更新，听众仍然愿意留下。 \n 8\
    \ 月底，小宇宙在上海举办首届 AI 垂类线下活动「先声信号塔」，并发布《2026 AI 趋势报告》。报告显示，2025 年，小宇宙 AI 相关内容创作者数量同比增长 187%，相关节目数量增长\
    \ 239%。 \n AI 内容的爆发，给这个问题增加了新的变量：当声音、文稿和观点都可以被批量生成，一个播客平台究竟应该保护什么？ \n 在 Kyth 看来，答案是「真」——一个真实的人，以自己的声音和立场，长期面对听众。\
    \ \n 活动结束后，Kyth 接受了极客公园专访，话题从视频播客和 AI 内容，延伸至用户增长、创作者生态、小宇宙的商业化，以及一家播客平台如何成为一家「强而久」的公司。 \n 以下是对话实录，经整理编辑。\
    \ \n  01 当播客有了画面，声音仍然是主角  \n 极客公园：小宇宙前段时间开始内测视频播客，这个想法是什么时候开始的？ \n Kyth：其实很早就规划好了。我们想填补的是用户在小宇宙里看视频的需求——这个需求是真实存在的"
