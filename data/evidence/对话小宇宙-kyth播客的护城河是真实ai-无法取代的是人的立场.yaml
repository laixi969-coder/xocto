  fact: 本文首发于 Founder Park 公众号 · 2022 年 8 月 19 日                     如何打造一名数字人很重要，数字人穿什么，也很重要。         毕竟，早在
    QQ 还流行的时代，很多人都会花心思在 QQ秀的设计上。         今年 5 月，Decentraland 举办了第一届元宇宙时装周（MVFW），各种数字时尚产品引发全球热议。各个时尚巨头，比如
    LV、GUCCI、Nike 也在推出种类繁多的数字时尚单品。在国内，抖音计划推出名为「沸寂 pheagee」的数字时尚业务，小红书也上线了很多虚拟时尚活动，更有很多创业公司也都瞄向这个方向。         在数字时尚流行之前，我们先解决数字服装的问题。创业公司凌迪Style3D
    专攻服装 3D 数字化，致力于在数字世界提供更真实的服装体验，也想让服装这件事变成一件「所见即所得」的事情。         数字服装和传统的 QQ秀有什么区别，又会如何改变服装行业甚至时尚行业，以及在未来的数字时尚行业，中国原创有没有自己的一席之地？         关于这些问题，我们邀请了凌迪Style3D
    创始人 & CEO 刘郴，一起聊聊数字服装的现在和未来。                 数字时尚会体现所有数字化产品的特征，数字资产层面可以大量被编辑、被复用，这是 QQ秀所不具备的。    数字服装的设计就像要模拟一个真人在数字世界里的行为，越接近本质，复杂度是呈指数增加的。    服装行业也不会全部被数字化，最终一定是数字理性和感性的结合。    在专业的场景里，只要在专业领域里做深、做透，一定能找到有竞争力的生存空间。    设计师创造力的发挥依然是人类生活非常重要的一部分，我们要做的是如何帮助他们发挥创造力，不要被流程和工具所束缚。                以下视频来源于     Style3D                                                                                                                                            已关注
