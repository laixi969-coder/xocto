  fact: A continued boom in late-stage and growth funding combined with a surge in seed-stage funding
    helped buoy venture investment in Latin America for the third quarter of 2026, Crunchbase data shows.
    All told, startups in Latin America raised a combined $1.3 billion across seed- and growth-stage deals
    in the three-month period ending Sept. 30. That was up 26% year over year but down 9% from the second
    quarter. For perspective, we charted out total investment, color-coded by stage, for the past 12 quarters
    below. Of the quarterly total, $757 million went into late-stage and growth deals, up 74% compared
    to the $435 million that flowed into such deals in the third quarter of 2025. However, that is down
