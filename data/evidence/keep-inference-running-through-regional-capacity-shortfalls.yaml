  fact: 'Serving a model from more than one AWS Region is a well-established pattern for highly available
    inference: when one Region runs short of GPU capacity, requests move to another. The pattern is simple
    to describe and hard to operate. Until now, if you served models on Amazon SageMaker AI managed endpoints,
    cross-Region routing was a piece you still had to build yourself. Today, we’re introducing cross-Region
    inference routing in Amazon SageMaker AI. It uses a new resource, the inference router, that gives
    your application one invocation path across the endpoints and inference components you already run,
    in one or more AWS Regions and AWS accounts. You register the destinations that serve a model, and
    your application invokes the router instead of a specific endpoint. The router keeps requests in its
    own Region while the local destination is healthy, shifts new requests to another registered destination
    when it isn’t, and returns traffic gradually after recovery. In this post, we explain'
