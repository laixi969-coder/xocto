  fact: As AI tools and agents have continued their march across all aspects of digital life, many companies
    are trying to use LLMs to improve the experience of purchasing goods and services on the Internet.
    Thus far, though, a vanishingly small number of people seem to be taking advantage of those capabilities,
    at least when it comes to using the popular food delivery app DoorDash with an outside AI agent. In
    a third-quarter earnings call Thursday , DoorDash co-founder and CEO Tony Xu responded to an analyst
    question by noting that "AI agents are generating several hundred orders [on DoorDash] across the
    time that they've been up and running." In a marked understatement, Xu called this a "very low use
    case" for a company that handled just shy of 1 billion orders total in the third quarter of 2026 alone.
