  fact: Italian deeptech startup Ganiga has raised €1.5 million in an equity funding round to further
    develop its AI-powered waste management technology and support commercial expansion. The round was
    led by Italian contract catering company Vivenda, with participation from London-based NextSTEP and
    three angel investors. Together with €1 million secured through Smart&Start Italia, an incentive programme
    managed by Invitalia, Ganiga's total funding has reached €2.5 million. Founded in the province of
    Pisa by Nicolas Zeoli , Ganiga develops technologies combining artificial intelligence, computer vision
    and robotics to improve waste management and reduce food waste. The company initially focused on robotic
    waste sorting, developing devices that identify and separate different types of waste. It has sold
    more than 300 devices for use in airports, shopping centres and large businesses across Italy, Japan,
    Australia and other European countries. Building on data collected through these deployments
