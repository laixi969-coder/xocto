  fact: It can be hard to use Google products—or even the Internet itself—without coming into contact
    with Gemini AI. That is, of course, by design . The more you use Gemini, the more data Google collects
    to train and improve its generative AI chatbot. The options to limit training on your data have been
    scant, but Google is finally adding more controls to the Gemini app. The change currently rolling
    out to Gemini will separate your chat history from training, which allows you to retain basic AI functionality
    without handing Google quite so much control over your data. Prior to this change, the only way to
    opt out of contributing your chat contents (including attachments) for training was to turn off your
    history. That made it impossible to go back and pick up a chat down the road. As the new settings
    roll out, users will see separate toggles for model training and chat history. The history setting
