  fact: Korea’s Ministry of Science and ICT and NVIDIA hosted the MSIT -NVIDIA AI Startup Partnership
    Forum at COEX. Ryu Je-myung, vice minister of science and ICT , joined NVIDIA leaders to meet with
    over 20 Korean startups across foundation models, physical AI, AI infrastructure and AI semiconductors.
    NVIDIA also announced an investment in Korean startup Point2 , with additional investments planned
    in Motif Technologies , RLWRLD and Upstage. Point2 Technology, an AI interconnect company, builds
    scalable, radio frequency-based interconnects that move data between chips and racks in AI factories,
    offering an innovative alternative to conventional copper and optical interconnect solutions for AI
    cluster scale-up, delivering the reach, performance and efficiency needed for next-generation AI infrastructure.
    Motif Technologies , a Seoul-based AI lab, develops foundation models for building AI agents that
    carry out complex tasks, including Motif-3, a large language model released with open weights
