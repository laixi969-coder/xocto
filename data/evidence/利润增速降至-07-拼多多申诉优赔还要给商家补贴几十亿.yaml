  project_slug: 利润增速降至-07-拼多多申诉优赔还要给商家补贴几十亿
  url: http://www.geekpark.net/news/374348
  title: 利润增速降至 0.7%， 拼多多「申诉优赔」还要给商家补贴几十亿
  published_at: '2026-11-23T07:18:26Z'
  collected_at: '2026-11-24T06:03:57Z'
  source_kind: market_signal
  tier: independent
  fact: 作者｜李苏 编辑｜郑玄 11 月 19 日，拼多多发布 2026 年第三季度未经审计财报。季度营收 1083.41 亿元，同比微增 0.1%，低于市场约 1155 亿元的一致预期。归属于普通股股东的净利润
    295.41 亿元，同比增长 0.7%，高于市场预期的 261.75 亿元。 财报发布前，市场普遍预计净利润将同比下滑 13%左右，实际披露的数据与预测方向相反。 营收停在原地，利润超出预期，两项指标的走向几乎相反。这种分化说明利润表内部正在发生结构性调整，单看任何一个总数都不足以概括这个季度，需要把营收和费用以及利润三条线逐一拆开，观察每条线背后的资源流向。
    时间点提供了另一条线索。就在财报发布前夕，拼多多商家服务团队升级售后申诉体系，推出申诉优赔服务，平台开始主动介入异常售后订单的核实与补偿。 管理层在财报声明中的表态与这一动作相互印证，公司仍处于战略投入期，将继续投资于帮助商家成长的工具和服务。营收增速降至零点附近，面向商家的投入持续加码，两组信息出现在同一时间。这份财报从费用到收入再到售后机制的主要变化，都指向同一个方向，平台正在把资源从流量采买转向商家生态。另外，从费用到收入再到售后机制的几条线索，共同拼出了这家公司的业务全景。
    01 利润增长的成色 拼多多过去最被熟知的能力是用投入换增长，补贴和投放撑起过高速扩张的年份。 这个季度它展示了另一种状态。经营利润 311.64 亿元，同比增长 24.5%，在营收几乎不动的情况下实现这个增速，靠的是成本和费用两端的收缩，营业成本
    452.43 亿元，同比下降 3.4%，运营费用总额 319.34 亿元，同比下降 12.3%，两端合计腾挪出约 61 亿元。 营销费用也由去年同期的 303.23 亿元降至 252.96 亿元，少支出约
    50 亿元，管理费用 15.79 亿元，同比下降约 10%，研发费用则逆势上行至 50.59 亿元，同比增长 16.8%。 放在两年前，很难想象拼多多会主动压缩营销投放，这家公司过去的增长模型建立在高强度的投入上。主动降速说明管理层对平台粘性的判断已经变化，商家的留存可以脱离补贴维持。
    关键在于收缩没有伤及业务本身。在线营销服务及其他收入 598.19 亿元，同比增长 12%，投放少了，商家仍然愿意花钱购买平台的流量产品，说明商家的留存和活跃建立在经营结果上，不再依赖补贴刺激。50
