  fact: Norwegian AI startup Jenz has raised €540,000 in pre-seed funding from Antler and Ada Ventures
    . The company has also received a NOK 1 million (€92,000) startup grant from Innovation Norway . Founded
    by Remi Bjørnestad (CEO), Jo Schou Sandåker (CTO) and Natnael Belete Seifo (CCO), Jenz is developing
    an AI-powered platform designed to help retailers automate operational tasks and make better use of
    their business data. Retailers typically manage information across multiple systems, including online
    stores, point-of-sale platforms, inventory management, accounting and marketing tools. Jenz aims to
    address this fragmentation by bringing data from these systems into a single structured layer that
    can be accessed and processed by its AI agent. The platform enables retailers to analyse sales and
    inventory data, forecast demand, evaluate pricing and marketing strategies, and automate routine tasks.
