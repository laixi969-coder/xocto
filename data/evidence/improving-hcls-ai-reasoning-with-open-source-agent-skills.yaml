  fact: AI agents on foundation models often misapply healthcare and life sciences decision frameworks,
    citing the right guideline but applying it incorrectly. This post shares 38 open-source agent skills
    across 11 HCLS domains that close this gap, with installation steps, three worked use cases, and a
    410-prompt evaluation showing a 70-86% win rate.
