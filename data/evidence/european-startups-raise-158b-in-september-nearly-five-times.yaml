  fact: September marked a strong rebound in European tech funding after a slower August. Companies raised
    €15.8 billion across 300 funding deals, compared with €3.2 billion across 165 deals in August. This
    represents an increase of almost 394 per cent in funding value, while deal volume rose by around 82
    per cent month on month. Companies Out of 300 deals in September, 25 companies raised more than €100
    million each, including three rounds exceeding €1 billion secured by Mistral and Nscale. The value
    of 34 deals remains undisclosed. The month’s largest deal came from French AI company Mistral, which
    raised €3 billion in a Series D round at a post-money valuation of more than €21 billion. Industries
    Cloud was the leading sector by investment volume in European tech startups in September 2026, capturing
    35 per cent of the month’s total funding, at €5.5 billion. Countries UK emerged as the top fundraising
