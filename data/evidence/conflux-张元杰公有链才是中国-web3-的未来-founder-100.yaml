  fact: 本文首发于 Founder Park 公众号 · 2022 年 10 月 24 日   作为国内 Web3 公有链的创业者，Co  nflux   树图（以下简称 Conflux）联合创始人
    &COO 张元杰认为，关于中国的 Web3 行业，存在很多误解。    「Web3 就是加密货币，中国不允许加密货币」，所以中国没有 Web3。这样的言论大行其道，但 加密货币并不是 Web3 ，只是
    Web3 当前应用生态中的一个热点应用。在张元杰看来，造成这种认知的原因更多是因为「加密货币这些人在现有的 Web3 用户群里占有话语权和主导权」。    而「国内联盟链合规，公有链不合规」的说法在他看来更是一大误解，「并没有任何政策说公有链技术在国内是被禁止的。国家监管部门是给这个领域留了一些摸着石头过河的口子和机会的，这也是我们在国内可以正常做事的原因。」至于联盟链的大行其道，他觉得这完全是
    Web2.0 时代的互联网大公司试图抢夺区块链话语权的行为，因为 「联盟链就是一个伪装版的中心化数据库，代表了落后的技术，是过去互联网数据孤岛、数据门阀的延续。」     对于现在的数字藏品热，混乱的加密货币市场和
    DeFi 行业，张元杰认为，这些都不能代表真正的 Web3， 「Web3 真正什么样还没有被呈现出来，目前只有理念和底层哲学的东西，还根本没有落地。」     到底 Web3 的理念是什么，Web3
    用户是谁，以及国内 Web3 创业应该怎么做，在 Founder Park 的这次访谈中，张元杰也聊了很多，让我们受益匪浅。    可以说，在看这篇文章之前，你对 Web3 的所有理解可能都是错误的。                 当下的互联网，大企业垄断数据，形成一个个数据孤岛，流量成本越来越贵，个人数据被几家大公司瓜分，互联网创业的机会也越来越少，整个行业陷入了僵局。我认为
    Web3 其实是有机会的。    如果还没有千万级日活甚至上亿日活的应用出现，我认为 Web3 的时代就还没有到来，Web3 的理念也没有被真正地阐述。    言必称代币和代币经济学的人，其实都是钻到钱眼里了，已经对人类最本质的日常生活的需求不在乎了，也不再围绕用户的需求出发，而是把所有的注意力放在如何快速创造财富和收获财富上。    整个区块链世界，真正意义上的去中心化从来没有存在过，更多是一个去信任
