  fact: With retrieval instructions in Amazon Bedrock Managed Knowledge Base , you can customize answers
    per tenant. The same product and policy documents often serve several audiences, such as customers
    in different regions or internal teams, and each audience needs its own answer. You set the voice,
    format, retrieval guidance, and answer policy that agentic retrieval applies to each request. Before
    this feature, you couldn’t set the answer style, so agentic retrieval could use a different style
    from one request to the next. For a fixed voice or structured output, you had to turn off response
    generation, call a model yourself, and maintain the prompt in every application. Now you write that
    guidance once, as a managed, versioned Amazon Bedrock resource, and each request references it. When
    you change an instruction, you can pin a version so that each application switches to the new version
    when you’re ready. Take AnyCompany Smart Home, a fictitious company that sells a home controller and
