  fact: 去年，极客公园创新大会第一次办起「小场深谈」。场子都不大，百人左右围坐在一起。 有些瞬间仍然记忆犹新。 在「超级个体」专场，一位观众站起来。他刚从大厂跳槽到一家小厂，正用 AI 做自己的第一款产品。他向嘉宾说出自己的困惑：我还在打工，做公众号、视频号，早晚会被老板和同事刷到。这个冲突，怎么解？
    在「硬控 AI」专场，有人直接向刚刚离职的小米 AI 眼镜负责人提问：如果给你两个亿，你会去做哪种 AI 眼镜？有人继续追问，你觉得豆包手机助手到底是真需求还是伪需求？ 在「重塑关系」专场，一位精神科医生，问做陪伴机器人的嘉宾：你是希望它把人带回现实社会的交往，还是给这个家添一个新成员？
    这些问题都不「大」，但都很真，带着一个人具体的处境，来自坐在你旁边的人。 有老朋友说，这让他们想起极客公园 17 年前的样子——在借来的索尼探梦地下室里，一群人席地而坐。 如果你参加过去年的「小场深谈」，很可能还记得这种
    Vibe。不是发布会式的提问，更像小场子里几个人围坐时，把一个人正在卡住、关心的事摊开来聊。 去年的「小场深谈」，共设置了 4 个主题专场，包涵 12 场深度访谈，数百位观众走进小场，165 个朋友甚至同时买了主舞台和「小场」的票：既听了主会场的趋势判断，也不舍得错过小场里「深谈」的收获。还有超过不少人专程为某一场深谈而来。
    大会后的购票调研里，超过六成观众把「话题兴趣」排在首位，为了聊自己真正关心的问题而来。 这让我们确认： 在信息过载的时代，有些问题，听 AI 解释一百遍，不如和「最有料的人」当面聊一次。嘉宾谈得尽兴，观众提出高质量的问题，一场访谈变成真正的共同创作。
    IF 2026「小场深谈」现场部分精彩瞬间 今年 12 月 5 日、6 日，极客公园创新大会 2027 将在北京举行，主题是「Revaluation 价值，另有答案」。 AI 冲击下，价值的标准正在被重新评估。哪些旧经验值得重新审视，哪些新机会正在出现？
    最迫切的那些议题，网络上、AI 里都没有现成答案。 因此，在主舞台之外，我们将继续保留「小场深谈」——一个更小、更近、更主动的交流空间： 更深： 围绕一个方向，几小时的深度访谈与探讨，把一个问题聊透；
    更近： 实干派嘉宾与观众面对面，传递最坦诚的思考； 更主动： 你不只是听众，可以提问，成为这场讨论的共同创作者。 值得聊的话题也在跟着变。 目前，小场的具
