  fact: "9 月 21 日，一条弹窗开始出现在试图用 Meta Muse 在 Amazon 上购物的用户屏幕上：「未经授权的 AI Agent 继续访问，将违反 Amazon 使用条款。」 \n\
    \ 这距离 Muse 正式上线，仅仅过了 13 天。 \n   \n Meta 推出的个人 AI 助手 Muse 最近爆火｜图片来源：Meta \n Meta 在 9 月 8 日发布了 Muse，把它定义为「\
    \ 全球第一款，为所有人打造的个人 AI Agent 」。和 ChatGPT、Claude 这些聊天机器人不同，Muse 不只是回答问题，它能打开浏览器、登录你的邮箱、填表格、订机票，甚至直接替你下单买东西。\
    \ \n 效果立竿见影，Sensor Tower 的数据显示，Muse 上线 13 天累计下载超过 250 万次， 9 月 18 日登顶美国 App Store 免费榜第一 ，把 ChatGPT、Gemini、Claude\
    \ 全压在身后。 \n  但显然，面对爆火的个人 AI 助手，传统互联网巨头，并不想惯着它。  \n   01   \n  「不看广告」的 Agent  \n 在拒绝 Muse 的信中，Amazon\
    \ 的声明措辞很客气，逻辑却很硬。Meta 从未提前告知 Muse 会访问 Amazon 的商店；Agent 在浏览时不表明自己的 AI 身份；而且它似乎会捕获并存储用户登录凭证。 \n Amazon\
    \ 把 Muse 类比为外卖平台和在线旅行社：「这些第三方应用在代替用户从其他商家购买商品时，都应当公开透明地运作，并尊重服务提供商是否参与的决定。」 \n 话说得体面，但真正的痛点藏在财报里。\
    \ \n  Amazon 去年的广告收入超过 680 亿美元。 这笔钱的来源非常具体，用户在搜索栏输入关键词，滑过赞助商品，被推荐算法引导，最终点击购买。整个链条的前提是人在浏览。 \n AI Agent\
    \ 不浏览，它不滚动页面，不看赞助商品，不被推荐算法「种草」。它只做一件事：找到用户要的东西，然后结账。 \n  在 Agent 发起的交易里，广告失去了存在的意义。  \n 这不是 Amazon\
    \ 第一次对 AI 购物 Agent 动手。2025 年 11 月，Amazon 就起诉了 Perplexity，理由是其 Comet 浏览器的 AI Agent 冒充普通用户登录 Amazon\
    \ 账户代为购物。2026 年 3 月，联"
