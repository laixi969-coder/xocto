  fact: "大家好，我开源的多智能体团队协作工具 TogoSpace 刚刚发布了 v0.5.1 。\r\n\r\n简单介绍一下：\r\n这是一个多 agent 协作 harness ，你可以通过跟主管\
    \ agnet 沟通，让他帮你组建团队，分派任务，盯进度，检查完成情况等。 \r\n\r\n尤其是在长程任务上表现非常好，我一般是睡觉之前提几个需求，让他带着 AI 干一晚上，早上起来收菜就行。\r\
    \n\r\n\r\n![imgur]( https://i.imgur.com/WT22Fb6.png)\r\n（如图可见帮我盯了一晚上完成六个任务）\r\n\r\n\r\n上次发帖已经是很早之前了，这段时间从\
    \ 0.4.x 迭代到 0.5.1 ，重点打磨了这几个大家最关心的体验：\r\n\r\n1. \U0001F9E0Agent 长期记忆系统：agent 自己总结经验，越干越聪明\r\n2. \U0001F433\
    Docker 容器沙盒：Agent 可以自建隔离容器装依赖、并发跑测试不干扰\r\n3. \U0001F4CB强化的任务系统：多 agent 协作信息更清晰，提升效率\r\n4. \U0001F4CA\
    多处体验优化：上下文容量条 & 实时 Token 输出等\r\n5. \U0001F4BB全新 Tauri 原生桌面端：不再需要打开浏览器访问了（当前支持了 mac ，win 随后跟上）\r\n\r\
    \n\r\n相关链接：\r\n\r\nGitHub 仓库（ MIT 开源，求个 Star ⭐）： https://github.com/alexazhou/TogoSpace\r\n\r\n\r\n\
    欢迎各位 V 友体验拍砖，有任何想法或踩坑反馈我都会及时跟进！"
