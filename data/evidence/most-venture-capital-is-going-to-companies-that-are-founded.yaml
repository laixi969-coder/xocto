  fact: 'The majority of U.S. venture capital nowadays goes to companies founded or led by men who are
    already billionaires. This is not a difficult stat to unearth. So far this year, just seven companies
    raised more than half of all seed- through growth-stage investment. They’re mostly familiar names:
    OpenAI , Anthropic , xAI (now part of SpaceX ), Anduril Industries , Databricks , Prometheus and The
    Boring Co. These companies raised more than $260 billion in equity funding in the first 10 months
    of the year. That’s just over 50% of the U.S. seed and venture investment over the same period, per
    Crunchbase data. Founders and CEOs of these seven companies are also well-known — and exceptionally
    well-off to boot. The world’s wealthiest men Two founders are particularly famous. They are the world’s
    wealthiest men: Elon Musk and Jeff Bezos . Musk founded xAI and The Boring Co., and also co-founded
