  fact: Anthropic has granted external evaluators “employee-like access” to assess the risks of its models,
    following through on a commitment to increase safeguards over concerns the technology could run catastrophically
    out of control. METR, a nonprofit that has worked with leading labs including OpenAI, Anthropic, Google
    and Meta, now has a team embedded in the Claude maker’s office with access to its hardware and internal
    systems. A greater role for third-party evaluators is among the main concrete steps the labs have
    proposed in response to rising concern about the dangers more capable AI systems could pose to the
    economy, cyber security and humanity at large. Read full article Comments
