  fact: 'This post is co-written by Mariah Miller and Sirajus Salekin from AWS and Nicholas Chase from
    Social Department. Entertainment marketing teams manage tens of thousands of video assets across studios,
    networks, and streaming applications. Most campaigns begin with the same video discovery problem:
    finding the one moment in the footage that will resonate with an audience. When a brief lands, the
    clock starts, and what they need is almost never something a database can describe. Semantic search,
    on its own, has a ceiling: It answers the question you can articulate. Ask it for a character holding
    a coffee mug and it will find every coffee mug in a thousand episodes. The queries that actually drive
    entertainment campaigns look nothing like that. They are questions of judgment: which moment in a
    show will travel, which line is quotable, and which single frame will work as a meme. Those questions
    can’t be typed into a search box. Answering them requires two things the search index doesn’t hav'
