  fact: Researchers planted 2 million digital tripwires in requests sent through a sprawling network of
    AI services to find out what happened to sensitive information entrusted to them. What they discovered
    was an ecosystem that leaked highly sensitive data like a sieve. The exposure was found through an
    ingenious experiment designed to test if sensitive information can leak through the vast chain of
    widely used AI services and how that information is exploited when it does. Many of today’s AI apps
    use services such as OpenRouter or Vercel that act as brokers. These “AI routers,” sometimes also
    known as “AI gateways,” receive large numbers of prompts sent from AI app end users and route them
