  fact: "## Overview\r\n\r\nllama.cpp v0.6.0 introduces the new `llama_batch_ext` extended batch API (with\
    \ `llama_process`) for mixed token/embedding inputs and MTP/deepstack state embeddings, adds support\
    \ for the GLM-5.3-Flash (GLM5-Next) 320B hybrid model, the Clef decision model (text and vision) and\
    \ MTP speculative decoding for Qwen4Exp, ships a new `/v1/systemone` server API for decision models\
    \ (laya, julia-1, lev, openjev, kev, nimble), overhauls the Web UI with a Hugging Face Hub data layer\
    \ and model download pipeline, adds a Metal tensor-API flash attention kernel for F16 KV, sparse flash\
    \ attention for quantized K/V on Vulkan, and updates ggml to v0.26.0.\r\n\r\n### Highlights\r\n\r\n\
    - New `llama_batch_ext` extended batch API with `llama_process()`, supporting mixed token/embedding\
