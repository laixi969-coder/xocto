  fact: Latent 3D representations have significantly expanded the capabilities of modern shape modeling,
    enabling compact encoding of 3D scenes and supporting powerful 3D generative models. Despite this
    progress, current representations struggle to capture the fine details of complex objects, fundamentally
    limited by the capacity of their latents. However, scaling latent capacity at training time is computationally
    expensive and often infeasible under memory limits, and naively increasing the number of latents at
    inference fails to make effective use of the added capacity. In this paper, we address…
