  title: '造物 100 #04｜AI 为爱做「鸭」、PLAUD 又推新作、字节 TRAE 造了个数字工牌'
  published_at: '2026-08-30T10:58:17Z'
  collected_at: '2026-08-30T14:53:42Z'
  source_kind: market_signal
  tier: independent
  fact: "如果给模型安装个身体？你会选择什么。 \n 这道题过去只属于硬件创业者，这个八月，它摆到了所有软件公司桌上。Hugging Face 交卷一只走路摇摇晃晃的鸭子，OpenAI 正在造自己的智能音箱，字节跳动旗下\
    \ TRAE 联名 FoloToy 开始改造自己挂在胸口的工牌。 \n 很明显，软件公司造硬件的思路完全不同，他们想要的不是好用，而是主动以及可见。我可以看到我的 AI 走出电脑手机屏幕之外，更主动地参与用户生活的其他部分。\
    \ \n 同时，硬件开始越来越便宜了，价格从过去的 799 美元，降低了 40 美元。很多硬件公司不再追求一个高利润的售价，而是选择用更便宜、更易上手、可玩度更高的硬件交给用户，让他们尽快走入自己的生态里，从而能长期收订阅费。\
    \ \n 不仅如此，上一代硬件讲究交付一个定义完整的产品，像 Plaud 刚发的录音耳机，功能边界在出厂前被定义好，用户需要的只是使用。 \n 但从近期产品展现的创新趋势来看，更多公司反而乐于去造一个半成品，搭好基本的框架，把更多的东西交给用户自己\
    \ DIY。这或许也是当下「造物」的另一种表现方式，不需要用户自己再手搓硬件，也能改造出自己想要的东西。放在用户面前的问题，从我要买一个什么样的产品，变成了我需要在哪个硬件壳子上 DIY 更适合我的东西。\
    \ \n 全球成倍增长的 coding 用户，正好是这批半成品第一批正在等的人。 \n 属于创业者的时间可能不多了，OpenAI 的首款智能音箱据报道已经在路上，Anthropic 刚发布 MHS\
    \ 标准，提前给 AI 操控物理设备铺好了统一接口。巨头下场之前，这或许是小玩家定义品类的最后窗口。 \n  以下，是「造物 100」栏目的第「3」期推荐的最新造物：  \n 开源鸭子机器人 Microduck：Hugging\
    \ Face 教你用强化学习「养鸭子」 \n 当波士顿动力的机器狗在跑酷，特斯拉的擎天柱在叠衣服，Hugging Face 默默掏出了一只鸭子，身高 25 厘米，体重 800 克，独眼里装着摄像头，能走路、会捡东西、摔倒了自己爬起来，还能踩轮滑、哼两句。最关键的技能：摔了，不哭，自己站起来。\
    \ \n 它没有攻击性，甚至有点笨拙。15 个电机驱动，身上还塞了激光雷达和两颗惯性单元，听起来像台小型自动驾驶汽车，外壳却是个黄色塑料鸭子。价格 399 美元，软硬件全开源。8 月 27 日发布当天开启预订，承"
