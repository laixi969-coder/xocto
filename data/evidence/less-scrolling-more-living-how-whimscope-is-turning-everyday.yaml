  fact: 'People often want to do more interesting things but struggle to decide what to do, find the energy
    to organise something, or commit to a big activity. Consumer app Whimscope aims to remove that struggle
    by helping people break out of their everyday routines through small, achievable adventures based
    on their available time, energy, and mood. Think of it as a combination of an activity discovery app,
    a bucket list, and a gentle nudge to do something different. Whimscope follows a three-stage process:
    Dream, Plan, Do. Users discover activities and experiences, choose something to try immediately or
    save for later, and record their completed adventures through photos, notes, and memories. These activities,
    known as whims, range from small everyday experiences to more ambitious adventures, such as trying
    a new hobby, visiting a local attraction, learning to surf, taking a spontaneous trip to a lighthouse,
    or planning a memorable day out with family. Some take just 15 minutes, while others'
