  fact: 苹果官网 2026 年的 iPhone Duo 已售罄！发货日期排到明年 1 月 22 日 10 月 16 日，苹果首款折叠屏 iPhone Duo 于当晚 8 点开启线上预购，大量用户同时涌入苹果官网、Apple
    Store App 及天猫、京东等官方直营渠道，购买页面一度无法正常打开。开售一分钟左右，各大电商平台即显示该机型售罄。 目前官网仍可下单，预计发货时间排至 1 月 22 日，2026 年的备货已全部售罄。受折叠屏铰链、柔性内屏产能爬坡周期长于直板机型、首批备货有限叠加首发集中抢购影响，交期被拉长。后续随着产能释放，发货排期将逐步前移，已抢到
    11 月、12 月批次的用户或提前半个月拿到新机。 该机型维修费用极高，非 AppleCare+用户更换内屏需 7998 元，外屏需 3198 元，电池维修费用达 1898 元，建议自用用户选购
    AppleCare+。(来源：IT 之家） 马斯克回应 Grok Bot 被亚马逊封禁：不让 AI 智能体网购，就考虑自建电商平台 科技媒体 notateslaapp 10 月 15 日发布博文，报道称有用户反馈亚马逊阻止
    Grok Bot 智能体在其平台下单之后，全球首富马斯克表示考虑打造一家与亚马逊竞争的公司。 该媒体指出特斯拉上月已将 Grok Bot 整合进车辆，用户可在通勤途中把下单任务交给 AI。用户无需亲自打开零售商网站，即可由
    AI 完成购物流程，对希望掌控流量、推荐和交易入口的零售平台而言，这直接冲击了其传统电商模式。 据报道，亚马逊不仅限制 Grok Bot 下单，也屏蔽了 Meta 的 Muse AI 购物智能体，同时自身仍在开发
    AI 购物工具。 网友 @thecsguy 近日在 X 平台发帖，反馈遇到的 Grok Bot 网购被封问题，并鼓励马斯克考虑推出「X Shop」。针对用户反馈，马斯克在推文中表示：「或许我们应该创立一家与亚马逊竞争的公司」。（来源：IT
