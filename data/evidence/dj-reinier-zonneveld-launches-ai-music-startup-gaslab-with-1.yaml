  fact: GasLab (Generative AI Solutions Lab), a GenAI music platform created by DJ and producer Reinier
    Zonneveld, is launched this week, backed by $1 million in pre-seed funding. GasLab is on a mission
    to keep creatives in business in the age of generative AI, protecting the future of the creative industry
    by ensuring the artists whose music shapes AI-generated tracks are recognised, credited and able to
    share in the value created. Investors in this round include Eric Demuth, co-founder and executive
    Chairman of Bitpanda, and Bas Beerens, founder of WeTransfer and serial entrepreneur, alongside other
    European entrepreneurs. GasLab gives the music industry a complete end-to-end system for AI music.
    Artists and labels who allow for their music to be used in training its AI model will be able to see
    exactly how their work helped shape each generated track, and will be paid for it. The system’s proprietary
