  title: 把未来做成基础设施｜亚马逊 CTO Dr.Werner Vogels 与云计算 20 年
  published_at: '2026-09-21T11:00:08Z'
  collected_at: '2026-09-22T00:50:51Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Cynthia    \n   编辑｜ 郑玄   \n   \n AI 时代，开发者要如何跟上技术的变化？亚马逊 CTO Werner Vogels，用了二十多年的时间来解答这个问题：基于他主导的\
    \ S3、EC2、Lambda……无数企业与开发者实现了加速奔跑。他每一年的 re:Invent 演讲，也成为了无数人的认知风向标。 \n 虽然自 2025 年之后，他将不再登上 re:Invent\
    \ 的主舞台。 \n 但今年 10 月 13 日，他将带着 2026 年最新技术洞察，出席中国深圳的亚马逊云科技软件企业峰会「创业加速营巅峰路演——通往 re:Invent」，并与极客公园创始人张鹏炉边对话。他的经验，或许会成为我们关于如何拥抱变化的宝贵答案。\
    \ \n 2004 年的圣诞季，亚马逊正在度过创立十年以来最好的一个年末。 \n 感恩节过后，消费电子第一次超过图书，成为网站最大的品类；整个假日季最忙的一天，全球订单超过 280 万件，平均每秒\
    \ 32 件。十年前那家靠卖书起家的互联网公司，已经开始显出后来那个商业帝国的轮廓。 \n 支撑这个帝国的数据库来自全世界企业数据库领域最成熟的玩家 Oracle。然后，12 月 12 日，其中一套彻底崩溃了。一个只会在极端规模下出现的\
    \ bug，偏偏赶上圣诞购物季最关键的节点，让数据库停摆了十二个小时。 \n 而此时，距离后来长期担任亚马逊 CTO 的 Werner 到亚马逊履职还不到三个月。时间一分一秒过去，宕机引发的损失不断扩大，事情很快越过普通技术支持，一路捅到\
    \ Oracle 高层；从工程师到高管，一大批人紧急赶到西雅图。 \n 然而，排查一圈后，系统 bug 之外，他们还发现在当时，业内通常不会区分各种简单访问和复杂关系查询，两者都被挤在同一种数据库中；但偏偏，亚马逊的整体业务规模早就超过了绝大多数数据库产品的默认规模边界。于是，大量给定\
    \ key 读取 value 的简单操作，挤占了本应留给原本复杂查询的资源，长期来看，系统隐患也不小。 \n 这个发现，也成为了后来亚马逊自研数据库的起点：几年后，包括 Werner 在内的九名亚马逊工程师发表了一篇名为《Dynamo:Amazon』s\
    \ Highly Available Key-value Store》的论文。它后来影响了 Cassandra、Riak 等一代 NoSQL 系统，也成为 DynamoD"
