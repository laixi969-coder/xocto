  fact: 'I gave a keynote at the AI Engineer Code Summit a couple of weeks ago, constructed around the
    idea that there have been three significant inflection points in the abilities of LLMs and coding
    agents in the past twelve months. Here''s the video of the talk. In this post I''m going to pull out
    the major inflection point theme and interrogate it more deeply. Coding agents in November 2025 Today,
    November 24th 2026, is the one year anniversary of the release of Claude Opus 4.5 . With hindsight,
    this was a consequential model. In the Opus 4.5 announcement, Anthropic said: Testers noted that Claude
    Opus 4.5 handles ambiguity and reasons about tradeoffs without hand-holding. They told us that, when
    pointed at a complex, multi-system bug, Opus 4.5 figures out the fix. They said that tasks that were
    near-impossible for Sonnet 4.5 just a few weeks ago are now within reach. This held up. Claude Code
    was 9 months old at that point, having been introduced alongside Claude 3.7 Sonnet on February 24th,'
