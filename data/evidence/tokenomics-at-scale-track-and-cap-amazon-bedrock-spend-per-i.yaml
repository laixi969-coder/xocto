  fact: 'Generative AI spend is hard to attribute. Before an organization expands AI access, CFOs and
    CTOs usually want three answers: what do we spend per person or per team, can we cap it, and how much
    work does it take to get there. In our previous post, Tokenomics at Scale: How Jamf Built Real-Time
    Spend Enforcement for Amazon Bedrock , we explained a custom enforcement loop built on AWS IAM Identity
    Center , Amazon Athena over Amazon Bedrock model invocation logs , and AWS Lambda . This approach
    gives near-real-time control, but it requires code you then own and operate. This post shows how to
    get per-identity Amazon Bedrock cost visibility and enforceable spend limits using only AWS-native
    features, with no application code to write for the common case. The approach relies on three things:
    IAM principal attribution , which Amazon Bedrock records automatically; AWS Cost and Usage Reports
    (CUR) 2.0 or AWS Cost Explorer for reporting; and AWS Budgets with budget actions for enforcement.
    By t'
