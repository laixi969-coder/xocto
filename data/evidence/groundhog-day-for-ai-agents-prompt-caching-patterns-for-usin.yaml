  fact: 'Every time you spin off your agent, it has to re-read its whole life story before performing
    an action. Here’s how to make it remember without having to feed it the same context again. In the
    movie Groundhog Day , Bill Murray’s character re-lives the same February 2 every day. He wakes up
    to the same song playing on the radio, in the same inn, and the same small town, again and again for
    what some movie fans estimate to be 34 years. Nothing he accomplished the day before carries over
    unless he works it out again from scratch. AI agents live in a version of Groundhog Day. Every time
    an agent takes a step (calls a tool, reads the result, decides what to do next), it has to send the
    model its entire story so far to maintain continuity: the tool definitions, the instructions, every
