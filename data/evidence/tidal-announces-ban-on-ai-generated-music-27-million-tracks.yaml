  fact: Most streaming music providers have opted to label AI-generated content on their platforms, and
    until now, Tidal was one of them. However, the company is about to take a harder stance. Tidal announced
    that in the coming weeks, it will fully ban AI music because of the harm it does to human artists.
    Tidal debuted its initial AI policy in July 2026, which included labeling and demonetizing all songs
    created entirely with AI. That wasn't enough to stem the tide of AI slop, though. Over the past 90
    days, Tidal reports that 43 percent of new uploads were completely AI-generated. On November 6, new
    uploads to Tidal hit a whopping 60 percent AI-generated. As things stand, Tidal hosts 27 million tracks
    labeled as AI, all of which were obviously added in the past couple of years. That accounts for 6.3
    percent of Tidal's total catalog. On December 9, Tidal will delete all those songs. The streamer notes
