  title: 黄仁勋遭董事会罢免主要原因曝光；《GTA6》首发收入 37.9 亿美元，超《复联 4》总票房；马斯克收到上海工厂员工特制边角料手办
  published_at: '2026-11-22T01:05:22Z'
  collected_at: '2026-11-22T02:15:03Z'
  source_kind: market_signal
  tier: independent
  fact: 《GTA6》首发收入达 37.9 亿美元，超越《复仇者联盟 4》总票房 Take-Two Interactive 表示，《侠盗猎车手 6》（GTA6）的预购加上首发当日销售额达到 37.9
    亿美元，这不仅创下电子游戏史上最高首发收入纪录，也大概率是娱乐史上所有创意作品中规模最大的首发。这场现象级首发展现了游戏 IP 在商业、文化以及好莱坞层面的巨大价值。 GTA6 的首发收入已经超过影史票房冠军《复仇者联盟
    4：终局之战》的全球总票房 29 亿美元。 本次首发热度极高，甚至在周四改变了全球互联网流量走向。 互联网交换中心运营商 DE-CIX 称，该游戏上线催生全球数据流量新纪录。GTA6 上线时段的数据吞吐量，较今年年初常规周均值高出
    25%。 Streams Charts 的数据显示，它同时创下直播观看纪录，全平台峰值在线观众 791 万人，流量主要来自 Twitch 和 YouTube。（来源：环球市场播报） 马斯克称 FSD
    V15 下个月将全面推送 特斯拉 CEO 伊隆·马斯克在 X 平台上发帖称，FSD V15 版本下个月将全面推送。他写道：「SFT（有监督微调）与其说是「微调」，倒不如说是「用电锯理发」！这种流程本应直接整合进基础训练阶段。而且，还要专门搞个「系统提示词」（system
    prompt），简直荒谬！模型默认的行为表现就该足够合理才对。上述观点在特斯拉的 AI（虽然还称不上「超级」AI）上已经得到了体现。它是目前地球上最高效的 AI。FSD V15 下个月将全面推送。它一定会带来非凡的体验。」（来源：新浪财经）
    黄仁勋遭董事会罢免主要原因曝光：缺乏坦诚 两名熟悉英伟达董事长及其他董事私下讨论情况的人士透露，最终促使董事会做出决定的，是和黄仁勋「缺乏坦诚」、「撒谎」有关的多项问题。消息人士称，黄仁勋在 11
    月 8 日承认存在婚外情。在随后数日，更多婚外情传闻浮出水面，其中据称包含一名直接下属。一名接近董事会的消息人士告诉《连线》：「可以确认的是，黄仁勋存在撒谎行为，该情况从 2025 年 10 月一直持续到近期事件。」知情人士表示，第一段婚外情曝光之后，董事会极为震怒。一名了解董事会想法的消息人士表示，罢免黄仁勋最主要的动因是「撒谎」。「这关乎诚信与信任。」该人士称。（来源：新浪财经）
