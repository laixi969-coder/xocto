  fact: To increase productivity, accelerate innovation and create new opportunities for economic growth,
    Europe’s industrial leaders are tapping NVIDIA CUDA-X and Omniverse libraries , as well as NVIDIA
    Cosmos and Nemotron open models, across the engineering and manufacturing lifecycle. Bringing those
    capabilities together on the factory floor, the NVIDIA Factory Operations Blueprint (FOX) is now available
    in early access on GitHub , providing a path for developers to build and deploy always-on factory
    manager agents that coordinate work across machines, and specialist agents focused on use cases such
    as visual inspection, root cause analysis, report generation and fleet management. These agents can
    connect to frontier models, including NVIDIA Cosmos and Nemotron, and foundational knowledge including
    computer-aided design, product lifecycle management, simulation software, and IT and operational technology
