  fact: By Rick Folgmann A landlord in California has 21 days after a resident moves out to return the
    security deposit or send an itemized list of deductions. Miss it in bad faith, and the penalty can
    reach twice the deposit. That deadline doesn’t care whether the letter was supposed to come from a
    person or a piece of software. Either way, someone will answer for it. I think about this a lot. At
    my company, Get Covered , we now run 16 AI agents across more than 3 million rental units. When we
    built them, the technical questions turned out to be the easier ones. The harder question, for each
    agent, was actually who it reports to. Rick Folgmann, COO at Get Covered. Most companies are about
    to face that same question, and few are ready for it. Deloitte’s 2026 State of AI survey found that
    23% of companies use agentic AI at least moderately today, and 74% expect to within two years. Gartner
    , meanwhile, has predicted that more than 40% of agentic AI projects will be canceled by the end of
    2027.
