  fact: 'Today, we’re sharing a new set of long-term purchase commitments spanning cement, steel, trucking,
    and recycled plastics. Through these commitments, we’re helping bring clean manufacturing to a commercial
    scale in the industries that build and supply our data centers. Building the physical infrastructure
    that supports Meta technologies takes significant quantities of foundation materials: cement, steel,
    plastics, and the freight networks that move them. Reducing the emissions associated with building
    infrastructure requires not only sourcing differently but bringing lower carbon materials and services
    into existence at commercial scale. Our multi-year commitments give suppliers the revenue certainty
    they need to build these solutions, and stepping in early helps demonstrate these technologies so
