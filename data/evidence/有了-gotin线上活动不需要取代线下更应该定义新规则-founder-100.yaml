  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 15 日               「  线上和线下一定是不一样的，我们认可这个不一样，是有价值的不一样，应该把不一样的价值发挥出来。  」     在聊到线上虚拟活动和线下活动的区别时，有了
    Gotin 创始人兼 CEO 陈悦是这么回答的。    在我们进行这场采访的一个月前，作为线上虚拟活动平台代表的 Hopin 公司，刚刚宣布了今年的第二轮裁员，几乎要裁掉 1/3 的人。随着疫情防控政策的逐步放松带来的线下生活的恢复，以及全球整体经济的下滑，线上虚拟活动平台的商业模式受到了不小的影响，出现了不少唱衰的声音。在这个时候，讨论线上活动的本质以及未来发展的可能性，变得更为必要了。    在合作伙伴声网看来，有了
    Gotin（以下简称 Gotin）与别的线上活动平台所不同的是，虽然都标榜元宇宙，但是陈悦是真的懂一场活动的全部流程。「 陈悦会把自己之前在组织活动、举办活动、数据沉淀，包括参与活动的经历提炼出来，他更理解这个时间点需要什么，如何把活动做好等。
    」    对于如何让线上活动更有效率，Gotin 也有很多「绝招」，5 月份一场浦发银行的活动，线上赴约率达到了 98%，平台平均观看时间达到 280 分钟，而一般线上活动的平均观看时长仅为 20-40
    分钟。线上互动的次数也远高于线下活动。    除了增加更多会议场景、游戏化，以及为双人场景进行优化等方式外，在陈悦看来，线上活动应该摆脱线下空间的束缚，真正找到线上活动的规则定义。    至于线上活动的未来，陈悦认为，线下和线上将是长期共存的状态，因为「
    虚拟活动的终极可能是脑机接口 」，在此之前，线下活动也将一直存在。     注：本次采访还特邀了声网战略投资部投资经理刘呈熙。               好的活动必须要具有互动、空间和人物三要素。    和
    Zoom、腾讯视频相比，Gotin 更多是把活动前、中、后的整个活动链路打通的一款产品。    活动有领头羊效应，顶级会议的体验很可能定义这个赛道下第二层第三层的会议。    线上和线下一定是不一样的，是有价值的不一样，应该把不一样的价值发挥出来。    SaaS
    产品的壁垒不在于一个杀手锏功能，在于覆盖整个链路的各种痛点。    线上活动的本质是用全新的方式重新定义人与人和环境交互的行
