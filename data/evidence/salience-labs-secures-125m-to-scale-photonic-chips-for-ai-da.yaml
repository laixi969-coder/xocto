  fact: Salience Labs , a developer of photonic chips for AI data centre connectivity, has raised $125
    million in an oversubscribed Series B funding round to accelerate the deployment of its optical switching
    technology and expand its manufacturing operations. The round was led by Bullhound Capital , with
    participation from AMD Ventures, Intel Capital, SBI Group, Hudson River Trading and British Business
    Bank. Existing investors Applied Ventures, Oxford Science Enterprises, Cambridge Innovation Capital
    and Silicon Catalyst Ventures also participated. As part of the investment, Callum Stewart, Principal
    at Bullhound Capital, will join Salience Labs' Board of Directors. Salience Labs develops optical
    circuit switching (OCS) technology designed to improve connectivity between GPUs in AI data centres.
    Its fully integrated, all-optical switching architecture is designed to connect thousands of GPUs
