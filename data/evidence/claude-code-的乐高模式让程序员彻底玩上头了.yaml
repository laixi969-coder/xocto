  fact: "作者｜Wildcard  \n  编辑｜靖宇  \n \n 终端向来是程序员最严肃的地盘。黑底白字，光标跳动，每一行输出都关乎代码能不能跑通。 \n 但最近两周，Claude Code\
    \ 的画风。被一群开发者彻底带偏了。 \n 有人在输入框上方养了一只像素宠物，Claude 每调用一次工具它就吃一口饭，调用失败当场生病，碰上 rm -rf 还会抱头惊慌。有人把 Chrome 断网时的小恐龙搬了进来，Claude\
    \ 在后台写业务逻辑，人在前台狂按空格跳仙人掌。还有人觉得等 AI 思考的时候总忍不住刷手机，干脆做了一个 4-7-8 呼吸引导动画，答案一出来动画自动消失。 \n     \n  开发者 jarrodwatts\
    \ 制作的在 Claude Code 里打 Doom 的 Mod｜图片来源：X  \n 最离谱的一个叫 Storytime。作者往 Claude Code 里塞了一个 26 万参数的小模型， 根据\
    \ Claude 正在干的活，实时在屏幕上方写一个小故事。一个 AI 编程工具里，又跑着另一个 AI 在讲故事 。 \n 这一切的源头，是 Claude Code 负责人 Boris Cherny\
    \ 9 月中旬在 GitHub 上放出的一套机制，名字就叫 Mods。当地时间 10 月 1 日，它正式写进更新日志，默认开启。 \n 短短十几天，一个敲命令、改代码的工具，被程序员们搭成了一个可以随便盖房子的「我的世界」。\
    \ \n   01   \n  Vibe Coding 乐高来了  \n Claude Code 里的 mod，本质上是几行跑在插件里的 TypeScript 函数。 \n 别看它轻，权限一点不小。它能在对话旁边开面板，能在输入框上方画横条，能改造内置界面，能在\
    \ Claude 执行命令之前把它拦下来，甚至能把请求转给另一个模型处理。不会写代码也没关系，对 Claude 说一句「帮我写个 mod」，它就能自己给自己装上新功能。 \n 于是社区开始疯狂产出。\
    \ \n   \n  开发者 Ansu 做的边工作边把工作用故事讲述出来的 mod 可爱极了｜图片来源：X  \n OneWave AI 的团队一晚上做了十个 mod。除了那只像素宠物，还有一个「发射密码」，遇到破坏性命令必须先输入密码才放行；一个「内心独白」，开个面板展示\
    \ Claude 对你这次会话干巴巴的吐槽；还有一个 agent-race，让"
