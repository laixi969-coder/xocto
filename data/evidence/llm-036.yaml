  fact: "Release:   llm 0.36  \n         \n \n New OpenAI models:  gpt-6-sol  for  GPT-6 Sol  and  gpt-6-luna\
    \  for  GPT-6 Luna .  #1702  \n Model plugins can now declare  supports_conversation = False  for\
    \ models that only accept single-turn prompts. LLM raises  llm.ConversationNotSupported  when these\
    \ models receive assistant or tool history, and  llm chat  rejects them before starting a session.\
    \ See  Models that do not support conversations . The first plugin to use this is  llm-typesafe .\
    \  #1692  \n Reasoning traces in the Markdown output of  llm logs  are now wrapped in  <details><summary>\
    \  tags.  #1701  \n \n \n Plus  bug fixes from five new contributors . \n    \n    \n         Tags:\
    \  openai ,  llm"
