  url: http://www.geekpark.net/news/371113
  title: AI 手机只是起点，高通要为智能体铺一条全栈技术路线
  published_at: '2026-09-28T09:15:42Z'
  collected_at: '2026-09-30T01:18:45Z'
  source_kind: market_signal
  tier: independent
  fact: "「这次骁龙峰会最令人兴奋的地方在于，我认为我们终于步入了一个可以清晰看见 AI 智能手机形态的阶段」高通公司总裁兼 CEO 安蒙在峰会第一天说道。 \n 炎热的美国茂宜岛，早上不到 8\
    \ 点，会场里已经聚集了来自全球的媒体、开发者、合作伙伴和产业人士。让大家等待的并不只是又一代手机芯片，而是在寻找一个更大的答案——随着 AI 从手机里的一项功能，演进为能够跨终端理解意图、保存情境并代表用户采取行动的智能体，CPU、GPU、NPU、内存和连接将如何被重新组织，手机、PC、耳机、眼镜等终端之间的关系将如何改变？\
    \ \n  过去，AI 是高通技术路线图中的一条能力线；如今，AI 正在成为重新定义整张路线图的中心。  \n 这也是今年骁龙峰会释放出的更大信号：高通正在向覆盖终端、边缘和数据中心的智能体 AI\
    \ 全栈解决方案公司加速演进。下一代 AI 手机只是这个故事最先被看见的入口。 \n   \n 等待在峰会门口前最早的一批观众 | 来源：极客公园 \n  安蒙认为，在新一代手机上，意图应该是需要给用户带来最大感知变化的地方。\
    \ 这其中，交互方式的改变和智能体执行能力是需要提供给用户的新价值。 \n 这对芯片提出了高能效、全天候续航等新需求。「最早的骁龙 8 系平台要回答的是，能不能让手机以 1GHz 甚至更高的主频运行高级操作系统，同时撑满一天续航。今天也是类似的挑战，只是换成了一个持续运行的智能体。」安蒙笑谈道。\
    \ \n  过去，AI 是芯片路线图中的一项能力；现在，AI 正在成为定义整张路线图的起点。CPU、GPU、NPU、内存、连接乃至设备形态，都开始围绕智能体的工作方式重新设计。  \n 过去，CPU、GPU、NPU\
    \ 更像是一颗芯片里的不同功能模块；现在，全新推出的第六代骁龙 8 超级至尊版围绕着智能体的完整工作流重新分工。CPU 正如智能体的「规划器」，主频在行业内首次突破 5GHz；NPU 则通过扩大与计算单元紧密耦合的本地内存，减少对外部\
    \ DDR 的频繁访问，并支持最高 300 亿参数的 MoE 模型在终端侧运行。更关键的是，高通首次在旗舰线同时推出第六代骁龙 8 超级至尊版和第六代骁龙 8 至尊版，这两款旗舰移动平台。 \n\
    \  智能体时代的芯片竞争，不再只是比谁的单项算力更高，而是比谁能以更低功耗，把感知、推理、规划和执行组织成一套持续运行的系统。  \n 此外，安蒙还预告在数据中心领"
