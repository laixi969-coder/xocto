    Economics Behind Global Supply Chains . Willy is one of my all-time favorite Decoder guests — his
    way of looking at the world through our supply chains is just a fascinating way of making sense of
    the global economy. I first met Willy in 2019, while The Verge was covering Foxconn’s promise to build
    an LCD fab in Wisconsin. That obviously never happened, but Willy called it right away because he
    could see the supply chain to support a fab simply wasn’t in place. We also had Willy on the show
    in 2021 to talk about what was then the pandemic-era chip shortage. Now, five years later, we’re in
