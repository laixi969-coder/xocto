    设计主要难在自然语言的语义处理上，而包装设计则是在设计的广度上。    当低门槛和平民化设计走到极致的时候，设计供给的形态一定是智能设计。    智能设计的核心不是 AI，而是通过 AI 解决设计问题，最终还是回归到对于企业服务和产业的理解。    智能设计的发展路径是从自动化到智能化，再发展至类人化。    在
