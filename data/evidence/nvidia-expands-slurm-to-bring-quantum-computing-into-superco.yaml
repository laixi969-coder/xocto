  fact: Quantum processor deployments at supercomputing centers have grown nearly sevenfold over the past
    five years, with nearly 30 supercomputing centers around the world now in the process of deploying
    over 50 quantum processors. Many of these centers use Slurm to run scientific supercomputing workloads,
    so expanding its support for quantum processors builds on familiar workflows and tools, enabling computational
    chemists, nuclear physicists and materials scientists to bring quantum computing into their research
    domains without friction. In a new release, Slurm builds on previous work with IBM, Pasqal and the
    wider quantum computing community to allow QPU builders to create a single interface to their hardware
    for every supercomputing center, through a simple file. This makes it easier than ever for HPC centers
    and QPU builders to integrate and serve their hardware. The expansion is already being adopted by
