  fact: Global startups have closed at least 114 Series A rounds of $100 million or more so far this year,
    Crunchbase reported in late September, and more than 70% of them went to AI companies. For most seed
    founders, that headline is a warning. U.S. startups closed 272 Series A rounds in the third quarter,
    according to Crunchbase data, about 28% fewer than the 377 a year earlier. Seed held up better, at
    984 rounds vs. 1,059. The megarounds hide how few A rounds are getting done. Seed checks keep growing.
    The median U.S. seed round was about $3 million last year, 3x its 2018 level, according to Crunchbase
    . Yet only 24% of companies that raised a $1 million-plus seed in 2023 have moved past seed, and just
    16% of the 2024 cohort, down from 55% or higher through 2020. Size your seed against the Series A
