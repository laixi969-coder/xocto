  fact: "## New Model additions\r\n\r\n\r\n### Nemotron 3 Diarization\r\n\r\n<img width=\"1680\" height=\"\
    900\" alt=\"image\" src=\"https://github.com/user-attachments/assets/fe735cb3-9e5b-43ad-8f60-9dec8425aec7\"\
    \ />\r\n\r\nNemotron 3 Diarization is an open-weight streaming speaker diarization model designed\
    \ to determine \"who spoke when\" in real-world audio. It supports both streaming and offline inference,\
    \ handles up to eight speakers, and orders speaker outputs by each speaker's first arrival in the\
    \ input audio.\r\n\r\nThe model uses the Arrival-Order Speaker Cache (AOSC) [1](https://huggingface.co/papers/2507.18446)\
    \ and FIFO queue introduced for Streaming Sortformer [1](https://huggingface.co/papers/2507.18446),\
    \ [2](https://huggingface.co/papers/2409.06656). A single checkpoint supports configurable latency\
    \ profiles, from an 80 ms input buffer to a 30.4 s offline-style buffer, and configurable output frame\
    \ resolution in multiples of 10 ms. With chunked inference, the maximum audio duration is not limited.\r\
    \n\r\n**Links:"
