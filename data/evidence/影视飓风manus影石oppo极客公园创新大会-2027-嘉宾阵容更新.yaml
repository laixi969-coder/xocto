  fact: 首批嘉宾公布以来，IF 2027 收到了超出预期的关注， 短短几天早鸟票已经售罄。 今年 IF 大会的主题是： 「Revaluation 价值，另有答案」。 过去一年，AI 正在以超出预期的速度改变世界。变化越来越快，但真正重要的问题并没有变得更简单：下一轮机会在哪里？哪些行业正在发生根本性的变化？当旧的经验和规则不再适用，我们又该如何做出新的判断？
    我们希望 IF 大会呈现的，正是这个时代最值得关注的议题、最有代表性的行动者，以及那些值得被认真听见的思考。 12 月 5-6 日，北京 798艺术区。我们期待与所有关心科技、相信创新、愿意亲自参与变化的人相聚。在这里听见源头的声音，认识正在行动的人，参与那些尚未有答案的讨论，并将新的判断带回各自的工作与生活。
    今天新的一批嘉宾揭晓，相信也一定有更多你希望来现场交流的人。 极客公园创始人 & CEO，IF 大会发起人。 当旧的规则正在失效，今年 IF，他将与身处 AI 浪潮最前沿、正在创造未来的人展开对谈，寻找价值重估后的新答案。
    2015 年，他创办影石Insta360。十年后，他在上海敲响上市铜锣，成为科创板首位 90 后创始人。在他的带领下，影石全景相机销量连续多年位居全球前列。 今年 IF，他将和影视飓风 Tim 一起推演一个对相机公司和创作者都不太客气的问题：当
    AI 能生成影像，谁还需要一台相机？一段影像，又凭什么值得看？ 从豌豆荚、神策数据到字节国际化业务、光年之外，再到联合创立 Manus：他做过移动互联网、SaaS、AI 三个时代的产品。 作为全球
    Agent 产品的标杆，来到 IF，他将和极客公园创始人 & CEO 张鹏探讨 Manus 内部正在进行的 AI Native 组织实践，以及，这些尝试意味着未来 AI Agent 与人之间将如何更好地协作。
    从个人视频账号成长为全平台粉丝超过 8000 万的内容团队。 毕业于英国肯特大学电影系，Tim 既是自媒体创作者，也是企业经营者，影响着中国数字影像创作生态的塑造：器材测评、幕后纪实、自制短片，几乎覆盖了影像生产的每一环。
    AI 时代，专业创作者如何重新定义自己的价值？听听 Tim 怎么看。 此前，OPPO 把智能做进系统，融进手机用户日常。2026 年 11 月，OPPO 成立 AI 新硬件实验室，要把「个性化的主动智能」从手机挪到更多终端。
