  fact: Genesis AI , a startup teaching robots to perform physical tasks by learning from human movements,
    announced Tuesday it has raised $500 million in Series A funding at a $3.5 billion valuation. Premji
    Invest , Khosla Ventures and Eclipse co-led the round, which brings the company’s disclosed funding
    to $605 million since its 2024 inception. Genesis previously raised $105 million in a round announced
    in July 2025. The company is developing both robots and the AI software that controls them. Its approach
    combines recordings of human hand movements with training in simulated environments, where robots
    can practice skills before attempting them in the physical world. Genesis is initially targeting manufacturing,
    logistics and laboratories with its robot, Eno. Zhou Xian and Theophile Gervet, co-founders of Genesis
    AI. (Courtesy photo) “We just want to bring something more elegant, more timeless,” co-founder and
