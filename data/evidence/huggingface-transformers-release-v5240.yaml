  fact: "# Release v5.24.0\r\n\r\n## New Model additions\r\n\r\n### Inkling 2 Mini\r\n\r\n<img width=\"\
    80%\" alt=\"image\" src=\"https://github.com/user-attachments/assets/beefb5e0-39a9-4205-ab07-0ee707af95f2\"\
    \ />\r\n\r\nInkling 2 Mini is a multimodal model from Thinking Machines Lab that accepts text and\
    \ image inputs and generates text outputs. It is a smaller sibling of Inkling 2 Small, added in v5.23.0.\
    \ It has 24 decoder layers instead of 48, and compensates with a looping mechanism in which layers\
    \ 6 to 17 run three times. A learned message-passing mechanism mixes the residuals of the previous\
    \ pass into the attention and mixture-of-experts inputs of each loop layer. The decoder has a hidden\
    \ size of 2304 and routes each token to 8 of 128 experts. The image encoder, tokenizer and processor\
    \ are the same as Inkling 2 Small's.\r\n\r\nA research checkpoint ([TML-d24-varloop-research](https://huggingface.co/thinkingmachines/TML-d24-varloop-research))\
    \ has the same architecture but supports a variable number of loop passes. F"
