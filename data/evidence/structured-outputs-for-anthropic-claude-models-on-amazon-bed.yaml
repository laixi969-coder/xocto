  fact: Amazon Bedrock now supports structured outputs for all Anthropic Claude models, on both the bedrock-runtime
    and bedrock-mantle endpoints, where the model is available. Whether you call Claude through Boto3
    and the bedrock-runtime APIs or through the Messages API and the bedrock-mantle endpoint, you can
    now receive schema-compliant JSON responses that conform to a defined structure. You no longer need
    custom parsing, retry logic, or post-processing. Practical applications With structured outputs for
    Claude on Amazon Bedrock, you can automate reliable, schema-compliant tasks across industries. Examples
    include extracting every required field from financial earnings reports and compliance documents,
