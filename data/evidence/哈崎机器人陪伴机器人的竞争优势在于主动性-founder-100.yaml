  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 29 日               宠物之外，陪伴机器人的市场在哪里？ 大众对于索尼 AIBO 机器人的追捧 可以给出很明确的答案。    但是为什么选择在当下入局机器人赛道，哈崎机器人的创始人&CEO
    谌振宇是这么回答的，「2019 年，AI 技术在快速地发展，很多行业都已经大量地利用 AI 技术解决机器识别物体的问题。」 在 AI 的帮助下，机器人能够正确地理解世界，和人类有更多主动的交互，是他创业的契机。     在他看来，好的陪伴机器人应该是以合适的售价解决用户的需求，而且更主动地承担陪伴的服务。
    主动提供服务而不是被动等待唤醒，谌振宇认为这也是哈崎机器人相比其他公司的竞争优势。     而从互联网创业转向硬科技创业，谌振宇觉得两者还是有很多相通的，很多互联网的思维在硬科技领域也是适用的，
    「技术是手段，而不是目标」 ，「小步快跑」的思路同样也是可以用在硬科技的技术研发上的。    哈崎机器人目前能满足哪些需求，陪伴机器人的核心本质到底是什么？以及陪伴机器人行业的未来发展等，关于这些问题，谌振宇在这次采访中也进行了详细的解读。                 情感陪伴的核心是对服务对象的理解，包括了解用户的情况、当下的情绪，以此为依据完成符合用户预期的服务。    机器人是作为一个面向用户的产品，首先它要解决用户的需求，其次是以合适的售价让用户可以接受。    MIT
    的四足机器人技术开源给出了一个简化模型的完整实现，但是后面的学习曲线仍然异常的陡峭。    互联网思维是站在用户的角度，使用对应的技术或商业模式去满足用户的需求；技术是手段，而不是目标。从 PC
    到移动互联网、再到机器人，这种思维是可以一直沿用的。                   01          情感机器人不是宠物的替代，       而是补充       Founder Park：养猫、狗是现有的主流情感陪伴方式，为什么会觉得机器人还有机会？        谌振宇：    我们认为情感陪伴其实就是满足用户的需求，真正的内核就是陪伴。而按照用户的需求提供服务，应该是有多种方式可以完成的，机器人在这里面可以做很多事情。能够提供情感陪伴的前提是要理解环境与人的情绪。猫、狗作为宠物与其他动物最大的区别是它能懂得人的
