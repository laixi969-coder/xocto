  title: 「AI Native 」不是魔法，「创业者」这三个字依旧厚重
  published_at: '2026-09-07T09:29:26Z'
  collected_at: '2026-09-07T15:53:16Z'
  source_kind: market_signal
  tier: independent
  fact: "上个月，我集中跑了一趟上海和深圳，也跟几位在 AI 前沿一线折腾的创业者深聊了几次。 \n 齐俊元的新产品干了半年，我问他这阶段最大的收获是什么，他说了句挺朴素的话：「真的伸手去干的时候，你会发现认真还是挺重要的。」\
    \ \n 这话听着很普通，事后却让我不断想起，放到当下的行业环境下看，也挺让人警醒的。 \n 3 年来深入聊过至少 200 位 AI 创业者了，现在有一些已经有点丧气了。「AI 应用已经不能投了」的观点也在业内流传。觉得这不能干，那不能干，机会没了，窗口关了。但你反过来看，那些真正跑出来的产品，都有一个共同点——特别笃定地扎在一个方向上，然后往死里抠细节。\
    \ \n 比如俊元做的产品，真正让我惊异的不是产品形态的创新，而是远超我想象的数据表现。你问他怎么做到的，他说就是要一点一点抠，数据、框架、工程，全都要优化，接下来要做后训练，说的全是细活。一步一步，日拱一卒。\
    \ \n Vivix 刘宇那边也是。他给我展示了他们模型的生成效率，大概 10 秒能出 9 个音画同步的视频。三年前 Demi 他们做 Pika 的时候，3 分钟出 4 个，那会儿都觉得快得不行了。平时我自己在即梦上，一条视频都要等半天，看到\
    \ 10 秒 9 个的表现，是让我很惊讶的。我问怎么做的，他说首先是模型的目标不一样，所以框架不一样。但真正重要的是，因此需要在大概 40 多个地方做工程优化，每个地方优化一点，叠加在一起是上百倍的提升，而且还可以把成本做到更低。\
    \ \n 没什么新鲜的。就是细，就是较劲，就是认真。一点点抠，抠到最后积小胜为大胜。 \n 所以我就在想： AI Native 创业者的核心，可能不在「AI Native」，而在「创业者」。  \n\
    \  今天行业里很多创业者遇到的瓶颈，可能不是「不够 AI」，也不是时代没有机会，而是活儿不够细、基本功出了问题。  \n AI Native 带来的东西是什么？人不多，执行快，不需要拿很多钱就能做出东西，建设能力强。这是「灵」的部分。AI\
    \ 给了我们更多机会，也更容易失焦。 \n 但成为一名合格创业者需要的硬核特质，在这个时代并没有改变。世界观要 solid，路径设计要清晰，设完目标之后要有耐心，要较劲，要能扎硬寨打呆仗。这是「拙」的部分。\
    \ \n 问题就出在这，「灵」和「拙」之间是会有冲突的。当你很适应前面那种快速完成的方式，做到 60 分很快，但要做到 80 分、90 分"
