  fact: Google DeepMind has revealed a new generation of the AI-powered Gemini Robotics platform. In the
    2.5 release, Google says its robotic AI is getting tantalizingly close to completing real-world tasks
    as well as humans do. In fact, some Gemini robots were able to get actual work done in Mercedes-Benz
    factories, and the team is preparing for a day when robots operate alongside humans with an open source
    safety benchmark. DeepMind's physical AI platform has several computational layers between user input
    and robotic action. There's the vision-language model piece, which is Gemini Embodied Reasoning. Essentially,
    it takes your instructions and uses live video to plan how the robot can accomplish the task. The
    other main component is the vision-language-action (VLA) that actually generates robot actions, like
    moving an actuator—that's Gemini Robotics, which has been bumped to version 2.5. DeepMind says that
    Gemini Robotics 2.5 is much better at tasks that require a high degree of dexterity.
