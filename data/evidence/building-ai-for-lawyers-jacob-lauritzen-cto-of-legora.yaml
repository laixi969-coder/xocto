  fact: 'In this episode, we chat with Jacob Lauritzen, CTO of Legora, following the announcement of their
    $550M Series E at an $8.8B valuation a couple weeks ago. We talk about what it takes to build AI agents
    for lawyers and what other people building agents can learn from that work. Legora started in a Stockholm
    basement with a simple product: ChatGPT, Swedish law, and a search tool. Jacob had already been through
    YC with his own startup when he helped Max Junestrand with the application for Leya (now Legora).
    He later joined as head of engineering and is now CTO. Today the agent drafts and edits Word documents,
    reviews thousands of contracts at once, and coordinates work between lawyers, their clients, and other
    agents. The company passed $100 million in ARR in April, less than 18 months after launch, and now
    has more than 1,800 customers. It raised $550 million in March at a $5.55 billion valuation, then
