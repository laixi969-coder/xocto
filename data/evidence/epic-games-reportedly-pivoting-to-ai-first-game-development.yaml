  fact: Epic Games is shifting to an "AI first" development strategy for its collaboration with the Walt
    Disney Company, letting AI models write all the code and guide all the artwork for an upcoming shooter.
    That's according to a Bloomberg report , which cites unnamed people familiar with the project who
    commented on the significant pivot in internal development at the Unreal Engine maker. Human developers
    will be tasked with managing and guiding code and art assets generated by models such as Anthropic's
    Claude, according to internal Epic employee messages viewed by Bloomberg. That means "no more hand-written
    code" and art assets "generated with full AI workflows," according to the report. The $1.5 billion
