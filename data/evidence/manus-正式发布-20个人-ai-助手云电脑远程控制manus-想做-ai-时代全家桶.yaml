  fact: "头图来源：Manus \n   \n 突然地，Manus 在官网和社交平台上公布了 Manus 2.0 版本的更新。 \n 这并非一次简单的产品迭代，更像是 Manus 团队尝试将当下所有最热门的\
    \ AI 场景和功能，融合到一个「AI 全家桶中」 。 \n 此次升级中，团队打造的底层 Cascade Agent 框架，能将任务 Token 消耗减少 23.2%，任务完成时间缩短 28.2%，运行成本降低\
    \ 32%。同时，Manus 现在也提供「云电脑」的选项供用户选择。 \n 向上，从视频编辑、游戏开发、远程控制和 AI Studio，Manus 为所有用户常用的场景，提供了相关产品。 \n \
    \  \n Manus 正式推出个人助手应用 Cue｜图片来源：Manus \n 最重要的， 这次 Manus 还推出了一款个人 Agent——CUE 。这款全新应用支持手机和桌面端，和 Manus\
    \ 共享同样的基础设施。在个人 AI 这块，Manus 正式出击。 \n 这是 Manus 在蛰伏许久后的第一次露面，「全家桶」式的升级，代表那个用产品曾经惊艳所有人的团队，并没被时代落下。 \n\
    \ 另外，在官方公众号中，Manus 表示「正在组建团队开发面向国内市场的产品，与国产模型厂商及生态伙伴的合作也在稳步进行，后续将分享更多进展。」 \n 全场景、全家桶 \n 按 Manus 自己的划分，2.0\
    \ 的更新分成三大类： \n  新的 Agent 框架和运行环境  ；  \n  由桌面端升级的   Manus Studio   ；  \n  以及一款独立的新应用 Cue 。 \n 运行环境上\
    \ Manus 2.0 换成了自研 Agent 框架的最新一代 Cascade，它的思路是让项目在开头尽量轻，等活儿真的需要了，再把相应的专业能力接进来；同一个项目里的简报、网页、视频和自动化流程，彼此关联。\
    \ \n   \n Manus 2.0 在从底层上变得更「经济」｜图片来源：Manus \n 多人联机的游戏需要一台用户关机后仍然在线的服务器，自动化流程需要一个全天候运转的地方，这些都超出了一台个人电脑能扛的范围。现在用户可以直接向\
    \ Manus 购买云电脑，给这类项目一个专属的运行环境。 \n 「云主机」这个由 Manus 兴起、时下大火的概念，也被 2.0 更新包含在内｜图片来源：Manus \n 此外，原来的定时任务也升级成了自动化。以前"
