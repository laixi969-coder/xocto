  fact: "## Overview\r\n\r\nllama.cpp 0.4.1 adds Maple 20B-A1B, Tencent Hy 4, and Spark2.5 support, improves\
    \ JSON schema handling, chat parsing, logging, and server child-process management, and updates ggml\
    \ to v0.24.0.\r\n\r\n### API changes\r\n\r\n- Changed `llama_sampler_chain_n()` to return `int32_t`\
    \ instead of `int` ([#28631](https://github.com/ggml-org/llama.cpp/pull/28631)).\r\n- Added `server_subproc`\
    \ and `waiter` for router child-process monitoring in `server-common.h` ([#28555](https://github.com/ggml-org/llama.cpp/pull/28555)).\r\
    \n\r\n### New models\r\n\r\n- Added Maple 20B-A1B ternary MoE architecture (CPU) ([#27000](https://github.com/ggml-org/llama.cpp/pull/27000)).\r\
    \n- Added Tencent Hy 4 (`hy_v4`) preview architecture support ([#28127](https://github.com/ggml-org/llama.cpp/pull/28127)).\r\
    \n- Added Spark2.5 support ([#27868](https://github.com/ggml-org/llama.cpp/pull/27868)).\r\n\r\n###\
    \ Core changes\r\n\r\n- Added Kimi-K3 recurrent-state rollback support ([#28466](https://github.com/ggml-org/llama.cpp/pull/28466)"
