- id: ev-0d5585f6733582c7
  project_slug: tasks
  url: https://www.v2ex.com/t/1241597
  title: 维护了一年多的开源免费 Todo 软件，最近想让 AI 真正帮我完成任务
  published_at: '2026-09-12T14:14:26Z'
  collected_at: '2026-09-13T00:00:02Z'
  source_kind: product
  tier: independent
  fact: "HamsterBase Tasks 是我维护了一年多的开源 Todo 软件，除了官方云，其他所有功能开业免费，支持桌面、手机和网页端。 也支持自部署\r\n\r\n\r\n最近做了一个\
    \ AI Skill：让 AI 自动读取任务清单，或者把某个项目、分组、任务直接交给它。它完成工作后，会带着说明和截图提交完成请求，验收通过后，任务才会被勾掉。\r\n\r\n我自己主要拿它写开发需求，让\
    \ AI 去做，再回来验收。希望任务清单能成为人和 AI 一起工作的地方。\r\n\r\n教程在\r\n\r\nhttps://tasks.hamsterbase.com/zh/blog/ai-integration.html\r\
    \n\r\n我现在的用法是，vibe coding 出初版后，把需要检查和完善的地方填进验收清单，再把清单 ID 发给 AI ，让它逐项处理、提交结果，我有空时再慢慢一项项验收。"
