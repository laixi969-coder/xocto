  fact: 'The UK government’s £500m VC fund investing in domestic AI startups today said it was investing
    in a British startup which leverages AI technology to update Britain''s surveillance network. The
    Sovereign AI Fund is investing in Augur, which says its AI tech can transform fragmented sensor networks
    into a real‑time intelligence layer for national security and public safety. The startup, whose founders
    include two former Palantir executives, says its tech, which is used by Transport for London, can
    help improve security and monitor crowds. Unlike traditional CCTV, which records footage for later
    review, Augur aims to improve security teams'' ability to identify risks as they develop. The Sovereign
    AI Fund, said: "We are partnering with Augur because Britain needs this capability and should own
    it. The infrastructure is already here. The technology that helps keep us safe should be built here
    too, by a team that has shown that better security and privacy can go together.” The fund also said'
