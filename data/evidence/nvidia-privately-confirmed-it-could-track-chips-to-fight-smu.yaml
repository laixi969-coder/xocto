  fact: Representatives from Nvidia told Illinois representative Bill Foster that it would be technically
    possible to implement the anti-smuggling measures called for in the Chip Security Act, Foster told
    MIT Technology Review in an interview on Thursday, even while an industry group claimed they were
    “potentially infeasible.” Foster, a Democrat who serves on the Committee on Science, Space, and Technology,
    is a cosponsor of the act, which would introduce geotracking requirements to verify the location of
    advanced AI chips in order to prevent their smuggling to China. It is one of three chip-security bills
    under consideration for inclusion in the Senate’s National Defense Authorization Act, each of which
    is drawing renewed attention after Nvidia CEO Jensen Huang’s resignation and reported affair with
    an alleged Chinese spy. When the Chip Security Act was introduced, in May 2025, lawmakers said the
