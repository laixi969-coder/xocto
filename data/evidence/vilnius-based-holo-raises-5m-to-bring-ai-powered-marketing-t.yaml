  fact: AI marketing platform Holo has raised €5 million in a seed funding round to further develop its
    marketing automation technology and reach more small businesses. The round was led by Market One Capital
    , with participation from Silicon Gardens , FirstPick , Leonis Capital , NGL , Tekton Ventures and
    business angels. Founded by Deividas Kovger and Aleksandras Urbanavicius , Holo aims to make AI-powered
    marketing tools more accessible to small businesses, allowing them to manage their marketing without
    dedicated teams. The founding team also includes Karolis Vaiginis , who leads design, and CTO Arnas
    Puidokas . Holo combines marketing planning with content creation and campaign management in a single
    platform. To get started, business owners enter their website, allowing the system to analyse their
    products or services, brand identity and communication style. Based on this information and the business's
    goals, Holo generates a marketing plan outlining which channels to use, what campaigns
