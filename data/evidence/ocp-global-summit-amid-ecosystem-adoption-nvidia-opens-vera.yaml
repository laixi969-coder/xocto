  fact: 'As AI factories grow from megawatts to gigawatts, building them takes more than advanced computing.
    Open standards are helping the industry scale AI infrastructure faster, more efficiently and more
    reliably. At the Open Compute Project (OCP) Global Summit, taking place in the San Jose McEnery Convention
    Center, NVIDIA announced new partnerships and contributions aimed at creating a common foundation
    for next-generation AI infrastructure. NVIDIA contributed key NVIDIA Vera Rubin rack and compute tray
    designs to OCP through the open NVIDIA MGX architecture, giving system builders a common foundation
    for developing next-generation AI factory infrastructure. Together, these efforts span the AI factory
    itself, the utility grid that powers it and the rack-scale architecture at the heart of modern accelerated
    computing. NVIDIA and Partners Announce Open Architecture Advances At the OCP event, NVIDIA and partners
    made a handful of announcements: NVIDIA and hyperscalers published open standards'
