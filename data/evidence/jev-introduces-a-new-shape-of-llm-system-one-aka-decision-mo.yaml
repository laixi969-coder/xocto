  fact: "Last week  TypeSafe AI  unveiled  Jev , their first example of a new category of model that they\
    \ are calling \"System One models\" (I'm with Maggie Appleton, I think \"decision models\" is  a better\
    \ name  for these). Jev is an interesting variant on the usual LLM format: it still accepts text inputs,\
    \ but instead of text output it returns floating point numbers corresponding to categories, yes/no\
    \ questions, ratings, and associated confidence scores. \n TypeSafe describe Jev like this: \n \n\
    \ Think of Jev as a frontier-intelligence function call: unstructured state in, typed probabilistic\
    \ decisions out. \n \n It's also very fast, and  really cheap . Regular LLMs  are priced  in terms\
    \ of input and output tokens, with output generally charged at significantly higher rates. Jev charges\
    \ only for input - output is free - and the input price of their first model is $0.042 per million\
    \ tokens - cheaper even than OpenAI's  GPT-5 Nano  ($0.05/million). \n Jev lets you ask questions\
