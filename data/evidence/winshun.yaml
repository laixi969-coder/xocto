- id: ev-1c05ab70ddcab843
  project_slug: winshun
  url: https://www.v2ex.com/t/1248762
  title: Win 顺 · WinShun 尝尝与 everything 与 listary 不同的口味 10 月 14 日 更新 0.8.0 更新
  published_at: '2026-10-14T08:19:20Z'
  collected_at: '2026-10-15T00:32:03Z'
  source_kind: product
  tier: independent
  fact: "新人第一次发帖。\r\n\r\n地址： https://github.com/LingCore/WinShun\r\n\r\n这是啥：类似 everything 与 listary 的程序\r\
    \n本程序 10 月 8 刚上线，有很多问题请大家体谅，我天天在更新，很多地方已经七七八八了。\r\n\r\n更新好几天，说下感受吧，最主要是就是一个字“累”，累死我了（ opus 和 fable\
    \ 也快累死了），几天改了超多需求，优化了超多体验，修复了超多 bug ；但是结果是好的，工具对我而言越来越满意了，虽然还有些没有做，但是我相信我能做到 TOP1 ，只做最好。\r\n\r\n有建议欢迎反馈，觉得好用就给个\
    \ Star 吧！您的支持是我更新的最大动力！\r\nstar 越多我越爽\r\n:smiling_face_with_three_hearts:\r\n\r\nWindows 上的搜索小工具「\
    \ Win 顺」，连按两下 Ctrl 就能搜，边打字边出结果。Everything 和 Listary 的活，它一个全干了。\r\n\r\n能搜什么\r\n\r\n文件、文件夹：三百多万个文件，几毫秒出结果，新建、改名的文件马上就能搜到；\
    \ NAS 、别的电脑上的共享文件夹也能一起搜\r\n按类型找：选中“文件”后，下面一排文件夹、文档、图片、视频、压缩包……按 Shift+Tab 切换，也能自己加类型\r\n文件里的字：Word\
    \ 、Excel 、PPT 、PDF 、WPS 、代码都能搜，直接告诉你在第几行、第几页；词后面加 文件夹名/ 就只搜那个文件夹，比如 第三季度销售额 财务/\r\n按意思找：记不得原词也能找，?\
    \ 去年报销的规定 就能找到写着“差旅费用申请”的文档（插件，默认关，模型用本机的 Ollama 或你自己的密钥）\r\n软件：微软商店装的也能搜到，打 vsc 就出 VS Code\r\n系统设置：打“网卡”直接出网络连接，不用一层层点\r\
    \n网页：打 zhihu 显卡 就在知乎上搜，自带百度、B 站、小红书、京东等十个常用网站\r\n全都支持拼音，打 ndbg 就能找到“年度报告”；打错了同音字（年度报高）也能按读音找到。每行图标上标着序号，Ctrl+1\
    \ ～ Ctrl+9 直接打开，不用先按住 Ctrl 。\r\n\r\n不只是搜索\r\n\r\n资源管理器里：双击文件夹空白处，弹出收藏的、最近的、别的窗口开着的文件夹，选一个当前窗口就转过去；右键“用\
    \ Win 顺 搜索此处”，"
