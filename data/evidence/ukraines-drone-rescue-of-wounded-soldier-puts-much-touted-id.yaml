  fact: Ukraine’s unprecedented drone rescue of a wounded soldier from the battlefield has shown once
    again how battlefield necessity can spur innovation. The operation was revealed just days after separate
    Ukrainian drones designed for casualty evacuation were deployed for frontline testing—taking a step
    beyond the US military’s decades of experimentation with similar concepts. The drone evacuation of
    the injured soldier took place at an undisclosed time and place on the frontline where the presence
    of Russian drones and landmines made it impractical to send in a wheeled ground robot , according
    to The Kyiv Independent . On October 19, Ukraine’s Army shared a video of the drone evacuation, showing
    the wounded soldier securing himself in a harness suspended beneath a heavy hexacopter drone with
    six rotors before being flown to safety. “This is a historic event, the next stage of evacuating the
