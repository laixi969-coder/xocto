  fact: "2026 诺贝尔奖生理学或医学奖揭晓：三学者凭借「光控离子通道和光遗传学」领域发现获表彰 \n 10 月 5 日消息，诺贝尔奖基金会宣布将 2026 年诺贝尔生理学或医学奖授予以下三人，以表彰他们在「光控离子通道和光遗传学」领域的发现：美国霍华德\
    \ · 休斯医学研究所及斯坦福大学的 Karl Deisseroth、德国柏林洪堡大学的 Peter Hegemann、德国维尔茨堡大学的 Georg Nagel。 \n   \n 诺贝尔奖评选机构表示，三位科学家的研究推动了光遗传学（Optogenetics）的发展。这项技术能够利用光信号精确控制神经细胞活动，使研究人员得以观察活体大脑中的神经细胞如何影响记忆、情绪和行为，并为神经科学研究开启了新的方向。\
    \ \n 这项研究最初源于对单细胞藻类的探索。Peter Hegemann 一直对莱茵衣藻（Chlamydomonas）如何向光源游动感到好奇。21 世纪初，他与 Georg Nagel 发现了一种具有特殊功能的蛋白质「通道视紫红质」（Channelrhodopsin）。这种蛋白质位于藻类细胞表面，当受到蓝光照射时，蛋白质会打开离子通道，使带电离子进入细胞，从而产生电信号。\
    \ \n   \n OpenAI 宣布「28 天计划」：Codex、Work 日进一步或「重置」 \n 10 月 5 日消息，OpenAI 核心产品与平台负责人 Thibault Sottiaux\
    \ 在 X 上发文，透露团队将在未来 28 天持续推进 Codex 和 ChatGPT Work 相关改进。 \n 他表示，OpenAI 接下来每天都会发布一项「对大多数 Codex / Work\
    \ 用户而言有明显改善且具备实际意义」的功能更新，否则就提供一次「重置」。 \n 根据其发布时间计算，这一周期预计至少从 10 月 5 日持续至 11 月 2 日。不过，Sottiaux 并未说明会如何进行重置，也没有确认其「重置」将覆盖哪些用户或额度。IT\
    \ 之家后续将保持关注。 \n 前一天，Sottiaux 还表示团队已经「锁定方向」，当前正在推进的工作主要集中于简化产品、提高使用效率以支持更多使用量、推出突破性功能以及开发新模型。 \n 他同时提到，虽然有时需要提前进行技术投入，但用户反馈已经明确表明，希望相关产品变得更加简单，团队正在对此进行调整。（来源：IT\
    \ 之家） \n   \n OpenAI"
