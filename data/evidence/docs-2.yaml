  title: Accused OpenAI spy had folder called “Saudi Gov Docs,” FBI says
  published_at: '2026-10-19T20:21:53Z'
  collected_at: '2026-10-20T01:06:54Z'
  source_kind: market_signal
  tier: independent
  fact: On Monday, a court granted the US government's request to deny release of a former OpenAI engineer
    accused of bugging a top-secret conference room to steal the frontier lab’s secrets. In a court filing
    Sunday, US attorney Craig Missakian argued that Abdulrahman Alfozan must continue to be detained while
    the US makes its case that Alfozan brazenly spied on OpenAI, either for his own personal business
    gain or to benefit the Kingdom of Saudi Arabia. Evidence showed that Alfozan had been chatting with
    a member of the KSA royal family on WhatsApp, while pursuing opportunities to permanently move back
    to Saudi Arabia during the country's biggest AI push yet, the government argued. Shortly before his
    arrest, the FBI found he accessed a folder called "Saudi Gov Docs" on his iPhone, where he also allegedly
    stored photos of a second bug he planted in the offices. Read full article Comments
