  fact: A financial services team spends significant time each week manually creating client PowerPoint
    presentations from quarterly reports, compliance documents, and market analyses. Each presentation
    requires reading hundreds of pages, extracting key data points, structuring slides, and generating
    supporting visuals. This post walks you through building an AI agent system using Amazon Bedrock AgentCore
    that automates this workflow, completing in under 90 seconds in our internal testing. This approach
    reduces presentation creation time while grounding content in source documents. The solution deploys
    a supervisor agent on AgentCore runtime, a capability of Amazon Bedrock AgentCore, using the Strands
    Agents framework to orchestrate document generation and summarization tools. Anthropic Claude Sonnet
    4.6 (available on Amazon Bedrock) handles content creation, Amazon Titan Text Embeddings v2 powers
    vector search, and Stability AI Stable Image Inpaint (available on Amazon Bedrock) generates slid
