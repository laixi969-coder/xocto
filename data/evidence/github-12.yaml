- id: ev-960de068a0f1ecba
  project_slug: github-12
  url: https://www.v2ex.com/t/1249992
  title: Lyra：自托管音乐库的歌词、标签与整理工具（开源程序，欢迎测试与 PR）
  published_at: '2026-10-19T05:41:35Z'
  collected_at: '2026-10-20T01:06:24Z'
  source_kind: product
  tier: independent
  fact: "项目地址： https://github.com/astralwaveorg/lyra\r\n文档： https://github.com/astralwaveorg/lyra/tree/main/docs\r\
    \n镜像：ghcr.io/astralwaveorg/lyra:1.0.0\r\n\r\nLyra 是一个自托管的音乐库维护工具。它不下载音乐，也不接管播放，只维护你已有的本地文件。\r\n\r\n\
    **它主要做四件事**\r\n\r\n- **歌词**：从 QQ 音乐、网易云音乐、LRCLIB 抓取，写入内嵌歌词和同名 `.lrc`；已有有效歌词默认跳过；支持逐行对比、批量采纳和撤销。\r\n\
    - **标签**：按 MusicBrainz 补齐缺失字段，逐字段显示本地值、来源值和冲突；冲突不会自动覆盖；缺 MBID 或候选有歧义时可以用 AcoustID 指纹兜底。\r\n- **整理**：按\
    \ `艺人 / 专辑 / 音轨号 - 曲名` 生成路径；目录可多选，也可以多选排除；所有移动先预览，目标存在不覆盖，移动后为空的目录可以清理，支持批量撤销。\r\n- **重复音频**：按“音频完全一致\
    \ / 同一录音 / 标题、艺人、时长相近”分类；只检测，不自动删除；删除进入回收站，可以撤销。\r\n\r\n**为什么做这个**\r\n\r\n我的曲库在 NAS 上攒了很多年，标签和歌词状态很乱。试过一些工具，最大的顾虑是一键写入之后不知道改了什么，冲突被直接覆盖，出错也退不回去。\r\
    \n\r\n所以 Lyra 的原则是：\r\n\r\n- 写入前备份，只改目标字段，失败自动回滚；\r\n- 所有移动先给出新旧路径，确认后才执行；\r\n- 删除是移入回收站，不是直接抹掉；\r\
    \n- 重复音频只列出来，删不删由人决定。\r\n- 当然尽可能自动处理，引入 AI 决策能力（我个人使用 MiniMax ）\r\n\r\n**界面**（测试曲库）\r\n\r\n![概览](\
    \ https://raw.githubusercontent.com/astralwaveorg/lyra/main/docs/assets/screenshots/overview.png)\r\
    \n\r\n![重复音频分类]( https://raw.githubusercontent.com/astralwaveorg/lyra/main/docs/assets/screenshots/dedupe.png)\r\
    \n\r\n`h"
