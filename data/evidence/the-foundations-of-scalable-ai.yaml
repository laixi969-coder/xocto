  fact: A scalable AI system requires a strong foundation. Data, engineering, platforms, operating models,
    and governance must converge to work as one. This session from MIT Technology Review’s EmTech Future
    conference explores what it takes to build that foundation in a highly regulated environment and how
    a responsible, trustworthy implementation can turn emerging capabilities, including agentic systems,
    into lasting value for investors. About the speaker Jing Wang, Principal, Center for AI and Insights,
    Vanguard Jing Wang leads Vanguard’s Center for AI & Insights (CAI), advancing the firm’s AI, machine
    learning, generative AI, and behavioral science capabilities. Her team drives enterprise-wide innovation,
    research, and delivery, enabling Vanguard to translate emerging technologies into trusted solutions
    that enhance client experiences, improve investor outcomes, and create measurable business value.
