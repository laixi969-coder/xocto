  title: 第一款 AI 手机，被半个互联网「拒」了
  published_at: '2026-10-16T02:18:36Z'
  collected_at: '2026-10-17T00:31:00Z'
  source_kind: market_signal
  tier: independent
  fact: 头图来源： chatgpt 生成 10 月 14 日，豆包手机助手推出的《屏幕自动化操作声明协议》（SAEP，Screen Automation Execution Protocol）正式结束
    30 天公示期。随之公布的拒绝名单显示，已有 155 款第三方应用明确关上了 AI 自动化操作的大门。名单当日经两轮更新，首批发布为 153 款，最终补全长尾应用后共计 155 款。 腾讯旗下 66
    款、阿里旗下 23 款、美团 11 款、快手 14 款，几乎覆盖国内互联网半壁江山的主流产品悉数在列，就连 Kimi、DeepSeek 等 AI 赛道的同类产品，也选择了关闭权限。 这份长长的拒绝名单，是超级
    App 们在 AI Agent 时代，第一次集体对自身的应用边界和流量主权做出表态。 当 AI 开始能替用户点按屏幕、跨应用完成任务，原本稳固了十几年的移动端流量格局和商业逻辑，正在出现新的裂痕。
    SAEP：把规则摆上台面 在 SAEP 出台之前，这件事始终处于行业的灰色地带。 手机 AI 助手能不能操作某款应用、能操作到哪一步，基本由 AI 厂商单方面技术适配决定，应用方没有正式的表态渠道，大多通过风控策略默默拦截；用户则始终面对模糊的功能边界，不知道为什么有的应用能用
    AI 操作，有的不能。 SAEP 的核心，是把屏幕自动化操作的选择权交还给第三方开发者。 开发者可以自主声明是否允许豆包手机助手在自身应用内执行屏幕识别、模拟点击、内容填写等操作，也可以细化到具体页面、具体功能的权限边界。
    按照豆包公布的运行规则，整个权限开放分为两个阶段： 30 天公示期内，所有第三方应用默认不开放 AI 操作，仅主动声明同意的应用才会被支持； 公示期结束后，未明确提交拒绝声明的应用，将按照风险层级逐步开放操作权限；
    已明确拒绝的应用，始终不会被 AI 执行自动化操作，开发者后续也可随时调整声明状态。 从技术实现上，豆包手机助手的自动化能力基于系统级权限，可在后台完成屏幕读取与交互操作，区别于普通无障碍工具需占用前台的特性。同时，该权限仅针对
    AI 自动化操作，完全不影响应用本身的正常使用，用户依然可以手动打开、使用所有 App。 从隐性冲突到公开规则 事实上，这套规则的出台，之前已埋下伏笔。 2025 年 12 月，字节跳动联合中兴努比亚推出豆包手机助手技术预览版，搭载于工程样机努比亚
