  fact: 作者｜Wildcard 编辑｜靖宇 今天一整天， X 上都有人在讨论，「 1024 程序员节日快乐，今年会不会是最后一个程序员节了 」。 这一天恰好是周六。微博上的话题叫「今年程序员节自带休息日」，配文说
    AI 工具分担了重复编码，程序员终于能过一个不被紧急需求打断的节。 影石连续第五年给优秀程序员发黄金键帽，今年新增了一颗「F5」键，寓意不断刷新迭代。颁奖现场，一位年轻同事说了句玩笑话，「今年的黄金键帽，应该发给
    AI」。 一家机构的节日推文写得更直白，「今年的程序员节，我们扩招了，会指挥 AI 做东西的，也算程序员」。 而在小红书上，有程序员在「古法编程时代」的标签下清理旧书，《图解 HTTP》三块一本，算法书十块。另一条帖子的标题是「程序员的书，多抓鱼都不收」，最后卖出去的几本里，最贵的竟然是《人月神话》。
    一个节日，被放了假，被扩了招，连它的「圣经」都在二手市场上打折。 节日通常不会死于被取消。它死于没有人再需要它来确认自己是谁。要理解这句话，得先回到这个节日是怎么来的。 01 从码农的暗号到所有人的节日
    1024 从来不是一个官方节日。它的远亲是俄罗斯 2009 年定下的「第 256 天」程序员节，传到中国时因为闰年日期飘忽，被换成了更好记的 2 的 10 次方。大约从 2015 年起，10 月
    24 日成了约定俗成的「程序员节」。 这是一个 只有圈内人才懂的暗号 。和它一起长大的，是一整套自嘲。2006 年前后《IT 民工》在网上流传，2009 年到 2012 年「码农」迅速扩散，再往下还有「码奴」「码畜」。自嘲的前提是门槛，拿着比同龄人高一截的工资、干着外人看不懂的活，才有底气管自己叫农民工。2021
    年人社部把软件从业者归进「新生代农民工」的统计口径，程序员们刷屏转发「码农真成农了」，语气里更多的是乐，不是愤怒。 然后，这个暗号被请出了圈子。2020 年，CSDN 在长沙办了第一届 1024
    程序员节，院士开场；2023 年上了央视，2024 年微博话题阅读量达到 40.7 亿次。 有意思的是，这个节日的宣传语，一直在变化。 2023 年，长沙大会第一次把重心从开源转向人工智能 。2024
    年，中国软件行业协会主办的程序员节，主题已经变成「 AI 如潮水向未来，共命运不得不 AI 」；长沙大会开幕式上，CSDN 创始人蒋涛现场演示的，是用自然语言让
