  fact: 作者｜李苏 编辑｜郑玄 理解本地商业，是 AI 走出实验室后的新课程。 过去几年，AI 界擅长讲的故事变了。 从最开始谈技术，讲参数有多大，算得有多快，跑分超过多少人，慢慢转变为讲落地，讲
    AI 怎么一分钟生成商业计划书，怎么给被生活困扰的人们出情绪价值满满的建议。 走出实验室，AI 下一站在哪里？这背后，是一段讲了一半的「AI 平权」故事。前面讲的这一半，是消费者：普通人用 AI
    获取信息、写方案、做攻略。还有没讲完的一半，在经营者那里——对小店老板来说，AI 平不平权，从来不是能不能跟它聊天，而是它能不能帮自己管钱、管货、管客流。 OpenAI 11 月上线测试功能「Businesses
    in ChatGPT」，让商家认领资料、维护信息，看到用户如何在 ChatGPT 里与自己互动。功能不大，信号很清楚：巨头们开始给「商家」留位置了。 这件事，国内的生意其实已经先跑起来了。美团数据显示，近一个月，三线及以下城市使用美团
    AI 助手的商家数量环比增长超 200%，主动发起的对话量增长约 3 倍。 ToB 端的 AI 落地，一条路向上进写字楼，服务白领办公；另一条向里走进街头巷尾，服务一天忙十几个小时的小店。后一条其实更难，考验的不是模型多聪明，而是懂不懂本地生意，是否理解物理世界的复杂，它要看得懂一家外卖店的菜单排序，也要看得见一家酒店和附近同行价格微妙的变化。
    从山东日照、辽宁朝阳的餐饮小店，到内蒙古赤峰的酒店，小城店长也开始用起了 AI 店长。目前，针对餐饮、酒旅、医药等行业，美团都推出了一系列 AI 经营助手，这些 AI 能力也被接入了中小商家平时使用的经营后台。AI
    不仅在走进市井中最朴素的生意日常，也开始服务一个由千千万万家小店组成的庞大市场。 01 改变生意， 从一张外卖菜单开始 过去，山东日照的披萨店老板艾泽判断生意好坏，主要看自己累不累，「忙得顾不上休息，就觉得今天生意应该不错」。但在今年
    7 月份用上妙手外卖版后，曝光、转化率和商品表现被摆到了一起，他才发现，数据反映的情况，并不总和直觉一致。 做套餐，是最先让他改变想法的一件事。 原来，艾泽觉得顾客想吃什么，自己单点就好，没必要专门搭配。但
    AI 给出的分析让他意识到，在外卖的生意里，一份套餐可以对应一种更明确的消费需求，也能帮助顾客更快做出选择，能留住特定的客群。 他开始重新整理菜单，修改图片
