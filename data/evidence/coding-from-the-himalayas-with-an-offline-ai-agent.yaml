  fact: When we talk about working remotely , we take a lot of things for granted, especially reliable
    internet and power. But sometimes, working remotely means trying to get something done on a flight,
    during a long train ride, or somewhere with little or no network. I moved to the foothills of the
    Himalayas a year ago. I love the peace of living here, but it also comes with its own challenges,
    including network and power outages . Things I didn’t think about as much before are now part of planning
    my work. I work as a Principal Engineer at Thomson Reuters , where I spend most of my time coding
    and reviewing my teammates’ code. Coding agents are already a big part of my everyday workflow, which
