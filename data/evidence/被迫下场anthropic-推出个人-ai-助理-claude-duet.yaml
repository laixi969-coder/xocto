  fact: 作者｜桦林舞王 编辑｜靖宇 用过各种 AI 助手的人大概都有过同一种疲劳：你不开口，它就装死；你一旦开口，它又把所有选择抛回给你。 过去两个多月，硅谷巨头们几乎排着队想打破这种被动状态。8
    月 xAI 推出能多智能体分工的 Grok Bot，9 月 Meta 带着能在 WhatsApp 里帮人砍账单的 Muse 席卷千万用户，紧接着 OpenAI 在开发者大会上发布 Dots。行业似乎达成了一个默契：聊天框该翻篇了，AI
    应该自己找事做。 美国时间 10 月 21 日，Anthropic 终于拿出了自己的答案：Claude Duet。 Claude Duet 的早报界面｜图片来源：Anthropic 这是四家里最晚亮相的一个，也是最「奇怪」的一个。在所有人都急着证明自家
    AI 无所不能的时候，Anthropic 像个严肃过头的管家，不仅是唯一主动承认「订票这类生活杂事我们做得没那么好」的厂商，还在发布文档里白纸黑字地给自己画下一道又一道红线。 这恰恰触到了整场竞赛里很少有人愿意直视的问题。
    主动型智能体真正的分水岭，不在于能替你发多少封邮件，而在于它有没有足够的判断力，知道什么时候闭嘴。 01 什么叫「主动」，这是个难题 在官方展示的早报界面里，Duet 给一位叫 Elena 的创业者发来晨间汇总。没有冗长的客套，只有三条最紧要的动态：芝加哥咖啡店开业的卫生许可需要她点头外加
    640 美元；A 轮会议幻灯片的第 6 和第 9 页需要过目；招聘候选人手上的另一份 offer 今晚 6 点到期。 Duet 把需要你点头的事放在最前面｜图片来源：Anthropic Duet
    可以把文件起草好、把金额和选项排列整齐，但最后一刀必须由人来切。发布视频里还有一句更能说明问题的对话：「芝加哥店 26 天后开业，我发现你还没申请卫生许可，已经帮你起草好了。另外有条更新可以等，我们周一再处理。」
    「告诉你哪些事可以等」，这种对轻重缓急的拿捏，正是 Anthropic 把赌注押在 Claude Opus 5.5 上的原因。 过去的自动化工具之所以沦为噪音制造机，是因为规则系统读不懂上下文，重要客户的催单和一封广告邮件，在触发词层面可能毫无差别。一个把每次风吹草动都变成手机震动的智能体，用户的唯一反应就是关掉它的通知。
