  fact: '马斯克豪言 SpaceX 估值超 1000 万亿美元，惨遭拉表打脸 近日，马斯克在社交平台大胆预测，SpaceX 未来估值有望突破 1000 万亿美元，体量将远超当前全球经济总量。目前
    SpaceX 估值仅约 2.2 万亿美元，而 2025 年全球 GDP 总量约 118 万亿美元，此番极具颠覆性的超高估值言论引发全网热议与质疑。 面对这一惊人预测，有网友晒出富国银行证券整理的一张名为「说到做到记录，以及其所隐含的折价」数据表格，直接打脸马斯克的激进预测。
    表格梳理了特斯拉、SpaceX 多项核心项目，Robotaxi、Semi 卡车、星舰等重点产品的实际落地成果与马斯克此前公布的目标差距悬殊，多项项目达成率极低、交付严重延期，部分目标甚至已被撤回。
    据不完全统计，马斯克在过去 15 年间提出的 602 个明确目标中，仅有约三成能够按期实现。从 Robotaxi 的多次跳票，到 Cybertruck 交付的反复推迟，再到 Semi 卡车的量产困境，「马斯克时间」早已成为科技界对过度承诺的一种调侃。
    在 SpaceX 冲击更高估值之前，如何将那些「说到做到」的承诺转化为实际交付，或许是马斯克需要面对的更现实的问题。（来源: TechWeb） 消息称 Meta 已搁置向 Anthropic 出租
    AI 算力的计划 10 月 10 日消息，《华尔街日报》在一篇报道中提到，Meta 已搁置向 Anthropic 出租 AI 算力的计划。 报道指出，Anthropic 首席执行官 Dario Amodei
    今年早些时候曾亲自致电 Meta 首席人工智能官汪滔 (Alexandr Wang)，希望从这家竞争对手处租赁 AI 计算芯片。Meta 就此事进行过内部讨论，最终做出了暂不提供的决定。 随着 Muse
    系列自研模型的逐步发布，Meta 的 AI 业务从早些时候的低潮中快速恢复，自身对算力的需求也迅速增长。此时若选择向 Anthropic 出售算力可算是「资敌」行为。 报道提到，算力资源分配正影响人工智能人才的就业选择，Transformer
    架构核心作者 Noam Shazeer 之所以二次离职谷歌就与算力不足有关。与此同时，大量的算力建设承诺最终落空，限制了 AI 产业的发展。（来源：IT 之家） 消息称英伟达洽谈收购 / 追加投资
    Reflection AI，加码开源'
