  fact: Managing AI model access across dozens or hundreds of AWS accounts creates operational friction
    when each workload account must subscribe and accept AWS Marketplace Private Pricing Offers (MPPOs)
    individually. Amazon Bedrock with managed entitlements simplifies multi-account access to third-party
    AI models so you can subscribe once from a central account and distribute access across your organization.
    In this post, we show you two ways to activate AWS Marketplace Private Pricing Offer (MPPO) entitlements
    in AWS License Manager. Use the lightweight script when you want a one-time, no-infrastructure fix
    for received licenses you already trust. Use the CDK automation when you want ongoing event-driven
    processing that verifies sellers, creates and activates distributed grants. Why automate grant activation
