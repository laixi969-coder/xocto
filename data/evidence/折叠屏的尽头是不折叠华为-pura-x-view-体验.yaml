  title: 折叠屏的尽头，是不折叠：华为 Pura X View 体验
  published_at: '2026-08-30T20:25:08Z'
  collected_at: '2026-08-31T00:37:42Z'
  source_kind: market_signal
  tier: independent
  fact: "阔直板不是「发明」，是用户投出来的票 \n \n  作者｜张勇毅  \n  编辑｜靖宇  \n \n Pura X View 到办公室的第一天，来围观的同事，好几个人的第一反应是同一句话「这个尺寸有点像曾经的黑莓手机」。\
    \ \n \n 华为 Pura X View 实机，是一个直屏手机前所未见的尺寸｜图片来源：极客公园 \n 我理解这个联想：方方正正一块宽屏，确实像那个年代的东西。但用了一周之后，我觉得「像黑莓」是个无心插柳的结果。它没打算致敬谁，只是一台顺着用户真实需求长出来的手机，恰好长成了这个样子。复古感是结果，不是目的。\
    \ \n 真正有意思的，是它的来历。 \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n    先有用法后有机    \n \n 阔直板这个形态是怎么来的，江湖上流传很广的说法是：华为翻用户数据的时候发现，小红书上有一批用户，买了\
    \ Pura X 这台小阔折，却把它当直板机用。配件厂商顺着这个用法，真的做出了「直屏保护壳」——把 Pura X 装进去，手机就不能折叠了。 \n \n 小红书用户自发将折叠屏变成直屏手机来使用，是行业此前从未设想过的一种发展方向｜图片来源：小红书\
    \ \n 注意这个产品有多抽象：折叠是 Pura X 最大的卖点，用户花折叠屏的钱把它买回来，再花几十块钱，主动把这个卖点封印掉。 \n 这等于用户在拿钱包投票：「阔」这个点，其实比「折」值钱。\
    \ \n 今年五月，Pura X Max 发布的时候，我写过「阔折叠」还只赢了一半。现在回头看，赢下的那一半就是「阔」，宽屏的体验红利是真的；没赢下的那一半是「折」，铰链的成本、重量和适配，始终横在体验和价格中间。\
    \ \n \n Pura X Max 作为今年阔折叠首发产品，同样是华为 Pura 产品线的旗舰代表｜图片来源：极客公园 \n Pura X View 干的事，就是把赢了的那一半单独拆出来卖。所以它不是折叠屏的降配版，而是那个需求的原生形态：先有用户这么用，后有华为这么造。产品经理们常把「第一性原理」挂在嘴边，说白了就是回到「用户到底在为什么买单」这个原点。这一次，答案是用户自己写在保护壳上的。\
    \ \n \n 华为 Pura X View｜图片来源：极客公园 \n 大厂做新形态产品，惯常路径是先立项、再上市、再花几年教育用户，折叠屏就是这么走过来的：先把产品造出来，再说服你需要它。Pura\
    \ X View 把顺"
