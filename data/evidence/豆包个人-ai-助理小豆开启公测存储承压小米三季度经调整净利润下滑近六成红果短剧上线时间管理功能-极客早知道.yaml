  fact: 豆包旗下 AI 个人助理「小豆」开启公测，能够帮你处理日常事务 11 月 24 日消息，豆包官方今天宣布「小豆」正式开启公测，采用邀请制开放。用户凭邀请码即可开启体验，并获赠一定量免费额度。
    小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式，在用户明确指令与授权范围内，协助你高效处理日常事务。官方宣称它是「一个懂你，还能主动帮你办事的豆包」。未来，小豆上的能力与体验也将逐步在豆包
    App 上线。（来源：IT 之家） 特斯拉 SpaceX 合并最新进展曝光 据报道，马斯克旗下特斯拉与 SpaceX 的潜在合并交易迎来新进展，双方已经确定五名董事，分别负责指导各自特别委员会推进合并谈判。
    这五人中，三人来自特斯拉，分别是董事长罗宾·登霍尔姆、董事凯瑟琳·威尔逊-汤普森以及杰克·哈通。 SpaceX 方面则由红杉资本合伙人鲁洛夫·博塔和董事兰迪·格莱恩参与。 按照报道，这些董事被认为与潜在交易不存在直接财务利益冲突，因此负责代表各自公司审查合并方案，避免马斯克同时掌控两家公司带来的利益冲突问题。
    值得注意的是，双方的合并讨论并非刚刚开始。 今年 10 月 20 日，马斯克已经公开确认，特斯拉和 SpaceX 董事会分别成立了特别委员会，研究两家公司进一步整合的可能性。 特斯拉随后在向美国证券交易委员会提交的文件中披露，特别委员会将评估包括企业合并在内的多种合作安排，但不能保证最终交易一定能够完成。
