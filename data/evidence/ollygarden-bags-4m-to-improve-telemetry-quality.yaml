  fact: Observability platform OllyGarden has raised $4 million in venture capital funding to further
    develop its technology for improving telemetry quality. The round was backed by Next Frontier Capital,
    Grand Ventures and ACTAI Ventures, with existing investor DIG Ventures also participating. Observability
    companies Datadog, Grafana Labs and Dash0 made additional strategic investments. Launched in 2025,
    OllyGarden helps companies manage the quality of telemetry data used to monitor their software systems.
    Working with businesses across retail, financial services and enterprise software, the company addresses
    the growing volume of unreliable and unnecessary data, which can increase costs and make it harder
    for engineers to identify relevant information. Its platform continuously evaluates telemetry quality,
