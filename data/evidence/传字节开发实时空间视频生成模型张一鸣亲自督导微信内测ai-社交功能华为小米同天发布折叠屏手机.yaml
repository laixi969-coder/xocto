  project_slug: 传字节开发实时空间视频生成模型张一鸣亲自督导微信内测ai-社交功能华为小米同天发布折叠屏手机
  url: http://www.geekpark.net/news/369965
  title: 传字节开发实时空间视频生成模型，张一鸣亲自督导；微信内测「AI 社交」功能；华为小米同天发布折叠屏手机
  published_at: '2026-09-08T00:34:54Z'
  collected_at: '2026-09-08T14:34:47Z'
  source_kind: market_signal
  tier: independent
  fact: "消息称字节正开发实时空间视频生成 AI 模型：张一鸣亲自督导，最快下个月发布 \n 9 月 7 日消息，据彭博社报道，字节跳动正准备推出一款实时空间视频生成 AI 模型。创始人张一鸣正亲自督导这款新模型的研发工作，该模型计划最早于下月发布。\
    \ \n 知情人士透露，张一鸣近期一直在协调公司各业务部门的协作，并调动 AI 资源及算力全力推进该项目。其中一位知情人士指出，发布时间尚未最终确定，计划仍可能发生变动。 \n 据介绍，该模型基于字节跳动现有的电影级视频生成\
    \ AI 模型 Seedance 构建，将允许用户面向直播、短剧和游戏创建交互式虚拟世界。字节跳动发言人未回应置评请求。 \n 知情人士称，张一鸣将空间视频模型定位为驱动整个生态的「飞轮（Flywheel）」——该模型能够将用户置于高度沉浸的三维虚拟环境中，功能与谷歌的\
    \ Genie 类似。字节跳动得以将其自研 AI 模型、云计算底层资源，与旗下的内容平台以及 XR 业务分支 Pico 的硬件终端深度串联、协同发力。 \n 字节跳动最新的模型旨在生成能够响应 Pico\
    \ 头显用户语音或动作的虚拟世界。该模型致力于将生成空间内容这一计算密集型任务完全转移至云端，从而显著降低 VR 技术的初始使用成本。这一架构能够大幅减少头显设备本身的算力要求，为推出造价更低、配置更简化的硬件终端铺平道路。\
    \ \n 同时，高速的内容生成能力还将推动行业竞争重心发生转移——争夺用户的战线有望从比拼硬件参数规格，转向大型 AI 模型、算力基础设施以及内容分发平台。（来源：IT 之家） \n   \n 微信内测「AI\
    \ 社交」功能 \n 9 月 7 日消息，据报道，微信正在小范围内测一项名为「小微 AI 社交」的全新功能。用户只需向自己的 AI 助手「小微」下达指令，它就能直接找到好友的「小微」进行对话，代为完成约饭、协调日程等社交沟通。\
    \ \n 与传统的「代发微信消息」不同，「小微 AI 社交」的核心是两个 AI 先聊，用户仅在授权与决策环节介入。具体流程为：用户向自己的「小微」提出诉求，由它前往好友的「小微」沟通；对方授权确认后，两个「小微」先行交流，再将结果带回，其间需要用户拍板时会提醒其确认。\
    \ \n 这种机制尤其适用于社交意愿较低或对人际沟通存在顾虑的用户。日常中诸多细碎事务、初步意向试探、时间协调等环节，均可交由 AI 分身先行处理，有效降低面对面或即时文字沟通"
