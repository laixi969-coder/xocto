- id: ev-6f1f8e5f98773dc0
  project_slug: sitehunter
  url: https://www.v2ex.com/t/1241154
  title: 做了个挖掘潜在市场的网站，监控哪些网站的流量在暴增，定时扫描 google trends 中哪些词的流量在暴增
  published_at: '2026-09-10T13:26:22Z'
  collected_at: '2026-09-11T00:10:29Z'
  source_kind: product
  tier: independent
  fact: "做独立开发者几个月了，看了很多同行做的网站，但是手动找的效率太低了，并且找到的网站也没流量，无法验证该方向是否能赚到钱。\r\n\r\n每天泡在找网站、找需求、找新词的过程中，逐渐意识到稳定的信息源多么重要。\r\
    \n\r\n于是开发了 https://sitehunter.org  ，主要包含几个功能：\r\n\r\n一、流量增长榜单：\r\n\t\r\n    1. 监控各个网站推广平台，全球开发者一发布作品就能及时监控到；\r\
    \n    2. 定时获取他们的流量数据，有增长的网站重点关注；\r\n    3. 尤其是域名刚注册不久就有较快增长的，马上做一个类似的，复刻他的推广路径，大概率是能和他竞争的。\r\n\r\n\
    二、外链提交目录列表：\r\n\t\r\n    1. 持续收集高质量的可提交外链的目录站；\r\n    2. 有流量 DR 做支撑，便于判断哪个目录站是真的有流量。\r\n\r\n\r\n\r\
    \n三、google trends 监控\r\n\r\n\t1. 定时抓取 checker 、viwer 、calculator 等词根相关的流量暴增的词，第一时间抓住新机会\r\n\t2. 所以词根的相关词，按流量增长排序，不再需要手动去查询每个词根\r\
    \n\r\n目前大概做了这些功能，后续会开发 api 和 mcp ，让大家的 agent 也能直接调用起来。\r\n\r\n不知道这样的网站有真实的用户吗，有需求的可以提提意见。\r\n\r\n\
    现在支持分享即可免费体验网站功能，欢迎大家体验\r\n\r\nhttps://sitehunter.org/zh/referral"
