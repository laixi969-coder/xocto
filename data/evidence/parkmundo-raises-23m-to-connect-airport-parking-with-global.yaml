  fact: Travel technology company ParkMundo has raised €2.3 million in seed funding to expand its airport
    parking marketplace and B2B distribution platform. The investment marks the company's first external
    funding after more than a decade of bootstrapped growth. The round was backed by a group of angel
    investors with experience in the technology and travel sectors, alongside additional financing from
    Rabobank. The funding follows a rebuild of ParkMundo's technology infrastructure, a rebrand and the
    development of its B2B distribution capabilities. Founded in 2013 by Jeroen van den Eerenbeemt as
    Vliegen en Parkeren, the company was joined shortly afterwards by Martijn Meeuws , now co-founder
    and CEO. Initially operating as an airport parking comparison website, ParkMundo has since expanded
    into an international travel technology platform. Before this investment, ParkMundo had been self-funded
