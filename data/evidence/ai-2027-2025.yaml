  url: http://www.geekpark.net/news/370421
  title: 特斯拉、Figure 还在攻克量产，小鹏机器人已经走下产线
  published_at: '2026-09-16T06:16:06Z'
  collected_at: '2026-09-17T00:33:01Z'
  source_kind: market_signal
  tier: independent
  fact: "9 月 8 日，一台高阶通用人形机器人小鹏 IRON 完成自动化总装，从产线上走了下来。 \n 如果只看画面，这好像是又一段科技公司放出来的机器人视频。在这个被大模型和具身智能席卷的时代，科技圈每天都在被各种炫酷的机器人\
    \ Demo 刷屏：有人形机器人打拳击，有灵巧手叠衣服，也有机器人在舞台上完成复杂动作…… \n 这次更值得关注的，并不是机器人行走本身，而是它身后那条刚启用的自动化产线。这次的机器人并不是工程师手工拼装出来的，而是像汽车一样经过一整条工业化产线，自动化总装然后下线。\
    \ \n  一、会表演不够了，能量产才算数  \n 小鹏押注机器人这件事，其实比外界想象的要早得多。早在 2020 年，小鹏就已经切入了机器人赛道，比现在市面上大多数明星机器人公司都要早。 \n\
    \ 但选择在 2026 年这个时间点启用产线，这更像是小鹏过去几年物理 AI 战略的一次集中呈现。从智能汽车到 Robotaxi、人形机器人、飞行汽车，小鹏正在推动 AI 能力从汽车场景向更多物理空间延伸。\
    \ \n 机器人和汽车在硬件形态、运动方式和应用场景上差异很大，但在 AI 层面，两者需要解决的问题类似：如何让人工智能理解真实环境，并在复杂物理空间中完成任务。 \n 汽车业务中形成的部分模型能力、数据体系和\
    \ AI 基础设施，可以进一步向机器人延伸；一套物理 AI 底层能力能否跨越不同本体，新的本体进入更多真实场景后，又会产生新的数据，推动模型持续迭代。机器人是这个战略中的一个重要落点。 \n  \
    \ \n 图片来源：小鹏集团 \n 其次，小鹏战略层面的准备也早已就位。 2026 年 6 月，何小鹏在全员信中宣布，除了继续担任小鹏集团 CEO，他还将亲自兼任机器人业务的「CEO」。这意味着小鹏集团把机器人业务提升到最高战略优先级。\
    \ \n 紧接着是 8 月小鹏机器人业务完成首轮融资，融资金额超 9 亿美元，投后估值超 63 亿美元；再紧接着就是这次的产线投产。 \n 长期投入之后，小鹏机器人的推进节奏明显加快，融资、估值与量产接连落地，一种喷薄而出的加速度正在显现。\
    \ \n 更重要的是，机器人行业的竞争主线发生了变化。过去几年，人形机器人热度很高，但更多的是各种 demo 展示，能够真正落地场景的并不多。 \n 但随着本体、芯片、模型、数据采集技术的发展，机器人行业从技术研发阶段，切换到了量产与商业化阶段。接下来比拼的会是产线、供应链、"
