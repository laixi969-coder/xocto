  fact: On Monday morning, Jensen Huang walked into Nvidia’s Santa Clara headquarters to rapturous applause
    from employees lining the walkways above him. Huang was visibly moved as one colleague threw themselves
    into his arms for a hug. The spectacular reinstatement of the chief executive of Nvidia, less than
    two weeks after he resigned in a scandal over an affair with a customer and suspected Chinese spy—as
    well as a second reported affair with a subordinate—caught even the company’s most senior executives
    by surprise. The abrupt reversal by Nvidia’s board was spurred by President Donald Trump, who applied
    pressure to the board over the weekend after watching what was once America’s most valuable company
    as well as the wider tech sector haemorrhage value last week. Read full article Comments
