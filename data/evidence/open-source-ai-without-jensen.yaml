  fact: The resignation of Nvidia CEO Jensen Huang is a major setback for the US development of an open
    model ecosystem. Nvidia still has the financial interests in supporting open models, which are to
    avoid concentration in power among a few customers who would develop their own chips and reduce Nvidia’s
    profits, but supporting the open ecosystem is a tricky puzzle more than an engineering problem to
    grind out a solution on. Nvidia’s business operations are famously extremely dependent on Jensen as
    an operator, so it is a consensus opinion that there are challenges ahead (or even more high-profile
    departures through chip-smuggling investigations or plain-old sharks circling more poachable talent).
