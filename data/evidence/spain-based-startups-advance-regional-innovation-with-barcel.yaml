  fact: The Barcelona Supercomputing Center (BSC) ’s AI Factory Accelerator Programme, now in full operation
    following a pilot initiative, gives startups access to sovereign compute, technical support and training
    to support innovation across industries. Many of these companies are also members of the NVIDIA Inception
    program for cutting-edge startups — and as of today, access to some of the BSC AI Factory services
    are available through the NVIDIA Inception portal . NVIDIA Inception complements the BSC AI Factory
    Accelerator Programme by providing members with training through NVIDIA Deep Learning Institute open
    courses, business mentoring, venture capital connections and other resources. An upcoming extension
    of MareNostrum 5 — BSC’s public infrastructure serving scientific and technological innovation, powered
    by NVIDIA accelerated computing — will deliver supercomputing access through the BSC AI Factory and
