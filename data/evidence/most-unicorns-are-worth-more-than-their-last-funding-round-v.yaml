  fact: The more than 1,900 startups on the The Crunchbase Unicorn Board have a combined valuation of
    roughly $9 trillion, based on their last reported valuations. But Crunchbase’s new Current Valuation
    Model , which estimates how private-company values have changed since their last funding rounds, puts
    that figure closer to $11 trillion. Most unicorns are estimated to have gained value, even as others
    have lost ground, our analysis shows. Among the biggest potential gainers are AI startups Thinking
    Machines Lab , whose estimated value has climbed from $12 billion to $40 billion, and Sierra , from
    nearly $16 billion to $31.5 billion. The majority of companies on the board are valued higher by the
    Current Valuations model than they were when they last raised funding. Only around 236 companies —
    roughly 12% of the board — are down by more than $100 million in value compared to their last reported
