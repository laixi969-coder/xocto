  fact: 历史，是由疯子和工程师创造的。 我们知道马斯克是个疯子，但没想到他能这么疯。 当地时间 10 月 16 日，在 SpaceX 于州 McGregor/Waco 的火箭试验场上，一段向上垂直弯过来的人造公路上，一台白色跑车以匪夷所思的状态，反重力地贴在了上面的弯上。这还不算完，在这段路上倒车加速后，这台车脱离公路，直接飞到空中，转体并通过推进器稳稳落地。
    无法形容的酷｜图片来源：Tesla 新一代的特斯拉 Roderster 跑车，就以这种情况，完成了自己的首秀。 伊隆·马斯克在开场时候告诉现场观众：「我们确定没问题，但要是不巧的话，咱们这里的安全距离可不太够。」
    当然，你知道的，一些恐惧，恰恰能激起人们更大的兴奋，老马是懂行的。 测试的 Rocket 版本使用的并非真人驾驶员｜图片来源：Tesla 除了能飞，新一代 Roderster 跑车据悉将有三个版本，Performance、Thrust
    和 Rocket 版本，其中最后的 Rocket 版本是单座，0 到 60 英里加速达到惊人的 0.59 秒。 虽然价格尚未公布，但你能猜到全世界的富豪，应该都已经开始准备支票本了。 01 特斯拉能飞
    先说结论，新一代 Roadster 能飞起来， 靠的不是螺旋桨，也不是喷气发动机，而是一套从 SpaceX「借」来的冷气推进系统，加上一个能把车「吸」在天花板上的风扇 。 发布会开场的演示，几乎就是这两套系统的「联合作战」。
    一辆 Roadster 倒挂在一段弧形坡道的顶端，四个轮子朝天，就这么「粘」在上面不掉下来。随后它倒着冲出去，在空中翻转，靠尾部喷出的气流稳住姿态，四平八稳地落地。 车稳稳落地，台上先是一句「Well,
    it worked」——嗯，成功了，紧接着又有人喊了一句更直白的，「Flying cars are real」，飞行汽车是真的。 马斯克顺势搬出了老朋友彼得·蒂尔的名言，「我们想要一辆会飞的汽车，得到的却是
    140 个字符」，然后补了一句，「现在不是了」。 能倒挂，是因为它真的会「吸」。 Roadster 底盘下装了一套风扇抽吸系统，把车底的空气往外抽，制造负压，最多能产生 2G 的吸附力。也就是说，它被「按」在地面上的力，是自身重量的两倍。所以哪怕车倒过来、停着不动，也不会掉下来。
