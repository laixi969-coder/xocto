    这家谷歌母公司公布，第三季度不含合作伙伴分成的营收为 1112 亿美元，低于分析师预测。搜索及其他渠道的广告营收也不及预期，增速为五个季度来最慢。这项业务约占公司总营收的一半，也是为巨额 AI 投资提供资金的关键来源。
    摩根大通分析师 Doug Anmuth 等人在研报中表示，业绩和股价反应显示，对于投入数千亿美元建设 AI 基础设施的超大规模云服务商而言，一旦核心业务业绩令人失望，容错空间有多小。 截至纽约时间上午
    9：35，Alphabet 股价下跌 13%，至 281.37 美元，市值蒸发 5110 亿美元。这跟竞争对手微软的表现形成鲜明反差。微软云业务增速超出华尔街预期，同时控制支出，推动股价上涨。 谷歌首席商务官
    Philipp Schindler 周三晚间在财报电话会议上表示，谷歌搜索中新推出的 AI Mode 标签页日益普及，对公司业绩造成了拖累。他表示，AI 查询的「变现能力较低」，不过公司对此仍持乐观态度，并计划在搜索引擎的这一板块投放更多广告。
    多年来，谷歌高管一直认为，AI 聊天机器人和相关功能不会大幅侵蚀其搜索业务。但随着消费者转向 ChatGPT、Claude 以及谷歌自身的 AI 功能，投资者担心这会冲击公司的核心盈利来源。 第三季度谷歌服务业务总营收
