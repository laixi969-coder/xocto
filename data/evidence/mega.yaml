  fact: 'In Q3 2026, the European tech market continued to gain momentum, with total funding reaching
    €27.8 billion across 732 deals. Investment value increased by 32.4 per cent from €21 billion in Q3
    2025 and was more than two and a half times the €11 billion recorded in Q3 2024, highlighting a strong
    rise in capital deployed over the past two years. Looking at the monthly distribution, Q3 2026 was
    defined less by consistent growth throughout the quarter and more by a sharp concentration of investment
    in September. While the overall pattern of a strong July, weaker August and subsequent recovery was
    also visible in the previous two years, the scale of the September increase sets 2026 apart. Biggest
