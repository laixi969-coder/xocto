  fact: "SF October 14th: A Birds of a Feather Session on Agentic Engineering   \nI'm hosting an evening\
    \ event with Jesse Vincent in San Francisco on Wednesday 14th October for people who are building\
    \ weird and interesting things with and on top of coding agents. \n Think of it as an agentic show-and-tell:\
    \ \n \n ​Compare notes with other builders and experimenters on things you’re trying, what you're\
    \ learning, and what you haven’t figured out yet. We’re especially interested in work you haven’t\
    \ discussed publicly, odd experiments, or unfinished projects that don’t have an obvious market. \n\
    \ ​Expect one flowing conversation with an informal show-and-tell. Sharing something you’re working\
    \ on is encouraged but no presentation is required. \n \n This isn't about product pitches, it's about\
    \ much earlier explorations than that. This agentic AI stuff is weird! Let's celebrate and lean into\
    \ that weirdness.\n\n\n     Tags:  events ,  ai ,  generative-ai ,  llms ,  coding-agents ,  jesse-vincent\
