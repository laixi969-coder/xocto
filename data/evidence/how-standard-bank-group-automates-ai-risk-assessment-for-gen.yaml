  fact: This post is co-written with Tala Qraitem from AWS and Jörg Fischer from Standard Bank Group Having
    an AI policy is one thing. Proving, one use case at a time, that AI systems follow it is another.
    Every new generative AI application adds one more system to prove. Teams can now build one in days,
    but each still needs a risk committee’s approval before it reaches customers or employees. When that
    approval depends on reviewers reading documents and testing the system by hand, governance becomes
    the slowest step in the pipeline. Standard Bank Group chose to automate that proof. Working with AWS
    Professional Services, the bank deployed an automated assessment that scores each generative AI use
    case against international AI standards and its own policies. The assessment produces reports and
    a dashboard that show what is already in place, what is working well, and what still needs mitigation.
