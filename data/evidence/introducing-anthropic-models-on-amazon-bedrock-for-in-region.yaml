  title: Introducing Anthropic models on Amazon Bedrock for in-region inference in Seoul and Singapore
  published_at: '2026-09-30T01:13:12Z'
  collected_at: '2026-09-30T01:18:43Z'
  source_kind: market_signal
  tier: first_party
  fact: Amazon Bedrock now supports Anthropic's Claude Opus 5 and Claude Sonnet 5 with in-region inference
    in Seoul, and Claude Sonnet 5 in Singapore. If you have local data processing requirements in South
    Korea or Singapore, you can now use these Anthropic models at scale, with inference processed entirely
    within the Region you call.
