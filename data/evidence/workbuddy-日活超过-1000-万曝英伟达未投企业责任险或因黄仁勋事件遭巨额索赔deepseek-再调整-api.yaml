  fact: 黄仁勋辞职风波升级：英伟达遭两起证券欺诈诉讼，公司自身却未投保企业责任险 11 月 18 日消息，据路透社报道，英伟达为公司高管和董事购买了责任保险，最高赔付额度达 9.5 亿美元，但公司自身没有购买通常用于覆盖证券诉讼辩护费用、和解金与判决赔偿的企业责任保险。
    这意味着，如果围绕黄仁勋突然辞去 CEO 职务引发的诉讼最终胜诉，涉及股价暴跌的赔偿需要由公司自行承担。英伟达目前持有超过 500 亿美元现金储备。自 11 月 8 日黄仁勋承认对妻子不忠以来，针对英伟达及相关人员的诉讼至少已有两起，其中包括一名个人股东在旧金山联邦法院提起的拟议集体诉讼，指控公司及黄仁勋涉嫌证券欺诈、误导投资者。
    该集体诉讼涉及的索赔期间，英伟达股价累计下跌 20%，对应市值损失约 1 万亿美元。保险业内人士认为，英伟达资产负债表规模超过许多保险公司，因此判断市场上可购买的风险转移方案价值不足。黄仁勋本周二表示，对给董事会带来的麻烦深感遗憾，若有机会重返公司将深感荣幸，但董事会并未考虑让他回归。（来源：IT
