  fact: 本文首发于 Founder Park 公众号 · 2023 年 1 月 6 日   人工智能正成为新的生产力，而制约人工智能发展的大数据如何更安全地利用的问题，也成为当下大众关注的热点。如何在满足监管合规的条件下进行数据共享？如何在数据共享和融合的过程中保证隐私不会泄露？    有需求，也有了相关的隐私法规，就有了「隐私计算」的解决方案。    在锘崴科技创始人
    & 董事长王爽看来， 「数据可用不可见」是隐私计算的本质价值之一。 可用是目的，不可见是安全要求。而围绕「可用不可见」，隐私计算的技术也是发生了多次迭代，到如今才开始在金融、医疗、政务等领域大规模应用。    虽然各国早就出台了隐私相关的法规，比如欧盟的
    GDPR 和国内的《数据安全法》，但是为什么直到今天，隐私计算才成为了大众关注的热点，王爽认为，技术的发展是一部分，而新出现的人工智能对于大数据的需求也推动了隐私计算的发展。    也正因此， 隐私计算处于高速发展的初期阶段，未来会经历数据网络的搭建、开放应用生态的构建，以及数据运营分润等阶段。
    王爽说道，未来的商业模式也有更多可能性，甚至可能会与 Web3、区块链结合，面向 ToC 也有了新的可能性。甚至在某一天， 个人数据的所有权是掌握在个人手里的，应该由个人来控制数据的使用，并且个人数据被使用以后的价值也应该反馈给个人。     而关于大厂进军隐私计算行业带来的影响、以及隐私计算的技术壁垒问题，王爽也有很多想法。                         「数据可用不可见」是隐私计算的本质价值之一。    当前隐私计算处于高速发展的初期阶段，未来会经历数据网络的搭建、开放应用生态的构建，以及数据运营分润等阶段。    中国目前的年产生数据量在全球排名第二，也是全球第二大数字经济实体，通过国内这些促进数据经济发展的政策，我们拥有很多在数据层面上超越国外的机会。    我们认为
    ToC 是未来的一个趋势，因为个人数据的所有权是掌握在个人手里的，应该由个人来控制数据的使用，并且个人数据被使用以后的价值也应该反馈给个人。    隐私计算商业化主要是三种模式，分别是：建设、开放应用和数据流量的分成费用。短期内建设比较多，从中长期来看，更多的是开放的应用和数据的分润。                    01           隐私计算行业正处于
