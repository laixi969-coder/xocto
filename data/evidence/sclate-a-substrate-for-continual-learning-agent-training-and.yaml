  fact: Continual-learning agents are systems of models, harnesses, and memory operating over long multi-session
    horizons. Evaluating and training them requires interleaving tasks with agent-side events such as
    session stop and start, crons, and memory consolidation. Yet existing benchmarks and training frameworks
    schedule only the benchmark’s own events, leaving each benchmark and agent pair to build a custom
    scheduling loop. We present SCLATE, an execution substrate where benchmarks and unmodified agents
    each add their events to one open event scheduler through an adapter. A hybrid simulated clock…
