  fact: 'A few months ago, I was sitting lakeside with a neighbor. He is the head of AI for a pharmaceutical
    company, and he mentioned the truly incredible productivity his senior team is receiving from AI.
    Then he paused and turned to me and said: “You know, I may never hire another junior engineer again.
    Which is great for the business right now, but who’s the next generation that is going to run this
    when we retire?” The concern over what will happen to young people just entering the workforce is
    one many of us are grappling with right now, and it has a human dimension. Not just what happens to
    employment rates, but what happens to my students or my children? College graduates typically do the
    individual contributor knowledge work that AI is evermore capable of delivering. To cite one statistic
    , a recent Stanford study found employment of 22 to 25 year olds in occupations most exposed to AI
