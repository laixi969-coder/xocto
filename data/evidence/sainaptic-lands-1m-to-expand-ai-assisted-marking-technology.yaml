  fact: UK-based edtech startup Sainaptic has raised £1 million in fresh funding to expand its AI-assisted
    assessment marking technology. The round was co-led by Cornerstone VC and Ufi Ventures , with participation
    from Elm Venture Partners and Brighteye Ventures . The funding announcement comes alongside a new
    partnership with assessment management software provider Skilltech Solutions, which will make Sainaptic's
    technology available to some of the UK's largest apprenticeship assessment organisations. Founded
    by Cambridge-trained educators and data scientists Kavitha Ravindran and Rajeshwari Iyer , Sainaptic
    develops AI-powered tools to help exam boards and training providers assess vocational and professional
    qualifications. These qualifications often involve short answers, essays, reports, presentations and
    professional discussions rather than multiple-choice questions. Assessing this work requires trained
