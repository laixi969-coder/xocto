  fact: Verso , an AI-powered consumer intelligence platform, has raised $6 million in seed funding. The
    round was led by Angular Ventures , with participation from 100in, Kima Ventures, Olympe Capital,
    Sharpstone Capital and a group of business angels. The company is also backed by startup studio Hexa.
    Large companies invest heavily in consumer research to inform product development and marketing decisions,
    but the process can be expensive and time-consuming. Research findings can also remain concentrated
    within insights teams, limiting their use across other parts of an organisation. Verso was co-founded
