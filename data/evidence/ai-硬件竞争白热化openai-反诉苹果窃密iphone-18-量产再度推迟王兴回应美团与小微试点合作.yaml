  fact: OpenAI 转守为攻：反诉苹果窃密，喊话「不公平竞争」 当地时间周五（27 日），OpenAI 在美国加利福尼亚州圣何塞联邦法院对苹果提起反诉，指控苹果窃取其商业机密，并阻挠其与硬件供应商合作。
    今年 7 月，苹果曾以窃取商业机密为由起诉 OpenAI。随着 OpenAI 反诉，这场官司从苹果一方起诉变成了双方互诉。 据报道，OpenAI 正准备推出一系列新的个人设备，并称这些设备有望「在苹果视为自家地盘的领域胜过苹果」。
    据报道，OpenAI 在诉状中称，苹果这样做是为了「不择手段地进行不公平竞争」。OpenAI 还指控苹果利用自身的「规模和财力来阻碍竞争」，存在「各种违法、不公平和侵权行为」。 有分析指出，这场诉讼关系到未来
    AI 设备由谁主导。这类设备可能不再依赖传统的应用程序或操作系统，一旦成功，可能分走消费者对苹果最畅销产品 iPhone 的关注。分析人士称，OpenAI 正在开发手机或其他自有设备。两家科技巨头均未立即回应媒体的置评请求。（来源：第一财经）
    iPhone 18 量产再度推迟，苹果新机上市前备货时间承压 苹果即将推出的 iPhone 18 和 iPhone 18e 两款机型再次遭遇生产延迟。来自微博的爆料者「定焦数码」称，这两款机型目前均尚未进入大规模量产阶段，量产启动时间已从此前预计的
    10 月下旬推迟到 2027 年元旦前后。 今年 10 月，同一消息源曾表示，标准版 iPhone 18 的生产目标定在 11 月下旬，并称苹果正准备建立较大的库存。而最新说法提到的 1 月时间点，比此前报道的两个目标都更晚。
    在配置方面，外界预计两款机型都将搭载 A20 芯片，运行内存则可能从 8GB 提升至 9GB，并采用苹果自研的 C2 调制解调器。此外，两款新机还传出将配备更大容量电池，iPhone 18e 则可能迎来前置摄像头升级。
    彭博社记者马克·古尔曼此前指出，这两款设备预计将在明年 2 月或 3 月发布。如果这一时间表保持不变，那么 1 月才开始量产将让苹果积累库存的时间比往年更紧张。（来源：cnBeta） 马斯克 SpaceX
