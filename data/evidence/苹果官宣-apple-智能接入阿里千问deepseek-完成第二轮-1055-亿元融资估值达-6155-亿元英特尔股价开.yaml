  fact: 国行 Apple 智能确定上线时间：11 月开放测试，千问接入 Siri 10 月 31 日，苹果宣布，国行 Apple 智能首批功能将于 11 月 4 日随 iOS 开发者 Beta 版开放测试，12
    月随 iOS 27.3 正式面向用户推出。首批功能包括实时翻译、写作工具、照片消除、智绘表情和通知摘要等，支持 iPhone 15 Pro 系列、iPhone 16 及后续机型，以及 iPhone
    Air、iPhone Duo。 阿里巴巴强调，在任何问题、文档和图片发送给千问之前，都会先征得用户同意。 苹果表示，这些功能由其自有模型驱动；用户也可以选择接入阿里巴巴千问，在 Siri、写作工具和视觉智能中处理部分请求。不过，首批更新不包含新版
    Siri AI，iPad、Mac 等其他平台还需等待必要审批。（来源：极客公园） OpenAI 撤回 Pro 200 降额计划，同时提高 Work 和 Codex 用量 当地时间 10 月 29
    日，OpenAI 宣布调整 Pro 和 Business Premium 订阅中的 Work、Codex 使用额度。Pro 100 和 Pro 500 的原有额度翻倍；此前额度较低的 Pro 200
    用户也获得翻倍提升，与原本享有较高额度的 Pro 200 用户持平。新额度立即生效，现有订阅用户无需等到续费。 这也意味着，OpenAI 撤回了 9 月底通知中的 Pro 200 降额计划，原本享有较高额度的用户可以继续保留。需要注意的是，额度翻倍不保证可完成的任务数也翻倍：实际消耗取决于模型、任务和速度模式，Fast
    模式消耗额度的速度约为标准模式的 2.5 倍，Ultrafast 则为 8 倍。（来源：ITBears） 英特尔股价开盘跌超 30%，或将创下有记录以来最大单日跌幅 10 月 30 日开盘后，英特尔股价大幅下挫，盘中跌幅一度超过
    30%，公司市值蒸发超过 1,370 亿美元（现汇率约合 9,147.3 亿元人民币），超过 2024 年最大单日跌幅（约 26%），如果能达到 31% 将超越 1974 年 7 月 5 日创下的终极历史纪录。
