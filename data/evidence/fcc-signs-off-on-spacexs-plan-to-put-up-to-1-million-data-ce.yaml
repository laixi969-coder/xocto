  fact: In an announcement on Wednesday , the FCC says it authorized SpaceX to deploy up to 1 million
    AI chip-equipped satellites as part of the Elon Musk-owned company's "Starmind" initiative . With
    several others also pursuing the idea of putting AI data centers in space , including Google and Blue
    Origin, this is the first approval the agency has granted for a full "constellation" of AI satellites.
