  fact: Stockholm-based startup Wilgot , which develops technology to help brands improve their product
    visibility in AI assistants, has raised $3 million in a seed funding round led by Industrifonden .
    The round also included participation from Luminar Ventures, Foundry Ventures, Ventures Together and
    Inovexus, alongside angel investors Johan Bäckarlin and Johan Hjelte, founders of Voyado, and Niclas
    Mollin, founder of inriver and Occtoo. Founded in 2024 by Erik Wikander (CEO), Dr Mhairi Dunion (AI
    Scientist) and Oleg Danylenko (CTO), Wilgot helps brands adapt their product information to changing
    consumer shopping behaviour. Consumers are increasingly using AI assistants such as ChatGPT, Google
    Gemini and Perplexity to discover products and receive shopping recommendations. Rather than searching
