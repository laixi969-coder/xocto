  fact: 头图来源：豆包工作官网 豆包工作也模型自由了。 11 月 12 日，豆包工作宣布接入 Kimi K3.1 Pro、GLM 5.3、DeepSeek V4.1 Flash 等多款第三方模型，支持用户按需选型完成任务。同步在模型选择页面标注各模型额度消耗倍率，倍率越低消耗越少，便于用户结合任务需求与使用成本做决策。
    同时平台推出两项限时优惠：一是工作日及节假日的指定时段内，使用活动模型可享受额度消耗折扣；二是豆包 2.1 Lite、DeepSeek V4.1 Flash 两款模型限时下调额度消耗倍率，同等任务消耗额度更少。
    一、补全多模型，解决「有的选」 本轮更新中，豆包工作一次性接入 Kimi 3.1 Pro、GLM 5.3、DeepSeek V4.1 Flash 三款第三方模型，进一步补齐了模型能力矩阵。 具体来看，三款模型各有侧重，可以分别对应企业不同层级的工作场景：Kimi
    3.1 Pro 主打百万字级超长上下文处理能力；GLM 5.3 侧重中文语言理解与生成；DeepSeek V4.1 Flash 以高响应速度和高性价比为核心，定位轻量日常任务。 加上此前已经开放的第三方模型，以及字节跳动自研的豆包
    2.1、豆包 2.1 Lite 等主力模型，豆包工作已经具备了覆盖「高端能力型、均衡通用型、轻量效率型」三个层级的模型矩阵。 不同能力、不同定价的模型相互补充，基本可以覆盖企业从核心复杂任务到日常基础工作的多场景
    AI 需求。 事实上，豆包工作此前就已向企业客户开放第三方模型能力。本轮扩容并非单纯的数量叠加，而是基于企业真实工作流的场景化补全。 图片来源：豆包工作官网 此外，我们也注意到，豆包工作本次同步更新了
    LOGO，大家熟悉的豆包形象就此「持证上岗」，进入了专业办公场景。 二、额度倍率透明化，把成本决策权交还给用户 如果说模型扩容是解决「有没有得选」的问题，那么额度消耗倍率的透明化标注，则是解决「选得明不明白」的问题。
    在当前的企业级 AI 市场，成本不透明是很多企业的普遍困扰。不同模型的计费规则各不相同，有的按输入输出 token 计费，有的按调用次数收费，不同单位之间换算复杂，普通用户很难快速判断一款模型的实际使用成本。
    很多团队在使用过程中，往往难以预估单任务开销，直到账单出来才发现超出预算，也很难追溯成本的具体构成。 针对这一问题，豆包工作在模型选择
