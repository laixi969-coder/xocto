  fact: 头图图片来源：iFixit 2011 年 9 月 30 日，苹果递交了一份名为「Flexible electronic devices」的专利申请。 它描述的是一台屏幕可以对折的设备，合起来能揣进口袋，靠传感器判断自己是开着还是合着。
    这份专利 2015 年 1 月获得授权，发明人一共六位，其中一位叫特努斯（John Ternus）。 苹果 2011 年递交的折叠设备专利附图｜图片来源：Apple 十五年后，2026 年 9 月
    9 日，当年署名的这位工程师，第一次以苹果 CEO 的身份走上发布会舞台，发布的正是一台可以对折的 iPhone：iPhone Duo。 巧的是，十二年前的同一天，2014 年 9 月 9 日，库克也在后台等着上台。
    那是他接任 CEO 三年后，第一次发布全新品类的产品 Apple Watch，同场还有大屏的 iPhone 6。 据彭博商业周刊当时的报道， 开场前，库克戴着耳机，用 iPhone 听 OneRepublic
    的《I Lived》给自己打气。 新 CEO 的第一款重磅产品，从来都是一场大考。 只是特努斯的这场考试，没有在发布会那天结束。 10 月 23 日，iPhone Duo 开售。 当天就有澳洲用户在
    Reddit 上发出内屏开裂的照片，之后几天，美国、中国大陆、日本、韩国陆续有人晒图，描述几乎一样：到手开合不到二十次，展开时铰链处有一点阻力，「咔嚓」一声，内屏沿着折痕中线裂开几厘米，旁边亮起一条白线。
    裂开的地方，正是十五年前那份专利里要折起来的那一道。 真正出问题的机器并不多。 9to5Mac 统计到的独立案例大约 10 起，社交平台上还混着不少 AI 生成的假图 。 10 月 26 日，苹果通过媒体发了一份声明，承认「少量
    iPhone Duo 的内屏出现问题」，用户可以联系 AppleCare 换新，不需要另外购买 AppleCare+。 但这些裂缝几乎都出现在同一个位置，说明它们大概率出自同一个原因，而不是用户各自摔出来的。
    Reddit 用户 leftyhyzer16 发布的故障内屏，竖线沿着折痕，横向亮线从交汇处向外延伸｜图片来源：Reddit @leftyhyzer16 硬件上的难题，大多能靠钱和时间解决。苹果两样都不缺，它在折叠屏上花的时间，比几乎所有厂商都长。
    只是「时间」有两种：一种是实验室里的研发时
