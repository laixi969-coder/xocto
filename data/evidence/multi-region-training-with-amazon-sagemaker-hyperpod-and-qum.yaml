  fact: Amazon SageMaker HyperPod and Cloud Native Qumulo let you place training compute in one AWS Region
    while keeping your dataset in another. This post shares the architecture and validation results from
    a cross-Region training run, where a remote cluster matched a co-located cluster's throughput after
    a brief NeuralCache warmup.
