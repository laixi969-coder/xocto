  fact: "My comment  on  EmbeddingGemma 2  — Hacker News.  I really appreciate that  EmbeddingGemma 2\
    \  is under the Apache 2.0 license. \n For embedding models in particular, I don't think it makes\
    \ sense to use a closed, proprietary, hosted-only model. \n Most applications of embedding models\
    \ involve calculating thousands or even millions of embedding vectors and storing them for later comparison.\
    \ \n If your model is proprietary, the vendor is likely someday going to decide to stop offering that\
    \ model. They'll have a better model to replace it, but you still need to pay to re-calculate those\
    \ millions of stored existing vectors. \n (In April 2024 OpenAI offered to \"cover the financial cost\
    \ of users re-embedding content with these new models\" -  https://openai.com/index/gpt-4-api-general-availability/\
    \  - but I don't think that's something we can rely on from every provider.) \n Notably, I  don't\
