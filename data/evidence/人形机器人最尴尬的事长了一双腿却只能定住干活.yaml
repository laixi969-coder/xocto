  fact: 作者｜Li Yuan 编辑｜ 郑玄 长得像人，但是只能跳舞表演，根本没法真正干活。 这大概是过去几年人形机器人最尴尬的一幕。 人形机器人最初拿到天量关注，底层逻辑其实很直接：现实世界本来就是围绕人类身体设计的。楼梯、橱柜、货架、工位甚至门把手，全都有现成尺寸。理论上，机器人完全可以用下肢越过障碍，直接用上肢拿起工具工作。
    逻辑听起来无懈可击，但行业演进了几年，我们看到的却往往是另一副模样。 视频里的人形机器人，主要是在跑跑跳跳、翻跟头；哪怕真有一些干活的演示，也大多老老实实待在平地上——走到某处，定在原地，再小心翼翼地伸手。
    如果双腿只负责把机器人送到任务面前，真正动手时它必须先站稳锁定身体，那它们不过是一对成本极高、极其脆弱的机械轮子。那么人形机器人的优势在哪？ 这也很难怪大家苛刻。迈不过这道坎，人形机器人就永远撕不掉「表演道具」的标签。
    不过，这一点在近期已经逐渐看到解法。 近期，源策未来发布新模型和演示，以「全身智能」（Whole-Body Intelligence，WBI）为核心技术路线，自采人类全身交互数据，研发能够适配不同本体的人形基础模型系统。
    在源策公布的演示中，机器人面对倒在地上的自行车，能够俯身弓腰，全身发力将它扶起；面对电饭煲的启动键，又能完成精细按压。 最能体现人形优势的，是一段搬踏台登高的画面：够不着高处的物品，它自己搬来一张踏台放下，随后踏上平台，抓取目标。这一串动作，把搬运、支撑转换和高位操作连在了一起。
    当双腿参与操作，当双手与身体的平衡相互配合，人形这副身体的价值才开始显现：机器人有机会利用为人设计的空间，完成原本由人承担的工作。 01 会走会跳，为什么偏偏不能干活？ 在很多人的直觉里，既然机器人能做出跑跳甚至后空翻这种高难度动作，顺手倒个垃圾、擦个桌子，理应更简单。
    这背后最直接的死结，是双足机器人底层的控制系统一直面临两难： 要稳定，手就得跟着晃；要手准，整个人就容易摔。 过去一年，行业里最主流的做法，其实普遍站在英伟达开源的全身控制基准「SONIC」之上。它已经展示了全身动作跟踪、遥操作，以及接入
    VLA 的自主操作能力。这套方案代表了此前学术界和工业界的天花板，但进一步走向实际操作，还需要同时兼顾关键末端的跟踪精度、身体稳定性与可稳定触达的范围。 其中一个关键问题，是末端跟踪精度。 在源策的对比测试中，当机器人通过俯身、前伸
