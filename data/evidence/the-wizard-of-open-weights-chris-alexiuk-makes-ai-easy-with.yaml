    models (LLMs) practical for working developers. Alexiuk’s preferred “rooftop” is YouTube , where he’s
    built a following teaching curious thousands how to build, fine-tune, evaluate and ship production
    LLM applications and agents. “I think the people who will most help us understand how to build and
