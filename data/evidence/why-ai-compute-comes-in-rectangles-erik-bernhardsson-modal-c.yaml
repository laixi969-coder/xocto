  fact: 'Warm welcome to Basil Chatha , our newest cohost from the Forward Deployed side of the AI Engineering
    world! We’ll be ramping up a new show with him and couldn’t pass up an interview with Modal’s CEO
    Eric on the occasion of their monster Series D! Two years ago, we spoke with Erik Bernhardsson about
    his vision for truly serverless AI infrastructure: developers should be able to run code without provisioning
    clusters, predicting load, or paying for idle resources. CTO Akshat then joined us to talk about Modal’s
    infra primitives and stack to offer those primitives and agent experience. A lot has changed in the
    past 5 months. Since their $5B series C, Modal now reports it crossed $1 billion in annualized run
    rate , raised a $750 million Series D at a $16B valuation , and has spun up nearly three billion sandboxes.
    In this conversation, Erik joins Vibhu to explain the infrastructure and economics behind that growth—and
    why demand for compute rarely looks like the contracts used to buy it.'
