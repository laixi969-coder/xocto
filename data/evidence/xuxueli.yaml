  url: https://www.v2ex.com/t/1247214
  title: XXL-AI v1.1.1 发布｜ Desk 桌面客户端正式上线，云本结合再进一步
  published_at: '2026-10-08T16:38:57Z'
  collected_at: '2026-10-09T02:10:12Z'
  source_kind: product
  tier: independent
  fact: "### Release Notes\r\n\r\n**[云版（ Web 服务端）]**\r\n\r\n*   1 、 [优化] 项目合并部署：研发环节前后端分离，部署期前端产物内嵌进后端\
    \ Jar ，单进程单端口对外；\r\n*   2 、 [新增]  I18N 模块重构：前后端国际化逻辑优化，统一后端控制；标准化国际化资源文件结构，支持多语言配置，并优化前端国际化加载逻辑；\r\
    \n*   3 、 [优化] 模型 API 请求通参调整，设置 User-Agent: XXL-AI 便于供应商识别；\r\n*   4 、 [优化] 供应商模型请求参数属性优化，支持格式检测与合法性检测；\r\
    \n*   5 、 [升级] 项目依赖升级最新版本；\r\n\r\n**[本地版（ Desk 桌面端）]**\r\n\r\n> 本地版（ Desk 桌面端）以·与云版零依赖、独立构建发布；详细安装与操作见官方文档。\r\
    \n\r\n*   1 、 [重点]  Desk/客户端上线：基于 Electron + Vue3 + TypeScript 构建跨平台桌面客户端，支持 mac / win / linux 一键安装及应用，本地优先、开箱即用；\r\
    \n*   2 、 [新增] 多供应商模型接入：兼容 OpenAI 协议，供应商 + 模型本地配置；首次启动自动预置 OpenCodeGo / Ollama / Deepseek / 智谱 GLM\
    \ ；\r\n*   3 、 [架构]  Agent 运行时进程隔离：Pi （`pi-ai` + `pi-agent-core`）运行于独立 `utilityProcess`，主进程仅做 IPC\
    \ 网关与越界审批，长会话与工具重活不阻塞 UI ；\r\n*   4 、 [新增]  Plan / Build 模式：Plan 只读（仅只读文件与检索工具）、Build 全量读写，随会话持久化，默认\
    \ Build ；文件操作限定当前项目目录，越界弹原生对话框「允许本次 / 本会话允许 / 拒绝」；\r\n*   5 、 [新增] 流式对话与执行过程可视化：流式输出思考过程 / 工具调用 /\
    \ 回复内容；助手消息按片段发生顺序渲染时间线（思考 → 工具 → 正文交错），思考折叠、工具调用状态与耗时展示、Markdown 实时渲染与代码高亮；\r\n*   6 、 [新增] 项目与会话管理：项目绑定本地磁盘目录，会话归属项目，支持搜索\
    \ / 重命名 /"
