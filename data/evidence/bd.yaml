  fact: "周日（昨天）[本地优先会议](\r\nhttps://www.v2ex.com/t/1242674),举行了第一场活动“CRDTs Are Not Enough: 从 CRDT 到本地优先同步引擎“。\r\
    \n\r\n活动的形式是线上（能力有限）。\r\n模式是社区开源沙龙，即自由发起活动，社区做支持。\r\n工具是 bd.ailishi.ai 。\r\n\r\n活动逐字稿第一时间发布在： https://bd.ailishi.ai/blog/\r\
    \n\r\n欧洲的本地优先大会已经是第三届，许多内容很有趣，这得益于他们历史与生态。\r\n[欧洲的 Hacker 文化原本就健壮]( https://www.ccc.de/)，较成熟的技术知识流动体系。结合技术，讨论工程、哲学等诸多问题，让新人逐渐发掘工程的乐趣与意义。这对一个新兴技术栈来说更友好。\r\
    \n\r\n本会议发起的灵感来自于欧洲的会议。邀请了一些该大会的分享者。但不认识他们的组织者（如果有人能帮忙认识，非常感谢）。\r\n\r\n本地优先是一个新技术栈，但建立在一堆老理论上。本地优先是分布式系统的分支，并且更像是分布式系统领域成熟后的副产品。这一副产品，被越来越多人尝试与喜欢，离不开今天的现实——越来越多人质疑云的害处大于益处。\r\
    \n\r\n而它的新则体现在，社区中有关其想象、定义、协议，能有大量多样的辩论，各执一词，谁也无法说服谁。这反倒让人兴奋，这意味其中的讨论交流、尝试犯错，本身也在定义与发展本地优先相关的技术。\r\
    \n\r\n进微信群，微信在这里 Firstfediverse\r\n\r\n :) \r\n\r\n# 前沿\r\n\r\n这是第一届本地优先会议。现在活动标题都取的太正式，但目的是为抛砖引玉。不只是日历上的活动，在场的大家一定都有自己擅长的与热爱的领域，值得分享给大家。本地优先领域，如果去看学界论文或者一些工程实践，这几年它的演进速度非常快，并且\
    \ agent 加速了这些东西，以后应该还会继续加速。所以，有没有可能出现一种新的计算栈，土计算？我不知道，最近看群聊，大家的想象都很不一样。\r\n\r\n今天分享者 Loro 的陈子轩，在华人里可能是最有发言权的团队之一。也许都不止华人，我觉得是世界。他们团队对工程、各种设计的细节都很棒。如果有本地优先或者\
