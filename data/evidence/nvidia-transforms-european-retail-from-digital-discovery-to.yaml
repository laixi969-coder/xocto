  fact: European retailers are using open models and physical intelligence across use cases — from a commerce
    platform cutting inference costs by 90% to to a fulfillment center where collaboration of different
    robotic fleets is simulated inside a digital twin. Frontier Results With Open Models Retail leaders
    and technology companies across Europe are using NVIDIA-accelerated open and frontier models to advance
    agentic commerce, digital product discovery and retail R&D. Shopify post-trains open models to reach
    frontier-level accuracy at a fraction of the cost. Its engineers use the NVIDIA Megatron Bridge library
    for faster fine-tuning and NVIDIA NeMo RL for reinforcement learning. Shopify has post-trained NVIDIA
    Nemotron 3.5 Lightning for the GraphQL subagent integrated into Sidekick, Shopify’s AI assistant for
    merchants. The subagent retrieves store data for several Sidekick features, including Sidekick Pulse,
    which researches a merchant’s store and recommends ways to improve it. Read All NVID
