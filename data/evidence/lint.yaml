    Lint 工具的眼光非常挑剔，主要盯着以下几个方面： 少写了一个逗号、括号没有闭合、关键字拼错——这些手误靠肉眼很难发现，但 Lint 能在你保存文件的瞬间就标出红线。 return `Hello,
    ${name}`;
