  fact: 黄仁勋重返英伟达 黄仁勋在美国当地时间 11 月 23 日重返英伟达总部，现场员工聚集在大厅高声欢呼，迎接这位创办人回归。黄仁勋在现场表示：「感谢大家给我第二次机会，接下来我一定会成为更优秀的
    CEO」。 「我很荣幸能重返英伟达，并在新一轮工业革命伊始领导这家全球最具影响力的科技公司之一，」黄仁勋表示。 「我将以最大的谦逊和焕然一新的承诺肩负起这一重任。我要感谢英伟达董事会在此过程中给予的信任与审慎考量。我尤其感谢哈维
    · 琼斯（Harvey Jones）作为董事长所展现的领导力，也感谢科莱特 · 克雷斯（Colette Kress）以及我们的高管团队在此期间对英伟达的领导。同时，我深切感谢我们的员工、股东、业界领袖以及全球合作伙伴给予的非凡支持。最重要的是，我感谢家人的关爱与支持。我迫不及待地想要重返工作岗位。」
    黄仁勋辞职后，支持者发起「Stand with Jensen」请愿，最终累计超过 20 万人联署，其中包括现任与前任员工、股东及马斯克等科技界人士。 英伟达董事会宣布，经与黄仁勋多次讨论后，认为恢复其职务符合公司最佳利益，因此一致通过其重新担任总裁、执行长与董事。
    英伟达最新市值约为 3.978 万亿美元，对应股价 165.05 美元，较前一收盘价上涨 31.48%。（来源：网易科技） 马斯克承认 AI 研发落后对手：出租 SpaceXSI 算力比自研 Grok
    更赚钱 据《纽约时报》当地时间 11 月 23 日报道，SpaceX 首席执行官埃隆・马斯克近日向员工表示，公司在人工智能（AI）研发方面正落后于 Anthropic、OpenAI 等竞争对手，因此，与其将数据中心算力全部用于自研
    AI 产品，不如出租给竞争对手，以获得更高的商业回报。 三名知情人士称，SpaceX 自 5 月以来一直向 Anthropic、谷歌等企业出租数据中心算力，相关业务每月可带来数十亿美元收入。与此同时，SpaceX
    也在开发 Grok 聊天机器人、Grok Bot 等自有 AI 产品，但马斯克认为，公司目前在 AI 模型研发方面尚未达到竞争对手的水平。 马斯克对此感到不满。他曾在一个拥有数百名 SpaceX
