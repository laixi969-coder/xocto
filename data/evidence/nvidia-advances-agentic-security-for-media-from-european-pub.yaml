  fact: 'At a creative industry event that took place today in Berlin — hosted in collaboration with Adobe
    , Bertelsmann , NVIDIA and UFA — the latest advancements in intelligent media were on display. Key
    to the news: the European Broadcasting Union (EBU) is collaborating with NVIDIA to expand its sovereign
    framework with cloud, open models and integration partners, while Adobe Frame.io is accelerating video
    agent search capabilities with NVIDIA GPUs, helping German TV and film producer UFA find the right
    moments faster. Read more about both announcements below. Sovereign Clouds and Open Models Built for
    European Broadcasters The EBU and NVIDIA are expanding the sovereign standards they introduced last
    year for European public service media. The initiative now brings in sovereign cloud providers, open
    model developers and systems integrators to define how broadcasters can deploy agents while keeping
    control of their data, infrastructure, models and security. Read All NVIDIA in Europe Announcem'
