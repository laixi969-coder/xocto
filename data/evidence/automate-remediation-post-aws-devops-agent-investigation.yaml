  fact: AWS DevOps Agent can diagnose production incidents but is kept in observe-and-report mode so it
    does not change resources directly. This post shows how to use AWS Lambda Durable Functions, Amazon
    EventBridge, and Amazon Bedrock to turn its investigation summaries into pre-validated fixes an on-call
    engineer can approve with a single action.
