  fact: 'More than 35 European tech founders and business leaders issued a joint declaration at Slush
    2026, calling for three fundamental shifts in European technology policy to strengthen the continent''s
    global competitiveness. Representing more than €100 billion in company value and 115,000 jobs, the
    signatories pledged their long-term commitment to building and scaling technology companies in Europe.
    “We share one conviction: Europe can lead the next era of technology, and we want to make it happen.”
    The declaration challenges the prevailing narrative of European decline, pointing to the continent''s
    scientific excellence, private wealth and strengths in advanced manufacturing, energy, aerospace,
    robotics, quantum, climate technology and AI. The EU accounts for around 22 per cent of global scientific
