  fact: Amazon SageMaker HyperPod now supports model caching for inference, which pre-loads model weights
    and container images onto cluster nodes so pods read from local NVMe storage instead of downloading
    over the network. Learn how model caching cuts cold starts from tens of minutes to seconds, how it
    works, and how to enable it.
