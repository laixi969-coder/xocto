  fact: Meta has partnered with The Ministry of Information & Broadcasting (MIB), Prasar Bharati, Securities
    and Exchange Board of India (SEBI), and Indian Cyber Crime Coordination Centre (I4C) to launch India’s
    first government-led public interest microdrama series on online scams. The series will premiere on
    Instagram and will soon be available on Waves OTT. The “Scam se Bacho” microdrama will be Waves OTT’s
    inaugural series with Meta that aims to educate audiences on some of the most prevalent online scams
    today, including fake job offers , investment and digital arrest scams, reiterating the importance
    of reporting suspicious behaviour online and encouraging users to call the national cybercrime helpline
    1930 in case of fraud. Through an engaging, social-first approach, this initiative builds on the growing
    popularity of microdramas and demonstrates how innovative storytelling formats can be harnessed to
    make important public interest information more accessible and relatable. Scam Se Bach
