  fact: ChatGPT can receive audio prompts from your microphone faster now with a Live Dictation feature
    that transcribes as you speak, rather than waiting until you finish recording. It's rolling out now
    globally on all ChatGPT plans on the web, desktop app, and iOS and Android apps. While using dictation
    in ChatGPT, you can tap or click the audio waveform to show the live text transcript the AI is generating,
    then edit it in the prompt box when you're done. Dictation in ChatGPT is getting faster and more reliable.
    With Live Dictation, your speech turns into text as you talk, so you spend less time waiting for your
