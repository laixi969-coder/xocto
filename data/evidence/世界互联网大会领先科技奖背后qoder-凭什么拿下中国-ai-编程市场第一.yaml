  title: 世界互联网大会领先科技奖背后，Qoder 凭什么拿下中国 AI 编程市场第一
  published_at: '2026-11-05T09:19:17Z'
  collected_at: '2026-11-06T02:27:21Z'
  source_kind: market_signal
  tier: independent
  fact: 作者｜Cynthia 编辑｜郑玄 2026 年 11 月，每年乌镇世界互联网大会期间举办的领先科技奖，已经走到第十年。 作为面向全球征集互联网领域领先成果的国际性科技奖项，领先科技奖每年会选出涵盖基础研究、关键技术与工程研发约
    15 至 20 项获奖项目。一定程度上，它的评选也预示了未来几年潮水的走向。 这一年，传统互联网的光环逐渐退去，AI 成了最大的关键词。其中，仅工程研发组的 8 项获奖成果，从 AMD 的 AI
    处理器，到蚂蚁的大模型健康服务平台，再到地平线的整车智能体……就有至少 5 项与 AI 有关。 而在通用 Agent 这一领域， 阿里旗下智能体平台 Qoder，成为了国内唯一获此殊荣的通用 Agent
    产品。 至此，在领先科技奖诞生的第 10 个年头，命运形成了一个有趣的回环。 那时的领先科技奖，名字还叫世界互联网领先科技成果发布活动。而那一年在首届活动中，与特斯拉自动辅助驾驶、微软 HoloLens、「神威·太湖之光」超级计算机并列入选的，正式阿里云飞天开放平台为基础的大规模分布式交易处理平台。
    那时的飞天，立项已经超过 7 年，逐渐从承托阿里庞大业务的基础设施，转变为连接超过百万台服务器，能把计算能力送到更多企业手中的行业 Infra 定位。 乌镇的亮相，见证了飞天从内部技术攻坚走向更广阔市场的历程。
    十年后，Qoder 来到同一个舞台。 论资历，这款 2025 年 8 月才首次上线的产品还很年轻；但论成绩，迄今为止，这款产品的全球用户已经超过 800 万；IDC 发布的 2025 年中国 AI
    编程市场份额报告中，阿里以 47.6%的份额位居第一，超过第二至第五名之和；Gartner 最新的企业级 AI 代码智能体魔力象限，也将阿里云列入「挑战者」，与 AWS、Google 等公司同处这一象限。
    从云计算的大幕拉起到 AI Coding 的编程新范式，相比 10 年前的云计算时代，今天的竞争节奏已经被压缩到以周、甚至以天计算，竞争烈度也今时不同往日。那么，外有海外优秀产品在前，对内又有国内厂商密集入场，
    Qoder 究竟是如何从强敌环伺中突围的？ 01 强敌环伺，Qoder 如何突围 在 Qoder 正式立项时，它所要进入的市场，已经坐满了人。 2025 年 6 月，阿里成立面向 Agent 时代的
    AI 创新事业部。 Qoder 团队随即开
