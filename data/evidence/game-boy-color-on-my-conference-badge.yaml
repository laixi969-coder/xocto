  fact: 'Game Boy Color on My Conference Badge I''m at GitHub Universe this week and, similar to last
    year , the conference badge is a full-blown color screen computer. I''ve been hacking around with
    it again, and then I ran into with Steve Francia... who worked with Gemini to get a full NES emulator
    working on it, and then went a step further and deployed an emulator for both the Game Boy and the
    Game Boy Color. Which means, if you can obtain the ROM, you can run The Legend of Zelda: Link''s Awakening
    on your conference badge! A neat feature of the badge is that you can turn it upside down and then
    use game controller touch buttons that are built into the badge body. Tags: games , github , hardware-hacking
    , ai , generative-ai , llms , gemini , steve-francia'
