    \ \n    \n  会场对面地铁站附近，Plaud 的广告｜图片来源：极客公园  \n Luna Band 从 IFA 开幕这天起全球发货，149 美元，没有屏幕，也没有订阅费；Circular\
    \ 发了两枚戒指，最薄的那枚 1.9 克；Hama 拿出一枚 129 欧元的戒指；一家深圳团队做的 11 克录音手环，可以扣在 Apple Watch 的表带旁边；还有一条会看着你吃饭的项链，拿了今年的\
    \ IFA 创新奖。 \n 「今年 IFA 来的不只是欧洲本地的观众，有不少来自中东甚至南美的代理商也来到这里，看看有没有哪些适合在他们当地销售的可穿戴硬件产品」一位智能戒指公司创始人这样形容今年\
    \ IFA 的不同之处。 \n 这两天在柏林，我起初把这些东西仍然归类为无屏穿戴，也就是今年最火的那个品类。但把它们摆在一起看，无屏只是表象。 \n 屏幕拆掉之后，空出来的位置并没有留白，而是被换上了别的东西：更多的传感器，麦克风，摄像头。\
    \ \n 下一代穿戴设备的本质，不是让你少看一块屏幕，是把录音笔和摄像头戴在身上。 \n     \n \n \n \n \n \n \n \n   01    \n \n \n \n  \n \n\
