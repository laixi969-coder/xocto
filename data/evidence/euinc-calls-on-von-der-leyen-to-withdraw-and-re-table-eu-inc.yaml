  fact: 'EU–INC and Startups for Europe are calling on European Commission President Ursula von der Leyen
    to withdraw and re-table the original EU Inc proposal, warning that compromises made by EU Member
    States threaten to undermine one of Europe’s most important economic reforms for startups and scaleups.
    The announcement comes as Europe’s leading policymakers, founders and investors gather at Slush in
    Helsinki to discuss the state of EU Inc. After two years of campaigning for a single European company
    standard, EU–INC and Startups for Europe remain strong supporters of the European Commission’s original
    proposal. The Commission delivered a solid framework that could finally give European founders a genuine
    alternative to incorporating in Delaware, and allow companies to start and scale under one common
    European standard. But the Council’s negotiating mandate of 19 October has weakened or removed some
    of the very provisions that would make EU Inc a true European standard: Free choice of regist'
