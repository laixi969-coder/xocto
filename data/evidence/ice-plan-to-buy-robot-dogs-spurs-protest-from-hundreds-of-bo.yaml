  fact: Hundreds of employees at the US robotics firm Boston Dynamics signed a petition calling for executives
    to halt a sale of the company’s robot dogs to US Immigration and Customs Enforcement—but executives
    stood by the deal, while saying the robots would not be weaponized. On September 25, the Department
    of Homeland Security contract awarded $1.3 million to a Connecticut company called Radeco to provide
    ICE with modified versions of Boston Dynamics’ quadruped robots. But Boston Dynamics workers sent
    the petition letter with more than 300 signatures—half of them anonymous—to the company’s executives
    in early September and shared copies with The Boston Globe and WBUR public radio station . “Many of
    us have gotten messages from friends and family, asking us in disbelief and horror if this news is
    true, and how we can live with ourselves if it is,” according to the petition. “The risk for Boston
    Dynamics is simply too great to continue with this deal.” Read full article Comments
