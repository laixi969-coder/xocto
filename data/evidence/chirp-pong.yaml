  fact: 'Tool: Chirp Pong Another game experiment - I wanted to see if it was feasible to have a two player
    game on two separate phones running in static HTML where the networking code uses chirps sent via
    the microphone. It seems to work! Build a two player competitive pong like game where two players
    use their phones close to each other and the game state is sent via audio noises which the web microphone
    API can interpret - but add graphical and gameplay twists to make it a lot more fun and intertwine
    than pong Claude Opus 5.5 Extra in Claude Code . Tags: game-design , ai , generative-ai , llms , claude-code'
