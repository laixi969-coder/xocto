  fact: The European Institute of Innovation and Technology (EIT) has launched a new call to strengthen
    the capacity of higher education institutions to turn their research into innovations focused on the
    manufacturing and deep tech areas. the EIT Higher Education Initiative aims to help universities develop
    innovation and entrepreneurship skills, turn research into commercial products, and build stronger
    links with businesses. Backed by €40 million from the EIT, the 2026 funding round will offer up to
    €1.25 million per selected project over 18 months. Universities, businesses, research organisations,
    public bodies, and other partners are invited to apply together. The selected projects will help universities
    develop practical innovation and entrepreneurship skills among students and staff, particularly in
    STEM, manufacturing, and deeptech. They will also help universities turn research into commercial
    products, better manage intellectual property, and share expertise. With support from the EI
