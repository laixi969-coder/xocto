  fact: 'If the agent isn''t using my diagnostics library, I could introspect and update AGENTS.md, but
    there''s still a delta, and it''ll drift. Instead, I write a pre-commit hook that checks the git diff
    for direct calls to observability modules that bypass my diagnostics module. Boom: fail the commit,
    inject a prompt telling the agent to use the diagnostics library. All of a sudden it''s ten out of
    ten. — Geoffrey Huntley , nobody should type code by hand anymore. here''s what''s left. Tags: coding-agents
    , generative-ai , git , agentic-engineering , ai , geoffrey-huntley , llms'
