  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 26 日               在国内做 Web3 可行吗？    由于政策的原因，很多创业者对在国内做 Web3
    表达了悲观的看法，甚至有不少人奔赴海外去做 Web3。对于这个问题，我们可以用第一性原理来看待。   「  从技术上来说，区块链并不一定是要无政府导向，不一定要去中心化抗审查。  」   在国内做区块链资产钱包的创业者，来自
    AnyWeb 数连的创始人易和阳 Niko（简称 Niko），是这么认为的。     AnyWeb 数连（以下简称 AnyWeb）是首款针对中国环境设计的无需插件、强合规的区块链资产钱包，和国内有政府支持的自主知识产权公链——Conflux
    树图链是紧密合作关系，提供了一整套国内合规、开发者友好的 Web3 应用接入解决方案。对于监管，Niko 认为是很正常的一件事， 「我觉得监管是一个正常的发展过程，Web2 在 2008 年后也经历了一系列监管，这是行业发展的正常规律。」     而在监管之外，国内
    Web3 的政策也有了不少新的方向，在 7 月份上海市发布的《上海市数字经济发展「十四五」规划》中，就明确提出支持龙头企业探索 NFT 交易平台建设。    在这样的复杂环境下，国内的 Web3
    到底会走向怎样的未来？国内合规公链——Conflux 树图链的现状如何？关于这些问题，我们和 首次接受采访的 Niko 进行了一次长谈 ，还聊了聊合规的 Web3 应该怎么做，以及 AnyWeb
    是如何解决合规性问题的等问题。                Web3 天生不是面向巨头的，而是面向 Nobody 的。对于草根创业者和年轻人，Web3 是一个非常值得尝试的地方。    监管并不意味着所有权受到了管控，资产仍然是个人掌控、并不会随便被没收，资产操作仍然是由个人发起，所有权关系不会发生改变。    Code
    is Law 只是解决了司法强制执行的问题，区块链技术可以保证司法的强制执行，但是具体在上面写什么样的法律是有很大空间的，这取决于不同的市场环境。    加密的抗审查性是早期社区的属性，但从技术角度来说，中本聪的白皮书并没有提及抗审查，只是论述如何创建一种点对点的电子现金支付工具，也没有说要取代美元或者其他货币等。    Web3
    的本质精神就是开放
