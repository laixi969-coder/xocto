  fact: 苹果发布首款触屏 MacBook Pro，顶配超 11 万 元 北京时间 10 月 29 日，苹果发布全新 MacBook Pro，首次为 Mac 引入屏幕触控和灵动岛，并采用双层串联 OLED
    技术的 PROLED XDR 显示屏。 新机提供 14 英寸和 16 英寸两种版本，搭载 M5 Pro 或 M5 Max 芯片。根据苹果中国区发布信息，新机将于 10 月 30 日开启预购，11
    月 6 日正式发售，起售价 22999 元。 在交互方面，用户可直接触摸屏幕滚动网页、缩放照片、拖放幻灯片，以及操作 3D 模型或演奏虚拟乐器。苹果表示，触控传感器直接内嵌于显示面板，macOS
    可将触控输入转换为点按，让许多现有应用直接支持触控。新机还调整了铰链设计，以提升触屏操作时的稳定性。 新机最高可选 128GB 统一内存和 16TB 存储，苹果标称电池续航最长可达 24 小时，支持约
    30 分钟充至最高 50%电量。搭载 M5 Max 处理器、128G 统一内存和 16TB 硬盘的 16.3 寸触屏 MacBook Pro，官网标价来到 11.26 万元。（来源：凤凰网科技）
    宇树科技公布首份财报，前三季净利 3.87 亿元 10 月 28 日晚间，宇树科技发布了 2026 年第三季度报告，也是其上市后的首份财报。财报显示：报告期内公司单季度实现营业收入 6.65 亿元，同比增长
    69.93%；归母净利润 1.13 亿元，同比下降 17.37%。 报告显示，年初至报告期末，公司累计实现营业收入 18.17 亿元，同比增长 55.71%；利润总额 4.13 亿元，同比增长 143.05%；归母净利润
    3.87 亿元，同比增长 270.54%。 此外，宇树科技的研发投入有所提升，其第三季度单季研发投入 1.27 亿元，同比增长 249.58%，占当期营业收入比例 19.1%；前三季度累计研发投入
    2.63 亿元，同比增长 191.48%，占营业收入比例 14.47%。 公司称，研发投入增长主要系持续加大具身智能领域研发投入，尤其是具身大模型相关模型研发与算力投入大幅增长，以及扩充研发团队、持续开展新产品研发所致。（来源：新浪科技）
    DeepSeek V5 大模型已现身官方代码库 近日，有网友发现 DeepSeek 又开始换新的大模型指纹了，官方库中直接出现了 DeepSeek
