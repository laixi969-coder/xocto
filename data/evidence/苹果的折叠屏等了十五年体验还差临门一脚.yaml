  project_slug: 苹果的折叠屏等了十五年体验还差临门一脚
  url: http://www.geekpark.net/news/370231
  title: 苹果的折叠屏等了十五年，体验还差临门一脚
  published_at: '2026-09-13T17:24:02Z'
  collected_at: '2026-09-14T00:12:56Z'
  source_kind: market_signal
  tier: independent
  fact: "折叠屏七年没解决的问题，从来不在铰链上。 \n \n  作者｜张勇毅  \n  编辑｜靖宇  \n \n 2011 年 9 月 30 日，苹果递交了一份名叫「Flexible electronic\
    \ devices」的专利申请。它描述的是一台屏幕可以对折的设备，合起来能揣进口袋，靠传感器判断自己是开着还是合着。 \n 这份专利 2015 年 1 月获授，发明人一共六位，其中一位叫特努斯（John\
    \ P. Ternus）。 \n \n  十五年之后的 2026 年 9 月 9 日，当年署名的那位工程师，第一次以苹果 CEO 的身份站上发布会，发布了 iPhone Duo。  \n 虽然对这位新任\
    \ CEO 来讲，这是首次发布会上最重磅的产品，但中间这十五年，苹果关于折叠屏的大量预研工作，已经在水面之下进行了许久。 \n 按彭博社马克·古尔曼在发布会前一天的报道，苹果工程师大约到 2016\
    \ 年才开始认真做折叠 iPhone，项目由特努斯的前任、硬件工程主管丹·里奇奥发起。方向也一直没定下来，前几年试的是一台能展开成大平板的 iPad mini。 \n 2019 年 2 月，三星和华为前后隔了四天发布了各自的第一台折叠屏：Galaxy\
    \ Fold 合上超过 15 毫米厚，Mate X 干脆把屏幕折在外面，折痕都是肉眼可见的一道沟。苹果比这两家早八年想到这件事，此时什么也没拿出来。 \n 转折在 2020 年。库克从亚洲出差回来，看到三星和华为的折叠机在那边到处都是，把方向掰向了折叠\
    \ iPhone。彭博的报道里引了一句话：库克是这个项目最早也是最大的支持者。 \n 真正卡住工程团队的是四件事：折痕看不看得见、铰链能不能扛住反复开合、内屏的柔性盖板玻璃怎么做、摄像头怎么藏到屏幕底下。盖板玻璃最后和康宁一起定制，铰链用了钛和铝。这四件事全是硬件问题。\
    \ \n \n 从 2019 年那两台机器算起，七年过去。华为 Mate X7 做到了 9.5 毫米、235 克，小米 18 Fold 把书本式折叠卖到 10999 元。苹果最后一个进场，交出的\
    \ iPhone Duo 合上 11.3 毫米、254 克、国行 15999 元起，是同尺寸折叠屏里最厚、最重、也最贵的一台。 \n TrendForce 在发布会当天给出的预测是，这台机器今年能卖出大约\
    \ 500 万台，第一年就拿走全球折叠屏市场的 24.8%；Counterpoint"
