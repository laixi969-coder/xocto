  fact: Kubernetes, the open source system that manages how applications run across thousands of AI factories,
    has become the foundation for AI, and the demands on it are only growing. To help meet them, NVIDIA
    is deepening its commitment to open source at KubeCon + CloudNativeCon , the flagship conference for
    the Kubernetes and cloud-native communities. NVIDIA is contributing NVIDIA OpenShell , an open source
    runtime for securing and governing autonomous agents, to the Cloud Native Computing Foundation (CNCF),
    a nonprofit that is part of the Linux Foundation and the host of KubeCon. As a CNCF Sandbox project,
    OpenShell will be governed by the organizations building it into their products and strengthened by
    the expertise of security professionals worldwide. NVIDIA is also contributing to Agent Substrate
    , an open source Google-led framework for operating long-running agent workloads at scale on Kubernetes
