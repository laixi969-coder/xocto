  fact: The US has charged five individuals as part of the first broad federal crackdown on “ghost students”—fraudsters
    who steal the identities of hundreds of Americans to pose as fake college students and steal student
    loans. In a press release Thursday, the Department of Justice said it had uncovered a large-scale
    scheme relying partly on AI. The DOJ seized more than $750,000 in cryptocurrency from “a network associated
    with Kenyan nationals" after data analysis helped flag likely fraudsters. Assistant Attorney General
    Colin M. McDonald of the DOJ’s National Fraud Enforcement Division credited new fraud-detection measures
    implemented by the Trump administration for the arrests. He said that “this is the first international
    seizure of its kind in Kenya,” while warning fraudsters that the crackdown has only just begun. “If
