  fact: Condé Nast's editorial teams spent an average of 250 minutes per task searching a library of more
    than 140,000 videos using only titles and descriptions. Working with the AWS Generative AI Innovation
    Center, they built a multimodal video discovery solution on Amazon Bedrock and Amazon OpenSearch Service
    that cut discovery time to under 2 minutes.
