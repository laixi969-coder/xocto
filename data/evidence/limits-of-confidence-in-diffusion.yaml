  fact: Discrete diffusion, including remasking and uniform-state samplers, generate a sequence by writing
    multiple token positions per step, drawing each from a per-position distribution and choosing which
    positions to write from those same distributions. For domains of general interest (pixels, phonemes,
    or words) there are inherent dependencies between tokens. We show that a step matches the training
