  fact: "## Ripple Preview\r\n\r\n[Ripple Preview](https://ollama.com/library/ripple-preview) from Ricursive\
    \ Intelligence is a 65B dense model built for agentic coding.\r\n\r\n```sh\r\nollama run ripple-preview\r\
    \n```\r\n\r\n## What's Changed\r\n\r\n- Qwen3.8 Flash Next uses about 27 GiB less memory on Apple\
    \ silicon\r\n- `ollama launch claude` always routes Claude Code to the selected model\r\n- `ollama\
    \ launch` explains when a cloud model has been retired\r\n- `/v1/responses` respects `truncation`\
    \ and no longer silently truncates by default\r\n- `/v1/models` returns an empty list instead of `null`\
    \ when no models are installed\r\n- CUDA 13.5 support for Windows on ARM\r\n- Updated llama.cpp\r\n\
    \r\n**Full Changelog**: https://github.com/ollama/ollama/compare/v0.40.15...v0.40.16"
