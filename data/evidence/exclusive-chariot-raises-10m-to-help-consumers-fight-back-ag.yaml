  fact: While helping another founder build an app that collected information about class-action settlements,
    Zim Hang came to learn how challenging it can be for consumers to seek compensation from companies
    they believe wronged them. He also discovered mass arbitration, a way to pursue individual claims
    when companies’ contracts prevent customers from joining class actions. At the same time, he also
    realized that relatively few law firms were set up to manage thousands of those claims at once. Zim
    Hang, founder and CEO of Chariot Claims. (Courtesy photo) That gap became the basis for Chariot Claims
    , which has raised $10 million in Series A funding led by Silverton Partners to help consumers pursue
    claims over alleged privacy violations, hidden fees and subscriptions that are difficult to cancel.
    Indicator Ventures , Lightbank , Neon Fund , ZVC , Rosecliff Ventures , Alumni Ventures , FJ Labs
