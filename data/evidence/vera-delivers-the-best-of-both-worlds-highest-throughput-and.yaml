  fact: 'AI agents do more than generate answers. They search for information, query databases, write
    and test code and take action. Each of those steps relies on a CPU, with agents moving between GPU
    reasoning and CPU execution throughout a task. As businesses put more agents to work, AI factories
    need CPUs that can execute those steps quickly and support many agents at once, all within the limits
    of available power. What this means: AI infrastructure providers need to support more agents without
    making each one wait longer to get work done. And critically, AI factories are power limited. This
    means operators need to choose infrastructure that maximizes the work done for every watt. Why it
    matters: NVIDIA Vera delivers both fast agent performance and high capacity per watt within a single
    CPU. That gives providers one CPU for a range of agent workloads, rather than having to mix and match
