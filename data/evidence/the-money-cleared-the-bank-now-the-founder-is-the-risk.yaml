  fact: 'By Kelly Meerbott The round closes. The announcement goes out. For about a week, everyone is
    happy. Then the pressure doubles. The number that used to be a hope is now a promise. The board that
    used to be patient now has a timeline. And the founder who just finished the hardest sales job of
    their life is expected to make the best decisions of their life, immediately, on less sleep than they’ve
    had in months. I’ve spent 17 years coaching about 1,500 leaders, including venture-backed founders.
    The pattern repeats often enough that I treat the first 90 days after a raise as a danger window.
