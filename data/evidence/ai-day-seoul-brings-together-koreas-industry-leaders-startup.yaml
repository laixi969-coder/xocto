  fact: Over two days at COEX, more than 2,000 attendees converged for AI Day Seoul, bringing together
    Korea’s industry leaders, startups and developer communities advancing physical AI and AI agents.
    At the plenary sessions, Deepu Talla, vice president of robotics and edge AI at NVIDIA, said Korea
    is “punching above its weight,” with Doosan Robotics, Hyundai Motor Group, LG Electronics and SK Group
    — as well as startups like Real World and Luda Robotics — using NVIDIA platforms to bring general-purpose
    robotics into the real world. Jonathan Cohen, vice president of applied research at NVIDIA, showed
    how enterprises can build agents they own and control. Breakout sessions featured speakers from Coupang
    Intelligent Cloud, Doosan Robotics, LG AI Research, LG Electronics, NAVER Cloud, SK Telecom and Upstage.
    “It was a genuinely enjoyable time to have candid conversations,” said Hyunho Yang, research engineer
