  fact: Concurrency sweeps help you right-size a generative AI endpoint on Amazon SageMaker AI by systematically
    benchmarking it at increasing load levels. This post walks through deploying a model, running automated
    concurrency sweeps with the CreateAIBenchmarkJob API, and using the results to make data-driven capacity
    decisions about fleet size.
