  fact: "作者｜张鹏    \n  编辑｜ 苏子华  \n   \n 9 月 22 日，杭州云栖大会。阿里巴巴集团 CEO 吴泳铭和往年一样，做了开场的主旨演讲。 \n 过去几年云栖大会的主旨演讲，可以当作「技术风向标」来听，会抛出很多重磅的技术判断，比如，「大模型是下一代操作系统」、「超级\
    \ AI 云是下一代计算机」。 \n 但这一次，我听完的感受很不一样。吴泳铭花了很多时间讲工业革命、讲电、讲经济学。他的重心不在 AI 会变成什么样了，他讲的是，AI 会让世界变成什么样。 \n\
    \ 比如他给出的一个核心观点，「上一次这样的变化，是工业革命把动力变成了规模化的商品。人类先后发明了蒸汽机、内燃机和电，并围绕它们建立起了现代产业。这一次，轮到思考。」 \n 当一个 CEO 开始用经济学的语言描述未来，说明他脑子里转的，已经不仅仅是产品和技术的路线，而是整个经济的流转结构——谁生产、谁输送、谁消费、怎么计价。\
    \ \n 我甚至认为，这个变化的背后，是阿里对「下一个时代如何定位自己」的更高维战略思考——不是如何跟上这个时代，而是在过去几年「积极参与进去并有效跟上」之后，逐渐形成自己面向未来的世界观，并把这个世界观变成明确的下注：公司架构、未来投入的大战略结构和阵型，开始变得空前明确。\
    \ \n 简单说，吴泳铭这次讲的不是技术观，也不是产品观，而是世界观：「世界会变成什么样、阿里要站在哪」。 \n   \n   \n   \n  01  \n  供需机制：思考力商品化的经济学含义\
    \   \n   \n 吴泳铭这次的演讲里，我觉得有两个值得研究的核心判断。 \n 第一个：未来，机器供给的思考总量，将是人类思考总量的 1000 倍以上。他说，这件事在物理世界已经发生过——今天，机器动力承担了\
    \ 99.9% 的物理工作；未来，机器会承担 99.9% 的思考工作。 \n 第二个判断，是他对「1000 倍」这个数字的推演。他从供给和需求两头推。 \n 供给这一侧，人类的顶级思考极其稀缺。培养一名顶级科学家，要几十年的学习和实践，还要天赋和运气。\
    \ \n 比如，新生儿早衰症，全球每年新增病例几十例，有记录的患者总共只有几百人。按现有医药产业的商业逻辑，没有公司愿意花十几年、砸巨资，为几百个人研发一种新药。 \n 但 AI 正在改写这个账。\
    \ \n 只要算力足够多、足够便宜，每个细分领域都可以组织上百万个 Agent，不眠不休地研究、模拟、验证，探索不同的方案。"
