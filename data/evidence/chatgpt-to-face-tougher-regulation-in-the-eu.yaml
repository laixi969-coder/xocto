  fact: "作者｜苏子华  \n  编辑｜靖宇  \n \n 机器人行业现在最关心的一个问题：它能干完一整件事吗？ \n 几十秒的抓取物品的视频已经撑不起估值了。把一件事从头干到尾，成了最新的考题，行业里叫它「长程任务」。\
    \ \n  8 月 19 日，世界机器人大会，一台机器人首次亮相，用 15 分钟回答了这道题：收拾客厅，检查冰箱，把烘干机里的衣服拿出来，放进新的一批，按下启动键，最后把衣服叠好。  \n 里面大概有七八十个动作，自主完成，全程没掉链子。\
    \ \n   \n 正在忙活衣物烘洗家务的 MORPHI KINO 机器人｜图片来源：MORPHI \n   \n 造它的公司叫墨奇（MORPHI），成立刚 8 个月。联合创始人 黄青虬 出生于\
    \ 1994 年，清华自动化本科、香港中文大学 MMLab 博士。 \n 在华为车 BU 的五年，他从研发飞速做到智驾 AI 部门一号位，主导了华为智驾 ADS 1.0 到 4.0 的算法突破与量产，管两百多人。根据公开信息，华为智驾系统已覆盖\
    \ 35 家车企、50+ 款量产车型，搭载量超 170 万台。例如，被广为熟知的问界、智界、尊界等新能源汽车品牌。 \n 离开前，他做了件大事：把整个智驾全部完成了 AI 化。也是在做完这一代之后，他亲手验证了用一个\
    \ AI 模型去驱动物理系统、做底层控制这件事是可以的，看到了具身爆发的基础。 \n 于是他辞职，和也曾是华为出身的物流老兵 高文礼 一起，做一台「跟人一样聪明」的机器人。 \n  墨奇 很多选择都和同行反着来：\
    \ \n 不做双足人形，先做轮式——「智能的上限在手臂」；自研关节，却没做灵巧手——「夹爪就够了」；不堆数据量，坚持数据质量第一，且认为数据比模型架构重要；也不追「VLA、世界模型」等架构名词——具身模型架构叫\
    \ MoRA，按照功能来命名，意思是「会推理，能自主」。 \n 最特别的是他们具身模型的技术路线。 \n  一般机器人是「云端大脑下指令、本地手脚执行」；而他们是将「大脑」的能力直接装进执行层。全程没掉链子，依赖的就是其模型\
    \ MoRA 端侧System 1的能力。  \n 黄青虬认为，这是 Agentic-Native 的模型路线。「我们用 8 个月干了别人两三年干的事。未来我们希望在某一个单点上做到业界标杆，比如模型，或数据的\
    \ scaling law 上，做出别人没做过的东西。」 \n 今年 7 月，墨奇宣布融资超 10"
