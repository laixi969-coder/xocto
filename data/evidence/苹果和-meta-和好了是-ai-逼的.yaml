  fact: 没有永远的敌人，只有永远的 AI 焦虑。 10 月 2 日，苹果做了一件很少见的事，因为一个第三方 App，宣布要调整系统规则。 起因是《Inc.》杂志的科技专栏作者 Jason Aten
    公开指控，Meta 的 AI 智能体 Muse 在他的 Mac 上读取了私人消息。Muse 是 Meta 力推的「能替你办事」的 Agent，会帮你退订闲置会员，甚至替你砍价。 苹果随即表态， 今后
    AI 请求读取 Mac 数据时，系统会主动提示用户 。 这几乎就是苹果和 Meta 过去五年关系的缩影，Meta 想拿数据，苹果出面拦着。 然而仅仅两周后，故事发生了反转。 当地时间 10 月 15
    日，Meta 发布开放权重模型 Muse Spark Open，扎克伯格在 X 上发帖，感谢「John Ternus 和苹果」的合作，让这个模型能在新款 Mac Studio 上流畅运行。 苹果
    CEO Ternus 本人很快回复，称能在自己桌上如此高效地跑起这种量级的模型： 「鹅妹子嘤」。 Meta 的 AI 负责人 Alexandr Wang 接受 Axios 采访时，说了一句更搞笑但直白的话：
    「 很高兴爸爸妈妈又和好了 。」 所以，「爸爸」和「妈妈」，是怎么和好的？以及，Meta 最近连续在模型上发力，终于重回牌桌了吗？ 01 一台桌子，放下 8000 亿参数 先看这次苹果和 Meta
    的合作到底做成了什么。 Meta 宣称 Muse Spark Open 总参数 8160 亿，每次推理只激活其中 420 亿，支持 100 万 token 的上下文。Meta 称它是： 「 迄今美国最强的开放权重模型
    」。 注意这个措辞里的「美国」两个字。论参数规模，它并不是全球最大的开源模型。 月之暗面的 Kimi K2、蚂蚁的 Ling-1T，早在 2025 年就把开源模型推到了万亿参数级别 。Meta 这次是在追赶，而且对手是中国公司。
    真正新鲜的，是它跑在哪里。 苹果的 M5 Ultra Mac Studio 绝对是本地模型利器｜图片来源：Apple 按 Meta 的说法， 两台顶配 M5 Ultra Mac Studio 就能装下整个模型
    。每台 Mac Studio 的 GPU 能直接调用最多 512GB 统一内存，两台连起来约 1TB，在 Apple 的 MLX 框架下像一台小型超算
