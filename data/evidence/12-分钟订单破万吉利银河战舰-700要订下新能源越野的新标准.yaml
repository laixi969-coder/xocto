  fact: 图片来源：吉利银河 「这台车我们造了 5 年，这也是吉利第一次造越野车。」吉利汽车研究院院长李传海说到。 就在几分钟前，10 月 10 日，吉利银河战舰 700，一台新能源野车正式发布，16.98
    万（限时焕新价）起的价格，让这台最高配备三电机四驱，千匹马力，能爬 45° 坡、能应急浮水的越野车，变得十分打动人心。 吉利银河战舰 700 的价格梯度比较大｜图片来源：极客公园 事实也是如此，在发布会后
    12 分钟，吉利银河战舰 700 的订单数量就突破 1 万台。 但在显性成功的背后，你确实会猜测，可能恰恰因为吉利「缺乏越野基因」，才能让团队没有任何包袱，从底层架构层面，重新思考新能源时代的越野车，到底应该是什么样。或者，
    用吉利团队的话，是新能源越野时代 2.0 的产品，该是怎样的 ？ 大梁，「吃」进车里 过去十几年，硬派越野车的规矩很简单。想要真越野，就上非承载式大梁，车身坐在一副独立的钢制梯形车架上，扛得住扭，经得起摔，代价是车重、空间被吃掉、进城开起来晃晃悠悠。想要舒适，就选承载式车身，好开好坐，但遇到交叉轴和连续冲击，车身容易扭，严重时车门都关不严。
    新能源来了之后，这道题反而更难。电池要找地方放，电机要找地方装，大梁车本来就紧张的底盘空间被进一步压缩，车重再往上叠几百公斤。市面上不少新能源硬派，其实是在两条老路里选一条走，要么在大梁车上做加法，要么给城市
    SUV 套一个方盒子外壳。 银河战舰 700 的思路，是不再二选一。 吉利集团 CEO 淦家阅介绍 GTA 架构和一体大梁技术｜图片来源：极客公园 它基于吉利新发布的 GTA 原生新能源越野架构，
    核心是一套被称为「一体式大梁」的结构 。简单理解，就是把大梁拆成三段分别用最合适的工艺来做，再整体嵌进车身骨架。前纵梁用超高强热成形钢，中段是超高强辊压集成大梁，后纵梁用 TRB 热成形（一种变厚度轧制工艺，受力大的地方厚，受力小的地方薄），三段前后贯通，再和门槛梁、横梁连成一个整体。
    这么做的收益体现在几组数字上。官方数据显示，这套结构的强度比传统大梁提升 30% 以上，整车扭转刚度做到 44180 N·m/deg，比同级独立大梁车型高出 20% 以上。与此同时，它比独立大梁方案轻
    80 到 100 公斤，高度方向省出 40 到 70 毫米，换来更大的头部空间和 80.3% 的得房率。 它想要大梁车的「骨头」
