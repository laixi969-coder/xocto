  fact: 本文首发于 Founder Park 公众号 · 2022 年 10 月 21 日   Clubhouse，这个 2021 年大火了一把的实时语音聊天房应用如今已经成了过气网红，但 Clubhouse
    从早期 1000 名起始用户到月下载量超过 900 万的过程中的得与失，仍然是极具价值的，特别是来自 Clubhouse 内部高管的分享。    本文作者 Anu Atluru，Clubhouse
    的第一位社区负责人，在这篇文章中，她分享了她在 Clubhouse 从 1000 名早期用户开始的 2 年发展过程中学到的一切。从 Clubhouse 的产品、社群和运营等方面总结了对于初创企业实用的
    25 条经验。    编译来源：What I Learned at Clubhouse    作者 |   Anu Atluru    翻译 | 孙薇    Anu Atluru 是一名创业者、天使投资人和创作者，她在
    Clubhouse 担任了两年的社区负责人。                 过去几年，我在创业方面颇有心得，对于做好初创公司这件事，也有了一些自己的想法。最近两年，我一直在 Clubhouse
    工作，得益于团队水平和增长速度，以及投身了新的产品类型，我的学习进度有了突飞猛进的进步。    最开始，这个应用仅有 1 千余名用户，里面的房间（Rooms）都还没有命名，甚至连「俱乐部（clubs）」都不存在。团队成员也仅有几名创始人而已。从这个起点开始，Clubhouse
    开始迅猛发展，作为早期员工和社区负责人，在公司里我成了一个相当活跃的人，在这个应用的各个角落，几乎都能见到我的身影。    最近几个月，我渴望有更多时间以创始者的身份来探索一些新的想法，所以我决定离开
    Clubhouse，同时作为顾问继续工作。关于如何建立及扩大初创企业的规模，尤其是在产品、社群与团队方面，以及如何以公开的形式完成这些工作，我总结了许多个人经验，并提炼了个人观点。          01       产品          经验一：博得构建下一个目标的权利      在追逐下一个具有创造性和实验性的闪亮点子之前，确保自己已经按计划或一开始的做法坚持到底了。「博得构建的权利」，以及「尊重次序」是我已经刻到骨子里的原则。    在最初的阶段，这可能意味着在写下第一行编码前，要对用户需
