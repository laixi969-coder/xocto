  fact: 在 AI 时代，最敢给自身组织结构动刀、同时也最能整活的大厂微软，又成为了新的 AI 组织实践者。但这次微软带来的不是好消息，而是公开承认「微软已经延缓了应届生的招聘进度」。 不久前的 The
    Pragmatic Engineer 播客里，主持人问微软 CEO 萨提亚·纳德拉「微软还招不招应届生」时， 纳德拉在节目上公开承认微软应届生招聘的确放慢了，还表示「很多公司都这样」 。 对于这个结论，他解释道眼下「首要任务是确保我们内部的所有人，都被调整到合适的位置」，先把人和
    AI 分工写软件的「软件工厂」模式构建起来。 但在他的计划中，调岗后面的第二步， 还是得先把 AI 预算花满 。他谈到从一开始就围绕 AI 搭起来的 AI 原生公司，纳德拉说，「什么是 AI 原生公司，它们从一笔
    AI 预算和一个人起步。这个人把 AI 预算用满了，然后说，再加一个人吧。」他还给出了自己的判断，「每家公司都会开始变成这样。」 这番言论不仅炸裂，而且与他本人十个月前的表态都反差明显。今年 1
    月达沃斯论坛期间，纳德拉接受播客采访时还说的是「我仍然非常相信校园招聘，因为 AI 是帮新人更快上手的导师」。 1 月在达沃斯，他还说相信校园招聘｜图片来源：All-In 可能当时他自己也想不到的是，十个月之后，AI
    就从带新人的导师，变成了招人前先要花完的预算。 微软自己的算盘 作为一向以精明职业经理人面貌示人的微软现任 CEO 纳德拉，他愿意在公开场合打脸自己 10 个月前的言论，必然是因为微软内部，已经意识到了
    AI 组织转型中遇到的新状况。这是微软十年来首次员工数量减少，但公司的生意仍然在上涨。 据微软财年年报数据，目前全职员工约 22.3 万人，一年少了约 5000 人，同期营收却增长 18%。这是微软自
    2016 年，收尾诺基亚手机业务以来首次年度员工下降。 微软研发从 8 万人降到 7.7 万｜图片来源：微软 团队减得最多的是产品研发，说明业务增长已不再按老比例加工程师。微软年报里产品研发少了约
    3000 人，连续第二年下降。算下来微软净减少的人里每五个就有三个做研发，这还没算上 7 月宣布的新一轮约 4800 人裁员。 眼下微软的精力放在重新安排公司里已有的人上，也就是纳德拉说的先把内部的人调到合适的位置，招新人要排在这件事后面。这也是为什么
    微软最近首次向大部分软件工程师提供自愿
