  title: 苹果给 Siri 做了一块能认出全家人的屏幕，售价 299 美元
  published_at: '2026-10-13T13:51:34Z'
  collected_at: '2026-10-14T01:14:23Z'
  source_kind: market_signal
  tier: independent
  fact: 头图来源：Apple 官网 北京时间 10 月 13 日晚，苹果召开了一次主题为「欢迎回家」的新品发布会，苹果这次放进客厅的新东西，是一块 7 英寸的屏幕。 它叫 Apple HomeView，美国售价
    299 美元 ，10 月 13 日开放预订，11 月 13 日上市，一同曝光的还有第四代 Apple TV 4K、HomePod mini 2。三款产品在海外都以新一代 Siri AI 为卖点，但音箱要等后续软件更新才能用上。同期发布的，还有
    Apple Home Collection 智能家居配件系列。 HomePod 和 Apple TV 早已支持家庭控制，HomePod 也有声音识别和个人请求。HomeView 给了 Siri 一块全家共用的屏幕，可以放在厨房台面、床头柜上，也可以装在玄关的墙上。
    这次产品发布更有意思的变化，是 Siri 的回应多了一个可以随时看见、伸手操作的地方。它的个人化能力，仍和每个人的设备、权限绑在一起。 屏幕属于全家，个人化的 Siri 仍然要认人、认手机 。 桌面版提供四种配色｜图片来源：Apple
    一块会认家人的屏幕 HomeView 桌面版用一根不锈钢铰链，把 7 英寸 Liquid Retina 屏幕连在一个穹顶形的铝制扬声器底座上，屏幕可以手动调整倾角，有银色、星光色、玫瑰粉和深空灰四种颜色。屏幕亮度最高
    500 尼特，最低可降到 0.3 尼特。苹果的设想是，白天放在阳光充足的房间里看得清，晚上放在床头也不刺眼。 壁挂版是另一款独立型号，同样售价 299 美元，只有深空灰和银色两种颜色，需要另购施耐德设计的电源支架。USB-C
    款 59.95 美元起，交流电接线款 79.95 美元起，PoE 款要等到 2027 年初，售价 129.95 美元。 屏幕闲着的时候，可以当相框或动态表盘。照片表盘能选用共享相簿，远方的家人也能往里添照片；Flow
    表盘的光影会随人的走动变化；还有一组史努比动画，会跟着时间、天气和节日变换。苹果还说，界面会根据人与屏幕的距离调整信息密度：站在远处时显示大字号的简要信息，走近后再展开更多细节。 厨房是苹果重点展示的使用场景
    。按苹果的说法，在 Safari 里找到菜谱后，可以把它转成分步说明；手上沾着面粉时，用语音就能开关多个计时器，倒计时以实时活动的形式停在屏幕一角。 它配有一颗 1200 万像素
