  fact: Starting today, Siri can tune into the Apple Watch's mic with Audio Intelligence features that
    are available in the new watchOS 27.3 developer beta rolling out now. The two new additions are Siri
    Recap, which uses "ambient listening" to generate summaries of your conversation, and Live Rewind,
    which generates text transcripts of the last 15 seconds of audio your watch's mic detected. Apple
    is also releasing its redesigned Health app for testing today in the iOS 27.3 developer beta, and
