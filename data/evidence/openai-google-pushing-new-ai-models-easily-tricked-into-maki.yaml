  fact: 'Safety researchers continue to warn that a large volume of AI-generated explicit content is spreading
    unchecked, while regulators do little to meaningfully stop it. This non-consensual content is commonly
    shared in text and direct messages or stored in private clouds where it’s less likely to be detected
    or reported, a Google co-authored study of Internet users across the United States, Australia, and
    the United Kingdom found this July. That’s why the “most critical intervention point” remains at the
    source: the harmful AI tools used to make the fake sexual images, Google researchers concluded. Yet
    red-teaming in recent months suggests that as some of the leading AI image generators from Google
    and OpenAI become more capable, they may be getting worse at blocking explicit outputs. Read full
    article Comments'
