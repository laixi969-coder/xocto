  fact: Today’s article is sponsored by 80,000 Hours, a podcast that explores the transformative impact
    of AI. About six months ago, Suvrat Raju, a professor of theoretical physics at the International
    Centre for Theoretical Sciences in Bengaluru, asked a frontier AI model to solve a physics problem.
    He didn’t ask because he needed to know the answer. He had actually solved this particular problem
    already. But he had never published the solution — which made it a perfect question to test how good
    AI was at physics. LLMs have been trained on the whole Internet, so if a physics problem has been
    discussed online, it’s likely the model already knows about it and may have memorized the answer.
    So a fair test of AI capabilities needs to focus on problems that have never appeared online. The
    model didn’t answer Raju’s problem correctly, but it did better than he expected — well enough to
