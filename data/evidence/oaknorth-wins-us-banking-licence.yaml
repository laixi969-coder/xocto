  fact: OakNorth , the UK SME lender, has won a US banking licence, it said today, allowing it to offer
    services beyond lending including checking and savings accounts to businesses in the US, which now
    accounts for 40 per cent of its lending business. The digital bank, which is backed by Japanese investor
    SoftBank and GIC, the Singaporean state fund, said it’s the first foreign digital bank to secure a
    US banking licence, after winning regulatory approval from the Federal Reserve and the Office of the
    Comptroller of the Currency. OakNorth applied for US regulatory approval through its acquisition of
    Community Unity Bank , an FDIC-insured lender in Michigan, which it acquired in 2025. Earlier this
    year, the Federal Reserve told OakNorth to move its domicile from Jersey to the UK to clear its purchase
    of Community Unity Bank. The UK challenger bank, which launched in the UK in 2015 and has lent over
