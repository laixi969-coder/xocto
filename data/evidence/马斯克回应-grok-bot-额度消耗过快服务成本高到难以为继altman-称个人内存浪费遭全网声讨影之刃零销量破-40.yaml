  fact: Anthropic 更新 IPO 招股书：第三季度营收近 170 亿美元，算力承诺达 8954 亿美元 11 月 2 日，Anthropic 向美国证券交易委员会提交更新后的 S-1 招股文件，首次补充截至今年
    9 月底的第三季度财务数据。 Anthropic 第三季度营收达到 169.6 亿美元，较第二季度增长 47%，但增速低于第二季度的 144%。公司第三季度营业亏损为 5.67 亿美元，而第二季度曾实现
    9.74 亿美元营业利润。 与此同时，Anthropic 披露约 8954 亿美元的 AI 基础设施相关支出承诺，涉及亚马逊、谷歌等合作伙伴。公司警告，部分算力供应依赖第三方融资，如果相关资金出现问题，可能影响交付时间和成本。（来源：Reuters）
    Meta 调整 VR 硬件优先级：将更多资源转向可穿戴设备和 AI 业务，降低消费级 VR 硬件优先级 11 月 2 日消息，Meta 首席财务官 Susan Li（李苏珊）在 2026 年第三季度财报电话会议上表示，Meta
    旗下 Reality Labs 部门第三季度营收为 4.43 亿美元（现汇率约合 29.51 亿元人民币），同比下降 6%，主要原因是 Quest 头显销量减少，不过 AI 智能眼镜业务持续强劲增长，在一定程度上抵消了相应影响。
    当前，Meta 正在调整硬件业务的优先级，将更多资源转向可穿戴设备和 AI 业务，降低消费级 VR 硬件及元宇宙业务的优先级。不过，Meta 首席执行官扎克伯格在电话会议中称公司「并未完全放弃 VR」，他仍然看好这项技术的长期发展潜力，只是「现阶段
    Meta 将优先投入 AI 领域」。 按照 Meta 安排，其最新产品 Meta VR Glasses 预计将于 2027 年春季上市，主要面向消费级高端用户和专业人士，这款产品也被视为 Meta
