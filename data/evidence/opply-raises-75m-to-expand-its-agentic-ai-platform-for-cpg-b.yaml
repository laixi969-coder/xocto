  fact: Opply , a company developing an AI-powered operating platform for consumer packaged goods (CPG)
    brands, has raised $7.5 million in a funding round led by Chalfen Ventures , with participation from
    Index Ventures, Anthemis, Entrepreneurs First, In This Together and Ventures Together. Founded by
    Helen Murphy and Martin Postel , Opply develops an agentic AI platform designed to automate operational
    processes for CPG brands, including sourcing, procurement, financing and supply chain management.
    By combining AI agents, proprietary data, an extensive supplier network and flexible financing options,
    the company aims to help businesses reduce costs, improve efficiency and scale their operations. Unlike
    platforms that primarily provide analysis or connect buyers with suppliers, Opply's technology is
    designed to execute operational tasks directly. Its AI agents can manage inventory, coordinate production
    and oversee deliveries, reducing the need for manual intervention. The company operates in
