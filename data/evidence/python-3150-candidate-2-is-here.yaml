  fact: "Python 3.15.0 candidate 2 is here!   \nHugo van Kemenade (release manager for Python 3.14 and\
    \ 3.15) announces the final release candidate for Python 3.15, scheduled for release in October: \n\
    \ \n Entering the release candidate phase, only reviewed code changes which are clear bug fixes are\
    \ allowed between this release candidate and the final release. [...] \n We  strongly encourage  maintainers\
    \ of third-party Python projects to prepare their projects for 3.15 during this phase, and publish\
    \ Python 3.15 wheels on PyPI to be ready for the final release of 3.15.0, and to help other projects\
    \ do their own testing. Any binary wheels built against Python 3.15.0 release candidates  will work\
    \  with future versions of Python 3.15. \n \n Back in 2021 I  found a bug in Python 3.10  by running\
    \ my test suites against it... but I hadn't done this during the RC period, so that bug had already\
    \ shipped! Since then I've always paid much closer attention to these RCs. \n The new RC isn't available\
    \ for GitHub Actio"
