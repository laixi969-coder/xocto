  fact: "「这仗打错了，最多是白烧几十亿；但如果不打，可能是生死问题。」 \n 这是创新工场联合首席执行官、管理合伙人汪华对大厂重金押注 AI 办公的判断。 \n 2026 年的这个夏天，中国科技巨头发起了\
    \ Agent 时代第一场「战役」：豆包工作正式发布，TRAE、扣子团队整体并入豆包体系。更早的 7 月底，飞书产品团队并入豆包；另一边，腾讯的 WorkBuddy 已经跑出了千万月活，阿里也在整合自己的桌面\
    \ Agent、云端 Agent 和钉钉能力。 \n 巨头为何会集体兴奋？AI 办公的背后他们在思考什么？在争夺什么？最近，极客公园邀请了汪华、Floatboat.ai 创始人兼 CEO 谭少卿一起来聊一聊。\
    \ \n 今年初那场「小龙虾热」，本质上只是一场极客的自我狂欢。谭少卿说，「它是个过渡产品」，属于三类产品分层中的「极客产品」，从一开始就没打算走大众化路线。模型不够强、配置门槛高、Harness\
    \ 不成熟，把普通用户挡在门外。 \n 真正的转折发生在最近几个月。汪华认为，国产模型是最近才真正跨过了那道坎。GLM-5.3-Flash、DeepSeek-V4-Flash 这些模型不仅把指令遵循能力做上去了，更关键的是把成本打了下来。\
    \ \n 现在，才是中国 Agent 爆发的真正原点。 \n 这里面有一个反直觉的逻辑：移动互联网时代，千万月活根本不值得巨头兴师动众，但这次大厂已经开始了一场「大会战」。 \n 汪华说，背后的驱动力是恐惧。年初\
    \ Claude Code 还没到千万月活时，ARR 就已经达到 200 亿美金了。这意味着，未来的高价值经济入口，可能不建立在高日活之上。法律、财务这类高价值的专业工作，一旦被 Agent 重新定义，丢掉的不是用户规模，而是整个赛道的船票。\
    \ \n 除此之外，还有另一个因素是算力。C 端产品比如豆包，算力负担极重，只能用压缩的小模型，所以「有时觉得它智障」；而 办公 Agent 恰好卡在一个理想区间，既能体现大模型真实能力，又不会因为用户规模过大导致算力扛不住，同时商业模式能跑通\
    \ 。 \n WorkBuddy 的火热，某种程度上是一场内部赛马的幸存者故事。「它是踩在众多失败项目的尸体上活下来的。」大厂采取的都是内部赛马策略，那些算力成本过高、商业模式不成立的项目自然死亡后，资源自动向幸存者倾斜。\
    \ \n 巨头进新战场，常被认为自带优势。但这次不一样。汪华说，「巨头唯一"
