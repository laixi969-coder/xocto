  fact: Apple is bringing an AI assistant to its suite of productivity apps , including Keynote, Pages,
    and Numbers. The assistant, which is built on AI models from Apple and OpenAI, can understand a document's
    context to perform tasks like designing, animating, and refining slides in Keynote. In Pages, Apple
    says the AI assistant can draft, restructure, and tweak written content. It can also calculate, visualize,
    and organize data in Numbers, while suggesting chart types and building custom tables. Keynote, Pages,
