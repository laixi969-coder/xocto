  fact: This week, I hosted the legendary Bill Gross, founder and chairman of Idealab, for a conversation
    with the Exponential View community about building businesses in the AI age. Bill recently founded
    Idealab.ai , which uses AI to explore vast spaces of potential business ideas, evaluate them against
    real-world problems, and help founders pressure-test and refine them. What stayed with me was his
    emphasis on iteration and speed. At Exponential View, we think about this a lot. AI can help generate
    ideas and handle more of the mechanics, but founders still need to listen to customers, exercise judgment,
    and adapt. Bill joked that he should have called his company “Iterate Lab.” Slides from the session
