  fact: 10 月 19 日，铭芯启睿（MemSilicon）宣布完成超 4 亿元 A 轮融资。本轮融资由博原资本领投，博世创投、创领资本、米哈游、中关村科学城公司、兆易创新等跟投，老股东复容投资、国开科创、恒裕资本、锦秋基金、顺禧基金、小米战投、中科创星持续加注。本轮融资将主要用于
    RRAM 的产业化与商业化，以及新产品 LPU 的研发。 MemSilicon 同时宣布， 前 Graphcore 总裁兼大中华区总经理卢涛加入团队，担任 CEO 和联合创始人。 公司战略全面升级：在继续推进阻变存储器（RRAM）产品化的基础上，启动面向大模型推理的第一代
    LPU 研发，打造「满血模型、高速 Token、越级性价比」的新一代推理引擎。 随着 Agentic AI 时代的到来，AI 落地已经从问答，转向完成复杂、长程的任务，下一步竞争的关键指标，会从峰值算力转向任务完成效率。
    一次任务包含多轮推理、工具调用和上下文复用，还可能启动多个 Agent 并行工作。客户需要的，不只是更多 Token，而是在保证质量的前提下，更快地解码和输出、更多任务能并行，并降低单次任务成本。
    这要求推理系统从架构层面进行创新，同时优化计算、存储、互联和调度。因此，存算协同被视为核心破局路径之一。 （图 1｜低延迟已是独立售卖的服务档位。数据来源：OpenAI） （图 2｜高速解码决定
    Agent 每一步走多快。在缓存能够有效保留的条件下，输入缓存命中率为 84.6%-99.5%，解码占 LLM 执行时间的 91.0%-98.6%。数据来源：arxiv2605.26297v2,
    Agentic AI Workload Characterization） 01 为什么是现在：大模型推理进入架构创新关键期 加入 MemSilicon 之前，卢涛已在芯片行业深耕 20 余年。
    他历任曦智科技副总裁、Graphcore 总裁兼大中华区总经理、Cavium 中国区总经理，长期聚焦 AI 基础设施核心组件，覆盖 Arm 架构服务器 CPU、DPU、RDMA 网卡、数据中心交换芯片、大
    SRAM 架构的 AI 处理器 IPU、基于 3D 堆叠 DRAM 的 NPU，及硅光芯片等多个领域，兼具技术、产品与市场的复合视角。 卢涛对 AI 时代的技术演进、产品逻辑、商业模式和客户需求有深刻洞察。他认为，大模型推理正在进入架构
