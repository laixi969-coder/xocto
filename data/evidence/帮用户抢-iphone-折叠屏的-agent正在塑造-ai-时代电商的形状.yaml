  fact: Shopify AI 交易订单增长了 13 倍。 10 月 16 日清晨，苹果第一款折叠屏手机 iPhone Duo 开启预购。1999 美元起售，首批产能紧张，没过多久交付日期就排到了明年
    1 月。 这一次抢首发的，不只是守在屏幕前的人。 今年 Agent 成为 iPhone Duo 黄牛最严厉的父亲｜图片来源：Apple 在 MacRumors 论坛上，一位没抢到的用户愤愤不平地吐槽，Reddit
    上有人在炫耀自己设置的 Muse 机器人一口气拿下了好几台，真人还没来得及点，库存就被 AI 扫走了。 Muse 是 Meta 在 9 月 8 日推出的个人 Agent，上线后一度登顶美区 App
    Store 免费榜，下载量很快超过 250 万。Meta 方面表示，购物已经成为 Muse 最主要的使用场景之一。就在 iPhone Duo 开售前后，Muse 还专门发了新版本适配这台新机，更新说明里紧跟着的一句，是让聊天里的购物变得更方便。
    AI 替人购物，已经从发布会上的演示，走进了真实的抢货现场。 但并不是每家商店都欢迎这些新顾客。 9 月下旬，亚马逊开始封禁 Muse。 到了 10 月，马斯克旗下 Grok Bot 的用户在亚马逊下单时，也撞上了同一句警告，未经授权的
    AI 代理继续访问，违反亚马逊的使用条款。 另一家公司，Shopify，则走了完全相反的路。9 月 21 日，Shopify CEO Tobi Lütke 宣布与 Muse 深度合作，让 Muse
    可以用 Shop Pay 在所有 Shopify 店铺完成结账。 而 Shopify 的财报，已经给出了这条路的早期回报。 今年一季度，来自 AI 搜索的订单同比增长接近 13 倍，AI 带来的店铺流量增长
    8 倍 。 一边关门，一边开门。 当越来越多的购物决定交给 Agent，「让不让 Agent 进门」，会不会成为 AI 时代电商排位的关键变量？ 01 13 倍增长背后的空间 Shopify 是这一轮
    AI 购物热潮里最积极的「玩家」。 2025 年四季度，它报出 AI 驱动的订单增长 15 倍。2026 年一季度，AI 带来的店铺流量同比增长 8 倍，AI 搜索产生的订单增长接近 13 倍，而且来自
    AI 搜索的新买家订单，增速接近传统自然搜索的两倍。同一个季度，Shopify 交出了四年多来最快的
