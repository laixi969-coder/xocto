  fact: "最近， 一个叫 Jev 的 AI 模型突然在开发者圈子里炸了。更可怕的是，根据最新消息，Jev 最近正在洽谈 10 亿美元融资，最新估值 100 亿美元——而这距离 Jev 推出，还不到\
    \ 1 个月。 \n Jev 这个新模型，它不生成文本，不跟你聊天，甚至不写代码。你给它一段数据和一组结构化问题，它返回类型化的答案和校准过的概率值。TypeSafe AI 管它叫「System\
    \ One 模型」，一种全新的模型类别。9 月 15 日发布早期访问版本的同时，公司宣布获得 DCVC 领投的 4000 万美元种子轮融资，估值 2 亿美元。 \n 开发者社区很快炸开了锅。TypeSafe\
    \ 公布的数据显示，在分类任务上 Jev 比 GPT 系列快约 193 倍、便宜约 445 倍。Vercel CEO Guillermo Rauch 测试后说，在 p95 延迟上 Jev 比 GPT\
    \ Luna 快 18 倍，而且更准。LangChain 第一时间写了集成指南。 \n  但真正让 Jev 值得关注的，不是这些数字，而是它背后的人和他的判断 。 \n Jev 的创造者 Diogo\
    \ Almeida 曾在 OpenAI 工作近四年，是 GPT-4、ChatGPT 以及 RLHF/InstructGPT 的合著者。 他所在的团队基本上发明了「后训练」这个概念。换句话说，今天几乎所有大语言模型背后的核心训练范式，都有他的手笔。\
    \ \n 而在 Jev 发布前六周，Almeida 在 AI Engineer 大会上做了一场 18 分钟的演讲，标题叫「 What's Next After RLHF ?」。 \n 他在台上说，自己是\
    \ OpenAI 内部少数公开「黑」ChatGPT 的人；他认为 ChatGPT 和 Claude Code 属于同一个时代； 他相信整个行业终将把 RLHF 时代视为一段「奇怪的弯路」 。 \n\
    \ 一个技术范式的缔造者，亲手给自己创造的时代写悼词，这种事不常发生。 \n  以下是演讲中的一些核心观点 ： \n \n  「下一个时代不是 Claude Code 时代。ChatGPT 和 Claude\
    \ Code 属于同一个时代。」  \n  「为什么所有 LLM 都需要人类在回路中？因为我们就是把人类放进了回路里。」  \n  「无论模型有多错，它都会看起来是对的。」  \n  「我们只是在自动化『写软件』"
