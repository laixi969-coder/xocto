  fact: 曝黄仁勋考虑重返英伟达担任 CEO，盟友正施压董事会 据英国《金融时报》周日报道，黄仁勋正考虑重返英伟达担任首席执行官。如今他在硅谷的多位盟友正向英伟达董事会施压，要求公司重新任命他。 报道称，黄仁勋已经和亲信讨论了重返公司的可能性。与此同时，英伟达董事会还在开展独立调查。
    一位黄仁勋的盟友表示，他们正在组建一个由硅谷高管构成的「作战室」，游说黄仁勋重返英伟达，并计划争取白宫方面支持。该人士透露：「除了那些前沿 AI 实验室外，科技界所有大腕都爱戴黄仁勋。」他还补充称，这些行动得到了黄仁勋本人的支持。
    不过，与其他创始人、CEO 不同，黄仁勋并没有英伟达的控股股份，因此无法推翻董事会任何决定。（来源：IT之家） 传苹果计划明年 WWDC 发布首款智能眼镜 据彭博社记者 Mark Gurman 披露，苹果计划在
    2027 年 6 月举行的 WWDC 全球开发者大会上发布首款 AI 智能眼镜，并于当年年底前正式上市。这款产品内部代号为 N50，目前硬件设计已基本定型。 外观方面，苹果智能眼镜比 Meta 第二代
    Ray-Ban 智能眼镜更加纤薄，摄像头直接集成在镜框内部，没有明显凸起。苹果还准备了多种款式和配色，并重点优化音质、传感器及佩戴体验。 与传统 AR 眼镜不同，苹果首代智能眼镜不会显示增强现实画面，而是以
    AI 语音助手 Siri 为核心，通过摄像头感知周围环境，实现建筑识别、实时翻译、导航指引等功能。 硬件方面，原型机运行精简版 visionOS 28 系统，搭载基于 Apple Watch 芯片开发的处理器，支持
    Wi-Fi 连接及磁吸充电，甚至可以边佩戴边充电。 值得注意的是，苹果智能眼镜并非完全独立的设备，需要搭配较新款 iPhone 使用，不支持 Android 手机。复杂的计算任务主要由 iPhone
    承担，开发者也无需专门开发眼镜应用。（来源：快科技） OpenAI 撤销独立机器人研究团队 近日，OpenAI 向《财富》确认，已经撤销独立机器人研究团队。 原机器人研究人员进入首席研究官 Mark
    Chen 领导的核心研究部门，机器人应用和硬件人员则转入总裁 Greg Brockman 负责的 Applied 部门。 公司表示，机器人仍是其长期技术愿景的重要组成部分，此次调整是为了加快研发进度。
