  title: 使用 CodeX 开发的网站，为什么百度和谷歌都不收录？
  published_at: '2026-11-16T01:44:23Z'
  collected_at: '2026-11-16T02:08:16Z'
  source_kind: product
  tier: independent
  fact: "最近使用 CodeX 开发了一个网站，叫包装大王，是做包装设计的，已经上线一个月了，但是百度和谷歌都无法通过网站名搜索到网站，在百度里甚至搜索 site：baozhuangdawang.cn\
    \ 都没有结果（网址就是我的网站域名）\r\n尝试了很多办法，比如在百度收录里主动提交网址、更新站点地图、设置网站关键词等等，能想到的办法全部试过了，但网站就是搜索不到。\r\n后来病急乱投医，心想难道是这个域名不对？于是把域名改成了\
    \ https://baozhuang.online，但还是一样，不收录。\r\n域名是通过 Cloudflare 解析的，代码也都布署在 Cloudflare 上，并没有禁止搜索引擎收录。\r\n\
    自己通过 AI 研究这个问题，大半个月了也没解决，所以来请教大佬们，请问这是怎么回事呢？"
