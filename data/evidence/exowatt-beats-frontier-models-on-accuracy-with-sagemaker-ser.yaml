  fact: Exowatt builds modular, dispatchable solar systems that deliver reliable power for energy-intensive
    applications such as AI data centers. Its flagship product, the Exowatt P3, captures solar energy
    through optical lenses, stores it as heat in a long-duration thermal battery, and dispatches electricity
    on demand through a heat engine. Unlike grid-tied photovoltaic solar systems, P3 powers data centers
    directly behind the meter, helping data centers come online without waiting in multi-year grid interconnection
    queues. Exowatt builds a fleet of AI agents that monitor and triage live alarms and support operational
    decisions for solar systems, often at the edge, with limited or no connectivity. As its fleet scales
    from test benches toward manufacturing and thousands of deployed field units, the intelligence layer
    that operates these systems must scale with it. In this post, we show how Exowatt used Amazon SageMaker
