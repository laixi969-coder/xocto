    50% 的时间都在电脑桌前，只做三件事：看视频、玩游戏和听音乐」 ，这是一个被传统厂商忽略的场景，而他们对进入这个市场有足够的自信。    为了「刺激苹果出彩色版 AirPods」而特意选择的黑色版本，以及
