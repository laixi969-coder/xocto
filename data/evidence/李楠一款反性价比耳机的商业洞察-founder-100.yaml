  fact: 本文首发于 Founder Park 公众号 · 2022 年 11 月 15 日   对于怒喵科技的创始人 & CEO 李楠来说，从魅族科技出来之后，成立怒喵科技（Angry Miao）的初衷其实就是想做耳机，
    「研发人员预计耳机的研发需要 12 个月，但我估计需要 18 个月。由于在这 18 个月里我们不能无所事事，所以才做了键盘。」 结果，他们最终花了两年的时间研发这款耳机。     这是一款从价位和功能上都与别的
