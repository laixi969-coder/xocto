  fact: 'The last year has seen incredible progress in model capabilities in certain domains — most notably
    programming , mathematics , and cybersecurity . Yet the real-world impact of these breakthroughs has
    been surprisingly modest — especially outside of those professions. Lawyers, architects, salespeople,
    college professors, and others are certainly using AI models in their work, but AI models don’t seem
    close to transforming those professions the way they seem to be transforming mathematics and computer
    programming. And even in the software industry, we’re not seeing the kind of mass unemployment many
    people expected we would see once AI models reached human capabilities. A big question is why — and
