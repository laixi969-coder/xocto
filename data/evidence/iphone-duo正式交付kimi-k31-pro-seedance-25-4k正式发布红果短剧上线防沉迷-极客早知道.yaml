  fact: 苹果首款折叠屏手机 iPhone Duo 正式交付用户 部分订单预计明年 1 月才能送达 苹果首款折叠屏手机 iPhone Duo 于 2026 年 10 月 23 日正式进入上市交付阶段，首批预购用户开始收到新机，苹果零售店也迎来首发日消费者。由于预购需求强劲，加上生产供应受到限制，上市初期的现货数量相当有限，部分消费者即使在首发日下单，也可能需要等待数月才能拿到设备。
    苹果此前表示，iPhone Duo 的预购需求表现异常强劲，公司正在努力尽快将产品交付给消费者。苹果同时确认，全球 Apple Store 门店会提供少量供现场顾客购买的库存，但提醒消费者，这些现货可能很快售罄。对于希望不经预购、直接前往门店购买的用户来说，能否买到新机仍存在较大不确定性。
    这次供应紧张，与 iPhone Duo 在预购阶段迅速售罄的情况相吻合。预购于 10 月 16 日开启后，部分配置的预计发货时间很快被推迟。此后，苹果官网显示的新订单交付日期进一步延后，部分订单的预计送达时间已经排到
    2027 年 1 月 25 日左右。这意味着，首发需求与现有供应能力之间仍存在明显差距。（来源：cnBeta） 曝 DeepSeek 最快明年推进 IPO，联想系入局 DeepSeek 新一轮融资
    据外媒援引知情人士消息，DeepSeek 新一轮融资引入多家产业及财务投资者，其中包括君联资本（Legend Capital）、专注半导体领域的石溪资本及吉利等。与此同时，DeepSeek 已聘请中信证券为其
    IPO 提供顾问服务，并于今年 9 月引入新的首席财务官，DeepSeek 最快可能于 2027 年初推进 IPO。 君联资本与联想集团同属联想控股体系。联想集团是联想控股旗下核心产业公司，君联资本则是其重要投资平台。此次君联资本参与
    DeepSeek 融资，也意味着联想系资本正式进入 DeepSeek 股东阵营。 从产业协同来看，此次投资进一步拉近了联想系与国内头部大模型厂商之间的关系。联想目前的 AI 业务已经覆盖 AI 终端、企业
    AI 和 AI 基础设施多个领域，其中 AI PC、手机、平板等终端需要持续接入大模型能力，企业 AI 业务依赖模型、智能体与行业解决方案结合，服务器及数据中心业务则承接模型训练和推理带来的算力需求。
