  fact: 在模型飞速演进的 2026 年，硬件世界反而开始告别「爽文叙事」。 前两年聊 AI 硬件，行业里经常讨论做出一个取代智能手机的「下一代超级入口」的终局命题。听着很过瘾，但真干起来才发现，做硬件这事儿，哪有那么多一步登天。
    今年，气氛明显不一样了。 创业者们扎进一个个具体的生活场景里，一批新形态的产品，正在一些新场景里逐渐成为共识。 所以，今年跑得最快的几个方向，都没有「下一代入口」那么性感的叙事，但又都挺有意思：
    健康可穿戴 AI 加入后，原本冰冷的身体信号，变成了普通消费者随时能看懂的身体状态、训练指导和睡眠建议。可穿戴，正在从记录仪变成随身教练。 录音卡 录音也正在从单纯的「存储」，向可以随时调取的个人记忆，甚至工作助手演进。以至于行业已经开始讨论，这类可以在特定场景里采集大量物理世界上下文的设备，也许会成为
    Personal Agent 的第一个硬件形态。 墨水屏 一个典型的「反参数叙事」品类。彩墨屏技术的成熟，加上开源插件生态的繁荣，墨水屏从阅读器，演进出了 AI 画框、桌面信息板、影像相纸、手机背屏等一众形态。靠低打扰、常显的纸感体验，长出了完全不一样的功能和情绪价值。
    Maker 工具 拓竹、xTool 和一众桌面 CNC、UV 打印机，让桌面制造逐渐破圈。搭上 AI 建模之后，这些桌面 Maker 工具开始成为硬件开发者在物理世界里的「Vibe Coding
    工具」。在自己书桌上，就能把脑子里的点子快速变成实物。 所以，如果你也对硬件世界正在发生什么、以及藏在里面的新机会充满好奇——今年极客公园创新大会期间，我们专门准备了一场「硬件与 Maker」小场深谈，邀请到了
    3 组在硬件行业的创业者，跟你聊聊 3 个当下行业的新问题： 新图纸：找到硬件领域 最大的「新供应链」 以前做消费硬件，大家比拼的是一套很成熟的传统供应链：谁能拿到更好的传感器、更小的电池、更精密的模具，谁就能做出更有竞争力的产品。
    但 AI 加入之后，硬件世界里突然多了一个全新的、而且变化极快的「新供应链」——模型和智能能力。它带来的冲击，远远不止给老产品加个语音助手这么简单。 在智能影像赛道里，一连串新问题正在涌现： 以前相机拍完，素材是直接给人看的；以后，素材会不会先给
    AI 看，经过 AI 理解和剪辑，再把最终结果交给人？影像本身会不会逐渐「传感化」？…… 聊这个话题，我们把影石
