  title: 疲惫的前额叶（脑门子）
  published_at: '2026-11-24T02:15:41Z'
  collected_at: '2026-11-24T06:02:44Z'
  source_kind: product
  tier: independent
  fact: "> *AI 扩展了我能够同时推进的任务数量，却没有等比例扩展我的注意力、记忆力和认知调节能力。*\r\n\r\n# 累\r\n\r\n眼酸、头皮紧、脑袋的中心明显靠前（感觉脑门比后脑勺重），坐电脑前两三个小时感觉比以前上一天班都累，应该不只我一个人有这种感受。\r\
    \n\r\n以前写代码的时候，可能连续几个小时只关注或者主要关注一个需求/bug，即便期间涉及和其他人的讨论、上网查资料、翻 stack overflow，并不是纯粹在 vs code 里看/写代码，但始终是在一个主线上，注意力是相对集中的。\r\
    \n\r\n但 2026 年以来，随着模型能力越来越强，好用的 Agent 越来越多，我使用 AI 的强度也随之增大，具体表现在数量飙升的 GitHub commits 和 pr，在非常短的时间里，经历了“掌握”多任务并发能力的从兴奋，到沉迷，再到疲惫的过程。\r\
    \n\r\n我可以同时让几个 Agent 做需求分析、技术调研、样式设计、功能实现，我需要做的就是下达指令、提供授权、验收成果和思考如何优化流程。\r\n\r\n这期间的直观感受是工作推进很快，特别是几个\
    \ session 同时亮起小绿点时，那种即将逐个验收成果的期待感和盲目的满足感，和游戏里抽卡一样上头，那个时刻应该有很多多巴胺在分泌。\r\n\r\n但结果通常不如人意，抽卡嘛，歪是常态，这个时候就得调整心态，看看哪儿不合适，重新写写提示词再抽一轮，然后换到另一个\
    \ session 里进行上述动作，有时候得想着将重复的劳动做成自动化或者沉淀为 skill，一边调教一边寻找优化 workflow 的空间。\r\n\r\n一天的时间很快就过去了，沉浸式 vibe\
    \ 的时候，时间的流速和打游戏的时候是一样的，但打游戏不累，打玛莲妮亚和杨戬死 10 次重新打我都不累，但 vibe coding 一天下来是真累。。。\r\n\r\n# 注意力磨损/残留/负荷\r\
    \n\r\n起初我觉得是中间缺少休息了，比如 45 分钟课间休息 10 分钟或许会好一些，以及我可能不应该同时处理几个项目，毕竟我不是 MacBook 没有 10 个核，于是我开始尝试没 45 分钟起来走走，并且控制并发数在\
    \ 3 个。但效果并不明显，还是同样很容易感到疲惫。\r\n\r\n于是我咬咬牙，克制自己在等待模型响应时去处理其它任务的冲动，等的时候就想眼前的事情或者发呆，这半天就干一件事情，效果很显著，从\
    \ 9:30 到 11:50，中间起来活"
