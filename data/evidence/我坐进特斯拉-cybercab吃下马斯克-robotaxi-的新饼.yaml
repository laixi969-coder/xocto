  title: 我坐进特斯拉 Cybercab，吃下马斯克 Robotaxi 的「新饼」
  published_at: '2026-09-16T05:35:49Z'
  collected_at: '2026-09-17T00:33:01Z'
  source_kind: market_signal
  tier: independent
  fact: "2013 年 9 月，苹果推出了新品 iPhone 5S 手机，这款手机除了延续苹果在智能手机上一往无前的势头外，新增的金色配色，深受大众喜爱，并获得了「土豪金」的称号。 \n 2026\
    \ 年 9 月，特斯拉也发布了一款「土豪金」产品——不是Space Phone，而是特斯拉 Cybercab，用于 Robotaxi 的无人驾驶电动车。 \n   \n 「土豪金」Robotaxi\
    \ 来了！｜图片来源：极客公园 \n 特斯拉不是第一个做无人驾驶车的，但是彻底拿掉方向盘、加速、刹车踏板和后视镜，完全用第一性原理做出Robotaxi 车型的，特斯拉显然又引领了潮流。尤其是，这样的\
    \ Cybercab 已经在美国得州奥斯汀真的开始「拉客」了。 \n 虽然不知道特斯拉的 FSD 什么时候进入中国，但是不到两周，极客公园就在国内亲自体验了 Cybercab，狠狠吃下马斯克给大家画的「新饼」。\
    \ \n    金色「缝合怪」  \n 北京蟹岛特斯拉交付中心，就在交付大厅内，团队搭了一个简单的摄影棚。在轮胎与地面摩擦声中，极客公园看到了那台金色的 Cybercab。 \n 不知道是不是因为刷了太多关于\
    \ Cybercab 的视频，第一眼看到 Cybercab，并没有特别令人惊艳。毕竟，这是一台 4 米 4 的双座小车，不过金色的配色，让这台车从一种新能源车中跳脱出来。 \n   \n Cybercab\
    \ 有点「缝合怪」的意思｜图片来源：极客公园 \n Cybercab 看起来非常像一台缝合怪，车的前半部分和焕新版的 Model 系列很像，尤其是封闭式前脸加上中间的贯穿式灯带。但是从中间到后部，一道斜向下的平直溜背，则让人一眼就想到了\
    \ Cybercab 的大哥——Cybertruck，配合中间的腰线，把 Cybercab 的「硬」给体现了出来。 \n \n \n \n \n   \n \n \n   \n \n \n \n\
    \ \n 前面是 Model 的圆润，后面是 Cybertruck 的硬朗｜图片来源：极客公园 \n 虽然看起来很低调，但是 Cybercab 的开门方式却相当高调。蝴蝶门的开门方式，按下车内按钮，\
    \ 车门斜向上开启，让人感到自己坐的不是一台网约车，而是超级跑车 。 \n   \n Cybercab 的蝴蝶门看起来非常炫酷｜图片来源：极客公园 \n 不夸张的说，Cybercab 的开门方式，甚至比\
    \ Model X 的鸥翼门开启方式更酷。当"
