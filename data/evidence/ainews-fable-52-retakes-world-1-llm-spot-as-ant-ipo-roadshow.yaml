    per million input tokens and $50 per million output tokens. Fable 5.2 costs $8 and $40 . Yet on GDPx,
    a benchmark of professional tasks, SemiAnalysis paid $88.15 per task, up from $67.16 . The run logs
    give a clue. Where Opus 5.5 and Fable 5.1 would try about 20 test cases, 5.2 sometimes wrote hundreds
    or thousands and spun up subagents to check its work independently. All that checking helped Fable
