  url: http://www.geekpark.net/news/369768
  title: 成立不到一年连融三轮，这个睡眠 AI 产品「火」了
  published_at: '2026-09-03T06:05:37Z'
  collected_at: '2026-09-03T14:36:52Z'
  source_kind: market_signal
  tier: independent
  fact: "头图来源：Fullive.ai \n 一家成立几个月、第一款产品即将量产的 AI 硬件公司，已经连续融了三轮：高瓴连续三轮加注，智元机器人等机构先后进入股东名单；到了今年 7 月，招商局创投又领投了它的新一轮融资。\
    \ \n 这家公司叫 Fullive.ai，创始人郑昊本科就读于清华数学系，此后一路跨过生物统计、因果推断、AI、医学和硬科技投资；联合创始人韦骁龙来自北大计算机，此前曾在华为、荣耀负责消费电子产品。团队里还有参与过华为手环、WHOOP\
    \ 等穿戴设备的硬件人员，以及来自百度、大疆等公司的算法和商业化老兵。 \n Fullive.ai 把第一款产品放在了床头。 \n 它叫 Somni，是一款面向高压脑力人群的睡眠硬件。外形上，它不像传统健康硬件，更像一个安静的床头设备：没有屏幕、不需要佩戴，也不要求用户在睡前再学习一套交互。通过毫米波雷达、麦克风阵列和环境传感器，感知人在夜里的呼吸、心率、体动以及卧室环境，再用声音、光线、气味等神经系统调节方式帮助用户更快入睡、减少夜间醒来，并在早晨完成自然唤醒。\
    \ \n 睡眠当然已经是一个拥挤的硬件市场。 \n 手环、指环和床垫越来越擅长告诉人们昨晚睡得怎么样，助眠灯、耳机和眼罩也在尝试用声音、光线或触觉让人睡得更好。但这两件事之间，其实一直隔着一个很难解决的问题：\
    \ 知道你没睡好之后，机器到底能做什么？更重要的是，它怎么知道自己做对了？  \n 这正是 Somni 想解决的问题。它其实是一套会在连续夜晚中学习用户响应的闭环系统。 \n 如果前一晚的一套声音和灯光没有达到预期效果，Somni\
    \ 会根据用户整晚的生理变化，重新调整下一晚的方案；反过来，如果某种干预有效，这次身体反馈也会成为之后调整的依据。 \n 郑昊把每个夜晚都看作一次持续发生的「小型实验」：观察一个人处在什么状态，尝试一次干预，再看身体发生了什么变化。如此循环，设备才有可能慢慢摸清，对这个人来说，什么方法真的有用。\
    \ \n 这也是 Fullive.ai 做 Somni 更深一层的原因。 \n 在郑昊看来，今天大量健康硬件已经很擅长「监测人」，但如果 AI 想进一步参与人的健康管理，仅仅知道一个人的心率、呼吸和睡眠分期还不够。它还需要理解，当外部世界发生变化时，人的身体会怎样跟着变化。\
    \ \n 从一台放在床头的睡眠设备开始，Fullive.ai 想让 AI 学习的，正是这种「响应」。这家年轻公司"
