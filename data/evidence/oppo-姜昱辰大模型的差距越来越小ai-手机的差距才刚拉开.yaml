  title: OPPO 姜昱辰：大模型的差距越来越小，AI 手机的差距才刚拉开
  published_at: '2026-09-25T01:50:25Z'
  collected_at: '2026-09-26T00:38:20Z'
  source_kind: market_signal
  tier: independent
  fact: "小布、ColorOS 17 与「AI 硬件」 \n \n  作者｜张勇毅  \n  编辑｜郑玄  \n \n  「以意图驱动的手机就是 AI 手机。用户说一句话，手机就能把事情办了，不需要再打开\
    \ APP、反复点击。」  \n 这是 OPPO ColorOS 智慧产品研发总监姜昱辰，给 AI 手机下的最新定义。她也用这把尺子量了一遍市面上的产品，包括 OPPO 自家的，结论是现在没有一台手机可以称为\
    \ AI 手机。 \n 但做出这样一台手机，正是 OPPO 的目标。 \n 如果按姜昱辰的标准，这个行业连及格线都没碰到，那过去四年各家砸下去的东西，未来会如何在手机体验上体现出差别？ \n OPPO\
    \ 的答案可以压缩成一句话：不去和大模型公司争云端的模型，把核心能力压在端侧。 \n 它要的是把手机做成一个真正的 Personal AI：先理解你、记住你，再由 AIOS 和 Agent「主动」替你把事情办掉。\
    \ \n \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n    战略选择    \n \n 这套东西的骨架，是 OPPO 去年公布的三大技术战略：记忆是核心，端侧模型是基础，AIOS\
    \ 是运行层。三层叠起来，组成了 OPPO ColorOS 的 AIOS 蓝图。 \n 至于上面的那个问题，姜昱辰认为差别不在模型里。恰恰因为模型这一层的差距正在消失，手机之间的差距才刚开始拉开。\
    \ \n 云端大模型这个行业本质上更像「供电厂」： 云计算是基础设施，模型算法相当于发电技术，而发电技术很难长期保持差异化。 行业里的做法大体是公开的，所以体验趋同不是某一家的失误，而是一个必然的结果。某家短期领先，「过两天可能肯定就是又拉齐了」。\
    \ \n 但如果智能最终像电一样随时可取，买电的人靠什么彼此区分？ \n OPPO 的选择是在 2025 年初定下来的：那次战略讨论形成的共识是端侧模型坚持自研，云端基座主要是接入开放多元的基础模型生态。自研云端基座也认真考虑过，但最后的判断是：「端侧模型可能是我们的事，但自研云端大模型不一定是我们的事。」\
    \ \n \n   从模型到应用，生态一直是 OPPO 在规划 AI 手机时重点考量的因素｜图片来源：ODC2026  \n \n   \n 这是从「什么样的手机才配称为原生 AI 手机」倒推出的结果。答案是能深度理解用户意图、不需要你一个个去点\
    \ App；而要做到这件事，最缺的是这台手机"
