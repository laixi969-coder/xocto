  title: 一口气用 GPT-6 Astra 做了 10 款小游戏，欢迎来玩
  published_at: '2026-09-20T07:50:00Z'
  collected_at: '2026-09-21T00:16:50Z'
  source_kind: product
  tier: independent
  fact: "上个月升级了 pro 20x ，tibo 又不断给重置，生产力爆棚，token 无处可去，决定做些小游戏。\r\n\r\nhttps://tz100.com  已上线的 10 款小游戏全部使用\
    \ GPT-6 Astra 完成（包括站点也是）。总共消耗了大约 20x 的两个周额度\r\n\r\n其中五子棋和象棋支持在线开房联机。乒乓球也做了联机，但是测试对网络要求太高，上线关闭了联机功能。\r\
    \n\r\n晴湾防线（ https://tz100.com/zh/games/sunharbor-defense ） 致敬（模仿）了我非常喜欢的一款古老 flash 塔防游戏，不知谁能看出来。\r\
    \n\r\n所有游戏大多反复调试，达到可玩级别，非几句话许愿完成，欢迎来玩，提提意见。"
