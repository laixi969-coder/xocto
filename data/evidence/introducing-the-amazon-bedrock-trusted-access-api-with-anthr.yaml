  fact: Today we are announcing the general availability of the trusted access program API on Amazon Bedrock
    . The API gives you one place to discover, request, and enroll in model provider trusted access programs.
    We are also announcing the public preview of the first two offerings, Anthropic’s Enterprise Frontier
    Safeguards (EFS) and Enterprise Data Controls (EDC). Both are available on Amazon Bedrock, including
    Claude Fable, Claude Mythos, and Claude Opus 5.5 and Sonnet 5.5 used through the Cyber Verification
    Program (CVP). Frontier AI labs require stricter safety monitoring policies to their most capable
    models, and those policies still apply on Amazon Bedrock. For eligible customers, model providers
    also offer customers more control on how those policies are met, such as where retained data is stored
    and how it is reviewed. Each offering has its own terms, approvals, and settings. The Amazon Bedrock
