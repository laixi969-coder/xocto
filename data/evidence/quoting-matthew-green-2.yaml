  fact: 'Everyone is very concerned about being respectable, so I’m going to be the goofball who raises
    worst-case possibilities. I think there is a 1% chance we live in Minicrypt, and a 15% chance we functionally
    lose confidence in our existing public-key encryption algorithms. [...] The problem here is that the
    speed of AI producing surprises, and the speed of human beings replacing standards (even with the
    very best AI assistance) are just orders of magnitude different. You only recover from a surprise
    like this if you do the preparation in advance. — Matthew Green , on Twitter. I looked it up and Minicrypt
    is Russell Impagliazzo’s hypothetical world in which public-key encryption is impossible. Tags: ai-security-research
