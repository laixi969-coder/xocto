  fact: "传   Manus 即将完成 5 亿美元融资，估值 40 亿美元  \n 据彭博社 9 月 17 日报道，AI 智能体公司 Manus 即将完成 5 亿美元融资。这是该公司撤销 Meta\
    \ 收购交易后的首轮融资。 \n 报道表示：在新一轮融资中，Manus 的估值将提高一倍，至 40 亿美元。这家 AI 智能体公司也将成为该领域中国估值最高的创业公司。 \n 知情人士称，谈判仍在进行中，交易条款仍可能变化。\
    \ \n Manus 的现有投资方包括腾讯控股、红杉中国和真格基金。截至发稿，Manus、腾讯、红杉中国和真格基金均未回应置评请求。（来源：凤凰网科技） \n   \n  地瓜机器人宣布完成 4\
    \ 亿美元 C 轮融资  \n 9 月 17 日，地瓜机器人宣布完成 4 亿美元 C 轮融资，由国际知名投资机构未来资产领投，资方数量接近 30 家。 \n 本轮是标准的 club deal，距上一轮仅过去\
    \ 5 个月——今年 4 月，地瓜刚完成 2.7 亿美元的 B 轮融资。今年以来，地瓜累计融资近 50 亿元人民币。 \n 地瓜机器人方面没有披露具体投后估值，但据了解，目前估值与最受捧的几家具身明星基本同一梯队。\
    \ \n 根据融资用途推测，本轮融资后具体的发力点是面向具身的高算力 560 TOPS 旭日 S600 芯片，以及从数采、模型训练、仿真验证到推理部署的全链路软件平台。（来源：投中网） \n  \
    \ \n  黄仁勋：英伟达 2027 年芯片销量将翻倍  \n 9 月 17 日，英伟达 CEO 黄仁勋在英国的一场人工智能活动中表示，英伟达明年芯片销量将是今年的两倍。 \n 近期一些业界人士主张放缓\
    \ AI 开发进度，以便让安全措施跟上步伐。黄仁勋表示，人工智能安全至关重要，企业应继续快速推进，如果认为某些产品存在安全隐患，就暂缓推出这些产品。（来源：第一财经） \n   \n  传苹果自研\
    \ AI 服务器芯片，有望 2029 年登场  \n 近日，科技媒体 The Information 称苹果公司正筹划推出企业级服务器，采用自研芯片，并可能接入英伟达的网络设备。 \n The Information\
    \ 的报道表示，苹果计划面向 AI 开发者、企业和政府机构销售这款服务器。产品目前考虑推出两个版本：基础版配备两颗计划中的 M8 Ultra 芯片，高配版则配备四颗。并且，苹果考虑用英伟达的 NVLink\
    \ Fusion 连"
