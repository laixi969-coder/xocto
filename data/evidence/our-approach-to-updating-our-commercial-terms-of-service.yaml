  fact: We recently announced that the proposed updates to our commercial terms of service have been put
    on hold and that we will revise those proposed changes after a deeper consultation with stakeholders.
    We made this decision after hearing concerns from news publishers and other stakeholders about how
    the proposed updates apply to our web crawlers. Meta follows the industry standard robots.txt mechanism
    as described in our web crawler developer doc. Today, we want to share more details on how we are
    approaching this consultation with publishers and others. A phased approach We have defined three
    phases for the consultation to provide us time to listen to feedback, work through that feedback in
    order to refine/modify the planned updates, and give stakeholders an opportunity to consider and discuss
    any revisions. Listening to stakeholders. Our initial engagement phase is designed to listen to stakeholder
