  tier: independent
  fact: 'A weir is a low barrier built across a river or stream that controls the flow of water. Think
    of it as a small, purpose-built wall that water flows over the top of, rather than through. Weirs
    serve two main jobs: they raise the water level upstream, and they allow engineers to measure exactly
    how much water is flowing through a channel.'
