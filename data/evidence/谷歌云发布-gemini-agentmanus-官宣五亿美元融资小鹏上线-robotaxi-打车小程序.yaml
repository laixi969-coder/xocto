  fact: "谷歌云发布 Gemini Agent，支持多种 AI 模型  \n 10 月 8 日，谷歌云在 Gemini at Work 2026 发布会上宣布，面向企业客户推出 Gemini 智能体（Gemini\
    \ Agent）。这款产品定位「通用工作智能体」，支持 Gemini Enterprise 、Workspace 以及第三方服务。 \n 谷歌表示，Gemini Agent 只需要用户给出目标就能完成工作，支持回答问题、处理知识型工作、创建媒体内容，以及编写程序。\
    \ \n 除了充当个人助理之外，Gemini 智能体还可以用作「团队成员」。它可以在团队中担任 PM、财务分析师等。 \n 目前，该智能体支持 Gemini 和 Claude 模型，未来还将兼容各种闭源、开源模型。官方将提供\
    \ API，让开发者将 Gemini Agent 集成到第三方应用中。（来源：IT之家） \n   \n  Manus 官宣 5 亿美元新一轮融资  \n 10 月 8 日，Manus 母公司蝴蝶效应宣布于近日完成超过\
    \ 5 亿美元新一轮融资。本轮融资由博裕投资、IDG 资本领投，老股东腾讯、红杉中国、真格基金继续加持。 \n 这距离 Manus 于 9 月 1 日正式宣布恢复独立运营，还不到一个月。据接近 Manus\
    \ 的人员透露，经历了诸多波折之后，团队变动不大、状态稳定，主要注意力依然集中在产品研发上。另据相关人士透露，本轮融资目标估值约 40 亿美元。 \n 创始人兼 CEO 肖弘在 9 月 28 日新产品发布后的感慨，为这段经历留下了一个注脚。「我原来以为我们的旅程只是一个注释就结束了，没想到也许有机会书写一个章节。如果有机会一起就太好了。」（来源：腾讯科技）\
    \ \n   \n  小米汽车澎程系列首销月锁单量破 7 万台  \n 10 月 8 日，小米正式公布小米汽车「澎程」系列上市首销月的官方锁单数据：截至 10 月 7 日，小米澎程 N70、N90\
    \ 系列累计锁单量破 7 万台。 \n 值得注意的是，这一数据在 1—8 月增程市场萎缩近 20% 的背景下出现的。 \n 10 月 1 日，雷军曾表示，小米澎程 9 月当月交付已破万，直接拉动小米汽车\
    \ 9 月整体交付量突破 4 万台。此前，小米汽车多月销量维持在 3 万台级别。 \n 业内认为，随着四季度产能进一步爬坡，小米澎程系列有望推动小米汽车交付规模再上新台阶，同时加"
