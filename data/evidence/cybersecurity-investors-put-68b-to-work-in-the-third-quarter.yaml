  fact: It’s an insecure world out there, and investors are responding by scaling up their cybersecurity
    spending. For the third quarter of 2026, global cybersecurity- and privacy-focused startups pulled
    in a total of $6.8 billion, per Crunchbase data. That’s up about 50% from the prior quarter and tied
    for the highest quarterly tally in years, as charted below. The funding bump was due to larger rounds,
    not more of them. Round counts actually declined sequentially across all stages last quarter, Crunchbase
    data shows. Biggest cybersecurity fundraisers AI startups accounted for the overwhelming majority
    of cybersecurity funding, with a particular focus on identity security. Overall, at least 18 companies
    at the intersection of artificial intelligence and cybersecurity closed rounds of $100 million or
    more this past quarter. Of those, the largest funding recipient by far was enterprise identity security
    provider Keyfactor , which picked up $1 billion in a July growth round led by Summit Partner
