- id: ev-67898dabfa29e019
  project_slug: scm-2
  url: https://baike.baidu.com/item/SCM%E4%BE%9B%E5%BA%94%E9%93%BE%E7%AE%A1%E7%90%86/3400001
  title: SCM供应链管理_百度百科
  published_at: ''
  collected_at: '2026-10-13T03:37:29Z'
  source_kind: pain
  tier: independent
  fact: 供应链管理 (Supply Chain Management, SCM)就是对企业供应链的管理，是对供应、需求、 原材料采购 、市场、生产、库存、订单、分销发货等的管理，包括了从生产到发货、从供应商到顾客的每一个环节。
- id: ev-222ae40a37737b0b
  project_slug: scm-2
  url: https://zhuanlan.zhihu.com/p/1899094910621193466
  title: 供应链、采购、物流分不清？SRM、SCM、TMS 到底是干啥？一篇全讲明白！ - 知乎
  published_at: ''
  collected_at: '2026-10-13T03:37:29Z'
  source_kind: pain
  tier: independent
  fact: 说到底，SRM、SCM、TMS 这些看起来挺“高大上”的系统，其实就是把“供应链、采购、物流”这三个关键环节，管得更清楚、更快、更省。 SRM 解决的是“我跟谁买、怎么买、买得值不值”；
    SCM 管的是“从客户下单到工厂交货， 全链路 怎么协同”；
- id: ev-816f0b4f1c01cf28
  project_slug: scm-2
  url: https://zhuanlan.zhihu.com/p/1903099767032121196
  title: 一次讲清楚！供应链管理的五大系统：SCM、ERP、WMS、TMS、OMS
  published_at: ''
  collected_at: '2026-10-13T03:37:29Z'
  source_kind: pain
  tier: independent
  fact: 其实是你还不会供应链管理！ ERP、 WMS 、TMS、 OMS 、SCM这五大系统，支撑起企业运营， 分别控制着资源调配、仓储管理、物流运输、订单处理和全局协同的核心环节。 但它们 不是简单的“进货-生产-发货”，而是将采购、生产、仓储、配送等环节串联成高效闭环。
