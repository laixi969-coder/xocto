  fact: BMW Group operates CLEA, a FinOps platform monitoring more than 14,000 cloud accounts. This post
    shows how BMW added automated daily cost anomaly detection, moving from reactive dashboards to proactive
    alerts using Prophet forecasting, AWS Step Functions, and a serverless pipeline that processes every
    account for about $50 per month.
