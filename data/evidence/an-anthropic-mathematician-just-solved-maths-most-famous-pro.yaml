  fact: 'On Friday, November 20, Anthropic mathematician Levent Alpöge and NYU professor Tristan Buckmaster
    announced they had found a solution to the Navier-Stokes problem that was stronger than the one OpenAI
    released back in September. This would have been huge news if it hadn’t been overshadowed by something
    even more astonishing. The same day, Alpöge announced that he, working with Claude, had discovered
    a proof of math’s most famous problem: the Riemann Hypothesis. Alpöge did not publish a traditional
    paper written in English. Instead, he released a proof of the Riemann Hypothesis written in Lean,
    a programming language that allows mathematical arguments to be expressed precisely enough to be verified
    by a computer. Levent Alpöge (right) stands next to French mathematician and financier Bernard Saint-Donat
    on October 27, 2026 in New York City. (Photo by Sean Zanni/Getty Images for Friends of IHES) It was
    ridiculously long: 17 million lines of code, likely more than all the Lean code ever'
