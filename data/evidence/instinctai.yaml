- id: ev-cbd759839ca50a23
  project_slug: instinctai
  url: https://www.v2ex.com/t/1247221
  title: Instinct AI：把视频、图像、音频与 Agent 工作流放在一起
  published_at: '2026-10-08T21:18:53Z'
  collected_at: '2026-10-09T02:10:12Z'
  source_kind: product
  tier: independent
  fact: "大家好，分享我们正在做的 Instinct AI 。\r\n\r\nInstinct AI 是一个 AI 创意套件，把视频、图像、音频和 Agent 工作流放在同一个工作空间里，面向创作者、营销人员、电商团队、代理机构和工作室。\r\
    \n\r\n目前支持从文字提示词、图片或参考媒体开始创作和迭代，包括：\r\n\r\n- 文生视频、图生视频、参考图生视频\r\n- 文生图、图生图、图生提示词\r\n- 透明 PNG 资源生成\r\
    \n- 文生音乐、语音和音频生成\r\n- 使用 Instinct AI Agent 生成和优化创意项目\r\n\r\n共享额度可用于 Seedance 、Wan 、Kling 、GPT Image\
    \ 、Nano Banana 、ElevenLabs 和 Suno 等模型。产品定位是把不同的创作流程集中起来，减少在视频、图片、语音和音乐工具之间来回切换。\r\n\r\nInstinct AI\
    \ 于 2026 年 10 月 1 日发布，目前为付费产品，起价为每月 9.99 美元。\r\n\r\n官网： https://instinctai.org/\r\n\r\n欢迎大家试用和交流反馈。"
