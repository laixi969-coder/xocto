  fact: Meta’s executives are rethinking the company’s original goal of achieving net-zero emissions by
    2030. That revelation in Meta’s latest sustainability report comes as the company reported a record
    percentage increase in greenhouse gas emissions that exceeds any other Big Tech competitor racing
    to build new AI data centers. The company’s 2026 sustainability report claims that “our long-term
    ambitions haven’t changed, but our operating environment has,” according to an introduction from Rachel
