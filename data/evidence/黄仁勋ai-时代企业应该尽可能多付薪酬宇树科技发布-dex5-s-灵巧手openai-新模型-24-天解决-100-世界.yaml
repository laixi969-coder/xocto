  fact: "消息称华为 Mate 90 系列年度旗舰手机将在 9 月 29 日发布 \n 9 月 21 日消息，昨日早些时候，华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东刚刚宣布，智界\
    \ RX 及鸿蒙智行新品发布会定档 9 月 28 日 14:30 举行。 \n 根据此前爆料，华为 Mate 90 系列手机也将在本月发布，但遗憾的是，今天华为并未官宣这款年度旗舰的发布会时间。但博主\
    \ @熠熠玩数码 透露， Mate 90 系列发布会将在 9 月 29 日 14:30 举行 。（来源：IT 之家） \n   \n   \n 英伟达员工平均年薪 28.2 万美元，黄仁勋喊话企业「尽可能多付薪酬」\
    \ \n 英伟达 CEO 黄仁勋近日接受 CBS News 采访，再次就 AI 时代的利润分配问题公开表态。 他直言，企业不应「尽可能少地支付员工薪酬」，而应「尽可能多地支付」。此番言论正值全球\
    \ AI 基建热潮之中，芯片巨头与员工之间围绕利润分配的博弈日益成为行业焦点。 \n 黄仁勋的底气来自英伟达自身的薪酬实践。 据报道，他亲自审查公司全部 42000 名员工的薪酬方案，并且在 100%的情况下都会增加公司在薪酬上的支出。他的逻辑很直接：「照顾好员工，其他一切自然会好起来。」从数据看，英伟达\
    \ 2026 财年员工平均收入达 28.205 万美元（约合人民币 189 万元），而黄仁勋本人的总薪酬为 3630 万美元（约合人民币 2.44 亿元），较上年下降约 27%——这一反差也在客观上为其「优先照顾员工」的主张提供了注脚。（来源：TechWeb）\
    \ \n   \n 百度库库 AI 全球 AI 办公月活超 4000 万、海外版 Kooko 用户破 1000 万 \n 9 月 21 日消息，在百度 AI Day 开放日上，百度文库网盘宣布加速\
    \ AI 办公出海、进行全球品牌升级。在国内外办公赛道的持续深耕下，通用智能体「库库 AI」全球 AI 办公月活超 4000 万，位于 AI 办公赛道行业第一。百度文库网盘去年推出的海外一站式 AI\
    \ 办公平台 Oreate AI，焕新为库库 AI 海外版「Kooko」，一年时间内海外用户已突破 1000 万。 \n 据介绍，库库 AI，生长于中国最大的知识和数据生态，打造服务超级个体、超级组织的全球化\
    \ AI 办公生态，真正做到「准确、专业、懂你」。库库 AI 不仅可在文库"
