  fact: "作者｜汤一涛 \n 编辑｜靖宇 \n   \n \n 今年 5 月初，X 上一条五秒钟的视频火了。这是一场韩国职业棒球联赛转播，韩华鹰队对阵斗山熊队。镜头扫到看台上一个穿白上衣和牛仔裤的女人，翘着腿。某一刻，她似乎叹了口气，并移开了视线，看起来对比赛感到不满。\
    \ \n   \n 视频配文是「普通韩国女性」。截至本文发布，视频播放量已经为 1525 万｜视频来源：X @kangminlee \n 但是很快一群资深球迷看出了不对劲。比分牌上写着，击球手是曹仁成（Cho\
    \ Inseong），可曹仁成 2017 年就退役了，现在在斗山当教练。 \n 此外，看台上的加油标语比斗山熊的官方口号多出一个字，像是 AI 生硬直译出来的。而这场转播，解说却是标准的美式口音，同样也很可疑。\
    \ \n 这个女人确实不存在，她是由 AI 生成的。但视频被拆穿后没有消失，反而成了一个模板。大家把自己的脸塞进同样的转播画面，生成一张「被球场镜头抓拍到的自己」，并很快在社交网络上流行。 \n\
    \   \n 「被球场镜头抓拍到的自己」迅速成了流行模板｜图片来源：RADII \n 每一次 AI 图像能力的增强，几乎都会跑出一个全民流行的爆款。比如 2025 年 3 月 GPT-4o 能画图了，满屏都是被重绘成吉卜力动画风格的照片；8\
    \ 月底谷歌的 Nano Banana 上线，大家最爱的玩法是把自拍做成摆在电脑桌上的手办，用户两周里生成了 2 亿多张图。 \n 爆款每次都换，大多是「把自己放进去」的玩法。但球场这一次，暴露了一个之前不那么明显的顺序：先是一个不存在的美女骗过了上千万人，然后才长出了人人可玩的模板。\
    \ \n  美女不是偶然出现在场景里的配角，她更像一个默认值 。 \n 这个默认值比 AI 早了半个世纪。1973 年，正是图像数字化的早期，一群工程师要测试一项新的图像技术，他们选的也是一个美女。\
    \ \n   \n  互联网第一夫人  \n Lena Soderberg 的职业生涯始于在伊利诺伊州芝加哥，从事平面模特的工作。此前她以互惠生的身份，从瑞典移居到了美国。1972 年，她为《花花公子》杂志\
    \ 11 月刊拍摄了中间插页。那期《花花公子》卖了 716 万多册，是这本杂志卖得最好的一期。 \n 学过数字图像处理的人多半见过她：戴一顶宽檐帽，裸着肩侧过脸来看镜头。几十年里，数不清的图像压缩和处理算法拿这张脸做过测试。\
    \ \n   \n Lena So"
