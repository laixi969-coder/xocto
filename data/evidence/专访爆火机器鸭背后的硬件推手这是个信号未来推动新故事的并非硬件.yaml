  project_slug: 专访爆火机器鸭背后的硬件推手这是个信号未来推动新故事的并非硬件
  url: http://www.geekpark.net/news/370269
  title: 专访爆火「机器鸭」背后的硬件推手：这是个信号，未来推动新故事的并非硬件
  published_at: '2026-09-14T05:14:43Z'
  collected_at: '2026-09-15T00:39:09Z'
  source_kind: market_signal
  tier: independent
  fact: "最近这两周，一只「 机器鸭 」在 X 上刷屏了。 \n 这只叫  Microduck  的机器鸭，由 Hugging Face 旗下的 Pollen Robotics 设计，售价 399\
    \ 美元。 高峰期平均每 4 秒卖出一台，五天后预售破万台，销售额突破 500 万美元，目前订单已经排到明年。  \n \n  \n  \n \n \n  它火了，火出了科技圈，还可能会刷新消费级机器人出货纪录。\
    \  \n 而这只全球爆款，由深圳制造，工程化公司是潘昊创办的 Seeed Studio 矽递科技。在此之前，潘昊团队已为  Hugging Face  代工过 Reachy Mini，后者登上过英伟达\
    \ CES 展台，同样供不应求。 \n \n   \n  左为桌面机器人 Reachy Mini，右为机器鸭 Microduck，都是 Pollen Robotics 的作品｜图片来源：Pollen\
    \ Robotics  \n   \n \n 英特尔工程师出身的潘昊 2008 年来深圳，逛了一圈华强北就决定不走了。那一年他创办 Seeed，为全球创客采购、制造硬件，成为了全球创客与中国工厂之间的枢纽，扮演着「供应链严选」与硬件制造商的角色。\
    \ \n 18 年过去，他们如今是全球知名开源硬件制造商之一，90%客户来自海外，几乎参与了每一波硅谷硬件浪潮。 \n Microduck 的爆火，是观察全球 AI 硬件产业分工演变、理解爆款密码的一个绝佳切面。\
    \ \n 这次对话，我们从 Microduck 这单具体的生意切入，拆解它为何爆火的底层规律和启示。一路聊到硅谷创业者与深圳的关系变化、新时代硬件创业者的价值到底在哪、软硬件创业者之间新的分工，以及被容易忽视的中国供应链里的江湖规则。\
    \ \n 例如，潘昊感受到，硅谷团队来中国正从「采购」变成「托孤」。同时，更多的失败创业在发生，他提醒软件出身的 AI 从业者：不必把精力消磨在重新做硬件上，这是一种 respect，你的长处应该在硬件之外，知道什么不必从头做。\
    \ \n 以下是极客公园与潘昊的对话，经编辑整理。 \n \n  作者｜Lilyann、苏子华  \n  编辑｜靖宇  \n \n \n  \n 一只鸭子，为什么能出圈？ \n \n  极客公园：Microduck\
    \ 现在预售数量破万了，这个结果符合你们的预期吗？  \n  潘昊： 这个鸭子会火，有些预料。但没想到会火成这样，连科技圈外都在关注，这是始料未"
