    we highlight a few of the more intriguing disclosures below: Revenue growth is unusually rapid For
    the first half of this year, Anthropic reported revenue of $16.3 billion. That’s up 14x from the same
    period in 2025. Things aren’t slowing either. While the S-1 doesn’t forecast the second half of this
    year, Reuters has reported that Anthropic could reach a $110 billion annualized revenue run rate by
    year-end, citing analysts who met with company executives. But losses persist Anthropic also posted
    a $693 million operating income loss for the first half of 2026, down about two-thirds from last year.
