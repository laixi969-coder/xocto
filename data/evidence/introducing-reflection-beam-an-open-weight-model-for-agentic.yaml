  fact: Reflection AI introduced Beam, an open-weight model for agentic coding and long-horizon tasks
    such as maintaining code, using tools, interpreting results, and completing multi-step workflows.
    The open-weight release gives developers and researchers control over the runtime, deployment environment,
    and customization process. In this post, we explain Reflection’s vision and show how you can deploy
    Beam on AWS. Start with an Amazon SageMaker JumpStart real-time endpoint for a fully managed path.
    When you need Kubernetes-native control over distributed GPU infrastructure, use Amazon SageMaker
    HyperPod Inference with JumpStart, SGLang, or vLLM. We also explain how Beam’s 501 billion total parameters
    shape checkpoint storage, weight memory, sharding, and parallelism, while its 23 billion active parameters
    influence per-token compute. At launch, Beam is available in Amazon SageMaker JumpStart in US East
