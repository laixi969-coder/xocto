  fact: Slingshot Insurance , an AI-native embedded insurance startup, is emerging from stealth with $27
    million in seed funding, it tells Crunchbase News exclusively. Rally Ventures and Skyward Group co-led
    the round, with participation from insurance industry veterans including Jim Hays , who will join
    Slingshot’s board. Rally is also a co-founder of the Minneapolis-based startup, as part of the firm’s
    broader approach. So far, it has co-founded roughly eight portfolio companies that have either launched
    or remain in stealth. Ethan Genteman, co-founder and CEO of Slingshot Insurance. (Courtesy photo)
    Slingshot, which is led by first-time founder and CEO Ethan Genteman , focuses on small insurance
    policies that consumers can buy as part of another purchase, such as coverage when booking a flight.
    Known as embedded insurance, the model puts coverage in front of customers when they might need it.
