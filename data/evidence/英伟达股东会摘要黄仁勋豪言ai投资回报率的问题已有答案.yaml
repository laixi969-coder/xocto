  fact: "9 月 7 日晚上，雷军站在国家会议中心的舞台中央，讲了整整两个半小时。这不是一场普通的秋季发布会，而是小米的一份阶段性答卷。 \n 车、芯片、手机，这三张牌，小米憋了很久。造车、造芯、造高端旗舰，每一件单拎出来都很重磅，而雷军选择把它们同时摊在同一张桌子上。四款澎程新车、三颗自研玄戒芯片、史上第一款破万的小米\
    \ 18 Fold 折叠屏，再加上一块想要正面掀翻 iPad 的小米平板 9 Pro Max。 \n 值得注意的是时间分配：两个半小时里， 光澎程系列的四款车，雷军就讲了一个半小时 。重头戏是谁，答案不言而喻。发布会后，小米披露，4\
    \ 分钟澎程锁单突破 10000 台。 \n 而当那块能在车顶升起一整间「移动小屋」的电动顶舱亮相时，现场响起了热烈的掌声。 \n 今晚的小米，想讲的不是参数，而是一个关于「下一个十年靠什么活」的故事。\
    \ \n 一、一个半小时、四款车 \n 这次发布会的重头戏是小米澎程系列。当雷军讲到这部分的时候，现场掌声最大。 \n 此前 7 月底的技术发布会上，7 月 30 日，小米汽车举办造车五年来的第二次技术发布会，系统分享了小米昆仑技术架构，并发布小米澎程首款车型\
    \ N90 Max，两排五座的 N70 系列只用了不到 3 分钟快速带过。 \n 而今晚，主角调了个个儿，雷军重点介绍了 N70 系列的两款新车，并带来搭载原生设计电动升降顶舱的 N90 Max\
    \ 探索版。 \n   \n 不同于 SU7、YU7 追求极致性能，澎程系列是要把车内空间做大、做平，还要丰富可变。这次同步上市的 4 款车里，N70 Pro 和 N70 Max、N90 Max\
    \ 露营版是大五座，N90 Max 是三排六座。 \n 它们共享同一套设计语言：全平地板、可移动中岛、前排座椅 180°旋转，一键切换会客厅、大床、办公等超过 13 种场景。 \n 几台车的价格也一次性亮明：\
    \ \n  N70 Pro 起售 20.99 万、  \n  N70 Max 23.99 万、  \n  N90 Max 26.99 万、  \n  N90 Max 探索版 29.99 万 ，9\
    \ 月 7 日晚 22 点正式开售。 \n 小米澎程 N70 是一款「大小合适、驾驶轻松、乘坐也舒适」的主流 SUV，车长 4960mm、车宽 1998mm、轴距 2950mm，拥有和 N90 系列一样的智能可变大空间，支持对坐模式等多种可变场景。"
