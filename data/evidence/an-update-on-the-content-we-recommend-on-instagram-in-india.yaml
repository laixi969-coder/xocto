  fact: Over the past year, we’ve strengthened the default protections behind what Instagram recommends
    in India to reduce unwanted content and improve people’s experience on Instagram. This work has been
    guided by what our users told us they want from their recommendations. Today, we’re sharing an update
    on this work. How Recommendations Work At Instagram, we make personalized recommendations to help
    people discover new communities and content. Our goal is to make recommendations that are relevant
    and valuable to each person who sees them. For example, if you interact with restaurants and bookstores
    on Instagram, we may recommend content about food, recipes, books, or reading. Recommendations include
    content from accounts you don’t already follow, in places like Explore, Reels and Feed , so we apply
    guidelines specific to them. Through our Recommendations Guidelines , we work to avoid recommending
