  project_slug: 三体还没降临是因为叶文洁没用上千问办公吗
  url: http://www.geekpark.net/news/370667
  title: 三体还没降临，是因为叶文洁没用上千问办公吗？
  published_at: '2026-09-20T07:27:15Z'
  collected_at: '2026-09-21T00:17:16Z'
  source_kind: market_signal
  tier: independent
  fact: "天文观测，或许大概是最容易让普通人产生浪漫想象的一类科学。 \n 巨大的穹顶缓缓打开，镜筒转向几亿光年之外，一束用从宇宙深处赶来的微光落到探测器上。然后告诉人类，这里几百万年曾经出现过超新星、伽马暴、中子星合并……研究的问题也从微观的重元素从何而来，覆盖到恒星如何死亡、极端物理条件下会发生什么。\
    \ \n   \n 但这些工作落到具体的天文望远镜使用时，日常却会变得琐碎而辛苦。 \n 冬天夜长，国家天文台兴隆观测基地一次值班经常要持续十几个小时。值班人员需要彻夜守着望远镜和控制软件，盯目标位置、天气和设备状态，调参数，排任务。地球在转，目标也在不断改变位置；云层、湿度、风速、月光都会影响观测；机械、网络和供电也可能出现变动。\
    \ \n 只是按照既定计划观测一晚，就已经够繁琐。但对瞬变观测来说，麻烦还远不止是夜班长。 \n 超新星、伽马暴这类事件无法提前推算。尤其是超新星爆发后的早期阶段，亮度和光谱会快速变化，一些特征可能过了几个小时或者几天就不再出现。科研团队发现得越早、跟得越快，能够留下的观测数据也越完整。\
    \ \n 中国科学院国家天文台高级工程师，兴隆观测基地天文组负责人郑捷把这种情况形容成「天上掉馅饼」。 \n 首先能「看到馅饼掉下来」，就是非常复杂的第一步。 \n 瞬变就意味着有一些原定观测任务需要被打乱排班。如果今晚已经排了三个科学任务，突然，一颗疑似极早期超新星突然出现在预警系统里，那这个目标到底重不重要，它现在是否处于可观测区域，天气是否允许，哪台望远镜有条件接手；原来的任务已经排满，又该挪掉哪一个……这些繁琐的任务，全都需要在极短时间里完成重新判断。然后逐级协调排程与设备调用。\
    \ \n 于是，今年国家天文台科研团队在千问办公协助下做了一次新的尝试。 \n 基于千问办公的 Agent Harness，团队用不到 3 天、千元左右的成本搭出了一套科研级望远镜仿真环境。望远镜组件和传感器接口被包装成\
    \ MCP，Agent 可以读取设备状态和可观测条件，随后，相关 Agent 框架又接入了「司天」探路者和「司天」原型机。 \n 一种新的瞬变观测范式，在 AI 的驱动下，逐渐走向成熟。 \n \
    \  01   \n  自动望远镜已经发展了几十年，  \n  为什么还需要 Agent？  \n 望远镜自动化并不是大模型时代才出现的技术。 \n 简单来说，我们可以将它分成三个阶段： 发现异常、分析异常和资源调度。"
