  fact: 曝梁文锋密集接触具身智能创业者，DeepSeek 拟入局具身智能 据报道，DeepSeek 创始人梁文锋近期密集关注具身智能领域，并与多位该领域创业者交流，探讨机器人、大模型与现实世界交互等方向。
    据知情人士透露，梁文锋正在考虑 DeepSeek 进入具身智能领域的可能性，可能会亲自组建团队下场研发，也可能通过投资相关企业切入。 此前，梁文锋已投资宇树科技，另据彭博社报道，DeepSeek
    计划领投腾讯前 AI 科学家胡瀚创立的机器人公司 Winverse AI。（来源：新浪科技） Meta 发布 Muse Wonder 模型，拥有主动记忆和主动专注功能，瞄准个人超级智能 Meta
    今天推出 Muse Wonder 系列，包括 Muse Wonder 和 Muse Wonder Full 两款功能最强大的型号，它们在个人和专业智能任务中均能提供卓越的性能。它们的推出标志着我们产品线的又一次飞跃，也是迈向个人超智能的重大一步。Muse
    Wonder 融合了 主动记忆 和 主动专注功能 ，能够帮助您追踪重要事项，并高效地朝着目标努力。 Muse Wonder 现已可通过 Meta Model API 和 Muse Code 使用，Muse
    Wonder Full 现已面向 Muse Code 订阅用户推出。 Muse Wonder 即将为 Muse 中的各种体验提供支持，并将首先面向订阅用户推出。Muse Wonder 还将为需要更高智能的工件生成和流程提供支持。未来，Meta
    将利用 Muse Wonder 开发专用模型，供所有 Muse 用户使用。（来源：Meta） 影石出货量累计突破 1000 万台 全景相机占比超 60% 10 月 13 日消息， 影石 Insta360
    对外公布，旗下相机产品全球累计出货量已经突破 1000 万台，全景相机占整体出货超过 60% ，11 年时间做到这个规模，增长速度相当可观。 比较有意思的是， 1000 万台的总量里面，有 470
    万台是过去 12 个月卖出去的，差不多接近一半。 也就是说影石最近一年的销量，几乎等于前面十年的总和，增长势头很猛。 相关庆祝活动之前已经在代工厂立讯精密的工厂完成，双方创始人以及工厂员工一起见证这个里程碑。
    全景相机依旧是影石的基本盘。IDC 给出的数据显示，它在全球全景相机市场份额达到 72.5%
