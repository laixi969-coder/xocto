  fact: 'Paul Graham, the Y Combinator co-founder, said the two young Irish entrepreneurs reminded him
    of Patrick and John Collison, the Irish brothers who founded and run the $160bn payment giant Stripe.
    Ryan Morrissey and Bence Redmond, the co-founders of AI startup Hoplite , might not be brothers but,
    like the Collison brothers, are Irish, have ties to Limerick, and attended Y Combinator. During their
    time at Y Combinator, Morrissey says they biked all over San Francisco to set users up for their startup,
    over 240 rides, a tactic Graham called the “Collison installation”. Morrissey met Redmond at the University
    of Limerick and dropped out at 19, before the pair joined YC’s summer 2026 batch. Morrissey even interned
    at Stripe. Morrissey says: “I first met John as an intern at Stripe, and Paul Graham later reconnected
    us during YC. John’s most valuable advice was to focus on startups rather than chase large enterprise
