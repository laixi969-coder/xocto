  fact: Amazon is betting that many Ring customers will also want an AI-powered security drone and robot
    patrolling their homes or offices. But the company’s upcoming Ring Robotic products are also certain
    to intensify privacy concerns previously raised around a prior Amazon attempt to popularize a flying
    security camera. The Ring Rover Cam and Ring Drone Cam are expected to reach customers starting at
    the end of 2026 and in early 2027, respectively, according to an Amazon announcement posted on November
    10. Amazon describes the devices as relying on an AI Pilot system that uses each device’s cameras
    along with “specialized vision models, on-device sensors and cloud processing” to plan patrol routes
    while autonomously navigating around obstacles such as furniture. Both devices also use that AI Pilot
    system to digitally map the floor plan of the customer’s home or business. This setup process occurs
