  fact: Across industries, decision-making starts with understanding what is changing and why. Industrial
    organizations collect data that informs decisions across their operations. This data helps prevent
    production stoppages, diagnose vehicle faults, explain drops in data-center performance, and adjust
    pricing as supply and demand shift. However, interpreting that data still requires specialist time,
    and collecting more data does not mean teams can act on it. General-purpose language models like Claude
    or ChatGPT can help analyze data. However, processing long histories across hundreds of operational
    metrics as text or images can consume large numbers of tokens, which increases cost. To help organizations
