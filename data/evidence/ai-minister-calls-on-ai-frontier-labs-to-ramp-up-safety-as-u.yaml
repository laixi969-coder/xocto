  fact: 'The UK AI minister today called on frontier AI labs to ramp up the safety of their leading AI
    systems, as the UK announced it was strengthening its cyber defences, including potential new legislation,
    as it prepares for potential serious AI incidents. Speaking in London today, Kanishka Narayan, the
    UK’s AI minister, said: “To the companies developing the world’s most powerful AI systems, my message
    is: Listen when your scientists warn of serious dangers. Investigate unexpected behaviour. And if
