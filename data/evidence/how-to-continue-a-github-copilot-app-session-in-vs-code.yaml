  fact: 'The agent has finished the bulk of your change. Now you want to inspect one implementation detail,
    adjust a few lines by hand, and run the project locally before you ship it. But the work is sitting
    in the GitHub Copilot app … and your editor is where you review diffs, debug code, and make final
    adjustments. Do you have to choose between staying in the session and starting over in Visual Studio
    Code? You don’t. You can open the Copilot app session directly in VS Code and continue with its conversation,
    code changes, and working context intact. That means Copilot can handle the repetitive or time-consuming
    work, then hand control back to you for closer review, hands-on editing, and local testing. In this
    tutorial, you’ll learn how to: Open a Copilot app session in VS Code. Review the agent’s changes line
    by line. Continue the same conversation from your editor. Modify and test the code locally. Push your
