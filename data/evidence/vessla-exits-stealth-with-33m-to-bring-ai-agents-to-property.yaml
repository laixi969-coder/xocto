  fact: Stockholm-based AI startup Vessla has emerged from stealth with a $3.3 million pre-seed funding
    round led by Seedcamp . Other participants included Inception Fund, Tiny VC, operators from Lovable
    and OpenAI, founders Lukas Saari (Tandem Health) and Fredrik Hjelm (Voi, Pit), and several angel investors.
    The round was more than twice oversubscribed. Founded earlier this year, Vessla is building an AI-powered
    platform designed to automate workflows across the systems used by residential and commercial property
    owners and managers. The company is already working with some of the Nordics' largest property owners
    and operators. Property operations involve coordination between tenants, managers, suppliers and finance
    teams, often requiring information to be transferred manually between different systems. Tasks such
    as maintenance requests can involve multiple processes, from reviewing property records and contracts
