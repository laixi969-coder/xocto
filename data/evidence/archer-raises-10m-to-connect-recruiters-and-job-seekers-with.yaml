  fact: Archer (formerly hackajob) has raised $10 million in new funding in a round led by Volition Capital
    , with participation from existing investor AVP . The company develops an AI-powered recruiting platform
    designed to connect employers with suitable candidates while helping job seekers discover relevant
    opportunities. Founded by Mark Chaffey and Razvan Creanga at King’s College London, hackajob initially
    operated as a reverse hiring marketplace where companies applied to software engineers. The platform
    grew to one million users before the company began developing Archer in 2025, adapting its approach
    to the growing use of AI in recruitment. Developed in collaboration with customer Sainsbury’s and
    publicly launched in September, Archer uses AI to automate candidate sourcing, qualification and introductions.
    Unlike recruitment tools focused primarily on employers or job seekers, the platform serves both sides,
