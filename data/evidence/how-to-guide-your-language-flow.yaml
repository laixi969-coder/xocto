  fact: We introduce a new method to guide flow matching models. Our approach, which we call probe guidance,
    uses the frozen internal states of an existing diffusion model to construct a guidance signal. This
    works using a similar principle as autoguidance, but eliminates the need for an additional forward
    pass at inference time and provides a reliable path to ensure that the weak and strong model share
    similar dynamics. We apply and benchmark this method on continuous diffusion language models, where
    probe guidance sets a new state-of-the-art performance on unconditional generation. When applied to
