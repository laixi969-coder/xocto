  fact: Opening the keynote at its Ignite event, Microsoft CEO Satya Nadella outlined the company's vision
    for its new "frontier ecosystem," announcing Tuesday the general availability of Word, Excel, and
    PowerPoint inside Copilot, which he described as "the new OS for work." The announcement is a striking
    inversion of how we've traditionally used software. Rather than an app like Word being the attraction
    and Clippy the assistant to help you use it, Microsoft envisions the new Copilot integrations will
    see agents driving things, with the software packages riding shotgun. Applications will become plugin
    components of the agent's work, backed by an organizational knowledge layer that draws context from
    emails, meetings, calendars, chats, and files. Users will now be able to create documents, spreadsheets,
    and presentations directly in Copilot, with the resulting files remaining editable in their respective
    Office applications. Read full article Comments
