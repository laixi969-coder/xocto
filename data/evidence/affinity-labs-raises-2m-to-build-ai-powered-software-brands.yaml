  fact: London-based startup Affinity Labs has raised $2 million in pre-seed funding to expand its portfolio
    of creator-led software brands and further develop its AI-powered product development technology.
    The round was led by Fuel Ventures , alongside Antler , and includes a £497,787 grant from Innovate
    UK , part of UK Research and Innovation (UKRI). The funding also attracted angel investors from Google
    DeepMind, Meta and Playfair VC, as well as content creator Marcello Ascani and Devran Amaratunga Karaca,
    CEO of creator economy company Kyra. Founded by Edoardo Ricci (CEO), Ahmed Eltom (COO) and Sunny Panchal
    (CTO), Affinity Labs develops software products in partnership with content creators. The company
    combines creators' existing audiences with its technology to launch and scale digital brands, with
    each product co-founded alongside a creator. While content creators have established consumer brands
