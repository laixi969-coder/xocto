- id: ev-1414c7262152380c
  project_slug: github-7
  url: https://www.v2ex.com/t/1248199
  title: 未来的软件形式
  published_at: '2026-10-12T11:31:30Z'
  collected_at: '2026-10-13T03:03:52Z'
  source_kind: product
  tier: independent
  fact: "最近 x 上刷到一个很火的 ai 网关，叫 magpie ，短短几天就干到 10k stars ，而且我相信它未来会超过 CPA 和 sub2api 之类的 https://github.com/yetone/magpie\r\
    \n\r\n这个网关和 CPA 还有 sub2api 不同的是，它支持自定义插件，也就是说用户可以让自己的 agent 根据自己的需要，开发各种插件，一是减少了作者维护 repo 的压力，二是用户不需要等作者维护，就可以自己开发想要的功能，而\
    \ ai 网关比较难实现的部分，例如不同协议的转换，翻译层的设计，则由作者来维护。\r\n\r\n感觉这种插件式的软件会越来越受欢迎，这不是因为插件的可复用性，而是插件的易开发性，像之前比较火的\
    \ chrome 插件，obsidian 插件，都依赖插件作者的维护，而如今软件的插件可以被用户自己来开发和维护。\r\n\r\n因此未来的软件基本上都是一个坚实的底座，由开源作者或者社区维护，然后一份插件开发文档，插件开发文档和软件是一并发布的，并且会占据比较显眼的位置，告诉用户他们可以自己实现想要的功能而不是等作者来加，外加用户自己的\
    \ agent ，用户只需要说自己的需求，agent 开发对应功能的插件\r\n\r\ndsh 也是一切皆插件的概念，但是在 harness 上面实现地并不是那么好，甚至当前 ds 官方自己都给不出一个自进化的演示，我感觉主要是\
    \ dsh 自己的底座并不扎实，甚至不能自己给自己开发插件，因为插件改坏了会崩掉导致起不来，必须依赖另一个 agent 来帮助写插件，另外就是插件的开发文档不完善，基本上都是看源码来写新插件。"
