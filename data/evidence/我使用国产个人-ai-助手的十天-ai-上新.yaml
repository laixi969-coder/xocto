  fact: 过去一年，AI 产品越来越想变成一个「人」。 一边是越来越自动化的 Agent，已经可以直接操作电脑，甚至和其他 AI 互相通信。 而另一边，是近期大火的「个人助理」式 Personal
    AI，它不仅要完成眼前的任务，还想记住是谁在提需求：这个人关心什么，手上有哪些没做完的事。 就在最近一个月里， Meta 推出了 Muse； Manus 推出个人 Agent 应用 Cue； OpenAI
    随后发布 Dots。 它们的形态不同，但目的近似，都在试图长期记住用户的目标和偏好，进入用户日常使用的软件，并在用户没有主动提问时继续工作。 不过，放到国内的使用环境里，这些产品多少有些「水土不服」，要么仅在美区开放，要么可操作的应用主要是
    Gmail、Slack、WhatsApp、Teams 等海外软件。 在这股热潮里，我注意到了 Today AI。它由 Teambition 创始人齐俊元打造，国内版于 9 月 24 日上线，已经接入飞书、钉钉、腾讯文档和邮箱等国内常用应用。
    Today AI 应用的主页面｜图片来源：Today AI 至少对国内用户来说，它算是目前最容易上手体验 Personal AI 的产品之一。而用了 10 天以后，我也开始从 Today 身上看到
    Personal AI 的局限与潜力。 栏目作者召集 极客公园的新栏目「AI 上新」，将带大家体验最新的 AI 应用和硬件，让你成为 AI 时代「最靓的仔」！ 现在，我们也向所有喜欢尝鲜和体验 AI
    的同学发出召集，只要你发现并体验了新的 AI 应用或者功能，按照格式（参考案例： AI 时代的「4399」，可把我玩嗨了｜AI 上新 ）向栏目投稿，在极客公园公众号发布，不仅能获得相应稿费，且会为你「报销」AI
    应用的订阅费用。 同时， 优秀作者还有机会进入极客公园 AI 体验群 ，获得最新 AI 应用和工具的内测资格，参加极客公园专属相关 AI 活动，和 AI 应用创始人一对一沟通。 AGI 太久，只争朝夕，让一部分人先
