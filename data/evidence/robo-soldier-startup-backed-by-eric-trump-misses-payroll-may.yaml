  fact: A humanoid robotics company backed and advised by President Donald Trump’s son, Eric Trump, has
    reportedly missed payroll and may be on the brink of collapse after a funding shortfall. The Silicon
    Valley startup, Foundation Future Industries, claims it is developing and testing robots for military
    roles on battlefields from Ukraine to Gaza. Foundation failed to pay employees for the payroll period
    ending on October 30, anonymous sources told CNBC . The startup’s staff is especially angry because
    Foundation’s co-founder and CEO, Sankaet Pathak , supposedly borrowed $4.6 million in company funds
    to buy a luxury home overlooking San Francisco Bay about a year ago. This comes as Pathak and Foundation’s
    leadership are still looking to raise funding to support a $3 billion valuation, based on their promise
    to develop a humanoid robot ready for combat duty and capable of wielding various weapons. Read full
