  fact: "OpenAI 发布 GPT-6 Sol 和 Luna 模型，API 价格大降 50% \n 9 月 23 日消息，OpenAI 今日发布 GPT-6 系列模型的最新成员 GPT-6 Sol\
    \ 和 GPT-6 Luna。 \n OpenAI 官方表示，两款模型采用与 GPT-6 Astra 类似的方法进行训练，将 Astra 在专业工作、事实性、编码、计算机使用和对齐等方面最先进的性能带入更快、更经济的模型。\
    \ \n GPT-6 Sol 和 Luna 模型的 API 价格相比 GPT-5.6 促销价降低 50%。不过 OpenAI 官方也表示，GPT-6 Astra 依然是其整体上最优秀的模型，如果你想要最佳效果和无妥协的体验，还是建议选择\
    \ GPT-6 Astra。 \n   \n 性能方面，在 AutomationBench 的跨应用业务流程测试中，GPT-6 Sol 在 xhigh 强度下表现优于 Claude Opus 5，成本仅为\
    \ Opus 5 每任务成本的 9%。在 high 强度下，GPT-6 Luna 比前代提升了 5.4%，且每项任务成本降低了 58%。 \n 在评估智能体的 Last Exam 测试中，GPT-6\
    \ Sol 在 max effort 状态下得分为 56.4%，高于 Claude Opus 5 在评估中的最高分，每任务成本也降低 60%。 \n OpenAI 还将 GPT-6 Astra 改进后的沟通风格带到了\
    \ Sol 和 Luna。官方认为新模型在技术和编程对话中会更清晰、使用更少的术语、更少奇怪的措辞、更少的低价值细节，以及缩短整体回答，同时不会失去实质内容。 \n 除了价格降低，OpenAI 还帮助基于\
    \ GPT-6 的开发者在应用重复利用的上下文部分节省更多费用。官方改进了 GPT-6 的提示缓存，默认提供更高的缓存命中率，帮助智能体重用更多上下文，实现更快响应。（来源：IT 之家） \n  \
    \ \n 云栖大会开幕，吴泳铭提出「思考力商品化」 \n 9 月 22 日，2026 杭州云栖大会正式开幕，阿里巴巴集团 CEO 吴泳铭发表开场主旨演讲，抛出「思考力商品化」核心观点，重新定义 AI\
    \ 时代的经济逻辑。他类比工业革命将动力变成商品，认为当下 AI 正在把思考变成可规模化供给的商品，未来机器产生的思考总量或将达到人类思考总量的 1000 倍以上。 \n 吴泳铭提"
