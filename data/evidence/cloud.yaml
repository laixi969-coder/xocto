    at launch, bringing a new campaign, multiplayer action and DMZ, high-stakes extraction mode to supported
    devices . The campaign also gets an enhanced look: GeForce RTX 5080-class performance arrives for
    Ultimate members, bringing support for ray-tracing features in the cloud. There’s a new way to join
    the cloud, too: Existing supported Fire TV Stick users can now purchase one-month Performance or Ultimate
    memberships directly through Amazon, making it easier to sign up and start streaming on the big screen.
    Plus, Square Enix’s FINAL FANTASY RESONANCE brings cinematic pixel art and strategic battles to the
    cloud, and The Elder Scrolls Online’s Echoes of Skyrim Season adds the entire Greymoor Chapter free
