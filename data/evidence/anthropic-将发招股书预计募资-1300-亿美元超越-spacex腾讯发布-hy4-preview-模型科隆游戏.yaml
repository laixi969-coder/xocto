  fact: "消息称 Anthropic 最早 10 天后公布招股书  \n 据知情人士称，Anthropic 计划在美国劳动节（9 月 7 日）后公布其 IPO 招股说明书，并可能在 9 月下旬或\
    \ 10 月初在美上市。 \n 该公司拟允许现有股东在 IPO 中出售股份，部分股东的禁售期可能超过 180 天，这将降低 IPO 后的抛售压力。 \n 报道称，Anthropic 希望在 IPO\
    \ 中筹集至少 1300 亿美元以扩张算力，这将超过 6 月上市的 SpaceX，当时其筹集了 860 亿美元。（来源：财联社） \n   \n  腾讯发布混元 Hy4 preview 模型  \n\
    \ 8 月 28 日，腾讯发布并开源混元 Hy4 preview。 \n 这是继 Hy3 正式版之后，腾讯推出的新一代大模型：总参数从 295B 增加到 770B，激活参数从 21B 增加到 49B，上下文长度也从\
    \ 256K 扩展至 1M。模型已经同步进入 WorkBuddy、CodeBuddy、元宝和 ima，并可通过腾讯云 TokenHub 及 OpenRouter 调用。 \n Hy4 preview\
    \ 继续走普惠的高性价比路线。根据公布的价格信息，Hy4 preview 输入 6 元/百万 tokens，输出 18 元/百万 tokens，缓存命中 0.3 元/百万 tokens。 \n 相比\
    \ Hy3，Hy4 preview 把优化重点进一步推向软件工程、办公分析、游戏开发和科学研究等生产力任务。 \n 腾讯称，Hy4 preview 首次参与了自身训练方法、数据策略、评估体系和底层算子的优化，并通过多轮实验将推理吞吐相较基线提升\
    \ 31.8%。（来源：极客公园） \n   \n  美团二季度净利扭亏为盈，王兴：美团不做 Token 工厂  \n 8 月 28 日，美团发布 2026 年第二季度业绩报告。 \n 二季度美团实现收入\
    \ 1046 亿元，同比增长 14.4%。净利润为 21.6 亿元，同比增长 490%。美团一季度净亏损为 68.3 亿元，环比实现扭亏为盈。 \n 美团表示，随着行业竞争趋于理性，叠加二季度旺季效应，公司各项业务恢复稳健增长，经营利润环比由负转正。\
    \ \n 王兴在财报业绩会上谈到 AI 时表示：「对我们而言 AI 发展的核心并非单纯比拼大模型本身的参数与性能，而是借助 AI 重塑企业组织模式、产品形态与全业务"
