  fact: IskayPet’s office teams had a knowledge challenge. Answers to everyday operational questions,
    such as a return policy, a veterinary protocol, or an onboarding step, lived in hundreds of Microsoft
    SharePoint documents spread across four languages and three countries. Finding the right information
    in large document repositories took a long time. Every new store, country, or procedure made the problem
    bigger. Retrieval Augmented Generation (RAG) is the usual way to solve this. But running RAG in production
    normally means operating vector databases, embedding pipelines, and ingestion jobs yourself. In this
    post, we show how IskayPet, a leading pet care company in Iberia, built a corporate knowledge assistant
    on Amazon Bedrock Managed Knowledge Bases. The assistant answers employee questions across retail
    operations, veterinary care, people and onboarding, and procurement, in four languages and across
    three countries, with no RAG infrastructure to manage. The team built the whole solution,
