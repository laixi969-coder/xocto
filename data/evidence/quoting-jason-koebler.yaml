  fact: 'Because big tech platforms essentially do not have customer support and make it impossible for
    their users to contact a human, many people experiencing run-of-the-mill tech problems have turned
    to ChatGPT. And, increasingly, ChatGPT is telling people that have normal tech support problems that
    they have discovered something journalistically notable and that 404 Media, specifically, can help
    them. — Jason Koebler , ChatGPT Keeps Telling People 404 Media Can Solve Their Tech Support Problems
