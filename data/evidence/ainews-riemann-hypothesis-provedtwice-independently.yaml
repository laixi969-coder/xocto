  fact: Within a few hours of each other ( timeline ), two mathematicians claimed independent proofs of
    the Riemann Hypothesis, the most famous open problem in mathematics ( Scientific American ). Levent
    Alpöge of Anthropic first made his Claude-driven proof in a note released with Lean code (1.3GB worth,
    ~250,000 page equivalent) rather than a full paper. Elliot Glazer confirms that the formalized statement
    is GRH and puts the chance of a Lean bug well under 1%. So if it finishes compiling with no extra
    axioms, it is probably correct, and no human will ever have read all of it… …prompting Alessandro
    Masullo to release his 940 page, 100% human , work in progress proof he had been working on for the
    last 12 years (and had been undergoing secret manual review and revision per Kevin Hartnett ). This
    is the third in the trilogy of frontier math breakthroughs, following from the Navier Stokes solutions
    and the Quasi-Riemann bounding, but it doesn’t feel over. OpenAI's September Navier-Stokes claim
