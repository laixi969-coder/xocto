  fact: On Monday, Virginia and Oregon became the first states to sue SpaceX, alleging that Grok continues
    to sexualize, unchecked, real photos of mostly women and children. SpaceX acquired xAI in February
    and now must handle the ongoing reckoning over the controversial rollout of Grok’s “spicy mode”—a
    model feature Musk hyped but was soon found to generate a flood of non-consensual intimate imagery
    (NCII) and child sex abuse images (CSAM). Initial safeguards were so lax that Grok sometimes generated
    nude images without being asked . Although X Safety and xAI (now known as SpaceXSI) were silent at
    first , Musk’s companies eventually apologized and claimed that additional safeguards were implemented
    and policies redesigned to block harmful outputs. However, state attorneys general alleged that those
    statements were “misleading” and that SpaceXSI instead quietly “embraced” sexualized content to seize
    more AI market share, as Grok continues to generate NCII and CSAM today. Read full article Comme
