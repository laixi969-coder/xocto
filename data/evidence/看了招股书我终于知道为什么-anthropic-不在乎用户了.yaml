  fact: 大的，终于来了。 10 月 26 日，Anthropic 向美国证监会公开递交了 S-1 招股书，准备在纳斯达克全球精选市场挂牌上市，股票代码定为 ANT。媒体报道中， 这家公司的估值讨论区间已经来到了
    1.5 万亿至 2 万亿美元 ，发行价区间尚未披露。 24 小时内，这本 300 多页的招股书已经被科技圈和金融圈翻了个底朝天，最抓眼球的几个数字大家都看过了：2026 年上半年营收 162.86
    亿美元，去年同期只有 11.63 亿美元；第二季度交出 9.74 亿美元经营利润，迎来公司历史上首个经营盈利的季度；至于账面上高达 807 亿美元的净亏损，大头是 723.88 亿美元的可转债、衍生负债和
    SAFE 公允价值变动，属于非现金的会计费用。 但在这些华尔街叙事之外，国内的开发者和日常使用者有着另一种割裂的体感。在中国大陆用户眼里，Claude 大概是目前市面上封号最多、风控最严苛、用起来最让人恼火的
    AI 产品。 为什么一家做出顶尖大模型的公司，在面对普通个人用户时总是显得如此冷淡 ？ 翻完招股书的财务附注和风险提示，答案其实就写在账本上。在 Anthropic 的商业版图里，个人用户贡献的真金白银占比非常小。
    01 不到 20% 的个人用户 要看懂一家公司真正在乎谁，最直接的办法就是去翻它的收入构成表。在招股书的财报附注 2 里，Anthropic 把营收拆成了两大块，一块是按用量计费的收入，另一块是订阅收入。
    数据对比非常悬殊。2025 年全年，按用量计费的收入是 37.96 亿美元，订阅收入只有 7.89 亿美元，比例大约是 83% 对 17%。到了 2026 年上半年，按用量计费的收入冲到 130.64
    亿美元，订阅收入是 32.22 亿美元，前者依然占到 80% 左右，订阅收入只占约 20%。 更关键的细节藏在订阅收入的构成里。这 20% 里，既有个人用户的 Claude Pro 和 Claude
    Max，也有企业级的 Team 和 Enterprise 套餐，招股书并没有把个人订阅单独拆出来。 这意味着，个人用户掏腰包买会员贡献的收入，在 Anthropic 总营收里的占比肯定低于两成，甚至可能还要低得多。
    那么，八成的按用量计费收入从哪来？答案是 云厂商渠道和成千上万家企业 。 通过亚马逊、谷歌、微软这几家云厂商市场卖给客户的收入，占比一路狂飙：
