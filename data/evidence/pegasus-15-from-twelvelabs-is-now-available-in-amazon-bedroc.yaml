  fact: On Oct 9, 2026 we announced the availability of TwelveLabs’ Pegasus 1.5 on Amazon Bedrock . Pegasus
    1.5 is a video language model that turns long-form video into structured, timestamped metadata. You
    describe the moments that matter to your workflow, and the model returns every matching segment as
    JSON. Video represents a significant and complex category of unstructured data, yet most of it remains
    unsearchable and underutilized. Extracting structured, actionable insights from that content has historically
    required labor-intensive manual review or fragmented toolchains. With earlier versions of Pegasus,
    you can point the model at a clip, ask a question, and get an answer. Now, Pegasus 1.5 analyzes the
