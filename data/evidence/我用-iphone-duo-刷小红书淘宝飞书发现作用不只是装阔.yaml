  title: 我用 iPhone Duo 刷小红书、淘宝、飞书，发现作用不只是装「阔」
  published_at: '2026-10-22T00:14:02Z'
  collected_at: '2026-10-22T00:42:47Z'
  source_kind: market_signal
  tier: independent
  fact: 头图图片来源：极客公园 我在 iPhone Duo 上，把淘宝、高德、小红书、腾讯视频、飞书、WPS、XMind，还有篮球游戏 NBA 巅峰对决，这 8 个为它做过适配的 App 挨个用了一遍。淘宝从首页到客服消息，整条购物链路都动过；高德把路线和地图拆成了左右两半；小红书的笔记，变成了左边看图、右边看正文和评论。
    这台手机的国行首批预订已经售罄。据环球时报 10 月 17 日的报道，苹果官网显示的预计交付时间，排到了明年二月，等货的这几个月，其实大家最关心答案的问题只有一个： 除了更「阔」，它和我们用了这么多年的直板
    iPhone，体验到底有什么不一样。 对 iPhone 来讲答案是，合上的时候，它最像一台普通 iPhone，区别只是程序坞、状态栏和灵动岛挪到了屏幕侧边，竖着排。真正的不同发生在另外两种状态里：完全展开，App
    会把一屏分成左右两栏；半折立在桌上，上半屏用来看，下半屏用来操作。 内屏分成两栏 淘宝是这次改得最全的一个。直板 iPhone 上看一件商品，是先看头图，再往下滑看标题和详情。Duo 展开后，主图在左，标题、价格和详情在右，边看图边看描述。合着的时候也改了，详情页的头图比例调过，一屏能同时看到两张图和标题、价格。
    首页和搜索结果可以双指捏合，在两列到四列之间调，想看大图就放大，想一屏多看几件就缩小。购物车里能看到完整的商品标题和优惠信息。 改得最实用的是消息页。左边是商家列表，右边是聊天窗口。一次要跟好几家店问尺码、问发货，在直板
    iPhone 上，每换一家都得退回列表再点进去；在 Duo 上，左边点一下，右边就换了一家。 淘宝还有两个新功能在测，AI 试穿和试妆，目前在灰度阶段，只有测试版入口能用。上传一张自己的半身或全身照，右边挑上衣、裤子、鞋和帽子，淘宝的说法是一件衣服一分钟内出效果；试妆直接用前置摄像头。不过试穿本身跟折叠屏关系不大，大屏给它的是右边那块挑衣服的地方。
    淘宝针对横屏场景优化的 AI 试穿效果｜图片来源：极客公园 对日常使用直屏手机习惯的用户来讲，在 iPhone Duo 上平时随手下单，合上用就够了。双十一要比价、要跟几家客服来回问的那几天，才是它最该展开的时候。
    在出门这件事上，高德改版之后的优势最为明显。在直板 iPhone 上查一条路线，屏幕上是几条方案排成一列，能比较的只有时间和距离；这条路现在堵不堵、终点附
