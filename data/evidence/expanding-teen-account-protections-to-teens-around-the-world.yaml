  fact: For more than a decade, we’ve worked with leading experts to build tools and resources to help
    teens and families have age-appropriate and positive experiences on our apps. Teen Accounts on Instagram,
    Facebook, and Messenger provide teens with a set of built-in protections that automatically limit
    who can contact them, the content they see, and their time on our apps. Ensuring all teens receive
    these protections depends on knowing their age. This continues to be an industry-wide challenge as
    some teens may misrepresent their age online to access experiences they’re not old enough to use.
    We use AI technology to find people we suspect to be teens, even if they use an adult birthday, and
    place them in Teen Account protections. Since first introducing this technology, we’ve been placing
    more teens in age-appropriate protections and are encouraged by the results. Based on that success,
    today we’re expanding this technology globally. As a result, millions more teens across the world
