  fact: 'NVIDIA today released Nemotron 3.5 Super VL, an open 120-billion-parameter model that delivers
    the fastest task completion and highest accuracy for specialized always-on agents. Joining it are
    two new edge models: Nemotron 3.5 Bolt 74B-A9B 24GB, optimized to balance intelligence and speed per
    GB for local agentic workloads, and Nemotron 3.5 Bolt E4B 4GB, optimized for intelligence per GB for
    fast conversational agents. Super VL and Bolt 74B-A9B are available now, with Bolt E4B coming Oct.
    23. The three open models together cover the full range of agent deployments, from large enterprise
    servers down to edge devices and local hardware. Any organization that wants to run agents on NVIDIA
