  fact: Polish education platform Coding Giants has secured up to €6 million in venture debt financing
    from Orbit Capital to support its international expansion. Founded eight years ago, Coding Giants
    provides technology education for children and teenagers, with courses covering coding, artificial
    intelligence and mathematics. The company currently operates across 13 markets in Europe and the Americas
    and has reached more than 130,000 students. With demand for STEM education growing across markets,
    Coding Giants aims to bring its educational model to more children and teenagers internationally.
    Its approach combines technical knowledge with practical learning, encouraging students to experiment
    with technology while developing analytical thinking, creativity and problem-solving skills. The courses
    are designed to help students understand how digital tools work and how they can be used to create
