  fact: ARTEMIS turns natural-language instructions into reliable Android automation. It automates end-to-end
    workflows, captures logs for debugging and analysis, and integrates seamlessly with AI coding assistants
    such as Antigravity, Codex, and Claude Code. On the AndroidWorld benchmark, ARTEMIS achieves a success
    rate of over 99%.
