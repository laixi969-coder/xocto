  fact: 'This post is co-written with Nick Tamburro of DXC Technology. When an AI agent can act on a production
    server at a bank or a hospital, access to a capable foundation model is only the starting point. Recent
    public incidents, in which autonomous agents took destructive actions their operators never intended,
    show that the real risk is rarely the model alone. It’s an agent holding more authority than its task
    requires, with nothing in the architecture to stop it. Avoiding that starts with a substrate that
    governs model access at the infrastructure level. Amazon Bedrock provides that substrate. Through
    a single managed interface, it gives DXC OASIS access to multiple foundation models: Anthropic Claude,
    Amazon Nova , Meta Llama, and open-weight families. Amazon Bedrock Guardrails enforce content filtering,
