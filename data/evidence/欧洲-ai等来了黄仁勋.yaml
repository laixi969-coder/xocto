  fact: GTC 柏林开幕前的两周，半导体板块走得并不顺，费城半导体指数出现了 2008 年以来最长的一轮连跌。市场在反复算同一笔账，巨额的 GPU 投入，什么时候能变成实打实的回报。 10 月 21
    日，在柏林 Tempodrom 的舞台上，黄仁勋没有发布新芯片。早已发布的 Vera Rubin 平台，这次只是确认「已全面量产」。他把更多时间留给了三个更落地的问题： 算力中心怎么建得更快，越来越能干的智能体怎么管住，物理
    AI，怎么走进欧洲的工厂和马路 。 用他自己的话说，「我们正处于人类历史上最大规模的基础设施建设之中」，需求不缺，缺的是产能和落地速度。 在英伟达 GTC 柏林大会之前，黄仁勋和德国总理默茨的对谈走红社交平台，当下
    AI 基建绝对王者告诉后者，面对汹涌而至的全新生产力革命，「紧箍咒」可能并不是最优解。 把 AI 工厂装进集装箱 过去两年，建一座 AI 数据中心更像一场土木工程。服务器、网络、供电和液冷要在现场逐一安装、布线、调试，一个大型集群从设备进场到真正点亮，拖上大半年是常态。而模型公司的迭代是按周算的，晚一个月拿到算力，可能就晚了一个版本。
    英伟达在柏林给出的答案是 DSX POD。大屏上的标语很直白，「 集装箱就是 AI 工厂 」。 它是一套完整 Vera Rubin AI 工厂的模块化参考设计。一套 DSX POD 由 7 个液冷计算机架组成，内部约
    17 公里线缆互连，采用 800V 直流供电，计算、网络、供电和液冷都在工厂里集成、测试完毕，再装进集装箱运到现场。戴尔、HPE、联想、施耐德电气、维谛，以及鸿海、广达、纬创等厂商参与制造，预计
    2027 年初开始交付。 按照官方的说法，在现场电力、冷却和网络已经就绪的前提下，部署时间可以从约 6 个月缩短到最快 14 天。 只看建设速度，其实低估了这件事。黄仁勋把 AI 经济比作五层蛋糕，最底下一层是能源。
    当算力规模越做越大，真正卡脖子的已经不只是芯片，而是电。 所以和 DSX POD 一起发布的，还有两套用电工具。DSX MaxLPS 在 GPU 之间动态分配功率，官方称在产出同样多 Token
