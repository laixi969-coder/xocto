  fact: 'Introducing Kimi K3.1 Pro Kimi K3.1 Pro landed on the Kimi API today - it''s not yet open weights,
    but Moonshot promise "Full model weights will be released by Nov 4, 2026". They''re also offering
    a "Highspeed" version that''s 2-3x faster, at twice the price (except for input token cache hits,
    which are priced the same). The US dollar pricing is $2.00/million tokens for input and $10/million
    for output - the same as GPT-6.1 Sol and half the price of Claude Opus 5.5. Moonshot''s own benchmarks
    show Kimi as approximately level with Opus 5.5 and GPT-6 Astra - beating them on a few benchmarks,
    coming close on others. Artificial Analysis scored Kimi at 55 - ahead of Claude Fable 5.1, GPT-6 Astra,
    and Gemini 4 Argon (all at 53) and behind only Claude Opus 5.5 (58). This is the first time a (soon-to-be)
    open weight model has scored this highly against the frontier. I tried it out via the Moonshot API
    using the llm openai endpoint command I added to LLM 0.32 back in August: llm openai endpoint \ h'
