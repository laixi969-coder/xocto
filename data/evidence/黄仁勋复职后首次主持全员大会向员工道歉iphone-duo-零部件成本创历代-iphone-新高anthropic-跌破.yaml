  fact: 黄仁勋复职后首次主持全员大会：向员工道歉，称将调整管理方式 当地时间 11 月 24 日，英伟达 CEO 黄仁勋在复职后首次召开的公司全员大会上向员工道歉，承认自己违反了公司行为准则，并表示已经开始接受每日一个半小时的心理治疗。
    他称自己犯下了「非常严重的个人错误」，伤害了家人，也辜负了员工，并感谢公司董事会给予自己第二次机会。 黄仁勋承认，以往过于强势的管理方式有时影响员工发挥主动性，今后将征求同事反馈，并接受针对自己的
    360 度绩效评估。对于继任安排，他表示不认同传统接班人计划，认为董事会可以在需要时从管理团队中选择人选。 黄仁勋称，复职决定由董事会作出。英伟达此前的公告同时披露，董事会在决策过程中听取了美国政府高级官员的意见；针对相关事件的独立调查仍将继续。（来源：IT
    之家） iPhone Duo 零部件成本率达 64%，创历代 iPhone 新高 11 月 25 日，CNMO 科技从「日经中文网」获悉，苹果首款折叠屏手机 iPhone Duo 经拆解显示，共包含
    145 种、2644 个零部件，零部件总数比 iPhone 18 Pro 多 7%。其中，256GB 版本零部件总成本约 1281 美元，占 1999 美元美国售价的比例（成本率）为 64%，高于
    2025 年秋季上市的 iPhone Air 的 54%，创历代 iPhone 新高。 iPhone Duo 采用两个由 100 多个零部件组成的铰链，主要供应商据分析为美国安费诺。上市后，部分用户反馈展开手机时内侧屏幕出现裂纹。苹果称已注意到相关问题，并将受理换机申请，但未公布原因分析结果。Fomalhaut
    Techno Solutions（此次拆解协助方）负责人认为，减少铰链数量可能对可靠性产生负面影响。 作为对比，三星 Z Fold8 使用三个铰链分散屏幕压力，屏幕更大的 Fold8 Ultra
    采用四个铰链。iPhone Duo 与 Z Fold8 均被分析为采用三星显示屏和康宁盖板玻璃，但铰链供应商不同。估算显示，三星采用的铰链成本为 45 美元，苹果采用的铰链成本为 105 美元。
    iPhone Duo 成本率上升还与存储器价格有关，其存储器成本合计约 300 美元。12GB DRAM 约 200 美元，是 iPhone Air 同容量版本 31 美元的约 6 倍；256GB
