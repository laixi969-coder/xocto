  title: 体验「跟拍机器人」Beni：谁不想要一个不会喊累还会拍照的出行搭子
  published_at: '2026-11-12T03:44:41Z'
  collected_at: '2026-11-13T02:39:05Z'
  source_kind: market_signal
  tier: independent
  fact: 作者 | siqi 编辑 | 郑玄 在智能硬件和具身圈里，可能是今年最受关注的产品之一 Beni 终于开售了。 我第一次听说 Beni，是今年上半年，这款产品背后的创业团队妙动科技拿到了包括经纬、红杉、美团的多轮投资。他们的两位核心合伙人，一位是前大疆（DJI）高管，另一位曾先后任大疆技术总监和特斯拉
    Optimus 人形机器人团队核心算法与控制工程师。可以说兼具硬件和具身背景。 到了 8 月份，Hardwire 的伙伴 Founder Park 在新加坡组织了一场 AI 线下活动，影石的创始人刘靖康现场分享了对打造「CameraMan」（影像机器人）的想法——当时，他认为无人机也许是影像机器人的最佳形态。但有些意外的是，下台之后，不少现场观众都跟
    JK 讨论起了妙动这个早期团队。 那是我第一次意识到，如果拉长时间维度，在影像机器人的这个目标下，无人机的对手可能会是一款新形态的硬件设备。 10 月下旬，我终于有机会提前得到了一台 Beni——一个双轮足式、体型比一只猫还小、可以跳跃翻跟头的机器人。更重要的是，作为一台
    ToC 的影像产品，它的确可以在场景里，拍到过去哪怕专业人类摄影师都很难拍出的「全新视角」。 11 月 10 日，Beni 正式在全球现货发售。国内市场起售价为 4999 元，跟大疆 Mini 系列无人机几乎在同一个价格区间，比今年最火的云台相机品类稍贵一点——尽管，我认为这几种产品各自对应的使用和拍摄场景几乎完全不会重叠。
    在我的印象里，此前这类「能跑能跳」的机器人极少涉足影像场景，也很少在 ToC 消费市场进入 5000 元的价格区间。 试用半个月之后，我想跟你谈谈我个人的使用感受，以及从 Beni 衍生出的一些思考。
    一台比猫还小的机器人 Beni 给我的第一印象是：它实在太不像一个过往我们印象中的机器人了。 重量只有不到 2 kg，官方标注收纳时的长宽高分别为 16.6x21.5x16.5cm，比一台展开旋翼的航拍无人机还要略小一点。比起高度最少在
    60cm 以上的「传统机器人」，Beni 在关机存放时，跟一个普通的桌面电子产品别无二致，不需要单独的存放空间，也不会因为有一个通电的「机器生物」，产生一种莫名的「侵入感」。 不仅我这么认为，我们公司的社牛小猫们，也都可以大胆放心地靠近
    Beni 和它互动。 极客公园「员工」 liuxing 对 B
