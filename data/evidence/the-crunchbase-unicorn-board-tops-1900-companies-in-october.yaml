    based in the U.S. Last month’s new unicorn cohort also highlighted how quickly this AI cycle is awarding
    some companies with billion-dollar-plus valuations: Half of October’s new unicorns are less than 4
    years old, and nine companies that joined the board during the month did so via seed or Series A raises.
