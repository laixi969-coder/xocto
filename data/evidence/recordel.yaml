  fact: "各位 V 友大家好！\r\n\r\n向大家介绍一款我们独立开发、基于纯前端与现代 Web 技术打造的浏览器端录屏与视频创作工作站 —— **Recordel**。\r\n\r\n以往制作高质量的产品演示、技术教程或\
    \ SaaS 宣传片，通常需要依赖像 Screen Studio 这样的 macOS 专属付费客户端。我们希望打破平台限制，打造一个**零安装门槛、极致保护隐私、打开网页即用，且能直接输出高级质感演示视频**的录屏剪辑利器。\r\
    \n\r\n\U0001F517 **官方体验地址**：[https://recordel.com]( https://recordel.com)  \r\n*(推荐使用 Chrome / Edge\
    \ 体验最佳硬件加速性能，支持离线运行)*\r\n\r\n---\r\n\r\n### \U0001F4A1 为什么选择 Recordel ？我们带来了哪些功能？\r\n\r\n#### 1. 纯\
    \ Web 架构与 100% 离线隐私保护（ 0 数据上传）\r\n- **真正的本地沙箱**：录制捕获、音视频编解码（ WebCodecs + WebGPU/WebGL ）以及后期渲染合成 **100%\
    \ 在你的浏览器本地完成**。\r\n- **数据不出本地**：录制文件无需上传到云端服务器，断网环境下依然能畅快剪辑与导出。录制敏感代码、内部系统或商业演示无后顾之忧。\r\n- **OPFS\
    \ 流式存储**：借助 Origin Private File System 虚拟文件系统，长视频录制不爆内存，防意外掉电与丢帧。\r\n\r\n#### 2. 3D 摄像机空间运镜与平滑透视\r\
    \n- **交互式运镜操纵杆**：支持 Pitch （俯仰）、Yaw （偏航）、Roll （翻滚）空间多轴旋转与透视倾斜。\r\n- **平滑聚焦与关键帧**：支持自动跟随鼠标智能缩放（ Zoom\
    \ & Pan ）或在时间轴自由打关键帧，打造高级科技感演示视角。\r\n- **Before / After 一键对比**：随时切换查看原片与 3D 渲染美化后的实时效果对比。\r\n\r\n\
    #### 3. 拟真系统视窗与高级背景画布\r\n- **精美视窗外壳**：一键套用 macOS 交通灯 / Windows 拟真视窗、可调节内边距与弥散投影。\r\n- **4K 级艺术背景**：内置多种动态渐变、拟真光影、网格科技风与磨砂玻璃质感背景，告别单调灰底。\r\
    \n\r\n#### 4. 智能鼠标轨迹与视觉焦点平滑\r\n-"
