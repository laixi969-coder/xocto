  fact: 本文首发于 Founder Park 公众号 · 2022 年 10 月 31 日   做数字人很难，尤其是超写实数字人，可是到底难在哪里？    「所有和做人相关的行业，一定会遇到恐怖谷理论」，
    数字栩生联合创始人 & CTO 翁冬冬 这么解释道。接下来的难度则是如何让静态数字人像人、如何让动态数字人像人，以及如何让数字人的交互像人。     「要想真的像人，应该是主动和人进行互动，元宇宙也好，VR
    也好，我们想要的是能进行互动的数字人。」   对于理想中的数字人，翁冬冬是这么形容的。    相比较目前流行的二次元风格的虚拟数字人，超写实数字人落地的领域会有稍微的不同，企业客服、数字演员甚至法律顾问等与人们日常更相关的领域，
    对于未来的数字人商业前景，翁冬冬很有信心，掌握着用户各种信息的数字伴侣，「可以说是世界上最了解你的人」。     超写实数字人到底是如何生产的，技术难点在哪里，以及未来会如何改变我们的生活，关于这些问题，我们和翁冬冬进行了一次长谈，还聊到了数字人可能面临的法律风险等。    未来尚未到来，但我们可以提前做好准备。                   做数字人就像考试，但不同的是考
    80 分不及格，考 85 分也不及格，考到 90 分才算及格，不存在中间 60-70 分的过程。    要想让数字人真的像人，应该是主动和人进行互动，元宇宙也好，VR 也好，我们想要的是能进行互动的数字人。    如果数字人没有需求是不会像人的，不会害怕，不会希望保持自尊，做出来的只是机械的反应，不像人就没有办法共情，描绘的很多美好的应用场景也就不存在。                    01           如何制作       超写实数字人？       Founder
    Park：数字栩生的技术解决方案是什么？具体有哪些案例？        翁冬冬    ：我们主要负责制作超写实的三维实时化的数字人。采用数字孪生的方式，通过把真实的演员进行复刻，采集演员的动态表情，生成完整的数字资产，这些数字资产未来可以用在数字直播、智能员工等领域。    典型的案例是我们和千博信息共同研发了一个数字手语主持人千言，在电视新闻播报的时候，屏幕左侧直接进行手语翻译帮助聋哑人理解新闻内容。通过人工智能和高写实数字人的结合，能够实现文本快速转换成手语动作，只要新闻主持人的稿件
