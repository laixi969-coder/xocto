    massively multiplayer gaming environment where players can use prompts (to the in-game agent, Savi)
    to modify the game world. I fired it up on my phone for a few minutes and was able to prompt a castle
    into existence, then a dragon, then ride the dragon to fly around that castle. By Jacob's telling,
