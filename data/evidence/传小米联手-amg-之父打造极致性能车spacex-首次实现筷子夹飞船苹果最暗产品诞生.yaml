  fact: 曝小米与「AMG 之父」创办的 HWA 秘密合作，希望打造「载入史册」新车 当地时间 11 月 5 日，意媒 Quattroruote 援引不具名知情人士消息称，小米与 HWA 或在秘密合作开发一款超高性能汽车，部分知名零部件供应商也有望参与其中。
    双方据称希望打造一款性能前所未有、足以载入汽车史册的车型。新车的具体形式仍未确定，既有可能是全新的旗舰车型，也有可能是小米现有两款车型（SU7/YU7）的极致性能版。 过去几周，多辆采用更激进设计的
    SU7 Ultra 测试车现身纽博格林赛道。该媒体分析称，不排除小米已在开发更侧重赛道性能的 SU7 Ultra 升级版。 接近项目的技术人员此前透露，小米主要针对 SU7 Ultra 现有的薄弱环节进行改进。
    新车的底盘经过重新调校，以更好地适应纽北赛道，车轮定位设定更加激进，尤其是外倾角；制动系统也进行了强化，不仅增大了规格，还改进了散热设计。 动力系统则将进一步提高输出功率和散热效率，空气动力学设计也有所优化，以增加下压力，并改善热气流的排出。
    目前仍无法确定 HWA 是否参与了 SU7 Ultra 升级方案的研发，还是双方计划共同推出一款全新车型。 据该媒体分析，如果是全新车型，可能有两种方向。一种是采用先进技术和现代化设计、性能达到全新高度的顶级超跑，造型和车身比例或借鉴中置发动机跑车；另一种则是以
    HWA 190 Evo（下图）为基础进一步开发，因此有可能改变其原本的特色。 HWA 去年推出了 190 Evo 项目，以现代化复刻的形式改装了经典奔驰 190 E 2.5-16 Evolution
    II。其采用碳纤维车身，造型极为方正。（来源：IT 之家） Intel 与 NVIDIA 继续合作开发超级芯片：耐心等双方官宣 11 月 14 日披露的信息显示，NVIDIA 曾宣布投资 50 亿美元入股
    Intel，成为后者大股东之一，双方并非单纯开展财务投资，还涉及联合开发芯片的深度合作。 10 月 21 日 Intel CEO 陈立武在相关采访中表示，双方的联合开发将持续多年，暂未给出产品问世时间，产品准备就绪后将由双方共同对外宣布。
