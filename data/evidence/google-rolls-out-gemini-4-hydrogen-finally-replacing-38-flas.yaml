  fact: 'Google is continuing its elemental AI naming scheme with the new Gemini 4 Hydrogen . These names
    are less descriptive than the Pro/Flash monikers of earlier releases, but Hydrogen''s purpose is clear:
    It replaces the faster, more economical Flash models most people in Google''s ecosystem use. With
    Google''s recent Argon and Carbon releases, the rollout was staged and began with cybersecurity researchers.
    Even when general availability began, Google restricted access to users paying for its most expensive
    AI subscription. The limits for Hydrogen are much more relaxed, with access beginning immediately.
    This model has replaced Gemini 3.8 Flash across the company''s products. Google claims that Hydrogen
    represents a major improvement versus the previous Flash model. It runs in one of four thinking levels
    (low, medium, high, and the new xhigh), and even in high mode, it''s 2.5 times faster than Flash 3.8.
    Plus, it reduces "fabricated claims" by more than 5x, according to Google''s analysis. User'
