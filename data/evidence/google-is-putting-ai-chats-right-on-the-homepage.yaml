  fact: 'Google is updating its homepage to include AI searches. In a post on X , Google''s vice president
    of product, Robby Stein, shows how you can now open a collapsible sidebar to view and continue your
    AI chats. Based on the GIF shared by Stein, it looks like you can open the sidebar by clicking the
    gray bar that appears on the left side of your screen. From there, Google will show a list of the
    searches you''ve made using AI Mode, along with the ability to start a new thread, search your threads,
    or connect a Gemini Notebook. New on the Google desktop homepage globally: we''re rolling out a collapsible
    sidebar to easily find & jump back into you … Read the full story at The Verge.'
