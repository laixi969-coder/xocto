  fact: Keeping a city running means making decisions that affect residents every day — from when to repair
    a road to how to use energy more efficiently. Across the EMEA region, cities and local software, infrastructure
    and integration partners are using NVIDIA accelerated computing to build physical AI agents and digital
    twins that help teams make those decisions. These applications can anticipate maintenance needs, guide
    urban planning and make public services more responsive. Software partners including ABA Technology
    , Akila , Galene AI , Honeywell Technologies , K2K , Linker Vision , Milestone , Onetera , ThinkDeep
    and Younite AI are using NVIDIA physical and agentic AI to develop solutions for city operations and
    public services. https://blogs.nvidia.com/wp-content/uploads/2026/10/linker-vision.mp4 Video courtesy
