  fact: "## Overview\r\n\r\nllama.cpp v0.7.0 adds the LiliCorr speculative decoding technique and MTP\
    \ for GLM5-Next, a new GPU cache for MoE experts kept in host memory (`--moe-cache-mib`, up to ~2.2x\
    \ decode speedup when experts are offloaded), and a large batch of new models: K2 Horizon (dense and\
    \ MoVA), Prism Bonsai 2 27B, EmbeddingGemma-2 (text+vision+audio), the LiquidAI d1/d1-omni and vLLM\
    \ decision 2/d3 decision models, pplx-decider, MiniCPM-V 4.7, Nemotron Super 3.5 VL / Nemotron Bolt\
    \ and maion-coder. The server gets a refactored chat session API (`common_chat_session`, part-based\
    \ formatted output), much better slot and prompt-cache restore behavior, decision-model support for\
    \ the new architectures and a new default port (9931), the web UI gains a full models manager, and\
    \ ggml is updated to v0.27.0.\r\n\r\n### Highlights\r\n\r\n- New GPU cache for host-memory MoE experts\
    \ (`--moe-cache-mib`): experts run on the GPU from an LRU cache, up to 2.2x faster decode [#29887](https://github.com/ggml-org/llama."
