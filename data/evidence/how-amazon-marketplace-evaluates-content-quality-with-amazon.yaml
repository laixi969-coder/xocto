  fact: A+ Content is the rich media widget on the Amazon product detail page. Through visual assets,
    brands communicate unique product and brand value to help customers make informed purchase decisions.
    Selling partners using high-quality A+ Content boost their sales by 8–20 percent compared to those
    without it. A wide variety of brands, from established brands with large in-house design teams to
    bootstrapped brands with limited resources, use A+ Content, creating inconsistency in content quality.
    A typical A+ Content project combines text, images, and video into a cohesive product story. Evaluating
    each asset in isolation misses the quality that emerges from how those assets work together. When
