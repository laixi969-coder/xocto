  fact: Catenary, in mathematics, a curve that describes the shape of a flexible hanging chain or cable—the
    name derives from the Latin catenaria (“chain”). Any freely hanging cable or string assumes this shape,
    also called a chainette, if the body is of uniform mass per unit of length and is acted upon.
