  title: 追觅四大赛道 IFA 首秀：一套技术，四个出口
  published_at: '2026-09-17T04:42:23Z'
  collected_at: '2026-09-18T00:20:10Z'
  source_kind: market_signal
  tier: independent
  fact: "追觅在 IFA 上展出的不是四条产品线，是一套技术的四个出口。 \n \n  作者｜张勇毅  \n  编辑｜郑玄  \n \n 去年一年，全球扫地机器人的出货量约 2412 万台。同一年，全球人形机器人的出货量约\
    \ 1.8 万台。两个数字都来自 IDC，中间差了 1300 多倍。 \n 带着这两个数字走进今年柏林的 IFA 主会场，这种体感上的反差就更明显了。 \n IFA 官方今年搭了迄今最大规模的人形机器人展示平台，主题是「未来已来」，机器人走秀也排进了每天的日程。转到清洁电器区，几家中国清洁品牌的展台上，扫地机器人长出了手和腿：有会爬楼梯的，有伸出机械臂往墙角边缘的。\
    \ \n 追觅的展台是这个领域中把这件事做得最极致的选手之一：从带机械臂的割草机、能自己跟着人走的高尔夫球包车，到一副外骨骼、一台正在叠衣服的工业机器人，还有两台处于研发阶段的家庭服务机器人 ECHO，四块业务第一次被摆在同一片地毯上。\
    \ \n 这也是追觅今年 6 月宣布聚焦智能家庭、户外庭院、智能出行、具身智能四大赛道之后，四块业务第一次同台。 \n 在 IFA 追觅展台现场前，第一眼看到的是四种不太相干的机器。看第二眼会发现，它们共用的东西比不同的多。\
    \ \n \n 割草机、球包车、机器人，第一次同台｜图片来源：极客公园 \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n    家里、院子里、路上\
    \    \n \n 四块业务里，追觅现在最厚的一块还是智能家庭。IFA 上追觅展出了上百款家用产品，从扫地机、洗地机到风扇、吹风机和擦窗机器人。 \n 今年这些产品上的新技术，几乎都对着家里那几个老问题：边角、低矮空间、不同的地面材质，还有跨房间的移动。对应的答案是\
    \ 180℃ 的蒸汽、能往外探 18 厘米的机械臂、会自动切换干湿滚刷的洗地机、往墙边外伸的探洗滚刷，以及一台叫 TriForm 的三形态洗地机器人，它可以自己在地上跑，也可以拆下来当手持洗地机和吸尘器用。\
    \ \n 这项业务今年在市场上拿到的结果，是四块里最硬的。IDC 今年 6 月发布的一季度数据里，全球扫地机器人出货 656.3 万台，同比增长 29.4%，追觅以 155.5 万台、23.7%\
    \ 的份额排在销量第一，销售额份额 28%。 \n 到上半年结束，按 IDC 季度跟踪报告，追觅品牌的销量份额 21.7%、销售额份额 25.8%，加上旗下 MOVA 品牌之"
