  fact: Fine-tuning teaches a small search agent your tools and environment, giving it the reliability
    of a frontier model at lower latency and cost. In this post, we fine-tune an LLM-powered search agent
    with multi-turn reinforcement learning (MTRL) on Amazon SageMaker AI and share the gains we measured
    in retrieval quality and reliability.
