  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 8 日                「茅台就是中国的 CRM SaaS」，谈到国内 CRM 的时候，这是最常听到的一句话。尤其在
    Salesforce 宣布解散中国区并将相关业务交给阿里云代理后，我们又在很多文章中看到了这句话。  在其他领域都验证了的「时光机理论」，在 CRM 行业却不怎么奏效，到底国产 CRM 要怎么做，不同的人给予的答案有点不同。作为连续创业者，卫瓴科技的创始人杨炯纬认为
    CRM 大有可为，而且天花板很高。在他看来，「 CRM 是帮助我们构建信任，帮助企业和客户之间构建信任的工具 」，CRM 销售的不只是一款工具，而是先进的工作理念。他很喜欢飞书的理念——「先进团队，先用飞书」，并也试图基于
    CRM 这个赛道向企业出售先进的思想和流程，目前，软件在 SaaS 这个数字化较高的行业受到了普遍的欢迎。  这已经是他第三次创业了，2009 年创建的 MediaV 聚胜万合广告被利欧集团全资收购，2012
    年创建的聚效广告被奇虎 360 全资收购，2020 年从 360 出来后创建了卫瓴科技，聚焦以企业微信为平台打造的协同 CRM 软件。  为什么选择泛微信生态，因为今天「 中国的主要商业沟通都在微信上
    」。  开发软件的底层思考是什么?「 我们做的每个工具都会想一线员工所想，优先做一线员工要的东西，把老板的需求放在第二。 」  不止如此，中国 CRM 市场的未来会是怎样，天花板又在哪里，作为一家初创公司，如何在内卷的
    CRM 市场做出自己的竞争壁垒，关于这些问题，杨炯纬都在给采访中给出了自己的回答。             基于西方的科学，放在中国的客户关系管理实践当中是有些「水土不服」的。    销售过程本质上也是认知、教育、决策、购买、留存、转介绍的过程。    我们除了要教会客户怎样使用软件以外，首先要给出一整套方法论和最佳实践。    中国的
    CRM 往往不是围绕客户来做的，而是围绕销售来做，是销售过程管理、销售效率管理，或是销售团队绩效管理，它其实是销售管理工具。               01      不同的商业模式        对
