  fact: 'Release: datasette-charts 0.1a0 I''ve been thinking about this problem for over a year now, but
    on Sunday I finally fired up Claude Fable 5.2 to build an initial prototype. The prototype went so
    well that this is now a full plugin. You can try it out in Datasette Lite here . It looks like this:
    The new charts plugin works against any table or arbitrary SQL query in Datasette. It defines several
    different chart types (using vendored D3 , Observable Plot , and topojson-client ), each with a set
    of heuristics for identifying when they might be a good match for a specific set of rows. Those suggestion
    thumbnails at the top are actual visualizations driven by the data, and selecting one pulls up the
    full chart along with tools for modifying it. You can also manually construct a chart from scratch.
    As with other Datasette visualization plugins, the current state of your chart is persisted in a #fragment
    in the URL - so you can bookmark charts or share them with others. The most important feat'
