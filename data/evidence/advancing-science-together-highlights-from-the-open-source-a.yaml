  fact: From studying the brain to discovering new materials, open source AI is giving scientists new
    ways to tackle difficult problems. Last month, Meta’s Fundamental AI Research (FAIR) team brought
    researchers from universities, hospitals, and industry together at our Menlo Park, California, headquarters
    for the Open Source AI for Science Summit. Over two days, attendees explored how openly shared AI
    models, tools, and data can advance healthcare, neuroscience, chemistry, materials science, and mathematics.
    Hands-on workshops also gave attendees a chance to collaborate directly with the scientists behind
    Meta’s models. Here are a few highlights. Advancing Medical Research and Real-World Applications We
    announced an expansion of the Digital Brain Project , launched with the Rothschild Hospital Foundation
    and the University of Montreal. The project funds researchers to collect de-identified brain data
