  fact: 英伟达董事会聘请前美国联邦检察官，调查 CEO 黄仁勋相关事件 11 月 11 日消息，英伟达发布公告，宣布已聘请美国前联邦检察官金正贤（Joon H. Kim）及其所在的律师事务所 Wachtell,
    Lipton, Rosen & Katz，负责开展一项全面、独立的调查。 此前，英伟达董事会表示，鉴于近期有关公司创始人兼 CEO 黄仁勋可能成为外国情报机构目标的报道，董事会决定启动独立调查。董事会将成立由独立董事组成的委员会，并在外部独立法律顾问协助下监督调查。
    英伟达董事会此前还表示，目前没有理由认为美国国家安全或英伟达的商业机密已经遭到泄露，但调查将审查所有可获得的信息。黄仁勋支持此次调查，并承诺配合相关工作。董事会同时表示，对黄仁勋及其领导团队保持信心。（来源：凤凰网科技）
    Anthropic 启动 IPO 路演，估值目标高达 1.4 万亿美元，七名联创拟套现 17.5 亿美元 Anthropic 已正式启动首次公开募股（IPO）的投资者路演。公司计划发行 8.25
    亿股股票，每股发行价区间为 70 至 78 美元，最高募资规模可达 643.5 亿美元。若按区间上限定价，其完全稀释估值将接近 1.4 万亿美元，这将是人工智能行业迄今规模最大的上市交易之一。 根据公司披露的招股文件，本次发行包括公司新发行的
    8.01351354 亿股，以及现有股东出售的 2364.8646 万股。公司不会从老股出售中获得任何收益。同时，承销商还获得一项为期 30 天的选择权，可额外认购 1.2375 亿股。 除公开募股外，Anthropic
    还宣布多家科技巨头将通过单独的私募配售方式合计投资 260 亿美元。其中，Google 与英伟达各出资 100 亿美元，领投本轮；AMD 将投入 25 亿美元；微软、博通和美光各投资 10 亿美元；台积电伙伴公司则追加
    5 亿美元。按每股 74 美元的中间价计算，IPO 与私募配售合计将为公司带来约 846 亿美元的净募资额。 Anthropic 向美国证券交易委员会提交的更新文件还披露了其经营数据。2026 年前九个月，公司实现营收
    332 亿美元，而去年同期仅为 25 亿美元，增速极为惊人。同期净亏损为 1040 亿美元，其中 943 亿美元来自可转换债券及其他金融工具的公允价值变动，属于非经营性账面影响；该期间的经营亏损实际为
    1
