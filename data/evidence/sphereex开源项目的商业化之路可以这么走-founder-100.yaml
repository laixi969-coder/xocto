  fact: 本文首发于 Founder Park 公众号 · 2022 年 11 月 22 日   作为 SphereEx 创始人 & CEO，在现有的数据库开源项目 ShardingSphere 做了
    5 年之后，张亮才决定进行商业化的创业，原因很简单， 「我们目前的数据库有可能向大一统的方向完全被打破掉，未来数据库一定是碎片化的时代。」 希望能在数据库碎片化的前提下提供一个平台，可以解决大量用户使用和选择数据库的痛点，解决成本问题。      至于开源项目和商业化项目并行的问题，他觉得完全不冲突，
    「大家有明确的边界，知道什么功能该放到商业，什么功能该放到开源」 ，甚至，开源项目还能够免费为商业化项目做宣传，提高用户粘性。    而聊到开源的本质时，张亮认为， 「如果本质为了挣钱，可能不太适合做开源。一定是觉得它有意思、好玩，才能去做。」
    开源本身是一种信仰，也是一种商业模式的选择，和闭源没有高低之分。    而对于大厂入局开源，以及中国开源项目目前的误区，张亮也有很多话要说。                 数据库是一个碎片化的时代已经不可避免，想通过一个数据库解决所有问题，这个时代已经一去不复返了。    开源只是不同的商业模式，和闭源相比没有好坏和高尚之分。    技术本身是没有秘密的，一项技术不在于它没有人能复刻，开源了，大家都用，并且不断地为它贡献每个人的智慧，才能成为真正的技术制高点。    真正的开源项目想做好，一定是面向长期主义的，是以终为始去做。                    01           创业是为了解决       数据库的碎片化痛点       Founder
    Park：数据库开源近两年非常火，这个现象背后的原因是什么？        张亮    ：2005 年-2006 年用开源的已经非常多，也非常好用，当时很多功能基本上都是从开源框架里去来的。如果
    IT 不再发展，像原来的方式，只是做业务、做新功能，开源也不会成为那么火热的话题。实际上 IT 的进展非常快，目前是面向分布式的环境，以及所有互联网的后端都在面向云环境。那些曾经好用的开源项目，在云的环境下、在分布式的环境下未必是最好用的状态。    2012
