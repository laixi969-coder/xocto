  project_slug: '2026'
  url: http://www.geekpark.net/news/369549
  title: Anthropic 将发招股书，预计募资 1300 亿美元超越 SpaceX；腾讯发布 HY4 preview 模型；科隆游戏展多个展位失窃
  published_at: '2026-08-29T00:32:32Z'
  collected_at: '2026-08-29T03:43:29Z'
  source_kind: market_signal
  tier: independent
  fact: "消息称 Anthropic 最早 10 天后公布招股书  \n 据知情人士称，Anthropic 计划在美国劳动节（9 月 7 日）后公布其 IPO 招股说明书，并可能在 9 月下旬或\
    \ 10 月初在美上市。 \n 该公司拟允许现有股东在 IPO 中出售股份，部分股东的禁售期可能超过 180 天，这将降低 IPO 后的抛售压力。 \n 报道称，Anthropic 希望在 IPO\
    \ 中筹集至少 1300 亿美元以扩张算力，这将超过 6 月上市的 SpaceX，当时其筹集了 860 亿美元。（来源：财联社） \n   \n  腾讯发布混元 Hy4 preview 模型  \n\
    \ 8 月 28 日，腾讯发布并开源混元 Hy4 preview。 \n 这是继 Hy3 正式版之后，腾讯推出的新一代大模型：总参数从 295B 增加到 770B，激活参数从 21B 增加到 49B，上下文长度也从\
    \ 256K 扩展至 1M。模型已经同步进入 WorkBuddy、CodeBuddy、元宝和 ima，并可通过腾讯云 TokenHub 及 OpenRouter 调用。 \n Hy4 preview\
    \ 继续走普惠的高性价比路线。根据公布的价格信息，Hy4 preview 输入 6 元/百万 tokens，输出 18 元/百万 tokens，缓存命中 0.3 元/百万 tokens。 \n 相比\
    \ Hy3，Hy4 preview 把优化重点进一步推向软件工程、办公分析、游戏开发和科学研究等生产力任务。 \n 腾讯称，Hy4 preview 首次参与了自身训练方法、数据策略、评估体系和底层算子的优化，并通过多轮实验将推理吞吐相较基线提升\
    \ 31.8%。（来源：极客公园） \n   \n  美团二季度净利扭亏为盈，王兴：美团不做 Token 工厂  \n 8 月 28 日，美团发布 2026 年第二季度业绩报告。 \n 二季度美团实现收入\
    \ 1046 亿元，同比增长 14.4%。净利润为 21.6 亿元，同比增长 490%。美团一季度净亏损为 68.3 亿元，环比实现扭亏为盈。 \n 美团表示，随着行业竞争趋于理性，叠加二季度旺季效应，公司各项业务恢复稳健增长，经营利润环比由负转正。\
    \ \n 王兴在财报业绩会上谈到 AI 时表示：「对我们而言 AI 发展的核心并非单纯比拼大模型本身的参数与性能，而是借助 AI 重塑企业组织模式、产品形态与全业务"
- id: ev-d145a8cf305eb989
  project_slug: '2026'
  url: http://www.geekpark.net/news/369478
  title: 一年卖出 3 万台后，极壳将在 IFA 发布下一代外骨骼
  published_at: '2026-08-27T11:57:55Z'
  collected_at: '2026-08-29T03:43:29Z'
  source_kind: market_signal
  tier: independent
  fact: "作者 | siqi \n 编辑 | 郑玄 \n   \n 据 Hardwire 了解，消费级外骨骼领域头部企业极壳（Hypershell）近期已完成对多关节下肢外骨骼产品的研发。这款名为「Halo」的新一代旗舰产品将于\
    \ 9 月 3 日在 IFA（柏林消费电子展）上正式发布。 \n 极壳（qiào，四声）成立于 2021 年底，是全球最早把外骨骼带入消费市场的公司之一。2024 年 12 月，极壳第一代产品 Hypershell\
    \ X 系列正式量产交付。2025 年，极壳在第一个量产年份交出了全球累计交付 3 万台的答卷，北美（美国）、欧洲（法德意英等）和中国是公司的三大核心市场。极壳的产品在户外运动、户外作业、银发人群这\
    \ 3 个核心圈层里受到了早期用户的认可。 \n 去年 11 月，极壳完成 B 轮融资，投后估值达到近 27 亿元。今年 5 月，极壳又官宣了最新一笔由蚂蚁集团和美团龙珠领投的 5000 万美元\
    \ B+轮融资。 \n 不过，在极壳创始人孙宽看来，这个全新品类目前仍处于早期阶段。他认为，可穿戴外骨骼目前只完成了「从 0 到 0.1 阶段」的 PMF 验证。目前，孙宽的绝大部分精力都专注在产品预研层面，「某种程度上，对下一代产品的关心要比量产产品还要更多。」\
    \ \n 可穿戴外骨骼的产品形态必然在未来几年里将面临从硬件形态到软件算法的快速迭代。其中，多关节协同工作、AI 深度介入助力算法，是明确的技术方向。孙宽认为，比起关注竞争，投入研发、提升产品体验，才能让可穿戴外骨骼实现从小众消费群体到大众消费市场的跨越。\
    \ \n Hardwire 将于 9 月初推出对极壳创始人、CEO 孙宽的文字访谈和播客对话，敬请关注。 \n   \n 一体化+四电机，下肢外骨骼出现「新形态」 \n 极壳即将推出的新一代旗舰产品\
    \ Halo，将采用行业首个一体化构型，通过髋关节、膝关节左右两侧共 4 个助力电机的协作控制，实现全腿助力，大幅提升面向复杂地形的适应能力和助力有效性。 \n 这是可穿戴外骨骼品类在硬件形态层面一次积极的向前探索。\
    \ \n   \n Hypershell 新一代下肢外骨骼产品 Halo | 图片来源：Hypershell \n 作为一个近 3 年才出现的全新品类，可穿戴外骨骼产品的硬件形态仍处于早期探索阶段。不同于手机、平板等成熟品类，无论学术界还是产业界对产品「最佳形态」的判断尚未收敛。\
    \ \n 消"
