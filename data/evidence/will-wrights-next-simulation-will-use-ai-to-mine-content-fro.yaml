  fact: The computer gaming world hasn't heard much from Will Wright ( SimCity , The Sims ) since the
    underwhelming release of Spore in 2008 and Wright's subsequent departure from Maxis owner EA . Now,
    well over 15 years later, Wright is starting to promote his next digital simulation, which will use
    generative AI technology to craft a game-like experience from players' memories. MyMems , which is
    slated to release next year, differentiates itself from Wright's previous projects by "turn[ing] the
    simulation inward," as Wright's Gallium Studios and partner Artificial Agency put it in a press release
    this morning . The game will mine memories provided by the player to create digital people that can
    then form teams to solve puzzles in the game world. “If my Grandmother ended up in a Grand Slam match
    against Serena Williams, who would win?" Wright says by way of example in the release. "If I had to
