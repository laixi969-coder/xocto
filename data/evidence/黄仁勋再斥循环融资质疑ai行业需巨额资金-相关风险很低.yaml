  title: 交付 19 天，小米澎程破万台，雷军又赢了。
  published_at: '2026-10-06T01:15:06Z'
  collected_at: '2026-10-06T02:19:01Z'
  source_kind: market_signal
  tier: independent
  fact: "图片来源：视觉中国 \n 10 月 1 日，小米汽车公布了 9 月交付成绩单：单月交付量首次突破 4 万台。 \n 这个数字放在新势力阵营里排第三，仅次于零跑（10.56 万台）和小鹏（4.13\
    \ 万台），领先鸿蒙智行（3.75 万台）。 \n 但真正值得关注的，不只是「小米又卖爆了」。 \n 更有意思的是，9 月刚上市的澎程系列，首月交付就超过 1 万台。而这件事，偏偏发生在增程市场整体降温，上半年批发销量同比下滑\
    \ 13.1%的背景下。 \n 一个看似「风口已过」的赛道，被小米硬生生撕开了一道口子。 \n 小米澎程是如何成功的？ \n 从 3 万到 4 万 \n 过去几年，增程市场的剧本非常魔幻。2020\
    \ 年，增程式汽车全年总销量才 3 万多台。那时候，增程还经常被一些车企高管嘲讽为「过时技术」，甚至被说成是「脱裤子放屁」。但市场从来不听嘴炮，它只看用户掏不掏钱。 \n 后来的事情大家都看到了。\
    \ \n 2021 年，增程销量突破 10 万台；2022 年涨到 25 万台；2023 年冲到 64.2 万台；2024 年更是摸到 116.7 万台。短短几年，增程从新能源鄙视链底端，逆袭成为行业「黑马」。\
    \ \n 原因也很简单，它解决了中国家庭买新能源车时最现实的里程焦虑。城市通勤能用电，长途出行不用怕没桩。既有电车的低成本体验，又能保留燃油车时代的安全感。 \n 但到了 2026 年，剧情突然变了。\
    \ \n 上半年增程批发销量只有 50.4 万台，同比下降 13.1%。6 月单月批发量更是暴跌 25.2%，创下近五年最大跌幅。增程在新能源市场里的份额，也从最高超过 10%，一路滑落到 6%左右。\
    \ 在纯电、插混、增程三条路线里，增程成了唯一一个下滑的市场 。 \n   \n 小米澎程 N70 ｜来源：小米汽车 \n 这时候小米杀进来，多少有点「来晚了」的味道。 \n 9 月 7 日，小米在秋季发布会上推出澎程系列四款增程车型：N70\
    \ Pro、N70 Max、N90 Max、N90 Max 探索版。发布会现场，锁单 4 分钟破万。9 月 12 日开启交付， 到月底只用了 19 天左右，交付就突破 1 万台 。 \n 这直接把小米汽车月交付从\
    \ 3 万台级别，推上了 4 万台台阶。 \n 更重要的是，澎程的爆发，并没有明显挤压 SU7 和 YU7。很多品牌都会遇到一个尴尬局面：新车一上市，老车立刻掉量。表面看总销量涨了"
