  fact: Ukrainian drone strikes have knocked out two of five data centers belonging to the Russian tech
    giant Yandex. The damage has left Yandex, known as “Russia’s Google” because it operates the country’s
    most popular search engine, struggling to maintain its AI chatbot and other online services. The Ukrainian
    drones struck Yandex data centers in the Sasovo and Kaluga regions of Russia on October 8 and October
    9, according to Reuters . Those actions came as a direct response to a Russian drone strike campaign
    targeting Ukraine’s data centers , which has disrupted mobile phone and Internet services for thousands
    of Ukrainians since late September. “We continue to respond to Russia’s attacks on Ukraine, and we’re
    doing so with high precision,” said Ukrainian President Volodymyr Zelenskyy in a post on X. “Another
    data center was hit as well—our symmetrical response.” Read full article Comments
