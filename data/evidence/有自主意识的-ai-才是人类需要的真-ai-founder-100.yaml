  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 9 日              今年 6 月份，谷歌旗下的工程师宣称他们的语言模型 LaMDA 已经觉醒出人类智能，引发了一场关于
    AI 觉醒的讨论风波，似乎科幻作家们所描述的「AI 觉醒」的恐怖未来即将发生。  现实却是，人们越来越不满足于现有 AI 的智能化水平了。  游戏开发商想让他们的 NPC 越来越像人，而不用人工去编辑脚本；企业想让他们的
    AI 客服再智能一些，能处理更多的问题；消费者也不满足于现在的 Siri、小爱、小冰、小娜，只能播报天气的 AI 也太让人扫兴了。  怎么样让 AI 再智能一些，怎么样让 AI 更像人一些？创业公司心识宇宙试图从脑科学和人工智能的融合技术出发，打造
    Human-level AI 虚拟人，想让 AI 拥有自主意识，拥有真正的「数字心识」。  「 我们希望 AI 是有趣的，是有人味的，有生命感的。 」心识宇宙的联合创始人陈阳这样介绍他们的目标，在他看来，未来元宇宙里，除去人类以外的原住民，也应该是这样有着自主意识的
    AI。  「 如果每个原住民的个性都很趋同，玩家会觉得这个世界非常无聊，非常单调。 」这样的元宇宙，应该也不是我们所梦想的元宇宙。心识宇宙的野心不仅于此，他们甚至想看到 AI 的内心世界，思考和进行逻辑判断的过程。  而这样的
    AI 到底如何应该打造，数字心识的技术难度在哪里，商业前景如何，你都可以在接下来的采访中看到。              我们尝试提出一套新的 AI 的范式来塑造数字心识，还要把数字心识尝试落地实现，同时围绕数字心识在现实和虚拟的一些新的机会和新的场景提供新的服务。    开放世界游戏大量看起来比较智能的
    AI，实际上背后都是用类似于行为树或固定的脚本进行驱动的，并不具备开放式的交互和真正能产生自己想法、内容的 NPC。    一个完全顺从用户，包括一个完全任务解决式的 AI 很难达到「人味」的水平。    虚拟世界原住民需要具备的要素，除去表皮上看起来像人之外，我们应该期待他们是有趣的灵魂，同时也是有想法的灵魂。                01       创业是想做出        元宇宙里真正的原住民       Founder
    Park：你们公司具体的业务是什么？       陈阳    ：心识宇宙是一
