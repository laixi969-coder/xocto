  fact: Smartglasses have always faced an uphill road to acceptance. Not only is propping a computer up
    on your nose an uncomfortable proposition, but the privacy aspect has been vexing people since the
    Google Glass days . Now, Google is ready to take another swing at " intelligent eyewear " for the
    Gemini era after previewing its plans a couple of times. The first glasses are up for preorder today
    from Gentle Monster and Warby Parker, but they're no impulse buy. These devices are a collaboration
    between Google, Samsung, and the aforementioned eyewear designers. Gentle Monster and Warby Parker
    have each designed a few different frames, with options for transparent and tinted lenses. Samsung
    is providing the computing hardware that fits inside them, and Google has the software covered. Warby
    Parker has designed three frames for Google eyewear, called Alden, Reid, and Wren (see above). They
    are available with both standard optical and sun lenses in Pine, Saddle, and Jet Black colors at $395
