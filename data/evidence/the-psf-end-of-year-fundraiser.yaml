  fact: 'The PSF end-of-year fundraiser With my Python Software Foundation board director hat on: we''ve
    launched our end-of-year fundraiser for the non-profit that supports Python development and the Python
    community. If your company or your work benefits from Python, please consider donating this year!
    The PSF looks after the IP behind Python, operates PyPI, sponsors core developer sprints, supports
    community events (including running PyCon US every year), and employs a small and excellent staff
    team to keep everything running. We also operate the Developers in Residence program , which now includes
    three security developers (welcome, Brett Smith) focused on helping secure Python, PyPI, and the wider
    ecosystem. Tags: python , psf'
