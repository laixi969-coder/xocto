  fact: In October 2025, four Black high school students were sharing Cool Ranch Doritos after football
    practice, winding down and waiting for their rides home. It was then, in the lull of a moment any
    teen with after-school activities knows well, that the school’s AI gun detection system suddenly flagged
    one teen holding a bag of chips as a potential gunman. Within two minutes, Baltimore County Public
    Schools officials who reviewed security camera footage linked to the alert determined there was no
    actual threat. They recognized the Doritos bag and canceled the alert, which notified not only other
    school officials but also the Baltimore County Police Department that no response was needed. The
    false alert could have ended there—before a traumatizing campus clash with police—but it didn’t. Read
