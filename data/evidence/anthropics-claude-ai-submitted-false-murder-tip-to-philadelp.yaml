  fact: An Anthropic AI model submitted a false tip about an unsolved murder to Philadelphia police, the
    company and police department confirmed on Friday. A Claude model sent the false tip on July 18 to
    the Philadelphia Police Department's website for submitting information about unsolved murders, but
    it was flagged by a spam filter. Anthropic apparently discovered the incident on September 28 and
    informed the police department about it on October 8. During internal testing, Claude Haiku 4.5 was
    instructed to complete various forms up to the final submission stage and to stop before submitting
    those forms. "Several times Claude mistakenly submitted the form instead, expecting there to be an
    additional confirmation page," Anthropic said in a report describing "unintended model actions we’ve
    observed during evaluations and internal use of Claude." Read full article Comments
