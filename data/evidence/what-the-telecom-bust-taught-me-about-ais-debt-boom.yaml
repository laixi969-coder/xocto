  fact: By David Spreng The financing of the AI buildout is shifting from equity to debt, and those who
    invested through the telecom bubble may recognize what that shift tends to mean. There is an old story
    in Stephen Hawking ’s “A Brief History of Time” about a scientist lecturing on the universe when a
    woman in the audience insists that the world rests on the back of a giant turtle. Asked what the turtle
    stands on, she replies that it’s “turtles all the way down.” Her response is what philosophers call
    infinite regress — a chain of claims in which each one rests on another of the same kind and solid
    ground never arrives. David Spreng is the founder, co-CEO and co-CIO of Runway Growth Capital. I think
