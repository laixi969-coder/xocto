  fact: AI marketing platform Miracly , developed by The Wild Ventures, the company behind Scandinavian
    home decor brand Wild Palace, has launched following the announcement of a €1.8 million pre-seed funding
    round. The round was led by Beenext Ventures and Lotus, alongside a Swedish family office, with participation
    from existing investors including Stefan Lindeberg (founder of Creandum), Alex Bouaziz (founder and
    CEO of Deel), Thomas Ekman (founder of 6GAI and former CEO of Axel Johnson, Dustin and Tele2), Hedda
    Baverud Olsson (founder and CEO of Lassie), and Parham Benisi (partner at Pophouse). With offices
    in Sweden and Singapore, Miracly has developed an AI-powered marketing platform designed to help businesses
    monitor, manage and improve their visibility across AI search and answer engines. The platform combines
    generative engine optimisation (GEO), marketing analytics and automated execution, allowing companies
