  fact: A central goal of autonomous reinforcement learning is continuous policy training without external
    resets. However, existing paradigms largely depend on underlying environmental reversibility, a property
    absent in real world manipulation, where events such as pushing objects off tables or spilling granular
    substances cannot be undone. We introduce REVERSAL-BENCH, a benchmark that controls reversibility
    via a continuous parameter ρ∈ [0, 1] and provides a reset oracle, a ground-truth verification mechanism
    to test state recoverability across eight manipulation settings in five physics engines…
