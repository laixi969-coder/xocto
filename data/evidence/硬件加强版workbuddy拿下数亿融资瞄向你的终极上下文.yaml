  fact: "作者｜苏子华     \n  编辑｜靖宇  \n  \n \n \n 现场体验过  Violoop  之后，很多关于未来的「AI 助手」该长什么样、能做些什么、能力的极限究竟在哪的困惑，可能都会迎刃而解。\
    \ \n 因为 Violoop 已经把它们变成了现实。 \n \n   \n   \n  Violoop 实物图｜图片来源：Violoop  \n \n   \n  Violoop 是一款巴掌大小的硬件，即插即用，V4\
    \ 版本通过一根 Type-C 线连在电脑上，不挤占电脑的 CPU/GPU 资源。它可以通过实时读取电脑屏幕上的全局信息，获得用户全部的上下文，实现主动式的 AI 助手。  \n 极客公园获悉，Violoop\
    \ 半年内完成了亿元级天使轮及 Pre-A 轮融资。联想创投、中金保时捷、蓝驰创投、元生资本、启赋资本和 Zero2IPO Ventures 共同投资。 \n Violoop 的 CEO 何佳霖\
    \ 是一位连续创业者，毕业于  UC San Diego  的 CS 专业，曾入选过 YC 创业营。CTO King Zhu 是一位天才学霸，曾在 MIT 的 EECS 专业用 3.5 年完成本硕，同届最快毕业，后来在微软的\
    \ Xbox、HoloLens、Surface 等多个业务线担任核心工程师。 \n   \n   \n 左为何佳霖，右为 King Zhu｜图片来源：受访者 \n   \n 何佳霖向极客公园演示了\
    \ Violoop 的一个使用场景： \n 你在微信里跟同事聊事，对方甩来一句：「把你上次那个简历发我一下。」 \n 你不需要切回桌面翻文件夹——电脑屏幕的角落，一个小框自己跳了出来： \n 「要帮你把张三的简历发过去吗？1.要；2.不要。」\
    \ \n 你按下键盘上的 1。一秒钟左右，AI 已经自己打开文件夹、找到文件、把简历贴进了对话框。 \n 没写一个字的提示词，也没打开任何 AI 软件。 \n 这就是 Violoop 想让人们习惯的新工作方式，将整台电脑变成一个眼里有活、主动帮你干活的助手。\
    \ \n   \n \n \n \n \n \n \n \n  \n \n \n \n \n  全局主动式 AI，是如何工作的？  \n     \n \n \n \n Violoop 的形态很简单，最新版本用一根\
    \ Type-C 线连上电脑，把视频采集和控制合并到一个口，再插一根电源。Mac、Windows、Linux 都能用。 \n 它的工作方式，可以拆成三步"
