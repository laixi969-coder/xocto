  fact: 'Early-stage startup investor Plural says it has closed on its largest fund to date — just over
    $1.1 billion, or 1 billion euros — to lead early-stage investments across Europe. With the announcement,
    Plural joins a select group of European venture firms that have raised funds of a billion dollars
    or more in recent years. Others include Balderton Capital , Atomico and Index Ventures , which is
    co-headquartered in London and San Francisco. It also follows a Q3 that marked Europe’s strongest
    venture funding quarter in years . “Our common theme is ambition. We go after the founders that are
    building the most ambitious things we can humanly find,” Sten Tamkivi , a co-founder of the firm,
    said in an interview with Crunchbase News. “Our stated objective remains to have a GDP-level impact
    on Europe with the companies that we back.” Plural partners from left: Ian Hogarth, Taavet Hinrikus,
    Khaled Helioui, Carina Namih, Sten Tamkivi and Pierre-Dimitri Gore-Coty. (Courtesy photo) Plural’s
