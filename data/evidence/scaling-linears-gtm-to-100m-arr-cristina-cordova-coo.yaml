  fact: Open video on YouTube ↗ Linear was founded to build a better issue tracker. Seven years and $134
    million in funding later, its CEO Karri Saarinen published a post titled "Issue tracking is dead."
    In this episode, we chat with Cristina Cordova , COO of Linear , about how the company navigated that
    and how its go-to-market changed along the way. Cristina spent seven and a half years at Stripe, led
    platform and partnerships at Notion, and was a partner at First Round before joining Linear in 2023.
    Linear's founders built it after living with legacy issue trackers at Coinbase, Airbnb and Uber, and
    it spread self-serve through startups like Vercel and Ramp. When she joined, Linear had about 40 people
    and one salesperson. Since then it has shipped an MCP server, a platform for building agents into
    Linear, integrations with Codex, Cursor and GitHub Copilot, and its own Linear Agent. Agents created
    3% of Linear's work a year ago. Now it's more than half. Linear passed $100 million in ARR this
