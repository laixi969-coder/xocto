  fact: With a customer-managed knowledge base on Amazon Bedrock , you provision and scale the vector
    store, tune the embedding model and index settings, and plan capacity for each new data source. The
    migration guide in the Agent Toolkit for AWS helps you migrate to Amazon Bedrock Managed Knowledge
    Base . Managed Knowledge Base takes over that work and adds new retrieval capabilities, and your team
    keeps control of the content and the application that uses it. Moving a production knowledge base
    means your team maps its configuration, creates the replacement, ingests content, updates the application’s
    retrieval call, and validates retrieval before switching traffic. To help, we added a knowledge base
    migration guide to the amazon-bedrock skill in the Agent Toolkit for AWS . The guide gives your coding
    agent the context to plan the migration with you, starting with read-only discovery and a plan you
