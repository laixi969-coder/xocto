  fact: With Live Data in Apps in Amazon Quick, AI-built apps query your governed Quick Sight datasets
    in real time instead of static, build-time snapshots. Each query runs as the person viewing the app,
    so row-level and column-level security apply per reader. Learn how to build, publish, and share a
    live-data app using natural language.
