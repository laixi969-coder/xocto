  fact: "Computer programming is, fundamentally, about two things: \n \n Problem-solving using computers\
    \ \n Learning to control complexity while solving these problems \n \n I have a hard time imagining\
    \ a future where knowing how to solve problems with computers and how to control the complexity of\
    \ those solutions is  less  valuable than it is today, so I think it will continue to be a viable\
    \ career even with the advent of AI tools.  \n —  Carson Gross  \n\n     Tags:  computer-science ,\
    \  carson-gross ,  careers ,  ai"
