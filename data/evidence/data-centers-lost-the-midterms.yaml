  fact: Data center developers are poised to face a more restrictive building environment after voters
    across the country voted in candidates who favor moratoriums and ballot measures that put more obstacles
    on their expansion, delivering a stinging blow to a central pillar of the AI industry. Of voters polled
    by NBC News on Election Day, 76 percent said they opposed data centers in their communities. Dozens
    of local communities voted directly to restrict development through ballot measures . And upset winners
    like Texas Democratic Governor-elect Gina Hinojosa and Michigan's Democratic Senator-elect Abdul El-Sayed
    support moratoriums on development. … Read the full story at The Verge.
