    2716\" height=\"2308\" alt=\"image\" src=\"https://github.com/user-attachments/assets/84734e74-163d-4d12-b166-ffcf6749d563\"\
    \ />\r\n\r\nEmbeddingGemma 2 is a multimodal embedding model from Google built on the Gemma 4 architecture.\
    \ It encodes text, images, audio, and video, individually or combined in one input, into a shared\
    \ 768-dimensional vector space for cross-modal retrieval, semantic similarity, clustering, and classification.\
    \ It uses Matryoshka Representation Learning, so embeddings can be truncated to 512, 256, or 128 dimensions.\
