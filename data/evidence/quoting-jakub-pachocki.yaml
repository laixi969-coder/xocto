  fact: "The strongest argument I see for continuing to train much smarter models quickly is the need\
    \ to build defensive systems against the dangers posed by other AI. [...] \n We will need powerful,\
    \ aligned AI for defense; to secure infrastructure, to protect against rogue agents in real time,\
    \ and to invent entirely new protective measures. This will be a primary focus of OpenAI’s deployment\
    \ efforts. \n At the same time, even with the uncertainty that comes from anticipated broad AI progress\
    \ and the need to build defensive systems, we must not let that become an excuse for recklessness.\
    \ The idea of racing forward at all costs seems absurd once one internalizes the seriousness of the\
    \ stakes.  \n —  Jakub Pachocki , Chief Scientist at OpenAI \n\n     Tags:  ai-ethics ,  openai ,\
    \  ai"
