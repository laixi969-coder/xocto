  fact: Italian AI startup Rulen (formerly LexSA) has raised €1.8 million in its first funding round to
    further develop its AI-powered platform for the tax and accounting sector and support its commercial
    expansion. The round was led by VC Partners , with participation from Growth Engine, AME Ventures,
    Zest through its Magic Mind vehicle, Alpha Venture and a group of industry business angels. Launched
    at the end of 2025, Rulen develops an AI operating platform designed to automate tax and accounting
    workflows, helping professionals reduce repetitive tasks and manage compliance processes more efficiently.
    The platform integrates with existing software and third-party systems, including the Italian Revenue
    Agency's online taxpayer records (Cassetto Fiscale), allowing firms to automate processes from data
    collection to review and document production while maintaining professional oversight. The company
