  fact: Before James Kim evaluated education startups, he used their products in his classroom. The Reach
    Capital partner began his career as a high school math teacher with Teach For America after studying
    astrophysics at Yale . He later worked in college access and Yale admissions, and earned graduate
    degrees in business and education from Stanford before joining Reach. As a teacher, he was an early
    user of ClassDojo , an experience he describes as “game-changing.” James Kim, partner at Reach Capital.
