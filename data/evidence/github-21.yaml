  title: 怎么让 AI 把页面设计美观好看的
  published_at: '2026-11-03T10:02:21Z'
  collected_at: '2026-11-04T02:20:45Z'
  source_kind: product
  tier: independent
  fact: "使用 AI 生成界面有没有遇到过这种情况：功能布局都已经确定，界面效果又总是达不到自己想要的效果，让 AI “更美观一点”，它又会给你一套全新的风格，一直都达不到期望\r\n\r\n最近正好碰到了这个问题，就分享几幅图来请大家讨论下。\r\
    \n\r\n这是我正在进行的开源抓包工具 [Sniffy]( https://github.com/mintfog/sniffy) 中的根证书安装向导的界面，它的作用是让用户选择自己的设备，并按照页面提供的文字与截图进行操作。这是使用\
    \ gpt 画图生成的几版不同的设计方案：\r\n\r\n![几版不同的设计方案]( https://cdn.gosniffy.com/v2ex/2026-11-03/10-%E5%9B%9B%E7%A7%8D%E5%B8%83%E5%B1%80%E6%96%B9%E6%A1%88%E5%AF%B9%E7%85%A7.png)\r\
    \n\r\n不同方案都有一些值得使用的部分，但整体感觉有点过于强推：标题与图标、按钮、内容区都想突出表达出来，放到实际的软件中并不符合我的预期，我更希望整体看起来比较清爽，信息的优先级更加明确，能够与整体软件保持一致的风格\r\
    \n\r\n后来也用过设计相关的 Skills ，像 frontend-design 和 impeccable 等，给出了现有页面的图片，但“我觉得不好看”到底如何向 AI 表达才能让 AI 理解并输出符合期待的结果仍然存在比较大的不确定性，具体的要求需要详细给出，如字体字号、间距、高度和宽度比例，宽泛要求的情况下，则比较看运气\r\
    \n\r\n我最终参考如下自己先画出大致草稿的版本来做布局：\r\n\r\n![根据自己草稿做出的界面]( https://cdn.gosniffy.com/v2ex/2026-11-03/08-%E6%9C%80%E7%BB%88%E7%89%88iOS%E5%AE%89%E8%A3%85%E5%BC%95%E5%AF%BC.png)\r\
    \n\r\n在顶部选择平台，然后左侧为当前步骤，右侧为操作截图。感觉更接近我的预期了，用户也可以直接看到应该操作什么内容，同时也欢迎大家看看几版方案中，哪版会更喜欢一些？\r\n\r\n也很好奇大家使用\
    \ AI 生成 UI 时，一般会把设计要求明确到什么程度？\r\n\r\n- 参考图如何提供比较有效？是给完整的一张页面，还是分别给出布局、配色和控件风格？\r\n- 怎样描述“不"
