  title: 奇瑞说，中国家庭的下一台车是摩托
  published_at: '2026-10-21T14:26:58Z'
  collected_at: '2026-10-22T00:42:47Z'
  source_kind: market_signal
  tier: independent
  fact: 「SUV 有了、轿车有了、MPV 也有了，你再买什么？中国家庭接下来要买的车，就是一台摩托。」 说这话的是奇瑞智能科技副总经理涂小岳。10 月 19 日，2026 奇瑞全球创新大会期间，奇瑞旗下的两轮公司零维科技第一次正式面对媒体。芜湖下着雨，展台上摆着一台白色的增程巡航车、一台银色的电动探索踏板，还有一顶能把导航投到眼前的智能头盔。
    车企造摩托，这件事本身不算新闻。宝马、本田早就两条腿走路，长城有灵魂，吉利有钱江，长安刚把轻骑收入囊中。真正值得多看两眼的是，奇瑞给这家公司定的目标，听上去不太像一家摩托车厂。 出口是本田的四倍，利润不到六成
    先算一笔账。中国摩托车商会的数据显示，2025 年全国摩托车销量约 2197 万辆，其中出口 1337 万辆，连续 31 年全球第一。但国内销量在下滑，燃油摩托内销同比减少 6.18%；唯一逆势猛涨的是
    250cc 以上的大排量休闲车型，全年卖出 95 万辆，增长近 26%。 通勤在萎缩，玩乐在放量 ，这是零维入场的大背景。 另一组数字来自零维科技总经理黎小君，他此前在一家日系摩托品牌担任总经理。「我们的摩托车出口产能大约是本田的
    4 倍，但利润还不及本田的 60%。」量大利薄，大量利润来自低端制造。奇瑞控股集团执行副总裁鲍思语的说法更直接，高档摩托车仍被外资品牌垄断，「一台卖两三万元的高速摩托车就算是好的了」。 所以零维瞄准的不是通勤代步。涂小岳把全球约
    6500 万辆的摩托车市场拆成三块，东南亚、南亚的代步刚需，欧美流行的高速 Scooter，以及把摩托当成生活方式的哈雷、宝马、金翼这一类。零维要的是第三块，他估算约 3000 万辆，「和中国汽车市场差不多」。
    这个项目 2023 年就在奇瑞内部启动，2024 年 11 月零维科技由奇瑞智能科技与淮北市国资共同设立。至于投入，涂小岳的回答很奇瑞，「一个近六千亿的公司，花几亿、十几亿做一件事，其实不算那么大的资源。」
    汽车技术下放，最难的不是技术 零维这次亮出的家底，一眼就能看出汽车血统。 银色的 SOLO X5 是一台纯电 ADV 踏板，官方称 20 分钟可从 20% 充到 80%，用的是液冷温控快充，充电口和汽车通用。白色的
    GROW C3 是增程巡航车，从公开信息来看，纯电续航约 100 公里、综合续航约 600 公里，市区用电、长途加油。背后还有一套叫「鲲鹏」的 4 档
