  fact: 'The UK prime minister today confirmed that the UK plans to ease restrictive non-compete clauses
    in workers'' employment contracts, which could include banning them, marking a boon for the UK startup
    sector. Speaking at the Innovation Nation Summit in Manchester, Andy Burnham, the UK prime minister,
    said: “I can confirm that we will legislate to make sure that non-compete clauses will no longer be
    a barrier to hiring for our most promising startups and scaling firms.” The move comes as the UK government
    looks to boost innovation and give the economy a boost. According to a video of Burnham speech, reported
    by Politics UK, Burnham said non-compete clauses “stunt innovation” and likened the rule change to
    the “Bosman ruling for the innovation sector”. The move follows a campaign by leading tech startups
    such as ElevenLabs and Synthesia to limit the use of non-compete clauses and extended notice periods.
    Non-compete clauses are a provision in an employment contract that restricts an employe'
