  fact: Causa Prima , a company developing an autonomous finance platform for businesses, has raised $20
    million in a seed funding round led by Base10 Partners . The round also saw participation from QED
    Investors and FJ Labs, alongside existing investors Creandum, Kfund and Borusan Ventures. The investment
    comes just three months after its $10 million pre-seed round, bringing the company's total funding
    to $30 million. Founded by Maex Ament (CEO), Henrik Gebbing and Philip Stanislaus , Causa Prima is
    developing a platform designed to automate financial processes between companies, particularly invoice
    approvals, dispute resolution and payments. The company focuses on an area of corporate finance that
    remains largely manual despite significant investment in financial software. According to a study
    by Atradius, nearly half of credit-based B2B sales in the US are overdue, highlighting the challenges
