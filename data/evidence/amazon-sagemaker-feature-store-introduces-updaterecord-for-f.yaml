  fact: Amazon SageMaker Feature Store now supports feature-level writes. With the new UpdateRecord API,
    you can update one or more feature values in a single call without reading or rewriting the entire
    record. It is available for both the Standard (Amazon DynamoDB) and In-Memory (Amazon ElastiCache)
    online store tiers.
