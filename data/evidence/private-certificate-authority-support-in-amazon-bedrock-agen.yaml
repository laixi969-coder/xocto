  fact: Many teams that build applications self-host their identity provider (IdP), such as Keycloak or
    PingFederate, inside a private network. These IdPs usually present a TLS server certificate from a
    private certificate authority (CA). With private CA support in AgentCore Identity , a capability of
    Amazon Bedrock AgentCore, your agents can now connect to these IdPs while trusting the private CA
    that your organization already uses. AgentCore Identity now supports private CA certificates for private
    identity providers. You store the PEM-encoded CA certificate in AWS Secrets Manager or Amazon Simple
    Storage Service (Amazon S3) and reference it from your credential provider . The CA certificate contains
    only the public certificate, not its private key. AgentCore Identity uses it to validate the server
    certificate presented by your IdP’s discovery, JSON Web Key Set (JWKS), and token endpoints. The CA
