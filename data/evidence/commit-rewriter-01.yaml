  fact: "Release:   commit-rewriter 0.1  \n         I built this little web app the other day to help\
    \ edit the commit messages for the  Datasette security releases . The initial commits were full of\
    \ coding agent cruft and references to issue IDs from our private repository, so they weren't fit\
    \ for publication. \n If you want to edit the commit messages for a repository you can run it like\
    \ this: \n  uvx commit-rewriter path/to/repo\n  \n Omit the path if you are already in the directory\
    \ for that repo. \n   \n When you submit your edits the tool creates a timestamped branch of your\
    \ current repo state - to allow you to revert if you need to - and then rewrites every commit from\
    \ the first one you edited to the most recent. \n    \n    \n         Tags:  git ,  projects ,  python\
    \ ,  ai-assisted-programming"
