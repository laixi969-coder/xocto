  project_slug: 攻克超声穿颅读脑拿下-4-亿元新融资他们要做脑科学的英伟达
  url: http://www.geekpark.net/news/372148
  title: 攻克超声穿颅读脑，拿下 4 亿元新融资，他们要做脑科学的「英伟达」
  published_at: '2026-10-09T04:28:07Z'
  collected_at: '2026-10-10T01:46:29Z'
  source_kind: market_signal
  tier: independent
  fact: 一家深圳公司，让实时「看清」人类大脑变成了可能。 极客公园获悉，鲲为科技近期完成 4 亿元新一轮融资，新增股东包括 XVC、红杉中国，老股东夏尔巴、腾讯进一步加仓。 在鲲为位于深圳的研发中心，创始人刘家家向我们展示了实测对比。
    一边是价值数百万的海外顶级旗舰彩超设备，一边是鲲为自主研发的机器。当探头同时置于受试者颅骨侧面，海外设备的声波在穿透至大脑中线后便衰减进一片暗影，仅能拼凑出模糊的轮廓；而在鲲为的屏幕上，穿透颅骨后的脑组织结构清晰毕现，中脑核团、侧脑室乃至微细血管中的血流动态被毫秒级实时捕捉。
    穿透颅骨后的脑组织结构、血流动态等都能被清晰捕捉｜图片来源：鲲为 一场清晰的「代差」展现。 「传统超声长期陷入穿透力与分辨率不可兼得的工程困境，面对坚硬的颅骨几乎是雾里看花。」刘家家解释。为此，鲲为选择了一条违背行业常识的路径：放弃通过不断提升频率来换取清晰度的惯性，转向低频。
    鲲为的核心突破，在于将算力与算法引入物理声场，在低频段下兼顾了颅骨穿透力与高分辨率实时成像。这种将超声从成像升维为「声学空间智能」的技术跨越，彻底打开了超声在临床医学、脑科学及通用人工智能领域的想象空间。
    在中风抢救的急救车里，鲲为的便携设备几分钟内即可精准判别脑梗或脑出血，为患者争取到关键的黄金救治期；在脑机接口的前沿探索中，它为整个行业提供了一个非侵入且能够实时获取全脑功能数据的基础设施。 鲲为的全系列产品｜图片来源：鲲为
    鲲为已实现数千万订单，正站在商业化起飞拐点。但刘家家告诉极客公园，鲲为目标不止于做一家技术和产品领先的颅脑超声设备公司，而是成为赋能脑科学 AGI 的 Infra 公司：提供硬件设备和基础软件平台
    kOS，就像 AI 领域的英伟达提供显卡和 CUDA。全球不同技术路线的脑机接口 Lab，以及 NeuroAI 模型公司，都是他们的目标客户。 鲲为创始人刘家家｜图片来源：受访者 复刻蝙蝠，靠智能「看清
    」 人脑 鲲为的起点，源于对一项统治了行业几十年的常识的怀疑。 2008 年，刘家家从西安交通大学生物医学工程专业毕业后进入超声行业。他很快注意到，超声工业乃至更广泛的硬件领域，在 2000 年前后撞上了一堵无形的物理墙：
    从芯片的主频大战（AMD 与 Intel 争相突破 1GHz），到无线通信从 2G 到 5G/6G 的频段演进，再到半导体光刻机从可见光迈向 EUV——科技
