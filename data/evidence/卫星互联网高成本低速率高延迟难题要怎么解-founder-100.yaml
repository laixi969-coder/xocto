  fact: 本文首发于 Founder Park 公众号 · 2022 年 9 月 20 日               全球范围内，卫星互联网的建设正加速推进，卫星数量和应用规模都在几何式增长，随之而来的是「数据大爆炸」。就拿遥感卫星为例，每天中国资源卫星应用中心都会接收到超过
    40TB 的遥感图像数据，这也让太空通信和数据传输迎来挑战：   暴增的数据量，让原有的数据传输方式难以满足需求。那采用什么方式才能让数据回传更及时高效？      深耕空间激光通信行业 9 年多的谭俊博士发现，「
    如果在相同维度上对比激光通信和传统的微波通信，按照 10Gbit/s 左右的传输速率来看，激光不管是功耗、体积还是成本都碾压微波通信；哪怕降一个规格，在 1-2Gbit/s 左右的速率上，激光也比微波通信要好一些。
    」    如此看来，激光通信或许是一种解决方案。    2021 年，谭俊博士认为在激光通信的技术端，已经完成了从实验室到工程，再到半量产的进程，瞄准机遇创立了一家希望对标 Starlink 星上激光通信技术的民营企业——氦星光联，希望能解决卫星互联网中高成本、低速率、高延迟的通信痛点。虽然才成立一年左右，但也收获了不少投资机构的认可，比如真格基金、奇绩创坛等。    这次采访我们也想跟谭俊深入地聊一聊，什么是激光通信技术？为什么如此坚定地认可这个赛道？在卫星互联网中，激光通信能扮演怎样的角色？      欢迎在小宇宙收听本次采访的音频版本                        激光通信要解决的是「长远距离下的数据传输延迟、带宽、通信控制」难题。    卫星激光通信在通信、遥感和导航方面都有自己的核心应用。且相比现有的微波通信，激光通信没有频段限制。    卫星激光通信在中国已经发展了近
    20 年，近几年随着商业航天环境的变化，逐步从实验室走向工业界。    SpaceX 与国内的商业航天的路线不同。SpaceX 既造卫星、又造火箭、也做分系统，它是通过系统级别的优化更新让通信系统达到最佳状态。而中国商业航天是多家企业分工，有卫星总体设计、运营商、分系统等等，每家的指标都是相对独立的。                   01          激光通信是增量市场，       并非对微波的替代       Founder
