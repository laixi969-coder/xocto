  fact: "消息称苹果折叠屏 iPhone 初期产量受限，每日仅数百部 \n 9 月 8 日，据日经中文网报道，根据多位知情人士指出，市场期待已久的首部苹果折叠 iPhone，由于苹果极为严格的质量管控标准，初期生产量每天仅有「数百部」，而苹果及其供货商正全力加快产量爬坡。\
    \ \n 熟悉情况的供应链主管向《日经亚洲》透露：「苹果设定了极高的质量标准，在正式量产之前，8 月又追加了一轮试产」。该人员表示：「截至 8 月下旬日产量仅数百部。按这样的初期产能计算，有可能难以满足市场需求」。\
    \ \n 《日经亚洲》先前报导，苹果计划今年内生产 800 万~1000 万部折叠屏 iPhone，并希望凭借这款全新外型设计的机型激发市场需求，进而推升营收。（来源：DoNews） \n   \n\
    \ OpenAI 最强 AI 生图模型：ChatGPT Images 2.5 登场，延迟降低 50%、新增 Sketch 草图 \n 9 月 9 日，OpenAI 官宣发布 ChatGPT Images\
    \ 2.5，图像生成延迟最多降低 50%，并新增 Sketch 草图参考、模板库、图片内评论标注等实用功能，是该公司当前最先进的图像生成模型。 \n 相比较 2026 年 4 月发布的 Images\
    \ 2 模型，Images 2.5 重点降低了图像生成延迟，在细节锐度、自然光照和纹理丰富度方面均有提升的情况下，延迟最多降低 50%。 \n 功能方面，ChatGPT Images 2.5 引入\
    \ Sketch 功能。用户可通过输入「@Sketch」调用该功能，用户可在对话中直接绘制草图，再补充风格和细节描述，让模型将草图转化为完整图像。 \n   \n 产品还新增海报、商品等常见创作格式的模板，降低创作门槛。用户可以直接在图像上添加批注，以聚焦具体修改区域，并可在分享图像时附带原始提示词。\
    \ \n 在 API 调用模型方面，OpenAI 提供了两款模型： \n \n \n GPT-Image-2.5 Flare：面向多数 API 图像生成应用，适用于创作者内容、社交内容、产品体验、视觉搜索、快速原型和高批量生成等场景。\
    \ \n \n \n GPT-Image-2.5 Sunburst：则面向对编辑控制要求更高的工作流。OpenAI 建议将其用于成品级营销素材和精修产品图等场景，但其生成时间更长。 \n \n \n\
    \ API 支持多种分辨率，包括 1024×1024、"
