  fact: Legora can’t read a single trace of what its agent does for a lawyer. The data belongs to the
    law firm’s clients. How do you build and test an agent when you can’t see its work? Jacob Lauritzen
    is the CTO of Legora, one of the fastest-growing companies in legal tech history. The team started
    in a Stockholm basement with ChatGPT, Swedish law, and a search tool. Today, a lawyer can use Legora
    to draft and edit Word documents, review 10,000 contracts in a single table, or run due diligence.
    The agent also coordinates work between lawyers, clients, and other agents. When Legora made its own
    acquisitions, the team used it for diligence. What we talked about • Why Legora resisted adding a
    model picker for years, and why it finally added one • Jacob’s estimate that models already do about
    60% of legal work well, and why the rest takes a smarter model • How three engineers and three lawyers
    build test environments modeled on customers’ work, much like the “worlds” used in reinforcement learnin
