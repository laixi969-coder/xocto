  title: 助听器躺赚三十年暴利，被 AI 打破了
  published_at: '2026-09-16T08:06:55Z'
  collected_at: '2026-09-17T00:33:01Z'
  source_kind: market_signal
  tier: independent
  fact: "一个塞在耳朵里的小东西，卖到十万一副，丢失甚至需要动用全城搜索？ \n 助听器，是一门奇特的生意。 \n 整个全球市场，近九成的助听器市场份额被五家外资公司把持：索诺瓦（峰力）、Demant（奥迪康）、WS\
    \ 听力、瑞声达、斯达克。他们的旗舰产品在中国线下，一对要卖到七到十万块。即便是在美国本土，一副售价也要卖到三四万。而且过去二十年，助听器市场的格局几乎少有波动。 \n 让他们垄断助听器市场的，最早其实是一道技术难题：音频分离。\
    \ \n 想要模拟人耳在嘈杂餐厅里锁定一个声音，其实并不容易。在嘈杂的声音之下，究竟什么声音应该被放大？需要放大的应该是一个声音还是多个声音？在当时，谁能能把这道题解得好，谁就有资格定高价。五家外资公司，用芯片和算法把这件事做到了七八十分，然后，用遍布全球的验配门店，把助听器市场锁成了一套封闭的体系。\
    \ \n 不是没有人挑战过，几十年间，无数创业者试图打破它，最终都没能跨过去。但这个局面，正在被打破。2026 年，两家来自深圳的公司，把助听器卖到了原来十分之一的价格。 \n 据公开报道，听象科技旗下的昂听用\
    \ 1 年时间就拥有超 50000 用户，做到了美国亚马逊助听器类目 Top1，年销超 1500 万美元，市场份额从 1%迅速增长至 18%。飞声的开放式 AI 助听器在日本的众筹金额超过 300\
    \ 万美元，创下助听器类目的众筹纪录。 \n 改写这一切的前提，是 AI。 \n 它第一次让助听器在嘈杂环境理解了什么是「人声」；它通过推测声音的信号，让助听器减少啸叫；它把原本需要专业门店才能完成的验配，移到手机里，十几分钟就能完成。\
    \ \n AI 做的事，不是给助听器加了新功能，而是把过去巨头们垄断的技术关卡拆掉了，一同拆掉的，还有建在它之上的定价逻辑。 \n 这并非是一个逆袭的故事。助听器市场的结构刚开始松动，无论是价格、渠道、产品形态，还正经历市场检验，结局远未落定。\
    \ \n 通过这篇文章，我们想回答的问题是： \n \n 一副助听器，为什么从十年前起，就能卖到近十万块？ \n OTC 政策放开了四年，为什么还是没能改变这个市场？ \n AI 到底改变了助听器的什么，用户能感受到的差别在哪里？\
    \ \n AI 助听器，和过去的助听器相比，真正不一样的地方是什么？ \n 这场变化，最终会让谁受益？ \n \n 一、一副十万的助听器，凭什么？ \n 2022 年 10 月，美国 FDA 正式放开\
    \ O"
