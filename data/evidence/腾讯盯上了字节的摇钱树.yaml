  project_slug: 腾讯盯上了字节的摇钱树
  url: http://www.geekpark.net/news/372435
  title: 腾讯盯上了字节的摇钱树
  published_at: '2026-10-16T02:15:21Z'
  collected_at: '2026-10-17T00:31:00Z'
  source_kind: market_signal
  tier: independent
  fact: 头图来源：Chatgpt 生成 短剧正在成为互联网行业最吸金的时长黑洞。 QuestMobile 数据显示，2026 年 7 月，红果短剧日活达到 1.68 亿，超过腾讯视频、爱奇艺、优酷、芒果
    TV 四大长视频平台的日活总和，用户人均单日刷剧时长达到 125 分钟，甚至一度超过抖音主站同期的人均使用时长。 而据第三方监测数据，到 10 月其日活规模已攀升至 2.2 亿上下，半年时间净增超
    5000 万，增速依然没有放缓的迹象。 从三年前上线，到如今字节跳动旗下实打实的现金牛，红果短剧把免费广告（IAA）短剧的商业模式彻底跑通，也成了字节拉动用户时长的核心引擎。 腾讯不是没做短剧，但在红果一路狂奔的同时，前者的短剧布局却始终慢了半拍。此前在
    2021 年，腾讯就上线了十分剧场主打精品横屏短剧，走会员分账路线；微信生态里也先后试过火星短剧社、官方短剧小程序，但始终是小范围试水，没有形成规模化的产品矩阵。 直到今年 9 月底，由原微信官方短剧小程序升级更名而来的绿泡泡短剧开启大规模推广，腾讯才终于拿出了一款能和红果站在同一赛道对标的产品。
    但比起主动进攻，这更像是会腾讯瞄准字节基本盘的一次防守反击——作为赛道后来者，绿泡泡目前仍处于早期爬坡阶段，距离撼动红果的行业地位差距甚远。 一、红果，字节跑出的新摇钱树 在字节的内容版图里，红果短剧的增长速度和变现效率，都超出了行业预期。
    三年时间，红果短剧的日活从 0 冲到 1.68 亿，更关键的是用户粘性：人均每天 125 分钟的使用时长，意味着核心用户每天要花两个多小时在上面刷剧。这个时长量级，已经足以撑起一个独立的内容生态和商业化体系。
    支撑起这个体量的，是一套跑通的完整链路：抖音提供流量入口，用户刷到短剧片段可以直接跳转红果看全集；番茄小说提供 IP 储备，大量爆款短剧改编自站内热门网文；红果负责承接长时长观看，通过片头、片中广告完成变现，再分账给上游制作方。
    整条链路全部在字节生态内完成，几乎没有外溢。据第三方统计数据，今年 8 月，在中国月度使用时长排名前 50 的应用中，字节系产品的总时长份额达到 41.8%，创下历史新高，其中很大一部分增量就来自红果短剧。
    相比长视频平台高昂的内容成本和缓慢的会员增长，免费短剧的边际成本更低，变现效率更高，已经成了字节当下最稳健的现金牛业务之一。 更可能让腾讯感到压力的，是红果对用
