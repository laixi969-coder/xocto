  fact: "大家好，介绍一下我们在做的 RapSong 。这是产品自荐。\r\n\r\n它主要把照片和一段个人故事做成 AI 双人说唱视频：上传两张单人照（或一张双人合照），选择舞台，填写名字、祝福或共同回忆，先生成场景图，再生成短视频。可以用来做朋友间的创意短片、生日祝福等。\r\
    \n\r\n官网： https://rapsong.io/\r\n\r\n生成需要消耗积分，网站提供付费方案，具体价格和使用条件以站内说明为准。效果受照片和所选场景影响；填写的故事是生成方向，并不保证逐字唱出。\r\
    \n\r\n想听听大家的意见：\r\n1. 首页能否让你快速理解这个工具？\r\n2. 人物相似度、口型、歌词和音乐，你最看重哪个？\r\n3. 如果给朋友做一段祝福视频，什么问题会让你放弃使用？\r\
    \n\r\n欢迎直接指出问题。请使用自己拥有授权的照片，避免冒充他人或制作误导性内容。"
