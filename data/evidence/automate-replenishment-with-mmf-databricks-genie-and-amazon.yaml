  fact: Foundation models made catalog-wide demand forecasting easy; the hard part is now acting on the
    forecast. This post builds a closed detect-decide-act loop on Databricks and Amazon Quick that reconciles
    demand surges against live supplier availability and places replenishment orders unattended, escalating
    to a human only when no supplier can cover a surge.
