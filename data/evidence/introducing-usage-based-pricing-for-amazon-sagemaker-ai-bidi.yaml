  fact: Usage-based metering for bidirectional streaming solves a software billing problem for real-time
    speech AI. Customers deploying streaming models on Amazon SageMaker AI bidirectional streaming pay
    for the endpoint infrastructure that hosts the model. Separately, model providers listing on AWS Marketplace
    need a way to charge for what customers consume during a live stream. Today, we’re announcing usage-based
    metering for Amazon SageMaker bidirectional (bidi) streaming inference, so model providers can report
    actual usage for the AWS Marketplace software charge. Amazon SageMaker AI endpoint infrastructure
    charges still apply. Deepgram , the real-time speech AI company, is the launch partner for this capability,
    bringing usage-based Speech-to-Text (STT) and Text-to-Speech (TTS) billing to AWS Marketplace. This
    post builds on a series of innovations between Deepgram and AWS. First, we introduced bidirectional
