  fact: HyLight , the French startup specialising in aerial inspection of critical infrastructure using
    autonomous hydrogen-powered airships, has raised €13 million from Rubio Impact Ventures , DRW, and
    Teampact Ventures, alongside existing investors Y Combinator and Ring Capital. Founded in 2022 and
    based at Air Base 217 in Brétigny-sur-Orge, France, HyLight designs, manufactures, and operates its
    own hydrogen-powered airships, combining high-precision infrastructure inspections with AI-powered
    data analysis. The Y Combinator-backed company has progressed from developing prototypes to carrying
    out commercial inspections for major French energy and transport operators. When I last spoke to Martin
    Bocken, co-founder and CEO of HyLight, the company was still focused on developing its technology.
