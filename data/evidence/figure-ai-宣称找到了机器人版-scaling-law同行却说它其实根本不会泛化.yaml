- id: ev-24c8209e941be05c
  project_slug: figure-ai-宣称找到了机器人版-scaling-law同行却说它其实根本不会泛化
  url: http://www.geekpark.net/news/370607
  title: Figure AI 宣称找到了机器人版 scaling law，同行却说它其实根本不会泛化
  published_at: '2026-09-21T03:57:07Z'
  collected_at: '2026-09-22T00:50:51Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Li Yuan \n \n 390 亿美元的 Figure AI 已经把机器人送进 30 个陌生家庭，同行却说失败一半还谈不上会干活 \n 「这是 Figure AI 成立以来最重要的项目。」\
    \ \n 在 Helix 2.5 的发布视频里，Figure AI 创始人 Brett Adcock 把话说得很满。 \n Figure AI 目前估值达到 390 亿美元，是全球最贵的未上市人形机器人公司，致力于以人形完成人类的日常任务。\
    \ \n 过去几代 Helix 的发布都留下了颇有记忆点的画面：两台机器人合作拉平被子，或者在腾不出手时用屁股顶上洗碗机。不过，此前的 Helix 虽然已经能够自主工作，收获的最大诟病之一就是，每次的\
    \ demo，总在一个光线良好的样板间工作。 \n Helix 2.5 此次想跨过这一步。Figure AI 在旧金山湾区租下 30 套住宅，将机器人直接运到现场，让它整理客厅、铺床和折叠毛巾。\
    \ \n 不得不说，看完视频，笔者感觉这仍然很像 30 个光线良好的样板间。 \n 但仍然是一个很厉害的进步，Figure AI 称，没有针对这些住宅和物品进行任何训练或适配，30 套住宅里都出现了成功案例。\
    \ \n   \n 「Helix 2.5 要在一套从未进入过的房子里，折叠它从未见过的毛巾。」Brett 表示。 \n 在 Figure AI 的讲述里，机器人领域长期追逐的泛化能力终于开始出现了：机器人不再只会重复某个实验室里学过的动作，而是能把此前积累的经验带到一个陌生地方。\
    \ \n 随后，Figure AI 在 Helix 2.5 的技术博客里公布了完整测试数据。420 次测试，成功 237 次。完整任务成功率为 56%。 \n 不过，有趣的是，一种过往在机器人行业相当少见的情况出现了：同行没有像往常一样留下一句「了不起的工作」，再回自己的实验室暗暗较劲。\
    \ \n Sunday Robotics 联合创始人 Tony Zhao 直接指出，237 次成功也意味着机器人接近一半时间会失败。Stealth CEO Nikolai Ensslen 的说法更加尖锐：这组数据恰恰证明，Figure\
    \ AI 使用的模仿学习系统不能泛化。 \n Figure AI 觉得自己摸到了机器人版 scaling law，两位同行看到的却是一条可能根本走不通的路线。"
