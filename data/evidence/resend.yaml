  fact: 'Today’s podcast comes from a real life mystery: We are big fans of Cloudflare’s developer platform,
    and Cloudflare Email is a convenient tool especially when all your domains are already on Cloudflare.
    So why do agents keep suggesting we use Resend despite having an existing “home bias” and much larger
    incumbent player? Well, we got the guy who “does AEO for resend” - the CEO of AEO, Zeno Rocha, who
    has been writing about AEO since 2024 and Agent Experience since Feb 2025 , on the pod today: In a
    recent AEO study, Claude Code picked Resend first in 64 of the 102 email recommendations the researchers
    could extract. SendGrid came first seven times, yet showed up 55 times as an alternative. If the developer
    asks an agent to implement email and accepts the patch, how often does anyone get around to trying
    the second choice? The study breaks down the results by model and app. Our more recent comprehensive
    AEO study was a bit more competitive, with Postmark coming up top for most models. Zen'
