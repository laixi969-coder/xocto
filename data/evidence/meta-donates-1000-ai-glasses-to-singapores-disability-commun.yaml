  fact: Today in Singapore, Joel Kaplan, Chief Global Affairs Officer at Meta, announced a donation of
    1,000 Ray-Ban Meta AI glasses to the Singapore Association of the Visually Handicapped, Guide Dogs
    Singapore, the Singapore Disability Sports Council and Gardens by the Bay, alongside a US$30,000 investment
    into accessibility training. We believe the future is for everyone. People use our Ray-Ban Meta glasses
    for everything from listening to music, to live translation and hands-free calls. But for persons
    with disabilities, the difference they make can be life-changing. For example, for people who are
    blind or have low vision, our AI glasses help with everyday tasks like reading text, identifying objects
    and describing the world around them, helping them regain their independence. The announcement was
    made at an AI glasses accessibility showcase co-hosted by Meta and the Singapore Disability Sports
    Council (SDSC), with Guest-of-Honour Senior Parliamentary Secretary, Ministry of Law & Ministry
