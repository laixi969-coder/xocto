  title: 梅卡曼德上市，具身智能又跑出一家百亿公司
  published_at: '2026-09-04T08:33:41Z'
  collected_at: '2026-09-04T14:23:54Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Li Yuan     \n  编辑｜ 郑玄   \n       \n \n \n 2026 年 9 月 1 日，梅卡曼德登陆港交所。一个过去很少被大众看见的机器人公司，终于被公开市场标出了价格，首日收盘\
    \ 总市值约 124 亿港元。  \n 上市之前，一级市场和基石投资者已经先给出了自己的判断。梅卡曼德此次引入包括苏格兰百年资管巨头 Baillie Gifford 在内的 9 家基石投资者，合计认购\
    \ 1.86 亿美元。 \n 成立于 2016 年，梅卡曼德和宇树一样，都是上一轮机器人创业潮里走出来的公司。 \n 但从第一天起，梅卡曼德就没有把重点放在造一台机器人上。公司名 Mech-Mind\
    \ 里的「Mind」，指向的是另一件事：给机器人做感知、识别和运动规划。 \n 2017 年，梅卡曼德推出第一代 Mech-Eye、Mech-Vision 和 Mech-Viz：相机负责获取 3D\
    \ 点云和图像，视觉软件识别物体的位置与姿态，规划软件计算机械臂怎么抓、怎么走、怎么避障。到了今天，具身智能、物理 AI 和世界模型讨论的很多问题，仍然绕不开这些环节。 \n 梅卡曼德卖出去的不是一台完整机器人，而是一套可以接到不同机械臂和产线里的智能组件。十年下来，这套东西被送进近\
    \ 50 个国家和地区，累计部署超过 2.9 万台，服务超过 100 家《财富》世界 500 强企业。 \n 这是一种积累，也是一种约束。十年里，机器人行业的语言已经换了几轮，从工业机器人、3D\
    \ 视觉，到具身智能、物理 AI、世界模型和灵巧手，市场也开始用新的标准审视机器人公司。 \n  所以，梅卡曼德上市后要回答的问题，不只是估值多少。它更需要证明，过去十年积累的客户、产品和现场经验，能不能继续接上新一代机器人技术；以及十年前形成的产品路线，今天究竟会成为它的基础，还是限制。\
    \  \n  \n \n \n \n \n \n \n \n   01    \n \n \n \n  \n \n \n \n \n   「机器人大脑」，是在工厂里长出来的    \n \n \n\
    \   \n 梅卡曼德的故事开始得很早。 \n 2016 年底，邵天兰从德国回国创业。他在德国学习和参与机器人研发时看到，机器人已经有了成熟的机械臂和工业设备，但离「好用」还差一层智能：它们不会自己理解任务，也很难快速适应新的物体和环境。\
    \ \n 梅卡曼德最早想解决的，就是让机器人自己看清物体、判断抓取方式、规划动作路"
