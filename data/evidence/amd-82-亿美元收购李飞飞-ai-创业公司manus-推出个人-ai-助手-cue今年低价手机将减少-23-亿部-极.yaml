  fact: "Manus 发布 2.0，新增云电脑、远程控制及个人 AI 助手 Cue \n 9 月 28 日， Manus 发布 2.0 版本 ，升级自研 Cascade Agent 框架，并推出云电脑、视频编辑、游戏开发及个人\
    \ AI 助手 Cue。据官方数据，新框架可使任务 Token 消耗减少 23.2%、完成时间缩短 28.2%、运行成本降低 32%。 \n 升级后的 Manus Studio 支持文档、表格、网站和视频等内容创作，用户可在视频时间线上手动修改素材，再交由\
    \ AI 继续编辑。新增远程控制功能允许用户通过手机指挥已授权的电脑，查找文件或操作应用；自动化任务也可由新邮件、日历变更等事件触发，云电脑则为持续运行的项目提供环境。 \n   \n 独立应用\
    \ Cue 支持手机和桌面端，每个 AI 助手可拥有独立邮箱、电话号码、钱包和电脑，在用户设定的预算内付款、代接电话，也可与其他助手协作。目前 Cue 处于抢先体验阶段，凭邀请码免费使用。 \n\
    \ Manus 还表示，正在组建团队开发面向国内市场的产品，并与国产模型厂商及生态伙伴推进合作。（来源：极客公园） \n   \n \n AMD 斥资 82 亿美元收购 World Labs，「AI\
    \ 教母」李飞飞出任执行副总裁兼首席科学家 \n 9 月 29 日，AMD 宣布同意以全股票交易收购旧金山初创公司 World Labs，交易价值约 82 亿美元（现汇率约合 551 亿元人民币）。\
    \ \n World Labs 由李飞飞等人于 2024 年联合创办，主要开发「世界模型」，让 AI 根据文本、图像和视频生成或重建能够交互的 3D 环境。未来，这项技术可以用于机器人训练、工厂模拟和科学研究。\
    \ \n   \n 按照收购协议，李飞飞将加入 AMD，出任执行副总裁兼首席科学家，并向苏姿丰汇报。 \n 有「AI 教母」之称的李飞飞因创建大型标注图像数据库 ImageNet 而广为人知。ImageNet\
    \ 曾帮助证明，更大的数据规模能够显著提升计算机视觉能力。李飞飞后来担任谷歌云 AI 和机器学习首席科学家，并成为斯坦福大学「以人为本 AI 研究院」创始联席主任。 \n 本月早些时候，World\
    \ Labs 推出新 AI 模型 Atlas，只需少量 2D 图像，就能预测同一场景换一个摄像机角度后呈现的画面。根据 World Labs 介绍，这种工作方式可比作大语言模型"
