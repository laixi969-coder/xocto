  url: https://www.v2ex.com/t/1246151
  title: 一份行为，三种宿主：聊聊 XiHan.UI 这个框架无关的 Headless 组件库
  published_at: '2026-10-02T10:41:06Z'
  collected_at: '2026-10-03T01:12:25Z'
  source_kind: product
  tier: independent
  fact: "# 一份行为，三种宿主：聊聊 XiHan.UI 这个框架无关的 Headless 组件库\r\n\r\n![XiHan.UI]( https://raw.githubusercontent.com/XiHanFun/XiHan.UI/main/assets/banner_cn.png)\r\
    \n\r\n做前端久了，多半碰到过这种局面：后台用 Vue ，官网用 React ，角落里还剩几个没有框架的老页面。三边各有一个弹窗，按 Esc 有的关有的不关，关掉以后焦点有的回到按钮上，有的掉回页面顶部。用鼠标的人察觉不到，用键盘和读屏的人每天都被绊一下。再往后换框架，组件库整套重写，最先丢的正是这些看不见的东西：方向键往哪走，读屏念什么，焦点落在哪。\r\
    \n\r\nXiHan.UI 就是冲着这件事做的：\r\n\r\n> 快速、轻量、高效、用心的框架无关 Headless UI 组件库。是面向企业级前端的设计系统运行时，无头内核，多框架适配器。提供基础组件与\
    \ AI 组件，覆盖从中后台到 AI 对话的界面构建场景。曦寒懿（ XiHanFun ）开源生态的前端基座。\r\n\r\n下面把它的设计、细节和取舍摊开讲，也包括它现在做不到的地方。文档站每个组件都有能点、能切换框架的真实示例：\r\
    \n\r\n- 文档站： https://ui.docs.xihanfun.com\r\n- GitHub： https://github.com/XiHanFun/XiHan.UI\r\n- Gitee：\
    \ https://gitee.com/XiHanFun/XiHan.UI\r\n- GitCode： https://gitcode.com/XiHanFun/XiHan.UI\r\n\r\n\
    ## 一、先看用起来是什么样\r\n\r\n```bash\r\npnpm add @xihan-ui/vue @xihan-ui/tokens @xihan-ui/styles\r\n```\r\
    \n\r\n入口引一次皮肤，组件按名字 import ，不用 `app.use()`。所有包都声明了 `sideEffects: false`，没用到的组件会被摇掉：\r\n\r\n```vue\r\
    \n<XhDialogRoot v-slot=\"{ setOpen }\">\r\n  <XhDialogTrigger>打开对话框</XhDialogTrigger>\r\n  <XhDialogContent>\r\
    \n    <X"
- id: ev-b94ee1b9b0c05ee6
  project_slug: raw
  url: https://www.v2ex.com/t/1247196
  title: 前 AI 时代挖的坑， AI 时代填上了：一个算法可视化网站
  published_at: '2026-10-08T14:54:28Z'
  collected_at: '2026-10-09T02:10:12Z'
  source_kind: product
  tier: independent
  fact: "这个项目其实是前 AI 时代就开始做的。起因是我自己学算法，总是学完就忘，就想着做一个算法可视化项目，既能顺便学习，又能刷一点开源项目。那一阵子新拟物风格比较火，正好拿来练练手。\r\n\
    \r\n结果做完第一个算法（冒泡）就搁置了，工作太忙，一放就是好几年。后来有了 AI 才重新捡起来，今年补到了 92 个条目，也算是圆梦了吧。\r\n\r\n现在大概是这样：\r\n\r\n- 9\
    \ 大类：数据结构、排序、图、DP 、回溯、字符串、数论、计算几何、查找\r\n- 每一步都能前进、后退、拖进度条，倍速可调\r\n- TS / Python / Go / Rust 四种代码跟着动画逐行高亮，还有变量面板\r\
    \n- 排序可以输入自己的数组，二分和快排会在关键步停下来出题\r\n- 中英双语，手机也能看\r\n\r\n![快排逐步回放]( https://raw.githubusercontent.com/IllegalCreed/algorithms-visualization/main/docs/assets/quick-sort-step-through.gif)\r\
    \n\r\n![Dijkstra]( https://raw.githubusercontent.com/IllegalCreed/algorithms-visualization/main/docs/assets/04-dijkstra-1440-player.png)\r\
    \n\r\n地址： https://algo.illegalscreed.cn/\r\n\r\n源码： https://github.com/IllegalCreed/algorithms-visualization\r\
    \n\r\n说实话，目前的效果还远远没达到我想要的样子，后面有机会再慢慢优化。\r\n\r\n最讽刺的是，都用 AI 做了，反而背离了我的初衷：做完这个网站，我还是没学会算法。不过转念一想，大 AI\
    \ 时代，学算法还有个屁用呀……这么一想，这个网站好像也没啥用了 \U0001F602\r\n\r\n还是那句话，大 AI 时代，学算法还有个屁用呀。欢迎来反驳。"
