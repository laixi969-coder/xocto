  fact: Amazon Bedrock now supports the OpenAI GPT-5.6 models, Terra and Luna, in India with India geographic
    cross-Region inference. If you have local data processing requirements, you can now use these models
    at scale while Amazon Bedrock keeps inference requests and data within India.
