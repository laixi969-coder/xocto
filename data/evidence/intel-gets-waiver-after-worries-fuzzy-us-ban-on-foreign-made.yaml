  fact: US chip champion Intel was so confused by the US government ban on foreign-made robots that it
    requested and received a waiver “out of an abundance of caution.” The tech company wanted to make
    sure that it could continue using certain robotic vehicles in its US chip fabs. The uncertainty surrounding
    the Federal Communications Commission ban on certain foreign-made robots was revealed in the agency’s
    decision to grant Intel’s waiver request. On October 22, the FCC published its order allowing Intel
    to continue using the foreign-made robots in US semiconductor manufacturing facilities for a period
    of one year. The robots in question are automated guided vehicles operating on “tracks or predefined
    paths” while often requiring operator oversight, according to Intel’s website. They help to move materials
    and items around within warehouses and factory floors. Read full article Comments
