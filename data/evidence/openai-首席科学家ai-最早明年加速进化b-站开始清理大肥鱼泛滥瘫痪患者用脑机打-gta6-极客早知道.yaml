  fact: OpenAI 首席科学家警告：AI 最早可能在 2027 年加速自身发展，奥尔特曼赞同为 AI 开发设限 11 月 23 日消息，当地时间于 11 月 22 日，OpenAI 首席科学家雅库布
    · 帕霍茨基（Jakub Pachocki）发文，提议 AI 企业应建立行业统一标准，对先进 AI 模型的开发设置共同限制，在研究人员具备更可靠的模型行为理解和监控能力之前，不应突破约定的发展门槛。
    他认为，传统 AI 能力评测基准会随着技术进步迅速过时，而困惑度（Perplexity）可以作为衡量模型预训练进展的参考指标（困惑度用于衡量 AI 模型预测下一个文本 Token 的能力，数值越低，代表模型的预测能力越强）。
    帕霍茨基还公布了 OpenAI 内部使用的部分模型评测数据：GPT-3.5 的对数困惑度约为 0.99，GPT-4 约为 0.91。当这一指标低于 0.8 时，OpenAI 观察到了模型在网络安全和数学领域出现新的能力；当指标达到约
    0.76 时，模型开始在部分开放数学问题上取得突破性成果。 帕霍茨基预计，当对数困惑度进入 0.68 至 0.7 区间时，模型可能出现更多变革性能力，但目前无法确定这些能力具体是什么。 他还警告，AI
    最早可能在 2027 年推动预训练技术出现一轮快速进展，而研究人员在模型对齐和行为监控方面的进展，可能无法同步跟上。 按照帕霍茨基的设想，各家 AI 企业应共同建立模型评测、透明度和安全红队测试标准，并在模型首次投入使用前完成相应评估。他建议，以困惑度等可跨企业追踪的指标设定首个开发门槛，企业承诺在达到明确的安全监控里程碑之前不突破限制，例如开发出比现有思维链监控工具更先进的监测机制。
    OpenAI CEO 萨姆 · 奥尔特曼也公开支持这一提议。他称帕霍茨基的文章是 OpenAI 一段时间以来发表的最重要内容之一，并表示希望 AI 行业能够就共同限制达成一致，以帮助确保技术发展的安全性和可控性。（来源：CnBeta）
    马斯克预警：AI 行业明年可能面临严重资金短缺，或需要数千亿美元额外投入 11 月 22 日消息，深度学习领域开源项目 Keras 创始人弗朗索瓦・肖莱（François Chollet）在 X
    上发文称，要么你认为 AI 基础设施建设已经结束，AI 只是一场昙花一现的泡沫，且算力需求已经见顶；要么，这就是一次难得的
