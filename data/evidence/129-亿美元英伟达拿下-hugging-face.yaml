  fact: "作者｜Wildcard  \n  编辑｜靖宇   \n \n \n 129 亿美元，英伟达要把 Hugging Face 买下来了。 \n 当地时间 8 月 26 日外媒率先爆出消息，\
    \ 两天前还只是 Hugging Face「正在探索出售」的新闻，转眼就变成了「双方已达成协议」。速度快得让人来不及消化。 \n  这不是一笔普通的 AI 公司并购，而是芯片之王第一次伸手去抓开源\
    \ AI 世界的「分发权」。  \n Hugging Face 被称为 AI 界的「GitHub」，托管着超过 300 万个模型仓库，服务 1300 万开发者，Meta 的 Llama、阿里的 Qwen、Mistral\
    \ 的开源模型，全都住在这个平台上。它是整个开源 AI 生态事实上的「默认分发层」。 \n 而英伟达，已经垄断了训练和推理的 GPU 硬件。 \n 现在，它还想拥有模型流通的那条路。 \n   01\
    \   踩着 AI 打滚  \n 先说钱。Hugging Face 上一轮融资是 2023 年 8 月的 D 轮，Salesforce 领投 2.35 亿美元，估值 45 亿美元。Google、英伟达、亚马逊、IBM、Intel、AMD、高通全都参投了那一轮。三年后，129\
    \ 亿美元的价格大约是上一轮估值的三倍。 \n 乍一看翻了三倍很夸张。但放在 AI 行业的估值泡沫里看，这个溢价反而算克制。Perplexity 正在按 300 亿美元以上估值谈融资，Anthropic\
    \ 和 OpenAI 的估值更是比收入高出两个数量级。 \n Hugging Face 的 ARR（年度经常性收入）据 Sacra 估计在 2026 年 8 月达到了 1.5 亿美元，相比 2023\
    \ 年的约 3000 万美元已经翻了五倍。5 万家企业客户，769 名员工，CEO Clément Delangue 不久前还在播客里说公司「接近盈利」。 \n  但 129 亿的价格买的不是 Hugging\
    \ Face 的收入，而是它在 AI 世界里的位置。  \n 这个逻辑更接近 IBM 2019 年花 340 亿美元收购 Red Hat——战略买家为开发者生态中的卡位付费，而不是为短期现金流买单。\
    \ \n   02   英伟达，更大的野心  \n 如果只把这次收购理解为「芯片公司买了个模型托管平台」，那就太浅了。 \n 过去一年，英伟达在开源 AI 上的投入力度大到令人意"
