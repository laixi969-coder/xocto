  fact: "特朗普抨击 Anthropic CEO：AI 发展不能踩刹车，美国有「高智商总统」就足够 \n 特朗普周一在社交媒体发文，明确表示其不认可 AI 数据中心引发的民众反弹及外界对前沿模型的忧虑。他写道：「AI\
    \ 所需的唯一『护栏』，就是一位强悍而聪明（高智商！）的总统，而美国恰好拥有这样的总统。」 \n 这一表态较他上周末承认需要某种程度监管的措辞明显趋于强硬。 \n 争议的导火索是 Amodei 近日的公开表态。他呼吁业界应在开发最先进模型之前放缓步伐，以便企业更充分地评估潜在风险。OpenAI\
    \ 的 Sam Altman 及 SpaceX 旗下 xAI 的 Elon Musk 随后表态附议，支持适度放缓。 \n  白宫内部就 AI 监管问题已形成两个阵营： 财政部长贝森特与国家网络总监\
    \ Sean Cairncross 支持更强保护，而科技顾问 Michael Kratsios 与前 AI 沙皇 David Sacks 则认为监管会扼杀创新。 \n 周一美国副总统万斯被问及是否担忧人工智能的发展。他表示：「就我个人而言，我觉得有点奇怪，现在有这么多前沿\
    \ AI 科技公司主动与政府接触，甚至恳求政府对它们进行监管。在我看来，这有点像一个『特洛伊木马』，所以我们必须对此保持谨慎。」（消息来源：华尔街见闻） \n   \n 中方回应 Anthropic\
    \ 限制论：反对以遏制手段干预人工智能发展 \n 近期，美国与中国在人工智能领域的竞争成为国际科技界关注的焦点。此前，美国方面不断强调在人工智能竞赛中的战略优势，一些美国政界人士甚至呼吁盟友在人工智能发展方向上与美国保持一致。\
    \ \n 针对上述观点，中国外交部发言人郭嘉昆作出回应，明确反对将人工智能发展问题置于对抗和竞争框架之下。他表示，制造恐慌、挑动对立以及恶性竞争不仅无助于问题解决，反而将干扰全球人工智能治理进程，损害各方共同利益。（消息来源：cnBeta）\
    \ \n   \n Opus 5.2 深夜上线 \n 据外网消息，今天清晨，许多开发者发现，新一代神级模型 Claude Opus 5.2，已经在 Claude Code 中开启灰度测试。 \n\
    \ 越来越多的 Claude 用户发现：在 Claude Code 中调用 Opus 5 时，它的表现和网页版 Opus 5 截然不同。 \n 这就是前沿 AI 大厂最喜欢玩的「障眼法」——路由（Routing）。开发"
