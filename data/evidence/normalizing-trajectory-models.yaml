  fact: Diffusion-based models decompose sampling into many small Gaussian denoising steps, an assumption
    that breaks down when generation is compressed to a few coarse transitions. Existing few-step methods
    address this through distillation, consistency training, or adversarial objectives, but sacrifice
    the likelihood framework in the process. We introduce Normalizing Trajectory Models (NTM), which models
    each reverse step as an expressive conditional normalizing flow with exact likelihood training. Architecturally,
