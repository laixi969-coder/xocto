  fact: 头图来源：极客公园 今年以来，视频生成模型的进步肉眼可见，AI 短剧、换脸、场景合成在各个平台越来越多，但一个现实问题始终存在：生成一条满意的视频，往往要反复「抽卡」，算力和时间成本都不低；而一旦进入专业影视管线，今天的模型能承担的工业级工作仍然有限。
    关于这个问题，行业有两种思路。一种堆参数、扩算力，相信通用大模型终会跨过工业门槛；另一种扎进真实片场，从具体需求自下而上生长。达瓦科技走的是后一条路径。 达瓦科技总部位于重庆永川，团队从 2014
    年开始运营科技影视片场，2023 年成立达瓦科技，转向 AI 模型，今年已连续完成 Pre-A 轮、A 轮融资，累计融资约 5 亿元人民币。 他们选择的路线是「重控制、轻渲染」：自研控制层基座模型
    Latent Stage，把对人物、动作、镜头、灯光、场景的理解和控制单独做成一层，再交给渲染层出画面。围绕这条路线，公司有两款产品：面向专业内容团队、做离线生成的 FilmOS，以及在单张消费级显卡上就能实时运行的世界模型
    Scenes AI。 这套架构的底气来自数据。达瓦在真实片场中积累了约 180TB 的结构化「过程数据」，记录的不只是成片画面，还有从剧本、机位、灯光到动作捕捉的完整拍摄过程。 以下为极客公园创始人张鹏与达瓦科技
    CTO 朱子威和 CPO 李宗兴对谈实录，由极客公园整理。 01 从科技片场出发，做「控制层」 张鹏： 过去一年视频生成模型进步很快，大家都能刷到 AI 短剧，很多人也开始自己生成视频玩。但成本一直很高，对算力需求大，真正放进专业影视工业，能发挥多少作用，还是个问题。
    今天我们就看看，在主流的视频大模型之外，有没有别的技术路线。先请宗兴介绍一下达瓦科技。 李宗兴： 达瓦科技最早是一家科技影视公司。可以讲个故事：1975 年卢卡斯想拍《星球大战》，发现很多电影技术实现不了，就创办了工业光魔，专门去解决这些技术问题。需求会推动技术发展，就像游戏玩家推动了
    GPU 的进步。 我们的片场经常给技术团队提真实的问题，比如导演只想改画面里的一小部分，为什么要重新拍整个镜头？能不能只保留这个人物、这个动作，只改其他部分？在这些需求推动下，我们走向了控制层，做一个控制层基座模型，让视频真正可编辑、可理解。
    我们有两款核心产品。一款是 FilmOS ，一个 AI Agent 影视创作平台，基于一句话的目标就能生成高
