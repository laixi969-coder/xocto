  fact: 'In this post, we show how to build a semantic layer for agentic AI using EDB Postgres AI . We
    run a Strands Agents agent on Amazon Bedrock AgentCore that queries the layer to answer customer 360
    (C360) questions. Earlier posts in this series built the same C360 pattern with Stardog’s knowledge
    graph , Denodo’s data virtualization platform , AtScale’s dimensional model , and Strategy Mosaic’s
    linked models . EDB Postgres AI puts the semantic layer inside the operational Postgres database as
    an AIDB extension . Business meaning lives next to the data in standard Postgres COMMENT statements,
    the join graph comes from Postgres foreign keys, and governance uses Postgres GRANT and row-level
    security through the Model Context Protocol (MCP) endpoint that ships with AIDB. By the end of this
    post you will know: How to build an AIDB semantic knowledge base (SemKB) over a Postgres schema, how
    COMMENT ON statements and aidb.create_semantic_alias behave as the authoring surface, and how foreign
    key'
