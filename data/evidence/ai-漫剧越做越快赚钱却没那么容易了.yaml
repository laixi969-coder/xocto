  fact: 「一个创作者加上 IP 和 AI 工具，就能完成漫剧创作全流程。」 在上周举行的阅文创作大会上，阅文集团 CEO 侯晓楠这样描述正在兴起的「一人公司」。当日，阅文发布首批 AI 精品动画项目，将
    DramaBuddy 漫剧助手升级为 OPC 一站式平台，并推出「IP 委员会」模式，试图把故事从文字到影像，再到后续开发的过程连接起来。 看起来，AI 带来的机会似乎还在不断扩大。 但身处一线的漫剧从业者们，正感受着更真实、更锋利的行业变化。
    在会后，极客公园参与了对阅文 AI 平台负责人陈炜于、酱油文化创始人黄浩南（业内称「酱油」）、前尾猴文化总经理三行的采访。其中，酱油作为最早一批扎进 AI 漫剧赛道的从业者，从去年风口期到今年红海期，他的经历几乎就是行业变化的缩影——
    漫剧越做越快、产能越翻越高，赚钱却反而没那么容易了。 一、产能翻了几倍，营收却没怎么涨 在酱油的印象里，一年前的漫剧生意要好做太多。 2025 年这个时候，行业默认的制作标准是 1000 元 /
    分钟，一部 80 分钟的漫剧做下来成本约 10 万元。他的团队 10 个人凑在一起，一个月才能磨出一部剧，即便产能不高，利润也相当可观，属于「躺着都能赚钱」的阶段。 仅仅一年时间，整个成本和产能模型就翻了个儿。
    如今行业里标准化的 80 分质量漫剧，单分钟成本已经压到 400 元，一部 80 分钟的作品总成本约 4 万元，比去年降了 60%。人效更是涨了数倍：从过去 10 个人一月做一部，变成现在 1 个人一月就能出三部。
    图片来源：ChatGPT 生成 但产能的暴涨并没有换来营收的同步增长。酱油算了笔账：去年公司一个月做四五十部剧，营收大概两三千万元；现在月产能冲到两三百部，国内月营收还是差不多两千万元上下。「量上去了，单价掉下来了，整体收益没怎么涨」，这是他最直接的感受。
    背后是整个行业成本结构的翻转。去年成本的大头是人工、剪辑、配音，AI 算力 Token 只占 20%-30%；现在反过来了，Token 成本占到了一半，人工只剩 20%，剩下的是剧本和杂项开支。「人是省了，但算力贵了」，酱油总结道。
    陈炜于的观察是，现在行业实际上分化成了两个极端：批量剧里人力已经压到三成以下，算力占六到七成，基本一人一天就能出一部；精品剧则反过来，前面的美术、导演、大美术成本依然很高，「有经验、有独特见解的人，在
