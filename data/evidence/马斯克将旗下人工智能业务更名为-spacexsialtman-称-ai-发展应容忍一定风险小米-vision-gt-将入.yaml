  fact: "马斯克拟将 SpaceXAI 更名为 SpaceXSI 为「超级智能」概念背书 \n 美国总统特朗普推动以「超级智能」（Super Intelligence，简称 SI）取代「人工智能」（AI）的举措正在迅速影响科技行业。特斯拉和\
    \ SpaceX 首席执行官埃隆·马斯克日前表示，旗下人工智能业务品牌 SpaceXAI 有意更名为 SpaceXSI，并公开宣称「SpaceX 是一家超级智能公司」。 \n   \n 这一表态源于特朗普政府近期推动的一项新政策。9\
    \ 月 22 日，特朗普宣布以「超级智能」取代「人工智能」这一术语，并呼吁美国联邦政府在相关文件和机构中采用新的表述。此后，美国政府开始围绕「超级智能」建立新的政策框架和产业沟通机制。 \n 在回应社交平台用户关于「SpaceXAI\
    \ 是否会更名为 SpaceXSI」的提问时，马斯克明确表示「是的，我们会做出改变」。随后，他进一步发文称，SpaceX 本质上是一家「超级智能公司」。 \n 此次更名若最终落实，将是该业务板块在短时间内再次调整品牌身份。此前，由马斯克创立的\
    \ xAI 于今年 2 月被 SpaceX 收购，并在 7 月正式完成品牌重组，更名为 SpaceXAI，将 Grok 及其他人工智能产品统一纳入 SpaceX 体系。如今，随着「超级智能」概念被推向台前，该品牌可能再次迎来名称调整。（来源：CnBeta）\
    \ \n   \n 余承东：华为半导体已在手机、AI、智能汽车等领域成功设计并量产 381 款 τ 芯片 \n 10 月 4 日消息，在今年 5 月的 2026 国际电路与系统研讨会上，华为公司董事、半导体业务部总裁何庭波在主旨演讲中首次提出半导体全新演进路径——「韬（τ）定律」。\
    \ \n   \n 华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东今日发布视频，透露华为半导体已经在手机、AI、通用计算、网络、智能汽车等多个领域 成功设计并量产了 381 款 τ\
    \ 芯片 。 \n 据余承东介绍，过去芯片性能提升主要依赖不断缩小的晶体管。但随着晶体管尺寸接近物理极限，性能提升越来越难。因为空间是有极限的，所以华为换了一个思路—— 向时间要性能。 \n 具体来看，芯片完成一项任务，时间不光花在计算上，还花在数据传输和等待上。韬定律的核心思路是让数据少绕路、让计算不用等，花更少的时间完成更多的任务。\
    \ \n 华为韬定律提出以「时间"
