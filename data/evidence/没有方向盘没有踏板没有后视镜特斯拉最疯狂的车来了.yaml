  title: 没有方向盘、没有踏板、没有后视镜：特斯拉最疯狂的车来了
  published_at: '2026-09-16T06:30:50Z'
  collected_at: '2026-09-17T00:33:01Z'
  source_kind: market_signal
  tier: independent
  fact: "9 月 3 日，特斯拉「悄悄」办了一场发布会。 \n 没有直播，没有全球媒体轰炸，只请了少数受邀者参加。活动开始前，特斯拉的网红粉丝们发布了照片和视频。特斯拉还在网站上设置了倒计时，为该活动预热。\
    \ \n 这场发布会的主角，是那台被外界戏称为「三无车型」的 Cybercab：没有方向盘，没有踏板，连传统意义上的侧后视镜都没有。它从设计之初就不打算遵循任何传统汽车的逻辑，目标是把单车成本和每英里运营成本压到极致。\
    \ \n Cybercab 的发布比以往的产品演示更重要。2026 年 9 月 3 日，摩根士丹利分析师 Andrew Percoco 表示，在其对特斯拉 400 美元的目标价中，自动驾驶出租车业务贡献了约\
    \ 120 美元的估值；今年 3 月，美国银行还将特斯拉的自动驾驶出租车业务估值为 8440 亿美元，相当于特斯拉当时估值的一半左右。 \n 按照马斯克的设想，Cybercab 未来会是特斯拉销量最大的一款车，支撑起一张覆盖全球的无人驾驶出租车网络。更有想象力的一层是：车主自己不用车的时候，可以把车「投放」进特斯拉管理的车队里去跑单，闲置资产变成现金流。\
    \ \n  马斯克十年故事，终于开始兑现  \n 有意思的是，这场发布会官方没有直播，但 X 用户 Kyle Conner 发布了一批现场照片和技术细节，让外界看清了 Cybercab 的真实底子。\
    \ \n 配置上，Cybercab 刹车用的是线控刹车，但每个车轮都配了独立的执行器，这在无人驾驶场景下是个关键的安全冗余设计；驱动是前轮驱动，配合较高的齿轮比，特斯拉在压低电机噪音传入车厢这件事上明显下了功夫；电池用的\
    \ 4680 电芯，可以支撑 50 万英里的使用寿命，同时能扛住高频直流快充、持续振动、剧烈温度波动；电气架构是 48V 低压，自动驾驶大脑跟 HW4 类似…… \n 目前这台 Cybercab\
    \ 还没开放面向客户销售。但特斯拉在官网挂出了一份表格，专门用来收集有意进行 Cybercab 车队车辆采购人士的联系方式。 \n 不过，奥斯汀的用户已经可以抢先体验了。通过特斯拉去年上线的 Robotaxi\
    \ 叫车应用，现在可以预约乘坐 Cybercab。 \n   \n 全新设计的 Cybercab，支撑了特斯拉将近一半的估值｜图片来源：视觉中国 \n 其实，这不是马斯克第一次讲这个故事。早在 2016\
    \ 年，他就开始向粉丝和投资者描绘一幅画面："
