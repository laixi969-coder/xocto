  fact: 消息称 OpenAI 将推出常驻 AI 助手「O」，预计 9 月 29 日发布  9 月 27 日消息，据消息人士 Alexey Shabanov 昨日透露，OpenAI 即将推出一款常驻
    AI 助手，其代号为「O」，预计将在 9 月 29 日的 OpenAI DevDay 推出。     据报道，ChatGPT 的配置文件中已经出现了许多与「O」相关的线索，包括将「O」设置为显示名称、配置「-o」的电子邮件后缀。综合这些线索来看，这款智能体预计将能够在普通聊天之外持续运行，还可能拥有独立身份。  同时该项目可能与「Aeon」有关。此前已有消息称，Aeon
    是 OpenAI 常驻型智能体项目使用的名称。不过我们目前尚不清楚它支持哪些任务、具备拥有何种权限，以及是否支持定时任务、记忆功能或何时开放。  值得注意的是，此前曾有传闻称 OpenAI 正在研究一款甜甜圈形状的硬件。因此这些项目如果能产生关联，单字母代号可能会成为一种有趣的双关。（来源：IT
    之家）     部分 Anthropic 资深员工考虑在偏远地区购置土地，以防「AI 失控」  9 月 27 日消息，为防范人工智能彻底失控，Anthropic 的数位资深员工正在悄然制定具体的应急预案。  据华尔街日报于当地时间
    9 月 26 日报道，最近数周内，Anthropic 的部分早期员工曾向业界同行透露，他们正打算在美国偏远荒僻的地区购置土地建造隐匿点，以便在「AI 走向失控反噬」之际举家撤离避难。  对这个圈子而言，「逃离
    AI」的念头早已屡见不鲜。据早期离职员工回忆，早在 Anthropic 创立初期的公司聚餐中，大家就曾热烈推演过一种极具「曼哈顿计划式假想」的情景：他们未来可能随时被政府征调至荒芜的沙漠深处，在具备全套防电磁脉冲屏蔽功能的绝密军事基地内，闭门继续研发前沿
    AI。  据报道，Anthropic 员工们在内部的私密 Slack 频道中推演各类末日毁灭情景并探讨应对预案；他们甚至将一句格言制成贴纸贴在笔记本电脑外壳上，将其奉为行事信条：「一切再难重归平静」。  针对这一文化现象，Anthropic
    发言人回应称，公司目前拥有超过 3,500 名员工，内部对于技术的探讨呈现出极其多元的观点与立场。（来源：IT 之家）  上线 66 万英伟达 Blackwell GPU，马斯克要把 Colossu
