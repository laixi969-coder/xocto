  fact: "# Release v5.16.1\r\n\r\nThis is a special release as we include GLM! (and a few small fixes)\r\
    \n\r\n# GLM-5.3-Flash\r\n\r\n<img width=\"4239\" height=\"2643\" alt=\"image\" src=\"https://github.com/user-attachments/assets/17bc9c29-758b-44c8-8230-42f945ded209\"\
    \ />\r\n\r\nGLM-5.3-Flash, the first **natively multimodal model** in the GLM-5 series. With 320B\
    \ total parameters and just 18B active parameters, it outperforms GLM-5.2 across benchmarks and real-world\
    \ workloads at one-tenth the price, while approaching Claude Opus 4.8 on coding and agentic benchmarks.\r\
    \n\r\nGLM-5.3-Flash starts from a newly trained base model, with its architecture and training recipe\
    \ redesigned around capability and efficiency. For the first time in the GLM series, we introduce\
    \ a hybrid architecture combining sparse and linear attention, sharply reducing long-context serving\
    \ costs while preserving precise long-context capabilities. The model also adopts Manifold-Constrained\
    \ Hyper-Connections (mHC) to further improve scaling efficiency. T"
