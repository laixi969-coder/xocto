  fact: At GTC Berlin, banks, payment companies and financial data providers are showing what production-scale
    intelligence looks like — built on NVIDIA accelerated computing, powered by open weight models and
    running on their own infrastructure. Revolut is rebuilding its technology stack on a single foundation
    model PRAGMA , powered by NVIDIA accelerated computing. Using the NVIDIA cuDF toolkit and Dynamo-Triton
    software on NVIDIA Blackwell Ultra GPUs , Revolut is scaling PRAGMA in production, servicing an initial
    80 million customers and engineered to scale 3x. “Revolut processes billions of transactions — the
    opportunity was always there, but the question was whether foundation models could operate at that
    scale and across domains. PRAGMA answers that,” said Pavel Nesterov, head of AI at Revolut. “Built
    in collaboration with NVIDIA, it’s the clearest proof yet that the gap between a research breakthrough
    and a production banking system can be closed.” Read All NVIDIA in Europe Announcements
