    \ cutting-edge software still requires humans to think and work together, to maximize their skill\
    \ sets and to practice their respective crafts. A.I. can write very good software, but it also makes\
    \ it easy to do someone else’s job badly, which is part of why all those projects fail. Now that everyone\
    \ can code, it’s become clearer why many shouldn’t.  \n —  Paul Ford , A.I. Was Supposed to Give Us\
