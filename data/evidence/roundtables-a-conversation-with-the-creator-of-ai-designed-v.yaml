  fact: 'Listen to the session or watch below Can AI design new life forms? In 2025, Stanford University
    PhD student Samuel King came up with a preliminary answer when he used a generative AI model to propose
    genetic blueprints for microscopic viruses. It isn’t yet an example of AI-generated life, but that
    could be next. Watch as senior AI reporter James O’Donnell interviews King about his work, being named
    one of MIT Technology Review’s Innovators Under 35 and new ways of seeing biology. Speakers : James
    O’Donnell , AI Reporter, and Samuel King , Bioengineering PhD Candidate, Stanford University/Arc Institute
    Recorded on Friday, October 16, 2026 Related Stories He asked an AI to design viruses … and it worked.
    AI-designed viruses are here and already killing bacteria'
