  fact: 头图图片来源：REA 头图来源：CyberSecurityNews 「在应用里看到一个想加入自己产品的功能？让智能体去帮你调查它。」 这是 REA 项目主页第一屏的话。后半句更直接：即使没有源代码，智能体也可以检查应用、解释功能怎么工作、展示证据，「并为你的项目实现类似功能」。
    REA 全名 Reverse Engineer Anything，即「逆向一切」。 上周它在 AI 开发者圈刷了屏：10 月 6 日还不到 1 万星，到 10 月 12 日已经超过 11 万 。
    6 天涨了 10 万星，平均每天约 1.7 万｜图片来源：Star History 真正让普通人看到这件事的，是游戏。10 月初，一批老游戏突然能在浏览器里直接玩了：《光环：战斗进化》《半条命》《暗黑破坏神》，还有真正意义上的
    3A 大作《GTA5》和《使命召唤：现代战争 2》。 其中最出圈的一份复盘，来自逆向开发者 Maurice Heumann：他让十几个 Claude Code 和 Codex 智能体并行干活，把一款射击游戏
    99% 的函数还原成了 C++ 源码，其中 83% 编译出来和原程序逐字节一致。他用的是 Hex-Rays 的官方 MCP，不是 REA。 也就是说，REA 只是这波浪潮里名字最响的那一个。 同一个星期，整个
    AI 逆向圈都在加速。 似乎，人人都有免费软件用、免费游戏玩的日子到来了。 旧工具，新用户 逆向工程，就是手里没有源代码，从编译好的程序往回推，搞清楚它是怎么写的。这原本是安全研究员和破解者的手艺：在反编译器、反汇编器、调试器之间来回切，一个功能拆上几天是常事。
    REA 干的事，是把这套工具接到 AI 编程智能体上。接口用的是 MCP，一种让 Claude Code、Codex、Cursor 这类智能体调用外部工具的通用协议。 装好之后，你对智能体说一句「弄清这个应用的搜索功能怎么工作」，它会自己去调
    Ghidra、IDA 或 Hopper 等对应的工具，帮你翻二进制，调 JADX 拆安卓安装包，或者直接读 Electron 应用里打包的 JavaScript，最后把结论和证据一起交回来。 智能体负责提问，REA
