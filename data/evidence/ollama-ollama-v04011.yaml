  fact: "## Speech\r\n\r\nOllama can now generate [speech](https://docs.ollama.com/capabilities/speech)\
    \ on macOS. `ollama run` plays text or a chat model's reply aloud as the audio is generated, and apps\
    \ can stream audio through the OpenAI-compatible `/v1/audio/speech` endpoint.\r\n\r\n```sh\r\nollama\
    \ run phonon \"Hello from Ollama.\"\r\n```\r\n\r\n## d3 decision models\r\n\r\n[d3](https://ollama.com/library/d3)\
    \ brings vLLM Semantic Router's decision models to Ollama. Give a model text, structured state, or\
    \ an image, and ask it to classify, answer yes or no, or score options with probabilities. The family\
    \ includes 2B, 4B, 9B, and 27B sizes.\r\n\r\n```sh\r\nollama run d3 \"A customer says their card was\
    \ charged twice.\" --ask \"Is this a billing issue?\"\r\n```\r\n\r\n## New Contributors\r\n* @SynapShift\
    \ made their first contribution in https://github.com/ollama/ollama/pull/19173\r\n\r\n**Full Changelog**:\
    \ https://github.com/ollama/ollama/compare/v0.40.10...v0.40.11-rc0"
