  fact: 传林俊旸 AI 初创公司完成新融资，估值翻倍至 50 亿美元 据彭博社报道，阿里巴巴集团前 AI 负责人林俊旸创办的语用科技 ( Pragmatik Labs)，已完成新一轮融资，估值达
    50 亿美元，短短几个月内估值翻了一倍多。 林俊旸曾是阿里的明星研究员，在离职后于今年夏季创立语用科技。据知情人士称，语用科技在最近结束的一轮融资中筹集了数千万美元资金。今年 8 月，该公司在首次融资中筹集了数亿美元，当时估值为
    20 亿美元。 知情人士称，语用科技的新投资者包括华业天成资本、鼎晖投资以及汽车制造商吉利汽车。 语用科技总部位于上海，致力于开发面向数字世界和物理世界的 AI 智能体。该公司首轮融资的投资方包括高榕创投、红杉中国、腾讯以及上海未来产业基金。（来源：凤凰网科技）
    网传张楠、谢欣将离职，本人辟谣：信息不准确 11 月 20 日午间，有媒体报道称，原抖音 CEO 张楠、原飞书 CEO 谢欣将从字节跳动离职。字节相关负责人回应称该信息不准确。 谢欣本人则在朋友圈辟谣：「媒体今天发的所谓『独家』的假新闻，浪费我大把时间去回复大家。」
    值得注意的是，谢欣还将自己的微信名称改成带有「假新闻」的版本，用最直接的方式进行辟谣。（来源：新浪科技） DeepSeek 千亿级融资落地，梁文锋保留绝对控制权 工商信息显示，DeepSeek 运营主体杭州深度求索人工智能基础技术研究有限公司近日完成工商变更，新增股东杭州程砚企业管理咨询合伙企业（有限合伙）。
    据证券时报援引知情交易人士消息，DeepSeek 本轮融资募资规模区间在 1000 亿元至 1055 亿元，投后估值约 6155 亿元。叠加 2026 年 6 月首轮约 510 亿元融资，市场测算其短时间内两轮累计吸纳资金将超
    1500 亿元。 据测算，梁文锋直接及间接持股比例合计约 67.42%，千亿资本入场并未改变控制权归属。 据悉，作为新增股东的持股平台，杭州程砚的 31 家合伙人横跨互联网、通信运营商、芯片半导体、新能源、消费电子、汽车、家电以及头部
    PE / VC，几乎把大模型商业化所需的上游算力与下游场景一次性集齐。（来源：IT之家） 网易丁磊：短剧确实会对游戏产生影响 近日，在网易 2026 年第三季度业绩电话会上，管理层被问及短剧对游戏行业的影响。网易创始人兼
