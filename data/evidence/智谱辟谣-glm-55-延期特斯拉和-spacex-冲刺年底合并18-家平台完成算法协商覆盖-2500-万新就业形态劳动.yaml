  fact: 智谱辟谣 GLM-5.5 延期：性能 Fable 级、上万张国产 AI 卡进展顺利 11 月 26 日，智谱高管杨昊翊公开辟谣，称此前流传的 GLM-5.5 跳票相关爆料均为假消息。 此前有外媒发布消息称，原计划
    12 月发布的智谱 GLM-5.5 将延期至 2027 年第一季度推出，同时月之暗面旗下的 Kimi K4 也将跳票，还声称跳票原因是海外头部 AI 厂商对蒸馏技术设限，阻碍了国产大模型的研发进度。
    智谱高管杨昊翊在朋友圈辟谣，表示今天下午的所谓爆料新闻都是假消息，算是否认了跳票的消息。 至于 GLM-5.5 的情况，虽然他没有公布进度，但此前大摩参与的路演会议上提到的还是 12 月发布，国联民生计算机发布的研究报告称其参数量在
    2-3 万亿之间，性能达到了 Fable 级别。 此外，智谱在算力芯片上也有丰富储备，用于前期训练的万卡昇腾 950DT 进展顺利，预计明年能够跑通。（消息来源：快科技） 腾讯被曝全公司推混元 HY4
    模型，12 月起非技术岗外部模型额度降至 10% 11 月 26 日消息，腾讯公司将在全公司范围内大面积推广混元 HY4 模型。 据爆料，从 12 月 1 日起， 腾讯产品运营等非 T 族岗位的外部模型额度调为
    10% ，比如默认总额度 700，外部可以用 70，HY4 用 630。 该爆料还指出，从 2027 年 1 月 1 日开始，所有员工默认使用 HY4 模型，如果需要使用外部模型可以走申请。此次调整据称是因为
    HY4 发布后，能力跻身最强开源模型梯队。（消息来源：IT 之家） OpenAI 承认计费出错，修复后 Astra 消耗速度加快 40%、Sol 加快 25% 11 月 27 日消息，OpenAI
    已紧急修复 GPT-6.2 上线初期的一项计费错误——此前该问题导致大多数用户使用 GPT-6.2 Astra 和 Sol 时，消耗的套餐额度按折扣价进行了计算。 OpenAI Codex 与 ChatGPT
    负责人 Thibault Sottiaux（Tibo）表示，修复后，用户完成相同工作量时将消耗更多额度：与上周相比，Astra 用户触及使用上限的速度将加快 40%，Sol 用户则将加快 25%。
    Sottiaux 同时表示，尽管修复后两款模型的额度消耗速度有所增加，但与上一代 GPT-6 Astra 和 GPT-6.
