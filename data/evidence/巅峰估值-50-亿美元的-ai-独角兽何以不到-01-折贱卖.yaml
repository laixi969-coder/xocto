  fact: 头图来源：Chatgpt 生成 当地时间 10 月 12 日，曾经引爆 AI 陪伴赛道的明星项目 Character.AI，在美国特拉华州法院提交《破产法》第 11 章重组申请，开启法院监督下的资产拍卖流程。
    根据披露文件，迪士尼已经与它提前达成了底价竞购协议：2000 万美元，买走部分知识产权的非独占永久许可，外加用一批「前员工」为平台提供过渡期技术服务。 这笔交易不包含公司主体、产品 App 和用户资产。拍卖窗口期预计在今年
    11 月底至 12 月初收尾。 在整个出售周期内，Character.AI 平台维持正常运转，现有订阅、对话服务暂时不会改动。但如果最终没有买家愿意接手并持续运营平台，Character.AI 将走向关停。
    短短几年，这家由 Transformer 论文核心作者创办、巅峰估值 50 亿美元的 AI 创业公司，走完一轮剧烈的起落。 它的故事，不只是一家创业公司的失败样本，也折射出生成式 AI 消费应用普遍面临的成本、版权与商业化困境。
    一、破产拍卖，迪士尼买的是什么 破产申请书｜图片来源：stretto 这份 10 月 12 日的文件显示，Character.AI 列出的资产和负债都在 5000 万到 1 亿美元区间。 破产前，它与迪士尼旗下
    Disney Worldwide Services 签了协议：迪士尼担任 stalking horse bidder，也就是底价竞购方，出价 2000 万美元，买下部分知识产权的非独占永久许可和相关债权，还承诺用其雇佣的前员工，为平台提供一段时间的过渡技术服务。
    stalking horse 是破产拍卖的常用机制：第一个出价的人定下底价，后面的人可以出更高价，最终价高者得，整个过程由法院监督，走《破产法》第 363 条的程序，预计 11 月底到 12 月初收尾。CEO
    Colin Adams 的说法是，董事会评估了所有选项，法院监督下的出售是「为所有利益相关方最大化价值」的最佳路径。 这里有一个细节，迪士尼买的是 IP 许可，平台本身不在标的里。也就是说，迪士尼对继续运营
    Character.AI 这个 App 兴趣不大，它要的是技术。 这与迪士尼过去一年的 AI 布局完全一致：2025 年 12 月，它曾宣布与 OpenAI 达成角色授权合作，计划把 200 多个迪士尼、漫威、皮克斯、星战角色放进
