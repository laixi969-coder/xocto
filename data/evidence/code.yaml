    \n    \r\n    ```json\r\n    {\r\n    \t\"env\": {\r\n    \t\t\"CLAUDE_CODE_SUBAGENT_MODEL\": \"轻量模型\"\
    ,\r\n    \t\t\"CLAUDE_CODE_SUBAGENT_MODEL_FORCE\": \"1\"\r\n    \t}\r\n    }\r\n    ```\r\n    \r\n\
