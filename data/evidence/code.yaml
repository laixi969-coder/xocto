  fact: Kimi Code CLI is an open source coding agent from Moonshot AI, the creator of the Kimi series
    of open-weight foundation models. Previously, using Kimi Code with models on Amazon Bedrock meant
    configuring a generic connection “provider” with an Amazon Bedrock API key. For many AWS customers,
    this meant introducing an extra credential to obtain and protect. With v2.7.0, Moonshot AI adds a
    native bedrock provider to the CLI. You can now configure the agent to use your standard AWS credential
    chain, including named profiles and single sign-on (SSO), instead of creating and managing a separate
    API key. In this post, we show you how to connect Kimi Code CLI to models on Amazon Bedrock using
    your existing AWS credentials. We use Kimi K3.1 Pro Highspeed as an example, which supports streaming,
    configurable reasoning, image input, and client-side tool calling. What’s new Amazon Bedrock provides
    pay-per-token inference for a range of open and proprietary models from leading providers, available
