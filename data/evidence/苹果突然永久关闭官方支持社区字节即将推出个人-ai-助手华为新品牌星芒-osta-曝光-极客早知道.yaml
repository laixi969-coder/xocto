  fact: 苹果官方社区即将永久关闭 11 月 11 日，苹果官网突然宣布，Apple 支持社区将于 2026 年 11 月 20 日永久关闭。即日起，社区将不再接受新帖子，并转为只读模式。用户仍可前往官方
    Apple 支持网站，获取值得信赖的指导和帮助。 苹果公告称，我们衷心感谢各位社区成员一直以来贡献宝贵的时间和专业知识，帮助其他用户解决 Apple 产品使用中遇到的问题。（来源：新浪科技） 消息称字节跳动发力智能体赛道，计划推出类似
    Meta Muse 的 AI 助手 11 月 11 日消息，据彭博社报道，字节跳动计划在未来几周内推出一款类似 Meta Muse 的 AI 助手，巩固其在 AI 视频生成领域的领先优势。字节跳动希望借此加快追赶美国顶尖
    AI 实验室的步伐，目标是在未来三年左右缩小双方差距。 知情人士透露，字节跳动联合创始人张一鸣近日在一次面向 AI 团队的全员会议上，向研究人员、工程师及相关支持人员介绍了这一计划，并明确了接下来的重点工作。
    张一鸣认为，字节跳动有能力在 AI 前沿领域与 Anthropic、OpenAI 等行业领先企业展开竞争。不过，他也提醒团队，真正达到这些公司的水平，至少还需要等到 2029 年或 2030 年。
    字节跳动计划推出的新款 AI 智能体，将承担与 Meta 今年 9 月推出的 Muse 类似的角色。Muse 上线后在美国市场获得了不错的反响，它将 Meta 长期积累的 AI 研究成果整合为一款语音交互助手，并配有动画虚拟形象，可以帮助用户完成各种任务。（来源：彭博社）
    OpenAI 第三季度营收升至 100 亿美元 美东时间周二，OpenAI 首席财务官萨拉・弗莱尔（Sarah Friar）在接受采访时表示，OpenAI 第三季度营收环比增长近 50%，达到 100
    亿美元，年化营收达到约 500 亿美元。 这一增速显著高于二季度 18% 的环比增幅。弗莱尔称，第三季度的增长主要由前沿模型研发以及企业业务拉动。「我们的企业业务营收环比翻番。」她介绍道，目前 OpenAI
    的营收结构中，企业业务与消费者业务各占一半。弗莱尔表示：「增长动力来自代码、网络安全类产品，以及 Dots 这类面向企业的智能助手逐步落地。」Dots 是 OpenAI 面向企业推出的 AI 智能体平台。她补充，公司面向中小企业的业务，三季度增速也超过过
