  fact: 黄仁勋宣布辞职，英伟达股价重挫 13% 美国时间 11 月 12 日美股开盘前，英伟达官方宣布，黄仁勋辞去总裁、首席执行官和董事会成员职务，即刻生效。 首席财务官 科莱特·克雷斯 （Colette
    Kress）出任临时 CEO，同时继续兼管财务；董事哈维·琼斯（Harvey C. Jones）出任董事会主席。董事会已经开始物色正式 CEO，公司内外的人选都会考虑。 虽然外界众说纷纭，但这份公告中并没有直接写辞职理由，只简单感谢了黄仁勋「对公司和行业不可估量的贡献」。
    黄仁勋 1993 年和两位合伙人创办英伟达，从那时起一直是这家公司的 CEO，到今天 33 年。消息公布后，英伟达股价在盘前下跌 10%。 美国总统特朗普随后表示，苹果的前 CEO Tim Cook
    应取代黄仁勋出任英伟达 CEO。（来源：极客公园） 美国拟扩大英伟达 AI 芯片出口管制，限制中企通过海外数据中心获取算力 11 月 12 日，据 The Information 报道，美国商务部正制定新的出口管制规则，拟对新加坡、马来西亚、泰国、印度尼西亚、巴西、挪威及南非等国家实施更严格的
    AI 芯片出口许可要求，以限制中国 AI 企业通过当地数据中心租用英伟达 Blackwell 及更新一代芯片的算力。 根据拟议规则，相关国家的芯片采购方须披露芯片最终使用者及具体用途，并接受持续监管，以防止中国企业通过远程访问海外数据中心或芯片转运等方式规避美国出口限制。
    目前该措施仍处于拟议阶段，具体实施时间及最终适用范围尚未明确。（来源：TechFlow） 黄仁勋辞职后全球 AI 相关股票震荡，AMD 和博通逆势上涨 11 月 12 日，据路透社报道，黄仁勋因婚外情丑闻持续发酵而辞去英伟达
    CEO，引发全球 AI 概念股周四大跌。 英伟达投资的新型云计算服务商 CoreWeave 股价下跌 9.1%。就在前一个交易日，CoreWeave 还因财报表现带动 AI 概念股反弹，单日涨幅超过
    27%；其他新型云计算服务商也未能幸免，IREN 和 Applied Digital 股价双双走低。Nebius 则在宣布 2026 年营收将接近此前预测区间下限后，股价大跌 16.2%。 甲骨文也下跌
    2.6%，公司正扩大与英伟达在云端 AI 芯片方面的合作。 其他科技股同样承压。美光科技下跌 2.5%，闪迪和西部数据分别下跌
