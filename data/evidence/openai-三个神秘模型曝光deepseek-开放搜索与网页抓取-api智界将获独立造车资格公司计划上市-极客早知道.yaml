  fact: OpenAI 三个神秘模型曝光 10 月 18 日，有开发者发现，OpenAI 的 API 模型列表中突然出现了三个陌生名字： aurora-red-alpha、aurora-green-alpha、aurora-blue-alpha。三个模型都以
    Aurora（极光）命名，分别对应红、绿、蓝三种颜色。但相关条目很快便从模型列表中消失。 此次发现来自第三方维护的 OpenAI 模型列表镜像，并非官方公告。因此，这些模型究竟是什么、是否会正式发布，目前都还是未知数。
    有网友推测，这些模型极有可能是 GPT-6 Astra 后续版本的内部检查点，专门对标 Fable 5.5 的强项，创意编码、长程 agent、视觉 / 3D。也有网友推测：三个模型对应 OpenAI
    三个图像模型。（消息来源：机器之心） Anthropic 与法律专家讨论 AI Agent 谈判规则，未来可替用户砍价、处理纠纷 据《金融时报》最新报道，Anthropic 正在与律师事务所及法律专家合作，研究
    AI Agent 代表用户进行谈判时应遵循的行为规范。 随着 Agent 逐渐能够独立执行任务，未来可能出现大量 AI 与 AI 之间的商业交互。 例如，消费者让自己的 AI 助手与商家的 AI
    Agent 讨价还价，员工让 AI 代理参与薪资谈判，或者用户委托 AI 处理服务纠纷。 Anthropic 希望明确几个问题：AI 应该在多大程度上争取用户利益？什么时候需要征求用户确认？面对其他
    AI Agent 时，是否应该默认对方存在欺骗或操纵意图？ 公司还讨论过一种授权方式：让用户通过签署文件，明确 AI 的代理权限、目标和行为边界。 目前，这仍属于规则研究和产品探索，尚未推出面向公众的自动谈判服务。（消息来源：金融时报）
    DeepSeek 正式开放搜索与网页抓取 API，每千次调用收费 5 元 DeepSeek 正式开放 Search 和 Fetch 两项 API，向开发者提供基于自研搜索引擎的网页搜索及内容抓取能力。
    其中，Search API 可以根据关键词返回结构化搜索结果，包括网页标题、链接、摘要、发布日期等信息；Fetch API 则可以抓取指定网页，将正文转换为 Markdown 文本。 两项 API
    均采用按成功请求次数计费的方式，价格为每千次 5 元。失败、超时或未返回有效结果的
