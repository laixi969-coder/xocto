  fact: "Release:   llm-openai-decisions 0.1a0  \n         OpenAI released their new Jev-style  Decisions\
    \ API , as previously announced at last week's DevDay. \n Since I already have an  llm-typesafe  plugin\
    \ for talking to Jev, I had GPT-6 Astra read the new OpenAI API documentation and build an  llm-openai-decisions\
    \  plugin inspired by  llm-typesafe . \n Unlike Jev, the new  gpt-6-luna  decision model supports\
    \ image input in addition to text. Both models charge for input it and not for output: OpenAI's is\
    \ 10 cents per million input tokens, Jev's is 4.2 cents per million. \n Otherwise the API shape is\
    \  very  similar to Jev, at least conceptually. Jev  supports three question types  for yes/no, choices,\
    \ or scores. OpenAI Decisions supports the same three types. \n Install the plugin like this: \n \
    \ llm install llm-openai-decisions\n  \n Here's an example query against an image attachment: \n \
    \ llm -m openai-decisions/gpt-6-luna \\\n  -a https://static.simonwillison.net/static/2025/two-pelicans.jpg\
    \ \\\n  -s   '"
