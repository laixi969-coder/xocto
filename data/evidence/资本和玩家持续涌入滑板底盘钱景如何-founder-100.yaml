    Rivian 公布了第二季度的财报，净亏损扩大到 17.1 亿美元，几乎是去年同期的三倍。目前市值为 336 亿美元，而在去年 11 月上市时，公司市值一度突破 1400 亿美元。         不只是
    Rivian，同样押注滑板底盘赛道的美国 Canoo 公司、英国 Arrival 公司、以色列 REE 公司的日子也不好过。相比国内赛道不断有新玩家和资本涌入的情况，滑板底盘赛道呈现出国外遇冷，国内依旧受宠的局面。         与之相对应的，是滑板底盘目前尚处于发展早期阶段，仍在摸索可持续的商业闭环模式，关于滑板底盘的争议也有很多。         滑板底盘技术的未来是什么？到底应用在哪些领域？是智能汽车的新革命还是新噱头？         对于这些问题，我们邀请了国内专注滑板底盘赛道的代表企业——PIX
    Moving 滑板底盘（以下简称「PIX」）的联合创始人 & COO 曹雨腾，一起聊聊滑板底盘的现在和未来。                 滑板底盘本质上是一个通用的智能底盘，可以通过数字化设计满足不同需求。    自动驾驶带来最大的价值，是将交通时间转换为工作、生活和娱乐的时间，并且赋予城市中固定不变的东西一定的自主移动性。    Rivian
    做的是「我有什么，我就卖给你什么」的模式，但是 PIX 更想做「你需要什么，我按需生产给你什么」的方案。    传统汽车产业仍存在路径依赖的问题，面对巨大变革，传统的局部效率创新不再适用，变革能够带来更多新的可能。    通用智能底盘可以大幅降低开发周期和开发成本，快速匹配不同需求；在无人车领域，研发真正符合新的场景和技术特点的产品。               01    AMR
    滑板底盘的关键是    通用和智能        Founder Park：如何定义滑板底盘，核心技术是什么？             曹雨腾    ： 行业会有一些共识。首先，滑板底盘一定是上下软硬解耦结构，有标准的接口，同时其开发模式一定是分体开发。此外，滑板底盘是高度集成的，即其转向线、自动动力、悬架等等都集成在底盘上。
