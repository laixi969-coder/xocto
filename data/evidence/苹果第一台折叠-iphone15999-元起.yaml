  fact: "iPhone Duo，国行 15999 元起 \n \n  作者｜张勇毅  \n  编辑｜靖宇  \n \n 北京时间今天凌晨，苹果发布了第一台折叠屏手机，名字叫 iPhone Duo。国行\
    \ 15999 元起，10 月 16 日晚 8 点预购，10 月 23 日发售。同场发布的 iPhone 18 Pro 系列 9999 元起，9 月 12 日晚 8 点预购，18 日发售。 \n\
    \ \n 三天前，小米发布了 18 Fold：外屏 5.38 英寸，内屏 7.58 英寸，10999 元起。iPhone Duo 按苹果规格页的标准矩形口径，外屏 5.36 英寸，内屏 7.58\
    \ 英寸。 \n 两块屏幕的尺寸，差别在小数点后第二位。价格差了 5000 元。 \n 书本式内折，合上是一块 5.4 英寸的外屏，翻开是 7.6 英寸的内屏，苹果的口径是比 iPhone 18\
    \ Pro Max 的屏幕大一半。两块屏比例相同，都支持自适应刷新率和常亮显示，峰值亮度都是 3000 尼特。内屏做了纳米纹理，苹果说这是为了让折痕不那么显眼。外屏上方是一颗 1200 万像素的前置摄像头，会自动切换横竖构图；内屏的前置摄像头藏在屏幕下面，不用的时候看不见。\
    \ \n 后置只有两颗镜头：4800 万像素主摄，光圈 ƒ/1.6；4800 万像素超广角，光圈 ƒ/2.2，兼做微距。视频最高 4K、120 帧，支持杜比视界。芯片是和 18 Pro 同款的 A20\
    \ Pro。 \n \n 机身里塞了两块电池，一边一块，苹果给的视频播放时间是内屏 31 小时、外屏 44 小时、两块屏混着用 24 小时，有线充电 20 分钟能到 50%。 \n \n 合上 11.3\
    \ 毫米，重 254 克。小米 18 Fold 是 10.68 毫米、219 克，华为 Mate X7 是 9.5 毫米、235 克。苹果说它是「最薄的 iPhone」，展开只有 5.2 毫米，这句话在\
    \ iPhone 家族内部成立。放进折叠屏市场，它是最厚、最重的那一档。 \n \n 比它们重的同时，它也比它们防得住尘。IP68，苹果给的口径是 6 米水深 30 分钟；国产折叠屏做到的最高等级是\
    \ IP58 和 IP59，防尘只到 5 级，三星 Z Fold8 是 IP48。中框是 5 级钛金属，镜面抛光；铰链部分用了 3D 打印工艺，苹果说它由一百多个零件组成。 \n 内屏的结构苹果讲得很细："
