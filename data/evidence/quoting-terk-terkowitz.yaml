  fact: 'If your work does not benefit from current AI tooling, that is a finding, not a failing. Document
    why, share it with your community of peers, bring it to your manager, and work to find solutions.
    An engineer who can explain where AI does not yet help their work is demonstrating the judgement we
    are asking for. — Terk Terkowitz , An update from Amazon engineering leadership on the role of the
    developer in the age of AI Tags: amazon , generative-ai , agentic-engineering , ai , llms'
