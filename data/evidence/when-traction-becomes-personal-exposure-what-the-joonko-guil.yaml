  fact: By Kyle Jeziorski Ilit Raz , founder and former CEO of the AI startup Joonko , raised roughly
    $27 million after telling investors the company had customers it never had and revenue it never actually
    earned. When an investor later asked for proof, she sent a forged bank statement and fake purchase
    orders. Last month, Raz pleaded guilty to federal securities fraud . She faces a maximum of 20 years
    in prison. Founders raising capital must sell investors on what their companies could become. But
    Raz’s case illustrates the personal stakes of misrepresenting a business’ achievements, and investors
    are increasingly willing to take those claims to court. Plaintiffs filed 15 AI-related securities
    class actions just in the first half of 2026, nearly matching the 16 filed in all of 2025, according
    to Cornerstone Research . The distinction between future potential and present-day facts matters when
    describing customers, revenue and traction. Where ‘puffery’ crosses the line into securities fraud
