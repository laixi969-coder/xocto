  fact: 'Today''s PHP Security Release, and How We''re Strengthening PHP Security If you''re running anything
    on PHP it''s vital you upgrade - today''s updates (across the entire PHP 8.x line) address two remote
    code execution holes, and there have been exploits circulating since last night, thanks to a leak
    in the coordinated disclosure process. This post from the PHP Foundation explain what went so wrong:
    On Tuesday, October 20th, at around 15:00 UTC, the two CVE IDs began circulating on online forums
    and social media. They came with a wrong release time and a wrong CVSS score of 10.0 (the actual score
    is 9.2). No technical details leaked. In response, the PHP project brought its pre-announcement forward
    and published it at 19:30 UTC . It also moved the release from October 22nd, 14:00 UTC, to October
    21st, 14:00 UTC [...] As a result of the leak and pre-announcement around 20:00 UTC, Calif, one of
    the security firms that had reported the issues mistakenly published a video. It showed their proof'
