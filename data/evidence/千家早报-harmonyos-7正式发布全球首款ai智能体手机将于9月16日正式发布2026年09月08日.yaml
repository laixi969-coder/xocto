  fact: "相机好用之外，日常使用也有了新鲜感。 \n \n  作者｜张勇毅  \n  编辑｜靖宇  \n \n 10 月 1 日，华为 Mate 90 系列正式发布。 \n 最近几天，Mate 90\
    \ Pro Max 用下来，我最直接的感受是，影像能力是这一代毋庸置疑的最重要改变，可能没有之一。 \n 作为华为每年的旗舰，Mate 系列其实每年都能在影像领域给我们带来很多惊喜，这一代 Mate\
    \ 90 Pro Max 也确实有不少值得展开的相机规格。 \n 拍合影时不知道怎么站，室内灯光把肤色染得不太对，拍完想保留妆容，又不希望手机替自己做太多修饰。这些问题很难用一个参数概括，却直接决定了我们对一部手机相机的评价。\
    \ \n 从功能设计上你能看出，今年 Mate 90 Pro Max 的影像升级，有相当一部分在处理这些实际拍摄场景中非常「具体」的麻烦。 \n 相机好用之外，日常使用也有了新鲜感。外观上的革新很明显，还有「积木壳」这样的新概念。系统中很多实用的功能，同样是今年使用体验上很明显的加分项。\
    \ \n \n 华为 Mate90 Pro Max 典藏版｜图片来源：极客公园 \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n   拍照的前前后后\
    \   \n \n 在人像拍摄上，Mate 90 Pro Max 提供了一个很具体的选择：你希望手机替你美化，还是希望它尽量保留拍摄对象原本的样子。 \n \n Mate90 这一代新增了「人像原片」效果，与人像美化对应。它强调的是肤色、唇色和妆容的还原，同时减少磨皮和过度锐化带来的干预。\
    \ \n 对愿意自己修图的人来说，这个选项的意义是可以帮你避免在拍摄时抹掉过多的细节；而肤色和妆容保留下来，才有继续调整的余地。喜欢直接分享的人，也可以按自己的偏好选择处理方式。 \n 「原片」这个名字需要解释一下：这里指的是华为提供的一种成片效果。它不直接等同于未经计算处理的照片，也不能仅凭名字就理解为\
    \ RAW 原始文件。 \n 另一项变化是肤色处理。华为第三代红枫原色摄像头配合肤色分区校准，会识别画面中的皮肤区域，目标是在保留环境氛围的同时，让人脸颜色尽量准确。这套能力也延伸到了视频等动态场景。\
    \ \n 这件事的难度，其实在于一张照片里往往不只有一种光。餐厅里的暖光、窗外照进来的自然光，以及背景里的灯牌，可能同时落在人的脸上。简单地把整张照片调暖或调冷，未必能兼顾人物和环境。把肤色"
