- id: ev-df1911635bd4a1c3
  project_slug: 编辑部来了-ai-实习生-千问入职-20-天我给它写了一份实习小结
  url: http://www.geekpark.net/news/369517
  title: 编辑部来了 AI 实习生｜千问入职 20 天，我给它写了一份实习小结
  published_at: '2026-08-31T01:14:19Z'
  collected_at: '2026-08-31T17:38:50Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Moonshot  \n \n  编辑｜郑玄  \n \n 8 月 20 日晚，MoonshotAI 在 GitHub 上更新了 kimi-code 0.38.0。没有发布会，也没有新闻稿。但这条信息，被我通过千问部署的一个定时任务「捕获」了。\
    \ \n 很快，千问把一篇 3100 字的稿件推到了我的飞书上，题目是《月之暗面把 500 亿美元估值，押在了一个代码模型上》。 \n   \n  图源：千问  \n 如果我在值班，可能这时才点开\
    \ GitHub，正在判断这个模型是正式版还是测试版。但千问已经找完资料，做完核查，完成了一篇新闻初稿。 \n 我是如何实现这些的？ \n 这要回到 8 月 7 日，千问 APP 完成了一次功能更新，包括上线针对复杂任务的「工作助理」，随后我通过千问在本地部署了一套「找选题」的定时任务，监控九家大模型公司的官网、代码仓库和媒体报道，发现新消息后，再按照公司、事件和信源判断它值不值得写、稿件需要写到什么程度。\
    \ \n 根据我设定的信息权重，「kimi-code 0.38.0 更新」这一事件，千问判断为「月之暗面，第一梯队，3 分」「发布新模型，6 分」「GitHub 官方确认，2 分」，总分 11 分，超过了\
    \ 9 分，触发自动成稿任务，千问开始补充过去七天的相关资料，梳理新闻点和背景，很快一篇初稿推送到了我的飞书。 \n   \n \n  千问生成的每日工作报告｜图源：千问  \n \n 消息评分超过\
    \ 9 分，千问启动撰稿任务 \n 回头看，写稿是这次任务的最后一步。更早之前，千问一直守着那些分散的信源，等消息出现，再完成第一轮筛选。 \n 而科技编辑每天花掉最多注意力的，正是这一段看不见的工作。\
    \ \n   01   \n  新闻不会排队等编辑上班  \n 科技编辑每天面对的新闻，散落在许多互不相干的入口里。 \n 公司官网上有正式公告，GitHub 里藏着版本更新，Hugging Face\
    \ 会出现新的模型页面，API 文档可能悄悄改掉价格和调用方式。再往外走，还有国内外媒体、社交平台和各种未经确认的提前消息。 \n 找到消息只是开始，编辑还要判断它值不值得写、需要多快跟进。 \n\
    \ 捕捉到了热点新闻后，编辑还要找到原始链接、理解事件背景、核对二手报道准确度，再决定写快讯、深度稿，还是放弃选题。 \n   \n  编辑每天要寻找、评估、判断、筛选大量的选题｜图源：Apple\
    \ News"
