  fact: "硬件创新力正在消失。 \n 9 月 10 日，苹果发布了筹备多年的首款折叠屏 iPhone Duo，又是一款集大成之作，困扰多年的折叠屏折痕有了「苹果」解法。但我们明显发现硬件创新的品类迭代速度开始变得缓慢，这两年「原来还能有这种东西」的哇塞时刻越来越少。大家似乎默认，下一个时代级的硬件新品类短期内等不来，与其赌一个新物种的诞生，不如在成熟产品上做新的形态和能力。\
    \ \n 所以硬件创新来到了大融合时代。你做手持影像，我做会飞的手持影像；你做智能轮椅，我做会自动驾驶的智能轮椅；你做录音手环，我做能录环境音的录音手环。这期名单里的产品，几乎每一件创新产品前都有一个独特的限定词。\
    \ \n 融合创新并没有好坏，手机当年就是相机、电话和电脑集成出来的新品类。但更关键的应该是，用户价值。价格翻倍是否真的给用户带来了新的价值，还是虚构了一个用户的需求？在潮水退去时，每位造物者都要抓稳自己的锚绳。\
    \ \n 以下，是「造物 100」栏目第 6 期推荐的最新造物。 \n  会变形的口袋相机 HoverAir Versa：手里拍着拍着，它飞起来了  \n 这是全球第一台既是手持云台相机、也是一款自拍无人机的。拆掉机翼，它可以是一台\
    \ Osmo Pocket 类型的口袋云台机。设备自带屏幕、录制键和摇杆，几秒变形展开，同时它起飞时，还可以变成一台自主跟拍的无人机。同一颗镜头，同一段素材，可以从不同视角记录，这也是这款产品最大的卖点之一。目前该产品正在众筹进行中，2026\
    \ 年秋季在美国上市。 \n 但做它的 Zero Zero Robotics 不是新面孔，它曾开发出 HoverAir X1，是自拍无人机品类早期产品之一。他们认为创作者，既想要拍 vlog，也想要航拍镜头，但大家都不想同时背两台设备出门，也不想花大功夫把同一个景点的素材调成一致，所有造了个一机两用，剪辑时连调色都省了。\
    \ \n 不过，这款产品变形结构的耐久性、飞行模式下的续航，都要等首批实测。 \n   \n  「无人驾驶」的智能轮椅 Strutt ev1c：自动规避行人与障碍，语音输入指令  \n 这是一台会自动驾驶的电动轮椅。车上有两颗激光雷达、十颗深度传感器、六颗超声波加两颗摄像头实时构建\
    \ 3D 地图。在 Co-Pilot 模式下，它能自动避开行人、宠物和台阶边缘。Auto-Pilot 模式下，轮椅的无人驾驶能力更「强」，你只需要在屏幕上点个目的地，"
