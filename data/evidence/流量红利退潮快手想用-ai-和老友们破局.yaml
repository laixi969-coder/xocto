  fact: "头图来源：快手 \n 8 月 29 日，在 2026 快手光合创作者大会上，快手科技创始人、董事长兼 CEO 程一笑公布了一组数据：快手每天发布的作品超过 5800 万，近一年有超过 2.7\
    \ 亿用户发布过作品，持续发布作品超过 10 年的创作者则超过 1700 万。 \n 大会上，快手用这些数据说明其「平等普惠、温暖信任、多元特色」的社区底色。但放进快手最新财报，它们可能还有另一层含义：当流量扩张接近尾声，平台开始把「谁能留下来、谁能持续经营」变成新的竞争指标。\
    \ \n 快手 2026 年第二季度营收 355 亿元，同比增长 1.4%；DAU 为 4.123 亿，同比增长 0.8%；MAU 为 7.973 亿，同比增长 11.5%。用户规模仍在增长，但管理层已经明确，短视频行业进入存量竞争阶段，快手也不再追求不计成本的流量扩张。\
    \ \n 与此同时，直播业务还在调整。二季度，快手直播收入 87 亿元，同比下降 13.5%；经调整净利润 39 亿元，同比下降 30.3%。过去依靠用户增长和直播扩张支撑的平台叙事，正在失去原有的速度。\
    \ \n 这场以创作者为主角的大会，实际需要回应的是快手下一阶段的增长问题：在主站增速趋缓、传统直播承压之后，快手如何从已经积累的用户、作者和社区关系中释放更多价值？ \n 主站增速趋缓，直播也在寻找新入口\
    \ \n 快手的用户规模仍在增长，但增长结构已经发生变化。 \n 2026 年第二季度，快手 DAU 为 4.123 亿，同比增长 0.8%；MAU 为 7.973 亿，同比增长 11.5%。相比月活规模的扩张，核心日活用户的增长已经明显放缓。管理层也在财报电话会上表示，短视频进入存量竞争阶段，平台不再追求不计成本的流量扩张，而是转向用户价值、私域关系、产业带和下沉县域。\
    \ \n 这种变化也反映在收入端。快手二季度营收 355 亿元，同比增长 1.4%；广告收入 206 亿元，同比增长 4.4%，直播收入则同比下降 13.5%至 87 亿元。同期，经调整净利润为\
    \ 39 亿元，同比下降 30.3%。 \n 其中，直播收入的下降与快手主动调整业务结构有关，但它也意味着，过去依赖打赏和直播规模扩张的增长方式已经难以维持原有速度。快手需要为直播寻找新的主播、新的用户入口和新的交易场景。\
    \ \n 主站面临的问题也类似。快手已经拥有接近 8 亿月活用户、超过 4 亿日活用户，每天产生超"
