  fact: A frontier lab can pay more for training data it gets to keep exclusive, or take a discount on
    data another lab can buy too. At AI Engineer CODE, G2i founder Gabe Greenberg tells swyx how labs
    make that decision, how small pilot orders turn into bigger engagements, and when it makes sense to
    build a data operation in-house. We also get into what the labs are buying. A good training task should
    sit just ahead of what a model can do today. Gabe explains how senior engineers design the task, choose
    the starting data, and build a verifier that can score the result. Thanks to G2i for co-organizing
    AI Engineer CODE 2026 and sponsoring this episode. Join us April 26–27 at AI Engineer Miami 2027 .
    Show notes G2i builds AI training data and reinforcement learning environments with senior engineers.
    ORC is the multi-agent coding platform Gabe’s team uses internally. Recorded at AI Engineer CODE in
    San Francisco. Chapters 0:00 How hard should training tasks be? 0:15 What G2i sells to frontier lab
