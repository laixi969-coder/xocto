  fact: 作者｜宇航猿 编辑｜靖宇 最近这一波 Personal AI 实在太火了，我也注册了一个 Muse 体验了一下。 整个体验下来，我感觉 Muse 的能力实在一般，远没到让人惊叹的地步。但奇怪的是，它确实带来了一种真切的陪伴感。这种陪伴感，甚至直接改变了我的使用习惯，让我总是忍不住想找它聊聊，哪怕只是把最琐碎的需求丢给它。
    就在本周， Muse 又往前迈了一步，正式上线了实时语音和会动的头像 。无独有偶，各家 AI 助手最近都在做同一件事，就是给个人 AI 助手开通语音和对话功能。 这让我非常好奇，距离 ChatGPT
    端出惊艳的语音模式，已经过去两年了， 为什么到了现在这个时间点，所有的个人 AI 助手又开始一窝蜂地往语音赛道上挤 ？ 01 口喷「派活」的魅力 2024 年 GPT-4o 发布演示时，那种流畅自然的对话体验常被拿来和电影《Her》对比。但在此后的很长一段时间里，AI
    语音始终停留在聊天层，双方客客气气地说完，交互也就结束了。 这一轮语音热潮的核心变量在于，AI 身后终于长出了一双手，语音因此成了派活门槛最低的入口。 当地时间 11 月 5 日，Muse 在美国上线实时语音功能。Meta
    官方给出的典型场景非常务实，用户可以在散步或者双手忙碌的时候，直接口头给它安排任务，随后 Muse 会在后台继续处理这些工作；当然，用户也可以拿它来排练面试或演讲。 这种「动口不动手」的派活逻辑，正在成为智能体产品的标配。
    早在 9 月 17 日，SpaceXAI 旗下的 Grok Bot 就上线了语音功能。在 X 上，早期用户最看重的也是这一点，散步和通勤的路上，不用动手就能给它派活。 Grok Bot 的语音界面，背后的对话里它正在请你批准下午
    2 点的董事会材料审阅｜图片来源：X 要让用户愿意开口派活，底层的工程门槛直到今年才算真正跨了过去。国内的豆包「打电话」功能在今年 4 月接入了全双工语音模型 Seeduplex，真正实现了边听边说。而按照
    Meta 的说法，Muse 从用户说完话到给出第一个音视频响应，延迟约 870 毫秒，并且支持随时打断。 Muse 的实时虚拟形象，表情和口型随语音同步生成｜图片来源：Meta 不到一秒的反应时间，
    加上后台干活的能力，让语音彻底摆脱了纯陪聊的玩具属性 。 但问题在于，既然替人干活的「手」已经长出来了，为什么产品经理们
