  fact: "OpenAI 终止与 Cursor 合作 \n 8 月 29 日消息，OpenAI 以「无法信任 SpaceX 遵守服务条款」为由，终止向已被 SpaceX 收购的 AI 编程工具 Cursor\
    \ 提供模型支持。Cursor 对 OpenAI 模型的直接访问权限将于 11 月 12 日终止。 \n   \n OpenAI 在其官方网站发布的公告中明确表示，终止合作的决定「归根结底在于信任问题」。\
    \ \n OpenAI 列举了两起具体事件作为依据： \n 第一，Twitter（现已成为 SpaceX 的一部分）在马斯克收购后违反了与 OpenAI 的合同条款。相关诉讼至今仍是双方纠纷的背景。\
    \ \n 第二，xAI（同样已并入 SpaceX）在今年早些时候，马斯克在宣誓作证时承认 xAI 违反了 OpenAI 的服务条款——通过蒸馏（distillation）技术使用 OpenAI 数据训练模型。\
    \ \n OpenAI 与 Cursor 签署的定制协议中明确规定：在公司控制权发生变更后，OpenAI 拥有在限定期限内终止协议的权利。 \n 随着人工智能能力的不断演进，我们也承担着更高标准的责任，必须确保即将推出的新模型\
    \ Astra 能够严格遵循我们的条款合规使用。 \n 综合以上考虑，我们决定在合规允许的前提下将合同终止日顺延至最晚时间，但未来将不再向 Cursor 提供后续新模型。 \n 马斯克与 Altman\
    \ 在 AI 编程、大模型研发等赛道上的全面对垒，这场由昔日合伙人上演的 AI 争霸战，远未到终局时刻。 \n   \n 索尼音乐与华纳音乐出版起诉 Anthropic 索赔金额或达数十亿美元 \n\
    \ 索尼音乐与华纳音乐出版已向美国加利福尼亚北区联邦地区法院提起诉讼，指控人工智能公司 Anthropic 未经授权使用数万部受版权保护的作品，用于开发和运营其 Claude 系列人工智能模型。\
    \ \n 两家公司要求 Anthropic 就每部作品最高赔偿 15 万美元，并就每次可确认的版权信息被删除的行为额外索赔最高 2.5 万美元。如果法院最终支持原告主张并判处最高赔偿额，案件涉及的总金额可能达到数十亿美元。\
    \ \n 原告在诉状中将相关行为称为「历史上规模最大、最公然持续进行的知识产权盗窃之一」，指责 Anthropic 及其创始人达里奥·阿莫代伊和本杰明·曼发起大规模非法下载、抓取和传播版权作品的行动，以训"
