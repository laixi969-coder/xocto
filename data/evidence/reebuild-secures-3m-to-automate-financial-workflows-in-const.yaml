  fact: Vienna-based construction technology startup reebuild has raised €3 million in seed funding to
    expand its AI-powered back-office automation platform for construction and real estate companies.
    The round was led by Fortino Ventures , with participation from Rise PropTech and Curiosity VC . The
    company develops software that automates administrative and financial processes for construction companies
    and property developers, including invoice processing, cost management and material tracking. Its
    platform uses AI to process documents, match financial records and provide project cost information.
    Construction and real estate companies often rely on spreadsheets and manual processes to manage invoices,
    contracts and project costs. This can lead to delays in approvals, limited visibility into project
