  title: 有了 AI 之后，开发越来越容易，推广却越来越难？
  published_at: '2026-11-28T02:16:02Z'
  collected_at: '2026-11-28T03:55:17Z'
  source_kind: product
  tier: independent
  fact: "最近用 AI 辅助开发了几个项目，感觉开发效率确实提高了不少，但产品上线后，怎么找到用户依然是个难题。\r\n\r\n尤其是微信小程序，个人开发者似乎没有太多低成本的推广渠道。\r\n\r\
    \n于是最近又折腾了一个微信小程序版的 Product Hunt：https://minihunt.top\r\n\r\n目前收录了 2000 多个小程序，支持开发者免费提交自己的作品，算是对产品推广方向的一次尝试。\r\
    \n\r\n想和大家讨论一下，当 AI 逐渐降低软件开发门槛之后，获取用户会不会成为独立开发者最大的挑战？\r\n\r\n大家平时除了写代码，有没有研究过产品推广和获客？"
