  fact: 'My comment on The New York Times warns photographers not to update Photoshop over AI features
    — Hacker News. I had a NYT photographer take my picture at my home earlier this year (for a story
    about Moltbook, oddly enough). At one point I asked if they could fix things up if I had a stain on
    my shirt and they said absolutely not - they present photographs as they were taken, with cropping
    and balancing applied but no edits beyond that. He did spend a bunch of time trying to find the best
    possible natural lighting for the shots he wanted. The photo at the top of https://www.nytimes.com/2026/02/02/technology/moltbook-ai-so...
    is my laptop, taken in my garden, after hunting around for the best spot that didn''t have too much
    glare on the screen. You can see how dirty my screen is, too! Photography for a newspaper is photo
    journalism, and they take it seriously. (Thankfully I did not have a visible stain on my shirt.) Tags:
    photography , new-york-times , hacker-news , journalism'
