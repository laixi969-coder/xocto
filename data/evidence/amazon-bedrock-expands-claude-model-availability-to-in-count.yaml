  fact: Anthropic's Claude Opus 5, Claude Sonnet 5, and Claude Haiku 4.5 are now available in India through
    Amazon Bedrock geographic cross-Region inference. You can access these models while processing data
    within the India Regions, and get started from the Amazon Bedrock console or with the Messages, InvokeModel,
    and Converse APIs.
