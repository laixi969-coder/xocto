  title: 影响了两代人后，Meta 被判赔 180 亿美元
  published_at: '2026-08-27T07:33:48Z'
  collected_at: '2026-08-29T03:43:29Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜桦林舞王 \n 编辑｜靖宇 \n \n 1998 年，美国 46 个州的检察长联手起诉四大烟草巨头，最终以 2060 亿美元的天价和解收场。 \n 那场诉讼不仅让烟草公司付出了巨额赔偿，更从根本上改变了一个行业的运行规则——禁止向未成年人投放广告、禁止用卡通形象推销香烟、在产品包装上强制印刷健康警告。此后，美国的吸烟率几乎减半。\
    \ \n 28 年后，同样的剧本，换了主角。 \n 当地时间 8 月 26 日，Meta 与美国 52 个州和领地的检察长达成和解，同意支付最高约 180 亿美元，并对 Instagram 和 Facebook\
    \ 实施一系列强制性的产品变更。 \n  这是针对科技公司有史以来最大的民事和解之一，也是社交媒体行业第一次因为「让孩子上瘾」而，被迫从产品层面做出根本性改变 。 \n   01   \n  Meta\
    \ 提前认输  \n 这笔和解的时间点很有意思，就在和解宣布的前一天，Instagram 负责人 Adam Mosseri 还在加州奥克兰的法庭上作证，而 Meta CEO 扎克伯格也被预期将在接下来几天出庭。\
    \ \n 这场由加州、科罗拉多、新泽西和肯塔基州牵头、29 个州联合发起的联邦诉讼，8 月 18 日才刚刚开庭。 \n  原告方索赔金额高达 1.4 万亿美元 ，指控 Meta 蓄意设计无限滚动信息流、算法推荐和高频推送通知等功能来让青少年上瘾，同时在明知风险的情况下向公众隐瞒平台对未成年人心理健康的危害，并违反《儿童在线隐私保护法》（COPPA）非法收集\
    \ 13 岁以下儿童的个人数据。 \n  Meta 选择在审判进行到第 8 天时和解，说明它非常清楚一个陪审团判决可能带来的灾难性后果 。 \n 事实上，今年早些时候的几场判决已经给出了明确信号。3\
    \ 月，新墨西哥州的陪审团认定 Meta 违反了该州的《不公平贸易行为法》，判处 3.75 亿美元罚款。8 月 6 日，同一案件的法官进一步裁定 Meta 制造了「公共滋扰」，追加 5.67 亿美元赔偿并要求实施青少年保护措施。同样在\
    \ 3 月，洛杉矶的一个陪审团在针对个人原告的诉讼中，判定 Meta 和 Google 需为一名少女的抑郁和焦虑承担责任，合计赔偿 600 万美元。 \n 一个又一个不利判决，让 Meta 意识到继续打下去的风险远大于花钱了事。\
    \ \n   \n 社交媒体之后的产品规则将被牢牢限制住｜图片来源：Medi"
