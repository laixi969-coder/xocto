  fact: Venture funding to robotics startups has soared in 2026, with the bulk of investment going to
    companies based in China and the U.S., Crunchbase data shows. All told, global venture funding to
    robotics startups totaled $9.9 billion in Q3, more than double the $4.3 billion invested in Q3 2025,
    per Crunchbase data 1 . It was the latest in a run of quarters with nearly $10 billion or more in
    funding. Funding to the robotics sector in Q1 through Q3 2026 is up around 185% year over year. China
    and the US lead The bulk of robotics funding this year has been in China, with $13.2 billion invested,
    and the U.S., with $12.1 billion. Germany, the third-largest recipient of robotics startup funding,
    trails with $1.7 billion invested. The largest rounds in China went to Guangzhou-based Xpeng Robotics
    , a builder of AI models and physical robots that raised $900 million, and Shenzhen’s AI² Robotics
