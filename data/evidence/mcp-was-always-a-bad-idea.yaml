  fact: "My comment  on  MCP was always a bad idea?  — Hacker News.  This article entirely misses the\
    \ value that MCP brings today. \n Sure, there's almost no reason to use MCPs if you are running a\
    \ full-blown terminal agent (Claude Code, Codex, Meta Muse, OpenClaw etc) with unfettered internet\
    \ access - just let it call APIs directly. \n If you want to operate something that's less YOLO than\
    \ that, you'll find yourself wanting: \n \n Control over exactly which external services it can access\
    \ \n A way to handle authentication that doesn't allow the agent to directly access API keys \n A\
    \ sensible UI to allow users to connect and authenticate further services \n Strong audit logging\
    \ for what's going on \n \n MCP makes all of that so much easier to provide. \n Thinking MCP is obsolete\
    \ because full coding agents don't need it misses out on all of the other things we might want to\
    \ build. \n    \n    \n         Tags:  hacker-news ,  model-context-protocol"
