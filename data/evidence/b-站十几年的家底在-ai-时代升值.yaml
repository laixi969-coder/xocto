  fact: 作者｜Moonshot 编辑｜郑玄 当 AI 能在分秒内给出详尽答案，为什么人们还需要看长视频？ 最需要回答这个问题的平台是 B 站，但它们最新发布的财报，给了个出乎意料的答案。 11 月
    24 日，B 站发布 2026 年第三季度财报，总营收达 83.2 亿元，同比增长 8%，调整后净利润达 8.3 亿元。 社区三项核心指标均创历史新高：日均活跃用户达 1.24 亿，月均活跃用户达
    3.94 亿，用户日均使用时长首次突破两小时，达到 121 分钟，特别是 AI 知识内容，消费时长同比增长了 108%。 钱、用户、内容三线增长。看来 B 站，在 AI 时代过得更好了。 细看 B
    站这份财报，以及今年以来站内出现的一些新内容、新创作者，就会发现，AI 给 B 站带来的机会远不止于科技区多了一个热门选题。 01 B 站，最好的 AI 教程基地 AI 本身已经成为大众需要学习的一项技能，这门新兴的「学科」，正在成为
    B 站知识区一个颇具潜力的增长点。 如今 AI 产品百花齐放，光是弄明白市面上有哪些 AI、分别擅长什么，就够做一期视频了。每隔几个月，随着模型能力的更新，很多内容也会随之更新。 产品测评，正是
    B 站的传统优势。从早年的手机、电脑，到近几年的新能源汽车、智能硬件，B 站已经培养了一批擅长测评的 UP 主。 AI 产品的爆发，就为这批创作者带来了一个全新的内容品类。 B 站也接住了这波创作者。9
    月 16 日，B 站上线了专门用于 AI 测评的「AI 无限竞技场」，汇集不同领域 UP 主的大模型实测，由他们自主出题，围绕代码、推理、专业应用以及各种趣味脑洞，让全球主流大模型同场竞技。 现在的大模型厂商发布新品，谁家不顺手放几张「屠榜」的成绩单？但在
    B 站，一个擅长做游戏的 UP 主，可以拿同一个游戏创意去测试不同的大模型。这类跨门类、基于真实场景的测评，让普通人对大模型的能力有了更直观的认识。 第三季度，B 站大模型真实场景实测相关投稿超过
    1.3 万条，涉及 100 多个模型版本。对于一家 AI 公司而言，恐怕很难自己设计出如此丰富的应用场景。 而且，学 AI 这件事还挺容易「上头」的。从最初研究怎么和 AI 聊天，到搭建自己的 AI
    工作流，用 AIGC 创作自己的作品……学习 AI 的过程，本身就伴随着持续的内容消费。 在这方面，B 站 AI 知识内容
