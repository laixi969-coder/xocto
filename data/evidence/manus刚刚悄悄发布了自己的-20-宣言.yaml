  fact: 10 月 26 日，Manus 联合创始人、产品合伙人张涛（网名 HideCloud）最近在自己的公众号「潜云思绪」写了一篇长文，标题叫《 用 Manus 改造 Manus 》。 文章开头是一个让他印象很深的画面。他给工程师提了几条需求和
    Bug，过一会儿去看进展，发现对方电脑上开着一排 Codex 和 Manus 的 Session。随便点开一个，输入就是他刚在 Slack 上发的需求原文，一字未改。 更让他意外的是，这位工程师当时同时在处理十几、二十个需求。在今天的
    Manus，这已经是常态。 这篇文章信息量很大，有几件事最值得记下来。 Manus 内部做了一个叫 Manus-mono 的统一代码入口，配上一本写给 AI 看的说明书，让 AI 能看到跨仓库的全局。一个需求，一个人就能写完所有端。移动端团队一直只有
    7 个人，同时负责 2 个产品、4 个 App，进度和网页版基本同步。 所有产品经理都向 Manus 提交过代码，大约一半能独立把需求做到上线。有的产品经理交出来的需求，已经从文档变成了一段视频。
    市场团队有了一位「数字同事」，会自己安排工作、主动提醒项目进度，还会跨团队去把功能细节问清楚。 9 月， 公司的 AI 开销人均超过 1 万美元，少数人一个月就用掉七八万美元 。张涛专门用一节回应了外界的质疑。
    文章发出的时间点也很微妙。9 月底，Manus 发布了 2.0 版本和个人智能体应用 Cue；10 月初，母公司蝴蝶效应宣布完成超过 5 亿美元的新一轮融资，同时在北京开出 17 个岗位。 放在这个节点上看，这篇文章更像是
    Manus 团队进入 2.0 时代的一份宣言 。它讲的是组织如何利用 AI 进化，透露出来的却是这家公司的产品方向、成本逻辑和用人标准。 01 Manus 本身，就是 2.0 的样板间 如果你把文章里的内部实践和
    Manus 2.0 的功能列表放在一起，会发现它们几乎能一一对上。 市场团队的数字同事用内部网站觉得不顺手，可以通过一个反馈接口直接提需求，需求一进来就自动触发 Manus 的开发任务。这背后用的是
    2.0 的 Automations，收到一条外部通知，就自动开始一个任务。 产品经理用视频代替需求文档，靠的是 2.0 大幅加强的视频能力，既能用图像生成视频，也能用代码做动画。做语音转文字功能的那位产品经理，故事很典型。她
