  fact: 'In this post, we show how Skyflow and Amazon Bedrock AgentCore Gateway keep sensitive data out
    of the tools your AI agents call, and out of the model context those tools feed. We add Skyflow Detect
    to Amazon Bedrock AgentCore Gateway as a request and response interceptor . The Skyflow interceptor
    de-identifies data before it reaches a tool, restores it before the agent reads the result, and replaces
    documents with clean copies before the agent opens them. Your agents and tools don’t change. Skyflow
    is available in AWS Marketplace, and the interceptor is open source on GitHub. Agents act through
    tools, and tools move data Agents have moved from answering questions to taking action, and they take
    action through tools: Model Context Protocol (MCP) servers, SaaS APIs, document stores, and web search.
    Every agent tool call is a data flow. Most enterprise controls cover what goes into and comes out
    of the model. Far fewer cover what an agent sends to its tools or what those tools send back.'
