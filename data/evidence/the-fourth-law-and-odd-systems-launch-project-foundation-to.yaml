  fact: 'The Fourth Law and Odd Systems today unveiled Project Foundation, a semiconductor initiative
    to mass-produce uncooled thermal sensors in Europe and the United States. The project aims to expand
    European thermal sensor production to four times its current level and US production to twice its
    current level within three years, building a new industrial base for defence and everyday applications.
    The primary mission of Project Foundation is to secure thermal sensor sovereignty for Europe and the
    United States by developing proprietary uncooled long-wave infrared (LWIR) sensors, also known as
    microbolometers, and the capacity to manufacture them at scale. Thermal imaging is increasingly important
    to modern warfare, autonomous systems, and industrial applications, enabling drones, vehicles, and
    robots to operate in darkness, poor visibility, and challenging environments. However, developing
