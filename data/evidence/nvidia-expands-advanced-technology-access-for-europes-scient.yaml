  fact: 'Much of today’s scientific progress begins with computation. But turning accelerated computing’s
    potential into scientific progress — modeling climate systems, designing molecules, simulating materials
    and more — depends on more than breakthrough technology. Especially for smaller labs, early-career
    scientists or science-based startups, the hardest part of research can be everything that comes before
    the science: assembling tools, finding compute and building the expertise to use both. At the AI in
    Science Summit in Dublin today, the European Commission launched the AI in Science Enablers Initiative,
