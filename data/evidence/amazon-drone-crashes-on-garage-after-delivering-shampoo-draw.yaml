  fact: An Amazon delivery drone that clipped a fiber-optic line before crashing onto a garage roof is
    now the subject of an investigation by the US Federal Aviation Administration. It’s the latest delivery
    drone mishap caught on video as Amazon and other companies are ramping up such aerial delivery operations
    across the United States. The November 20 incident began with Jim Brennan and his wife, residents
    of Huntington Woods, Michigan, placing an order for shampoo and being surprised by a notification
    about the package arriving by drone within seven minutes, according to WXYZ 7 News Detroit . After
    the drone dropped the package into Brennan’s backyard, it lost a propeller when it caught on fiber-optic
    cable and floundered sideways before getting pinned between the neighbor’s garage roof and some power
    lines. “Like a sick bird, it tried to go up, it tried to get out of here,” Brennan told WXYZ 7. Read
    full article Comments
