  fact: At AI Engineer New York this month, we sat down with Aman Singh , the lead AI Engineer at Arca
    , an “AI-native” company providing wealth management services. We discovered that while agents do
    most of the background work in the firm, there are guardrails in place to ensure that human advisors
    are making the final decisions. The goal is for AI to guide the process; or as Singh nicely put it,
    “agents prompt people more than people prompt agents.” Arca recently raised $48.5 Million in a round
    led by General Catalyst, with participation from Index Ventures and Venrock. One of the features of
    using AI in financial services, explained Singh, is that it’s typically long-horizon work — although
    not long-running. In his AIE presentation, Singh noted that agent tasks at Arca can take up to ten
    days. “It's very stop-start, there's many actors in between, many decision points, many handoffs,”
    he said. For this reason, Arca has developed an internal memory system . “So we have this persistence
