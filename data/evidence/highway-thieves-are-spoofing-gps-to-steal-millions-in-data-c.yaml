  fact: 'Highway thieves are using sophisticated digital tactics that investigators worry make it easy
    to rob trucks carrying millions in expensive data center equipment. NBC News spoke to “several industry
    leaders, consultants, and investigators advising law enforcement” offices probing the biggest thefts
    yet and reported that since June, thieves have “made away with more than $100 million in data center
    freight.” Here’s how they said thieves get away with it: First, thieves hack freight brokers’ accounts
    on shipment-listing websites and post fake shipments to lure real bids, then send a malicious link
    to any trucking companies that respond. Once victims click, thieves install software to take control
    of their accounts and start bidding on real shipments. Sometimes, a real delivery driver is hired
    to collect the cargo, unaware of the scam, and other times fake driver’s licenses are used to get
    accomplices hired. Either way, the goods are eventually transferred to a driver working with the thie'
