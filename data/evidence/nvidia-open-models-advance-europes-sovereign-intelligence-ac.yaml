  fact: NVIDIA is expanding its family of open models across language, robotics, biology, and quantum
    computing, giving developers, researchers and enterprises what they need to build applications tailored
    to local languages and industries The portfolio includes the new NVIDIA Nemotron 3.5 Super VL and
    Nemotron 3.5 Bolt models; new NVIDIA Nemotron Retriever models for embedding, reranking and document
    parsing; the new NVIDIA Kumo family open weight foundation models and libraries for structured business
    data; NVIDIA Cosmos 3.5 world models; NVIDIA Alpamayo 2 Edge for autonomous vehicles; NVIDIA BioNeMo
    for healthcare and scientific discovery; and NVIDIA Ising for quantum computing. The open models give
    organizations a foundation they can customize with local data and deploy on infrastructure they control.
