  fact: AI-powered personal finance startup Matters has emerged from stealth with $5 million in pre-seed
    funding to develop a consumer banking platform focused on helping users manage their spending and
    increase their savings. The round was led by Swedish angel investor Jakob Johansson, with participation
    from Knut Frängsmyr (former COO of Klarna), Douglas Stark (Voi co-founder), Johan Bladh (CEO of Röko),
    Patrik Tran (CEO of Validio), and Per Widerstrom (CEO of Evoke). Matters was founded by Per Österström
    with the aim of building an AI-native consumer bank that combines automation and personalised financial
    guidance to help customers improve their financial wellbeing. The company's planned offering combines
    neobank services with an AI Advisor designed to help users make more informed spending decisions,
    increase savings and work towards their financial goals. Customers will pay a flat monthly subscription
