  fact: 'With Amazon Quick Sight layer maps, you can now plot points and routes, like store locations
    across a city or flights leaving an airport. Geospatial maps help businesses spot patterns that are
    tied to location, like how a region is performing or where customers are concentrated. Amazon Quick
    Sight supports this with multiple map types, including point maps, filled maps, and layer maps. When
    layer maps first launched , you could upload a GeoJSON file to draw custom shape layers, such as sales
    territories or districts, and join those shapes to a dataset. That handled regions and boundaries
    well, but it didn’t cover the individual locations inside them or the routes running between them.
    Layer maps now support two more geometry types from the same GeoJSON workflow: Point and LineString
    . Points mark specific locations, such as individual store or facility sites. A LineString traces
    the route between locations, like a delivery path or a flight between airports. Amazon Quick Sight
    , the bus'
