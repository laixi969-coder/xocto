  fact: "DeepSeek V4.1 Flash 模型正式发布：全面超越 V4 Pro、原生多模态视觉理解，最高降价 60% \n 9 月 10 日消息，深度求索今日正式发布 DeepSeek V4.1\
    \ Flash 模型 。这是其全新模型结构系列中的最小尺寸的模型，具备原生多模态视觉理解能力。 \n 新模型结构的设计初衷是：能力上限更高、推理速度更快、吞吐更大、可扩展到更大参数模型。 \n \
    \ DeepSeek V4.1 Flash 为 552B 参数的 MoE 模型 ，采用了全新的 Causal-Encoder-Decoder 结构，输入和输出不对称，输入激活只有 8B，输出激活\
    \ 16B，成本显著低于已知的同尺寸模型。同时，V4.1 Flash 还采用了新的预训练方式、经过了更大规模的强化学习后训练，在基准测试中，成功超越了包括 DeepSeek V4 Pro 在内的一众旗舰模型的智能水平。\
    \ \n   \n ▲ DeepSeek-V4.1-Flash 与主流前沿模型在 Agentic Benchmark 上的性能对比 \n   \n 此外，新一代模型大幅减少了 KV Cache 缓存的大小，与上一代模型相比，\
    \ 对 HBM 的需求减少到 1/4，对 SSD 的需求减少到 1/8 。 \n 在 Agent 使用场景中，缓存命中的费用往往占比较高，对 KV Cache 的压缩大幅降低了 Agent 类任务的使用成本。\
    \ \n 如图展示了 DeepSeek 在减少上下文存储方面的持续进展。相对于初代模型，KV Cache 是原来的 1/437。 \n   \n DeepSeek V4.1 Flash 已同步上线\
    \ DeepSeek API，原生支持多模态， 将模型名称更改为 deepseek-flash 即可调用最新的 V4.1 Flash 模型 。 \n 旧版本模型 V4 Flash 与 V4 Flash\
    \ Vision Exp 现已下线，出于兼容考虑，模型名 deepseek-v4-flash、deepseek-v4-flash-vision-exp 将被暂时路由到 V4.1 Flash。（来源：CnBeta）\
