  fact: 头图来源：极客公园 10 月 28 日，合肥，大众汽车集团（中国）办了自己的第一次技术日。 这场发布会的主角叫「VEGA」，名字取自织女星，是大众在中国本土自研的一体化技术矩阵。它把整车平台、电子电气架构和高级驾驶辅助系统三大核心技术打包成了一套体系。
    按大众的说法，它由此成为中国市场唯一一家拥有本土开发自研技术矩阵的外资车企。 大众汽车集团（中国）董事长兼 CEO 贝瑞德在台上说，短短三年，大众在中国打造出了一套一体化的技术矩阵，在国际汽车制造商之中，能做到这一点的应该屈指可数。
    这句话的背后，是大众这几年在面对激烈的「中式竞争」后，第一次重新找到了方向的自信。 「在中国造」到「在中国研」 把时间往回拨四年。 2022 年，大众把在华战略从「在欧洲，为中国」改成了「在中国，为中国」。贝瑞德的解释是，大众要从过去在中国生产制造，走向在中国自主创新。
    2023 年，大众在德国以外规模最大的研发中心 VCTC 在合肥成立。如今这里有 3000 多名员工，中国团队从执行方变成了主导方，本土工程师拿到了在本地自主决策的权力。 这个转向背后有现实的压力。2025
    年，大众集团全球营业利润 89 亿欧元，而 2024 年是 191 亿欧元。在华交付约 269 万辆，规模依然靠前，但本土品牌在智能化上的攻势，让「德国研发、中国生产」的老模式越来越跟不上节奏。
    VEG A是大众在中国本土自研的一体化方案|图片来源：极客公园 VEGA 就是这四年转型的第一份完整答卷。贝瑞德说，VEGA 不只是一套技术矩阵，更是一种能力， 在中国本土自主研发、自主整合并持续迭代核心技术的能力。
    VEGA 的第一根支柱是新一代整车平台，CMP 和 CSP。 CMP 面向 A 级到 A+ 级的主流市场，支持纯电和插混；CSP 面向 B 级到全尺寸及未来的旗舰车型，支持纯电和增程。 CMP 车型
    CLTC 续航超过 600 公里，最高效版本百公里电耗约 11 千瓦时，30% 到 80% 充电 25 分钟。CSP 纯电车型续航目标约 800 公里，增程版综合续航超过 1500 公里，依托峰值电压超过
    850 伏的高压架构，10% 到 80% 最快不到 13 分钟。 首席技术官吴博锐称大众是智能网联汽车时代的「平台之王」｜图片来源：极客公园 驾控是大众更愿意强调的部分。CMP 用了 54:46
