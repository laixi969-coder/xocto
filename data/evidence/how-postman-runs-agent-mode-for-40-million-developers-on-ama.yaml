  fact: Building an AI agent for a demo and operating one for 40 million developers are different engineering
    problems. Postman set out to build Agent Mode , an AI-native way to work across API testing , documentation
    , discovery, and implementation. The team expected model quality and prompt design to be the hardest
    problems. The deeper challenges came from integrating an agent into a mature product with years of
    interface-driven assumptions, a wide surface area, and specialized concepts. In this post, Postman
    and AWS describe the architectural patterns that emerged while making a mature product legible to
    an AI agent. These patterns include controlling tool sprawl, exposing schema-based reads, and treating
    context rather than capability as the primary bottleneck. We also explain how Agent Mode uses Amazon
    Bedrock for model flexibility, geographically scoped cross-Region inference, model-dependent zero
