  fact: 'Release: datasette-agent 0.5a0 This is a significant release of Datasette Agent . The most notable
    new feature is called the panel - it lets the agent chat open and then sit next to pages from Datasette,
    for example a table or query page. When combined with datasette-apps this means you can prompt a database-backed
    app into existence and then modify it from the chat that sits next to that app. You can try it by
    signing in with your GitHub account to agent.datasette.io . Tags: projects , datasette , datasette-agent'
