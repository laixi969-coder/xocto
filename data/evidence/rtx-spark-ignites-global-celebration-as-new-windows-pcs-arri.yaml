  fact: NVIDIA RTX Spark laptops are now available, bringing NVIDIA Blackwell RTX graphics, up to 128GB
    of unified memory and the full NVIDIA AI platform to slim, premium Windows PCs. Starting at $2,399,
    laptops from ASUS, Dell, HP, Lenovo, Microsoft and MSI bring powerful local AI, content creation and
    gaming capabilities to a portable device, with additional systems on the way. NVIDIA celebrated the
    launch with events around the world, including one in Berlin, where NVIDIA founder and CEO Jensen
    Huang made a surprise appearance. A New Generation of Windows PCs Has Arrived RTX Spark brings decades
    of NVIDIA accelerated computing innovation into a single superchip, combining an NVIDIA Blackwell
    RTX GPU and NVIDIA Grace CPU with up to 1 petaflop of AI compute and up to 128GB of unified memory.
