  title: 当美国无法建设数据中心，会对 AI 产生怎样的冲击
  published_at: '2026-11-11T05:23:24Z'
  collected_at: '2026-11-12T03:00:03Z'
  source_kind: market_signal
  tier: independent
  fact: 作者｜Techno 之王 编辑｜靖宇 2026 年 11 月 4 日，美国中期选举结果落定后的第二天上午，OpenAI 的高管们坐到了一起。 据外媒援引知情人士的消息，他们讨论的是要不要重设
    2027 年的数据中心容量预期。讨论还没有形成决定，但焦虑已经摆上了台面。 过去几个月，美国各地的大型数据中心项目接连被按下暂停键。得州前任州长 Abbott 从 8 月起冻结了数据中心的并网和空气许可，要求审计到年底；新当选的州长
    Gina Hinojosa 承诺，在州议会立法保护居民之前，暂停所有新数据中心审批，而议会会期要到 2027 年 5 月才结束。 俄亥俄新州长 Amy Acton 提出有条件暂停，要求新项目承担全部电力成本、只能建在旧工业用地上；佐治亚新州长
    Keisha Lance Bottoms 则准备上任后直接签行政令，暂停全州新建。 据 Tokenpost 统计， 今年 7 月到 11 月 4 日，美国至少有 21 个大型数据中心项目被取消，已经接近
    2025 年全年的 23 个 。Anthropic 在 10 月 26 日提交的招股书里，也把暂停令写进了风险因素：一些辖区正在考虑或已经批准暂停令，可能推迟或阻止它依赖的算力设施，而且反对数据中心的声音正在跨辖区变得更有组织。
    如果我们把这股趋势推到极端，去设想这样一个场景，如果美国所有规划中的数据中心都建不成，对当下和未来的 AI，意味着什么？ 01 潜在算力增长被砍掉 50% 为了把推演的边界划清楚，我们设定这样一个极端场景，它建立在三条假设上：
    1， 全美所有尚未开工的规划项目全部冻结 ，相当于把目前约 41% 的暂停范围推向全国； 2， 已经在建的项目全部按期完工 ，这和德州等地暂停令只针对新审批的做法一致； 3， 芯片照常供应，唯一的硬约束是电和地
    。我们只推演美国本土，暂不讨论算力外迁。 这个场景下，被卡住的算力规模有多大？据 Newmark 估计，美国数据中心当前用电约 60GW，这里包含所有数据中心，并非全是 AI。在建容量各家口径不同：Cleanview
    约 57GW，Wood Mackenzie 约 80GW，DCMap 8 月的统计约 90GW。这部分项目在情景里会照常完工，构成未来几年美国算力的全部增量。 真正庞大的是「规划中、未开工」的部分，DCMap
    8 月统计为 228GW，W
