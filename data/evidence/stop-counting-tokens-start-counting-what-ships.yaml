  fact: When a developer gives an AI agent a coding task, the agent does more than answer once. It plans,
    generates code, runs tests, and repeats the process to correct errors. A single task can use 10 to
    50 times more tokens than a basic chat prompt. The more useful the agent becomes, the more calls it
    makes. With per-token pricing, the workflows creating the most value can also become the most expensive.
    The financial pressure is already visible. Uber reportedly exhausted its entire 2026 AI budget by
    April after expanding its use of Claude Code. GitHub Copilot moved from flat-rate pricing to metered
    credits. Gartner predicts that AI coding token costs will surpass average developer salaries by 2028.
    The natural response is rationing usage caps, seat limits, and approvals before developers launch
    agents. But blanket limits can restrict the workflows delivering value. They also optimize the wrong
    number. Cost per token measures consumption, not results. Some spending reflects waste, including
