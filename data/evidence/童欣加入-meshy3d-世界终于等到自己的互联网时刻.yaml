  title: 童欣加入 Meshy，3D 世界终于等到自己的「互联网时刻」
  published_at: '2026-09-07T10:26:42Z'
  collected_at: '2026-09-07T15:53:16Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Cynthia  \n \n  编辑｜ 郑玄  \n   \n \n  2016 年， 后来被反复宣布了无数次元年的 VR 产业，正式迎来了第一次爆发浪潮。  \n 这一年 3 月\
    \ 28 日，Oculus Rift 首批发货，售价 599 美元的产品很快被销售一空；两天后，曾在微软 Windows 10 发布会上被重点推介的 3000 美元 HoloLens 开发者版也迎来正式发售，此前围绕\
    \ HoloLens 举办的 11 城开发者巡展，名额开放 90 分钟便全部订满。同一时间还未正式发售 PlayStation VR 的索尼，则直接宣布已经有 230 多家开发商和发行商正在为它制作内容。\
    \ \n 资本比硬件更为激进。高盛在当年年初把 VR/AR 直接称作下一代计算平台的竞争者；2 月，连消费级产品都还没有推出的 Magic Leap，则是一轮融资就拿到 7.935 亿美元，投后估值达到\
    \ 45 亿美元。 \n  至此，硬件、资本和开发者，都已形成共识。  \n  只有中国计算机图形最知名的学者、时任微软亚研院首席研究员——童欣，是个例外。  \n 论技术身位，那时的他已经在微软亚洲研究院工作了\
    \ 17 年，负责网络图形组也有六年。论研究方向，他应该是当时最有理由相信 VR 爆发的那群人之一。 \n 那一年的 11 月 14 日，微软亚洲研究院在北京成立院友会。近 200 位来自产业和学术界的院友回到中关村微软大厦，下午一场题为「让世界充满\
    \ AI」的研讨会上，九位演讲嘉宾里，有刚刚离开微软加入旷视的孙剑，有浙江大学周昆、地平线余凯。主持人宣布研讨会开始后，第一个被请上台的人，正是童欣。 \n 但他上台之后，没有讲某项最新成果。 \n\
    \ 他说，几天前接到演讲通知，他「非常焦虑和紧张」，然后，他问了一个和整个行业情绪不太合拍的问题：互联网加文字，有了网络文学、微博和维基百科；互联网加图片，有 Instagram、美图；互联网加视频，有\
    \ YouTube、爱奇艺、直播和网红。十几年过去，几乎每一种内容都在互联网里爆炸过一次。回头再看看 Graphics，却好像什么都没发生。 \n 他拿当时流行的「风口上的猪」开玩笑： 「我这么瘦的一个人，站了这么久，怎么还没飞起来？」\
    \  \n 「这到底出了什么问题？」 \n 最后，他把原因归成两个词： Everyone 和 Everywhere 。 \n Everyone，是"
