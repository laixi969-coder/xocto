  fact: "谷歌最新旗舰模型 Gemini 4 Pro 疑似「偷跑」，多项指标领先 Astra 和 Fable 5.1 \n 9 月 18 日，Google 下一代旗舰模型 Gemini 4 Pro\
    \ 疑似正以「gemini-3.8-flash」名称「偷跑」上线。据反馈，谷歌在 Arena 等基准平台上测试了其最强 Gemini 4 Pro 模型，内部开发代号为 Argon。 \n   \n\
    \ 网上流传的一张测试图显示，该模型在智能体编程测试 DeepSWE v1.1 中得分超过 88%，在 Terminal-bench 2.1 和 OSWorld 2.0 中分别获得 95.3%和\
    \ 86.8%的成绩，高于 GPT-6 Astra 和 Claude Fable 5.1。不过，该图片的来源、测试条件及完整结果尚未公开，相关分数暂时无法独立验证。（来源：华尔街见闻） \n  \
    \ \n 苹果回应 iPhone Duo 维修费达 8000 元传闻：具体价格尚未公布 \n 9 月 18 日消息，针对苹果首款折叠屏手机 iPhone Duo 维修费用可能达到 8000 元的传闻，苹果官方维修人员回应称，该产品尚未开启预售，目前没有具体维修价格，苹果一般会在新机预售后于官网公布相关费用。\
    \ \n 这一传闻来自第三方维修人员的估算。此前，影视飓风 Tim 在体验 iPhone Duo 时反向弯折机身，导致外屏闪屏。杭州一家数码店负责人据此判断，如果屏幕和铰链同时损坏，整体维修费用可能达到七八千元，但该价格并非苹果官方报价。\
    \ \n iPhone Duo 起售价为 15999 元，将于 10 月 16 日 20 时开启预购，10 月 23 日正式发售。与其对应的 AppleCare+价格也尚未公布。苹果客服表示，反向弯折造成的损坏属于人为损坏，不在标准保修范围内。（来源：界面新闻）\
    \ \n   \n 研究人员借助 Claude 攻破 OpenAI 内部系统 \n 9 月 18 日，安全公司 Hacktron AI 披露，研究人员借助 Claude Opus 5，在不到 72\
    \ 小时内将一个图像处理漏洞扩展为完整攻击链，最终获得一名 OpenAI 员工的 ChatGPT、Codex 账户及内部 GitHub 访问权限。 \n 攻击入口为基于 Discourse 搭建的\
    \ OpenAI 社区论坛。研究人员利用图像处理组件 libheif 的"
