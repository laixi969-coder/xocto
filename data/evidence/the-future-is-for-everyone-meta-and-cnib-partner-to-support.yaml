  fact: 'https://about.fb.com/wp-content/uploads/2026/10/cnib_x_meta___ms4_-_rev_3_picture_lockcc_eng-2160p.mp4
    We believe the future is for everyone. That’s why Meta is partnering with CNIB – a non-profit founded
    in 1918 that empowers Canadians impacted by blindness to live their dreams – to help bring the benefit
    of AI glasses to more Canadians who are blind, Deafblind or have low vision. The goal of the partnership
    is to help people who are blind, Deafblind or have low vision explore the possibilities of AI wearable
    technology, and draw on the knowledge, expertise and lived experience of the community to shape a
    more accessible future. Funding from Meta will support CNIB in four areas: Listening to the community:
    Engaging people across Canada to understand their experiences, and how AI glasses can support greater
    independence in everyday life. Supporting community champions: Supporting Canadians who are blind,
