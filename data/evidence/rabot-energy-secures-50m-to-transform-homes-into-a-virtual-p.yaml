  fact: Rabot Energy , a provider of dynamic electricity tariffs, has raised $50 million in a Series B
    funding round to expand its technology platform and support its next phase of growth. The round was
    led by Endeit, a growth capital investor focused on European tech scale-ups, alongside the DeepTech
    & Climate Fonds (DTCF). Existing investors HV Capital, High-Tech Gründerfonds (HTGF), Bosch Ventures,
    CNI, Acurio Ventures and vent.io also participated. Rabot Energy offers dynamic electricity tariffs
    that help customers reduce energy costs by automatically shifting electricity consumption to periods
    when power is cheaper, and renewable energy is more readily available. Its technology also enables
    connected home batteries to store electricity when renewable generation is high and release it when
    supply is lower, helping balance demand and reduce reliance on fossil fuel-based generation. As transport
