  fact: Antwerp-based startup Noah , which develops an AI-powered platform to help companies identify
    and prioritise opportunities for artificial intelligence adoption, has raised €800,000 from a group
    of business angels. Investors include Rudi Deruytter, former CEO of B-Bank, entrepreneur Ben Schrauwen
    and Nicolas Debray of Belgium Startup Ecosystem. The financing is supplemented by subsidies and a
    bank loan. Founded by Denis Leysen (CEO), César Van Leuffelen (CPO) and Tom De Smedt (CTO), Noah helps
    businesses assess where AI can deliver value by analysing internal processes, identifying potential
    use cases and estimating their financial impact. While companies increasingly recognise the potential
    of AI, many struggle to identify where to begin or how to measure its benefits. According to Denis
