  fact: When you build Retrieval Augmented Generation (RAG) applications, answer quality depends on the
    data that you ingest. Amazon Bedrock Knowledge Bases is the fully managed RAG capability of Amazon
    Bedrock. With Amazon Bedrock Managed Knowledge Base , you connect your data sources, and Amazon Bedrock
    manages ingestion, storage, indexing, and retrieval for you. You don’t provision or scale a vector
    store, and embedding and reranking use service-managed models by default. For web content, start with
    the Amazon Bedrock Web Crawler data source connector for managed knowledge bases. You give it the
    seed URLs or sitemaps that you’re authorized to crawl, and it crawls within the scope and rate limits
    that you set. Scheduled syncs keep your knowledge base current as pages change, and the connector
    can wait for content that loads with JavaScript. There’s no crawler for you to build, host, or operate,
