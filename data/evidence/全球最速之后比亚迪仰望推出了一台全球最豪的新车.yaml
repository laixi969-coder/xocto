  title: 「全球最速」之后，比亚迪仰望推出了一台「全球最豪」的新车
  published_at: '2026-11-07T15:37:50Z'
  collected_at: '2026-11-08T01:27:32Z'
  source_kind: market_signal
  tier: independent
  fact: 中东，阿联酋阿布扎比酋长皇宫酒店草坪上，比亚迪正式曝光了仰望旗下一款超豪华新车「鼎曜」YANGWANG ALTIOR。 Altior源自拉丁语，意思是「更高」。这也是仰望品牌诞生以来，第一次脱离U7、U8、U9的字母数字序列，单独起了一个名字。
    仰望鼎曜 Altior 正式亮相|图片来源：极客公园 这台新车很可能有 5米 5 的车长，双拼车身和大饼轮毂、对开门，仅从外观设计上就表明，这是一款瞄准超级老钱如劳斯莱斯市场的新竞争者。 就在一天前，仰望
    U9 Extreme 刚刚凭借超过 503 公里每小时的时速，成为受到 FIA 认证的全球最速量产车。 现在，Altior 的亮相，表明中国车企，正在从技术和豪华两方面，不断挑战新的极限。 「更高」的仰望
    在介绍这款超豪华新车时，比亚迪集团执行副总裁李柯用的最多的一句话不是「豪华」，而是「皇宫」（Palace），用她的话是，「鼎曜」Altior 本身就是「一座移动皇宫」。 很显然，发布会本身在阿布扎比的酋长皇宫酒店，「鼎」这个汉字本身就就让人想到一统天下的皇权——「问鼎天下」。
    比亚迪设计总监介绍鼎曜的设计理念｜图片来源：极客公园 「鼎」字本身成为鼎曜新车的重要标志，车辆的前脸和车灯，形成了一个国人非常容易看出来的鼎字，其实仰望首台车仰望 U8 的前脸，也有类似的设计，但是鼎曜无疑将设计重点加强了。
    从整车设计来看，这台车长超过 5 米 5 的轿车，侧面横平竖直的线条搭配较短的尾部，给人一种低调内敛的感觉，和前脸的目光吸收器形成了鲜明对比。对开门设计和大饼式轮毂，再次强调车辆的豪华属性。 鼎曜的对开门设计属于豪车专属｜图片来源：极客公园
    除了鼎，一提到「皇宫」，自然是宝石、黄金等等元素。鼎曜的前脸就用了数块宝石组成豪华的格栅。如果仅仅是宝石，那只能说是土豪。 私人定制，才是真正的豪华。鼎曜用户可以自己订制饰板、座椅等内饰元素，而这些内饰的订制，由中国传统艺术的顶级匠人制作，实现真正意义只属于消费者的「独家车」。
    比亚迪执行副总裁李柯介绍「中式豪华」｜图片来源：极客公园 至于一键休憩、一键隐私等模式，则是豪车必备，鼎曜也一应俱全。 从车身外形到订制内饰，比亚迪鼎曜希望用技术和艺术，来向海外消费者说明，什么是真正的「中国式豪华」。
    先说艺术，再说技术。 在仰望 U8 等车上使用的易四方技术，同样搭载在鼎曜轿车上，后者车顶的激光
