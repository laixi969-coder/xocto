  title: 单人一月烧掉 19 万，硅谷开始倒查员工 AI 账单
  published_at: '2026-09-08T07:27:11Z'
  collected_at: '2026-09-08T14:34:47Z'
  source_kind: market_signal
  tier: independent
  fact: "「有人星夜赶科场，有人辞官归故里。」 \n \n  作者｜张勇毅  \n  编辑｜靖宇  \n \n 过去很长一段时间里，微软员工之间流传着一张自发维护的表格，用来互相交换薪资和奖金数字，大公司里常见的那种「工资透明化」地下工程。\
    \ \n 今年，这张后来被 Business Insider 拿到的表格上，多出了一列新数字：「每月 AI 花费」。 \n \n 各部门员工自报 AI 用量，28 天口径｜图片来源：Business\
    \ Insider \n 约 350 名美国员工填了这一列。最高的那一格写着：28 天，2.8 万美元（约合 19 万元人民币）。 \n 微软的反应不是给这位同学发先进。据 Android Headlines\
    \ 报道，公司已经开始收紧 token 用量管理：部门级预算生效，个人 token 支出进了仪表盘，内部默认模型切到了 OpenAI 的 GPT-5.6 Sol。 \n 翻译一下就是，微软开始内部查账了。\
    \ \n \n \n \n \n \n   01   \n \n \n \n  \n \n \n \n    token 用量分出阶级    \n \n 这张表格最大的信息量不在数字，在位置——「AI\
    \ 花费」这一列，出现在晒工资的表格里。 \n 员工把 AI 用量填在薪资旁边，意思再明白不过，在 2026 年的微软，你每月烧掉多少 token，和你赚多少钱一样，是一个值得被看见的数字。 \n\
    \ 这些数字也不是拍脑袋估的。报道里有个容易被忽略的细节：微软给员工发了一个内部工具，能查到自己过去 28 天用掉的 AI 金额。 目前微软全公司自愿填报的中位数，是每月 300 美元，约 2,000\
    \ 元 。 \n 说实话，这个价格其实并不算让人惊讶，毕竟一个硅谷软件工程师的综合人力成本每月两三万美元起步，300 美元的 AI 账单，是九牛一毛。 \n 但账单真正贵的地方在后面。BI 整理的分部门表格里，\
    \ 微软的核心 AI 工程部门 CoreAI 中位数干到 975 美元（约 6,577 元），是全公司的三倍多 ；Microsoft AI 部门约 490 美元，Experiences and Devices\
    \ 约 250 美元，Azure 约 241 美元。好几个部门的个人最高值都破了 1 万美元，CoreAI 有人烧到 1.6 万。而 28 天 2.8 万美元那位纪录保持者，来自客户与合作伙伴解决方案部门。\
    \ \n 虽然 350"
