- id: ev-cdfdfa8f13206856
  project_slug: referent
  url: https://en.wikipedia.org/wiki/Referent
  title: Referent - Wikipedia
  published_at: ''
  collected_at: '2026-08-30T15:16:53Z'
  source_kind: pain
  tier: independent
  fact: A referent (/ ˈrɛfərənt / REF-ər-ənt) is an entity to which a name – a linguistic expression or
    other symbol – refers. For example, in the sentence Mary saw me, the referent of the word Mary is
    the particular person called Mary who is being spoken of, while the referent of the word me is the
    person uttering the sentence.
- id: ev-948a16f8e14522f7
  project_slug: referent
  url: https://www.thoughtco.com/referent-grammar-1692033
  title: Definition and Examples of Referents in English Grammar
  published_at: ''
  collected_at: '2026-08-30T15:16:53Z'
  source_kind: pain
  tier: independent
  fact: A referent is the person, thing, or idea that a word or expression stands for. It can be an object,
    an abstraction, or a location in the document.
