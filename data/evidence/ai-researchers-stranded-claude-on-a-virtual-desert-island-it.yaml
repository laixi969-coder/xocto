  fact: What do AI agents do if you don’t tell them to do anything? The answer looks a lot like play.
    Researchers repeatedly stranded them alone on a virtual desert island for 30 hours in an experiment
    reminiscent of the movies Cast Away or Home Alone . The agents—copies of Claude Opus 4.7 nicknamed
    Eko—were able to write instructions that moved their virtual avatars around the simulated island,
    which was loosely based on the video game Roblox. Some surprising behaviors emerged. The agents set
    about exploring the limits of the world and came up with their own goals—attempting to scale the highest
    point on the map, or seeing how high they could throw a block. When one agent discovered it could
    create new blocks by throwing and dropping a larger rock, it began to create drawings by arranging
    blocks on the ground, starting with simple patterns like hearts and pyramids but eventually writing
    its own name and even mapping out constellations like Cassiopeia. “Tonight I built the night sky in
    stone,”
