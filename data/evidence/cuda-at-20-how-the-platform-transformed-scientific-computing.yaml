  fact: This week at SC26, NVIDIA is marking two decades of CUDA by honoring the researchers, developers
    and engineers who helped make GPU computing a foundation for modern science and AI. CUDA’s 20th anniversary
    presents an occasion to reflect across computing eras, from the people who wrote the very first CUDA
    programs to the AI developers building on their work today. At the platform’s core is this developer
    community whose experiments, tools and persistence expanded what accelerated computing could do. From
    SC06 to SC26 NVIDIA announced CUDA in November 2006 and brought it to the scientific community at
    SC06, giving scientists and developers a familiar, high-level programming model for using GPUs. It
    fundamentally extended accelerated computing beyond graphics use cases to accelerate demanding applications
    for science, simulation and more. In the two decades since, developers have used CUDA to advance Nobel
