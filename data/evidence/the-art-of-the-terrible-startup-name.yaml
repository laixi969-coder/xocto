  fact: 'When thinking of startup names, the usual question is how one identifies a great one . But perhaps
    equally crucial is the reverse consideration: What makes for a truly awful startup name? It’s a somewhat
    subjective exercise. Nonetheless, branding experts and occasional writers on the subject can agree
    on a few basic parameters. These include hard-sounding names, brands with negative connotations, and
    a certain ubiquitous suffix that could soon sound irrelevant. Below, we look at each of these categories
    in more detail No. 1: Harsh-sounding names One branding principle is that startups should avoid names
    that are unpleasant to pronounce. This includes words that sound too harsh or guttural, or are awkward
    in the native languages of potential users. Unfortunately, it’s a principle often ignored. For Athol
