  fact: "作者｜宇航猿  \n  编辑｜靖宇  \n \n 一个男人对着镜头拧魔方，屏幕里的女孩盯着他手上的动作，时不时点头，提醒他下一步该转哪一面。他卡住了，低头琢磨，她没有插话，只是安静地等着。等他重新动手，她才接上一句。\
    \ \n 如果没人告诉你，这看起来就是一次再普通不过的视频通话。 \n 但屏幕里那个女孩并不存在。 她的脸、她的声音、她的每一次点头和停顿，全部由 AI 实时生成 。 \n    \n  Griffin\
    \ 模型的演示效果确实非常惊艳｜视频来源：X  \n 10 月 1 日， 美国 AI 视频公司 Tavus 发布了一个名为 Griffin 的模型 ，并把它定义为全球第一个「人类交互模型」（Human\
    \ Interaction Model，简称 HIM）。 \n Tavus 公布的数据显示，在一项一分钟视频通话测试里， 54 名参与者中有 26 人事后认为自己是在和真人聊天，比例接近 48%\
    \ 。作为对照，Tavus 上一代系统在同样的测试中，41 个人里只骗过了 1 个，比例 2.4%。 \n 从 2.4% 到 48%，这不是一次常规的版本迭代。 \n  过去几年，数字人赛道拼的是「脸像不像」；Griffin\
    \ 想证明的，是 AI 已经开始学会「像人一样聊天」。  \n   01   \n  不「出戏」的 AI  \n Tavus 给 Griffin 准备的发布视频，本身就是一次 AI 视频通话。 \n\
    \ 画面里，Tavus 联合创始人兼 CEO Hassaan Raza 深夜坐在办公室，打开笔记本电脑，屏幕那头是一个戴眼镜的年轻女孩，名叫 Vanessa。她先开口，说这么晚了你还没走。两人聊起一件正事，新模型要怎么向外界介绍。\
    \ \n Hassaan 有点犹豫，说解释来解释去都不如直接给大家看。Vanessa 接过话头，提议干脆就放一段他俩聊天的录像，「他们甚至都不用去想这件事」。 \n 于是你看到的这段视频，就是那段录像。\
    \ \n   \n  Vanessa 展示举起大拇指｜图片来源：X  \n 接下来的一分多钟里，两个人像老同事一样互相打趣。Hassaan 让她比个大拇指，她立刻照做；他夸她是自己最喜欢的同事，她笑着说你让我脸红了；他炫耀身上那件二手淘来的衣服，她吐槽他「活在边缘」，顺便开了个玩笑，说自己会保持呼吸平稳，免得把他电脑的\
    \ CPU 耗得更快。 \n     \n  Vanessa「看到」另一位工"
