  fact: "很多轮子大家都是看到过 现在手搓直接开源 让大家也可以用自己的轮子\r\n\r\n\r\n\r\n* \U0001F310 **在线体验**：[https://ip.huzhihui.com](\
    \ https://ip.huzhihui.com)\r\n* \U0001F4E6 **开源仓库**：[https://github.com/zhihui-hu/one-ip]( https://github.com/zhihui-hu/one-ip)（如果觉得顺手，求个\
    \ Star ⭐️）\r\n\r\n---\r\n目前主要能做这些事：\r\n- 看出口和分流：分别探测国内、外部 IPv4 ，再看不同网站实际使用哪个出口。\r\n- 查 IP 信息：归属地、运营商、ASN\
    \ 、企业类型、住宅/机房标记、信誉分，以及更详细的网络信息。\r\n- 排查连通性：网站 HTTP 响应耗时、全球 Ping 、DNS 出口、CDN 节点。\r\n- 检查浏览器：指纹、环境一致性、自动化特征、WebRTC\
    \ 和权限信息。\r\n- 看 AI 平台访问情况：接入了 ChatGPT 、Claude 、Gemini 、DeepSeek 等八个平台的访问探测。\r\n- 查看服务状态：集中查看 Cloudflare\
    \ 、GitHub 、OpenAI 、Claude 、Vercel 等服务的官方故障和维护信息。\r\n\r\n\r\n![image]( https://cdn.nodeimage.com/i/kUXy4wmbSYwWXuselU1x4DYScYG4HMEQ.png)\r\
