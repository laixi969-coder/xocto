  fact: "前情提要与当下战绩\r\n书接上回，我在硬刚老板被裁员后，继续迭代馆长，并开始进入自媒体，接近 20 来天吧，战果如下\r\n1.抖音，小红书，b 站粉丝合计 1200 左右（从零开始）\r\
    \n2.馆长后台埋点显示，最新版本和上一个最新版本，下载安装接近 200（下，不是 w）左右，实际日常我看每天都在用的，大概有五六个吧\r\n3.馆长上线了 2.0 大版本，优化了很多细节，上线了充值功能，顺手优化了编写代码的能力（因为我的\
    \ gpt 烧干了，做这个叼充值 从服务器部署到所有功能，一周额度加两张重置卡，只能让馆长来修 bug 和优化了，最新版本的主题色，和我最新的后台数据统计就是他自己写的哦，这证明了在前后端编程能力都还行\r\
    \n\r\n馆长简单介绍\r\n可能还你不知道馆长是啥，我大概简单介绍下，类似于 codex,workbuddy 一类的软件（已开源），可以说是一样的，但是我在办公体系下（docx,ppt,excel）做了特殊优化，比如本地知识库，wps\
    \ 联动等等，办公场景下用起来会更舒服些，且 hareness 设计是对标第一梯队 dsh，pi 之类的，所以相同模型下 差异不会有多大\r\n再加上我迭代了接近一年了 这就是匠心精神 馆长 值得信赖\r\
    \n\r\n市场分析\r\n目前 workbuddy 日活 1000 万麻，我这日活大概就算个 10 好了，em 我竟然已经抢了它十个用户，非常棒，当我能抢到 1000 个用户时，它就得自觉有点\"\
    危机感了\"\r\n\r\n商业模式\r\n首先，有人愿意日常用，就证明了产品和市场是可行的，剩下的就是如果让更多人知道（营销）\r\n我的商业模式很简单，不做积分，不做会员制，就做简单的充值，让用户即充即用，再加上一人公司，低成本（没钱了咱就是说可以去送外卖养它）\r\
    \n缺点就是毛利很低 我算了下 只能拿到 20%左右的毛利，优点就是耐艹，耐活，哈哈\r\n其实核心就是一点，匠心精神，慢慢打磨到极致，不过这种商业模式不适合招人，搞办公室，可能只是个小生意或者副业，因为一旦拓展了，利润感觉不一定撑得住\r\
    \n\r\n营销探讨\r\n这也是大部分程序员所欠缺的，如果一直投流，烧补贴，像我这种一人公司形式，是撑不住的，别个 workbuddy 直接能烧到你哭，再加上用户一定是会来来走走的，所以营销推广是一个需要持续进行的事，所以关键点就是低成本推流，那我能想到的就是自媒体，好在自媒体也算是有点涨进吧\
    \ 没让"
