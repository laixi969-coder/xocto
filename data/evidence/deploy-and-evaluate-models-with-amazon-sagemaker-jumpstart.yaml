  fact: Choosing the right model for a specific application requires a practical way to test it with representative
    inputs. Amazon SageMaker JumpStart provides access to a broad catalog of already pretrained models.
    In this post, we show how to deploy an available model from SageMaker JumpStart, run a lightweight
    and repeatable performance test using the SageMaker Python SDK, and delete the endpoint when testing
    is complete. For supported models and available capacity, this workflow provides a repeatable evaluation
    path, although deployment time varies by model, instance type, quota, and AWS Region. In 2026, SageMaker
    JumpStart introduced two improvements that simplify model discovery and deployment. In the Model Hub
    section of the Amazon SageMaker AI console, you can browse the SageMaker JumpStart catalog, view sample
    notebooks, and open them directly in SageMaker Studio. Pre-configured endpoint deployment options
