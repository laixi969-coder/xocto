  title: 从单卡到千卡互联，平头哥真武 V900 背后的 AI 算力变局
  published_at: '2026-09-23T05:55:58Z'
  collected_at: '2026-09-24T00:31:16Z'
  source_kind: market_signal
  tier: independent
  fact: "作者｜Cynthia  \n  编辑｜郑玄  \n 9 月 22 日的 2026 杭州云栖大会，平头哥少见地被完整推到了主论坛台前。 \n 当天上午，吴泳铭完成主旨演讲后，千问大模型、多模态模型负责人依次登场，随后就是平头哥副总裁高慧。她的演讲题目是「Agentic\
    \ 时代卓越算力基石」。 \n 平头哥带来的产品，则从一颗最新得真武 V900 芯片，一直延伸到 ICN Switch 互联芯片、磐脉智能网卡、镇岳 SSD 主控、倚天 CPU 路线图，以及下一步的算、存、网全栈协同的超节点服务器。\
    \ \n   \n 发布「产品全家桶」地背后，是 Agentic 时代的负载变化：算力需求已经从训练为主进一步走向推理增长，应用从单轮请求变成连续的多步任务，  硬件的竞争也从一颗芯片的指标扩展到整个计算系统的协同。\
    \  \n  01  \n  真武V900，平头哥最新一代AI训推芯片  \n  这次发布里，平头哥新一代训推一体 AI 芯片真武 V900 仍然是分量最重的产品。  \n   \n 这颗芯片搭载\
    \ 216GB 显存，片间互联带宽达到 1200GB/s，单芯片性能是上一代真武 M890 的 3 倍，  是目前中国算力性能最强的 AI 芯片。精度上，  该芯片原生支持 FP8 和 FP4，可覆盖高精度训练以及低精度、超低精度推理。\
    \ \n 按照平头哥公布的计划，V900 将在 2027 年第一季度进入量产销售。此后，2028 年 Q3，真武 J900 也将正式推出。 \n 而此时，离上一代真武发布，其实只过去了几个月。2026\
    \ 年 5 月，平头哥 M890 首次亮相。这颗芯片拥有 144GB 显存和 800GB/s 片间互联带宽，性能达到上一代 810E 的 3 倍，并支持从 FP32 到 FP4 的多种数据精度。到了\
    \ V900，性能再次提升 3 倍，显存从 144GB 增加到 216GB，互联带宽也从 800GB/s 提高到 1200GB/s。 \n 再向前看一代，2024 年的真武 810E 也已经从早期的单一推理芯片走向训推一体，采用自研并行计算架构和互联技术，并配套\
    \ SAIL 软件栈。 \n  810E、M890、V900 连续三代产品里，平头哥一直在同时提高训练、推理、显存和低精度计算等核心能力。  \n   \n 而背后的关键词，则始终围绕  AI 时代工作负载的变化。\
    \  \n 举个简单的例子，模型进"
