  fact: 'In Part 1 , you built a task agent on Amazon Bedrock AgentCore , a platform to build, connect,
    and optimize agents at scale, with any framework or model. The agent runs on Amazon Bedrock AgentCore
    runtime, a capability of Amazon Bedrock AgentCore, and acts for signed-in users through Okta Cross
    App Access (XAA). Okta decided which agent might act for which user, and Amazon Bedrock AgentCore
    Identity, a capability of Amazon Bedrock AgentCore, redeemed Okta’s grant inside the agent. That proves
    the governance mechanism, and it runs on a deliberately small topology: one agent, two Model Context
    Protocol (MCP) servers, and the authorization check written into each server. The mechanism scales.
