  fact: 'Autentic AI has raised €1.5 million in pre-seed funding from venture capital firms Baobab Ventures,
    Lanai Ventures, Acurio Ventures and Masia VC. Founded by Dani Diestre , Aniol Carreras and Jacob Bamio
    , Autentic AI has developed a platform that uses artificial intelligence to conduct interviews with
    hundreds of consumers and experts simultaneously, reducing the time required for market research from
    weeks or months to days. The company combines AI-led interviews and data analysis with human researchers
    who interpret the findings and provide context. The platform aims to address the time and cost associated
    with traditional market research, which can limit how frequently companies gather customer feedback.
