  fact: Amazon Connect Talent is an AI hiring solution built for talent acquisition leaders managing scaled
    hiring. It delivers AI-led interviews, data-driven assessments, and consistent evaluation, helping
    recruiters identify strong candidates more efficiently while providing applicants with a flexible
    interview experience. Informed by decades of Amazon's hiring science, Amazon Connect Talent provides
    transparency for every assessment, interview, and candidate score, enabling recruiters to stay in
    control of final hiring decisions.
