  fact: 'I remember hearing a while ago that Dwarf Fortress didn''t use version control. That fact has
    been lodged in my head, because given its inherent complexity I have trouble imagining a codebase
    that would benefit from version control more . That''s art. I went looking and I''m sad to report
    that the days without version control appear to have ended. Quoting Tarn Adams over time: March 2013:
    "I don''t use version control -- I didn''t like the feeling of having the code get committed into
    a black box thingy with no immediate upside" March 2016: "I don’t even use version control. If you
    don’t know what that is then you’re not gonna yell at me. If you even know what version control is
    you’re gonna be like, ‘You don’t use version control? You don’t use source control? What is wrong
