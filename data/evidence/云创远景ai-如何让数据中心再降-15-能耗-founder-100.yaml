  fact: 本文首发于 Founder Park 公众号 · 2023 年 1 月 3 日   科技公司们为了给数据中心节能和散热，想尽了各种办法：将数据中心放在海底、北极；选择水冷、液冷的散热方式，而在当下全球都在朝着「碳中和」的背景下，如何降低耗能提高效率，减少碳排放，更是成为了一个要解决的焦点问题。      AI
    能不能帮上忙？谷歌在 2016 年开发了一款降低数据中心能耗的 AI，国内的创业公司云创远景，也选择了类似的思路：利用 AI 和边缘计算技术，来优化数据中心、大型超市和写字楼的能耗。    在双碳政策（碳中和、碳达峰）之前，由于
    AI「过程的可解释性很低」，不少客户对于最终结果有很多疑问。而在双碳政策后，尤其是拿下了英特尔的订单后，云创远景突然多了不少的商业客户。    为什么优先切入数据中心，云创远景创始人&CEO 沈骁是这么说的，「
    液冷或者自然冷源等更多地侧重于怎么用一度电产生更多能量，我们更多地在消费侧让它变得更有效率 」，在原有的节能基础上， 云创远景的方案可以再降低 15% 到 20%。并且，他们不是取代原有的能耗方案，而是能与之配合，持续优化，并且，占用更少的人力投入。     碳中和政策是如何影响能耗管理行业的？这个领域的技术壁垒是什么？除了数据中心，还有哪些行业可以切入？针对这些问题，我们和沈骁聊了聊，本次采访还邀请到了云创远景的投资方——变量资本管理合伙人吴江。                         节能减排是国家对绿色能源的进一步推进以及对电驱动的产业扶持，碳中和在实际生产中更多体现在为了实现国家状态政策目标倒逼生产过程实现技术改造。    海内外的各种现实因素加速双碳政策由政策驱动变成市场或经济驱动的过程。    对于客户来说，一方面是降低了数据中心改善能耗对于人力的要求，另外就是提供了一个相对来说部署比较便捷的方式，更轻量化。    AI
    计算进行能耗管理的门槛体现在怎么用尽可能少的数据训练出比较准的模型，而不是传统的大模型数据学习。                    01           双碳政策提升了         能耗管理行业的商业需求       Founder
