  fact: 'How many times this week did you re-explain the same task to an agent? How many times did you
    ask your colleague with deep institutional knowledge how to solve a specific problem? That context
    shouldn’t be lost in a chat or locked in one person’s head. Agent skills let you capture repeatable
    instructions so you and your agents can reuse them. The skill you write for yourself tonight can later
    become part of a team’s pipeline. An agent skill is a versioned directory centered on a SKILL.md file
    that describes when and how to do a repeatable task. You can share those instructions across agents,
    but the environment still needs to provide the tools, credentials, and permissions to carry them out.
    A skill can describe how to query a database, for example, but it doesn’t grant access to that database.
    I covered this topic live with Shishir Tewari, Senior Manager, Data Engineering at Procore, during
