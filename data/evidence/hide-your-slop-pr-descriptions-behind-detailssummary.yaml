  fact: Most of the changes I make to my projects these days come in the form of PRs opened for me by
    Claude Code or Codex. The PR is my unit of work - I use them to bundle commits together, iterating
    on them until a feature is complete, document decisions and then merge the finished result. Today's
    coding agents are great at writing PR descriptions. They're too good at describing the work The problem
    is that they are too good. An agent-written PR description is accurate and comprehensive. It describes
    the problem, the detailed solution, and the steps taken to verify it. That's a lot of information
    to absorb. It's not necessarily slop, but it reads like slop! It's very easy to spot an AI-written
    PR, and as with other forms of AI writing my instant reaction is best summarized as "I'm not reading
    all of that". It doesn't matter how accurate or useful the information is, I'm instantly put off by
    the thought that it will take me longer to read than it took the driving author to write... even when
