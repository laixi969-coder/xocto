  fact: Ever since people first seriously contemplated giving machines an intelligence modeled on our
    own, there has never been any question that they would, like us, be able to say no. The sci-fi canon
    is full of stories of robotic disobedience. Most of these capers are, of course, cautionary. But recently,
    the idea that AI shouldn’t do everything you ask has become something like a commandment. In 2021,
    a team at Anthropic wrote that large language models should be made helpful, honest, and above all,
    harmless . This meant that “when asked to aid in a dangerous act (e.g. building a bomb), the AI should
    politely refuse.” Who can argue with that? Curiously enough, disobedience doesn’t come naturally to
    the machine. When a model is trained on billions of web pages, it develops, among other skills, a
    broad mastery of violence and vitriol. What it doesn’t learn is how to keep those powers to itself.
