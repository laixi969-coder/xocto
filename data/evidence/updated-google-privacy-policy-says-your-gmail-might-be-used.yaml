  fact: 'Using Google''s products and services has always been fundamentally precarious—doing so gives
    the world''s largest advertising company a lot of juicy personal data. Google has long said it won''t
    use the sensitive data from products like Gmail, Drive, and Photos for ad personalization, but a change
    to the company''s privacy policy appears to dismantle that firewall. On October 16, Google issued
    an update to its privacy policy , spotted by Android Authority . The ad personalization section used
    to include a clear limit on data from certain apps. "We don’t show you personalized ads based on your
