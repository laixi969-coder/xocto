  fact: 'By Kenza Zayani In October, reports that OpenAI ‘s annualized revenue was running well below
    earlier estimates sent AI-linked stocks sharply lower and prompted a fresh round of scrutiny over
    AI valuations. It also reopened a question investors have been circling for a while: Is ARR still
    the right way to describe an AI business? The limitations have been understood for some time. ARR
    was built for software companies selling predictable annual contracts, which is only part of how most
    AI companies make money. Through the early part of the generative AI boom, growth was steep enough
    that few people pressed the point. The OpenAI episode has made it harder to leave alone, partly because
    it showed how much weight public markets now place on a single private company’s numbers. For founders,
    this is worth paying attention to now rather than later. A cohort of AI companies is reaching the
    growth-capital stage, and the questions they face in diligence are changing. What ARR was built for
    Kenza'
