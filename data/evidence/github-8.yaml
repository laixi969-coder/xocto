  title: 战战兢兢，非程序员的第一个开源项目，以国标为基础的公文生成与机检工具
  published_at: '2026-10-13T18:29:32Z'
  collected_at: '2026-10-14T01:13:53Z'
  source_kind: product
  tier: independent
  fact: "我不是程序员，但是从小就对计算机、信息技术、互联网十分感兴趣。初中时期，在只有 ADSL 网络的网吧熬几个通宵，用 Dreamweaver 和 FrontPage 做了人生第一个个人网站，那真是回忆满满。到现在四十多岁，还保持着对这些技术方面的兴趣和热爱。尤其最近几年\
    \ AI 大行其道，突然发现可玩儿的东西真的太多了，也就跟着折腾了很多玩意儿。\r\n\r\n我在上市公司、国企干了 20 年。现在跟政府、央国企打交道多，天天要读写材料。然后从满足自己的实际需求出发，用\
    \ Claude 整了一些相关的工具。就把公文单独拿出来做成了一个小项目：**公文生成与机检工具 gongwen-kit**。代码主要是跟 Claude Opus 5.5 一起写的，测试和真实文件回放是我一遍遍盯着做的。第一次开源，心里没底，希望能帮到经常读写材料的朋友，也恳请各位大佬指点。\r\
    \n\r\n地址： https://github.com/imhuhe/gongwen-kit 主要功能：按国标出公文、查公文、修公文。\r\n\r\nPS：上面的文字都是我手打的，我不喜欢大片大片的复制\
    \ AI 文本。但是下面的内容都是 Claude 写的，主要是内容太多，需要排版方便大家浏览，还请谅解！\r\n![要素全览样张]( https://raw.githubusercontent.com/imhuhe/gongwen-kit/main/assets/full.png)\r\
    \n\r\n\r\n## 能做什么\r\n\r\n- **出稿**：通知、报告、请示、函、纪要、管理办法，红头和不带红头的政府、企业文书都能出\r\n- **机检**：每份稿子出完自动查三道，哪一道不过不算出稿\r\
    \n  - 体例：版心、层次序数、日期和发文字号写法、全半角\r\n  - 数字：表格合计与分项、跨表同一个指标、正文说「以下三点」后面是不是真列了三点\r\n  - 文风：异形词、中文里混进来的半角标点；套话和空词只提示\r\
    \n- **修稿**：手上已经写好的 .docx 交给它修\r\n  - 版式直接改：版心、字体字号、页码\r\n  - 体例写成 Word 修订痕迹，在「审阅」里逐条接受或拒绝\r\n  - 数字一个不改，只插批注，指出哪里对不上\r\
    \n\r\n## 相对突出的几点功能\r\n\r\n- **数字前后对得上**：合计和分项、同一个指标在不同地方的取值、说了几点列了几点，这些人读稿时最容易漏\r\n- *"
