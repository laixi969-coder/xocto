  title: Token 之后，谁来组织 AI 计算？Arm 寻找下一代计算的答案
  published_at: '2026-09-16T08:34:03Z'
  collected_at: '2026-09-17T00:33:01Z'
  source_kind: market_signal
  tier: independent
  fact: "如果说今年 3 月，Arm 推出首款自研 CPU 芯片，是这家公司向市场释放的一个信号，它开始尝试突破过去「只提供底层架构授权」的角色边界。那么在上海举办的 Arm Everywhere\
    \ China 活动上，Arm 想传递的信息更加明确，不要再用过去「CPU IP 供应商」的方式理解今天的 Arm。 \n 在这场活动中，Arm 没有只围绕某一个产品展开叙事，而是第一次更加完整地将自己的未来方向拆成三条线，云\
    \ AI、边缘 AI 和物理 AI。 \n 和往年不太一样，去年 Arm 的主题演讲几乎全部围绕一件事展开 SME2，也就是让 AI 在 CPU 上跑起来。那是一个典型的「架构升级」叙事。但今年的主题演讲，三位业务负责人分别讲边缘\
    \ AI、物理 AI 和云 AI，围绕场景展开， 算力会在云、端侧和物理世界之间流动，而 Arm 想成为这个「计算基建」的底座。  \n 今年的 Arm 试图回答的是另一个问题，当 AI 正在重新改变计算方式时，下一代计算平台应该如何被设计？\
    \ 当 AI 计算正在从单一芯片性能竞争，转向多个计算单元协同竞争时，谁能够组织这些计算资源？ 我们惊讶地与多位 Arm 高管的交流中发现，当下的算力平台似乎不再追求为某一种确定的未来而设计，而是选择拥抱某种不确定性。\
    \ \n 一、AI 时代，芯片 IP 已无法决定一切 \n 过去几十年，Arm 最成功的商业模式是通过 CPU 架构和 IP 授权连接整个半导体产业。芯片厂商基于 Arm 架构设计 SoC，终端厂商基于这些芯片打造产品，而\
    \ Arm 通过开放授权模式成为移动计算时代的重要基础设施。到今天，基于 Arm 技术的芯片累计出货已经超过 3500 亿颗。 \n 过去，芯片竞争更多围绕单一指标展开，需要更强的 CPU、更大的\
    \ GPU、更先进的制程。但进入 AI 时代后，一次完整的 AI 任务已经不再只是某一个计算单元完成，AI 任务也从单次计算逐渐走向连续推理、多模态交互以及智能体式的任务执行。这意味着， 未来计算竞争的关键不只是拥有多少算力，而是如何让不同计算资源更加高效地协同。\
    \  \n 这次活动的主题演讲， Arm 重点讲述了在不同任务场景里的算力需求变化。 \n 在边缘 AI 领域，算力从「被动响应」到「持续运行」。两年前的 AI 是你问一句、它答一句，任务结束；今天的智能体则要理解上下文、检索本机数据、调用应用、在"
