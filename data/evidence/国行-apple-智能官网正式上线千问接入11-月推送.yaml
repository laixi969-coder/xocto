  fact: 头图图片来源：Apple 10 月 31 日，苹果中国官网的 Newsroom 发布新闻稿《Apple 智能即将登陆中国》，给了一张具体的时间表：11 月 4 日起，首批 Apple 智能功能随最新的
    iOS 开发者 Beta 版开放测试；12 月 iOS 27.3 正式发布时，面向中国用户推出。 苹果中国官网的 Apple 智能页面也改了口。9 月 iPhone 18 和 iPhone Duo
    发布时，国行产品页上 Apple 智能后面跟着的是一句「推出时间依监管部门审批情况而定」，到这周新款 MacBook Pro 发布，国行页面还是这句话。现在页面顶部写的是：「Apple 智能的首批核心功能将于今年稍晚推出。」
    从 2024 年 6 月在 WWDC 上亮相算起，国行 iPhone 等了整整两年半。 今年 3 月 31 日凌晨，有国行 iPhone 用户发现设置里的「Siri」变成了「Apple 智能与 Siri」，据当时的报道，两个小时左右又被撤了回去，苹果的解释是软件问题。
    7 月 15 日，网信办公告 7 款手机端侧生成式 AI 服务完成备案，苹果技术开发（上海）有限公司的「Apple 智能」在列。9 月 29 日，iPhone Duo、iPhone 18 Pro
    等多款国行 iPhone 完成进网许可换证，许可文件里新增了三个大模型备案编号，分别对应 Apple 智能、阿里的通义万相和通义千问。 10 月 15 日，已经卸任 CEO、现任苹果执行董事长的库克在上海接受澎湃新闻采访时确认：「我们非常高兴已获批为中国用户带来首批
    Apple 智能的核心功能，包括实时翻译、照片 app 中的消除工具以及写作工具等。」他还说，期待在「本月晚些时候即将推出的测试版」里把这些功能交给用户。 但实际的测试版终究还是晚了几天，落在 11
    月 4 日，而且是开发者 Beta 版。普通用户要用上，得等 12 月的正式版。 首批功能 12 月随 iOS 27.3 推送｜图片来源：Apple 首批上线功能 按苹果新闻稿和官网的介绍，沟通这一块的重头是实时翻译：其中包括信息
    app 里的文字自动翻译，FaceTime 通话显示翻译字幕，电话 app 里直接做语音翻译，不过电话和 FaceTime 只支持一对一通话。戴着 AirPods 4（主动降噪款）、AirPods
