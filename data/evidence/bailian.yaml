  title: 我在 2 核 2G 云主机上跑 OpenViking：一次关于云主机、模型选型与长期成本的真实复盘
  published_at: '2026-10-31T16:52:23Z'
  collected_at: '2026-11-01T01:10:23Z'
  source_kind: product
  tier: independent
  fact: "最近把自己的 AI Coding Agent 记忆底座迁移到了自建的 OpenViking 上（ OpenViking 真的满足我所有的要求：即是各种 Agent 的统一大脑自进化、又是知识库，检索的时候是两方面综合起来的）。RAG\
    \ 相关的东西看着挺吓人，动辄推荐高配服务器和本地显存，实际上用下来，只要选型想清楚，一台几十块钱的入门级云服务器完全能跑得飞起。\r\n\r\n这篇不是教你怎么敲命令的安装教程，只是聊聊折腾这一圈下来，在云主机、模型组合、算力开销上的一些真实心得和踩坑取舍。\r\
    \n\r\n---\r\n\r\n## 1. 云主机：为什么我选 99 元的 2G ，不选友商更便宜的 4G ？\r\n\r\n买云服务器时，第一眼很容易被一些友商“几十块钱买 4G 甚至 8G”的新客促销吸引。但我最终还是选了阿里云\
    \ 99 元/年的 2 核 2G （ ecs.e-c1m1.large ）。\r\n\r\n核心原因就一个：**算长期的续费账，避开“首年低价、次年暴涨”的套路。**\r\n\r\n如果只是搭个无状态的个人博客，一年一换、到处搬家无所谓。但\
    \ OpenViking 是你的**记忆数据库**，里面存的是日常所有的会话轨迹、沉淀的项目架构、实体图谱和向量索引，是强状态资产。很多友商首年 60 块，第二年续费直接跳到 600 、800 甚至上千，一年后为了省钱被迫停机、跨云拷贝几千兆数据、重新配安全组和域名解析，折腾成本远超那点差价。\r\
    \n\r\n阿里云这款活动最大的诚意，是保证**来年依然可以 99 元无套路同价续费**。\r\n\r\n2G 内存虽然紧凑，但只要做好 Swap 兜底，限制好容器内存，并把计算全都甩给外部 API\
    \ ，机器本地只做存储检索，日常内存占用常态也就几百兆。拿稍微调优一下系统为代价，换一个每年只要 99 块、不用频繁搬家的稳定记忆底盘，这笔账怎么算都更划算。\r\n\r\n---\r\n\r\n\
    ## 2. 向量模型（ Embedding ）：花钱的大头，必须一步到位\r\n\r\n整套系统跑起来，持续花钱的大头其实就是向量模型。但我从一开始就放弃了“白嫖免费模型”的想法，坚定选择花钱买商业服务，并且要“一步到位”。\r\
    \n\r\n### 为什么必须一步到位？\r\nVLM 、意图分析、重排模型这些都是即时推理，今天觉得不好用，改一行配置重启一下直接就换了。但**向量模型决定了数据库底层的空间几何特征**。一旦以后你想换向量模型，哪怕"
