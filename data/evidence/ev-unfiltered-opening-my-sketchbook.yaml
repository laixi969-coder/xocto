  fact: 'Most of my ideas turn into sketches, research notes or brief videos for the team. Some of them
    finally make it into or . But most — because of the time it takes to polish them — simply remain internal
    as tools to push our thinking forward. We’ve been wondering just how valuable it would be for readers
    to peek at the artist’s sketchbook, even in its raw, unfiltered form. The advantage is that you’d
    get to see things I think are important but, for whatever reason, we don’t finish or publish. Maybe
    they go out late, much, much later, or they don’t survive the cut. These sketches are more raw than
    anything we’d normally publish. For example, it’s interim research I’m doing as I think through a
    thesis. I’ve judged it good enough for my thinking but not yet ready for your reading. But perhaps
    I’m wrong. Examples from the past week include: An analysis of liquidity pauses over the past ten
    years that have hit the tech sector How to classify high-quality research processes from degenerate
    ones'
