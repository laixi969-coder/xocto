  project_slug: 在飞书的上下文底座上豆包开工了
  url: http://www.geekpark.net/news/370460
  title: 在飞书的上下文底座上，豆包开工了
  published_at: '2026-09-16T09:36:24Z'
  collected_at: '2026-09-17T00:33:01Z'
  source_kind: market_signal
  tier: independent
  fact: "今年，不少公司的工作群里，将会多一些「新同事」。 \n 它们是 AI，但可以像普通员工一样被拉进群聊，阅读此前的讨论和文档，参与会议、承接任务，并调用不同的业务工具完成工作。你甚至可以看到\
    \ Agent 在群里 @ 另一个 Agent，共同推进一项复杂工作。 \n 当 Agent 从个人助手变成组织中的「数字同事」，企业需要的不只是更聪明的模型，还需要一套能够承载人与 Agent\
    \ 共同工作的协作平台：让 Agent 获得必要的业务上下文和工具，同时遵守企业的权限与管理规则。 \n   \n 飞书 CEO 谢欣｜来自：2026 飞书未来无限大会暨豆包工作开工大会 \n 今年的飞书未来无限大会，因此多了一个有趣的新名字——豆包工作开工大会。\
    \ \n 对一个 Agent 来说，「开工」比回答问题复杂得多。它需要了解公司的业务是什么、今年要完成什么样的目标、任务由谁提出、应该用什么工具、结果交付给谁。这些能力很难由模型，甚至通用的 Harness\
    \ 框架提供，却恰恰存在于企业长期使用的协同办公平台。 \n 飞书和豆包工作正在尝试给出一套相对完整的答案。飞书 8.0 为 Agent 重构协同平台；豆包工作提供原生融入飞书的企业级 Agent；仍在定向共创阶段的豆包工作伙伴，则进一步探索拥有独立身份、权限和记忆的团队智能体。\
    \ \n 在飞书积累的企业组织上下文里，豆包工作开始真正「工作」了。 \n 协同办公，翻开新的一页 \n 在大会开场，字节跳动 CEO 梁汝波回顾了过去 50 年的四轮技术浪潮：PC、Web、移动互联网和\
    \ AI。 \n   \n IT 50 年｜来自：2026 飞书未来无限大会暨豆包工作开工大会 \n 每一次底层技术变化，都会重新塑造工作的入口。PC 时代，Office 等软件帮助个人完成数字化生产；云和移动互联网时代，文档、沟通与业务流程被搬到线上，协同平台成为企业的数字基础设施。\
    \ \n 进入 AI 时代，工作平台再次发生变化——它不仅要服务人与人协作，还要承载人与 Agent、Agent 与 Agent 共同完成任务。 \n 换言之，「协同办公」没有消失，但它的目标正在改变：过去的协同办公主要解决如何让人高效沟通，现在则要进一步解决如何让工作被理解、被执行，并最终产生结果。\
    \ \n 过去，企业选择协同工具，主要考察沟通是否顺畅、文档是否好用、系统能否连接。现在，一个新的指标开始出现： 这套平台能"
