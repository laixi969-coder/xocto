  fact: "OpenAI 开发者大会推出智能体 dots，重构会员定价，意图打造 AI 超级入口 \n 北京时间 9 月 30 日凌晨，OpenAI 举办其宣称规模最大的一届开发者大会，一次性发布\
    \ 25 项更新，覆盖新模型、API、智能体、插件生态与企业软件市场。大会现场，Sam Altman 公布 ChatGPT Pro 会员调整方案时台下一片沉寂，套餐调价成为本次发布最受争议的内容。\
    \ \n 会员体系重新划分档位：原有 200 美元 / 月的 Pro 200 售价不变，但新订阅用户额度减半；新增 500 美元 / 月的 Pro 500 套餐，额度为 Plus 的 25 倍，独家开放\
    \ Astra Ultrafast 高速模式。OpenAI 的计价逻辑发生转变，不再简单按 token 数量计费，转而参考「雇佣 AI 员工」模式，按交付工作量与运行速度单独收费，高速模式消耗额度更快。尽管\
    \ GPT-6.1 Sol 等新模型 API 价格大幅下调，但会员套餐内可用额度同步缩减，引发开发者不满。 \n   \n 本次重头戏是智能体 dots，由 GPT-6 Astra 驱动，自带云端运行环境，可连接数千款应用，能够持续自主完成任务，Pro\
    \ 及企业套餐用户可使用。OpenAI 同步推进平台化改造，新增插件生态、ChatGPT 账号登录、跨应用额度通用能力，对标微信小程序与账号体系，试图将 ChatGPT 打造为人与智能体协作的统一入口。同时上线团队资料空间、动态文档、新版\
    \ Codex 云端开发环境，面向企业推出软件市场，企业额度可直接采购第三方商业软件。（来源：极客公园） \n 相关报道： 除了更贵的订阅和砍半的额度，OpenAI 想做的还是「微信」 | 极客公园\
    \  \n   \n DeepSeek Harness 桌面端预览版 v0.2 发布，支持插件安装与自动化任务 \n 9 月 29 日消息，DeepSeek Harness v0.2 预览版正式发布，并提供开箱即用的\
    \ macOS 和 Windows 桌面端安装包，已上线 DeepSeek 官网。 \n   \n 新版本预置了面向日常办公和开发的常用功能，让常用能力开箱即用。同时，新增插件安装与管理页面，并提供更多灵活配置选项，方便按需扩展功能，打造更适合自己的智能产品。DeepSeek\
    \ Harness 尚在起步阶段，功能与体验仍有待细致打磨。 \n 本次"
