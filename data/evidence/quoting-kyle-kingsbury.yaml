  fact: 'More broadly, the use of LLMs erodes trust in documentation, in software, and in the organizations
    which produce them. Perhaps engineers will begin to treat any new software project with suspicion—the
    signals we used to rely on as markers of a mature system are now easier to counterfeit. [...] In the
    age of LLMs, what can maintainers do to ensure correct software and accurate documentation? Having
    done that work, how can they demonstrate its quality to users? — Kyle Kingsbury , Jepsen results for
