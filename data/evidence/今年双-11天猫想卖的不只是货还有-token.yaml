  title: 今年双 11，天猫想卖的不只是货，还有 Token
  published_at: '2026-10-23T05:56:53Z'
  collected_at: '2026-10-24T00:43:48Z'
  source_kind: market_signal
  tier: independent
  fact: 「很多人赚不到认知以外的钱。那消费者呢？我认为，买不到他认知以外的商品。」10 月 15 日下午，上海世博中心，2026 天猫双 11 发布会。天猫总裁家洛开场没多久，就抛出了这句话。 消费者的需求远比这些品类多，只是大部分还处在「沉睡」状态。
    过去的搜索解决不了这个问题。用户主动搜关键词、平台做精准匹配，在他看来，「更像一个统计学的概念」，搜的人越多、描述越准，匹配就越高效，「但这依然是存量和认知以内的东西」。 所以他给今年的 AI 定了一个很朴素的标准：「
    AI 最重要的，是他是不是更理解我们，以及是不是更理解我们的消费者。 」 一个用户在飞猪上买了去看世界杯的机票，从没搜过任何和球迷有关的关键词，但他曾经是运动人群。把这两条线索组合成人群包推给运动品牌和足球品类，购买转化率比日常高出
    3 倍以上。 「即使可能消费环境让我们有一些焦虑，但是 AI 的能力让我们打开更多购买的可能。」家洛说道，对于商家而言， 商家的增长最大的机会，来自人群不断变迁的变化。 一个学生是数码用户，却不是家电家装用户；一旦步入职场，他立刻会变成家电、珠宝、化妆品、服装品类最大的潜在消费者。这种变迁「不能简单用一个年龄判断，而是他作为社会身份发生变化的判断。「什么时候养了一个宠物？这个家庭什么时候多了一个孩子？」这些都是挖掘购物需求的潜在线索。
    天猫今年的思路其实很清楚： 对消费者，AI 要用来理解那些没说出口的需求；对商家，AI 要用来看懂人群在往哪里走。 增长不再来自把已知需求匹配得更快，而来自把未知需求「叫醒」。 落到今年双 11
    本身，节奏和往年类似：10 月 15 日晚 8 点开启预售，10 月 20 日晚 8 点现货开卖。 天猫双 11 新闻发布会现场｜图片来源：极客公园 淘宝搜索，从「搜得到」到「懂你要什么」 现在，买东西越来越像在填标准答案。可今天的消费者，很多时候只知道自己要去一个场合，或者想解决一种情绪。
    接过这个问题的，是淘天集团搜索基础产品和算法负责人飘雪，她一上台就把外界对淘宝搜索最尖锐的三个疑问摆了出来： 淘宝到底还懂不懂货？ 搜索是在服务消费者，还是在服务广告预算？ 「现在大家有事都问 AI
    了，以后还需要打开淘宝吗？」 过去，用户搜「白色连衣裙 显瘦」，需求明确，关键词清晰，飘雪说淘宝对这类搜索「已经做到了非常高的承接效率」。这是过去十几年电商搜索的核心范式
