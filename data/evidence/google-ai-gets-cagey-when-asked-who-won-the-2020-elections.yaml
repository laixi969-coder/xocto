  fact: 'If you ask some prominent US politicians who won the 2020 presidential election, you might get
    some weasely answers that fail to directly acknowledge Joe Biden''s win that November. If you ask
    Google''s AI Mode the same question, you might get an evasive answer that simply tells you to consult
    with outside sources. When I put the direct question of "Who won the 2020 presidential election?"
    to Google''s AI Mode this morning (after seeing complaints about cagey answers on social media ),
    I got the following surprisingly indirect response: "To review the official results and statistics
    of the 2020 United States presidential election, including the final electoral college breakdown,
    popular vote counts, and winner certification, please consult the official report compiled by the
    Federal Election Commission (FEC)." My testing resulted in a similarly indirect answer when asking
    about the 2024 presidential election, with Google''s AI telling me to just consult the FEC for that
    information. Asking'
