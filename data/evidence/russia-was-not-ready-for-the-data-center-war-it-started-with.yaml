  fact: When Russia began attacking Ukrainian data centers and telecommunication infrastructure, it apparently
    failed to prepare for possible retaliation. Now Russia’s digital services are facing widespread outages
    after Ukrainian drone strikes knocked out three of the largest data centers owned by Russian tech
    giant Yandex within several days. Pro-Kremlin bloggers are warning that Russia’s centralized digital
    economy could collapse because the country is not prepared for the “data center war” it started, according
    to posts translated by the pseudonymous independent researcher ChrisO_wiki . The Russian commentators
    also suggested that Ukraine’s decentralized digital services could prove more resilient than Russia’s
    system if the countries continue trading such blows. Russia initially launched a drone strike campaign
    targeting Ukrainian data centers and mobile phone networks in late September. The attacks temporarily
