  fact: A protein is a chain of amino acids held together by what are called peptide bonds. On their own,
    those bonds are extremely stable; they're estimated to have a half-life of several hundred years.
    But in Earth's environment, most proteins don't last nearly that long. That's because organisms have
    evolved a handful of ways to catalyze the break-up of peptide bonds, which have diversified into countless
    specialized protein-digesting enzymes. Proteases are everywhere and generally make short work of any
    proteins that find their way into the environment. Now, researchers have basically short-circuited
    the diversification process, using AI-based protein design tools to take the catalytic core of two
    types of protease and replace the entire rest of the protein. The resulting enzymes could be tuned
    to cut specific proteins in half, and the researchers demonstrated their effectiveness by using them
