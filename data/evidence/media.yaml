  url: https://www.v2ex.com/t/1249156
  title: 70 美金的 Beyond Compare，我让 Gemini 4 和 DeepSeek 造个开源免费版（Day 2）
  published_at: '2026-10-15T13:18:45Z'
  collected_at: '2026-10-16T00:25:11Z'
  source_kind: product
  tier: independent
  fact: "昨天发帖请大家提名最想平替的付费软件。今天交 Day 2 的账单和最终选题。\r\n\r\n### 1. 为什么定下 Beyond Compare ？\r\n\r\n昨晚到今天，AI 员工把\
    \ 6 个平台的 134 条评论全抓回来了（ V2EX 占了 118 条）。\r\n\r\n除去提名重写 Windows 11 、SAP 、MATLAB 和微信的老哥，呼声最高的实用工具就是 **Beyond\
    \ Compare**。\r\n\r\n大家苦它久矣：**Pro 版买断要 70 美金（约 500 元）**，跨大版本升级还要交半价。而 Mac 上的开源替代品 Meld 长期断更卡顿，KDiff3\
    \ 的界面还停在二十年前。\r\n\r\n除了评论区提名，AI 还去外网盲测了一圈，把取消买断改收 108 美金年费的录屏软件 `Screen Studio` 也拉进了决赛圈。\r\n不过内部圆桌吵了两轮后，我还是在手机上拍板了\
    \ **Beyond Compare**，开源项目定名 **`OpenCompare`**。\r\n\r\n![选品圆桌：两波调研 + 三席位两轮互搏的分工图]( https://media.munk.sh/blog/day-02/round-table.png)\r\
    \n\r\n原因很简单：一是听劝，兑现评论区最高票；二是它零外部依赖，做完直接丢测试文件夹、冲突代码和乱序表格进去，机器自己就能跑完桌面实机验收。\r\n\r\n### 2. 5 个研发日，只做哪\
    \ 4 件事？\r\n\r\n去掉首尾，写代码加自测只有 5 天。为了不搞出个半吊子玩具，我们砍掉了十六进制对比、远端挂载和容易误删文件的双向同步，只死磕最常用的 4 个功能：\r\n\r\n1.\
    \ **双文件夹极速对比**：按大小、修改时间和哈希秒级比对，一键过滤出差异文件。\r\n2. **代码双栏对比与三向合并**：遇到 Git 冲突时，摆清三方冲突块，点一下就能采纳并导出。\r\n\
    3. **千行 CSV 按主键列对齐对比**：这是普通编辑器内置 Diff 最抓瞎的地方。两份乱序表格，指定一列当主键（比如订单号），自动拉齐每一行并高亮改过的单元格。\r\n4. **JSON\
    \ / YAML 语义对比 + 手机扫码看报告**：忽略缩进和键顺序噪音；桌边那台测试手机扫个码，就能在手机上翻看变更摘要。\r\n\r\n### 3. 今日 Token 账单与一次断流\r\n\r\
    \n昨天有 V 友提醒注意 Gemini 4 的 To"
- id: ev-190736aacb841e72
  project_slug: media
  url: https://www.v2ex.com/t/1249479
  title: 我给 Gemini 4 和 DeepSeek 搞了套「末位淘汰」， AI 干活会更猛吗？（Day 3）
  published_at: '2026-10-16T14:02:18Z'
  collected_at: '2026-10-17T00:30:21Z'
  source_kind: product
  tier: independent
  fact: "昨天定下做 Beyond Compare 的免费开源版 **OpenCompare** 后，评论区又有朋友提了 FTP 远端对比等新需求，我已经让 AI 员工收进需求池交给 Gemini\
    \ 4 评估。\r\n\r\n今天本来该直接让 Gemini 4 和 DeepSeek 开工写核心代码。但动手前，我突然好奇一件事：\r\n\r\n人类公司常挂在嘴边的「企业文化」「员工性格」，听着很虚。如果搬进一家全员\
    \ AI 的公司里，到底有没有用？\r\n\r\n我准备看三个指标：\r\n\r\n1. **交付耗时**：同一个功能，是干脆利落跑通，还是在对齐方案、反复内耗里拖慢进度？\r\n2. **Token\
    \ 账单**：少请示、少废话能不能省钱？反过来，测试太严频繁打回返工，会不会把预算烧穿？\r\n3. **产品完成度**：最后做出来的软件，细节和质量有没有肉眼可见的差别？\r\n\r\n为了测这件事，今天我给自己的\
    \ Agent 系统加了个「企业文化」模块。保存后，这些规矩会直接写进每个 AI 角色的系统提示词里。\r\n\r\n![公司设置：一键套用团队阵容与公司文化基调]( https://media.munk.sh/blog/day-03/company-setting.png)\r\
    \n\r\n### 1. 为什么不能全员「狼性」？\r\n\r\n在「公司」设置里，我放了四档文化基调：**默认**、**积极务实**、**狼性高自主**，以及 **末位淘汰·职场高压锅**。\r\
    \n\r\n一开始我想把所有 AI 全设成「狼性」。但转念一想，全员激进没人踩刹车，最后肯定变成跳过测试的草台班子。真正能打的团队，得靠不同岗位的性格对冲。\r\n\r\n所以我只给有决策空间的\
    \ **11 个核心岗位**配了性格，另外 7 个打包、装环境、点屏幕的工具岗不设性格，老实按流程干活：\r\n\r\n![角色性格设置：给研发岗配置「外科手术极客」或「防御式工匠」]( https://media.munk.sh/blog/day-03/agent-setting.png)\r\
    \n\r\n拿写代码的研发岗来说，可以选只改最少代码、拒绝顺手重构的「\U0001F977 外科手术极客」，也可以选有边界洁癖、严补单测的「\U0001F482 防御式工匠」。到了下游验收的测试岗，可以配抓大放小的「\U0001F44D\
    \ 主路径务实派」，也可以配吹毛求疵、看到界面错位直接打回的「\U0001F608 铁面找茬王」。\r\n\r\n### 2. 四套阵容，拿 OpenCompare 真跑一"
