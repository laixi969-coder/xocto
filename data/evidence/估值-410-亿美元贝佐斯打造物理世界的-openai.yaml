  fact: 作者｜宇航猿 编辑｜靖宇 AI 吞掉了软件，现在，它要吞掉工业了。 卸任亚马逊 CEO 五年后，杰夫·贝佐斯没忍住，又给自己找了个班上。 当地时间 2026 年 11 月 17 日，加州门洛帕克的
    Semafor「硅谷与世界」峰会现场，贝佐斯和物理学家维克·巴贾杰（Vik Bajaj）罕见同台。 他现在的最新头衔，是 AI 初创公司 Prometheus 的联合创始人兼联席 CEO 。这是自
    2021 年交出亚马逊帅印后，这位商业巨头首次重回一线担任 CEO。 早在 2024 年底种子期就掏钱投资的贝佐斯，在台上毫不掩饰自己的兴奋，直言项目进展太快，自己根本「没法坐在场边干看着」。 能让贝佐斯重返战场的，是个大赌局。
    点开 Prometheus 的官网首页，目前只有极简的品牌标识与暖色光晕背景，几乎看不到任何公开的产品细节。但在水面之下， 这家仅有约 250 名员工的神秘公司，估值已经飙升至 410 亿美元，累计筹集了约
    145 亿美元资金 。 极度低调的 Prometheus 官网首页目前仅展示品牌标识，尚未向公众开放工具集｜图片来源：Prometheus 官网 在长达 32 分钟的对谈里，贝佐斯第一次掀开了底牌。以往需要
    10 到 20 人的工程师团队，耗时 6 到 9 个月才能搞定的模拟芯片、无线电设备或阀门设计，Prometheus 的系统在 12 小时内就能做完。他名下的商业航天公司蓝色起源，已经在两个项目上私密内测这套工具。
    硅谷还在为聊天机器人和写代码的智能体卷生卷死，贝佐斯直接换了一张牌桌。 Prometheus 的野心，是成为物理世界的 OpenAI，用「原子的 AI」， 去重构数十万亿美元的实体制造业。 01
    牛顿造不出小烤箱 Prometheus 145 亿美元的融资规模，很多人的第一反应，是贝佐斯也要下场造人形机器人了。 他在峰会上直接否认了这个猜测——Prometheus 既不做陪聊的语言模型，也不造双足机器人，
    它的终极目标是打造「通用 AI 工程师」（Artificial General Engineer，简称 AGE） 。 为什么今天无所不能的纯文本大语言模型，干不了硬核工程师的活？ 贝佐斯在现场抛出了一个非常形象的比喻，「光靠阅读学不会工程。就算我读一千本体操书，我依然是个糟糕的体操运动员；读一千本舞蹈书，我还是不会跳舞。」
    贝佐斯
