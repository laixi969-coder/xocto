  fact: "苹果首款折叠 iPhone Duo 亮相，国行 15999 元起 \n 北京时间 9 月 10 日凌晨，苹果发布首款折叠手机 iPhone Duo，国行 15999 元起，10 月 16\
    \ 日开启预售，23 日正式发售。同场推出 iPhone 18 Pro 系列，9999 元起；标准版 iPhone 18 推迟至明年春季发布。 \n   \n 该机采用书本式内折设计，内外屏尺寸与小米\
    \ 18 Fold 接近，价格高出 5000 元。机身重 254 克，厚度在同类折叠机型中偏厚重，但支持 IP68 防水。机型取消长焦镜头与面容 ID，改用侧边 Touch ID，搭载 A20 Pro\
    \ 芯片。iOS 27 首次加入手机分屏功能，后续还将支持 Apple Pencil。 \n 此外，Apple Watch Series 12 新增对话摘要功能，AirPods 5 基础款首次搭载主动降噪。多款\
    \ AI 相关新功能暂未在国内上线。苹果仅优化了折叠屏软件适配，并未解决行业普遍存在的重量与高价难题。（来源：极客公园） \n 关联阅读： 苹果第一台折叠 iPhone，15999 元起  \n\
