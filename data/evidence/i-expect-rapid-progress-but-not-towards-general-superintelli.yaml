  fact: I’ve often been surprised when I hear from top researchers in industry that they think AI will
    be better than them at their job in a few years, and I didn’t really know why I doubted it. The explanation
    I arrived at is that researchers are seeing this massive acceleration in the infra and engineering
    capabilities of the models. I fully agree that the models will be superhuman distributed GPU engineers
    in a few years. This will make experimentation and tinkering with the formulation of the models far
    easier, but it will not make our models dramatically different in nature. In some ways, Ilya was early
    in his declaration of AI being in the era of research . Research is much easier today now that we
    have coding agents. This ease is through a different form of work that is flexible and engaging, which
    signals the start of an era where good ideas can be much more valuable than good execution in software.
