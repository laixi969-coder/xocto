  fact: From pediatric research to smart hospitals, AI is helping care teams spend less time on routine
    tasks and more time with patients. Health systems and startups are putting it to work across healthcare,
    from matching patients to clinical trials to supporting radiologists, hospital teams and patients
    at home. Clinicians stay at the center, reviewing AI outputs and guiding decisions, while NVIDIA technologies
    provide the compute behind the applications. Read on to learn how healthcare teams are using AI to
    improve and speed patient care. Friday, Nov. 13, 5:00 a.m. PT Dyania Health Uses AI to Turn Decades
    of Patient Records Into Better Care Hospitals hold decades of patient history, most of it written
    in free text, as physicians’ notes, operative reports, imaging and pathology reads and discharge summaries.
    To understand one patient’s full story, a clinician would need to read through years of charts . Dyania
    Health , a New Jersey-based clinical AI company, built Synapsis AI to do just that
