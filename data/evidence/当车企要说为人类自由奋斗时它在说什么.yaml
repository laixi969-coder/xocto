  title: 当车企要说为「人类自由」奋斗时，它在说什么
  published_at: '2026-10-21T09:10:33Z'
  collected_at: '2026-10-22T00:42:47Z'
  source_kind: market_signal
  tier: independent
  fact: 头图来源：极客公园 1993 年，时任三星集团会长的李健熙，在德国发表了著名的「法兰克福宣言」，其中最著名的一句话是：「除了老婆孩子，一切都要变。」 当时韩国摸着日本，在全球化浪潮中极速行军，产量提升的同时，也被贴上了「便宜廉价」的标签，法兰克福宣言，开启了三星通过技术进行高端化转型之路。
    2026 奇瑞全球创业大会会场｜图片来源：极客公园 33 年后的当下，安徽芜湖，奇瑞集团创新产业园中，「Change 改变」的字样随处可见，这是 2026 奇瑞全球创新大会的主题。 在主题演讲中，奇瑞董事长尹同跃说，奇瑞是一家披着车企外衣的「科技公司」，奇瑞的技术愿景是「为人类自由，创造最大价值。」
    从某种角度来看，奇瑞愿景的宏大，和 SpaceX 的伊隆·马斯克，多少有相似之处了。 从芯片、模型到智驾 奇瑞董事长尹同跃对于 AI 时代的断言｜图片来源：极客公园 如果给车企的「科技含量」排个座次，芯片和大模型大概排在最前面。这一次，奇瑞把这两样东西一起摆上了台面。
    先说芯片。奇瑞发布了自研的「紫微」芯片系列，分成三条线。C 系列是中央计算芯片，S 系列是车规级碳化硅功率芯片，M 系列是车规级控制芯片。从「大脑」到「肌肉」再到「神经末梢」，一台智能车需要的核心芯片，基本都被画进了这张路线图。
    最受关注的是紫微 C100。单颗算力 1200TOPS，两颗组合后整车 NPU 算力达到 2400TOPS，内存带宽 600GB/s。按照奇瑞的说法，它可以支撑 1000 亿参数的大模型在车端运行，计划
    2027 年推出。奇瑞给出的对标数据是，带宽约为竞品的 2.2 倍，算力约为 1.2 倍。 相比之下，碳化硅这条线更务实。S 系列已经走到第二代 8 寸平面工艺，S750、S1200 今年推出，漏源耐压做到
    1500V，奇瑞称这是目前车规级的最高电压等级。8 寸晶圆量产后，成本下降超过 30%。 算力芯片决定上限，功率芯片则直接决定每台车的成本 ，这笔账，车企比谁都算得清。 芯片之上是模型。奇瑞发布了一个名为
    CheryMind 的垂类基础大模型，定位是「为物理 AI 而生」。它的底气来自奇瑞多年攒下的家底：700TB 企业知识、200PB 工程数据、千万级研发文档，再加上 2500 万段教练级驾驶数据，以及
    500 万段机器人动作捕捉数据。 有意思的是，CheryMind 最先改造的是奇瑞自
