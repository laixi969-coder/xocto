  fact: 作者｜徐珊 编辑｜ 郑玄 这可能是你见过最安静的一块「草莓地」。 没有虫鸣，没有鸟叫，50 平方米的房间里，草莓植株一层层码到头顶，叶片舒展，几乎找不到一个虫眼，枝头挂满了还没转红的青果，也有不少已经熟透。不靠天、不靠地，草莓在这个赛博农场里被「种上了天」。
    这里是第五届「多多农研科技大赛」一等奖赛博农人团队的植物工厂。从 5 月 12 日定植算起，这些草莓等了 113 天才迎来第一次采收，采收 50 天累计产量达到 284.45 公斤，而日常照料它们的，只有
    1 名工人。评委贺冬仙说，如果再给它半年，这一架草莓产量会相当可观。 但每一束光、每一度低温背后都是成本。过去几年，Plenty、Bowery、Infarm 等明星垂直农业公司相继破产或停运。到
    2024 年，中国已经有了 493 座植物工厂，研究机构、照明企业等都在入场，但其中不少也处于亏损状态。 植物工厂离商业化，始终只差临门一脚。 种出植物并不是结果，过去几年，植物工厂的技术一直在进步，但成本的账却始终算不平。这两年，前沿技术更深地介入种植，光配方、环控算法和立体栽培，迭代明显提速。据大赛评委、中国农业大学水利与土木工程学院教授贺冬仙估算，按一等奖获得者赛博农人团队的势头，如果全年持续生产，每平方米能产出
    8 公斤草莓，可以追平全日本一季植物工厂草莓的最高单产水平。 正因为有 50 平方米、国产设备、有限经费、选手不能进厂、操作工是新人等这些约束，植物工厂最真实的难处才被逼了出来。软硬件到底好不好，都得由植物来判断。
    国产植物工厂方案离商业化还差什么？当工程师的算法遇上老农的经验，未来的农业会发生什么变化？ 这也是拼多多连续五年办这场比赛的用意，从帮农民把农产品卖出去，走到用技术帮农民把地种好。在商业化的前夜，它更像一次互相校准
    。 01 九死一生的垂直农业， 为什么最后都押注了草莓？ 如果把过去几年倒下的垂直农业公司列一张名单，会发现一个奇怪的规律，只要是种生菜的几乎全军覆没，活下来的都只种一种植物：草莓。 仅 2025
    年一年，室内农业相关的破产就有 14 起。以种叶菜为主的 Bowery 停运，Infarm 裁掉近一半员工、退出欧洲；背靠软银、沃尔玛和贝索斯的 Plenty 破产重组后，砍掉了所有业务，只留下一座草莓工厂。为什么草莓得到了大家的如此偏好？既然大家都押注草莓，为什么全世界至今还没有一
