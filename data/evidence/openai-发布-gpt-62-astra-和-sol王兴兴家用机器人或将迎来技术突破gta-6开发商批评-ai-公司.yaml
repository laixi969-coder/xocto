  fact: OpenAI 发布 GPT-6.2 Astra 和 Sol，强化编程、电脑操作与专业工作 OpenAI 正式发布 GPT-6.2 Astra 和 GPT-6.2 Sol 两款模型，重点提升专业任务、Coding、电脑操作和执行效率，并降低部分使用成本。新模型将应用于
    ChatGPT Work、Codex 和 API。 其中，Astra 面向复杂编程和专业工作，Sol 则更强调日常多模态任务及工具使用。 OpenAI 同时发布系统安全卡，披露两款模型在网络安全能力方面均达到其
    Preparedness Framework 的 Critical 门槛，Astra 的 AI 自我改进能力达到 High 门槛，因此加强了高风险能力的访问限制。（来源：OpenAI） 谷歌 DeepMind
    首席战略官跳槽 Anthropic，AI 人才争夺持续升温 11 月 17 日消息，据《The Information》报道，谷歌 DeepMind 首席战略官贾斯吉特·塞孔（Jasjit Sekhon）已离职，正式加入
    Claude 开发商 Anthropic。 塞孔在社交平台 X 上确认了这一消息，表示未来将致力于提升 Claude 的知识可靠性与事实严谨性。他今年 3 月加入 DeepMind，任职仅约 8
    个月。此前曾在哈佛大学、加州大学伯克利分校及耶鲁大学任教，并担任桥水基金高级科学家兼 AI 负责人。 今年以来，谷歌 DeepMind 已有多名核心人才出走。6 月，Gemini 联合负责人诺姆·沙泽尔转投
    OpenAI；参与开发 AlphaFold 的诺贝尔化学奖得主约翰·江珀也加入 Anthropic。 据数据公司 Zecki 统计，过去一年离开 DeepMind 的员工中，25% 加入 Anthropic，21%
    流向 Meta，14% 选择 OpenAI。 随着 Anthropic 即将启动 IPO，全球 AI 巨头之间的人才争夺进一步加剧，Anthropic 正成为 DeepMind 人才流动的重要目的地。（来源：IT
    之家） 马斯克：特斯拉 Robotaxi 最早 12 月开放车主接入 特斯拉 CEO 马斯克近日在社交平台 X 上透露，最早可能于 12 月启动个人车主接入 Robotaxi（无人驾驶出租车）网络的试运营，允许车主将自有车辆投入出租车队，通过接单获取收入
