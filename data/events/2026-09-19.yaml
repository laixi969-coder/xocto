- id: evt-68be7a1ec6a2ecab
  project_slug: 晚点独家丨百度智能云分拆平台产品事业部maas-划入基础设施agent-独立成军-数据-通用-模型-客户-收入-手机新浪
  event_type: material_update
  occurred_at: '2026-09-18T06:19:18Z'
  discovered_at: '2026-09-19T00:21:52Z'
  signals:
  - update
  summary: 2026年9月17日至18日多家媒体报道，百度智能云分拆平台产品事业部，将MaaS划入基础设施条线、Agent业务独立成军，并首次提出“产业智能体操作系统”说法。这是云厂商内部组织与产品条线的调整，属于平台侧结构变化，而非独立新产品发布；对AI应用的含义是模型服务与智能体能力可能被重新打包为云侧基础设施与平台供给，第三方应用接入与竞争关系或随之变化，但具体客户、收入与定价影响公开材料未披露，属推断。
  summary_en: Between Sept 17 and 18, 2026, multiple outlets reported that Baidu AI Cloud split its platform
    product division, moving MaaS into the infrastructure line and making its Agent business a standalone
    unit, while introducing the phrase "industrial agent operating system." This is an internal organization
    and product-line change at a cloud vendor rather than a standalone product launch; for AI applications
    it implies model serving and agent capabilities may be repackaged as cloud-side infrastructure and
    platform supply, potentially shifting how third-party apps integrate and compete, though customer,
    revenue and pricing effects are not disclosed and remain inference.
  evidence_ids:
  - ev-ffcc2e8a8d45dea1
  homepage: true
