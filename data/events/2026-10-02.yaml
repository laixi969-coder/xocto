    replacing manual doc-reading and hand-assembled API calls with agent-executed operations. This is
    a capability update to the platform's own toolchain, not a standalone product; for AI applications
    it means cloud platforms are starting to treat agents as an operating entry point, which may reshape
    how applications are configured and delivered, though that impact is inference only.
