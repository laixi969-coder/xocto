- id: first-openai-openai-python-v3230
  project_slug: openai-openai-python-v3230
  event_type: first_discovered
  occurred_at: '2026-10-01T23:02:59Z'
  discovered_at: '2026-10-02T01:41:55Z'
  signals:
  - release
  - open_source
  summary: 2026年10月1日，openai-python 发布 v3.23.0，新增 agents 会话流返回类型化答案、暂存文件并下载回合产物、API 会话追踪与 Realtime 翻译、将类型化应用操作暴露为
    agent 工具等能力，并修复 Chat Completions 图像细节、eval 运行取消端点、WebSocket 重连与发送队列限制等问题。
  summary_en: On October 1, 2026, openai-python released v3.23.0, adding typed answers from agent session
    streams, file staging and turn artifact downloads, API session traces and Realtime translations, and
    typed application actions exposed as agent tools, while fixing issues in Chat Completions image detail,
    the eval run cancellation endpoint, WebSocket reconnects, and send queue limits.
  evidence_ids:
  - ev-575ba3b4800c391a
  homepage: true
- id: evt-6c222d02ab348014
  project_slug: huggingface-transformers-release-5180
  event_type: material_update
  occurred_at: '2026-09-30T16:46:27Z'
  discovered_at: '2026-10-02T01:41:55Z'
  signals:
  - update
  - open_source
  summary: 2026年9月30日，公开模型社区 在 Transformers 5.18.0 版本中新增 Nemotron 3 Diarization 开源权重说话人分离模型，支持流式与离线推理、最多八人、按说话人首次出现顺序输出。这是模型与库层面的能力更新，不是独立产品；对
    AI 应用的含义是会议记录、客服质检、访谈整理等需要区分“谁在何时说话”的音频处理环节，可直接调用现成权重，无需自建分离模型（推断）。
  summary_en: On 2026-09-30, public model community added the open-weight Nemotron 3 Diarization model
    in Transformers 5.18.0, supporting streaming and offline inference, up to eight speakers, and output
    ordered by each speaker's first arrival. This is a model and library capability update rather than
    a standalone product; for AI applications it means audio workflows that need to know who spoke when,
    such as meeting notes, support-call QA and interview transcription, can call existing weights instead
    of building a diarization model in-house (inference).
  evidence_ids:
  - ev-b8c771510d3400d2
  homepage: true
