    models" that return choices, probabilities and scores instead of text, with Nimble from Bespoke Labs
    and Tev1 from Together AI as the first available models, built on TypeSafe's Jev API; the release
    names ticket triage, model routing and content classification as intended uses. This is a capability
    extension of a local inference runtime, not a standalone application product.
