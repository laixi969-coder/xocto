  summary: 开发者在手机上通过远程代理操作项目时，需要查看和修改服务器文件夹里的凭据等文件，又不想把这些内容送进大模型。web-edit 是一个 Python 网页应用，在指定文件夹上提供浏览与编辑界面，编辑用
    CodeMirror 6，设计上跑在 Tailscale 网络内，由代理启动后手机直接访问。具体交付与权限边界仍待核验。
  summary_en: When developers work on a project from a phone through a remote agent, they sometimes need
    to view or edit files such as credentials in a server folder without sending that content through
    the LLM. web-edit is a Python web app that offers a browsing and editing UI over a folder, using CodeMirror
    6, designed to run over Tailscale so an agent can start it and the phone can reach it directly. Exact
    delivery and permission boundaries still need verification.
  evidence_ids:
  - ev-325a18509461e1f7
  homepage: true
