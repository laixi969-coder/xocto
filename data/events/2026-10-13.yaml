- id: evt-988ae90ecdf6c8e2
  project_slug: ai-coding-agents-generate-more-code-but-not-more-software
  event_type: material_update
  occurred_at: '2026-10-12T17:14:01Z'
  discovered_at: '2026-10-13T03:03:54Z'
  signals:
  - update
  - adoption
  summary: 一项基于数百家企业 3 亿条工程工作事件的研究发现，AI 编码工具带来的编码效率提升被人工代码审查瓶颈吸收，审查时间延长、拉取请求修改率上升，几乎没有证据显示企业软件产出增加或用工减少。
  summary_en: A study of 300 million engineering work events across hundreds of firms found that coding
    efficiency gains from AI coding tools are absorbed by human code review bottlenecks, with longer reviews
    and higher pull request revision rates, and little evidence of increased software output or reduced
    employment.
  evidence_ids:
  - ev-e70d3c1f4e7ee0d7
  homepage: true
