  project_slug: rea-tool-connects-claude-code-and-cursor-to-ghidra-and-ida-p-2
  event_type: first_discovered
  occurred_at: '2026-10-13T03:04:29Z'
  discovered_at: '2026-10-13T03:04:29Z'
  signals:
  - release
  summary: 逆向工程师在分析二进制样本时，原本要在 Ghidra 或 IDA Pro 里手工读反汇编、再自己整理结论；REA 把这两个反汇编工具接到 Claude Code 与 Cursor，让
    AI 直接读取反汇编结果并给出解读，用户拿到的是可继续核对的初步分析结论，最终判断仍需人工确认。具体输入格式、交付形态与定价仍待核验。
  summary_en: Reverse engineers analyzing binary samples previously had to read disassembly by hand in
    Ghidra or IDA Pro and write up conclusions themselves; REA connects those two disassemblers to Claude
    Code and Cursor so the AI reads the disassembly output and produces an interpretation, leaving the
    user with a first-pass analysis to verify manually. Input formats, deliverable form and pricing remain
    unverified.
  evidence_ids:
  - ev-905d507baf43e791
  homepage: true
