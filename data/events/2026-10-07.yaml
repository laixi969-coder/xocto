  summary: 开发者或数据合规人员在把真实数据交给外部 AI 代理处理时打开它：它先向模型发送结构逼真的假数据，模型返回结果后在本地把假值还原成真实值，用户拿到的是可用的真实输出，而原始敏感字段没有离开本地。具体支持哪些字段类型、还原是否需人工确认，公开材料未说明，仍待核验。
  summary_en: 'A developer or data-compliance owner opens it when sending real data to an external AI
    agent: it first sends realistic fake values to the model, then restores the originals locally, so
    the user gets usable real output while sensitive fields never leave the machine. Which field types
    are supported and whether restoration needs human confirmation are not stated in the public material
    and remain unverified.'
  evidence_ids:
  - ev-27f61657324dbe81
  homepage: true
