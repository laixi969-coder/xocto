    ideas into prompts that image, video, music or voice generators can consume. Slate is a local prompt
    workspace that compiles shot and continuity information into prompts ready for those generators, with
    no API keys; the user ends up with grouped generation prompts, while the exact deliverable and human
    review step still need verification.
