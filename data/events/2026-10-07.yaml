  summary: 做 AI 影片的人在开拍前要规划镜头、保持角色与场景连续性，并把想法整理成能喂给图像、视频、音乐或配音生成器的提示词。Slate 是一个本地提示词工作台，把这些镜头与连续性信息编译成可直接投喂各生成器的提示词，不需要
    API key；用户最终拿到的是成组的生成提示词，具体交付形态与人工确认环节仍待核验。
