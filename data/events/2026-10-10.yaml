- id: first-asana-cuts-model-costs-76x-in-browser-tests-with-gpt-61-sol
  project_slug: asana-cuts-model-costs-76x-in-browser-tests-with-gpt-61-sol
  event_type: first_discovered
  occurred_at: '2026-10-10T01:46:28Z'
  discovered_at: '2026-10-10T01:46:28Z'
  signals:
  - release
  summary: 2026年10月9日，OpenAI 发布客户案例称 Asana 在浏览器代理测试中改用 GPT-6 Astra（Codex 内）后，模型成本降至原来的约 1/76、速度提升约 5 倍，用于向客户提供更强模型。该事实说明代理类产品的单位调用成本与延迟正在被重新定价：对做浏览器与流程自动化的团队，原本因成本被砍掉的长链路任务可能重新变得可交付，竞争焦点从“能不能做”转向“单次任务成本与响应速度”。需注意这是单一厂商案例，不能据此推断整个行业已转向。
  summary_en: 'On 9 October 2026 OpenAI published a customer case stating that Asana, using GPT-6 Astra
    inside Codex, made its browser agent about 76x cheaper and 5x faster in tests in order to offer customers
    more capable models. The fact reprices the unit cost and latency of agentic products: long multi-step
    browser tasks that teams previously cut for cost may become deliverable again, shifting competition
    from capability to per-task cost and response time. This is a single vendor case and does not show
    the whole industry has turned.'
  evidence_ids:
  - ev-11f8df47b4b339e9
  homepage: true
