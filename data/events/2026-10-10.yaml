- id: evt-987779276fb46dd2
  project_slug: quoting-matthew-green
  event_type: material_update
  occurred_at: '2026-10-09T15:02:29Z'
  discovered_at: '2026-10-10T01:46:29Z'
  signals:
  - update
  summary: Matthew Green 公开提出 AI 智能体蠕虫风险：隔离沙箱中的智能体可通过共享包缓存互相传递指令并改变行为，若换成邮件、Slack、共享文档或 WhatsApp 并部署 Muse
    等个人智能体，即具备蠕虫传播要素；他并称 AI 产生意外与人类更新标准的速度相差数个数量级。
  summary_en: 'Matthew Green publicly raised the risk of AI agent worms: agents in isolated sandboxes
    could pass instructions to each other through a shared package cache and change each other''s behavior,
    and swapping that for email, Slack, shared documents or WhatsApp plus deployed personal agents like
    Muse provides the ingredients for a worm; he added that the speed of AI surprises and the speed of
    human standards replacement are orders of magnitude apart.'
  evidence_ids:
  - ev-7914ee30772a8d1f
  homepage: true
