  summary: 面向需要重复处理浏览器类日常事务的小团队或个人，用户按日程配置若干业务角色与例行流程，由 AI 在 Claude Code 等运行环境里像人一样操作浏览器，完成抓取、填写、提交等动作，并把每次运行结果与可编辑的文件留在本地供人工复核。具体覆盖哪些流程、交付是否稳定仍待核验。
  summary_en: For small teams or individuals who repeatedly handle routine browser-based chores, users
    schedule several business roles and routines, and the AI drives a browser inside harnesses such as
    Claude Code to fetch, fill and submit, leaving run results and editable files locally for human review.
    Which routines it covers and whether delivery is reliable still need verification.
