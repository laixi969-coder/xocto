- id: evt-9908beeccd9f8db4
  project_slug: ai-pulse
  event_type: material_update
  occurred_at: '2026-09-24T14:39:25Z'
  discovered_at: '2026-09-25T00:34:18Z'
  signals:
  - update
  summary: 开发者在 macOS 上同时跑多个编码智能体时，原本要反复切回终端或编辑器窗口查看每个任务跑到哪一步；AI Pulse 在 Dock 旁放一条仿 LED 灯带，把智能体的运行状态直接显示在屏幕边缘，让开发者不用切窗口就能看到当前进度。具体支持哪些智能体、状态如何映射到灯带，公开材料未说明，交付细节仍待核验。
  summary_en: When developers run several coding agents at once on macOS, they normally switch back to
    the terminal or editor to check each task's progress. AI Pulse places a fake LED strip beside the
    Dock that shows agent status at the screen edge, so developers can see progress without switching
    windows. Which agents are supported and how status maps to the strip are not stated in the public
    material, so the delivery details remain unverified.
  evidence_ids:
  - ev-e1c5b57007002775
  homepage: true
