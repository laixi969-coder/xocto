- id: evt-2cf1212d8f377cae
  project_slug: helloagent智能体标识与身份网络暨智能体可信互联中心厦门正式启动试运行
  event_type: material_update
  occurred_at: '2026-09-24T08:04:25Z'
  discovered_at: '2026-09-25T00:34:18Z'
  signals:
  - update
  summary: 2026年9月22日至24日，多家媒体报道“智能体标识与身份网络暨智能体可信互联中心（厦门）”正式启动试运行，为智能体提供标识与身份互认的基础设施。该设施属于跨平台的智能体身份与互认机制，不是独立产品；对
    AI 应用而言，若身份与互认标准落地，跨平台调用与责任归属的对接成本可能下降，但公开材料未给出参与方、技术规范、收费标准或采用规模，影响仍属推断。
  summary_en: Between September 22 and 24, 2026, multiple outlets reported that the Agent Identity Network
    and Trusted Agent Interconnection Center (Xiamen) entered trial operation, providing identity and
    identification infrastructure for AI agents. This is a cross-platform identity and mutual-recognition
    mechanism rather than a standalone product; if such standards take hold, the cost of cross-platform
    invocation and accountability could fall for AI applications, but the public material gives no participants,
    specifications, pricing or adoption scale, so the impact remains an inference.
  evidence_ids:
  - ev-af44b87a96ff3376
  homepage: true
