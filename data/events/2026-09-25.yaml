  summary: 开发者在把真实数据交给外部 AI 接口前打开它，由代理把姓名、地址等敏感字段替换成逼真的假值再发出请求，返回结果在本地还原成原始信息。用户拿到的是可继续使用的真实输出，但具体支持的字段类型、还原准确率和人工复核环节仍待核验。
  summary_en: 'Developers open it before sending real data to an external AI API: the proxy swaps names,
    addresses and other sensitive fields for realistic fakes, then restores the originals locally in the
    returned output. Users get usable real output, though supported field types, restoration accuracy
    and any human review step still need verification.'
  evidence_ids:
  - ev-9d202a371609585b
  homepage: true
