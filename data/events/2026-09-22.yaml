  discovered_at: '2026-09-22T00:50:58Z'
  signals:
  - update
  summary: 开发者在把客户名单、病历或合同等敏感材料发给外部模型前，先把请求改道经过这个代理：真实字段被替换成看起来真实的假值，模型返回结果后在本地把原始值还原。用户拿到的是可继续使用的模型输出，同时真实数据没有离开本地；具体支持的模型、字段类型和还原准确度仍待核验。
  summary_en: 'Before sending sensitive material such as client lists, medical records or contracts to
    an external model, developers route the request through this proxy: real fields are replaced with
    realistic fakes, and the originals are restored locally after the model responds. The user gets usable
    model output while the real data stays local; supported models, field types and restore accuracy still
    need verification.'
  evidence_ids:
  - ev-8b3b09ac32dec5c9
  homepage: true
