  signals:
  - release
  summary: 零跑在2026技术日发布LEAP 5.0整车架构，将空调一体机移出乘员舱、动力总成后置使座舱长度提升19%，车顶改为原生一体化直升顶向上拓展800毫米，整车改为48伏供电；同时发布高低压融合电池（低压可用容量由20安时提升至146安时、寿命由约两年延长至10年以上）、电磁离合器直驱插混系统（扭矩900牛米、结合时间150毫秒）以及城区高阶智驾方案（A10车型6.58万元起售、带激光雷达顶配8.68万元，35万台带激光雷达老车可免费升级并终身免费使用）。公司披露8月交付10.3万台、同比增长80.7%，1至8月累计交付超56万台、其中出口13万台，上半年出口9.63万辆、同比增长372.6%，并计划2027年上半年在海外上市首款插混车型、2027年四季度推出第二品牌。
  summary_en: At its 2026 Tech Day, Leapmotor unveiled the LEAP 5.0 vehicle architecture, moving the integrated
    air-conditioning unit out of the cabin and relocating the powertrain to the rear to increase cabin
    length by 19%, adopting an integrated roof that adds 800 mm of vertical space, and switching the whole
    vehicle to 48V power. It also introduced a high/low-voltage integrated battery (low-voltage usable
    capacity raised from 20 Ah to 146 Ah, lifespan extended from about two years to over ten years), an
    electromagnetic-clutch direct-drive plug-in hybrid system (900 Nm torque, 150 ms engagement), and
    an urban advanced driver-assistance system (A10 from RMB 65,800, lidar-equipped top trim at RMB 86,800;
    free upgrades and lifetime free use for 350,000 lidar-equipped vehicles already on the road). The
    company reported August deliveries of 103,000 units, up 80.7% year on year, cumulative January-August
    deliveries above 560,000 units including 130,000 exported, and first-half exports of 96,300 units,
    up 372.6% year on year; it plans to launch its first plug-in hybrid overseas in the first half of
    2027 and a second brand in the fourth quarter of 2027.
  evidence_ids:
  - ev-7edef4ff2d1b39a8
  homepage: true
