  summary: 2026年9月，荷兰百年零售商 HEMA 公开其内部 AI 助手 HAL 的落地情况：HAL 基于 Amazon Bedrock AgentCore 构建，通过 Model Context
    Protocol 连接内部知识源，客户端不持有 AWS 凭证，身份与权限锚定 Microsoft Entra ID，让员工在既有工具内直接获得受治理的答案，替代此前在多个开发者门户之间跳转查找。
  summary_en: In September 2026, Dutch retailer HEMA disclosed details of HAL, its internal AI assistant
    built on Amazon Bedrock AgentCore. HAL connects to internal knowledge sources via Model Context Protocol,
    keeps AWS credentials off the client, and anchors identity and permissions in Microsoft Entra ID,
    so staff get governed answers inside the tools they already use instead of hopping between developer
    portals.
  evidence_ids:
  - ev-7a00f14f5295b2b7
