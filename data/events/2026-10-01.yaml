  summary: 2026年9月30日，公开模型社区 在 Transformers 5.18.0 版本中新增 Nemotron 3 Diarization 开源权重模型，支持流式与离线说话人分离，最多处理八位说话人，并按说话人首次出现顺序输出。这是模型与库层面的能力更新，不是独立产品发布；对
    AI 应用的含义是语音转写、会议记录、客服质检等场景可自行部署说话人分离能力，但该版本未披露任何价格、采用或客户数据，实际成本与交付影响仍待核验（推断）。
  summary_en: On September 30, 2026, public model community added the open-weight Nemotron 3 Diarization
    model in Transformers 5.18.0, supporting streaming and offline speaker diarization for up to eight
    speakers and ordering outputs by each speaker's first arrival. This is a model and library capability
    update, not a standalone product launch; for AI applications it means transcription, meeting notes
    and call-quality workflows can self-host diarization, but the release discloses no pricing, adoption
    or customer data, so cost and delivery impact remain unverified (inference).
  evidence_ids:
  - ev-2f0462cbf8089d14
  homepage: true
