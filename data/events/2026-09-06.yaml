- id: evt-e35fb9616f245c88
  project_slug: okf-agent-memory
  event_type: material_update
  occurred_at: '2026-09-05T21:26:04Z'
  discovered_at: '2026-09-06T15:36:27Z'
  signals:
  - update
  - open_source
  - adoption
  summary: 为 AI 编程代理提供 Git 原生持久记忆的开源工具，实现 Google OKF v0.2 规范，内置 MCP 服务器和渐进式披露，内存中 BM25 搜索延迟低于 300 微秒，声称减少
    80% 的 token 消耗，无需外部数据库。开发者将其集成到 AI 编码工作流中，代理可跨会话记忆项目上下文，最终减少重复输入和 token 费用。
  summary_en: An open-source tool providing Git-native persistent memory for AI coding agents, implementing
    Google OKF v0.2 with sub-300µs in-memory BM25 search, embedded MCP server, and progressive disclosure.
    It claims to slash token bloat by 80% with zero external databases. Developers integrate it into AI
    coding workflows, allowing agents to remember project context across sessions, reducing redundant
    input and token costs.
  evidence_ids:
  - ev-72fa37d84a643046
  homepage: true
