  summary: 2026年10月7日，Radisson Hotel Group 与 Accenture 合作，用 OpenAI 技术做出一个 ChatGPT 插件，让旅客在规划行程时查找、比较并预订酒店。这是酒店集团把预订入口搬进对话式助手的动作，意味着酒店分销的获客入口可能从自有官网和
    OTA 列表向对话界面分流；对 AI 应用而言，交付形态变成“插件内完成查找与预订”，竞争点从页面转化转向能否被助手调用。
  summary_en: On October 7, 2026, Radisson Hotel Group, working with Accenture, launched a ChatGPT plugin
    built on OpenAI technology that lets travelers find, compare and book hotels while planning a trip.
    A hotel group moving its booking entry point into a conversational assistant means hotel distribution
    demand may shift from brand sites and OTA listings toward chat interfaces; for AI applications the
    delivery form becomes find-and-book inside a plugin, and competition shifts from page conversion to
    being callable by the assistant.
  evidence_ids:
  - ev-0e60d3e1714b3ac3
  homepage: true
