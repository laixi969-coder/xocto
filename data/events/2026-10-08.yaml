  summary: 2026年10月6日，公开模型社区 的 Transformers 库发布 v5.19.0，新增 Google 的 EmbeddingGemma 2 多模态嵌入模型，可把文本、图像、音频、视频单独或组合编码进同一
    768 维向量空间，并支持 Matryoshka 截断到 512、256 维。这是开源库的模型接入更新，不是独立产品发布。
  summary_en: On October 6, 2026, public model community's Transformers library released v5.19.0, adding
