  signals:
  - update
  - open_source
  summary: 2026年10月5日，llama.cpp 发布 v0.6.0：新增 llama_batch_ext 扩展批处理 API（含 llama_process），支持混合 token/embedding
    输入与 MTP/deepstack 状态嵌入；新增对 GLM-5.3-Flash（GLM5-Next）320B 混合模型、Clef 决策模型（文本与视觉）的支持，并为 Qwen4Exp 加入 MTP
    投机解码；新增面向决策模型的 /v1/systemone 服务端 API；重写 Web UI 并接入模型下载管线；新增 Metal tensor-API flash attention 内核与稀疏
    flash attention。
  summary_en: 'On October 5, 2026, llama.cpp released v0.6.0: it adds the llama_batch_ext extended batch
    API (with llama_process) for mixed token/embedding inputs and MTP/deepstack state embeddings; adds
    support for the GLM-5.3-Flash (GLM5-Next) 320B hybrid model and the Clef decision model (text and
    vision), plus MTP speculative decoding for Qwen4Exp; ships a new /v1/systemone server API for decision
    models; overhauls the Web UI with a model download pipeline; and adds a Metal tensor-API flash attention
    kernel and sparse flash attention.'
  evidence_ids:
  - ev-41760887058d0598
  homepage: true
