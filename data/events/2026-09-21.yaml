  signals:
  - release
  summary: 2026年9月，乐享科技在户外直播中让搭载 Aether 以太大模型的机器人接受随机点单，完成食材与工具处理、烤制、翻面、上菜，并应对临时打断与需求增加；现场超30位媒体、线上超550万观众观看，过程中出现停顿、失败与重新调整，两台机器人本体互相传递任务信息并分工协作。公司称该模型可在部署和执行过程中持续更新，即“自进化”，但报道同时指出该说法存在争议。
  summary_en: In September 2026, Lejoy Technology livestreamed an outdoor demo in which robots running
    its Aether embodied model took random orders and handled food prep, grilling, flipping and serving
    while coping with interruptions and added requests; over 30 media outlets and more than 5.5 million
    online viewers watched, and the run included pauses, failures and readjustments, with two robot bodies
    passing task information and dividing work. The company claims the model keeps updating during deployment
    and execution, which it calls 'self-evolution', a claim the report itself flags as contested.
  evidence_ids:
  - ev-fc8b21420047d4c1
  homepage: true
