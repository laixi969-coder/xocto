- id: first-ai-promo-video-maker
  project_slug: ai-promo-video-maker
  event_type: first_discovered
  occurred_at: '2026-10-11T01:01:22Z'
  discovered_at: '2026-10-11T01:01:22Z'
  signals:
  - release
  - open_source
  - adoption
  summary: 2026 年 10 月 9 日，作者 liyupi 在开源仓库发布 ai-promo-video-maker：把产品名或网址交给 Cursor、Claude Code、Codex 等编程代理后，自动调研产品、生成多风格样图供挑选、截取
    4K 真实页面、按音乐节拍卡点剪辑、生成 AI 旁白并逐句转写校验、自动审图，最终交付一支 4K 商业宣传视频和可在线播放的网页版；基于 Remotion + ElevenLabs，可克隆使用或安装为
    Agent Skill。仓库当前 104 星、16 次 fork。
  summary_en: 'On 9 October 2026, author liyupi released the open-source repository ai-promo-video-maker:
    after a product name or URL is handed to coding agents such as Cursor, Claude Code or Codex, it researches
    the product, drafts multiple style mockups for selection, captures 4K real pages, cuts to the music
    beat, generates AI voiceover with sentence-by-sentence transcription checks, self-reviews the visuals,
    and delivers a 4K commercial promo video plus a playable web version; built on Remotion + ElevenLabs,
    it can be cloned or installed as an Agent Skill. The repository currently has 104 stars and 16 forks.'
  evidence_ids:
