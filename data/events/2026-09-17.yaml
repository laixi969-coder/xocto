  summary: 面向在应用里调用大模型和 MCP 工具的开发团队：当模型准备执行一次工具调用时，Conduct 先接收这次调用请求，按预设规则判断是否放行、拦截或改写，再把结果交回调用方。用户拿到的是被约束过的调用结果，具体规则配置与交付形态仍待核验。
