    for agent commerce that addresses authorization and identity verification when agents autonomously
    call paid APIs, buy assets or book services; Ant CEO Han Xinyi said at the same event that agent commerce
    is moving from dialogue demos to real transaction loops. The fact means authorization and liability
    for agent-initiated payments are starting to be productized separately, which may affect delivery
    boundaries and compliance costs of AI applications handling payment tasks, though no pricing, customer
    or adoption data was disclosed.
