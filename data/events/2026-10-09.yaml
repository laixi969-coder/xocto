- id: first-anthropic-launches-free-ai-security-scans-for-open-source-pr
  project_slug: anthropic-launches-free-ai-security-scans-for-open-source-pr
  event_type: first_discovered
  occurred_at: '2026-10-08T21:53:51Z'
  discovered_at: '2026-10-09T02:10:47Z'
  signals:
  - release
  summary: 2026年10月8日，Anthropic 推出 OSS Scanner，向自愿加入的开源项目提供由自家最强模型执行的免费定期安全扫描，用于更早发现潜在安全漏洞。这是模型厂商把安全扫描能力免费投向开源生态的平台级动作，不是独立产品发布；对
    AI 应用的含义是开源维护者获得一项新的免费上游安全供给，可能改变小型项目原本依赖人工审计或付费扫描的替代路径，但扫描覆盖范围与误报代价尚未披露，影响仍属推断。
  summary_en: On October 8, 2026, Anthropic launched OSS Scanner, offering opt-in open-source projects
    free periodic security scans run by its strongest models to surface potential vulnerabilities earlier.
    This is a platform-level move by a model vendor pushing security-scanning capability into the open-source
    ecosystem rather than a standalone product launch; for AI applications it means maintainers gain a
    new free upstream security supply that may displace manual audits or paid scanners for small projects,
    though scan coverage and false-positive costs are undisclosed, so the impact remains an inference.
  evidence_ids:
  - ev-f911777f470549cf
  homepage: true
