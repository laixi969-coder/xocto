    fastest and most emotive voice models yet. This is a model release rather than a standalone application;
    it raises the bar for speed and emotional expressiveness in speech synthesis, so dubbing, audio-content
    and voice-interaction apps can adopt a stronger base layer, but no pricing, latency or quality figures
    were disclosed, so cost and adoption impact remains unverified.
