  summary: 开发者在把含真实客户信息的文本或字段送进第三方大模型接口前打开它，由它把原文替换成格式一致的假数据再发出，返回结果在本地还原成真实值。用户拿到的是可继续使用的真实输出，替换与还原都在本地完成，具体支持的字段类型与还原准确度仍待核验。
  summary_en: Before sending text or fields containing real customer information to a third-party LLM
    API, a developer runs this tool to swap the originals for format-consistent fakes, then restores the
    real values locally from the returned output. The user ends up with usable real output; substitution
    and restoration happen locally, while the supported field types and restoration accuracy still need
    verification.
  evidence_ids:
  - ev-4c5e9f2d5eb40d33
  homepage: true
