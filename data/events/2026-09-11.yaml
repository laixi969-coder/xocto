    and disrupt AI-themed attacks; in the same period, Public Employee Benefits Administrators adopted
    Dynamics 365 AI agents to transform member services, Stibo Systems built a unified governed data foundation
    with Microsoft Fabric, Skyline Communications used Microsoft Foundry to help media firms automate
    operations, and H cofounder Laurent Sifre joined Microsoft.
