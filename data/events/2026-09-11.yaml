  summary: 开发者在 macOS 上同时跑多个编码代理时，Dock 旁会出现一条仿 LED 灯带，把代理的运行状态直接显示在屏幕上；用户据此判断哪个代理还在跑、哪个已经结束，不必逐个切回终端窗口查看。具体支持哪些代理、状态如何映射到灯带，公开材料未说明，仍待核验。
  summary_en: When developers run several coding agents at once on macOS, a fake LED strip beside the
    Dock shows each agent's status on screen, so the user can tell which agent is still running and which
    has finished without switching back to each terminal window. Which agents are supported and how status
    maps to the strip are not stated in the public material and remain unverified.
