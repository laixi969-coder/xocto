  summary: 这是一个可逆的隐私代理，用于 AI 代理：向外部发送逼真的假数据，同时在本地恢复原始数据。用户将真实数据交给代理，代理用假数据与外部交互，返回时恢复。交付的是保护隐私的 AI 代理交互，但具体实现和集成方式仍待核验。
  summary_en: 'This is a reversible privacy proxy for AI agents: it sends realistic fake data externally
    and restores originals locally. Users give real data to the proxy, which interacts externally with
    fake data and restores on return. The deliverable is privacy-preserving AI agent interaction, but
    specific implementation and integration methods remain to be verified.'
  evidence_ids:
