  summary: 2026年9月19日，SAIR Foundation 由陶哲轩代表宣布启动“开放数学模型计划”，主张让开放模型与可负担的算力成为数学研究的共享基石。该计划指向的是研究用模型与算力的公共供给，而非面向具体行业的独立产品；对
    AI 应用的影响在于数学等基础研究领域可能获得更低的模型与算力门槛，但计划的具体模型、算力规模、参与机构与开放许可均未在材料中披露，实际影响仍待观察。
  summary_en: On September 19, 2026, the SAIR Foundation, represented by Terence Tao, announced the launch
    of an open mathematics model initiative, framing open models and affordable compute as shared infrastructure
    for mathematical research. This concerns public provision of research models and compute rather than
    an independent industry product; it may lower model and compute barriers for basic research fields
    such as mathematics, but the specific models, compute scale, participating institutions and open licenses
    are not disclosed in the material, so the practical impact remains to be seen.
  evidence_ids:
  - ev-2b954c72eda7ab03
