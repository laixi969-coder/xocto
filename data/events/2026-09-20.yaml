- id: first-陶哲轩代表sair-foundation宣布正式启动开放数学模型计划
  project_slug: 陶哲轩代表sair-foundation宣布正式启动开放数学模型计划
  event_type: first_discovered
  occurred_at: '2026-09-19T06:44:02Z'
  discovered_at: '2026-09-20T00:09:45Z'
  signals:
