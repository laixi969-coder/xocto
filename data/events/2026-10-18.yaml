  summary: 2026年10月15日，llama.cpp 发布 v0.7.0：新增 LiliCorr 投机解码与 GLM5-Next 的 MTP 支持，并加入把 MoE 专家权重留在主机内存的 GPU
    缓存选项（--moe-cache-mib），官方称专家卸载场景下解码最高约 2.2 倍加速；同时支持 K2 Horizon、Prism Bonsai 2 27B、EmbeddingGemma-2、LiquidAI
    d1/d1-omni、MiniCPM-V 4.7、Nemotron Super 3.5 VL 等一批新模型，服务端重构了聊天会话 API。
  summary_en: 'On 15 October 2026, llama.cpp released v0.7.0: it adds LiliCorr speculative decoding and
    MTP support for GLM5-Next, plus a GPU cache option that keeps MoE expert weights in host memory (--moe-cache-mib),
    which the release claims gives up to roughly 2.2x faster decoding when experts are offloaded; it also
    adds support for K2 Horizon, Prism Bonsai 2 27B, EmbeddingGemma-2, LiquidAI d1/d1-omni, MiniCPM-V
    4.7, Nemotron Super 3.5 VL and other models, and refactors the server chat session API.'
  evidence_ids:
  - ev-f1ea1a18761a6926
