- id: first-ggerganov-llamacpp-v060
  project_slug: ggerganov-llamacpp-v060
  event_type: first_discovered
  occurred_at: '2026-10-05T16:56:22Z'
  discovered_at: '2026-10-06T02:18:35Z'
  signals:
  - release
  - open_source
  summary: 2026年10月5日，llama.cpp 发布 v0.6.0，新增 llama_batch_ext 扩展批处理 API（含 llama_process），支持混合 token/embedding
    输入与 MTP/deepstack 状态嵌入，新增 GLM-5.3-Flash（GLM5-Next）320B 混合模型、Clef 决策模型（文本与视觉）以及 Qwen4Exp 的 MTP 投机解码，并推出面向决策模型的
    /v1/systemone 服务端 API，同时重写 Web UI 的数据层与模型下载管线，新增 Metal tensor-API F16 KV flash attention 内核与稀疏 flash
    attention。
  summary_en: On 2026-10-05, llama.cpp released v0.6.0, adding the llama_batch_ext extended batch API
    (with llama_process) for mixed token/embedding inputs and MTP/deepstack state embeddings, support
    for the GLM-5.3-Flash (GLM5-Next) 320B hybrid model, the Clef decision model (text and vision), MTP
    speculative decoding for Qwen4Exp, a new /v1/systemone server API for decision models, an overhauled
    Web UI with a new data layer and model download pipeline, and a Metal tensor-API F16 KV flash attention
    kernel plus sparse flash attention.
  evidence_ids:
  - ev-5d15bace4e8d2913
  homepage: true
