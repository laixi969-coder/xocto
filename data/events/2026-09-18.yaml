  signals:
  - update
  summary: 开发者在 macOS 上同时运行多个编码智能体时，需要在终端与编辑器之间来回切换才能确认某个任务是否跑完；AI Pulse 在 Dock 旁放一条虚拟 LED 灯带，把智能体运行状态映射成灯光信号，让用户抬眼即可看到当前状态。具体支持哪些智能体、状态如何判定、是否需人工确认，公开材料未说明，仍待核验。
  summary_en: When developers run several coding agents at once on macOS, they must switch between terminal
    and editor to check whether a task has finished; AI Pulse places a virtual LED strip beside the Dock
    that maps agent status to light signals, so the user can see the current state at a glance. Which
    agents are supported, how status is determined, and whether human confirmation is needed are not stated
    in the public material and remain unverified.
  evidence_ids:
  - ev-6da4e28e4421a873
  homepage: true
