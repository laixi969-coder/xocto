  summary: 开发者在编写会调用大模型的程序时打开 Bend：它接收用该语言写好的源码，在 CPU 与 GPU 上并行执行，并在编译阶段用证明检查挡住模型生成代码里的一类错误，最终交付可运行程序；具体拦截哪些错误类型与人工复核环节仍待核验。
