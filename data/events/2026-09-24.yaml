  summary: 2026年9月23日，OpenAI 宣布将其 Daybreak 网络安全项目的访问权限扩展至乌克兰政府，用于支持民用基础设施的网络防御。这是该项目适用对象的一次新增，而非新产品发布；对
    AI 应用而言，它意味着前沿模型能力正以定向授权方式进入政府与关键基础设施防护场景，采购方是政府而非普通企业，交付依赖人工与机构协作，具体授权范围、价格与部署细节未披露（推断：此类合作会强化模型厂商在公共部门安全预算中的位置）。
