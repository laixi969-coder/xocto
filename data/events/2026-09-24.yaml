    to the Government of Ukraine to support cyber defense of civilian infrastructure. This is an expansion
    of who can use an existing program rather than a new product; for AI applications it means frontier
    model capability is entering government and critical-infrastructure defense through directed access,
    with a government buyer rather than ordinary enterprises, and delivery depending on human and institutional
    coordination. Scope, pricing and deployment details were not disclosed (inference: such arrangements
    strengthen model vendors'' position in public-sector security budgets).'
