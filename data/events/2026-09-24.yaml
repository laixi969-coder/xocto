- id: evt-a4d418d93e5d94fd
  project_slug: slate
  event_type: material_update
  occurred_at: '2026-09-23T11:01:50Z'
  discovered_at: '2026-09-24T00:30:46Z'
  signals:
  - update
  - adoption
  summary: 做 AI 影片的人在开拍前要规划镜头、保持角色与场景连贯，并把每个镜头写成图像、视频、音乐或配音生成器能用的提示词。Slate 让用户先排镜头与覆盖方式，再把这些设定编译成可直接投喂给各类生成器的提示词，不需要
    API key；最终交付是一套可复用的镜头提示词，具体生成与成片仍需用户自己在各生成器里完成，流程细节仍待核验。
  summary_en: People making AI films must plan shots and keep characters and scenes consistent before
    generating, then turn each shot into prompts that image, video, music or voice generators can use.
    Slate lets them lay out shots and coverage first and compile those settings into prompts for various
    generators without API keys; the deliverable is a reusable shot-prompt set, while actual generation
    and final cuts still happen in the user's own tools, and the exact flow needs verification.
  evidence_ids:
  - ev-304ad0a136fb0108
  homepage: true
