  summary: 2026年9月14日，Ollama 发布 v0.34.1：MLX safetensors 的 `ollama create` 结束实验状态，GGUF 模型创建改由 llama.cpp
    工具链完成 safetensors 转换与量化；Apple Silicon 上的 MLX 内存处理改进；重复 token 检测阈值提高到 100 个 token 以减少 OCR 等场景误报；大型模型库下
