  discovered_at: '2026-09-16T00:21:13Z'
  signals:
  - update
  summary: 开发者在把真实客户数据交给外部大模型接口前打开它：代理层把姓名、账号等敏感字段替换成格式一致的假值再转发给模型，模型返回后在本机把假值还原成原文，开发者拿到的是可用的模型输出，同时原始数据没有离开本地。具体还原范围与人工确认环节仍待核验。
  summary_en: 'Before sending real customer data to an external model API, a developer routes it through
    this proxy: sensitive fields such as names and account numbers are swapped for format-consistent fakes,
    the model answers on the fakes, and the originals are restored locally so the usable output comes
    back without the raw data leaving the machine. The exact restore scope and any human confirmation
    step still need verification.'
  evidence_ids:
  - ev-4caf3ac80a981a01
  homepage: true
