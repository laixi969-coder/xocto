  summary_en: 'On 2026-09-14 Ollama released v0.34.1: MLX safetensors `ollama create` left experimental
    status, GGUF model creation now requires llama.cpp tooling for safetensors conversion and quantization;
    MLX memory handling on Apple Silicon improved; runaway repeat-token detection now needs 100 repeat
    tokens to cut false positives such as OCR; `/api/tags` cold start on large model libraries dropped
    from 3.1 s to 294 ms; `typical_p` was deprecated.'
