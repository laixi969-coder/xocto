  summary: 开发者于 2026 年 9 月在社区发帖称，自研指纹浏览器 Stonelogin 上线一个多月零流量，并公开一批一个月试用兑换码；其自述基于修改后的谷歌内核实现多环境指纹隔离，称通过
    pixelscan 检测，同步器速度对标 MoreLogin、AdsPower，定价更低，后续计划加入 MCP。
  summary_en: In September 2026 the developer posted that Stonelogin, a self-built fingerprint browser,
    had been live for over a month with no traffic, and released a batch of one-month trial codes; he
    states it is built on a modified Chromium kernel with multi-environment fingerprint isolation, claims
    it passes pixelscan checks, matches MoreLogin and AdsPower on sync speed at a lower price, and plans
    MCP support later.
  evidence_ids:
  - ev-6d79a4c25ba1156a
