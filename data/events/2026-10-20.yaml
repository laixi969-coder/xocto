  summary: 2026年10月19日，开发者在社区发布非官方 ZCode Android 客户端，可扫码绑定多台桌面开发机，并在同一 Wi-Fi 下用 PC 浏览器打开手机端启动的群控台，以单屏、双列或四宫格查看多个
