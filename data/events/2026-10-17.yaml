- id: evt-9a2aef66db6d6fe0
  project_slug: media
  event_type: material_update
  occurred_at: '2026-10-16T14:02:18Z'
  discovered_at: '2026-10-17T00:30:21Z'
  signals:
  - update
  summary: 作者 chaxiu 公开一项为期 7 天的实验：用自研本地运行时 Munk AI 调度 Gemini 4 与 DeepSeek 两类模型，把 1000 美元 Token 预算按 800/200
    拆分，让 AI 员工运营一家软件公司，目标是 7 天内做出 Beyond Compare 的免费开源替代品 OpenCompare；截至 Day 3 已加入「企业文化」模块并收集 FTP 远端对比等新需求。
  summary_en: Author chaxiu is running a public 7-day experiment in which a self-built local runtime,
    Munk AI, orchestrates Gemini 4 and DeepSeek models with a $1,000 token budget split $800/$200, letting
    AI workers run a software company with the goal of shipping OpenCompare, a free open-source alternative
    to Beyond Compare, within 7 days; by Day 3 a 'company culture' module was added and new requests such
    as FTP remote comparison were collected.
  evidence_ids:
  - ev-190736aacb841e72
  homepage: true
