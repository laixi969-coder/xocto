    (120B parameters, 12B active per token, tool calling, up to 1M context) and the smaller Nemotron 3.5
    Bolt (74B parameters, 9B active, sized for a 24GB GPU), launched cloud decision models clef:cloud
    and clef-flash:cloud that run without pulling models locally, fixed an error when continuing OpenAI-compatible
    Responses conversations with custom tool calls, and updated llama.cpp and MLX.'
