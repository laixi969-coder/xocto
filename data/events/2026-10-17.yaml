    1M 上下文）及精简版 Nemotron 3.5 Bolt（74B 参数、9B 激活、面向 24GB 显存）的支持，并上线云端决策模型 clef:cloud 与 clef-flash:cloud，可不在本地拉取模型直接调用；同时修复了含自定义工具调用的
