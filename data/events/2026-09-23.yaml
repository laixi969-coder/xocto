  project_slug: blog-7
  event_type: material_update
  occurred_at: '2026-09-22T19:40:42Z'
  discovered_at: '2026-09-23T00:34:44Z'
  signals:
  - update
  summary: 2026年9月18日，一名开发者发布逆向工程分析，称智谱官方 AI 编程桌面应用 ZCode 在用户登录状态下把整个工作区（含完整 .git 历史、源码与全局配置）打包加密上传至阿里云
    OSS，加密私钥仅存于智谱云端，本地无法解密；界面上的两个开关只控制数据授权与服务端索引，本地打包上传无 gating 逻辑。
  summary_en: On 18 September 2026 a developer published a reverse-engineering analysis claiming that
    Zhipu's official AI coding desktop app ZCode silently packages and encrypts the entire workspace (including
    full .git history, source code and global config) and uploads it to Alibaba Cloud OSS while the user
    is logged in; the decryption key exists only on Zhipu's servers, and the two UI toggles control only
    data authorisation and server-side indexing, with no gating logic on the local packaging and upload.
  evidence_ids:
  - ev-299b2dd1e4f4c0d9
  homepage: true
