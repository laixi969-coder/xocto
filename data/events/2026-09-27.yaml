  discovered_at: '2026-09-27T00:36:53Z'
  signals:
  - release
  summary: 2026年9月26日，高通发布骁龙X2，宣称支持三大操作系统并面向“智能体PC”。这是芯片平台层的发布，不是独立AI应用产品；对AI应用的含义是端侧可承载的智能体运行环境可能扩大，但具体算力、价格与终端上市时间在候选材料中未给出，影响仍待核验。
  summary_en: On September 26, 2026, Qualcomm announced Snapdragon X2, claiming support for three operating
    systems and positioning it for "agentic PCs." This is a chip-platform launch rather than a standalone
    AI application; for AI applications it may widen the on-device environment able to host agents, but
    the candidate material gives no compute, pricing or device ship dates, so the impact remains unverified.
  evidence_ids:
  - ev-7f619b40247d3730
