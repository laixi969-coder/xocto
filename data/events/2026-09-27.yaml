  summary: 2026年9月25日，微软发布新版 Copilot，将聊天、编程与智能体运行合并为一个应用。该变化意味着通用助手入口进一步向平台级整合，第三方单点助手在分发与默认入口上的竞争空间被压缩；这是推断，公开材料未给出定价、客户或采用数据。
