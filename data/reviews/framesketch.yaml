  market: ''
  job: 教练、剪辑师或培训师在逐帧检查比赛或素材时，处理视频画面，要把某个动作或修改点准确指给队员、导演或学员看。
  job_en: A coach, editor or trainer reviewing footage frame by frame works on video frames to point a
    specific motion or fix out to players, directors or trainees.
  pain: 口头描述或截图圈画难以对齐到具体帧，来回解释耗时，接收方仍可能理解错位置和时机。
  pain_en: Verbal description or screenshot markup rarely aligns to the exact frame, so back-and-forth
    explaining costs time and the receiver may still misread position and timing.
  current_alternative: 用通用剪辑软件暂停截图，再在图片上标注或口头讲解，或导出片段加文字说明。
  current_alternative_en: Pausing in general editing software to screenshot, then marking the image or
    explaining verbally, or exporting clips with written notes.
  usage_reason: 相较截图再标注，它在播放器内直接停在目标帧并即时手绘，省掉导出与二次标注这一步，让讲解与画面同步；推断，尚无用户反馈或留存证据。
  usage_reason_en: Compared with screenshot-then-mark, it pauses on the target frame inside the player
    and draws immediately, removing the export and second-pass annotation step so explanation stays in
    sync with the image; inference, with no user feedback or retention evidence yet.
