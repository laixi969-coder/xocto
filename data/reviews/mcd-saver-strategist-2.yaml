  market: ''
  job: 消费者在麦当劳点餐前，把当前菜单和手上可用的优惠券交给助手，要求算出一份最省钱的点餐组合，再按方案自行下单。
  job_en: Before ordering at McDonald's, a consumer gives the assistant the current menu and their available
    coupons, asks for the cheapest order combination, and then places the order themselves.
  pain: 麦当劳优惠券种类多、叠加规则与套餐组合复杂，用户逐张比对券和单品价格容易漏掉更省的组合，点完才发现多花钱；这是高频小额消费中的比价负担。
  pain_en: McDonald's coupons are numerous with complex stacking and combo rules; comparing each coupon
    against item prices by hand easily misses the cheapest combination, so users overpay and only notice
    afterward. This is a recurring comparison burden in frequent small purchases.
  current_alternative: 用户目前靠人工翻看 App 内优惠券、凭经验拼套餐，或在社交平台搜现成省钱攻略，逐项心算比价。
  current_alternative_en: Users currently scroll coupons in the app, assemble combos from experience,
    or search social platforms for ready-made saving tips, comparing prices mentally item by item.
  usage_reason: 推断：相较人工逐张比对，它一次性拉取菜单与全部可用券并直接输出最省组合（公开示例为巨无霸套餐 ¥47→¥21.9），省去用户自己枚举组合和心算的步骤，因此对价格敏感、点单前愿意多花一分钟比价的消费者有吸引力。
  usage_reason_en: 'Inference: unlike manual coupon-by-coupon comparison, it pulls the menu and all available
    coupons at once and outputs the cheapest combination (public example: Big Mac meal ¥47→¥21.9), removing
    the step of enumerating combos and doing mental math, which appeals to price-sensitive consumers willing
    to spend an extra minute before ordering.'
