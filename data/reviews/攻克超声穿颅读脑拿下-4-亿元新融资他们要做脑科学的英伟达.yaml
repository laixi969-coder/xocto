  market: ''
  job: 急诊医生在救护车或卒中中心面对疑似脑梗或脑出血患者时，需要在无法立即做CT的情况下快速判断颅内出血还是缺血；脑机接口研究人员需要非侵入地实时获取全脑功能数据。
  job_en: An emergency physician facing a suspected stroke patient in an ambulance or stroke center must
    quickly judge hemorrhage versus ischemia when CT is not immediately available; brain-computer interface
    researchers need non-invasive real-time whole-brain functional data.
  pain: 颅骨会强烈衰减高频声波，传统超声穿颅后图像模糊，医生只能依赖CT或转诊，延误黄金救治时间；脑功能数据采集则受限于侵入式电极或大型设备。
  pain_en: The skull strongly attenuates high-frequency sound, so conventional ultrasound images blur
    after penetration, forcing clinicians to rely on CT or transfer and losing golden treatment time;
    brain-function data collection is limited to invasive electrodes or large equipment.
  current_alternative: 急诊依赖CT和转诊流程，脑研究依赖fMRI、侵入式电极或海外旗舰彩超设备。
  current_alternative_en: Emergency care relies on CT and transfer workflows; brain research relies on
    fMRI, invasive electrodes, or overseas flagship color ultrasound systems.
  usage_reason: 推断：相较等待CT或转诊，鲲为把低频穿透与算法重建结合，在床旁几分钟内给出可判读的颅内图像，减少一次转运和等待环节，因此急救与卒中场景的医生会在设备可及且判读被认可时选择它；目前缺少临床验证与采购证据。
  usage_reason_en: 'Inference: compared with waiting for CT or transfer, Kunwei combines low-frequency
    penetration with algorithmic reconstruction to give a readable intracranial image at bedside within
    minutes, removing one transport and waiting step, so emergency and stroke clinicians would choose
    it where the device is available and readings are accepted; clinical validation and procurement evidence
    are currently lacking.'
