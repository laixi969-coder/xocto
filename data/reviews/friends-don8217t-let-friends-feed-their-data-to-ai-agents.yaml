  next_validation: 收集 Meta 官方 Muse 隐私政策与数据授权说明页面，核验第三方联系人数据的采集范围、同意与撤回机制。
  market: ''
  job: 普通手机用户在需要快速查信息、起草回复或整理联系人时，把通讯录、聊天与社交关系交给 Meta Muse，由它检索并生成可直接使用的答复或整理结果。
  job_en: Everyday phone users who need to look up information, draft replies or organise contacts hand
    their address books, chats and social relationships to Meta Muse, which retrieves and produces ready-to-use
    replies or organised results.
  pain: 手动翻聊天记录、回忆联系人背景、逐条起草回复耗时；同时把朋友和家人的信息交给助理会带来未经同意的隐私暴露，用户缺少可撤回的授权手段。
  pain_en: Manually scrolling chat history, recalling contact context and drafting replies one by one
    is slow; handing friends' and family members' information to an assistant also creates privacy exposure
    without their consent, and users lack a revocable authorisation mechanism.
  current_alternative: 用户此前靠系统通讯录、聊天搜索、备忘录和手动打字完成同样任务，隐私顾虑则靠不使用或事后删除记录来回避。
  current_alternative_en: Users previously relied on the system address book, chat search, notes and manual
    typing for the same tasks, and avoided privacy concerns by not using such tools or deleting records
    afterwards.
  usage_reason: 推断：相较手动翻找和逐条起草，Muse 直接读取通讯录与聊天上下文并生成可发送的回复，省掉检索与组织语言这一步；已下载数百万次并登顶 App Store 说明大量用户在真实场景中选择它，但第三方同意机制与长期留存仍缺少公开证据。
  usage_reason_en: 'Inference: compared with manual searching and drafting, Muse reads contacts and chat
    context directly and produces sendable replies, removing the retrieval and wording step; millions
    of downloads and a top App Store ranking show many users choose it in real scenarios, though third-party
    consent mechanics and long-term retention lack public evidence.'
