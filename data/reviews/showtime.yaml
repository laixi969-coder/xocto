  market: ''
  job: 开发者或内容创作者在需要为项目、产品做演示或说明视频时，用一句话描述需求，由编码代理编排、本机渲染出成片。
  job_en: Developers or content creators who need a demo or explainer video for a project describe it
    in one sentence, and a coding agent directs while the local machine renders the video.
  pain: 做演示视频通常要学剪辑软件或外包，耗时且与写代码的节奏脱节；候选材料未给出用户抱怨或替代行为的直接证据。
  pain_en: Making a demo video usually means learning editing software or outsourcing, which is slow and
    out of step with coding; the candidate material gives no direct evidence of user complaints or workarounds.
  current_alternative: 手工用剪辑软件制作，或外包给视频制作者，或干脆不做视频。
  current_alternative_en: Editing manually in video software, outsourcing to a video producer, or skipping
    the video entirely.
  usage_reason: 推断：相较手工剪辑，它把“写脚本—找素材—剪辑—导出”压缩成一句话描述加本机渲染，省掉剪辑软件的学习与操作步骤，因此需要快速产出演示视频的开发者可能选择它；但材料未提供用户反馈或重复使用证据。
  usage_reason_en: 'Inference: compared with manual editing, it compresses scriptwriting, asset gathering,
    cutting and exporting into a one-sentence prompt plus local rendering, removing the editing-software
    learning and operation steps, so developers needing quick demo videos may choose it; however, no user
    feedback or repeat-use evidence is provided.'
