  market: ''
  job: 销售开发代表和市场运营人员在准备外呼或投放名单时，处理分散在多个数据源的公司与联系人信息，要产出一份可直接导入 CRM 或序列工具的合格线索名单。
  job_en: Sales development reps and marketing ops staff preparing outbound or campaign lists work with
    company and contact data scattered across sources, and need a qualified lead list that can be imported
    into a CRM or sequencing tool.
  pain: 手工在多个数据源之间核对公司规模、职位、技术栈和触发信号既慢又容易出错，名单质量差会直接浪费外呼时间和投放预算。
  pain_en: Manually cross-checking company size, title, tech stack and trigger signals across sources
    is slow and error-prone, and poor list quality directly wastes calling time and ad budget.
  current_alternative: 旧做法是购买静态联系人数据库，再让销售或运营在表格里手工筛选、去重和补字段，或雇外包做名单清洗。
  current_alternative_en: The old way is buying a static contact database, then having sales or ops manually
    filter, dedupe and fill fields in spreadsheets, or outsourcing list cleaning.
  usage_reason: 推断：相较买静态名单再手工清洗，Clay 把多个数据源的补全和筛选规则放在同一处执行，减少逐条核对字段这一步，因此需要按行业信号持续产出名单的销售团队会在名单质量要求高、更新频繁时选择它；候选材料未提供留存或复购证据。
  usage_reason_en: 'Inference: compared with buying a static list and cleaning it by hand, Clay runs enrichment
    and filtering rules from multiple sources in one place, removing the step of checking fields row by
    row, so sales teams that need recurring signal-based lists would pick it when list quality matters
    and lists refresh often; the candidate material provides no retention or repeat-purchase evidence.'
