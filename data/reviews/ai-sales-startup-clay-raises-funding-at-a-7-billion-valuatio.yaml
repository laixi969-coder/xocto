  market: ''
  job: 销售开发代表和销售运营在准备每周外呼名单时，要处理分散在多个数据源的公司信息、联系人字段和触发事件，最终产出一份可直接外呼或发邮件的目标客户名单。
  job_en: SDRs and sales ops preparing weekly outbound lists handle company data, contact fields and trigger
