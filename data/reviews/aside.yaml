  pain_en: Public material only offers 'works across your websites and accounts' and 'do real work for
    you'; the reconstructable pain is that cross-site tasks require repeated switching between logged-in
    states and step-by-step manual clicking, which is long and interruption-prone. No user quotes or complaints
