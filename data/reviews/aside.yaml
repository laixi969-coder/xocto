  current_alternative: 当前替代方式是普通浏览器加通用 AI 助手：用户自己在标签页间切换、手动登录各站点，再把页面内容复制给聊天式助手，由助手给出建议而由用户自己执行点击。
  current_alternative_en: 'The current alternative is a normal browser plus a general AI assistant: the
    user switches tabs, logs into each site manually, pastes page content into a chat assistant, and then
    performs the clicks themselves based on the assistant''s suggestions.'
  usage_reason: 相较“浏览器+聊天助手”的旧做法，Aside 把执行动作放进浏览器本身，直接跨已登录的网站与账号操作，减少用户手动切换标签、复制粘贴和逐步点击这一段负担；因此当任务需要跨多个已登录站点连续操作时，这类用户会倾向选择它。这是基于产品能力与旧流程对照的推断，尚无用户反馈或留存证据支持。
  usage_reason_en: Compared with the browser-plus-chat-assistant routine, Aside puts execution inside
    the browser itself and operates across already logged-in sites and accounts, removing the manual tab-switching,
    copy-pasting and step-by-step clicking burden; users facing tasks that span several logged-in sites
