  market: ''
  job: 开发者在用编码代理执行多步任务（如批量重构、迁移、连续修 bug）时，需要一份代理能读写、跨会话保留的任务清单，让代理知道还剩哪些步骤。
  job_en: While running multi-step tasks with a coding agent (bulk refactors, migrations, chained bug
    fixes), developers need a task list the agent can read and write and that survives across sessions,
    so the agent knows which steps remain.
  pain: 代理会话结束后任务状态丢失，开发者要手工把待办和进度重新贴回上下文，长任务容易漏步或重复劳动。
  pain_en: Task state is lost when an agent session ends, forcing developers to paste to-dos and progress
    back into context by hand; long tasks risk skipped or repeated steps.
  current_alternative: 现在多靠手工维护 markdown 待办、在对话里反复复述进度，或让代理自己生成一份临时计划文件。
  current_alternative_en: Today this is mostly handled by hand-maintained markdown to-do files, restating
    progress in the conversation, or letting the agent generate a throwaway plan file.
  usage_reason: 推断：相较手工复述进度，它把任务清单做成代理可直接调用的接口，省掉每次会话重新交代待办这一步，因此常跑长任务的开发者会在多步任务开始时接入它。公开材料未显示留存或复购证据。
  usage_reason_en: 'Inference: versus restating progress by hand, it exposes the task list as an interface
    the agent can call directly, removing the step of re-briefing to-dos each session, so developers running
    long tasks would wire it in at the start of multi-step work. Public material shows no retention or
    repeat-use evidence.'
