  market: ''
  job: 开发团队需要快速将想法转化为可运行的代码，并多人协作调整。
  job_en: Development teams need to quickly turn ideas into runnable code and collaborate on adjustments.
  pain: 传统编码需要手动编写大量代码，协作时版本冲突和沟通成本高。
  pain_en: Traditional coding requires manual code writing, and collaboration suffers from version conflicts
    and high communication overhead.
  current_alternative: 使用 公开代码仓库 Copilot 等单人生成工具，或通过 Git 分支管理协作，但缺乏实时同步。
  current_alternative_en: Using single-user generation tools like public code repository Copilot, or collaborating
    via Git branches, but lacking real-time sync.
  usage_reason: 多人实时协作能减少等待和冲突，适合快速原型和团队 hackathon，但付费意愿和留存尚未核验。
  usage_reason_en: Real-time multi-user collaboration reduces waiting and conflicts, suitable for rapid
    prototyping and team hackathons, but willingness to pay and retention are not yet verified.
