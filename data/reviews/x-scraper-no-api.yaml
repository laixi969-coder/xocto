  market: ''
  job: 增长或舆情研究人员在需要长期跟踪某些 X 账号、关键词或时间线时，把散落的推文和搜索结果整理成可分析的数据集。
  job_en: Growth or sentiment researchers who must track certain X accounts, keywords or timelines over
    time turn scattered tweets and search results into an analysable dataset.
  pain: 官方接口收费且额度受限，手工复制粘贴无法规模化，第三方抓取服务又要求交出账号或按量付费。
  pain_en: Official APIs are paid and rate-limited, manual copying does not scale, and third-party scraping
    services require handing over accounts or paying per volume.
  current_alternative: 购买官方 API 额度、使用付费第三方抓取服务，或人工复制粘贴并整理表格。
  current_alternative_en: Buying official API quota, using paid third-party scraping services, or manually
    copying and pasting into spreadsheets.
  usage_reason: 推断：它用使用者自己的浏览器会话在本地完成抓取并直接导出结构化文件，省掉了申请 API 额度或把账号交给第三方这一步，因此预算有限、又需要持续取数的研究或增长人员会在自建流程时选择它；尚无留存或复购证据。
  usage_reason_en: 'Inference: it scrapes locally through the user''s own browser session and exports
    structured files directly, removing the step of applying for API quota or handing accounts to a third
    party, so budget-constrained researchers or growth staff who need continuous data may choose it when
    building their own pipeline; there is no retention or repeat-use evidence yet.'
