  market: ''
  job: 开发者在本地改完一批代码、准备提交或开 PR 前，把待评审的 diff 交给 AI 编码代理，由代理按阶段做质量检查，结果汇总到本地看板供人工确认后再提交。
  job_en: Before committing or opening a PR, a developer hands the pending diff to an AI coding agent,
    which runs staged quality checks and aggregates results into a local dashboard for human confirmation.
  pain: 提交前评审是高频且不可跳过的环节：人工逐行读 diff 耗时，纯靠人眼容易漏掉边界与回归问题；把改动直接丢给通用 AI 助手又缺少分阶段、可复核的检查结构，评审结论散落在对话里无法沉淀。
  pain_en: 'Pre-commit review is a high-frequency, hard-to-skip step: reading diffs line by line is slow
    and error-prone, while dumping changes into a general AI assistant lacks staged, reviewable structure
    and leaves findings scattered in chat.'
  current_alternative: 当前替代是人工逐行读 diff、依赖 CI 静态检查与 linter、或在 PR 里等同事评审；也有人直接把 diff 贴进通用 AI 对话让模型泛泛点评。
  current_alternative_en: Today developers read diffs manually, rely on CI static checks and linters,
    wait for colleague review in the PR, or paste the diff into a general AI chat for loose commentary.
  usage_reason: 推断：相较人工逐行读 diff 或把 diff 贴进通用对话，它把评审拆成固定阶段并由代理执行，结果落到本地看板，开发者不必自己组织检查顺序、也不必在对话记录里翻找结论，因此会在提交前需要一次结构化自检时选择它；但公开材料尚无用户反馈证明这一动机。
  usage_reason_en: 'Inference: versus reading diffs manually or pasting them into a general chat, it fixes
    the review into staged agent-run checks and lands results in a local dashboard, so the developer no
    longer has to sequence the checks or hunt through chat history; public materials do not yet show user
    feedback confirming this motive.'
