  market: ''
  job: 开发者在提交代码前，需要让 AI 编码代理对本次改动做分阶段质量评审，并在本地看板中查看结果后决定是否提交。
  job_en: Before committing, developers need an AI coding agent to run staged quality review on the change
    and to inspect the results in a local dashboard before deciding whether to commit.
  pain: AI 生成的代码量增加后，人工逐行评审跟不上，评审标准散落在个人习惯里，容易漏掉质量问题。
  pain_en: As AI-generated code volume grows, line-by-line human review cannot keep up, and review standards
    scattered across individual habits let quality issues slip through.
  current_alternative: 目前多依赖人工代码评审、CI 静态检查或通用编码助手附带的自查提示，缺少把评审阶段和标准固定下来的流程。
  current_alternative_en: Today teams mostly rely on manual code review, CI static checks, or ad-hoc self-check
    prompts inside general coding assistants, with no fixed review stages or standards.
  usage_reason: 推断：相较人工逐行评审，它把评审拆成阶段并交给代理执行，开发者只需在本地看板确认结果，减少的是逐行通读这一步负担；对频繁使用 AI 编码代理、又需要保留评审记录的团队更可能被选用。
  usage_reason_en: 'Inference: compared with line-by-line manual review, it splits review into stages
    executed by an agent, so developers only confirm results in a local dashboard, removing the burden
    of reading every line; teams that heavily use AI coding agents and need review records are more likely
    to adopt it.'
