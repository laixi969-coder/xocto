    it replaces.
  usage_reason: 推断：相较提交后等 CI 或人工通读，它把评审动作前移到本地提交前，由代理按阶段执行检查并把结果集中到本地看板，减少等待反馈和人工逐行筛查这一步，因此在意提交前质量把关的开发者会在本地开发时选用它。
  usage_reason_en: 'Inference: versus waiting for post-commit CI or reading everything manually, it moves
    review before the local commit, has the agent run staged checks and centralizes results in a local
    dashboard, removing the wait for feedback and manual line-by-line screening — so developers who care
    about pre-commit quality control would adopt it during local development.'
