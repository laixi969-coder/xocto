  market: ''
  job: 开发者在本地提交代码前，把待评审的改动交给 AI 编码代理，由代理按阶段做质量检查，结果汇总到本地看板供人工确认后再提交。
  job_en: Before committing locally, developers hand pending changes to an AI coding agent that runs staged
    quality checks and aggregates results into a local dashboard for human confirmation.
  pain: AI 编码代理产出改动的速度已超过人工逐行审阅的速度，提交前缺少可复现、分阶段的质量把关，容易把未审阅的改动直接推入主干；公开材料只说明它是本地优先的 MCP 评审插件，未给出缺陷率或返工代价的量化数据。
  pain_en: AI agents now produce changes faster than humans can line-by-line review them, and there is
    no reproducible staged quality gate before commit, so unreviewed changes can reach the main branch;
    public materials only describe a local-first MCP review plugin and give no quantified defect or rework
    cost.
  current_alternative: 旧做法是人工逐行读 diff、依赖 CI 或 PR 评审在提交后才拦截问题，或让 AI 代理一次性输出评审意见而不分阶段、不留本地看板记录。
  current_alternative_en: The old way is reading diffs line by line, relying on CI or PR review to catch
    problems only after commit, or having the agent emit a one-shot review with no staged structure and
    no local dashboard record.
  usage_reason: 推断：相较提交后由 CI/PR 拦截或人工逐行读 diff，它把评审前移到提交前，由代理按阶段执行检查并把结果落到本地看板，减少“先提交再返工”这一步；本地优先意味着代码不出本机，因此在意改动不外传、又想让
    AI 代理承担首轮评审的开发者会在提交前选择它。
  usage_reason_en: 'Inference: versus post-commit CI/PR gating or manual line-by-line diff reading, it
    moves review before commit, has the agent run staged checks and writes results to a local dashboard,
    removing the commit-then-rework step; local-first means code never leaves the machine, so developers
    who want AI agents to do first-pass review without shipping changes off-box would pick it before committing.'
