  market: ''
  job: 开发者在同时运行多个 Claude Code 代理时，需要集中查看各代理的执行状态并做调度。
  job_en: Developers running several Claude Code agents at once need to view each agent's execution state
    and coordinate them in one place.
  pain: 多代理并行时状态分散，难以判断哪个代理在做什么、是否卡住。
