  market: ''
  job: 品牌或公关团队在评估内容投放效果时，需要知道自家页面是否被 AI 回答引用、被哪些竞品来源挤掉。
  job_en: Brand or PR teams evaluating content performance need to know whether their pages are cited
    in AI answers and which competitor sources displace them.
  pain: 旧做法只看搜索排名和点击，AI 回答不产生点击，团队无法判断内容是否被模型采用，投放效果出现盲区。
