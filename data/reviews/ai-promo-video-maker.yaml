  market: ''
  job: 独立开发者、SaaS 或课程团队在发布新品时，需要把产品页面、截图和卖点整理成一支能对外投放的宣传片，用于官网、社媒和发布渠道。
  job_en: Indie developers, SaaS or course teams launching a new product need to turn product pages, screenshots
    and selling points into a promo video for their site, social channels and launch posts.
  pain: 过去要么自己学剪辑软件花数天做一支片，要么按条外包给剪辑师，沟通成本高、改稿慢，且产品页面更新后视频往往来不及同步。
  pain_en: Previously they either spent days learning editing software for one video or outsourced per
    video to an editor, with high communication cost, slow revisions, and videos that lag behind product
    page updates.
  current_alternative: 自己用剪辑软件手工做，或按条付费找剪辑外包；也有用通用视频生成工具，但需要自己准备素材、脚本和卡点。
  current_alternative_en: Editing by hand in video software, or paying an editor per video; some use generic
    video generators but still prepare assets, scripts and beat timing themselves.
  usage_reason: 推断：相较手工剪辑或外包，它把调研、截图、卡点、配音、审图串成一次代理执行，用户只需确认需求和试听配乐，省掉的是逐帧剪辑与来回改稿这一步，因此发布节奏紧、预算不足以长期外包的小团队会优先试它。
  usage_reason_en: 'Inference: compared with hand editing or outsourcing, it chains research, capture,
    beat-cutting, voiceover and visual review into one agent run, leaving the user only to confirm requirements
    and audition music, removing frame-by-frame editing and revision rounds, so small teams with tight
    launch schedules and no budget for ongoing outsourcing would try it first.'
