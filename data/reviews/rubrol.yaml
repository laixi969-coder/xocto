  market: ''
  job: 需要批量生成 PDF 的工程团队，在出账单、报表或面单时把结构化数据套进模板，需要稳定、快速地拿到可下载的 PDF 文件。
  job_en: Engineering teams that generate PDFs in bulk take structured data into templates when producing
