    scaling cost rises with generation volume.
  current_alternative: 用 Headless Chrome 或 wkhtmltopdf 渲染 HTML 模板，或采购商业报表引擎。
  current_alternative_en: Rendering HTML templates with Headless Chrome or wkhtmltopdf, or buying a commercial
    reporting engine.
  usage_reason: 推断：若 Typst 渲染确实把单次生成压到毫秒级，团队可减少为渲染单独扩容的机器和排队等待，因此高频出 PDF 的后端团队会在生成量上来后选择它；但 10 毫秒是发布方宣称，缺少独立实测与客户案例。
