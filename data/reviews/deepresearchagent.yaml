  market: ''
  job: 做行业调研的分析师或咨询顾问，在需要把散落的公开网页材料整理成一份带引用的调研初稿时打开它：agent 先规划检索步骤，再搜索网页、归集证据与上下文，中断后可续跑，最后输出带引用的报告，人工仍需核对引用是否成立。
  job_en: 'Analysts or consultants doing industry research open it when they need to turn scattered public
    web material into a cited first-draft research report: the agent plans search steps, searches the
    web, collects evidence and context, resumes interrupted runs, and outputs a cited report that a human
    still has to verify.'
  pain: 公开事实只说明它规划检索、归集证据、可续跑并生成带引用报告；据此可推断的痛点是：人工逐页检索、摘录、维护引用与上下文，以及长任务中断后重跑，都是重复且易丢证据的负担。公开材料未给出频率、耗时或返工代价的量化数据，此判断属工作流结构推理。
  pain_en: Public facts only show that it plans searches, collects evidence, resumes runs and generates
    cited reports; the inferred pain is that manually searching page by page, excerpting, maintaining
    citations and context, and re-running long tasks after interruption are repetitive and lose evidence.
    Public material gives no quantified frequency, time cost or rework cost; this is workflow-structure
    inference.
  current_alternative: 旧做法是分析师或顾问自己用搜索引擎逐条检索、手工摘录到文档、自行维护引用与上下文，长任务中断后从头或从断点人工重跑；公开材料未说明它实际替代了哪套具体工具链。
  current_alternative_en: The old way is for the analyst or consultant to search engine by engine, excerpt
    manually into a document, maintain citations and context by hand, and manually restart long tasks
    after interruption; public material does not say which concrete toolchain it replaces.
  usage_reason: 推断：相较手工逐页检索与摘录，它把检索规划、证据归集和上下文管理交给 agent 执行，并在中断后续跑，减少重新检索与重建上下文这一步负担，产出带引用的报告初稿供人工核对；因此需要快速拿到可核查初稿的分析师或顾问会在这种情况下选择它。公开材料未提供用户反馈或客户案例，动机为推断。
  usage_reason_en: 'Inference: versus manual page-by-page searching and excerpting, it delegates search
    planning, evidence collection and context management to the agent and resumes after interruption,
    removing the burden of re-searching and rebuilding context, and produces a cited draft for human verification;
    analysts or consultants who need a checkable first draft would choose it in that situation. Public
    material provides no user feedback or customer case, so the motive is inferred.'
