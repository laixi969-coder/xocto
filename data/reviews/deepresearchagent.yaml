  market: ''
  job: 分析师或咨询顾问在需要快速产出带引用的行业调研初稿时，把公开网页材料交给 agent 检索、整理证据并生成可核查报告。
  job_en: Analysts or consultants who need a cited first-draft industry research report hand public web
    material to the agent to search, organize evidence and produce a checkable report.
  pain: 人工检索要反复开标签页、复制粘贴来源、手动整理引用，长任务中断后要重做，引用与结论容易对不上。
  pain_en: Manual research means endless tabs, copy-pasted sources and hand-built citations; long runs
    restart from scratch after interruption and citations often drift from conclusions.
  current_alternative: 人工用搜索引擎加文档工具逐条摘录，或使用闭源大厂的研究功能，前者慢且难审计，后者不可自托管、证据链不透明。
  current_alternative_en: People hand-pick sources with a search engine plus a document tool, or use a
    closed big-vendor research feature; the former is slow and hard to audit, the latter cannot be self-hosted
    and hides its evidence chain.
  usage_reason: 相较人工逐条摘录，它把检索规划、证据归集和引用生成串成一次可续跑的运行，减少中断重做和手工整理引用这两步负担；推断：需要可审计来源的投研、咨询或尽调人员会因此选择它，但公开材料尚无付费或持续使用证据。
  usage_reason_en: 'Compared with hand-picking sources, it chains search planning, evidence collection
    and citation generation into one resumable run, cutting the rework after interruption and the manual
    citation step; inference: research, consulting or due-diligence users who need auditable sources would
    pick it, though public material shows no payment or repeat-use evidence yet.'
