  market: ''
  job: AI agent 开发者或研究者需要评估、演示或训练 agent 在连续决策环境中的表现时，把 agent 接入 bot-crossing 这个游戏世界，让它接收状态、输出动作，完成过马路等任务，从而观察其决策质量。
  job_en: AI agent developers or researchers evaluating, demoing, or training an agent's sequential decision-making
    connect the agent to the bot-crossing game world, letting it receive state and emit actions to complete
    tasks such as crossing, so they can observe decision quality.
  pain: 公开材料只给出“A video game for AI agents”这一句产品定位，没有用户抱怨、失败案例或替代成本记录；从工作流结构推断，agent 评测通常需要自建环境、写适配层并自行记录结果，这一步是重复且耗时的负担，但公开证据未量化其频率与代价。
  pain_en: Public material offers only the one-line positioning 'A video game for AI agents', with no
    user complaints, failure cases, or cost-of-alternative records; by workflow inference, agent evaluation
    usually requires building an environment, writing an adapter layer, and logging results manually,
    a repetitive burden whose frequency and cost are not quantified in public evidence.
  current_alternative: 公开材料未说明用户当前用什么替代；结构上可推断的旧做法是自建玩具环境、使用通用 benchmark 套件，或直接在真实应用中试错，但这些替代方式均未被项目证据确认。
  current_alternative_en: Public material does not state what users currently use instead; structurally
    inferable alternatives are self-built toy environments, generic benchmark suites, or trial-and-error
    in real applications, none of which is confirmed by project evidence.
  usage_reason: 推断：相较自建环境需要自己写状态接口、动作解析和结果记录，bot-crossing 以现成游戏世界接收 agent 动作并返回反馈，减少了搭建与维护评测环境这一步；因此需要快速演示或横向比较
    agent 决策能力的开发者，在缺少现成环境时会选择它。该因果为工作流结构推理，尚无用户反馈或案例佐证。
