  market: ''
  job: 开发者在本地开发机上并行运行多个编码代理，需要把每个代理的代码改动、分支和终端会话分开管理，最后合并成可提交的改动。
  job_en: Developers running multiple coding agents in parallel on local dev boxes need to keep each agent's
    code changes, branches and terminal sessions separate, then merge them into committable changes.
  pain: 多个代理同时改同一份工作区会互相覆盖、上下文串味，开发者只能手工切分支、复制粘贴，难以判断哪个改动来自哪个任务。
  pain_en: Several agents editing the same workspace overwrite each other and mix context, forcing developers
    to hand-switch branches and paste text, with no clear link between a change and the task that produced
    it.
  current_alternative: 手工开多个终端和 git worktree，或一次只跑一个代理、串行等待。
  current_alternative_en: Manually opening several terminals and git worktrees, or running one agent at
    a time and waiting serially.
  usage_reason: 推断：它把每个代理放进独立 worktree 和终端并统一编排，省掉手工建分支、切目录、搬运上下文这几步，因此同时跑多个代理的开发者会在并行任务变多、手工切换开始出错时选择它。
  usage_reason_en: 'Inference: by placing each agent in its own worktree and terminal under one orchestration
    layer, it removes the manual steps of creating branches, switching directories and moving context,
    so developers running several agents pick it once parallel tasks multiply and hand-switching starts
    causing mistakes.'
