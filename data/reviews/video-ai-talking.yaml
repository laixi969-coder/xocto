  market: ''
  job: 真人口播创作者或短视频运营者已有一段真人出镜素材，需要按新文案产出竖屏口播视频：上传出镜视频、写好字幕，在本机完成配音与对口型，导出竖屏 MP4，用于短视频发布。
  job_en: 'A talking-head creator or short-video operator who already has real on-camera footage needs
    to produce a vertical talking-head video for a new script: upload the footage, write subtitles, run
    voice-over and lip-sync locally, and export a vertical MP4 for short-video publishing.'
  pain: 口播内容需要持续更新，但创作者不愿反复对镜头念稿；重录要重新布光、收音、背稿并多次 NG，出镜状态和口误还会拖长单条视频的制作周期。
  pain_en: Talking-head content must be published continuously, yet creators do not want to repeatedly
    perform scripts on camera; re-shooting means re-lighting, re-recording audio, memorizing lines and
    multiple retakes, and on-camera slips stretch the production cycle of each video.
  current_alternative: 旧做法是本人反复对镜头重录，或改用纯字幕/图文/素材混剪回避出镜，或使用云端数字人、在线对口型服务，但后者需要把真人素材和 API 密钥上传到第三方。
  current_alternative_en: The old approach is to re-shoot oneself on camera repeatedly, or to avoid appearing
    on camera by using text-only, image, or stock-footage edits, or to use cloud digital-human and online
    lip-sync services that require uploading real footage and API keys to a third party.
  usage_reason: 推断：相较重录或云端数字人，它把“重新出镜表演”这一步替换为“复用一段已有出镜视频 + 字幕驱动本机配音与对口型”，创作者只需准备文案和字幕即可得到新的竖屏口播成片；密钥只留在浏览器、素材不出本机，使在意素材与密钥外泄的创作者在需要批量更新口播时更可能选择它。
  usage_reason_en: 'Inference: compared with re-shooting or cloud digital humans, it replaces the step
    of performing on camera again with reusing one existing on-camera clip plus subtitle-driven local
    voice-over and lip-sync, so the creator only needs a script and subtitles to get a new vertical talking-head
    video; keeping keys in the browser and footage off remote servers makes it more likely to be chosen
    by creators who care about footage and key leakage when updating talking-head content in b'
