    of the old process was slow or error-prone, and no researcher complaints, cases or adoption behaviour
    are available, so the pain point cannot be confirmed.
  current_alternative: 研究者目前可能使用通用声学分析软件或自行编写脚本处理录音；公开材料未说明具体替代对象。
  current_alternative_en: Researchers currently likely use general acoustic analysis software or write
    their own scripts to process recordings; the public material does not name the specific alternative.
  usage_reason: 推断：如果该产品把收听、编辑与检索集中在一个界面，研究者可省去在多个音频工具间来回导出的步骤；但公开材料未说明具体动作与可核对结果，无法确认用户为何选择它。
  usage_reason_en: 'Inference: if the product consolidates listening, editing and searching in one interface,
    researchers would skip exporting files between several audio tools; however the public material does
    not describe the concrete action or a checkable result, so why users would choose it cannot be confirmed.'
