  current_alternative: 创作者自行收集提示词、看教程、在多个工具间手动搬运参数。
  current_alternative_en: Creators collect prompts themselves, watch tutorials and manually move parameters
    between tools.
  usage_reason: 推断：如果这些 skill 能把提示词与参数固化成可重复调用的步骤，创作者就不必每次从零拼装；但公开材料未给出任何采用或复用证据，无法确认它是否真的被留在工作流里。
  usage_reason_en: 'Inference: if these skills fix prompts and parameters into repeatable steps, creators
    would not have to rebuild them from scratch each time; however, the public material gives no adoption
