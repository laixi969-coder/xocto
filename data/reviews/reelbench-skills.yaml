  job_en: Video creators and editors assembling prompts, parameters and tool-call steps when preparing
    an AI video generation or post-production workflow.
  pain: 公开材料只说明这是学习笔记与工具 skill，没有说明创作者原本卡在哪一步、不解决会有什么后果。
