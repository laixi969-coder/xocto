  market: ''
  job: 律所律师或企业法务在收到待审合同、需要做法律检索或准备诉讼材料时，把合同文本或检索问题交给 Prism-Legal-OS，得到条款分析、检索结果或诉讼要点草稿，再据此人工复核定稿。
  job_en: Lawyers at firms or in-house counsel receiving a contract to review, a research question, or
    litigation materials feed the contract text or query into Prism-Legal-OS to obtain clause analysis,
    research results, or a draft of litigation points, then human-review and finalize.
  pain: 合同逐条审阅、判例与法条检索、诉讼要点整理都是高时薪律师的重复性阅读劳动，量大时挤压判断时间；公开材料只说明产品定位，未给出用户自述的耗时或出错代价，痛点强度属工作流结构推理。
  pain_en: Clause-by-clause contract review, case-law and statute research, and assembling litigation
    points are repetitive reading work for high-billing lawyers, crowding out judgment time at volume;
    public materials state only the product positioning, not user-reported time cost or error consequences,
    so pain intensity is a workflow-structure inference.
  current_alternative: 旧做法是律师或法务人工通读合同、在 Westlaw/LexisNexis 等检索库中逐条查法条判例、手工整理要点，或使用商业法律 AI 工具；公开材料未说明
    Prism 具体替代了其中哪一步。
  current_alternative_en: The old way is manual full-text contract reading, clause-by-clause statute and
    case lookup in databases such as Westlaw/LexisNexis, hand-assembled memos, or commercial legal-AI
    tools; public materials do not specify which step Prism replaces.
  usage_reason: 推断：相较人工通读加数据库逐条检索，它把合同文本或检索问题一次性交给模型，直接产出条款分析、检索结果或诉讼要点草稿，省去从零起草和跨库翻找的起步负担，因此处理批量合同或需要快速出初稿的律师、法务会在初筛阶段选择它；公开材料尚无用户反馈证实这一动机。
  usage_reason_en: 'Inference: versus manual reading plus clause-by-clause database lookup, it feeds the
    contract or query to a model in one pass and returns clause analysis, research results, or a draft
    of litigation points, removing the from-scratch drafting and cross-database hunting burden, so lawyers
    and counsel handling contract volume or needing a fast first draft would pick it at the triage stage;
    no public user feedback yet confirms this motive.'
