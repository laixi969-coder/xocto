  market: ''
  job: 在 iPhone 上跨语言沟通的人，在聊天或邮件输入框里写完一句话后，需要把它翻成对方语言并保持原本的语气再发送。
  job_en: People communicating across languages on iPhone need to translate a sentence they have written
    in a chat or email field into the other party's language while keeping their original tone before
    sending.
  pain: 跨语言沟通时切换翻译应用再复制粘贴会打断输入，机器直译又常丢掉语气，导致表达生硬或需要人工改写。
  pain_en: Switching to a translation app and copy-pasting interrupts typing, while literal machine translation
    often loses tone, producing stiff wording that needs manual rewriting.
  current_alternative: 常见做法是复制到系统翻译或第三方翻译应用、再粘回输入框，或直接依赖对方能看懂的不地道表达。
  current_alternative_en: Common alternatives are copying into the system or a third-party translation
    app and pasting back, or simply sending awkward phrasing the other side has to interpret.
  usage_reason: 推断：若键盘能在输入位置直接给出保留语气的译文，用户就省掉切换应用与复制粘贴这一步，因此高频跨语言沟通者会尝试；但候选未提供语言对、准确度或留存证据。
  usage_reason_en: 'Inference: if the keyboard returns a tone-preserving translation right at the input
    position, users skip app switching and copy-pasting, so frequent cross-language communicators would
    try it; however the candidate offers no language pairs, accuracy or retention evidence.'
