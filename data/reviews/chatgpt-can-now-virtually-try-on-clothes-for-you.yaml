  market: ''
  job: 网购服装的消费者在无法到店试穿时，需要判断某件衣服穿在自己身上的样子，再决定是否下单。
  job_en: Online clothing shoppers who cannot try items in store need to judge how a garment looks on
    their own body before ordering.
  pain: 线上买衣服看不到上身效果，尺码与版型判断靠猜，退换货成本高。
  pain_en: Buying clothes online gives no view of fit, sizing and cut are guesswork, and returns are costly.
  current_alternative: 看模特图与买家秀、比对尺码表、先买后退或到店试穿。
  current_alternative_en: Studying model photos and buyer images, comparing size charts, buying then returning,
    or trying on in store.
  usage_reason: 推断：用户上传自己的照片后，模型直接生成上身效果图并留存收藏，省去在多个商品页之间比对模特图与尺码表这一步，因此对线上买衣服且退货频繁的人有吸引力；公开材料未披露使用量或复购数据。
  usage_reason_en: 'Inference: after a user uploads a photo, the model generates an on-body image and
    keeps a saved list, removing the step of comparing model photos and size charts across product pages,
    which appeals to frequent online clothing buyers with high return rates; no usage or repeat-purchase
    data is disclosed.'
