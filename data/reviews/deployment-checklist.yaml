  market: ''
  job: Web 与移动应用团队在上线前，由开发者或安全负责人逐项核对部署检查清单，确认安全与配置项没有遗漏。
  job_en: Before release, a web or mobile app team has a developer or security owner check the pre-deployment
    list item by item to confirm no security or configuration item was missed.
  pain: 上线漏配安全项确实会带来事故，但候选材料没有给出任何团队漏检的案例、事故记录或使用反馈，痛点强度只能靠常识推断。
  pain_en: Missing a security setting at release can cause incidents, but the material gives no case of
    a missed check, incident record, or user feedback, so pain intensity rests on common sense alone.
  current_alternative: 团队目前靠内部 wiki、个人经验、代码评审清单或上线前临时口头确认来覆盖这些检查项。
  current_alternative_en: Teams currently cover these checks with internal wikis, personal experience,
    code-review checklists, or ad-hoc verbal confirmation before release.
  usage_reason: 推断：如果清单条目足够具体且代理能按同一份清单逐项核对，团队会在发布前用它替代凭记忆临时列项，减少漏项这一步；但候选材料没有说明条目质量、代理执行方式或是否有人实际采用，因此无法确认它会被长期放进发布流程。
  usage_reason_en: 'Inference: if the items are specific enough and an agent can verify them against the
    same list, teams would use it before release instead of listing items from memory, cutting the step
    where items get missed; but the material does not describe item quality, how the agent executes, or
    any actual adoption, so long-term placement in the release flow cannot be confirmed.'
