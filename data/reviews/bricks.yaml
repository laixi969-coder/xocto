  market: ''
  job: 前端工程师在已有代码库中让 AI 生成界面组件时，需要处理项目自身的实现约定与既有组件风格，产出能直接并入项目的组件代码。
  job_en: A frontend engineer letting AI generate interface components inside an existing codebase must
    handle the project's own implementation contracts and existing component style to produce component
    code that can be merged directly.
  pain: AI 生成的组件往往不符合项目既有约定，工程师仍需逐处改写，生成结果与工程规范之间的落差是主要痛点；该痛点强度目前只有项目自述支持。
  pain_en: AI-generated components often violate existing project conventions, forcing engineers to rewrite
    them piece by piece; the gap between generated output and engineering standards is the main pain,
    though its intensity is supported only by the project's own description.
  current_alternative: 工程师目前多依赖通用代码助手生成组件后手工调整，或直接照抄设计系统文档与既有组件改写。
  current_alternative_en: Engineers currently rely on general code assistants and then hand-adjust the
    output, or copy from design-system docs and existing components.
  usage_reason: 推断：相较通用助手先生成再人工改写，它把项目实现约定作为输入前置，可能减少逐处对齐规范这一步；但缺少用户反馈与采用证据，尚不能确认工程师会因此长期使用。
  usage_reason_en: 'Inference: compared with generating via a general assistant and then rewriting by
    hand, it feeds project implementation contracts in upfront, potentially removing the step of aligning
    each piece to conventions; without user feedback or adoption evidence, it is unconfirmed that engineers
    would keep using it.'
