  market: ''
  job: 使用 Claude Code 的开发者，在长时间编码会话中需要随时知道上下文还剩多少、用量烧到哪，并在同一终端里完成代码审查与文件预览。
  job_en: Developers using Claude Code who, during long coding sessions, need to know how much context
    remains and how much quota is burned, and to do code review and file preview in the same terminal.
  pain: 上下文写满或额度耗尽往往在报错时才被发现，开发者被迫中断任务去别处查用量，长会话里反复丢失节奏。
  pain_en: Running out of context or quota is often discovered only when an error appears, forcing developers
    to interrupt the task and check usage elsewhere, repeatedly losing rhythm in long sessions.
  current_alternative: 目前靠官方命令行输出、另开窗口查用量，或凭经验估计上下文剩余，缺少常驻可见的状态。
  current_alternative_en: Today developers rely on official CLI output, a separate window for usage, or
    experience-based guesses about remaining context, with no persistent visible status.
  usage_reason: 推断：插件把上下文条和用量计直接画在提示行上方，开发者不必切窗口就能在耗尽前调整任务或压缩上下文，因此高频长会话的 Claude Code 用户会装它；仓库仅有星标数，没有留存或团队采用证据。
  usage_reason_en: 'Inference: by drawing the context bar and usage meter directly above the prompt, the
    plugin lets developers adjust or compress tasks before exhaustion without switching windows, so heavy
    long-session Claude Code users would install it; the repository shows only star counts, with no retention
    or team adoption evidence.'
