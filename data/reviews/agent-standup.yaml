    or tracking session progress from memory.
  usage_reason: 推断：它把分散的会话状态汇总成一个本地面板，省去逐个窗口巡检这一步，因此同时开多个智能体的开发者会在并行任务变多时选择它；目前缺少留存或重复使用证据。
  usage_reason_en: 'Inference: it aggregates scattered session state into one local panel, removing the
    step of inspecting each window, so developers running several agents would pick it as parallel tasks
    grow; retention or repeat-use evidence is currently missing.'
