  market: ''
  job: 同时运行多个编码智能体会话的开发者，在多个任务并行推进时，需要判断哪个会话在跑、哪个卡住、哪个在等自己确认，以便决定先处理哪一个。
  job_en: Developers running several coding-agent sessions in parallel need to tell which session is running,
    which is stuck and which is waiting on their confirmation, so they can decide what to handle first.
  pain: 并行会话把状态分散在多个终端与编辑器窗口里，人要在窗口间来回切换才能发现被阻塞的会话，注意力成为瓶颈。
