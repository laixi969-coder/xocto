  market: ''
  job: macOS 开发者在需要让编码代理执行任务时，通过 kuvo-code 原生外壳接入任意模型，在 opencode 引擎上运行代理并查看产出。
  job_en: macOS developers running coding agents use the kuvo-code native harness to connect any model
    on the opencode engine and review agent output.
  pain: 编码代理分散在不同命令行与工具中，切换模型或统一查看代理产出需要反复配置，缺少统一外壳。
  pain_en: Coding agents are scattered across CLIs and tools, so switching models or reviewing agent output
    uniformly requires repeated setup and lacks a unified harness.
  current_alternative: 直接在终端运行各家编码代理 CLI，或使用单一厂商绑定的编辑器插件。
  current_alternative_en: Running each vendor's coding agent CLI in the terminal, or using a single-vendor
    editor plugin.
  usage_reason: 推断：相较在多个终端与插件间切换，它用一个原生外壳统一接入任意模型并运行 opencode 引擎，省去逐工具配置这一步，因此需要跨模型对比或统一管理代理的 macOS 开发者会试用。
  usage_reason_en: 'Inference: versus switching among terminals and plugins, it unifies any model behind
    one native harness on the opencode engine, removing per-tool setup, so macOS developers comparing
    models or managing agents centrally would try it.'
