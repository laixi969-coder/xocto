  next_validation: 收集 Maybloc 官方页面或文档，确认其输入格式、是否输出带说话人标签与时间戳的稿件、评测基准与定价页。
  market: ''
  job: 会议记录者、播客制作人或取证人员拿到一段多人交替发言的录音，需要把它整理成能分清谁说了什么、可归档或可引用的文字稿。
  job_en: A meeting note-taker, podcast producer or evidence handler has a recording of several people
    speaking in turn and needs it turned into a transcript that shows who said what and can be archived
    or cited.
  pain: 多人音频里说话人重叠、串音和口音会让通用转写出错，人工回听逐句核对耗时，且错误在需要留档的场景里代价高。
  pain_en: Overlapping speech, crosstalk and accents make general transcription error-prone, and manually
    re-listening line by line is slow, with mistakes costly wherever records must be kept.
  current_alternative: 目前多用通用转写服务或人工听打，再靠人工补说话人标签和时间戳。
  current_alternative_en: Today people mostly use general transcription services or human typists, then
    add speaker labels and timestamps by hand.
  usage_reason: 推断：如果它确实在多说话人音频上把说话人区分和词错率同时做好，用户就不必再回听整段录音去补标签，可直接拿到可归档的稿件；但公开材料只有一句 SOTA 声明，没有评测、样例或定价，无法确认这一步负担是否真的被减少。
  usage_reason_en: 'Inference: if it really improves both speaker separation and word error rate on multi-speaker
    audio, users would no longer need to re-listen to the whole recording to add labels and could get
    an archivable transcript directly; however the public material is a single SOTA claim with no benchmark,
    sample or pricing, so it is unconfirmed that this step is actually reduced.'
