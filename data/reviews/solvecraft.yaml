  market: ''
  job: 机械工程师或工业设计师在需要修改零件尺寸、装配关系或核对结构时，打开参数化 CAD 模型，调整参数并重新生成可继续加工的 3D 模型文件。
  job_en: A mechanical engineer or industrial designer opens a parametric CAD model to change a part dimension
    or assembly constraint, then regenerates a 3D model file that can be machined further.
  pain: 商业 CAD 授权贵、绑定重，小团队和独立开发者难以负担；同时 AI 代理无法直接操作这些封闭工具，改一个参数往往要人工在图形界面里反复点。
  pain_en: Commercial CAD licenses are expensive and heavily locked in, hard for small teams and independent
    developers to afford; AI agents cannot directly operate these closed tools, so changing one parameter
    often means repeated manual clicking in a GUI.
  current_alternative: 继续用 Autodesk Fusion 360、SolidWorks 等商业软件手工建模，或退回到 FreeCAD 等开源工具，AI 环节基本靠人工复制参数。
  current_alternative_en: Keep modeling by hand in Autodesk Fusion 360 or SolidWorks, or fall back to
    open-source tools like FreeCAD, with the AI step done by manually copying parameters.
  usage_reason: 推断：相较在商业软件里手工改参数，它把模型操作暴露成可被 AI 代理调用的接口，让代理直接读参数、改尺寸、重建模型，减少人工在图形界面里逐步点击这一环；因此预算有限、又想让代理参与建模的小型工程团队会先试用它。
  usage_reason_en: 'Inference: versus manually editing parameters in commercial software, it exposes model
    operations as an interface AI agents can call, letting an agent read parameters, change dimensions,
    and rebuild the model, removing the step of clicking through a GUI; small engineering teams with tight
    budgets that want agents in the modeling loop would try it first.'
