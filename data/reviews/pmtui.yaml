  current_alternative: 目前多靠人工守在终端前手动确认，或用脚本、tmux 之类的通用工具自行拼凑。
  current_alternative_en: Today people mostly sit in front of the terminal confirming manually, or cobble
    together scripts and general tools such as tmux.
  usage_reason: 推断：它把会话中途的确认与后续动作自动接管，省掉人工盯着终端逐步放行这一步，因此长时间跑批的开发者会在离开工位时选择它；公开材料未给出用户反馈或留存证据。
