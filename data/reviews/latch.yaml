  market: ''
  job: 容易分心的用户在需要专注时，用 Latch 屏蔽应用，必须走到放置实体钥匙的位置才能解锁，完成一次专注时段。
  job_en: Easily distracted users block apps with Latch during focus sessions and must walk to a physical
    key to unlock, completing a focus period.
  pain: 软件屏蔽工具可一键关闭或绕过，冲动解锁成本太低，专注难以维持。
  pain_en: Software blockers can be disabled or bypassed in one click, so the cost of impulsive unlocking
    is too low to sustain focus.
  current_alternative: 系统自带屏幕时间限制、第三方应用屏蔽软件，或靠意志力自我约束。
  current_alternative_en: Built-in screen time limits, third-party app blockers, or willpower alone.
  usage_reason: 推断：相较可一键关闭的软件屏蔽，它把解锁变成需要走到实体钥匙的物理动作，抬高冲动解锁成本，因此反复破功的学生或远程办公者会尝试。
  usage_reason_en: 'Inference: versus one-click software blockers, it turns unlocking into a physical
    walk to a key, raising the cost of impulsive unlocking, so students or remote workers who repeatedly
    break focus would try it.'
