  market: ''
  job: 游戏主播或视频创作者在直播或录制时处理采集卡输入的低分辨率、高噪点画面，需要实时得到更清晰、更流畅的预览与成片素材。
  job_en: Game streamers or video creators handling low-resolution, noisy capture-card input during live
    streaming or recording, who need a clearer, smoother real-time preview and final footage.
  pain: 采集卡与旧素材画质差，直播中无法停下来做后期处理，观众看到的就是原始画质。
  pain_en: Capture-card and legacy footage looks poor, and there is no way to pause a live stream for
    post-processing, so viewers see the raw quality.
  current_alternative: 主播通常直接推流原始画面，或事后用剪辑软件和独立超分工具处理，实时场景基本没有替代方案。
  current_alternative_en: Streamers usually push the raw feed, or process it afterwards with editing software
    and standalone upscaling tools; real-time scenarios have almost no alternative.
  usage_reason: 推断：它把超分、降噪和插帧放进播放与采集链路，省掉事后单独跑一遍增强软件这一步，因此对在意实时画质又不想增加后期工序的主播有吸引力；但延迟、显卡门槛和实际画质尚无公开数据支撑。
  usage_reason_en: 'Inference: it puts super-resolution, denoising and frame generation into the playback
    and capture chain, removing the separate post-hoc enhancement pass, which appeals to streamers who
    care about live quality without adding post-production steps; latency, GPU requirements and actual
    quality lack public data.'
