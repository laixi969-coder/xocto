  market: ''
  job: 教程作者或产品市场人员在录完屏幕操作后，处理原始录屏素材，要产出一段观众能看清重点、不需要自己盯全程的演示视频。
  job_en: A tutorial author or product marketer, after finishing a screen recording, works on the raw
    footage to produce a demo video where viewers can see the key points without tracking the whole screen.
  pain: 原始录屏画面信息密度低，观众容易迷失；要让人看清重点就得手动打关键帧做缩放平移，逐段调整非常耗时，不做又显得粗糙。
  pain_en: Raw screen recordings have low information density and viewers get lost; making key points
    visible requires hand-keyframed zoom and pan, which is slow segment by segment, yet skipping it looks
    unpolished.
  current_alternative: 用通用剪辑软件手动打关键帧，或干脆不做运镜、只靠旁白和光标高亮；也有人把录屏交给剪辑外包。
  current_alternative_en: Hand-keyframing in a general video editor, or skipping camera movement entirely
    and relying on narration and cursor highlights; some outsource the recording to an editor.
  usage_reason: 推断：相较手动逐段打关键帧，Lumiko 直接读取录屏画面并自动决定缩放平移的位置，省掉的是“判断该推哪里并手动设置”这一步，因此录屏量大、又请不起剪辑的教程作者和独立 SaaS
    团队会先试它。
  usage_reason_en: 'Inference: compared with hand-keyframing each segment, Lumiko reads the screen footage
    and decides zoom and pan positions itself, removing the step of judging where to push in and setting
    it manually, so tutorial authors and small SaaS teams with lots of footage but no editor budget would
    try it first.'
