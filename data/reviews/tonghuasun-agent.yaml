  market: ''
  job: 个人投资者或量化交易员在已用 Codex、Claude Code 等 AI 编码代理做盘面分析时，需要把本机同花顺里的实时行情、K 线、持仓、LV2 委托与逐笔成交数据喂给代理，让代理基于真实账户与盘口数据完成查询和判断。
  job_en: An individual investor or quant trader already using Codex/Claude Code-style agents needs to
    feed local Tonghuashun quotes, K-lines, positions, LV2 orders and tick data into the agent so it can
    answer and reason on real account and order-book data.
  pain: 行情、持仓和 LV2 数据锁在同花顺客户端里，AI 代理无法直接读取；用户只能手动看盘、复制粘贴或另写数据接口，把数据搬进代理这一步反复发生且容易出错。
  pain_en: Quotes, positions and LV2 data are locked inside the Tonghuashun client and invisible to AI
    agents; users must manually read, copy-paste or write their own data bridge, a repeated and error-prone
    step.
  current_alternative: 同花顺官方客户端手动查看、官方或第三方行情 API、自行编写爬取/接口脚本，或干脆让代理在无实时数据的情况下空谈。
  current_alternative_en: Manual viewing in the Tonghuashun client, official or third-party market-data
    APIs, self-written scraping/bridge scripts, or letting the agent reason without live data.
  usage_reason: 推断：相较手动复制或自建接口，它把本机同花顺数据以插件形式直接暴露给代理，省去用户自己搭数据通道这一步，因此已在用 AI 代理做 A 股分析、又需要真实盘口与持仓数据的个人投资者会选它；仓库
    star 从 176 增至 194 只说明关注度上升，不构成持续使用证据。
  usage_reason_en: 'Inference: versus manual copy-paste or a self-built bridge, it exposes local Tonghuashun
    data to the agent as a plugin, removing the step of building a data channel yourself, so individual
    investors already using AI agents for A-share analysis and needing real order-book and position data
    would pick it; stars rising from 176 to 194 shows attention, not sustained use.'
