  market: ''
  job: 小团队或个体经营者没有专职运营、市场或行政人员，需要在每天固定时点处理例行事务材料（查询、表单、信息收集），把这段重复工作跑完并留下可查的文件。
  job_en: A small team or solo operator without dedicated operations, marketing or admin staff needs routine
    work materials (lookups, forms, information gathering) handled at fixed times each day, getting that
    repetitive stretch finished with checkable files left behind.
  pain: 这些例行事务本身不难，但必须有人按时打开浏览器一步步做，人手不足时要么被拖延，要么占用创始人本应用于业务的时间。
  pain_en: These routines are not hard, but someone must open a browser and do them step by step on time;
    with too few people they are either delayed or eat the founder's time for the actual business.
  current_alternative: 目前多靠人工手动操作浏览器完成，或零散使用脚本、浏览器插件与通用聊天助手，缺少按日程触发、可留痕、可复用的成套例程。
  current_alternative_en: Today this is mostly done by hand in a browser, or piecemeal with scripts, browser
    extensions and general chat assistants, without a scheduled, traceable, reusable set of routines.
  usage_reason: 相较手动逐步操作，它把一段例行流程预先写成按日程触发的角色与例程，由代理自己驱动浏览器执行，用户只需事后核对留下的文件，省掉的是“每次重新打开页面、按步骤点一遍”这一步；推断，适合人手不足、又需要每天固定完成同一批事务的小团队。
  usage_reason_en: Compared with doing it step by step by hand, it pre-writes a routine as scheduled roles
    and routines that drive the browser themselves, so the user only checks the files afterwards, removing
    the step of reopening pages and clicking through the same sequence each time; this is inference, suited
    to small teams that lack staff yet must finish the same batch of tasks daily.
