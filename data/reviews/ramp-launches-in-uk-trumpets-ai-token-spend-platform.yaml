    so finance cannot control it the way it controls travel and software subscriptions, and lacks reconcilable
    evidence when spend runs away.
  current_alternative: 旧做法是工程团队自行看云厂商或模型供应商账单，财务靠人工汇总表格或事后报销，缺少统一归集口径。
  current_alternative_en: The old approach is engineering teams reading cloud or model vendor bills themselves,
