  job_en: Corporate finance and engineering leads, when model bills grow across teams and cannot be attributed
    to specific projects, need to reconcile AI token spend and fold it into company expense approval and
    budgeting.
  pain: 模型调用按量计费、分散在多个团队和供应商，账单难以归因和分摊，财务无法像管差旅和软件订阅那样管控，支出失控时缺少可核对依据。
