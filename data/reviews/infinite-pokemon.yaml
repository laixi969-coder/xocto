  market: ''
  job: 独立游戏开发者或同人创作者在需要持续产出新地图、NPC 与剧情时，用生成模型替代手工编写关卡与对白，最终交付一个可继续游玩的存档世界。
  job_en: An indie game developer or fan creator needing a continuous supply of new maps, NPCs and story
    uses a generative model instead of hand-authoring levels and dialogue, delivering a save world that
    can keep being played.
  pain: 手工设计无限内容成本极高，单人开发者难以维持长期更新；但候选材料未说明玩家是否真的需要“永不结束”，也未给出任何使用或留存证据。
  pain_en: Hand-designing endless content is extremely costly and hard for a solo developer to sustain;
    yet the material never shows players actually wanting an endless adventure, nor any usage or retention
    evidence.
  current_alternative: 手工编写关卡与对白、使用现成游戏引擎与素材库，或直接做有限流程的独立游戏。
  current_alternative_en: Hand-authoring levels and dialogue, using existing game engines and asset libraries,
    or shipping an indie game with a finite campaign.
  usage_reason: 推断：相较手工写关卡，它把“设计新地图与 NPC”这一步交给模型自动生成，开发者只需维护存档与规则，因此可能吸引想低成本维持长期更新的个人开发者；但缺少用户反馈，无法确认这是真实选择理由。
  usage_reason_en: 'Inference: versus hand-writing levels, it hands the step of designing new maps and
    NPCs to a model, leaving the developer to maintain saves and rules, which may attract solo developers
    wanting low-cost perpetual updates; without user feedback this cannot be confirmed as a real reason
    for choosing it.'
