  usage_reason_en: 'Inference: it replaces the step of reading a full audit report and ranking it manually
    with a prioritized fix plan, removing the screening work, so independent store sellers and local service
    providers without dedicated SEO staff are more likely to choose it; no user feedback or repeat-use
    evidence yet.'
