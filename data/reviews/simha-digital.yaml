    it, leaving the user to rank them by hand.
  current_alternative: 现在多用 SEO 审计工具导出报告，再由人凭经验或外包顾问判断优先级。
  current_alternative_en: Today people export reports from SEO audit tools and then rank priorities by
    experience or by hiring a consultant.
