  job_en: An SEO consultant or small business owner, facing declining organic traffic, works through site
    audit results and keyword lists to produce an executable order of fixes.
  pain: 审计工具会给出成百上千条问题，但不会告诉用户哪一条先改、改了值不值，用户要在指标堆里自己排序。
