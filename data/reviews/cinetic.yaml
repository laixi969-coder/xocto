  usage_reason: 若成立，它把“写脚本—分镜—关键帧—渲染”的多步手工流程压缩为向编码智能体描述需求并审片，减少的是逐帧调整的负担；但缺少任何用户反馈或案例，无法确认哪类用户会因此选择它，这一判断为推断。
  usage_reason_en: If it holds, it compresses the multi-step manual flow of scripting, storyboarding,
    keyframing and rendering into briefing a coding agent and reviewing the cut, cutting frame-by-frame
    adjustment work; with no user feedback or case, which users would choose it cannot be confirmed, and
