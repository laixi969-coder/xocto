  market: ''
  job: 社区注释贡献者在看到一条被标记为具有误导性的帖子时，需要依据平台提供的来源材料写出一条符合规范的背景注释并提交。
  job_en: A Community Notes contributor, seeing a post flagged as potentially misleading, must write a
    compliant background note from platform-provided source material and submit it.
  pain: 注释写作有格式与引用要求，志愿者需要反复查证和改写，单条耗时且容易因不合规被投票否决。
  pain_en: Note writing has formatting and citation requirements, so volunteers repeatedly verify and
    rewrite, spending time per note and risking rejection by vote for non-compliance.
  current_alternative: 贡献者目前主要靠人工阅读来源、手写注释，或使用通用聊天助手起草后再自行改写。
  current_alternative_en: Contributors currently read sources and write notes by hand, or draft with a
    general chat assistant and then rewrite it themselves.
  usage_reason: 推断：若该工具能直接读取平台来源材料并输出符合注释规范的草稿，贡献者可省去从零组织引用与措辞的一步，因此高频贡献者可能尝试；但公开材料未给出输入格式、评分反馈或任何使用记录，无法确认它是否真的减少了返工。
  usage_reason_en: 'Inference: if the tool can read platform source material and output a note-format
    draft, contributors skip the step of assembling citations and wording from scratch, so high-frequency
    contributors may try it; however, public material shows no input format, rating feedback or usage
    record, so it is unconfirmed whether rework actually drops.'
