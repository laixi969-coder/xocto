  market: ''
  job: 电商或营销团队的内容创作者，在需要为一次投放准备视频、图片、配音和背景音乐时，从提示词或参考图出发生成各类素材并反复迭代，最终交付可直接投放的成套素材。
  job_en: A content creator on an e-commerce or marketing team preparing video, images, voiceover and
    background music for a campaign generates each asset from prompts or reference images and iterates,
    delivering a ready-to-run asset set.
  pain: 视频、图像、语音和音乐分散在不同工具，各自计费与额度，创作者要在多个界面间切换并重复上传素材，时间被切碎且成本难控。
  pain_en: Video, image, voice and music live in separate tools with separate billing and credits, so
    creators switch interfaces and re-upload assets, fragmenting time and making cost hard to control.
  current_alternative: 创作者通常分别订阅或按次使用视频、图像、语音和音乐工具，再手工把产出拼成一条素材。
  current_alternative_en: Creators typically subscribe to or pay per use for separate video, image, voice
    and music tools, then manually assemble the outputs into one asset.
  usage_reason: 推断：相比在多个工具间切换，它用一套共享额度覆盖视频、图像、语音和音乐，并在同一工作空间里用 Agent 迭代项目，减少重复上传与分别充值这一步，因此需要成套素材的电商或营销创作者会在赶投放时选择它。
  usage_reason_en: 'Inference: versus switching among tools, it covers video, image, voice and music with
    one shared credit pool and iterates projects with an agent in the same workspace, cutting re-uploads
    and separate top-ups, so e-commerce or marketing creators needing a full asset set choose it when
    a campaign deadline looms.'
