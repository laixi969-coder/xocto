  market: ''
  job: 使用编码代理（如 Claude Code、Cursor 类工具）的软件开发者，在让代理执行多步代码改动时，需要把代理的每一步动作约束在预先定义的边界内，并让工作流具备类型安全的结构，从而完成一次可控的多步改动任务。
