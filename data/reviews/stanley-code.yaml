    limits; leaving it unsolved means uncontrolled changes and repeated manual rollback and review.
  current_alternative: 当前替代方式是直接让编码代理自由执行，再靠人工审阅 diff、回滚或重写提示词来兜底；部分开发者用脚本或自定义规则做粗粒度约束。
