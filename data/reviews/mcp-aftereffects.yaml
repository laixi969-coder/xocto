  market: ''
  job: 动效设计师或后期合成师在 After Effects 工程里需要批量调整合成、图层与工程结构时，把工程交给这个 MCP 服务读取并执行修改，最终拿到改好的工程文件或单帧渲染结果。
  job_en: When motion designers or compositors need to batch-adjust compositions, layers and project structure
    in an After Effects project, they hand the project to this MCP server to read and modify, receiving
    an updated project file or a single rendered frame.
  pain: After Effects 的工程结构操作只能靠手工点选和脚本，重复整理图层、导出导入工程、逐帧出图耗时且容易出错，非程序员难以自己写脚本。
  pain_en: Structural edits in After Effects rely on manual clicking or scripting; repeatedly cleaning
    layers, exporting/importing projects and rendering frames is slow and error-prone, and non-programmers
    struggle to write scripts themselves.
  current_alternative: 现有做法是手工在软件里逐项操作，或由会写 ExtendScript/JSX 的人维护一次性脚本，也有人干脆放弃自动化。
  current_alternative_en: Today people edit items manually in the app, or rely on someone who can write
    ExtendScript/JSX one-off scripts, or simply skip automation.
  usage_reason: 推断：相较手工点选或自写脚本，它把工程结构读取、成组可撤销修改和 JSON 导入导出封装成可被 AI 调用的动作，省去写脚本这一步，因此不会编程的后期人员在做重复工程整理时可能选择它；尚无用户反馈或客户案例支持这一动机。
  usage_reason_en: 'Inference: compared with manual clicking or self-written scripts, it packages project
    introspection, undo-grouped edits and JSON import/export into actions an AI can call, removing the
    scripting step, so non-programming post-production staff may choose it for repetitive project cleanup;
    no user feedback or customer cases support this motive yet.'
