  market: ''
  job: 短视频剪辑师或内容运营在成片后期，手里已有一段剪好的视频素材，需要选出可商用授权的背景音乐、确定开场钩子时间窗，并拿到可直接执行的 ffmpeg 混音与压低人声参数。
  job_en: A short-video editor or content operator in post-production, holding a finished cut, needs to
    pick license-safe background music, decide the opening hook window, and obtain directly executable
    ffmpeg mixing and ducking parameters.
  pain: 公开材料支持的痛点是：可商用音乐需要反复试听并核对授权，混音与压低人声参数靠经验手调，返工多且存在版权风险；不采用则要么承担授权风险，要么在曲库与剪辑软件之间反复切换。
  pain_en: 'The pain supported by public material: commercially usable music requires repeated auditioning
    and license checking, while mixing and ducking parameters are tuned by experience, causing rework
    and copyright risk; not adopting it means either bearing license risk or repeatedly switching between
    a music site and an editor.'
  current_alternative: 在曲库网站手动搜索试听并核对授权，再在剪辑软件里手动对齐节拍、手动设置音量包络与压低人声。
  current_alternative_en: Manually searching and auditioning on stock music sites while checking licenses,
    then aligning beats and setting volume envelopes and ducking by hand in an editor.
  usage_reason: 推断：相较手动试听加手调参数，它把授权筛选、钩子时间窗识别和 ffmpeg 混音参数计算合并为一次调用，剪辑师少掉在曲库与剪辑软件之间来回切换、以及凭经验试参数这两步，直接拿到可执行的配乐方案，因此赶片的独立创作者和小型后期团队会在成片后期选择它。
  usage_reason_en: 'Inference: versus manual auditioning plus hand-tuned parameters, it merges license
    filtering, hook-window detection and ffmpeg mixing-parameter calculation into one call, removing the
    switch between music site and editor and the trial-and-error parameter step, delivering an executable
    plan, which is why solo creators and small post teams under deadline would choose it in post-production.'
