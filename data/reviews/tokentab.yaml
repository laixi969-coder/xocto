    the budget, so it is estimated by feel, and using multiple tools forces cross-platform copying and
    conversion.
  current_alternative: 逐个打开各家厂商的用量页面手工汇总，把账单导出到表格自行换算，或干脆不核算、凭感觉控制用量。
  current_alternative_en: Manually opening each vendor's usage page and aggregating by hand, exporting
    bills into spreadsheets and converting them, or skipping accounting entirely and controlling usage
    by feel.
  usage_reason: 相较逐个打开厂商用量页再手工抄数汇总，它直接读取本机已有的会话日志并按模型、项目、日期聚合，省掉跨工具抄数与换算这一步，因此多项目并行、需要向客户或预算交代的开发者会在结算节点选择它；这是基于产品能力的工作流推断，尚无留存或付费证据。
  usage_reason_en: Compared with opening each vendor's usage page and copying numbers by hand, it reads
    existing on-machine session logs and aggregates by model, project and date, removing the cross-tool
    copying and conversion step, so developers running several projects who must justify spend to clients
    or budgets would pick it at settlement time; this is workflow inference from product capability, with
    no retention or payment evidence yet.
