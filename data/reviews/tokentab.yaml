- id: req-initial-tokentab-2026-10-05
  project_slug: tokentab
  level: initial
  reviewed_at: '2026-10-05T00:56:02Z'
  verdict: true_demand
  signal_level: 初步成立
  gates:
  - gate: value
    status: supported
    reason: 它解决 AI 编程开销无法按项目归因的痛点，旧做法是手工翻各家用量页汇总；不核算的后果是超支与结算说不清，属于工作流推理。
    evidence_ids:
    - ev-deecb6092d87992d
  - gate: consensus
    status: insufficient
    reason: 公开材料只有仓库星标与分支数，属于关注度而非持续采用；没有用户评价或团队使用案例说明它已进入日常流程。
    evidence_ids:
    - ev-deecb6092d87992d
  - gate: model
    status: insufficient
    reason: 未披露定价或收费方式，买方可能是个人开发者或团队，属于判断而非已验证事实；本地优先也意味着难以靠数据变现。
    evidence_ids:
    - ev-deecb6092d87992d
  - gate: truth
    status: supported
    reason: 只读本机会话日志、不登录不传数据，承诺的交付（按模型项目日期的费用明细）与实现路径一致，人工仍需自行判断消耗是否合理。
    evidence_ids:
    - ev-deecb6092d87992d
  next_validation: 收集该仓库的 issue 与 discussion，确认是否有团队把它接入项目结算或预算告警的实际使用记录。
  market: ''
  job: 使用 Claude Code、Codex、Gemini CLI 的开发者或团队负责人，在月底或项目结算时，需要把散落在本机会话日志里的 token 消耗整理成按模型、项目、日期可查的费用明细。
  job_en: Developers or team leads using Claude Code, Codex or Gemini CLI who, at month-end or project
    settlement, need to turn token consumption scattered across local session logs into a cost breakdown
    searchable by model, project and date.
  pain: AI 编程开销混在订阅或 API 账单里，无法按项目归因，超支或客户结算时说不清钱花在哪，只能靠估算。
  pain_en: AI coding spend is buried in subscription or API bills and cannot be attributed per project,
    so overspend or client settlement cannot be explained and must be estimated.
  current_alternative: 手动翻看各家工具的用量页面、导出账单到表格，或干脆不核算，凭感觉控制用量。
  current_alternative_en: Manually checking each tool's usage page, exporting bills into spreadsheets,
    or skipping accounting entirely and controlling usage by feel.
  usage_reason: 相较逐个打开厂商用量页再手工汇总，它直接读取本机已有的会话日志并按模型、项目、日期聚合，省掉跨工具抄数和换算这一步，因此多项目并行、需要向客户或预算交代的开发者会在结算节点选择它；这是基于产品能力的工作流推断，尚无留存或付费证据。
  usage_reason_en: Compared with opening each vendor's usage page and aggregating by hand, it reads existing
    on-machine session logs and aggregates by model, project and date, removing the cross-tool copying
    and conversion step, so developers running several projects who must justify spend to clients or budgets
    would pick it at settlement time; this is workflow inference from product capability, with no retention
    or payment evidence yet.
