  market: ''
  job: 从事长周期课题的科研人员，在文献、假设、实验记录与论文写作之间来回切换时，需要把每一步的证据链保留下来。
  job_en: Research scientists on long-horizon projects need to preserve the evidence chain across literature,
    hypotheses, experiment records and paper writing as they switch between them.
  pain: 研究周期长，证据容易散落、错误会累积、目标会漂移，事后很难追溯某个结论到底基于哪次实验或哪篇文献。
  pain_en: Over long research cycles evidence scatters, errors compound and goals drift, making it hard
    to trace which experiment or paper a conclusion actually rests on.
  current_alternative: 目前靠实验记录本、文献管理软件、脚本与人工整理，论文写作与实验记录之间靠人手动对齐。
  current_alternative_en: Today this relies on lab notebooks, reference managers, scripts and manual organization,
    with paper writing and experiment records aligned by hand.
  usage_reason: 推断：相比分散的笔记本与文献工具，forest 把假设、实验与结论挂在同一张可分支的图谱上，每条结论直接指向证据，减少了事后回溯“这个数字从哪来”的负担，因此对需要留痕的长周期课题有吸引力；公开材料未提供实验室采用或付费证据。
  usage_reason_en: 'Inference: compared with scattered notebooks and reference tools, forest puts hypotheses,
    experiments and conclusions on one branchable graph where each claim points to its evidence, reducing
    the burden of tracing where a number came from, which appeals to long-horizon projects needing an
    audit trail; public material provides no lab adoption or payment evidence.'
