  market: ''
  job: 求职者（尤其是习惯终端与编码代理的开发者）在找工作时，把自己的简历和偏好交给命令行里的编码代理，让它从每小时刷新的海量职位中筛出值得投递的岗位，最终得到一份匹配职位列表。
  job_en: Job seekers, especially developers who live in the terminal and use coding agents, hand their
    resume and preferences to a CLI-based agent so it screens a large, hourly-refreshed posting pool and
    returns a shortlist of roles worth applying to.
  pain: 公开材料只说明职位库规模与刷新频率，未记录用户抱怨；从工作流结构推理，痛点是求职者要在多个招聘站点反复检索、逐条比对自身简历与偏好，人工筛选成本高且容易漏掉新发布的匹配岗位。
  pain_en: Public materials state only the size and hourly refresh of the posting pool, not user complaints;
    by workflow inference the pain is that job seekers must repeatedly search multiple boards and manually
    compare each posting against their resume and preferences, which is costly and easily misses newly
    posted matches.
  current_alternative: 公开材料未描述用户现有做法；结构推理下，替代方式是求职者自己在招聘网站或聚合站上按关键词搜索、逐条阅读职位描述并手工判断是否匹配。
  current_alternative_en: Public materials do not describe current user behavior; by structural inference
    the alternative is job seekers searching job boards or aggregators by keyword, reading each posting
    and judging fit manually.
  usage_reason: 推断：相较自己在招聘站逐条检索比对，它把简历与偏好作为持久输入，由代理对每小时刷新的职位批量评估并输出匹配列表，减少的是逐条阅读和重复输入筛选条件这一步；因此已在终端使用编码代理的开发者会在集中找工作的阶段选择它。
  usage_reason_en: 'Inference: compared with manually searching and comparing postings on job boards,
    it keeps the resume and preferences as persistent input and has the agent batch-evaluate hourly-refreshed
    postings into a shortlist, removing the step of reading each posting and re-entering filters; developers
    already running coding agents in the terminal are therefore the likely users during an active job
    search.'
