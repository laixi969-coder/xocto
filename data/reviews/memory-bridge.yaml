  market: ''
  job: 个人用户与开发者在多台设备、多个 AI 客户端之间切换时，需要把对话记忆与偏好同步到同一份可复用记忆里，避免每次重新交代背景。
  job_en: Individuals and developers switching between multiple devices and AI clients need to sync conversation
    memory and preferences into one reusable store instead of restating context each time.
  pain: 记忆被锁在单个应用或单台设备里，换客户端就要重新输入背景，重复交代既费时又容易遗漏关键偏好。
  pain_en: Memory is locked inside one app or device, so switching clients means re-entering context,
    which is time-consuming and easily drops key preferences.
  current_alternative: 用户手动复制粘贴历史对话，或依赖各平台自带的账号同步，跨平台时只能重新开始。
  current_alternative_en: Users manually copy and paste past conversations, or rely on each platform's
    own account sync, starting over when crossing platforms.
  usage_reason: 推断：相较手动复制粘贴或依赖单平台同步，它把记忆抽成跨设备可读写的独立层，省去换设备时重新交代背景这一步，因此同时使用多个 AI 客户端的开发者会尝试接入；但仓库无 fork、无
    issue 讨论，缺少真实迁移与留存证据。
  usage_reason_en: 'Inference: compared with manual copy-paste or single-platform sync, it abstracts memory
    into an independent layer readable and writable across devices, removing the step of restating context
    when switching devices, so developers using several AI clients would try to integrate it; the repository
    has no forks or issue discussion, so real migration and retention evidence is missing.'
