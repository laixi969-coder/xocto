  market: ''
  job: 内容运营者或重度视频观众在每天需要跟进B站更新时，让工具读取视频字幕、挑出值得看的内容，最终拿到一份日报式摘要。
  job_en: Content operators or heavy video viewers who need to follow daily Bilibili updates have the
    tool read subtitles, pick worthwhile items and receive a daily digest.
  pain: B站更新量大、单条视频耗时长，人工逐条看或凭标题判断容易漏掉重要内容，也浪费时间。
  pain_en: Bilibili update volume is large and each video is long; judging by title or watching one by
    one wastes time and misses important items.
  current_alternative: 目前靠人工刷首页推荐、看标题和封面判断，或依赖平台算法推荐，没有按自己标准生成的日报。
  current_alternative_en: Today people manually scroll the homepage, judge by title and thumbnail, or
    rely on platform recommendations, with no digest generated by their own criteria.
  usage_reason: 推断：相较人工逐条刷，它把“看字幕判断值不值得”这一步交给工具，用户只需读一份日报，因此适合每天要跟进大量视频但时间有限的内容运营者。
  usage_reason_en: 'Inference: versus manually scrolling each video, it offloads the ''read subtitles
    to judge worth'' step to the tool so the user only reads one digest, fitting content operators who
    must follow many videos with limited time.'
