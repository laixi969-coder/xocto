  job_en: People losing weight or managing blood sugar need each meal turned into a checkable calorie
    and nutrient record they can act on for the next meal.
  pain: 手工查食物库、称重、换算份量繁琐，坚持几天就放弃，记录断掉后整个饮食计划失效。
  pain_en: Manually searching food databases, weighing and converting portions is tedious, so logging
    stops within days and the whole diet plan collapses.
  current_alternative: MyFitnessPal 等食物库应用逐项搜索录入，或干脆不记录、凭感觉吃。
