  market: ''
  job: 学生、语言学习者或编辑在需要把长文本转为可听内容时，把文档或文本交给 Lisen，用 Cartesia 语音朗读，完成听读、跟读或听校任务。
  job_en: A student, language learner or editor who needs long text turned into audio hands documents
    or text to Lisen, which reads them with Cartesia voices, to complete listening, shadowing or audio
    proofreading.
  pain: 长文本只能靠眼睛读，通勤、做家务或校对时无法进行；旧做法要么自己朗读录音，要么使用机械感强的系统语音，听感差且不便。
  pain_en: Long text can only be read visually, so it cannot be consumed while commuting, doing chores
    or proofreading; the old way is to record oneself or use robotic system voices that sound poor and
    are inconvenient.
  current_alternative: 系统自带朗读、浏览器朗读插件或人工录音，通常音色机械、缺少自然停顿，长文处理也不方便。
  current_alternative_en: Built-in OS or browser read-aloud, or recording oneself, usually with robotic
    voices, poor pacing and awkward handling of long documents.
  usage_reason: 相较系统朗读，它直接调用 Cartesia 语音生成更自然的朗读音频，减少用户自己录音或忍受机械音这一步；推断语言学习者和需要听校的编辑会在长文本场景下选择它，但尚无用户反馈或留存证据支持。
  usage_reason_en: Compared with system read-aloud, it calls Cartesia voices to produce more natural narration,
    removing the step of recording oneself or tolerating robotic audio; the inference is that language
    learners and editors needing audio proofreading would pick it for long texts, but no user feedback
    or retention evidence supports this yet.
