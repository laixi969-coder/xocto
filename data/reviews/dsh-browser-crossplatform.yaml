  market: ''
  job: 个人用户在浏览器里处理需要多步点击、填表和翻页的网页任务（如重复表单、跨页信息收集）时，让模型把当前页面读成带编号控件的文本并代为点击、输入、滚动、跳转，自己只做执行前确认。
  job_en: Individual users handling multi-step web tasks (repetitive forms, cross-page information gathering)
    let the model read the current page as numbered controls and perform clicks, typing, scrolling and
    navigation, while they only confirm before each action.
  pain: 这类网页操作步骤碎、重复度高，用户要在页面间反复切换并手动输入相同信息，出错后常需重来；公开材料未提供用户抱怨或使用数据，痛点由任务结构推出。
  pain_en: Such web tasks are fragmented and repetitive; users switch between pages and retype the same
    information, and a mistake often means starting over. Public material offers no user complaints or
    usage data, so the pain is inferred from task structure.
  current_alternative: 人工逐页点击，或使用脚本、RPA 录制固定流程；页面改版后脚本失效，普通用户也写不出脚本。
  current_alternative_en: Clicking page by page by hand, or using scripts and RPA recordings of fixed
    flows; a page redesign breaks the script, and ordinary users cannot write one.
  usage_reason: 推断：相较手点或写脚本，它把页面转成带编号控件的文本再执行动作，用户不必自己找按钮、填字段，改版后也无需重写脚本；执行前询问、密码留在页面内，降低了把账号交给第三方的顾虑，因此常做重复网页操作又不会写脚本的个人用户会先试用。
  usage_reason_en: 'Inference: versus manual clicking or scripting, it converts the page into numbered
    controls and then acts, so users need not hunt for buttons or fill fields and need not rewrite a script
    after a redesign. Asking before acting and keeping passwords in the page reduce the worry of handing
    an account to a third party, so individuals doing repetitive web work without scripting skills are
    the likely first triers.'
