  usage_reason_en: 'Inference: versus manual clicking or scripting, it reads the page as numbered controls
    and then acts, so users need not hunt for buttons or fill fields, and a redesign does not require
    rewriting a script. Asking before acting, keeping passwords in the page and talking only to the user''s
    own desktop reduce the worry of handing an account to a third party, so individuals who do repetitive
    web work but cannot script would pick it for multi-step forms or paging tasks.'
