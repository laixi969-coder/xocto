  pain_en: 'Public material shows such tasks are fragmented and repetitive: users switch between pages
    and retype the same information. The old ways are manual page-by-page clicking or scripts and RPA
    recordings of fixed flows; a redesign breaks the script, ordinary users cannot write one, and a mistake
    often means starting over.'
  current_alternative: 人工逐页点击填表；或使用脚本、RPA 录制固定流程；以及把页面内容复制给通用聊天模型再手动执行其建议。
  current_alternative_en: Clicking and filling forms page by page by hand; scripts or RPA recordings of
    fixed flows; or pasting page content into a general chat model and manually executing its suggestions.
