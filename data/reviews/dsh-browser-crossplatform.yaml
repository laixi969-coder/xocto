  market: ''
  job: 个人用户（尤其不会写脚本的人）在浏览器里处理需要多步点击、填表、翻页的网页任务时，让 DeepSeek Harness 桌面端模型把当前页面读成带编号控件的文本并代为点击、输入、滚动、跳转、管理标签页，自己只做执行前确认。
  job_en: 'Individual users, especially those who cannot script, handling multi-step web tasks of clicking,
