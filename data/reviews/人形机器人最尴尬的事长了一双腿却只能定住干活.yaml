  market: ''
  job: 人形机器人研发团队在需要机器人边走边完成抓取、按压、搬运等全身动作时，处理自采的全身交互数据与本体控制策略，要完成让同一模型在不同机器人本体上稳定执行全身任务。
  job_en: Humanoid robotics teams, when a robot must grasp, press or carry while moving, work with self-collected
    full-body interaction data and body-control policies to make one model reliably execute whole-body
    tasks across different robot bodies.
  pain: 公开演示里机器人干活时大多先站定锁定身体，双腿只起到把机器人送到任务面前的作用，导致人形结构的高成本换不来移动中出力的能力。
  pain_en: In public demos robots usually lock their stance before working, so legs only deliver the robot
    to the task and the high cost of a humanoid form buys no ability to exert force while moving.
  current_alternative: 行业普遍用轮式底盘加固定工位机械臂，或让人形机器人先站稳再执行上肢动作，全身协调多靠分模块策略拼接。
  current_alternative_en: The common alternative is a wheeled base with a fixed-station arm, or a humanoid
    that stabilizes before moving its upper body, with whole-body coordination stitched from separate
    module policies.
  usage_reason: 推断：若自采全身交互数据真能让一套模型适配多种本体，团队可省去为每个本体单独采集与调参的环节，在需要移动中出力的工位优先试用；但公开材料只有演示视频，没有客户案例、定价或重复使用证据，尚不能确认团队已把它留在工作流里。
  usage_reason_en: 'Inference: if self-collected whole-body data really lets one model adapt across bodies,
    teams could skip per-body data collection and tuning and would trial it first at workstations requiring
    force while moving; however only demo footage is public, with no customer cases, pricing or repeat-use
    evidence, so sustained adoption cannot be confirmed.'
