  market: ''
  job: 具身智能与机器人研发团队在人形机器人需要边移动边进行抓取、搬运或登高等作业时，处理全身姿态与末端执行协调控制，以完成在人类工作环境中稳定连续操作的任务。
  job_en: Embodied AI and robotics teams, when humanoid robots need to grasp, carry, or climb while moving,
