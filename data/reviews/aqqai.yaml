  next_validation: 收集 Aqqai 官方文档或演示中关于校验执行方、校验标准与覆盖问题类型的公开说明。
  market: ''
  job: 用户在向问答系统提问并准备把答案用于实际决策时，需要先确认这个答案是否可靠，再决定是否采信。
  job_en: When a user asks a Q&A system a question and intends to act on the answer, they need to confirm
    the answer is reliable before trusting it.
  pain: 问答系统会给出看似流畅但可能错误的答案，用户缺少低成本的方式判断哪一句可信，错误答案被采信的代价可能很高。
  pain_en: Q&A systems produce fluent but possibly wrong answers, users lack a cheap way to tell which
    sentence is trustworthy, and acting on a wrong answer can be costly.
  current_alternative: 用户自己交叉搜索多个来源、凭经验判断，或干脆不用问答结果。
  current_alternative_en: Users cross-search multiple sources themselves, judge by experience, or simply
    do not use the Q&A output.
  usage_reason: 推断：如果校验真的在展示前发生并给出可核对的依据，用户就不必自己逐条交叉验证，在采信答案前少一道手工核对；但材料只有一句口号，没有说明校验主体、标准或覆盖范围，无法确认这一步负担是否真的被减少。
  usage_reason_en: 'Inference: if the check really happens before display and yields checkable grounds,
    users would not have to cross-verify each claim themselves, removing one manual step before trusting
    an answer. But the material is a single slogan with no checker, standard or coverage, so it cannot
    be confirmed that this step is actually reduced.'
