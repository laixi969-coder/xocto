  market: ''
  job: 开发者或小团队在让 AI 助手跨会话、跨工具工作时，把对话与笔记中的自由文本交给该工具，抽取成带出处的类型化承诺、决策与记忆，写入自己持有的 SQLite 文件，再通过 MCP、HTTP、库或类型化客户端在后续会话中取回。
  job_en: Developers or small teams, when running an AI assistant across sessions and tools, feed free
    text from conversations and notes into the tool, which extracts typed commitments, decisions and memories
    with provenance into a SQLite file they own, then retrieve them in later sessions via MCP, HTTP, library
    or typed client.
  pain: AI 助手每次会话结束即遗忘，承诺与决策散落在聊天记录、文档和脑子里，跨会话无法可靠复述，且无法追溯某条结论出自哪段原始材料；重新交代上下文或凭记忆重建既费时又易错。
  pain_en: AI assistants forget at the end of each session; commitments and decisions scatter across chat
    logs, documents and memory, cannot be reliably recalled across sessions, and cannot be traced back
    to the source passage; re-briefing or reconstructing from memory is slow and error-prone.
  current_alternative: 当前替代方式包括手工维护笔记或文档、把上下文粘贴进每次新会话、依赖通用向量记忆库或托管式记忆服务，以及干脆放弃跨会话记忆。
  current_alternative_en: Current alternatives include manually maintained notes or documents, pasting
    context into each new session, generic vector memory stores or hosted memory services, or simply giving
    up on cross-session memory.
  usage_reason: 相较手工笔记或托管记忆服务，该工具把自由文本自动转成带证据的类型化承诺、决策与记忆，并落在用户自己持有的 SQLite 文件里，减少手工整理与逐条核对出处这一步，同时避免把上下文交给第三方托管；重视数据自持与可追溯出处的开发者会在需要跨会话延续承诺与决策时选择它（推断）。
  usage_reason_en: Compared with manual notes or hosted memory services, the tool automatically converts
    free text into typed commitments, decisions and memories with evidence, stored in a SQLite file the
    user owns, removing the manual organising and per-item provenance checking step while avoiding handing
    context to a third party; developers who value data ownership and traceable provenance would choose
    it when commitments and decisions must persist across sessions (inference).
