  job_en: When developers or teams run an AI assistant across sessions, they need to organise commitments,
    decisions and memories from conversations into records with provenance and keep them long term.
  pain: 会话结束后上下文丢失，承诺与决策散落在聊天记录里，无法追溯依据，重复交代同一件事。
