  market: ''
  job: Mac 重度用户在日常工作中反复执行同一套文件整理、应用切换或定时操作时，需要把这些重复动作变成可一键运行的自动化，而不是每次手工重做。
  job_en: Mac power users who repeatedly perform the same file sorting, app switching, or scheduled operations
    need those repeats turned into one-click automations instead of redoing them by hand.
  pain: 旧做法要么手工重复，要么去学 AppleScript、快捷指令或命令行，学习成本高、出错后难排查，非技术用户往往直接放弃自动化。
  pain_en: The old path is either manual repetition or learning AppleScript, Shortcuts, or the command
    line, which is costly to learn and hard to debug, so non-technical users often give up on automation.
  current_alternative: 手工重复操作、AppleScript/快捷指令、找开发者代写脚本，或使用已有的 Mac 自动化工具。
  current_alternative_en: Manual repetition, AppleScript/Shortcuts, hiring a developer to write scripts,
    or existing Mac automation tools.
  usage_reason: 推断：相较学脚本或找人代写，Trama 让用户直接用自然语言描述任务并生成可运行的 macOS 自动化，省掉把需求翻译成脚本语法这一步，因此有固定重复动作、又缺乏编程能力的
    Mac 用户会在需要快速搭一条自动化时选择它；公开材料尚无留存或复购证据。
  usage_reason_en: 'Inference: compared with learning scripting or hiring someone, Trama lets users describe
    the task in plain language and get a runnable macOS automation, removing the step of translating intent
    into script syntax, so Mac users with fixed repetitive actions and no coding skill would pick it when
    they need an automation quickly; no retention or repeat-use evidence is public.'
