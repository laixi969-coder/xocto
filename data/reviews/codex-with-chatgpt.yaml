  market: ''
  job: 开发者在用 Codex 执行多步编码任务时，先把需求、拆解和方案交给 ChatGPT 做规划，再把计划交回 Codex 框架落地，完成从需求到可运行改动的整条链路。
  job_en: Developers planning multi-step coding tasks hand requirements, decomposition and design to ChatGPT
    as the planning brain, then feed the plan back into the Codex harness to produce runnable changes
    end to end.
  pain: 公开材料只给出「ChatGPT 思考、Codex 工作」这一句定位，未展示用户抱怨、issue 或案例；可确认的痛点是单一执行框架在长任务规划环节容易偏离意图，需要外部规划脑补位，但强度属结构推理而非用户口述。
  pain_en: Public material offers only the tagline 'ChatGPT thinks, Codex works' with no complaints, issues
    or cases; the inferable pain is that a single execution harness drifts from intent on long tasks and
    needs an external planning brain, which is structural inference rather than user testimony.
  current_alternative: 开发者原本在 ChatGPT 网页与 Codex 终端之间手工复制粘贴计划，或只用 Codex 单框架硬扛规划，靠人肉搬运上下文。
  current_alternative_en: Developers previously copy-pasted plans by hand between the ChatGPT web UI and
    the Codex terminal, or forced Codex alone to handle planning, manually shuttling context.
  usage_reason: 推断：它把 ChatGPT 的规划输出直接接进 Codex 执行框架，省掉人工复制粘贴与上下文重述这一步，因此常做多步重构、需要先出方案再落地的开发者会在长任务场景选择它；公开材料未提供留存或复购证据。
  usage_reason_en: 'Inference: it wires ChatGPT''s planning output directly into the Codex harness, removing
    the manual copy-paste and context restatement step, so developers doing multi-step refactors that
    need a plan before execution would pick it for long tasks; no retention or repeat-use evidence is
    public.'
