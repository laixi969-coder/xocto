  market: ''
  job: 内容或工程团队在代理批量写入文稿后，需要判断哪些段落带有 AI 写作套路，于是让 sloptrim 在本地扫描每个文本文件并给出评分，用于决定哪些稿子需要人工重写。
  job_en: After agents write prose in bulk, a content or engineering team needs to know which passages
    carry AI-writing patterns, so sloptrim scans each text file locally and returns a score to decide
    what needs human rewriting.
  pain: 代理产出的文字量大且腔调雷同，人工逐篇通读成本高，等到发布后被发现是机器稿才返工，代价更大。
  pain_en: Agent output is voluminous and uniform in tone; reading every piece by hand is costly, and
    discovering the machine-written feel after publishing forces expensive rework.
  current_alternative: 现在靠人工抽读、凭经验判断，或用联网的 AI 检测服务，但后者要上传文本、结果也不稳定。
  current_alternative_en: Today teams skim by hand, judge by experience, or use online AI-detection services
    that require uploading text and give unstable results.
  usage_reason: 推断：相较上传到联网检测服务或人工抽读，它在本地对每个保存的文件即时打分，省掉上传与等待这一步，因此在意稿件外发风险的团队会在保存环节用它；尚无留存或复购证据。
  usage_reason_en: 'Inference: versus uploading to an online detector or skimming by hand, it scores each
    saved file locally and instantly, removing the upload-and-wait step, so teams worried about outbound
    copy would use it at save time; no retention or repeat-use evidence yet.'
