  market: ''
  job: 企业安全团队在把AI智能体接入内部数据系统前，需要盘点智能体可访问的数据与权限，并在上线后监控其调用行为、处置越权风险。
  job_en: Before connecting AI agents to internal data systems, enterprise security teams must inventory
    the data and permissions agents can reach, then monitor their calls and handle privilege-escalation
    risk after launch.
  pain: 智能体自主调用数据，越权或越狱一旦发生，敏感数据可能被批量读取或外泄；旧的数据分类和人工权限审批跟不上代理的高频调用。
  pain_en: Agents call data autonomously; once privilege escalation or jailbreak occurs, sensitive data
    can be read or leaked at scale, and legacy classification and manual permission approval cannot keep
    up with high-frequency agent calls.
  current_alternative: 企业目前多靠人工梳理数据资产、静态权限配置和通用DLP工具，缺少针对智能体行为的专门监控。
  current_alternative_en: Firms currently rely on manual data-asset mapping, static permission settings
    and general DLP tools, lacking monitoring specific to agent behavior.
  usage_reason: 推断：相较人工盘点和静态权限，Cyera通过自动识别智能体可触达的数据并持续监控调用，把“上线前逐项排查、上线后靠日志回溯”压缩为可核对的发现与处置清单，因此急于上智能体又受合规约束的安全团队会选用它。
  usage_reason_en: 'Inference: versus manual inventory and static permissions, Cyera automatically identifies
    data agents can reach and continuously monitors calls, compressing pre-launch item-by-item checks
    and post-launch log forensics into a checkable findings-and-remediation list, so compliance-bound
    teams rushing agents into use would choose it.'
