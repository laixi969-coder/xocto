  market: ''
  job: Mac 用户在桌面和下载文件夹堆积大量文件、找不到东西时，需要把这些文件归类并清掉无用项，让工作目录重新可用。
  job_en: When a Mac user's desktop and Downloads folder are piled with files and things cannot be found,
    they need those files sorted and the useless ones cleared so the working directory is usable again.
  pain: 文件堆积本身不致命，用户通常能忍；候选材料没有给出任何用户抱怨、整理耗时或误删代价，痛点强度无法从公开事实判断。
  pain_en: File clutter is rarely fatal and users usually tolerate it; the candidate material offers no
    user complaints, time cost, or cost of mistaken deletion, so pain intensity cannot be judged from
    public facts.
  current_alternative: 用户目前靠手动拖拽、按日期重命名、系统自带的智能文件夹或干脆不整理来应付。
  current_alternative_en: Users currently cope by dragging files manually, renaming by date, using built-in
    smart folders, or simply not tidying at all.
  usage_reason: 推断：如果它真能一次完成归类并给出可撤销的结果，用户会在下载文件夹刚堆满时选择它，省掉逐条判断和拖拽这一步；但候选材料没有说明它如何判断保留与删除，也没有任何采用或重复使用证据，因此无法确认用户会持续使用。
  usage_reason_en: 'Inference: if it truly sorts in one pass and the result is reversible, users would
    pick it when the Downloads folder just filled up, skipping the step of judging and dragging each file;
    but the material does not explain how it decides what to keep or delete, and there is no adoption
    or repeat-use evidence, so continued use cannot be confirmed.'
