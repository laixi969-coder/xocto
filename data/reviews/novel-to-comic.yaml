  market: ''
  job: 小说作者或漫画改编编辑在要把一部文字小说改成漫画时，把长篇文本交给工作流，拆出分镜并生成漫画页，交付可连载的漫画稿。
  job_en: A novelist or comic adaptation editor turning a text novel into comics feeds long-form text
    into the workflow, splits storyboards and generates comic pages to deliver a serializable comic draft.
  pain: 人工改编要先通读全文、手写分镜、再逐格约稿或绘制，周期长、成本高，且画风与人物设定容易前后不一致。
  pain_en: Manual adaptation requires reading the whole text, hand-writing storyboards and then commissioning
    or drawing panel by panel, which is slow, costly and prone to inconsistent art style and character
    design.
  current_alternative: 目前多由人工编剧写分镜、外包画师逐格绘制，或使用通用图像生成工具逐张出图再人工拼接。
  current_alternative_en: Today it is mostly done by human scriptwriters writing storyboards and outsourced
    artists drawing panel by panel, or by generating images one by one with general image tools and stitching
    them manually.
  usage_reason: 推断：它把分镜拆分与出图串成一条可重复执行的流程，省去逐格手工拼接这一步，因此需要批量把小说转成漫画的网文平台或漫画工作室会尝试它；但公开材料只有仓库说明与 41 个星标，没有用户反馈或成稿案例，无法确认画风一致性与实际交付质量。
  usage_reason_en: 'Inference: it chains storyboard splitting and image generation into a repeatable flow,
    removing the manual panel-by-panel stitching step, so web-fiction platforms or comic studios converting
    novels at volume would try it; however public material is only a repository description and 41 stars,
    with no user feedback or finished-work cases, so art-style consistency and real delivery quality cannot
    be confirmed.'
