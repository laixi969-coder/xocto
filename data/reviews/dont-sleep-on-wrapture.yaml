  market: ''
  job: Python 后端工程师在线上服务变慢或行为异常、又不想改动业务代码时，用一份 TOML 配置对指定模块和函数打补丁，记录方法调用时间线、汇总耗时并导出 OpenTelemetry 链路，以定位问题调用。
  job_en: A Python backend engineer facing a slow or misbehaving service, without editing application
    code, patches chosen modules and functions via a TOML file, records method-call timelines, aggregates
    timing and exports OpenTelemetry traces to locate the offending call.
  pain: 线上 Python 服务的性能与行为问题往往只能靠加日志、改代码或临时断点排查，改完还要回滚；测试替身与生产追踪是两套工具，切换成本高。
  pain_en: Performance and behaviour problems in live Python services are usually chased by adding logs,
    editing code or temporary breakpoints, then rolling back; test doubles and production tracing are
    separate toolchains with high switching cost.
  current_alternative: 手工插入日志或 print、用 unittest.mock 写测试替身、接入 New Relic 一类商业 APM，或使用 OpenTelemetry 手工埋点。
  current_alternative_en: Hand-inserted logs or prints, unittest.mock test doubles, commercial APM such
    as New Relic, or manual OpenTelemetry instrumentation.
  usage_reason: 相较改代码加日志或手工埋点，wrapture 通过 TOML 配置在运行时对目标函数打补丁，省去改代码与回滚这一步，并把调用记录、耗时汇总和链路导出放在同一处；推断需要在不重启业务逻辑、快速定位慢调用的
    Python 团队会在排查期选择它。
  usage_reason_en: Compared with editing code to add logs or instrumenting by hand, wrapture patches target
    functions at runtime from a TOML file, removing the edit-and-rollback step and keeping call recording,
    timing aggregation and trace export in one place; by inference, Python teams that need to locate slow
    calls quickly without touching business logic will pick it during an investigation.
