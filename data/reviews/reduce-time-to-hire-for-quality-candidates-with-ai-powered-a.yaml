  market: ''
  job: 大规模招聘的招聘负责人在初筛阶段处理成批简历与面试安排，要筛出进入下一轮的候选人并保持评估口径一致。
  job_en: Talent acquisition leads handling hiring at scale work through batches of resumes and interview
    scheduling at the screening stage, needing to shortlist candidates for the next round while keeping
    assessment criteria consistent.
  pain: 初筛量大、面试官标准不一，人工安排与记录耗时，且评估结果难以横向比较。
  pain_en: Screening volume is large, interviewer standards vary, manual scheduling and note-taking are
    time-consuming, and assessment results are hard to compare across candidates.
  current_alternative: 目前主要靠招聘专员人工筛简历、电话初筛和面试官各自记录评价。
  current_alternative_en: Today this relies mainly on recruiters manually screening resumes, phone screens
    and interviewers keeping their own evaluation notes.
  usage_reason: 相较人工初筛，它按统一标准发起 AI 面试并生成可追溯的评估与评分，减少招聘专员逐份安排与整理记录的工作，也让不同候选人的结果可横向比较；因此招聘量大、需要统一口径的招聘团队会在初筛环节选择它。这是基于产品能力的推断，尚无客户案例佐证。
  usage_reason_en: Compared with manual screening, it runs AI-led interviews to a consistent standard
    and produces traceable assessments and scores, reducing the recruiter's work of scheduling and compiling
    notes one by one and making results comparable across candidates; teams with high hiring volume and
    a need for consistent criteria would therefore choose it at the screening stage. This is inference
    from product capability, not yet supported by customer cases.
