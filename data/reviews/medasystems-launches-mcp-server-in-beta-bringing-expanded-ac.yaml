  job_en: Expanded-access leads or clinical teams at drugmakers assess whether a patient qualifies for
    compassionate use, working through program eligibility and drug documents to locate available programs
    and decide the next application step.
  pain: 扩展用药项目信息分散在各药企、字段不统一，人工查找慢且容易漏掉可用项目；判断错误会延误重症患者的用药机会。
  pain_en: Expanded-access program information is scattered across drugmakers with inconsistent fields,
    so manual lookup is slow and can miss available programs; a wrong judgment delays access for seriously
    ill patients.
  current_alternative: 目前多靠人工检索药企项目页面、行业目录和邮件询问，或依赖个人关系网络。
  current_alternative_en: Today this mostly relies on manually searching drugmaker program pages and industry
    directories, emailing contacts, or personal networks.
  usage_reason: 推断：相较逐页人工检索，MCP 服务器让 AI 助手直接调取结构化项目数据，减少定位与比对项目这一步；药企或临床团队在需要快速筛查多个项目时会选择它，但公开材料未给出用户反馈或采用数据。
  usage_reason_en: 'Inference: compared with page-by-page manual search, the MCP server lets AI assistants
    pull structured program data directly, cutting the step of locating and comparing programs; drugmakers
    or clinical teams screening multiple programs quickly would choose it, but no user feedback or adoption
    data is public.'
