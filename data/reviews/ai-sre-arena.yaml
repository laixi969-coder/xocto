  market: ''
  job: SRE 或平台运维工程师在评估是否让 AI 代理接管 Kubernetes 故障处置时，需要把候选代理放进统一故障场景里跑，得到可比较的评测结论。
  job_en: An SRE or platform operations engineer evaluating whether an AI agent can take over Kubernetes
    incident handling needs to run candidate agents through shared failure scenarios and obtain comparable
    evaluation results.
  pain: 运维代理的可靠性无法靠演示判断，各家口径不一，选型时缺少可复现的对照依据。
  pain_en: The reliability of operations agents cannot be judged from demos, vendors use different criteria,
    and there is no reproducible basis for comparison during selection.
  current_alternative: 靠厂商演示、内部小范围试跑或人工经验判断，缺少公开统一的对照基准。
  current_alternative_en: Vendor demos, small internal trials, or human experience, with no shared public
    benchmark for comparison.
  usage_reason: 推断：它把故障场景和评分口径固定下来，使选型方不必自己搭建对照环境就能比较不同代理，因此正在做运维代理选型的团队会关注它；但目前没有证据表明有人已把它长期用于采购或验收流程。
  usage_reason_en: 'Inference: by fixing failure scenarios and scoring criteria, it lets evaluators compare
    agents without building their own test environment, so teams selecting operations agents may follow
    it; there is no evidence yet that anyone uses it routinely in procurement or acceptance.'
