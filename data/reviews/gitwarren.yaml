  market: ''
  job: 开发者（尤其是用编码代理写码的人）在 commit 前完成一次代码审查，确保只有可用的改动进入分支。
  job_en: Developers, especially those writing code with coding agents, run a code
    review before committing so only sound changes enter the branch.
  pain: 代理生成代码的速度远超人工评审能力，diff 读不过来；问题往往在提交、推送甚至合并后才被发现，返工成本高。
  pain_en: Agents produce code faster than humans can review it; issues surface only
    after commit, push, or merge, making rework costly.
  current_alternative: 开发者自己逐行读 diff，或依赖推送后的同事 PR 评审、CI 测试与 lint 规则兜底。
  current_alternative_en: Developers read diffs line by line themselves, or rely on
    post-push peer PR review, CI tests, and lint rules as backstops.
  usage_reason: 提交前的最后把关环节真实存在，代理生成量越大越需要它；开发者已习惯用 CI、lint 等自动化闸门，会愿意在 commit 链路里加一道自动审查。
  usage_reason_en: The pre-commit gate is a real checkpoint that grows more necessary
    as agent output grows; developers already automate gates with CI and lint, so
    adding an automated review step fits their habits.
