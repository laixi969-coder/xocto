  pain_en: Public material shows the old path requires manual voiceover, sentence-by-sentence subtitle
    alignment and repeated exports in editing software, costing hours per video with unstable voice quality;
    and an agent cannot watch a video, so it lacks checkable intermediates to self-verify output quality.
  current_alternative: 用剪辑软件手工配音与对轴，或购买云端 AI 配音与视频生成服务；前者费时，后者按量付费且素材需上传到第三方。
  current_alternative_en: Manual voiceover and timeline alignment in editing software, or paid cloud AI
    voiceover and video generation services; the former is slow, the latter is metered and requires uploading
