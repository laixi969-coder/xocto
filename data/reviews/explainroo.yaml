  market: ''
  job: 开源项目维护者或产品营销人员在发布新版本、新功能或做产品演示时，把一段文字脚本交给本地运行的 AI agent，产出带旁白的讲解视频 MP4，用于发布说明、落地页或教学材料。
  job_en: Open-source maintainers or product marketers who, when shipping a new version, feature or product
    demo, hand a written script to a locally running AI agent to produce a narrated explainer MP4 for
    release notes, landing pages or teaching material.
