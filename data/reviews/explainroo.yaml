  usage_reason_en: 'Inference: it chains local voice synthesis, word-level timing and canvas rendering
    into one pipeline so a script yields a finished cut, removing manual voiceover and line-by-line alignment;
    it also saves scene stills and a whole-video frame sheet so the agent can check visuals, which is
    why developers and marketers who want assets to stay local and avoid learning editing would pick it
    for explainer videos.'
