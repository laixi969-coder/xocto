  market: ''
  job: 用户想要一个低门槛的实物平台来学习和实验强化学习与 sim-to-real 机器人控制。
  job_en: Users want a low-barrier physical platform to learn and experiment with reinforcement learning
    and sim-to-real robot control.
  pain: 传统机器人研究平台昂贵（如 Reachy 2 约 7 万美元），且需要专业知识和设备，爱好者难以接触。
  pain_en: Traditional robot research platforms are expensive (e.g., Reachy 2 at ~$70k) and require specialized
    knowledge and equipment, making them inaccessible to hobbyists.
  current_alternative: 目前替代方式是使用纯仿真环境（如 MuJoCo）或购买高价研究机器人，前者缺乏实物反馈，后者成本过高。
  current_alternative_en: Current alternatives are pure simulation environments (e.g., MuJoCo) or expensive
    research robots; the former lacks physical feedback, the latter is too costly.
  usage_reason: Microduck 以 399 美元的价格提供可玩、可编程的实物平台，软件开源且社区活跃，降低了入门门槛，吸引教育者和爱好者采用。
  usage_reason_en: Microduck offers a playable, programmable physical platform at $399 with open-source
    software and an active community, lowering the entry barrier and attracting educators and hobbyists.
