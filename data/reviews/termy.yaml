  market: ''
  job: 语言学习者在真实内容中遇到生词时，希望不打断沉浸体验就能理解并记住。
  job_en: Language learners encountering unfamiliar words in authentic content want to understand and
    remember them without breaking immersion.
  pain: 传统背单词脱离语境，记忆效果差；查词典打断阅读或游戏体验。
  pain_en: Traditional vocabulary memorization lacks context, leading to poor retention; looking up words
    disrupts reading or gaming flow.
  current_alternative: 使用词典应用、翻译插件或手动记录生词。
  current_alternative_en: Using dictionary apps, translation extensions, or manually noting words.
  usage_reason: 产品将学习嵌入用户已有的娱乐和浏览行为，降低额外学习成本，可能吸引注重趣味性的学习者。
  usage_reason_en: The product embeds learning into existing entertainment and browsing habits, reducing
    extra effort, potentially attracting learners who value fun.
