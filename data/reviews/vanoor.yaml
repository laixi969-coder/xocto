  next_validation: 收集 Vanoor 官方产品页或应用商店说明，确认其与 Apple Watch 自带跑步功能的具体差异、是否使用 AI 以及定价。
  market: ''
  job: 戴 Apple Watch 跑步的人，在训练或比赛途中需要按目标配速跑并查看路线时，处理手表采集的位置与运动数据，要得到实时的配速提示和地图显示。
  job_en: People running with an Apple Watch who, during training or a race, need to hold a target pace
    and view a route, process location and motion data from the watch to get real-time pacing cues and
    a map display.
  pain: 公开材料只有一句定位描述，未说明现有 Apple Watch 自带跑步功能具体缺哪一步、跑者因此遇到什么麻烦。
  pain_en: The public material is a single positioning line and does not say which step the built-in Apple
    Watch running features lack, or what trouble runners hit because of it.
  current_alternative: 旧做法可能是直接用 Apple Watch 自带的体能训练应用，或使用其他跑步记录应用。
  current_alternative_en: The prior approach may be using the built-in Apple Watch workout app directly,
    or another running-tracking app.
  usage_reason: 推断：若它能在跑步过程中给出比自带应用更明确的配速提示与路线显示，跑者就不必在跑动中自己判断配速，因此有明确配速目标的跑者可能选择它。但公开材料未说明与自带功能的差异，这一因果仍缺一环。
  usage_reason_en: 'Inference: if it gives clearer pacing cues and route display during a run than the
    built-in app, runners would not have to judge pace themselves mid-run, so runners with explicit pace
    goals might choose it. However, the public material does not describe the difference from built-in
    features, so this causal chain is still missing a link.'
