  next_validation: 收集该仓库的 issue / discussion 与 README 更新，确认 MCP 驱动模拟器是否被外部团队实际用于回归测试。
  market: ''
  job: 移动端开发者和测试工程师在 Mac 上调试或回归 Android 应用时，需要反复设置模拟器的深色模式、字号、RTL、TalkBack、网络与 GPS 条件，并查看 dp 布局，以复现某个界面问题。
  job_en: Mobile developers and QA engineers debugging or regression-testing an Android app on a Mac need
    to repeatedly set emulator dark mode, font size, RTL, TalkBack, network and GPS conditions and inspect
    dp layout to reproduce a UI issue.
  pain: 这些设置分散在 ADB 命令和模拟器菜单里，切换成本高、难以复现同一组条件，编码代理也无法直接操作模拟器，导致复现和验证要人工来回搬运。
  pain_en: These settings are scattered across ADB commands and emulator menus, are costly to switch and
    hard to reproduce as one condition set, and coding agents cannot drive the emulator directly, so reproduction
    and verification require manual back-and-forth.
  current_alternative: 开发者目前用命令行 ADB、模拟器自带菜单和 Layout Inspector 手工完成，或写一次性脚本；编码代理只能改代码，不能改模拟器状态。
  current_alternative_en: Developers currently do this by hand with ADB commands, the emulator's own menus
    and Layout Inspector, or write one-off scripts; coding agents can only edit code, not emulator state.
  usage_reason: 相较手工敲 ADB 和逐项点菜单，它把模拟器状态设置与布局读取收进一个界面并暴露为 MCP 工具，代理可以直接把模拟器调到目标条件再验证，省掉人工复现环境这一步；推断，面向频繁做
    UI 回归的移动端团队。
  usage_reason_en: Compared with typing ADB commands and clicking through menus, it puts emulator state
    settings and layout reading into one interface exposed as MCP tools, so an agent can set the emulator
    to target conditions and verify, removing the manual environment-reproduction step; inference, aimed
    at mobile teams doing frequent UI regression.
