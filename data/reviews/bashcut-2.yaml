  market: ''
  job: 视频剪辑师或内容运营在已有素材上需要完成分层剪辑、字幕和配音时，让编码代理通过 CLI 或 MCP 驱动时间线并产出成片。
  job_en: A video editor or content operator with existing footage needs layered cuts, captions and voiceover,
    and lets a coding agent drive the timeline via CLI or MCP to produce a finished cut.
  pain: 重复的剪辑、字幕和配音操作需要逐项手动点击，批量任务耗时且难以脚本化；代理可把这些步骤变成可重复执行的命令。
  pain_en: Repetitive cutting, captioning and voiceover require manual clicking item by item; batch tasks
    are slow and hard to script, while an agent can turn these steps into repeatable commands.
  current_alternative: 剪辑师在传统非线性编辑软件里手动操作，或用脚本与模板半自动化，批量任务仍需人工逐步完成。
  current_alternative_en: Editors work manually in traditional non-linear editors or semi-automate with
    scripts and templates, still finishing batch tasks step by step by hand.
  usage_reason: 推断：相较手动逐项点击，代理通过 CLI 或 MCP 直接执行时间线、字幕和配音操作，减少重复点击这一步；需要批量出片且能接受人工复核的团队会因此选择它。
  usage_reason_en: 'Inference: versus manual clicking, the agent executes timeline, caption and voiceover
    operations directly via CLI or MCP, removing the repetitive-click step; teams needing batch output
    who accept human review would choose it.'
