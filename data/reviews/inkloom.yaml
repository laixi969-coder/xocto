  usage_reason_en: 'Inference: compared with generators that only output images, it splits brand constraints,
    typography, symbols and clear-space rules into separately callable steps and directly produces lockups
    and clear-space specs, cutting the designer''s post-hoc specification work; editability and commercial
    use are undisclosed, so the reduced burden is specification clean-up.'
