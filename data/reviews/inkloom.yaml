  market: ''
  job: 小企业主或独立设计师在为新业务做品牌标识时，需要把业务定位转成可用的标志组合与留白规范，而不是只拿到几张图。
  job_en: A small business owner or independent designer creating a brand mark for a new business needs
    the positioning turned into usable lockups and clear-space rules, not just a few images.
  pain: 通用图像生成给不出可落地的规范，设计师仍需手工补字体、间距与留白规则，返工多。
  pain_en: Generic image generation does not produce a usable specification; designers still hand-build
    typography, spacing and clear-space rules, causing rework.
  current_alternative: 通用图像生成工具加设计师手工整理，或直接购买现成模板。
  current_alternative_en: Generic image generators plus manual designer clean-up, or buying ready-made
    templates.
  usage_reason: 推断：相较通用生成只出图，它把品牌约束、字体、符号与留白规则拆成可分别调用的环节，直接产出锁定组合与留白规范，减少设计师事后补规范这一步；是否可编辑与可商用未披露，因此减少的是规范整理负担。
  usage_reason_en: 'Inference: compared with generators that only output images, it splits brand constraints,
    typography, symbols and clear-space rules into separately callable steps and directly produces lockups
    and clear-space specs, cutting the designer''s post-hoc specification work; editability and commercial
    use are undisclosed, so the reduced burden is specification clean-up.'
