  market: ''
  job: 运营分析师在预测销量、设备负荷或需求曲线时，把历史时间序列及已知未来协变量交给模型，要产出可用于排产、补货或容量安排的概率预测。
  job_en: Operations analysts forecasting sales, equipment load or demand curves feed historical time
    series and known-future covariates into a model to produce probabilistic forecasts usable for scheduling,
    replenishment or capacity planning.
  pain: 公开材料显示模型面向多变量概率预测并支持过去与未来协变量；结构推理上，旧流程需为每条序列单独做特征工程与调参，跨品类、跨设备维护成本高，且点预测无法表达不确定性。
  pain_en: Public materials show the model targets multivariate probabilistic forecasting with past and
    future covariates; by structural inference, the old workflow requires per-series feature engineering
    and tuning, costly to maintain across categories or equipment, and point forecasts cannot express
    uncertainty.
  current_alternative: 用 Excel、传统统计模型（如 ARIMA、指数平滑）或自建预测管道，逐序列调参并人工拼接协变量。
  current_alternative_en: Using Excel, classical statistical models (e.g. ARIMA, exponential smoothing)
    or self-built pipelines, tuning per series and manually joining covariates.
  usage_reason: 推断：仓库提供独立推理，模型可在 CPU 上零样本出预测，减少逐序列特征工程与调参这一步；但公开材料未给出客户准确率对比或持续使用证据，因此哪类用户会长期选择它仍属推断。
  usage_reason_en: 'Inference: the repository offers standalone inference and the model forecasts zero-shot
    on CPU, cutting the per-series feature-engineering and tuning step; however public materials give
