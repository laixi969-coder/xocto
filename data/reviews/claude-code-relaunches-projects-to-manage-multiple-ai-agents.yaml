  market: ''
  job: 软件工程师与研发负责人在一个仓库里同时推进多项编码任务时，处理代码文件、任务目标与历史资料，要完成的是让多个 agent 并行干活并汇总可合入的改动。
  job_en: Software engineers and engineering leads, when pushing several coding tasks in one repository
    at once, handle code files, task goals and history to get multiple agents working in parallel and
    collect mergeable changes.
  pain: 多个 agent 各自为战会丢失上下文、重复劳动，任务之间的目标与文件状态难以对齐，人工来回搬运上下文成本高。
  pain_en: Separate agents lose context and duplicate work, goals and file state drift apart across tasks,
    and humans pay a high cost shuttling context back and forth.
  current_alternative: 开多个终端或会话分别跑 agent，靠人工复制粘贴上下文与目标，或用脚本自行拼接。
  current_alternative_en: Running agents in separate terminals or sessions and manually copying context
    and goals, or gluing them together with scripts.
  usage_reason: 相较人工在多个会话间搬运上下文，它把共享记忆、目标与文件库放在同一项目下，由协调者分配并行线程，省去重复交代背景这一步，因此同时推进多项编码任务的团队会在这种情况下选择它；持续使用证据尚未公开。
  usage_reason_en: Compared with manually moving context between sessions, it keeps shared memory, goals
    and a file library in one project and lets a coordinator assign parallel threads, removing the step
    of re-explaining background, so teams running several coding tasks at once would choose it; sustained-use
    evidence is not public.
