    history and existing knowledge; the developer wants the agent to retain project context across sessions
    instead of re-feeding it each time.
  pain: 公开材料只说明 OKF 是一种把知识写成 markdown 的格式规范，未记录任何开发者关于代理失忆、重复喂上下文或 token 浪费的具体抱怨、频率或代价。
