  market: ''
  job: 做摩洛哥本地研究、公共政策分析或地图产品的人，在需要市镇级人口与边界数据时，通过 API 或 MCP 服务器按编码取数，用于统计与制图。
  job_en: People doing Morocco-focused research, policy analysis or map products fetch commune-level population
    and boundary data by code through the API or MCP server for statistics and mapping.
  pain: 市镇级普查数据与边界通常散落在官方文件或表格里，编码口径不一，整理成可用数据集要花大量手工时间，且容易对不上年份。
  pain_en: Commune-level census data and boundaries are usually scattered across official files and tables
    with inconsistent coding, so assembling a usable dataset takes heavy manual work and easily mismatches
    years.
  current_alternative: 此前多靠手工下载官方普查文件、自行清洗编码并拼接边界文件，或使用覆盖不全的第三方地图数据。
  current_alternative_en: Previously teams manually downloaded official census files, cleaned codes themselves
    and joined boundary files, or used incomplete third-party map data.
  usage_reason: 推断：相比手工清洗，它把编码、两轮普查与边界打包成统一接口，使用者少做一次数据清洗与对齐，因此需要反复取数的研究者或地图开发者会在建库阶段选择它。
  usage_reason_en: 'Inference: versus manual cleaning, it packages codes, two census rounds and boundaries
    behind one interface, saving a cleaning and alignment step, so researchers or map developers who query
    repeatedly would pick it when building a dataset.'
