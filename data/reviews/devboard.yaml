  market: ''
  job: 小型开发团队在迭代排期时，把需求拆成任务、分配负责人并跟踪状态，处理的是待办事项与进度信息，最终交付一份团队共享的任务看板与进度状态。
  job_en: Small dev teams breaking requirements into tasks, assigning owners and tracking status during
    iteration planning, working from to-do items and progress data, delivering a shared task board and
    status.
  pain: ClickUp、Jira 这类重型工具配置项多、上手与维护成本高，小团队被迫在功能过剩的界面里做简单排期；同时任务状态散落在工具与聊天记录中，需要人工同步。
  pain_en: Heavy tools like ClickUp and Jira carry many configuration options and high setup and upkeep
    costs, forcing small teams to do simple scheduling in an over-featured interface, while task status
    scatters across tools and chat and must be synced by hand.
  current_alternative: 继续用 ClickUp、Jira、Linear，或用表格加聊天工具手工同步任务状态。
