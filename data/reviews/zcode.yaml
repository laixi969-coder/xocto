  market: ''
  job: 开发者在本地或公司私有仓库里用编程智能体改代码、跑任务，需要把仓库内容交给工具处理，同时要保证提交历史、密钥和未公开代码不外流。
  job_en: Developers use a coding agent to edit code and run tasks in local or private corporate repositories,
    handing repository content to the tool while needing commit history, secrets and unreleased code to
    stay in.
  pain: 把仓库交给智能体就等于把提交历史、作者信息和可能夹带的密钥一起交出去；一旦在未告知的情况下外传，团队无法追溯泄露范围，也无法向客户或合规方交代。
  pain_en: Handing a repository to an agent means handing over commit history, author data and possibly
    embedded secrets; if it leaves without notice, the team cannot trace the leak scope or answer customers
    and auditors.
  current_alternative: 旧做法是人工审查工具权限、靠厂商隐私条款和内部规范约束，或干脆禁止在私有仓库使用外部编码智能体。
  current_alternative_en: The old approach is manual permission review, relying on vendor privacy terms
    and internal policy, or simply banning external coding agents on private repositories.
  usage_reason: 相较只靠条款和人工规范，审计类工具通过记录智能体实际读取与发送的文件、并在外传前拦截，把「事后无法追溯」变成可核对的访问日志，因此正在把编码智能体接入私有仓库的研发与安全团队会在合规评审时选择它。这是基于工作流结构的推断。
  usage_reason_en: Compared with relying on terms and manual policy, an auditing tool records which files
    the agent actually read and sent and can block exfiltration, turning untraceable incidents into checkable
    access logs, so engineering and security teams wiring coding agents into private repos would pick
    it during compliance review. This is inference from workflow structure.
