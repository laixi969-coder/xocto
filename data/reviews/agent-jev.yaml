  market: ''
  job: agent 开发者在多步自动化流程运行中，需要根据当前的 diff、trace 或日志判断下一步是继续、重试还是升级处理。
  job_en: Agent developers, while a multi-step automation flow is running, need to judge from the current
    diff, trace or log whether the next step should continue, retry or escalate.
  pain: 用大模型做这类判断要等逐 token 生成，延迟和成本都高，而流程里往往只需要一个快速的是否判断。
  pain_en: Using a large model for such judgements means waiting for token-by-token generation, with high
    latency and cost, while the flow often only needs a fast yes-or-no decision.
  current_alternative: 现在多由开发者写规则或阈值脚本，或直接调用大模型对话接口做判断，再自己解析输出。
  current_alternative_en: Today developers mostly write rule or threshold scripts, or call a large-model
    chat endpoint and parse the output themselves.
  usage_reason: 推断：如果它真能在约 50 毫秒内返回概率分布且不逐 token 生成，就省掉了等待大模型输出再解析的那一步，对延迟敏感的多步 agent 流程有吸引力；但公开材料没有说明概率如何转成动作、阈值谁定，因此尚不能确认用户会持续使用。
  usage_reason_en: 'Inference: if it really returns a probability distribution in about 50 ms without
    token-by-token generation, it removes the step of waiting for large-model output and parsing it, which
    appeals to latency-sensitive multi-step agent flows; however the public material does not say how
    probabilities become actions or who sets thresholds, so continued use cannot be confirmed.'
