  market: ''
  job: agent 开发者在多步自动化流程运行中，拿到当前的 diff、trace 或日志等非结构化状态，需要判断下一步是继续、重试还是升级人工处理。
  job_en: Agent developers, while a multi-step automation flow is running, take the current unstructured
    state (diff, trace or log) and must decide whether the next step should continue, retry or escalate
    to a human.
  pain: 用大模型做这类判断要等逐 token 生成，延迟和成本都高，而流程里往往只需要一个快速的是否判断；规则脚本又难以覆盖非结构化状态。
  pain_en: Using a large model for such judgements means waiting for token-by-token generation with high
    latency and cost, while the flow often only needs a fast yes-or-no decision; rule scripts struggle
    to cover unstructured state.
  current_alternative: 现在多由开发者写规则或阈值脚本，或直接调用大模型对话接口做判断，再自己解析输出。
  current_alternative_en: Today developers mostly write rule or threshold scripts, or call a large-model
    chat endpoint and parse the output themselves.
  usage_reason: 推断：相较写规则脚本或调用大模型对话接口再解析输出，它把非结构化状态与结构化问题合并成一次约 50 毫秒的前向打分，省掉等待逐 token 生成和解析文本这一步，因此对延迟敏感、需要每步快速判断的多步
    agent 编排者会在流程中选用它；但概率如何转成动作、阈值谁定，公开材料未说明。
  usage_reason_en: 'Inference: compared with writing rule scripts or calling a chat endpoint and parsing
    its text, it folds unstructured state plus a structured question into one ~50 ms forward scoring pass,
    removing the wait for token-by-token generation and output parsing, so latency-sensitive multi-step
    agent orchestrators would pick it mid-flow; however how probabilities become actions and who sets
    thresholds is not stated publicly.'
