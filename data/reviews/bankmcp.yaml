  market: ''
  job: 让本地 AI 智能体直接读取个人银行账户流水与余额以进行财务分析。
  job_en: Enable local AI agents to read bank transaction history and balances for financial analysis.
  pain: 手动导出银行 CSV 或向云端第三方工具泄露银行凭据存在安全隐私风险且流程割裂。
  pain_en: Exporting CSVs manually or sharing bank credentials with cloud tools poses privacy risks and
    breaks workflow.
  current_alternative: 手动登录网银导出对账单，或使用传统记账软件及云端聚合服务。
  current_alternative_en: Manually downloading bank statements or using cloud-based financial tracking
    apps.
  usage_reason: 采用标准 MCP 协议与本地开源部署，兼顾了 AI 交互便捷性与金融数据的只读安全性。
  usage_reason_en: Provides a standardized MCP interface and self-hosted read-only access ensuring privacy
    and convenience.
