- id: req-full-bankmcp-2026-09-12
  project_slug: bankmcp
  level: full
  reviewed_at: '2026-09-12T00:43:36Z'
  verdict: true_demand
  signal_level: 初步成立
  gates:
  - gate: value
    status: supported
    reason: 它解决的是让本地 AI 读取真实银行流水这一需求：旧做法要逐家网银导出再手工粘贴，多账户与订阅扣款难以归集，AI 拿不到真实数据。产品以只读、自托管方式经 Enable Banking
      接入 2,700+ 欧洲银行并暴露给 MCP 客户端，交付路径可确定；这是工作流结构推理，尚无用户采用数据。
