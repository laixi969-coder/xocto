  market: ''
  job: 服装电商运营或线上导购在顾客询问某件衣服上身效果时，处理顾客自拍与商品服装图，要产出一张可发给顾客的试穿效果图。
  job_en: An apparel e-commerce operator or online shopping assistant, when a shopper asks how a garment
    looks on them, handles the shopper's selfie and the product garment image to produce a try-on image
    that can be sent back to the shopper.
  pain: 顾客看不到自己穿上的样子，只能靠想象或模特图判断，犹豫时间长、下单转化低、退货率高；商家又不可能为每位顾客实拍。
  pain_en: Shoppers cannot see the garment on themselves and must judge from imagination or model photos,
    which lengthens hesitation, lowers conversion and raises returns; merchants cannot shoot real photos
    for every shopper.
  current_alternative: 旧做法是看模特图、看尺码表、问客服，或到店试穿；部分商家用通用图像编辑或修图工具手工合成，耗时且效果不稳定。
  current_alternative_en: The old way is model photos, size charts, asking customer service, or trying
    on in store; some merchants manually composite with generic image-editing tools, which is slow and
    inconsistent.
  usage_reason: 相较看模特图和尺码表，它把顾客自己的照片直接作为输入，约十秒输出一张上身图，省掉顾客想象和客服反复解释这一步，因此独立站卖家或客服团队在顾客犹豫尺码与版型时会选择它；这是基于产品能力的推断，尚无客户案例或复购证据。
  usage_reason_en: Compared with model photos and size charts, it takes the shopper's own photo as input
    and returns a try-on image in about ten seconds, removing the step of the shopper imagining the fit
    and support staff explaining it repeatedly, so standalone-store sellers or support teams would choose
    it when shoppers hesitate over size and cut; this is an inference from product capability, with no
    customer case or repeat-use evidence yet.
