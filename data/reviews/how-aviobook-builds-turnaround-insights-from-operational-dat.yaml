  market: ''
  job: 航空公司签派员或运行经理在航班过站出现延误时，处理 AvioBook Connect 里的运行记录与报表，要找出延误发生在哪个保障环节并据此安排后续处置。
  job_en: An airline dispatcher or operations manager, when a flight turnaround is delayed, works through
    AvioBook Connect operational records and reports to identify which ground-handling step caused the
    delay and act on it.
  pain: 延误归因依赖人工翻查多份运行记录并逐项比对，判断慢且容易漏掉真正的瓶颈环节，延误成本随时间累积。
  pain_en: Delay attribution relies on manually sifting and cross-checking multiple operational records,
    which is slow and easily misses the real bottleneck while delay costs accumulate.
  current_alternative: 现有做法是签派员和运行经理手工调取 AvioBook Connect 的报表与运行记录，凭经验比对时间点，或依赖既有 BI 报表。
  current_alternative_en: Today dispatchers and operations managers manually pull AvioBook Connect reports
    and records, compare timestamps by experience, or rely on existing BI reports.
  usage_reason: 相较手工翻报表，该原型让 AI 直接读取同一套运行数据并给出带依据的延误原因说明，把“先找数据再比对”这一步压缩成一次提问；推断，签派员和运行经理在过站延误需要快速定责时会因此选择它，但公开材料未给出定价、客户采用或留存证据。
  usage_reason_en: Compared with manually digging through reports, the prototype has AI read the same
    operational data and return an evidence-backed delay explanation, collapsing the find-then-compare
    step into one question; this is inference, and public material gives no pricing, customer adoption
    or retention evidence.
