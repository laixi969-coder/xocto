  market: ''
  job: 开发者在接到编码任务时，希望按资深工程师的标准完成实现并拿到评审意见，于是使用 Staffcoder 引导实现与检查，最终得到可提交的代码改动。
  job_en: When taking on a coding task, a developer wants to implement it to senior-engineer standards
    and get review feedback, so they use Staffcoder to guide implementation and checking, ending with
    committable code changes.
  pain: 公开材料只有一句口号，无法确认它替代的是哪一步旧工作，也看不出不解决会带来什么具体后果。
  pain_en: Only a tagline is public, so it is impossible to confirm which old step it replaces or what
    concrete consequence follows from not solving it.
  current_alternative: 现有做法是人工代码评审、静态检查工具，或直接用编码代理生成代码后自行检查。
  current_alternative_en: Today people rely on human code review, static analysis tools, or coding agents
    that generate code for self-checking.
  usage_reason: 推断：若它能把评审意见直接落到具体改动上，可能省掉等待同事评审这一步，但公开材料未说明输入与输出，无法判断哪类用户会在什么情况下选择它。
  usage_reason_en: 'Inference: if it attaches review comments to concrete changes it might remove waiting
    for a colleague''s review, but the public material does not describe inputs or outputs, so which users
    would choose it and when cannot be judged.'
