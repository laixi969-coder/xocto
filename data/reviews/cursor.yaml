  market: ''
  job: 软件工程师在写新功能、修 bug 或重构模块时，面对一个几十到上千文件的代码仓库，需要让 AI 读懂相关文件并直接产出可提交的代码改动。
  job_en: Software engineers writing features, fixing bugs or refactoring modules in a repository of dozens
    to thousands of files need the AI to read the relevant files and produce committable code changes.
  pain: 跨文件改动要人工在多个文件间来回查找、复制上下文，改一处漏一处；旧做法下上下文切换和重复劳动占掉大量时间，且容易引入不一致。
  pain_en: Cross-file changes force engineers to hunt through many files and copy context by hand, missing
    spots as they go; under the old approach context switching and repetition consume much of the time
    and easily introduce inconsistency.
  current_alternative: 此前主要靠 IDE 自带的片段补全、在聊天窗口里粘贴代码片段，或自己手动搜索并逐个文件修改。
  current_alternative_en: Previously this relied on built-in snippet completion in the IDE, pasting code
    fragments into a chat window, or manually searching and editing file by file.
  usage_reason: 相较片段补全和手动跨文件修改，它把整个仓库作为上下文读取后直接给出跨文件改动，省掉工程师逐文件搜集上下文这一步，因此处理大型既有代码库的工程师会在重构或迁移时选择它；这是基于产品能力的推断，尚无留存或复购证据。
  usage_reason_en: Compared with snippet completion and manual cross-file editing, it reads the whole
    repository as context and proposes cross-file changes directly, removing the step of gathering context
    file by file, so engineers working on large existing codebases would choose it during refactors or
    migrations; this is an inference from product capability, with no retention or repeat-purchase evidence
    yet.
