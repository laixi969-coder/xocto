  market: ''
  job: 视频创作者或游戏预演人员在需要生成第一人称视角片段时，输入相机移动路径与场景描述，得到可继续剪辑或迭代的视频与音频素材，仍需人工筛选与确认。
  job_en: Video creators or game previsualization staff generating first-person viewpoint clips input
    a camera path and scene description to obtain video and audio assets for further editing or iteration,
    still requiring human review and confirmation.
  pain: 第一人称镜头过去要靠实拍稳定器、3D 预演或逐帧调整，成本高且改一次镜头就要重做一遍，小团队很难快速试多个视角。
  pain_en: First-person shots used to require physical gimbals, 3D previsualization or frame-by-frame
    adjustment, which is costly and forces a full redo for every camera change, making it hard for small
    teams to try multiple viewpoints quickly.
  current_alternative: 旧做法是实拍加稳定器、在游戏引擎里搭预演场景，或用通用文生视频工具反复抽卡再手动挑镜头。
  current_alternative_en: The old way is shooting with gimbals, building previsualization scenes in a
    game engine, or repeatedly sampling generic text-to-video tools and hand-picking shots.
  usage_reason: 相较反复抽卡或重搭预演场景，它把相机路径变成可直接输入的参数，让改视角这一步从重做整段变成改一条路径，因此需要频繁试镜头的第一人称内容团队会先试用它；这是基于产品能力的推断，尚无用户反馈支持。
  usage_reason_en: Compared with repeated sampling or rebuilding previsualization scenes, it turns the
    camera path into a directly input parameter, so changing a viewpoint becomes editing one path instead
    of redoing the whole segment; teams doing first-person content that iterate on shots often would try
    it first. This is an inference from product capability, not supported by user feedback yet.
