  market: ''
  job: 时尚品牌的产品与设计团队在量产前的概念阶段，把品牌已有的款式概念交给消费者，让消费者用 AI 改造并投票，从消费者提交的版本中挑出值得投产的款式。
  job_en: A fashion brand's product and design team, at the pre-production concept stage, hands its existing
    style concepts to consumers, who use AI to redesign and vote, so the brand can pick which consumer-submitted
    versions to put into production.
  pain: 公开材料给出的痛点是需求判断发生在生产之后：2023 年行业产生最多 50 亿件未售出服装，品牌靠事后打折清库存，而不是在投产前拿到需求信号（ev-a30624dda4a86136、ev-4c8a68f6fee39b4f）。
  pain_en: 'The pain stated in public material is that demand is judged after production: up to 5 billion
    unsold garments were made in 2023, and brands clear them through markdowns instead of getting a demand
    signal before committing to production (ev-a30624dda4a86136, ev-4c8a68f6fee39b4f).'
  current_alternative: 旧做法是品牌内部设计团队凭经验定款、按预测下单，卖不动再打折清库存；消费者一侧则没有参与品牌款式的常规渠道，只能被动等成品上架。
  current_alternative_en: The old way is for the brand's in-house design team to pick styles by judgment
    and order against a forecast, then discount what does not sell; consumers have no regular channel
    to shape brand styles and only see finished goods.
  usage_reason: 推断：相较内部定款加事后打折，Demoverse 把消费者改造版本变成投产前的需求信号，品牌据此减少押注错款的库存；消费者则因被采用的创意可获得产品商业化后的版税（ev-a30624dda4a86136、ev-4c8a68f6fee39b4f）而愿意提交方案。公开材料未披露具体输入材料与交付物形态，也未提供留存或复购证据。
  usage_reason_en: 'Inference: versus in-house style picking plus post-hoc markdowns, Demoverse turns
    consumer redesigns into a pre-production demand signal so brands place fewer wrong bets; consumers
    submit because adopted ideas earn royalties when the product is commercialised (ev-a30624dda4a86136,
    ev-4c8a68f6fee39b4f). Public material does not disclose the exact inputs or deliverable form, and
    shows no retention or repeat-use evidence.'
