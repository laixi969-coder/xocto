  pain_en: AI assistants have become a new entry point for category recommendations; brands find themselves
    absent from answers without knowing why and lack actionable fixes. Public materials only state the
    product positioning, with no user complaints or cases, so pain intensity is a workflow-structural
    inference.
  current_alternative: 旧做法是人工反复向各 AI 助手提问、凭经验猜测原因，再零散修改官网与内容后手动复查；公开材料未说明用户此前具体如何操作，此为结构推理。
  current_alternative_en: The old approach is to repeatedly query each AI assistant manually, guess causes
    from experience, make scattered edits to the website and content, then manually recheck; public materials
    do not describe the prior workflow, so this is a structural inference.
  usage_reason: 推断：相较人工逐平台试问与凭经验改稿，该 skill 把诊断、改资料、写内容、复查串成同一助手内的固定动作，减少在多个 AI 助手间重复提问和手工比对结果的步骤，因此当品牌在
