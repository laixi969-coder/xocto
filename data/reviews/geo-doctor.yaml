  market: ''
  job: 品牌或营销负责人在 AI 助手（豆包、DeepSeek、ChatGPT、Claude）回答品类问题时未推荐自家产品的情况下，把该 skill 装进 AI 助手，输入品牌资料与目标问题，诊断不被推荐的原因，改写资料与内容后再复查推荐结果。
