  market: ''
  job: 品牌或营销负责人在发现 AI 助手不推荐自家产品时，用该工具查原因、改资料与内容，再复查推荐结果。
  job_en: Brand or marketing leads who find AI assistants not recommending their product use the tool
    to diagnose causes, revise materials and content, then recheck recommendations.
