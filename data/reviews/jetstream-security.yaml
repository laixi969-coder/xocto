  market: ''
  job: 企业安全或合规负责人要在内部系统里放行自主 agent 之前，需要掌握这些 agent 的权限、行为与风险，并留下可审计记录。
  job_en: An enterprise security or compliance lead must understand the permissions, behaviour and risk
    of autonomous agents before letting them into internal systems, and keep auditable records.
  pain: agent 自主执行动作后，企业说不清它访问了什么、做了什么，出事时无法追溯，合规部门也不敢放行。
  pain_en: Once agents act autonomously, enterprises cannot say what they accessed or did, cannot trace
    incidents, and compliance teams hesitate to approve deployment.
  current_alternative: 沿用传统安全工具与人工审批流程，或干脆不允许 agent 接入生产系统。
  current_alternative_en: Reusing traditional security tooling and manual approval flows, or simply not
    allowing agents into production systems.
  usage_reason: 推断：它把 agent 的行为与权限集中成可查看、可审计的一层，减少了企业自行拼凑日志与审批这一步，因此受监管行业的安全负责人会在放行 agent 前选择它；公开材料没有客户案例或付费证据。
  usage_reason_en: 'Inference: it centralises agent behaviour and permissions into an inspectable, auditable
    layer, removing the step of stitching together logs and approvals internally, so security leads in
    regulated industries would choose it before approving agents; public material shows no customer cases
    or payment evidence.'
