    and rely on memory to know which one is still running.
  usage_reason: 推断：若它把多个编码代理的会话集中到一个界面，就省掉了逐个窗口切换查看状态这一步，同时跑多个代理的开发者会因此选择它；但公开材料只有一句定位，集中后能做什么未核验。
  usage_reason_en: 'Inference: if it gathers several coding agents'' sessions into one interface, it removes
    the step of switching windows to check status, which is why developers running multiple agents would
    pick it; but public material is one positioning line and what the consolidation enables is unverified.'
