  market: ''
  job: 维护 Tailwind 设计系统的前端工程师在提交组件或样式改动时，需要处理代理生成或人工编写的样式代码，确认它是否符合团队既定的设计系统规则。
  job_en: Frontend engineers maintaining a Tailwind design system, when submitting component or style
    changes, must handle agent-generated or hand-written style code and confirm it complies with the team's
    established design-system rules.
  pain: 设计系统规则通常写在文档或口头约定里，代理批量生成代码后，人只能逐行读 diff 找违规，规则越细越难查全，漏掉的偏差会累积成样式债。
  pain_en: Design-system rules usually live in docs or verbal agreements; after an agent generates code
    in bulk, humans must read diffs line by line to find violations, and the finer the rules the harder
    to check completely, so missed deviations accumulate as style debt.
  current_alternative: 目前多靠人工代码评审、通用 lint 规则或事后抽查，设计系统层面的约束往往没有可执行形式。
  current_alternative_en: Today teams mostly rely on manual code review, generic lint rules or after-the-fact
    spot checks, and design-system-level constraints often have no executable form.
  usage_reason: 推断：相比人工逐行读 diff，它把设计系统规则变成代理可执行的检查项，在代码生成后直接产出违规清单，省掉人工通读这一步，因此规则明确、代理产出量大的前端团队会优先试用；公开材料尚未显示持续使用或付费证据。
  usage_reason_en: 'Inference: compared with reading diffs line by line, it turns design-system rules
    into agent-executable checks and outputs a violation list right after code generation, removing the
    manual read-through step, so frontend teams with explicit rules and heavy agent output would try it
    first; public material does not yet show sustained use or payment evidence.'
