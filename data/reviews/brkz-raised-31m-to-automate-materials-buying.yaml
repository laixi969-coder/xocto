    terms and supply reliability are hard to verify, so procurement delays directly hit the schedule.
  current_alternative: 采购员靠电话、即时通讯和 Excel 逐家询价，或依赖长期合作的本地经销商，价格与账期信息不透明。
  current_alternative_en: Buyers call or message suppliers one by one and track quotes in Excel, or rely
