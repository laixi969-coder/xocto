  market: ''
  job: 自然爱好者或家庭用户在阳台、庭院等户外场景中，把持续采集的鸟鸣音频交给设备识别，最终得到一幅可长期展示的鸟类插画，无需自己录音、查图鉴和绘制。
  job_en: Nature hobbyists or households in a garden or balcony setting feed continuously captured birdsong
    audio to the device and end up with a long-display bird illustration, without recording, looking up
    field guides or drawing themselves.
  pain: 想知道附近来了什么鸟，通常要凭记忆辨认叫声、事后翻图鉴或录音回听，过程零散且容易放弃；不解决就只是错过观察，代价不高但反复发生。
  pain_en: Wanting to know which bird is nearby usually means identifying calls from memory, checking
    a field guide afterwards or replaying recordings; the process is fragmented and easily abandoned.
    Not solving it only means missed observations, a low but recurring cost.
  current_alternative: 用手机录音后回听、查图鉴或观鸟 App，或干脆不记录；也有人用摄像头和喂鸟器观察，但都需要主动操作。
  current_alternative_en: Recording on a phone and replaying it, checking field guides or birding apps,
    or simply not recording; some use cameras and bird feeders, but all require active effort.
  usage_reason: 相较录音回听再查图鉴，它把识别和出图合并成一次自动动作，用户只需挂上相框，省掉辨认与查找这一步，因此适合愿意为家居陈列和自然兴趣付费、又不想主动记录的人群；这是基于产品能力的推断，尚无用户反馈支持。
  usage_reason_en: 'Compared with replaying recordings and checking guides, it merges identification and
    rendering into one automatic action: the user only hangs the frame, skipping the identification and
    lookup step. This suits people willing to pay for home display and nature interest who do not want
    to log observations; this is inference from product capability, not user feedback.'
