  market: ''
  job: 开发者在本地同时运行 Claude Code 与 Codex 两个编码代理时，处理同一代码库的改动、评审与交接材料，要完成让两个代理共享上下文、互相传递任务并交叉评审的编码会话。
  job_en: A developer running Claude Code and Codex side by side on a local machine handles changes, reviews
    and handoff material for the same codebase, and must complete a coding session where the two agents
    share context, pass tasks to each other and cross-review.
  pain: 公开材料显示多代理并行时上下文与记忆不互通、代理之间无法直接传话、交接与跨厂商评审要人工搬运，夜间技能迭代也缺少可控的批准环节；这是从产品说明与工作流结构推出的痛点，尚无用户抱怨或案例直接佐证。
  pain_en: Public materials show that parallel agents do not share context or memory, cannot message each
    other, and handoff plus cross-vendor review must be moved by hand, while nightly skill iteration lacks
    a controllable approval step; this pain is inferred from the product description and workflow structure,
    not yet from user complaints or cases.
  current_alternative: 旧做法是开发者手动在 Claude Code 与 Codex 之间复制粘贴上下文、自己充当代理间的消息通道，并人工执行交接与跨厂商评审；公开材料未给出用户实际替代行为的记录。
  current_alternative_en: The old way is for the developer to manually copy context between Claude Code
    and Codex, act as the message channel between agents, and perform handoff and cross-vendor review
    by hand; public materials give no record of actual user substitution behavior.
