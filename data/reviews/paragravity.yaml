  market: ''
  job: 独立开发者或小团队在同一台开发机上需要同时运行多个 Google Antigravity 账号或沙箱实例时，打开 paragravity，把账号与沙箱配置交给它，由它做隔离与并行调度，最终拿到互不干扰的多实例环境，用于并行调试、多账号测试或隔离实验。
  job_en: When an independent developer or small team needs to run several Google Antigravity accounts
    or sandbox instances on one machine, they open paragravity, hand it account and sandbox configuration,
    and it performs isolation and parallel scheduling so they get non-interfering multi-instance environments
    for parallel debugging, multi-account testing, or isolated experiments.
  pain: 公开材料只给出产品定位（原生、非侵入式并行多账号与沙箱管理），未提供用户抱怨、issue 或案例，因此痛点强度属于工作流结构推理：同一台机器上多账号/多沙箱并行时，登录态、配置与运行环境会互相污染，手工切换或复制环境既易错又难复现，不解决就只能串行等待或维护多套环境。
  pain_en: 'Public materials only give the product positioning (native, non-invasive parallel multi-account
    and sandbox management), with no user complaints, issues, or cases, so pain intensity is a workflow-structure
    inference: running multiple accounts or sandboxes on one machine tends to cross-contaminate login
    state, configuration, and runtime, and manual switching or cloning is error-prone and hard to reproduce;
    leaving it unsolved means serial waiting or maintaining multiple enviro'
  current_alternative: 公开材料未说明用户当前做法，按任务结构推断的旧替代是：手工切换账号、复制/克隆项目目录、开虚拟机或容器、或干脆串行排队跑任务；这些做法要么隔离不彻底，要么配置成本高。
  current_alternative_en: Public materials do not state current practice; the inferred old alternatives
