  market: ''
  job: 独立音乐人或制作人在本地电脑上制作小样时，处理文字描述或已有音频素材，要生成曲目、拆出分轨并转写 MIDI，以便继续编曲。
  job_en: An independent musician or producer making a demo on a local machine works from text descriptions
    or existing audio to generate tracks, split stems and transcribe MIDI so arranging can continue.
  pain: 云端音乐生成工具按订阅计费、素材需上传，且生成结果难以拆成分轨继续编辑，定制音色也受限；这是从产品能力推出的推断。
  pain_en: Cloud music generation tools charge subscriptions, require uploading material, and produce
    output that is hard to split into editable stems, with limited timbre customization; this is an inference
    from product capability.
  current_alternative: 目前音乐人通常用云端生成工具出片段，再手工导入 DAW 分轨、对拍和重录，或直接使用付费采样库。
  current_alternative_en: Musicians today typically generate clips with cloud tools, then manually import
    into a DAW for stem splitting, tempo alignment and re-recording, or use paid sample libraries.
  usage_reason: 相较云端工具加手工导入的旧做法，它把生成、分轨、MIDI 转写和微调放在同一个本地界面里，省去素材上传与跨工具搬运这一步，因此在意版权与音色定制的独立音乐人会在做小样时选择它；这是基于产品能力的推断。
  usage_reason_en: Compared with cloud tools plus manual import, it puts generation, stem separation,
    MIDI transcription and fine-tuning in one local interface, removing the upload and cross-tool transfer
    step, so rights- and timbre-conscious independent musicians would choose it when making demos; this
    is an inference from product capability.
