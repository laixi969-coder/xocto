  job: 准备 AI Coding 岗位面试的求职者，在投递前后需要针对真实公司出题风格的编码项目题做练习，处理的是匿名化的真实面试项目题与解题方法，要完成的是把题目吃透并形成可复述的解题思路。
  job_en: Job seekers preparing for AI coding interviews work through anonymized real company project
    questions and a general solution method before applying, aiming to internalize the problems and produce
    a repeatable solving approach.
  pain: AI Coding 面试题缺乏公开题库，求职者不知道真实公司会考什么项目题，只能靠零散面经和刷通用算法题，准备方向与实际考察错位，面试失败代价高。
