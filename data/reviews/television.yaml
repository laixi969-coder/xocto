  market: ''
  job: 开发者在使用 AI 编码代理执行多步任务时，需要查看代理每一步做了什么、在哪一步出错，以便决定是否继续或回滚。
  job_en: While an AI coding agent runs a multi-step task, a developer needs to see what the agent did
    at each step and where it failed, in order to decide whether to continue or roll back.
  pain: 代理在终端里连续执行命令，输出滚动过快且分散，事后难以还原它到底改了哪些文件、跑了哪些命令。
  pain_en: The agent runs commands continuously in the terminal; output scrolls fast and is scattered,
    making it hard afterwards to reconstruct which files it changed and which commands it ran.
  current_alternative: 开发者目前靠终端滚动回看、日志文件、git diff 或代理自带的会话记录来还原执行过程。
  current_alternative_en: Public materials do not yet show how users complete this job today or what they
    replace.
  usage_reason: 推断：若它把代理会话的命令、文件改动和结果集中到一个可回看的界面，就能省去在终端与 git 之间来回翻找这一步，因此长时间跑代理的开发者可能选择它；但公开材料未说明它具体接管哪些代理、是否支持回滚，缺少可核对的交付证据。
  usage_reason_en: 'Inference: if it consolidates the agent session''s commands, file changes and results
    into one reviewable interface, it removes the step of switching between terminal and git, so developers
    running long agent sessions may choose it; however the public material does not say which agents it
    drives or whether rollback is supported, so verifiable delivery evidence is missing.'
