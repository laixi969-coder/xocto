    evidence_ids:
    - ev-fcceb53ef6829aa2
    - ev-d4552307e6a671e6
  next_validation: 收集 Pay-per-Crawl 官方文档或定价页，确认按页计费的接入方式、结算流程与是否有内容方实际接入案例。
  market: ''
  job: 内容出版方和网站运营者在发现 AI 爬虫批量抓取原创页面时，要决定放行还是拦截，并把抓取量转成可向抓取方收取的费用记录。
  job_en: Publishers and site operators, on finding AI crawlers bulk-fetching original pages, must decide
    whether to allow or block and convert crawl volume into billable records charged to the crawler.
  pain: 旧做法是 robots.txt 一刀切或人工谈授权，抓取量无法逐页计量，内容方既拿不到钱也说不清被用了多少。
  pain_en: The old approach is blanket robots.txt rules or manual licensing talks; crawl volume cannot
    be metered per page, so content owners neither get paid nor can quantify usage.
  current_alternative: robots.txt、付费墙、Cloudflare 类反爬与人工授权合同。
  current_alternative_en: robots.txt, paywalls, anti-bot services such as Cloudflare, and manual licensing
    contracts.
  usage_reason: 推断：相较一刀切拦截或人工谈判，它把每次抓取直接记成按页应付的 USDC 账单，省掉事后统计与对账这一步，因此已在和模型厂商谈条款的内容方会先试用。
  usage_reason_en: 'Inference: versus blanket blocking or manual negotiation, it records each crawl directly
    as a per-page USDC charge, removing the post-hoc counting and reconciliation step, so content owners
    already negotiating with model vendors would try it first.'
