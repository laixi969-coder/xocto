    apps and one-click local models, with no user feedback on which setup step actually hurts.
  current_alternative: 现有做法是使用主流 Linux 发行版或轻量发行版，再自行安装驱动、容器与模型运行工具。
  current_alternative_en: Current practice is using a mainstream or lightweight Linux distribution and
    then installing drivers, containers and model runtimes manually.
  usage_reason: 推断：若预装应用与一键本地模型确实免去驱动和运行时的逐项配置，资源受限的开发者会在装机时选它，省掉装完系统后仍要折腾环境的一步；但缺少实测与用户反馈，这一因果尚未被证实。
  usage_reason_en: 'Inference: if the preinstalled apps and one-click local models really remove piecemeal
