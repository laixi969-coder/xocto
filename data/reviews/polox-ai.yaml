  market: ''
  job: 内容创作者或设计人员在需要产出并反复修改图片、视频等素材时，在 agent 对话里下指令生成，并在无限画布上直接查看和调整结果，最终得到可继续编辑的素材。
  job_en: A content creator or designer producing and repeatedly revising image and video assets issues
    generation instructions in an agent conversation and adjusts results directly on an infinite canvas,
    ending with assets that remain editable.
  pain: 生成工具与本地编辑器分离，素材要在多个工具间导出导入，版本容易混乱，反复微调时重复劳动多；作者称正依据开发和设计行业朋友的反馈持续更新，说明这类摩擦被实际提出过。
  pain_en: Generation tools and local editors are separate, so assets must be exported and imported across
    tools, versions get confused, and repeated fine-tuning multiplies rework; the author says updates
    follow feedback from developer and design friends, indicating this friction has been raised in practice.
  current_alternative: 在多个单点生成工具出图后，再下载到本地编辑器或设计软件里拼接修改，或使用 Lovart 这类同类产品。
  current_alternative_en: Generating images in several single-purpose tools, then downloading them into
    a local editor or design software to assemble and revise, or using comparable products such as Lovart.
  usage_reason: 推断：相较在多个生成工具与本地编辑器之间搬运文件，它把生成、修改与查看收进同一段 agent 对话和同一块无限画布，省掉导出导入与版本对齐这一步，因此素材产出频繁、需要反复微调的创作者会在同一项目内选择它；目前缺少留存与付费证据。
  usage_reason_en: 'Inference: compared with shuttling files between several generation tools and a local
    editor, it keeps generation, revision and review in one agent conversation and one infinite canvas,
    removing the export-import and version-alignment step, so creators with frequent output and repeated
    fine-tuning would choose it within a project; retention and payment evidence is currently absent.'
