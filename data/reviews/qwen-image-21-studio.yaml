    loop.
  current_alternative: 使用云端文生图服务或 Photoshop 手工改图，前者按次付费且素材外传，后者批量处理耗时。
  current_alternative_en: 'Cloud text-to-image services or manual editing in Photoshop: the former bills
    per call and sends assets off-site, the latter is slow for batches.'
  usage_reason: 推断：相较云端按次调用，它在本地一次部署后即可反复出图与改图，省去每次上传素材和按次付费这两步，因此对素材敏感、需要批量返工的电商或广告设计者更有吸引力；但公开材料未显示留存或付费证据。
  usage_reason_en: 'Inference: versus per-call cloud services, one local install allows repeated generation
    and editing, removing the per-run upload and per-call payment steps, which appeals to designers with
