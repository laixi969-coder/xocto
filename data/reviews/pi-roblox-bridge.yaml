  market: ''
  job: Roblox 游戏开发者或学习者在 Roblox Studio 中搭建场景与脚本时，需要让外部 AI 助手读取并修改 Studio 内的对象，以完成一次具体的关卡或脚本改动。
  job_en: A Roblox game developer or learner building scenes and scripts in Roblox Studio needs an external
    AI assistant to read and modify objects inside Studio to complete a specific level or script change.
  pain: Studio 是封闭编辑器，外部 AI 无法直接接触项目内容；开发者要么手工复制粘贴代码，要么自己架设并维护本地服务，这一步既费时又容易出错。
  pain_en: Studio is a closed editor, so an external AI cannot touch project content directly; developers
    either copy and paste code by hand or stand up and maintain a local server, a step that is slow and
    error-prone.
  current_alternative: 手工在 Studio 与聊天窗口之间复制粘贴脚本，或自行搭建本地 MCP 服务并维护其运行。
  current_alternative_en: Manually copying scripts between Studio and a chat window, or building and maintaining
    a local MCP server themselves.
  usage_reason: 推断：它把“先架服务器再连编辑器”这一步省掉，让助手直接对 Studio 对象动手，因此不想维护本地服务的独立开发者或教学场景可能选择它；但仓库只有自述，没有用户反馈或重复使用证据，无法确认它是否真的进入日常工作流。
  usage_reason_en: 'Inference: it removes the step of standing up a server before connecting the editor,
    letting the assistant act on Studio objects directly, so indie developers or teaching settings that
    do not want to maintain a local service may choose it; the repository offers only a self-description,
    with no user feedback or repeat-use evidence, so whether it enters daily workflows is unconfirmed.'
