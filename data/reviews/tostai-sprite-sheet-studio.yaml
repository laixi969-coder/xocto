  market: ''
  job: 独立游戏开发者或游戏美术在制作角色动画时，手上只有一段实拍或渲染好的原始视频，需要把它切成逐帧序列并排成游戏引擎可直接导入的精灵图集。
  job_en: An indie game developer or game artist making character animation has only a raw shot or rendered
    video and needs it cut into frame sequences and laid out as a sprite sheet their engine can import
    directly.
  pain: 逐帧切图与图集排布是重复且易错的手工活，帧对齐、间距和命名一旦出错就要在引擎里反复返工；不解决的后果是美术时间被切图占掉，动画迭代变慢。
  pain_en: Frame-by-frame cutting and atlas layout is repetitive, error-prone manual work; a single misalignment,
    spacing or naming mistake forces rework inside the engine, so leaving it unsolved eats artist time
    and slows animation iteration.
  current_alternative: 现状是用 Photoshop 批处理、ImageMagick/ffmpeg 脚本或 TexturePacker 一类工具手工切帧再排图集，需要自己写命令或逐张调整。
  current_alternative_en: Today the work is done with Photoshop batch actions, ImageMagick/ffmpeg scripts
    or tools like TexturePacker, cutting frames and packing atlases by hand or via self-written commands.
  usage_reason: 推断：相较自己写 ffmpeg/ImageMagick 命令或逐张在 Photoshop 里切图，它把“切帧—排布—导出图集”合并为一次视频输入到图集输出的动作，省掉写脚本和手工对齐这一步，因此缺美术流水线、想快速把视频转成引擎素材的独立开发者会在做角色动画时选择它；公开材料未提供用户自述动机。
  usage_reason_en: 'Inference: versus writing ffmpeg/ImageMagick commands or cutting frame by frame in
    Photoshop, it merges ''cut frames - lay out - export atlas'' into one video-in, sheet-out action,
    removing the scripting and manual alignment step, so indie developers without an art pipeline who
    want video turned into engine assets quickly would pick it when building character animation; public
    materials give no first-person user motivation.'
