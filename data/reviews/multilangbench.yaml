  market: ''
  job: 模型评测工程师或本地化负责人在某语言版本上线前，用多语言测试题跑分并对比不同模型，判断该语言能否交付。
  job_en: Model evaluation engineers or localization leads run multilingual test items and compare models
    before a language version ships, deciding whether that language can be delivered.
  pain: 多语言能力缺少统一、可复现的对照口径，团队各自拼测试题，结论难以横向比较，上线决策容易凭印象。
  pain_en: Multilingual capability lacks a unified, reproducible comparison basis; teams assemble their
    own test items, results are hard to compare, and launch decisions rest on impressions.
  current_alternative: 团队自建测试集、参考零散的单语言榜单，或直接依赖模型厂商自报的多语言成绩。
  current_alternative_en: Teams build their own test sets, consult scattered single-language leaderboards,
    or rely on vendor-reported multilingual scores.
  usage_reason: 推断：相较自建测试集，它把多语言题目集中到可复现的基准中，减少重新出题与对齐口径的步骤，因此需要跨语言上线判断的团队会先试用它；是否被长期采用尚无公开证据。
  usage_reason_en: 'Inference: compared with building test sets in-house, it centralizes multilingual
    items into a reproducible benchmark, cutting the steps of writing items and aligning criteria, so
    teams facing cross-language launch decisions would try it first; there is no public evidence of sustained
    adoption yet.'
