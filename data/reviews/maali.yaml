  market: ''
  job: 个人在月底或做预算时，整理银行流水与消费记录，需要把杂乱的交易归类并看清钱花在哪。
  job_en: At month-end or when budgeting, an individual sorts bank transactions and expense records, needing
    to categorize messy transactions and see where money goes.
  pain: 手工在表格里逐条归类耗时且易错；把完整流水交给云端理财应用又担心隐私泄露。
