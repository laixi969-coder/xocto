    Mint-style tools.
  usage_reason: 推断：相较手工逐条分类，本地 AI 直接读取流水并自动归类，省去逐笔打标签这一步；对在意隐私、不愿上传流水的用户，本地运行是选择它的具体理由。
  usage_reason_en: 'Inference: versus manual line-by-line sorting, a local AI reads statements and auto-categorizes,
