  market: ''
  job: 拥有 Sonos 音箱的家庭用户或小型空间经营者，在局域网内需要按场景切换播放内容或让自动化脚本、AI 代理直接控制音箱时，处理的是音箱发现、播放队列与音量等控制指令，要完成的是让指定音箱按预期播放。
  job_en: A household user or small-space operator who owns Sonos speakers needs to switch playback by
    scenario on the local LAN, or let automation scripts and AI agents control the speakers directly,
    handling discovery, playback queue and volume commands to make the intended speaker play as expected.
  pain: 官方 App 与语音助手在跨房间、跨代设备（S1/S2）和自动化调用上限制多，用户想用脚本或代理控制音箱时缺少稳定接口，只能手动在 App 里点。
  pain_en: Official apps and voice assistants are restrictive across rooms, device generations (S1/S2)
    and automation calls; users who want script or agent control lack a stable interface and must tap
    through the app manually.
  current_alternative: 官方 Sonos App、语音助手，或社区里零散的 UPnP 脚本；这些方案在跨代兼容和可编程性上都不完整。
  current_alternative_en: The official Sonos app, voice assistants, or scattered community UPnP scripts;
    these are incomplete on cross-generation compatibility and programmability.
  usage_reason: 相较手动点 App 或拼凑脚本，它把设备发现、协议兼容和播放控制封装成 CLI/HTTP/MCP 接口，用户少写一层协议适配代码就能让代理直接下发播放指令；推断这类已有 Sonos
    硬件、又需要自动化或代理控制的用户会在搭建家庭自动化时选择它。
  usage_reason_en: Compared with tapping the app manually or stitching scripts together, it wraps discovery,
    protocol compatibility and playback control into CLI/HTTP/MCP interfaces, so users skip a layer of
    protocol glue before an agent can issue playback commands; inference is that users who already own
    Sonos hardware and need automation or agent control would pick it when building home automation.
