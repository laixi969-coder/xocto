  market: ''
  job: 投标专员在拿到招标文件后，需要把企业资质、历史标书与招标要求对齐，产出一份可提交且能通过合规审查的投标文件。
  job_en: After receiving tender documents, a bid specialist must align company qualifications and past
    bids with the tender requirements to produce a submittable, compliance-passing bid.
  pain: 标书编制依赖人工逐条比对招标要求与资质材料，漏项或格式不合规会导致废标，返工成本高。
  pain_en: Bid drafting relies on manually matching every tender requirement against qualification materials;
    a missed item or format violation can void the bid, and rework is costly.
  current_alternative: 目前多用 Word 模板、共享盘和邮件在团队间来回传标书，合规检查靠有经验的投标人员逐条人工核对。
  current_alternative_en: Today teams pass drafts around in Word templates, shared drives and email, and
    compliance is checked line by line by experienced bid staff.
  usage_reason: 相较人工逐条比对，它把招标要求、资质与历史标书集中成知识库，由 AI 先出草稿并标出合规问题，投标专员只需复核被标出的条目，减少的是从零起草和通读比对这一步；推断，尚无客户案例或留存证据。
  usage_reason_en: Compared with manual line-by-line matching, it consolidates tender requirements, qualifications
    and past bids into a knowledge base, has AI produce a draft and flag compliance issues, so the specialist
    only reviews flagged items, removing the from-scratch drafting and full re-reading step; inference,
    with no customer case or retention evidence yet.
