  market: ''
  job: C# 软件工程师在让编码智能体重构、改名或修改某个符号时，需要先拿到该符号在整个项目中的全部引用位置，再决定改动范围并把结果交给智能体执行。
  job_en: C# software engineers, when having a coding agent refactor, rename or modify a symbol, need
    the full set of reference locations for that symbol across the project before deciding the change
    scope and handing it to the agent.
  pain: 编码智能体默认靠文本搜索（grep）找引用，会漏掉重载、泛型、部分类、条件编译等情形，导致改错或漏改，工程师必须事后人工排查，返工成本落在自己身上。
  pain_en: Coding agents default to text search (grep) for references, which misses overloads, generics,
    partial classes and conditional compilation, so changes land in the wrong places or miss some, forcing
    engineers to audit and rework afterwards.
  current_alternative: 工程师用 IDE 的 Find Usages 或文本搜索自行定位引用，再把结果手工粘贴、转述给编码智能体，或直接让智能体 grep 后人工复核。
  current_alternative_en: Engineers use the IDE's Find Usages or text search to locate references themselves,
    then paste or relay the results to the coding agent by hand, or let the agent grep and audit the output
    manually.
  usage_reason: 推断：相较手工 Find Usages 再转述，它把引用解析交给 tree-sitter AST 的确定性解析，智能体可直接查询并引用图上的位置，省掉工程师筛选搜索结果、逐条转述这一步；本地运行、代码不出机器，对在意代码外泄的团队构成额外选择理由。公开材料未给出使用数据或客户反馈，持续采用无法确认。
  usage_reason_en: 'Inference: versus manual Find Usages plus relaying, it delegates reference resolution
    to deterministic tree-sitter AST parsing, so the agent can query and cite graph positions directly,
    removing the step where engineers filter search results and relay them one by one; running locally
    with code never leaving the machine is an extra reason for teams wary of code leakage. No usage data
    or customer feedback is public, so sustained adoption cannot be confirmed.'
