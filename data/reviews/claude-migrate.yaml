  market: ''
  job: 开发者在更换或新增 Claude Code Desktop 账号时，需要把旧账号下积累的本地会话记录迁移到新账号，以便继续此前的编码上下文。
  job_en: When developers change or add a Claude Code Desktop account, they need to move local session
    records accumulated under the old account to the new one so they can continue prior coding context.
  pain: 会话与账号绑定后，换号等于丢失历史上下文，用户要么手工翻找本地文件，要么重新交代项目背景，重复劳动且容易遗漏。
  pain_en: Once sessions are bound to an account, switching accounts means losing historical context;
    users must either dig through local files by hand or re-explain project background, duplicating work
    and risking omissions.
  current_alternative: 目前只能手工在本地文件系统里查找、复制或重命名会话文件，或干脆放弃旧会话重新开始。
  current_alternative_en: Today the only options are manually locating, copying or renaming session files
    in the local filesystem, or abandoning old sessions and starting over.
  usage_reason: 推断：相比手工翻找本地文件，它把「定位旧会话—搬运—在新账号下可用」压缩成一次可执行动作，减少的是查找与试错这一步；因此频繁换号、换机的独立开发者或外包团队会在账号切换后选择它。公开材料未提供留存或重复使用证据。
  usage_reason_en: 'Inference: compared with manually digging through local files, it compresses locating
    old sessions, moving them and making them usable under the new account into one executable action,
    removing the search-and-trial step; independent developers or outsourcing teams who frequently switch
    accounts or machines would therefore pick it after an account change. The public material provides
    no retention or repeat-use evidence.'
