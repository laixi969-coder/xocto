  market: ''
  job: 软件开发者在使用编码 agent 时，需要把下一步要改什么、按什么顺序改讲清楚，让 agent 按计划执行。
  job_en: A software developer using a coding agent needs to state what should change next and in what
    order, so the agent can execute the plan.
  pain: 公开材料没有说明打字描述计划到底慢在哪里、开发者是否因此放弃使用 agent，也没有用户抱怨或替代做法的记录，痛点强度无法判断。
  pain_en: The public material does not say why typing out a plan is slow or whether developers abandon
    agents because of it, and there is no record of complaints or workarounds, so the pain intensity cannot
    be judged.
  current_alternative: 按常理推断，开发者会直接在 agent 的对话框里打字描述计划，或先写一份说明再粘贴进去；这是工作流推理，不是材料中记录的用户行为。
  current_alternative_en: By inference, developers would type the plan into the agent's chat box or write
    a note and paste it in; this is workflow reasoning, not user behaviour recorded in the material.
  usage_reason: 如果语音能直接变成 agent 可执行的计划，开发者就不必停下手上的阅读去打字；但材料没有说明语音如何转成计划、由谁确认，减少哪一步负担无法确认，因此只能作为待观察信号。
  usage_reason_en: If speech could turn directly into an executable plan for the agent, developers would
    not have to stop reading to type; but the material does not say how speech becomes a plan or who confirms
    it, so which step is removed cannot be confirmed, and it remains a signal to watch.
