  market: ''
  job: 正在找工作的求职者在浏览招聘网站时，需要把大量职位按自己的简历筛一遍，再决定投哪些，并完成投递动作。
  job_en: A job seeker browsing recruitment sites needs to filter a large set of postings against their
    own resume, decide which to apply to, and complete the application.
  pain: 海量职位与个人简历的匹配需要逐条人工阅读，重复且耗时；候选材料未给出用户抱怨或案例，此痛点为基于任务结构的工作流推理。
  pain_en: Matching a large set of postings against one resume requires reading each one manually, which
    is repetitive and slow; the candidate gives no user complaints or cases, so this pain is workflow
    inference from the task structure.
  current_alternative: 求职者此前通常靠招聘站关键词搜索、逐条阅读职位描述并手工填写投递表单，这是公开可观察的旧行为。
  current_alternative_en: Job seekers previously relied on keyword search on job boards, reading each
    description and filling application forms by hand, which is publicly observable old behavior.
  usage_reason: 推断：相较逐条阅读和手工填表，它把筛选与匹配放在浏览页面内一次完成，并在投递前保留人工确认，减少的是逐条比对职位描述这一步；因此批量投递效率低的求职者会在集中找工作的阶段选择它。
  usage_reason_en: 'Inference: versus reading each posting and filling forms by hand, it completes filtering
    and matching inside the browsing page and keeps human confirmation before applying, removing the step
    of comparing each description; job seekers with low mass-application efficiency would therefore choose
    it during an intensive search period.'
