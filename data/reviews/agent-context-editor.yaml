    responses, forcing users to restart sessions or manually clean up.
  current_alternative: 目前用户通常通过重启会话、复制粘贴关键内容或使用提示词来规避上下文污染。
  current_alternative_en: Currently, users typically restart sessions, copy-paste key content, or use
    prompts to avoid context pollution.
  usage_reason: 该插件提供直接的上下文编辑能力，减少重启成本，对频繁调试的开发者有实用价值。
  usage_reason_en: This plugin offers direct context editing, reducing restart costs, and is practically
    valuable for developers who debug frequently.
