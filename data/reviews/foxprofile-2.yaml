  market: ''
  job: 跨境电商多店铺运营、广告投放或数据采集人员，需要在同一台机器上同时维持多个互不关联的账号会话，处理登录、Cookie 与代理配置。
  job_en: Cross-border e-commerce multi-store operators, ad buyers or data collectors who must keep several
    unrelated account sessions alive on one machine, handling logins, cookies and proxy configuration.
  pain: 账号环境互相污染会导致封号或数据串号，手工切换浏览器、清理 Cookie、逐个配代理既慢又容易出错，商业反检测软件按账号收费且数据要交给第三方。
  pain_en: Cross-contaminated account environments cause bans or mixed-up data; manually switching browsers,
    clearing cookies and configuring proxies one by one is slow and error-prone, while commercial anti-detect
    tools charge per account and require handing data to a third party.
  current_alternative: GoLogin、MoreLogin 等付费反检测浏览器，或多开虚拟机、独立设备与手工清理 Cookie 的土办法。
  current_alternative_en: Paid anti-detect browsers such as GoLogin and MoreLogin, or makeshift setups
    with multiple VMs, separate devices and manual cookie clearing.
  usage_reason: 推断：相较付费反检测软件，它把档案、指纹、Cookie 与代理放在本机自托管，并直接暴露 REST API 与 MCP 供 AI 代理调用，省去逐账号手工配置和把会话数据托管给第三方的步骤，因此对在意数据归属、又要批量调度会话的团队更有吸引力；公开材料尚未给出留存或付费证据。
  usage_reason_en: 'Inference: versus paid anti-detect software, it keeps profiles, fingerprints, cookies
    and proxies self-hosted and exposes REST API and MCP directly for AI agents, removing per-account
    manual setup and third-party session hosting, which appeals to teams that care about data ownership
    and batch session dispatch; public material shows no retention or payment evidence yet.'
