  market: ''
  job: 软件开发者同时运行多个编码代理时，需要在一个界面里查看各代理状态、发送指令并跟进代码任务。
  job_en: Software developers running several coding agents at once need one interface to view each agent's
    status, send instructions and follow up on coding tasks.
  pain: 多代理并行时，开发者要在多个终端或窗口间切换，难以统一查看进度和下达指令。
  pain_en: With multiple agents in parallel, developers switch among terminals or windows and struggle
    to see progress and issue instructions in one place.
  current_alternative: 多个终端标签页、IDE 内置代理面板，或分别打开各代理的网页界面。
