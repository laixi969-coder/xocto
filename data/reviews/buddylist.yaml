    interface separately.
  usage_reason: 推断：聊天式界面把多个编码代理的对话集中到一处，减少在终端和窗口间切换的步骤，因此同时跑多个编码任务的开发者可能尝试；但公开材料只有一句标语，无法确认它实际接入哪些代理、是否只是聊天外壳。
  usage_reason_en: 'Inference: a chat-style interface centralizes conversations with several coding agents,
    cutting the step of switching among terminals and windows, so developers running multiple coding tasks
    may try it; but public material is only a tagline, so it is unclear which agents it connects to or
    whether it is just a chat shell.'
