  market: ''
  job: 独立视频创作者或小型营销团队在需要制作动效短片时，把素材与需求交给本地运行的 Claude 流程，逐阶段确认后导出成片。
  job_en: Independent video creators or small marketing teams hand assets and requirements to a locally
    run Claude workflow and approve each stage before exporting a finished clip when they need a motion-design
    video.
  pain: 动效视频制作通常依赖专业软件与熟练剪辑，小团队要么外包等待，要么自己花长时间学工具；公开材料未给出具体耗时数据。
  pain_en: Motion-design video usually depends on professional software and skilled editors, so small
    teams either wait on outsourcing or spend long hours learning tools; the public material gives no
    specific time figures.
  current_alternative: 旧做法是使用专业动效软件手工制作，或把需求外包给动效设计师，按项目等待交付。
  current_alternative_en: The old approach is hand-building in professional motion tools or outsourcing
    to a motion designer and waiting for project delivery.
  usage_reason: 推断：相较手工逐帧制作或外包等待，它把视频拆成阶段由模型生成、使用者逐步确认，减少了从零搭建与反复返工的那一步，因此缺少剪辑人手的小团队在需要快速出片时会选择它。
  usage_reason_en: 'Inference: compared with frame-by-frame manual work or waiting on outsourcing, it
    splits the video into model-generated stages the user approves step by step, removing the from-scratch
    build and repeated rework, so small teams without editors would choose it when they need a clip quickly.'
