  market: ''
  job: 用 Lovable 做出应用的独立开发者或创始人在上线后需要获取用户时，在同一个对话界面里处理增长任务，完成从构建到拉新的衔接。
  job_en: An indie developer or founder who built an app with Lovable and now needs users handles growth
    tasks inside the same chat interface, connecting building to acquisition.
  pain: 材料只有一句定位，没有说明上线后拉新原来由谁、用什么工具、花多久完成，也没有说明不解决的后果，痛点强度无法从公开事实判断。
  pain_en: The material offers only a one-line positioning; it does not say who previously did post-launch
    acquisition, with what tools, or how long it took, nor the consequence of not solving it, so pain
    intensity cannot be judged from public facts.
  current_alternative: 公开材料未披露替代方式；按常见做法推断，可能是另购营销工具或人工投放，但这是推断，不是已核验事实。
  current_alternative_en: The public material does not disclose the alternative; by common practice it
    is inferred to be separate marketing tools or manual campaign work, but this is inference, not verified
    fact.
  usage_reason: 无法给出因果解释：材料没有说明它在增长环节具体执行什么动作、减少哪一步负担或改善哪项可核对结果，因此无法判断哪类用户会在什么情况下选择它。
  usage_reason_en: 'No causal explanation can be given: the material does not say what specific action
    it performs in the growth step, which burden it removes, or which checkable result it improves, so
    it is impossible to say which users would choose it and when.'
