  usage_reason: 推断：相较逐个登录后台，它把多账号用量集中到一块常亮屏幕上，省去反复查询与切换登录这一步，因此同时开多个账号、长时间编码的开发者会在意额度中断风险时选择它；但缺少留存与付费证据，硬件形态也限制扩散。
  usage_reason_en: 'Inference: versus logging into each dashboard, it consolidates multi-account usage
    onto one always-on screen, removing the repeated lookup and login-switching step, so developers running
    several accounts during long coding sessions may choose it when quota interruption risk matters; retention
    and payment evidence are missing, and the hardware form limits spread.'
