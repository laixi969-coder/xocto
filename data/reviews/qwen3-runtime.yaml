    in-house is time-consuming and easily mismatched with the training framework, slowing experiment iteration.
  current_alternative: 目前多由团队自行编写 rollout 脚本，或改造通用推理服务来拼凑多轮交互与轨迹收集。
  current_alternative_en: Today teams mostly write their own rollout scripts or adapt generic inference
    services to piece together multi-turn interaction and trajectory collection.
  usage_reason: 推断：相较自写脚本，它把多轮 rollout 的调度与推理执行封装成可直接调用的运行时，减少的是每次实验前重搭轨迹收集管线的负担；因此正在训练代码智能体、又缺少专职基础设施人力的团队会先试用。
  usage_reason_en: 'Inference: compared with self-written scripts, it packages multi-turn rollout scheduling
    and inference execution into a directly callable runtime, reducing the burden of rebuilding a trajectory
    collection pipeline before each experiment; teams training code agents without dedicated infrastructure
    staff are the likely first triers.'
