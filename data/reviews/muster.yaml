    breaking attention and slowing tasks.
  current_alternative: 靠手动切换终端标签、系统通知或凭记忆轮询各个会话。
  current_alternative_en: Manually switching terminal tabs, relying on system notifications, or polling
    sessions from memory.
  usage_reason: 推断：相较手动轮询，它把“哪个会话在等我”集中到一个常驻菜单栏视图，并用一次按键完成应答，省掉定位窗口这一步；常跑多会话的开发者会因此选它。
  usage_reason_en: 'Inference: versus manual polling, it concentrates ''which session is waiting'' into
    one always-visible menu bar view and answers with a single keystroke, removing the window-hunting
    step; developers who routinely run many sessions would pick it for that.'
