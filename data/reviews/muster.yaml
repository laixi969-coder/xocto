  market: ''
  job: 同时运行多个编码智能体的开发者，在多个会话并行等待输入时，需要判断哪个会话卡住并尽快把回答发回去，让任务继续推进。
  job_en: A developer running several coding agents at once must tell which parallel session is blocked
    and send the reply back quickly so the task keeps moving.
  pain: 并行会话一多，等待中的会话会空转，人却在终端窗口之间来回找，注意力被打断，任务被拖慢。
