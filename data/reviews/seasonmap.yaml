  market: ''
  job: 旅行规划者在决定某段时间去哪里时，需要比较多个目的地的季节与气候适宜度，避免选到雨季或极端天气时段。
  job_en: Trip planners deciding where to go in a given period need to compare seasonal and climate suitability
    across destinations to avoid rainy seasons or extreme weather windows.
  pain: 气候信息散落在气象网站、攻略和论坛里，跨目的地比较费时；但公开材料只说明用气候数据做可视化，没有用户抱怨或采用证据，痛点强度无法确认。
  pain_en: Climate information is scattered across weather sites, guides and forums, making cross-destination
    comparison time-consuming; but public material only says climate data is visualized, with no user
    complaints or adoption evidence, so pain intensity cannot be confirmed.
  current_alternative: 在气象网站、旅行攻略和论坛帖之间逐个查目的地，或依赖他人经验判断季节。
  current_alternative_en: Checking destinations one by one across weather sites, travel guides and forum
    posts, or relying on others' experience to judge seasons.
  usage_reason: 推断：如果气候数据被整理成可横向比较的视图，规划者可省去逐个查目的地气候这一步，因此在意季节与天气的自由行规划者会在选目的地时使用它；公开材料未说明是否由模型生成建议，也无留存证据。
  usage_reason_en: 'Inference: if climate data is organized into a comparable view, planners would skip
    looking up each destination''s climate, so independent travelers who care about season and weather
    would use it when choosing destinations; whether a model generates recommendations and any retention
    evidence are not public.'
