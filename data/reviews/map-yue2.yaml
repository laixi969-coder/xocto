  market: ''
  job: 音乐制作人与独立创作者在需要为视频、游戏或歌曲小样配乐时，输入歌词、风格提示与符号规划指令，让模型先写出可编辑的乐谱（ABC 记谱），再渲染成含人声与伴奏的完整歌曲，交付多音轨作品供后续剪辑混音。
  job_en: Music producers and indie creators scoring videos, games, or song demos input lyrics, style
    prompts, and symbolic planning instructions; the model first writes an editable score (ABC notation),
    then renders a full song with vocals and accompaniment, delivering multi-track material for later
    editing and mixing.
  pain: 纯音频黑盒生成工具只给一段不可拆解的成品音频，主副歌结构、旋律走向与配器难以按意图修改，返工只能整段重生成；而在 DAW 里手工编曲又需要乐理与配器能力，门槛高、耗时长。
  pain_en: Black-box audio generators return a single indivisible finished track, so verse-chorus structure,
    melodic direction, and orchestration cannot be edited to intent and any fix means regenerating the
    whole piece; hand-arranging in a DAW instead demands music theory and orchestration skill, which is
    slow and high-barrier.
  current_alternative: 使用 Suno、Udio 等闭源生成平台直接出成品音频，或在 DAW 中手工编写 MIDI 与配器。
  current_alternative_en: Using proprietary generation platforms such as Suno or Udio to output finished
    audio directly, or hand-sequencing MIDI and orchestration in a DAW.
  usage_reason: （推断）相较闭源工具只能整段重生成，YuE2 先产出可编辑的 ABC 乐谱再渲染成曲，创作者可在乐谱层按乐理修改旋律、歌词与编配，把“反复重抽整首歌”这一步换成“改谱再渲染”，因此需要结构可控与二次编辑的编曲者会在构思阶段选择它。
  usage_reason_en: (Inference) Unlike proprietary tools that only allow whole-track regeneration, YuE2
    first emits an editable ABC score and then renders it into a song, letting creators revise melody,
    lyrics, and arrangement at the score level; this replaces 're-rolling the entire song' with 'edit
    the score and re-render', so arrangers needing structural control and second-pass editing would choose
    it during the ideation stage.
