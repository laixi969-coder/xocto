  market: ''
  job: 品牌或咨询公司的研究负责人在需要快速验证定价、概念或用户反馈时，把访谈提纲和目标人群交给平台，由 AI 并行完成数百场访谈并输出可解读的结论。
  job_en: A research lead at a brand or consultancy who needs to test pricing, concepts or user feedback
    quickly hands interview guides and target groups to the platform, which runs hundreds of interviews
    in parallel and returns interpretable findings.
  pain: 传统研究单次报价可达十万欧元、耗时三个月，企业因此不敢频繁调研，等结论出来市场已经变化，很多决策是在没听过用户声音的情况下做出的。
  pain_en: A single traditional study can cost around €100,000 and take three months, so companies rarely
    repeat it; by the time findings arrive the market has moved, and many decisions are made without hearing
    customers.
  current_alternative: 外包给传统市场研究公司做问卷和焦点小组，或内部用问卷工具加人工电话访谈，周期长、单次成本高，因此调研频率被压得很低。
  current_alternative_en: Outsourcing surveys and focus groups to traditional research firms, or running
    in-house survey tools plus manual phone interviews — long cycles and high per-study cost keep research
    frequency low.
  usage_reason: 相较外包研究要等数周排期和人工逐场访谈，它让 AI 同时跑数百场访谈并即时汇总，把“等排期、等访谈、等编码”这几步压缩掉，研究负责人因此能在决策窗口内拿到结论；人类研究员保留解读环节，降低了对结论可靠性的顾虑。这是基于产品能力与旧流程的推断。
  usage_reason_en: Compared with outsourced studies that wait weeks for scheduling and run interviews
    one by one, it lets AI run hundreds of interviews at once and aggregate immediately, removing the
    wait-for-scheduling, wait-for-interviews and wait-for-coding steps so a research lead can get answers
    inside the decision window; keeping human interpretation reduces doubt about reliability. This is
    inference from product capability and the old workflow.
