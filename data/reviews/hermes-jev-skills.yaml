    toolchains.
  usage_reason: 相较自行拼接，它把路由、记忆、压缩、技能选择与浏览器操作打包成可直接引入的技能，省掉逐个接模型和自写记忆逻辑这两步，因此做长任务 agent 的开发者会先试它；这是基于仓库说明的推断，尚无采用证据。
