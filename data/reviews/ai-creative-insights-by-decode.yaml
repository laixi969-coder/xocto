  market: ''
  job: 广告主或代理商的投放负责人在正式买量前，面对多条候选广告素材，需要决定先投哪一条、砍掉哪一条。
  job_en: A media owner at an advertiser or agency, facing several candidate ad creatives before buying
    media, needs to decide which to run first and which to cut.
  pain: 素材选择目前多靠经验和投后数据，选错要等预算花掉才知道，返工成本高；但候选材料没有给出任何用户抱怨、案例或效果数据来证明这一痛点被真实解决。
  pain_en: Creative selection mostly relies on experience and post-spend data, so a wrong pick is only
    visible after budget is spent, making rework costly; however the candidate material offers no user
    complaint, case or performance data proving this pain is actually solved.
  current_alternative: 投放团队通常先小预算试投、看点击与转化数据再放量，或用 A/B 测试工具跑素材对比。
  current_alternative_en: Media teams usually run small test budgets, read click and conversion data,
    then scale, or use A/B testing tools to compare creatives.
  usage_reason: 推断：若预测确实能在投放前给出可核对的排序，用户可省掉一轮小预算试投的等待与花费，因此预算有限、素材迭代频繁的投放团队会先试用；但公开材料只有一句宣称，缺少准确率、客户案例或重复使用证据，无法确认这一因果成立。
  usage_reason_en: 'Inference: if the prediction really returns a checkable ranking before spend, users
    could skip one round of small-budget testing and its waiting cost, so teams with tight budgets and
    frequent creative iteration would try it first; but public material is a single claim with no accuracy,
    customer case or repeat-use evidence, so this causal link cannot be confirmed.'
