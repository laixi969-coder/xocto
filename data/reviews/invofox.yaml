  market: ''
  job: 财务或运营人员在收到供应商发票、保单、提单等 PDF 或扫描件时，需要把这些材料里的字段录入台账或业务系统，以便完成记账、对账或理赔登记。
  job_en: Finance or operations staff receiving supplier invoices, policy documents or bills of lading
    as PDFs or scans need to key the fields from these materials into ledgers or business systems to complete
    bookkeeping, reconciliation or claims registration.
  pain: 人工逐份阅读并敲字段既慢又容易出错，字段错一位就要回头核对原件，单据量大时形成积压。
  pain_en: Reading each document and typing fields by hand is slow and error-prone; a single wrong field
    forces a return to the original document, and volume creates backlogs.
  current_alternative: 旧做法是人工录入，或使用模板固定的 OCR 工具，遇到版式变化就要重新配置模板，抽取结果仍需人工逐字段核对。
  current_alternative_en: The old approach is manual data entry or fixed-template OCR tools that need
    reconfiguration when layouts change, with extracted results still checked field by field by a person.
  usage_reason: 推断：相较人工录入或固定模板 OCR，它把文档直接转成带校验的结构化 JSON，省去逐字段敲入和模板重配这一步，因此单据版式杂、字段需要进入下游系统的财务与运营团队会在处理批量单据时选择它；公开材料未给出校验规则与人工复核边界，也未提供留存或复购证据。
  usage_reason_en: 'Inference: compared with manual entry or fixed-template OCR, it converts documents
    directly into validated structured JSON, removing the step of typing each field and reconfiguring
    templates, so finance and operations teams with varied document layouts and downstream systems would
    choose it when processing document batches; the public material does not describe validation rules
    or human review boundaries, nor does it provide retention or repeat-use evidence.'
