  market: ''
  job: 律师、分析师、工程师等知识工作者在需要通读长文档、代码库或整理复杂材料时，把原文交给 Claude 对话，由它归纳、起草或改写，产出可直接使用的文本、代码或分析结论。
  job_en: Knowledge workers such as lawyers, analysts and engineers who must read long documents, codebases
    or complex material hand the source to Claude in conversation, which summarizes, drafts or rewrites
    it into usable text, code or analysis.
  pain: 长材料的人工通读与起草耗时且容易遗漏，用户需要反复在检索、阅读与写作之间切换；公开规模显示大量用户已把这类任务交给它，说明痛点是真实且高频的。
  pain_en: Manually reading and drafting from long material is slow and error-prone, forcing users to
    switch repeatedly between searching, reading and writing; the public scale shows many users already
    delegate such tasks, indicating the pain is real and frequent.
  current_alternative: 此前同类任务靠人工通读加搜索、模板与同事互审完成，或使用更早的通用助手；这些旧做法仍是许多团队的实际选择。
  current_alternative_en: Previously such tasks were done by manual reading plus search, templates and
    peer review, or with earlier general assistants; these older practices remain the actual choice for
    many teams.
  usage_reason: 相较逐段人工阅读与从零起草，它通过一次性接收长材料并直接产出归纳或初稿，减少的是检索与起稿这两步负担，因此需要处理大量文本的专业用户会在初稿与复核环节选择它；这是基于产品能力与任务的推断。
  usage_reason_en: Compared with reading section by section and drafting from scratch, it takes in long
    material at once and returns a summary or first draft, removing the retrieval and drafting steps,
    so professional users facing heavy text volume would choose it for first drafts and review; this is
    inference from capability and task.
