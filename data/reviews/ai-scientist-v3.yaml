  market: ''
  job: 科研人员在形成假设、编写实验代码、跑实验并整理结果的研究节点，处理实验脚本与数据，要完成一轮可复核的科学探索。
  job_en: A researcher at the node of forming hypotheses, writing experiment code, running experiments
    and organizing results handles experiment scripts and data, to complete one round of checkable scientific
    exploration.
  pain: 实验代码编写与反复试跑占用大量时间，探索方向多而人力有限，一轮实验周期长。
  pain_en: Writing experiment code and repeated trial runs consume large amounts of time, exploration
    directions outnumber available hands, and one experiment round takes long.
  current_alternative: 旧做法是研究者自己写脚本、手动跑实验并整理结果，或让研究生承担重复性实验工作。
  current_alternative_en: The old way is for researchers to write scripts themselves, run experiments
    manually and organize results, or to have graduate students take on repetitive experiment work.
  usage_reason: 推断：相较研究者自己逐个写脚本跑实验，它把编码代理编排成自动执行实验的流程，省掉反复手写与调度实验代码这一步，因此探索方向多、人力有限的实验室会先试用；仓库未提供持续使用或付费证据。
  usage_reason_en: 'Inference: versus a researcher writing and running each script, it orchestrates coding
    agents into a flow that executes experiments automatically, removing the step of repeatedly hand-writing
    and dispatching experiment code, so labs with many directions and limited hands would try it first;
    the repository provides no sustained-use or payment evidence.'
