    manually and organize results, or to have graduate students take on repetitive experiment work.
  usage_reason: 推断：相较研究者自己逐个写脚本跑实验，它把编码代理编排成自动执行实验的流程，省掉反复手写与调度实验代码这一步，因此探索方向多、人力有限的实验室会先试用；仓库未提供持续使用或付费证据。
  usage_reason_en: 'Inference: versus a researcher writing and running each script, it orchestrates coding
    agents into a flow that executes experiments automatically, removing the step of repeatedly hand-writing
    and dispatching experiment code, so labs with many directions and limited hands would try it first;
    the repository provides no sustained-use or payment evidence.'
