  market: ''
  job: 工程师在学习技术书时，把 PDF 转成可在编码工作中随时调用的 Claude Code 技能，用于查阅与参考。
  job_en: Engineers convert a technical book PDF into a Claude Code skill they can call while coding,
    for lookup and reference.
  pain: 公开材料只说明可把 PDF 转成技能，没有说明原来查阅技术书时哪一步费时，痛点无法还原。
  pain_en: Public material only says a PDF can be turned into a skill and does not say which step of consulting
    a technical book was slow, so the pain cannot be reconstructed.
  current_alternative: 工程师在 PDF 阅读器里搜索关键词，或把笔记手工整理进文档。
  current_alternative_en: Engineers search keywords in a PDF reader, or manually organize notes into documents.
  usage_reason: 推断：若书的内容能变成编码时可直接调用的技能，可省去在 PDF 中反复检索的步骤；但公开材料未给出使用场景与留存证据，无法确认用户为何选择它。
  usage_reason_en: 'Inference: if book content becomes a skill callable while coding, it could remove
    repeated searching inside a PDF; but public material gives no usage scenario or retention evidence,
    so why users choose it cannot be confirmed.'
