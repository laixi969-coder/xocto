  market: ''
  job: 知识工作者或研究人员在微信群和公众号里长期积累了大量零散讨论与文章，需要把这些非结构化中文材料导入本地工具，由 AI 生成结构化摘要，再交给 Codex 或 Claude Code 等代理继续检索、引用和加工，形成可复用的知识库。
  job_en: Knowledge workers or researchers who have accumulated scattered WeChat group discussions and
    official-account articles need to import this unstructured Chinese material into a local tool, have
    AI produce structured digests, and hand them to agents such as Codex or Claude Code for further retrieval,
    citation and processing as a reusable knowledge base.
  pain: 微信群聊与公众号文章是中文场景里信息密度高但极难沉淀的载体：内容按时间流滚动、无法全文检索、转发与收藏后很快沉底，人工逐条摘录成本高且容易漏掉关键结论；不处理的直接后果是这些材料读完即弃，需要时找不到，也无法被代理工具复用。
  pain_en: 'WeChat group chats and official-account articles are high-density but hard-to-retain Chinese
    sources: content scrolls in time order, is not full-text searchable, and quickly sinks after forwarding
    or bookmarking, so manual note-taking is costly and misses key conclusions; the consequence is that
    material is consumed and lost, unfindable later, and unusable by agent tooling.'
  current_alternative: 当前替代方式主要是人工复制粘贴到笔记软件、用微信自带收藏与搜索、或把文章链接丢进通用 AI 对话里临时总结；这些做法要么不覆盖群聊记录，要么摘要无法沉淀为可被
    Codex/Claude Code 调用的结构化文件。
  current_alternative_en: Current alternatives are mainly manual copy-paste into note apps, WeChat's built-in
    favorites and search, or pasting article links into a general AI chat for ad-hoc summarization; these
    either do not cover group-chat records or fail to persist digests as structured files callable by
    Codex/Claude Code.
  usage_reason: 推断：相较人工摘录或通用 AI 临时总结，该工具把导入、摘要、结构化落盘串成一条本地流水线，用户不必再逐条复制和手工整理格式，产物可直接被代理读取，因此经常处理微信群与公众号材料、且已在用
    Codex/Claude Code 的中文知识工作者会在需要把零散讨论转成可检索知识库时选择它。
  usage_reason_en: 'Inference: compared with manual excerpting or ad-hoc general-AI summarization, the
    tool chains import, summarization and structured local output into one pipeline, so users no longer
    copy items one by one or hand-format notes, and the artifacts are directly readable by agents; therefore
    Chinese knowledge workers who routinely handle WeChat group and official-account material and already
    use Codex/Claude Code would choose it when converting scattered discussion into a searchab'
