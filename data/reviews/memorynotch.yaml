    facts.
  current_alternative: 常见替代是手机自带录音加云端转写服务，或会后人工整理笔记；候选材料未说明 memorynotch 相对这些做法的差异。
  current_alternative_en: Common alternatives are phone recording plus a cloud transcription service,
    or manually writing up notes after the meeting; the candidate material does not state how memorynotch
    differs from these.
  usage_reason: 推断：如果转写质量可用，本地处理能省去上传音频和等待云端返回这一步，对不能外传录音的用户有吸引力；但缺少准确率、语言支持和留存证据，无法确认用户会持续使用。
  usage_reason_en: 'Inference: if transcription quality holds up, local processing removes the upload-and-wait
    step and appeals to users who cannot send recordings off-device; but accuracy, language support and
    retention evidence are missing, so continued use cannot be confirmed.'
