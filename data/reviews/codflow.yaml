  market: ''
  job: 阿尔及利亚的中小电商卖家在收到货到付款（COD）订单后，需要把订单录入、安排本地配送、跟踪签收与回款，并处理拒收退货，最终完成一笔可结算的 COD 交易。
  job_en: Small Algerian e-commerce sellers receiving cash-on-delivery (COD) orders need to capture orders,
    dispatch local delivery, track acceptance and cash collection, and handle refused returns to close
    a settleable COD transaction.
  pain: COD 是阿尔及利亚主流支付方式，卖家必须自行拼装订单表、配送商对接与回款核对；拒收和退货直接造成货损与现金缺口，而通用电商平台默认预付、不覆盖 COD 的签收与结算环节。
  pain_en: COD dominates Algerian payments, so sellers must stitch together order sheets, courier integrations
    and cash reconciliation; refused deliveries and returns cause direct stock loss and cash gaps, while
    generic e-commerce stacks assume prepayment and do not cover COD acceptance and settlement.
  current_alternative: 卖家目前用通用电商建站工具加表格、电话/WhatsApp 确认订单，再手工对接本地配送商并人工核对回款；或使用本地非开源的 COD 工具。
  current_alternative_en: Sellers today use generic storefront builders plus spreadsheets and phone/WhatsApp
    order confirmation, then manually hand off to local couriers and reconcile cash by hand; or use closed
    local COD tools.
  usage_reason: 推断：相较表格加手工对接，codflow 把 COD 订单、配送调度与状态追踪放进同一开源流程，卖家可自托管并省去跨工具搬运订单与人工对账这一步；预留的智能体接口让订单与配送数据可被自动化调用。适合已用表格跑
    COD、希望自控数据并减少手工搬运的阿尔及利亚中小卖家。
  usage_reason_en: 'Inference: versus spreadsheets plus manual courier handoff, codflow puts COD orders,
    dispatch and status tracking in one open-source flow that sellers can self-host, removing the step
    of moving orders across tools and reconciling by hand; its agent-ready interface lets order and delivery
    data be called by automation. It fits small Algerian sellers already running COD on spreadsheets who
    want data control and less manual transfer.'
