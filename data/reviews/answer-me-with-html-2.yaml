  market: ''
  job: 分析师、顾问或研究者在需要向同事或客户解释一个复杂问题时，把零散资料交给 AI，要求产出一页可直接阅读和分享的 HTML 说明页。
  job_en: Analysts, consultants or researchers explaining a complex question to colleagues or clients
    hand scattered material to an AI and ask for a single readable, shareable HTML explainer page.
  pain: 旧做法是拿到大段聊天文本后自己复制、排版、截图，才能变成能发出去的文档，这一步纯手工且反复发生。
  pain_en: The old way is to copy, lay out and screenshot a long chat transcript before it can be sent
    to anyone, a purely manual step that repeats constantly.
  current_alternative: 当前替代方式是把聊天输出粘进 Word、Notion 或 PPT 再手动排版，或直接转发一段难以阅读的对话记录。
  current_alternative_en: The current alternative is pasting chat output into Word, Notion or slides and
    formatting by hand, or forwarding an unreadable transcript.
  usage_reason: 推断：它把排版这一步从用户手里移到模型输出环节，用户拿到的是已经成形的单页文件，省掉复制与排版，因此经常需要把复杂结论发给非技术同事的人会优先试用。
  usage_reason_en: 'Inference: it moves the layout step from the user into the model''s output, so the
    user receives a finished single page and skips copying and formatting, which is why people who often
    send complex conclusions to non-technical colleagues would try it first.'
