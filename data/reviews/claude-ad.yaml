  market: ''
  job: 红队工程师或渗透测试员在授权内部 Active Directory 评估中，面对域内主机、凭据与证书服务等材料，需要按 Kerberoasting、ADCS ESC1-17、DCSync、ACL
    滥用、NTLM 中继、委派等手法完成攻击链并记录 OPSEC 与遥测影响。
  job_en: Red team engineers or penetration testers, during authorized internal Active Directory assessments,
    work with domain hosts, credentials and certificate services to execute attack chains such as Kerberoasting,
    ADCS ESC1-17, DCSync, ACL abuse, NTLM relay and delegation, while documenting OPSEC and telemetry
    impact.
  pain: AD 攻击手法繁多且版本相关，工程师需在 netexec、impacket、certipy、bloodyAD、BloodHound CE 之间手工拼接命令，容易漏掉 OPSEC 与遥测注意事项，重复劳动多且对经验依赖高。
  pain_en: AD attack techniques are numerous and version-dependent; engineers must manually stitch commands
    across netexec, impacket, certipy, bloodyAD and BloodHound CE, easily missing OPSEC and telemetry
    notes, with heavy repetition and high reliance on experience.
  current_alternative: 当前替代是手工执行工具命令、自写脚本，或查阅博客与内部 wiki 中的零散手法笔记，缺少与 Claude Code 集成的可复用技能与斜杠命令流程。
  current_alternative_en: Current alternatives are manually running tool commands, writing custom scripts,
    or consulting scattered blog and internal wiki notes, lacking reusable skills and slash-command flows
    integrated with Claude Code.
  usage_reason: 推断：相较手工拼接命令，它把每种 AD 手法封装为 Claude Code 技能、代理与斜杠命令，直接驱动既有工具并附带 OPSEC/遥测提示，减少查文档与拼命令的步骤，因此常做内部
    AD 评估、已在用 Claude Code 的红队工程师会在授权测试中选择它。
  usage_reason_en: 'Inference: compared with manually stitching commands, it packages each AD technique
    as Claude Code skills, agents and slash commands that drive existing tools with OPSEC/telemetry notes,
    cutting documentation lookup and command assembly, so red team engineers already using Claude Code
    for authorized internal AD assessments would choose it.'
