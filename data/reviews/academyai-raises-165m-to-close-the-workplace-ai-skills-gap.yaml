  market: ''
  job: 企业学习与发展负责人或 HR 在年度技能盘点或岗位调整时，处理员工的 AI 使用情况与岗位要求，要产出一份按岗位划分的技能差距清单和培训安排。
  job_en: A corporate L&D lead or HR manager, during annual skills reviews or role changes, works with
    employees' AI usage and role requirements to produce a role-by-role skills-gap list and a training
    plan.
  pain: 岗位对 AI 能力的要求变化快，企业缺少统一的评估口径，培训往往与岗位实际任务脱节，盘点结果难以核对。
  pain_en: Role expectations for AI skills shift quickly, firms lack a shared assessment standard, training
    often drifts from actual job tasks, and inventory results are hard to verify.
  current_alternative: 多数企业目前靠通用在线课程、外部讲师工作坊或员工自评表格来应付，评估与岗位任务不挂钩。
  current_alternative_en: Most firms currently rely on generic online courses, external instructor workshops
    or self-assessment forms, with assessment disconnected from actual job tasks.
