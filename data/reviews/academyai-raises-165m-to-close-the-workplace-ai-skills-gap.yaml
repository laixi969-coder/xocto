  usage_reason_en: 'Inference: if the platform generates assessments and training from role tasks rather
    than generic courses, firms skip designing their own assessment standard and get comparable results
    on re-test, which may lead L&D owners in credential-heavy firms to choose it; no customer cases or
    repeat-use evidence are public, so sustained use cannot be confirmed.'
