  market: ''
  job: 仓储运营经理在订单波次与多台机器人调度冲突时，处理订单流、库位和机器人状态数据，要完成拣选与搬运任务的分配并保证出库时效。
  job_en: A warehouse operations manager, when order waves conflict with multiple robots' dispatch, works
    with order flow, bin location and robot status data to allocate picking and transport tasks and keep
    outbound deadlines.
  pain: 人工排产难以同时兼顾订单优先级、机器人路径与库位约束，波次高峰时容易堵单、错发，靠加人加班只能缓解。
  pain_en: Manual scheduling struggles to balance order priority, robot routing and bin constraints at
    once, so peak waves cause congestion and mis-shipments that overtime staffing only partly relieves.
  current_alternative: 多数仓库仍用 WMS 报表加人工排产，或用机器人厂商自带的单机调度软件，跨设备协同靠电话和表格。
  current_alternative_en: Most warehouses still use WMS reports plus manual scheduling, or single-vendor
    robot dispatch software, coordinating across devices by phone and spreadsheets.
  usage_reason: 相较人工排产，它把订单、库位与机器人状态统一进一个调度模型，直接产出任务分配，减少调度员逐单比对和临时改派这一步；推断在波次密集、设备种类多的仓库里，运营团队会因此选择它。
  usage_reason_en: Compared with manual scheduling, it unifies orders, bin locations and robot status
    into one dispatch model and directly outputs task allocation, removing the step where dispatchers
    compare orders one by one and reassign on the fly; by inference, operations teams at warehouses with
    dense waves and mixed device fleets would choose it for this reason.
