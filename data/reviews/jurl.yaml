  current_alternative: 工程师目前通常用 curl 取回原始 HTML，再自己写解析规则，或依赖现成的抓取库与无头浏览器处理动态页面。
  current_alternative_en: Engineers currently use curl to fetch raw HTML and write their own parsing rules,
    or rely on existing scraping libraries and headless browsers for dynamic pages.
  usage_reason: 推断：相较 curl 加自写解析，Jurl 若在取回阶段就返回干净正文，可省去每个站点单独维护解析规则这一步；但公开材料未说明抽取质量、动态页面支持与失败处理，因此哪类团队会因此替换现有脚本仍缺少证据。
  usage_reason_en: 'Inference: compared with curl plus hand-written parsing, Jurl could remove the step
    of maintaining per-site parsing rules if it returns clean body text at fetch time; but public material
    does not describe extraction quality, dynamic-page support or failure handling, so which teams would
    replace existing scripts lacks evidence.'
