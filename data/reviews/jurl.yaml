  job_en: A backend or data engineer writing a scraping script needs readable body text from a target
    page, calls Jurl to fetch it and receives processed text to pass downstream for parsing or storage.
  pain: 候选材料只有一句功能描述，没有说明此前解析网页正文耗时多久、失败率多高或维护成本多大，痛点强度无法从公开事实判断。
