  next_validation: 收集 Postman 官方关于 Agent Mode 的定价或套餐说明，确认该功能是否单独计费及其包含范围。
  market: ''
  job: 日常维护接口的开发者，在调试请求、补写接口文档或查找某个 API 用法时，面对散落在侧边栏、标签页和集合里的历史内容，需要快速定位并完成一次测试或文档更新。
  job_en: A developer maintaining APIs who, while debugging a request, updating endpoint docs or looking
    up how an API works, faces content scattered across sidebars, tabs and collections and needs to locate
    it and finish a test or doc update quickly.
  pain: 老产品的信息藏在多层界面里，找入口本身就要花时间，跨测试、文档、发现几个环节还要手工搬运上下文。
  pain_en: In a mature product the information hides behind multiple interface layers, so finding the
    entry point costs time and context must be carried by hand across testing, docs and discovery.
  current_alternative: 开发者现在靠记忆和界面导航逐层点开，或把接口信息复制到聊天助手和编辑器里另行处理。
  current_alternative_en: Developers today rely on memory and interface navigation, or copy API details
    into a chat assistant and an editor to handle separately.
  usage_reason: 推断：相较逐层点开界面再手工复制上下文，它把测试、文档与接口发现合并到一次自然语言请求里，省掉定位入口和搬运中间信息这一步，因此已在 Postman 里积累大量接口资产的团队在赶版本时更可能用它。
  usage_reason_en: 'Inference: versus clicking through layers and copying context by hand, it folds testing,
    docs and discovery into one natural-language request, removing the step of locating entry points and
    moving intermediate information, so teams with large existing API assets in Postman are more likely
    to use it near a release.'
