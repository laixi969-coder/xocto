  market: ''
  job: 口播类短视频创作者或剪辑师在剪一条竖屏成片时，把原始口播素材和一条想模仿的参考视频交给它，按 7 种风格套用节奏、生成不遮脸字幕并加入动态场景，输出可直接发布的成片。
  job_en: A talking-head short-video creator or editor, cutting one vertical clip, hands raw talking-head
    footage plus a reference video to it, applies one of 7 styles for pacing, generates face-safe captions
    and motion scenes, and outputs a publish-ready clip.
  pain: 口播剪辑的重复劳动集中在逐句对齐字幕、避开人脸、套节奏和模仿参考片风格；这些步骤耗时且容易返工，但公开材料未给出耗时或返工量的量化数据。
  pain_en: 'Talking-head editing repeats the same labor: aligning captions line by line, avoiding faces,
    matching pacing, and imitating a reference style; these steps are slow and rework-prone, though public
    materials give no quantified time or rework data.'
  current_alternative: 现有替代是人工在通用剪辑软件里逐条剪、手动打字幕，或套用固定模板；参考视频的节奏只能靠肉眼拆解后手动复刻。
  current_alternative_en: The current alternative is manual cutting in general editing software, hand-typed
    captions, or fixed templates; a reference video's pacing is reverse-engineered by eye and rebuilt
    by hand.
  usage_reason: 推断：相较手动逐句对齐和肉眼拆解参考片，它把参考视频反推成可复用模板，并自动生成不遮脸字幕与动态场景，减少字幕对齐和风格复刻这两步手工负担，因此需要批量产出统一风格口播片的创作者会在赶发布节奏时选择它。
  usage_reason_en: 'Inference: versus manual line-by-line caption alignment and eyeballing a reference
    edit, it reverse-engineers the reference into a reusable template and auto-generates face-safe captions
    and motion scenes, cutting the manual caption-alignment and style-replication steps, so creators producing
    uniform talking-head clips at publishing cadence would pick it.'
