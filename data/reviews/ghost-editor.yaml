  market: ''
  job: 口播创作者或代运营剪辑师在拿到一段原始口播素材、并希望复刻某条爆款视频的节奏与字幕样式时，需要产出一条可直接发布的竖屏成片。
  job_en: A talking-head creator or agency editor who has raw talking-head footage and wants to replicate
    the pacing and caption style of a hit video needs to produce a publishable vertical clip.
  pain: 旧做法要在剪辑软件里逐段对齐节奏、手动打字幕并避开人脸、再逐个加转场，一条片子耗时且高度依赖剪辑经验，非专业出镜者做不出来。
  pain_en: The old way means aligning pacing clip by clip in editing software, typing captions by hand
    while avoiding the face, then adding transitions one by one; a single clip is slow and depends heavily
    on editing skill that non-professional on-camera talent lacks.
  current_alternative: 人工在剪辑软件里逐条剪，或把素材交给剪辑师/外包团队，或使用通用模板化剪辑工具手动套用。
  current_alternative_en: Editing manually in video software, handing footage to a freelance editor or
    agency, or manually applying generic template-based editing tools.
  usage_reason: 相较人工逐段对齐，它把“参考视频”直接作为输入，由模型反推节奏与字幕样式并一次性套用到新素材上，省掉拆解参考片和手动打字幕这两步；推断经常出镜但不会剪辑的专业人士会因此选择它，前提是成片返工量足够低。
  usage_reason_en: Compared with aligning clips by hand, it takes the reference video as direct input
    and has the model reverse-engineer pacing and caption style and apply them to new footage in one pass,
    removing the steps of dissecting the reference and typing captions; the inference is that professionals
    who appear on camera but cannot edit will choose it, provided rework stays low.
