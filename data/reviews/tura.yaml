  market: ''
  job: 开发者在构建调用 MCP 工具的 agent 时，需要减少模型与工具之间的往返轮次，以控制单次任务的调用成本。
  job_en: Developers building agents that call MCP tools need to cut round-trips between model and tools
    to control per-task call cost.
  pain: 公开材料只有一句轮次削减的说法，没有说明开发者在哪一步被成本卡住、原来要花多少轮，也没有用户抱怨或替代行为记录。
  pain_en: The public material is a single claim about cutting rounds; it does not say where developers
    are blocked by cost or how many rounds it used to take, and there is no record of user complaints
    or substitute behaviour.
  current_alternative: 旧做法通常是直接按默认方式编排工具调用，或自行写缓存与批处理逻辑；候选材料未给出与这些做法的对比。
  current_alternative_en: The old approach is usually orchestrating tool calls the default way, or writing
    caching and batching logic by hand; the candidate material gives no comparison with these approaches.
  usage_reason: 推断：如果轮次压缩能在不降低任务完成度的前提下减少调用次数，开发者会在 agent 调用成本敏感时选择它；但缺少采用、留存或付费证据，无法确认这一选择已经发生。
  usage_reason_en: 'Inference: if round-trip compression cuts call counts without lowering task completion,
