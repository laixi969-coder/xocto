  market: ''
  job: 数学家或形式化验证工程师在推进素数间隙上界研究时，需要把条件性证明与数值证书整理成可被 Lean 机器检查的形式，以便他人复核或在其上继续扩展结论。
  job_en: Mathematicians or formal verification engineers advancing research on prime gap upper bounds
    need to turn a conditional proof and numerical certificate into a Lean machine-checkable form so others
    can audit it or extend the result.
  pain: 素数间隙这类结论的验证成本极高：传统论文加数值脚本的证明难以被独立复核，审稿人或后续研究者要重跑计算、重查推导，任何一步不一致都会让结论无法被采信。
  pain_en: 'Verifying results about prime gaps is extremely costly: a paper plus numerical scripts is
    hard to audit independently, and reviewers or later researchers must rerun computations and recheck
    derivations, with any mismatch making the claim unusable.'
  current_alternative: 当前替代方式是论文叙述加自写数值验证脚本，或依赖 Mathlib 等通用 Lean 库自行形式化，缺少针对该命题的现成可检查工件。
  current_alternative_en: The current alternative is a paper narrative plus self-written numerical verification
