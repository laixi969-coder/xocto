  next_validation: 收集该站点公开的规则与结算说明页面，确认下注标的、结算方式与合规声明。
  market: ''
  job: 科研人员在 ICLR 2027 结果公布前，想判断某篇论文的接收可能性，于是在该平台上对论文是否被接收下注，最终得到一个概率价格。
  job_en: Before ICLR 2027 decisions, a researcher who wants to gauge a paper's acceptance odds bets on
    whether it will be accepted, ending up with a probability price.
  pain: 候选材料只有一句产品描述，没有说明投稿人或旁观者此前如何估计录用概率、这一判断失误会带来什么后果，痛点无法还原。
  pain_en: The candidate gives only a one-line description; it does not say how submitters or observers
    previously estimated acceptance odds or what a wrong judgment costs, so the pain cannot be reconstructed.
  current_alternative: 公开材料未说明现有替代方式，无法确认此前是靠同行私下打听、社交媒体讨论还是其他渠道判断录用概率。
  current_alternative_en: The public material does not describe existing alternatives, so it is unclear
    whether people previously judged acceptance odds through private peer inquiries, social media discussion,
    or other channels.
  usage_reason: 推断：若市场能汇集分散的评审圈判断，参与者可比只看单方消息更快得到一个概率参考；但缺少结算规则与参与者规模信息，无法判断这一参考是否可信、是否有人持续使用。
  usage_reason_en: 'Inference: if the market aggregates dispersed reviewer-circle judgments, participants
    may get a probability reference faster than relying on one-sided information; however, without settlement
    rules or participant scale, it is unclear whether the reference is credible or repeatedly used.'
