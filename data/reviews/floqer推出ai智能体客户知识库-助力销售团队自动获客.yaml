  market: ''
  job: 销售开发代表在筛选目标客户时，把公司官网、新闻和公开资料整理成客户画像与触达话术，以决定先联系谁、怎么开口。
  job_en: Sales development reps compile company websites, news and public materials into account profiles
    and outreach scripts when prioritizing prospects, to decide whom to contact first and how to open.
  pain: 公开资料分散在官网、新闻和多个来源，人工逐个整理耗时且容易遗漏关键触发事件，导致触达时机和话术质量不稳定。
  pain_en: Public information is scattered across websites, news and multiple sources; manual compilation
    is slow and easily misses key trigger events, making timing and script quality inconsistent.
  current_alternative: 销售代表手工搜索、复制粘贴到表格或 CRM，再凭经验写开场话术；部分团队用通用聊天助手零散生成。
  current_alternative_en: Reps manually search, copy-paste into spreadsheets or CRM, and write openers
    from experience; some teams use general chat assistants piecemeal.
  usage_reason: 推断：相较手工逐站查资料，产品让智能体先汇总客户公开信息并生成画像与话术，减少资料收集与初稿撰写这一步，因此需要批量筛选线索的销售团队会在日常获客时选择它；线索质量与留存尚无公开证据。
  usage_reason_en: 'Inference: versus manual site-by-site research, the agent first aggregates public
    account information and drafts profiles and scripts, cutting the collection and first-draft step,
    so sales teams screening leads at volume would choose it in daily prospecting; lead quality and retention
    have no public evidence yet.'
