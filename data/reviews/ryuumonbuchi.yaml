  market: ''
  job: 逆向工程师或安全分析师在拿到可疑二进制样本时，需要反编译并理解函数逻辑，以判断样本行为并产出分析结论。
  job_en: A reverse engineer or security analyst who receives a suspicious binary sample needs to decompile
    and understand function logic in order to judge sample behavior and produce an analysis conclusion.
  pain: 反编译结果分散在图形界面里，逐段复制到外部工具提问既打断分析节奏，也容易漏掉上下文；样本量大时这一步成为瓶颈。
  pain_en: Decompiled output is scattered across a GUI, and copying it piece by piece into an external
    tool breaks the analysis rhythm and easily loses context; with many samples this step becomes a bottleneck.
  current_alternative: 现有做法是人工在 Ghidra 里阅读反编译代码，或把代码片段手动导出后粘贴到通用对话工具中提问。
  current_alternative_en: The current practice is to read decompiled code manually in Ghidra, or export
    code snippets by hand and paste them into a general chat tool.
  usage_reason: 推断：相较手工导出再粘贴，它让模型直接读取反编译结果并返回分析结论，省掉复制与切换工具这一步，因此处理大量样本的逆向工程师会在批量初筛时选择它；尚无留存或付费证据。
  usage_reason_en: 'Inference: compared with manual export and pasting, it lets the model read decompiled
    output directly and return findings, removing the copy-and-switch step, so reverse engineers handling
    many samples would choose it for bulk triage; no retention or payment evidence yet.'
