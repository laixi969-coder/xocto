  market: ''
  job: 开发者在向编码 agent 描述界面缺陷或复现步骤时，用标注和录屏把问题材料整理成可发送的输入，以便 agent 定位并处理该问题。
  job_en: Developers describing a UI defect or reproduction steps to a coding agent annotate and record
    the problem material into a sendable input so the agent can locate and act on it.
  pain: 用文字描述界面问题容易遗漏上下文，agent 需要多轮追问才能复现，开发者要反复补充截图和步骤。
  pain_en: Describing UI problems in text easily loses context, so the agent needs repeated follow-ups
    to reproduce, and the developer keeps adding screenshots and steps.
  current_alternative: 旧做法是手写缺陷描述、截屏加文字标注，或直接口头向同事说明，再粘贴进对话。
  current_alternative_en: The old way is to hand-write a defect description, screenshot with text annotations,
    or explain verbally to a colleague, then paste it into the conversation.
  usage_reason: 推断：相较手写描述加零散截图，它把标注和录屏合成一段可直接发送的材料，减少开发者反复补充复现步骤的那一步；需要向 agent 交代界面问题的开发者会因此选择它。
  usage_reason_en: 'Inference: compared with hand-written descriptions plus scattered screenshots, it
    combines markup and recording into one sendable piece, removing the step of repeatedly adding reproduction
    details; developers who must explain UI issues to an agent would choose it for that reason.'
