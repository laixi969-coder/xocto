  market: ''
  job: 运营或数据人员面对没有开放接口的后台网页，需要定期取数、填表或提交表单，把重复点击交给代理完成。
  job_en: Operations or data staff facing back-office web pages without APIs need to periodically pull
    data, fill forms or submit entries, delegating repetitive clicking to an agent.
  pain: 手工点击和复制粘贴枯燥且易错，页面改版后脚本容易失效，人力成本随频次线性增长。
  pain_en: Manual clicking and copy-pasting is tedious and error-prone, scripts break after page redesigns,
    and labor cost grows linearly with frequency.
  current_alternative: 写固定选择器的爬虫脚本，或安排人工按流程逐页操作。
  current_alternative_en: Writing crawler scripts with fixed selectors, or assigning staff to operate
    page by page following a procedure.
  usage_reason: 推断：相较固定选择器脚本，它用模型理解页面结构来执行操作，页面改版时少一步重写脚本的工作，因此维护多个无接口后台的团队会先试用。
  usage_reason_en: 'Inference: compared with fixed-selector scripts, it uses a model to understand page
    structure when acting, removing the step of rewriting scripts after redesigns, so teams maintaining
    several API-less back offices are likely to try it first.'
