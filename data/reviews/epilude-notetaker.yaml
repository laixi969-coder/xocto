  job_en: Teams or individuals who need to retain meeting outcomes process audio and conversation material
    during or after a meeting to produce reviewable meeting notes.
  pain: 公开材料只给出“100% 私密会议笔记”一句，未说明用户此前用什么方式记录、哪一步最费时，也未给出任何用户抱怨或替代行为的描述。
  pain_en: Public material offers only the line "100% private meeting notes"; it does not say how users
    recorded meetings before, which step was most costly, and gives no user complaints or workaround descriptions.
  current_alternative: 公开材料未披露现有替代方式，无法确认用户此前是手工记录、使用通用转写工具还是其他做法。
  current_alternative_en: Public material does not disclose existing alternatives, so it is unclear whether
    users previously took notes by hand, used generic transcription tools, or something else.
  usage_reason: 无法判断：材料未说明它相较旧做法减少了哪一步负担或改善了哪项可核对结果，仅凭“私密”一词不足以解释用户为何选择它。
  usage_reason_en: 'Cannot be judged: the material does not explain which step of the old workflow it
    removes or which checkable result it improves; the word "private" alone does not explain why users
    would choose it.'
