  market: ''
  job: 远程会议、线上课程或直播的使用者在电脑自带摄像头或麦克风质量差、或根本没有时，需要把手机变成可被会议软件识别的摄像头和麦克风。
  job_en: Users in remote meetings, online classes or livestreams need to turn a phone into a camera and
    microphone recognised by meeting software when the computer's built-in devices are poor or absent.
  pain: 笔记本摄像头画质差、麦克风拾音差，买外设要花钱，云端降噪工具又要求上传音频并注册账号。
  pain_en: Laptop cameras are poor and microphones pick up noise, buying peripherals costs money, and
    cloud noise-reduction tools require uploading audio and creating accounts.
  current_alternative: 旧做法是购买 USB 摄像头与麦克风，或使用 DroidCam、Iriun、WO Mic 等同类手机转外设工具。
  current_alternative_en: The old practice is buying USB cameras and microphones, or using similar phone-as-peripheral
    tools such as DroidCam, Iriun and WO Mic.
  usage_reason: 推断：它把降噪与回声消除放在本地完成，省去上传音频和注册账号这一步，并直接以虚拟摄像头接入会议软件，因此在意隐私、又不想添置硬件的使用者会选它。
  usage_reason_en: 'Inference: it performs noise reduction and echo cancellation locally, removing the
