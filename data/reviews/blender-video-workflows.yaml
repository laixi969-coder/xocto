  market: ''
  job: 视频创作者或动画师在需要复刻一段参考视频、或把原创白模动画转成成片时，要先把画面结构和运动转成生成模型能吃的提示词。
  job_en: A video creator or animator replicating a reference video or turning an original white-model
    animation into a finished clip must first convert shot structure and motion into prompts a generator
    can consume.
  pain: 直接写提示词难以控制镜头结构和运动，反复生成仍对不上参考片，浪费生成额度与时间。
  pain_en: Writing prompts directly gives poor control over shot structure and motion, so repeated generations
    still fail to match the reference, wasting credits and time.
  current_alternative: 旧做法是凭经验反复试提示词，或先在 Blender 里手工搭场景再人工翻译成提示词。
  current_alternative_en: The old way is to iterate prompts by experience, or build the scene manually
    in Blender and hand-translate it into prompts.
  usage_reason: 推断：相较反复试提示词，它把 Blender 里的白模或参考片结构直接转成提示词，减少创作者在生成工具与三维软件之间来回翻译的那一步，因此需要稳定复刻镜头的广告与短视频团队会试用。
  usage_reason_en: 'Inference: compared with iterating prompts, it converts the white-model or reference
    structure in Blender directly into prompts, removing the back-and-forth translation between the generator
    and 3D software, so ad and short-video teams needing repeatable shots would try it.'
