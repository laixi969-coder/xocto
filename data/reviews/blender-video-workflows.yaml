  market: ''
  job: 视频创作者或动画师在需要复刻一段参考视频的运镜与节奏、或把原创白模动画转成成片时，用 Codex 配合 Blender 把参考素材或白模动画转成提示词，再交给 AI 视频生成工具出片。
  job_en: A video creator or animator who needs to replicate the camera movement and pacing of a reference
    video, or turn an original white-model animation into a finished clip, uses Codex with Blender to
    convert the reference material or white-model animation into prompts, then feeds them to an AI video
    generation tool.
  pain: AI 视频生成工具难以精确控制运镜与构图，创作者只能反复试提示词，白模动画与生成结果之间缺少可复用的转换环节；不解决的后果是复刻参考视频或保持角色一致性要耗费大量试错，成片节奏难以对齐。
  pain_en: AI video generation tools are hard to control precisely for camera movement and composition,
    so creators iterate on prompts repeatedly, and there is no reusable bridge between white-model animation
    and generated output; the consequence is heavy trial-and-error to replicate a reference video or keep
    character consistency, with pacing hard to align.
  current_alternative: 直接在 AI 视频工具里手写提示词反复试错，或用传统 Blender 手工 K 帧、逐镜头渲染，前者不可控、后者耗时且难以复用参考视频的运镜。
  current_alternative_en: Hand-writing prompts and iterating inside AI video tools, or manually keyframing
    and rendering shot by shot in traditional Blender; the former is uncontrollable and the latter is
    slow and hard to reuse a reference video's camera work.
  usage_reason: 相较手写提示词试错，它把 Blender 中的参考视频或白模动画经 Codex 转成结构化提示词，让运镜与构图先在三渲空间里确定再交给生成工具，减少反复盲试提示词这一步；需要复刻特定参考片或保持角色一致性的创作者会在这种场景下选择它。这是基于工作流结构的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with trial-and-error prompt writing, it converts a reference video or white-model
    animation in Blender into structured prompts via Codex, so camera movement and composition are fixed
    in a 3D space before generation, removing the blind prompt-iteration step; creators who must replicate
    a specific reference or keep character consistency would choose it in that situation. This is an inference
    from workflow structure, not yet backed by user feedback.
