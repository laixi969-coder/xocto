  next_validation: 抓取 sunkcost.ai 页面与说明文档，核对计算输入项、数据来源及是否公开定价或收费方式。
  market: ''
  job: 准备自购显卡或整机跑本地大模型的开发者，在采购前需要把设备价格、电费与云 API 用量放在一起，算清多久回本。
  job_en: A developer about to buy a GPU or full machine for local LLM inference needs to put hardware
    price, electricity and cloud API usage side by side before purchase to see the payback period.
  pain: 本地推理的隐性成本（电费、折旧、闲置率）难以估算，买贵或买错就是一笔沉没成本，而云 API 账单又随用量波动。
  pain_en: Hidden costs of local inference such as power, depreciation and idle time are hard to estimate,
    so a wrong purchase becomes sunk cost, while cloud API bills swing with usage.
  current_alternative: 自己用表格估算，或凭经验对比云 API 价格，缺少统一口径。
  current_alternative_en: Estimating in a spreadsheet or comparing cloud API prices by rule of thumb,
    with no shared basis.
  usage_reason: 推断：它把设备成本与云 API 用量放进同一个回本计算里，用户不必自己拼表格就能得到一个可比较的年限数字，因此准备采购 GPU 的开发者会先算一遍再下单。缺少实际使用与复购证据，无法判断是否被长期使用。
  usage_reason_en: 'Inference: it puts hardware cost and cloud API usage into one payback calculation,
    so users get a comparable number of years without building their own spreadsheet, which is why developers
    about to buy GPUs would run it before ordering. Actual usage and repeat-use evidence is missing, so
    long-term use cannot be claimed.'
