  market: ''
  job: 在昇腾 NPU 上做模型训练或推理的算子开发工程师，需要让矩阵乘法这类核心算子跑得足够快且精度对齐，才能让整个训练或推理任务在可接受时间内完成。
  job_en: Kernel developers running model training or inference on Ascend NPUs need core operations such
    as matrix multiplication to run fast enough with aligned precision so the overall training or inference
    job finishes in acceptable time.
  pain: 昇腾上的高性能算子此前主要靠硬件厂商或团队自研，模型团队迁移时常常卡在算子性能与精度上，缺少可直接复用的实现。
  pain_en: High-performance kernels on Ascend have mainly come from the hardware vendor or in-house work,
    so model teams migrating often get stuck on kernel performance and precision with no reusable implementation
    available.
  current_alternative: 使用硬件厂商提供的算子库，或由团队自行编写和调优矩阵乘法算子。
  current_alternative_en: Using the hardware vendor's kernel library, or writing and tuning matrix multiplication
    kernels in house.
  usage_reason: 推断：相较团队自研算子，该库把 DeepSeek 训练中使用的矩阵乘法实现开源到昇腾平台，迁移团队可直接调用而非重写，减少的是算子编写与调优这一步；实际收益取决于其覆盖的矩阵形状与精度，目前尚未核验。
  usage_reason_en: 'Inference: compared with in-house kernel development, this library open-sources the
    matrix multiplication implementation used in DeepSeek training onto the Ascend platform, so migrating
    teams can call it instead of rewriting, removing the step of kernel authoring and tuning; the real
    gain depends on covered shapes and precision, which are not yet verified.'
