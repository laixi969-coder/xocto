  market: ''
  job: 临床医生在诊疗或查房时，就具体医学问题检索并核对循证文献，形成可引用的判断依据。
  job_en: Clinicians searching and verifying evidence-based literature on specific medical questions during
    consultations or rounds to form citable judgments.
  pain: 医学文献量大且更新快，医生在门诊时间压力下难以快速找到并核对可靠证据。
  pain_en: Medical literature is vast and fast-moving, and doctors under clinic time pressure struggle
    to quickly find and verify reliable evidence.
  current_alternative: 手动检索 PubMed 等数据库、查阅指南，或依赖同事经验与记忆。
  current_alternative_en: Manually searching databases such as PubMed, consulting guidelines, or relying
    on colleagues' experience and memory.
  usage_reason: 推断：它把'检索—筛选—汇总'合并为一次提问返回带出处的答案，减少医生在多库之间反复检索的步骤，因此时间紧张的临床医生在需要快速循证依据时可能选择它；公开材料未提供医生持续使用或付费证据。
  usage_reason_en: 'Inference: it merges search, filtering and summarization into one question that returns
    sourced answers, cutting the back-and-forth across multiple databases, so time-pressed clinicians
    needing quick evidence may choose it; public materials offer no evidence of sustained clinician use
    or payment.'
