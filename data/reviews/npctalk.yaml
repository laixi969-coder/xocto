  market: ''
  job: 游戏模组开发者在为 GTA V 这类开放世界游戏制作剧情模组时，需要给原本只有字幕或固定语音的 NPC 配上可变的台词语音，最终交付一个能直接装进游戏运行的语音模组。
  job_en: Game mod developers building story mods for open-world titles such as GTA V need to give NPCs
    that previously had only subtitles or fixed audio variable spoken lines, delivering a voice mod that
    installs and runs in the game.
  pain: 过去要么自己录台词、要么找配音、要么只用字幕，录音成本高且改一句台词就要重录，模组迭代被卡在音频制作上。
  pain_en: Previously they recorded lines themselves, hired voice actors, or shipped subtitles only; recording
    is costly and every script change forces a re-record, so mod iteration stalls on audio production.
  current_alternative: 手工录音、找配音演员、复用游戏原版语音文件，或干脆只做字幕不做语音。
  current_alternative_en: Manual recording, hiring voice actors, reusing the game's original audio files,
    or shipping subtitles with no voice at all.
  usage_reason: 推断：相较逐句录音，它把语音生成放在自托管服务里，模组作者改台词后重新生成即可，省掉重录和剪辑这一步，因此频繁改剧本的模组作者会在做剧情模组时选它。
  usage_reason_en: 'Inference: compared with recording line by line, it puts voice generation in a self-hosted
    server so authors can regenerate after script edits, removing the re-record and edit step; mod authors
    who revise scripts often would pick it for story mods.'
