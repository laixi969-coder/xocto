  job_en: During the concentrated autumn campus recruitment season, a graduating student facing many postings,
    differing deadlines and varied application requirements needs to submit in priority order without
    missing or misdirecting any, while keeping a trackable application log and company notes.
  pain: 投递窗口短、岗位密集，用表格和备忘录人工跟踪容易漏掉截止时间、重复填写相同信息，提交前缺少统一核对，出错后往往无法补救。
  pain_en: The submission window is short and postings are dense; manual tracking via spreadsheets and
    notes easily misses deadlines, repeats the same data entry, and lacks a consistent pre-submission
    check, so mistakes are often irreversible.
  current_alternative: 多数人用 Excel 表格、备忘录、浏览器书签和手工复制粘贴管理投递，部分人付费请求职辅导机构代改简历。
  current_alternative_en: Most people manage applications with spreadsheets, notes apps, browser bookmarks
    and manual copy-paste, while some pay job-coaching services to revise resumes.
  usage_reason: 相较表格加手工复制，它把岗位、截止时间和投递预算写成状态机队列，由 AI 按规则生成材料并在提交前跑六项核对，减少的是逐条人工比对与漏检这一步，因此处在密集投递期、需要同时管理多份材料的应届生会选它；此为基于产品能力的推断，尚无用户反馈或持续使用证据。
  usage_reason_en: Compared with spreadsheets plus manual copy-paste, it encodes postings, deadlines and
    budget as a state-machine queue, has AI generate materials by rule and run a six-item check before
    submission, removing the item-by-item manual comparison and missed-check step; students in a dense
    submission period managing many materials would choose it. This is inference from product capability,
    with no user feedback or continued-use evidence yet.
