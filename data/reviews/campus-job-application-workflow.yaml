  market: ''
  job: 应届毕业生在秋招集中投递期，面对大量岗位信息、截止时间和各不相同的申请材料要求，需要按优先级完成投递并避免漏投或错投。
  job_en: During the concentrated autumn recruitment season, a graduating student faces many job postings,
    deadlines and differing application requirements, and needs to submit applications in priority order
    without missing or misdirecting any.
  pain: 投递窗口短、岗位多，人工用表格和备忘录跟踪容易漏掉截止时间，重复填写相同信息，且提交前缺少统一检查，出错后无法补救。
  pain_en: The submission window is short and postings are numerous; tracking by spreadsheet and notes
    easily misses deadlines, repeats the same data entry, and lacks a consistent pre-submission check,
    so errors cannot be corrected afterwards.
  current_alternative: 目前多数人用 Excel 表格、备忘录、浏览器书签和手工复制粘贴管理投递，部分人付费请求职辅导机构代改简历。
  current_alternative_en: Most people currently manage applications with spreadsheets, notes apps, browser
    bookmarks and manual copy-paste, while some pay job-coaching services to revise resumes.
  usage_reason: 相较表格加手工复制，它把岗位、截止时间和预算写成状态机队列，由 AI 按规则生成材料并在提交前跑六项核对，减少的是逐条人工比对与漏检这一步；推断，缺少用户反馈与持续使用证据。
  usage_reason_en: Compared with spreadsheets plus manual copy-paste, it encodes postings, deadlines and
    budget as a state-machine queue, has AI generate materials by rule and run a six-item check before
    submission, removing the manual item-by-item comparison and missed-check step; this is inference,
    as user feedback and continued-use evidence are absent.
