  usage_reason: 推断：它把「看懂界面」交给 OCR、把「决定动作」交给分类模型，开发者不必为每个界面写坐标规则，界面小改动时可能不必重录脚本，因此做内部自动化、且目标软件没有 API 的团队会先试它。缺少的是真实流程中的成功率与长期维护记录。
  usage_reason_en: 'Inference: it delegates reading the screen to OCR and choosing the action to a classifier,
    so developers need not write coordinate rules per screen and may avoid re-recording scripts after
    small UI changes; teams doing internal automation on API-less software would try it first. What is
