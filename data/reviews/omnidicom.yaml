  market: ''
  job: 影像科或临床研究相关人员在 Mac 或 Windows 上打开 DICOM 影像并修改其中的元数据字段，以便归档、标注或交付给协作方。
  job_en: Radiology or clinical research staff open DICOM images on Mac or Windows and edit metadata fields
    for archiving, annotation or handoff to collaborators.
  pain: DICOM 查看与元数据编辑长期依赖专用工作站或笨重的桌面软件，在普通电脑上处理时容易遇到兼容问题，改错字段还会影响后续归档与交付。
  pain_en: DICOM viewing and metadata editing have long depended on dedicated workstations or heavy desktop
    software, and handling them on an ordinary computer often runs into compatibility problems, while
    wrong field edits can affect later archiving and handoff.
  current_alternative: 目前多使用医院或科室采购的专用影像工作站、厂商自带查看器，或一些免费但界面陈旧的桌面工具。
  current_alternative_en: Today this is mostly done with dedicated imaging workstations purchased by hospitals
    or departments, vendor-provided viewers, or free but dated desktop tools.
  usage_reason: 推断：如果它能在 Mac 与 Windows 上直接打开影像并就地修改元数据，用户就不必切换到专用工作站或另找工具，从而减少一次环境切换；但候选资料没有说明 AI 是否参与、编辑结果如何校验，也没有任何使用或付费证据，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if it can open images and edit metadata in place on Mac and Windows, users
    would not have to switch to a dedicated workstation or find another tool, removing one environment
    switch; however, the candidate material does not say whether AI is involved or how edits are validated,
    and there is no usage or payment evidence, so it cannot yet be confirmed that users would choose it
    for this reason.'
