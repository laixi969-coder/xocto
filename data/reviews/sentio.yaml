    these lack completeness and security.
  usage_reason: 代理需要真实邮箱以完成注册、接收通知等任务，sentio 提供结构化、可编程的邮件接口。
  usage_reason_en: Agents need real email addresses for tasks like registration and notifications; sentio
    provides a structured, programmable mail interface.
