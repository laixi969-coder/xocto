  market: ''
  job: 个人用户或自由职业者在走动或忙碌时录下语音备忘，处理口述的任务与提醒内容，要完成把零散口述变成可执行的待办条目。
  job_en: An individual user or freelancer records voice notes while moving or busy, working with spoken
    tasks and reminders to turn scattered speech into actionable to-do items.
  pain: 语音备忘录完往往堆在录音列表里，需要事后重听并手工抄成任务，容易遗漏或拖延。
  pain_en: Voice notes pile up in a recording list and must be replayed and manually copied into tasks
    afterwards, which invites omissions and delay.
  current_alternative: 目前多靠系统自带录音加手工整理，或使用转写工具后再自行拆分成待办。
  current_alternative_en: Today people use built-in recorders plus manual sorting, or a transcription
    tool followed by splitting the text into to-dos themselves.
  usage_reason: 相较录完再重听并手工抄写，它把口述内容直接整理成任务与提醒，省掉事后重听与拆分这一步，因此习惯用语音记录的人会尝试；这是基于产品能力的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with replaying and hand-copying after recording, it turns spoken content directly
    into tasks and reminders, removing the replay-and-split step, so people who habitually record by voice
    may try it; this is an inference from capability, not user feedback.
