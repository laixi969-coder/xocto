  market: ''
  job: 使用 DSH 的 AI 应用开发者在一次会话里调用多个技能后，需要处理技能调用记录，弄清哪个技能被触发、是否失败，以便排查问题。
  job_en: AI application developers using DSH who invoke several skills in one session need to work through
    skill-invocation records to find which skill fired and whether it failed, so they can debug.
  pain: 技能调用过程不透明，出错后只能翻日志或凭记忆回溯，定位成本高；但公开材料未说明这种排查有多频繁、不解决会付出什么代价。
  pain_en: Skill invocation is opaque, so after a failure developers can only dig through logs or reconstruct
    from memory, which is costly to localize; the public material does not say how frequent this is or
    what it costs to leave unsolved.
  current_alternative: 阅读运行日志、在代码里自行加打印，或凭记忆判断技能是否被调用。
  current_alternative_en: Reading runtime logs, adding their own print statements in code, or judging
    from memory whether a skill was invoked.
  usage_reason: 推断：相较翻日志，它在应用内直接汇总技能调用记录，省去在日志里逐条搜索这一步，因此正在调试多技能 agent 的开发者可能选择它；但缺少用户反馈或案例，无法确认是否被长期留在工作流里。
  usage_reason_en: 'Inference: compared with digging through logs, it aggregates skill-invocation records
    inside the app and removes the step of searching log lines one by one, so developers debugging multi-skill
    agents may choose it; without user feedback or cases, it is unconfirmed whether it stays in the workflow.'
