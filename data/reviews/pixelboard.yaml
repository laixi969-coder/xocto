  market: ''
  job: Android 手机用户在需要快速记录想法或写消息时，处理自己的口述内容，要把它变成可编辑的文字，但机型或系统版本不提供该听写功能。
  job_en: An Android user who wants to quickly capture an idea or draft a message works from their own
    speech and needs it turned into editable text, but their device or OS version does not offer that
    dictation feature.
  pain: 被机型或系统版本挡在外面，只能改用第三方输入法或手动打字，语音转文字的体验和准确度不一致。
  pain_en: Being locked out by device or OS version forces them to a third-party keyboard or manual typing,
    with inconsistent dictation experience and accuracy.
  current_alternative: 现在多数人用第三方输入法自带的语音输入，或直接手动打字。
  current_alternative_en: Most people use the voice input built into a third-party keyboard, or simply
    type by hand.
  usage_reason: 推断：相较第三方输入法语音，它把系统级听写与写作能力直接搬到本机，省掉在输入法之间切换和功能受限的步骤，因此被机型限制、又习惯系统听写的用户会尝试它。
  usage_reason_en: 'Inference: versus third-party keyboard voice input, it brings system-level dictation
    and writing onto the device itself, removing the step of switching keyboards and living with limited
    features, so users blocked by device limits who prefer system dictation would try it.'
