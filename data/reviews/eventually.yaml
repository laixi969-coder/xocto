  job: 经常在 X 上收藏帖子、但事后不再回看的个人用户，需要把散落的书签整理成一份能读完的定期简报。
  job_en: Individual users who frequently bookmark posts on X but never revisit them need their scattered
    bookmarks turned into a digestible periodic newsletter.
  pain: 收藏动作成本极低，导致书签越积越多、几乎不再打开，收藏时的意图在事后完全丢失。
