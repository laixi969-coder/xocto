    behind each save is lost afterwards.
  current_alternative: 用户目前靠 X 自带书签列表、浏览器书签、稍后读工具或手动复制到笔记软件来管理，多数情况下干脆不看。
  current_alternative_en: Users currently rely on X's built-in bookmark list, browser bookmarks, read-later
    tools or manual copying into note apps, and in most cases simply never revisit them.
  usage_reason: 推断：相比自己翻书签列表，邮件简报把内容推到收件箱，省去了主动打开和筛选这一步，因此对已经习惯读邮件简报的人可能成立；但公开材料未说明筛选与摘要如何做，也没有留存或重复使用证据。
  usage_reason_en: 'Inference: compared with scrolling a bookmark list, an emailed digest pushes content
    into the inbox and removes the step of actively opening and filtering, which may work for people already
    used to reading email digests; however, public material does not explain the filtering or summarization,
    and there is no retention or repeat-use evidence.'
