  market: ''
  job: 软件工程师或 AI 应用开发者在用 agent 处理多步骤编码、调试或调研任务时，需要同时探索多条实现路径，并让每条路径保留各自的上下文。
  job_en: Software engineers or AI application developers using agents for multi-step coding, debugging
    or research need to explore several implementation paths at once while keeping each path's context
    intact.
  pain: 单线会话里一旦改方向，之前的上下文和中间结论就被覆盖或需要手工复制粘贴重建，回溯某条被放弃的路径成本高。
  pain_en: In a single-thread session, changing direction overwrites earlier context and intermediate
    conclusions or forces manual copy-paste reconstruction, making it costly to revisit an abandoned path.
  current_alternative: 在多个聊天窗口或标签页之间手工复制上下文，或把中间结论粘贴到文档里自行维护分支。
  current_alternative_en: Manually copying context across multiple chat windows or tabs, or pasting intermediate
    conclusions into documents to maintain branches by hand.
  usage_reason: 推断：相较手工复制上下文，PiX 在会话树上直接分叉并让上下文跟随分支，省去重建上下文的步骤，因此需要并行试错、又不想丢失旧路径的开发者会在多方案比较时选择它；公开材料尚无留存或复购证据。
  usage_reason_en: 'Inference: compared with manually copying context, PiX forks directly on the session
    tree and lets context follow the branch, removing the rebuild step, so developers who need parallel
    trial and error without losing old paths would choose it when comparing options; no retention or repeat-use
    evidence is public yet.'
