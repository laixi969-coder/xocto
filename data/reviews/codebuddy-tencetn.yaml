  market: ''
  job: 开发者（个人或团队）在编写、调试与交付代码时，使用腾讯 CodeBuddy 的插件、独立软件或命令行形态，让助手参与代码生成、修改与命令执行，完成从写代码到跑通流程的任务。
  job_en: A developer (individual or team) writing, debugging, and shipping code uses Tencent CodeBuddy
    as a plugin, standalone app, or CLI so the assistant participates in code generation, edits, and command
    execution, completing the path from writing code to running it.
  pain: 公开材料只有一句产品形态描述，未说明用户在编码中具体卡在哪一步、不解决会造成什么后果，也没有用户抱怨或替代行为记录，痛点强度无法从公开事实还原。
  pain_en: The public material is only a one-line description of product forms; it does not show which
    coding step users get stuck on, what happens if unsolved, or any user complaints or workaround behavior,
    so pain intensity cannot be reconstructed from public facts.
  current_alternative: 公开材料未说明用户目前用什么完成同类任务，无法确认它替代的是手动编码、其他 AI 编码助手，还是 IDE 内置补全。
  current_alternative_en: Public materials do not show what users currently use for the same job, so it
    is unclear whether it replaces manual coding, other AI coding assistants, or built-in IDE completion.
  usage_reason: 推断：三种形态覆盖编辑器、独立窗口与终端，可能让开发者在不切换工具的情况下调用同一助手；但公开材料没有用户反馈、留存或付费证据，无法说明哪类用户因哪一步负担减轻而选择它。
  usage_reason_en: 'Inference: three forms covering editor, standalone window, and terminal may let developers
    invoke the same assistant without switching tools; however, there is no public user feedback, retention,
    or payment evidence to show which users choose it because which step''s burden is reduced.'
