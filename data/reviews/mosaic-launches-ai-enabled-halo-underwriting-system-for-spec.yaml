  market: ''
  job: 保险公司核保人员在收到中小企业专业险投保单和风险资料时，需要判断是否承保、按什么条件承保，并给出核保结论。
  job_en: An insurer's underwriter receives an SME specialty insurance submission and risk documents,
    must decide whether and on what terms to accept the risk, and issue an underwriting decision.
  pain: 中小企业投保单数量多、单笔金额小，逐份人工阅读和判断耗时，核保人力难以随业务量线性扩张。
  pain_en: SME submissions are numerous and small in value, so reading and judging each one manually is
    slow and underwriting headcount cannot scale linearly with volume.
  current_alternative: 核保人员手工阅读投保资料、套用核保手册与经验规则，或依赖内部评分表和历史保单记录。
  current_alternative_en: Underwriters read submissions by hand and apply underwriting manuals, experience-based
    rules, internal scorecards and historical policy records.
  usage_reason: 推断：相较人工逐份阅读，Halo 由系统先完成资料解析与风险识别，核保人员只需复核结论，减少的是逐项阅读和初判这一步；对单量大、条款标准的中小企业险种团队更有吸引力。公开材料未披露实际使用与留存数据。
  usage_reason_en: 'Inference: compared with reading each submission manually, Halo has the system parse
    documents and identify risk first so underwriters only review the conclusion, removing the line-by-line
    reading and first-pass judgement step; this appeals to teams handling high-volume, standard-clause
    SME lines. Public materials disclose no actual usage or retention data.'
