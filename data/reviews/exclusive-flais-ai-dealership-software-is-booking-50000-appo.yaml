  market: ''
  job: 汽车经销商的服务顾问或销售顾问在客户来电、短信或线上询价时，需要把车型、保养周期和库存信息转成确定的到店或服务预约时间。
  job_en: A dealership service advisor or sales consultant handling inbound calls, texts or online inquiries
    must turn vehicle, service-interval and inventory details into a confirmed on-site or service appointment.
  pain: 经销商长期面临来电漏接、回复慢和跟进断档，客户在比价阶段流失；预约这一步没做成，后面的维修和成交都不存在。
  pain_en: Dealerships chronically miss calls, reply slowly and drop follow-ups, losing customers during
    comparison shopping; if the appointment step fails, neither the repair nor the sale happens.
  current_alternative: 旧做法是客服中心或前台人工接听、用纸质或 CRM 记录后回拨，营业时间外无人应答。
  current_alternative_en: The old way is a call center or front-desk staff answering manually, logging
    in paper or a CRM and calling back, with nobody answering outside business hours.
  usage_reason: 推断：相较人工接听加回拨，它把应答与排期合并成一次动作，省掉记录后再联系客户这一步，因此营业时间外或高峰时段的经销商更可能选择它；公开材料未给出客户案例或留存证据。
  usage_reason_en: 'Inference: versus manual answering plus callbacks, it merges response and scheduling
    into one action and removes the log-then-recontact step, so dealerships facing after-hours or peak
    demand are more likely to choose it; no customer case or retention evidence is public.'
