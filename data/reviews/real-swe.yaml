  market: ''
  job: 企业技术选型负责人在为内部私有代码库挑选编码模型时，需要把候选模型放到自家仓库的真实改造任务上跑一遍，得到可核对的通过结果，而不是只看公开榜单分数。
  job_en: An enterprise technology selection lead choosing a coding model for an internal private codebase
    needs to run candidate models on real change tasks in their own repository and get checkable pass
    results, rather than relying on public leaderboard scores.
  pain: 公开评测集与自家遗留代码差异大，选错模型意味着返工和迁移成本；把私有代码交给外部评测又有合规顾虑。
  pain_en: Public evaluation sets differ greatly from their own legacy code, so a wrong model choice means
    rework and migration cost; handing private code to an outside evaluator also raises compliance concerns.
  current_alternative: 目前多靠公开榜单分数、厂商自测报告，或内部工程师手工试跑几个任务来判断。
  current_alternative_en: Today they mostly rely on public leaderboard scores, vendor self-reported tests,
    or a few tasks hand-run by internal engineers.
  usage_reason: 推断：相较只看公开榜单，它把评测对象换成买方自己的私有仓库任务，减少“榜单高分但自家代码跑不动”这一步落差，因此有遗留系统且代码不能外发的团队会在选型阶段选择它。
  usage_reason_en: 'Inference: compared with reading public leaderboards, it swaps the evaluation target
    to the buyer''s own private repository tasks, removing the gap where a high-scoring model fails on
    their code, so teams with legacy systems and no-export code policy would use it at selection time.'
