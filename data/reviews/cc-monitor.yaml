  market: ''
  job: 开发者在本地让 Claude Code 修改代码库时，需要事后查清代理到底改了哪些文件、执行了哪些命令，以便向团队或客户交代。
  job_en: A developer letting Claude Code modify a local codebase needs to reconstruct afterwards which
    files and commands the agent touched, in order to answer to a team or client.
  pain: 编码代理自主执行命令，出错或越权后没有可追溯记录，排查和担责都无从下手。
  pain_en: Coding agents run commands autonomously; without a traceable record, debugging and accountability
    after a mistake or overreach are impossible.
  current_alternative: 靠终端滚动日志、git diff 或人工回忆来还原代理做过什么。
  current_alternative_en: Relying on scrolling terminal logs, git diff, or memory to reconstruct what
    the agent did.
  usage_reason: 推断：相较翻终端日志，它把代理的每一步操作集中记录成可查阅的审计条目，省去事后逐条翻找的负担，因此需要留痕的团队会在代理自主执行命令时选择它。
  usage_reason_en: 'Inference: compared with scrolling terminal logs, it consolidates each agent action
    into reviewable audit entries, removing the burden of reconstructing them afterwards, so teams needing
    traceability would pick it when agents execute commands autonomously.'
