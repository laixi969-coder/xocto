    results scattered in call logs that are hard to write back into systems.
  current_alternative: 目前多由客服或运营人员手工打电话、发消息给商家，或干脆放弃确认。
  current_alternative_en: Today support or operations staff usually call or message merchants by hand,
    or simply skip the confirmation.
  usage_reason: 推断：若代理能稳定接通并把确认结果结构化回传，可省去人工拨号与记录这一步，因此电话量大、结果需要入库的调度或客服团队会尝试；但公开材料未给出接通率、失败处理和客户案例，无法确认这一环是否真的成立。
  usage_reason_en: 'Inference: if the agent reliably connects and returns structured confirmations, it
