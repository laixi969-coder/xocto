  next_validation: 收集 Clarifresh 官方产品页或部署文档，核对拍摄方式、判定类别、准确率指标与人工复核流程。
  market: ''
  job: 浆果种植商或包装厂的质检人员在采收后分选线上，面对成批鲜果，需要逐批判断霉变、碰伤和成熟度并决定分级或剔除，同时记录批次质量以便对下游客户交代。
  job_en: Inspectors at berry growers or packing houses work the post-harvest sorting line, judging mould,
    bruising and ripeness batch by batch to decide grading or rejection, and recording batch quality to
    answer to downstream buyers.
  pain: 人眼翻检速度有限、标准随人和疲劳漂移，漏检的坏果到下游会变成整批退货或索赔；旺季临时工多，判断更不一致。
  pain_en: Manual inspection is slow and its standard drifts with the person and with fatigue; missed
    bad fruit becomes whole-batch returns or claims downstream, and seasonal temp staff make judgements
    even less consistent.
  current_alternative: 目前主要靠人工抽检加经验分级，辅以简单称重或尺寸设备；部分环节用抽样代替全检，坏果风险由下游承担。
  current_alternative_en: Today it is mostly manual sampling plus experience-based grading, with simple
    weight or size equipment; sampling often substitutes for full inspection, pushing the risk of bad
    fruit downstream.
  usage_reason: 推断：相较人工抽检，图像判读可以对每颗或每盘果实给出统一判定，把“逐颗翻看”这一步从人眼转移到相机与模型，减少漏检和人员标准漂移，因此旺季用工紧张、退货损失敏感的种植商和包装厂会先试用；但公开材料未给出准确率、复核流程或持续使用证据。
  usage_reason_en: 'Inference: versus manual sampling, image judgement can give a consistent decision
    per fruit or per tray, moving the ''flip through each fruit'' step from eyes to camera and model,
    reducing misses and drift between inspectors, so growers and packers facing peak-season labour shortages
    and return losses would trial it first; public material gives no accuracy, review process or repeat-use
    evidence.'
