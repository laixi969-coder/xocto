  market: ''
  job: 求职者在同时投递大量职位时，把 LinkedIn、Greenhouse、Lever 上的申请表单交给工具批量提交，以完成投递动作并跟踪进度。
  job_en: When applying to many roles at once, job seekers hand the application forms on LinkedIn, Greenhouse
    and Lever to the tool for bulk submission, completing the applications and tracking progress.
  pain: 同一份简历要在多个站点反复填写相似表单，重复劳动多、耗时长，容易漏投或错填。
  pain_en: The same resume must be re-entered into similar forms across many sites, which is repetitive
    and slow, and easy to skip or mis-fill.
  current_alternative: 现在多靠手工逐个填写，或用浏览器自动填充插件加表格清单自行管理。
  current_alternative_en: Today this is mostly manual form filling one by one, or browser autofill extensions
    plus a self-managed spreadsheet.
  usage_reason: 推断：相较手工逐个填写，它把跨站点表单提交交给代理执行，省掉重复录入这一步，因此海投阶段的求职者会试用；但公开材料未说明人工确认与结果反馈，也未显示留存或付费证据。
  usage_reason_en: 'Inference: versus filling forms by hand one by one, it delegates cross-site submission
