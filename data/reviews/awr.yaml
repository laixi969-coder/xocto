  market: ''
  job: 开发者在构建需要跨多轮、长时间运行的 AI 代理时，处理代理产生的中间状态与上下文材料，要让代理在后续步骤中继续任务而不丢失进度。
  job_en: Developers building AI agents that run across many turns and long durations handle intermediate
    state and context material so the agent can continue a task in later steps without losing progress.
  pain: 长任务代理每轮都要重新拼装上下文，状态容易丢失或重复计算，导致任务中断和成本上升。
  pain_en: Long-task agents must reassemble context each turn, so state is easily lost or recomputed,
    causing task breaks and higher cost.
  current_alternative: 开发者自行用数据库、文件或框架自带记忆模块拼接状态管理。
  current_alternative_en: Developers assemble their own state management using databases, files, or built-in
    memory modules of frameworks.
  usage_reason: 推断：若它能把状态持久化与最小上下文作为独立动作交给代理调用，可省去开发者自己维护状态读写这一步；但公开材料未说明具体机制与交付结果，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if it hands persistent state and minimal context to the agent as a separate
    action, it could remove the step of developers maintaining state reads and writes themselves; however,
    public material does not describe the mechanism or delivered result, so it is not yet confirmed that
    users would choose it for this reason.'
