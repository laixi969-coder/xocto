  market: ''
  job: Mac 上的知识工作者在跨应用处理资料后，需要找回此前看过的内容，并把它整理成能交给 AI 的上下文。
  job_en: Mac knowledge workers who, after handling material across apps, need to find previously viewed
    content and turn it into context they can hand to an AI.
  pain: 上下文散落在浏览器、文档和本地应用里，手动复制粘贴既慢又容易漏，AI 因此拿不到完整背景。
  pain_en: Context is scattered across browsers, documents and local apps; manual copy-paste is slow and
    lossy, so the AI never gets the full background.
  current_alternative: 手动截图、复制粘贴、浏览器历史与笔记工具拼凑上下文。
  current_alternative_en: Manual screenshots, copy-paste, browser history and note tools stitched together.
  usage_reason: 推断：相较手动复制粘贴，它自动持续记录并整理成可检索上下文，省掉逐条翻找与粘贴这一步，因此常在同一台 Mac 上跨应用取材的人会尝试它；但公开材料未给出留存或重复使用证据。
  usage_reason_en: 'Inference: versus manual copy-paste, it continuously records and organizes searchable
    context, removing the step of hunting and pasting item by item, so people who gather material across
    apps on one Mac may try it; public material shows no retention or repeat-use evidence.'
