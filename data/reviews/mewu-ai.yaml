  market: ''
  job: Windows 上的软件开发者或技术支持人员在排查报错、撰写文档或回复工单时，截取屏幕内容（含跨屏长页面或视频帧），需要在截图上直接完成翻译、文字提取和标注，并把结果交付给同事或客户。
  job_en: A Windows-based developer or support engineer, while debugging errors, writing docs, or answering
    tickets, captures screen content (including long scrolling pages or video frames) and needs to translate,
    extract text, and annotate directly on the capture before delivering it to a colleague or customer.
  pain: 旧做法是截图后用画图或第三方编辑器手工加框加箭头，遇到外文界面还要另开翻译工具，遇到长页面要多次截图再拼接，遇到视频要逐帧截取；每一步都要在多个工具间切换并重复搬运同一份材料，且标注结果与原文位置容易错位。
  pain_en: The old way is to screenshot, then hand-draw boxes and arrows in Paint or another editor, open
    a separate translator for foreign-language UI, take multiple shots and stitch long pages, and grab
    video frames one by one; each step means switching tools and re-carrying the same material, and annotations
    easily drift out of position relative to the source.
  current_alternative: Windows 自带截图工具、Snipaste、ShareX 等截图软件，配合画图或 Photoshop 做标注，翻译和 OCR 另用独立工具，长截图靠多次截取后手工拼接。
  current_alternative_en: Built-in Windows Snipping Tool, Snipaste, or ShareX for capture, plus Paint
    or Photoshop for markup, separate tools for translation and OCR, and manual stitching of multiple
    shots for long pages.
  usage_reason: 推断：相较旧做法，它把翻译、OCR、长截图拼接和标注合并到截图后的同一原位界面，用户不必再把图片导出到第二个编辑器或翻译工具，减少的是“截图—切工具—再搬运”这一步；因此经常处理外文界面或长文档、又需要把标注结果直接发给别人的
    Windows 用户，会在这种场景下选择它。
  usage_reason_en: 'Inference: versus the old workflow, it merges translation, OCR, scrolling capture,
    and annotation into the same in-place surface right after capture, so users no longer export the image
    into a second editor or translator, removing the ''capture—switch tool—re-carry'' step; Windows users
    who frequently handle foreign-language UI or long documents and need to send annotated results onward
    would choose it in that situation.'
