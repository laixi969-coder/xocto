  pain: 旧流程要把截图先存成文件，再分别丢进翻译工具、OCR 工具、长图拼接工具和画图软件，多步往返且标注与原文分离；外文界面和滚动页面尤其难一次说清，沟通成本落在反复截图和口头解释上。
  pain_en: The old flow saves a screenshot to disk, then shuttles it through separate translation, OCR,
    stitching, and drawing tools; annotations end up detached from the source text, and foreign-language
    or scrolling pages are especially hard to explain in one pass, pushing cost into repeated captures
    and verbal clarification.
