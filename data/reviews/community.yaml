  market: ''
  job: 使用 Obsidian 管理笔记的人，在整理含表格的笔记时，需要把一张 Markdown 表格的行列方向调换，得到可直接粘贴使用的转置表格。
  job_en: People managing notes in Obsidian who, while tidying notes containing tables, need to swap the
    rows and columns of a Markdown table to get a transposed table ready to paste.
  pain: Markdown 表格本身不支持转置，手工逐格搬动既慢又容易错位，属于高频但琐碎的负担。
  pain_en: Markdown tables do not support transposition, and moving cells by hand is slow and error-prone,
    a frequent but trivial burden.
  current_alternative: 此前用户要么手工重排单元格，要么把表格贴进电子表格转置后再转回 Markdown。
  current_alternative_en: Previously users either rearranged cells by hand or pasted the table into a
    spreadsheet, transposed it, and converted it back to Markdown.
  usage_reason: 相比手工重排或绕道电子表格，该插件在笔记内直接对选中表格执行一次转置动作，省掉导出、转换、再粘回的三步，因此常写含表格笔记的 Obsidian 用户会在遇到方向错误时选择它；这是基于功能与旧流程的推断，尚无留存或复购证据。
  usage_reason_en: Compared with manual rearrangement or a spreadsheet detour, the plugin performs one
    transposition action on the selected table inside the note, removing the export-convert-paste-back
    steps, so Obsidian users who write table-heavy notes would choose it when orientation is wrong; this
    is inference from capability and the old workflow, with no retention or repeat-use evidence yet.
