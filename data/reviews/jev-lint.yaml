  market: ''
  job: 开发团队在提交代码或做代码审查时，需要把团队规范变成可自动执行的检查，处理的是待合并的代码变更。
  job_en: Development teams need to turn team conventions into automatically executable checks when committing
    code or reviewing pull requests, working on pending code changes.
  pain: 现有 linter 只能表达语法和模式类规则，语义类规范（命名意图、业务约束）只能靠评审人口头提醒，容易漏掉且无法沉淀。
  pain_en: Existing linters only express syntax and pattern rules; semantic conventions such as naming
    intent and business constraints rely on reviewers' verbal reminders, which are easily missed and never
    captured.
  current_alternative: 写正则或自定义 AST 规则、在评审里人工提醒、把规范写在文档里靠自觉遵守。
  current_alternative_en: Writing regex or custom AST rules, reminding people manually in review, or documenting
    conventions and relying on self-discipline.
  usage_reason: 推断：若自然语言规则能被模型稳定执行，团队可省去为每条语义规范编写和维护自定义规则这一步，从而让不写代码的规范制定者也能直接添加检查；但公开材料未给出误报率、支持语言或集成方式，无法确认这一步负担是否真的被减少。
  usage_reason_en: 'Inference: if plain-English rules are executed reliably by a model, teams could skip
    writing and maintaining custom rules for each semantic convention, letting non-coding rule owners
    add checks directly; however, public material gives no false-positive rate, language support or integration
    path, so the reduction in effort cannot be confirmed.'
