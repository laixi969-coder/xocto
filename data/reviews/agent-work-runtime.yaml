  market: ''
  job: AI 应用后端开发者或 agent 平台工程师在构建需要长时间运行的 agent 时，把 agent 的运行状态与上下文材料交给该运行时，由它保存持久工作状态并只保留最小上下文，让长任务中断后能接着跑。
  job_en: AI application backend developers or agent platform engineers building long-running agents hand
    the agent's runtime state and context material to this runtime, which persists work state and keeps
    only minimal context so long tasks can resume after interruption.
  pain: 长任务 agent 一旦进程中断或上下文超限，开发者要自己维护会话状态、裁剪上下文并实现恢复逻辑，否则任务从头重跑，浪费 token 与时间；这是构建长时 agent 的结构性负担。
  pain_en: When a long-running agent's process is interrupted or context overflows, developers must maintain
    session state, trim context, and implement recovery themselves; otherwise the task restarts from scratch,
    wasting tokens and time. This is a structural burden of building long-running agents.
  current_alternative: 开发者自行在应用层维护会话状态、上下文裁剪与中断恢复，或依赖 agent 框架自带的记忆与状态组件。
  current_alternative_en: Developers maintain session state, context trimming, and interruption recovery
    in their own application layer, or rely on memory and state components bundled with agent frameworks.
  usage_reason: 推断：相较自行在应用层维护状态与恢复逻辑，它把持久工作状态与最小上下文作为运行时能力直接提供，减少开发者自己实现状态保存与上下文裁剪这一步；需要跑长任务、又不想自建恢复机制的
    agent 后端开发者会在这种情况下选择它。
  usage_reason_en: 'Inference: versus maintaining state and recovery logic in the application layer, it
    provides persistent work state and minimal context as runtime capabilities, removing the step of implementing
    state persistence and context trimming; backend agent developers running long tasks who don''t want
    to build recovery themselves would choose it in that situation.'
