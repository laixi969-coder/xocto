  market: ''
  job: 个人知识工作者在需要回答一个具体问题时，面对散落在多个笔记和文档工具里的材料，要快速找到相关段落并知道答案出自哪里。
  job_en: An individual knowledge worker answering a specific question across material scattered in several
    note and document tools needs to find the relevant passages quickly and know where the answer came
    from.
  pain: 旧做法要么靠关键词在多个工具里反复搜，要么把整份文档贴进对话模型，结果没有出处、无法核对，也容易漏掉只出现在某一节里的内容。
  pain_en: The old way is repeated keyword search across several tools, or pasting whole documents into
    a chat model, which yields no traceable source, is hard to verify, and misses content that appears
    in only one section.
  current_alternative: 手动在多个笔记应用里搜索、把文档整段复制进通用对话模型，或自己搭一套检索脚本。
  current_alternative_en: Manual search across several note apps, pasting whole documents into a general
    chat model, or hand-rolling a retrieval script.
  usage_reason: 推断：相较整篇粘贴进对话模型，它先做向量加 BM25 混合检索并定位到章节，再返回带引用的答案，省掉用户自己翻找和核对出处的那一步，因此需要给出处、又不想自建检索的个人或小团队会先试它。
  usage_reason_en: 'Inference: compared with pasting whole documents into a chat model, it first runs
    hybrid vector plus BM25 retrieval down to the section and then returns cited answers, removing the
    step where the user hunts for and verifies the source, so individuals or small teams that need citations
    without building retrieval themselves would try it first.'
