  market: ''
  job: 开发者和 AI 客户端重度用户在 Windows 上使用终端、ChatGPT/Claude 桌面或商店版等程序时，需要让其中某几个程序走指定上游代理，同时保持其他程序直连。
  job_en: Developers and heavy AI-client users on Windows need to route only selected programs, such as
    terminals or the desktop/Store builds of ChatGPT and Claude, through a chosen upstream proxy while
    other apps stay direct.
  pain: 全局或 TUN 模式要装虚拟网卡、容易搞乱本地网络；老牌 Proxifier 需要手写规则并逐个抓取多进程软件的子进程，配置成本高。
  pain_en: Global or TUN modes require a virtual adapter and often break local networking, while established
    tools like Proxifier demand hand-written rules and manual child-process capture for multi-process
    apps.
  current_alternative: 使用系统全局代理/TUN 模式，或使用 Proxifier 等按规则配置的老牌工具，也有人干脆放弃让这些程序走代理。
  current_alternative_en: Using system-wide proxy or TUN mode, configuring rule-based legacy tools such
    as Proxifier, or simply giving up on proxying those programs.
  usage_reason: 推断：相较手写规则和抓 PID，它把“拖入图标即接管、自动跟随子进程、不装驱动不改路由”作为具体动作，省掉了查进程和逐条配规则这一步，因此怕弄乱本地网络、又只想让个别 AI
    客户端走代理的 Windows 用户会优先试它。
  usage_reason_en: 'Inference: instead of writing rules and hunting PIDs, it makes drag-in takeover, automatic
    child-process following and driver-free, route-free operation the concrete steps, removing the process-hunting
    and rule-writing burden, so Windows users who fear breaking local networking but want only a few AI
    clients proxied are likely to try it first.'
