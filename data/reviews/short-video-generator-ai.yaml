  market: ''
  job: 内容创作者或短视频运营者手上有一条已发布的 YouTube 长视频（访谈、播客、课程、直播回放），需要在发布后短时间内把它切成多条带字幕、可翻译配音的竖屏短视频，投放到 TikTok、Reels、Shorts
    等平台以获取二次分发流量。
  job_en: A content creator or short-video operator holds an already-published long YouTube video (interview,
    podcast, course, livestream replay) and needs to cut it into multiple vertical short clips with subtitles
    and translated voiceover within a short window after release, to redistribute on TikTok, Reels and
    Shorts for secondary reach.
  pain: 长视频转短视频的旧流程要人工通看全片找高光点、手动切条、逐条打轴字幕、再另找工具翻译配音，一条长视频产出多条短片往往要数小时到一天，且高光点判断依赖个人经验，漏掉爆点或节奏拖沓会直接影响二次分发效果；不做这件事则长视频只能吃一次流量。
  pain_en: The legacy workflow requires watching the whole long video to find highlights, cutting clips
    manually, timing subtitles clip by clip, then using separate tools for translation and voiceover;
    producing several shorts from one long video often takes hours to a day, highlight selection depends
    on personal judgement, and skipping the work means the long video only captures traffic once.
  current_alternative: 当前替代方式是人工剪辑软件（Premiere、剪映、CapCut）逐条切条加字幕，或使用 Opus Clip、Vizard、Submagic 等商业 SaaS
    自动切片，再叠加单独的翻译/配音工具；开源侧则自行拼装 Whisper 转写加脚本。
  current_alternative_en: Today users either cut and subtitle clip by clip in Premiere, CapCut or Jianying,
    or use commercial SaaS such as Opus Clip, Vizard and Submagic for auto-clipping, then bolt on separate
    translation/voiceover tools; on the open-source side they assemble Whisper transcription plus custom
    scripts.
  usage_reason: 推断：相较人工逐条剪辑，该开源项目把高光检测、字幕、翻译、配音串成一条流水线，用户只需提供 YouTube 链接即可拿到多条成片，省掉通看全片找高光、逐条打轴和跨工具搬运三步；相较商业
    SaaS，它免费且可自托管，因此预算敏感、愿意自行部署的独立创作者和小团队会在批量产出多语言短片时选择它。
  usage_reason_en: 'Inference: versus manual clip-by-clip editing, this open-source project chains highlight
    detection, subtitles, translation and voiceover into one pipeline, so the user supplies a YouTube
    link and gets multiple finished clips, removing the steps of watching the full video for highlights,
    timing each subtitle and moving files across tools; versus commercial SaaS it is free and self-hostable,
    so budget-sensitive independent creators and small teams willing to deploy it themselve'
