    currently lose control or what it costs them.
  current_alternative: 公开材料未说明开发者此前如何组织多步改动，可能是手工拆分提示词或直接单轮对话，均未在候选资料中出现。
  current_alternative_en: The public material does not say how developers previously organized multi-step
    changes, possibly manually splitting prompts or using single-turn chat; neither appears in the candidate
    data.
  usage_reason: 无法给出因果解释：材料没有说明相较手工拆分提示词，它减少了哪一步或改善了哪项可核对结果，因此无法判断谁会在什么情况下选择它。
