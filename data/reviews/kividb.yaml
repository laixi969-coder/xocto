  market: ''
  job: AI 应用开发者在已有 Redis 缓存之外还要维护向量检索时，需要把两类存储合并到一套兼容接口里，完成低延迟读写。
  job_en: AI application developers who must maintain vector retrieval alongside an existing Redis cache
    need to merge both into one compatible interface for low-latency reads and writes.
  pain: 同时维护缓存和向量库意味着两套部署、两份数据同步和两处故障点，延迟与一致性都要分别调优。
