  current_alternative_en: Developers use a single frontier model for the whole coding task, or manually
    switch between models; the candidate material provides no user-stated alternative.
  usage_reason: 推断：如果它能把规划与写码的交接自动化，开发者就不必手动在两个模型间搬运上下文，从而省下这一步操作并压低单次任务成本；但公开材料未证明交接是自动的，也未给出成本对比。
  usage_reason_en: 'Inference: if it automates the handoff between planning and code writing, developers
