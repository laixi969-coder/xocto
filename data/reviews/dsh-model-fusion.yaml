  market: ''
  job: 使用 DeepSeek Harness 的开发者在一个具体编码任务中，把工作拆成两段：由前沿模型读需求、出计划并审查产出，由更便宜的模型按计划写代码，最终交付可用的代码改动，同时把单次任务的模型调用成本压下来。
  job_en: 'A developer using DeepSeek Harness splits one coding task: a frontier model reads the requirement,
    produces the plan and reviews output, while a cheaper model writes the code, delivering a usable code
    change while holding down per-task model spend.'
  pain: 公开材料只给出定位句，未提供用户抱怨或案例；从工作流结构推理，痛点是前沿模型按 token 计费，让它在整个编码任务里持续生成代码会显著抬高单次任务开销，而全部改用便宜模型又会在规划与审查环节掉质量，用户被迫在成本与结果之间二选一。
  pain_en: Public materials give only the positioning line, with no user complaints or cases; by workflow
    inference, the pain is that frontier models bill per token, so letting one generate code throughout
    a task inflates per-task spend, while switching entirely to a cheap model degrades planning and review,
    forcing a cost-versus-quality trade-off.
  current_alternative: 旧做法是整条任务都用同一个前沿模型（成本高），或整条任务都用便宜模型（规划与审查质量下降），或手工在多个模型界面之间复制粘贴上下文来分工。
  current_alternative_en: The old approach is running the whole task on one frontier model (expensive),
    running everything on a cheap model (weaker planning and review), or manually copying context between
    model interfaces to split the roles.
  usage_reason: 推断：相较手工在两个模型间搬运上下文，该方案在 Harness 内把 Lead 与 Sidekick 的角色分工固化为一次配置，用户不必为每个任务重复粘贴计划与代码，且便宜模型承担
    token 消耗最大的写码环节，因此在意单次任务账单、又不想牺牲规划与审查质量的 Harness 用户会在中长编码任务中选择它。
  usage_reason_en: 'Inference: versus manually shuttling context between two models, this fixes the Lead/Sidekick
    split as a one-time configuration inside Harness, so users need not re-paste plans and code per task,
    and the cheap model absorbs the token-heavy writing step; Harness users watching per-task bills without
    giving up planning and review quality would pick it for medium-to-long coding tasks.'
