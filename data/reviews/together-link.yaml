  market: ''
  job: 开发者在自建 agent 或编码工具链里接入开源模型时，需要把模型调用接进现有运行框架并跑通一次完整任务。
  job_en: Developers wiring open models into a self-built agent or coding harness need to connect model
    calls into the existing runtime and complete a full task.
  pain: 公开材料只有一句接入说明，没有说明开发者在哪一步被卡住、现有做法要花多少时间，也没有用户抱怨或替代行为记录。
  pain_en: The public material is a single line about integration; it does not say where developers get
    stuck, how long the current approach takes, and there is no record of user complaints or substitute
    behaviour.
  current_alternative: 旧做法通常是直接调用模型厂商 API 或自行写适配代码；候选材料未给出与这些做法的对比。
  current_alternative_en: The old approach is usually calling a model vendor API directly or writing adapter
    code by hand; the candidate material gives no comparison with these approaches.
  usage_reason: 推断：如果它能把多家开源模型的接入步骤收敛成一次配置，开发者会在需要快速切换模型、又不想重写调用层时选择它；但缺少采用、留存或付费证据，无法确认这一选择已经发生。
  usage_reason_en: 'Inference: if it collapses the integration steps for several open models into one
    configuration, developers would choose it when they need to switch models quickly without rewriting
    the call layer; but adoption, retention or payment evidence is missing, so this choice cannot be confirmed
    as happening.'
