  pain_en: AI coding assistants tend to look only at the lines they wrote, missing callers, edge cases,
    and same-class defects; merging directly lets bugs recur as a class, leaving rework and production
    risk with the committer.
  current_alternative: 当前替代是工程师自己逐行复查 AI 输出、依赖通用 code review 或 CI 检查，缺少把“先问影响范围、由他人复核、给出完成证据”固化成提交前流程的机制。
  current_alternative_en: The current alternative is engineers manually re-reading AI output, relying
    on generic code review or CI checks, with no mechanism that fixes 'ask about blast radius, review
    by another party, show proof of done' into a pre-commit routine.
  usage_reason: 推断：相较逐行自查，它把十个影响范围问题、独立审查角色和完成证据作为提交前的固定动作，减少工程师自己回忆“还有哪些调用方没看”的负担，因此在意 AI 改动回归风险的 Claude
    Code 用户会在提交前采用它。
  usage_reason_en: 'Inference: versus line-by-line self-review, it makes ten blast-radius questions, an
    independent reviewer role, and proof of done fixed pre-commit actions, reducing the burden of recalling
    which callers were unchecked, so Claude Code users worried about AI-change regressions would adopt
    it before committing.'
