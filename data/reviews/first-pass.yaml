  market: ''
  job: 使用 Claude Code 等编码代理的软件工程师，在把一次改动提交合并之前，需要处理模型生成的代码差异，判断这次改动会影响哪些模块、有没有遗漏，并留下可复核的完成依据。
  job_en: 'Software engineers using coding agents such as Claude Code need to handle the model-generated
    diff before merging a change: judge which modules the edit touches, whether anything was missed, and
    leave reviewable proof of completion.'
  pain: 代理写代码很快，但改动范围常常超出预期，审查者只能看到被写出的那几行，容易漏掉连带影响；不解决就要在合并后返工或线上排障。
  pain_en: Agents write code fast, but the blast radius often exceeds expectations and reviewers only
    see the lines that were written, so knock-on effects get missed; unresolved, this means rework after
    merge or firefighting in production.
  current_alternative: 靠人工代码评审、口头约定或团队自写的提示词与检查清单，规则散落在个人习惯里，无法稳定复现。
  current_alternative_en: Manual code review, verbal conventions, or team-written prompts and checklists,
    with rules scattered across individual habits and no stable reproduction.
  usage_reason: 相较人工评审只看差异行，这套规则把“先问十个影响范围问题、由未写代码的一方复核、给出完成证据”固化成提交前的固定动作，减少审查者自己重建上下文这一步；推断，受监管行业或外包交付团队在需要留档时更可能选择它。
  usage_reason_en: Compared with manual review that only reads the diff, this rule set fixes 'ask ten
    blast-radius questions, have a non-author review, show proof of done' into a pre-commit routine, removing
    the step where a reviewer rebuilds context; this is inference, and regulated-industry or outsourced
    delivery teams needing an audit trail are the likeliest adopters.
