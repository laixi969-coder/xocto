  market: ''
  job: 使用 Claude Code 写代码的工程师，在提交改动前把这次 diff 交给这套规则集，让模型先回答十个关于改动影响范围的问题，再由未参与编写的审查角色复核，并给出完成证据后才结束，最终由人确认是否合并。
  job_en: 'An engineer using Claude Code hands the pending diff to this rule set before committing: the
    model answers ten questions about the change''s blast radius, a reviewer that did not write the code
    re-checks it, and completion evidence is required before the task is closed, with the human still
    confirming the merge.'
  pain: AI 生成的改动只盯着自己写的几行，容易漏掉调用方、边界条件和同类缺陷；工程师要事后自己补查影响面、逐条复现，返工和漏改的代价落在提交前这一段。
  pain_en: AI-generated changes look only at the lines written, missing callers, edge cases, and same-class
    defects; engineers must reconstruct the blast radius and reproduce issues afterward, so rework and
    missed fixes land right before commit.
  current_alternative: 靠工程师自己在提交前人工通读 diff、凭经验追问影响范围，或依赖通用 code review 提示词和 CI 静态检查；这些做法不强制先回答影响范围问题，也不强制由未参与编写的角色复核。
  current_alternative_en: Engineers manually read the diff before commit, ask about blast radius from
    experience, or rely on generic code-review prompts and CI static checks; none of these force the ten
    blast-radius questions or a reviewer that did not write the code.
  usage_reason: 推断：相较人工通读 diff 或通用提示词，它把“先问影响范围、再由未参与编写的角色复核、给出完成证据”固化成提交前的固定动作，减少工程师自己补查影响面和逐条复现这一步负担；因此会在使用
    Claude Code 且改动涉及多文件调用链时选择它。
  usage_reason_en: 'Inference: versus manually reading the diff or generic prompts, it hard-codes the
    blast-radius questions, an independent reviewer, and completion evidence into a fixed pre-commit step,
    removing the engineer''s burden of reconstructing impact and reproducing issues; users would pick
    it when working with Claude Code on changes that span multiple files and call chains.'
