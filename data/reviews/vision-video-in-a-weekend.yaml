  market: ''
  job: 产品经理或创业者在需要向投资人、客户或团队传达尚未上线的产品愿景时，手头只有文字方案和产品截图，要在周末内产出一支 2-3 分钟、含旁白与画面的愿景视频，用于路演或内部对齐。
  job_en: A product manager or founder who must pitch an unbuilt product vision to investors, customers,
    or the team, holding only a written plan and screenshots, needs to produce a 2-3 minute narrated vision
    video within a weekend for a pitch or internal alignment.
  pain: 公开材料显示旧流程需要拍摄、剪辑软件与设计能力，而目标用户通常不具备这些技能；外包或专业制作周期长、成本高，导致愿景视频常被推迟或干脆不做，路演只能靠文字与静态图。
  pain_en: Public materials state the old path requires filming, an editing suite, and design skills that
    the target user typically lacks; outsourcing or professional production is slow and costly, so vision
    videos get postponed or skipped and pitches fall back on text and static slides.
  current_alternative: 当前替代方式是自行拍摄加剪辑软件、外包给视频制作方，或干脆不做视频只用 PPT 与文字方案；仓库把 PASTOR 叙事框架、ElevenLabs 配音、HeyGen
    数字人、Remotion 模板与提示词库串成一条可复制的流程。
  current_alternative_en: The current alternatives are self-filming with an editing suite, outsourcing
    to a video producer, or skipping video entirely and relying on slides and text; the repository chains
    the PASTOR narrative framework, ElevenLabs voice, HeyGen avatars, a Remotion template, and prompt
    libraries into one repeatable pipeline.
  usage_reason: 推断：相较自行拍摄剪辑或外包，它把任务拆成写 PASTOR 脚本、生成配音、生成数字人画面、套 Remotion 模板渲染四步，用户无需摄影与剪辑技能即可在周末内交付成片，因此缺少制作资源但需要快速产出愿景视频的产品经理与创业者会在路演或内部对齐前选择它。
  usage_reason_en: 'Inference: versus self-filming/editing or outsourcing, it splits the job into writing
    a PASTOR script, generating voiceover, generating avatar footage, and rendering through a Remotion
    template, so users without filming or editing skills can deliver a finished video in a weekend; product
    managers and founders lacking production resources but needing a fast vision video would pick it before
    a pitch or alignment meeting.'
