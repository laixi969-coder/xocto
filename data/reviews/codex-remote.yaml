    and cloud environments drift apart, forcing manual syncing.
  current_alternative: 自己开一台云主机、手工装环境、用 SSH 或 tmux 挂着跑，再手动把改动拉回本地。
  current_alternative_en: Spinning up a cloud VM by hand, installing the environment, keeping the run
