  market: ''
  job: 使用AI编码代理的开发者或技术写作者，在需要为项目产出结构统一、排版接近Notion的说明文档时，处理已有的草稿或代码上下文，要完成一份格式合规的文档。
  job_en: Developers or technical writers using AI coding agents who need a structurally consistent, Notion-like
    document for a project, working from existing drafts or code context to produce a format-compliant
    document.
  pain: 代理生成的文档格式每次都不一样，需要人工反复调整标题层级、样式和排版，格式返工占用了本可用于内容校对的时间。
  pain_en: Agent-generated documents vary in format each time, forcing manual rework of heading levels,
    styles and layout, and that formatting rework eats time that could go to content review.
  current_alternative: 旧做法是让代理自由生成后人工在编辑器里逐段调整格式，或事先在提示词里反复粘贴格式要求，也有人直接套用现成的文档模板手工改写。
  current_alternative_en: The old approach is to let the agent generate freely and then manually fix formatting
    paragraph by paragraph, or to repeatedly paste formatting instructions into the prompt, or to adapt
    an existing document template by hand.
  usage_reason: 推断：相较每次在提示词里重复格式要求，这个技能包把文档骨架和视觉样式固定下来，减少的是逐段调格式这一步，因此经常产出同类文档、且对格式一致性有要求的开发者会尝试它；但目前没有用户反馈或采用数据支持这一判断。
  usage_reason_en: 'Inference: compared with repeating formatting instructions in every prompt, this skill
    package fixes the document skeleton and visual style, removing the step of adjusting format paragraph
    by paragraph, so developers who produce similar documents often and care about format consistency
    may try it; there is currently no user feedback or adoption data supporting this.'
