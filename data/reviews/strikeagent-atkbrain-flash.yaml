  market: ''
  job: 红队渗透测试工程师或安全研究员在拿到授权目标（域名、IP 段、Web 资产）后，需要在有限时间内完成资产打点、漏洞发现与攻击路径验证，并整理成可交付的渗透测试报告或 SRC/CTF 提交材料。
  job_en: A red-team penetration tester or security researcher, given authorized targets (domains, IP
    ranges, web assets), must complete asset enumeration, vulnerability discovery and attack-path validation
    within a limited window, then produce a deliverable pentest report or SRC/CTF submission.
  pain: 公开材料只说明该平台覆盖红队打点、SRC 与 CTF，未提供用户抱怨或案例；从工作流结构推理，打点与信息收集高度重复、依赖人工经验，漏测和重复劳动会直接影响报告完整性与交付周期，这是渗透测试岗位的固有负担。
  pain_en: Public materials only state the platform covers red-team enumeration, SRC and CTF, with no
    user complaints or cases; by workflow inference, enumeration and recon are highly repetitive and experience-dependent,
    and missed findings or duplicated effort directly hurt report completeness and delivery timelines
    — an inherent burden of the pentest role.
  current_alternative: 公开材料未说明现有替代方式；按行业工作流推断，当前做法是人工组合 Nmap、子域枚举、目录爆破、漏洞扫描器与自写脚本，再手工汇总结果。
  current_alternative_en: Public materials do not describe current alternatives; by industry workflow
    inference, practitioners today manually chain Nmap, subdomain enumeration, directory brute-forcing,
    vulnerability scanners and self-written scripts, then hand-aggregate results.
  usage_reason: 推断：相较人工串联扫描器与脚本，该产品把目标信息输入后的打点、扫描与攻击模拟收敛到一个 AI 流程并直接产出报告，减少的是工具切换与结果手工汇总这两步负担；因此会在授权测试时间紧、需要快速覆盖资产面的红队或
    SRC 场景中被选择。公开材料尚无用户反馈证实这一动机。
  usage_reason_en: 'Inference: versus manually chaining scanners and scripts, the product collapses enumeration,
    scanning and attack simulation after target input into one AI flow that emits a report, removing tool-switching
    and manual result aggregation; it would therefore be chosen in time-pressured authorized red-team
    or SRC engagements needing fast asset coverage. Public materials do not yet confirm this motive via
    user feedback.'
