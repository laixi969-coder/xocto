  market: ''
  job: 开发者需要同时运行和管理多个 Coding Agent 会话，以完成不同项目的编码任务。
  job_en: Developers need to run and manage multiple coding agent sessions simultaneously to complete
    coding tasks across different projects.
  pain: 在多个终端窗口间切换，难以追踪每个任务的状态和会话历史，输入多行 Prompt 不便。
  pain_en: Switching between multiple terminal windows makes it hard to track task status and session
    history, and entering multi-line prompts is cumbersome.
  current_alternative: 目前开发者使用多个独立终端窗口，分别运行不同的 Coding Agent，手动切换和记录。
  current_alternative_en: Currently developers use separate terminal windows for each coding agent, manually
    switching and keeping track.
  usage_reason: CoDock 提供统一界面，减少切换成本，集中管理会话，可能提高开发效率。
  usage_reason_en: CoDock offers a unified interface, reducing switching costs and centralizing session
    management, potentially improving development efficiency.
