    maintain agent configuration by hand, how long it takes, or what failure costs, so pain intensity
    cannot be judged.
  current_alternative: 推断为团队各自维护提示词与规则文件、靠文档或口头传递，但公开材料未描述任何现有替代行为。
  current_alternative_en: Inferred as each member maintaining their own prompts and rule files, passed
    along via docs or word of mouth, but no existing alternative behaviour is described in the public
    material.
  usage_reason: 无法说明相较旧做法减少了哪一步负担，因为公开材料未交代输入、动作与交付；仅凭一句定位不足以判断用户为何选择它。
