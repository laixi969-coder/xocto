  market: ''
  job: 业余棋手或教练在赛后拿到棋局记录，需要逐手判断哪一步走坏、为什么走坏，并整理成可复用的复盘材料。
  job_en: An amateur player or coach takes a game record after a match and needs to judge move by move
    which step went wrong and why, then turn it into reusable review material.
  pain: 人工复盘依赖棋力更高的对手或教练，逐手分析耗时，业余棋手常常只能看到引擎给出的分数而不知道错在哪里。
  pain_en: Manual review depends on a stronger opponent or coach, move-by-move analysis is time-consuming,
    and amateurs often see only an engine score without knowing what went wrong.
  current_alternative: 用国际象棋引擎看评分变化，或在论坛、棋社请人点评，再自己写复盘笔记。
  current_alternative_en: Checking engine score changes, asking for comments in forums or clubs, then
    writing review notes by hand.
  usage_reason: 推断：如果该技能能把棋局记录直接转成逐手解释，棋手就省去自己对照引擎分数反推原因这一步；但公开材料只有一句功能描述，没有说明输入、输出和是否保留人工确认，因此无法确认它比现有引擎加人工点评的做法更省事。
  usage_reason_en: 'Inference: if the skill turns a game record directly into move-by-move explanations,
    players skip the step of reverse-engineering reasons from engine scores; but the public material is
