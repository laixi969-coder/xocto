  market: ''
  job: 软件工程师或技术负责人在接手或维护既有代码库时，处理遗留模块与重构候选代码，要完成的任务是找出哪些复杂度属于意外引入、证明删除后行为不变，并据此产出可执行的重构改动。
  job_en: A software engineer or tech lead inheriting or maintaining an existing codebase works on legacy
    modules and refactoring candidates, with the task of identifying which complexity is accidental, proving
    behavior is preserved after removal, and producing executable refactoring changes.
  pain: 公开材料只给出仓库定位句，未提供用户抱怨或案例；从工作流结构推理，意外复杂度会让阅读、修改和评审成本持续累积，而人工判断哪些代码可删既慢又难证明不破坏行为，重构回归风险高。
  pain_en: Public material only provides the repository positioning statement, with no user complaints
    or cases; by workflow inference, accidental complexity keeps raising read, change and review costs,
    while manually judging what can be deleted is slow and hard to prove behavior-safe, making refactoring
    regressions risky.
  current_alternative: 旧做法是人工代码审查、静态分析或 lint 工具、以及凭经验做重构，这些手段能提示坏味道但通常不给出“删除后行为不变”的证明，验证仍靠测试与人工复核。
  current_alternative_en: The old approach is manual code review, static analysis or lint tooling, and
    experience-driven refactoring; these flag smells but usually do not prove that behavior is unchanged
    after deletion, so verification still falls back on tests and human review.
  usage_reason: 推断：相较人工审查加静态分析，它把“证明可简化”作为交付物，若真能对候选改动给出行为不变的证据，工程师就不必逐处手工论证删除安全性，从而在接手陌生代码库或做大规模清理时选择它；但公开材料未显示实际使用反馈，采用动机仍属推断。
  usage_reason_en: 'Inference: versus manual review plus static analysis, it treats a proof of safe simplification
    as the deliverable; if it really evidences behavior preservation for candidate changes, engineers
    avoid arguing deletion safety by hand, so they would pick it when inheriting unfamiliar code or doing
    large cleanups. Public material shows no actual usage feedback, so the adoption motive remains inferred.'
