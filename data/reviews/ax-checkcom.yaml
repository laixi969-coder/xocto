  job_en: A website or product owner uses their own product page after launch or redesign to check whether
    AI agents can recognize it and complete operations.
  pain: 如果代理无法识别或操作产品，代理带来的流量与任务会直接失败，但公开材料没有说明这一失败的具体后果与频率。
