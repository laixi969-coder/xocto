  current_alternative: 目前多靠人工用浏览器或脚本模拟代理访问，逐页排查，缺少统一检查方式。
  current_alternative_en: Today this is mostly done manually by simulating agent visits with browsers
    or scripts, page by page, without a unified check.
  usage_reason: 推断：若它能把代理访问失败的页面与原因一次性列出，用户可省去逐页人工模拟这一步；但公开材料未说明检测方式与输出，无法确认这一因果。
  usage_reason_en: 'Inference: if it lists failing pages and causes in one pass, users could skip manual
    page-by-page simulation; however, public material does not describe the detection method or output,
    so this causal link is unconfirmed.'
