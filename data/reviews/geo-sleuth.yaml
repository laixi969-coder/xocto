  market: ''
  job: 调查记者或情报分析人员在核实一张来源不明照片时，需要把照片与地图、地形、卫星和街景材料交叉比对，得出可复核的拍摄地点。
  job_en: An investigative journalist or intelligence analyst verifying a photo of unknown origin needs
    to cross-check it against maps, terrain, satellite and street-view material to reach a reviewable
    shooting location.
  pain: 过去这类比对靠人工在多个地图工具间来回切换、凭经验判断天际线和地标，耗时长且结论难以向编辑或客户交代推理过程。
  pain_en: This comparison used to mean manually switching among map tools and judging skylines and landmarks
    by experience, which is slow and hard to justify to an editor or client.
  current_alternative: 人工使用谷歌地图、OpenStreetMap、街景和地形图逐项比对，或在论坛里请人帮忙辨认。
  current_alternative_en: Manually comparing Google Maps, OpenStreetMap, street view and terrain maps,
    or asking others on forums to identify the spot.
  usage_reason: 相较人工逐项比对，它把地图几何、海拔天际线、卫星与街景的检索串成一条可复现的 agent 流程并输出推理依据，减少的是反复切换工具和整理证据这一步负担，因此需要向他人交代结论来源的核查类用户会尝试它；这是基于产品能力的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with manual item-by-item comparison, it chains map geometry, elevation skylines,
    satellite and street-view lookups into a reproducible agent flow and outputs its reasoning, cutting
    the burden of switching tools and assembling evidence, so verification users who must justify conclusions
    may try it; this is an inference from product capability, not supported by user feedback yet.
