    against OpenStreetMap, elevation data, satellite imagery and street view to reach a reviewable probable
    shooting location with a preserved reasoning chain.
  pain: 旧做法要在多个地图、街景和地形工具之间反复切换、凭经验辨认天际线与地标，单张照片可能耗掉数小时，且结论难以向编辑、客户或法庭交代每一步依据；不解决的后果是核查结论无法采信或错过时效。
  pain_en: The old way means repeatedly switching among map, street-view and terrain tools and judging
    skylines and landmarks by experience, which can take hours per photo and is hard to justify step by
    step to an editor, client or court; the consequence is an unusable verification result or a missed
    deadline.
  current_alternative: 人工在谷歌地图、OpenStreetMap、街景、地形图和卫星影像之间逐项比对，或在 OSINT 论坛与社群里请人帮忙辨认，再手工整理证据。
  current_alternative_en: Manually comparing Google Maps, OpenStreetMap, street view, terrain maps and
    satellite imagery item by item, or asking others on OSINT forums and communities to identify the spot,
    then assembling evidence by hand.
  usage_reason: 相较人工逐项比对，它把地图几何、海拔天际线、卫星与街景检索串成一条可复现的 agent 流程并输出每一步推理依据，减少的是反复切换工具与事后整理证据这一步负担，因此需要向编辑、客户或法庭交代结论来源的核查类用户会在处理来源不明照片时选择它；这是基于产品能力与工作流结构的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with manual item-by-item comparison, it chains map geometry, elevation skylines,
    satellite and street-view lookups into a reproducible agent flow and outputs each reasoning step,
    cutting the burden of switching tools and assembling evidence afterwards, so verification users who
    must justify conclusions to an editor, client or court would choose it when handling photos of unknown
    origin; this is an inference from product capability and workflow structure, not yet supp
