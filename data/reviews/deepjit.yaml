  next_validation: 收集 DeepJIT 官方仓库的 README 与文档，确认其支持的 xPU 硬件清单、编译流程说明与已知限制。
  market: ''
  job: 在非英伟达加速卡上部署大模型推理的工程团队，在把模型搬到自己或客户的 xPU 机器时，需要处理内核代码并让它在该硬件上可执行，最终拿到能跑起来的推理服务。
  job_en: Engineering teams deploying large-model inference on non-NVIDIA accelerators, when moving a
    model onto their own or a client's xPU machines, must handle kernel code and make it executable on
    that hardware, ending with a working inference service.
  pain: 不同 xPU 的编译链和内核适配各不相同，团队往往要自己写编译流程并长期维护，换卡或升级模型就要重做一遍。
  pain_en: Compilation chains and kernel adaptation differ across xPU vendors, so teams often write and
    maintain their own compilation pipeline, redoing it whenever they change cards or upgrade models.
  current_alternative: 目前多由团队自建编译脚本、依赖厂商提供的闭源工具链，或干脆只选英伟达方案绕开适配。
  current_alternative_en: Today teams mostly build their own compilation scripts, rely on vendor closed-source
    toolchains, or simply choose NVIDIA to avoid adaptation work.
  usage_reason: 推断：相较自建编译脚本，DeepJIT 把即时编译封装成库，可能省去为每种 xPU 单独维护编译流程这一步，因此正在做国产或自研加速卡推理部署的团队会先试用它；公开材料未给出采用或留存证据。
  usage_reason_en: 'Inference: compared with self-built compilation scripts, DeepJIT packages JIT compilation
    as a library, potentially removing the step of maintaining a separate compilation pipeline per xPU,
    so teams doing domestic or in-house accelerator inference deployment would try it first; public materials
    give no adoption or retention evidence.'
