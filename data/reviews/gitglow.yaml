  market: ''
  job: 开发者在提交或合并前，处理自己写的 diff 以及编码代理（如 AI 代码生成工具）产出的改动，要完成的任务是判断哪些改动可以安全进入主干、哪些需要打回或修改。
  job_en: Before committing or merging, developers handle their own diffs plus changes produced by coding
    agents, and must decide which changes are safe to enter the main branch and which should be rejected
    or revised.
  pain: 编码代理会批量产出改动，人工逐条读 diff 的审查负担被放大，漏看风险与合并前返工成本上升；公开材料只给出“发布前审查代码与代理改动”这一句，未量化审查耗时或漏检率，痛点强度属工作流结构推理。
  pain_en: Coding agents produce changes in bulk, amplifying the burden of reading diffs line by line,
    raising the risk of missed issues and pre-merge rework; the public material only states 'review your
    code and your agents' changes before you ship' and gives no quantified review time or miss rate, so
    pain intensity is a workflow-structure inference.
  current_alternative: 旧做法是人工逐条读 diff，配合现有代码评审流程（如 PR review、CI 静态检查）；候选资料未描述任何替代行为，此替代方式为基于开发者通用工作流的推断。
  current_alternative_en: The old approach is reading diffs manually alongside existing code review processes
    (PR review, CI static checks); the candidate describes no alternative behavior, so this is inferred
    from generic developer workflows.
  usage_reason: 推断：相较人工逐条读 diff，它把审查动作前置到提交/合并之前并覆盖代理改动，可能减少“先合并再发现问题”的返工步骤；但公开材料未说明具体输出是评论、拦截还是报告，因此哪类用户会在什么情况下选择它仍属推断。
  usage_reason_en: 'Inference: versus reading diffs manually, it moves review earlier, before commit/merge,
    and covers agent changes, potentially reducing the rework step of finding problems after merge; however,
    the public material does not say whether the output is comments, blocks, or a report, so which users
    would choose it and when remains an inference.'
