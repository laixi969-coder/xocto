  market: ''
  job: Mac 上的知识工作者在被打断或切换任务时打开 Snapset，保存当前整套窗口与工作区状态，之后需要一键恢复到原来的工作现场。
  job_en: Knowledge workers on Mac open Snapset when interrupted or switching tasks, saving the current
    set of windows and workspace state, and later need to restore the original working context with one
    click.
  pain: 候选资料未说明用户原本卡在哪一步、重开窗口耗时还是容易漏掉，痛点无法从公开事实中还原。
  pain_en: The candidate material does not state where users previously got stuck, whether reopening windows
    was slow or easy to miss, so the pain cannot be reconstructed from public facts.
  current_alternative: 公开材料未给出替代方式，无法确认用户此前是用系统多桌面、手动重开窗口还是别的办法恢复现场。
  current_alternative_en: Public materials do not yet show how users complete this job today or what they
    replace.
  usage_reason: 缺少 AI 环节、恢复边界与用户反馈的说明，无法解释用户为何选择它而非旧的手动恢复方式；仅凭一句产品说明不足以支撑使用理由。
  usage_reason_en: With no description of an AI step, restore boundaries or user feedback, there is no
    way to explain why users would choose it over manual restoration; a one-line product description is
    not enough to support a usage reason.
