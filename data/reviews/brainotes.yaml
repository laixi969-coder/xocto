  market: ''
  job: 大学生在课堂上用笔记本或平板打开浏览器标签页，一边听讲一边在教师发放的讲义 PDF 上直接手写批注，并在课后保存成可回看的笔记。
  job_en: University students open a browser tab on a laptop or tablet during class, hand-annotate the
    lecturer's PDF handout while listening, and save it as a reviewable note afterwards.
  pain: 讲义几乎都是 PDF，打印成本高且不便携带；改用独立笔记软件则要在 PDF 阅读器和笔记应用之间来回切换，批注与原文分离，课后复习时难以对应。
  pain_en: 'Handouts are almost always PDFs: printing is costly and unwieldy, while a separate note app
    forces constant switching between the PDF reader and the note tool, leaving annotations detached from
    the source text and hard to match during revision.'
  current_alternative: 打印讲义后手写、用平板批注应用（如 GoodNotes、Notability）、或在笔记软件里另建文档摘抄要点。
  current_alternative_en: Printing the handout to write on, using tablet annotation apps such as GoodNotes
    or Notability, or retyping key points into a separate note document.
  usage_reason: 推断：相较打印或另开笔记软件，产品把 PDF 阅读与手写批注放在同一个浏览器标签页内完成，省去打印和跨应用切换这两步，批注直接锚定在原文页面上，因此经常用笔记本上课、又不想打印讲义的学生会在听课时选择它；公开材料尚无留存或付费证据。
  usage_reason_en: 'Inference: versus printing or a separate note app, the product keeps PDF reading and
    handwriting in one browser tab, removing the printing step and the app-switching step and anchoring
    annotations to the original page, so students who take notes on a laptop and avoid printing would
    choose it in class; public material shows no retention or payment evidence yet.'
