    the old process hurts, and no user complaints or workaround records are provided.
  current_alternative: 推断：此前多靠人工刷信息流、关键词搜索或同行转介绍来攒线索。
  current_alternative_en: 'Inference: previously done by manually scrolling feeds, keyword searching,
    or relying on peer referrals to accumulate leads.'
  usage_reason: 推断：若它能把公开帖子直接转成候选客户名单，就省掉逐条翻看和手工摘录这一步，靠个人接单的顾问会在需要补充客源时试用；但公开材料未说明筛选依据，无法确认这一步是否真的被减少。
  usage_reason_en: 'Inference: if it turns public posts directly into a candidate client list, it removes
    the step of scrolling and manually transcribing; solo consultants would try it when they need more
    pipeline. But the public material does not explain the filtering basis, so it is unconfirmed that
    this step is actually reduced.'
