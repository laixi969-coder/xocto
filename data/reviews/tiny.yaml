  market: ''
  job: 独立顾问或自由职业者在没有稳定客源时，需要从社交平台的公开帖子和对话里找出可能愿意付费的潜在客户，并整理成可联系的名单。
  job_en: A solo consultant or freelancer without steady inbound work needs to find potentially paying
    clients in public social posts and threads and turn them into a contactable list.
  pain: 公开材料只给出“在 X 上找下一个客户”一句，没有说明旧做法具体卡在哪一步，也没有用户抱怨或替代行为的记录。
