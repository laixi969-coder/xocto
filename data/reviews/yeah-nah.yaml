  market: ''
  job: 澳洲求职者在投递前逐条阅读招聘广告，需要判断哪些描述是夸大或套话，以决定是否投入时间申请。
  job_en: An Australian job seeker reads job ads one by one before applying and needs to judge which descriptions
    are exaggerated or boilerplate in order to decide whether to spend time applying.
  pain: 招聘广告普遍存在职责夸大、要求虚高和套话，求职者只能靠经验逐条判断，误投会浪费大量时间。
  pain_en: Job ads commonly inflate responsibilities, requirements and boilerplate, and candidates can
    only judge each one by experience; a bad application wastes substantial time.
  current_alternative: 求职者目前靠个人经验、社群吐槽帖或招聘平台评价来判断广告真假，没有专门工具。
  current_alternative_en: Candidates currently rely on personal experience, community complaint threads
    or employer-review sites to judge an ad, with no dedicated tool.
  usage_reason: 推断：它把逐条人工判断压缩成一次打分，若评分依据可解释，求职者会在批量浏览广告时用它先筛掉明显注水的岗位；但公开材料未说明评分逻辑，也未显示有人重复使用。
  usage_reason_en: 'Inference: it compresses manual per-ad judgement into a single score, so a candidate
    scanning many ads would use it to filter out obviously padded roles first, if the score is explainable;
    the public material does not describe the scoring logic or show repeat use.'
