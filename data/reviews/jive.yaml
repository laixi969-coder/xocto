  market: ''
  job: 软件工程师在终端里让编码智能体处理多步改动时，需要先看到它打算按什么顺序改哪些地方，再决定是否放行。
  job_en: A software engineer letting a terminal coding agent handle a multi-step change needs to see
    what it plans to change and in what order before approving it.
  pain: 智能体一次性给出大段改动，步骤之间的依赖不透明，出错后难以判断是哪一步导致，回滚成本高。
  pain_en: The agent returns a large change at once, dependencies between steps are opaque, and when something
    breaks it is hard to tell which step caused it, making rollback costly.
  current_alternative: 直接让编码智能体自由执行，再靠人工读 diff 和版本控制回退。
  current_alternative_en: Letting the coding agent run freely, then reading diffs manually and reverting
    through version control.
  usage_reason: 推断：它把工作计划先变成可执行的图，让依赖和顺序在动手前可见，省掉事后从 diff 反推哪一步出错的过程，因此在意可审计与回滚的工程团队会尝试它；公开材料未显示留存或付费证据。
  usage_reason_en: 'Inference: it turns the work plan into an executable graph so dependencies and order
    are visible before changes are made, removing the need to reconstruct which step failed from the diff
    afterwards, so engineering teams that care about audit and rollback would try it; public material
