  market: ''
  job: 开发者在离开工作站（通勤、外出、沙发上）时，用手机上的 Flutter 客户端通过 SSH 连回自己运行 herdr 的机器，查看多个编码 agent 的状态看板，并进入实时终端接管某个 agent
    会话，完成查看进度、确认是否卡住、必要时介入输入的任务。
  job_en: While away from their workstation, a developer uses a Flutter mobile client to SSH back into
    the machine running herdr, check the status board of multiple coding agents, and drop into a live
    terminal to take over a session — checking progress, spotting a stalled agent, and intervening when
    needed.
  pain: 编码 agent 往往长时间无人值守运行，开发者离开电脑后无法得知某个 agent 是仍在推进、已经卡住还是等待输入；不解决就只能等回到桌前才发现任务早已停摆，浪费整段等待时间。
  pain_en: Coding agents often run unattended for long stretches; once the developer leaves the desk there
    is no way to tell whether an agent is still progressing, stalled, or waiting for input, so a dead
    run may only be discovered on return, wasting the whole waiting window.
  current_alternative: 旧做法是留在电脑前盯着终端，或离开后完全放手、回来再检查；通用 SSH 客户端（Termius、Blink 等）能连上机器，但没有针对 herdr 多 agent
    会话的状态看板，需要自己记住并逐个 attach。
  current_alternative_en: The old approach is to stay at the desk watching the terminal, or to walk away
    entirely and check on return; generic SSH clients (Termius, Blink, etc.) can reach the machine but
    offer no status board for herdr's multiple agent sessions, forcing the user to remember and attach
    to each one manually.
  usage_reason: 相较通用 SSH 客户端或干脆离开，它把 herdr 的多 agent 状态直接渲染成手机看板，并允许从看板一步进入对应实时终端，省去逐个 attach 和记忆会话名的步骤；同时无需在远端安装
    bridge 二进制，降低了接入门槛。因此经常让多个编码 agent 长时间跑、又需要离机查看的开发者会在外出场景选择它。这是基于产品能力与任务结构的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with a generic SSH client or simply walking away, it renders herdr's multi-agent
    status directly as a mobile board and lets the user jump from the board straight into the matching
    live terminal, removing the need to remember and attach to each session one by one; requiring no bridge
    binary on the remote host also lowers setup friction. Developers who routinely run several coding
    agents unattended and need off-desk visibility are therefore the likely adopters. This is
