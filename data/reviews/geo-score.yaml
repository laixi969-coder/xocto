  market: ''
  job: SEO 或内容营销人员在页面发布或改版前，把站点和页面内容交给工具，按生成式搜索的引用规则检查一遍，决定哪些内容需要改写。
  job_en: Before publishing or revising a page, an SEO or content marketer feeds the site and page content
    to the tool, checks it against generative-search citation rules, and decides what to rewrite.
  pain: 生成式搜索的引用逻辑不透明，团队只能靠猜和零散经验判断内容会不会被引用，改版方向缺少可复用的依据，反复试错成本高。
  pain_en: Citation logic in generative search is opaque; teams guess from scattered experience whether
    content will be cited, revision direction lacks a reusable basis, and trial-and-error is costly.
  current_alternative: 目前多靠人工经验、通用 SEO 检查清单，或直接向 ChatGPT 提问看是否被提及，缺少统一、可版本化的评分口径。
  current_alternative_en: Today teams rely on manual experience, generic SEO checklists, or simply asking
    ChatGPT whether the site is mentioned, with no unified, versionable scoring standard.
  usage_reason: 相较人工逐条猜测，它把检查项固化成公开且带版本的规则并自动跑分，省去每次重新讨论标准的那一步，让改版前后有同一把尺子可比；推断，做内容营销和独立站运营的人会在发布前例行使用。
  usage_reason_en: Compared with guessing item by item, it fixes the checks into an open, versioned rubric
    and scores automatically, removing the step of renegotiating the standard each time and giving one
    comparable yardstick before and after revisions; this is inference, and content marketers and site
    operators would use it routinely before publishing.
