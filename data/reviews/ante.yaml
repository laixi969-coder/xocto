    reason: 它解决敏感环境下无法使用云端编码代理的痛点，提供本地离线执行，交付编码结果。工作流结构判断：替代云端代理和手动编码。
    evidence_ids:
    - ev-48b1edf3dac0597a
  - gate: consensus
