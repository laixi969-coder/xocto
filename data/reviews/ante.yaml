  next_validation: 查看代码仓库的 README、issue 和 release，确认支持的语言、模型和实际使用案例。
  market: ''
  job: 开发者需要在无网络或敏感环境下完成编码任务。
  job_en: Developers need to complete coding tasks in offline or sensitive environments.
  pain: 云端编码代理依赖网络，存在数据泄露风险，且响应延迟。
  pain_en: Cloud-based coding agents rely on internet, posing data leak risks and latency.
  current_alternative: 本地 IDE 插件、手动编码、云端编码代理。
  current_alternative_en: Local IDE plugins, manual coding, cloud coding agents.
  usage_reason: 开发者社区讨论热烈，显示对离线编码代理有强烈兴趣。
  usage_reason_en: Active developer community discussion shows strong interest in offline coding agents.
