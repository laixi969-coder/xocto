  market: ''
  job: 一个文件就能用的写代码助手，断网也能在本机改代码、跑测试
  job_en: A coding assistant in a single file that can edit code and run tests on the machine even with
    no network.
  pain: 它试图减少完成这项任务时的摩擦；公开用户材料尚未说明不解决的具体代价、发生频率或后果。
  pain_en: The product targets friction in this job, but public user evidence does not yet show the cost,
    frequency, or consequence of leaving it unsolved.
  current_alternative: 公开材料尚未说明用户目前如何完成这项工作、它实际替代了什么。
  current_alternative_en: Public materials do not yet show how users complete this job today or what they
    replace.
  usage_reason: 它承诺用更直接的方式完成这项任务：一个文件就能用的写代码助手，断网也能在本机改代码、跑测试；具体采用动机与持续使用情况尚未核验。
  usage_reason_en: 'It promises a simpler way to complete this job: A coding assistant in a single file
    that can edit code and run tests on the machine even with no network. The exact adoption motive and
    repeat use are not yet verified.'
- id: req-initial-ante-2026-09-01
