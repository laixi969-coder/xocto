  market: ''
  job: 法务或业务负责人在处理销售、采购合同时，把条款草稿和风险点整理成可签署的合同文件并推进签署。
  job_en: A legal or business owner handling sales or procurement contracts turns clause drafts and risk
    points into a signable contract and pushes it to signature.
  pain: 合同起草和风险审阅依赖法务或外部律师，周期长、按小时计费，业务方常因等审阅而拖延成交。
