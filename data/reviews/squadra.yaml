  market: ''
  job: 研发小组在同时使用多个编码代理处理同一代码库时，需要把任务分派、测试结果和复核结论汇总成一份可追溯记录，以便交付或复盘。
  job_en: When a small engineering team runs several coding agents on the same codebase, it needs task
    assignment, test results and review conclusions consolidated into one traceable record for delivery
    or retrospective.
  pain: 多个代理窗口各自为战，任务状态、测试证据和复核意见散落在不同会话里，出问题时难以还原是谁在哪一步做了什么。
  pain_en: Multiple agent windows work in isolation, so task state, test evidence and review comments
    scatter across sessions, making it hard to reconstruct who did what at which step when something breaks.
  current_alternative: 目前多靠人工在聊天工具或文档里手动记录任务与结论，或干脆不记录，依赖开发者记忆。
  current_alternative_en: Today teams mostly log tasks and conclusions by hand in chat tools or documents,
    or skip logging and rely on developer memory.
  usage_reason: 推断：相较手工在文档里拼记录，它把任务、确认、预检和测试证据绑定在同一条目下，减少事后翻找会话还原过程的那一步，因此同时跑多个编码代理、又需要对交付负责的小团队会考虑使用。
  usage_reason_en: 'Inference: compared with manually assembling notes in documents, it binds tasks, acknowledgements,
    prechecks and test evidence to one entry, removing the step of digging through sessions afterwards,
    so small teams running several coding agents and accountable for delivery would consider it.'
