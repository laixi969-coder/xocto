  market: ''
  job: 研发人员在用编码代理处理复杂任务时，需要代理先调研、先提问、先规划、交付前验证并做独立复核，最终拿到经过自检的代码或方案。
  job_en: Developers using coding agents on complex tasks need the agent to research, ask, plan, verify
    before delivery and run an independent review, ending with self-checked code or a plan.
  pain: 代理容易直接动手写代码，跳过需求澄清与验证，产出需要人反复返工，复杂任务上尤其明显。
  pain_en: Agents tend to start writing code immediately, skipping requirement clarification and verification,
    so output needs repeated rework, especially on complex tasks.
  current_alternative: 现有做法是人工在提示词里反复叮嘱流程，或靠团队评审制度事后发现问题。
  current_alternative_en: Today teams repeatedly spell out the process in prompts, or rely on post-hoc
    team review to catch problems.
  usage_reason: 推断：相较每次手写提示词，它把调研、提问、规划、验证、复核固化成一份可复用的纯文本约束，减少重复交代流程这一步；但公开材料没有实测或客户反馈证明代理确实遵守，因此选择动机仍属推断。
  usage_reason_en: 'Inference: compared with rewriting prompts each time, it fixes research, asking, planning,
    verification and review into one reusable plain-text constraint, removing the step of restating the
    process; but no tests or customer feedback in the public material show the agent actually complies,
    so the reason to choose it remains an inference.'
