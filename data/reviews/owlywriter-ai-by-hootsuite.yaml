  pain_en: Creative block stalls publishing, while researching trends, drafting channel variants, and
    assembling calendars creates recurring manual work.
  current_alternative: 运营人员手动浏览社交对话和历史内容，开会想选题，为各渠道分别写稿，再回到 Hootsuite 排期。
  current_alternative_en: Operators manually scan conversations and past posts, brainstorm topics, draft
    each channel version, then return to Hootsuite to schedule.
