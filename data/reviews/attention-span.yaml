  market: ''
  job: 使用 Claude Code、Codex 等 AI 编码助手的开发者，在终端里阅读 agent 返回的长篇输出时，需要把回复压缩成可快速扫读、聚焦要点的形式，以便在编码过程中持续跟上 agent
    的推理与改动。
  job_en: Developers using Claude Code, Codex and similar coding agents read long agent output in the
    terminal and need it compressed into a scannable, focus-preserving form so they can keep up with the
    agent's reasoning and edits while coding.
  pain: AI 编码 agent 默认输出冗长、结构松散，注意力容易涣散的用户（含 ADHD 开发者）在长回复中丢失关键信息，同时为无用 token 付费；公开材料只给出产品自述，未提供用户抱怨或频率数据。
  pain_en: Coding agents emit verbose, loosely structured output; users with fragile attention (including
    ADHD developers) lose the key point inside long replies and pay for wasted tokens. Public material
    only offers the product's own claim, with no user complaints or frequency data.
  current_alternative: 现状是直接阅读 agent 默认输出，或手动在提示词里要求“简短一点”，或自行维护 CLAUDE.md / 自定义指令来约束风格；这些做法零散、每次会话都要重复设置。
  current_alternative_en: Today users read the agent's default output, manually ask for brevity in prompts,
    or hand-maintain CLAUDE.md / custom instructions to constrain style; these are ad hoc and must be
    re-established per session.
  usage_reason: 推断：相较每次手动写提示或维护自定义指令，它把输出风格做成可安装的预设，一次配置后 agent 回复直接以短句、要点形式返回，省去逐轮追加“请简短”的步骤，并减少为冗长输出支付的
    token；因此注意力易分散、长时间盯终端读 agent 输出的开发者会在日常编码会话中选择它。
  usage_reason_en: 'Inference: instead of hand-writing brevity prompts or maintaining custom instructions
    each session, it ships output styles as an installable preset, so agent replies come back as short,
    bulleted text after one setup, removing the per-turn ''be brief'' step and cutting tokens spent on
    verbose output; developers with fragile attention who read agent output in the terminal all day would
    pick it for daily coding sessions.'
