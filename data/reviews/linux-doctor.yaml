  market: ''
  job: 运维或后端工程师在服务器出现异常、需要快速定位原因时，运行只读检查工具处理系统状态与日志材料，完成“哪里坏了”的判断任务。
  job_en: An SRE or backend engineer facing an abnormal server runs a read-only checker over system state
    and logs to complete the task of judging what is broken.
  pain: 排障时要翻大量日志和指标，经验不足的人容易漏掉根因，误操作还可能影响生产环境。
  pain_en: Troubleshooting means digging through logs and metrics; less experienced people miss root causes,
    and a wrong move can affect production.
  current_alternative: 旧做法是手动执行 top、df、journalctl 等命令逐项排查，或依赖已有的监控告警平台。
  current_alternative_en: The old approach is manually running top, df, journalctl and similar commands
    one by one, or relying on an existing monitoring and alerting platform.
  usage_reason: 推断：相较逐条敲命令再自己拼结论，只读检查把常见故障的排查步骤固定下来并直接给出说明，减少的是“不知道该看哪一项”的摸索，因此缺少资深 SRE 的小团队会在单机排障时选择它；公开材料未提供留存或付费证据。
  usage_reason_en: 'Inference: compared with typing commands one by one and assembling a conclusion, the
    read-only checker fixes the common troubleshooting steps and states the finding, cutting the ''don''t
    know what to look at'' fumbling, so small teams without a senior SRE would pick it for single-machine
    diagnosis; no retention or payment evidence is public.'
