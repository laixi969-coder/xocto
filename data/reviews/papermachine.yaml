  market: ''
  job: 数据分析师或研究员在本地机器上处理自有数据集（含敏感或未公开数据），需要完成探索性分析并产出可被同事、审稿人或合规方复核的图表与结论，任务是把每个图表追溯到生成它的 Python/R 代码。
  job_en: A data analyst or researcher works on their own dataset on a local machine (including sensitive
    or unpublished data), runs exploratory analysis, and must produce charts and conclusions that colleagues,
    reviewers, or compliance can audit, tracing each chart back to the Python/R code that produced it.
  pain: 通用 AI 分析工具给出结论和图表却不暴露中间代码与数据口径，用户无法核对数字怎么算出来；在金融研究、学术审稿或合规场景中，无法追溯的分析结果等于不可用，用户只能手工重跑或放弃 AI 辅助。
  pain_en: Generic AI analysis tools return conclusions and charts without exposing the intermediate code
    or data definitions, so users cannot verify how a number was produced; in financial research, academic
    review, or compliance settings an untraceable result is unusable, forcing manual re-runs or abandoning
    AI assistance.
  current_alternative: 当前替代方式包括：在 Jupyter/本地脚本中手工写 Python 或 R 并自行记录过程；使用不展示代码的通用 AI 分析工具后再人工复核；或把数据交给云端分析服务但承担数据外泄风险。
  current_alternative_en: Current alternatives include hand-writing Python or R in Jupyter/local scripts
    and documenting the process manually; using generic AI analysis tools that hide the code and then
    re-checking by hand; or sending data to cloud analysis services at the cost of data-leak risk.
  usage_reason: 相较手工写脚本或使用黑箱 AI，papermachine 在用户本机执行 Python/R，并把每个图表链接回生成它的代码，用户因此省去“先让 AI 出结果、再逐条重算验证”的返工步骤，可直接把代码与图表一并交付复核；推断：需要可审计分析链路且数据不能外传的分析师和研究员会在这种情况下选择它。
  usage_reason_en: 'Compared with hand-writing scripts or using a black-box AI, papermachine executes
