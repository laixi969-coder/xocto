  market: ''
  job: 数据分析师或研究员在本地机器上处理自有数据集（含敏感或不便上传的数据），要完成从数据到可核验图表与结论的分析任务，并让每个图表都能追溯到生成它的 Python/R 代码。
  job_en: A data analyst or researcher working on their own machine with proprietary or sensitive datasets
    must produce verifiable charts and conclusions, with every chart traceable back to the Python/R code
    that generated it.
  pain: 通用 AI 分析工具给出结论却不给可复现的代码路径，分析师无法核对数字来源，在金融研究等场景中结论不可审计、不可复现，返工和复核成本高。
  pain_en: Generic AI analysis tools return conclusions without a reproducible code path, so analysts
    cannot verify where numbers came from; in finance research the output is neither auditable nor reproducible,
    driving heavy rework and review cost.
  current_alternative: 自己写 Python/R 脚本并手工整理图表与代码的对应关系，或使用不展示中间代码的通用 AI 分析工具后人工复核。
  current_alternative_en: Hand-writing Python/R scripts and manually mapping charts to code, or using
    generic AI analysis tools that hide intermediate code and then re-checking by hand.
  usage_reason: 推断：相较手工写脚本再自行整理代码与图表对应关系，它在本地执行分析并自动把每个图表回溯到生成代码，减少的是事后人工核对与复现这一步，因此需要可审计结果、又不愿把数据传出本地的分析师和研究员会在做正式研究结论时选择它。
  usage_reason_en: 'Inference: compared with hand-writing scripts and manually mapping charts to code,
    it runs analysis locally and automatically traces each chart back to its generating code, removing
    the manual post-hoc verification and reproduction step, so analysts and researchers who need auditable
    results without moving data off their machine would choose it when producing formal research conclusions.'
