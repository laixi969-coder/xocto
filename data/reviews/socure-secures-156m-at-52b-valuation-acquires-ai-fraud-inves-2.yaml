  market: ''
  job: 银行、支付或保险机构的反欺诈分析师在收到可疑开户、放款或理赔申请时，需要处理证件、设备指纹和交易流水等材料，完成风险判定并写出可留档的调查结论。
  job_en: A fraud analyst at a bank, payment firm or insurer receives a suspicious onboarding, lending
    or claims application, works through documents, device fingerprints and transaction records, and must
    reach a risk decision and write an auditable investigation conclusion.
  pain: 人工逐案翻查多源记录并撰写结论耗时且口径不一，漏判会带来资金损失和监管处罚，误判又会流失正常客户。
  pain_en: Manually reviewing multi-source records case by case and writing conclusions is slow and inconsistent;
    misses cause financial loss and regulatory penalties, while false positives lose legitimate customers.
  current_alternative: 现有做法是规则引擎加人工复核，分析师在多个系统间切换、手工整理证据并撰写报告。
  current_alternative_en: The current approach is rule engines plus manual review, with analysts switching
    between systems, assembling evidence by hand and writing reports.
  usage_reason: 推断：相较规则引擎只给拦截信号、仍需人工从头取证，Socure 把身份数据与模型直接用于生成调查线索和结论草稿，减少分析师收集与初稿撰写这一步，因此案件量大、复核人力紧张的风控团队会在可疑案件积压时选择它；公开材料未提供留存或复购证据。
  usage_reason_en: 'Inference: whereas rule engines only produce a block signal and leave evidence gathering
    to humans, Socure applies identity data and models to generate investigation leads and draft conclusions,
    removing the evidence-collection and first-draft step, so risk teams with high case volume and thin
    review capacity would choose it when suspicious cases pile up; no retention or repeat-use evidence
    is public.'
