  verdict: true_demand
  signal_level: 初步成立
  gates:
  - gate: value
    status: supported
    reason: 它解决面试中即时组织口头回答、避免漏讲关键经历的需求，痛点刚性且不采用的代价明确；买方是谁公开材料未说明。
    evidence_ids:
    - ev-f5241272e17ed8d6
  - gate: consensus
    status: insufficient
    reason: 只有一句产品描述，没有用户评价、客户案例或使用规模，无法判断求职者是否真的把它带进面试流程。
    evidence_ids:
    - ev-f5241272e17ed8d6
  - gate: model
    status: insufficient
    reason: 未披露定价与付费方式，to C 订阅或按次收费都只是判断，不是已验证事实。
    evidence_ids:
    - ev-f5241272e17ed8d6
  - gate: truth
    status: insufficient
    reason: 实时提示在真实面试中的准确性与合规边界（是否被面试方允许）没有公开材料说明，交付确定性未核验。
    evidence_ids:
    - ev-f5241272e17ed8d6
  next_validation: 收集 SpeechShield 官方定价页或公开使用说明，确认其收费方式与实时提示的实际输入范围。
  market: ''
  job: 求职者在 Mac 上进行线上面试或远程会议时，需要一边听对方提问、一边从简历和过往经历里组织出得体的口头回答。
  job_en: A job candidate in an online interview or remote meeting on a Mac must listen to questions while
    assembling a presentable spoken answer from their resume and past experience.
  pain: 面试是即时、不可重来的口头场景，候选人常在紧张下想不起该讲哪段经历，事后才发现漏掉了关键项目或数据。
  pain_en: Interviews are real-time and cannot be redone; under pressure candidates often cannot recall
    which experience to cite and only afterwards notice they omitted a key project or metric.
  current_alternative: 旧做法是自己提前背简历、写面试提纲、对着镜子或朋友模拟，或在另一台设备上翻看笔记；也有人事后复盘录音。
  current_alternative_en: The old way is to memorize the resume, write an interview outline, rehearse
    with a mirror or a friend, or glance at notes on a second device; some review recordings afterwards.
  usage_reason: 相较提前背诵和事后复盘，它在对话进行中直接读取简历并给出当下可用的应答提示，把“想不起讲哪段经历”这一步的负担前移到屏幕上；推断，因为公开材料没有用户反馈或采用数据支持这一动机。
  usage_reason_en: Compared with memorizing beforehand and reviewing afterwards, it reads the resume during
    the conversation and surfaces a usable prompt at that moment, moving the burden of recalling which
    experience to cite onto the screen; this is inference, as no user feedback or adoption data supports
    the motive in the public material.
