  market: ''
  job: 消费者或接入它的 AI 助手在选购某件具体商品时，把商品关键词交给 Torob 的店铺数据，跨店拉取可比较的报价与商品结果，完成一次比价与价格核对。
  job_en: A consumer or an AI assistant they use, while shopping for a specific item, passes the product
    keyword to Torob's shop data to pull comparable offers and product results across shops and complete
    one price comparison and price check.
  pain: 同一商品在不同店铺价格与库存分散，用户要逐个站点打开、搜索、抄价再手工对齐，才能判断哪家更便宜；不解决的后果是买贵或反复来回核对，且这一动作在每次购物时重复发生。
  pain_en: The same item is scattered across shops with different prices and stock, so users must open
    each site, search, copy prices and align them by hand to judge which is cheaper; leaving it unsolved
    means overpaying or repeated manual cross-checking, and the action recurs on every purchase.
  current_alternative: 现状是人工逐个打开电商站点搜索比价，或使用 Torob 自身的网页/应用界面；对 AI 助手而言则是模型凭记忆报价，无法实时取到跨店价格。
  current_alternative_en: Today users manually open each e-commerce site to compare, or use Torob's own
    web/app interface; for an AI assistant the alternative is the model quoting from memory without live
    cross-shop prices.
  usage_reason: 推断：相较人工逐站搜索，它把“打开多个站点—搜索—抄价—对齐”压缩为一次工具调用，由 AI 助手直接返回跨店报价清单，因此正在用 AI 助手做购物决策、又需要实时价格的用户会在选购环节选择它；公开材料未提供用户自述动机。
  usage_reason_en: 'Inference: versus manually searching site by site, it compresses ''open many sites
    - search - copy prices - align'' into a single tool call that returns a cross-shop offer list to the
    AI assistant, so users already making purchase decisions through an assistant and needing live prices
    would pick it at the shopping step; public materials give no first-person user motivation.'
