    across shops, so manual comparison easily misses cheaper options.
  current_alternative: 消费者目前靠比价网站、搜索引擎结果或逐个打开店铺页面手动记录价格。
  current_alternative_en: Public materials do not yet show how users complete this job today or what they
    replace.
  usage_reason: 推断：它把跨店铺查询做成只读工具接口，AI 助手可在一次对话里直接取回多家报价，省去用户逐个打开店铺页面这一步，因此做购物助手的团队或重度比价用户可能接入；但公开材料未给出调用量或留存，无法确认持续使用。
  usage_reason_en: 'Inference: it turns cross-shop lookup into a read-only tool interface, so an AI assistant
    can fetch multiple quotes within one conversation, removing the step of opening shop pages one by
    one; shopping-assistant teams or heavy comparison users may therefore integrate it. But no call volume
    or retention is public, so continued use cannot be confirmed.'
