    into a local note tool such as Obsidian.
  usage_reason: 推断：相较云笔记，它在阅读动作发生时就写入本地 Vault，省掉读完后手动导出再导入的一步，因此长期积累文献标注、在意数据可迁移的读者会优先选它。
  usage_reason_en: 'Inference: versus cloud notes it writes into a local vault at the moment of highlighting,
    removing the manual export-and-import step after reading, so readers who accumulate citations and
    care about portability would prefer it.'
