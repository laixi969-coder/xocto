  market: ''
  job: 普通消费者在麦当劳门店或外卖下单前，面对菜单和一堆限时优惠券，要决定怎么组合点单才能花最少的钱吃到想吃的餐。
  job_en: An ordinary consumer, before ordering at a McDonald's store or via delivery, faces a menu plus
    a pile of limited-time coupons and must decide how to combine the order to eat what they want for
    the least money.
  pain: 优惠券规则分散、叠加条件复杂，人工逐条试算耗时且容易漏掉更省的组合，多花几十元是常态。
  pain_en: Coupon rules are scattered and stacking conditions complex; manual trial-and-error is slow
    and easily misses the cheapest combination, routinely costing tens of yuan extra.
  current_alternative: 靠小红书、贴吧等社区里别人分享的凑单攻略，或自己在点餐 App 里反复加减商品试算。
  current_alternative_en: Relying on stacking guides shared by others on communities like Xiaohongshu
    and Tieba, or repeatedly adding and removing items in the ordering app to test totals.
  usage_reason: 相比翻攻略再手动试算，它直接读取菜单与全部可用券并给出一个可照点的组合，省掉逐条比对和反复加减商品这一步；推断，常点麦当劳且对价格敏感的用户在有大额券时更可能选择它。
  usage_reason_en: Versus reading guides and testing manually, it reads the menu and all available coupons
    and returns one orderable combination, removing the step of comparing rules and re-editing the cart;
    inference, price-sensitive frequent McDonald's customers are more likely to use it when large coupons
    are available.
