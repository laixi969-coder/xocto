  market: ''
  job: 价格敏感的麦当劳消费者在门店或外卖下单前，面对菜单与多张限时优惠券，要决定点哪些商品、用哪几张券，才能花最少的钱吃到想吃的餐。
  job_en: A price-sensitive McDonald's customer, before ordering in-store or via delivery, faces a menu
    plus several limited-time coupons and must decide which items and which coupons to combine to eat
    what they want for the least money.
  pain: 优惠券规则分散、叠加与门槛条件复杂，人工逐条试算耗时且容易漏掉更省的组合，多花几十元是常态；公开材料以巨无霸套餐 ¥47→¥21.9 说明价差空间真实存在。
  pain_en: Coupon rules are scattered and stacking/threshold conditions complex; manual trial-and-error
    is slow and easily misses the cheapest combination, routinely costing tens of yuan extra; the public
    claim of a Big Mac meal dropping from ¥47 to ¥21.9 shows the price gap is real.
  current_alternative: 靠小红书、贴吧等社区里别人分享的凑单攻略，或自己在点餐 App 里反复加减商品试算总价。
  current_alternative_en: Relying on stacking guides shared by others on communities like Xiaohongshu
    and Tieba, or repeatedly adding and removing items in the ordering app to test totals.
  usage_reason: 相较翻攻略再手动试算，它直接读取菜单与全部可用券并输出一个可照点的组合，省掉逐条比对规则和反复加减购物车这一步；这是基于产品能力与任务结构的推断，常点麦当劳且对价格敏感的用户在大额券可用时更可能选择它。
  usage_reason_en: Versus reading guides and testing manually, it reads the menu and all available coupons
    and outputs one orderable combination, removing the step of comparing rules and re-editing the cart;
    this is an inference from product capability and task structure, and price-sensitive frequent McDonald's
    customers are more likely to choose it when large coupons are available.
