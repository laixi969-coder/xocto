  market: ''
  job: 开发者在构建需要高频、低延迟判断的应用（如分类、路由、策略决策）时，把大模型的决策意图一次性编译成本地可执行的逻辑，之后在本地运行判断，而不再每次请求都调用模型。
  job_en: Developers building high-frequency, low-latency decision applications (e.g., classification,
    routing, policy decisions) compile an LLM's decision intent once into locally executable logic, then
    run decisions locally instead of calling the model on every request.
  pain: 公开材料只给出“编译一次、本地运行”的定位，未披露用户成本或延迟数据；从工作流结构推断，痛点是每次决策都调用大模型带来的调用费用与延迟随请求量线性累积，高频场景下难以承受。
  pain_en: Public material only states the 'compile once, run locally' positioning and gives no user cost
    or latency data; inferred from workflow structure, the pain is that per-decision LLM calls make cost
    and latency scale linearly with request volume, which is hard to sustain in high-frequency settings.
  current_alternative: 开发者目前按次调用模型 API，或手工编写规则、训练小型分类模型来替代高频模型调用。
  current_alternative_en: Developers currently call model APIs per request, or hand-write rules and train
    small classifiers to replace high-frequency model calls.
  usage_reason: 推断：相较每次决策都调用模型，它把意图编译一次后在本地执行，省去单次请求的模型调用这一步，从而降低随请求量增长的调用费用与延迟；但编译对象、支持任务类型与准确率取舍未公开，哪类用户会实际替换现有规则尚无法核对。
  usage_reason_en: 'Inference: compared with calling the model per decision, it compiles intent once and
    executes locally, removing the per-request model call and thus cutting cost and latency that grow
    with request volume; however, compile targets, supported task types and accuracy trade-offs are not
    public, so which users would actually replace existing rules cannot be verified.'
