  market: ''
  job: 产品演示录制者、在线课程讲师在录制软件操作教程时，处理的是原始屏幕录像，要完成一段可直接发布、镜头有节奏的演示视频。
  job_en: Product demo recorders and online course instructors capture raw screen recordings of software
    walkthroughs and need a publishable demo video with paced camera movement.
  pain: 录屏本身容易，但成片需要在剪辑软件里逐段打关键帧做缩放，重复且耗时；不做的后果是视频平淡、观众看不清操作重点。
