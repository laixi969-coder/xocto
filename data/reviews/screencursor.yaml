  current_alternative: 录屏后用剪辑软件手动打缩放关键帧，或干脆不缩放直接发布。
  current_alternative_en: Record, then manually keyframe zooms in an editor, or publish without zooms
    at all.
  usage_reason: 推断：若它能在录制过程中自动生成缩放，用户就省掉剪辑软件里逐段打关键帧这一步，录制结束即接近成片；因此高频出演示视频的售前和课程团队会在赶交付时选择它。公开材料未给出实际使用或留存证据。
  usage_reason_en: 'Inference: if it generates zooms during recording, users skip the segment-by-segment
    keyframing step and finish close to the recording itself; pre-sales and course teams shipping demos
    frequently would pick it when deadlines are tight. No public usage or retention evidence is given.'
