  market: ''
  job: 使用多个编码智能体订阅的开发者或团队在额度快用完或任务类型不同时，需要决定把哪段编码任务交给哪个智能体，以免额度浪费或任务卡住。
  job_en: Developers or teams with several coding-agent subscriptions who, when quotas run low or tasks
    differ in type, need to decide which coding task goes to which agent to avoid wasted quota or stalled
    work.
  pain: 多个订阅各有额度和擅长范围，人工分配容易把额度用在不合适的任务上，月底浪费或关键任务没额度。
  pain_en: Each subscription has its own quota and strengths, and manual allocation easily burns quota
    on the wrong tasks, wasting it by month-end or leaving key work without quota.
  current_alternative: 目前靠开发者自己记住各订阅剩余额度并手动切换工具，或用脚本粗略分配。
  current_alternative_en: Today developers track remaining quota across subscriptions themselves and switch
    tools manually, or use rough scripts to allocate.
  usage_reason: 推断：它把额度感知的分派动作自动化，省掉人工记录剩余额度并手动切换这一步，因此对同时订阅多个编码智能体的团队有吸引力；但路由准确性和实际节省额度没有公开数据。
