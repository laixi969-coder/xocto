  market: ''
  job: 开发者在同一台机器上并行运行多个 AI 代理时，需要查看这些代理当前在做什么、是否还在运行，以便判断下一步操作。
  job_en: A developer running several AI agents in parallel on one machine needs to see what those agents
    are currently doing and whether they are still running, in order to decide the next action.
  pain: 多个代理同时运行时，进程、日志和调用分散在不同终端与文件里，开发者难以一眼确认哪个代理在跑、哪个卡住或失控；候选资料未提供任何用户抱怨或案例，此痛点属工作流推理。
  pain_en: With several agents running at once, processes, logs and calls are scattered across terminals
    and files, so the developer cannot easily tell which agent is running and which is stuck or out of
    control; the candidate provides no user complaints or cases, so this pain is a workflow inference.
  current_alternative: 目前通常靠逐个终端窗口切换、查看日志文件或系统进程列表来确认代理状态。
  current_alternative_en: Today this is usually done by switching between terminal windows, reading log
    files, or checking the system process list.
  usage_reason: 推断：如果它把本机多个代理的状态汇总到一处展示，开发者就不必逐个终端翻日志，能更快发现卡住或异常退出的代理；但候选资料未说明它读取什么、展示什么，因此尚不能确认它比现有做法少哪一步。
  usage_reason_en: 'Inference: if it aggregates the state of several local agents in one place, a developer
    would not have to dig through each terminal''s logs and could spot stuck or crashed agents faster;
    however, the candidate does not say what it reads or displays, so it is not yet possible to confirm
    which step it removes versus current practice.'
