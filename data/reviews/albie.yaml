  usage_reason_en: 'Inference: writing step by step on a whiteboard makes the derivation explicit and
    fits how students copy and follow along better than a chat reply, so students who need to understand
    the process rather than just the answer may choose it; however, no user feedback or retention evidence
    is public.'
