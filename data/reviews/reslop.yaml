  market: ''
  job: 开发者在把 AI 生成的代码改动合并进主分支之前，需要处理待审的代码差异和改动计划，完成一次能发现问题的审查。
  job_en: Before merging AI-generated code changes into the main branch, a developer needs to work through
    the pending diff and change plan and complete a review that actually catches problems.
  pain: AI 生成代码的量已经超过人工逐行审查的承受能力，漏审会直接把缺陷带进主分支。
  pain_en: The volume of AI-generated code already exceeds what humans can review line by line, and missed
    review puts defects straight into the main branch.
  current_alternative: 靠人工逐行读差异、依赖通用代码助手做零散提示，或干脆降低审查标准直接合并。
  current_alternative_en: Reading diffs line by line by hand, relying on general coding assistants for
    scattered hints, or simply lowering the review bar and merging anyway.
  usage_reason: 推断：它把审查动作收敛为对差异和改动计划的一次集中检查并直接给出修改方案，省去人工逐行通读和自行组织修改意见的步骤，因此合并 AI 代码频繁的团队会在提交前使用它。
  usage_reason_en: 'Inference: it narrows review into one focused pass over the diff and change plan and
    returns concrete edits, removing the step of reading everything line by line and drafting review comments
    by hand, so teams merging AI code often would use it before committing.'
