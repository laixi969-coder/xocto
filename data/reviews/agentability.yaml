  next_validation: 收集该站点公开的任务清单与执行记录页面，确认任务类型、成功率与失败后的处理方式。
  market: ''
  job: 个人用户或运营助理在需要完成订票、填表、查信息等网页杂务时，把任务交给该 agent 代跑，最终拿到任务结果与公开的执行记录。
  job_en: An individual user or operations assistant with web chores such as booking, form filling or
    lookups hands the task to this agent, ending up with the result and a published execution transcript.
  pain: 候选材料只有一句描述，没有说明这些杂务此前由谁、花多久完成，失败会带来什么后果，痛点无法还原。
  pain_en: The candidate gives only a one-line description; it does not say who previously did these chores,
    how long they took, or what failure costs, so the pain cannot be reconstructed.
  current_alternative: 公开材料未说明现有替代方式，无法确认此前是用户自己手动操作、雇助理还是用浏览器插件完成。
  current_alternative_en: The public material does not describe existing alternatives, so it is unclear
    whether users previously did the chores manually, hired assistants, or used browser extensions.
  usage_reason: 推断：若 agent 能代跑重复的网页操作并留下可回看的轨迹，用户可省去逐步手动点击的一步；但缺少任务成功率与失败处理信息，无法判断这一步负担是否真的被减少。
  usage_reason_en: 'Inference: if the agent runs repetitive web actions and leaves a reviewable trace,
    users may skip step-by-step manual clicking; however, without success rates or failure handling, it
    is unclear whether that burden is actually reduced.'
