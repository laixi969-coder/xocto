  next_validation: 收集 Sixfold 官方产品页或部署文档，核验 AI Underwriter 的输入材料类型、输出结论形式、人工复核环节与计费方式。
  market: ''
  job: 寿险与健康险核保人员在收到投保申请时，需要处理健康告知、体检报告和既往病史等材料，判断是否承保以及按什么条件承保。
  job_en: Life and health insurance underwriters receiving applications must process health declarations,
    medical reports and prior-history documents to decide whether and on what terms to accept the risk.
  pain: 核保材料分散、格式不一，人工逐份阅读耗时且判断口径容易不一致；不处理就无法给出承保结论，拖慢出单。
  pain_en: Underwriting materials are scattered and inconsistently formatted, so reading them one by one
    is slow and judgments drift; without doing it, no acceptance decision can be issued and policy issuance
    stalls.
  current_alternative: 目前主要靠核保人人工阅读材料并依据内部核保手册判断，部分机构用规则引擎处理标准化字段。
  current_alternative_en: Today underwriters mainly read the materials manually against internal underwriting
    manuals, with some institutions using rule engines for standardized fields.
  usage_reason: 相较人工逐份阅读，该产品把投保材料直接转成核保判断，减少核保人通读与初步定级这一步负担，核保人只需复核结论；因此材料量大、核保人力紧张的寿险与健康险团队会在申请积压时选择它。这是基于产品能力与任务结构的推断，尚无客户案例或留存证据。
  usage_reason_en: Compared with reading each file manually, the product turns application materials directly
    into an underwriting judgment, removing the read-through and first-pass rating step so underwriters
    only review the conclusion; life and health teams with high application volume and thin underwriting
    staff would choose it when applications pile up. This is an inference from product capability and
    task structure, with no customer case or retention evidence yet.
