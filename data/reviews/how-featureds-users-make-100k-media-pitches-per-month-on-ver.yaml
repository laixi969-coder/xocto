  market: ''
  job: 公关与市场人员在为品牌争取媒体报道时，需要针对不同记者撰写并批量投递 pitch 稿件。
  job_en: PR and marketing staff need to write and bulk-send pitches to different journalists when seeking
    press coverage for a brand.
  pain: 媒体外联依赖人工逐个研究记者、逐封改写 pitch，量大时难以维持个性化，投递结果也难以追踪。
  pain_en: Media outreach requires manually researching each journalist and rewriting each pitch; at volume,
    personalization collapses and delivery results are hard to track.
  current_alternative: 此前多靠人工在表格里维护记者名单、逐封手写邮件，或使用通用邮件群发工具。
  current_alternative_en: Previously done by maintaining journalist lists in spreadsheets, hand-writing
    each email, or using generic bulk-email tools.
  usage_reason: 推断：相较逐封手写，Featured 把记者背景与品牌信息一起交给模型生成 pitch 并批量投递，减少的是逐封改写和手动发送这一步；因此投递量大、需要覆盖大量记者的公关团队会选它。候选未提供留存或付费证据，长期使用无法确认。
  usage_reason_en: 'Inference: versus writing each email by hand, Featured feeds journalist context and
    brand information to a model to generate and bulk-send pitches, removing the per-email rewriting and
    manual sending step; PR teams with high outreach volume and many journalists to cover would choose
    it. The candidate offers no retention or payment evidence, so sustained use cannot be confirmed.'
