  market: ''
  job: AI医疗器械厂商的法规事务与质量团队，在产品训练完成、准备上市或提交小版本更新时，整理模型文档、临床与质量材料，向公告机构提交并取得符合性评估结论与证书。
  job_en: Regulatory affairs and quality teams at AI medical device makers, after model training and before
    market launch or a minor update, compile model documentation, clinical and quality materials, submit
    them to a notified body and obtain a conformity assessment outcome and certificate.
  pain: 材料称AI诊断模型可在数周内训练完成，但专家审评要等12至18个月，小更新审批还要额外6至8个月，产品迭代被审评节奏卡住。
  pain_en: The material states an AI diagnostic model can be trained in weeks, yet expert assessment takes
    12 to 18 months, with another six to eight months for a minor update, so iteration is gated by review
    throughput.
  current_alternative: 厂商向欧盟医疗器械法规下约52家指定机构中面向通用器械的公告机构提交，排队等待通用审评流程。
  current_alternative_en: Makers submit to general-purpose notified bodies among the roughly 52 designated
    under the EU Medical Device Regulation and queue through a general review process.
  usage_reason: 推断：相较通用公告机构的排队审评，Scarlet以软件与AI为唯一专注方向并自称按迭代开发设计流程，可能缩短变更审批这一最痛的等待环节，因此需要频繁小版本更新的AI诊断与软件器械厂商会在上市与更新节点选择它；公开材料未给出实际审评时长对比，属推断。
  usage_reason_en: 'Inference: versus queuing at general notified bodies, Scarlet focuses solely on software
    and AI and says its process is built for iterative development, potentially shortening the most painful
    change-approval wait, so AI diagnostics and software device makers shipping frequent minor updates
    would choose it at launch and update points; no public comparison of actual review times is given,
    so this is inference.'
