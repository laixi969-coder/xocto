  market: ''
  job: 医院招聘负责人和护理招聘专员在护理岗位长期空缺、需要快速补人的情况下，处理候选人库和岗位需求，要完成从匹配到发出邀约、推进到入职的任务。
  job_en: Hospital recruiting managers and nurse recruiters, when nursing roles stay vacant and need rapid
    filling, work with candidate pools and job requirements to move from matching to outreach and on to
    onboarding.
  pain: 护理人才稀缺，传统做法是招聘方被动等投递、再逐个筛选联系，周期长且候选人常被同行抢走。
  pain_en: Nursing talent is scarce, and the traditional approach has employers passively waiting for
    applications and then screening and contacting candidates one by one, which is slow and loses candidates
    to competitors.
  current_alternative: 招聘网站挂岗位、招聘专员手动搜简历并逐个电话或邮件联系，或依赖猎头与人力中介。
  current_alternative_en: Posting jobs on job boards, recruiters manually searching resumes and cold-calling
    or emailing candidates, or relying on headhunters and staffing agencies.
  usage_reason: 相较招聘专员手动搜简历再逐个联系，它把发起方换成雇主、由 AI agent 参与匹配与推进，减少的是筛选和首次触达这一步的负担，因此缺人急、岗位量大的医院招聘团队会在补护理缺口时选择它；这是基于产品能力的推断，尚无客户复购证据。
  usage_reason_en: Compared with recruiters manually searching resumes and contacting candidates one by
    one, it makes the employer the initiator and has AI agents take part in matching and progression,
    reducing the burden of screening and first outreach, so hospital recruiting teams with urgent, high-volume
    nursing gaps would choose it; this is an inference from product capability, with no repeat-purchase
    evidence yet.
