  job_en: Developers wiring a model into automation or in-software decision flows send state and typed
    questions to Jev and need structured answers their code can consume directly, instead of hand-parsing
    free text.
  pain: 公开材料只说明 Jev 返回结构化答案，未给出用户抱怨、返工记录或失败案例；痛点来自结构推理：自由文本输出需要额外解析与校验，格式漂移会让下游代码出错。
  pain_en: 'Public material only states that Jev returns structured answers; it gives no user complaints,
    rework logs, or failure cases. The pain is structural inference: free-text output needs extra parsing
    and validation, and format drift breaks downstream code.'
  current_alternative: 开发者自行写解析与校验代码，或在提示词里约束格式后仍靠人工检查；公开材料未展示任何现有替代流程的细节。
  current_alternative_en: Developers write their own parsing and validation code, or constrain format
    via prompts and still check by hand; public material shows no detail of any existing alternative workflow.
  usage_reason: 推断：相较自行解析自由文本，Jev 以“发送状态与带类型问题、返回结构化答案”的方式把格式约束前移到模型侧，可能省去下游解析与逐处修正；但公开材料未说明具体动作与可核对结果，哪类用户会因此选择它仍属推断。
  usage_reason_en: 'Inference: versus hand-parsing free text, Jev moves format constraints to the model
    side by taking state and typed questions and returning structured answers, potentially removing downstream
    parsing and per-site fixes; but public material does not describe the concrete action or a checkable
    result, so which users would choose it remains inference.'
