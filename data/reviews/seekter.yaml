  market: ''
  job: 求职者在集中投递期（如换工作、毕业求职、跨国求职）每天处理多个招聘来源的职位列表，按地点、签证、薪资、行业、资历、语言等自定规则筛选出可投职位，并在本人 Chrome 中逐份填写申请表单，同时保留每份申请或跳过的记录。
  job_en: During an intensive search period (job change, graduation, cross-border search), a job seeker
    processes postings from multiple sources daily, filters them against self-defined rules (location,
    visa, salary, sector, seniority, language), fills application forms one by one in their own Chrome,
    and keeps a record of every application or skip.
  pain: 公开材料显示的核心痛点是筛选与重复填表两段机械劳动：职位分散在多个来源、规则维度多（签证、薪资、地点等），且每份申请表单都要重复录入相同信息；跳过或申请缺乏可检索记录，难以复盘投递策略。公开材料未给出不采用的具体代价或频率量化。
  pain_en: 'The stated pain is the mechanical labor of two stages: filtering and repetitive form filling.
    Postings are scattered across sources, the rule dimensions are many (visa, salary, location), and
    each application form re-enters the same information; skips and applications lack a searchable record,
    making it hard to review strategy. Public materials give no quantified cost or frequency.'
  current_alternative: 旧做法是求职者自己在各招聘网站逐条浏览、用表格或笔记手工记录已投与跳过，再逐份手动填写表单；也可能使用招聘平台的站内提醒或通用自动填表插件，但这些不覆盖跨来源规则过滤与可
    diff 的投递记录。
  current_alternative_en: 'The old approach is manual: browsing each job board, tracking applications
    and skips in a spreadsheet or notes, and filling each form by hand; possibly using site-native alerts
    or generic autofill extensions, which do not cover cross-source rule filtering or a diffable application
    log.'
  usage_reason: 相较手工逐条浏览与重复填表，该代理每天自动抓取并按用户自定规则过滤，把不符合条件的职位直接跳过，再在用户本人 Chrome 会话中填写表单，并把每次申请或跳过写成可 grep、可
    diff 的 markdown 文件。这样减少的是“逐条筛选”和“重复录入”两步负担，并让投递记录可核对；推断在集中投递期、规则维度多（如签证、薪资）的求职者会因此选择它。公开材料未提供用户反馈或留存证据，此为工作流结构推理。
