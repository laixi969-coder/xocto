  market: ''
  job: 使用 Claude Code 的软件开发者长时间跑代理任务时，需要在不离开当前窗口的情况下看到运行状态并回应权限提示，保证编码任务继续推进。
  job_en: Software developers running long Claude Code agent tasks need to see run status and answer permission
    prompts without leaving their current window so coding work keeps moving.
  pain: 代理执行中频繁弹出权限确认，开发者必须切回终端处理，打断正在进行的编辑或调试，长任务尤其明显。
  pain_en: Permission confirmations pop up repeatedly during agent runs, forcing developers back to the
    terminal and interrupting editing or debugging, especially on long tasks.
  current_alternative: 现在只能切回终端窗口逐条确认，或干脆放宽权限设置以减少打断。
  current_alternative_en: Today they switch back to the terminal to confirm each prompt, or loosen permission
    settings to reduce interruptions.
  usage_reason: 相较切回终端逐条确认，它把 15 个 hook 事件和权限提示搬到常驻桌面，开发者可在当前窗口直接授权，省掉一次窗口切换；这是基于接线能力的推断，尚无留存或团队采用证据。
  usage_reason_en: Compared with switching back to the terminal for each confirmation, it moves all 15
    hook events and permission prompts onto an always-on desktop layer so developers can authorize in
    place, removing one window switch; this is inference from the wiring capability, with no retention
    or team-adoption evidence yet.
