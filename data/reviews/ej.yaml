  market: ''
  job: 嵌入式开发者在边缘设备算力有限、网络不可靠的场景下，处理设备采集的输入，希望在本机一次推理就得到带类型的判断结果。
  job_en: An embedded developer, in a setting with limited edge compute and unreliable network, processes
    device-captured input and wants a typed decision from a single on-device inference pass.
  pain: 把判断放到云端会带来延迟、联网依赖与数据外流问题，而在设备上跑通用模型又受体积与算力限制；候选材料没有给出用户抱怨或采用证据。
  pain_en: Moving decisions to the cloud brings latency, connectivity dependence and data leaving the
    device, while running general models on-device is limited by size and compute; the candidate material
    gives no user complaints or adoption evidence.
  current_alternative: 调用云端推理接口，或在设备上部署体积更大的模型并做量化裁剪，也可能用传统规则与阈值判断。
  current_alternative_en: Calling a cloud inference API, or deploying a larger model on-device with quantization
    and trimming, or using traditional rules and thresholds.
  usage_reason: 推断：相较云端调用，它在设备本地完成一次前向推理，省掉联网与数据外传这一步，因此对网络不稳或数据不便外发的边缘场景有吸引力。缺少准确率、集成案例与留存证据，无法确认是否被长期采用。
  usage_reason_en: 'Inference: compared with cloud calls, it completes one forward pass locally on the
    device, removing the connectivity and data-egress step, which appeals to edge settings with unstable
    networks or data that should not leave the device. Without accuracy, integration cases or retention
    evidence, long-term adoption cannot be confirmed.'
