  market: ''
  job: 前端开发者或 UI 设计师在构建 AI 聊天/智能体产品界面时，需要处理流式消息、工具调用状态、会话列表等交互材料，要完成一个可运行、可接自有模型密钥的对话界面，而不是从零手写组件。
  job_en: A frontend developer or UI designer building an AI chat/agent product interface must handle
    streaming messages, tool-call states, and conversation lists, and needs to ship a working chat UI
    wired to their own model key instead of hand-rolling components from scratch.
  pain: 智能体界面的交互状态（流式输出、工具调用、错误与重试）比普通表单复杂，从零搭建既耗时又容易做错；公开材料只说明组件以源码形式免费提供并附带可运行聊天示例，未提供用户抱怨或耗时数据，痛点强度属工作流结构推理。
  pain_en: Agentic UI states (streaming output, tool calls, errors and retries) are more complex than
    ordinary forms, so building them from scratch is slow and error-prone; public materials only state
    that components ship as free source with a working chat demo, with no user complaints or time data,
    so pain intensity is a workflow-structure inference.
  current_alternative: 开发者通常自行手写聊天组件，或拼装通用组件库（如 shadcn/Radix 等）再自行补齐流式与工具调用逻辑；公开材料未直接描述这一替代流程，属基于产品定位的推断。
  current_alternative_en: Developers typically hand-write chat components or assemble generic component
    libraries (e.g. shadcn/Radix) and then add streaming and tool-call logic themselves; public materials
    do not directly describe this alternative, so it is inferred from the product positioning.
  usage_reason: 相较自行手写或拼装通用库，BoardUI 直接提供智能体界面组件的源码，并附带一个可接入自有模型密钥的可运行聊天应用作为首页示例，开发者可先跑通示例再按源码改造，省去从零实现流式与工具调用交互这一步；这属于基于产品能力的推断，尚无用户反馈证实。
  usage_reason_en: Compared with hand-writing or assembling generic libraries, BoardUI ships agentic-interface
    component source plus a runnable chat app on the user's own model key as the homepage demo, so a developer
    can run the demo first and then adapt the source, skipping the step of implementing streaming and
    tool-call interactions from zero; this is inferred from product capability, not confirmed by user
    feedback.
