  market: ''
  job: Unity 开发者（尤其使用 DeepSeek Harness 等 AI 编码代理的团队）在编辑器内反复执行导入资源、改组件、跑构建、查日志等操作时，希望通过 unity CLI 让 AI
    代理直接驱动 Unity 编辑器完成这些编辑与构建任务，而不必手工在 GUI 里逐步点击。
  job_en: Unity developers (especially those using AI coding agents such as DeepSeek Harness) who repeatedly
    import assets, edit components, run builds and read logs want the agent to drive the Unity Editor
    through the unity CLI to complete those edit-and-build tasks instead of clicking through the GUI by
    hand.
  pain: Unity 编辑器的操作长期绑定图形界面，脚本化与自动化能力有限；当开发者把 AI 代理接入工作流时，代理无法直接触达编辑器状态，只能生成代码片段再由人手工粘贴、点击、验证，重复劳动多且容易出错。
  pain_en: Unity Editor work is bound to a graphical interface with limited scriptability; when developers
    bring AI agents into the workflow, the agent cannot reach editor state directly, so it can only emit
    snippets that a human must paste, click and verify, which is repetitive and error-prone.
  current_alternative: 当前替代方式是手工在 Unity GUI 中操作，或自行编写 Editor 脚本、批处理模式命令、第三方自动化工具，再由开发者手动把 AI 生成的代码搬进编辑器执行。
  current_alternative_en: Today developers work manually in the Unity GUI, or write their own Editor scripts,
    batch-mode commands and third-party automation tools, then hand-carry AI-generated code into the editor
    to run it.
  usage_reason: 推断：相较手工 GUI 操作或自写脚本，该插件把编辑器控制暴露为 unity CLI 命令，使 AI 代理能直接调用同一套命令完成导入、改组件、构建等动作，省去“生成代码—人工粘贴—点击执行—回读结果”这一整段搬运环节；因此正在用
    AI 代理做 Unity 开发、且希望代理闭环操作编辑器的开发者会在搭建工作流时选择它。
  usage_reason_en: 'Inference: versus manual GUI work or self-written scripts, the plugin exposes editor
    control as unity CLI commands so an AI agent can call the same commands to import, edit components
    and build, removing the generate-paste-click-read-back handoff; developers already using AI agents
    for Unity work who want a closed loop on the editor would therefore adopt it when setting up their
    workflow.'
