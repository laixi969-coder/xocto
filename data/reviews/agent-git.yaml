  market: ''
  job: AI 应用开发者在调试或复现智能体一次运行的多步对话与工具调用记录时，把这些会话当作可版本管理的对象保存、比对，取回可回溯、可对照的会话版本。
  job_en: An AI application developer debugging or reproducing a multi-step agent run saves and diffs
    the session's dialogue and tool-call records as version-managed objects, retrieving a traceable, comparable
    session version.
  pain: 智能体会话是多步、非确定性的，出问题时难以定位是哪一步、哪次改动导致结果变化；公开材料以“Code is cheap, show me the talk”点出代码易得而会话过程难留痕，痛点指向会话不可回溯、不可比对。
  pain_en: Agent sessions are multi-step and non-deterministic, so when something breaks it is hard to
    locate which step or change caused the shift; the public tagline 'Code is cheap, show me the talk'
    points to code being cheap while the session process is hard to preserve, i.e. sessions are not traceable
    or comparable.
  current_alternative: 旧做法是用 Git 管代码、用日志或聊天记录手工翻找会话，会话本身没有版本对象；agent-git 把会话纳入版本控制，agentgit.co 进一步提供“无需账号、token、密钥”的
    Git 托管。
  current_alternative_en: The old way is Git for code plus manually scrolling logs or chat history for
    sessions, with no versioned object for the session itself; agent-git brings sessions under version
    control, and agentgit.co adds a Git host with 'no account, no token, no key'.
  usage_reason: 推断：相较手工翻日志，它把一次运行的多步对话与工具调用记录直接变成可 diff、可回滚的版本对象，省去人工比对哪一步变了这一环，因此正在调试或复现智能体行为的 AI 应用开发者会在排查回归时选择它。
  usage_reason_en: 'Inference: versus manually scrolling logs, it turns a run''s multi-step dialogue and
    tool-call records into diffable, revertible version objects, removing the manual step of comparing
    which step changed, so AI application developers debugging or reproducing agent behavior would pick
    it when chasing a regression.'
