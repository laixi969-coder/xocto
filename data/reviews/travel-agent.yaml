  market: ''
  job: 旅行规划者在规划一次具体出行时，需要处理航班、酒店等真实网站上的预订信息，在聊天界面旁完成行程规划并实际下单，但支付环节由本人手动完成。
  job_en: A travel planner, when arranging a specific trip, works through real booking sites for flights
    and hotels, plans the itinerary beside a chat interface and actually places the booking, while completing
    payment manually.
  pain: 在多个真实网站之间反复切换、比价和填写信息，规划与预订被拆成两段，用户要自己搬运行程信息并重复操作，耗时且容易出错。
  pain_en: Switching among multiple real booking sites to compare and fill in information splits planning
    from booking; users must carry itinerary details themselves and repeat steps, which is slow and error-prone.
  current_alternative: 用户目前靠人工在浏览器多标签间比价、复制行程信息，或使用只给建议不实际操作的聊天式旅行助手。
  current_alternative_en: Users currently compare prices across browser tabs by hand, copy itinerary details,
    or use chat-based travel assistants that only give advice without acting.
  usage_reason: 相较人工多标签比价，它让代理在真实网站上直接执行搜索与填写，把规划到预订的搬运步骤交给代理完成，并在支付页停下保留用户对付款的控制；推断，对愿意让 AI 代操作但不愿交出支付权限的旅行规划者更有吸引力。
  usage_reason_en: Compared with manual multi-tab comparison, it lets the agent act directly on real websites
    to search and fill in, moving the planning-to-booking legwork to the agent while stopping at the payment
    page to keep the user in control of payment; this is an inference, and it appeals to travel planners
    willing to let AI operate but not to hand over payment authority.
