    along with notes and tag features.
  usage_reason: 推断：它把本地聊天记录直接变成可检索、可提醒的记忆层，省掉逐条翻找和手工登记这一步，因此高频用微信/QQ 跟进线索的人会尝试；但公开材料没有留存或复购证据，不能断言已被长期留在工作流里。
  usage_reason_en: 'Inference: it turns local chat logs into a searchable, reminder-capable memory layer,
    removing the manual scrolling and logging step, so people who chase leads over WeChat/QQ daily would
    try it; public material has no retention or repeat-use evidence, so long-term workflow adoption cannot
    be claimed.'
