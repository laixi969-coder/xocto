  market: ''
  job: 数据分析师或市场人员在拿到一份表格或数据集、需要对外讲清结论时，把原始数据交给 AI 与知识图谱处理，生成可分享的数据故事。
  job_en: Data analysts or marketers who receive a spreadsheet or dataset and need to explain conclusions
    externally hand the raw data to AI and a knowledge graph to produce a shareable data story.
  pain: 公开材料只有一句产品口号和官网自述，没有说明把数据变成叙事时具体卡在哪一步、耗时多久、不解决会有什么后果，痛点无法从公开事实还原。
  pain_en: Public material contains only a product tagline and a website self-description, with no account
    of where turning data into narrative actually stalls, how long it takes, or what happens if unsolved,
    so the pain cannot be reconstructed from public facts.
  current_alternative: 公开材料未说明用户此前用什么方式完成同一任务，无法确认它替代了哪一步旧做法。
  current_alternative_en: Public material does not state what users previously used to accomplish the
    same task, so it cannot be confirmed which prior step it replaces.
  usage_reason: 公开材料未给出产出样例、客户案例或定价，无法说明用户为什么会选择它而非现有做法，缺少可核对的因果链。
  usage_reason_en: No sample output, customer case, or pricing is public, so there is no verifiable causal
    chain explaining why a user would choose it over existing approaches.
