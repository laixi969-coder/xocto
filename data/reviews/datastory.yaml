  market: ''
  job: 数据分析师或市场人员在拿到一份表格或数据集后，需要把它整理成对外可讲、可分享的叙事材料。
  job_en: Data analysts or marketers who receive a spreadsheet or dataset and need to turn it into a shareable
    narrative for external audiences.
  pain: 把数据变成别人看得懂的故事通常要手工挑指标、配图表、写文案，反复改稿；但公开材料没有说明这一步具体卡在哪里、耗时多久。
  pain_en: Turning data into a story others understand usually means manually picking metrics, building
    charts, and writing copy through repeated revisions; public material does not say where exactly this
    step stalls or how long it takes.
  current_alternative: 现有做法是用 BI 工具或表格软件出图，再人工写解读文案，或交给设计做信息图。
  current_alternative_en: The current approach is charting in BI tools or spreadsheets, then writing the
    interpretation by hand or handing it to a designer for an infographic.
  usage_reason: 推断：若它能把原始数据直接转成带语义关系的叙事稿，用户可省去先出图再写文案的两步拼接；但公开材料未给出产出样例、客户案例或定价，无法确认这一步是否真的被减少。
  usage_reason_en: 'Inference: if it turns raw data directly into a narrative with semantic relations,
    users could skip stitching charts and copy together in two steps; but no sample output, customer case,
    or pricing is public, so it cannot be confirmed that this step is actually reduced.'
