  market: ''
  job: 电商或线上业务的客服人员在共享收件箱里处理买家咨询与售后邮件，需要逐条阅读、判断并回复，Sellio 让 AI 代理先接收来信并生成回复草稿，团队在同一处查看和跟进。
  job_en: Support staff at e-commerce or online businesses handle buyer inquiries and after-sales email
    in a shared inbox, reading, judging and replying one by one; Sellio has AI agents receive incoming
    messages and draft replies so the team reviews and follows up in one place.
  pain: 公开材料只给出产品定位，未直接描述客服痛点；从工作流结构推理，共享收件箱模式下咨询逐条人工阅读与撰写回复，回复速度受人力与在线时段限制，重复性问题占用客服时间，这是电商客服的常见刚性负担，但缺少用户抱怨或案例佐证。
  pain_en: Public material only gives the product positioning and does not directly describe the support
    pain; by workflow inference, in a shared-inbox model each inquiry is read and answered manually, reply
    speed is capped by staffing and online hours, and repetitive questions consume agent time — a common
    rigid burden in e-commerce support, though user complaints or cases are absent.
  current_alternative: 公开材料未说明替代方式；结构上团队此前应是用人工共享收件箱或帮助台软件逐条处理同一批咨询，AI 草稿环节此前由客服自己完成。
  current_alternative_en: Public material does not state the alternative; structurally, teams previously
    handled the same inquiries one by one in a manual shared inbox or helpdesk software, with the drafting
    step done by agents themselves.
  usage_reason: 推断：相较人工逐条撰写，Sellio 让 AI 代理先接收来信并生成回复，客服从“从零起草”变为“审阅与发送”，减少的是每条回复的起草负担；但 AI 读取哪些字段、是否需人工确认、交付形态均未公开，因此哪类客服会在什么情况下选择它仍属结构推断，缺少用户反馈佐证。
  usage_reason_en: 'Inference: versus drafting each reply manually, Sellio has AI agents receive messages
    and generate replies, shifting agents from drafting-from-scratch to review-and-send and cutting the
    per-reply drafting burden; however which fields the AI reads, whether human confirmation is required,
    and the delivery form are undisclosed, so which support teams choose it and when remains a structural
    inference without user feedback.'
