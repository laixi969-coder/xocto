    the host program
  pain: 公开材料只说明「零侵入、零依赖、双击无黑框、不改 DSH 一字节代码、升级不丢」，即安装与升级摩擦；但没有说明预设本身改变什么行为、解决使用者哪一步实际困难，也没有用户抱怨、issue 或案例佐证不采用会失去什么。
