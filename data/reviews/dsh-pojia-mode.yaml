  usage_reason_en: 'Inference: if a user really reinstalls DSH often and repeatedly loses custom presets,
    double-click installation saves the manual config edit and post-upgrade re-setup step; but public
    material gives no preset content, effect or user feedback, so it cannot be confirmed which users choose
    it for which checkable result — installation convenience alone is not rigid demand.'
