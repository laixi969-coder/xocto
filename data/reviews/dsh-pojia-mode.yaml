    user difficulty it removes, and no complaint, issue or case shows what is lost without it.
  current_alternative: DSH 使用者本可直接在工具内配置或切换 Agent 预设，或手动编辑配置文件、安装插件；公开材料未说明这些旧做法为何不够用，也未说明本预设相较它们多出什么。
