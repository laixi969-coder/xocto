    repositories one by one to filter manually; cross-repository search is especially slow, and without
    it people rely on memory or scattered bookmarks.
  current_alternative: 公开代码仓库 自带搜索、本地 ripgrep、IDE 全局查找，以及逐个克隆仓库后手工检索。
