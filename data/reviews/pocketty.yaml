  market: ''
  job: 运维与后端开发者在离开电脑、只带 iPhone 的情况下，通过 SSH 连到自己的服务器查看正在运行的 AI 代理，并在代理卡住或被阻塞时收到提醒，以便决定是否回到终端处理。
  job_en: An ops or backend developer away from a computer, using only an iPhone, SSHes into their own
    server to check running AI agents and gets pinged when an agent is blocked, so they can decide whether
    to return to a terminal.
  pain: 长时运行的 AI 代理会在无人值守时卡在确认、权限或错误提示上，任务静默停摆；开发者若不在电脑前就无从得知，只能事后发现整段时间被浪费。
  pain_en: Long-running AI agents stall on confirmations, permissions or errors while unattended, silently
    halting the task; a developer away from a computer has no way to know until they discover the wasted
    time afterwards.
  current_alternative: 目前多靠留在电脑前盯终端、用通用 SSH 客户端（如 Termius、Blink）手动连上查看，或干脆等回到工位再排查；这些方式都不会主动告知代理被阻塞。
  current_alternative_en: Today this is handled by staying at the desk watching the terminal, manually
    connecting with generic SSH clients such as Termius or Blink, or simply waiting until back at the
    workstation; none of these proactively tell you an agent is blocked.
  usage_reason: 推断：相较通用 SSH 客户端需要用户主动连上并逐屏翻看，Pocketty 把“代理被阻塞”这一状态变成主动推送，用户不必持续盯屏或反复手动连接，只需在收到提醒时打开手机处理，因此适合离开工位但仍需照看长时代理任务的开发者。
  usage_reason_en: 'Inference: unlike generic SSH clients that require the user to connect and scroll
    through screens, Pocketty turns the ''agent is blocked'' state into a proactive ping, so the user
    need not keep watching or repeatedly reconnect and only opens the phone when alerted; this suits developers
    who leave the desk but still need to supervise long-running agent tasks.'
