  market: ''
  job: 影视/广告后期人员拿到已拍摄的成片素材，需要把画面中指定的人物或物体替换成新形象，同时保留原始对白与音轨，交付可直接进入剪辑的替换镜头。
  job_en: Post-production artists working on film/advertising footage need to replace specific characters
    or objects in already-shot footage with new imagery while keeping the original dialogue and audio,
