  market: ''
  job: 影视/广告后期人员拿到一段已拍摄的成片素材，需要把其中某个人物或物体替换成新形象，于是导入本地 Web UI，用深度图、SAM 分割和人脸网格圈出替换区域，交给 Seedance 生成新画面，再带原始音频导出成片。
  job_en: A film/ad post-production artist takes already-shot footage, needs to replace a character or
    object with a new one, imports it into the local web UI, uses depth maps, SAM segmentation and face
    meshes to isolate the replacement region, sends it to Seedance to generate the new frames, and exports
    with the original audio.
  pain: 传统替换要么靠逐帧 Roto/抠像加合成，要么重拍或补拍，人工成本高、周期长；不解决就得在时间与预算上硬扛，或放弃替换创意。
  pain_en: Traditional replacement means frame-by-frame roto/keying plus compositing, or reshoots; leaving
    it unsolved forces teams to absorb the cost and schedule, or drop the replacement idea.
  current_alternative: 公开材料未直接描述用户现有做法；从任务结构推断，替代方式是手工 Roto/抠像合成、绿幕重拍，或直接用通用视频生成模型但缺少遮罩与音频对齐环节。
  current_alternative_en: Public materials do not directly describe current practice; structurally the
    alternatives are manual roto/keying compositing, green-screen reshoots, or generic video-generation
    models without mask and audio-alignment steps.
  usage_reason: 推断：相较手工逐帧抠像，它把深度图、SAM 分割和人脸网格串成一次自动圈选，并在同一界面里预览遮罩与生成结果、保留原声导出，减少的是逐帧描边与多工具来回切换的步骤，因此需要快速做人物/物体替换的后期人员会在有现成素材、不想重拍时选择它。
  usage_reason_en: 'Inference: versus manual frame-by-frame keying, it chains depth maps, SAM segmentation
    and face meshes into one automatic selection pass and previews masks and generations in the same UI
    with original-audio export, removing per-frame tracing and tool-switching, so post artists needing
    fast character/object replacement on existing footage would pick it over reshoots.'
