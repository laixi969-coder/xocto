  pain_en: Traditional replacement requires frame-by-frame roto and keying, or reshoots; mask edges, faces
    and depth mismatches cause visible artifacts, and rework is expensive.
  current_alternative: 公开材料未直接描述用户现有做法；从任务结构推断，替代方式是人工 roto/抠像加合成软件，或直接重拍、补拍，以及单独调用通用视频生成模型再手工对齐音轨。
  current_alternative_en: Public materials do not describe the current workflow directly; structurally,
    alternatives are manual roto/keying plus compositing, reshoots, or calling a generic video model and
    manually re-syncing audio.
  usage_reason: 推断：相较手工 roto 加通用生成模型再自行对齐音轨，该工作流用深度图、SAM 分割和人脸网格自动生成候选遮罩，并在本地 Web UI 内完成遮罩复核、生成预览与带原声导出，把“先抠像再对齐声音”的多步手工环节压缩到一次界面内确认，因此需要批量替换镜头又不想重拍的后期人员会尝试它。
  usage_reason_en: 'Inference: versus manual roto plus a generic video model with hand re-synced audio,
    this workflow auto-produces candidate masks from depth maps, SAM segmentation and face meshes, then
    lets users review masks, preview generations and export with original audio in one local UI, collapsing
    several manual steps into one review pass — which is why post artists facing many replacement shots
