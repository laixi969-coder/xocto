  market: ''
  job: 软件开发工程师在同一个代码库上分多次使用 Codex 改代码时，需要把前几次会话里已经确认的约定、文件结构和修改意图带进新会话，让模型接着往下改。
  job_en: A software developer using Codex across multiple sessions on the same codebase needs the conventions,
    file structure and change intent settled in earlier sessions to carry into a new session so the model
    can continue editing.
  pain: 编码助手默认不保留跨会话上下文，开发者每次都要重新粘贴文件、重述约定，长任务里重复交代的成本高，且容易漏掉之前定下的约束。
  pain_en: Coding assistants do not keep cross-session context by default, so developers re-paste files
    and restate conventions each time; on long tasks this repetition is costly and previously agreed constraints
    are easily dropped.
  current_alternative: 旧做法是手工维护项目说明文件、把关键上下文粘进每次提示，或依赖编辑器与仓库里已有的文档；也有人干脆把长任务压缩在一次会话里做完。
  current_alternative_en: The old approach is hand-maintained project notes, pasting key context into
    every prompt, or relying on existing editor and repository documentation; some simply compress long
    tasks into a single session.
  usage_reason: 相较每次手工重述上下文，它把历史会话与项目信息落到本地并按受控规则召回，减少重新交代约定这一步，且不把代码送进托管向量库；推断，对数据不能出本机、又需要跨会话连续改代码的开发者更有吸引力。
  usage_reason_en: Compared with restating context by hand each time, it stores past sessions and project
    information locally and recalls them under governed rules, removing the step of re-explaining conventions
    and avoiding a hosted vector database; this is an inference, and it appeals most to developers whose
    code cannot leave the machine yet who need continuous cross-session editing.
