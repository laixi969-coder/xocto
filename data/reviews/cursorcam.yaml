    interaction path clear, which normally means recording, editing and adding zoom effects themselves.
  pain: 人工录屏加剪辑耗时，且每次界面改动都要重录；演示视频又直接影响客户理解和成交。
  pain_en: Manual recording and editing is time-consuming, must be redone after every UI change, and demo
    videos directly affect client understanding and closing.
  current_alternative: 开发者用录屏软件手动操作，再在剪辑软件里加放大和字幕，或干脆不提供视频。
  current_alternative_en: Developers operate screen recorders manually, then add zooms and captions in
    editing software, or skip video entirely.
  usage_reason: 推断：代理直接点击页面并输出带点击放大的 MP4，省去录屏和剪辑两步，开发者只需检查成品；适合频繁改版、需要反复出演示的独立开发者和小团队。
  usage_reason_en: 'Inference: the agent clicks through the page and outputs an MP4 with zoomed clicks,
    removing the record and edit steps so developers only review the result; suits indie developers and
    small teams who ship changes often and need repeated demos.'
