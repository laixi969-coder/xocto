  market: ''
  job: 同时维护多个 Claude Code 账号的开发者或小团队，在接到一个较大的编码任务时，需要把任务拆开、分派给多个智能体并行执行，并避免撞上账号的 5 小时与每周额度上限。
  job_en: Developers or small teams running several Claude Code accounts who, when given a larger coding
    task, need to split it, dispatch it to multiple agents in parallel, and avoid hitting each account's
    5-hour and weekly quota ceilings.
  pain: 额度是硬约束，手工在多个账号间切换、盯着用量、手动拆任务既费时又容易中断，任务一多就排不过来。
  pain_en: Quotas are a hard constraint; manually switching between accounts, watching usage, and splitting
    tasks by hand is slow and easily interrupted, and the queue breaks down as tasks pile up.
  current_alternative: 现在多数人靠手动开多个终端或会话、自己记额度、用脚本拼凑并行，没有统一的调度与限速。
  current_alternative_en: Today most people open several terminals or sessions by hand, track quotas themselves,
    and glue parallelism together with scripts, with no unified scheduling or rate limiting.
  usage_reason: 相较手动切账号和盯额度，它把“拆任务—分派—按真实额度限速”合成一个动作，减少的是反复查看用量和手工排期这一步，因此同时跑多个编码任务、又常被额度打断的开发者会选它；这是基于产品能力的工作流推断，尚无留存或复购证据。
  usage_reason_en: Compared with manually switching accounts and watching quotas, it merges splitting,
    dispatching, and real-quota rate limiting into one action, removing the step of repeatedly checking
    usage and hand-scheduling; that is why developers running several coding tasks at once and often blocked
    by quotas would pick it. This is workflow inference from product capability, with no retention or
    repeat-use evidence yet.
