  market: ''
  job: 独立开发者或小团队负责人在预算有限、需要同时推进需求拆解、编码和自测时，处理产品需求与代码库，要完成一个可运行、可验收的软件版本。
  job_en: An independent developer or small-team lead with a limited budget, handling product requirements
    and a codebase while pushing requirement breakdown, coding and self-testing forward, aiming to deliver
    a runnable, reviewable software release.
  pain: 多代理开发容易两头失衡：全用旗舰模型两天烧穿预算，全用便宜模型规划混乱；人工还要反复对齐方案、返工和盯进度。
  pain_en: 'Multi-agent development easily tips to one extreme: all flagship models burn the budget in
    two days, all cheap models produce chaotic planning, and humans still spend time aligning plans, reworking
    and chasing progress.'
  current_alternative: 开发者自己用单一模型加脚本手工编排，或直接雇人、外包，靠人工评审和版本管理控制质量。
  current_alternative_en: Developers hand-orchestrate a single model with scripts, or hire people or outsource,
    controlling quality through manual review and version management.
  usage_reason: 推断：相较手工编排，Munk AI 把预算按角色分层并写入系统提示词，让规划、编码、自测各自绑定模型与验收标准，减少人工在模型切换和进度对齐上的操作；但公开材料只到实验日志，尚无重复使用或交付结果证据。
  usage_reason_en: 'Inference: versus manual orchestration, Munk AI tiers the budget by role and writes
    it into system prompts, binding planning, coding and self-testing to specific models and acceptance
    criteria, cutting manual model-switching and progress-alignment work; public material stops at experiment
    logs, with no evidence of repeated use or delivered results.'
