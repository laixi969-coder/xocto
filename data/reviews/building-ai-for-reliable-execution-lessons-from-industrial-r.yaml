  market: ''
  job: 工厂自动化工程师在产线换型或新增工位时，处理机械臂示教、视觉标定与任务参数材料，完成新工位的部署与调试。
  job_en: Factory automation engineers handle robot teaching, vision calibration and task parameter materials
    during line changeovers or new workcells, to deploy and debug the new station.
  pain: 传统工业机械臂每换一个任务都要重新示教和标定，依赖稀缺的集成工程师，换型停机时间长；招工难使老办法越来越难维持。
  pain_en: Traditional industrial arms require re-teaching and recalibration for every task change, depend
    on scarce integrators, and cause long changeover downtime; hiring difficulty makes the old approach
    harder to sustain.
  current_alternative: 由系统集成商上门做示教与编程，或采购固定程序的专机，换型时再请人重做。
  current_alternative_en: System integrators visit to teach and program the arm, or the plant buys fixed-program
    special-purpose machines and calls someone back in at each changeover.
  usage_reason: 推断：相较集成商上门逐点示教，客户用自身演示数据微调共享基座模型，可减少重新编程这一步，并把适配工作留在厂内；因此换型频繁、缺少集成工程师的中小制造厂会在新增工位时优先考虑它。
  usage_reason_en: 'Inference: compared with integrators teaching point by point on site, adapting a shared
    base model with the customer''s own demonstrations removes the reprogramming step and keeps adaptation
    in-house; plants with frequent changeovers and no in-house integrators would therefore consider it
    first when adding a workcell.'
