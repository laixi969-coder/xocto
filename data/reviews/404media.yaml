  market: ''
  job: 酒店前台或预订专员在夜间或高峰时段接到订房电话和住客临时请求（延迟入住、加床、维修）时，需要把这些信息准确分派给客房、维修或前台同事并确认完成。
  job_en: A hotel front desk or reservations agent receiving booking calls and last-minute guest requests
    (late check-in, extra bed, repairs) during night shifts or peak hours must route that information
    accurately to housekeeping, maintenance or front desk colleagues and confirm completion.
  pain: 电话与请求分散在多个渠道，人工记录容易漏单或转达延迟，住客等待时间长；夜班人手少时更明显。
  pain_en: Calls and requests are scattered across channels, manual logging easily drops or delays them,
    and guests wait longer, especially with thin night-shift staffing.
  current_alternative: 目前多靠前台人工接听、纸质或表格记录，再用对讲机、电话或微信群转达给相关岗位。
  current_alternative_en: 'Today this is mostly manual: front desk staff answer, log on paper or a spreadsheet,
    then relay to the relevant role by radio, phone or group chat.'
  usage_reason: 相较人工记录再转达，智能体直接接住电话与请求并生成已分派的工单，省掉“先记下来再转述”这一步，减少漏单和转达延迟；人手紧张的夜班与中小酒店更可能选择它。这是基于产品能力与任务结构的推断，尚无留存或复购证据。
  usage_reason_en: Compared with logging then relaying by hand, the agent takes the call or request and
