  market: ''
  job: 在 Divar 上找房或找二手货的人，面对大量分类广告，需要快速筛出符合条件、价格可比的少数候选。
  job_en: People hunting homes or second-hand goods on Divar face a large volume of classified ads and
    need to quickly narrow down a few comparable candidates.
  pain: 逐条翻看和手动比价耗时，广告信息格式不统一，容易漏掉合适选项。
  pain_en: Scrolling ad by ad and comparing manually is time-consuming, ad formats are inconsistent, and
    suitable options are easily missed.
  current_alternative: 在平台内用关键词搜索、按价格排序，或自己开表格记录对比。
  current_alternative_en: Using keyword search and price sorting inside the platform, or keeping a spreadsheet
    to track comparisons.
  usage_reason: 推断：相较手动翻页，它让 AI 助手直接调用只读接口完成检索与对比，省去逐条打开和抄录价格这一步，因此常在同一平台反复找房或找货的人会先试用它。
  usage_reason_en: 'Inference: compared with manual paging, it lets an AI assistant call a read-only interface
    to retrieve and compare, removing the step of opening each ad and copying prices, so people who repeatedly
    search the same platform are likely to try it first.'
