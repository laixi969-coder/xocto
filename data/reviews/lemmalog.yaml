  market: ''
  job: Agent 开发者在构建多步、多会话的 LLM agent 时，需要把对话与工具调用中产生的事实、规则和推理结论持久化，并让同一 harness 或多个 agent 共享同一份可查询、可追溯的记忆。
  job_en: Agent developers building multi-step, multi-session LLM agents need to persist facts, rules
    and derived conclusions produced by dialogue and tool calls, and let the same harness or multiple
    agents share one queryable, traceable memory.
  pain: 公开材料显示现有做法把记忆交给向量库或键值存储，事实之间缺乏逻辑一致性，冲突难以发现，推导结果无法溯源；lemmalog 用分层规则、带溯源事实和增量推导来应对这一缺口，但公开材料未给出用户抱怨或采用数据，痛点强度属工作流结构推理。
  pain_en: Public materials show memory is typically delegated to vector or key-value stores, where facts
    lack logical consistency, conflicts are hard to detect and derived conclusions cannot be traced; lemmalog
    addresses this with stratified rules, provenance-tracked facts and incremental derivation, but no
    user complaints or adoption data are public, so pain intensity is a workflow-structure inference.
  current_alternative: 开发者目前用向量数据库、图数据库或简单键值存储保存 agent 记忆，或把上下文直接塞回 prompt；这些做法不提供分层规则、事实溯源和增量推导。
  current_alternative_en: Developers currently keep agent memory in vector databases, graph databases
    or simple key-value stores, or stuff context back into the prompt; none of these provide stratified
    rules, fact provenance or incremental derivation.
  usage_reason: 推断：相较把记忆塞进向量库或 prompt，lemmalog 通过 MCP 服务器把事实与规则以 Datalog 形式暴露给 harness，并在 provider 出错时降级为零事实、按
    episode id 记忆化、以制表符快照保存规则与基础事实，使开发者能核对某条结论由哪些事实推出，因此需要可审计推理链的 agent 开发者会在调试或合规场景下选择它。
  usage_reason_en: 'Inference: versus stuffing memory into a vector store or prompt, lemmalog exposes
    facts and rules to the harness as Datalog over an MCP server, degrades to zero facts on provider errors,
    memoizes by episode id and persists rules and base facts as tab-separated snapshots, so developers
    can check which facts a conclusion derives from; agent developers needing an auditable reasoning chain
    would pick it for debugging or compliance scenarios.'
