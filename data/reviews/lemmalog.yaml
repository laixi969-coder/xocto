  market: ''
  job: Agent 开发者在构建需要跨会话、跨工具共享状态的 LLM agent 时，处理对话事实、工具调用结果与业务规则等材料，要完成的任务是让 agent 的记忆具备逻辑一致性、可追溯来源，并在新事实到来时增量更新推导结论，而不是每次全量重算或让模型凭上下文猜测。
  job_en: Agent developers building LLM agents that share state across sessions and tools work with conversation
    facts, tool-call results and business rules, and must make agent memory logically consistent, provenance-traceable,
    and incrementally re-derived as new facts arrive, instead of recomputing everything or letting the
    model guess from context.
  pain: 公开材料显示该产品针对的是 agent 记忆缺乏逻辑一致性与溯源的问题：向量检索式记忆无法表达分层规则，事实之间可能冲突，推导结论无法回溯到来源，新增事实后也难以只更新受影响的部分。这是从产品能力与
    agent 工作流结构推出的痛点，公开证据未包含用户抱怨原文。
  pain_en: 'The public material positions the product against agent memory that lacks logical consistency
    and provenance: vector-retrieval memory cannot express stratified rules, facts may conflict, derived
    conclusions cannot be traced to sources, and new facts cannot be propagated to only the affected derivations.
    This pain is inferred from product capability and agent workflow structure; the public evidence contains
    no verbatim user complaints.'
  current_alternative: 当前替代方式包括向量数据库加 RAG、图数据库、简单键值存储或直接把历史塞进上下文窗口；这些做法能存事实，但缺少分层规则求值、溯源与增量推导，一致性靠提示词和人工约定维持。
  current_alternative_en: Current alternatives include vector databases with RAG, graph databases, simple
    key-value stores, or stuffing history into the context window; these can store facts but lack stratified
    rule evaluation, provenance and incremental derivation, leaving consistency to prompts and manual
    convention.
  usage_reason: 推断：相较向量库或图库的旧做法，lemmalog 通过 Datalog 分层规则对事实求值、为每条推导保留溯源、并在新增事实时只做增量推导，把“人工核对哪些结论受影响、重新拼上下文”这一步交给引擎；因此当
    agent 需要可审计、可解释的共享记忆时，开发者会选它。公开证据未包含用户反馈，故这是基于产品能力的推断。
  usage_reason_en: 'Inference: versus vector or graph stores, lemmalog evaluates facts with stratified
    Datalog rules, keeps provenance for each derivation, and performs incremental derivation when facts
    are added, moving the step of manually checking which conclusions are affected and rebuilding context
    into the engine; developers would choose it when an agent needs auditable, explainable shared memory.
    Public evidence contains no user feedback, so this is an inference from product capability.'
