  usage_reason_en: 'Inference: unlike vector retrieval that only returns similar snippets, lemmalog computes
    conclusions via stratified rules and incremental derivation, keeps provenance and confidence annotations
    per fact, and exposes them to the harness as a shared brain over MCP; thus agent developers needing
