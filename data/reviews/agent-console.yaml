  usage_reason_en: 'Inference: compared with manually stitching per-tool, per-machine numbers, it automatically
    aggregates session data from the local machine and a self-hosted team hub into one view, removing
    the cross-machine collection and alignment step and making cost checkable by machine and session;
    therefore leads and platform engineers who must account for agent spend or constrain usage via policy
    hooks would choose it when rolling agents out across a team.'
