  market: ''
  job: 研发团队负责人或平台工程师在多个成员、多台机器上跑 Claude Code、Codex 会话后，需要汇总这些会话的 token、缓存、模型与花费，用于成本核算或对外说明。
  job_en: An engineering lead or platform engineer who runs Claude Code and Codex sessions across several
    members and machines needs to aggregate those sessions' tokens, cache, models and cost for cost accounting
    or external reporting.
  pain: 编码代理的用量分散在各人各机，费用和模型使用情况没有统一账本，团队无法回答这个月代理花了多少、花在哪个项目上。
  pain_en: Coding-agent usage is scattered across people and machines with no unified ledger, so a team
    cannot answer how much agents cost this month or which project consumed it.
  current_alternative: 旧做法是各人自己看终端输出或供应商后台，靠人工截图、表格汇总，或干脆不统计。
  current_alternative_en: The old approach is each person checking terminal output or a vendor dashboard,
    manually collating screenshots and spreadsheets, or simply not tracking at all.
  usage_reason: 相较人工汇总，它把每次会话的 token、缓存、模型和花费自动归集到同一视图，省掉逐人逐机收集这一步，因此需要按代理用量核算成本或向客户交代的团队会在多机多会话场景下选择它；这是基于产品能力的推断。
  usage_reason_en: Compared with manual collation, it automatically aggregates each session's tokens,
    cache, models and cost into one view, removing the step of collecting data person by person and machine
    by machine, so teams that must account for agent usage or explain it to clients would choose it in
    multi-machine, multi-session settings; this is an inference from product capability.
