  market: ''
  job: AI 应用评测工程师在智能体改版或换模型后，需要拿旧的成功操作记录重建一套可重复执行的评测任务，确认新版本没有把原来跑通的流程弄坏。
  job_en: An AI application evaluation engineer, after an agent is changed or its model swapped, needs
    to rebuild repeatable evaluation tasks from old successful run traces to confirm the new version did
    not break workflows that used to work.
  pain: 智能体的成功往往只留下一次运行记录，环境一变就无法复现，回归只能靠人工重跑或凭印象判断，改版后是否退化说不清。
  pain_en: A successful agent run usually leaves only a single trace that cannot be reproduced once the
    environment changes, so regression relies on manual reruns or impressions, and whether a release degraded
    is unclear.
  current_alternative: 现在多靠人工重跑、临时脚本或截图记录来核对智能体是否还能完成任务。
  current_alternative_en: Today teams mostly rely on manual reruns, ad hoc scripts, or screenshots to
    check whether an agent still completes its task.
  usage_reason: 推断：它把已有的成功操作记录直接转成可重置的评测任务，省掉从零编写测试用例这一步，因此已经在跑智能体、又缺少回归手段的团队会在改版前选择它。
  usage_reason_en: 'Inference: it converts an existing successful trace directly into a resettable evaluation
    task, removing the step of writing test cases from scratch, so teams already running agents without
    regression coverage would pick it up before a release.'
