  market: ''
  job: 制造业采购或质量工程师在接到新零件图纸、需要找到能按公差加工的供应商并拿到可比较报价时，处理图纸、规格书与供应商产能信息，完成询价、比价与下单跟进。
  job_en: A manufacturing procurement or quality engineer receiving a new part drawing needs to find suppliers
    able to hold the tolerances and obtain comparable quotes, working from drawings, spec sheets and supplier
    capacity information to complete RFQ, comparison and order follow-up.
  pain: 图纸信息靠人工读取，供应商能力靠个人经验和电话邮件确认，询价周期长、报价口径不一，选错供应商会造成返工与交期延误。
  pain_en: Drawing data is read manually and supplier capability is confirmed by personal experience plus
    phone and email, so quoting cycles are long, quotes are not comparable, and a wrong supplier choice
    causes rework and delays.
  current_alternative: 采购员用邮件和表格向熟悉的加工厂逐一询价，靠老师傅经验判断工艺可行性，用Excel比对报价。
  current_alternative_en: Buyers email and spreadsheet RFQs to known shops one by one, rely on veteran
    judgment for process feasibility, and compare quotes in Excel.
  usage_reason: 推断：相较逐家邮件询价，系统先解析图纸并筛出具备对应工艺能力的供应商，把“找谁能做”这一步从人工经验判断变成可检索的匹配结果，因此缺少稳定供应商网络的中小制造企业采购更可能选择它；公开材料未提供客户留存或复购证据。
  usage_reason_en: 'Inference: versus emailing shops one by one, the system first parses the drawing and
    filters suppliers with the matching process capability, turning ''who can make this'' from personal
    judgment into a searchable match, so buyers at smaller manufacturers without a stable supplier network
    are more likely to choose it; public materials provide no retention or repeat-use evidence.'
