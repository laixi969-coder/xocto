  market: ''
  job: 企业法务人员在业务部门提交合同、合规或咨询请求时，处理邮件、表单等零散请求材料，完成接收、分类并分派给合适的法务人员。
  job_en: In-house legal staff handle scattered email and form requests when business teams submit contract,
    compliance or advisory requests, receiving, classifying and routing them to the right lawyer.
  pain: 请求散落在邮件和表单中，靠人工阅读判断类型和优先级，容易漏单、重复沟通，响应时间不可控。
  pain_en: Requests are scattered across email and forms and are read manually to judge type and priority,
    so items get missed, communication repeats and response time is unpredictable.
  current_alternative: 法务人员手工翻邮件、用共享表格或工单系统登记，再凭经验分派；部分团队由助理或 paralegal 做前置筛选。
  current_alternative_en: Lawyers manually scan email, log items in shared spreadsheets or ticketing tools
    and route by experience; some teams use assistants or paralegals for front-line screening.
  usage_reason: 推断：相较手工翻邮件和表格登记，若该产品能在请求进入时自动读取内容并完成分类与分派，可减少法务人员逐条阅读和登记这一步负担，因此请求量大、业务部门多的企业法务团队会在入口环节选择它；候选未提供功能细节，此判断基于产品定位的结构推理。
  usage_reason_en: 'Inference: compared with manually scanning email and logging in spreadsheets, if the
    product reads incoming requests and classifies and routes them automatically, it removes the step
    of reading and logging each item one by one, so in-house teams with high request volume and many business
    units would choose it at the intake step; the candidate gives no feature detail, so this rests on
    structural reasoning about the product''s positioning.'
