  market: ''
  job: 律师或法务在准备诉讼或尽调材料时，需要把成批 PDF 证据按 Bates 规则逐页连续编号，形成可提交的编号版文件。
  job_en: When preparing litigation or due diligence materials, a lawyer or legal ops staffer needs to
    stamp batches of PDF evidence with sequential Bates numbers page by page, producing a submittable
    numbered file.
  pain: 手工逐页编号或依赖桌面软件既慢又容易断号，而把敏感案卷上传到云端工具又触碰保密要求，这是法律材料整理中反复出现的负担。
  pain_en: Numbering page by page by hand or with desktop software is slow and prone to broken sequences,
    while uploading sensitive case files to a cloud tool conflicts with confidentiality requirements,
    a recurring burden in legal document preparation.
  current_alternative: 旧做法是 Adobe Acrobat 等桌面软件批量编号，或由助理手工加页码再核对；部分团队用云端 PDF 工具但需承担上传风险。
  current_alternative_en: The old practice is batch numbering in desktop software such as Adobe Acrobat,
    or an assistant adding page numbers by hand and checking them; some teams use cloud PDF tools but
    accept the upload risk.
  usage_reason: 相较桌面软件需要安装配置、云端工具需要上传，它在浏览器里直接完成编号并声明文件留在本地，省去安装与上传审批这两步，因此对案卷不能外传的律所和法务更有吸引力；这是基于产品声明的推断。
  usage_reason_en: Compared with desktop software that needs installing and configuring, or cloud tools
    that require uploading, it numbers files directly in the browser and states files stay local, removing
    the install step and the upload-approval step, which appeals to firms and legal teams whose case files
    cannot leave the office; this is an inference from the product's claims.
