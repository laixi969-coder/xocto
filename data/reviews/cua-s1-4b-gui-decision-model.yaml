  market: ''
  job: 做 GUI 自动化的开发者，在程序需要决定点击哪个界面元素、执行什么动作时，把当前界面截图交给模型，得到元素与动作的配对打分，据此选出下一步操作。
  job_en: A GUI automation developer, when the program must decide which interface element to click and
    what action to take, feeds the current screenshot to the model and receives scored (element, action)
    pairs to pick the next step.
  pain: 界面自动化里“下一步点哪里”通常靠规则脚本或大模型整页推理，规则脆弱、大模型调用贵且慢；公开材料未说明该模型是否真的降低了这一步的出错率或成本。
  pain_en: In UI automation, deciding the next click usually relies on brittle rule scripts or expensive,
    slow full-page model reasoning; the public material does not show whether this model actually lowers
    error rate or cost at that step.
  current_alternative: 手写选择器与规则脚本，或调用通用多模态大模型对整页截图做推理后输出动作。
  current_alternative_en: Hand-written selectors and rule scripts, or calling a general multimodal model
    to reason over a full-page screenshot and emit an action.
  usage_reason: 推断：若单次前向打分在延迟和成本上确实低于整页大模型推理，开发者会在高频、界面结构稳定的流程里用它替换整页推理这一步；但缺少评测与采用证据，无法确认它已被留在工作流中。
  usage_reason_en: 'Inference: if single-pass scoring is genuinely cheaper and faster than full-page model
    reasoning, developers would use it to replace that step in high-frequency, structurally stable flows;
    without benchmarks or adoption evidence, it cannot be confirmed as retained in any workflow.'
