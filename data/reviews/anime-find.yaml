  market: ''
  job: 追番用户在 DeepSeek 对话中聊到某部番剧时，需要当场确认片名、评分与详情，并拿到可用的片源链接；anime-find 作为插件在对话内多源搜索，用卡片展示 Bangumi 评分与详情，并支持复制磁力链接。
  job_en: An anime viewer chatting in DeepSeek about a show needs to confirm the title, rating, and details
    on the spot and obtain a usable source link; anime-find works as a plugin that searches multiple sources
    inside the conversation, shows Bangumi ratings and details in a card, and supports copying magnet
    links.
  pain: 公开材料显示其把“多源搜索 + 评分详情 + 复制磁力”收进对话内一步完成，针对的痛点是：用户需在聊天窗口与番剧数据库、资源站之间反复切换、手动比对片名与评分、再单独找片源。公开证据未给出切换耗时或失败率的量化数据，痛点强度属工作流结构推理。
  pain_en: Public materials show it consolidates multi-source search, rating details, and magnet copying
    into one step inside the chat, targeting the pain of switching repeatedly between the chat window,
    anime databases, and resource sites, manually matching titles and ratings, then hunting for a source
    separately. Public evidence gives no quantified switching time or failure rate, so pain intensity
    is a workflow-structure inference.
  current_alternative: 当前替代方式包括：在浏览器另开 Bangumi 或番剧数据库查评分、在资源站或磁力搜索站单独找片源、再手动复制链接回聊天窗口；公开材料未说明用户具体如何替代，也未提供对比数据。
  current_alternative_en: Current alternatives include opening Bangumi or anime databases in a separate
    browser tab for ratings, searching resource or magnet sites separately for a source, then manually
    copying the link back into the chat; public materials do not describe how users actually substitute
    today, nor provide comparison data.
  usage_reason: 相较在聊天窗口与外部站点之间来回切换，anime-find 通过“对话内多源搜索并以卡片展示 Bangumi 评分与详情、支持复制磁力”这一具体动作，省去另开页面查评分和单独找片源的那一步；因此正在
    DeepSeek 里聊番、想立刻确认评分并带走片源的追番用户会在该场景下选择它。此为基于产品能力与任务结构的推断，尚无用户反馈或留存证据支持。
  usage_reason_en: Compared with switching back and forth between the chat window and external sites,
    anime-find's specific action of searching multiple sources inside the conversation, showing Bangumi
    ratings and details in a card, and supporting magnet copying removes the step of opening another page
    for ratings and separately finding a source; anime viewers chatting in DeepSeek who want to confirm
    a rating and take away a source link would therefore choose it in that situation. This is an in
