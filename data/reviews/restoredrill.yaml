  pain: 备份任务显示成功并不等于可恢复，恢复失败往往在真正出事时才暴露，代价是数据丢失与业务中断；这是从工具定位推导的痛点，材料未提供事故案例。
  pain_en: A successful backup job does not mean a restorable backup, and restore failure often surfaces
