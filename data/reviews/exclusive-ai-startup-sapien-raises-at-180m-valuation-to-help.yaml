    is slow, attribution conclusions get challenged, and review cycles stretch out.
  current_alternative: 目前靠 Excel 加 BI 看板手工拼表，或由咨询顾问做一次性归因分析。
  current_alternative_en: Today it relies on Excel plus BI dashboards assembled by hand, or one-off attribution
    analysis by consultants.
  usage_reason: 相较手工拼表，它直接读取经营数据并输出归因结论，省掉跨系统取数与对账这一步；推断财务团队会在月度复盘时选择它，但候选材料未给出任何用户使用或付费证据，需求强度无法确认。
