    the host cannot tell on the spot where the audience stands.
  current_alternative: 举手提问、纸质问卷、事后在线表单，或把问题留在聊天窗口里人工统计。
  current_alternative_en: Raised hands, paper forms, post-event online surveys, or leaving questions in
    a chat window and counting them by hand.
  usage_reason: 推断：相较举手和事后问卷，它把回答入口放到听众手机上并当场汇总成图表，省掉人工点数与事后整理这一步，因此高频开课或办会的培训师与活动组织者会在需要即时反馈时选它。
  usage_reason_en: 'Inference: versus raised hands and post-event surveys, it puts the answer entry on
    audience phones and aggregates results into charts on the spot, removing the manual tally and after-the-fact
    cleanup, so trainers and event organizers who run sessions frequently choose it when they need immediate
