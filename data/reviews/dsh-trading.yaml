  market: ''
  job: 交易员或量化分析师在同时盯加密货币、美股、A股和港股时，把多市场行情与账户数据接入一个终端，让 AI 基于这些数据生成交易建议，并在人工逐笔批准后执行实盘订单。
  job_en: A trader or quant analyst watching crypto, US, CN and HK markets connects multi-market quotes
    and account data into one terminal, has an AI generate trade suggestions from that data, and executes
    live orders only after per-order human approval.
  pain: 公开材料支持的结构性痛点是：跨市场交易需要在多个行情源、券商客户端和自建脚本之间来回切换，数据源接口各不相同且难以替换；把 AI 接入实盘又缺少默认隔离与逐笔确认，误单风险高。项目用 19+
    可热插拔连接器、三栏统一界面和默认 dry-run 加逐笔人工批准来对应这两点，属于工作流结构推理，尚无用户抱怨或案例直接佐证。
  pain_en: 'The structural pain supported by public materials: cross-market trading forces switching among
    multiple quote sources, broker clients and self-built scripts, with heterogeneous and hard-to-swap
    data connectors; wiring AI into live trading lacks default isolation and per-order confirmation, raising
    misfire risk. The project answers this with 19+ hot-swappable connectors, a unified three-column GUI,
    and dry-run by default plus per-order human approval. This is workflow-structur'
  current_alternative: 旧做法是同时开着多个券商与行情客户端、用自建脚本或表格拼接数据，或直接使用单一市场的交易终端；AI 辅助则多靠通用聊天工具离线分析后再手工下单。公开材料未说明这些替代方式的具体使用比例。
  current_alternative_en: The old way is running several broker and quote clients at once, gluing data
    together with self-built scripts or spreadsheets, or using a single-market terminal; AI help usually
    means offline analysis in a general chat tool followed by manual order entry. Public materials do
    not show how widely these alternatives are used.
  usage_reason: 推断：相较在多个客户端与脚本间手工搬运数据，该产品把多市场数据源收敛到一个三栏界面并允许热插拔替换连接器，减少的是逐市场切换与改接口这一步；相较让 AI 直接下单，默认 dry-run
