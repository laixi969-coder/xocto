  next_validation: 收集 Skisso 官方产品文档或演示，确认改动差异的交付形式以及工程侧能否直接采用。
  market: ''
  job: 产品设计师或前端工程师在线上界面已经运行、需要按设计系统改动时，直接在运行中的 UI 上编辑，并把改动差异交给工程侧。
  job_en: A product designer or front-end engineer, when a live interface is running and needs a change
    under the design system, edits directly on the running UI and hands the diff to engineering.
  pain: 公开材料只有一句编辑线上 UI 并交接差异，没有说明原来设计与前端如何对稿、卡在哪一步、不采用会失去什么，痛点无法从现有事实还原。
  pain_en: The public material says only that you edit the live UI and hand off the diff; it does not
    say how design and front-end previously reconciled changes, where the friction was, or what is lost
    without it, so the pain cannot be reconstructed.
  current_alternative: 公开材料未说明现有替代方式，按常识可能是设计稿加人工标注再交前端实现，但这一点属推断，未经材料支持。
  current_alternative_en: The public material does not state the current alternative; by common practice
    it may be static mocks with manual annotation handed to front-end for implementation, but this is
    inference, not supported by the material.
  usage_reason: 推断：若改动差异能被工程直接采用，设计师就不必先在静态稿里画一遍、再由前端翻译成代码，从而省掉一次对稿；但公开材料未说明 AI 具体做了什么、差异以什么形式交付，因此这一理由尚未被事实支持。
  usage_reason_en: 'Inference: if the diff can be adopted directly by engineering, designers would skip
    drawing it in a static mock first and having front-end translate it into code, saving one reconciliation
    round; however the material does not say what AI does or in what form the diff is delivered, so this
    reason is not yet fact-supported.'
