  market: ''
  job: 开发者在本地环境里用上下文窗口有限的模型处理代码任务时，需要把工具、技能和钩子串起来，让代理在终端里完成一次可复现的改动。
  job_en: A developer working locally with a context-limited model needs to chain tools, skills and hooks
    so an agent can complete a reproducible change in the terminal.
  pain: 上下文受限的模型在长代码任务中容易丢信息，开发者要手工拼接上下文与工具调用；材料未给出用户抱怨，痛点强度属结构推断。
  pain_en: Context-limited models lose information on long coding tasks, forcing developers to manually
    stitch context and tool calls; the material gives no user complaints, so pain intensity is a structural
    inference.
  current_alternative: 旧做法是直接用通用编码助手或手工在终端里拼命令与脚本，上下文管理靠人；这是推断，材料未列出替代工具。
  current_alternative_en: The old approach is using a general coding assistant or manually assembling
    commands and scripts in the terminal, with humans managing context; this is inference, as the material
    lists no alternatives.
  usage_reason: 相较手工拼接，它把工具、技能与钩子做成可组合单元，减少每次任务重新搭上下文这一步，因此本地部署且模型上下文受限的开发者会在终端里选它；这是基于能力的推断。
  usage_reason_en: Compared with manual stitching, it makes tools, skills and hooks composable units,
    removing the step of rebuilding context per task, so developers running locally with context-limited
    models would pick it in the terminal; this is capability-based inference.
