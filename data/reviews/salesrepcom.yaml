  market: ''
  job: 销售代表在客户询价、需要当天给出报价并持续跟进时，把产品价格与客户需求交给 AI 销售代理，生成实时报价并自动发送跟进消息。
  job_en: Sales reps, when a customer asks for pricing and a same-day quote plus follow-up is needed,
    hand product prices and requirements to an AI sales rep that generates live quotes and sends follow-ups.
  pain: 报价依赖人工查价目表、算折扣、写邮件，响应慢；跟进靠人记，漏跟进直接丢单。
  pain_en: Quoting depends on manually checking price lists, calculating discounts and writing emails,
    which is slow; follow-up relies on memory, and missed follow-ups lose deals outright.
  current_alternative: 销售手工查 Excel 价目表、用邮件模板回复，靠 CRM 提醒或自己记待办跟进。
  current_alternative_en: Reps manually check Excel price lists, reply with email templates, and rely
    on CRM reminders or personal to-do lists for follow-up.
  usage_reason: 推断：相较手工查表加模板邮件，它把“查价—算价—发报价—排跟进”合并成一次自动动作，减少报价环节的等待与漏跟进，因此询价量大、销售人手紧的中小分销或配件商会在客户询价高峰时选择它。
  usage_reason_en: 'Inference: versus manual lookups plus template emails, it merges ''look up price,
    calculate, send quote, schedule follow-up'' into one automated action, cutting waiting time and missed
    follow-ups, so small distributors or parts suppliers with high inquiry volume and thin sales teams
    choose it during inquiry peaks.'
