  market: ''
  job: 后端或 DevOps 工程师在持续集成流水线失败时，面对构建日志和失败用例，需要定位原因并提交一个能通过验证的修复。
  job_en: A backend or DevOps engineer facing a failed CI pipeline, with build logs and failing tests,
    needs to locate the cause and submit a fix that passes verification.
  pain: 失败日志冗长、复现环境搭建耗时，修复后还要反复重跑流水线确认，占用大量等待时间。
  pain_en: Failure logs are long, reproducing the environment is slow, and after fixing, the pipeline
    must be re-run repeatedly to confirm, consuming long waiting time.
  current_alternative: 人工阅读日志、本地复现、手写补丁并反复推送触发流水线重跑。
  current_alternative_en: Reading logs manually, reproducing locally, writing the patch by hand and pushing
    repeatedly to re-trigger the pipeline.
  usage_reason: 推断：它把读日志、生成补丁和重跑验证串成一次自动流程，工程师不必自己复现和反复推送，直接拿到已被验证的补丁，因此流水线频繁失败的中小研发团队会优先试用。
  usage_reason_en: 'Inference: it chains log reading, patch generation and re-run verification into one
    automatic flow, so engineers skip manual reproduction and repeated pushes and receive an already verified
    patch, which is why teams with frequent CI failures would try it first.'
