  usage_reason_en: 'Inference: compared with manual copy-paste, the tool merges export and delivery into
    one step, removing item-by-item transfer and format cleanup, so content creators or researchers who
    archive conversations long-term would choose it when organizing material; retention and repeat-use
    evidence is missing.'
