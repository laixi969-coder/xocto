  market: ''
  job: 需要记会议纪要的 Mac 用户（如咨询顾问、销售、项目经理），在客户会议或内部例会中面对不便上传云端的讨论内容，要在会中或会后快速得到一份可直接使用的会议笔记。
  job_en: Mac users who need meeting minutes—consultants, salespeople, project managers—facing discussions
    too sensitive to upload, wanting usable meeting notes during or right after the meeting.
  pain: 云端会议记录工具会把录音和转写文本传到第三方服务器，涉密或客户敏感会议不敢用；人工边听边记又让人无法专注讨论，会后还要花时间整理。
  pain_en: Cloud note-takers send recordings and transcripts to third-party servers, so sensitive meetings
    go unrecorded; manual note-taking distracts from the discussion and still needs cleanup afterwards.
  current_alternative: 现做法是用 Otter、Fireflies 这类云端转写工具，或在允许记录的场合人工记要点、会后凭记忆和录音补写纪要。
  current_alternative_en: Today they use cloud transcription tools like Otter or Fireflies, or take manual
    notes where allowed and reconstruct minutes from memory and recordings afterwards.
  usage_reason: 相比云端工具，它在设备本地完成转写与笔记生成，录音和笔记不出机器，敏感会议也能放心记录；这是基于产品能力的推断，尚无用户反馈或案例支持。
  usage_reason_en: Versus cloud tools, processing happens on the device so audio and notes never leave
    the machine, letting users record sensitive meetings—this is an inference from product claims, not
    yet backed by user feedback.
