  market: ''
  job: 消费者在怀疑自己被隐藏收费、隐私侵权或难以取消的订阅损害时，需要判断能否索赔并凑齐证据；律所案件运营人员则要在同一时间处理成千上万件个人索赔，逐件收集信息和提交材料。
  job_en: Consumers who suspect they were harmed by hidden fees, privacy violations or hard-to-cancel
    subscriptions need to judge whether they can claim and assemble evidence; law firm case operations
    staff must meanwhile process thousands of individual claims at once, gathering information and filing
    each one.
  pain: 集体诉讼常被合同条款挡在门外，个人仲裁又要求逐人提交；消费者不知道流程，律所也没有批量处理数千件小额索赔的产能，导致大量索赔因材料不全或无人跟进而放弃。
  pain_en: Class actions are often blocked by contract terms while individual arbitration requires filing
    person by person; consumers do not know the process and firms lack the capacity to handle thousands
    of small claims, so many claims are abandoned for lack of paperwork or follow-up.
  current_alternative: 消费者自己上网搜索和解公告、手工填写表格或干脆放弃；律所靠人工筛查线索、电话或邮件逐个联系当事人并手工整理材料。
  current_alternative_en: Public materials do not yet show how users complete this job today or what they
    replace.
  usage_reason: 推断：相较消费者自行搜索和律所人工逐件跟进，该产品把“识别潜在案件、找到受影响人群、收集索赔信息”合并成一条可批量执行的流水线，减少律所在线索筛选和材料收集上的手工环节，因此处理小额高频索赔的律所会在案件量超过人工产能时选择它。公开材料未披露留存或复购数据，长期使用尚无证据。
  usage_reason_en: 'Inference: compared with consumers searching on their own and firms following up case
    by case, the product merges case identification, claimant outreach and information collection into
    one batchable pipeline, cutting manual lead screening and document gathering — so firms handling high-volume,
    low-value claims would choose it when case volume exceeds manual capacity. No retention or repeat-use
    data is disclosed, so long-term use is not evidenced.'
