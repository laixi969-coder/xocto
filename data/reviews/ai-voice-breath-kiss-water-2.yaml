  pain_en: Synthesized speech often doubles lines, jumps in pitch, breathes unnaturally and varies in
    volume, making characters feel fake and breaking audience immersion.
  current_alternative: 创作者靠反复试听、手工剪辑音频、逐条重生成来修，耗时且难以稳定复现。
