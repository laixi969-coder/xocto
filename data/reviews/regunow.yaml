  market: ''
  job: 合规专员在监管规则更新时，把散落的法规文本整理成可执行的审计清单，供内部或外部审计使用。
  job_en: Compliance officers turn scattered regulatory texts into actionable audit checklists for internal
    or external audits when rules update.
  pain: 法规文本分散、更新频繁，人工逐条比对耗时且容易漏项，漏项会带来监管处罚风险。
