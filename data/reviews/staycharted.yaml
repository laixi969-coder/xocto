  market: ''
  job: 电商运营、二手卖家或档案整理者在收到一批新图片和文字素材时，需要按自己已有的分类表把它们归到对应类别，以便上架、归档或检索。
  job_en: An e-commerce operator, reseller or archivist receiving a batch of new images and text needs
    to sort them into their existing category sheet for listing, filing or retrieval.
  pain: 通用识别模型只认固定标签，与自有分类体系对不上，只能人工逐条归类，量大时耗时且容易前后不一致。
  pain_en: Generic recognition models only know fixed labels that do not match the user's own taxonomy,
    so items must be sorted by hand, which is slow and inconsistent at volume.
  current_alternative: 人工按表格逐条归类，或把素材丢给通用模型再手工改标签，也有人自己写脚本调接口。
  current_alternative_en: Sorting by hand against a spreadsheet, or feeding material to a generic model
    and fixing labels manually, or writing custom scripts against an API.
  usage_reason: 推断：如果用户上传自有分类样本后模型能直接输出对应类别，就省掉了逐条改标签这一步，因此已有自建分类表且素材量大的团队会先试用；但公开材料未给出准确率、训练成本或复核方式，无法确认它比人工更可靠。
  usage_reason_en: 'Inference: if uploading one''s own labeled samples lets the model output the matching
    category directly, the manual relabeling step disappears, so teams that already keep a taxonomy and
    handle large volumes would try it; public material gives no accuracy, training cost or review method,
    so it is unproven against manual work.'
