  market: ''
  job: Mac 用户在下载与拍摄文件堆积、桌面和下载目录混乱时，需要把文件归到可找的位置，于是让 Sorted 读取文件内容并自动分类，最终得到整理后的文件夹结构。
  job_en: When downloads and captured files pile up and the desktop and download folders get messy, a
    Mac user needs files placed where they can be found, so Sorted reads the content and auto-categorizes
    it, yielding a tidied folder structure.
  pain: 手动建文件夹、逐个改名归类耗时，拖着不整理则之后找文件更慢，重复下载和重复文件也随之增加。
  pain_en: Building folders and renaming files by hand takes time; putting it off makes later retrieval
    slower and breeds duplicate downloads and files.
  current_alternative: 现在靠 Finder 手动建文件夹、按名称或日期排序，或用系统自带的智能文件夹和第三方清理工具。
  current_alternative_en: Today people build folders in Finder by hand, sort by name or date, or use built-in
    smart folders and third-party cleanup tools.
  usage_reason: 推断：相较手动建文件夹和改名，它直接读文件内容决定归属，省掉逐个判断放哪一步，因此文件量大且命名混乱的 Mac 用户会选它；尚无留存或复购证据。
  usage_reason_en: 'Inference: versus building folders and renaming by hand, it reads file content to
    decide placement, removing the per-file judgment step, so Mac users with large, badly named libraries
    would pick it; no retention or repeat-use evidence yet.'
