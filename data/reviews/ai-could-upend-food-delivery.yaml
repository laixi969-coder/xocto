  next_validation: 收集 Bites 官方定价页或餐厅侧客户案例，确认下单确认与履约由谁负责。
  market: ''
  job: 湾区餐厅在顾客通过 AI 代理表达点餐需求时，需要把菜单、库存和可下单信息交给代理，并最终确认并履约一笔订单。
  job_en: A Bay Area restaurant, when a customer expresses an ordering need through an AI agent, must
    expose menu, availability and orderable data to the agent and finally confirm and fulfill an order.
  pain: 候选材料只说明 Bites 在做代理式订餐并签约约300家餐厅，未说明顾客或餐厅具体卡在哪一步、不采用会失去什么。
  pain_en: The candidate only says Bites does agentic ordering with about 300 restaurants signed up; it
    does not say which step blocks customers or restaurants, or what is lost by not adopting it.
  current_alternative: 顾客在 DoorDash 等平台菜单里自行挑选下单，餐厅通过平台后台人工接单。
  current_alternative_en: Customers pick and order themselves in DoorDash-style menus, and restaurants
    take orders manually through platform backends.
  usage_reason: 推断：若 AI 代理能直接完成下单，餐厅可省去顾客逐项挑选与人工确认的环节，因此可能吸引希望被代理渠道带单的餐厅；但材料未给出留存、复购或客户反馈，无法确认这一动机成立。
  usage_reason_en: 'Inference: if an AI agent can complete ordering directly, restaurants could skip item-by-item
    selection and manual confirmation, which may attract restaurants wanting agent-channel orders; however
    no retention, repeat-use or customer feedback is given, so this motive is unconfirmed.'
