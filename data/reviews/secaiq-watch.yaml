  usage_reason_en: 'Inference: compared with filtering generic EDR logs by hand, SecAIQ Watch presents
    AI tool behavior directly, removing the step of identifying AI processes inside large log volumes,
    so IT teams that must account for endpoint AI use to auditors would try it first.'
