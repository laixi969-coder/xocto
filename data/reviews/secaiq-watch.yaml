  job_en: After AI tools are installed on employee machines, IT or security owners need to see what those
    tools read and send locally in order to judge compliance.
  pain: AI工具在终端的行为不透明，出问题时无法回溯，面对审计或数据外泄质疑时缺少可出示的记录。
