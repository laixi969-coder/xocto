  next_validation: 收集 HackerRank 官方关于 AI Interviewer 的定价页或客户案例页，确认收费方式与已付费客户。
  market: ''
  job: 技术招聘官在简历量远超面试产能时，需要处理成百上千份候选人材料，完成初筛问答并给出可比较的评估，以便决定谁进入下一轮。
  job_en: A technical recruiter facing far more resumes than interview capacity must process hundreds
    of candidate profiles, run screening Q&A and produce comparable assessments to decide who advances.
  pain: 人工电话初筛耗时且标准不一致，招聘官难以在短时间内覆盖全部候选人，容易漏掉合格者或让面试官把时间花在明显不合格的人身上。
  pain_en: Manual phone screens are slow and inconsistent; recruiters cannot cover every candidate quickly,
    so qualified people get missed and interviewers spend time on clearly unsuitable ones.
  current_alternative: 旧做法是招聘官或工程师逐份看简历、打初筛电话、写面试记录，或用在线测评加人工复核。
  current_alternative_en: The old way is recruiters or engineers reading resumes one by one, making screening
    calls and writing notes, or using online assessments plus manual review.
  usage_reason: 相较人工电话初筛，它把问答与记录这一步交给 AI 自动完成，招聘官只需复核生成的评估，从而把覆盖范围从少数候选人扩大到全部投递者；推断，因为公开材料未给出留存或复购数据。
  usage_reason_en: Compared with manual phone screens, it hands the Q&A and note-taking step to AI so
    recruiters only review generated assessments, expanding coverage from a few candidates to the whole
    applicant pool; this is inference, as no retention or repeat-use data is public.
