  market: ''
  job: 软件工程师在收到工单、线上报错或定时任务时，把代码仓库交给 AI 编码代理，让代理定位并修改代码，改动前先确认再落地。
  job_en: Software engineers hand a repository to AI coding agents when a ticket, production error or
    schedule fires, letting the agent locate and modify code with confirmation before changes land.
  pain: 编码代理目前多在对话窗口里手动触发，工程师要自己复制上下文、盯住执行、再手工把改动搬回仓库，重复且容易漏掉触发源。
  pain_en: Coding agents are mostly triggered manually inside chat windows, so engineers copy context,
    babysit execution and hand-carry changes back into the repository, which is repetitive and easy to
    drop.
  current_alternative: 工程师手动在 Claude Code、Codex 等终端或 IDE 里粘贴工单与报错信息，或自己写脚本调用代理，再人工审查提交。
  current_alternative_en: Engineers manually paste tickets and errors into Claude Code, Codex or an IDE,
    or write their own scripts to call agents, then review and commit by hand.
  usage_reason: 推断：相较手工粘贴与自写脚本，它把触发源（工单、报错、webhook、定时）直接接到代理执行，并在改动前插入确认步骤，省掉搬运上下文和盯执行这两步，因此事件源密集、又要求人工把关的团队会先试它。
  usage_reason_en: 'Inference: versus manual pasting and homegrown scripts, it wires trigger sources (tickets,
    errors, webhooks, schedules) straight into agent execution and inserts a confirmation step before
    changes, removing context shuttling and babysitting, so teams with dense event sources that still
    want human sign-off would try it first.'
