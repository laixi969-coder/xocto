  market: ''
  job: 家庭用电用户在签下动态电价并装上家用电池后，需要处理逐时电价、光伏出力与电池电量这些材料，完成自动充放电与卖电回网，以压低每月电费。
  job_en: A household on a dynamic tariff with a home battery must handle hourly prices, solar output
    and battery state to automate charging, discharging and selling back, in order to lower the monthly
    bill.
  pain: 动态电价下价格逐时变化，人工盯着价格表决定何时充电放电既费时又容易错过低价窗口，不采用就只能按固定电价多付钱。
  pain_en: Under dynamic tariffs prices move hourly; manually watching the price table to time charging
    is time-consuming and misses cheap windows, and not adopting means paying more on a flat tariff.
  current_alternative: 目前多数家庭靠固定电价合同、手动定时充电，或干脆不装电池，把用电时间交给习惯而不是价格。
  current_alternative_en: Most households today use a flat-rate contract, charge on manual timers, or
    skip a battery entirely, leaving timing to habit rather than price.
  usage_reason: 相较手动定时或固定电价，它把电价、光伏与电池数据接进同一套自动调度，省掉用户每天判断何时充放电这一步，并让电池在高价时段放电卖电；因此已装电池、电价波动大的家庭会选它，但节省幅度目前只有公司自述，属推断。
  usage_reason_en: Compared with manual timers or a flat tariff, it feeds price, solar and battery data
    into one automated schedule, removing the daily decision of when to charge and letting the battery
    discharge into high prices; households with a battery in volatile markets would choose it, though
    the savings figure is company-stated and the reasoning is inference.
