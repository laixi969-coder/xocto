  market: ''
  job: 开发者在本地机器或内网环境中，需要让编码代理调用模型处理代码文件，同时不希望代码和提示词离开自己的设备。
  job_en: A developer on a local machine or intranet needs a coding agent to call a model over code files
    without code and prompts leaving the device.
  pain: 云端模型调用意味着代码与提示词出域，且按 token 计费的成本随代理反复读写代码快速累积；本地跑模型可回避这两点，但配置与代理对接繁琐。
  pain_en: Cloud model calls mean code and prompts leave the network, and per-token costs accumulate quickly
    as an agent repeatedly reads and writes code; running locally avoids both but wiring it to an agent
    is fiddly.
  current_alternative: 直接调用云端模型 API，或自行用推理框架加脚本手工搭本地环境，再逐个适配代理。
  current_alternative_en: Calling cloud model APIs directly, or hand-building a local setup with an inference
    framework plus scripts and adapting each agent separately.
  usage_reason: 推断：相较手工搭本地推理环境，它把模型拉取、运行和代理接入收敛成一条命令，省掉环境配置与逐代理适配这一步，因此对代码不能出域的团队和想压低 token 成本的个人开发者有吸引力。
  usage_reason_en: 'Inference: versus hand-building a local inference setup, it collapses model pulling,
    running and agent hookup into one command, removing environment setup and per-agent adaptation, which
    appeals to teams whose code cannot leave the network and to individual developers cutting token costs.'
