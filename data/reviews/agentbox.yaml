    server and need to manage multiple sessions, file changes and usage records.
  pain: 代理在裸终端里跑，会话、容器、Git 改动和用量分散，出问题难以回溯，也难以在多台机器间复用环境。
  pain_en: Agents run in a bare terminal, so sessions, containers, Git changes and usage are scattered,
    hard to trace back when something breaks, and hard to reuse across machines.
  current_alternative: 手工开终端、自己写 Docker 脚本、用 shell 历史或零散日志记录，没有统一工作区。
  current_alternative_en: Opening terminals by hand, writing ad-hoc Docker scripts, and relying on shell
    history or scattered logs, with no unified workspace.
  usage_reason: 推断：它把容器会话、终端、文件和 Git 放进同一个浏览器界面并附带用量记录，省去开发者自己搭隔离环境和拼日志这一步，因此需要审计代理执行过程的小团队会选它。
  usage_reason_en: 'Inference: it puts container sessions, terminal, files and Git into one browser interface
    with usage records, removing the step of hand-building isolation and stitching logs, so small teams
    that need to audit agent execution would pick it.'
