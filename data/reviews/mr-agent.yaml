  job_en: Small and mid-size teams on self-hosted GitLab need someone to read each merge request diff
    and give review comments, and to locate the cause when the pipeline fails.
  pain: 评审依赖资深工程师，人手不足时 MR 排队等待；CI 失败往往要人工翻日志逐条排查，拖慢合入。
  pain_en: Review depends on senior engineers, so merge requests queue when they are busy; CI failures
    are usually traced by hand through logs, slowing merges.
  current_alternative: 人工评审加人工看 CI 日志，或使用通用代码助手逐段提问，缺少与 GitLab 流程绑定的自动评审与自愈。
