  market: ''
  job: 使用自建 GitLab 的中小研发团队在成员提交 Merge Request 时，需要有人读完代码改动给出评审意见，并在流水线失败时定位原因。
  job_en: Small and mid-size teams on self-hosted GitLab need someone to read each merge request diff
    and give review comments, and to locate the cause when the pipeline fails.
  pain: 评审依赖资深工程师，人手不足时 MR 排队等待；CI 失败往往要人工翻日志逐条排查，拖慢合入。
  pain_en: Review depends on senior engineers, so merge requests queue when they are busy; CI failures
    are usually traced by hand through logs, slowing merges.
  current_alternative: 人工评审加人工看 CI 日志，或使用通用代码助手逐段提问，缺少与 GitLab 流程绑定的自动评审与自愈。
  current_alternative_en: Manual review plus reading CI logs by hand, or a general coding assistant queried
    piece by piece, with no automated review and healing tied to the GitLab flow.
  usage_reason: 推断：它把评审与 CI 排障直接挂在 MR 流程上，减少人工逐条读 diff 和翻日志这一步，因此缺少专职评审人的自建 GitLab 团队会在 MR 密集时选择它；尚无用户反馈或客户案例支持这一动机。
  usage_reason_en: 'Inference: it attaches review and CI triage to the merge request flow, removing the
    step of reading diffs and logs line by line, so self-hosted GitLab teams without a dedicated reviewer
    would pick it during merge-heavy periods; no user feedback or customer case supports this motive yet.'
