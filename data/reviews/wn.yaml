  usage_reason_en: 'Inference: it replaces the manual search step with retrieval trained on real fixes,
    so engineers taking over unfamiliar repositories would run it before editing if hit rate is reliable;
    but no accuracy or usage feedback is public, so whether this step is actually saved remains unverified.'
