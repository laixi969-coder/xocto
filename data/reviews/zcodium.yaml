  market: ''
  job: 开发团队在把 AI 编码工具接入内部代码库前，由开发者工具链合规审查或开源代码审计人员处理 ZCode 源码与提交记录，要完成确认工具是否回传代码与使用数据、并拿到可自行核对版本的任务。
  job_en: Before adopting an AI coding tool into an internal codebase, developer toolchain compliance
    reviewers or open-source auditors work on ZCode source and commit history to confirm whether the tool
    sends code and usage data back, and to obtain a version they can verify themselves.
  pain: AI 编码工具可能回传代码与使用数据，团队在接入前无法确认数据流向，不解决则可能违反内部合规或客户数据约定，这是接入前的真实卡点。
  pain_en: AI coding tools may send code and usage data back; teams cannot confirm data flows before adoption,
    and leaving it unsolved may violate internal compliance or customer data agreements, a real bottleneck
    before adoption.
  current_alternative: 现有做法是人工审阅上游源码、依赖厂商隐私声明，或直接放弃使用该工具。
  current_alternative_en: Current practice is manually reviewing upstream source, relying on vendor privacy
    statements, or simply forgoing the tool.
  usage_reason: 推断：它把“逐条核对上游提交并移除遥测”这一步从团队自行审计换成已审阅的 fork，面向有合规要求、又需要 AI 编码工具的团队；但公开材料没有部署案例或审计反馈，是否真能替代内部审计尚未核验。
  usage_reason_en: 'Inference: it replaces the team''s own commit-by-commit audit and telemetry removal
    with a pre-reviewed fork, aimed at teams with compliance requirements that still need an AI coding
    tool; but no deployment cases or audit feedback are public, so whether it truly replaces internal
    audit remains unverified.'
