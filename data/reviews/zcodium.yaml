  market: ''
  job: 受监管行业的研发或安全团队在把 AI 编码工具接入内部代码库前，需要审查该工具是否回传代码与使用数据，并产出一份可留档的合规结论。
  job_en: Before connecting an AI coding tool to an internal codebase, engineering or security teams in
    regulated industries must review whether the tool sends code and usage data back, and produce a compliance
    record they can archive.
  pain: 闭源 AI 编码工具默认开启遥测，团队无法确认代码是否外传，只能靠厂商声明或干脆禁用工具，合规审查缺少可核对的依据。
  pain_en: Closed-source AI coding tools ship telemetry on by default, so teams cannot confirm whether
    code leaves the environment; they rely on vendor statements or ban the tool outright, leaving compliance
    review without verifiable evidence.
  current_alternative: 旧做法是禁用该工具、只允许在隔离环境使用，或依赖厂商的隐私声明与安全问卷，人工无法逐行核对二进制与遥测行为。
  current_alternative_en: The old approach is to ban the tool, restrict it to an isolated environment,
    or rely on vendor privacy statements and security questionnaires, since no one can manually verify
    binaries and telemetry line by line.
  usage_reason: 相较只读厂商声明，ZCodium 直接移除监控与遥测代码并逐提交审阅上游改动，把审查对象从承诺变成可自行核对的代码，因此需要留档证据的合规团队会考虑它；这是基于产品能力的推断，尚无用户采用或留存证据。
  usage_reason_en: Compared with reading vendor statements, ZCodium removes monitoring and telemetry code
    and reviews upstream commits one by one, turning the review object from a promise into code the team
    can check itself, so compliance teams needing archived evidence may consider it; this is inference
    from product capability, with no adoption or retention evidence yet.
