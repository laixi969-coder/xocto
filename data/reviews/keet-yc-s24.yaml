    course map of short videos plus quizzes, so they can start learning instead of gathering materials
    and deciding the sequence themselves.
  pain: 公开材料只有一句产品定位“Video Courses on Anything”，没有用户抱怨、使用反馈或案例说明自学者在拼凑学习顺序上具体损失了什么、多久发生一次、不解决会怎样，因此痛点强度无法从公开事实确认。
  pain_en: Public material contains only the positioning line 'Video Courses on Anything'; there is no
    user complaint, feedback, or case showing what self-learners concretely lose by assembling their own
    learning order, how often it happens, or what happens if unsolved, so pain intensity cannot be confirmed
    from public facts.
  current_alternative: 公开材料未说明用户目前用什么替代，例如自行搜索视频、使用现成课程平台、请人推荐书单或直接问聊天机器人；这些替代方式的存在与优劣均无公开证据。
  current_alternative_en: Public material does not state what users currently substitute, such as searching
    videos themselves, using existing course platforms, asking for a reading list, or prompting a chatbot;
    neither the existence nor the trade-offs of these alternatives is evidenced publicly.
  usage_reason: 推断：若产品真能按主题自动生成有序课程表并配测验，它可能省去用户自己筛选与排序素材的步骤，但公开材料没有用户反馈或案例支持这一动机，也没有说明哪类用户会在什么情况下选择它，因此无法写成事实。
  usage_reason_en: 'Inference: if the product truly auto-generates an ordered course map with quizzes
    per topic, it could remove the step of filtering and sequencing materials, but no user feedback or
    case supports this motive, nor which users would choose it and when, so it cannot be stated as fact.'
