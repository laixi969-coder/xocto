    Coursera, or offline tutoring.
  usage_reason: AI 生成视频可以快速覆盖大量主题，提供低成本的学习资源，可能吸引学生和教师关注。
  usage_reason_en: AI-generated videos can quickly cover a wide range of topics, providing low-cost learning
    resources, may attract students and teachers.
