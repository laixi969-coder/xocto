  current_alternative: 公开材料未说明现有替代方式；按常见做法推断，用户可能用截图加系统 OCR、手打，或换设备打开页面。
  current_alternative_en: The public material does not state existing alternatives; by common practice,
    users may use screenshot plus system OCR, retype manually, or open the page on another device.
  usage_reason: 推断：若它能把取字压缩成一次操作并直接进入粘贴板，用户会在需要抄录不可复制文本时选择它，省掉截图、切到 OCR、再复制这几步；但公开材料没有说明具体动作，也没有用户反馈或使用数据支持这一判断。
  usage_reason_en: 'Inference: if it reduces capture to a single action that lands in the clipboard, users
    would pick it when retyping uncopyable text, skipping screenshot, switching to OCR and copying again;
    but the public material does not describe the action, and no user feedback or usage data supports
    this.'
