  job_en: Platform engineers wiring agents into real business flows need agent-generated and user-submitted
    code to run in a controlled environment and return retrievable results.
  pain: 直接在自有服务器上跑模型生成的代码，一旦越权或死循环就可能污染生产环境、泄露数据，团队只能靠人工审查或干脆不让 agent 执行代码。
  pain_en: Running model-generated code directly on own servers risks polluting production or leaking
    data on privilege escalation or infinite loops, so teams either review by hand or block code execution
    entirely.
  current_alternative: 自建容器加脚本、用云厂商的通用沙箱服务，或干脆限制 agent 只能输出代码文本由人复制执行。
  current_alternative_en: Self-built containers plus scripts, generic cloud sandbox services, or restricting
    agents to emitting code text that a human copies and runs.
  usage_reason: 推断：相较自建容器脚本，SPACE 把运行时做成可插拔并直接面向 agent 调用，团队不必自己维护隔离、回收与多语言运行时这一整套，因此正在把 agent 推向生产的平台团队会在需要执行不可信代码时选它。
  usage_reason_en: 'Inference: compared with self-built container scripts, SPACE makes runtimes pluggable
    and aimed directly at agent invocation, so teams avoid maintaining isolation, cleanup and multi-language
    runtimes themselves; platform teams pushing agents to production would pick it when untrusted code
    must run.'
