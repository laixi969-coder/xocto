  job_en: A coach or lifter films a deadlift set on camera at the gym and needs to judge whether the back,
    hip and knee positions in that set are safe and acceptable.
  pain: 公开材料只说明这是评估硬拉姿势的视觉工具，没有说明它替代了哪一步旧动作、错误动作会带来什么后果，也没有用户抱怨或采用记录。
  pain_en: Public material only says it is a vision tool for evaluating deadlift form; it does not say
    which old step it replaces, what the consequence of bad form is, and there are no user complaints
    or adoption records.
  current_alternative: 教练肉眼回看手机录像，或凭现场观察口头纠正；这是常见做法，但候选材料未提供任何用户自述的替代行为。
  current_alternative_en: A coach rewatching phone footage by eye, or correcting verbally from live observation;
    this is common practice, but the candidate material provides no user-stated alternative behaviour.
  usage_reason: 推断：如果它能直接输出可核对的关节角度或偏差位置，教练就不必逐帧暂停录像，训练者也能在没有教练时自查；但公开材料未证明它做到了这一点，因此无法确认用户为何会选择它。
  usage_reason_en: 'Inference: if it directly outputs checkable joint angles or deviation points, a coach
