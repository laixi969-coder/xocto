  market: ''
  job: 报销或记账人员在月底整理一叠纸质收据时，需要把每张票据变成可入账的记录。
  job_en: Expense or bookkeeping staff sorting a stack of paper receipts at month-end need to turn each
    slip into a bookable record.
  pain: 逐张对准、拍照、再手工补录金额和日期很费时，票据多时容易漏拍或拍糊。
  pain_en: Aligning, photographing and then manually re-keying amounts and dates is slow, and with many
    slips it is easy to miss or blur a shot.
  current_alternative: 用手机相机逐张拍照后手工录入，或使用已有的扫描类记账应用。
  current_alternative_en: Photographing slips one by one with the phone camera and keying them in manually,
    or using existing scanning bookkeeping apps.
  usage_reason: 推断：免手持连续拍摄可能减少逐张对准和重复拍照的动作，但公开材料未说明识别准确率、导出格式或与记账系统的对接，因此尚不能确认它比现有扫描应用少哪一步负担。
  usage_reason_en: 'Inference: hands-free sequential capture may reduce the aligning and re-shooting of
    each slip, but the public material does not state recognition accuracy, export formats or bookkeeping-system
    integration, so which step it saves versus existing scanning apps cannot yet be confirmed.'
