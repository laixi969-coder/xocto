    cloud record on a Windows machine during meetings or dictation and need a searchable full transcript
    afterwards.
  pain: 云端转写服务要把敏感语音和会议内容传到第三方，合规上过不去；纯手工记录又跟不上语速、事后难检索。
  pain_en: Cloud transcription sends sensitive audio and meeting content to a third party, which fails
    compliance, while manual note-taking cannot keep up with speech and is hard to search later.
  current_alternative: 用云端转写订阅服务，或人工速记加事后整理，再靠关键词在文档里翻找。
  current_alternative_en: Using a cloud transcription subscription, or human shorthand plus after-the-fact
    cleanup, then hunting through documents by keyword.
  usage_reason: 推断：它把转写、格式化与笔记存储都放在本机，模型由用户自己管理，省掉把敏感录音上传第三方这一步，因此受合规约束、又需要可检索记录的专业人士会在会议场景选择它。
  usage_reason_en: 'Inference: it keeps transcription, formatting and note storage on the local machine
    with user-managed models, removing the step of uploading sensitive recordings to a third party, so
    compliance-bound professionals who still need searchable records would choose it for meetings.'
