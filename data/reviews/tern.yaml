  market: ''
  job: 播客或视频剪辑师在整理数小时录音与素材时，需要按口播内容、画面文字和画面内容找到具体片段，并把它剪出来交给剪辑软件。
  job_en: Podcast or video editors working through hours of recordings and footage need to find specific
    clips by spoken content, on-screen text and visuals, then cut them and hand them to an editing suite.
  pain: 长素材只能靠人工听看或时间码笔记定位，找一段话或一个画面要反复拖动进度条，素材越多越难复用。
  pain_en: Long footage can only be located by manually listening, watching or keeping timecode notes;
    finding one sentence or shot means scrubbing repeatedly, and reuse gets harder as footage grows.
  current_alternative: 剪辑师通常用剪辑软件自带的关键词标记、手写时间码笔记，或把音频先转成文字再人工搜索。
  current_alternative_en: Editors typically rely on keyword markers inside editing software, hand-written
    timecode notes, or transcribing audio first and searching the text manually.
  usage_reason: 相较人工听看和手写时间码，它把语音转写、画面文字识别和画面相似检索合并成一次查询，直接给出排序片段并可导出 FCPXML，省掉在时间线上反复定位这一步；推断素材量大、复用频繁的播客与访谈团队会因此选择它。
  usage_reason_en: Compared with manual listening and timecode notes, it merges speech transcription,
    on-screen text recognition and visual similarity into one query, returning ranked clips and an FCPXML
    export, removing the repeated timeline-scrubbing step; inference is that podcast and interview teams
    with large, frequently reused footage will choose it for this.
