    available facts.
  current_alternative: 旧做法是人工在 LinkedIn 上逐个搜索、撰写并发送私信，或使用已有的外联自动化工具；候选未说明与这些做法的差异。
  current_alternative_en: The old way is manually searching, writing and messaging on LinkedIn one by
    one, or using existing outreach automation tools; the candidate does not explain the difference from
    these.
