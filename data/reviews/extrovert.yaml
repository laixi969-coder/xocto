  usage_reason_en: 'Inference: if the agent directly takes over searching and sending, it removes the
    step of manual item-by-item operation, so sales or recruiting staff might choose it for bulk outreach;
    however, without user feedback, customer cases or repeat-use evidence, this motive cannot be confirmed.'
