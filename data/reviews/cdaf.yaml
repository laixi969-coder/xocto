  market: ''
  job: AI 视频分析工程师或代理开发者把同一段视频反复交给视觉模型做描述、检索或标注时，需要把已生成的描述性结果按视频文件存成可复用的 sidecar，让后续代理直接读取而不重新解码分析。
  job_en: AI video analysis engineers and agent developers who repeatedly feed the same footage to vision
    models for description, retrieval, or tagging need the generated descriptive output stored as a reusable
    sidecar keyed to the video file, so later agents read it instead of re-decoding and re-analyzing.
  pain: 公开材料说明其目标是让 AI 代理停止重复分析同一段视频；重复调用视觉模型意味着同一素材被反复解码与推理，既消耗算力与费用，也让同一素材在不同代理间得不到一致的描述结果。这是从产品定位与工作流结构推出的痛点，尚无用户抱怨或案例直接佐证。
  pain_en: Public material states the goal is to stop AI agents from re-analyzing the same footage; repeated
    vision-model calls mean the same asset is decoded and inferred over and over, burning compute and
    cost and yielding inconsistent descriptions across agents. This pain is inferred from the product
    positioning and workflow structure, not yet from user complaints or cases.
  current_alternative: 旧做法是每次分析后把结果留在各自代理的上下文或临时缓存里，或把描述手工写进文件名、旁挂 JSON、向量库等自定义位置，格式互不通用，换一个代理或换一次会话就得重跑一遍。
  current_alternative_en: The old way is leaving results in each agent's own context or ephemeral cache,
    or hand-writing descriptions into filenames, ad-hoc JSON, or a vector store; formats are not portable,
    so switching agents or sessions means re-running the analysis.
  usage_reason: 推断：相较每次重跑视觉模型，它把描述性资产按开放 sidecar 格式与视频文件绑定，并配 CLI 与代理技能，使代理在分析前先查已有 sidecar，省掉重复解码与推理这一步，因此会反复处理同一批素材、且需要跨代理复用结果的视频分析工程师会选择它。
  usage_reason_en: 'Inference: versus re-running the vision model each time, it binds descriptive assets
    to the video file in an open sidecar format with a CLI and agent skill, so an agent checks for an
    existing sidecar before analyzing, removing the re-decode and re-inference step; engineers who reprocess
    the same footage and need results reusable across agents would choose it.'
