  market: ''
  job: 开发者在审阅编码代理（如 Claude）产出的代码或流程时，需要把改动过程讲清楚，于是把一段简短 JSON 规格交给 SeeCode，生成可播放、可展开的动画图解，用于自己核对或向他人说明。
  job_en: When reviewing code or flows produced by coding agents such as Claude, a developer needs to
    explain the changes, so they feed a short JSON spec into SeeCode to generate animated, explorable
    diagrams for self-checking or explaining to others.
  pain: 代理一次改动涉及多个文件和步骤，纯文字 diff 与日志难以还原先后顺序和依赖关系，人工在脑中重建结构耗时且容易漏看。
  pain_en: A single agent change spans many files and steps; plain diffs and logs make order and dependencies
    hard to reconstruct, so rebuilding the structure mentally is slow and error-prone.
  current_alternative: 现在多靠阅读 diff、翻代理日志、手画流程图或截图标注，工具之间来回切换。
  current_alternative_en: Today people read diffs, scroll agent logs, hand-draw flowcharts or annotate
    screenshots, switching between tools.
  usage_reason: 推断：相较逐行读 diff 再手绘，它把结构化规格直接渲染成可播放图解，省掉手工画图这一步，因此需要向他人解释代理改动的开发者会选它；尚无留存或复购证据。
  usage_reason_en: 'Inference: versus reading diffs line by line and drawing by hand, it renders a structured
    spec straight into playable diagrams, removing the manual drawing step, so developers who must explain
    agent changes would pick it; no retention or repeat-use evidence yet.'
