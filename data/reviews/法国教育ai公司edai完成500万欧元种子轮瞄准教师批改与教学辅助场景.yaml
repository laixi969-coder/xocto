  market: ''
  job: 法国中小学教师在日常作业与测验后，需要处理学生提交的纸质或电子作业，完成批改、打分并给出反馈，再把结果交回学生与家长。
  job_en: Teachers in French primary and secondary schools need to process student submissions after daily
    homework and quizzes, complete grading and scoring, give feedback, and return results to students
    and parents.
  pain: 公开材料只说明方向是批改与教学辅助，没有说明教师当前在批改上具体卡在哪一步、耗时多少、错误率或反馈延迟带来什么后果，痛点强度无法从现有事实确认。
  pain_en: Public material only states the direction of grading and teaching assistance; it does not say
    which grading step teachers are stuck on, how long it takes, or what consequences errors or delayed
    feedback cause, so pain intensity cannot be confirmed from available facts.
  current_alternative: 可确认的旧做法是教师手工批改，或使用学校已有的作业与测评系统；是否有其他AI批改工具被法国教师实际使用，公开材料未提供。
  current_alternative_en: The confirmable old practice is manual grading by teachers or existing school
    assignment and assessment systems; whether French teachers actually use other AI grading tools is
    not provided in the public material.
  usage_reason: 推断：若产品能把学生作业直接转成批改结果与反馈草稿，教师只需复核和调整，就能省去逐份手写评语这一步，因此可能被作业量大、班额大的教师选用；但公开材料未给出任何使用反馈或客户案例，这一动机仍是推断。
  usage_reason_en: 'Inference: if the product turns student work directly into grading results and feedback
    drafts that teachers only review and adjust, it removes the step of writing comments by hand for each
    submission, which may attract teachers with heavy assignment loads and large classes; however, no
    usage feedback or customer case is public, so this motive remains an inference.'
