  market: ''
  job: 研究或工程人员在求解数学与代数问题时，需要让 agent 给出可校验的推导，并把已验证的规则留待复用。
  job_en: Researchers or engineers solving math and algebra problems need an agent to produce checkable
    derivations and keep verified rules for reuse.
  pain: 通用 agent 的推导无法核对，错误步骤会被当作结论继续使用，重复求解时又要从头再来。
  pain_en: General agents produce derivations that cannot be checked, wrong steps get reused as conclusions,
    and repeated solving starts from scratch.
  current_alternative: 使用通用大模型求解后人工逐步核对，或依赖符号计算软件手工搭建规则。
  current_alternative_en: Solving with general LLMs and checking each step by hand, or building rules
    manually in symbolic computation software.
  usage_reason: 推断：相较通用模型加人工核对，它把校验通过的规则存下来复用，减少重复核对同一步推导的负担，因此对推导可审计性有要求的数学或工程团队更可能采用。
  usage_reason_en: 'Inference: versus a general model plus manual checking, it stores verified rules for
    reuse, cutting the burden of re-checking the same derivation, so math or engineering teams that need
    auditable derivations are more likely to adopt it.'
