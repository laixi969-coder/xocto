  market: ''
  job: 创业者和销售在准备融资路演或客户提案时，把零散的业务要点、数据和品牌素材整理成可演示的幻灯片。
  job_en: Founders and sales staff turn scattered business points, data and brand assets into a presentable
    slide deck for fundraising or client proposals.
  pain: 手工排版和统一视觉风格耗时，且模板与内容反复返工；公开材料未给出用户对此的具体抱怨证据。
  pain_en: Manual layout and visual consistency are time-consuming and templates and content get reworked
    repeatedly; public material gives no direct user complaint evidence.
  current_alternative: PowerPoint、Google Slides 自带模板，或设计师与外部代做。
  current_alternative_en: Built-in templates in PowerPoint or Google Slides, or a designer or outsourced
    deck service.
  usage_reason: 推断：相较从空白模板逐页排版，Pitch 通过模板与页面生成减少初始排版这一步，因此赶时间、没有设计资源的创业者或销售可能选择它；但公开材料未提供用户反馈或留存证据，无法确认其被长期留在工作流中。
  usage_reason_en: 'Inference: versus laying out pages from a blank template, Pitch reduces the initial
    layout step through template and page generation, so time-pressed founders or sales without design
    resources may choose it; public material offers no user feedback or retention evidence that it stays
    in the workflow.'
