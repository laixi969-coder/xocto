  market: ''
  job: 经常用语音输入写邮件或文档的知识工作者，在任意应用里口述后，拿到 Whisper 类模型产出的口语化、断句混乱的转写文本，需要把它整理成可直接发送的书面内容。
  job_en: Knowledge workers who dictate emails or documents in any app take Whisper-style raw transcripts
    and turn colloquial, poorly punctuated output into sendable written text.
  pain: 语音转文字只解决听写，不解决书面化：口述稿带口语、重复和错误断句，直接粘贴进邮件或文档仍需逐句改写；不处理的后果是发出不专业文本或退回键盘重打，抵消语音输入省下的时间。
  pain_en: 'Speech-to-text solves dictation, not written form: raw transcripts carry filler, repetition
    and broken punctuation, so pasting them into an email or doc still requires sentence-by-sentence rewriting,
    or the user falls back to typing.'
  current_alternative: 公开材料显示用户当前用 Whisper 类本地转写工具（如 OpenSuperWhisper 这类 macOS 实时转写应用）或系统听写拿到原始文本，再手工润色；Superwhisper
    自身也以“任意应用内语音转文字”定位，说明旧做法是转写与整理分离。
  current_alternative_en: Public materials show users currently get raw text from Whisper-based local
    tools (e.g. OpenSuperWhisper, a macOS real-time transcription app) or OS dictation, then polish by
    hand; Superwhisper itself positions as voice-to-text in any app, implying transcription and cleanup
    are split today.
  usage_reason: 推断：相较“转写后手工改写”的旧流程，它在转写文本进入目标应用前由模型做语气与格式规范化，把逐句润色这一步合并进输入动作，因此频繁口述邮件、文档且不愿二次编辑的知识工作者会在意它；但公开材料未给出用户反馈或留存证据，动机属结构推断。
  usage_reason_en: 'Inference: versus the old ''transcribe then hand-edit'' flow, it normalizes tone and
    formatting before the text lands in the target app, folding the rewrite step into the input action,
    which matters to knowledge workers who dictate often and dislike re-editing; no public user feedback
    or retention evidence supports this motive yet.'
