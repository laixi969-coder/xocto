  usage_reason_en: 'Inference: if the product truly completes assistant invocation and credential retrieval
    in one iMessage step, it could remove app-switching for iOS users who value the chat entry point;
    but with no feature docs, user feedback, or cases, this causal chain cannot be confirmed.'
