  market: ''
  job: 个人投资者在自己的电脑上汇总净值、投资、ETF、现金与债务，并向内置 AI 顾问询问资产状况，得到本地保存的财务视图。
  job_en: Individual investors consolidating net worth, investments, ETFs, cash and debts on their own
    computer and asking the built-in AI advisor about their position, getting a locally stored financial
    view.
  pain: 把账户数据交给云端聚合平台存在隐私顾虑，而用表格手工汇总又费时且难以持续更新。
  pain_en: Handing account data to cloud aggregators raises privacy concerns, while manual spreadsheet
    consolidation is time-consuming and hard to keep updated.
  current_alternative: 用 Excel 或记账软件手工汇总，或使用云端资产聚合服务。
  current_alternative_en: Manual consolidation in Excel or bookkeeping software, or using cloud asset-aggregation
    services.
  usage_reason: 推断：相较手工表格，它把多类资产放在同一本地视图并由 AI 顾问直接回答资产问题，省去逐项整理与自行计算这一步；因此对不愿上传账户数据、又想随时问资产状况的人有吸引力。
  usage_reason_en: 'Inference: versus manual spreadsheets, it puts multiple asset types in one local view
    and has the AI advisor answer asset questions directly, removing item-by-item consolidation and self-calculation;
    that appeals to people unwilling to upload account data yet wanting on-demand answers about their
    position.'
