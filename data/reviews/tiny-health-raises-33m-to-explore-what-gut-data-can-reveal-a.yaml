  market: ''
  job: 居家采样用户（多为关注婴幼儿肠道或女性健康的家庭成员）在收到检测盒后自行采样寄回，需要拿到一份能看懂、能据此调整饮食或就医判断的菌群解读报告。
  job_en: At-home sampling users, often family members tracking infant gut or women's health, collect
    and mail samples after receiving a kit and need a readable microbiome interpretation they can use
    to adjust diet or decide whether to see a doctor.
  pain: 测序原始结果对普通人不可读，用户拿到一堆菌种名称后不知道哪一项值得在意、要不要改变喂养或就医；公开材料未给出用户抱怨或替代行为的直接证据。
  pain_en: 'Raw sequencing results are unreadable to laypeople: users get a list of species names with
    no sense of which matter or whether to change feeding or seek care; the public material gives no direct
    evidence of user complaints or workarounds.'
  current_alternative: 旧做法是去医院做粪便或阴道菌群相关检查、或购买其他居家检测盒后自行搜索解读，也有人干脆不做检测。
  current_alternative_en: The old path is a hospital stool or vaginal flora test, or buying another at-home
    kit and searching for interpretations oneself; some simply skip testing.
  usage_reason: 推断：相较自行搜索，产品把测序结果直接整理成一份带解读的报告，省去用户逐项查资料这一步，因此关注婴幼儿肠道或女性健康的家庭在收到报告时会打开它；但公开材料没有用户反馈或复购证据，无法确认它被长期留在健康管理流程里。
  usage_reason_en: 'Inference: compared with searching on one''s own, the product turns sequencing output
    into a single interpreted report, removing the step of looking up each item, so families tracking
    infant gut or women''s health would open it when the report arrives; however, no user feedback or
    repeat-purchase evidence is public, so it cannot be confirmed as staying in a long-term health routine.'
