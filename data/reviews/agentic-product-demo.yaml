  market: ''
  job: 产品经理或营销人员在需要为软件产品制作演示视频时，提供产品 UI 代码，由 AI 编码代理配合 Remotion 生成可嵌入网页或分享的动画演示视频。
  job_en: Product managers or marketers preparing a software product demo video provide the product UI
    code, and an AI coding agent with Remotion generates an animated demo video that can be embedded in
    a webpage or shared.
  pain: 公开材料指出传统做法是屏幕录制，录屏难以呈现精美界面且需手动剪辑；产品说明称 UI 是代码而非录屏，指向录屏画面不精致、后期编辑耗时的痛点，但缺少用户抱怨或案例的直接佐证。
  pain_en: Public materials indicate the traditional approach is screen recording, which struggles to
    present a polished interface and requires manual editing; the product states the UI is code rather
    than a recording, pointing to unpolished footage and time-consuming post-editing, though direct user
    complaints or cases are absent.
  current_alternative: 当前替代方式是屏幕录制工具加手动剪辑，或把演示视频外包给视频制作团队。
  current_alternative_en: The current alternative is screen-recording tools plus manual editing, or outsourcing
    demo video production to a video team.
  usage_reason: 推断：相较录屏再剪辑，产品直接以 UI 代码为输入、由代理生成动画视频，省去录制与逐帧剪辑环节，并让界面呈现可随代码更新而重生成；因此需要频繁产出产品演示的营销或产品团队会在发布、销售材料更新时选择它。
  usage_reason_en: 'Inference: compared with recording then editing, the product takes UI code as input
    and has an agent generate the animated video, removing the recording and frame-by-frame editing steps
    and letting the interface rendering be regenerated as code changes; teams that frequently produce
    product demos would choose it when launching or refreshing sales materials.'
