  market: ''
  job: 企业内业务分析师与数据团队在回答经营问题时，需要从报表、文档和数据库中检索并核对数据来源。
  job_en: Business analysts and data teams retrieving and verifying data sources from reports, documents
    and databases when answering operational questions.
  pain: 数据分散在报表、文档和数据库，口径不一致，分析师要花大量时间找数并确认来源，答案缺乏可追溯性会影响决策信任。
  pain_en: Data is scattered across reports, documents and databases with inconsistent definitions; analysts
    spend much time finding and verifying sources, and untraceable answers undermine trust in decisions.
  current_alternative: 分析师手工在 BI 报表、数据仓库查询和文档中检索，或向数据团队提需求排队取数。
  current_alternative_en: Analysts manually searching BI reports, warehouse queries and documents, or
    filing requests and queuing for the data team.
  usage_reason: 相较手工翻报表与文档，它把检索与来源标注合并成一次带引用的回答，减少分析师核对口径这一步，因此已有数据仓库但口径混乱的企业分析团队可能采用；这是基于产品能力的推断，尚无公开的持续使用或付费证据。
  usage_reason_en: Compared with manually searching reports and documents, it merges retrieval and source
    labeling into one cited answer, cutting the step of verifying definitions, so analytics teams with
    a warehouse but messy definitions may adopt it. This is inference from capability, with no public
    retention or payment evidence.
