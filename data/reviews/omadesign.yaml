  current_alternative: 推断：Linux 用户目前多依赖网页版设计工具、跨系统切换到 Windows 或 macOS 上的商业套件，或用 GIMP、Inkscape、Krita 等分散工具拼接流程。
  current_alternative_en: 'Inference: Linux users today rely on web-based design tools, switch to commercial
    suites on Windows or macOS, or stitch together separate tools such as GIMP, Inkscape and Krita.'
