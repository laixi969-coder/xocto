  market: ''
  job: 软件开发者在本机或服务器上让代理执行多步代码修改任务，需要控制代理能碰哪些文件与命令，并在出错后回看每一步。
  job_en: A software developer lets an agent run multi-step code changes locally or on a server, needing
    control over which files and commands it may touch and a way to review each step after errors.
  pain: 让代理直接改代码时，越权操作和不可复现的会话让开发者不敢放手，出问题难以定位。
  pain_en: When an agent edits code directly, over-broad permissions and non-reproducible sessions make
    developers hold back, and failures are hard to trace.
  current_alternative: 目前开发者多用现成编码代理或自己写脚本，权限靠人工盯守，出错后靠日志和记忆回溯。
  current_alternative_en: Developers today use existing coding agents or their own scripts, watch permissions
    manually, and reconstruct failures from logs and memory.
  usage_reason: 相较人工盯守，它把权限按风险分级并放进系统级沙箱，会话事件可回放，开发者只需在越界或失败时回看具体步骤，减少的是事后排查与授权判断这一步；推断，尚无用户反馈或留存证据。
  usage_reason_en: Compared with manual watching, it tiers permissions by risk inside a system-level sandbox
    and makes sessions replayable, so developers only review specific steps when something is blocked
    or fails, removing the after-the-fact debugging and authorization judgment step; inference, with no
    user feedback or retention evidence yet.
