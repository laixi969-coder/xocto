  market: ''
  job: 软件开发者在自己已有的代码仓库里，用自然语言给出一个改动任务（如修 bug、加功能、重构），让代理在本地读写文件、执行命令并产出可审查的代码改动，同时希望过程可回放、危险操作受控。
  job_en: A software developer working in an existing repository gives a natural-language change task
    (bug fix, feature, refactor) and has an agent read/write files, run commands, and produce reviewable
    code changes, with replayable sessions and controlled risky operations.
  pain: 让模型直接改本地代码时，开发者担心不可逆的破坏性操作、越权访问和无法复盘的过程；同时不同入口（脚本、终端、桌面）各自为政，切换成本高。公开材料只给出产品能力，痛点强度属于工作流结构推理。
  pain_en: When letting a model modify local code, developers worry about irreversible destructive actions,
    over-broad permissions, and sessions they cannot audit; separate entry points (script, terminal, desktop)
    also fragment the workflow. Public material only states capabilities, so pain intensity is a workflow
    inference.
  current_alternative: 旧做法是开发者手动复制粘贴代码到聊天窗口、自己执行命令并逐条审查，或使用单一入口的编码代理；公开材料未说明它具体替代了哪一款工具。
  current_alternative_en: The prior approach is manually pasting code into a chat window, running commands
    by hand and reviewing line by line, or using a single-entry coding agent; public material does not
    say which tool it replaces.
  usage_reason: 推断：相较手动复制粘贴与自行执行命令，它把任务交给代理直接读写仓库，并用风险分级权限和 fail-closed 系统级沙箱限制危险动作，用事件溯源会话让改动可回放，从而减少人工搬运与事后无法复盘这两步负担；重视可审计与安全边界的开发者会因此选择它。
  usage_reason_en: 'Inference: versus manual copy-paste and hand-run commands, it lets the agent read/write
    the repo directly while risk-tiered permissions and a fail-closed OS sandbox constrain dangerous actions,
    and event-sourced sessions make changes replayable, removing the manual shuttling and the inability
    to audit afterwards; developers who value auditability and safety boundaries would choose it for that
    reason.'
