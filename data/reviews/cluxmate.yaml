  market: ''
  job: 软件开发者在本机或终端中处理代码仓库，给出编码任务后由代理执行跨文件代码改动，并需要回放会话、按风险分级授权，最终确认改动结果。
  job_en: Software developers working on code repositories locally or in the terminal, giving a coding
    task to an agent that performs cross-file code changes, with replayable sessions and risk-tiered permissions,
    then confirming the result.
  pain: 公开材料显示，编码代理执行改动时存在权限与安全顾虑：需要按风险分级授权、会话可回放、并有系统级沙箱兜底，否则开发者不敢让代理直接操作本地代码。
  pain_en: 'Public material shows permission and safety concerns when a coding agent makes changes: risk-tiered
    authorization, replayable sessions, and an OS-level sandbox are needed, otherwise developers will
    not let an agent operate directly on local code.'
  current_alternative: 开发者目前可能使用云端编码助手或单一入口的代理工具，但公开材料未说明其具体替代对象与旧流程。
  current_alternative_en: Developers may currently use cloud coding assistants or single-entry agent tools,
    but public material does not specify what it replaces or the prior workflow.
  usage_reason: 推断：相较单一入口的编码代理，CluxMate 用同一 Python 内核提供 CLI、TUI 与桌面三种入口，并接任意兼容 OpenAI 的接口，开发者可在已有终端或脚本环境中直接调用；风险分级权限、可回放会话与
    fail-closed 沙箱降低了让代理直接改本地代码的顾虑，因此对需要在受控环境下运行代理的开发者更可能被选择。
  usage_reason_en: 'Inference: versus single-entry coding agents, CluxMate offers CLI, TUI, and desktop
    entries from one Python core and works with any OpenAI-compatible API, so developers can call it from
    existing terminal or script environments; risk-tiered permissions, replayable sessions, and a fail-closed
    sandbox reduce the concern of letting an agent change local code, making it more likely to be chosen
    by developers who need to run agents in a controlled environment.'
