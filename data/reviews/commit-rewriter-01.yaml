  market: ''
  job: 开源维护者在把仓库对外发布或开源前，面对编码代理生成、含私有 issue 编号的提交历史，需要把它改写成可公开的提交信息。
  job_en: Before publishing or open-sourcing a repository, an open-source maintainer faces a commit history
    written by coding agents and containing private issue IDs, and needs to rewrite it into publishable
    commit messages.
  pain: 逐条 git rebase 改写提交信息既慢又容易改错，且一旦出错难以回退；不改则私有编号和代理杂乱内容会随发布暴露。
  pain_en: Rewriting messages one by one with git rebase is slow and error-prone, and mistakes are hard
    to undo; not rewriting exposes private IDs and agent cruft with the release.
  current_alternative: 手工 git rebase -i 逐条编辑，或直接放弃清理、带着杂乱提交信息发布。
  current_alternative_en: Manually editing each commit with git rebase -i, or giving up and publishing
    with the messy messages.
  usage_reason: 相较逐条 rebase，它在网页里集中编辑多条提交信息，并在改写前自动建一个带时间戳的分支用于回退，把“改错就回不去”这一步负担去掉，因此经常发布开源仓库、又用编码代理写代码的维护者会在发布前选择它（推断）。
  usage_reason_en: Compared with one-by-one rebase, it edits many commit messages in one web page and
    automatically creates a timestamped branch for rollback before rewriting, removing the 'cannot undo
    a bad edit' burden, so maintainers who publish repositories often and code with agents are likely
    to reach for it before a release (inference).
