  market: ''
  job: 开源维护者在发布安全补丁或对外版本前，处理本地仓库中由编码代理生成、夹杂私有 issue 编号的提交信息，要产出一份可以公开的提交历史。
  job_en: Before publishing a security patch or public release, an open-source maintainer works through
    commit messages in the local repository that were generated by coding agents and mixed with private
    issue IDs, in order to produce a publishable commit history.
  pain: 这些提交信息直接公开会暴露私有仓库的 issue 编号和内部工作痕迹，逐条手工改写既费时又容易漏掉。
  pain_en: Publishing these commit messages as-is would expose private-repository issue IDs and internal
    working traces, and rewriting them by hand is slow and easy to miss cases.
  current_alternative: 维护者此前靠手工改写提交信息，或使用 git rebase、filter-branch 等通用命令自行处理，没有专门针对发布前清洗历史的流程。
  current_alternative_en: Maintainers previously rewrote messages by hand or used general commands such
    as git rebase and filter-branch, with no workflow dedicated to cleaning history before release.
  usage_reason: 相较手工逐条改写或自行拼 git 命令，它把改写动作收在一个本地网页界面里，并在提交时自动生成带时间戳的分支保存当前状态，减少维护者自己管理备份和回滚的步骤，因此会在发布前清理历史这一环节被选用；这是基于产品能力的推断，尚无留存或复购证据。
  usage_reason_en: Compared with hand-editing each message or assembling git commands, it puts the rewriting
    into a local web interface and automatically creates a timestamped branch on submit, removing the
    step of managing backups and rollbacks yourself; this is an inference from product capability, with
    no retention or repeat-use evidence yet.
