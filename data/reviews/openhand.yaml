  market: ''
  job: 远程问诊患者在线上问诊过程中，需要听懂医生口述的病情解释与用药嘱咐，并在问诊结束后留下可回看的要点。
  job_en: A telehealth patient needs to follow the doctor's spoken explanation and medication instructions
    during an online consultation, and to keep reviewable key points after the visit ends.
  pain: 患者独自面对屏幕问诊时容易听漏或听不懂医嘱，事后想不起医生说了什么，也缺少书面记录。
  pain_en: A patient alone in front of a screen easily misses or misunderstands instructions, cannot recall
    what the doctor said afterwards, and has no written record.
  current_alternative: 旧做法是患者自己记笔记、事后回听录音，或再联系诊所询问，往往不完整也不及时。
  current_alternative_en: The old practice is the patient taking notes, replaying a recording afterwards,
    or calling the clinic again, which is often incomplete and delayed.
  usage_reason: 推断：若该工具在问诊中实时把医生口述转成患者能看懂的要点，就省去了患者边听边记这一步，并在问诊后直接给出可回看的记录，因此独自问诊、担心记不住医嘱的患者会尝试它。
  usage_reason_en: 'Inference: if the tool turns the doctor''s speech into patient-readable key points
    in real time, it removes the step of listening and writing at once and leaves a reviewable record
    after the visit, so patients consulting alone and worried about missing instructions would try it.'
