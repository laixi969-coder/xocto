  next_validation: 获取 Campfire 官方产品页或文档，确认共享工作区里人与编码 agent 各自的动作和最终交付物。
  market: ''
  job: 多名开发者与编码 agent 同时推进同一项编码工作时，需要在共享工作区里查看和接手 agent 的产出。
  job_en: When several developers and coding agents push the same coding work forward, they need a shared
    workspace to view and take over the agent's output.
  pain: 公开材料只给出定位描述，没有说明共享工作区里谁在什么节点做什么、哪一步变轻松，痛点无法从现有事实还原。
  pain_en: The public material gives only a positioning line and does not say who does what at which step
    in the shared workspace or which step gets easier, so the pain cannot be reconstructed from available
    facts.
  current_alternative: 开发者通常在各自终端里运行编码 agent，再通过代码评审或聊天工具同步结果。
  current_alternative_en: Developers typically run coding agents in their own terminals and then sync
    results through code review or chat tools.
  usage_reason: 推断：若工作区对人和 agent 共享，团队可能省去在终端与评审工具之间来回同步的一步；但公开材料未说明这一动作如何发生，也没有采用或留存证据，因此无法确认用户为何选择它。
  usage_reason_en: 'Inference: if the workspace is shared between people and agents, a team might skip
    syncing back and forth between terminals and review tools; however the public material does not describe
    that action and there is no adoption or retention evidence, so why users would choose it cannot be
    confirmed.'
