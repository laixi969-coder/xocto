  market: ''
  job: 3D 打印从业者或工业设计师在 Blender 中建模时，处理模型脚本与可打印性要求，完成可交付打印的零件模型。
  job_en: 3D-printing practitioners or industrial designers modeling in Blender, handling model scripts
    and printability requirements to produce a printable part model.
  pain: 在 Blender 里用脚本建模需要熟悉 bpy 接口，且模型是否可打印往往要等到切片或打印阶段才暴露问题，返工成本高。
  pain_en: Scripted modeling in Blender requires familiarity with the bpy API, and printability problems
    often surface only at slicing or printing time, making rework costly.
  current_alternative: 目前多由设计师手工编写 bpy 脚本、反复在 Blender 中试错，或依赖通用编码助手生成脚本后再人工检查可打印性。
  current_alternative_en: Today designers typically hand-write bpy scripts, iterate by trial and error
    in Blender, or use general coding assistants to generate scripts and then manually check printability.
  usage_reason: 推断：相较手工写脚本再试错，它用经核验的 bpy 知识库生成脚本，并以 AGENT_OK/AGENT_FAIL 契约和生产闸门在生成阶段就筛掉不可打印的零件，减少切片后才发现问题的那一步返工；因此需要批量产出可打印零件的设计或打印服务团队会尝试它。
  usage_reason_en: 'Inference: compared with hand-writing scripts and iterating, it generates scripts
    from a verified bpy knowledge base and filters out non-printable parts at generation time via the
    AGENT_OK/AGENT_FAIL contract and production gate, cutting the rework step of discovering problems
    only after slicing; design or printing-service teams producing printable parts in volume would try
    it.'
