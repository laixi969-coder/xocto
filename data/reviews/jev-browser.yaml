    a program must operate dynamic web pages (login, form fill, click, scrape flows); an LLM plans steps,
    Jev makes type-safe decisions per step, and the library, CLI, or MCP server emits executable browser
    actions.
  pain: 传统 Playwright/Selenium 脚本依赖固定选择器，页面改版即失效，维护成本高；纯 LLM 浏览器代理又容易在步骤间产生不可预测的动作，缺少类型约束与可核对的决策边界。
  pain_en: Traditional Playwright/Selenium scripts depend on fixed selectors and break on page changes,
    creating high maintenance cost; pure LLM browser agents produce unpredictable actions between steps,
    lacking type constraints and checkable decision boundaries.
  current_alternative: 工程师目前用 Playwright/Selenium 手写脚本，或直接调用通用 LLM 浏览器代理（如 browser-use 类工具），前者脆弱、后者决策不可控。
  current_alternative_en: Engineers currently hand-write Playwright/Selenium scripts or call general LLM
    browser agents (browser-use-like tools); the former is brittle, the latter has uncontrolled decisions.
  usage_reason: 推断：相较手写选择器脚本，它把“每步该做什么”交给 LLM 规划、把“动作是否合法”交给 Jev 类型系统约束，减少页面改版后逐行修选择器的负担；相较纯 LLM 代理，类型安全决策让每步动作可核对，因此需要稳定自动化流程又不想维护脆弱脚本的工程师会在动态站点任务中选择它。
  usage_reason_en: 'Inference: versus hand-written selector scripts, it lets the LLM plan each step while
    Jev''s type system constrains whether an action is legal, reducing the burden of fixing selectors
    line by line after page changes; versus pure LLM agents, type-safe decisions make each step checkable,
    so engineers needing stable automation without brittle scripts would choose it for dynamic-site tasks.'
