  market: ''
  job: 自动化测试或数据采集工程师在需要让程序代替人工完成网页点击、填表和流程抓取时，处理的是浏览器里的页面与表单，要完成的是把一段自然语言任务变成可重复执行的浏览器操作序列。
  job_en: Automation test or data collection engineers, when a program must replace manual clicking, form
    filling and flow scraping in a browser, work on pages and forms and need to turn a natural-language
    task into a repeatable sequence of browser actions.
  pain: 网页结构一变，写死的选择器就失效，维护脚本要反复返工；让模型直接操作浏览器又容易在关键步骤做出不可预期的动作。
  pain_en: When page structure changes, hard-coded selectors break and scripts need repeated rework; letting
    a model drive the browser directly risks unpredictable actions at critical steps.
  current_alternative: 目前多用手写 Playwright/Selenium 脚本，或直接用通用大模型加浏览器插件逐步操作，前者脆弱、后者不可控。
  current_alternative_en: Today people mostly hand-write Playwright/Selenium scripts, or drive a general
    model with a browser extension step by step; the former is brittle, the latter uncontrollable.
  usage_reason: 推断：它把“规划”和“决策”分开，模型只出计划、Jev 在每步做类型安全判断，理论上能减少选择器失效后的重写和模型乱点两处负担，因此会被受够脚本维护的自动化工程师在流程频繁变动的站点上试用；但公开材料没有用户反馈或重复使用证据，这一环尚缺。
  usage_reason_en: 'Inference: by separating planning from decision-making, with the model only producing
    a plan and Jev making type-safe choices per step, it could reduce both selector-rewrite work and erratic
    model clicks, so automation engineers tired of script maintenance may try it on frequently changing
    sites; public material has no user feedback or repeat-use evidence, so that link is missing.'
