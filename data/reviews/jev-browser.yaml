  market: ''
  job: 自动化测试与网页数据采集工程师在需要让程序自动操作网页（填表、点击、走多步流程）时，把任务交给 jev-browser：LLM 负责规划步骤，Jev 负责在每一步做类型安全的决策，最终通过库、CLI
    或 MCP 服务端输出可执行的浏览器操作。
  job_en: 'Automation test and web data collection engineers hand a web task (form filling, clicking,
    multi-step flows) to jev-browser: the LLM plans steps, Jev makes type-safe decisions at each step,
    and the result is delivered as executable browser actions via library, CLI, or MCP server.'
  pain: LLM 直接驱动浏览器时，每一步动作缺少类型约束，容易产生无效或错误操作，导致流程中断、需要人工重试；工程师因此要反复调试提示词与选择器，把本应自动化的流程变成半人工维护。
  pain_en: When an LLM drives a browser directly, each action lacks type constraints, so invalid or wrong
    operations break the flow and force manual retries; engineers end up repeatedly debugging prompts
    and selectors, turning an automation task into semi-manual maintenance.
  current_alternative: 当前替代方式包括手写 Playwright/Selenium 脚本、用 LLM 直接生成并执行浏览器动作、或使用其他浏览器自动化 Agent 框架；这些做法要么维护成本高，要么缺少类型安全约束。
  current_alternative_en: Current alternatives include hand-written Playwright/Selenium scripts, letting
    an LLM generate and execute browser actions directly, or other browser-automation agent frameworks;
    these are either high-maintenance or lack type-safe constraints.
  usage_reason: 相较手写脚本或让 LLM 直接操作浏览器，jev-browser 把决策步骤交给类型安全的 Jev 层，在每一步动作执行前做类型校验，减少因无效动作导致的流程中断和人工重试；需要稳定、可复现网页自动化的工程师会在流程复杂、易出错时选择它。这是基于产品能力与任务结构的推断，尚无用户反馈或案例佐证。
  usage_reason_en: Compared with hand-written scripts or letting an LLM act directly, jev-browser routes
    decisions through a type-safe Jev layer that validates each action before execution, reducing flow
    breaks and manual retries caused by invalid actions; engineers needing stable, reproducible web automation
    would choose it for complex, error-prone flows. This is an inference from product capability and task
    structure, not yet supported by user feedback or cases.
