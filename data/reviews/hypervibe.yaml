    on memory and manual inspection to spot which task is stuck.
  usage_reason: 推断：把多个 agent 的任务与状态收敛到同一块画布，省去逐个窗口切换与人工比对这一步，因此同时跑多仓库任务的小团队会在任务数超过两三个时选择它。
  usage_reason_en: 'Inference: by converging several agents'' tasks and status onto one board, it removes
    the step of switching windows and comparing manually, so small teams running tasks across repositories
    would pick it once task count exceeds two or three.'
