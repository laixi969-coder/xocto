  market: ''
  job: 图像编辑者在修图时，选中画面中需要补全或替换的局部区域，用文字描述该处应出现的内容，把生成结果作为可混合、调色、蒙版和导出的图层，与其余图层编辑流程一起完成成图。
  job_en: An image editor retouching a picture selects a local region to fill or replace, describes in
    text what should appear there, and receives the generated result as a layer that can be blended, colour-matched,
    masked and exported alongside the rest of the layer-editing workflow.
  pain: 局部修补通常要在生成工具与图层编辑器之间来回搬运，生成结果往往不带图层、蒙版和色彩匹配能力，编辑者需手工对齐与融合；Scumble 把生成结果直接落成图层，减少这一步搬运与再加工。
  pain_en: Local patching usually requires shuttling between a generation tool and a layer editor, and
    generated results often arrive without layer, mask or colour-matching affordances, forcing manual
    alignment and blending; Scumble lands the generated result directly as a layer, cutting that shuttling
    and rework.
  current_alternative: 公开材料未直接列出替代品，但可推断旧做法是专业修图软件的仿制图章/内容识别填充，或把局部区域导出到云端修补服务与独立生成模型后再导回图层编辑器。
  current_alternative_en: 'The material does not list alternatives directly, but the prior practice is
    inferable: clone-stamp or content-aware fill in professional retouching software, or exporting the
    region to a cloud inpainting service or standalone generative model and re-importing it into the layer
    editor.'
  usage_reason: 推断：相较旧做法，它把生成结果直接作为图层返回，并复用编辑者已有的 ComfyUI 或自带 API key 的模型，因此编辑者不必在生成工具与图层编辑器之间导出导入，也不必为生成能力另付订阅；会在本地或租用服务器上已有
    ComfyUI、且需要图层级融合的修图者更可能选择它。
  usage_reason_en: 'Inference: versus the old way, it returns the generated result directly as a layer
    and reuses the editor''s existing ComfyUI or a model behind their own API key, so the editor avoids
    export/import between a generation tool and the layer editor and avoids a separate subscription for
    generation; retouchers who already run ComfyUI locally or on a rented server and need layer-level
    blending are more likely to choose it.'
