  job_en: A travel advisor or independent planner assembling a multi-city trip processes flight, lodging
    and activity information to produce a collaborative, verified itinerary.
  pain: 行程信息分散在多个预订与点评平台，手工拼接耗时且容易出错，客户改一处就要重排整份行程。
  pain_en: Itinerary information is scattered across booking and review platforms; manual assembly is
    slow and error-prone, and one client change forces a full re-plan.
  current_alternative: 用电子表格、文档或攻略网站手工整理，再通过邮件或聊天反复与客户确认。
  current_alternative_en: Manually compiling in spreadsheets, documents or guide sites, then confirming
    with clients repeatedly over email or chat.
  usage_reason: 推断：若产品能自动抓取并核验航班与住宿信息、生成可共享的行程，规划者就省去逐条查证和排版这一步，客户改行程时也能在同一份文档上协作；这依赖核验与协作功能真实可用，公开材料尚未展示。
  usage_reason_en: 'Inference: if the product automatically gathers and verifies flight and lodging details
    and produces a shareable itinerary, planners skip manual cross-checking and formatting, and clients
    can collaborate on one document when plans change; this depends on verification and collaboration
    actually working, which public materials do not yet show.'
