  market: ''
  job: 开发者在 Codex 里做长会话、反复贴截图排查问题时，需要在发下一条消息前决定哪些历史图片继续占用上下文，让任务能接着跑而不必重开会话。
  job_en: A developer running a long Codex session and repeatedly pasting screenshots to debug needs to
    decide, before sending the next message, which past images still occupy context so the task can continue
    without restarting the session.
  pain: 历史图片一直留在上下文里，请求越来越重、越来越贵，用户要么忍受成本，要么重开会话丢掉之前的排查线索。
  pain_en: Past images stay in context, making requests heavier and more expensive; the user either absorbs
    the cost or restarts the session and loses earlier debugging threads.
  current_alternative: 旧做法是手动重开会话、把图片另存到本地再重新贴，或者干脆不管成本继续发。
  current_alternative_en: The old behaviour is manually restarting the session, saving images locally
    and re-pasting them, or simply ignoring the cost and continuing.
  usage_reason: 推断：插件把“重开会话或手动整理附件”这一步换成发送前勾选，因此经常用截图排查、又对 token 成本敏感的开发者会尝试它；仓库 90 星说明有开发者关注，但没有使用频率或留存证据。
  usage_reason_en: 'Inference: the plugin replaces ''restart the session or manually tidy attachments''
    with a checkbox before sending, so developers who debug with screenshots and are sensitive to token
    cost would try it; 90 stars indicate developer attention, but there is no usage-frequency or retention
    evidence.'
