  job_en: Mac users whose hands are busy or who switch apps constantly need to open files, switch windows
    or run commands without leaving the current screen, and end up with an action already performed on
    the computer.
  pain: 键盘快捷键和鼠标操作要求手离开当前任务，跨应用操作还要记住各家的快捷方式，切换成本高且打断注意力。
