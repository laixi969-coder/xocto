    memorizing each app's shortcuts, so switching is costly and breaks attention.
  current_alternative: 现在靠系统快捷键、Spotlight、脚本工具或通用语音助手，前者要记组合键，后者多数只返回文字而不真正执行操作。
  current_alternative_en: Today people rely on system shortcuts, Spotlight, scripting tools or general
    voice assistants; the former require memorizing key combinations and the latter mostly return text
    instead of actually performing actions.
  usage_reason: 相较记快捷键或手动点菜单，它把“说出意图”直接映射为系统动作，省掉查找入口和切换窗口的步骤，因此双手被占用或频繁跨应用操作的用户会先试；这是基于产品能力的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with memorizing shortcuts or clicking through menus, it maps a spoken intent
    directly to a system action, removing the step of finding the entry point and switching windows, so
    users with busy hands or heavy cross-app work would try it first; this is an inference from product
    capability, not user feedback.
