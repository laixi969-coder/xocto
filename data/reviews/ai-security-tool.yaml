  market: ''
  job: 安全工程师或 DevSecOps 工程师在资产巡检与漏洞排查时，通过一个终端同时连接 SSH、SFTP、RDP、VNC、串口等异构目标，把连接对象交给接入的 DeepSeek、OpenAI
    等模型代理执行扫描，产出 CVE 与 SBOM 清单，再人工确认处置。
  job_en: A security or DevSecOps engineer doing asset inspection and vulnerability triage connects to
    heterogeneous targets (SSH, SFTP, RDP, VNC, serial) from one terminal, hands them to DeepSeek/OpenAI-backed
    agents to run scans, and produces CVE and SBOM inventories for human confirmation.
  pain: 公开材料只说明它做 CVE 与 SBOM 扫描，未提供用户抱怨、频率或不采用代价；可结构推理的痛点是多协议资产需在多个客户端间切换、扫描与依赖清单分散在不同工具，人工汇总耗时且易漏。
  pain_en: Public materials only state that it scans CVE and SBOM; no user complaints, frequency, or cost
    of inaction are given. The structurally inferable pain is that multi-protocol assets require switching
    among clients and that scan and dependency inventories are scattered across tools, making manual consolidation
    slow and leaky.
  current_alternative: 旧做法通常是分别使用 ssh、mstsc、VNC 客户端、串口工具，再叠加独立的漏洞扫描器与 SBOM 生成器，结果靠人工汇总；公开材料未说明它具体替代了哪一款工具。
  current_alternative_en: The old approach is typically separate ssh, mstsc, VNC and serial clients plus
    standalone vulnerability scanners and SBOM generators, with results consolidated by hand; public materials
    do not say which specific tools it replaces.
  usage_reason: 推断：相较在多个客户端与扫描器之间切换并手工汇总，它把多协议连接与 AI 代理扫描收进同一终端，减少一次工具切换与一次结果搬运，因此需要同时巡检异构资产、又希望扫描与依赖清单一次产出的安全工程师会在该场景选择它；尚无用户反馈证实这一动机。
  usage_reason_en: 'Inference: versus switching among clients and scanners and consolidating by hand,
    it puts multi-protocol connections and AI-agent scanning into one terminal, removing one tool switch
    and one result hand-off, so a security engineer inspecting heterogeneous assets who wants scans and
    dependency inventories produced together would choose it in that situation; no user feedback yet confirms
    this motive.'
