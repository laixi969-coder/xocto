  job_en: Amateur badminton players or coaches reviewing a match after play hand full match footage to
    CourtMind, which extracts stroke and rally information from the video and outputs a reviewable analysis.
  pain: 业余选手和教练赛后只能靠记忆或反复拖拽录像回看，缺少逐回合的击球与回合记录，复盘时难以定位具体失误和模式。
  pain_en: Amateur players and coaches can only rely on memory or repeatedly scrubbing footage after a
    match, lacking per-rally stroke and rally records, making it hard to pinpoint specific errors and
    patterns during review.
  current_alternative: 目前主要靠人工回看录像、教练口头点评，或使用通用视频播放器手动标记片段。
  current_alternative_en: Today this is mainly done by manually rewatching footage, verbal coach feedback,
    or manually marking clips in a generic video player.
  usage_reason: 推断：相较人工回看录像，CourtMind 通过从整场比赛视频中自动提取击球与回合信息，省去逐段拖拽和手工记录这一步，因此赛后想系统复盘但缺少专业分析工具的业余选手或教练可能选择它；公开材料未给出客户案例或付费证据。
