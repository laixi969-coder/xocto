    what is detected, what is output, or who confirms it, so the actual user bottleneck cannot be identified.
  current_alternative: 选手和教练目前靠人工反复拖进度条看录像、口头点评，或干脆不复盘。
  current_alternative_en: Players and coaches currently rewatch footage manually, give verbal feedback,
    or skip review altogether.
  usage_reason: 推断：如果它能把整段录像自动切成回合并标出可核对的击球点，就能省掉人工逐段找片段这一步，带多名学员的教练会更有理由使用；但缺少任何用户反馈或交付样例，这一因果尚未被公开材料支持。
  usage_reason_en: 'Inference: if it automatically segments a full recording into rallies and marks checkable
    shot points, it removes the manual step of hunting for clips, which would matter most to coaches handling
    several students; however no user feedback or sample output is public, so this causal claim is not
    yet supported.'
