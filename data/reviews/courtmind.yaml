  market: ''
  job: 业余羽毛球选手或教练在打完一场比赛后，面对整段比赛录像，想找出自己或学员的击球与跑位问题，用于下一阶段训练。
  job_en: After a match, an amateur badminton player or coach works through the full match recording to
    identify shot and movement problems for the next training cycle.
  pain: 公开材料只给出“从任意比赛视频生成 AI 教练”这一句，没有说明它具体识别什么、输出什么、谁来确认，因此无法判断用户到底卡在哪一步。
