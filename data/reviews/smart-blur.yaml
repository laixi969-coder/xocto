  market: ''
  job: 合规或法务人员在需要把截图、录屏、案件材料发给外部合作方时，要先找出画面里的身份证号、人脸等个人信息并逐处打码，再交付一份可外发的文件。
  job_en: A compliance or legal staffer preparing to send screenshots, recordings or case material to
    an outside party must first locate ID numbers, faces and other personal data in the image and blur
    each one before delivering a shareable file.
  pain: 手工逐帧逐处打码耗时且容易漏，漏掉一处就可能构成个人信息泄露；把材料上传到云端脱敏工具又常常不被合规允许。
  pain_en: Manual frame-by-frame blurring is slow and easy to miss, and a single missed spot can count
    as a personal-data leak; uploading the material to a cloud redaction tool is often not permitted by
    compliance.
  current_alternative: 目前多由人工用图片或视频编辑软件逐处涂抹打码，或使用云端脱敏服务，也有团队干脆放弃外发、改为线下传阅。
  current_alternative_en: Today people blur spots by hand in image or video editors, use cloud redaction
    services, or simply give up on external sharing and circulate material offline.
  usage_reason: 推断：相较手工逐处打码，它把识别与打码合并成一次自动动作，省掉逐帧查找这一步，且模型在本地运行、材料不出本机，因此对材料不能上传云端、又要频繁外发的合规与法务人员更有吸引力；但公开材料未给出识别准确率、漏检处理和留存证据。
  usage_reason_en: 'Inference: versus manual spot-by-spot blurring it merges detection and redaction into
    one automatic action, removing the frame-by-frame search step, and because the model runs locally
    the material never leaves the machine, which appeals to compliance and legal staff who cannot upload
    material to the cloud yet must share it often; public material gives no accuracy rate, missed-detection
    handling or retention evidence.'
