  market: ''
  job: 软件开发者在自己电脑上处理代码库，需要让智能体读取项目、生成或修改代码，并拿到可运行的改动。
  job_en: A software developer works on a codebase on their own machine, needing an agent to read the
    project, generate or modify code, and produce runnable changes.
  pain: 开发者要在编辑器、终端和模型服务之间切换，前沿模型调用成本高，配置与额度管理占用时间。
  pain_en: Developers switch among editor, terminal and model services, frontier model calls are costly,
    and configuring quotas takes time.
  current_alternative: 开发者目前使用现有编码助手、编辑器插件或自行接入模型 API，按用量付费并自行管理密钥与额度。
  current_alternative_en: Developers currently use existing coding assistants, editor plugins or self-wired
    model APIs, paying by usage and managing keys and quotas themselves.
  usage_reason: 推断：相较自行接入模型 API，它把前沿模型访问打包进桌面客户端，减少配置与额度管理这一步，因此对想低成本试用前沿模型的开发者有吸引力；但公开材料没有用户反馈或留存证据，无法确认长期使用。
  usage_reason_en: 'Inference: versus self-wiring model APIs, it bundles frontier model access into a
    desktop client, removing the configuration and quota-management step, which attracts developers wanting
    low-cost trials of frontier models; public materials show no user feedback or retention evidence,
    so long-term use is unconfirmed.'
