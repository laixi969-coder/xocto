  market: ''
  job: 独立开发者在 vibe coding 出初版后，把需要检查和修复的代码事项整理成验收清单，交给 AI 逐项处理并回收带说明和截图的结果，自己再逐项验收。
  job_en: After vibe-coding a first version, an indie developer turns code items that need checking and
    fixing into an acceptance checklist, hands it to an AI to process item by item, and collects results
    with notes and screenshots for their own acceptance.
  pain: AI 一次能改很多处，但改动是否真的完成、有没有副作用，需要人逐条核对；散落在对话里的结果没有清单承载，容易漏项或重复确认。
  pain_en: An AI can change many places at once, but whether each change is really done and side-effect
    free still needs human checking; results scattered in a chat have no checklist to hold them, so items
    get missed or re-confirmed.
  current_alternative: 现在多是把需求直接写进对话让 AI 改，改完自己在编辑器里翻 diff、跑测试，靠记忆或临时笔记跟踪哪些还没做。
  current_alternative_en: Today most people paste requirements into a chat, let the AI edit, then read
    diffs and run tests themselves, tracking what is left from memory or ad-hoc notes.
  usage_reason: 相较在对话里反复追问，它把任务清单本身作为 AI 的输入和交付回执：AI 必须带说明和截图提交，验收通过才勾掉，减少了人重新整理“哪些做完了”这一步；推断，适合已有明确验收标准的独立开发者。
  usage_reason_en: 'Compared with repeatedly asking in a chat, it makes the task list itself the AI''s
    input and delivery receipt: the AI must submit with notes and screenshots and the item is only checked
    off after acceptance, removing the step of re-assembling what is done; inference, suited to indie
    developers who already have clear acceptance criteria.'
