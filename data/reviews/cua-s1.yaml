  market: ''
  job: 做流程自动化的工程师或 RPA 实施顾问，在目标系统没有可用 API、只能靠人操作桌面界面时，需要让程序完成这些界面操作。
  job_en: An automation engineer or RPA consultant needs a program to perform desktop interface operations
    when the target system has no usable API and only humans can operate the screens.
  pain: 没有 API 的老系统只能靠人工点击录入，脚本一旦界面改版就失效，维护成本高。
  pain_en: Legacy systems without APIs require manual clicking and entry, and scripts break whenever the
    interface changes, making maintenance costly.
  current_alternative: 录制式 RPA 脚本、按键精灵类工具，或直接安排人工重复录入。
  current_alternative_en: Recorded RPA scripts, macro tools, or simply assigning staff to repeat the data
    entry.
  usage_reason: 推断：若该模型能在界面变化时仍稳定完成操作，就省掉了逐条维护脚本这一步；但公开材料没有基准、许可与部署说明，无法判断哪类团队会在什么情况下选它。
  usage_reason_en: 'Inference: if the model still completes operations reliably when interfaces change,
    it removes the step of maintaining scripts one by one; but with no benchmarks, licence or deployment
    documentation, which teams would choose it and when cannot be judged.'
