  verdict: true_demand
  signal_level: 初步成立
  gates:
  - gate: value
    status: supported
    reason: 它解决多智能体并行时上下文无法共享、靠人工搬运的问题，痛点具体且不解决的后果是重复劳动与状态不一致；买方是谁公开材料未说明。
    evidence_ids:
    - ev-464f0b00de7fde84
  - gate: consensus
    status: insufficient
    reason: 仅有社区讨论热度，没有客户案例或团队采用证据，无法判断是否形成共识。
    evidence_ids:
    - ev-464f0b00de7fde84
  - gate: model
    status: insufficient
    reason: 未见定价页或付费路径，钱可能来自开发者自付或团队采购，这是判断而非已验证事实。
    evidence_ids:
    - ev-464f0b00de7fde84
  - gate: truth
    status: insufficient
    reason: 加密实现、权限边界与是否真能确定性同步状态均未公开，交付确定性无法核对。
    evidence_ids:
    - ev-464f0b00de7fde84
  next_validation: 收集 Jotbus 官方文档或定价页，确认加密机制、权限模型与计费方式。
  market: ''
  job: 同时运行多个编码智能体的开发者，在多个智能体需要读写同一份上下文时，处理中间笔记、代码片段和任务状态，要完成让各智能体看到一致信息并继续推进任务。
  job_en: A developer running several coding agents at once handles intermediate notes, code snippets
    and task state when the agents must read and write one shared context, so that every agent sees consistent
    information and can continue the task.
  pain: 智能体各自持有会话上下文，跨进程传递靠人工复制粘贴，信息容易丢失或版本不一致，导致重复劳动和错误结论。
  pain_en: Each agent holds its own session context, so passing information across processes relies on
    manual copy-paste; details get lost or versions diverge, causing duplicated work and wrong conclusions.
  current_alternative: 把上下文粘进每个智能体的提示词、用共享文件或临时脚本在会话之间搬运信息。
  current_alternative_en: Pasting context into each agent's prompt, or moving information between sessions
    with shared files or ad-hoc scripts.
  usage_reason: 相较手工复制粘贴，它把共享状态集中到一个加密草稿板，智能体直接读写同一份记录，减少人工搬运这一步，因此并行跑多个智能体的开发者会在上下文需要同步时选择它；这是基于产品能力的推断，尚无用户反馈支持。
  usage_reason_en: Compared with manual copy-paste, it centralises shared state in one encrypted scratchpad
    that agents read and write directly, removing the manual transfer step, so developers running parallel
    agents would pick it when context must stay in sync; this is an inference from product capability,
    not supported by user feedback yet.
