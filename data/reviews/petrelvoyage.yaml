  market: ''
  job: 自由行旅客在出发前规划多日多城市行程时，处理景点清单、交通与住宿信息，要产出一份逐日可执行的行程表。
  job_en: An independent traveler planning a multi-day, multi-city trip works from a list of sights, transport
    and lodging details to produce a day-by-day executable itinerary.
  pain: 手工排行程要在攻略帖、地图和表格之间反复搬运，容易忽略通勤时间和开放时间，改一次要重排全表。
  pain_en: Hand-building an itinerary means shuttling between guide posts, maps and spreadsheets, easily
    missing travel time and opening hours, and any change forces a full re-plan.
  current_alternative: 旧做法是看攻略帖、用地图逐个查距离，再在表格或备忘录里手工排顺序。
  current_alternative_en: The old way is reading guide posts, checking distances one by one on maps, then
    ordering stops by hand in a spreadsheet or notes app.
  usage_reason: 相较手工排表，它把景点、交通与住宿信息一次性转成逐日行程，省掉逐条查距离和重排顺序这一步；对行程较长、改动频繁的自由行旅客更有价值。这是基于产品能力的推断，尚无留存或复购证据。
  usage_reason_en: Compared with manual scheduling, it turns sights, transport and lodging into a day-by-day
    plan in one pass, removing the step of checking each distance and reordering stops; most valuable
    for travelers with long or frequently changing trips. This is inference from product capability, with
    no retention or repeat-use evidence yet.
