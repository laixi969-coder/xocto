  market: ''
  job: 研发团队的平台/基础设施工程师要在公司内网或云上为多名成员部署 DeepSeek Harness（dsh）编码代理，需要给每人分配互相隔离、可持久保存且带资源上限的工作区，并统一管理访问权限。
  job_en: Platform or infrastructure engineers on an R&D team need to deploy DeepSeek Harness (dsh) coding
    agents for multiple members on an internal network or cloud, giving each person an isolated, persistent
    workspace with resource caps and unified access control.
  pain: dsh 本身是单实例工具，多人共用时工作区会互相污染、文件与凭据混在一起，且没有配额约束，单个成员跑满资源会影响其他人；团队只能靠手工起容器、逐个分配机器来绕开，运维负担落在平台工程师身上。
  pain_en: dsh itself is a single-instance tool; when shared by a team, workspaces contaminate each other,
    files and credentials mix, and there is no quota, so one member can exhaust resources for everyone.
    Teams work around this by hand-starting containers and assigning machines one by one, pushing the
    operational burden onto platform engineers.
  current_alternative: 团队自行用 Docker、虚拟机或调度工具手工搭建多用户环境，或让成员各自在本机跑 dsh、靠人工约定目录和端口，缺少统一的隔离、持久化与配额管理。
  current_alternative_en: Teams hand-build multi-user setups with Docker, VMs or schedulers, or let each
    member run dsh locally with manual conventions for directories and ports, lacking unified isolation,
    persistence and quota management.
  usage_reason: 推断：相较手工起容器，dsh-cloud 把每个实例放进隔离容器或 microVM、自动挂载持久工作区并施加资源配额，省掉逐台分配机器和手工配置隔离这一步，因此需要给多名成员统一发放
    dsh 环境的平台工程师会在内部部署时选择它。
  usage_reason_en: 'Inference: versus hand-starting containers, dsh-cloud places each instance in an isolated
    container or microVM, auto-mounts persistent workspaces and enforces resource quotas, removing the
    step of assigning machines and configuring isolation by hand, so platform engineers who must provision
    dsh for multiple members would choose it for internal deployment.'
