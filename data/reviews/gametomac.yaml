    running.
  pain: Mac 原生不支持大量 Windows 游戏，手动配置兼容层对普通玩家门槛高，失败后没有明确原因。
  pain_en: Mac natively supports few Windows games, manual compatibility-layer setup is a high bar for
    ordinary players, and failures give no clear cause.
  current_alternative: 使用已有的兼容层工具手动配置，或改用云游戏、双系统、另购 Windows 设备。
  current_alternative_en: Manually configuring existing compatibility-layer tools, or switching to cloud
    gaming, dual boot or a separate Windows machine.
  usage_reason: 推断：若 AI 能自动判断并修补兼容配置，可省去玩家查教程、逐项试参数的一步；但公开材料未给出可运行游戏清单与性能数据，无法确认它比现有兼容层工具更省事。
  usage_reason_en: 'Inference: if AI can automatically diagnose and patch compatibility settings, it saves
    players the step of hunting tutorials and trying parameters one by one; but no runnable-title list
    or performance data is public, so it cannot be confirmed as easier than existing compatibility tools.'
