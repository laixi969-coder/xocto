  market: ''
  job: 医生在接诊后需要将口头诊疗记录整理成结构化文档并写入 EHR。
  job_en: Physicians need to turn spoken encounter notes into structured documentation and enter them
    into EHRs.
  pain: 手动录入耗时且容易出错，占用医生大量时间。
  pain_en: Manual entry is time-consuming and error-prone, taking significant physician time.
  current_alternative: 医生手动打字或使用传统听写软件，再复制粘贴到 EHR。
  current_alternative_en: Physicians type manually or use traditional dictation software, then copy-paste
    into EHR.
  usage_reason: AI 听写能减少打字时间，且 EHR 集成省去复制粘贴步骤，因此医生和医疗机构会关注。
  usage_reason_en: AI dictation reduces typing time, and EHR integration eliminates copy-paste, so physicians
    and institutions are interested.
