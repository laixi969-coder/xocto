  market: ''
  job: 短视频创作者和广告片导演在写 AI 视频提示词时，要把镜头角度、运镜、布光、构图、调色这些拍摄要求转成模型能懂的英文提示词，最终产出可用的视频片段。
  job_en: Short-video creators and commercial directors writing AI video prompts must translate shooting
    requirements such as camera angle, movement, lighting, composition and grading into model-readable
    prompt text, ending with usable video clips.
  pain: 非英语创作者缺少镜头语言词汇，只能反复试错或写笼统描述，生成结果与预期构图、运镜不符，重试消耗算力和时间。
  pain_en: Non-English creators lack camera-language vocabulary, so they guess repeatedly or write vague
    descriptions, and outputs miss the intended framing or movement, burning compute and time on retries.
  current_alternative: 现在多靠英文摄影教程、零散博客词表、在社区里问人或直接反复重写提示词。
  current_alternative_en: Today they rely on English cinematography tutorials, scattered blog glossaries,
    asking in communities, or simply rewriting prompts over and over.
  usage_reason: 相较翻教程和反复试错，它把 700 多个镜头术语按角度、运镜、布光、构图、调色归类并配越南语解释，创作者可直接查词替换，减少一轮轮盲试；这是基于产品能力的推断，尚无留存或复购证据。
  usage_reason_en: Compared with reading tutorials and trial-and-error, it groups 700+ shot terms by angle,
    movement, lighting, composition and grading with Vietnamese explanations so creators can look up and
    substitute terms directly, cutting blind retries; this is inference from product capability, with
    no retention or repeat-use evidence yet.
