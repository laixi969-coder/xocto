  market: ''
  job: Mac 用户在日常使用电脑时，把屏幕（含刘海区域）交给 AdsNotch 作为广告展示位，希望在不改变用机习惯的前提下获得收益；广告主则希望买到个人设备屏幕上的展示位。
  job_en: Mac users hand their screen (including the notch area) to AdsNotch as ad inventory while working,
    hoping to earn without changing habits; advertisers want to buy display inventory on personal device
    screens.
  pain: 用户侧是闲置屏幕面积没有变现渠道；广告主侧是常规网页与 App 广告位拥挤、注意力分散。但公开材料没有说明用户是否真的在意这点收益，也没有广告主需求或投放行为的证据。
  pain_en: On the user side, idle screen area has no monetisation channel; on the advertiser side, conventional
    web and app inventory is crowded and attention is fragmented. But public material shows no evidence
    that users care about this payout or that advertisers demand such placements.
  current_alternative: 用户侧旧做法是不变现，或靠浏览器插件、返利类工具获得小额收益；广告主侧旧做法是投网页、App 与视频贴片广告。
  current_alternative_en: Users previously did nothing, or used browser extensions and cashback-style
    tools for small payouts; advertisers previously bought web, in-app and video pre-roll inventory.
  usage_reason: 推断：它把变现动作压缩到“装上即展示”，省去用户主动找广告主或接单的一步，因此可能吸引愿意用屏幕面积换零钱的 Mac 用户。但收益规模、结算是否真实发生、广告主是否愿意为此付费均无公开证据，无法确认用户会持续留在工作流里。
  usage_reason_en: 'Inference: it compresses monetisation into ''install and it displays'', removing the
    step of users finding advertisers themselves, which may attract Mac users willing to trade screen
    area for small change. However, payout size, whether settlement actually happens, and whether advertisers
    will pay are unsupported publicly, so sustained use cannot be confirmed.'
