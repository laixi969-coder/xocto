  market: ''
  job: 开发者在让代理执行多步工程任务时，希望代理在运行中调整自己的做法，而不是每一步都靠人重新下指令。
  job_en: A developer running a multi-step engineering task through an agent wants the agent to adjust
    its own approach mid-run instead of re-instructing it at every step.
  pain: 公开材料只有一句自述，没有说明现有代理在哪一步失败、失败代价多大，也没有用户抱怨或替代做法记录。
  pain_en: Public material is a single self-description; it does not say where existing agents fail or
    how costly that failure is, and no user complaints or workarounds are recorded.
  current_alternative: 人工逐步重写提示、手动重跑失败步骤，或使用固定流程的代理编排。
  current_alternative_en: Manually rewriting prompts step by step, re-running failed steps by hand, or
    using fixed-flow agent orchestration.
  usage_reason: 推断：如果自我改进确实减少了人工重下指令的次数，开发者会在长链路、可回滚的任务中选择它；但公开材料未给出任何减少负担的具体动作，这只是推断。
  usage_reason_en: 'Inference: if self-improvement genuinely cuts the number of manual re-instructions,
    developers would choose it for long-chain, rollback-friendly tasks; but public material gives no concrete
    action that reduces effort, so this is inference only.'
