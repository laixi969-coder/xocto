  market: ''
  job: 科研人员在设计实验或检索文献时，需要把研究问题转成对生物、化学、医学数据库的查询并整理成可复核结果。
  job_en: When designing experiments or searching literature, researchers need to turn a research question
    into queries against biology, chemistry and medicine databases and organize reviewable results.
  pain: 科学数据库分散、接口各异，人工逐个检索并整理格式耗时且易漏，代理直接调用可减少这一步手工搬运。
  pain_en: Scientific databases are scattered with differing interfaces, so manual searching and reformatting
    is slow and error-prone; letting an agent call them reduces that manual step.
  current_alternative: 研究者目前多靠人工在 PubMed、ChEMBL 等站点逐个检索，或自己写脚本拼接 API。
  current_alternative_en: Researchers currently search PubMed, ChEMBL and similar sites by hand, or write
    their own scripts to stitch APIs together.
  usage_reason: 推断：相较逐个站点手工检索，它把数据库调用封装成代理可直接执行的技能，减少检索与格式整理环节，因此常做跨库文献与化合物查询的科研人员会尝试它。
  usage_reason_en: 'Inference: compared with manual site-by-site searching, it packages database calls
