  market: ''
  job: 数据库管理员在把第三方 PostgreSQL 扩展装入生产库前，收集该扩展的权限、依赖与安全证据并形成准入结论。
  job_en: A database administrator gathers permission, dependency and security evidence on a third-party
    PostgreSQL extension before admitting it to production.
  pain: 扩展由外部维护，权限与依赖不透明，出问题后难以追溯是谁批准了哪一步；公开材料未说明现有做法具体卡在哪一步。
  pain_en: Extensions are externally maintained, their permissions and dependencies are opaque, and after
    an incident it is hard to trace who approved which step; the public material does not say exactly
    where current practice breaks down.
  current_alternative: 人工阅读扩展源码与文档，或依赖内部安全评审清单；公开材料未给出可核验的替代流程细节。
  current_alternative_en: Manually reading extension source and docs, or relying on an internal security
    review checklist; the public material gives no verifiable detail on the alternative process.
  usage_reason: 推断：若它能把权限与依赖证据自动汇总成一份可归档结论，就省去人工逐项翻源码这一步，受审计约束的数据库团队会因此选用；目前缺少使用与留存证据。
  usage_reason_en: 'Inference: if it consolidates permission and dependency evidence into one archivable
