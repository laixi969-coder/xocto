  market: ''
  job: 知识工作者、开发者或研究分析人员在写报告、调试或做调研时，需要把散落在聊天、文档、网页、终端里的文本片段集中起来，形成可搜索、可编辑、可交给 agent 处理的上下文条目。
  job_en: A knowledge worker, developer or researcher assembling a report, debugging or doing research
    needs to gather text fragments scattered across chats, documents, web pages and terminals into searchable,
    editable context items that an agent can process.
  pain: 跨应用复制粘贴的素材散落在系统剪贴板历史、笔记软件和文档草稿里，检索和复用成本高；系统剪贴板历史容量有限、无结构、无法按需交给模型处理，用户往往要重新翻找来源或重复复制。
  pain_en: Material copied across applications ends up scattered in system clipboard history, note apps
    and draft documents, making retrieval and reuse costly; system clipboard history is shallow, unstructured
    and cannot be handed to a model on demand, so users re-hunt sources or re-copy.
  current_alternative: 推断：系统剪贴板历史（如 Windows/macOS 剪贴板）、笔记软件（Notion、Obsidian）、浏览器书签与手动粘贴到文档中暂存。
  current_alternative_en: 'Inference: system clipboard history (Windows/macOS), note apps (Notion, Obsidian),
    browser bookmarks, and manually pasting into a document for temporary storage.'
  usage_reason: 推断：相较系统剪贴板历史只能按时间倒序翻找、笔记软件需要先建页面再粘贴，OpenSuperCV 把复制动作直接落成可搜索、可编辑的工作区条目，并允许 agent 按需处理其中条目，省去“先找地方存、再回头整理”的两步；常在多应用间搬运素材、又想让模型直接消费这些片段的知识工作者会因此选择它。
  usage_reason_en: 'Inference: unlike system clipboard history, which is only reverse-chronological, or
    note apps, which require creating a page before pasting, OpenSuperCV turns the copy action directly
    into searchable, editable workspace items and lets an agent process them on demand, removing the ''find
    somewhere to store it, then tidy it later'' steps; knowledge workers who shuttle material between
    apps and want a model to consume those fragments would choose it.'
