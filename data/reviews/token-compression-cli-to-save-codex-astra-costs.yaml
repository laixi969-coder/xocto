  market: ''
  job: 重度使用编码模型的开发者，在订阅额度用尽、按量 API 账单快速上升时，处理提示词与上下文材料，要完成的是在不明显牺牲回答质量的前提下把每次调用的 token 量降下来。
  job_en: Developers who heavily use coding models, when subscription quotas run out and metered API bills
    rise fast, process prompts and context material to cut tokens per call without noticeably hurting
    answer quality.
  pain: 按量计费的编码模型成本随上下文膨胀而线性上升，团队在额度耗尽后要么自掏高额账单，要么被迫减少使用，缺少一个能直接插在调用链上的降本手段。
  pain_en: Metered coding-model cost rises linearly with context size; after quotas run out, teams either
    pay large bills or cut usage, with no drop-in way to reduce cost inside the call chain.
  current_alternative: 旧做法是人工精简提示词、裁剪上下文、换更便宜的模型或限制团队成员使用额度，靠纪律和手工取舍控制成本。
  current_alternative_en: The old approach is manually trimming prompts, cutting context, switching to
    cheaper models or capping team usage, controlling cost through discipline and manual trade-offs.
  usage_reason: 相较人工裁剪上下文，这个工具在请求发出前自动压缩 token，省掉逐条改写提示词这一步，因此账单敏感、上下文冗长的编码团队会在成本失控时选择它；这是基于其自述能力的推断，压缩后的质量损失尚未有公开证据。
  usage_reason_en: Compared with manually trimming context, this tool compresses tokens automatically
    before the request is sent, removing the step of rewriting prompts one by one, so bill-sensitive coding
    teams with long context would pick it when costs spiral; this is inference from its own claim, and
    quality loss after compression has no public evidence yet.
