  market: ''
  job: 开发者关系或产品市场人员在项目发版、需要给开源项目或产品做演示视频时，基于代码生成视频，最终拿到可发布的演示素材。
  job_en: Developer-relations or product-marketing staff producing a demo video for a release of an open-source
    project or product generate it from code and end up with publishable demo material.
  pain: 演示视频通常靠人工录屏再剪辑，耗时且每次发版都要重做，小团队往往干脆不做。
  pain_en: Demo videos are usually made by manual screen recording and editing, which is slow and must
    be redone at every release, so small teams often skip them.
  current_alternative: 人工录屏后用剪辑软件拼接，或干脆不做演示视频。
  current_alternative_en: Recording the screen manually and cutting it in editing software, or simply
    not making a demo video.
  usage_reason: 推断：相较人工录屏加剪辑，它把演示视频的产出起点从录制改成代码，省掉录制与粗剪这一步，因此发版频繁、又缺少视频人力的开发者工具团队会优先试用；目前没有留存或付费证据。
  usage_reason_en: 'Inference: compared with manual screen recording plus editing, it moves the starting
    point of a demo video from recording to code, removing the record-and-rough-cut step, so developer-tool
    teams that release often and lack video staff are likely to try it first; there is currently no retention
    or payment evidence.'
