    are hard to check, and failures are costly to trace.
  current_alternative: 开发者自己写提示词加 JSON 解析、用结构化输出参数，或在应用层加一层校验代码。
  current_alternative_en: Developers hand-write prompts plus JSON parsing, use structured-output parameters,
    or add a validation layer in the application.
  usage_reason: 推断：它把判断本身做成类型化返回值，省掉应用侧再写一层解析与校验的步骤，因此在意输出可核对性的集成开发者会尝试它；公开材料未显示留存或付费证据。
  usage_reason_en: 'Inference: it turns the judgment itself into a typed return value, removing the parsing
    and validation layer the application would otherwise write, so integration developers who care about
    checkable output would try it; public material shows no retention or payment evidence.'
