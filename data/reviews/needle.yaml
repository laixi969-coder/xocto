  market: ''
  job: 手机用户在自己设备上，用自然语言描述要完成的操作，让端侧模型代为点击和填写，从而不必手动逐步操作界面。
  job_en: A phone user on their own device describes an operation in natural language and lets an on-device
    model tap and fill in for them, instead of manually stepping through the interface.
  pain: 公开材料只给出“能控制手机”一句，没有说明具体哪些操作、哪些应用、失败时如何回退，因此无法确认它替用户省掉了哪一步真实负担。
  pain_en: Public material gives only the line that it can control the phone, without saying which operations,
    which apps, or how it recovers from failure, so it is impossible to confirm which real burden it removes.
  current_alternative: 用户目前主要靠手动操作手机，或使用系统自带的语音助手与无障碍功能完成有限任务。
  current_alternative_en: Users currently operate phones by hand, or use built-in voice assistants and
    accessibility features for a limited set of tasks.
  usage_reason: 推断：若端侧小模型能在本地完成点击与填写，用户可能因为不必上传屏幕内容、也不必逐屏手动操作而选择它；但公开材料未给出任何用户反馈或使用数据，这一判断缺少支撑。
  usage_reason_en: 'Inference: if a small on-device model can complete taps and form filling locally,
    users might choose it to avoid uploading screen content and avoid manual screen-by-screen operation;
    however, public material offers no user feedback or usage data, so this judgment lacks support.'
