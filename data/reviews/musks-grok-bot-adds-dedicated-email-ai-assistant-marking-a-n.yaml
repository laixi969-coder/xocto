  market: ''
  job: 知识工作者在收件箱里处理日常往来邮件时，需要把邮件内容整理成待办、回复草稿或摘要，完成收件箱清理与回复。
  job_en: Knowledge workers handling everyday correspondence in their inbox, turning email content into
    to-dos, reply drafts or summaries to clear and answer the inbox.
  pain: 邮件量大且混杂，逐封阅读、判断优先级并起草回复占用大量时间，漏回代价高。
  pain_en: Email volume is large and mixed; reading each one, judging priority and drafting replies takes
    much time, and missing a reply is costly.
  current_alternative: 邮箱自带规则与搜索、手工分类标签，或把邮件复制到通用聊天助手再粘贴回来。
  current_alternative_en: Built-in mailbox rules and search, manual labels, or copying email into a general
    chat assistant and pasting back.
  usage_reason: 推断：相较手工分类与复制粘贴，它直接在收件箱内产出摘要与草稿，省去在邮箱和聊天工具之间来回搬运这一步，因此高频处理邮件的人会在收件箱场景选择它；材料未给出留存或复购证据。
  usage_reason_en: 'Inference: versus manual labeling and copy-paste, it produces summaries and drafts
    inside the inbox, removing the step of moving text between mailbox and chat tool, so heavy email users
    may choose it in the inbox; no retention or repeat-use evidence is given.'
