  market: ''
  job: 前端开发者或视频工程师在需要把数据或代码驱动的动态画面嵌入网页时，用代码描述场景，由浏览器 WebGPU 直接渲染成视频片段，而不必在剪辑软件里手工搭建再导出。
  job_en: Frontend developers or video engineers who need data- or code-driven motion visuals embedded
    in a web page describe the scene in code and let the browser's WebGPU render it into a clip, instead
    of building and exporting it by hand in an editor.
  pain: 公开材料只给出代码优先、WebGPU 原生渲染的定位；从工作流结构推断，痛点是数据驱动画面在传统剪辑软件里难以参数化复用、导出与网页嵌入链路割裂，但公开证据未给出用户抱怨或频率。
  pain_en: Public material only states a code-first, native-WebGPU positioning; by workflow inference
    the pain is that data-driven visuals are hard to parameterize and reuse in traditional editors and
    the export-to-web-embed chain is fragmented, though public evidence gives no user complaints or frequency.
  current_alternative: 推断旧做法是 After Effects、Remotion 等剪辑或代码合成工具手工搭建后导出视频再嵌入，或直接用 Canvas/WebGL 手写渲染；公开材料未说明它实际替代了哪一种。
  current_alternative_en: The inferred old approach is hand-building in editors or code-compositing tools
    such as After Effects or Remotion and exporting a file to embed, or hand-writing Canvas/WebGL rendering;
