  market: ''
  job: 前端开发者和 AI 编码代理在搭建界面时，处理组件规范与代码，要产出可复用、风格一致的 UI 组件。
  job_en: Front-end developers and AI coding agents building interfaces handle component specs and code
    to produce reusable, consistent UI components.
  pain: 公开材料只给出一句定位，没有说明旧流程里哪一步在痛、谁在手工维护组件规范，痛点无法从现有事实还原。
  pain_en: The public material gives only a one-line positioning and does not show which step of the old
    workflow hurts or who maintains component specs by hand, so the pain cannot be reconstructed from
    available facts.
  current_alternative: 推断：开发者通常依赖既有组件库、设计系统文档或团队内部约定，代理则靠提示词临时对齐风格。
  current_alternative_en: 'Inference: developers typically rely on existing component libraries, design-system
    docs or internal team conventions, while agents align style ad hoc through prompts.'
  usage_reason: 推断：若它真能提供人和代理共用的组件契约，可省去为代理重复描述组件规范这一步；但公开材料未给出可核对的结果，也未见采用或留存证据。
  usage_reason_en: 'Inference: if it truly provides a component contract shared by people and agents,
    it could remove the step of re-describing component specs to agents; but the public material shows
    no checkable outcome and no adoption or retention evidence.'
