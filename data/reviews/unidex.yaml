  market: ''
  job: 学生在课堂或自习时，用随身墨水屏设备记录课表并口述笔记，最终把笔记同步到 Obsidian 里整理。
  job_en: A student in class or self-study uses a pocket e-ink device to track their timetable and dictate
    notes, ending with notes synced into Obsidian.
  pain: 课堂上掏手机记笔记容易分心，手写又慢；课表散落在教务系统和日历里，随身查看不便。
  pain_en: Pulling out a phone to take notes in class is distracting and handwriting is slow; timetables
    are scattered across school systems and calendars, hard to check on the go.
  current_alternative: 用手机备忘录或录音 App 记录，事后手动整理进 Obsidian；课表靠截图或日历 App 查看。
  current_alternative_en: Recording in phone memo or voice apps and manually organizing into Obsidian
    later; checking timetables via screenshots or calendar apps.
  usage_reason: 推断：相比手机录音后手动整理，它把记录动作压缩成设备上的一次按键并直接落到 Obsidian，省去事后搬运这一步，因此常写笔记又不想被手机打断的学生会选它。
  usage_reason_en: 'Inference: versus recording on a phone and organizing later, it compresses capture
    into one button press on the device and lands directly in Obsidian, removing the manual transfer step,
    so students who write often and want to avoid phone distraction would pick it.'
