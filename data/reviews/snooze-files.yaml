  current_alternative: 公开材料未给出旧做法，常见替代是手动新建文件夹、拖拽归档或干脆不整理，这属于推断。
  current_alternative_en: No prior practice is given in the public material; the common alternative is
    manually creating folders, dragging files away, or simply not tidying, which is inference.
  usage_reason: 推断：相比手动建文件夹再拖拽，它把“移出视线”和“原样找回”合成一个动作，省掉记住放在哪一步；但缺少用户反馈或案例，无法确认有人因此持续使用。
  usage_reason_en: 'Inference: versus manually creating folders and dragging files, it merges ''move out
    of sight'' and ''get back intact'' into one action, removing the step of remembering where things
    went; without user feedback or cases, sustained use cannot be confirmed.'
