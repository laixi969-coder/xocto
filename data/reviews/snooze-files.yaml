  job_en: People with piled-up files, when their desktop or downloads folder is messy and they do not
    want to tidy now, handle a batch of pending files by moving them out of sight and later getting them
    back intact.
  pain: 候选只说明“搁置并一键恢复”，没有说明不这么做会付出什么代价，也看不出这是刚性痛点还是顺手功能。
