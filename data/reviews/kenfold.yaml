  market: ''
  job: 同时使用 Claude Code、Codex、ChatGPT 等工具的开发者，在切换工具继续同一项目时，需要把项目背景、约定和历史决策带过去，避免每次重新交代。
  job_en: Developers using Claude Code, Codex, ChatGPT and similar tools must carry project background,
    conventions and past decisions across tools when continuing the same project, instead of re-explaining
    each time.
  pain: 上下文分散在各工具的账号与本地会话里，换工具就要重新粘贴背景，重复劳动且容易遗漏既有约定，这是多工具并用后新出现的摩擦。
  pain_en: Context is scattered across each tool's account and local sessions, so switching tools means
    re-pasting background, duplicating work and risking loss of established conventions — friction that
    appeared once multiple tools are used together.
  current_alternative: 手工复制粘贴上下文、维护项目说明文档、把约定写进仓库里的说明文件，或干脆只用一个工具。
  current_alternative_en: Manually copying and pasting context, maintaining project briefs, writing conventions
    into repository docs, or simply sticking to a single tool.
  usage_reason: 推断：它把记忆放在自托管服务里，各工具通过 MCP 读取同一份内容，从而省掉每次换工具重新粘贴项目背景这一步；对同时用多个编码助手、又在意数据不出内网的开发者，这一步负担是真实存在的。
  usage_reason_en: 'Inference: it keeps memory in a self-hosted service that each tool reads over MCP,
    removing the step of re-pasting project background on every tool switch; for developers running several
    coding assistants who also want data to stay inside their own network, that step is a real burden.'
