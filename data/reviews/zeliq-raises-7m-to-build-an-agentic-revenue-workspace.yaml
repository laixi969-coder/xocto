  market: ''
  job: B2B 销售开发代表在每天开工前要凑出当天要联系的潜在客户名单：他们手里只有目标行业、公司规模和职位条件，需要把这些条件变成一批可联系的人名、邮箱和第一封外联邮件。
  job_en: 'A B2B sales development rep has to assemble the day''s prospect list before starting outreach:
    they hold only target industry, company size and job-title criteria, and must turn those into a set
    of contactable names, emails and a first outreach message.'
  pain: 手工在多个数据源之间切换检索、逐条核对联系人是否在职、再手写外联开场白，是重复且容易出错的体力活；名单质量差会直接浪费当天外联额度并影响邮箱送达。
  pain_en: Manually switching between data sources, checking one by one whether a contact is still in
    role, and hand-writing openers is repetitive and error-prone; a poor list wastes the day's outreach
    quota and hurts email deliverability.
  current_alternative: 旧做法是购买联系人数据库席位，再在表格里人工筛选、去重、补全，最后逐封手写邮件；部分团队用外呼外包或购买现成名单。
  current_alternative_en: The old way is buying contact-database seats, then manually filtering, deduplicating
    and enriching in spreadsheets, and finally hand-writing each email; some teams outsource calling or
    buy ready-made lists.
  usage_reason: 推断：相较数据库席位加人工筛选，它把检索、在职核对与开场白撰写合并成一次输入条件后的连续动作，减少的是“在多个工具间搬运和逐条核对”这一步，因此名单量大、外联节奏快的销售团队会在需要当天凑齐合格名单时选择它；公开材料未给出留存或复购证据。
  usage_reason_en: 'Inference: compared with database seats plus manual filtering, it merges search, role
    verification and opener writing into one continuous action after a single set of criteria, removing
    the step of moving data between tools and checking records one by one; sales teams with high list
    volume and fast outreach cadence would pick it when they need a qualified list the same day. Public
    materials provide no retention or repeat-purchase evidence.'
