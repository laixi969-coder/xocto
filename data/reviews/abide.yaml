  market: ''
  job: 软件开发工程师在让编码代理修改已有代码库时，需要处理项目既有的规则文件与代码约定，让代理产出的改动符合这些约定。
  job_en: A software developer, while having a coding agent modify an existing codebase, needs to work
    with the project's existing rule files and conventions so the agent's changes comply with them.
  pain: 代理容易忽略项目规则，产出不符合约定的代码，开发者要反复纠正；但公开材料没有说明这种偏离造成的具体代价。
  pain_en: Agents tend to ignore project rules and produce non-compliant code that developers must repeatedly
    correct; public materials do not state the concrete cost of this deviation.
  current_alternative: 开发者目前靠人工审查代理输出、在提示里重复粘贴规则，或依赖代理自带的规则文件支持。
  current_alternative_en: Developers currently review agent output by hand, paste rules repeatedly into
    prompts, or rely on the agent's built-in rule-file support.
  usage_reason: 推断：相较人工逐条核对，abide 把项目规则作为约束直接施加在代理生成环节，减少事后返工；但缺少用户反馈或采用证据，尚不能确认开发者会持续使用。
  usage_reason_en: 'Inference: compared with checking rules by hand, abide applies project rules as a
    constraint during generation, reducing rework; without user feedback or adoption evidence, continued
    use cannot be confirmed.'
