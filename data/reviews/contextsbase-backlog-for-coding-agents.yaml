  next_validation: 收集 ContextsBase 官方产品页或文档，确认待办清单的生成方式、支持的代码仓库与验收流程。
  market: ''
  job: 软件工程师在接到一批零散需求、准备交给编码代理执行时，需要把聊天里的提示词整理成一份有顺序、可逐条执行的待办清单，并拿到对应的代码改动。
  job_en: A software engineer who has received a batch of scattered requirements and is about to hand
    them to a coding agent needs to turn chat prompts into an ordered, item-by-item backlog and obtain
    the corresponding code changes.
  pain: 提示词散落在聊天记录里，顺序、边界和完成标准都不清楚，代理执行到一半就偏离目标，人还得回头重新描述。
  pain_en: Prompts are scattered across chat history, with unclear order, scope and completion criteria,
    so the agent drifts mid-task and the person has to re-describe the work.
  current_alternative: 工程师手工维护任务列表或 issue，再把单条提示词逐次粘贴给编码代理，靠人工判断哪一条算做完。
  current_alternative_en: Engineers maintain a task list or issues by hand and paste prompts to the coding
    agent one at a time, judging completion manually.
  usage_reason: 推断：它把提示词集中成一份待办清单，让代理按条目连续执行，省去逐条重述和人工排序这一步；但公开材料没有说明清单如何生成、如何验收，因此哪类用户会持续选择它尚不清楚。
  usage_reason_en: 'Inference: it consolidates prompts into one backlog so the agent can run items in
    sequence, removing the step of re-stating and manually ordering each prompt. The public material does
    not explain how the backlog is generated or accepted, so which users would keep choosing it is unclear.'
