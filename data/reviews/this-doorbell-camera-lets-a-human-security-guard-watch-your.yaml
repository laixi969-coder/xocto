  market: ''
  job: 家庭住户在无人看门、门口出现访客或可疑人员时，需要处理门铃摄像头拍到的实时画面，并完成判断、喊话或报警这一处置任务。
  job_en: A household, when nobody is watching the door and a visitor or suspicious person appears, must
    handle the live doorbell footage and complete the task of judging, speaking to, or alerting on it.
  pain: 住户不在家或没看手机时，普通门铃只留下录像，威胁要等事后回看才发现，错过当场制止的时机。
  pain_en: When residents are away or not checking their phone, an ordinary doorbell only leaves a recording,
    so threats are found only on later review and the moment to intervene is missed.
  current_alternative: 旧做法是普通门铃摄像头加事后回看录像，或购买传统安防监控公司的报警服务，由人工值守但通常不接入 AI 初筛。
  current_alternative_en: The old approach is an ordinary doorbell camera with after-the-fact playback,
    or a traditional monitored alarm service with human operators but usually no AI pre-screening.
  usage_reason: 相较只留录像的旧做法，它让 AI 先筛出可疑事件、再由真人坐席当场查看并喊话或报警，省掉住户自己盯屏和事后翻录像这一步，因此不在家或不便看手机的家庭会在门口安全场景选择它；这是基于产品能力与任务结构的推断。
  usage_reason_en: Compared with recording-only doorbells, it has AI flag suspicious events first and
    a live agent review and speak or escalate on the spot, removing the step of residents watching a screen
    or scrubbing footage later, so households that are away or cannot check their phone would choose it
    for door security; this is an inference from product capability and task structure.
