    and retakes; the candidate material offers no direct evidence of user complaints or workarounds, so
    pain intensity is inferred.
  current_alternative: 用手机前置摄像头加三脚架或支架自拍，反复回看和重拍，或用提词器、语音控制快门等零散工具拼凑。
  current_alternative_en: Phone front camera on a tripod or stand, repeated review and retakes, or a patchwork
    of teleprompters and voice shutter controls.
  usage_reason: 推断：如果它能把说话内容直接转成一次可用的拍摄结果，用户就不必在出镜和盯画面之间来回切换，也省掉反复回看重拍这一步，因此独自出镜、没人协助拍摄的人会愿意试。但候选资料未说明它具体接收什么、交付什么，这一因果链尚未被公开事实支持。
  usage_reason_en: 'Inference: if it turns spoken input directly into a usable take, users no longer switch
    between being on camera and monitoring the frame, skipping repeated review and retakes, which would
    appeal to solo shooters with no help on set. The candidate material does not say what it takes in
    or delivers, so this causal chain is not yet backed by public facts.'
