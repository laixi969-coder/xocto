  market: ''
  job: 独自拍摄的普通用户在没人帮忙按快门、又不想一直盯着自己脸的情况下，对着相机说话完成一次拍摄并拿到成片。
  job_en: Solo shooters who have nobody to press the shutter and dislike staring at their own face talk
    to the camera to complete a take and get a finished result.
  pain: 独自拍摄时用户既要出镜又要盯画面和构图，注意力被自我审视占满，容易反复重拍；候选材料没有给出用户抱怨或替代行为的直接证据，痛点强度属推断。
