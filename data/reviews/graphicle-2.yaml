  market: ''
  job: 使用 Claude Code、Codex、Cursor 等 MCP 客户端的开发者在让编码代理修改一个已有仓库时，需要把仓库的代码结构、项目文档、历史决策和过往代理会话作为可引用的上下文交给代理，让代理在正确文件与行号上完成改动。
  job_en: Developers using MCP clients such as Claude Code, Codex and Cursor, when letting a coding agent
    modify an existing repository, need to hand the agent the repo's code structure, project docs, past
    decisions and prior agent sessions as citable context so the agent edits the right files and lines.
  pain: 代理只看到被手动挑选或客户端自带索引覆盖的片段，跨文件调用关系、项目决策与历史会话上下文缺失，导致代理给出与仓库实际结构不符的改动，开发者要反复贴文件、纠正幻觉引用；公开材料只给出产品能力描述，未提供用户抱怨或采用数据，痛点强度属工作流结构推理。
  pain_en: Agents see only manually picked snippets or whatever the client's own index covers, so cross-file
    call relations, project decisions and prior session context are missing, producing edits that mismatch
    the repo and forcing developers to re-paste files and correct hallucinated references; the public
    material only states product capability, not user complaints or adoption data, so pain intensity is
    a workflow-structure inference.
  current_alternative: 开发者目前依赖各客户端自带的仓库索引、手动挑选并粘贴文件、或自行维护 CLAUDE.md/规则文件与笔记；这是从品类与工作流常识作出的推断，候选材料未直接描述旧做法。
  current_alternative_en: Developers today rely on each client's built-in repo indexing, manually picking
    and pasting files, or hand-maintaining CLAUDE.md/rule files and notes; this is inferred from category
    and workflow common sense, not directly described in the candidate material.
  usage_reason: 推断：相较每个客户端各配一套索引、每次会话重新贴文件，Graphicle 用一个 Rust 程序把仓库映射成代码图并记住文档、决策与历史会话，再以带文件与行号引用的片段返回给代理，减少的是开发者手动挑选与粘贴上下文这一步，并让代理引用可核对到具体行；哪类用户会因此选择它尚无公开反馈支持。
  usage_reason_en: 'Inference: versus configuring an index per client and re-pasting files each session,
    Graphicle uses one Rust program to map the repo into a code graph and remember docs, decisions and
    past sessions, returning cited excerpts with exact files and lines; this removes the manual pick-and-paste
    step and makes agent references checkable to a line, though no public feedback yet shows which users
    choose it.'
