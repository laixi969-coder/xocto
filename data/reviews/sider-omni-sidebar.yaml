    mail app wants to summarize, search, write, and generate reports without leaving the current window.
  pain: 公开材料显示用户需要在多个 AI 模型与当前工作材料之间来回切换，复制粘贴上下文会打断任务；Sider 自述的创建动机正是让用户不必在 AI 工具与工作内容之间反复跳转。
  pain_en: Public material shows users must switch between multiple AI models and their working material,
    and copy-pasting context interrupts the task; Sider's own stated reason for existing is to stop users
    from jumping between AI tools and their work.
  current_alternative: 当前替代方式是在浏览器标签间切换 ChatGPT、Claude、Gemini 等独立模型页面，或使用浏览器插件式助手，再手动复制粘贴内容。
  current_alternative_en: The current alternative is switching browser tabs among standalone ChatGPT,
    Claude, and Gemini pages, or using browser-extension assistants, then manually copy-pasting content.
  usage_reason: 推断：相较逐个打开模型页面并复制粘贴，Sider 把多个模型与摘要、笔记、报告动作放进当前页面的侧边栏，减少切换标签和搬运上下文这一步，因此常在浏览器里读资料、写报告的知识工作者会在处理网页材料时选择它。
  usage_reason_en: 'Inference: compared with opening each model page and copy-pasting, Sider places multiple
    models plus summarize, note, and report actions in a sidebar on the current page, removing the tab-switching
    and context-carrying step, so knowledge workers who read and write in the browser would choose it
    while handling web material.'
