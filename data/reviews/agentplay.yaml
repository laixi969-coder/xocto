  market: ''
  job: 开发者在编码代理完成多步任务后，处理会话记录，回放成地图与时间线以定位代理出错的那一步。
  job_en: After a coding agent completes a multi-step task, developers handle the session record and replay
    it as a map and timeline to locate the step where the agent went wrong.
  pain: 代理多步执行后只看到最终代码，中间哪一步走偏难以还原，排查靠翻原始日志。
  pain_en: After multi-step agent runs only the final code is visible, the step that went wrong is hard
    to reconstruct, and debugging means reading raw logs.
  current_alternative: 翻看原始会话日志，或凭记忆重跑一遍任务。
  current_alternative_en: Reading raw session logs, or re-running the task from memory.
  usage_reason: 推断：相较翻原始日志，它把会话直接渲染成地图与时间线，省去逐条比对日志这一步，因此频繁调试编码代理的开发者会尝试。
  usage_reason_en: 'Inference: compared with reading raw logs, it renders the session directly as a map
    and timeline, removing the line-by-line log comparison step, so developers frequently debugging coding
    agents would try it.'
