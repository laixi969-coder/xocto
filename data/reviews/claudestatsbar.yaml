    and logs after the fact.
  usage_reason: 推断：相较事后查账单，它把会话深度和用量直接显示在状态栏，省掉主动查询这一步，因此长时间跑编码助手、需要控制上下文和成本的开发者会在会话中途选择它。
  usage_reason_en: 'Inference: versus checking billing afterwards, it shows session depth and usage directly
    in the status bar, removing the step of actively looking it up, so developers running long assistant
    sessions pick it mid-task to control context and cost.'
