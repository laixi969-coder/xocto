  market: ''
  job: 开发者在使用编码助手做长任务时，需要知道当前会话已经积累了多少上下文和用量，材料是会话本身的统计信息。
  job_en: While running long tasks with a coding assistant, a developer needs to know how much context
    and usage the current session has accumulated, working from the session's own statistics.
