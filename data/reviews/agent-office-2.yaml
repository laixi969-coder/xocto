  market: ''
  job: 开发团队负责人在同时运行多个编码代理时，需要把分散在终端里的代理状态、代码改动和 issue/PR 进度集中到一处，判断谁卡住了、下一步该合并什么。
  job_en: An engineering team lead running several coding agents at once needs to gather scattered terminal
    agent states, code changes and issue/PR progress in one place to judge who is stuck and what to merge
    next.
  pain: 多个代理并行时，终端窗口互相覆盖，进度和冲突只能靠人来回切换查看，容易漏掉失败任务或重复改动。
  pain_en: With several agents in parallel, terminal windows overwrite each other and progress or conflicts
    can only be checked by switching back and forth, so failed tasks or duplicate edits are easily missed.
  current_alternative: 现在多代理协作多靠多个终端标签页、tmux 分屏加人工口头同步，或干脆串行执行以降低混乱。
  current_alternative_en: Today multi-agent work mostly relies on multiple terminal tabs, tmux panes plus
    manual verbal sync, or simply running agents serially to reduce chaos.
  usage_reason: 相较终端分屏加人工同步，它把每个代理的状态、终端输出和对应 issue/PR 放进同一可视界面，减少来回切换和口头对齐这一步；推断经常并行跑多个编码代理的小团队会因此选择它。
  usage_reason_en: Compared with split terminals plus manual sync, it puts each agent's state, terminal
    output and matching issue/PR into one visual surface, removing the step of switching back and forth
    and aligning verbally; teams that routinely run several coding agents in parallel would choose it,
    as inference.
