  market: ''
  job: 开发者在本地机器上运行编码代理处理真实代码库时，需要把代理会话放进隔离环境，避免污染本地依赖、泄露代码或抢占资源。
  job_en: Developers running coding agents against real codebases need those sessions isolated so local
    dependencies are not polluted, code is not leaked and resources are not starved.
  pain: 编码代理会执行任意命令并写入文件，本地直接运行容易破坏环境、混入敏感代码，且多会话并行时互相干扰。
  pain_en: Coding agents execute arbitrary commands and write files; running them locally can break environments,
    mix in sensitive code and interfere across parallel sessions.
  current_alternative: 开发者目前多靠本地容器、虚拟机或临时云主机手动搭建隔离环境，配置和维护成本高。
  current_alternative_en: Developers currently hand-roll isolation with local containers, VMs or throwaway
    cloud hosts, which is costly to configure and maintain.
  usage_reason: 推断：相比手动搭容器或临时云主机，pipod 把会话调度、沙箱创建和自托管服务器管理打包成一步，省去每次为代理单独配置隔离环境的工作，因此对已有服务器、又不想把代码交给第三方云沙箱的团队更有吸引力。
  usage_reason_en: 'Inference: versus hand-rolling containers or throwaway cloud hosts, pipod bundles
    session scheduling, sandbox creation and self-hosted server management into one step, removing the
    per-session isolation setup work, which appeals to teams that already run servers and do not want
    code in a third-party cloud sandbox.'
