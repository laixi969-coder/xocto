  pain: 候选材料只说明收件箱只接受一个发件人，未说明这解决了什么具体痛苦，也未说明不采用会失去什么。
  pain_en: The candidate material only states that an inbox accepts one sender; it does not say what specific
    pain this solves or what is lost without it.
  current_alternative: 现有做法是用通用邮箱的过滤器、标签或文件夹把某个发件人的邮件单独归拢。
  current_alternative_en: The current approach is to use filters, labels or folders in a general mailbox
    to gather one sender's mail separately.
  usage_reason: 推断：如果单一发件人收件箱能省掉在通用邮箱里配置和维护过滤规则这一步，需要长期跟进单一对手方的人可能会在管理某个客户或项目往来时选择它；但候选材料未给出任何用户反馈或采用证据，无法确认这一动机。
  usage_reason_en: 'Inference: if a single-sender inbox removes the step of configuring and maintaining
    filter rules in a general mailbox, people tracking one counterpart may choose it when managing one
    client or project; however the candidate material gives no user feedback or adoption evidence to confirm
    this motive.'
