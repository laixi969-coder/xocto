  market: ''
  job: 在昇腾 NPU 集群上部署分布式训练或推理的 AI 基础设施工程师，需要让多卡之间的数据通信跑通并达到可接受的吞吐，才能完成一次训练或一次推理服务上线。
  job_en: AI infrastructure engineers deploying distributed training or inference on Ascend NPU clusters
    need inter-card data communication to work at acceptable throughput before a training run or inference
    service can go live.
  pain: 昇腾生态的通信库此前主要依赖硬件厂商提供，模型侧团队遇到通信瓶颈时缺少与自身训练框架贴合的实现，调优往往要自己写或改底层代码。
  pain_en: Communication libraries in the Ascend ecosystem have mainly come from the hardware vendor,
    so model-side teams hitting communication bottlenecks lacked implementations aligned with their own
    training frameworks and often had to write or modify low-level code.
  current_alternative: 使用硬件厂商自带的集合通信库，或自行编写/修改通信实现，并靠人工压测调参。
  current_alternative_en: Using the hardware vendor's bundled collective communication library, or writing
    and modifying communication implementations by hand with manual benchmarking and tuning.
  usage_reason: 推断：相较自行改底层通信代码，该库把通信实现与 DeepSeek 自身训练/推理框架对齐后开源，使用昇腾集群的团队可直接复用而非从零适配，减少的是通信层自研与调试这一步；是否真的减少工作量取决于其文档与实测数据，目前尚未核验。
  usage_reason_en: 'Inference: compared with modifying low-level communication code themselves, this library
    open-sources a communication implementation aligned with DeepSeek''s own training and inference frameworks,
    so Ascend-cluster teams can reuse it instead of adapting from scratch, removing the step of building
    and debugging the communication layer; whether it truly reduces effort depends on documentation and
    benchmarks that are not yet verified.'
