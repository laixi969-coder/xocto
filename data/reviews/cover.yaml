  market: ''
  job: 开发者在把含真实客户信息的文本或字段送进第三方大模型接口前，需要先替换成格式一致的假数据，拿到模型返回后再在本地还原成真实值。
  job_en: Before sending text or fields containing real customer information to a third-party LLM API,
    a developer needs to substitute format-consistent fakes, then restore the real values locally from
    the model's response.
  pain: 把真实数据直接发给外部模型会触碰合规与客户保密要求，而手工编造假数据再逐条对回原文既慢又容易出错。
  pain_en: Sending real data straight to an external model runs into compliance and client-confidentiality
    rules, while hand-writing fakes and mapping them back to the originals is slow and error-prone.
  current_alternative: 目前常见做法是人工编造假数据、在提示词里要求模型不要记录敏感信息，或干脆放弃使用外部模型。
  current_alternative_en: Common workarounds today are manually inventing fake data, adding prompt instructions
    telling the model not to retain sensitive information, or simply not using external models.
  usage_reason: 相较人工编造与手工对回，它在请求发出前自动完成替换、在本地自动还原，省掉逐条比对这一步；推断，因为尚无用户反馈或客户案例说明实际采用动机。
  usage_reason_en: Compared with manual fabrication and hand-mapping, it automates substitution before
    the request leaves and restoration locally, removing the line-by-line reconciliation step; this is
    inference, since no user feedback or customer case documents the actual adoption motive.
