  market: ''
  job: 记者、学生或会议记录者在采访、上课或开会时说话，需要把口述内容变成可保存、可回看的文字材料。
  job_en: A journalist, student, or meeting note taker speaks during an interview, class, or meeting and
    needs the spoken content turned into text they can keep and revisit.
  pain: 边听边记会漏内容，事后凭记忆补写容易失真，录音又难以检索和引用。
  pain_en: Taking notes while listening loses content, reconstructing from memory distorts it, and raw
    audio is hard to search or quote.
  current_alternative: 现在多用系统自带听写、录音后手动整理，或使用通用转写服务再复制到笔记里。
  current_alternative_en: Today people use built-in dictation, record and transcribe manually, or run
    a generic transcription service and paste results into notes.
  usage_reason: 推断：它把转写结果直接留在设备上，省去录音导出再转写再粘贴的中间步骤，对需要长期积累口述素材的人减少一次搬运；是否比系统听写更准尚无公开证据。
  usage_reason_en: 'Inference: it keeps transcripts on the device, removing the export-transcribe-paste
    chain, which saves one transfer for people accumulating spoken material; whether it beats built-in
    dictation in accuracy is not publicly evidenced.'
