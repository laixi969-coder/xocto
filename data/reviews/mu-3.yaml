  market: ''
  job: 软件工程师在仓库中让编码代理处理日常改动时，处理代码与任务描述，要完成一次可用的代码修改，同时控制大模型调用成本。
  job_en: Software engineers letting a coding agent handle routine repository changes process code and
    task descriptions to complete a usable code change while controlling large-model call costs.
  pain: 编码代理把每个请求都交给大模型，常规小改动也付出高延迟与高成本，团队难以按任务难度分配算力。
  pain_en: Coding agents send every request to a large model, so even routine small edits carry high latency
    and cost, and teams cannot allocate compute by task difficulty.
  current_alternative: 直接使用单一模型的编码代理，或手动在便宜与昂贵模型之间切换。
  current_alternative_en: Using a single-model coding agent, or manually switching between cheap and expensive
    models.
  usage_reason: 推断：相较单一模型代理，它先用小模型判断常规调用再交给大模型执行，减少每次请求都调用大模型这一步，因此对调用成本敏感的独立开发者或小团队会尝试；是否长期使用缺少留存证据。
  usage_reason_en: 'Inference: versus a single-model agent, it uses a small model to judge routine calls
    before handing work to a large model, removing the step of calling the large model on every request,
    so cost-sensitive indie developers or small teams would try it; retention evidence is missing.'
