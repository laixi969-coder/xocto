  market: ''
  job: 梦幻橄榄球玩家在选秀夜和每周阵容截止前，处理球员名单、伤病消息、对手阵容和联盟规则，要选出本轮选秀或首发的具体球员。
  job_en: A fantasy football player, before draft night and each weekly lineup deadline, works through
    player pools, injury news, opponent rosters and league rules to pick the specific players to draft
    or start.
  pain: 信息分散在多个站点，截止时间紧，人工比对球员价值与阵容需求容易漏掉伤病或轮换变化，选错一次直接影响整季战绩。
  pain_en: Information is scattered across sites under a hard deadline, and manually weighing player value
    against roster needs easily misses injury or rotation changes; one wrong pick affects the whole season.
  current_alternative: 玩家自己开多个标签页查排名与新闻，或依赖论坛和付费榜单的静态建议，再手动填进 ESPN。
  current_alternative_en: Players keep several tabs open for rankings and news, or rely on static advice
    from forums and paid cheat sheets, then enter picks into ESPN by hand.
  usage_reason: 相较手动查榜，它把联盟规则、名单和对手信息直接交给助手，在选秀与排阵当下产出针对本队的候选球员建议，省掉跨站比对这一步；推断，尚无用户反馈或留存证据。
  usage_reason_en: Compared with manual cheat-sheet checking, it feeds league rules, rosters and opponent
    data to the assistant and returns team-specific candidate picks at the moment of drafting or setting
    lineups, removing the cross-site comparison step; inference, with no user feedback or retention evidence
    yet.
