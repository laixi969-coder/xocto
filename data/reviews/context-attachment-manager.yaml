  market: ''
  job: 开发者在 Codex 或 Claude Code 里进行多轮编码对话、历史里累积了多张截图或设计图时，需要决定哪些图片继续随下一条消息发送给模型。
  job_en: When a developer runs a multi-turn coding conversation in Codex or Claude Code and screenshots
    or design images accumulate in history, they must decide which images keep being sent with the next
    message.
  pain: 长会话中历史图片持续占用上下文，推高请求体积与成本，并可能挤占模型对当前任务的注意力；这是从产品功能推导的痛点，候选未提供用户抱怨原文。
  pain_en: Historical images keep occupying context in long sessions, inflating request size and cost
    and potentially crowding out attention on the current task; this pain is inferred from the product
    capability, as the candidate provides no user complaint text.
  current_alternative: 旧做法是手动开新会话、删除历史消息，或依赖模型侧自动压缩上下文，用户无法逐张挑选保留哪些图片。
  current_alternative_en: The old approach is manually starting a new session, deleting history, or relying
    on model-side automatic context compression, with no way to pick image by image what to keep.
  usage_reason: 推断：相较开新会话或删历史，它让用户在下一条消息前逐张勾选保留的图片，未选中的变成占位符，从而减少重开会话丢失上下文的负担并控制请求体积；缺少留存或复购证据，尚不能断言已进入长期工作流。
  usage_reason_en: 'Inference: compared with starting a new session or deleting history, it lets users
    check which images to keep before the next message, turning unchecked ones into placeholders, reducing
    the burden of losing context by restarting and controlling request size; without retention or repeat-use
    evidence, it cannot be claimed to be embedded in long-term workflows.'
