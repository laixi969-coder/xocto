    in both places, and status mismatches require switching back and forth; for Turkish-speaking teams
    the official consoles and docs are mainly English, raising terminology and process overhead.
  current_alternative: 当前替代方式是分别登录 App Store Connect 和 Google Play Console 手工操作，或使用 Fastlane 等脚本化发布工具，但后者需要自行编写与维护配置，且并非土耳其语界面。
  current_alternative_en: Today users log into App Store Connect and Google Play Console separately and
    work manually, or use scripted release tools such as Fastlane, which require writing and maintaining
    their own configuration and are not Turkish-language.
  usage_reason: 推断：相较手工双后台操作，它把两个商店的接口收敛到一个 MCP 入口，由 AI 助手代为读取和提交，减少在两边重复录入与切换登录的步骤；相较 Fastlane 类脚本，它不需要用户自行编写发布配置。因此土耳其语独立开发者或小团队在需要同时更新两个商店、又不愿维护发布脚本时更可能选择它。
  usage_reason_en: 'Inference: versus manual dual-console work, it collapses both store APIs into one
    MCP entry point where an AI assistant reads and submits on the user''s behalf, cutting duplicate entry
    and login switching; versus Fastlane-style scripts it does not require users to write their own release
    configuration. Turkish-speaking indie developers or small teams updating both stores without maintaining
    release scripts are therefore more likely to pick it.'
