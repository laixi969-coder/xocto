  market: ''
  job: 土耳其语独立开发者或小型发行团队在准备上架或更新应用时，需要同时处理 App Store Connect 与 Google Play 两个后台的版本、文案与状态信息，并完成两边的发布或状态核对动作。
  job_en: Turkish-speaking indie developers or small release teams preparing an app launch or update must
    handle version, copy, and status data across both App Store Connect and Google Play, and complete
    the release or status-check actions on both sides.
  pain: 两个商店后台彼此独立，同一份版本与文案要在两处重复录入和核对，状态不一致时需来回切换排查；对土耳其语团队而言，官方后台与文档以英文为主，术语与流程理解成本更高。
