    the whole clip, and there is no revisable middle step between script and finished cut.
  current_alternative: Runway、可灵等生成工具配合人工剪辑软件，或让编码代理写脚本再手工拼接。
  current_alternative_en: Generation tools such as Runway or Kling combined with manual editing software,
    or having a coding agent write scripts and stitching output by hand.
  usage_reason: 推断：openfilm 让代理生成后仍能在编辑器里逐段改动，用户不必为一次修改重跑整段生成，因此需要反复改稿的短视频或广告创作者会先试它。
  usage_reason_en: 'Inference: openfilm keeps agent output editable clip by clip, so users need not rerun
    a whole generation for one change, which is why short-video or ad creators who iterate on drafts would
    try it first.'
