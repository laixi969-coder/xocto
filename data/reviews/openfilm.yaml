  market: ''
  job: 内容创作者或剪辑师需要把脚本或素材变成可用的视频片段，并在成片前逐段修改不满意的部分。
  job_en: Content creators or editors need to turn scripts or footage into usable video clips and revise
    the parts they dislike before delivery.
  pain: 生成式视频工具通常只给一次性结果，改一处就要重跑整段，脚本到成片之间缺少可回改的中间环节。
