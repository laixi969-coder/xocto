  pain_en: Generating and downloading line by line in a browser and then importing into editing software
    means constant switching and makes re-recording a single line awkward, often forcing the whole flow
    again.
  current_alternative: 现在多直接在语音合成网页里逐条生成并下载音频，再手工导入剪辑软件拼接，或请真人配音演员录制。
  current_alternative_en: Today people mostly generate and download audio line by line in a speech synthesis
    web page, then manually import and stitch it in editing software, or hire a human voice actor.
  usage_reason: 推断：如果它把逐段生成、试听和重录收进一个桌面流程，制作者就不必在浏览器与剪辑软件之间反复搬运文件，改一句台词时能就地重录；但公开材料没有说明导出格式、批量处理方式，也没有用户反馈或复购证据，因此不能确认它会被长期留在制作流程里。
  usage_reason_en: 'Inference: if it folds line-by-line generation, auditioning and re-recording into
    one desktop flow, creators would not have to shuttle files between browser and editing software and
    could re-record a line in place; however, public material does not describe export formats or batch
    handling, and there is no user feedback or repeat-purchase evidence, so it cannot be confirmed as
    a lasting part of the production workflow.'
