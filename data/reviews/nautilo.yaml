  market: ''
  job: 多人团队在同一个项目里同时使用多个 AI 代理处理代码和文档时，需要把任务、产出和修改集中到一处，让每个人和每个代理都能看到同一份材料并继续推进。
  job_en: When a multi-person team uses several AI agents on code and documents in one project, it needs
    tasks, outputs and edits gathered in one place so every person and agent works from the same material.
  pain: 公开材料只说明这是一个自托管协作空间，没有说明此前谁在用什么方式协作、哪一步最费时或最容易出错，因此痛点无法从现有事实确认。
  pain_en: The public material only describes a self-hosted collaboration space; it does not say who previously
    collaborated how, or which step was slowest or most error-prone, so the pain cannot be confirmed from
    available facts.
  current_alternative: 可推断的旧做法是各自在本地编辑器、聊天工具和代码仓库之间手动同步代理产出，但候选材料未提供任何用户描述或替代行为证据，此条为推断。
  current_alternative_en: The inferable old practice is manually syncing agent output across local editors,
    chat tools and code repositories, but the candidate provides no user account or substitute-behaviour
    evidence; this is inference.
  usage_reason: 相较手动在多个工具间同步，它把人和代理的任务与产出放进同一个自托管空间，理论上减少一次复制粘贴和版本对齐；但缺少用户反馈或案例，无法确认哪类用户会因此选择它，此判断为推断。
  usage_reason_en: Compared with manually syncing across tools, it puts people's and agents' tasks and
    outputs in one self-hosted space, in theory removing a copy-paste and version-alignment step; without
    user feedback or cases, which users would choose it cannot be confirmed, and this is inference.
