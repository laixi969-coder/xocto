  market: ''
  job: 需要为某个判断取一个可比较数值的使用者，把情境材料交给模型，希望得到校准过的概率而非一段文字。
  job_en: A user who needs a comparable number for a judgment hands a situation to the model, expecting
    a calibrated probability rather than prose.
  pain: 现有对话模型只给文字，概率表述含糊且未校准，难以直接用于打分或风险判断。
  pain_en: Existing chat models return prose with vague, uncalibrated probability statements, hard to
    use directly for scoring or risk judgment.
  current_alternative: 用通用对话模型自行估计概率，或依赖人工经验、统计模型给出数值。
  current_alternative_en: Estimating probabilities with a general chat model, or relying on human judgment
    and statistical models for numbers.
  usage_reason: 推断：相较让对话模型写一段判断再自己折算成数字，它直接输出概率值，省掉人工折算这一步；但公开材料未说明适用任务与校准依据，哪类用户会选它尚不清楚。
  usage_reason_en: 'Inference: instead of asking a chat model for a judgment and converting it into a
    number yourself, it outputs probabilities directly, removing that conversion step; public material
    does not state applicable tasks or calibration basis, so which users would choose it is unclear.'
