  market: ''
  job: 视频制作者或代理开发者已有网页动画脚本，需要把它稳定导出成带运动模糊和景深的成片视频。
  job_en: A video producer or agent developer already has web-page animation scripts and needs to export
    them reliably into finished video with motion blur and depth of field.
  pain: 网页动画转视频通常要逐帧截图再拼接，运动模糊和景深得手工补，重复渲染结果还不一致。
