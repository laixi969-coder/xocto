    motion blur and depth of field added by hand, and repeated renders that do not match.
  current_alternative: 用录屏或逐帧截图加剪辑软件拼接，或自己写无头浏览器脚本。
  current_alternative_en: Screen recording or frame-by-frame capture stitched in an editor, or hand-written
    headless browser scripts.
  usage_reason: 推断：它把确定性校验、按剪辑点的运动模糊和景深层内置进渲染流程，省掉逐帧截图后手工补特效和反复对齐的步骤，因此需要可复现出片的开发者会选它。
  usage_reason_en: 'Inference: it builds determinism checks, cut-aware motion blur and a depth layer into
    the render pipeline, removing manual effect work and re-alignment after frame capture, so developers
    needing reproducible output would pick it.'
