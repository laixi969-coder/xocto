  market: ''
  job: 知识工作者、运营或开发者面对需要跨网页检索、整理资料并产出可交付文件（报告、表格、网页）的任务时，把目标交给 Manus 这类通用 AI 代理，由它自主拆解步骤、调用工具并交付成品，而不是自己逐步操作。
  job_en: Knowledge workers, operators or developers facing tasks that require cross-web research, material
    synthesis and a deliverable file (report, sheet, page) hand the goal to a general AI agent like Manus,
    which decomposes steps, calls tools and delivers the artifact instead of the user doing each step
    manually.
