  market: ''
  job: 个人用户和小团队在需要跨多个网站与应用完成调研、填表、下单或对账时，把整段多步骤操作交给通用 Agent 执行，自己只做结果确认。
  job_en: Individual users and small teams hand an entire multi-step operation to a general agent when
    research, form filling, ordering or reconciliation spans several websites and apps, keeping only final
    confirmation for themselves.
  pain: 这类任务步骤碎、要反复切换工具并登录不同账号，人工做耗时且容易漏步；不做的代价是任务被推迟或外包给助理。
  pain_en: Such tasks are fragmented, require switching tools and logging into different accounts, and
    are slow and error-prone by hand; the cost of not doing them is delay or outsourcing to an assistant.
  current_alternative: 目前多由用户自己在浏览器里逐步操作，或使用只能对话、不能真正登录和执行的聊天助手，复杂任务仍需人工接管。
  current_alternative_en: Today users mostly work step by step in a browser themselves, or use chat assistants
    that can talk but cannot actually log in and execute, so complex tasks still need human takeover.
  usage_reason: 相较只能给建议的聊天助手，它让 Agent 持有手机号与钱包并进入群组协作，把“登录—操作—结算”这几步从人工手里接走，因此需要代为执行账号级操作的用户会在任务跨多个工具时选择它；这是基于产品能力的推断，尚无留存或复购证据。
  usage_reason_en: Compared with chat assistants that only give advice, it lets agents hold phone numbers
    and wallets and join group collaboration, taking the log-in, operate and settle steps off human hands,
    so users who need account-level execution may choose it when a task spans several tools; this is an
    inference from product capability, with no retention or repeat-use evidence yet.
