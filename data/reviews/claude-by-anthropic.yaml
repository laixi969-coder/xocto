    long-form writing, and hard reasoning, expecting usable code, drafts, or conclusions.
  pain: 公开材料未直接给出用户抱怨；从工作流结构推理，这类任务原本依赖人工检索、逐段起草与反复校对，长文与复杂推理的返工成本高，但具体频率与代价属推断而非用户口述。
  pain_en: Public materials give no direct user complaints; by workflow inference these tasks otherwise
    rely on manual search, drafting, and repeated proofreading, with high rework cost on long writing
    and hard reasoning, though frequency and cost are inferred, not user-stated.
  current_alternative: 结构上可推断的旧做法是搜索引擎加人工整理、自己逐段起草，或使用其他通用对话助手；公开材料未说明用户实际替换了什么。
