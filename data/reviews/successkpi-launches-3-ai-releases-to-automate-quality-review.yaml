  market: ''
  job: 客服主管和质量评审员需定期抽查坐席与客户的通话、聊天记录，按评分表评估服务质量并反馈给坐席。
  job_en: Contact center supervisors and QA analysts need to regularly sample agent-customer calls and
    chats, score service quality against rubrics, and feed back to agents.
  pain: 人工抽听耗时长、只能覆盖极小样本、评分标准因人而异，问题交互容易被漏掉；这是联络中心质检的既有流程痛点，由发布稿描述的旧流程推出，非用户访谈证据。
  pain_en: Manual review listening is slow, covers only a tiny sample, and scoring varies by reviewer,
    so problem interactions slip through; derived from the legacy workflow described in the release, not
    user interviews.
  current_alternative: 人工听取录音或阅读聊天记录，用评分表打分，再汇总反馈；覆盖率和一致性都受限。
  current_alternative_en: Manually listening to recordings or reading chat logs, scoring with rubrics,
    then compiling feedback; coverage and consistency are limited.
  usage_reason: AI 可全量审听交互并输出一致评分与反馈，主管用它降本提覆盖；发布获行业媒体报道带来关注，但客户采用、付费与留存尚未核验。
  usage_reason_en: AI can review all interactions and output consistent scores and feedback, letting managers
    cut cost and expand coverage; trade press coverage drives attention, but adoption, payment and retention
    remain unverified.
