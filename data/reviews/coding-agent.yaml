  market: ''
  job: 开发者在本地代码库中处理一个改动任务，需要代理先读懂仓库结构，再规划、改代码、跑验证并交付可用的变更。
  job_en: A developer working in a local repository needs the agent to understand the repo structure,
    then plan, edit code, run validation and deliver a usable change.
  pain: 通用云端编码助手需要把代码送出本机，受合规或保密约束的团队无法使用，人工在本地完成规划、改动和验证又要反复切换工具。
  pain_en: General cloud coding assistants require sending code off the machine, which compliance- or
    secrecy-bound teams cannot do, while doing planning, editing and validation locally by hand means
    constant tool switching.
  current_alternative: 使用云端编码助手，或自己在本地用编辑器加脚本手工完成规划、改动与测试。
  current_alternative_en: Using a cloud coding assistant, or manually planning, editing and testing locally
    with an editor and scripts.
  usage_reason: 推断：如果该代理确实在本地完成从规划到验证的闭环，受保密约束的团队就能在不外传代码的前提下获得代理协助，省去把代码脱敏后再送云端这一步；但公开材料只有一句定位，没有部署文档或使用反馈，无法确认闭环是否真的成立。
  usage_reason_en: 'Inference: if the agent truly closes the loop from planning to validation locally,
    secrecy-bound teams get agent help without sending code out, skipping the step of sanitising code
    before cloud use; but the public material is one line with no deployment docs or user feedback, so
    the loop cannot be confirmed.'
