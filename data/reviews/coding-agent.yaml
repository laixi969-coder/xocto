  market: ''
  job: 开发者在本地仓库中处理已有代码库时，让代理读取仓库上下文，完成从规划、改代码、跑验证到交付变更的整条任务链，而不是只补全一段代码。
  job_en: A developer working in a local repository lets the agent read repository context and carry a
    task from planning through code changes, validation, and delivery of the change, rather than only
    completing a code snippet.
  pain: 公开材料只给出定位句，未提供用户抱怨或案例；从工作流结构推理，跨文件改动需要人工反复收集上下文、手工串联规划与验证，且把代码库交给云端代理存在隐私与可控性顾虑，本地优先正是针对这一环节。
  pain_en: Public materials give only a positioning sentence with no user complaints or cases; by workflow
    inference, cross-file changes force developers to manually gather context and stitch planning to validation,
    while sending a repository to a cloud agent raises privacy and control concerns that local-first targets.
  current_alternative: 公开材料未说明现有替代方式；结构上对应的是开发者手工在 IDE 中逐文件修改，或使用云端补全/聊天式助手，由人自己承担上下文收集与验证。
  current_alternative_en: Public materials do not state the current alternative; structurally it corresponds
    to manual file-by-file editing in an IDE, or cloud completion/chat assistants where the human still
    carries context gathering and validation.
  usage_reason: 推断：相较手工逐文件修改或云端助手，它把仓库读取、规划、执行、验证串成一个本地闭环，减少人工搬运上下文和手动串联验证步骤，因此在意代码不外传、又需要跨文件改动的开发者会在本地仓库任务中选择它；尚无用户反馈证实这一动机。
  usage_reason_en: 'Inference: versus manual file-by-file editing or cloud assistants, it chains repository
    reading, planning, execution, and validation into one local loop, cutting manual context shuttling
    and hand-stitched validation, so developers who need cross-file changes without exporting code would
    pick it for local repository tasks; no user feedback yet confirms this motive.'
