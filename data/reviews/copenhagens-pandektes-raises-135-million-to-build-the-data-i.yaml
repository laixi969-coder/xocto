  market: ''
  job: 律师与法务研究员在准备意见或诉讼材料时，需要从判决书、法规和法律文献中找到可引用的依据，并确认其现行有效性。
  job_en: When preparing opinions or litigation materials, lawyers and legal researchers must find citable
    authority in judgments, statutes and legal literature and confirm it is still in force.
  pain: 法律语料分散在多个数据库与原文文件中，检索靠关键词和人工翻阅，容易漏掉相关判例，且引用前必须逐条回原文核对，耗时且不可省略。
  pain_en: Legal corpora are scattered across databases and source documents; searching relies on keywords
    and manual reading, relevant cases are easily missed, and every citation must be checked against the
    original text, which is slow and cannot be skipped.
  current_alternative: 现有做法是订阅传统法律数据库、用关键词检索，再人工下载判决书原文逐条阅读和摘录。
