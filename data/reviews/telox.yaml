  market: ''
  job: 科研人员或教师在浏览器中撰写论文与讲义时，直接编辑 LaTeX 公式和文本并即时查看排版结果，最终得到可继续使用的 LaTeX 草稿。
  job_en: Researchers or teachers writing papers and lecture notes edit LaTeX formulas and text in the
    browser with immediate typeset preview, ending with a reusable LaTeX draft.
  pain: 本地 LaTeX 环境安装配置繁琐，在线编辑器又依赖网络与账号，临时写公式时切换成本高。
  pain_en: Local LaTeX setups are cumbersome to install and configure, while online editors depend on
    network and accounts, making quick formula writing costly to switch into.
  current_alternative: 现有做法是安装本地 TeX 发行版配合编辑器，或使用 Overleaf 等在线协作平台。
  current_alternative_en: Today people install a local TeX distribution with an editor, or use online
    collaboration platforms such as Overleaf.
  usage_reason: 推断：相较本地安装与在线平台，它把公式编辑与预览压缩进一个小于 15MB 的浏览器页面并本地保存，省去环境配置与登录这一步；但公开材料未说明是否含 AI 能力，也未给出用户反馈，选择动机仍属推断。
  usage_reason_en: 'Inference: compared with local installs and online platforms, it compresses formula
    editing and preview into a sub-15MB browser page with local storage, removing environment setup and
    login; but the public material shows no AI capability and no user feedback, so the reason to choose
    it remains an inference.'
