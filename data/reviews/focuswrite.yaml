  market: ''
  job: 写作者在需要长时间专注时，要在一个不被打扰的环境里起草和整理文稿。
  job_en: A writer needs an undisturbed environment to draft and organise text during long focus sessions.
  pain: 通用写作软件通知多、云端同步让人担心稿件外泄，专注模式常需另装插件或靠自律维持。
  pain_en: General writing software is full of notifications, cloud sync raises concerns about drafts
    leaking, and focus modes often require extra plugins or self-discipline.
  current_alternative: Word、Notion、Obsidian 等通用写作工具，配合系统勿扰模式或第三方专注插件。
  current_alternative_en: General writing tools such as Word, Notion or Obsidian, combined with system
    do-not-disturb or third-party focus plugins.
  usage_reason: 推断：它把本地存储和专注模式放进同一个应用，写作者不必再拼装插件或担心云端稿件，因此对隐私敏感的长文作者可能选择它；但公开材料没有说明 AI 具体做什么，也没有用户反馈，动机仍属推断。
  usage_reason_en: 'Inference: it puts local storage and focus modes in one app, so writers no longer
    assemble plugins or worry about cloud drafts, which may attract privacy-sensitive long-form authors;
    however, public material does not say what the AI does and there is no user feedback, so the motive
    remains an inference.'
