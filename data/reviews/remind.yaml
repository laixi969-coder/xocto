  market: ''
  job: 会议密集的职场人在会议开始前，需要被提醒并快速了解这场会议要谈什么。
  job_en: Meeting-heavy professionals need to be reminded before a meeting starts and quickly grasp what
    the meeting is about.
  pain: 公开材料只有一句“全屏会议提醒加 AI 简报”，没有说明用户原本卡在哪一步、不解决会有什么后果。
  pain_en: The public material is only one line, 'full-screen meeting reminders with AI briefings', and
    does not say which step users were stuck on or what happens if it is not solved.
  current_alternative: 用户依赖日历提醒、自己翻看历史邮件与文档来准备会议。
  current_alternative_en: Users rely on calendar alerts and dig through past emails and documents to prepare
    for a meeting.
  usage_reason: 推断：如果简报能在会议前自动汇总相关上下文，用户就不必临时翻找材料；但公开材料没有给出任何采用、留存或客户证据，无法确认这一选择是否真的发生。
  usage_reason_en: 'Inference: if the briefing automatically gathers relevant context before a meeting,
    users would not have to search for material at the last minute; however, the public material gives
    no adoption, retention or customer evidence, so it cannot be confirmed that this choice actually happens.'
