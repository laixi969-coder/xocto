  market: ''
  job: 开发者在手机上用远程代理推进项目时，需要打开服务器文件夹里的凭据或配置文件，直接查看并修改内容，而不是让模型代读代写。
  job_en: While pushing a project forward from a phone via a remote agent, a developer needs to open credential
    or config files in a server folder and view or edit them directly, rather than having the model read
    and write them.
  pain: 把凭据送进大模型有泄露与不可控风险，而手机端又缺少顺手的文件编辑方式，来回切换设备或复制粘贴很麻烦。
  pain_en: Sending credentials into an LLM carries leak and control risks, while phones lack a convenient
    file editor, making device switching or copy-paste painful.
  current_alternative: 用 SSH 或终端编辑器在手机上改文件，或把内容贴进对话让模型改，再手动回写。
  current_alternative_en: Editing files over SSH or a terminal editor on the phone, or pasting content
    into a chat for the model to edit and writing it back by hand.
  usage_reason: 推断：它把编辑界面直接架在目标文件夹上，由代理启动、手机经 Tailscale 访问，省掉了把敏感内容复制进对话再回写这一步，因此在意凭据外泄、又常离开电脑的开发者会在远程改配置时选它。
  usage_reason_en: 'Inference: it mounts the editing UI directly on the target folder, started by the
    agent and reached from the phone over Tailscale, removing the step of pasting sensitive content into
    chat and writing it back, so developers wary of credential leaks who often leave their desk would
    pick it for remote config edits.'
