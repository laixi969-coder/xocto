  market: ''
  job: 训练或推理 DeepSeek 稀疏注意力（DSA）模型的工程师，在 GPU 上跑长上下文注意力与采样时，需要把 TopK 选择与采样这两步做成高效 kernel，以便在有限显存和算力下完成前向与生成。
  job_en: Engineers training or serving DeepSeek Sparse Attention (DSA) models need efficient TopK-selection
    and sampler kernels so that long-context attention and generation fit within limited GPU memory and
    compute.
  pain: 稀疏注意力与采样中的 TopK 选择若用通用算子实现，会带来额外显存占用与 kernel 启动开销，长上下文场景下成为吞吐瓶颈；不解决则要么降 batch/序列长度，要么自写并维护一套 kernel。
  pain_en: Generic implementations of TopK selection inside sparse attention and sampling add memory traffic
    and kernel-launch overhead, becoming a throughput bottleneck at long context; leaving it unsolved
    forces smaller batches/sequence lengths or hand-rolled kernels.
  current_alternative: 当前替代是直接用 PyTorch 通用 topk/sort 算子、FlashAttention 等通用注意力实现，或团队自行编写并维护 CUDA/Triton
    kernel。
  current_alternative_en: Today users fall back on generic PyTorch topk/sort operators, general attention
    implementations such as FlashAttention, or hand-written and maintained CUDA/Triton kernels.
  usage_reason: 推断：相较通用算子或自研 kernel，DeepSelect 把 DSA 的 TopK 选择与采样封装成可直接调用的专用 kernel，省去团队自行实现与调优这一步，并针对稀疏注意力结构减少中间显存与启动开销；因此正在训练或部署
    DeepSeek 系稀疏注意力模型的工程团队会在长上下文性能受限时选择它。
  usage_reason_en: 'Inference: versus generic operators or in-house kernels, DeepSelect packages DSA TopK
    selection and sampling as ready-to-call specialized kernels, removing the implement-and-tune step
    and reducing intermediate memory and launch overhead for sparse attention; engineering teams training
    or serving DeepSeek-family sparse-attention models would pick it when long-context performance is
    constrained.'
