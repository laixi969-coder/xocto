    SVG 规范生成标志方案，并借助测试工具与 1400+ 标志参考库比对，最终拿到可继续修改的 SVG 标志文件。
  job_en: A brand designer or startup brand lead who needs a usable vector logo hands the brand positioning,
    name and style requirements to an AI agent such as Claude, Gemini CLI or Codex; the skill generates
    logo options using built-in design principles, process and SVG craft, cross-checks them against a
    1,400+ logo reference library and testing tools, and returns an editable SVG logo file.
  pain: 公开材料显示该 skill 把设计原则、流程、SVG 规范、测试工具和参考库打包进 AI 代理，说明作者判断的痛点是：通用 AI 直接生成标志时缺乏设计流程约束、SVG 输出不规范、也缺少可对照的参考基准，用户需要反复返工才能得到可用矢量文件。这是从产品结构反推的痛点，尚无用户抱怨或案例直接佐证。
  pain_en: 'The public description bundles design principles, process, SVG craft, testing tools and a
    reference library into the AI agent, implying the author''s perceived pain: generic AI logo generation
    lacks process constraints, produces non-standard SVG, and offers no reference baseline, forcing rework
    before a usable vector file exists. This pain is inferred from product structure, not yet corroborated
    by user complaints or cases.'
  current_alternative: 旧做法包括：设计师手工在 Illustrator/Figma 中绘制标志；用通用 AI 图像工具生成位图再手动描摹为矢量；或购买现成标志模板。该 skill
    的差异在于把流程与 SVG 规范直接嵌入代理，让生成结果一开始就是可编辑矢量。
  current_alternative_en: Existing approaches include hand-drawing logos in Illustrator/Figma, generating
    raster images with generic AI tools and manually tracing them into vectors, or buying ready-made logo
    templates. The skill differs by embedding process and SVG craft into the agent so output starts as
    editable vector.
  usage_reason: 推断：相较通用 AI 出图再手工描摹，该 skill 通过内置设计原则、SVG 规范与测试工具，在生成阶段就约束输出为可编辑矢量，并可用 1400+ 参考库比对，减少“生成位图—描摹—修正”这一整段返工；因此需要快速拿到可继续修改矢量标志的设计师或初创品牌负责人，会在早期概念阶段选择它。仓库收藏从
