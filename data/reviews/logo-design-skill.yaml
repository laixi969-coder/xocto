  market: ''
  job: 品牌设计师或初创公司品牌负责人在需要产出可用的标志方案时，把品牌定位与视觉要求交给 Claude、Gemini CLI、Codex 等 AI 代理，由该 skill 按内置设计原则、流程与
    SVG 规范生成标志，并调用测试工具与 1400+ 标志参考库比对，最终拿到可继续使用的 SVG 标志文件。
  job_en: A brand designer or startup brand lead who needs a usable logo hands the brand positioning and
    visual requirements to an AI agent (Claude, Gemini CLI, Codex), which uses this skill to generate
    marks following built-in design principles, process and SVG craft, cross-check against a 1,400+ logo
    reference library and testing tools, and returns a usable SVG logo file.
  pain: AI 代理直接生成标志时常见问题是不懂标志设计规范：SVG 路径粗糙、比例与留白失衡、小尺寸下不可辨识，设计师要反复返工重写提示词或手工修图；初创品牌负责人则缺少可参照的成熟标志样本，难以判断方案是否可用。
  pain_en: 'When an AI agent generates a logo unaided, it typically ignores logo-design conventions: crude
    SVG paths, poor proportion and spacing, illegibility at small sizes, forcing designers to iterate
    prompts or hand-fix files; startup brand leads also lack a reference set of mature marks to judge
    whether an output is usable.'
  current_alternative: 旧做法是设计师在 Illustrator/Figma 中手工绘制并反复调整，或直接让通用 AI 生成后自行修补；初创品牌负责人则外包给设计工作室、在 Logo
    模板站购买现成模板，或使用 Looka、Brandmark 等在线标志生成器。
  current_alternative_en: The old path is a designer drawing and iterating by hand in Illustrator/Figma,
    or letting a general AI generate output and then fixing it manually; startup brand leads outsource
    to a design studio, buy templates from logo marketplaces, or use online generators such as Looka or
    Brandmark.
  usage_reason: 推断：相较通用 AI 直接出图或手工从零绘制，该 skill 把设计原则、流程、SVG 规范、测试工具和 1400+ 参考库打包进代理上下文，使代理在生成阶段就按标志规范约束路径与比例，减少设计师事后修补
    SVG 和重写提示词的步骤，因此已在用 Claude/Codex 工作流的设计师或需要快速出初稿的初创品牌负责人会在出标志时调用它。
  usage_reason_en: 'Inference: versus raw AI generation or drawing from scratch, this skill packs design
    principles, process, SVG craft, testing tools and a 1,400+ reference library into the agent context,
    so the agent constrains paths and proportions to logo conventions during generation, cutting the designer''s
    post-hoc SVG fixing and prompt rewriting; designers already working in Claude/Codex or startup brand
    leads needing a fast first draft would invoke it when producing a logo.'
