  market: ''
  job: 独立开发者或小团队在搭建单文件 Web 小工具或原型时，需要把用户产生的数据保存下来，以便下次打开还能读到。
  job_en: An independent developer or small team building a single-file web tool or prototype needs to
    save the data users generate so it can be read again next time.
  pain: 公开材料只说明数据写入 SQLite，没有说明此前用户具体卡在哪一步、不解决会付出什么代价，痛点强度无法从现有事实判断。
  pain_en: Public material only says data is written into SQLite; it does not say which step users were
    stuck on before or what it costs not to solve it, so pain intensity cannot be judged from available
    facts.
  current_alternative: 常见旧做法是单独部署数据库服务，或使用托管数据库、本地文件与浏览器存储来绕过持久化问题。
  current_alternative_en: The common old approach is to deploy a separate database service, or to work
    around persistence with a hosted database, local files, or browser storage.
  usage_reason: 推断：相较单独部署数据库，Capsule 把存储动作收进单文件应用本身，可能省去配置与运维数据库这一步，因此不想维护数据库的独立开发者会尝试它；但公开材料未给出用户反馈或重复使用证据。
  usage_reason_en: 'Inference: compared with deploying a separate database, Capsule folds the storage
    action into the single-file app itself, potentially removing the step of configuring and operating
    a database, so indie developers who do not want to maintain one may try it; however, no user feedback
    or repeat-use evidence is provided in public material.'
