  market: ''
  job: 同时维护多个 AI Agent 客户端的开发团队，需要把提示与技能集中存放、按客户端限定范围并保留历史版本。
  job_en: A development team maintaining several AI agent clients needs prompts and skills stored centrally,
    scoped per client, and versioned.
  pain: 技能散落在各项目里，改动无法回溯，不同客户之间容易串用或泄露不该共享的提示。
  pain_en: Skills scattered across projects cannot be traced after changes, and prompts may leak or be
    reused across clients that should not share them.
  current_alternative: 现在多靠 Git 仓库、共享文档或复制粘贴在各项目间同步提示与技能。
  current_alternative_en: Today teams sync prompts and skills through Git repos, shared documents, or
    copy-pasting between projects.
  usage_reason: 推断：它把技能集中存放并加上版本与客户端范围，省去在多个仓库间手工同步和比对差异这一步，对同时服务多个客户的团队减少串用风险；是否有团队长期使用尚无公开证据。
  usage_reason_en: 'Inference: it centralizes skills with versions and client scoping, removing manual
    syncing and diffing across repositories, which reduces cross-client leakage risk for teams serving
    multiple clients; no public evidence yet that teams keep using it long term.'
