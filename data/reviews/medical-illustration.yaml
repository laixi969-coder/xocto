  market: ''
  job: 医学科研人员、医学插画师或科普编辑在准备论文配图、患者教育材料或科普内容时，需要把医学主题和证据材料转成准确、可编辑、可追溯的插画或示意图。
  job_en: Researchers, medical illustrators or science editors preparing journal figures, patient education
    materials or popular science content need to turn a medical topic and its evidence into accurate,
    editable and traceable illustrations or diagrams.
  pain: 医学图像既要专业准确又要符合合规与审稿要求，通用绘图模型容易画错解剖结构或凭空生成，人工绘制又慢且贵，返工和核对成本高。
  pain_en: Medical imagery must be both professionally accurate and compliant with review requirements;
    general image models misdraw anatomy or fabricate details, while manual illustration is slow and expensive,
    making rework and verification costly.
  current_alternative: 目前多由医学插画师手工绘制，或用通用绘图模型生成后再由专业人员逐张核对修改，审核记录通常靠人工整理。
  current_alternative_en: Today this is mostly done by hand by medical illustrators, or generated with
    general image models and then checked and corrected figure by figure, with review records kept manually.
  usage_reason: 相较通用绘图模型直接出图，该 Skill 把证据依据和审核记录一并纳入产出，并交付可编辑文件，减少专业人员逐张核对解剖细节和重建审核链的步骤；推断，面向有审稿或合规要求的科研与宣教团队。
  usage_reason_en: Compared with generating images directly from a general model, this skill bundles evidence
    grounding and review records into the output and delivers editable files, cutting the step of checking
    anatomical details figure by figure and rebuilding an audit trail; this is inference, aimed at research
    and education teams with review or compliance requirements.
