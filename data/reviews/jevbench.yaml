    which step, and there is no record of user complaints or substitute behaviour.
  current_alternative: 团队通常自己写脚本或论文附录里各报各的指标，缺少统一口径。
  current_alternative_en: Teams usually write their own scripts or report metrics separately in paper
    appendices, with no shared standard.
  usage_reason: 推断：如果它真能把评测流程固定下来，选型团队可以省掉自己搭对比脚本这一步，但公开材料没有说明输入输出和复现方式，因此无法确认它比自建脚本省在哪一步。
  usage_reason_en: 'Inference: if it truly fixes the evaluation process, selection teams could skip building
    their own comparison scripts, but public material does not describe inputs, outputs or reproduction,
    so it is unclear which step it saves versus self-built scripts.'
