  market: ''
  job: 销售或商务人员在客户会议、外呼或面试中，一边听对方说话一边需要立刻给出得体回应，Savvy 在屏幕上提示可照读的话术。
  job_en: A salesperson or business staffer in a client meeting, cold call or interview must respond well
    on the spot while listening, and Savvy shows lines on screen to read out.
  pain: 临场想不出话、答不上专业问题或说错话，会直接损失成交或机会；会后复盘来不及补救。
  pain_en: Failing to find words, answer a domain question or avoid a misstatement costs the deal or the
    opportunity immediately, and post-meeting review comes too late.
  current_alternative: 会前背话术、会后复盘录音，或旁边有人递纸条提示。
  current_alternative_en: Memorising scripts beforehand, reviewing recordings afterwards, or having a
    colleague pass notes.
  usage_reason: 推断：相比会前背稿和会后复盘，它在对话进行中直接给出可照读的句子，把“想不出怎么接”这一步从用户身上移走，因此高频面对陌生提问的销售和面试者会在关键通话时打开它；候选未提供任何使用反馈，是否长期留在工作流无法确认。
  usage_reason_en: 'Inference: unlike memorising scripts or reviewing afterwards, it supplies readable
    lines during the conversation, removing the step of finding the right words, so salespeople and interviewees
    facing unfamiliar questions would open it on high-stakes calls; no usage feedback is provided, so
    long-term retention cannot be confirmed.'
