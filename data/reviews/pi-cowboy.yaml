  market: ''
  job: 开发者在本地终端同时调度 Codex、Claude Code、OpenCode 等多个编码代理，把同一任务拆分给不同代理执行并汇总结果。
  job_en: Developers orchestrate Codex, Claude Code and OpenCode coding agents from a local terminal,
    splitting one task across agents and collecting results.
  pain: 多个编码代理各自有界面和上下文，开发者要手工复制任务、来回切换并自行比对输出，重复劳动且容易漏掉冲突。
  pain_en: Each coding agent has its own interface and context, so developers manually copy tasks, switch
    back and forth and compare outputs themselves, which is repetitive and easily misses conflicts.
  current_alternative: 开发者分别打开各代理的终端或网页，手工粘贴同一任务，再人工比对结果；或只用单一代理完成全部工作。
  current_alternative_en: Developers open each agent's terminal or web page separately, paste the same
    task by hand and compare results manually, or just use one agent for everything.
  usage_reason: 推断：Pi-cowboy 把多个代理收进同一终端并作为子代理调度，省去逐个切换和手工粘贴这一步，让已有多个代理订阅的开发者在一个入口发起分工任务；合并与校验环节是否可靠尚无公开证据。
  usage_reason_en: 'Inference: Pi-cowboy pulls several agents into one terminal and drives them as subagents,
    removing the step of switching and pasting by hand so developers with multiple agent subscriptions
    can launch split tasks from one entry point; whether merging and checking are reliable has no public
    evidence yet.'
