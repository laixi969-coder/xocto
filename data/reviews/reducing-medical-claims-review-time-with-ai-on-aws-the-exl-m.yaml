  market: ''
  job: 保险公司的理赔审核员在收到一批病历与理赔材料时，需要逐份阅读、抽取诊断与治疗信息并形成审核结论，用于判断赔付。
  job_en: A claims reviewer at an insurer, receiving a batch of medical records and claim documents, must
    read each one, extract diagnosis and treatment information and form a review conclusion for the payout
    decision.
  pain: 病历格式杂、篇幅长，单案人工阅读与整理超过 100 分钟，审核积压且容易漏看关键字段。
  pain_en: Medical records are heterogeneous and long; manual reading and organising takes over 100 minutes
    per case, causing review backlogs and missed key fields.
  current_alternative: 由审核员人工逐页阅读病历，配合通用 OCR 与关键词检索，再手工填写审核表。
  current_alternative_en: Reviewers read records page by page, aided by generic OCR and keyword search,
    then fill in the review form by hand.
  usage_reason: 相较人工逐页阅读加通用 OCR，它用医疗领域模型直接完成字段抽取、摘要与按问题检索，把“先通读再找关键信息”这一步省掉，审核员只需核对输出要点；因此病历量大、审核时限紧的保险理赔团队会在积压时选择它（推断）。
  usage_reason_en: Compared with page-by-page reading plus generic OCR, it uses domain-specific models
    to extract fields, summarise and answer queries directly, removing the 'read everything first, then
    hunt for key facts' step so reviewers only verify the output; claims teams with high record volume
    and tight deadlines would choose it when backlogs build (inference).
