  pain_en: Real machines are expensive, dangerous or simply inaccessible, and static images or videos
    cannot show internal layer relationships, making it hard for learners to build structural understanding.
  current_alternative: 教科书剖面图、拆解视频、实体模型或专业 CAD/仿真软件；前者不可交互，后者学习与采购成本高。
  current_alternative_en: Textbook cutaway diagrams, teardown videos, physical models or professional
    CAD/simulation software; the former are not interactive, the latter carry high learning and procurement
    costs.
  usage_reason: 推断：相较看剖面图或视频，它让用户在浏览器里直接逐层拆开模型，省去安装专业仿真软件或购买实体模型的步骤，因此工程教学与科普场景的用户可能选择它；但公开材料未显示任何 AI
    环节、付费路径或重复使用证据。
  usage_reason_en: 'Inference: compared with reading cutaways or watching videos, it lets users disassemble
    models layer by layer directly in the browser, removing the step of installing professional simulation
    software or buying physical models, so users in engineering teaching and science communication may
    choose it; however, public material shows no AI step, payment path or repeat-use evidence.'
