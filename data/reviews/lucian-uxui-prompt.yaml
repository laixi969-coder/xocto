  market: ''
  job: 前端开发者与产品设计师在搭建界面时，需要从大量 UI 元素里挑出合适的样式，并把它变成可用的代码或提示词。
  job_en: Front-end developers and product designers, while building interfaces, need to pick suitable
    styles from many UI elements and turn them into usable code or prompts.
  pain: 挑选组件样式通常要在文档、截图和代码之间来回对照，再手写或改写代码，这一步重复且耗时。
  pain_en: Choosing component styles usually means cross-referencing docs, screenshots and code, then
    hand-writing or rewriting code, a repetitive and time-consuming step.
  current_alternative: 旧做法是翻组件库文档、看设计稿截图，再手动把样式写成代码，或直接向模型描述想要的效果。
  current_alternative_en: The old way is browsing component-library docs, looking at design screenshots,
    then manually writing the style into code, or describing the desired look to a model.
  usage_reason: 推断：它把“先看效果再写代码”合并成一次实时预览加复制，省掉在文档与编辑器之间来回对照的一步，因此赶界面进度的前端与设计师会先试它。
  usage_reason_en: 'Inference: it merges see-the-result and write-the-code into one live preview plus
    copy, removing the back-and-forth between docs and editor, so front-end developers and designers on
    a deadline would try it first.'
