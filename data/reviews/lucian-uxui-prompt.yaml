  job_en: Front-end developers and product designers, while building interfaces, need to pick suitable
    styles from many UI elements and turn them into usable code or prompts.
  pain: 挑选组件样式通常要在文档、截图和代码之间来回对照，再手写或改写代码，这一步重复且耗时。
