  market: ''
  job: 前端开发者与产品设计师在搭建界面、需要快速确定某个控件长什么样时，浏览约 200 个可实时交互的 UI 元素，试出合适样式后复制成 AI 提示词或可用代码，再放进自己的项目。
  job_en: Front-end developers and product designers building an interface need to settle how a given
    control should look; they browse ~200 live interactive UI elements, try the fit, then copy it as an
    AI prompt or working code into their project.
  pain: 公开材料只说明元素可实时试看并复制为提示词或代码，未提供用户抱怨或反馈；可确认的痛点是选样式与产出代码分处两处，需在预览页、文档与编辑器之间反复对照，这一步重复且打断搭建节奏。
  pain_en: Public material only states that elements can be tried live and copied as prompts or code,
    with no user complaints or feedback; the verifiable pain is that style selection and code output live
    in separate places, forcing repeated cross-referencing between preview, docs and editor, a repetitive
    step that breaks building flow.
  current_alternative: 旧做法是翻组件库文档或设计稿截图挑样式，再手写或改写 CSS/组件代码，或直接向模型描述想要的效果让它生成。
  current_alternative_en: The old way is browsing component-library docs or design screenshots to pick
    a style, then hand-writing or rewriting CSS/component code, or describing the desired look to a model
    and letting it generate.
  usage_reason: 推断：相较翻文档再手写，它把“看效果”和“拿产物”压成一次实时预览加复制，省掉在文档与编辑器之间来回对照并重写样式的那一步，因此赶界面进度、又需要提示词或代码产物的前端与设计师会在选控件样式时先试它。
  usage_reason_en: 'Inference: versus browsing docs then hand-writing, it compresses see-the-result and
    get-the-artifact into one live preview plus copy, removing the step of cross-referencing docs and
    editor and rewriting the style, so front-end developers and designers on a deadline who need a prompt
    or code artifact would try it first when picking a control style.'
