  market: ''
  job: AI 安全研究员在每天开始工作时，面对 arXiv、会议和社区的大量新论文，需要快速筛出当天值得精读的少数几篇并导入文献管理工具。
  job_en: An AI safety researcher starting the day faces a flood of new papers from arXiv, conferences
    and community feeds, and needs to quickly shortlist a few worth reading closely and import them into
    a reference manager.
  pain: 论文数量远超个人阅读能力，人工筛选耗时且容易漏掉重要工作；现有替代是手动刷 arXiv 列表或依赖社交媒体转发，覆盖不稳定。
