    work. The current alternative is manually scanning arXiv listings or relying on social media shares,
    which is inconsistent in coverage.
  current_alternative: 手动浏览 arXiv 分类列表、订阅邮件列表、或在社交平台上等待他人转发推荐。
  current_alternative_en: Manually browsing arXiv category listings, subscribing to mailing lists, or
    waiting for others to share recommendations on social platforms.
  usage_reason: 推断：它把分散的每日论文整理成可直接导入的 bib/json 清单，省去逐条复制标题和链接这一步，因此需要批量维护参考文献的研究者可能选择它；但公开材料未给出筛选标准、更新频率或用户留存证据，无法确认它是否被长期留在工作流中。
  usage_reason_en: 'Inference: it turns scattered daily papers into an importable bib/json list, removing
    the step of copying titles and links one by one, so researchers maintaining large reference libraries
    may choose it. However, public materials give no selection criteria, update frequency or retention
    evidence, so long-term workflow adoption cannot be confirmed.'
