  current_alternative: 现有做法是人工逐句校对、请母语者审稿，或反复让通用模型重写。
  current_alternative_en: Current practice is manual sentence-by-sentence proofreading, hiring native
    reviewers, or repeatedly asking a general model to rewrite.
  usage_reason: 推断：它把“找出不自然表达并改写”这一步从人工逐句校对换成一次针对性改写，面向需要批量产出日文内容、又缺少母语审稿人的团队；但公开材料没有改写质量或使用反馈，是否真能减少人工终审尚未核验。
  usage_reason_en: 'Inference: it replaces sentence-by-sentence manual proofreading with a targeted rewrite,
    aimed at teams producing Japanese content at volume without native reviewers; but no rewrite quality
    or usage feedback is public, so whether it truly reduces human final review remains unverified.'
