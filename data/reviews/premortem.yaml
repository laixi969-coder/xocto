  market: ''
  job: 早期创业者在写商业计划或准备融资前，整理自己的想法假设，要完成一次失败路径排查，避免明显盲点。
  job_en: Before writing a business plan or raising money, an early-stage founder organizes their assumptions
    and needs a failure-path review to avoid obvious blind spots.
  pain: 创业者身边缺少愿意直说问题的质疑者，容易在自我确认中忽略致命假设。
