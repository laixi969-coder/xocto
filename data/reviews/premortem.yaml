    through self-confirmation.
  current_alternative: 现有做法是找朋友、顾问或投资人给反馈，或自己反复推演，反馈慢且不系统。
  current_alternative_en: The current practice is asking friends, advisors or investors for feedback,
    or reasoning alone, which is slow and unsystematic.
  usage_reason: 推断：若 agent 能按固定框架逐条质疑假设并输出风险清单，可省去反复找人约反馈这一步，因此缺少顾问网络的早期创业者可能试用；但公开材料未说明输出是否引用真实数据，也没有任何付费或重复使用证据。
  usage_reason_en: 'Inference: if the agents question assumptions against a fixed framework and output
    a risk list, it removes the step of repeatedly scheduling feedback conversations, so early founders
    without an advisor network may try it; however, public material does not say whether outputs cite
    real data, and there is no payment or repeat-use evidence.'
