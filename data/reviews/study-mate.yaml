  market: ''
  job: 自学一门科目的学生（如备考或转行自学者）在选定科目后，需要先确定从哪学起、按什么顺序推进，再在遇到不懂的知识点时获得讲解，并动手做练习项目来检验是否学透。
  job_en: A student self-studying a subject (e.g., exam prep or career switching) must first decide where
    to start and in what order to progress, then get explanations at points of confusion, and finally
    do hands-on projects to verify mastery.
  pain: 自学最大的摩擦是路线不清与无人答疑：没有老师排进度，学习者容易在选材和顺序上反复犹豫、卡住后无人讲解而中断；公开材料只给出产品自述，未提供用户抱怨或中断率数据，痛点强度属工作流结构推理。
  pain_en: 'The core friction of self-study is unclear sequencing and no one to ask: without a teacher
    setting the pace, learners hesitate over materials and order, and stall when stuck with no explanation.
    Public material only offers the product''s own description, with no user complaints or dropout data,
    so pain intensity is a workflow-structure inference.'
  current_alternative: 现状替代是自行搜索课程与教程、拼装学习清单，遇到问题去论坛、问答社区或通用聊天机器人零散提问，路线与讲解分散在多个来源，需要自己拼接和判断进度。
  current_alternative_en: Today users search for courses and tutorials, assemble their own study lists,
    and ask fragmented questions on forums, Q&A sites, or general chatbots; the route and explanations
    are scattered across sources and must be stitched together by the learner.
  usage_reason: 推断：相较自己拼课程清单再零散提问，它把“定路线—讲知识点—给项目任务”收进同一入口，用户输入科目与当前进度即可拿到成型的路线和讲解，省去在多个来源间比对与拼接的步骤；因此卡在起步或中途停滞的自学者会在规划与答疑节点选择它。练习是否真正完成仍需学习者自行确认。
  usage_reason_en: 'Inference: versus assembling a course list and asking scattered questions, it consolidates
    route-setting, explanation, and project tasks into one entry point, so a user who inputs a subject
    and current progress gets a ready route and explanation, removing the step of comparing and stitching
