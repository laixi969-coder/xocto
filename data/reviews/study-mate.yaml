  next_validation: 追踪 Study-Mate 的 公开代码仓库 仓库 README、issue 与 discussion，确认是否有用户公开描述用它替代原有自学流程的具体场景与使用结果。
  market: ''
  job: 自学一门科目的学生（多为编程/技术类自学者），在选定科目后面对零散教程不知从何入手时，把想学的科目与当前进度交给 Study-Mate，让它产出学习路线、知识点讲解和练习项目任务，再按路线边学边做。
  job_en: Students self-studying a subject
  pain: 公开材料只给出产品定位（定路线、讲知识、做项目），未提供用户抱怨或案例；从工作流结构推理，自学者的痛点是路线规划与知识点串联要自己拼凑、遇到卡点无人即时讲解、缺少可动手的练习任务，导致中途放弃。这是结构推理，不是用户口述。
  pain_en: Public materials only give the product positioning (roadmap, explanations, projects) with no
    user complaints or cases; by workflow inference, the self-learner's pain is having to assemble a roadmap
    and connect concepts alone, having no immediate explanation at blockers, and lacking hands-on tasks,
    which leads to dropping out. This is structural inference, not user testimony.
  current_alternative: 现有替代是搜索引擎与视频教程、MOOC 课程、教材、论坛问答，以及直接使用通用聊天机器人逐条提问；这些方式需要用户自己组织顺序和判断学到哪一步。
  current_alternative_en: Current alternatives are search engines and video tutorials, MOOCs, textbooks,
    forum Q&A, and asking a general chatbot question by question; these require the user to sequence the
    material and judge their own progress.
  usage_reason: 推断：相较自己拼教程或逐条问通用聊天机器人，它把“定路线—讲知识—给项目任务”串成一次连续交付，减少用户自己排顺序、找下一份材料的那一步负担，因此适合刚选定科目、需要一条可执行路径的自学者在起步阶段选择它。
  usage_reason_en: 'Inference: versus assembling tutorials or asking a general chatbot one question at
    a time, it chains roadmap, explanation and project tasks into one continuous delivery, removing the
    step of sequencing material and hunting for the next resource, so a self-learner who just picked a
    subject and needs an executable path would choose it at the start.'
