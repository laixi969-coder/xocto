  market: ''
  job: 安全团队在授权攻防演练或内部自查时，把自有系统交给系统，由 AI 代理执行探测与攻击尝试，最终要拿到可复核的漏洞结论用于整改。
  job_en: During authorized exercises or internal self-checks, a security team hands its own systems to
    the system, AI agents attempt probing and attacks, and the team needs reviewable vulnerability conclusions
    for remediation.
  pain: 攻防演练依赖资深人员排期，覆盖面和频次受限，重复探测步骤占用大量工时。
  pain_en: Exercises depend on senior staff scheduling, limiting coverage and frequency, while repetitive
    probing consumes many hours.
  current_alternative: 目前靠人工渗透测试、开源扫描器加人工验证，或外包安全服务。
  current_alternative_en: Today this relies on manual penetration testing, open-source scanners plus human
    verification, or outsourced security services.
  usage_reason: 相较扫描器只给疑似清单、人工逐条复现，它让代理把探测到验证串成一次运行，减少安全人员在重复步骤上的投入，因此人手有限但需定期演练的团队会先试用；这是基于产品能力的推断，尚无客户案例或留存证据。
  usage_reason_en: Compared with scanners producing suspected-issue lists that humans reproduce one by
    one, it lets agents chain probing to verification in one run, cutting staff time on repetitive steps,
    so thinly staffed teams needing periodic exercises would try it first; this is inference from capability,
    with no customer case or retention evidence yet.
