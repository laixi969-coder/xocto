  market: ''
  job: 前端开发者在本地跑 Vite 开发服务器时，直接在页面上标注界面问题，把带位置的反馈交给编码代理去改代码。
  job_en: A front-end developer running a local Vite dev server annotates UI issues directly on the page
    and hands located feedback to a coding agent to change the code.
  pain: 向编码代理描述界面哪里不对要靠文字和截图，位置说不清，代理常改错地方，来回沟通成本高。
  pain_en: Describing to a coding agent what is wrong on screen relies on text and screenshots, locations
    are ambiguous, the agent often edits the wrong place, and back-and-forth is costly.
  current_alternative: 用文字描述加截图贴给代理，或自己手动定位文件与行号再改。
  current_alternative_en: Pasting text descriptions and screenshots to the agent, or manually locating
    the file and line before editing.
  usage_reason: 推断：相较文字加截图，它在页面元素上直接留下带位置的标注，省掉开发者把视觉问题翻译成文件路径和行号的一步，使用编码代理的前端开发者会在界面走查时选它；尚无公开使用反馈。
  usage_reason_en: 'Inference: compared with text plus screenshots, it leaves located annotations on page
    elements, skipping the step of translating a visual issue into file paths and line numbers, so front-end
    developers using coding agents would pick it during UI walkthroughs; no public usage feedback yet.'
