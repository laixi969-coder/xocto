  market: ''
  job: 仍在使用 2007 年前后诺基亚 S40/S60 功能机的人，在需要查资料或提问时，用手机上的 J2ME 应用输入问题，希望拿到可读的答案而不是空白页面。
  job_en: People still using Nokia S40/S60 feature phones from around 2007 type a question into a J2ME
    app on the handset and expect a readable answer instead of a blank page.
  pain: 这些设备上的 Google 搜索等在线服务已经停止可用，用户要么换机，要么彻底失去在旧设备上获取信息的能力。
  pain_en: Online services such as Google search no longer work on these devices, so users must either
    replace the phone or lose the ability to get information on it entirely.
  current_alternative: 换一部智能手机，或放弃在功能机上查询，改用电脑或其他人的设备。
  current_alternative_en: Buy a smartphone, or give up querying on the feature phone and use a computer
    or someone else's device instead.
  usage_reason: 推断：相较换机或放弃查询，它把问题直接送到多模型服务端并把答案回显在原有屏幕上，省去更换设备和迁移使用习惯这一步，因此仍持有可用功能机、又不想换机的人会尝试它。
  usage_reason_en: 'Inference: compared with replacing the phone or giving up, it routes the question
    to a multi-model server and renders the answer on the existing screen, removing the device-switch
    and habit-migration step, so people who still own a working feature phone and resist upgrading are
    likely to try it.'
