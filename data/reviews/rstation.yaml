  market: ''
  job: 研究团队与知识工作者在同时运行多个 AI 代理做调研时，面对分散在各处的检索结果与笔记，要把它们汇总成可共享的研究结论。
  job_en: Research teams and knowledge workers running several AI agents at once, working with scattered
    search results and notes, must consolidate them into shareable research conclusions.
  pain: 材料只给出“共享研究实验室”这一句描述，没有说明多代理产出汇总时具体卡在哪一步、不解决会失去什么，痛点无法从现有事实还原。
  pain_en: The material only offers the phrase shared research lab; it does not say where consolidating
    multi-agent output actually breaks down or what is lost if unsolved, so the pain cannot be reconstructed
    from available facts.
  current_alternative: 常见替代是共享文档、笔记工具或各自保存代理输出后人工合并；这是行业通行做法的推断，候选材料未提供替代行为证据。
  current_alternative_en: Common alternatives are shared documents, note tools, or saving agent output
    separately and merging by hand; this is an inference about common practice, and the candidate provides
    no evidence of substitute behavior.
  usage_reason: 若它把多个代理的检索与笔记收敛到同一处并保留可复核的痕迹，团队可省去跨工具手工合并这一步，因此以报告交付的研究团队可能选择它；这属于基于产品定位的推断，缺少用户反馈或案例支持。
  usage_reason_en: If it converges multiple agents' searches and notes into one place with reviewable
    traces, teams skip manual cross-tool merging, which may lead report-delivering research teams to choose
    it; this is an inference from positioning, lacking user feedback or case evidence.
