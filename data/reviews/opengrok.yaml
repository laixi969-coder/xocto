  market: ''
  job: 开发者或开源维护者在接手大型陌生代码库时，需要跨文件追踪某个符号、函数或变量的定义与全部引用，以理解代码结构与调用关系。
  job_en: Developers or open-source maintainers taking over a large unfamiliar codebase need to trace
    a symbol, function, or variable across files to understand structure and call relationships.
  pain: 大型代码树中符号散落多处，仅靠文本搜索或逐层翻目录难以定位定义与引用，理解成本高且容易漏掉调用点。
  pain_en: In large source trees, symbols are scattered across many files; plain text search or manual
    directory browsing makes it hard to locate definitions and references, and call sites are easily missed.
  current_alternative: 用 grep、IDE 内置搜索或 公开代码仓库 网页搜索逐文件查找，再人工拼接调用关系。
  current_alternative_en: Using grep, IDE built-in search, or public code repository web search file by
    file, then manually piecing together call relationships.
  usage_reason: 推断：相较 grep 或 IDE 搜索，OpenGrok 预先为整棵源码树建立交叉引用索引，用户输入符号即可直接得到定义、引用与跳转结果，省去逐文件检索和人工拼接这一步，因此接手陌生大型代码库的开发者会在需要跨文件追踪符号时选择它。
  usage_reason_en: 'Inference: unlike grep or IDE search, OpenGrok pre-builds a cross-reference index
    over the whole source tree, so entering a symbol directly yields definitions, references, and navigation,
    removing the file-by-file search and manual stitching step; developers onboarding to large unfamiliar
    codebases would choose it when cross-file symbol tracing is needed.'
