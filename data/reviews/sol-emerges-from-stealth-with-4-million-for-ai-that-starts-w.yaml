    taking notes and creating tasks one by one in a CRM or to-do tool.
  usage_reason: 相较手动翻邮件建待办，Sol 直接从邮件内容中提取承诺并推进执行，省掉人工识别与录入这一步，因此承诺密集、邮件量大的销售或客户成功人员会考虑使用；此为基于产品能力的推断。
