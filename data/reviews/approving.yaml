    recoverable, auditable intermediate node. Public materials give no frequency or cost figures for this
    pain.
  current_alternative: 旧做法是让代理直接在本地或 CI 里跑，靠人工盯终端、事后看 git diff 和 PR 评审来兜底；部分团队用容器或临时分支做隔离，但没有内建的人工批准闸门与结构化产物交换。
  current_alternative_en: The old way is to let the agent run directly locally or in CI, relying on a
    human watching the terminal plus post-hoc git diff and PR review; some teams isolate with containers
    or throwaway branches, but without a built-in human approval gate and structured artifact exchange.
  usage_reason: 推断：相较直接跑代理再看 diff，它把执行限制在 Docker 沙箱内，并在关键节点强制暂停等待 Approve，把“事后发现错误”提前为“执行前拦截”，因此在意不可逆改动与审计留痕的代理使用者会在处理高风险仓库或生产相关任务时选择它；公开材料尚无用户反馈或案例证实这一动机。
  usage_reason_en: 'Inference: versus running the agent and reviewing diffs afterward, it confines execution
    to a Docker sandbox and forces a pause for Approve at critical nodes, moving error detection from
    after-the-fact to before execution, so agent users who care about irreversible changes and audit trails
    would pick it for high-risk repos or production-adjacent tasks; public materials contain no user feedback
    or case confirming this motive.'
