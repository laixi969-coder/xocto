  market: ''
  job: 产品设计师在画布里改稿或做原型时，用文字指令让它在同一画布上生成和修改设计稿，替代在工具间来回切换。
  job_en: Product designers editing or prototyping on the canvas use text prompts to have it generate
    and modify designs in the same canvas, replacing switching between tools.
  pain: 设计稿的生成与修改此前分散在对话工具和设计工具之间，设计师需要反复复制粘贴并手动重建图层结构，这是工作流推理，材料未给出用户抱怨。
  pain_en: Generating and revising designs was split between chat tools and design tools, forcing designers
    to copy-paste and rebuild layer structure by hand; this is workflow inference, as the material gives
    no user complaints.
  current_alternative: 旧做法是在外部生成工具里出图，再手动导入设计工具重建图层与组件，或直接由设计师手绘。
  current_alternative_en: The old practice was generating images in an external tool, then manually importing
    them and rebuilding layers and components, or drawing by hand.
  usage_reason: 推断：它把生成与修改放在同一画布内完成，省去导出再导入并重建图层这一步，因此已在用设计系统、需要反复迭代原型的设计师会在改稿阶段选择它；材料未提供留存或复购证据。
  usage_reason_en: 'Inference: it performs generation and editing inside the same canvas, removing the
    export-import-and-rebuild step, so designers already using a design system and iterating on prototypes
    would choose it during revision; the material offers no retention or repeat-use evidence.'
