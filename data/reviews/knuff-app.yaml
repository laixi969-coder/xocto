  usage_reason_en: 'Inference: if a missed check-in automatically escalates to a designated family member,
    it removes the step of initiating a daily call and the step of charging and wearing a device; but
    the public material does not describe escalation, so it cannot yet be confirmed which users would
    choose it for that reason.'
