  market: ''
  job: 知识工作者在需要完成跨应用的多步任务（如收集资料、整理成文档、执行操作）时，把目标交给 Manus，由它拆解步骤并产出可交付结果。
  job_en: Knowledge workers who need to complete multi-step, cross-application tasks (gathering material,
    assembling documents, executing actions) hand the goal to Manus, which decomposes the steps and produces
    a deliverable.
  pain: 这类任务原本要在多个工具间手工切换、复制粘贴并逐步推进，耗时且容易中断；用户希望一次交代目标就拿到结果。
  pain_en: Such tasks previously required manual switching between tools, copy-pasting and step-by-step
    progress, which is slow and easily interrupted; users want to state a goal once and get a result.
  current_alternative: 现状是人工在浏览器、文档与办公软件之间手动串联步骤，或使用只能单轮对话、无法执行动作的聊天助手。
  current_alternative_en: Today people manually chain steps across browsers, documents and office software,
    or use chat assistants that only answer in one turn and cannot act.
  usage_reason: 相较手工串联，Manus 通过把目标拆成可执行步骤并代为执行，减少用户在工具间切换和逐步操作的那一步负担，因此需要跑完多步任务、又不想自己逐步操作的用户会在这种情况下选择它；这是基于产品能力的推断，候选材料未提供留存或复购证据。
  usage_reason_en: Compared with manual chaining, Manus reduces the burden of switching tools and executing
    each step by decomposing a goal into executable steps and running them, so users who need multi-step
    tasks finished without doing each step themselves would choose it in that situation; this is inference
    from product capability, as the candidate material offers no retention or repeat-use evidence.
