  market: ''
  job: AI 应用开发者在把产品接入多个 MCP 服务器时，需要处理工具调用序列与上下文，让任务在可控成本下完成并可回退。
  job_en: AI application developers connecting a product to several MCP servers must handle tool-call
    sequences and context so tasks finish at controllable cost and can be rolled back.
  pain: 逐步调用导致 token 消耗高、调用链难追踪，出错后难以还原到改动前的状态。
  pain_en: Step-by-step calls burn tokens, the call chain is hard to trace, and recovering the pre-change
    state after an error is difficult.
  current_alternative: 开发者自己在应用里手写编排逻辑，或依赖各 MCP 客户端自带的调用方式，成本与回退靠日志排查。
  current_alternative_en: Developers hand-write orchestration inside their app or rely on whatever call
    pattern each MCP client offers, tracing cost and rollback through logs.
  usage_reason: 推断：相较手写编排，它把每个任务的多次工具调用合并成一个程序并记录可撤销的改动，减少开发者自己写编排与事后翻日志定位的那一步，因此高频调用 MCP、对 token 成本敏感的团队会尝试它。
  usage_reason_en: 'Inference: compared with hand-written orchestration, it merges a task''s multiple
    tool calls into one program and records undoable changes, removing the step of writing orchestration
    and digging through logs afterwards, which is why teams calling MCP heavily and sensitive to token
    cost would try it.'
