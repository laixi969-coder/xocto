  market: ''
  job: AI 应用开发者在把 AI 应用接入多个 MCP 服务器时，处理逐步发起的工具调用序列，要把一个任务的多步调用合并成一次可执行程序，并保留每次改动的记录以便回退。
  job_en: AI application developers wiring AI apps to multiple MCP servers handle step-by-step tool-call
    sequences, and need to collapse a task's many calls into one executable program while keeping an undoable
    record of each change.
  pain: 逐步工具调用会重复携带上下文，token 消耗随步数放大，成本与延迟上升；同时多步改动散落在各次调用中，出错后难以定位和回退。
  pain_en: Step-by-step tool calls re-send context, so token cost and latency grow with each step; multi-step
    changes are scattered across calls, making failures hard to locate and roll back.
  current_alternative: 开发者目前自行编排 MCP 调用链、手写脚本或工作流，并靠日志和版本控制手动回滚。
  current_alternative_en: Developers currently hand-orchestrate MCP call chains, write their own scripts
    or workflows, and roll back manually via logs and version control.
  usage_reason: 推断：相较手写逐步调用链，Delta MCP 把每个任务编译成一个程序并记录可撤销改动，省掉逐次拼接调用与手工回滚这两步，因此在意 token 成本与操作可回退的 MCP
    集成开发者会尝试它；公开材料尚无用户反馈证实这一因果。
  usage_reason_en: 'Inference: versus hand-written step-by-step chains, Delta MCP compiles each task into
    one program and records undoable changes, removing the per-call stitching and manual rollback steps,
    so MCP integrators sensitive to token cost and reversibility would try it; no public user feedback
    yet confirms this causal link.'
