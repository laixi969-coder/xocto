  next_validation: 收集 BookPress 官方仓库或官网的兼容性说明与部署文档，确认它能否运行现有 WordPress 主题与插件。
  market: ''
  job: 网站开发者与内容发布者在自建或迁移 WordPress 站点时，需要让站点在更低成本的运行环境下跑起来，并保持原有内容可用。
  job_en: Web developers and publishers building or migrating WordPress sites need the site to run in
    a cheaper runtime while keeping existing content usable.
  pain: PHP 与 MySQL 栈的部署和服务器开销对个人与小团队是持续负担，但公开材料没有说明 BookPress 具体减轻了哪一步。
  pain_en: The PHP and MySQL stack imposes ongoing deployment and server cost on individuals and small
    teams, but the public material does not say which step BookPress actually relieves.
  current_alternative: 继续使用官方 WordPress，或改用静态站点生成器、其他 CMS 重新搭建。
  current_alternative_en: Keep using official WordPress, or rebuild with a static site generator or another
    CMS.
  usage_reason: 推断：若它能在保留内容的前提下降低运行开销，对自建站的小团队会有吸引力；但兼容性、迁移路径与交付结果均未公开，尚不足以判断用户是否会选择它。
  usage_reason_en: 'Inference: if it lowers runtime cost while preserving content, it could appeal to
    small self-hosting teams; but compatibility, migration path and deliverable are undisclosed, so user
    choice cannot yet be judged.'
