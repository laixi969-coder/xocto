  market: ''
  job: 音乐教师或学生在课后练习与授课环节，处理学生演奏录音与教师批改标准这类材料，要完成的是给出可执行的练习纠正与进度判断。
  job_en: A music teacher or student, around lesson and practice time, works with student performance
    recordings and the teacher's grading standard to produce actionable practice corrections and progress
    judgements.
  pain: 音乐教学长期依赖师徒口传，方法陈旧且因人而异，学生课后练习缺少即时、与教师标准一致的反馈；候选资料未给出用户抱怨或替代行为的直接证据，此痛点为结构推理。
  pain_en: Music teaching has long relied on master-to-apprentice transmission with outdated, teacher-specific
    methods, leaving students without immediate feedback aligned to their teacher's standard; the candidate
    material gives no direct user complaints or workaround evidence, so this pain is a structural inference.
  current_alternative: 旧做法是学生课后自行练习、下次上课由教师口头纠正，或使用通用节拍器与录播课程；这些替代方式无法对齐单个教师的标准。
  current_alternative_en: The old way is self-practice between lessons with verbal correction at the next
    lesson, or generic metronomes and recorded courses; none of these align with an individual teacher's
    standard.
  usage_reason: 推断：若它能把学生练习音频按教师既有批改标准转成具体纠正点，就省掉了教师逐条回听与重复讲解这一步，因此课时紧张、学生分散的琴行与独立教师会在课后练习环节选择它；候选资料未说明
    AI 具体动作，也未提供留存或复购证据，无法确认用户已长期留在工作流里。
  usage_reason_en: 'Inference: if it turns student practice audio into specific corrections matching the
    teacher''s existing grading standard, it removes the step of the teacher re-listening and repeating
    explanations, so music schools and independent teachers with tight schedules and scattered students
    would choose it at the post-lesson practice step; the candidate material does not describe the AI''s
    concrete action and offers no retention or repeat-use evidence, so long-term workflow embedding '
