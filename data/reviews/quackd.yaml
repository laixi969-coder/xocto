  market: ''
  job: 自建 Microduck、Open Duck Mini、Reachy Mini、LeRobot 机械臂或 ROS 底盘的创客与机器人开发者，在已装好硬件、但只有零散动作技能的情况下，用自然语言说出目标，让
    LLM 规划并串起动作序列，在模拟器或真机上跑完一次任务。
  job_en: Makers and robotics developers who have assembled a Microduck, Open Duck Mini, Reachy Mini,
    LeRobot arm or ROS base and, having only isolated motion skills, state a goal in natural language
    so an LLM plans and chains the steps and runs the task in simulator or on hardware.
  pain: 公开说明直接点出痛点：机器人“知道自己的动作，却不知道如何把它们连起来”，用户得自己写编排逻辑把单个技能串成任务；不解决的后果是每次新目标都要重写连接代码，跨运行状态也无法延续。
  pain_en: 'The public description names the pain directly: the robot ''knows its moves but not how to
    connect them'', so the user must hand-write orchestration to chain individual skills; leaving it unsolved
    means rewriting glue code for every new goal and losing state between runs.'
  current_alternative: 旧做法是用户自己写脚本或状态机，把每个动作技能硬编码成固定序列，并自行管理运行之间的状态与安全约束。
  current_alternative_en: The old way is for the user to write scripts or state machines that hard-code
    each motion skill into a fixed sequence, managing run-to-run state and safety constraints by hand.
  usage_reason: 推断：相较手写编排脚本，quackd 让用户只给一句目标，由 LLM 负责规划并调用已有技能，省掉为每个新任务重写连接逻辑这一步；.duck 安全契约与跨运行记忆进一步减少重复设定状态与边界的工作，因此已搭好硬件、想快速试新任务的创客会在迭代任务时选它。
  usage_reason_en: 'Inference: versus hand-written orchestration, quackd lets the user give one goal and
    has the LLM plan and call existing skills, removing the step of rewriting glue logic for each new
    task; .duck safety contracts and cross-run memory further cut repeated state and boundary setup, so
    makers with assembled hardware trying new tasks quickly would pick it when iterating.'
