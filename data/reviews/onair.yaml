  market: ''
  job: 无线电爱好者或射频工程师在本地接上 HackRF、RTL-SDR、Airspy 等 SDR 硬件后，需要同时接收并解码数字电视、DAB+、FM、ADS-B、ACARS、GNSS 与业余无线电等信号，在频谱界面里得到可读的频道、航迹或报文。
  job_en: Radio hobbyists or RF engineers who connect SDR hardware such as HackRF, RTL-SDR or Airspy locally
    need to receive and decode digital TV, DAB+, FM, ADS-B, ACARS, GNSS and ham signals at once, obtaining
    readable channels, tracks or messages in a spectrum interface.
  pain: 公开材料显示旧做法是每种制式各装一套工具：GQRX、SDR#、rtl_433、dump1090 分别配置，跨平台驱动适配成本高，解码结果分散在不同窗口难以对照。
  pain_en: Public material shows the old path requires one tool per standard — GQRX, SDR#, rtl_433, dump1090
    configured separately — with costly cross-platform driver setup and decoded results scattered across
    windows.
  current_alternative: GQRX、SDR#、rtl_433、dump1090 等单一用途工具，或自行拼装脚本与驱动。
  current_alternative_en: Single-purpose tools such as GQRX, SDR#, rtl_433 or dump1090, or self-assembled
    scripts and drivers.
  usage_reason: 推断：相较逐个安装单一制式工具，OnAir 用一个跨平台界面覆盖多制式接收与解码并内置频谱分析，用户省去为每种信号单独配驱动和切换窗口的步骤，因此需要同时监听多个频段的爱好者或工程人员会先试它。
  usage_reason_en: 'Inference: versus installing one single-standard tool at a time, OnAir covers multi-standard
    reception and decoding plus a spectrum analyser in one cross-platform interface, removing per-signal
    driver setup and window switching, so hobbyists or engineers monitoring several bands at once would
    try it first.'
