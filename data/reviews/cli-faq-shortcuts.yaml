    shell aliases or prompt snippet files to reuse instructions.
  usage_reason: 推断：它直接从本机历史记录里统计高频提问并生成短命令，省掉了开发者自己发现重复模式并手工编写别名的那一步，因此经常在同一项目里重复同类提问的开发者会愿意试用；公开材料未显示留存或付费证据。
  usage_reason_en: 'Inference: it counts frequent asks directly from local history and generates short
    commands, removing the step where developers must spot the repeated pattern and hand-write an alias,
    so developers who repeat similar asks within one project may try it; public material shows no retention
    or payment evidence.'
