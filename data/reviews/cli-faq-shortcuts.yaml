  market: ''
  job: 使用 Claude Code、Codex 或 Cursor 的开发者，在终端里反复输入同一类提问（如代码审查、重构、解释报错）时，需要把本机历史里高频出现的提问固化成可复用的短命令，以便下次直接调用而不是重新敲一遍。
  job_en: Developers using Claude Code, Codex or Cursor who repeatedly type the same class of prompts
    in the terminal need to turn high-frequency asks from their local history into reusable short commands,
    so they can invoke them next time instead of retyping.
  pain: 公开说明显示痛点是重复输入：同一类提问被反复敲进编码助手，每次都要重述上下文与要求，属于高频、低价值的手工重复；不解决的后果是时间被消耗且提问写法不一致。这是从产品说明与工作流结构推出的判断，尚无用户抱怨或案例直接佐证。
  pain_en: 'The public description points to repeated typing: the same class of asks is retyped into the
    coding assistant, restating context and requirements each time. It is high-frequency, low-value manual
    repetition; leaving it unsolved costs time and produces inconsistent prompts. This is inferred from
    the product description and workflow structure, not from user complaints or cases.'
  current_alternative: 旧做法是每次在终端里重新手打完整提问，或自己手动维护一份提示词片段/别名文件；公开材料未说明用户是否已在用其他提示词管理工具。
  current_alternative_en: The old way is retyping the full ask in the terminal each time, or hand-maintaining
    a snippet/alias file; public materials do not show whether users already use other prompt-management
    tools.
  usage_reason: 推断：相较每次手打，它读取本机 Claude Code 与 Codex 历史、自动归纳高频提问并生成短命令，省掉“回忆并重敲原提问”这一步，且命令来自用户自己的真实历史而非通用模板；因此经常重复同类提问的终端用户会在想减少重复输入时选择它。是否长期留在工作流尚无留存证据。
  usage_reason_en: 'Inference: versus retyping each time, it reads local Claude Code and Codex history,
    mines frequent asks and generates short commands, removing the step of recalling and retyping the
    original ask, and the commands come from the user''s own history rather than generic templates. Terminal
    users who repeat the same class of asks would choose it when they want to cut that repetition. No
    retention evidence shows it stays in the workflow.'
