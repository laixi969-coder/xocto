  market: ''
  job: 交易律师或企业法务在收到对方发来的合同草案后，需要逐条找出偏离本方立场的条款，决定哪些必须修改、哪些可以接受。
  job_en: A deal lawyer or in-house counsel receives a counterparty's draft contract and must find clauses
    that deviate from their side's position, deciding what must be changed and what is acceptable.
  pain: 合同审阅依赖资深律师逐份通读，条款清单靠记忆和既往模板比对，耗时且容易漏掉隐藏在长文本里的风险点；初级律师缺少判断依据。
  pain_en: Contract review depends on senior lawyers reading every draft, comparing clauses from memory
    and past templates; it is slow and risks missing risks buried in long text, while junior lawyers lack
    a basis for judgment.
  current_alternative: 目前主要靠资深律师人工通读、内部条款清单和既往交易模板比对，辅以通用大模型做摘要，但摘要不针对本方立场，也不产出可谈判的修改意见。
  current_alternative_en: Today this is mostly manual reading by senior lawyers, internal clause checklists
    and past deal templates, plus general LLM summarization that is not tuned to the client's position
    and does not produce negotiable redlines.
  usage_reason: 推断：相较人工通读加通用摘要，它把审阅动作前移到条款级标注，律师不必先读完再判断，而是从被标出的问题条款开始复核，减少通读整份协议的负担；有大量标准化交易文本的律所法务团队更可能选择它。
  usage_reason_en: 'Inference: versus manual reading plus generic summarization, it moves the work to
    clause-level flagging, so lawyers start from flagged clauses rather than reading everything first,
    cutting the burden of full-document review; firms and legal teams with high volumes of standardized
    deal text are the likeliest adopters.'
