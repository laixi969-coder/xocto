  job_en: Taiwanese maritime patrol personnel who spot an unidentified intruding vessel near shore need
    an unmanned boat to keep tracking and shadowing the target while keeping people out of risky waters.
  pain: 人工遥控无人艇跟踪移动目标需要持续注意力与稳定通信，一旦信号中断或操作员疲劳，跟踪就会丢失；派人随船则把人员置于风险中。
  pain_en: Manually remote-controlling a boat to track a moving target demands sustained attention and
    a stable link; a dropped signal or tired operator loses the track, and putting people aboard exposes
    them to risk.
  current_alternative: 旧做法是操作员用遥控台全程手动驾驶无人艇，或直接派有人船只跟随目标；公开材料未说明此前是否已有其他自主跟踪方案。
  current_alternative_en: The prior practice is an operator manually driving the boat from a remote console,
    or sending a crewed vessel to follow the target; public material does not say whether another autonomous
    tracking option existed before.
  usage_reason: 推断：若软件确实能让无人艇在通信受限时自行保持对目标的跟踪，操作员就从“全程手动驾驶”变为“设定目标后监控”，减少持续操控这一步负担；但公开报道未给出操作流程、失败率或客户反馈，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if the software really lets the boat hold a track autonomously under limited
    communications, the operator shifts from continuous manual driving to setting a target and monitoring,
