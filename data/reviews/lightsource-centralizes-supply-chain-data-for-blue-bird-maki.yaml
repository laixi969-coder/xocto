  market: ''
  job: 商用车制造商的采购与寻源人员，在评估零部件供应商与报价时，处理分散在多套系统和表格里的供应链数据，要完成一次可比较、可追溯的采购决策。
  job_en: Sourcing and procurement staff at a commercial vehicle manufacturer, evaluating component suppliers
    and quotes, work with supply chain data scattered across systems and spreadsheets to reach a comparable,
    traceable sourcing decision.
  pain: 数据分散导致每次决策都要人工汇总与核对，决策周期被拉长；公开报道称该客户此前决策慢约 2 天。
  pain_en: Scattered data forces manual aggregation and cross-checking before every decision, lengthening
    the cycle; the report says this customer's decisions were about 2 days slower.
  current_alternative: 用电子表格、邮件和多个供应商门户人工拼接数据，再开会拍板。
  current_alternative_en: Manually stitching data from spreadsheets, email and multiple supplier portals,
    then deciding in a meeting.
  usage_reason: 推断：相较人工拼接表格，集中化的数据层把交期、报价与供应商信息放在同一处比较，减少的是“先汇总再判断”这一步，因此采购周期长、供应商数量多的制造商采购团队会在评估阶段选择它；该客户案例支持提速结果，但未披露是否长期留用。
  usage_reason_en: 'Inference: versus manually stitching spreadsheets, a consolidated data layer puts
    lead times, quotes and supplier information side by side, removing the ''aggregate first, then judge''
    step, so procurement teams at manufacturers with long cycles and many suppliers would choose it during
    evaluation; the customer case supports the speed result but does not show long-term retention.'
