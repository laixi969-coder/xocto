  market: ''
  job: 写作者在起草邮件或消息时，边打字边获得模型给出的回复草稿，用于决定是否发送。
  job_en: A writer drafting an email or message receives model-generated reply drafts while typing, to
    decide whether to send.
  pain: 公开材料未说明具体痛点，只能推断起草与回复之间的来回切换可能造成中断。
  pain_en: Public material states no specific pain; at most it can be inferred that switching between
    drafting and replying may cause interruption.
  current_alternative: 现有做法是写完后再让模型改写，或直接使用通用对话助手生成回复。
  current_alternative_en: The current practice is to have a model rewrite after writing, or to use a general
    chat assistant to generate a reply.
  usage_reason: 推断：相较写完再改，它在打字过程中同步给出草稿，可能减少一次复制粘贴与切换；但公开材料没有用户反馈或采用证据，无法确认这一动作是否真的被需要。
  usage_reason_en: 'Inference: compared with rewriting after writing, it offers a draft during typing,
    potentially removing one copy-paste and context switch; but there is no user feedback or adoption
    evidence, so whether this action is actually needed cannot be confirmed.'
