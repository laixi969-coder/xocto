  market: ''
  job: 求职者、创业者或商务人员在自己缺少直接人脉时，处理自己的关系网络信息，要找到能引荐到目标公司或合作方的中间人。
  job_en: Job seekers, founders or business developers who lack direct contacts handle information about
    their own network to find an intermediary who can introduce them to a target company or partner.
  pain: 想接触某个人时，往往不知道谁认识谁，只能靠逐个私聊打听，引荐链条不透明，成功率低且耗时。
  pain_en: When trying to reach someone, people often do not know who knows whom, so they ask around one
    by one; the referral chain is opaque, slow and low-yield.
  current_alternative: 在社交平台手动搜索二度人脉、请朋友帮忙转介绍、参加线下活动或付费给猎头与中介。
  current_alternative_en: Manually searching second-degree connections on social platforms, asking friends
    to forward an introduction, attending offline events, or paying recruiters and brokers.
  usage_reason: 推断：如果它能把间接关系直接算成一条可执行的引荐路径，用户就不必逐个私聊打听，在需要内推或对接合作方时会选择它；但公开材料只有一句口号，无法确认它是否真的产出可用的引荐路径，需求强度未明。
  usage_reason_en: 'Inference: if it can turn indirect connections into an actionable introduction path,
    users would not have to ask around one by one and would choose it when they need a referral or a partner
    introduction; however, public material offers only a tagline, so whether it actually produces a usable
    path cannot be confirmed and demand strength is unclear.'
