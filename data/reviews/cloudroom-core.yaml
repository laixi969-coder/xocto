  market: ''
  job: 平台工程师或研发团队负责人需要让多个编码代理在受控的云端环境里跑，而不是散落在各人的笔记本上，以便统一管理运行环境和访问权限。
  job_en: A platform engineer or engineering lead needs several coding agents to run in a controlled cloud
    environment instead of scattered across individual laptops, so runtimes and access permissions can
    be managed centrally.
  pain: 代理跑在个人机器上时，环境不一致、任务无法并行、机器一关任务就断，团队也没法统一审计谁让代理做了什么。
  pain_en: When agents run on personal machines, environments diverge, tasks cannot run in parallel, closing
    the laptop kills the task, and the team cannot audit who had an agent do what.
  current_alternative: 旧做法是各自在本机跑代理，或者用通用容器与 CI 自己拼一套运行环境。
  current_alternative_en: The old behaviour is running agents locally on each machine, or hand-rolling
    a runtime with generic containers and CI.
  usage_reason: 推断：自托管运行时省掉的是团队自己拼容器、权限和会话持久化这一步，因此有合规要求、又已经在用多个编码代理的研发团队会选择它；仓库有 252 星和 38 个 fork，说明有开发者关注，但没有部署量或留存证据。
  usage_reason_en: 'Inference: a self-hosted runtime removes the step of hand-assembling containers, permissions
    and session persistence, so engineering teams with compliance constraints that already use several
    coding agents would choose it; the repository shows 252 stars and 38 forks, indicating developer attention,
    but there is no deployment or retention evidence.'
