  current_alternative_en: Developers typically use editor built-in search, grep, IDE indexing or existing
    code-search tools for the same task.
  usage_reason: 推断：若语义检索能减少手动构造关键词和逐个打开文件的步骤，工程师可能在大型陌生代码库中选用它；但公开材料未提供任何采用、留存或对比证据，无法确认这一因果。
  usage_reason_en: 'Inference: if semantic retrieval cuts the steps of manually crafting keywords and
    opening files one by one, engineers might adopt it in large unfamiliar codebases; however, no adoption,
    retention or comparison evidence is public, so this causal link is unconfirmed.'
