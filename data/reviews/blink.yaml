  job_en: A software engineer taking over an unfamiliar or large codebase, needing to locate where a piece
    of logic is implemented or how it is called, works over source files and the repository to find the
    relevant code snippets.
  pain: 公开材料只说明它由 Jev 驱动做代码库搜索，未说明替代了哪一步旧流程、旧做法耗时多少，也未给出任何用户抱怨或替代行为。
