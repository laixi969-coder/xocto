  market: ''
  job: 同时使用多个 Claude 账号的开发者，在长时间写代码、接近额度上限时，需要查看各账号剩余用量与重置时间，以决定继续用哪个账号或何时暂停。
  job_en: A developer running several Claude accounts needs to check each account's remaining quota and
    reset time while coding for long stretches near the limit, in order to decide which account to keep
    using or when to pause.
  pain: 额度耗尽会在编码中途打断工作，而逐个账号登录网页查看用量既费时又容易漏看，多账号切换还会互相挤掉登录状态。
  pain_en: Running out of quota interrupts coding mid-task, while checking usage account by account in
    the browser is slow and easy to miss, and switching accounts can log each other out.
  current_alternative: 开发者目前靠手动打开各账号的用量页面、凭记忆估算剩余额度，或用多个浏览器配置分别登录来规避冲突。
  current_alternative_en: Developers currently open each account's usage page manually, estimate remaining
    quota from memory, or keep separate browser profiles to avoid login conflicts.
  usage_reason: 相较手动逐个查页面，它把多个账号的剩余额度与重置时间常驻在刘海区域，省掉反复切换标签页和重新登录这一步，因此同时持有多个订阅、长时间连续编码的人会在接近限额时选择它；这是基于产品能力的推断，尚无用户反馈或留存证据。
  usage_reason_en: Compared with checking pages one by one, it keeps several accounts' remaining quota
    and reset times in the notch, removing repeated tab switching and re-login, so people holding multiple
    subscriptions and coding for long sessions would pick it near the limit; this is inference from product
    capability, with no user feedback or retention evidence yet.
