  market: ''
  job: 使用 Codex 或 Claude Code 的开发者，在完成一轮代理编码会话后，把散落的会话记录作为输入，交给 Penelopa 分析，以产出可复用的技能、检查项和提示词，供后续会话直接调用。
  job_en: Developers using Codex or Claude Code who, after a round of agent coding sessions, feed the
    scattered session logs into Penelopa to extract reusable skills, checks, and prompts for later sessions.
  pain: 代理会话中的有效做法（修好的提示、验证步骤、项目约定）随会话结束而丢失，开发者每次都要重新交代同样的上下文，重复踩同样的坑；公开材料只给出产品定位，未量化重复频率与返工代价。
  pain_en: Effective moves in agent sessions (fixed prompts, verification steps, project conventions)
    vanish when the session ends, so developers re-explain the same context and repeat the same mistakes;
    public materials state the positioning but do not quantify repetition frequency or rework cost.
  current_alternative: 开发者目前靠手工维护 CLAUDE.md/AGENTS.md 之类的规则文件、复制粘贴旧提示词、或凭记忆在每次会话重新交代约定；这些做法依赖人工整理，容易遗漏和过期。
  current_alternative_en: Developers today hand-maintain rule files such as CLAUDE.md/AGENTS.md, copy-paste
    old prompts, or rely on memory to restate conventions each session; these depend on manual curation
    and drift out of date.
  usage_reason: 相较手工整理规则文件，Penelopa 直接读取真实会话记录并自动抽取重复模式，省去开发者逐条回顾会话、归纳成规则的那一步；因此频繁使用代理、且已积累大量会话日志的开发者会在希望减少重复交代时选择它。这是基于产品能力与任务结构的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with hand-curating rule files, Penelopa reads real session logs and automatically
    extracts recurring patterns, removing the step of manually reviewing sessions and distilling rules;
    developers who use agents heavily and have accumulated many session logs would choose it when they
    want to cut repeated re-briefing. This is an inference from product capability and task structure,
    not yet backed by user feedback.
