  market: ''
  job: 使用多个编码代理（如 Claude Code、Cursor、Codex 等）的开发者，在切换代理或开启新会话时，需要把项目状态、决策记录和上下文从上一个代理迁移到下一个代理，以继续完成同一项编码任务。
  job_en: Developers using multiple coding agents (e.g., Claude Code, Cursor, Codex) need to carry project
    state, decision history, and context from one agent to the next when switching agents or starting
    a new session, so they can continue the same coding task.
  pain: 每个编码代理有独立的上下文窗口和会话状态，切换代理或重开会话时开发者必须手动重新粘贴项目背景、架构决策和未完成事项，重复劳动且容易丢失关键信息，导致代理产出偏离预期。
  pain_en: Each coding agent has its own context window and session state; when switching agents or restarting
    a session, developers must manually re-paste project background, architectural decisions, and open
    items, which is repetitive and easily loses critical information, causing agent output to drift from
    expectations.
  current_alternative: 开发者目前手动维护 CLAUDE.md、AGENTS.md 等上下文文件，或在会话间复制粘贴摘要，或干脆只用一个代理以避免上下文迁移成本。
  current_alternative_en: Developers currently maintain context files like CLAUDE.md and AGENTS.md manually,
    copy-paste summaries between sessions, or simply stick to one agent to avoid context migration costs.
  usage_reason: 推断：acryl 通过一个持久工作区和一份规范上下文，让不同编码代理读写同一份项目状态，从而省去每次切换代理时手动重建上下文的步骤；经常在多个代理间切换或需要跨会话延续任务的开发者会因此选择它。
  usage_reason_en: 'Inference: acryl uses one persistent workspace and one canonical context so different
    coding agents read and write the same project state, removing the step of manually rebuilding context
    on each agent switch; developers who frequently switch agents or need cross-session task continuity
    would choose it for this reason.'
