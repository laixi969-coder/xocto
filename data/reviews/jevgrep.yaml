  market: ''
  job: 软件工程师或编码智能体使用者在接手不熟悉的代码库、需要定位某个行为由哪些文件实现时，用自然语言描述“这段代码做什么”，让 jg 返回候选文件、阅读线索和带行号的源码片段，再据此决定是否让编码智能体动手修改。
  job_en: A software engineer or coding-agent user, facing an unfamiliar repository, describes what a
    behavior does in natural language so jg returns candidate files, reading leads, and line-numbered
    source excerpts, then decides whether to let the coding agent edit.
  pain: 公开材料指出编码智能体在每个不熟悉任务上都要花一部分时间找对文件；在跨文件夹、跨文件的仓库里，靠关键词或路径猜测容易漏掉真正相关的实现，找错起点会让后续修改和验证都白做。
  pain_en: Public material states coding agents spend part of every unfamiliar task finding the right
    files; in cross-folder repositories, keyword or path guessing misses the real implementation, and
    a wrong starting point wastes the subsequent edit and verification.
  current_alternative: 旧做法是人工用 grep、文件名和目录结构逐个翻找，或让编码智能体自行遍历仓库；公开材料未说明这些替代方式的具体失败率或耗时。
  current_alternative_en: The old approach is manual grep plus filename and directory browsing, or letting
    the coding agent traverse the repository itself; public material does not quantify their failure rate
    or time cost.
  usage_reason: 推断：相较人工 grep 或让智能体盲搜，jg 用 Jev 在文件夹、文件和片段层面判断相关性，一次 stdout 返回候选文件、阅读线索和逐字源码片段，把“先猜路径再逐个打开”这一步压缩成一次描述式查询；公开的十任务
    SWE-bench 对比显示它与基线完成同样 8/10 任务且成本更低，因此在意检索起点准确性和 token 成本的编码智能体使用者会在不熟悉仓库时选择它。
  usage_reason_en: 'Inference: versus manual grep or blind agent traversal, jg uses Jev to judge relevance
    across folders, files, and excerpts, returning candidate files, reading leads, and verbatim source
    in one stdout response, collapsing guess-path-then-open into one descriptive query; the public ten-task
    SWE-bench comparison shows the same 8/10 tasks as baseline at lower cost, so coding-agent users who
    care about retrieval starting point and token cost would choose it on unfamiliar repos.'
