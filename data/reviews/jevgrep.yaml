  market: ''
  job: 软件工程师在接手或维护不熟悉的代码库时，需要先定位与某个行为相关的文件和源码位置，再交给编码智能体修改。
  job_en: A software engineer taking over or maintaining an unfamiliar codebase needs to locate the files
    and source locations tied to a behavior before handing the change to a coding agent.
  pain: 关键词检索只能匹配字面，行为相关的代码常常命名不同，人工翻文件耗时且容易漏掉调用点。
  pain_en: Keyword search only matches literal text, behavior-related code is often named differently,
    and manually reading files is slow and easily misses call sites.
  current_alternative: 用 grep 或 IDE 全局搜索按关键词找文件，再靠人工阅读判断相关性。
  current_alternative_en: Using grep or IDE-wide search by keyword, then reading files manually to judge
    relevance.
  usage_reason: 推断：它把“这段代码做什么”的描述直接映射到文件与行号，省掉先猜关键词再逐个打开文件确认的那一步，因此接手陌生仓库或做跨仓库改动的工程师会尝试它；公开材料未显示留存或付费证据。
  usage_reason_en: 'Inference: it maps a description of what code does directly to files and line numbers,
    removing the step of guessing keywords and opening files one by one, so engineers taking over unfamiliar
    repositories or making cross-repo changes would try it; public material shows no retention or payment
    evidence.'
