  market: ''
  job: 网站运营者或中小企业主在发现官网文案像机器批量生成、访客不转化时，处理自己网站上的页面内容，要得到一份能照着改的改进计划。
  job_en: A website operator or small business owner who finds their site copy reads machine-generated
    and visitors do not convert works from their own site pages to get an improvement plan they can act
    on.
  pain: 自己看不出问题出在哪，改文案靠感觉，改完仍像模板；请外部顾问成本高、周期长。
  pain_en: They cannot see what is wrong, edit copy by feel and still end up with template-like text,
    while hiring an outside consultant is costly and slow.
  current_alternative: 现在多数人靠通用 AI 对话工具给建议，或自己凭经验逐页改文案。
  current_alternative_en: Most people ask a general AI chat tool for advice, or rewrite page copy by experience,
    page by page.
  usage_reason: 推断：相较通用对话工具给出的泛泛建议，它把网站内容作为输入直接产出针对该站的整改计划，省掉自己整理问题清单这一步，因此没有专职内容团队、又急着提升转化的运营者会尝试它。
  usage_reason_en: 'Inference: versus generic advice from a chat tool, it takes the site''s own content
    as input and produces a remediation plan for that site, removing the step of compiling a problem list,
    so operators without a content team who need conversion gains would try it.'
