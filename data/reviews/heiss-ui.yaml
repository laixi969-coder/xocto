    a prompt and wait for the render.
  pain: ComfyUI 的节点图对非工程背景的创作者是操作门槛，改一个参数要在图里找节点，出图前的准备步骤长且容易出错。
  pain_en: ComfyUI's node graph is an operating threshold for creators without an engineering background;
    changing one parameter means hunting for a node in the graph, making pre-render setup long and error-prone.
  current_alternative: 旧做法是直接在 ComfyUI 里连节点、调参数，或改用云端出图服务并放弃自己的本地工作流。
  current_alternative_en: The old approach is wiring nodes and tuning parameters directly in ComfyUI,
    or switching to a cloud image service and giving up one's own local workflow.
  usage_reason: 推断：它把节点图换成填写提示词的前端，用户不必在图里定位节点即可复用已有工作流，因此已有工作流资产、又不想学节点操作的本地创作者会在日常出图时选择它；候选未提供留存或复购证据。
  usage_reason_en: 'Inference: it replaces the node graph with a prompt-entry front end, so users can
    reuse existing workflows without locating nodes in the graph; local creators who already own workflow
    assets but do not want to learn node operation would choose it for daily rendering. The candidate
    provides no retention or repeat-use evidence.'
