  market: ''
  job: 律师、法务或法律研究者需要跟踪上一季度美国最高法院判例，在阅读判决全文时同步核对其中引用的法条与先例，形成可引用的阅读记录。
  job_en: Lawyers, in-house counsel or legal researchers need to track last quarter's US Supreme Court
    cases, checking cited statutes and precedents while reading the full opinion, and produce a citable
    reading record.
  pain: 判例引注密集，阅读时要在判决全文与引注来源之间反复跳转，人工整理引用耗时且容易漏引。
  pain_en: Case opinions are citation-dense, so readers repeatedly jump between the opinion text and cited
    sources, and manually organising citations is slow and easy to miss.
  current_alternative: 现在多靠 Westlaw、LexisNexis 等法律数据库检索，或下载 PDF 后自行标注引注。
  current_alternative_en: Today this is mostly done via legal databases such as Westlaw or LexisNexis,
    or by downloading the PDF and annotating citations by hand.
  usage_reason: 推断：如果它确实把判例与引注放在同一阅读界面并自动建立链接，用户可省去逐条复制检索引注这一步，因此做判例追踪的律师与法务在快速通读季度判例时可能选择它；但公开材料未说明是否由
    AI 完成引注识别，也无用户反馈或留存证据。
  usage_reason_en: 'Inference: if it truly places cases and citations in one reading view and links them
    automatically, users skip the step of copying and searching each citation, so lawyers and counsel
    tracking cases may choose it when skimming a quarter''s opinions; however, the public material does
    not say whether AI performs citation recognition, and there is no user feedback or retention evidence.'
