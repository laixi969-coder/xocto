  market: ''
  job: Mac 上的开发者在启动本地服务报端口占用时，需要查清是哪个进程占着端口，并决定杀掉还是换端口。
  job_en: A developer on a Mac whose local service fails to start needs to find which process holds the
    port and decide whether to kill it or switch ports.
  pain: 命令行排查端口要记 lsof、grep、kill 等命令组合，输出难读，切换窗口打断编码节奏。
  pain_en: Command-line port diagnosis requires remembering lsof, grep and kill combinations, the output
    is hard to read, and context switching breaks coding flow.
  current_alternative: 手动敲 lsof -i、netstat 或 Activity Monitor 逐个翻找，再手动 kill 进程。
  current_alternative_en: Manually running lsof -i or netstat, or hunting through Activity Monitor, then
    killing the process by hand.
  usage_reason: 推断：相较手敲命令，它把端口占用查询与进程解释合成一步，直接给出冲突原因和可执行动作，减少记忆命令与解读输出这两步负担，因此常做本地起服务的 Mac 开发者会在报错当下选择它。
  usage_reason_en: 'Inference: versus typing commands, it merges the port lookup and process explanation
    into one step and returns the cause plus an executable action, removing the burden of recalling commands
    and parsing output, so Mac developers who frequently start local services would reach for it at the
    moment of failure.'
