  market: ''
  job: 软件工程师或技术文档维护者在仓库中接收 AI 生成的 Markdown 文档时，需要按统一约定整理并检查格式，使人和智能体都能稳定读取同一份项目文档。
  job_en: A software engineer or docs maintainer receiving AI-generated Markdown in a repository needs
    to normalize and lint it against a shared convention so humans and agents can read the same project
    docs reliably.
  pain: 公开材料只有一句产品定位，没有任何用户反馈、issue 或案例说明 AI 生成文档在格式、结构或可读性上造成了什么具体麻烦，也没有说明不解决会带来什么后果。
  pain_en: Public material offers only a one-line positioning statement; no user feedback, issue, or case
    shows what concrete trouble AI-generated docs cause in formatting, structure, or readability, nor
    the consequence of leaving it unsolved.
  current_alternative: 公开材料未说明用户现在如何完成这项工作，也未说明它替代了哪种既有做法（如手写规范、通用 Markdown linter 或人工评审）。
  current_alternative_en: Public material does not show how users do this today, nor which existing practice
    it replaces (hand-written style guides, generic Markdown linters, or manual review).
  usage_reason: 推断：若约定与 linter 能自动拦截 AI 生成文档的格式偏差，可省去人工逐篇校对这一步；但缺少任何用户反馈或案例，无法确认哪类用户会在什么情况下选择它。
  usage_reason_en: 'Inference: if the convention and linter automatically catch formatting drift in AI-generated
    docs, they could remove a manual per-file proofreading step; but with no user feedback or case, it
    is unverifiable which users would choose it and when.'
