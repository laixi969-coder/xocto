  market: ''
  job: 开发者在维护项目仓库文档时，处理由 AI 生成、需要人和智能体共同阅读的 Markdown 材料，要完成格式统一与可读性检查。
  job_en: While maintaining repository documentation, developers handle AI-generated Markdown meant for
    both humans and agents, aiming to unify format and check readability.
  pain: AI 生成的文档格式与结构不统一，人和工具读取时容易出错，需要人工返工整理。
  pain_en: AI-generated docs vary in format and structure, causing errors for human and tool readers and
    requiring manual rework.
  current_alternative: 此前多依赖人工约定、代码评审时的口头规范或通用 Markdown 检查工具，缺少针对 AI 生成文档的约定。
  current_alternative_en: Previously this relied on manual conventions, verbal rules during code review,
    or generic Markdown linters, without a convention aimed at AI-generated docs.
  usage_reason: 推断：若检查能在提交前自动指出不符合约定的文档结构，可省去评审阶段的人工格式返工，因此维护 AI 生成文档的团队可能采用；但尚无用户反馈或采用数据支持这一判断。
  usage_reason_en: 'Inference: if the check flags non-conforming doc structure before commit, it can remove
    manual format rework at review, so teams maintaining AI-generated docs may adopt it; no user feedback
    or adoption data yet supports this.'
