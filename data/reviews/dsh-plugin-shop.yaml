  market: ''
  job: DeepSeek Harness 的使用者在需要为 harness 增加新能力（如工具接入、工作流扩展）时，面对散落在互联网各处的插件来源，要在一个每日更新、发布前经过审核的目录里找到并安装可用插件，而不必自己逐个仓库搜索和甄别。
  job_en: DeepSeek Harness users who need to extend the harness with new capabilities (tool integrations,
    workflow extensions) must find and install usable plugins from a daily-refreshed, pre-publish-reviewed
