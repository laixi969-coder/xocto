  market: ''
  job: 家庭调酒的人在打开自家酒柜、想决定今晚调哪杯时，需要把手头已有的酒和配料变成一份可执行的配方清单。
  job_en: A home drinker opening their own bar and deciding what to mix tonight needs to turn the bottles
    and mixers they already own into an executable recipe list.
  pain: 配方通常按“先买齐材料”写，家里缺一两样就做不成；靠记忆或搜索逐个比对既慢又容易放弃。
  pain_en: Recipes are usually written assuming you buy everything first; missing one or two items kills
    the drink, and comparing by memory or search is slow and easy to abandon.
  current_alternative: 搜索引擎、鸡尾酒 App 的固定配方库、小红书/YouTube 教程，或干脆随便兑一杯。
  current_alternative_en: Search engines, fixed recipe libraries in cocktail apps, social video tutorials,
    or just pouring something random.
  usage_reason: 推断：如果它真能按已有库存反向筛选并给出可执行配方，用户省掉的是“逐个配方核对缺哪样”这一步，因此家里酒多但不成套的人会先试它；但公开材料只有一句描述，没有留存或复购证据，无法确认它是否被长期留在流程里。
  usage_reason_en: 'Inference: if it truly filters recipes backwards from existing stock and returns executable
    steps, it removes the step of checking each recipe for missing items, so people with many but mismatched
    bottles would try it first; however the public material is a single line with no retention or repeat-use
    evidence, so long-term workflow placement cannot be confirmed.'
