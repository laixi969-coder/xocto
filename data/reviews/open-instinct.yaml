  market: ''
  job: 个人用户在手机上用 iMessage 给一个跑在自己计算机上的个人代理发消息，让它代为执行跨应用事务，并在需要时调用其他代理协作完成同一件事。
  job_en: An individual user texts a personal agent on iMessage; the agent runs on its own computer, executes
    cross-app errands, and coordinates with other agents when a task needs them.
