  pain_en: 'Public material only states the agent has its own computer and an agent network; no user complaints,
    prior-process cost, or failure consequences are given. Pain intensity is a workflow inference: issuing
    from mobile, executing on desktop, and chaining across apps otherwise forces the user to switch between
    devices and apps.'
  current_alternative: 公开材料未描述旧做法；按结构推断，用户此前是自己手动在多个 App 间操作，或使用单一聊天式助手但无法在自有计算机上持续执行并调用其他代理。
  current_alternative_en: The material does not describe prior practice; structurally, users previously
    did the work manually across apps, or used a single chat assistant that could not persistently execute
    on their own computer and call other agents.
  usage_reason: 推断：相较手动跨应用操作，它把入口收敛到用户已在用的 iMessage，并把执行放到一台常驻计算机上，省去用户自己切换设备、逐个 App 操作这一步；因此习惯用 iMessage
