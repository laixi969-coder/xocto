  usage_reason_en: 'Inference: versus manual cross-app work, it collapses the entry point into iMessage,
    which the user already uses, and moves execution onto a persistent computer, removing the step of
    switching devices and operating each app by hand. Users who live in iMessage and need cross-app errands
    would therefore pick it for such tasks. No user feedback or retention evidence is public, so the motive
    is inferred.'
