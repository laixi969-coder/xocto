  job_en: Security researchers or AI agent developers validating their agent's web exploitation ability
    need to run it against a set of reproducible vulnerable environments and get comparable solve results.
  pain: 过去评测 agent 攻防能力要么用零散自建靶机，要么靠人工复现漏洞，环境搭建和判分都要手工做，结果难以横向比较。
  pain_en: Evaluating an agent's offensive capability previously meant scattered self-built targets or
    manual vulnerability reproduction, with setup and scoring done by hand and results hard to compare.
  current_alternative: 自建 Docker 靶机、公开 CTF 题目、或人工复现漏洞后手工判分。
  current_alternative_en: Self-built Docker targets, public CTF challenges, or manually reproducing vulnerabilities
    and scoring by hand.
  usage_reason: 相较自建靶机，它把 30 个取材自真实漏洞赏金的场景连同标准 flag 和参考解题脚本一起打包，省掉搭环境和写判分脚本这两步，因此需要横向比较多个 agent 的安全团队会先试它；这是基于产品能力的推断。
  usage_reason_en: Compared with self-built targets, it packages 30 scenarios drawn from real bug bounty
    findings together with canonical flags and reference solvers, removing the steps of building environments
    and writing scoring scripts, so security teams comparing several agents would try it first; this is
    inference from product capability.
