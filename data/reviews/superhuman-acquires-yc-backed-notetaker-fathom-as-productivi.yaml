  market: ''
  job: 销售、咨询顾问或项目经理在开完客户会议后，要处理录音和零散笔记，整理成可发给客户或团队的纪要与待办清单。
  job_en: After a client meeting, a salesperson, consultant or project manager handles recordings and
    scattered notes to produce minutes and a to-do list that can be sent to the client or team.
  pain: 边开会边记会漏掉细节，会后重听录音整理纪要耗时且容易漏掉承诺事项，跟进不及时会直接影响成交与交付。
  pain_en: Note-taking during the call misses details, and replaying recordings afterwards is slow and
    easily drops commitments, so follow-up delays directly hurt deals and delivery.
  current_alternative: 人工记笔记加会后重听录音，或使用其他转写工具再手工粘贴进文档和 CRM。
  current_alternative_en: Manual notes plus replaying recordings afterwards, or another transcription
    tool with manual pasting into documents and the CRM.
  usage_reason: 相较人工重听录音，它自动产出转写、摘要和行动项，省掉逐段回听与从零起草纪要这一步；推断经常开客户会议、又需要把结论同步给团队或客户的销售与顾问会选它，但纪要准确性仍需人工确认。
  usage_reason_en: Compared with replaying recordings, it automatically produces transcription, summary
    and action items, removing the step of listening back and drafting minutes from scratch; by inference,
    salespeople and consultants who hold frequent client calls and must share conclusions will choose
    it, though accuracy still needs human checking.
