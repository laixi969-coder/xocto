  market: ''
  job: 律所律师与公司法务在尽调、合同审阅或判例检索时，处理合同、案卷与法规材料，要产出可复核的备忘录、条款比对结论或检索摘要。
  job_en: Lawyers at firms and in-house counsel handle contracts, case files and regulatory material during
    diligence, contract review or case-law research, and must produce reviewable memos, clause comparisons
    or research summaries.
  pain: 这类材料量大、术语密集，人工逐条比对耗时且容易漏项，初级律师大量时间花在重复检索与摘录上。
  pain_en: Such material is voluminous and terminology-heavy; manual clause-by-clause comparison is slow
    and error-prone, and junior lawyers spend much of their time on repetitive search and extraction.
  current_alternative: 旧做法是初级律师与 paralegal 手工检索数据库、逐条比对合同并撰写备忘录，或外包给外部律师。
  current_alternative_en: The old approach is junior lawyers and paralegals manually searching databases,
    comparing contracts clause by clause and drafting memos, or outsourcing to outside counsel.
  usage_reason: 相较手工检索与逐条比对，Harvey 直接接收合同与案卷材料并输出条款比对与初稿，减少的是初级律师从零检索和摘录这一步；推断在文档量大、时限紧的尽调与合同审阅场景中，律所会选择它来压缩初稿时间，但公开材料未给出留存或复购证据。
  usage_reason_en: Compared with manual search and clause-by-clause comparison, Harvey takes in contracts
    and case files and outputs clause comparisons and drafts, removing the junior lawyer's from-scratch
