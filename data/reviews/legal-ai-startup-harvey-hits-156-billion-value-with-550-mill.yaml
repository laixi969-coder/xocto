  market: ''
  job: 律所律师与公司法务在合同审阅、尽职调查或法律意见起草时，处理成批合同、判例与内部文件，需要定位关键条款、比对先例并产出可复核的初稿。
  job_en: Lawyers and in-house counsel handling contract review, due diligence, or opinion drafting work
    through batches of contracts, precedents, and internal documents, needing to locate key clauses, compare
    precedents, and produce a reviewable first draft.
  pain: 这类材料量大、术语密集，人工逐份阅读耗时且容易漏掉条款差异；按小时计费的模式也让客户对基础审阅的成本敏感。
  pain_en: Such materials are voluminous and term-dense; reading them one by one is slow and prone to
    missed clause differences, and the hourly billing model makes clients cost-sensitive about basic review.
  current_alternative: 初级律师或法务助理人工逐份阅读并做摘要，配合关键词检索和模板库；部分团队用通用大模型做初步问答，但缺少法律语料与可追溯引用。
  current_alternative_en: Junior lawyers or legal assistants read and summarize each document by hand,
    aided by keyword search and template libraries; some teams use general-purpose LLMs for preliminary
    Q&A, but without legal corpora or traceable citations.
  usage_reason: 相较人工逐份阅读，它把条款抽取、先例比对和初稿生成合并成一次动作，减少的是基础审阅这一步的翻页与摘录负担，律师只需复核输出；因此处理大批量合同或尽调材料的团队会在时间压力下选择它。这是基于产品能力与任务结构的推断，公开材料未提供客户留存或复购证据。
  usage_reason_en: Compared with reading each document by hand, it merges clause extraction, precedent
    comparison, and draft generation into one action, cutting the page-turning and note-taking burden
    of first-pass review so lawyers only review the output; teams facing large contract or diligence volumes
    would therefore choose it under time pressure. This is an inference from product capability and task
    structure, not evidence of retention or repeat purchase.
