  market: ''
  job: 社区运营者或版主，在用户发帖量增长、举报堆积时，需要判断哪些内容违规并执行删除、限流或封禁，维持社区秩序。
  job_en: A community operator or moderator facing growing posts and a backlog of reports needs to judge
    which content violates rules and carry out removals, throttling or bans to keep order.
  pain: 人工审核成本高、响应慢，规则引擎又容易误伤，争议处理缺乏一致标准，运营者常在速度和公平之间两难。
  pain_en: Human moderation is costly and slow, rule engines misfire, and dispute handling lacks consistent
    standards, leaving operators torn between speed and fairness.
  current_alternative: 雇佣兼职审核员、使用关键词与规则过滤，或依赖平台自带举报机制和用户自治。
  current_alternative_en: Hiring part-time moderators, using keyword and rule filters, or relying on platform
    reporting tools and user self-governance.
  usage_reason: 推断：若 AI 能持续处理举报并给出可追溯的判定，运营者可省去逐条人工初筛这一步，只在申诉时介入；但公开材料未说明判定标准与申诉机制，无法确认它比人工审核少做了哪一步。
  usage_reason_en: 'Inference: if the AI continuously handles reports and produces traceable decisions,
    operators skip line-by-line manual triage and step in only on appeals; public material does not describe
    decision standards or appeal mechanisms, so it is unclear which step it removes versus human moderation.'
