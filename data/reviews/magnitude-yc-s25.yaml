  market: ''
  job: 构建 agent 的开发者，在 agent 上线后推理成本或时延超出预期时，处理线上调用日志与推理配置，要把每次调用的模型、参数和路由调到可接受的成本与时延区间。
  job_en: Developers building agents, when inference cost or latency exceeds expectations after launch,
    work with production call logs and inference configuration to tune each call's model, parameters,
    and routing into an acceptable cost and latency range.
  pain: agent 调用链长、重试多，人工逐项调参和改路由既慢又难复现，成本波动无法提前预判。
  pain_en: Agent call chains are long with many retries; manually tuning parameters and rewriting routing
    is slow and hard to reproduce, and cost swings cannot be anticipated.
  current_alternative: 开发者自己写脚本统计 token 用量、手动改模型与参数、用通用网关做重试和路由。
  current_alternative_en: Developers write their own scripts to tally token usage, manually switch models
    and parameters, and use general-purpose gateways for retries and routing.
  usage_reason: 推断：若引擎能自动读取调用特征并调整推理配置，可省去人工逐项调参这一步，让开发者在成本或时延超预算时少做一次手工排查；但公开材料未给出优化幅度、接入成本或任何使用反馈，因此无法确认用户会因此选择它。
  usage_reason_en: 'Inference: if the engine can read call characteristics and adjust inference configuration
    automatically, it removes the manual parameter-tuning step, sparing developers one round of manual
    investigation when cost or latency exceeds budget; however, public materials give no optimization
    magnitude, integration cost, or user feedback, so it cannot be confirmed that users would choose it
    for this reason.'
