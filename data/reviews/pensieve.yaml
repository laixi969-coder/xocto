  market: ''
  job: 开发者在接手旧项目或排查问题时，处理本地文件、git 仓库和 AI 代理会话记录，要完成一次能定位到人和来源的检索。
  job_en: Developers taking over old projects or debugging handle local files, git repositories and AI
    agent session logs to complete a search that locates both the person and the source.
  pain: 上下文散在文件、仓库和代理会话三处，代理会话通常不被索引，找一段改动来源要来回切换工具；候选材料未给出用户抱怨或替代行为的直接证据。
  pain_en: Context is scattered across files, repositories and agent sessions, agent sessions are usually
    not indexed, and tracing a change means switching tools back and forth; the candidate material gives
    no direct evidence of user complaints or workarounds.
  current_alternative: 用 grep、IDE 全局搜索和 git log 分别查，代理会话记录靠翻聊天历史或干脆不保存。
  current_alternative_en: Searching separately with grep, IDE global search and git log, while agent session
    logs are recovered by scrolling chat history or not kept at all.
  usage_reason: 推断：相比在多个工具间分别检索，它把文件、仓库与代理会话放进同一本地索引，省掉切换与手动拼接来源这一步，因此接手旧项目或需要追溯代理产出的开发者可能选择；材料未显示实际采用或留存。
  usage_reason_en: 'Inference: compared with searching across separate tools, it puts files, repositories
    and agent sessions into one local index, removing the switching and manual stitching of sources, so
    developers taking over projects or tracing agent output may choose it; the material shows no actual
    adoption or retention.'
