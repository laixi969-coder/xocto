  market: ''
  job: 手机用户在接到陌生推销或诈骗电话时，让自动应答机器人接听并拖住对方，自己不必花时间应付。
  job_en: When a phone user gets an unsolicited sales or scam call, an automated answering bot takes the
    call and stalls the caller so the user does not spend time on it.
  pain: 骚扰和诈骗电话打断工作与休息，人工挂断后仍会被反复拨打，处理这些通话是纯负担。
  pain_en: Nuisance and scam calls interrupt work and rest, and manually hanging up does not stop repeat
    calls, so handling them is pure overhead.
  current_alternative: 用户通常手动挂断、拉黑号码，或依赖运营商和手机系统的骚扰拦截。
  current_alternative_en: Users typically hang up manually, block numbers, or rely on carrier and phone-system
    spam filters.
  usage_reason: 推断：相较手动挂断，机器人直接接听并用对话拖住来电者，省去用户亲自应对这一步；但接入方式与合规边界未公开，选择动机尚缺用户反馈支持。
  usage_reason_en: 'Inference: compared with hanging up manually, the bot answers and keeps the caller
    talking, removing the step of the user responding personally; integration and compliance boundaries
    are undisclosed, and user feedback on why people choose it is missing.'
