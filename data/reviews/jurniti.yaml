  market: ''
  job: 需要让 AI agent 连续数小时执行任务的开发者或运维人员，在本地或服务器上跑批处理、巡检类任务时，要保证任务持续运行且不污染主环境。
  job_en: Developers or operators who need an AI agent to run tasks for hours, executing batch or inspection
    jobs locally or on a server while keeping the host environment clean.
  pain: 长时间运行的 agent 一旦崩溃或写入错误状态，会污染主环境并难以回滚；公开材料未说明这一痛点是否真实存在或有多严重。
  pain_en: A long-running agent that crashes or writes bad state can pollute the host and is hard to roll
    back; public material does not show whether this pain is real or how severe it is.
  current_alternative: 常见做法是在本地进程、容器或云沙箱里跑 agent，自行处理隔离与重启。
  current_alternative_en: The common approach is running agents in local processes, containers or cloud
    sandboxes, handling isolation and restarts manually.
  usage_reason: 推断：若 Firecracker 微虚拟机确实能提供更轻的隔离与更快的启动，用户可能因为不想让长跑 agent 影响主环境而选择它；但缺少任何使用、留存或付费证据，无法确认这一选择已经发生。
  usage_reason_en: 'Inference: if Firecracker microVMs really offer lighter isolation and faster startup,
    users might pick it to keep long-running agents away from the host; but with no usage, retention or
    payment evidence, this choice cannot be confirmed.'
