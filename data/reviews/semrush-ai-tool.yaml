  market: ''
  job: SEO 分析师或内容营销运营，在做关键词选题和竞品外链盘点时，处理关键词、域名与外链数据，要产出一份可执行的选题或投放建议。
  job_en: SEO analysts or content marketing operators who, when choosing keywords and auditing competitor
    backlinks, work with keyword, domain and backlink data to produce an actionable topic or placement
    recommendation.
  pain: 数据分散在多个后台页面，逐条查询和导出耗时，且难以把结果直接喂给正在使用的 AI 助手或脚本。
