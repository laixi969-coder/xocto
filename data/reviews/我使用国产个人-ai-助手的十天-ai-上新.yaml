  market: ''
  job: 重度使用飞书、钉钉、腾讯文档和邮箱的国内办公用户，在一天工作开始时或任务堆积时，处理散落在多个应用里的待办、消息和文档，要完成的是把未完成事项汇总成可执行的下一步。
  job_en: Domestic office users who live in Feishu, DingTalk, Tencent Docs and email, at the start of
    a workday or when tasks pile up, handle to-dos, messages and documents scattered across apps, and
    need to turn unfinished items into an executable next step.
  pain: 待办和消息分散在多个应用，用户要反复切换窗口手工翻找，容易漏掉未完成事项；海外同类助手又无法操作国内办公软件。
  pain_en: To-dos and messages are scattered across apps, forcing repeated window switching and manual
    searching, and unfinished items get missed; overseas assistants cannot operate Chinese office software.
  current_alternative: 用户目前靠人工在飞书、钉钉、邮箱之间来回切换，用备忘录或日历手工记录待办，或使用各应用自带的提醒功能。
  current_alternative_en: Users currently switch manually among Feishu, DingTalk and email, note to-dos
    by hand in memos or calendars, or rely on each app's built-in reminders.
  usage_reason: 推断：相较人工跨应用翻找，它直接读取已接入的飞书、钉钉、腾讯文档和邮箱内容并记住未完成事项，省去用户逐条搬运和整理的那一步，因此重度依赖国内办公套件的用户会在任务堆积时选择它；但公开材料未给出留存或复购证据。
  usage_reason_en: 'Inference: compared with manually searching across apps, it reads connected Feishu,
    DingTalk, Tencent Docs and email content and remembers unfinished items, removing the step of moving
    and organizing each item by hand, so heavy users of Chinese office suites would pick it when tasks
    pile up; public material shows no retention or repeat-use evidence.'
