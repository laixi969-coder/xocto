  market: ''
  job: 使用 Pi 编码代理（fitchmultz/pi fork）的开发者，在长时间多轮编码会话中处理代码库上下文、历史对话与笔记，需要在不丢失前序决策的前提下继续推进同一开发任务。
  job_en: Developers using the fitchmultz/pi fork of the Pi coding agent, working through long multi-turn
    coding sessions over a codebase, need to keep advancing the same task without losing earlier decisions,
    history, and notes.
  pain: 长会话中上下文窗口被摘要压缩或截断，导致代理遗忘先前约定、重复提问、重做已完成的改动；开发者被迫反复重述需求或手动搬运历史，这是编码代理工作流中反复出现的摩擦。
  pain_en: In long sessions the context window gets summarized or truncated, so the agent forgets earlier
    decisions, re-asks questions, and redoes finished work; developers must restate requirements or manually
    carry history forward, a recurring friction in coding-agent workflows.
  current_alternative: 现有替代是依赖代理自带的摘要式上下文压缩、手动开新会话并粘贴关键历史、或把决策写进仓库文件与外部笔记再人工引用。
  current_alternative_en: Current alternatives are the agent's built-in summary-based context compaction,
    manually starting a new session and pasting key history, or writing decisions into repo files and
    external notes and re-referencing them by hand.
  usage_reason: 推断：相较摘要压缩会丢失细节、手动搬运历史要额外整理，Posthorse 以原生无摘要上下文窗口配合滚动工具、持久笔记与历史恢复，把“重建上下文”这一步从人工整理变成代理内建动作，因此长会话频繁的
