  usage_reason_en: 'Inference: where summary compaction loses detail and manual history-carrying requires
    extra curation, Posthorse uses native no-summary context windows with rollover tools, durable notes,
    and history recovery to turn context rebuilding from manual work into a built-in agent action, so
    Pi-fork users with frequent long sessions would choose it when a session grows and the same task must
    continue across windows.'
