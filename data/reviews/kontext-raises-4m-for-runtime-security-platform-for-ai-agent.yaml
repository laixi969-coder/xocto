  market: ''
  job: 安全工程师在企业把 AI 智能体接入内部系统后，需要处理智能体运行时的调用记录与权限行为，完成监控、拦截与事后追溯。
  job_en: After enterprises connect AI agents to internal systems, security engineers handle runtime call
    logs and permission behaviour of agents to monitor, block and trace back incidents.
  pain: 智能体一旦获得工具调用权限，就可能越权访问数据或执行未预期动作，而部署前的静态检查无法覆盖运行中的行为。
  pain_en: Once an agent gains tool-calling permissions it may access data beyond its scope or take unintended
    actions, and pre-deployment static checks cannot cover runtime behaviour.
  current_alternative: 目前多由企业安全团队用通用日志、API 网关规则和人工审查拼凑监控，缺少专门针对智能体行为的管控手段。
  current_alternative_en: Today enterprise security teams cobble together general logs, API gateway rules
    and manual review, lacking controls aimed specifically at agent behaviour.
  usage_reason: 推断：相比通用日志加人工排查，运行时平台若能在智能体调用发生时直接拦截并留下可追溯记录，可省去事后逐条翻日志定位的一步，因此已上线智能体且受合规约束的安全团队会考虑它；但候选材料未给出任何客户使用或留存证据。
  usage_reason_en: 'Inference: compared with general logs plus manual investigation, a runtime platform
    that blocks calls as they happen and leaves a traceable record could remove the step of digging through
    logs afterwards, so compliance-bound security teams already running agents may consider it; however
    the candidate material provides no customer usage or retention evidence.'
