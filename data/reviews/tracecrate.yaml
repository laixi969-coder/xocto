  market: ''
  job: AI 应用开发者在把自建 agent 交付客户或上线前，导入 Claude Code、Codex 或 OTLP 格式的运行日志，定位某次运行失败或行为变化的原因，并产出可交给他人核对的对比与报告。
  job_en: An AI application developer, before shipping or handing an agent to a client, imports Claude
    Code, Codex or OTLP run logs to find why one run failed or behaved differently, and produces a comparison
    and report others can check.
  pain: 一次 agent 运行会产生大量分散日志，失败原因藏在多步调用之间，人工翻日志难以看出两次运行的差别，排查慢且结论不可复现；本地优先还回应了日志含敏感内容、不愿上传第三方平台这一顾虑。
  pain_en: A single agent run produces large, scattered logs, and the cause of failure is buried across
    many steps; reading them by hand makes run-to-run differences hard to see, slow to find and hard to
    reproduce. Local-first also answers the concern that logs contain sensitive content users do not want
    to upload to a third-party platform.
  current_alternative: 开发者目前多靠终端输出、自写解析脚本或通用日志平台手工比对，缺少针对 agent 轨迹的对比视图。
  current_alternative_en: Developers currently rely on terminal output, self-written parsing scripts or
    general log platforms and compare by hand, with no comparison view built for agent traces.
  usage_reason: 相较手工翻日志或自写脚本，它把多次运行导入同一本地工作台，直接产出对比与可导出报告，省掉写解析脚本和整理证据这一步，且无需后端或 API key 即可在本地完成；这是基于产品能力与任务结构的推断，对需要向客户或团队解释某次
    agent 失败、又不愿上传日志的开发者更有吸引力。
  usage_reason_en: Compared with reading logs by hand or writing scripts, it loads several runs into one
    local workbench and directly produces a comparison and exportable report, removing the step of writing
    parsers and assembling evidence, and it runs locally with no backend or API key. This is an inference
    from product capability and task structure; it appeals most to developers who must explain an agent
    failure to a client or team and do not want to upload logs.
