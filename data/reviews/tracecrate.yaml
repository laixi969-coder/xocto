  market: ''
  job: AI 应用开发者在把 agent 交付给客户或上线前，需要处理 Claude Code、Codex 或 OTLP 格式的运行日志，定位某次运行失败或行为变化的原因。
  job_en: An AI application developer, before shipping or handing an agent to a client, works through
    Claude Code, Codex or OTLP run logs to find why one run failed or behaved differently.
  pain: agent 一次运行会产生大量分散日志，失败原因往往藏在多步调用之间，靠人工翻日志很难看出两次运行的差别，排查耗时且结论不可复现。
  pain_en: A single agent run produces large, scattered logs, and the cause of failure is buried across
    many steps; reading them by hand makes run-to-run differences hard to see, slow to find and hard to
    reproduce.
  current_alternative: 开发者目前多靠终端输出、自建脚本或通用日志平台手工比对，缺少针对 agent 轨迹的对比视图。
  current_alternative_en: Developers currently rely on terminal output, self-written scripts or general
    log platforms and compare by hand, with no comparison view built for agent traces.
  usage_reason: 相较手工翻日志，它把多次运行导入同一本地工作台并直接产出对比与可导出报告，省掉自己写解析脚本和整理证据这一步；推断，对需要向客户或团队解释某次 agent 失败的开发者更有吸引力。
  usage_reason_en: Compared with reading logs by hand, it loads several runs into one local workbench
    and produces a comparison plus an exportable report, removing the step of writing parsers and assembling
    evidence; this is an inference, and it appeals most to developers who must explain an agent failure
    to a client or team.
