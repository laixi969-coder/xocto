    many steps; reading them by hand makes run-to-run differences hard to see, slow to find and hard to
    reproduce. Local-first also answers the concern that logs contain sensitive content users do not want
    to upload to a third-party platform.
  current_alternative: 开发者目前多靠终端输出、自写解析脚本或通用日志平台手工比对，缺少针对 agent 轨迹的对比视图。
