  market: ''
  job: 规则与合规工程师在维护业务规则库、需要为每条自动判定留下可审计理由时，把已有规则和判定请求交给它，产出带解释的决策结果。
  job_en: Rules and compliance engineers maintaining a business rule base, who need an auditable reason
    for every automated decision, feed existing rules and decision requests into it to obtain an explained
    decision result.
  pain: 规则引擎的判定结果本身不解释原因，人工补写理由耗时且容易与规则不一致；纯大模型判定又难以对账。
  pain_en: Rule-engine decisions do not explain themselves, so writing the rationale by hand is slow and
    easily drifts from the rules, while pure LLM decisions are hard to audit.
  current_alternative: 现有做法是规则引擎输出结果后由人工撰写说明，或直接用大模型生成判定并人工复核。
  current_alternative_en: Today teams either have a rule engine emit the result and write the explanation
    manually, or let an LLM decide and review it by hand.
  usage_reason: 推断：相较人工补写说明，它把解释生成绑定到同一条规则判定上，减少单独撰写理由这一步，并让理由与规则可对照；需要留痕的合规判定场景会因此选择它。目前缺少客户案例与重复使用证据。
  usage_reason_en: 'Inference: compared with manually writing explanations, it binds explanation generation
    to the same rule decision, removing a separate writing step and keeping the rationale traceable to
    the rule; teams needing auditable compliance decisions would choose it for that reason. Customer cases
    and repeat-use evidence are currently absent.'
