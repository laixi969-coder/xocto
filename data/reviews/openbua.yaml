  market: ''
  job: 运营或研究人员在需要跨多个已登录网站查资料、填表单时，在已登录的 Chrome 里运行 OpenBUA 扩展，由代理读取网页、执行检索与表单填写并实时回传结果，最终得到整理好的网页数据或已提交的表单。
  job_en: Operations or research staff, working across multiple logged-in sites, run the OpenBUA Chrome
    extension inside their authenticated browser so an agent reads pages, performs searches and fills
    forms, streaming results back as organized web data or submitted forms.
  pain: 跨站资料收集与重复表单填写需要人工逐页打开、复制粘贴、重复登录并手工录入，步骤琐碎且易错；公开材料只给出产品能力，未提供用户抱怨、频率或错误代价的量化证据，因此痛点强度属工作流结构推理。
  pain_en: Cross-site data gathering and repetitive form filling require manually opening pages, copy-pasting,
    re-authenticating and re-typing, which is tedious and error-prone; public materials only state product
    capability, not user complaints, frequency or error cost, so pain intensity is a workflow-structure
    inference.
  current_alternative: 旧做法是人工在浏览器里逐站检索、复制到表格，或使用通用爬虫、RPA 脚本和浏览器自动化工具；这些方案通常需要单独处理登录态、页面改版和验证码，公开材料未说明
    OpenBUA 具体替代了哪一种。
  current_alternative_en: The old approach is manual per-site browsing and copy-paste into spreadsheets,
    or generic scrapers, RPA scripts and browser automation tools, which typically require separate handling
    of login state, page changes and CAPTCHAs; public materials do not say which one OpenBUA replaces.
  usage_reason: 推断：相较手工逐页操作或另建爬虫脚本，OpenBUA 直接在用户已登录的浏览器内运行，省去导出 Cookie、重新配置登录态和单独维护脚本的步骤，因此需要跨站取数或批量填表的运营、研究人员在已有账号环境下更可能选择它；尚无用户反馈或案例证实这一动机。
  usage_reason_en: 'Inference: versus manual page-by-page work or building a separate scraper, OpenBUA
