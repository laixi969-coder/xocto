  next_validation: 收集 Lyra 仓库的 issue 与 discussion，查看用户对批量写入结果、撤销与重复检测的实际反馈。
  market: ''
  job: 拥有多年本地曲库的 NAS 用户在整理收藏时，需要为大量音频文件补齐歌词与标签、统一目录结构并找出重复文件，同时要能核对并撤销每一次改动。
  job_en: NAS owners with years of local music need to fill in lyrics and tags, normalize folder structure
    and find duplicates across many audio files, while being able to review and undo every change.
  pain: 曲库积累多年后标签和歌词状态混乱，手工逐首补写耗时；用现成工具一键写入又无法知道改了什么，出错难以回退。
  pain_en: After years of accumulation, tags and lyrics are messy and fixing them track by track is slow,
    while one-click tools leave users unable to see what changed or roll back mistakes.
  current_alternative: MusicBrainz Picard、beets 等标签工具配合手工整理目录，或干脆不整理、忍受混乱的曲库。
  current_alternative_en: Tagging tools such as MusicBrainz Picard or beets combined with manual folder
    cleanup, or simply leaving the library messy.
  usage_reason: 推断：相较一键写入的旧工具，Lyra 把每个字段的本地值、来源值和冲突并列展示，移动与删除先预览、可批量撤销，用户因此不必在写入前手工备份或事后逐项排查，愿意在曲库规模大到无法逐首核对时选择它。
  usage_reason_en: 'Inference: unlike one-click writers, Lyra shows local value, source value and conflicts
    side by side and previews moves and deletions with batch undo, so users need not back up beforehand
    or audit afterwards, and will pick it once the library is too large to check track by track.'
