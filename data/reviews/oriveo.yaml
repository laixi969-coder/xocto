  market: ''
  job: 个人开发者或企业 IT 管理员在需要跨多家模型做对比或内部试用、又受数据外流限制时，处理自己的 API Key 与对话内容，要在一个客户端里完成多模型问答并让记录留在本地。
  job_en: An individual developer or enterprise IT administrator who needs to compare or pilot several
    models while being restricted on data leaving the premises handles their own API keys and conversation
    content, and must run multi-model chat in one client with records kept locally.
  pain: 同时使用多家模型意味着在多个网页或应用间切换、重复登录，且对话内容留在各家账号里，对受合规约束的团队不可接受。
  pain_en: Using several providers means switching between multiple sites or apps and logging in repeatedly,
    while conversation content sits in each vendor account, which is unacceptable for compliance-bound
    teams.
  current_alternative: 现有做法是分别使用各家官方客户端或网页，或自行拼装开源前端；前者无法统一管理密钥与记录，后者需要自己维护。
  current_alternative_en: The current practice is to use each vendor's official client or website separately,
    or to assemble an open-source front end oneself; the former cannot unify key and record management,
    the latter needs self-maintenance.
  usage_reason: 推断：它把“多平台切换 + 账号登录”合并为“一次填入自有密钥、本地留存”，省掉逐家登录与数据外流这一步，因此对数据不能出内网、又要横向比较模型的开发者与 IT 管理员更有吸引力；公开材料未提供留存或复购证据。
  usage_reason_en: 'Inference: it merges ''switching platforms and logging in'' into ''enter your own
    key once and keep data local'', removing repeated logins and data leaving the premises, which appeals
    to developers and IT administrators who cannot let data leave the intranet yet need to compare models;
    public material provides no retention or repeat-use evidence.'
