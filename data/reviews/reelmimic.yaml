    them together by hand, or outsource to an editor who imitates the reference video.
  usage_reason: 推断：它把“看参考片—拆风格—生成—评审”串成一条可重复的流程，用户不必每次从零调提示词和逐段拼接，因此高频按条出片的投放或内容团队会先试用它；但公开材料没有留存或复购证据，尚不能说明它已被长期留在工作流里。
  usage_reason_en: 'Inference: it chains reference-watching, style breakdown, generation and review into
    one repeatable pipeline, so users no longer rebuild prompts and stitch clips from scratch each time;
    teams shipping video by the unit at high frequency are the likely first adopters. Public material
    shows no retention or repeat-use evidence, so it cannot yet be said to be embedded in workflows long
    term.'
