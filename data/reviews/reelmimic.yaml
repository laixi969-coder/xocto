  market: ''
  job: 短视频创作者或营销人员拿到一条喜欢的参考视频后，需要产出风格一致的新视频用于投放或发布。
  job_en: Short-video creators or marketers who, after picking a reference video they like, need to produce
    a new video in a consistent style for publishing or ad delivery.
  pain: 风格复刻靠人反复调提示词和手动剪辑，成片风格容易漂移，返工多、单条成本高。
