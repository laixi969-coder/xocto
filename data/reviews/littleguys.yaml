  market: ''
  job: 开发者同时运行多个编码代理时，需要在一个地方看到每个代理当前在做什么、是否卡住或报错，以便决定下一步操作。
  job_en: A developer running several coding agents at once needs one place to see what each agent is
    doing and whether it is stuck or failing, in order to decide the next action.
  pain: 多个代理分散在不同终端窗口，切换查看成本高，容易漏掉某个代理已经停下或报错。
  pain_en: Agents are scattered across terminal windows, so checking them means constant switching and
    it is easy to miss one that has stopped or errored.
  current_alternative: 在多个终端标签或窗口之间手动切换，或依赖代理自身的输出日志。
  current_alternative_en: Manually switching between terminal tabs or windows, or relying on each agent's
    own output log.
  usage_reason: 推断：菜单栏常驻展示可以省去反复切换窗口这一步，让开发者一眼看到哪个代理需要处理；但公开材料只说明它把代理放进菜单栏，没有说明展示哪些状态、是否支持干预，也没有用户反馈或留存证据，因此为什么会被长期使用仍缺少一环。
  usage_reason_en: 'Inference: a persistent menu-bar view can remove the step of switching windows so
    a developer sees at a glance which agent needs attention; however the public material only says it
    puts agents in the menu bar, not which states it shows or whether it allows intervention, and there
    is no user feedback or retention evidence, so one link in why it would be kept in use is still missing.'
