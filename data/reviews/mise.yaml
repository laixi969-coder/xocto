  market: ''
  job: 在家做饭的人在准备一餐多道菜时，处理菜谱与烹饪步骤，要完成让所有菜同时上桌的排程任务。
  job_en: A home cook preparing a multi-dish meal works from recipes and cooking steps to schedule everything
    so all dishes are ready at the same time.
  pain: 多道菜的火候与出锅时间互相冲突，靠记忆和手写清单容易顾此失彼；但公开材料未说明用户为此付出过什么代价。
  pain_en: Burners and finish times for several dishes conflict, and memory or a handwritten list easily
    slips; the public material does not show what this costs users.
  current_alternative: 纸笔清单、菜谱 App 里的分步说明，或凭经验边做边调整。
  current_alternative_en: A paper list, step-by-step instructions inside a recipe app, or adjusting by
    experience while cooking.
  usage_reason: 推断：如果它能把多道菜的起锅时间自动排成一张时间表，用户就不必自己逐道推算先后顺序，从而减少临场手忙脚乱；但公开材料只有一句产品描述，无法确认它是否真的替代了这一步，因此需求强度未明。
  usage_reason_en: 'Inference: if it automatically turns several dishes into one timetable, users no longer
    have to work out the order themselves, reducing last-minute scrambling. But the public material is
    a single product line and does not confirm it replaces that step, so demand strength is unclear.'
