  market: ''
  job: 开发者或小团队在给 AI 助手接入长期记忆时，需要把历史上下文保存下来，让助手在后续会话里继续使用，并保证自己随时能查看和修改这些内容。
  job_en: A developer or small team wiring long-term memory into an AI assistant needs to persist prior
    context so the assistant can reuse it in later sessions, while keeping the content viewable and editable
    at any time.
  pain: 现有记忆方案多绑定某家托管服务，数据存在对方数据库里，迁移、审阅和人工修正都不方便；但公开材料没有说明这种不便造成了什么具体损失。
  pain_en: Existing memory options are mostly tied to a hosted service, with data sitting in the vendor's
    database, which makes migration, review and manual correction awkward; the public material does not
    say what concrete loss this causes.
  current_alternative: 把上下文写进向量数据库或托管记忆服务，或直接在提示词里粘贴历史内容。
  current_alternative_en: Writing context into a vector database or a hosted memory service, or pasting
    history directly into the prompt.
  usage_reason: 推断：相较托管记忆服务，纯文本文件让使用者能直接打开、编辑和搬走记忆内容，省去导出与格式转换这一步，因此在意数据归属和可审阅性的开发者可能选择它；目前没有用户反馈或采用数据支持这一判断。
  usage_reason_en: 'Inference: compared with a hosted memory service, a plain-text file lets users open,
    edit and move memory content directly, removing an export and format-conversion step, so developers
    who care about data ownership and reviewability may choose it; no user feedback or adoption data currently
    supports this.'
