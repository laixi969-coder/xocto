  market: ''
  job: 研发团队成员在接手或修改既有代码库时，把团队编码约定、构建脚本与框架规则整理成仓库内配置，让 Copilot 按这些规则生成改动。
  job_en: Engineering team members onboarding to or modifying an existing codebase turn team conventions,
    build scripts and framework rules into in-repo configuration so Copilot generates changes that follow
    them.
  pain: 每次新任务都要向助手重复解释同样的规范、脚本和流程，否则生成的改动不符合项目既有模式，需要人工逐处返工。
  pain_en: Every new task requires re-explaining the same standards, scripts and workflows, otherwise
    generated changes break existing project patterns and need manual rework.
  current_alternative: 旧做法是开发者把规范写在文档或口头交接里，每次对话手动粘贴上下文，或干脆自己按惯例手写改动。
  current_alternative_en: The old way is documenting conventions in wikis or verbal handover, pasting
    context manually into each conversation, or simply writing the change by hand.
  usage_reason: 相较每次手动粘贴上下文，把约定与脚本固化进仓库配置后，助手在生成改动时自动带上这些规则，减少的是“重复解释并逐处纠正不符合规范代码”这一步负担；推断接手遗留项目、规范分散的团队会因此选择它。
  usage_reason_en: Compared with pasting context each time, fixing conventions and scripts into repository
    configuration makes the assistant apply them automatically when generating changes, removing the step
    of re-explaining and correcting non-conforming code; this is an inference that teams inheriting legacy
    projects with scattered conventions would choose it.
