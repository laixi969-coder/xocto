  usage_reason_en: 'Inference: versus reading configs by hand, the CLI walks MCP configs in one command
    and emits SARIF that plugs into an existing CI pipeline, removing the manual report-assembly step,
    so security and platform engineers would pick it when onboarding a new MCP server or when CI needs
    a checkable gate; approval still stays human.'
