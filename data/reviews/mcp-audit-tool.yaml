  pain_en: MCP servers enter an agent through config, their tool descriptions and dependencies can change
    after approval (rug pull), and the agent executes those tools with the user's privileges; public materials
    give no incident frequency or loss figures, but approving a malicious or secret-bearing server means
    leaked credentials and a hijacked agent, a risk that must be blocked before wiring.
