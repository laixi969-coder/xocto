  market: ''
  job: 个人用户或小团队负责人在每周排期时，处理已有的会议邀请、任务清单和待办，把重要工作排进日历并避免被会议挤掉。
  job_en: An individual or small-team lead planning the week takes existing meeting invites, task lists
    and to-dos and fits important work into the calendar without it being crowded out by meetings.
  pain: 重要工作常被会议和临时事项挤掉，手动重排日历费时且容易反复调整。
  pain_en: Important work gets crowded out by meetings and ad-hoc items, and manually re-blocking a calendar
    is slow and needs repeated adjustment.
  current_alternative: 手动拖拽日历、用固定时间块或专注时段约定，或干脆不排、靠临时找空档。
  current_alternative_en: Dragging calendar events by hand, using fixed blocks or focus-time conventions,
    or not planning at all and hunting for gaps ad hoc.
  usage_reason: 推断：相较手动拖拽，它直接读取已有日程与任务并自动重排时间块，省去逐条挪动和反复权衡这一步，因此会议密集、深度工作时间被切碎的人会尝试它；尚无留存或付费证据。
  usage_reason_en: 'Inference: versus dragging events by hand, it reads existing schedules and tasks and
    re-blocks time automatically, removing the step of moving items one by one and re-weighing trade-offs,
    so people whose deep-work hours are fragmented by meetings may try it; no retention or payment evidence
    yet.'
