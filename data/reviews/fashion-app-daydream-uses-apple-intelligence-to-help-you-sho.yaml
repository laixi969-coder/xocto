  market: ''
  job: 普通消费者在浏览相册里保存的穿搭截图或街拍照片时，想找到同款或相似单品并完成购买。
  job_en: Ordinary consumers browsing saved outfit screenshots or street-style photos in their camera
    roll who want to find the same or similar items and buy them.
  pain: 看到喜欢的穿搭却不知道品牌和款式，只能靠截图后手动搜索或发帖求同款，往往找不到或耗时很久。
  pain_en: When users like an outfit they often do not know the brand or style, so they must manually
    search after screenshotting or post asking for the item, which often fails or takes a long time.
  current_alternative: 旧做法是截图后用关键词在电商平台反复搜索、用图片搜索工具试运气，或在社交平台发帖询问同款。
  current_alternative_en: The old approach is to screenshot and repeatedly search e-commerce platforms
    with keywords, try image search tools, or post on social platforms asking for the item.
  usage_reason: 相较手动关键词搜索，Daydream 直接读取相册中已有的穿搭照片并输出可购买结果，省去用户自己描述款式、品牌再逐条比对的步骤，因此常存穿搭图、又懒得手动找同款的消费者会在看到心仪穿搭时选择它；这是基于产品能力的推断。
  usage_reason_en: Compared with manual keyword search, Daydream reads existing outfit photos in the camera
    roll and returns shoppable results, removing the step of describing the style and brand and comparing
    listings one by one; consumers who save outfit images but dislike manual searching would choose it
    when they spot an outfit they like. This is an inference based on product capability.
