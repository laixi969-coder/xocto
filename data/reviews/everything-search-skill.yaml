  market: ''
  job: 使用 Cursor、Codex 等编程代理的开发者，在代理需要查找本地代码或文件时，让它通过 Everything 索引检索，而不是逐层遍历目录。
  job_en: Developers using coding agents such as Cursor or Codex, when the agent needs to find local code
    or files, have it search through the Everything index rather than walking directories level by level.
  pain: 代理逐层遍历目录在大仓库或大磁盘上很慢，检索不到正确文件就会给出错误上下文，开发者要反复纠正。
  pain_en: Agents walking directories are slow on large repos or disks, and failing to find the right
    file yields wrong context that developers must repeatedly correct.
  current_alternative: 旧做法是让代理用内置的 glob/grep 逐层扫描，或开发者自己手动把文件路径贴进对话。
  current_alternative_en: The old way is letting the agent scan with built-in glob/grep, or the developer
    manually pasting file paths into the conversation.
  usage_reason: 推断：相较逐层扫描，它把检索交给已建好的 Everything 索引，省掉代理遍历目录这一步，因此在大仓库或大磁盘上工作的开发者会在代理频繁找不到文件时选择它；但仓库仅 42
    星、无 issue 讨论，尚无重复使用或留存证据。
  usage_reason_en: 'Inference: compared with level-by-level scanning, it delegates retrieval to an already-built
    Everything index, removing the directory-walk step, so developers on large repos or disks would pick
    it when the agent frequently misses files; however, with only 42 stars and no issue discussion, there
    is no evidence of repeated use or retention.'
