  market: ''
  job: Mac 用户在自己或 AI 代理需要引用本机资料时，用自然语言描述要找的内容，从本地文件中取回相关材料再交给代理使用。
  job_en: A Mac user, or their AI agent, describes in natural language what is needed and retrieves relevant
    material from local files to pass to the agent.
  pain: 本机文件靠文件名和文件夹记忆查找，关键词对不上就找不到；代理要读本地上下文时也缺少可调用的检索入口。
  pain_en: Local files are found by remembering names and folders, and a mismatched keyword means nothing
    is found; agents also lack a callable retrieval entry point for local context.
  current_alternative: 现在用系统聚焦搜索或第三方文件名搜索，靠人工整理目录，代理侧则手动复制粘贴文件内容。
  current_alternative_en: Today people use system spotlight or third-party filename search, tidy folders
    by hand, and manually copy file contents for agents.
  usage_reason: 推断：相较按文件名搜索，它按语义取回内容，省掉了回忆文件名和手工整理目录这一步，需要频繁从本机资料取上下文再交给代理的 Mac 用户会因此选择它；但公开材料未说明索引范围与权限处理。
  usage_reason_en: 'Inference: compared with filename search, it retrieves content by meaning, removing
    the step of recalling filenames and tidying folders, which is why Mac users who often pull local context
    for agents would pick it; but public material does not describe indexing scope or permission handling.'
