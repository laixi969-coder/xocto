  market: ''
  job: 软件工程师在同时维护多个代码仓库、并反复用Codex或Claude Code处理同一项目的不同任务时，需要把项目约定、历史决策和先前结论重新整理成提示，让代理接着上次的进度继续改代码。
  job_en: Software engineers maintaining several repositories and repeatedly using Codex or Claude Code
    for different tasks in the same project must reassemble project conventions, past decisions and earlier
    conclusions into prompts so the agent can continue from where it left off.
  pain: 代理会话结束后上下文即丢失，跨仓库的约定和结论无法自动带入下一次任务，开发者只能手工复制粘贴或重新解释，重复劳动且容易遗漏关键约束。
  pain_en: Context is lost when an agent session ends, and cross-repository conventions and conclusions
    are not carried into the next task, forcing developers to copy-paste or re-explain manually, which
    is repetitive and easily drops key constraints.
  current_alternative: 目前常见做法是手工维护提示模板、把说明写进仓库内的文档或规则文件，或依赖代理自带的会话记忆功能。
  current_alternative_en: Common practice today is hand-maintained prompt templates, notes written into
    in-repo docs or rule files, or relying on the agent's own session memory.
  usage_reason: 推断：相较手工复制粘贴，它把仓库与会话内容自动抽取成可检索的记忆并在需要时回填给代理，省去每次重新交代背景这一步；对同时维护多个仓库、且对代码外泄敏感的开发者更有吸引力。是否真正减少返工尚无公开数据。
  usage_reason_en: 'Inference: compared with manual copy-paste, it automatically extracts repository and
    session content into searchable memory and feeds it back to the agent, removing the step of re-explaining
    background each time; this appeals to developers maintaining several repositories who are sensitive
    to code leakage. Whether it actually reduces rework is not publicly documented.'
