  pain: 中文技术文档写作长期缺少可执行的统一文风约束：模型生成的中文常带翻译腔、空话和套话，作者要逐句删改；阮一峰《中文技术文档的写作规范》虽被广泛引用，但此前只是人读的规范文本，无法直接约束模型输出，每次改写都要人工重复同一套判断。
  pain_en: 'Chinese technical writing lacks an executable style constraint: model-generated Chinese tends
    to carry translationese, filler, and boilerplate that authors must edit sentence by sentence; Ruan
    Yifeng''s writing rules are widely cited but exist only as human-readable text, so they cannot directly
    constrain model output and the same judgments must be repeated by hand each time.'
  current_alternative: 此前作者要么自己逐句改写，要么在提示词里临时粘贴规范片段，要么直接接受模型默认的中文腔调再人工返工；规范本身以文章形式存在，没有可被 agent 调用的封装。
  current_alternative_en: Authors previously rewrote sentence by sentence themselves, pasted fragments
    of the rules into ad-hoc prompts, or accepted the model's default Chinese tone and reworked it by
    hand; the rules existed as an article, not as an agent-callable package.
  usage_reason: 相较临时粘贴规范或纯人工返工，它把《中文技术文档的写作规范》固化为 agent 可直接调用的写作约束，改写动作在生成环节一次完成，省去作者逐条复述规范并逐句删改 AI 腔的那一步；因此中文技术文档作者在起草或润色阶段会选它。这是基于产品能力与任务结构的推断，尚无用户反馈或案例证实。
  usage_reason_en: Compared with pasting rules ad hoc or purely manual rework, it fixes Ruan Yifeng's
    rules into an agent-callable writing constraint so rewriting happens inside generation, removing the
    step of restating the rules and hand-deleting AI tone sentence by sentence; that is why Chinese technical
    writers would pick it while drafting or polishing. This is an inference from product capability and
    task structure, not yet confirmed by user feedback or cases.
