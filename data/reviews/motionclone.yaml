  market: ''
  job: 动效设计师或短视频剪辑师在接到“照着这条参考视频做一版”的需求时，处理参考视频素材，要产出一条风格一致、可继续修改的动效成片。
  job_en: A motion designer or short-form video editor who is asked to 'make a version like this reference
    clip' works from the reference video and must deliver a style-matched motion piece that can still
    be edited.
