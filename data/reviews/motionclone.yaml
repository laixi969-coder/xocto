  current_alternative_en: The current practice is to manually break down the reference clip and rebuild
    it in professional motion software, or to buy and adapt a template; public material does not show
    the actual savings versus these.
  usage_reason: 推断：它把“看参考视频—手工重建工程”压缩为“输入参考视频—得到可编辑工程”，省掉从零搭建图层与关键帧这一步，因此需要快速出多版动效的剪辑师会先试用；但生成结果能否直接进入现有剪辑流程、返工多少，公开材料未提供。
  usage_reason_en: 'Inference: it compresses ''watch the reference clip and rebuild the project by hand''
    into ''input the reference clip and get an editable project'', removing the step of building layers
    and keyframes from scratch, so editors who need many motion variants quickly would try it first; whether
    the output plugs into existing editing pipelines and how much rework it needs is not shown in public
    material.'
