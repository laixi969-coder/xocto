  market: ''
  job: 施工方在浇筑混凝土前需要搭建模板，传统模板多为木模或钢模，使用后废弃或回收成本高。
  job_en: Before pouring concrete, construction teams need to set up formwork; traditional formwork is
    often wood or steel, which is costly to dispose of or recycle after use.
  pain: 传统模板材料成本高、废弃处理污染环境，且搭建和拆除耗时耗力。
  pain_en: Traditional formwork materials are costly, disposal pollutes the environment, and setup and
    removal are time-consuming and labor-intensive.
  current_alternative: 目前使用木模、钢模或铝模，重复使用次数有限，废弃后难以回收。
  current_alternative_en: Currently using wood, steel, or aluminum formwork, with limited reuse cycles
    and difficult recycling after disposal.
  usage_reason: 建筑行业对减碳和成本控制的需求日益迫切，可回收纸模若验证可靠，能同时降低材料成本和环境负担，因此获得投资关注。
  usage_reason_en: The construction industry faces increasing pressure for carbon reduction and cost control;
    if recyclable paper moulds prove reliable, they can reduce material costs and environmental burden,
    hence attracting investment attention.
