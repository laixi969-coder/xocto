  market: ''
  job: 开发者在本地同时维护多个编码代理命令行工具时，需要把它们集中配置并逐个启动，以便在同一台机器上并行推进不同任务。
  job_en: Developers maintaining several coding-agent CLIs locally need to configure and launch them together
    so different tasks can proceed in parallel on one machine.
  pain: 多个代理 CLI 各自有配置、密钥和启动方式，切换与重复配置消耗时间；但公开材料没有说明这种切换痛到什么程度、多久发生一次。
