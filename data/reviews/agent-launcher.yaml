    costs time; the public material does not say how severe or how frequent this is.
  current_alternative: 开发者目前用终端、脚本或各自的配置文件分别启动这些代理，或干脆只用一个代理。
  current_alternative_en: Developers currently start these agents separately through terminals, scripts
    or per-tool config files, or simply stick to one agent.
  usage_reason: 推断：相比逐个开终端配置，它把多个代理的配置和启动收进一个桌面入口，省掉重复配置这一步，因此同时用多个代理的开发者可能愿意试；但没有任何用户反馈或重复使用证据支持这一判断。
  usage_reason_en: 'Inference: compared with opening terminals and configuring each tool, it gathers configuration
    and launch into one desktop entry, removing repeated setup, so developers using several agents may
    try it; no user feedback or repeat-use evidence supports this.'
