  market: ''
  job: 影视后期或素材量大的个人用户，在剪辑或整理前面对本地文件夹里成百上千的照片与视频，需要按画面内容而非文件名找出某个镜头或某张照片。
  job_en: A post-production editor or a user with a large personal library, facing hundreds or thousands
    of local photos and videos before editing or organizing, needs to find a specific shot or photo by
    visual content rather than filename.
  pain: 文件名和文件夹层级无法描述画面内容，逐条点开预览翻找耗时且容易漏掉素材；候选材料未给出用户抱怨或替代行为的直接证据。
  pain_en: Filenames and folder hierarchies cannot describe visual content, so opening previews one by
    one is slow and easy to miss material; the candidate material gives no direct evidence of user complaints
    or workaround behavior.
  current_alternative: 靠文件名、拍摄日期、文件夹分类，或系统自带的相册与 Spotlight 搜索，再手动逐个预览确认。
  current_alternative_en: Relying on filenames, capture dates, folder categories, or built-in Photos and
    Spotlight search, then manually previewing items one by one.
  usage_reason: 推断：相较逐个预览，它把检索动作从“打开文件看内容”变成“用画面描述直接命中”，省掉翻找这一步；但候选材料没有说明索引范围、准确率或人工复核方式，因此哪类用户会持续选择它尚不清楚。
  usage_reason_en: 'Inference: compared with previewing items one by one, it turns retrieval from opening
    files to check content into matching a visual description directly, removing the hunting step; however
    the candidate material does not describe indexing scope, accuracy or human review, so which users
    would keep choosing it remains unclear.'
