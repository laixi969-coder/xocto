  next_validation: 收集 brow 仓库的 issue 与 README，确认额度读取方式、支持的账号数量与是否依赖非公开接口。
  market: ''
  job: 同时使用多个 Claude 账号的开发者，在编码过程中需要随时知道各账号的 5 小时与每周额度还剩多少、何时重置，以决定用哪个账号继续。
  job_en: Developers running multiple Claude accounts need to know each account's remaining 5-hour and
    weekly quota and reset time while coding, in order to pick which account to continue with.
  pain: 额度用尽会中断编码，开发者只能靠反复打开网页或试错来确认剩余额度，切换账号还要重新登录。
  pain_en: Running out of quota interrupts coding, and developers must repeatedly open web pages or guess
    to check remaining quota, while switching accounts means logging in again.
  current_alternative: 手动打开各账号的用量页面查看，或凭经验估计何时会触顶，账号切换靠浏览器手动登录。
  current_alternative_en: Manually opening each account's usage page, or estimating when the limit will
    hit, with account switching done by hand in the browser.
  usage_reason: 推断：它把额度与重置时间直接放在常驻可见的刘海区域，省去反复打开用量页面这一步，并让每个账号在独立浏览器配置中登录，减少切换时的重复登录；因此重度多账号编码的开发者会在额度接近耗尽时选择它。
  usage_reason_en: 'Inference: it places quota and reset time in an always-visible notch area, removing
    the step of repeatedly opening usage pages, and signs each account into its own browser profile, cutting
    repeated logins when switching; developers heavily using multiple accounts would therefore pick it
    when quota nears exhaustion.'
