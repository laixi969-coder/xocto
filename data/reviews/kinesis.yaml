  market: ''
  job: 长时间使用 Mac 的重度用户或行动不便者，在需要频繁切换窗口、滚动和点击时，处理腕带采集的手势信号，要完成对 Mac 的免手控制。
  job_en: A heavy Mac user or person with motor impairments who frequently switches windows, scrolls and
    clicks takes gesture signals from the wristband and must achieve hands-free control of the Mac.
  pain: 键鼠操作需要手在设备间反复移动，对长时间使用者造成疲劳，对行动不便者则可能根本无法完成某些操作。
  pain_en: Keyboard and mouse work forces hands to move repeatedly between devices, tiring long-session
    users and sometimes making certain actions impossible for people with motor impairments.
  current_alternative: 使用键盘快捷键、触控板手势、语音控制或辅助开关设备；部分人靠外接脚踏板等专用硬件。
  current_alternative_en: Using keyboard shortcuts, trackpad gestures, voice control or assistive switch
    devices; some rely on dedicated hardware such as foot pedals.
  usage_reason: 推断：相较快捷键和语音控制，该工具把手势信号直接映射为 Mac 操作，省去记快捷键或说出指令的步骤，因此手部活动受限或追求免手操作的用户会尝试；但公开材料没有准确率、延迟或持续使用证据，无法确认可替代现有输入方式。
  usage_reason_en: 'Inference: compared with shortcuts and voice control, the tool maps gesture signals
    directly to Mac actions, removing the need to memorize shortcuts or speak commands, so users with
    limited hand mobility or seeking hands-free work would try it; yet public material has no accuracy,
    latency or continued-use evidence, so replacing existing input methods is unconfirmed.'
