    evidence_ids:
    - ev-ab337a20f02b5af8
  next_validation: 收集该仓库的 issue 与 discussion，确认用户是否把它用于日常代码评审流程以及是否提出付费或团队版需求。
  market: ''
  job: 使用 AI 编码代理的开发者，在代理完成一轮改动后，面对仓库里新增的提交与差异，需要逐条确认哪些文件、哪些行被改，再决定是否保留。
  job_en: A developer using an AI coding agent, after the agent finishes a round of edits, faces new commits
    and diffs in the repo and must confirm file by file and line by line what changed before deciding
    what to keep.
  pain: AI 一次改动可能横跨多个文件，命令行 diff 与提交历史阅读成本高，容易漏看或误判，导致错误改动被合入。
  pain_en: A single AI edit can span many files; reading command-line diffs and commit history is costly,
    so wrong changes slip through or get misjudged and merged.
  current_alternative: 用 git 命令行、编辑器内置 diff 或通用 Git 图形客户端逐条比对，或干脆信任代理输出直接提交。
  current_alternative_en: Comparing with git CLI, editor built-in diffs or a general Git GUI, or simply
    trusting the agent's output and committing directly.
  usage_reason: 推断：相较命令行 diff，它把提交与差异集中到一个只读界面里，减少在终端里反复切换和拼命令的步骤，让审查者更快定位被改动的行；因此在意 AI 改动可追溯性的个人开发者或小团队会在代理改完代码后选择它。
  usage_reason_en: 'Inference: versus CLI diffs, it gathers commits and diffs into one read-only view,
    cutting the back-and-forth of terminal commands so reviewers locate changed lines faster; hence individual
    developers or small teams who care about traceable AI edits would pick it after an agent finishes
    coding.'
