  market: ''
  job: 同时使用 Claude Code 和 Codex 的开发者，在跨工具继续同一项目时，处理此前对话、决策和代码上下文，需要让新会话接上旧结论而不必重新交代背景。
  job_en: Developers using both Claude Code and Codex who, when continuing the same project across tools,
    handle prior conversations, decisions and code context and need a new session to pick up old conclusions
    without re-explaining.
  pain: 每个编码代理的上下文各自封闭，换工具就要重新讲一遍项目背景和已定决策，重复交代既费时又容易漏掉关键约束。
  pain_en: Each coding agent keeps its context closed, so switching tools means re-explaining project
    background and settled decisions, which is slow and easily drops key constraints.
  current_alternative: 旧做法是手动维护 CLAUDE.md 之类的说明文件，或把历史对话复制粘贴进新会话。
  current_alternative_en: The old way is manually maintaining files like CLAUDE.md, or copy-pasting past
    conversations into a new session.
  usage_reason: 推断：相比手写说明文件，它把对话与决策自动落成 Markdown 并在本地检索，省去每次换工具重新整理背景这一步，因此频繁跨工具续接同一项目的开发者会选它；但公开材料没有留存或复购证据，尚不能确认已被长期留在工作流里。
  usage_reason_en: 'Inference: unlike hand-written context files, it automatically writes conversations
    and decisions to Markdown and retrieves them locally, removing the step of re-organizing background
    on every tool switch, so developers who frequently continue one project across tools would choose
    it; no retention or repeat-use evidence yet confirms it stays in the workflow.'
