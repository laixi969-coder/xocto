  market: ''
  job: 独立厂牌版权运营和电子音乐人在把自有曲库授权给AI音乐训练时，需要确认哪些作品被使用、被生成成什么，并据此拿到署名和分成。
  job_en: Independent label rights operators and electronic artists licensing their catalogues for AI
    music training need to know which works were used, in what generated output, and to receive credit
    and payment accordingly.
  pain: 现有授权只能签一份笼统协议，权利人无法追溯自己的作品影响了哪首生成曲，分成缺乏可核对依据，谈判时也没有议价筹码。
  pain_en: 'Today licensing is a blanket deal: rights holders cannot trace which generated track their
    work influenced, royalties lack a verifiable basis, and they have no leverage in negotiation.'
  current_alternative: 权利人目前靠人工谈判、按曲库打包收取一次性授权费，或干脆拒绝授权并依赖诉讼与平台下架维权。
  current_alternative_en: Rights holders currently rely on manual negotiation, one-off blanket catalogue
    fees, or refusing to license and relying on litigation and platform takedowns.
  usage_reason: 推断：相较一次性打包授权，GasLab把归属信息绑定到每一次生成，权利人能直接看到被引用的作品并据此结算，因此拥有可授权曲库、又担心失去控制权的独立厂牌和音乐人，会在需要向AI方开放素材时选择它作为可审计的中间层。
  usage_reason_en: 'Inference: unlike a one-off blanket licence, GasLab binds attribution to each generation
    so rights holders can see the referenced works and settle on that basis; labels and artists with licensable
    catalogues who fear losing control would pick it as an auditable intermediary when opening their material
    to AI.'
