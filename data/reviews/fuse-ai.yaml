  market: ''
  job: 销售运营或增长工程人员需要把 CRM、外呼、邮件和线索数据接成一条可用的 GTM 流程，以便团队按统一链路跟进客户。
  job_en: Sales ops or growth engineers need to wire CRM, outbound, email and lead data into one usable
    GTM pipeline so the team follows a single path for prospects.
  pain: 公开材料只说明用一个 SDK 和一个 MCP 搭建 GTM 栈，未说明用户原来卡在哪一步、不解决会失去什么，痛点无法从现有事实还原。
  pain_en: Public material only says a GTM stack is built with one SDK and one MCP; it does not say which
    step users were stuck on or what they lose by not solving it, so the pain cannot be reconstructed
    from available facts.
  current_alternative: 推断上，销售团队目前靠分别采购并手工对接 CRM、外呼与数据工具来拼装同类流程，但候选未提供任何替代行为的证据。
  current_alternative_en: By inference, sales teams currently assemble similar pipelines by buying CRM,
    outbound and data tools separately and integrating them by hand, but the candidate offers no evidence
    of this alternative behavior.
  usage_reason: 无法判断：材料未说明它相较现有拼装方式减少了哪一步负担或改善了哪项可核对结果，因此不能解释用户为何选择它。
  usage_reason_en: 'Cannot be judged: the material does not say which step it removes versus current assembly
    or which checkable result it improves, so it cannot explain why users would choose it.'
