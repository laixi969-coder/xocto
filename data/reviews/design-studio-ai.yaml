  market: ''
  job: 设计师或前端工程师在需要产出可编辑的视觉稿、3D 或动效素材时，把设计需求交给 AI 代理，在云端画布上完成编辑，最终拿到可继续修改的设计文件而非一次性图片。
  job_en: Designers or front-end engineers hand design requests to AI agents and edit on a cloud canvas
    to obtain editable design files rather than one-off images.
  pain: 现有 AI 出图工具产出的是扁平位图，设计师拿到后仍需在设计工具里手工重排图层、重建组件与动效，这一步无法被生成式出图替代；公开材料以能力清单呈现（云端编辑、3D、动效、MCP、CLI、BYOK），未给出用户抱怨或案例，痛点属工作流结构推理。
  pain_en: Existing AI image tools output flat bitmaps, so designers still have to manually rebuild layers,
    components and motion in a design tool; this step is not replaced by generative output. The public
    material is a capability list without user complaints or cases, so the pain is a workflow-structure
    inference.
  current_alternative: 设计师用 Figma 等工具手工排版导出，或先用 Midjourney/Stable Diffusion 生成位图再手工重排；前端工程师则把设计稿手工翻译成代码。
  current_alternative_en: Designers lay out and export manually in Figma-like tools, or generate bitmaps
    with Midjourney/Stable Diffusion and rebuild them by hand; front-end engineers manually translate
    mockups into code.
  usage_reason: 推断：相较「先生成位图再手工重排」，代理直接在可编辑画布上执行修改，省去重建图层与组件这一步，并让 MCP/CLI 把设计文件接入已有工程流程；因此已有设计系统、需要批量产出可编辑素材的团队会在这种情况下选择它。缺少用户反馈或案例，动机仍属推断。
  usage_reason_en: 'Inference: versus generating a bitmap and rebuilding it by hand, agents editing directly
    on an editable canvas removes the layer/component rebuild step and lets MCP/CLI wire the file into
    existing engineering flows; teams with an existing design system needing editable assets in volume
    would choose it in that situation. Without user feedback or cases this remains an inference.'
