  market: ''
  job: 设计师与前端工程师在需要产出可编辑的视觉、三维或动效素材时，处理同一份设计文件并完成定稿。
  job_en: Designers and front-end engineers working on one shared design file to finalize editable visual,
    3D or motion assets.
  pain: 公开材料只说明它是面向智能体与人的设计工作区，未说明原先由谁、用什么工具、花多久完成同一步骤，也未给出用户抱怨或替代行为。
  pain_en: The public material only describes a design workspace for agents and humans; it does not say
    who previously did this step, with which tools, or how long it took, and gives no user complaints
    or workaround behavior.
  current_alternative: 公开材料未提供现有替代方式，无法确认用户此前是用传统设计软件、脚本还是其他协作工具完成。
  current_alternative_en: The public material provides no current alternative, so it is unclear whether
    users previously used traditional design software, scripts or other collaboration tools.
  usage_reason: 推断：若智能体能在同一份设计文件里直接执行编辑动作，用户可省去在生成工具与设计软件之间来回搬运素材的一步；但缺少用户反馈或案例支持，无法确认这会成为选择理由。
  usage_reason_en: 'Inference: if an agent can edit directly inside the same design file, users could
    skip shuttling assets between a generation tool and design software; without user feedback or cases
    this cannot be confirmed as a reason for choosing it.'
