  market: ''
  job: 独立经营者或小电商运营者在每天处理订单跟进、客户回复等重复事务时，把操作演示给产品一次，让它按同一流程自动完成后续同类任务。
  job_en: A solopreneur or small e-commerce operator, handling repetitive tasks such as order follow-ups
    and customer replies daily, demonstrates the operation once so the product completes later similar
