  market: ''
  job: 开发者在通勤、会议或离开工位时，需要查看并推进电脑上正在跑的 Cursor 编码任务，处理的是同一份代码库和待确认的改动。
  job_en: A developer commuting, in a meeting, or away from the desk needs to check and advance a Cursor
    coding task running on their computer, working against the same codebase and pending changes.
  pain: 长任务跑到一半人必须离开，无法及时确认或纠偏，只能等回到工位，任务空转或被卡住。
