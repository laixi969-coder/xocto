    only wait until returning while the task idles or stalls.
  current_alternative: 等回到电脑前再处理、用通用远程桌面连回、或干脆不在离开时启动长任务。
  current_alternative_en: Wait until back at the computer, use a generic remote desktop, or avoid starting
    long tasks before leaving.
  usage_reason: 推断：相较通用远程桌面要在小屏上找窗口和拖拽，它把“连回本机 Cursor 并看到当前任务状态”做成一步，减少重新定位工作区这一步负担，因此适合会离开工位但不想中断编码代理任务的人。公开材料没有留存或持续使用证据。
  usage_reason_en: 'Inference: compared with a generic remote desktop where you hunt windows and drag
    on a small screen, it collapses ''connect back to local Cursor and see current task state'' into one
    step, removing the burden of re-locating the workspace, which suits people who leave the desk but
    do not want to interrupt a coding-agent task. There is no public retention or sustained-use evidence.'
