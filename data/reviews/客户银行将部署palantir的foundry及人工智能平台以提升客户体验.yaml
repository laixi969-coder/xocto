  market: ''
  job: 银行运营与客户体验团队在客户数据分散于多个系统、服务流程割裂时，处理客户与交易数据，要完成客户体验改善与合规可追溯的服务决策。
  job_en: Bank operations and customer experience teams, when customer data sits across multiple systems
    and service workflows are fragmented, work with customer and transaction data to deliver improved
    customer experience and auditable service decisions.
  pain: 客户数据分散、模型输出难以审计，导致服务决策慢且难以向监管解释；公开材料未给出该银行此前的具体替代做法。
  pain_en: Scattered customer data and hard-to-audit model output slow service decisions and complicate
    regulatory explanation; public material does not state the bank's prior alternative.
  current_alternative: 公开材料未说明客户银行此前使用何种工具或人工流程，替代方案仍待核验。
  current_alternative_en: Public material does not describe what tools or manual processes Customers Bank
    used before; the prior alternative remains unverified.
  usage_reason: 推断：相较银行自建数据管道与模型团队，Foundry 把数据接入、权限与模型运行放在同一平台，减少跨系统拼接与合规举证的工作量，因此需要可审计 AI 决策的银行会考虑它。
  usage_reason_en: 'Inference: compared with building data pipelines and model teams in-house, Foundry
    places data onboarding, permissions and model execution on one platform, cutting cross-system stitching
    and compliance evidence work, so banks needing auditable AI decisions would consider it.'
