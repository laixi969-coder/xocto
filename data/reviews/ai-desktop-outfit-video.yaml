  market: ''
  job: 短视频创作者或内容运营在需要按同一机位、同一节奏批量产出「桌面换装」类成片时，处理一句创意想法和参考画面，要完成的是拿到可直接发布的 30 秒带对白字幕的成片。
  job_en: A short-video creator or content operator who must batch-produce 'desktop outfit-change' clips
    with the same camera position and rhythm takes a one-line idea and reference visuals and needs a publishable
    30-second clip with dialogue and subtitles.
  pain: 这类格式对提示词措辞、机位和节奏要求很细，自己反复试错要花大量时间，且成片还要单独配音配字幕做后期。
  pain_en: This format is sensitive to prompt wording, camera position and rhythm, so trial and error
    is time-consuming, and the clip still needs separate voice-over, subtitles and editing.
  current_alternative: 创作者目前靠手动写提示词、反复重生成，再用剪辑软件拼接和加字幕。
  current_alternative_en: Creators currently hand-write prompts, regenerate repeatedly, then assemble
    and subtitle in editing software.
  usage_reason: 相较手动试错，它把已验证的提示词结构和反问补全流程固定下来，让创作者少走重写提示词这一步，并直接产出带对白字幕的成片；这是基于产品能力的推断，尚无用户反馈或复购证据。
  usage_reason_en: Compared with manual trial and error, it fixes a validated prompt structure and an
    interview step, removing the prompt-rewriting loop and delivering a clip with dialogue and subtitles;
    this is inference from product capability, with no user feedback or repeat-use evidence yet.
