  market: ''
  job: 高管与行政助理在每天处理收件箱时，面对大量往来邮件，需要完成分类、优先级排序并按本人语气起草回复。
  job_en: Executives and administrative assistants, while working through the inbox each day, face large
    volumes of correspondence and must sort it, set priorities, and draft replies in the principal's own
    voice.
  pain: 收件箱持续堆积，逐封阅读与起草占用大量时间；回复语气与措辞需要贴合本人风格，代写后往往还要大幅改写。
  pain_en: The inbox keeps piling up, and reading and drafting each message consumes substantial time;
    replies must match the principal's style, so delegated drafts often need heavy rewriting.
  current_alternative: 本人或助理手工逐封阅读、标记与起草，或使用通用写作助手生成后自行改写。
  current_alternative_en: The principal or an assistant reads, flags, and drafts each message by hand,
    or uses a general writing assistant and rewrites the output.
  usage_reason: 相较手工逐封起草，它通过记忆与微调保留用户语气，直接产出接近可发送状态的草稿，减少“生成后再整体改写”这一步；推断，语气贴合度高的高频对外沟通者更可能选择它。
  usage_reason_en: Compared with drafting each message by hand, it preserves the user's voice through
    memory and fine-tuning and returns drafts close to send-ready, removing the 'rewrite the whole thing
    after generating' step; this is inference, and users with high-frequency external communication who
    need close voice matching are more likely to choose it.
