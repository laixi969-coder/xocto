  market: ''
  job: 芯片或硬件团队在需要自研推理加速器、又缺乏完整设计资源时，打开该仓库查看加速器设计与其生成方式，以判断能否复用或作为起点。
  job_en: When a chip or hardware team needs a self-built inference accelerator but lacks full design
    resources, it opens this repository to inspect the accelerator design and how it was generated, to
    judge whether it can be reused or used as a starting point.
  pain: 自研加速器设计周期长、人力贵，小团队难以承担从架构到验证的完整流程。
  pain_en: Building an accelerator in-house takes a long cycle and expensive headcount, and small teams
    struggle to cover the full path from architecture to verification.
  current_alternative: 目前多依赖商用 IP、大厂加速卡或从零手写 RTL 与验证流程。
  current_alternative_en: Today teams mostly rely on commercial IP, big-vendor accelerator cards, or hand-writing
    RTL and verification flows from scratch.
  usage_reason: 推断：若该仓库确实提供可复现的加速器设计与生成流程，团队可省去从零搭建架构的第一步，因此缺设计资源的小型硬件团队可能试用；但公开材料未给出设计规模、可综合性或验证结果，选择理由尚不成立。
  usage_reason_en: 'Inference: if the repository truly offers a reproducible accelerator design and generation
    flow, teams could skip the first step of building an architecture from scratch, so small hardware
    teams short on design resources might try it; however, public material gives no design scale, synthesizability,
    or verification results, so the reason to choose it is not yet established.'
