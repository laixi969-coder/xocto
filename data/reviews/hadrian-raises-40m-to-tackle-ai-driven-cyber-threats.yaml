  job: 企业安全工程师或外部渗透测试团队在季度或合规要求的测试窗口内，处理目标系统与网络资产，要完成攻击面探测、漏洞验证并交付可复核的风险清单。
  job_en: Enterprise security engineers or external penetration-testing teams, within quarterly or compliance-driven
    test windows, work on target systems and network assets to complete attack-surface probing, vulnerability
    validation and a reviewable risk list.
