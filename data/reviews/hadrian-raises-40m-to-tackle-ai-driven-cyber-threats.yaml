  usage_reason_en: Compared with manual engagements that take weeks to schedule, it automates the probing
    and vulnerability-validation step so teams receive a validated issue list rather than raw scanner
    noise; teams facing frequent compliance tests or thin staffing would choose it in a test window. This
    is an inference from product capability and task structure, with no customer case or retention evidence
    yet.
