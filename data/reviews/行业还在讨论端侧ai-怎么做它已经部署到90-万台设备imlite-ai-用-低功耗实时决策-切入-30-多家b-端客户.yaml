  market: ''
  job: 设备厂商的嵌入式团队在给摄像头、传感器或工业设备加识别与异常判断能力时，需要让模型在本地算力受限、供电受限的条件下直接给出判断结果，而不是把原始数据传回云端。
  job_en: Embedded teams at device makers adding recognition or anomaly detection to cameras, sensors
    or industrial equipment need the model to decide locally under tight compute and power budgets instead
    of shipping raw data to the cloud.
  pain: 云端推理带来时延、带宽和电费成本，工业与安防场景还受数据不出厂、不出户的合规约束；把通用模型塞进低功耗芯片往往跑不动或耗电过高。
  pain_en: Cloud inference adds latency, bandwidth and power cost, while industrial and security settings
    often forbid raw data leaving the site; general models frequently fail to run, or drain power, on
    low-power chips.
  current_alternative: 常见做法是采购通用芯片方案后由自家算法团队裁剪量化模型，或继续用云端推理加本地简单规则判断，前者周期长，后者时延与合规都难满足。
  current_alternative_en: Teams either buy general-purpose chips and have in-house algorithm staff prune
    and quantize models, or keep cloud inference with simple local rules; the first is slow, the second
    fails on latency and compliance.
  usage_reason: 推断：相较自研裁剪或纯云端方案，它把低功耗实时推理做成可直接嵌入固件的交付物，省掉从模型压缩到芯片适配这一段工程负担，因此算力与人力都有限的硬件厂商会在新机型立项时优先评估它。
  usage_reason_en: 'Inference: versus in-house pruning or cloud-only setups, it packages low-power real-time
    inference as firmware-ready output, removing the model-compression-to-chip-porting work, so hardware
    makers with limited compute and staff evaluate it at new-model kickoff.'
