  market: ''
  job: 游戏移植或遗留软件维护的开发者，在需要还原自己拥有软件的原始逻辑时，处理本地二进制文件，要产出可编译且行为一致的 C 源码。
  job_en: Developers doing game porting or legacy software maintenance process local binaries when they
    need to recover the original logic of software they own, aiming to produce compilable C source with
    matching behavior.
  pain: 手工反编译耗时极长，且必须逐段验证行为一致，是移植和维护中最费人力的环节。
  pain_en: Manual decompilation takes very long and requires segment-by-segment behavior verification,
    making it the most labor-intensive part of porting and maintenance.
  current_alternative: 目前靠人工使用反编译工具逐函数还原，再手工比对编译结果。
  current_alternative_en: Today this is done by hand with decompiler tools, restoring function by function
    and manually comparing compiled output.
  usage_reason: 推断：相较人工逐函数还原，它让代理直接产出可编译的 C 并用字节一致作为验收条件，减少反复比对这一步，因此做移植或维护的开发者会在还原阶段选择它；但公开材料未显示持续使用或付费证据。
  usage_reason_en: 'Inference: versus manual function-by-function restoration, it has the agent produce
    compilable C with byte-identical output as the acceptance condition, removing repeated comparison
    work, so porting or maintenance developers would use it at the recovery stage; sustained use or payment
    is not publicly evidenced.'
