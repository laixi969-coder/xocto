  market: ''
  job: 做游戏移植或遗留软件维护的开发者，在自己拥有合法副本的前提下，把本地游戏二进制交给本地运行的 AI 代理，要产出编译后字节完全一致的 C 源码，用于还原原始逻辑与后续移植。
  job_en: Developers doing game porting or legacy software maintenance hand a local game binary to a locally
    running AI agent, aiming to produce C source that compiles to byte-identical output, so they can recover
    original logic and port it.
  pain: 匹配式反编译被公开描述为极其困难、耗时以年计、需要多名贡献者协作的苦活，逐函数还原后还要反复比对编译结果，是移植与维护中最费人力的环节。
  pain_en: Matching decompilation is publicly described as brutally difficult and time-consuming, on the
    scale of years with multiple contributors; function-by-function restoration is followed by repeated
    compiled-output comparison, the most labor-intensive part of porting and maintenance.
  current_alternative: 目前靠人工使用反编译工具逐函数还原，再手工比对编译结果；社区用 decomp.dev 这类进度看板集中追踪匹配进度，并有 recomp.gg 这类已反编译游戏陈列站。
  current_alternative_en: Today it is done by hand with decompiler tools, restoring function by function
    and manually comparing compiled output; the community tracks matching progress on boards like decomp.dev
    and shelves finished results on sites like recomp.gg.
  usage_reason: 推断：相较人工逐函数还原再手工比对，它让本地代理直接产出可编译的 C，并以字节完全一致作为可核对的验收条件，省掉反复比对这一步，因此做移植或维护的开发者会在还原阶段选择它；公开材料尚未显示持续使用或付费证据。
  usage_reason_en: 'Inference: versus manual function-by-function restoration plus hand comparison, it
    has a local agent emit compilable C with byte-identical output as a checkable acceptance condition,
    removing the repeated comparison step, so porting or maintenance developers would pick it at the recovery
    stage; sustained use or payment is not yet publicly evidenced.'
