  market: ''
  job: 开发团队在 AI 编码代理提交一批代码改动后，需要有人逐条看过这些 diff，判断能不能合并进主干，并留下评审意见。
  job_en: After an AI coding agent submits a batch of code changes, a development team needs someone to
    go through the diff line by line, decide whether it can merge into the main branch, and leave review
    comments.
  pain: 代理产出的代码量远大于人工手写，评审者要在不熟悉的改动上快速判断对错，漏看一处就可能把缺陷带进主干；这是工作流推理，公开材料未给出用户抱怨。
  pain_en: Agents produce far more code than humans write by hand, so reviewers must judge unfamiliar
    changes quickly, and one missed spot can push a defect into the main branch; this is workflow reasoning,
    as public material contains no user complaints.
  current_alternative: 现在多数团队靠人工在代码托管平台的合并请求里逐条读 diff，或让另一个 AI 会话临时读一遍，评审质量取决于谁有空、谁熟悉这块代码。
  current_alternative_en: Most teams today rely on humans reading the diff line by line in a merge request
    on their code hosting platform, or asking another AI session to read it ad hoc, so review quality
    depends on who is free and who knows that code.
  usage_reason: 推断：相较人工逐条读 diff，它把评审动作直接挂在代理产出的改动上，省掉评审者自己组织上下文这一步，因此改动量大、评审人手紧的团队会先试它；但公开材料没有用户反馈或客户案例，这一动机尚未被证实。
  usage_reason_en: 'Inference: compared with humans reading the diff line by line, it attaches the review
    action directly to the agent-produced change, removing the step where a reviewer assembles context
    themselves, so teams with high change volume and thin review capacity would try it first; public material
    has no user feedback or customer cases, so this motive is unconfirmed.'
