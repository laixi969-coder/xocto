  market: ''
  job: 在 Mac 上读书或查资料的人，在阅读过程中同时打开电子书、多个浏览器标签页和笔记软件，需要把读到的内容整理成可复用的笔记或摘录。
  job_en: A person reading or researching on a Mac keeps a book, several browser tabs and a note app open,
    and needs to turn what they read into reusable notes or excerpts.
  pain: 材料分散在阅读器、浏览器和笔记三处，复制粘贴和来回切换打断阅读节奏，读完后往往只剩零散片段。
  pain_en: Material is split across a reader, a browser and a note app; copying and switching break the
    reading flow, and what remains afterwards is often scattered fragments.
  current_alternative: 用阅读器加浏览器加独立笔记软件，靠手动复制粘贴和窗口切换把内容拼起来。
  current_alternative_en: A reader plus a browser plus a separate note app, stitched together by manual
    copy-paste and window switching.
  usage_reason: 推断：如果 AI 能直接读取当前书页或标签页内容并生成可编辑摘录，用户可省掉复制粘贴和切换窗口这一步，因此边读边产出的人可能选择它；但公开材料未说明 AI 具体接收什么、产出什么，也缺少使用与留存证据。
  usage_reason_en: 'Inference: if the AI can read the current page or tab and produce an editable excerpt,
    users skip the copy-paste and window-switching step, so people who produce while reading may choose
    it; however the public material does not say what the AI takes in or outputs, and usage or retention
    evidence is absent.'
