  market: ''
  job: 视频剪辑师或游戏开发者在本地工程中需要一段背景音乐或音效时，通过 MCP 客户端描述需求，让工具在本机生成音频并试听选用。
  job_en: A video editor or game developer needing background music or a sound effect in a local project
    describes the need through an MCP client, has the tool generate audio locally, and auditions it for
    use.
  pain: 找无版权或可商用音频要在素材库间切换、核对授权，临时占位素材还要额外下载；不解决则剪辑和原型节奏被打断。
  pain_en: Finding royalty-free or commercially usable audio means switching between stock libraries and
    checking licenses, and placeholder assets need extra downloads; leaving it unsolved interrupts editing
    and prototyping rhythm.
  current_alternative: 素材库检索购买、免费音效站下载，或用云端音频生成 API 再手动导入工程。
  current_alternative_en: Searching and buying from stock libraries, downloading from free sound sites,
    or using a cloud audio-generation API and manually importing into the project.
  usage_reason: 推断：相较在素材库检索并核对授权，它在剪辑或开发环境内直接按描述生成并落盘，省去跨平台搜索和导入这一步，因此对版权敏感、素材需求高频的小团队会在原型和粗剪阶段选择它；尚无留存或付费证据。
  usage_reason_en: 'Inference: compared with searching stock libraries and checking licenses, it generates
    from a description and writes files directly inside the editing or development environment, removing
    the cross-platform search and import step, so copyright-sensitive teams with frequent asset needs
    would choose it during prototyping and rough cuts; there is no retention or payment evidence yet.'
