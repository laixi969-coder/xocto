  market: ''
  job: 开发团队在让AI修改既有代码库时，需要留下变更依据与验收证据，于是用该客户端记录基线与交付证据，完成可追溯的变更。
  job_en: When letting AI modify an existing codebase, a development team needs to leave change rationale
    and acceptance evidence, so it uses this client to record baselines and delivery evidence and complete
    traceable changes.
  pain: AI改动代码后难以说清改了哪一步、依据是什么，评审和验收时缺少可核对材料，不记录就只能靠人工回忆和翻diff。
