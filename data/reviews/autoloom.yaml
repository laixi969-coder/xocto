  current_alternative_en: The old way is writing commit messages by hand, reading diffs, or patching records
    through generic version control and review processes.
  usage_reason: 相较人工补写提交说明和翻diff，它把基线与证据记录放进AI执行的同一步，减少事后追溯这一步，因此受评审或审计约束的团队会在引入AI改代码时选择它。这是基于产品能力的推断。
  usage_reason_en: Compared with manually writing commit messages and reading diffs, it puts baseline
    and evidence recording into the same step as AI execution, cutting the after-the-fact tracing step,
    so teams under review or audit constraints would choose it when introducing AI code changes. This
    is an inference from product capability.
