  market: ''
  job: 自托管或多机部署 AI agent 的开发者，在需要让不同机器上的 agent 互相请求协助时，处理跨主机的调用与网络连通问题，完成一次 agent 间的任务转交。
  job_en: Developers self-hosting or multi-host deploying AI agents, when one agent needs help from another
    on a different machine, handle cross-host calls and network connectivity to complete a task handoff
    between agents.
  pain: 跨机器调用 agent 需要自己搭网络、鉴权和路由，缺少现成通道，调试成本高。
  pain_en: Calling agents across machines requires building networking, auth and routing yourself, with
    no ready-made channel and high debugging cost.
  current_alternative: 自己写脚本加 SSH 或内网穿透，或把 agent 都塞进同一台机器和同一个编排框架里。
  current_alternative_en: Writing scripts with SSH or tunnels, or cramming all agents onto one machine
    and one orchestration framework.
  usage_reason: 推断：它把跨机 agent 调用封装成基于 Tailscale 的现成通道，省掉自建网络与鉴权这一步，因此已有自托管模型、又需要多机协作的团队会先试用它；但公开材料没有留存或重复使用证据。
  usage_reason_en: 'Inference: it wraps cross-host agent calls into a ready channel built on Tailscale,
    removing the step of building networking and auth yourself, so teams that already self-host models
    and need multi-machine collaboration would try it first; public material shows no retention or repeat-use
    evidence.'
