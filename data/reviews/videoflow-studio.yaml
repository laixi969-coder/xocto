  market: ''
  job: 创业公司市场负责人或创始人在准备产品发布、融资或投放时，需要一条能对外发布的宣传片，手上只有公司官网和产品介绍材料。
  job_en: A startup marketing lead or founder preparing a launch, fundraise or ad campaign needs a publishable
    trailer, holding only the company website and product copy.
  pain: 公开材料只说明输入网址得到预告片，没有说明它替代了哪一步旧工作、成片质量如何、是否需要重剪，痛点强度无法从现有事实判断。
  pain_en: Public material only says a URL yields a trailer; it does not show which old step is replaced,
    how good the output is, or whether re-editing is needed, so pain intensity cannot be judged from available
    facts.
  current_alternative: 旧做法通常是外包给剪辑师或使用通用视频模板工具，按条付费并经历多轮修改；这一替代路径在候选材料中未被提及，属于推断。
  current_alternative_en: The old path is usually outsourcing to an editor or using generic video template
    tools, paying per clip with revision rounds; this alternative is not mentioned in the candidate material
    and is inference.
  usage_reason: 推断：如果它真能从官网内容直接产出可投放的成片，就省去写脚本、找素材、初剪这几步，让没有视频团队的早期公司自己出片；但缺少成片质量与人工确认环节的公开证据，无法确认用户会持续选择它。
  usage_reason_en: 'Inference: if it truly turns site content into a publishable clip, it removes scriptwriting,
    asset sourcing and first-cut editing, letting early teams without video staff produce trailers themselves;
    but public evidence on output quality and human review is missing, so continued adoption cannot be
    confirmed.'
