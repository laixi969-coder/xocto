  market: ''
  job: Etsy 独立卖家在买家就订单、物流或商品细节发来咨询时，需要逐条撰写语气得体、符合店铺风格的回复，以维持响应速度和店铺评分。
  job_en: Independent Etsy sellers must write well-toned, shop-consistent replies one by one when buyers
    ask about orders, shipping or product details, in order to keep response speed and shop ratings.
  pain: 个人卖家往往一人兼顾发货与客服，消息积压会拖慢响应、影响评分，而每条回复都要重新组织语气和措辞，重复且耗时。
  pain_en: Solo sellers often handle shipping and support alone; a message backlog slows responses and
    hurts ratings, and each reply requires re-composing tone and wording, which is repetitive and time-consuming.
  current_alternative: 卖家目前靠手动逐条打字回复，或使用平台自带的快捷回复模板和通用聊天工具改写。
  current_alternative_en: Sellers currently type replies manually one by one, or reuse the platform's
    canned responses and general chat tools to rewrite text.
  usage_reason: 相较手动逐条撰写或套用固定模板，它直接读取买家消息并生成贴合语境的专业回复草稿，省掉从零组织措辞这一步，卖家只需确认或微调即可发送；因此消息量大、又在意回复语气的个人卖家会尝试它（基于产品能力的推断，尚无留存或付费证据）。
  usage_reason_en: Compared with writing each reply manually or pasting fixed templates, it reads the
    buyer message and drafts a context-fitting professional reply, removing the step of composing wording
    from scratch so the seller only confirms or tweaks before sending; solo sellers with high message
    volume who care about tone would try it (inference from product capability, no retention or payment
    evidence yet).
