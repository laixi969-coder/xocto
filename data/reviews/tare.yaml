  market: ''
  job: AI 应用开发者在月度额度被提前耗尽、需要排查时，处理 API 调用日志与用量记录，要定位是哪些请求或代码路径消耗了额度。
  job_en: An AI application developer, when monthly quota runs out early, works through API call logs
    and usage records to locate which requests or code paths consumed the quota.
  pain: 额度耗尽会直接中断线上功能或开发工作，而按调用量计费的账单通常只给总量，不说明来源，排查要靠人工翻日志。
  pain_en: Running out of quota interrupts live features or development work, while usage-based billing
    usually shows only totals, not sources, forcing manual log digging.
  current_alternative: 目前多靠云厂商账单页、自建日志脚本或凭经验猜测，缺少把消耗归因到具体调用来源的现成做法。
  current_alternative_en: Today teams rely on cloud billing pages, self-written log scripts, or guesswork,
    with no ready way to attribute consumption to specific call sources.
  usage_reason: 推断：相较人工翻账单和日志，tare 把调用记录直接归因到具体来源，省掉逐条比对日志这一步，因此额度频繁触顶、又需要向团队解释成本去向的开发者会先试用它。
  usage_reason_en: 'Inference: compared with manually reading bills and logs, tare attributes call records
    directly to specific sources, removing the step of matching log lines one by one, so developers who
    hit quota limits often and must explain cost to their team would try it first.'
