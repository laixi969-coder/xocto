  market: ''
  job: AI产品负责人或合规负责人在需要向客户、采购方或监管方说明模型治理方式时，处理治理原则与模型信息，要产出一份可公开引用的披露材料。
  job_en: An AI product or compliance lead who must explain model governance to customers, procurement
    or regulators handles governance principles and model information to produce publicly citable disclosure
    material.
  pain: 缺少统一、通俗、可公开核验的模型治理披露口径，各方自述标准不一，采购方难以比对。
  pain_en: There is no unified, plain-language, publicly checkable disclosure standard for model governance,
    so each party describes itself differently and buyers cannot compare.
  current_alternative: 目前多依赖厂商自己的合规页面、白皮书或第三方审计报告，格式和口径各不相同。
  current_alternative_en: Today this relies on vendors' own compliance pages, white papers or third-party
    audit reports, each with different formats and scopes.
  usage_reason: 推断：相较各家自述文档，它把治理原则和登记条目放在同一公开位置，减少采购方逐家比对口径的步骤；但登记是否被采用、由谁审核尚无公开证据，因此哪类用户会真正选择它仍不明确。
  usage_reason_en: 'Inference: compared with separate self-reported documents, it puts principles and
    registry entries in one public place, cutting the step of comparing each vendor''s wording; however
    there is no public evidence that the registry is adopted or who reviews it, so which users would actually
    choose it remains unclear.'
