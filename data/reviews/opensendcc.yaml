  market: ''
  job: 邮件营销运营人员在自有服务器上管理联系人名单并发送营销邮件，需要完成发送、投递与后续效果查看。
  job_en: An email marketing operator manages contact lists and sends marketing emails on their own server,
    needing to complete sending, delivery and follow-up performance review.
  pain: 使用第三方邮件 SaaS 意味着联系人数据放在外部、按量订阅成本随规模上升，且发送链路受平台政策限制。
  pain_en: Using third-party email SaaS means contact data sits outside, subscription cost rises with
    volume, and the sending pipeline is constrained by platform policy.
  current_alternative: 运营人员目前使用第三方邮件营销 SaaS，或自行搭建开源邮件发送组件并手动维护投递配置。
  current_alternative_en: Operators currently use third-party email marketing SaaS, or self-assemble open-source
    sending components and maintain delivery configuration manually.
  usage_reason: 推断：相较第三方 SaaS，它把联系人数据与发送链路放在用户自己的服务器上，减少数据外置与按量订阅这一步，因此对数据敏感或发送量大的团队有吸引力；公开材料没有客户案例或付费证据，无法确认采用。
  usage_reason_en: 'Inference: versus third-party SaaS, it keeps contact data and the sending pipeline
    on the user''s own server, removing the data-externalization and usage-based subscription step, which
    attracts data-sensitive or high-volume teams; public materials show no customer cases or payment evidence,
    so adoption is unconfirmed.'
