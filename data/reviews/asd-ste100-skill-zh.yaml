  market: ''
  job: 技术文档作者和本地化工程师在把英文受控技术写作规范落到中文说明书、维修手册或本地化稿件时，需要逐条核对用词、句长和歧义表达，产出一份可复核的合规检查结果。
  job_en: Technical writers and localization engineers applying English controlled-language rules to Chinese
    manuals, maintenance documents or localized drafts must check wording, sentence length and ambiguity
    item by item and produce a reviewable compliance result.
  pain: 受控语言规范条目多、人工逐句核对慢且容易漏，中文又没有现成的对应规则集，团队往往靠资深作者口头把关，评审结论难以复现。
  pain_en: Controlled-language rules are numerous, manual sentence-by-sentence checking is slow and error-prone,
    and no ready Chinese counterpart rule set exists, so teams rely on senior writers' verbal judgment
    and review conclusions are hard to reproduce.
  current_alternative: 现在多靠人工对照英文 STE 规范逐句改写，或使用通用拼写与风格检查工具，后者不理解受控语言的句长、单义动词等约束。
  current_alternative_en: Today teams rewrite sentence by sentence against the English STE standard by
    hand, or use generic spelling and style checkers that do not understand controlled-language constraints
    such as sentence length and single-meaning verbs.
  usage_reason: 相较人工逐句比对，它把规则固化成确定性 linter，一次扫描直接指出违规位置，省掉通读全文找问题的步骤，因此文档评审阶段需要快速出合规结论的团队会先试它；这是基于产品能力的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with manual sentence-by-sentence comparison, it hardcodes the rules into a
    deterministic linter that points to violations in one scan, removing the step of reading the whole
    text to find problems, so teams needing a fast compliance verdict at review time would try it first;
    this is an inference from product capability, not user feedback.
