  market: ''
  job: 产品营销人员在发布新品时，需要把已有的产品演示视频放到目标观众能看到的地方，并判断哪条演示更受关注。
  job_en: During a launch, product marketers need to place existing product demo videos where the intended
    audience can see them and judge which demo draws more attention.
  pain: 演示视频散落在官网、销售邮件和社交账号里，发布者难以知道哪条被真正看完、哪条带来兴趣。
  pain_en: Demo videos are scattered across websites, sales emails and social accounts, so publishers
    struggle to know which ones are actually watched and which generate interest.
  current_alternative: 把演示视频放在官网产品页、YouTube 频道或销售邮件里，靠播放量和人工反馈判断效果。
  current_alternative_en: Hosting demo videos on product pages, YouTube channels or in sales emails, judging
    effect by view counts and manual feedback.
  usage_reason: 推断：如果观众投票排序能替代发布者自己挑选和推广演示视频这一步，营销人员可能愿意把新演示投到这类频道；但公开材料未说明投稿、投票与转化之间如何衔接，也没有留存或复购证据，因此无法确认用户会持续使用。
  usage_reason_en: 'Inference: if audience voting can replace the step where publishers pick and promote
    demos themselves, marketers might submit new demos to such a channel; however, public material does
    not explain how submission, voting and conversion connect, and there is no retention or repeat-use
    evidence, so continued use cannot be confirmed.'
