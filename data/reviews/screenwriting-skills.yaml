  market: ''
  job: 编剧或剧本策划在写电影剧本、电视剧分集或戏剧构作材料时，需要把已有的故事设定、人物和草稿整理成符合行业格式的剧本或分集文本。
  job_en: A screenwriter or script developer drafting a film screenplay, TV episode or dramaturgy material
    needs to turn existing story setup, characters and drafts into script or episode text that follows
    industry formats.
  pain: 剧本写作有大量格式、结构和分集节奏的重复性规范工作，编剧往往要在创作和格式整理之间来回切换，靠通用助手很难稳定贴合这些行业惯例。
  pain_en: Screenwriting involves heavy repetitive work on format, structure and episodic pacing, forcing
    writers to switch between creating and formatting, and general assistants rarely hold to these industry
    conventions reliably.
  current_alternative: 编剧目前多用通用写作助手、模板文档或自己维护的格式文件来整理剧本，行业规范靠个人经验口口相传。
  current_alternative_en: Writers currently use general writing assistants, template documents or self-maintained
    format files, with industry conventions passed on through personal experience.
  usage_reason: 推断：相较通用助手，这套技能把编剧、电视剧写作和戏剧构作的规范预先固化，编剧不必每次重新交代格式和结构要求，因此更可能被需要稳定产出分集材料的编剧或内容团队选用；但公开材料没有用户反馈或采用数据，这一判断来自工作流结构推理。
  usage_reason_en: 'Inference: compared with general assistants, these skills pre-encode screenwriting,
    TV writing and dramaturgy conventions so writers do not have to restate format and structure each
    time, which is why writers or content teams needing steady episode output may choose it; the public
    material has no user feedback or adoption data, so this comes from workflow reasoning.'
