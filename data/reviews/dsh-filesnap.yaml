  market: ''
  job: 使用 DeepSeek Harness 的开发者在一轮对话把多个文件改坏后，需要把对话和文件一起退回到改动之前的状态。
  job_en: A developer using DeepSeek Harness whose files were broken during a session needs to roll the
    conversation and files back to the state before the change.
  pain: 代理批量改文件后很难逐一手工还原，没有 git 仓库时几乎无法回退，只能凭记忆重写。
