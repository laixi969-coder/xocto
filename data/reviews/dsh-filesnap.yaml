    is nearly impossible, forcing rewrites from memory.
  current_alternative: 用 git 提交或手动备份文件，再逐个还原被改动的文件。
  current_alternative_en: Using git commits or manual file backups, then restoring each changed file by
    hand.
  usage_reason: 推断：它把对话轮次与文件改动绑定记录，一次操作即可整体回退并支持撤销，省去逐文件比对和手工还原这一步，因此没有用 git 管理、又频繁让代理改文件的开发者会在出错时选择它；公开材料未提供用户反馈或重复使用证据。
  usage_reason_en: 'Inference: it records conversation turns together with file changes so one action
    rolls everything back and can be undone, removing per-file comparison and manual restoration. Developers
    who do not use git but let agents edit files often would choose it when something breaks; no user
