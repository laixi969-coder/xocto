  market: ''
  job: 社交媒体运营者在做下一轮选题规划时，需要从自己或竞品的 Instagram、YouTube 历史内容中找出表现最好的那些，用来决定复制哪种题材。
  job_en: A social media operator planning the next content cycle needs to find the best-performing posts
    from their own or competitors' Instagram and YouTube history to decide which topic to repeat.
  pain: 公开材料只说明它能找高表现内容，没有说明原来这一步由谁、用什么工具、花多久完成，也没有用户抱怨或替代行为的记录，痛点强度无法判断。
  pain_en: The public material only says it finds top-performing content; it does not say who did this
    before, with what tool, or how long it took, and there is no record of user complaints or workarounds,
    so pain intensity cannot be judged.
  current_alternative: 可推断的旧做法是人工翻看平台后台数据或第三方分析工具，逐条比对播放与互动数据；这是推断，材料未给出。
  current_alternative_en: The inferred old approach is manually browsing platform analytics or third-party
    tools and comparing views and engagement post by post; this is inference, not stated in the material.
  usage_reason: 若它能把跨平台历史内容直接排成一份高表现清单，就省掉逐条翻后台比对这一步，选题会的人可能在复盘环节选它；但材料未给出任何用户反馈，这只是推断。
  usage_reason_en: If it turns cross-platform history into a single ranked list, it removes the step of
    manually comparing each post in the dashboard, so content planners might pick it during review; but
    no user feedback is given, so this is inference only.
