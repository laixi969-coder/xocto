  market: ''
  job: 研发团队在自托管环境里，把需求条目交给本地运行的编码工具，产出可评审的代码改动，同时避免代码离开内网。
  job_en: Engineering teams in a self-hosted environment hand requirement items to locally running coding
    tools to produce reviewable code changes while keeping code inside their network.
  pain: 现有云端编码助手要求把代码或上下文送出内网，对代码外流敏感的团队要么放弃使用，要么在需求文档与助手之间来回搬运。
  pain_en: Existing cloud coding assistants require sending code or context outside the network, so teams
    sensitive to code leakage either give them up or shuttle back and forth between requirement documents
    and the assistant.
  current_alternative: 用云端编码助手配合手工复制需求，或让成员各自在本地终端里跑命令行工具。
  current_alternative_en: Using cloud coding assistants with manual copying of requirements, or having
    members run command-line tools in their own local terminals.
  usage_reason: 推断：相较云端助手加手工搬运，它把需求条目与本地编码工具放在同一自托管工作台里，省掉了复制需求与切换环境这一步，因此对代码外流敏感、又想让团队统一用编码工具的研发团队会选择它。
  usage_reason_en: 'Inference: compared with cloud assistants plus manual copying, it puts requirement
    items and local coding tools in one self-hosted workbench, removing the step of copying requirements
    and switching environments, so engineering teams sensitive to code leakage that still want a shared
    coding tool would choose it.'
