  market: ''
  job: 理财顾问在为客户准备会议、整理投资组合或撰写沟通材料时，需要把分散在多个系统的数据汇总成可交付的分析与说明文件。
  job_en: A financial advisor preparing client meetings, portfolio reviews or written communication needs
    to consolidate data scattered across several systems into deliverable analysis and explanatory documents.
  pain: 候选材料只说明插件提供预置工作流并接入第三方连接器，没有说明顾问原先在哪一步手工耗时、出错或返工，痛点无法从公开事实还原。
  pain_en: The candidate material only states that the plugin offers preset workflows and third-party
    connectors; it does not say which step advisors previously did by hand, where errors or rework occurred,
    so the pain cannot be reconstructed from public facts.
  current_alternative: 公开材料未披露顾问此前用什么工具或流程完成同类工作，无法确认替代对象。
  current_alternative_en: Public material does not disclose what tools or process advisors previously
    used for the same work, so the thing being replaced cannot be confirmed.
  usage_reason: 推断：若连接器能直接取到顾问日常系统里的持仓与客户数据，可省去手工导出再粘贴进模板的一步，因此已在用 Claude 生态的顾问可能先试用；但缺少定价、客户案例与重复使用证据，无法判断是否会长期留在工作流里。
  usage_reason_en: 'Inference: if the connectors can pull holdings and client data directly from the advisor''s
    existing systems, one manual export-and-paste step disappears, so advisors already inside the Claude
    ecosystem may try it first; without pricing, customer cases or repeat-use evidence, long-term retention
    in the workflow cannot be judged.'
