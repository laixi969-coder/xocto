  pain_en: Public material only states the plugin offers preset workflows and third-party connectors;
    it does not disclose which step advisors previously did by hand or where errors occurred. Structural
    inference suggests cross-system consolidation of holdings and client data into templates is repetitive
    manual transport, but pain intensity is inferred, not user-stated.
  current_alternative: 公开材料未披露顾问此前用什么工具或流程完成同类工作；结构上可推断的旧做法是手工从多个系统导出数据、在表格与文档模板间复制粘贴，再逐份撰写客户材料。
