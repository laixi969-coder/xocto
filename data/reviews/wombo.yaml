  market: ''
  job: 独立游戏开发者在制作 2D 游戏时，需要为角色、场景、UI 准备贴图，并配上音效与音轨，最终交付一套可直接导入引擎的素材。
  job_en: Indie game developers building a 2D game need textures for characters, scenes and UI plus sound
    effects and music, delivering an asset set that can be imported into the engine.
  pain: 素材来源分散，外包画师和音效库成本高、周期长，风格还容易不统一；小团队常常卡在素材产能上。
  pain_en: Asset sources are scattered, freelance artists and sound libraries are costly and slow, and
    styles drift apart; small teams often stall on asset throughput.
  current_alternative: 在素材商店购买现成素材包、外包给自由画师、使用通用图像与音频生成工具再手工拼接。
  current_alternative_en: Buying ready-made packs from asset stores, outsourcing to freelance artists,
    or using general image and audio generators and stitching results by hand.
  usage_reason: 推断：如果它能在同一处按统一风格产出图形与音效，开发者就省掉了在多个素材站比价、向画师反复描述风格这两步；但公开材料只有一句功能描述，没有素材授权、风格一致性或实际交付的证据，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if it produces graphics and SFX in one place under a consistent style,
    developers skip comparing prices across asset stores and re-describing style to artists; but the public
    material is a single feature line with no evidence on licensing, style consistency or actual delivery,
    so user choice cannot yet be confirmed.'
