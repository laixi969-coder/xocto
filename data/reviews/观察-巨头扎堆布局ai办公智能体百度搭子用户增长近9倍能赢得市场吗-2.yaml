  market: ''
  job: 办公人员或家庭成员在需要查资料、安排日程、控制家中设备时，用自然语言向百度搭子提出请求，由它处理文档、日程与设备指令，完成一次问答、一项操作或一条待办。
  job_en: An office worker or household member asks Baidu Dazi in natural language to look up information,
    schedule items or control home devices, and it handles documents, calendars and device commands to
    complete an answer, an action or a to-do.
  pain: 信息与设备分散在多个应用和硬件里，用户要自己切换、复述需求并手动执行后续动作，重复劳动多且容易漏掉。
  pain_en: Information and devices are scattered across apps and hardware, so users switch contexts, restate
    requests and execute follow-up actions manually, creating repetitive work and missed items.
  current_alternative: 用户现在用系统自带语音助手、单独打开搜索或办公软件、手动操作智能音箱与家电，或分别使用各家聊天助手。
  current_alternative_en: Users currently rely on built-in voice assistants, open search or office apps
    separately, operate smart speakers and appliances by hand, or use separate chat assistants.
  usage_reason: 相较逐个打开应用和手动操作设备，它把指令理解与设备执行放在同一入口，减少用户复述需求和在多个界面间搬运信息的那一步；推断在办公与家庭双场景下，需要频繁跨应用处理待办的人会优先选择它。
  usage_reason_en: Compared with opening each app and operating devices manually, it puts instruction
    understanding and device execution in one entry point, removing the step of restating requests and
    moving information across interfaces; by inference, people who frequently handle to-dos across apps
    in office and home settings would choose it first.
