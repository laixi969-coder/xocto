  market: ''
  job: 机器人研发团队在训练抓取与操作策略时，需要处理视频与动作数据，产出能迁移到真机、在具体工位上稳定完成操作任务的模型。
  job_en: Robotics R&D teams training grasping and manipulation policies need to process video and action
    data and produce models that transfer to real machines and reliably perform tasks at a specific station.
  pain: 真机数据采集昂贵、周期长，视频与动作混合训练容易互相干扰，导致策略在真机上不稳定，团队反复返工。
  pain_en: Real-robot data collection is expensive and slow, and mixing video and action training causes
    interference, making policies unstable on real hardware and forcing repeated rework.
  current_alternative: 目前多依赖大规模真机遥操作数据、仿真到现实的迁移，或直接采购通用具身模型再做微调。
  current_alternative_en: Today teams rely on large-scale teleoperation data, sim-to-real transfer, or
    buying a generic embodied model and fine-tuning it.
  usage_reason: 推断：相较混合训练，分阶段解耦把视频预测与动作学习分开，减少两类信号互相干扰带来的返工，因此真机数据有限、又需要在特定工位快速迭代策略的机器人团队会尝试它。材料未给出真机落地与重复使用证据，尚不能确认已进入长期工作流。
  usage_reason_en: 'Inference: versus mixed training, staged decoupling separates video prediction from
    action learning, reducing rework caused by the two signals interfering, so robotics teams with limited
    real-robot data that need fast policy iteration at a specific station would try it. No real-robot
    deployment or repeated-use evidence is given, so long-term workflow adoption cannot be confirmed.'
