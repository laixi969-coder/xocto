  market: ''
  job: 开发者在终端里运行编码代理完成页面或界面改动后，需要查看代理生成的截图、录屏和前后对比，判断改动是否符合预期再决定是否继续迭代。
  job_en: After a coding agent finishes a page or UI change in the terminal, developers need to view the
    agent-generated screenshots, recordings and before/after comparisons to judge whether the change matches
    expectations before iterating further.
  pain: 代理产出的是图像和视频，终端只能显示文本，开发者必须切到浏览器或文件管理器逐个打开文件比对，评审被打断且容易漏看视觉回归。
  pain_en: Agent output is images and video while the terminal only shows text, so developers must switch
    to a browser or file manager and open files one by one, interrupting review and risking missed visual
    regressions.
  current_alternative: 旧做法是离开终端，用系统图片查看器、视频播放器或浏览器手动打开产物，再凭肉眼比对前后版本。
  current_alternative_en: The old way is to leave the terminal and manually open artifacts in a system
    image viewer, video player or browser, then compare versions by eye.
  usage_reason: 推断：它把渲染动作放进终端，省掉切换应用和逐个找文件这一步，让开发者在同一处看到前后对比后立即决定是否继续迭代，因此常做前端或界面改动、且已用编码代理的开发者会在评审环节选择它。
  usage_reason_en: 'Inference: by rendering inside the terminal it removes the app-switching and file-hunting
    step, letting developers see the before/after comparison in place and immediately decide whether to
    iterate, so developers who frequently change front-end or UI code and already use a coding agent would
    pick it during review.'
