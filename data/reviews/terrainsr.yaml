  market: ''
  job: 游戏或影视场景美术在制作地形时，处理低分辨率高度图，把它变成可用于地形生成的高精度高度图。
  job_en: A game or film environment artist making terrain takes a low-resolution heightmap and turns
    it into a high-resolution heightmap usable for terrain generation.
  pain: 手工雕刻或重绘高精度地形耗时，低分辨率高度图直接放大后细节模糊、不真实。
  pain_en: Sculpting or repainting high-resolution terrain by hand is time-consuming, and simply enlarging
    a low-resolution heightmap yields blurry, unrealistic detail.
  current_alternative: 在三维软件里手工雕刻地形，或使用传统插值放大后再手动补细节。
  current_alternative_en: Sculpting terrain by hand in 3D software, or using traditional interpolation
    upscaling and then adding detail manually.
  usage_reason: 推断：相较手工雕刻和传统插值放大，它直接对高度图做超分并输出更真实的地形细节，省去逐块补细节这一步，因此独立游戏团队和虚拟制片美术会在需要快速铺大量地形时选择它；尚无付费或留存证据。
  usage_reason_en: 'Inference: versus hand sculpting and traditional interpolation, it upscales the heightmap
    directly and outputs more realistic terrain detail, removing the step of patching detail piece by
    piece, so indie game teams and virtual-production artists may choose it when laying out large amounts
    of terrain quickly; no payment or retention evidence yet.'
