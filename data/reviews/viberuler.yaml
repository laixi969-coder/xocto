  market: ''
  job: 使用 AI 编码助手的开发者，在长会话中上下文被占满、补全或生成质量下降时，需要弄清上下文里各部分占用了多少，以便决定删减什么。
  job_en: Developers using AI coding assistants, when a long session fills the context and completion
    or generation quality drops, need to know how much each part of the context occupies in order to decide
    what to cut.
  pain: 上下文窗口有限，塞入过多文件或历史会让模型输出变差，但开发者看不到占用分布，只能凭感觉删减。
  pain_en: Context windows are limited; stuffing in too many files or history degrades model output, yet
    developers cannot see the occupancy breakdown and can only cut by feel.
  current_alternative: 目前多靠手动精简提示、凭经验删文件，或直接开新会话重来。
  current_alternative_en: Today most people manually trim prompts, delete files by experience, or simply
    start a new session.
  usage_reason: 推断：相比凭感觉删减，它把上下文占用拆成可查看的度量，让开发者在删减前先看到哪一部分占得多，从而减少反复试错；但公开材料未给出度量口径与实测效果，是否真能改善输出仍缺证据。
  usage_reason_en: 'Inference: compared with cutting by feel, it breaks context occupancy into a viewable
    measurement so developers can see which part dominates before trimming, reducing trial and error;
    however, public materials give no measurement method or tested effect, so whether output actually
    improves lacks evidence.'
