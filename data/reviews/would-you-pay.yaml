    nobody will pay; public materials do not explain how this product eases that pain.
  current_alternative: 旧做法是直接开发出最小版本再找用户，或在社群和朋友圈里口头询问意见。
  current_alternative_en: The old approach is to build a minimum version first and then look for users,
    or to ask for opinions informally in communities and personal networks.
  usage_reason: 推断：若它能把产品构想转成具体的付费人群判断，开发者可在写代码前少走一轮试错；但公开材料未说明输入、判断依据与交付形式，无法确认它比口头询问多解决了哪一步。
  usage_reason_en: 'Inference: if it turns a product concept into a concrete paying-audience judgment,
