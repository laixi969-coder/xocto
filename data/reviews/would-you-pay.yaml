  job_en: An independent developer, before spending weeks building an unvalidated product idea, works
    on their own product concept to judge whether anyone would pay for it.
  pain: 开发者常在没有付费证据的情况下投入大量时间，做完才发现没人买单；公开材料未说明该产品如何缓解这一痛点。
