  market: ''
  job: 开发者在本地同时运行多个编码智能体处理不同任务时，需要判断哪个任务已完成、哪个卡住或报错，以便决定下一步是继续等待还是介入处理。
  job_en: A developer running several coding agents locally on different tasks needs to tell which task
    has finished and which is stuck or failing, in order to decide whether to keep waiting or step in.
  pain: 状态只存在于各自的终端窗口或编辑器面板里，用户必须反复切换窗口或滚动日志才能确认进度，长任务等待期间注意力被切碎，容易漏掉失败或空等。
