    to each terminal window to check, and with several tasks it is easy to miss one that finished or stalled.
  current_alternative: 现在的做法是手动切换终端标签页、看日志输出，或者干脆只跑一个代理以免混乱。
  current_alternative_en: The current practice is manually switching terminal tabs, reading log output,
    or simply running one agent at a time to avoid confusion.
  usage_reason: 推断：它把状态从需要主动查看的终端输出，变成常驻在 Dock 旁的被动可见信号，省掉反复切窗口确认这一步，因此同时跑多个代理的开发者会愿意把它挂在桌面上。
  usage_reason_en: 'Inference: it turns status from terminal output the user must actively check into
    a passively visible signal beside the Dock, removing the step of repeatedly switching windows, so
    developers running several agents at once would keep it on their desktop.'
