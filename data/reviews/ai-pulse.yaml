  market: ''
  job: 开发者在本地同时运行多个编码代理时，需要在不离开当前窗口的情况下知道每个代理是运行中、已完成还是出错，以便决定下一步是等待、接管还是重开任务。
  job_en: When a developer runs several coding agents locally at once, they need to know whether each
    agent is running, finished or failed without leaving the current window, so they can decide whether
    to wait, take over or restart the task.
  pain: 代理在后台跑时状态不可见，开发者只能反复切回各个终端窗口确认，任务一多就容易漏掉已经结束或卡住的代理。
