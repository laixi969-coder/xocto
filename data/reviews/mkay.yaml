  market: ''
  job: 软件工程师在离开工位、只有手机的情况下，需要把新的修改要求或补充说明传达给正在运行的多个编码 agent，让它们继续推进任务。
  job_en: A software engineer away from the desk with only a phone needs to pass new change requests or
    clarifications to several running coding agents so they keep making progress.
  pain: 编码 agent 通常挂在电脑上的终端或编辑器里，人一离开就无法查看进度或追加指令，任务容易停在半途。
  pain_en: Coding agents usually live in a terminal or editor on the computer, so once the person leaves
    they cannot check progress or add instructions, and tasks stall halfway.
  current_alternative: 现在的做法是留在电脑前盯着，或用远程桌面、聊天工具手动把指令复制给某个 agent。
  current_alternative_en: The current practice is to stay at the computer, or to use remote desktop and
    chat tools to manually copy instructions to one agent.
  usage_reason: 推断：相较远程桌面或逐个 agent 手动转发，它把语音指令直接分派到对应 agent，省掉打开终端、找到会话、粘贴指令这几步，因此经常需要离开工位又不想中断编码任务的开发者会尝试它；公开材料没有留存或复购证据，长期使用尚不能确认。
  usage_reason_en: 'Inference: compared with remote desktop or manually forwarding to each agent, it routes
    a spoken instruction straight to the right agent, skipping the steps of opening a terminal, finding
    the session and pasting the command, so developers who often leave the desk but do not want to interrupt
    coding work would try it; the public material has no retention or repeat-use evidence, so long-term
    use cannot be confirmed.'
