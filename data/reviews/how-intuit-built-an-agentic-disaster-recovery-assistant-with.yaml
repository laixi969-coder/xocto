  market: ''
  job: 值班工程师在生产事故或容灾演练中安全、快速地完成服务故障切换。
  job_en: On-call engineers safely and quickly complete production failovers during incidents or DR drills.
  pain: 手工照 runbook 执行切换步骤多、易出错、耗时长，事故高压下风险大，且每一步都要事后补审计。
  pain_en: Manual runbook execution involves many error-prone, slow steps; under incident pressure the
    risk is high, and every action needs retrospective auditing.
  current_alternative: 工程师按 runbook 文档手工逐步操作，配合审批工单、多人盯守和事后审计。
  current_alternative_en: Engineers manually follow runbook documents step by step, with approval tickets,
    extra people on watch, and after-the-fact audits.
  usage_reason: 用一句自然语言发起切换，策略约束下自动执行并自动留审计记录，响应更快、合规可查，演练门槛也更低。
  usage_reason_en: 'A single plain-language request triggers policy-bound automated execution with built-in
    audit trails: faster response, verifiable compliance, and lower-friction drills.'
