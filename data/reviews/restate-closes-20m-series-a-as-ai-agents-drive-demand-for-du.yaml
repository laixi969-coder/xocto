  market: ''
  job: 后端工程师在把 AI 智能体接入需要多步调用外部系统的业务流程时，处理编排代码与失败重试，要完成一次可恢复、可追踪的完整执行。
  job_en: Backend engineers wiring AI agents into multi-step business processes that call external systems
    handle orchestration code and failure retries to complete one recoverable, traceable execution.
  pain: 长流程中任一步失败都会让整条智能体任务作废，人工排查和重跑成本高；公开材料未说明具体痛点强度。
  pain_en: Any failed step in a long flow invalidates the whole agent task, and manual diagnosis plus
    reruns are costly; public material does not show how acute this pain is.
  current_alternative: 自建重试与状态存储逻辑，或使用已有的工作流引擎和队列系统。
  current_alternative_en: Hand-rolled retry and state storage, or existing workflow engines and queue
    systems.
  usage_reason: 推断：相较自建重试逻辑，它把状态持久化和恢复交给框架，减少工程师自己写幂等与补偿代码这一步，因此构建长流程智能体的团队可能选择它；缺少用户反馈与留存证据。
  usage_reason_en: 'Inference: versus hand-rolled retries, it moves state persistence and recovery into
    the framework, removing the step of writing idempotency and compensation code, so teams building long-running
    agents may choose it; user feedback and retention evidence are missing.'
