  market: ''
  job: 全科与专科医生在门诊、问诊或远程医疗通话过程中，处理医患对话音频与既往病史材料，要完成一份可核对、可入档的结构化病历记录。
  job_en: General and specialist physicians handling doctor-patient conversation audio and prior history
    during in-person or telehealth consultations, needing to produce a reviewable, fileable structured
    clinical note.
  pain: 问诊时同步记录会打断与患者的交流，事后补写占用大量非诊疗时间；遗漏、措辞不规范还会带来病历合规风险。公开材料支持其定位为减少文书与行政负担，但未给出医生自述的痛点强度数据。
  pain_en: Writing during a consultation interrupts patient interaction, back-filling notes consumes large
    amounts of non-clinical time, and omissions or non-standard wording create documentation compliance
