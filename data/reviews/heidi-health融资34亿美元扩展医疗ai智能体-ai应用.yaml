  usage_reason_en: 'Inference: compared with generic transcription that returns spoken text, it turns
    the conversation directly into a structured note draft, removing the step of reshaping speech into
    note format, and supports dictating anywhere on screen and capturing telehealth audio without a second
    login, so clinicians who need a draft while consulting would choose it in in-person or telehealth
