  market: ''
  job: 全科与专科医生在门诊或问诊过程中，处理医患对话与既往病史材料，要完成一份可入档的结构化病历记录。
  job_en: General and specialist physicians handling doctor-patient dialogue and prior history during
    consultations, needing to produce a structured, fileable clinical note.
  pain: 问诊时同时记录会打断与患者的交流，事后补写又占用大量非诊疗时间，且遗漏与措辞不规范会带来合规风险。
  pain_en: Writing while consulting interrupts patient interaction, back-filling notes consumes large
    amounts of non-clinical time, and omissions or non-standard wording create compliance risk.
  current_alternative: 医生手写或键盘录入病历，或使用通用语音转写工具后再人工整理成病历格式。
  current_alternative_en: Physicians hand-write or type notes, or use generic speech-to-text tools and
    then manually reshape the text into note format.
  usage_reason: 相较通用转写工具只给出一段口语文本，它把对话直接整理成病历结构草稿，减少医生从口语文本重排为病历格式这一步；推断，公开材料未提供用户反馈或留存数据。
  usage_reason_en: Compared with generic transcription that returns a block of spoken text, it turns the
    conversation directly into a structured note draft, removing the step of reshaping speech into note
    format; this is inference, as no user feedback or retention data is public.
