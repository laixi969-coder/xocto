  market: ''
  job: 开发者或隐私敏感团队在需要让 agent 处理不便上传的本地材料时，打开浏览器页面运行模型，完成一次对话或文档处理任务。
  job_en: A developer or privacy-sensitive team opens a browser page to run the model and complete a chat
    or document task on local material that cannot be uploaded.
  pain: 云端推理要把材料发到第三方，本地部署又要装环境、配显卡，两者都有摩擦；但公开材料未说明具体是谁在什么场景下被卡住。
  pain_en: Cloud inference requires sending material to a third party, while local deployment needs environment
    setup and GPU configuration; the public material does not say who is actually blocked in which scenario.
  current_alternative: 用云端 API 调用模型，或本地装 Ollama 一类运行时；也有人直接用网页版通用助手。
  current_alternative_en: Calling a cloud model API, running a local runtime such as Ollama, or simply
    using a web-based general assistant.
  usage_reason: 推断：相较云端 API，它在浏览器内完成推理，材料不出设备，省掉上传与本地安装两步；但缺少使用数据与场景证据，尚不能确认哪类用户会持续选择它。
  usage_reason_en: 'Inference: versus a cloud API it runs inference in the browser so material never leaves
    the device, removing upload and local-install steps; without usage data or scenario evidence it is
    unclear which users would keep choosing it.'
