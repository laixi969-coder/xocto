  market: ''
  job: 仍在使用 2007 年前后诺基亚 S40/S60 功能机的人，在设备已无法访问 Google 搜索时，想就日常问题获得一段文字答案。
  job_en: People still using Nokia S40/S60 feature phones from around 2007, when the device can no longer
    reach Google search, want a text answer to everyday questions.
  pain: 公开事实是这些老设备上的搜索入口已经失效，用户要么换机、要么靠记忆或他人转述；但公开材料未显示这种查询是高频刚需，也未显示不解决会造成明确后果。
  pain_en: Public facts show the search entry point on these old devices has stopped working, so users
    either switch devices or rely on memory and second-hand answers; but public materials do not show
    this lookup is a high-frequency necessity or that leaving it unsolved has clear consequences.
  current_alternative: 换智能机、借他人设备查询，或干脆不查；公开材料未说明用户已为在老功能机上恢复搜索而采取持续行为。
  current_alternative_en: Switching to a smartphone, borrowing another device to look things up, or simply
    not looking it up; public materials do not show users taking sustained action to restore search on
    an old feature phone.
  usage_reason: 推断：它通过 J2ME 应用加自建 Go 服务器把问题转给多个模型并回传文字，省去换设备这一步；但公开材料只显示 311 星的技术围观，未显示有人因日常必需而持续使用，因此更像怀旧或技术演示而非刚性选择。
  usage_reason_en: 'Inference: it relays questions to several models via a J2ME app plus a self-hosted
    Go server and returns text, removing the step of replacing the device; but public materials show only
    311 stars of technical interest, not sustained use driven by daily necessity, so it reads more as
    nostalgia or a demo than a rigid choice.'
