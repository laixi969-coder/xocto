  market: ''
  job: 法务、合规或合同审阅人员在拿到一份长文档（合同、法规、内部政策）后，需要就某个具体说法或条款追问“这句话出自哪里”，并拿到可引用的原文位置，用于回复同事、客户或监管问询。
  job_en: Legal, compliance, or contract-review staff who receive a long document (contract, regulation,
    internal policy) need to ask where a specific claim or clause is stated and get a citable source location,
    in order to answer colleagues, clients, or regulators.
  pain: 人工在长文档里逐页检索、比对措辞，既慢又容易漏；一旦引用错位置，在合规或合同场景会带来返工与责任风险，因此“出处可核对”本身是刚性要求。
  pain_en: Manually scanning long documents page by page is slow and error-prone; a wrong citation in
    compliance or contract work causes rework and liability, so verifiable provenance is itself a hard
    requirement.
  current_alternative: 目前主要靠 Ctrl+F 关键词检索、人工通读、目录与批注，或把文档丢给通用聊天机器人后自行回原文核对出处。
  current_alternative_en: Today users rely on Ctrl+F keyword search, manual reading, tables of contents
    and annotations, or pasting the document into a general chatbot and then manually verifying the citation
    against the source.
  usage_reason: 推断：相较通用问答式工具只给一段可能无出处的答案，Sezwhere 把动作收敛为“提问—返回文档内对应原文位置”，省掉用户回原文逐段反查出处这一步，因此需要可追溯引用的法务与合规人员会在核对条款出处时选择它；公开材料尚未给出用户自述或留存证据。
  usage_reason_en: 'Inference: unlike general Q&A tools that return an answer without provenance, Sezwhere
    narrows the action to ''ask a question, get the matching source location in the document'', removing
    the step of manually re-locating the citation; that is why provenance-sensitive legal and compliance
    users would pick it for clause verification. Public materials do not yet include user statements or
    retention evidence.'
