  market: ''
  job: 语音客服或语音助手的开发者，在需要把电话或语音入口接进自家业务系统时，处理通话音频与对话流程，要交付一个能稳定接起、听懂并完成预约或查询的语音智能体。
  job_en: Developers of voice customer service or voice assistants who need to connect phone or voice
    entry points into their own business systems, handling call audio and dialogue flows to deliver an
    agent that reliably answers, understands and completes a booking or lookup.
  pain: 从零搭建语音链路要分别处理识别、对话状态、打断与合成，调试周期长，且各组件版本与部署方式容易互相冲突。
  pain_en: Building a voice pipeline from scratch means separately handling recognition, dialogue state,
    interruption and synthesis, with long debugging cycles and frequent conflicts between component versions
    and deployment methods.
  current_alternative: 开发者通常自己拼装开源语音组件，或直接采购闭源语音客服 SaaS，前者费时、后者难以深度定制。
  current_alternative_en: Developers usually assemble open-source speech components themselves or buy
    closed-source voice customer-service SaaS; the former is time-consuming and the latter hard to customise
    deeply.
  usage_reason: 推断：相较自行拼装，这个示例把语音链路的关键环节预先接好，开发者可以直接在既有骨架上替换业务对话逻辑，省去从零打通识别与合成的调试步骤，因此需要快速验证语音场景的团队会先拿它试跑。
  usage_reason_en: 'Inference: compared with assembling components, this sample pre-wires the key stages
    of the voice pipeline so developers can swap in their own business dialogue logic, skipping the debugging
    needed to connect recognition and synthesis from scratch; teams that need to validate a voice scenario
    quickly would try it first.'
