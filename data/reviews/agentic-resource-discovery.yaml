  market: ''
  job: AI 工程师或后端开发者在构建多工具智能体系统时，需要按功能描述跨公开 ARD 注册表与各 MCP 服务端检索可调用工具，拿到经校验的端点与工具清单，供 Agent 运行时动态调度。
  job_en: AI engineers and backend developers building multi-tool agent systems need to search public
    ARD registries and MCP servers by capability description, then obtain verified endpoints and tool
    lists for runtime dispatch.
  pain: 公开材料仅说明智能体需自主使用工具并采取行动，未提供工具散落、接口不一致或人工硬编码连接的具体用户抱怨；痛点由工作流结构推理得出：工具分散在多个注册表、各服务端 tools/list 结构不一，人工逐个核对成本高且易失效。
  pain_en: 'Public sources only describe agents using tools autonomously; no user complaint about scattered
    tools or inconsistent interfaces is documented. The pain is inferred from workflow structure: tools
    spread across registries with varying tools/list schemas make manual verification costly and brittle.'
  current_alternative: 推断：开发者手动查阅各注册表文档，把固定 MCP 服务器端点写死在代码里，工具变更后需人工重新核对。
  current_alternative_en: 'Inferred: developers manually read registry docs and hardcode fixed MCP server
    endpoints, re-checking by hand when tools change.'
  usage_reason: 推断：相较手工查文档写死端点，它把跨注册表检索与读取各服务端 tools/list 的校验合并为一次调用，省去逐个核对接口结构这一步，因此需要频繁接入新工具的多工具 Agent
    开发者会在工具集变动时选择它。
  usage_reason_en: 'Inferred: versus manually reading docs and hardcoding endpoints, it merges cross-registry
    search and tools/list verification into one call, removing the per-server schema check, so multi-tool
    agent developers who frequently add tools would choose it when their toolset changes.'
