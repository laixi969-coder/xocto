  market: ''
  job: AI 工程师或后端开发者在搭建多工具智能体时，需要根据任务描述在运行时跨公开 ARD 注册表与各 MCP 服务端 tools/list 检索并校验可调用的工具端点，再交给 Agent 运行时动态调度。
  job_en: AI engineers or backend developers building multi-tool agents need to search public ARD registries
    and each MCP server's tools/list at runtime, verify callable tool endpoints, and hand them to the
    agent runtime for dynamic dispatch.
  pain: 公开材料显示智能体需要自主规划步骤并调用真实工具（API、文件、浏览器、代码）并观察结果后调整，而 MCP 工具散落在不同注册表、接口结构缺乏统一校验，开发者只能逐个查阅文档并写死连接，工具不可用或结构不符时只能在运行时失败后排查。
  pain_en: Public material shows agents must plan steps, call real tools (APIs, files, browsers, code)
    and adjust after observing results; yet MCP tools are scattered across registries with no unified
    verification of interface structure, so developers read docs one by one and hardcode connections,
    discovering unusable or mismatched tools only after runtime failure.
  current_alternative: 开发者手动在各注册表与文档间查找 MCP 服务器，把固定端点写死在代码里；微软 2025 年推出的 NLWeb 也以 RSS 式接口做语义检索，属于同类替代方向。
  current_alternative_en: Developers manually search registries and docs for MCP servers and hardcode
    fixed endpoints; Microsoft's 2025 NLWeb also offers RSS-like interfaces for semantic lookup, a comparable
    alternative direction.
  usage_reason: 推断：相较手动查文档写死端点，该索引通过联邦检索跨注册表一次取回候选，并直接读取每个 MCP 服务端自身的 tools/list 做接口校验，把“逐个核对文档、运行时才发现工具不可用”这一步前移到检索阶段，因此构建多工具
    Agent、需要动态换用工具的开发者会在工具选择环节选用它。
  usage_reason_en: 'Inference: versus manually reading docs and hardcoding endpoints, the index federates
    search across registries in one pass and reads each MCP server''s own tools/list to verify interfaces,
    moving the ''check docs one by one, discover broken tools at runtime'' step forward into retrieval;
    developers building multi-tool agents that swap tools dynamically would choose it at the tool-selection
    step.'
