  market: ''
  job: 软件团队在多个编码代理并行修改同一代码库时，需要让各代理的动作彼此可见并收敛成可用的改动。
  job_en: Software teams need the actions of multiple parallel coding agents on one codebase to be mutually
    visible and converged into usable changes.
  pain: 多个代理各自改代码会互相覆盖、重复劳动，团队要人工比对和合并，返工成本高。
