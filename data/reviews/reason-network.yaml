    and merge, which drives rework cost.
  current_alternative: 旧做法是人工拆分任务、逐个代理串行执行，再靠版本控制和代码评审手工合并。
  current_alternative_en: The old way is to split tasks by hand, run agents one at a time, and merge manually
    through version control and code review.
  usage_reason: 推断：它让代理之间直接通信来协调动作，省去团队手工拆分任务和逐轮比对合并这一步；已在并行使用多个代理的团队在冲突频繁时会选择它。公开材料未给出留存或客户案例。
  usage_reason_en: 'Inference: it lets agents communicate directly to coordinate actions, removing the
    manual task-splitting and round-by-round merge step; teams already running several agents in parallel
    would pick it when conflicts are frequent. No retention or customer evidence is public.'
