  market: ''
  job: 做访谈、播客或会议记录的人，在拿到 ASR 原始转写后，需要把口语、错字和断句整理成可直接发布或归档的文稿。
  job_en: People producing interviews, podcasts or meeting notes need to turn raw ASR output into a document
    that can be published or archived directly.
  pain: 原始转写充满口语重复、错别字和错误断句，人工逐句校对耗时，且这部分工作重复度极高。
  pain_en: Raw transcripts are full of verbal repetition, misrecognized words and wrong sentence breaks;
    proofreading line by line is slow and highly repetitive.
  current_alternative: 人工在文档里逐句修改，或把文本粘进通用聊天助手反复提示。
  current_alternative_en: Editing sentence by sentence in a document, or pasting the text into a general
    chat assistant with repeated prompts.
  usage_reason: 推断：相较人工逐句校对或通用助手反复提示，它把清洗与规范化固定成一次转写后处理，减少重复提示与格式返工，因此转写稿量大的内容团队会在拿到原始转写后直接走这一步。
  usage_reason_en: 'Inference: versus manual line-by-line editing or repeated prompting in a general assistant,
    it fixes cleanup and normalization as a single post-transcription step, cutting repeated prompting
    and format rework, so content teams with high transcript volume would run it right after transcription.'
