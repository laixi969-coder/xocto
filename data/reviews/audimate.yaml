    the material does not say at which step or how often this pain occurs.
  current_alternative: 现在多是把内容复制到通用聊天助手处理后再贴回业务应用，或使用应用自带的简单自动化规则。
  current_alternative_en: Today people copy content into a general chat assistant and paste it back, or
    use the simple automation rules built into the app.
  usage_reason: 相较复制到外部助手再贴回，它把处理动作留在原应用内，省掉一次切换与粘贴，因此高频处理应用内文本的用户可能选择它；但材料未说明接入范围与产出形态，这是推断而非事实。
  usage_reason_en: Compared with copying into an external assistant and pasting back, it keeps the action
    inside the original app and removes one switch and paste, so users handling in-app text frequently
    might choose it; however the material does not state integration scope or output form, so this is
    inference, not fact.
