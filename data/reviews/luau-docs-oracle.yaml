  market: ''
  job: Roblox 脚本开发者在写完一段 Luau 代码、准备提交或遇到运行报错时，处理自己写的脚本文件，要确认调用的 API 名称、参数和用法与官方文档一致，避免上线后才发现误用。
  job_en: A Roblox script developer who has just written a piece of Luau code and is about to commit or
    has hit a runtime error works on their own script files to confirm that API names, arguments and usage
    match the official documentation before the mistake ships.
  pain: Luau 的 API 版本和参数经常变动，误用往往只在运行时暴露，开发者要反复翻文档、在论坛搜旧帖，排查一步就要来回切换多个页面。
  pain_en: Luau APIs and their arguments change often, misuse usually surfaces only at runtime, and developers
    must repeatedly read docs and search old forum posts, switching between several pages for a single
    check.
  current_alternative: 现在主要靠人工翻官方文档、在开发者论坛搜报错、或直接运行脚本看是否报错，没有专门针对 Luau 的静态校验环节。
  current_alternative_en: Today the main alternatives are manually reading official docs, searching the
    developer forum for the error, or simply running the script to see whether it fails; there is no dedicated
    static check step for Luau.
  usage_reason: 推断：相较翻文档和跑一遍才知道错，它把代码与 Luau API 文档直接比对，在提交前就指出对不上的调用，省掉的是“运行—报错—再查文档”这一轮往返，因此常写 Roblox
    脚本、又不想每次靠试错的人会先试它。
  usage_reason_en: 'Inference: instead of reading docs and running the code to discover errors, it compares
    code against the Luau API documentation and flags mismatched calls before commit, removing the run-error-look-up
    round trip, so people who write Roblox scripts often and dislike trial and error are the ones likely
    to try it first.'
