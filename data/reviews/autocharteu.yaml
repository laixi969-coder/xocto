  next_validation: 收集 AutoChart.eu 官方页面或社区帖中关于生成谱面质量、支持乐器轨与收费方式的公开说明。
  market: ''
  job: 节奏游戏玩家在 YARG 或 Clone Hero 中想玩一首尚无谱面的歌时，需要把歌曲文件转成可导入游戏的全乐队谱面。
  job_en: Rhythm-game players who want to play a song with no existing chart in YARG or Clone Hero need
    to turn the audio file into an importable full-band chart.
  pain: 手工打谱需要逐段对齐节拍、分配各乐器轨，耗时且需要乐理与工具经验；冷门歌曲和自制曲目往往根本没人做谱。
  pain_en: Hand-charting requires beat-aligning each section and assigning instrument tracks, which is
    slow and needs music and tooling skill; obscure songs and self-made tracks often have no chart at
    all.
  current_alternative: 玩家自己用谱面编辑器手工制作，或在社区寻找他人分享的谱面，找不到就只能放弃这首歌。
  current_alternative_en: Players hand-build charts in chart editors or search community-shared charts,
    and give up on the song when none exists.
  usage_reason: 推断：相较手工打谱，产品把整首歌一次性转成可导入的谱面文件，省去逐段对齐节拍和分轨编排的步骤，因此找不到现成谱面的玩家会先试它；生成质量是否够玩仍需核验。
  usage_reason_en: 'Inference: versus hand-charting, the product converts a whole song into an importable
    chart file in one pass, skipping manual beat alignment and track arrangement, so players without an
    existing chart would try it first; whether output quality is playable still needs verification.'
