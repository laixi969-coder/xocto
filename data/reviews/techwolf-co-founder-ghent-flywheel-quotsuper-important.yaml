  market: ''
  job: 企业人力资源与人才管理者在盘点员工技能、规划内部调配或继任时，需要从岗位记录、项目经历等材料中梳理技能图谱，完成人才与岗位的匹配判断。
  job_en: HR and talent managers, when auditing employee skills or planning internal mobility and succession,
    need to map skills from job records and project histories to match people to roles.
  pain: 技能信息散落在岗位记录、项目经历和主管记忆中，人工盘点耗时且口径不一，导致内部调配和继任判断依赖印象。
  pain_en: Skill information is scattered across job records, project histories and managers' memory;
    manual audits are slow and inconsistent, so mobility and succession decisions rely on impressions.
  current_alternative: 旧做法是 HR 用表格、访谈和主管评估手工汇总技能，或依赖通用 HR 系统里静态的岗位描述。
  current_alternative_en: The old approach is HR manually aggregating skills via spreadsheets, interviews
    and manager assessments, or relying on static job descriptions in generic HR systems.
  usage_reason: 推断：相较手工汇总，TechWolf 从既有岗位与项目材料中自动推断技能并生成可查询画像，减少逐条整理这一步，使 HR 在盘点或调配时能直接比对候选人与岗位；SAP 将其纳入人才战略也表明买方认可该环节价值。
  usage_reason_en: 'Inference: compared with manual aggregation, TechWolf automatically infers skills
    from existing job and project materials and produces a queryable profile, removing the step of compiling
    entries one by one so HR can directly compare candidates to roles during audits or mobility; SAP folding
    it into its talent strategy also indicates buyer recognition of this step''s value.'
