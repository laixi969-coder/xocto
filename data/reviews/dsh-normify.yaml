  market: ''
  job: 软件架构师或研发工程师在接手或修改一个已有代码库时，需要先弄清模块边界，再让 AI 按既有结构完成改动并留下可核对的记录。
  job_en: A software architect or engineer taking over or modifying an existing codebase needs to understand
    module boundaries first, then have AI make changes that follow the existing structure and leave a
    checkable record.
  pain: 旧代码库的架构约束只存在于人脑和口头约定里，AI 改动容易越界，事后很难说清哪一步破坏了结构。
  pain_en: Architectural constraints in legacy codebases live only in people's heads and verbal agreements,
    so AI edits easily cross boundaries and it is hard to say afterwards which step broke the structure.
  current_alternative: 靠人工评审、架构文档和口头约定约束改动，或事后翻 diff 反推结构。
  current_alternative_en: Relying on manual review, architecture docs and verbal agreements to constrain
    changes, or reconstructing structure from diffs after the fact.
  usage_reason: 相较人工评审和事后翻 diff，它把架构写成可校验的模块树，在改动写入时就跑校验并留下冻结回执，减少的是“改完才发现越界、再回头找原因”这一步；推断，接手遗留系统或多人协作改同一模块的团队会因此选择它。
  usage_reason_en: Compared with manual review and post-hoc diff reading, it encodes architecture as a
    checkable module tree, runs validation at write time and leaves a frozen receipt, removing the step
    of discovering a boundary violation only after the change and then hunting for its cause; this is
    inference, and teams inheriting legacy systems or editing shared modules would choose it for that
    reason.
