  market: ''
  job: 研发工程师或架构师在接手或改动一个已有代码库、需要先弄清模块边界时，把项目现有结构交给这个 DSH 插件，让它整理成归一化的分形模块树，并在改动前后跑写时校验、校验与冻结回执，最终拿到可核对的模块树与单文件交互式架构图。
  job_en: 'An engineer or architect taking over or modifying an existing codebase first needs to understand
    module boundaries: they hand the project''s current structure to this DSH plugin, which normalizes
    it into a fractal module tree, runs write-time checks, validation and freeze receipts before and after
    the change, and returns a verifiable module tree plus a single-file interactive architecture diagram.'
  pain: 公开材料显示的真实摩擦是：改动已有代码库前缺少一份可核对的模块边界描述，改动是否越界只能靠人读代码判断；插件用写时校验与冻结回执把边界检查前置，但公开证据未给出越界返工的具体频率或代价，痛点强度属工作流结构推理。
  pain_en: 'The public material shows the real friction: before changing an existing codebase there is
    no verifiable description of module boundaries, so whether a change crosses a boundary is judged by
    reading code; the plugin front-loads boundary checks via write-time validation and freeze receipts,
    but public evidence gives no frequency or cost of boundary-crossing rework, so pain intensity is a
    workflow inference.'
  current_alternative: 当前替代方式是人工阅读代码与目录、口头或文档约定模块边界，以及通用架构图工具事后补画；这些做法不产出可校验的归一化模块树，也不在改动前后自动跑边界校验。
  current_alternative_en: Today the alternatives are reading code and directories by hand, agreeing on
    module boundaries verbally or in docs, and drawing architecture diagrams after the fact with generic
    tools; none produces a checkable normalized module tree or runs boundary validation before and after
    a change.
  usage_reason: 推断：相较人工读代码加事后画图，它把模块边界写成可校验的归一化树，并在 change_open→brief→check→实施→refresh→change_close 的伴随流程里自动跑写时校验与冻结回执，省去改动前手工梳理边界、改动后手工核对是否越界这两步；因此正在改动陌生或大型代码库、需要边界可核对的工程师会在这种情况下选择它。
  usage_reason_en: 'Inference: versus reading code by hand and drawing diagrams afterwards, it writes
    module boundaries as a checkable normalized tree and runs write-time validation and freeze receipts
    inside the change_open→brief→check→implement→refresh→change_close companion flow, removing the manual
    pre-change boundary mapping and post-change boundary re-checking; engineers modifying unfamiliar or
    large codebases who need verifiable boundaries would choose it in that situation.'
