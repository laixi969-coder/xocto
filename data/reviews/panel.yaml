  market: ''
  job: 研究人员或开发者在调试智能体行为时，需要反复搭建和调整实验界面，以便观察智能体在任务中的表现。
  job_en: A researcher or developer debugging agent behaviour needs to repeatedly build and adjust an
    experiment interface to observe how the agent performs on a task.
  pain: 公开材料只说明智能体能自建面板，未说明原来由谁手工搭建界面、耗时多久或出错代价，痛点强度无法确认。
  pain_en: Public material only says the agent can build its own panes; it does not say who previously
    built the interface by hand, how long it took, or the cost of errors, so pain intensity cannot be
    confirmed.
  current_alternative: 现有替代方式可能是研究者自行编写前端或使用通用笔记本环境，但候选材料未提供任何替代行为证据。
  current_alternative_en: The current alternative may be researchers writing their own front end or using
    general notebook environments, but the candidate material provides no evidence of such substitute
    behaviour.
  usage_reason: 推断：若智能体能按任务自行生成面板，研究者可省去手工搭界面的步骤，但缺少用户反馈或案例支持，无法确认哪类用户会因此选择它。
  usage_reason_en: 'Inference: if the agent can generate panes per task, researchers could skip hand-building
    the interface, but without user feedback or cases it is unclear which users would choose it for that
    reason.'
