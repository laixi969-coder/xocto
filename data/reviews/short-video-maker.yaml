  market: ''
  job: 做短视频的创作者拿到长视频或 YouTube 素材后，需要挑出高光片段、配上字幕和翻译、加上配音，产出可直接发布的竖屏短片。
  job_en: Short-video creators with long footage or YouTube material need to pick highlight clips, add
    subtitles and translation, add voiceover, and produce publish-ready vertical shorts.
  pain: 手工剪辑一条短片要反复看素材、对时间轴、打字幕，外包或订阅剪辑 SaaS 又按额度收费并带水印。
  pain_en: Cutting one short by hand means rewatching footage, aligning timelines and typing subtitles,
    while outsourcing or subscribing to clipping SaaS charges by credits and adds watermarks.
  current_alternative: 手工用剪辑软件剪，或订阅 OpusClip、Vidyo.ai 这类按额度计费的剪辑 SaaS。
  current_alternative_en: Editing manually in video software, or subscribing to credit-based clipping
    SaaS such as OpusClip or Vidyo.ai.
  usage_reason: 推断：它把高光检测、字幕、翻译和配音串成一条本地流程，省掉逐条对时间轴和打字幕的步骤，也不消耗剪辑额度，因此日更且预算有限的创作者会在素材量大、订阅成本变高时选择它。
  usage_reason_en: 'Inference: it chains highlight detection, subtitles, translation and voiceover into
    one local pipeline, removing the step of aligning timelines and typing subtitles clip by clip and
    consuming no clipping credits, so daily-posting creators on tight budgets pick it when footage volume
    grows and subscription cost bites.'
