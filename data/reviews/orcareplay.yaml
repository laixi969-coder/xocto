  market: ''
  job: AI 工程师在调试多步 LLM 代理时，面对一次失败或异常运行，需要把该次运行的模型调用、工具调用与中间状态完整记录下来，事后重放同一轨迹、从某一步分叉重跑，以定位是哪一步导致结果偏离。
  job_en: AI engineers debugging a multi-step LLM agent run need to capture the model calls, tool calls
    and intermediate state of a failed or anomalous run, then replay the same trajectory and fork from
    a given step to isolate which step caused the deviation.
  pain: 代理运行是非确定性的多步链路，失败往往只在某次采样或某个工具返回后出现；没有逐步记录就只能靠日志片段和反复重跑猜测，同一 bug 难以稳定复现，排查成本高且结论不可靠。
  pain_en: Agent runs are non-deterministic multi-step chains; failures often surface only after a particular
    sample or tool return. Without step-level recording, engineers guess from log fragments and repeated
    reruns, the same bug is hard to reproduce reliably, and conclusions are unreliable.
  current_alternative: 当前替代是自建日志与 tracing 埋点、在代码里加断点或打印、把 prompt 与输出手工存文件，再靠反复重跑碰运气复现；部分团队用通用 LLM 可观测性工具，但通常不提供从任意步骤分叉重放。
  current_alternative_en: Today teams hand-roll logging and tracing, add breakpoints or prints, save prompts
    and outputs to files manually, and rerun repeatedly hoping to reproduce; some use generic LLM observability
    tools, which generally do not offer forking and replay from an arbitrary step.
  usage_reason: 推断：相较自建日志加反复重跑，OrcaReplay 把一次运行整体录制下来，使工程师能直接重放同一轨迹并从指定步骤分叉，从而省去手工拼日志和靠运气复现这一步；因此正在调试多步代理、且失败难以稳定复现的
    AI 工程师会在排查阶段选择它。
  usage_reason_en: 'Inference: versus hand-rolled logging plus repeated reruns, OrcaReplay records a whole
    run so engineers can replay the same trajectory and fork from a chosen step, removing the manual log-stitching
    and luck-based reproduction step; AI engineers debugging multi-step agents with hard-to-reproduce
    failures would therefore pick it during triage.'
