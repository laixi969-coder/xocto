    open-source frameworks and their own backend.
  usage_reason: 推断：对数据不能出境的团队，自托管可省去把代理运行托管给外部厂商这一环，但公开材料未给出部署成本、兼容程度或实际采用证据，因此无法确认这一理由成立。
  usage_reason_en: 'Inference: for teams whose data cannot leave their premises, self-hosting removes
    the step of running agents on an external vendor, but public material gives no deployment cost, compatibility
    level or adoption evidence, so this reason cannot be confirmed.'
