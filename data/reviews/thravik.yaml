    previously lost information or what it cost, so the pain cannot be reconstructed.
  current_alternative: 用户目前靠书签、历史记录、标签页分组或笔记工具来保存浏览过的内容。
  current_alternative_en: Users currently rely on bookmarks, history, tab groups or note tools to keep
    browsed content.
  usage_reason: 推断：若浏览器能自动保留浏览上下文并直接召回，用户可省去手动收藏和整理这一步，因此经常做资料检索的 Mac 用户可能试用；但缺少用户反馈与留存证据，无法确认其被长期使用。
  usage_reason_en: 'Inference: if the browser automatically keeps browsing context and recalls it directly,
    users skip manual bookmarking and organizing, so Mac users doing frequent research may try it; without
    user feedback or retention evidence, long-term use cannot be confirmed.'
