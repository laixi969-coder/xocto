  market: ''
  job: 处理外文合同、论文或产品说明书的法务、研究人员或跨境从业者，在需要读懂一份排版复杂、含表格图表的 PDF 时，要把它变成自己能读的目标语言版本，同时不丢失版式信息。
  job_en: Legal staff, researchers or cross-border practitioners handling foreign-language contracts,
    papers or product manuals need to turn a layout-heavy PDF with tables and figures into a readable
    target-language version without losing formatting information.
  pain: 现有做法要么只翻文字、版式全乱，要么手动复制到文档里重排，表格和图表位置对不上，读者要反复对照原文才能确认哪句话对应哪个数字。
  pain_en: Existing options either translate text only and destroy the layout, or require manually copying
    into a document and re-laying it out, so tables and figures no longer line up and readers must constantly
    cross-check the original to see which sentence matches which figure.
  current_alternative: 用通用翻译工具复制粘贴文本、用 PDF 编辑器手工重排，或直接请人工翻译并重新排版，后者成本高、周期长。
  current_alternative_en: Copy-pasting text into general translation tools, manually re-laying out in
    a PDF editor, or hiring a human translator who then re-typesets the document, which is costly and
    slow.
  usage_reason: 推断：相较复制粘贴再手工重排，它把“翻译”和“保持版面”合并成一次动作，省掉重新对齐表格与图表这一步，因此对版式有硬要求、又不想付人工排版费用的法务、研究和跨境业务人员会先试用它。公开材料没有用户反馈或留存数据，这一判断来自工作流结构推理。
  usage_reason_en: 'Inference: compared with copy-paste plus manual re-layout, it merges ''translate''
    and ''keep the layout'' into one action, removing the step of re-aligning tables and figures, so legal,
    research and cross-border staff who need layout fidelity but do not want to pay for manual typesetting
    would try it first. The public material has no user feedback or retention data; this judgment comes
    from workflow-structure reasoning.'
