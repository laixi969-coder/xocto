  market: ''
  job: 吉他学习者或音乐教师在练习或备课时，拿到一段 YouTube 演奏视频，需要得到能直接照着弹的和弦谱。
  job_en: A guitar learner or music teacher with a YouTube performance video needs a chord chart they
    can play along to while practicing or preparing a lesson.
  pain: 过去扒谱要靠耳朵反复听、试按和弦，一段几分钟的视频常要花上几十分钟甚至更久，且容易听错。
  pain_en: Transcribing by ear means repeated listening and trial fingering; a few minutes of video can
    take tens of minutes or more, and errors are common.
  current_alternative: 靠耳朵反复听、在乐器上试和弦，或去论坛、谱站找现成和弦谱，找不到就只能自己扒。
  current_alternative_en: Repeated listening and trial fingering on the instrument, or hunting existing
    chord charts on forums and tab sites; if none exists, transcribe it yourself.
  usage_reason: 推断：相较自己反复听音试按，它把整段音频一次性转成和弦序列，省掉逐句辨音这一步，因此需要快速出谱的吉他学习者和教师会先试它；但识别准确度未经公开验证，用户仍需自行校对。
  usage_reason_en: 'Inference: instead of repeated listening and trial fingering, it converts the whole
    audio into a chord sequence in one pass, removing the phrase-by-phrase pitch-identification step,
    so learners and teachers needing a fast chart would try it; accuracy is not publicly verified, so
    users still proofread.'
