  market: ''
  job: 渗透测试工程师在授权测试中，面对目标系统的代码与运行环境，需要完成侦察、攻击面测绘、source-to-sink 分析和漏洞实弹验证，并留下可复核的过程。
  job_en: Penetration testers, in authorized engagements, face a target's code and runtime environment
    and must complete reconnaissance, attack-surface mapping, source-to-sink analysis and live vulnerability
    validation while leaving a reviewable trail.
  pain: 渗透测试工具链分散、方法论靠个人经验，重复的侦察与验证步骤占用大量时间，且过程难以标准化复现。
  pain_en: Pentest toolchains are fragmented and methodology lives in individual experience; repetitive
    reconnaissance and validation consume much time and the process is hard to reproduce consistently.
  current_alternative: 工程师手工组合 Burp、nmap、自写脚本与检查清单，逐项执行并人工整理结果。
  current_alternative_en: Engineers manually combine Burp, nmap, custom scripts and checklists, executing
    step by step and compiling results by hand.
  usage_reason: 推断：相较手工拼装工具与个人检查清单，它把侦察、分析与验证串成可被智能体调用的结构化流程，减少重复的脚本编排与结果搬运，因此承接授权测试的安全团队会在重复性任务上先试用；但公开材料只有仓库描述与星标，缺少实际使用与留存证据。
  usage_reason_en: 'Inference: compared with hand-assembled tools and personal checklists, it chains reconnaissance,
    analysis and validation into a structured flow agents can call, cutting repetitive scripting and result
    handling, so security teams on authorized engagements would try it for repetitive tasks; however,
    only a repository description and stars are public, with no usage or retention evidence.'
