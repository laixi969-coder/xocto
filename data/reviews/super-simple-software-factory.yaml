  market: ''
  job: 开发者在已有代码仓库中，把编码代理按固定顺序调用，处理依赖升级、测试补齐一类重复工程任务，产出可重复运行的流水线。
  job_en: Developers invoke coding agents in a fixed order inside an existing repository to handle repetitive
    engineering tasks such as dependency upgrades or test backfill, producing a repeatable pipeline.
  pain: 代理每次自由发挥导致结果不稳定，同一任务难以复现，人工要反复检查代理改了什么。
  pain_en: Agents improvise each run, so results are unstable, the same task is hard to reproduce, and
    humans must repeatedly inspect what the agent changed.
  current_alternative: 开发者手工写脚本或提示词，靠人盯着代理逐步执行并事后核对改动。
  current_alternative_en: Developers hand-write scripts or prompts and watch the agent step by step, checking
    changes afterwards.
  usage_reason: 推断：把编排交给确定性 Python、把代理限制为受约束节点，可减少人工逐步盯守与事后核对这一步；但公开材料未给出留存或重复使用证据，尚不能确认开发者已长期留在工作流里。
  usage_reason_en: 'Inference: letting deterministic Python own orchestration and bounding agents to nodes
    can remove the step of watching each run and checking afterwards; public material gives no retention
    or repeat-use evidence, so long-term workflow adoption cannot be confirmed.'
