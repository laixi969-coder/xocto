    tools and layout tools and adjust by hand.
  current_alternative: 在独立生图工具里出图，再导入设计工具手工裁切、加标题。
  current_alternative_en: Generating images in a standalone image tool, then importing them into a design
    tool to crop and add titles by hand.
  usage_reason: 推断：它把平台版式技巧直接内置进 Agent 可调用的生图动作，运营可在同一对话里出图，省去在生图与排版工具间切换并手工套版式的一步；因此常做小红书或视频封面的运营会尝试它。
  usage_reason_en: 'Inference: it bakes platform layout recipes into an agent-callable image action, so
    operators can generate images inside the same conversation, skipping the step of switching between
    image and layout tools and applying templates by hand; operators who regularly make Xiaohongshu or
    video covers would try it.'
