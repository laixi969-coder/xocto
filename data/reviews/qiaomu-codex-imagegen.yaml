  market: ''
  job: 内容运营在准备小红书笔记或视频封面时，需要按平台版式快速产出多张配图，交给 Agent 调用生图能力完成出图。
  job_en: A content operator preparing a Xiaohongshu post or video cover needs several platform-formatted
    images quickly, and has an agent call image generation to produce them.
