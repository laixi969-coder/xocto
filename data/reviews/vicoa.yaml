  market: ''
  job: 软件开发者或技术团队负责人在同时运行多个编码代理（如并行处理多个仓库任务）时，需要从桌面、手机或自托管 VPS 上统一查看、调度和接管这些代理的会话与产出，而不是逐个终端窗口手动切换。
  job_en: A software developer or tech lead running several coding agents in parallel needs to view, dispatch,
    and take over those agent sessions and outputs from desktop, mobile, or a self-hosted VPS, instead
    of switching between individual terminal windows by hand.
  pain: 公开材料只说明产品定位为跨设备运行编码代理团队的 ADE，未提供用户抱怨、事故或返工记录；从工作流结构推理，多代理并行时上下文分散在多个终端与设备，切换和状态追踪本身构成操作负担，但该痛点的强度与频率尚无公开用户证据。
  pain_en: Public materials only state the product is an ADE for running a team of coding agents across
    devices; no user complaints, incidents, or rework records are provided. By workflow-structure inference,
    parallel agents scatter context across terminals and devices, making switching and status tracking
    a burden, but the intensity and frequency of this pain lack public user evidence.
  current_alternative: 公开材料未描述用户当前做法；结构上可推断的旧替代是本地 IDE 加多个终端标签页、tmux/SSH 会话，或各家代理自带的 CLI，跨设备与自托管场景需要自行拼装。
  current_alternative_en: Public materials do not describe current practice; the structurally inferable
    alternatives are a local IDE with multiple terminal tabs, tmux/SSH sessions, or each agent's own CLI,
    with cross-device and self-hosted use requiring manual assembly.
  usage_reason: 推断：相较在单机终端里逐个管理代理，Vicoa 把代理会话集中到一个可自托管、可从桌面与移动端访问的环境，减少切换设备与窗口这一步负担，因此同时跑多个代理、又要求数据留在自有
    VPS 的开发者会优先试用它；该动机尚未被用户反馈或案例证实。
  usage_reason_en: 'Inference: versus managing agents one by one in local terminals, Vicoa centralizes
    agent sessions into a self-hostable environment reachable from desktop and mobile, removing the step
    of switching devices and windows, so developers running several agents who need data to stay on their
    own VPS would try it first; this motive is not yet confirmed by user feedback or cases.'
