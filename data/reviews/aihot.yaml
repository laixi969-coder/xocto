  market: ''
  job: 行业资讯编辑或运营者每天面对多个信源，需要把当天值得看的条目挑出来、聚成事件并排成一份可发布的日报站点，信源与精选标准由自己替换。
  job_en: An industry news editor or operator faces many sources daily and must pick the day's worthwhile
    items, cluster them into events and publish a daily digest site, swapping in their own sources and
    curation rules.
  pain: 公开材料显示它最初是公司内部用来监控热点找选题的飞书机器人，说明人工翻多个信源、挑条目、排版成日报是重复且耗时的日常负担。
  pain_en: Public material shows it began as an internal Feishu bot for monitoring hot topics and finding
    story ideas, indicating that manually scanning many sources, picking items and laying out a daily
    digest is a repetitive daily burden.
  current_alternative: 旧做法是人工逐个翻看信源、凭经验挑出当天值得看的条目，再手动排版成日报或选题清单。
  current_alternative_en: The old way is manually scanning each source, picking the day's worthwhile items
    by experience, then hand-laying them out into a digest or story list.
  usage_reason: 推断：相较人工逐源翻看再排版，它按配置信源抓取、用大模型先筛再独立打两次分、把同一事件聚簇并按讨论量排序，直接产出日报页面，省去筛选与排版两步，因此需要每日稳定出稿的行业编辑会选它。
  usage_reason_en: 'Inference: versus manually scanning sources and laying out pages, it fetches configured
    sources, screens with an LLM plus two independent scorings, clusters the same event and ranks by discussion
    volume to output a daily page, removing the screening and layout steps, so editors needing a steady
    daily issue choose it.'
