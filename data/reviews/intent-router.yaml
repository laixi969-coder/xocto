  market: ''
  job: 构建 agent 路由或决策模型的开发者，在接入用户请求时把模糊的自然语言输入交给 Intent-Router，由它转成带类型的 IntentSpec 契约，在路由前探测、追问或中止，最终拿到可直接喂给路由器的结构化意图输入。
  job_en: Developers building agent routers or decision models hand vague natural-language requests to
    Intent-Router, which converges them into typed IntentSpec contracts, probing, asking, or halting before
    routing, so they get structured intent input that a router can consume.
  pain: 公开说明指出输入是“模糊请求”，若直接路由会命中错误分支或让下游决策模型拿到不可判定的输入；不解决的后果是路由错误、追问缺失或该中止时继续执行，而这类失败在 agent 链路里代价高且难回溯。
  pain_en: The public description states the input is a vague request; routing it directly can hit the
    wrong branch or feed an undecidable input to downstream decision models. The consequence is misrouting,
    missing clarification, or continuing when the system should halt — failures that are costly and hard
    to trace in an agent chain.
  current_alternative: 开发者目前通常自己在路由前手写 prompt 约束、正则或分类器做意图归一，或干脆把原始自然语言直接丢给路由器与决策模型，缺少统一的类型化契约与探测/追问/中止语义。
  current_alternative_en: Developers today hand-write prompt constraints, regex, or classifiers to normalize
    intent before routing, or simply pass raw natural language straight into the router and decision model,
    without a unified typed contract or probe/ask/halt semantics.
  usage_reason: 相较手写 prompt 约束或直接透传原始请求，它把“先探测、必要时追问、否则中止”固化为路由前的独立一层，并输出带类型的 IntentSpec，使下游路由器不必再自行处理歧义输入；因此正在搭建
    agent 路由或决策模型、且被模糊输入困扰的开发者会在接入层选择它。此为基于产品能力与工作流结构的推断，尚无用户反馈佐证。
  usage_reason_en: Compared with hand-written prompt constraints or passing raw requests through, it fixes
    probe/ask/halt as a separate pre-routing layer and emits a typed IntentSpec, so downstream routers
    no longer handle ambiguous input themselves. Developers building agent routers or decision models
    and struggling with vague input would therefore adopt it at the ingestion layer. This is an inference
    from product capability and workflow structure, not yet supported by user feedback.
