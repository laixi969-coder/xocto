  current_alternative_en: Developers typically let a model output classification labels or write their
    own rules for intent recognition; this is common practice but is not described in the candidate material
    and is inference.
  usage_reason: 无法判断：材料未说明相较直接调用模型分类减少了哪一步返工，也没有接入反馈，因此不能解释开发者为何选择它。
  usage_reason_en: 'Cannot be judged: the material does not say which rework step it removes compared
    with calling a model for classification, and offers no integration feedback, so it cannot explain
    why developers would choose it.'
