  job_en: Developers building agent routers or decision models, when ingesting user requests, handle vague
    natural-language input and need to turn it into routable structured intent.
  pain: 候选材料只说明它会探测、追问或中止，未说明没有它时路由错误会造成什么具体后果，痛点强度无法从现有事实确认。
