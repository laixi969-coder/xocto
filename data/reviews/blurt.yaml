  market: ''
  job: 文字工作者或客服、销售支持人员在写邮件、记录会议或整理工单时，需要把手上的语音快速变成可编辑文本。
  job_en: Writers, support agents or sales staff need to turn spoken input into editable text while drafting
    emails, taking notes or logging tickets.
  pain: 打字速度慢于说话速度，长文本录入耗时；候选材料未给出任何用户抱怨或替代行为的证据。
  pain_en: Typing is slower than speaking and long-form entry is time-consuming; the candidate material
    provides no evidence of user complaints or workarounds.
  current_alternative: 系统自带听写、手机语音输入法或人工打字。
  current_alternative_en: Built-in OS dictation, mobile voice keyboards, or typing by hand.
  usage_reason: 推断：相较系统听写，它把听写做成按键触发的独立动作，可能减少误触发和切换输入法的步骤，但材料未说明与系统听写相比的具体差异，因此哪类用户会因此选择它尚不清楚。
  usage_reason_en: 'Inference: versus built-in dictation it makes dictation a key-triggered standalone
    action, potentially reducing misfires and input-method switching, but the material does not state
    any concrete difference from OS dictation, so which users would choose it remains unclear.'
