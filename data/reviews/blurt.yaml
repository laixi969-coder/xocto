  market: ''
  job: 文字工作者、客服或销售支持人员在写邮件、记录会议或整理工单时，按住按键说话，把口述内容变成可直接粘贴的文本，再自行校对后交付。
  job_en: Writers, support agents or sales staff hold a key and speak while drafting emails, taking meeting
    notes or logging tickets, turning speech into paste-ready text they then proofread.
  pain: 打字速度慢于说话速度，长文本录入占用大量时间；口述后仍需人工校对，且系统听写常出现误触发、需切换输入法或打断当前窗口，公开材料未给出用户抱怨或替代行为的直接证据。
  pain_en: Typing is slower than speaking and long-form entry is time-consuming; dictated text still needs
    proofreading, and OS dictation often misfires, requires input-method switching or interrupts the current
    window, though public material gives no direct user complaint or workaround evidence.
  current_alternative: 系统自带听写、手机语音输入法或纯手工打字。
  current_alternative_en: Built-in OS dictation, mobile voice keyboards, or typing by hand.
  usage_reason: 推断：相较系统听写，它把听写收敛为按住即说的独立按键动作，减少误触发与切换输入法的步骤，并把结果直接交给 AssemblyAI 听写接口返回可粘贴文本；因此频繁口述长文本、又不想离开当前窗口的文字工作者或支持人员会在写邮件、记会议、整理工单时选择它。
  usage_reason_en: 'Inference: versus OS dictation, it reduces misfires and input-method switching by
    making dictation a hold-to-talk key action and returns paste-ready text via the AssemblyAI dictation
    API; so writers or support staff who dictate long text frequently and do not want to leave their current
    window would choose it for emails, meeting notes or tickets.'
