  market: ''
  job: 移动应用测试或自动化人员需要在真实 iPhone 上复现点击、滑动和界面观察流程，处理的是真机屏幕画面与触控输入，要完成可重复的设备操作任务。
  job_en: Mobile app testers or automation engineers need to reproduce tap, swipe and screen-observation
    flows on a real iPhone, working with on-device screen video and touch input to complete repeatable
    device operations.
  pain: 真机自动化通常依赖 Mac、开发者账号或越狱，硬件与授权成本高，小团队难以低成本搭起真机操作回路。
  pain_en: Real-device automation usually requires a Mac, a developer account or a jailbreak, making hardware
    and authorization costly for small teams to build a device-control loop.
  current_alternative: 现有做法是购买 Mac 加真机做 Appium/XCTest 自动化，或使用云真机平台按次租用设备。
  current_alternative_en: Current practice is buying a Mac plus devices for Appium/XCTest automation,
    or renting devices per session from cloud device farms.
  usage_reason: 推断：相较买 Mac 或租云真机，它用约 7 美元的 ESP32 同时提供画面与触控，省去开发者账号和越狱这一步，因此预算有限、需要频繁真机验证的小团队会在本地回归测试时选择它。
  usage_reason_en: 'Inference: versus buying a Mac or renting cloud devices, it uses a roughly $7 ESP32
    to supply both video and touch, removing the developer-account and jailbreak step, so budget-constrained
    teams doing frequent on-device regression checks would pick it locally.'
