  market: ''
  job: 中文母语者在写英文邮件、外贸消息或跨境客服回复时，一边打字一边需要把中文意思转成可用的英文表达。
  job_en: Native Chinese speakers writing English emails, trade messages or cross-border support replies
    need to turn Chinese meaning into usable English phrasing while typing.
  pain: 公开材料只有一句“Learn English as you type Chinese”，没有说明用户原来卡在哪一步、错误如何被纠正、不用的后果是什么；从结构上看，中文母语者写英文的真实痛点是“要交付一封能发出去的英文”，而边打字边学英语是附带收益，不是刚性任务。
  pain_en: The only public material is the line 'Learn English as you type Chinese'; it does not show
    which step users were stuck on, how errors get corrected, or the cost of not using it. Structurally,
    the real pain for Chinese native speakers writing English is delivering a sendable English message,
    while learning English while typing is a side benefit, not a rigid task.
  current_alternative: 翻译工具、输入法自带翻译、词典或直接让 AI 代写英文，这些做法已经能直接产出可发送的英文，且不需要用户在学习上额外投入。
  current_alternative_en: Translation tools, built-in input-method translation, dictionaries, or simply
    having an AI write the English directly already produce sendable English without requiring extra learning
    effort.
  usage_reason: 推断：它把中文输入即时转成英文并附用词提示，理论上省去切换翻译工具再复制粘贴的一步；但用户要的是“发出英文”，不是“顺便学英语”，学习负担反而可能被视为额外成本，公开材料没有任何用户反馈或使用数据支持这类用户会主动选择它。
  usage_reason_en: 'Inference: it converts Chinese input into English with wording hints, in theory saving
    the step of switching to a translation tool and copy-pasting back. But users want sendable English,
    not incidental English learning, and the learning burden may be seen as extra cost; no public user
    feedback or usage data supports that such users would actively choose it.'
