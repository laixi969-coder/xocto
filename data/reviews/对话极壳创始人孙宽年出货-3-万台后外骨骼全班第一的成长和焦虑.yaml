  job: 户外徒步者和行动不便的老年人在长距离行走或爬坡时，需要借助可穿戴设备减轻腿部负担，完成原本吃力或走不完的路线。
  job_en: Hikers and older adults with limited mobility need wearable assistance to reduce leg strain
    on long walks or climbs, completing routes that would otherwise be exhausting or impossible.
  pain: 长距离行走和爬坡对腿部力量和耐力要求高，老年人和体力较弱者容易中途放弃或受伤，现有护膝、登山杖只能提供有限支撑。
  pain_en: Long walks and climbs demand leg strength and endurance; older or weaker users often give up
    midway or risk injury, while knee braces and trekking poles offer only limited support.
  current_alternative: 目前主要靠登山杖、护膝、减重背包或直接放弃行程，也有人选择电动代步工具，但都难以在行走过程中持续分担腿部负荷。
  current_alternative_en: Today people rely on trekking poles, knee braces, lighter packs or simply abandoning
    the trip; some use electric mobility devices, but none continuously share leg load while walking.
  usage_reason: 相比登山杖和护膝只在外部提供有限支撑，外骨骼在髋膝关节处直接输出助力，减少上坡和长距离行走中每一步的体力消耗，因此体力较弱或希望延长行程的徒步者、老年人会在长线徒步或日常行走场景中选择它；这是基于产品能力的推断，尚无公开留存或复购证据。
  usage_reason_en: Unlike trekking poles and braces that only support externally, the exoskeleton outputs
