  market: ''
  job: 收入不固定的个人用户在做月度安排时，需要判断未来几个月现金流能否覆盖固定支出，以便决定是否削减开支或接活。
  job_en: Individuals with irregular income need to judge, when planning a month, whether cash flow in
    the coming months can cover fixed expenses, so they can decide whether to cut spending or take on
    more work.
  pain: 现有记账工具大多只呈现已经发生的支出，用户仍要自己把账单和订阅摊到表格里推算未来，判断滞后且容易算错。
  pain_en: Most existing budgeting tools only show spending that already happened, so users still spread
    bills and subscriptions across a spreadsheet to project forward, which is late and error-prone.
  current_alternative: 用电子表格手工建模，或依赖银行 App 的账单提醒与月度汇总。
  current_alternative_en: Manual spreadsheet modeling, or relying on bank app bill reminders and monthly
    summaries.
  usage_reason: 推断：相较手工表格，它把收支数据直接汇成一条未来现金流曲线，省掉了逐月手工推算这一步，因此收入波动、需要提前判断能否覆盖固定支出的人会优先试用它。
  usage_reason_en: 'Inference: compared with a manual spreadsheet, it turns income and expense data directly
    into a forward cash flow curve, removing the step of projecting month by month, so people with fluctuating
    income who need early warning about fixed expenses would try it first.'
