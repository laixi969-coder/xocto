  market: ''
  job: 独立开发者或应用增长运营在应用上架前，处理多机型、多语言的商店截图素材，要完成一套可直接提交App Store的截图。
  job_en: An indie developer or app growth operator, before an app release, handles store screenshot assets
    across devices and languages to produce a set of screenshots ready to submit to the App Store.
  pain: 截图素材需要按机型尺寸和语言逐张调整，重复劳动多，缺少设计资源的小团队容易拖延上架节奏。
  pain_en: Screenshot assets must be adjusted one by one for device sizes and languages, creating repetitive
    work that delays release for small teams without design resources.
  current_alternative: 目前多由设计师用设计工具手工改图，或使用模板工具批量套版，再人工检查尺寸与文案。
  current_alternative_en: Today this is mostly done by designers editing images manually in design tools,
    or by batch-applying templates and then manually checking sizes and copy.
  usage_reason: 推断：若该工具能直接接收应用界面素材并按机型与语言输出合规截图，可省去逐张改尺寸这一步，缺少设计人手的小团队在临近上架时可能选择它；但公开材料未给出输入输出细节，也无用户反馈支持这一判断。
  usage_reason_en: 'Inference: if the tool can take app interface assets and output compliant screenshots
    by device and language, it removes the step of resizing each image, which small teams without designers
    might choose near release; however, public materials give no input/output details and no user feedback
    supports this judgment.'
