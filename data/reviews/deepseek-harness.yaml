  market: ''
  job: 开发者或技术用户在本地电脑上运行 DeepSeek 助手时，需要把工具调用、记忆存储和交互界面按自己的任务替换成不同插件，从而组装出符合自身工作流的助手，而不是被单一厂商的固定功能组合锁死。
  job_en: Developers and technical users running a DeepSeek assistant on their own machine need to swap
    tool-calling, memory storage, and interface components as plugins to assemble an assistant matching
    their own workflow, instead of being locked into one vendor's fixed feature bundle.
  pain: 公开材料显示其定位是“一切皆插件”，即助手的能力边界由插件决定；这对应一个结构性痛点：用户若无法替换工具、记忆或界面，就只能接受默认组合，任务不匹配时要么放弃该助手，要么自行改源码。公开证据未给出用户抱怨原文，此痛点为工作流结构推理。
  pain_en: 'Public material positions it as ''everything is a plugin'', meaning the assistant''s capability
    boundary is set by plugins. This maps to a structural pain: without swappable tools, memory, or interface,
    users must accept the default bundle and either abandon the assistant or patch source when it does
    not fit. No verbatim user complaint is public; this pain is workflow-structural inference.'
  current_alternative: 旧做法是使用功能固定的闭源助手客户端，或直接基于模型 API 自行编写脚本、拼装工具链；前者无法替换组件，后者需要自己维护集成代码。公开材料未展示用户对这两种旧做法的具体抱怨。
  current_alternative_en: The old path is a fixed-feature closed assistant client, or hand-writing scripts
    and tool chains on top of a model API; the former cannot swap components, the latter requires maintaining
    integration code yourself. Public material does not show specific user complaints about either.
  usage_reason: 推断：相较自行拼装脚本或使用固定客户端，它把工具、记忆、界面统一为可替换插件，用户只需安装或替换插件即可改变助手行为，省去自己编写和维护集成代码这一步；因此会在需要定制助手能力、又不想从零搭建的开发者场景中被选择。仓库收藏数只说明关注度，不作为选择理由。
  usage_reason_en: 'Inference: versus hand-assembling scripts or using a fixed client, it unifies tools,
    memory, and interface as swappable plugins, so users change assistant behavior by installing or replacing
    a plugin, removing the step of writing and maintaining integration code. It would therefore be chosen
    by developers who need a customized assistant without building one from scratch. Star counts indicate
    attention only, not the reason for choosing it.'
