  market: ''
  job: 开发者在使用多个 AI 代理时，把散落在不同目录和工具里的代理技能集中起来，查看、启用与切换。
  job_en: Developers using multiple AI agents gather agent skills scattered across directories and tools
    to view, enable and switch between them.
  pain: 技能文件散落各处、命名不一，换代理就要重新找和配，重复劳动且容易用错版本。
  pain_en: Skill files are scattered with inconsistent naming, so switching agents means re-finding and
    re-configuring them, duplicating work and risking wrong versions.
  current_alternative: 手工在文件系统里维护技能目录，或用笔记和脚本自行记录哪个代理配了哪些技能。
  current_alternative_en: Manually maintaining skill directories in the file system, or tracking which
    agent has which skills via notes and scripts.
  usage_reason: 推断：相较手工翻目录和记笔记，它把技能的查看与启停集中到一个界面，省掉切换代理时重新定位和配置的那一步，因此同时用多个代理、技能数量已多到记不住的开发者会先试用它。
  usage_reason_en: 'Inference: versus manually browsing directories and keeping notes, it centralizes
    viewing and toggling skills in one interface, removing the re-locating and re-configuring step when
    switching agents, so developers juggling multiple agents and too many skills to remember will try
    it first.'
