    documents or slides to colleagues.
  usage_reason: 推断：相较手工搭图表再导出，数据代理直接接收分析结果并生成可交互报告，省去逐张制图和反复导出这一步，因此需要频繁向业务方交付分析结论的团队会选它。
  usage_reason_en: 'Inference: compared with hand-building charts and exporting them, the data agent takes
    analysis results and generates interactive reports, removing the step of charting and re-exporting
    one by one, so teams that frequently deliver analysis to business stakeholders would choose it.'
