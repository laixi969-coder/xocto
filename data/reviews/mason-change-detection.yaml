  market: ''
  job: 遥感影像分析人员在比对同一区域两期卫星或航拍影像时，需要标出新增建筑、植被变化或灾损范围，形成可交付的变化图。
  job_en: Remote-sensing analysts comparing two dates of satellite or aerial imagery for one area need
    to mark new construction, vegetation change or disaster damage and produce a deliverable change map.
  pain: 人工逐幅比对耗时且容易漏判，传统影像差分对配准和光照差异敏感，误报需要大量人工复核。
  pain_en: Manual image-by-image comparison is slow and error-prone, while classical differencing is sensitive
    to registration and illumination differences, generating false positives that require heavy manual
    review.
  current_alternative: 人工目视比对、传统影像差分算法，或采购商业遥感处理软件与外包制图。
  current_alternative_en: Manual visual comparison, classical image differencing, or commercial remote-sensing
    software and outsourced mapping.
  usage_reason: 推断：若该模型能在配准后直接输出变化区域掩膜，可省去人工逐幅圈画的步骤，让分析人员只复核候选区域；但公开材料未给出精度、处理速度或客户案例，无法确认它比现有差分流程更少误报，因此尚不能断言用户会持续选用。
  usage_reason_en: 'Inference: if the model outputs change masks directly after registration, it could
    remove the manual outlining step and leave analysts only reviewing candidate areas; however, no accuracy,
    throughput or customer case is public, so it cannot yet be claimed to produce fewer false positives
    than existing differencing pipelines or to be retained in workflows.'
