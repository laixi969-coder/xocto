  next_validation: 收集 Adlyse 官方定价页或客户案例，确认其按什么计价、代理可操作哪些广告平台以及人工确认环节。
  market: ''
  job: 广告投放运营人员在日常盯盘时，面对多个广告平台的预算、出价与素材数据，需要持续调整投放以维持效果，Adlyse 让 AI 代理代替人执行这些调整动作。
  job_en: Paid media operators watching campaigns daily face budget, bid and creative data across multiple
    ad platforms and must keep adjusting delivery to hold performance; Adlyse has AI agents perform those
    adjustments instead of the person.
  pain: 投放调优是高频、重复且依赖盯盘的体力活，人难以全天候覆盖，漏掉时段就可能浪费预算；这是从产品定位推导的工作流判断，不是用户口述。
  pain_en: Campaign tuning is high-frequency, repetitive, monitoring-dependent labor that a person cannot
    cover around the clock, and missed windows can waste budget; this is a workflow inference from the
    product positioning, not a user statement.
  current_alternative: 旧做法是投放人员手动登录各平台后台改预算、换素材、看报表，或用平台自带的自动出价规则。
  current_alternative_en: The legacy approach is operators manually logging into each platform back end
    to change budgets, swap creatives and read reports, or using the platforms' built-in automated bidding
    rules.
  usage_reason: 相较人工盯盘，代理把“发现异常—调整出价或预算”这一步从人的排班中拿掉，使非工作时段的调整也能发生；推断，投放团队在人力覆盖不足的时段会因此选择它。
  usage_reason_en: Compared with manual monitoring, the agent removes the detect-anomaly-then-adjust-bid-or-budget
    step from human shift schedules, so adjustments can happen outside working hours; this is an inference,
    and teams with thin coverage would choose it for that reason.
