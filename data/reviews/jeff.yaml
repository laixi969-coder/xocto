  market: ''
  job: 开发者在提交代码前，把待审的代码改动交给这个只读命令行工具，希望拿到语义层面的问题清单，再决定是否修改。
  job_en: Before submitting code, a developer hands pending changes to this read-only CLI to get a semantic
    list of issues, then decides what to change.
  pain: 人工逐行读改动容易漏掉跨文件的语义问题，而现有审查工具多绑定在特定托管平台或编辑器里，难以在本地或流水线中单独调用。
  pain_en: Reading diffs line by line misses cross-file semantic problems, and existing review tools are
    tied to a specific host or editor, so they are hard to call locally or in a pipeline.
  current_alternative: 同事互审、托管平台的合并请求评论，或把改动贴进通用聊天助手让模型看一遍。
  current_alternative_en: Peer review, merge-request comments on a hosting platform, or pasting the diff
    into a general chat assistant.
  usage_reason: 推断：相较把改动贴进聊天窗口，只读 CLI 能直接在本地仓库上运行并保持不写回代码，减少复制粘贴和担心被自动改动的顾虑，因此习惯命令行、又不想让工具改代码的开发者会试用它。公开材料没有用户反馈或留存证据。
  usage_reason_en: 'Inference: compared with pasting a diff into a chat window, a read-only CLI runs against
    the local repository and never writes back, removing copy-paste and the worry of automatic edits,
    so developers who live in the terminal and do not want a tool to modify code may try it. No user feedback
    or retention evidence is public.'
