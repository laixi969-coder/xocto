  usage_reason_en: 'Inference: versus cloud companion apps, it runs long-term memory and voice cloning
    locally on Windows, so users need not upload conversations or voiceprints to the cloud nor stitch
    memory and speech modules together themselves; privacy-conscious individuals who want their own voice
    and tolerate local setup would choose it in that situation.'
