  market: ''
  job: 安全调查人员或尽职调查分析师在收到一个待核查的邮箱地址时，需要判断该邮箱关联的公开账号、注册痕迹与泄露记录，以决定是否继续合作或升级风控。
  job_en: Security investigators or due-diligence analysts who receive an email address to check must
    determine its linked public accounts, registration traces and breach records before deciding whether
    to proceed or escalate risk control.
  pain: 这类核查过去要在多个公开站点之间反复搜索、手工拼接线索，耗时且容易漏掉关键痕迹，核查结论难以复核。
  pain_en: Such checks previously required repeated searching across many public sites and manually stitching
    clues together, which is slow, easy to miss key traces, and hard to review afterwards.
  current_alternative: 人工在搜索引擎、社交平台和泄露查询站点之间逐站检索，或使用零散的单点查询工具。
  current_alternative_en: Manual lookups across search engines, social platforms and breach-check sites
    one by one, or scattered single-purpose lookup tools.
  usage_reason: 推断：相较逐站手工检索，它把多个公开来源的查询收敛为一次邮箱提交并汇总成一份结果，减少了重复检索和线索拼接这一步，因此需要出具可复核核查结论的尽调或风控人员会在批量核查时选择它。
  usage_reason_en: 'Inference: compared with manual site-by-site searching, it collapses queries across
    multiple public sources into one email submission and one aggregated result, removing the repeated-search
    and clue-stitching step, so due-diligence or risk staff who must produce reviewable conclusions would
    choose it for batch checks.'
