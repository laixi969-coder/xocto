  market: ''
  job: 为代理接入 MCP 工具与技能的开发者，在搭建 DeepSeek Harness 时需要决定哪些能力此刻可用，并控制上下文占用。
  job_en: Developers wiring MCP tools and skills into an agent need to decide which capabilities are available
    at a given moment and keep the context footprint under control while setting up DeepSeek Harness.
  pain: 工具与技能全部暴露会挤占上下文、拖慢或干扰代理决策，逐个手工开关又难以维护，能力越多越难管。
  pain_en: Exposing every tool and skill eats context and can slow or derail agent decisions, while toggling
    them by hand is hard to maintain, and the problem grows with each added capability.
  current_alternative: 在配置文件里手工增删工具，或干脆全部常驻暴露，靠提示词约束代理少用。
  current_alternative_en: Hand-editing tool lists in config files, or exposing everything permanently
    and relying on prompts to discourage overuse.
  usage_reason: 推断：相较手工改配置或全部常驻，它把“哪些能力可见、以什么方式执行”变成三档可切换的设置，减少每次调整都要改文件并重启的负担，因此自建代理、上下文成本敏感的团队会先试它；公开材料无实测数据与用户反馈。
  usage_reason_en: 'Inference: compared with hand-editing configs or exposing everything, it turns "which
    capabilities are visible and how they execute" into three switchable tiers, cutting the burden of
    editing files and restarting on every change, so teams building their own agents and sensitive to
    context cost would try it first; public material has no measurements or user feedback.'
