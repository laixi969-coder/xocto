  market: ''
  job: 使用 Claude Code 等编码代理的开发者，在需要调用多个模型提供商（含本地模型）完成代码任务时，把代理请求交给一个统一网关，由它完成模型路由、流式输出、工具调用、推理与失败回退，最终拿到可用的模型响应。
  job_en: Developers using coding agents such as Claude Code route agent requests through a single gateway
    that performs model routing, streaming, tool calls, reasoning and fallbacks across multiple providers
    (including local models), so the agent gets a usable model response.
  pain: 公开材料只说明该网关支持多提供商路由与回退，未提供用户抱怨或使用反馈；从工作流结构推理，单一提供商接入时切换模型、处理限流或故障回退需要开发者自行改配置或写适配层，代理与模型之间的这层负担缺少统一承接。
  pain_en: Public material only states the gateway supports multi-provider routing and fallbacks, with
    no user complaints or feedback; by workflow inference, with a single provider, switching models or
    handling rate limits and failures requires developers to edit configs or write adapter layers, and
    no unified layer absorbs that burden between agent and model.
  current_alternative: 开发者目前可能直接绑定单一模型提供商的 API，或手动切换模型、为每个提供商分别配置代理与密钥，缺少统一的网关层。
  current_alternative_en: Developers currently likely bind directly to one provider's API, or manually
    switch models and configure separate agents and keys per provider, without a unified gateway layer.
  usage_reason: 推断：相较逐个提供商手动配置与切换，该网关把路由、流式、工具调用、推理和回退收敛到一次接入，开发者只需把代理指向网关即可换用或回退模型，因此需要频繁在多个模型间切换或想接入本地模型的
    Claude Code 用户会在这种情况下选择它；仓库星标从 626 增至 637 只说明关注度上升，不构成持续使用证据。
  usage_reason_en: 'Inference: versus configuring and switching providers by hand, the gateway consolidates
    routing, streaming, tool calls, reasoning and fallbacks into one integration, so developers only point
    the agent at the gateway to switch or fall back models; Claude Code users who frequently switch models
    or want local models would choose it in that situation. Stars rising from 626 to 637 indicate attention,
    not sustained use.'
