  market: ''
  job: 使用 Claude Code 等编码代理的开发者，在需要调用多个模型提供商（含本地模型）完成代码任务时，把代理请求交给一个统一网关，由它完成模型路由、流式输出、工具调用、推理与失败回退，从而在不改动代理配置的前提下切换或组合模型。
  job_en: Developers using coding agents such as Claude Code route agent requests through a single gateway
    that performs model routing, streaming, tool calls, reasoning, and fallbacks across multiple providers
    (including local models), so they can switch or combine models without reconfiguring the agent.
  pain: 编码代理通常绑定单一模型提供商：成本高、限流或故障时任务中断，且不同提供商的接口、流式与工具调用格式不一致，开发者需为每个代理单独适配，缺少统一的路由与回退层。
  pain_en: 'Coding agents are typically bound to one model provider: costs are high, rate limits or outages
    interrupt tasks, and providers differ in API, streaming, and tool-call formats, forcing per-agent
    adaptation with no unified routing or fallback layer.'
  current_alternative: 开发者目前手动切换模型或 API key、为不同代理分别配置提供商，或直接使用单一官方端点，缺少统一网关来集中处理路由、回退与本地模型接入。
  current_alternative_en: Developers currently switch models or API keys manually, configure providers
    separately per agent, or use a single official endpoint, with no unified gateway for routing, fallback,
    and local model access.
  usage_reason: 推断：相较手动切换与逐代理适配，该网关把多提供商差异收敛到一层，代理侧只需指向一个端点即可获得路由、流式、工具调用与回退，因此当开发者遇到成本、限流或需要本地模型时，会倾向选择它；仓库星标从
    623 增至 635 仅说明关注度上升，尚不构成持续使用证据。
  usage_reason_en: 'Inference: versus manual switching and per-agent adaptation, the gateway collapses
    multi-provider differences into one layer, so the agent only points at a single endpoint to get routing,
    streaming, tool calls, and fallback; developers facing cost, rate limits, or needing local models
    would tend to choose it. Stars rising from 623 to 635 indicate attention, not sustained use.'
