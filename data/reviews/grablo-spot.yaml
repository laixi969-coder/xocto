  market: ''
  job: 安防值班人员或门店店长在发生丢件、纠纷或事故后，需要从数小时甚至数天的监控录像里找出某个特定人物或车辆出现的片段。
  job_en: A security operator or store manager, after a theft, dispute or incident, needs to locate the
    clips where a specific person or vehicle appears within hours or days of footage.
  pain: 人工拖时间轴逐段回看极慢，关键片段容易漏掉，事后取证往往已经错过时效。
  pain_en: Manually scrubbing the timeline is extremely slow, key clips are easily missed, and evidence
    is often gathered too late.
  current_alternative: 目前多靠人工回放、按时间点猜测，或使用需要专门安装配置的传统 NVR 与视频分析软件。
  current_alternative_en: Today this is mostly manual playback and guessing at timestamps, or traditional
    NVR and video analytics software that requires dedicated installation and configuration.
  usage_reason: 推断：相较人工逐段回看，它把检索动作从“拖时间轴”换成“描述要找的人或车”，直接跳过定位片段这一步，因此已有摄像头但缺少专职监控人力的门店和物业会在事后取证时选择它。
  usage_reason_en: 'Inference: versus manual scrubbing, it replaces timeline dragging with describing
    the person or vehicle to find, skipping the clip-location step, so stores and property managers with
    cameras but no dedicated monitoring staff would pick it for after-the-fact evidence gathering.'
