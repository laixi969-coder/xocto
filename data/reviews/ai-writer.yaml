  market: ''
  job: 跨境电商卖家在新品上架前，把商品图片和基础参数整理成目标市场语言的商品标题、卖点与描述，用于平台刊登。
  job_en: Before listing a new product, cross-border e-commerce sellers turn product images and basic
    specs into target-market-language titles, selling points and descriptions for marketplace publishing.
  pain: 多语言商品文案通常靠人工翻译或逐条改写，SKU 多时重复劳动大，且容易与图片信息不一致；但候选材料未提供任何用户抱怨、替代流程或采用证据，痛点强度只能从任务结构推断。
  pain_en: Multilingual product copy is usually translated or rewritten by hand; with many SKUs the work
    is repetitive and easily inconsistent with the images. However, the candidate material offers no user
    complaints, alternative workflows or adoption evidence, so pain intensity is only inferred from task
    structure.
  current_alternative: 人工翻译、通用翻译工具、通用大模型对话，或平台自带的翻译与文案模板。
  current_alternative_en: Human translators, generic translation tools, general-purpose LLM chat, or built-in
    marketplace translation and copy templates.
  usage_reason: 推断：相较逐条人工翻译或通用对话改写，它把图片作为输入直接产出多语言文案，省去先描述商品再翻译的一步；但候选材料没有用户反馈或客户案例，无法确认卖家是否会因此把它留在上架流程里。
  usage_reason_en: 'Inference: compared with item-by-item human translation or generic chat rewriting,
    it takes images as input and outputs multilingual copy directly, skipping the step of first describing
    the product and then translating. But the candidate material has no user feedback or customer cases,
    so it cannot be confirmed that sellers keep it in their listing workflow.'
