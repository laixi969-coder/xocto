  market: ''
  job: macOS 用户在不离开当前窗口的情况下，用口述代替键盘，把一段指令交给本机命令行工具执行，并直接拿到结果。
  job_en: A macOS user, without leaving the current window, dictates an instruction to a local command-line
    tool instead of typing it, and gets the result directly.
  pain: 口述转写之后还要手动复制、切窗口、粘贴再执行，多出来的这几步让语音输入在真实工作里省不下时间；对需要长时间口述的人，键盘是瓶颈。
  pain_en: After dictation the user still has to copy, switch windows, paste and run, so the extra steps
    cancel the time voice input was supposed to save; for people who dictate at length, the keyboard is
    the bottleneck.
  current_alternative: 系统自带听写加手动粘贴，或 Whisper 类转写工具再自己复制到终端；也有人干脆继续打字。
  current_alternative_en: Built-in dictation plus manual pasting, or a Whisper-style transcriber whose
    output is copied into a terminal by hand; many simply keep typing.
  usage_reason: 推断：相较「转写—复制—粘贴—执行」的旧流程，它把语音直接接到本机命令执行，省掉中间的手动搬运，因此长时间口述、又习惯用命令行处理材料的人会愿意试；但公开材料没有用户反馈或留存证据，是否真被留在日常流程里无法确认。
  usage_reason_en: 'Inference: versus the old transcribe-copy-paste-run loop, it wires speech straight
    into local command execution and removes the manual handoff, which is why heavy dictation users who
    already work in a terminal would try it; there is no public user feedback or retention evidence, so
    lasting workflow adoption cannot be confirmed.'
