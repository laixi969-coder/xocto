    or UI and type manually, breaking attention; however, public materials do not show how common or intense
    this pain is.
  current_alternative: 守在终端或界面旁手动输入指令，或直接中断任务重新启动。
  current_alternative_en: Sitting at the terminal or UI and typing commands manually, or interrupting
    and restarting the task.
  usage_reason: 推断：相较守在终端手动输入，语音控制可让开发者在离开键盘时仍能叫停或调整任务，减少一次切换界面的动作；但公开材料未给出用户反馈或重复使用证据，尚不能确认开发者会把它留在日常工作流里。
  usage_reason_en: 'Inference: compared with sitting at the terminal typing commands, voice control lets
    a developer stop or adjust a task while away from the keyboard, removing one context switch; but public
    materials give no user feedback or repeat-use evidence, so it cannot be confirmed that developers
    keep it in their daily workflow.'
