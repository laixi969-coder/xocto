  market: ''
  job: AI 应用开发者在本地或服务器上运行耗时较长的 AI 任务时，需要在不中断任务的情况下对执行过程下达调整或停止指令。
  job_en: An AI application developer running a long AI task locally or on a server needs to issue adjustment
    or stop commands to the running process without interrupting it.
  pain: 长任务跑偏或需要改方向时，开发者必须切回终端或界面手动输入，等待和切换打断注意力；但公开材料未说明这一痛点有多普遍、多强烈。
