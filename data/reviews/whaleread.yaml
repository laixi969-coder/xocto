  market: ''
  job: 外文电子书读者在拿到一本没有目标语言版本的 TXT、Markdown 或 EPUB 电子书时，需要把整本书转成可读的译文版本。
  job_en: A reader who has obtained a TXT, Markdown, or EPUB book with no edition in their language needs
    the whole book turned into a readable translated version.
  pain: 整本书手动分段粘贴进翻译工具费时且丢格式；用云端整书翻译则必须把整本书上传，带来隐私和版权顾虑；等官方译本往往遥遥无期或价格高。
  pain_en: Pasting a whole book section by section into translators is slow and breaks formatting; cloud
    whole-book services require uploading the full file, raising privacy and copyright concerns; official
    editions are delayed or costly.
  current_alternative: 此前读者要么逐段复制到网页翻译器再手动拼回文件，要么使用需要上传整本书的云端 EPUB 翻译服务，要么等待官方译本或花钱请人翻译。
  current_alternative_en: Readers previously pasted passages into web translators and reassembled the
    file by hand, used cloud EPUB translation services that require uploading the whole book, waited for
    an official edition, or paid a human translator.
  usage_reason: 推断：它在本地完成整书翻译，省掉拆文件、逐段翻译、拼回格式的多步手工，也免去上传整本书的步骤；对在意藏书隐私、只想快速拿到可读译本的读者应有吸引力。是否反复使用尚无留存证据。
  usage_reason_en: 'Inferred: translating the full book locally removes the multi-step paste-and-reassemble
    work and the upload step, which should attract readers who want to keep their library private and
    just get a readable translation. No evidence yet of repeated use or retention.'
