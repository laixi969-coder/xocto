    side conversations rarely happen, and small-group discussion suffers.
  current_alternative: 用常规视频会议软件加分组房间，或另开语音频道模拟自由交流。
  current_alternative_en: Standard video-conferencing tools with breakout rooms, or separate voice channels
    to imitate free-form mingling.
  usage_reason: 推断：空间化场景让参与者能自行走近交谈，组织者不必手动分配分组房间，因此常办工作坊或培训的团队会尝试；但材料未说明 AI 承担什么动作，也无留存或复购证据，无法确认它被长期留在会议流程里。
  usage_reason_en: 'Inference: a spatial scene lets participants walk up and talk on their own, so organizers
    need not manually assign breakout rooms, which is why teams running frequent workshops or training
    would try it; but the material does not say what AI does, and there is no retention or repeat-use
    evidence, so long-term embedding in meeting workflows cannot be confirmed.'
