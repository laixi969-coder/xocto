  market: ''
  job: 远程团队组织者或在线活动主持需要在会议中安排小组讨论与自由交流，让参与者像在同一空间里走动交谈。
  job_en: A remote team organizer or online event host needs to run small-group discussion and free-form
    mingling so participants can move around and talk as if in one space.
  pain: 网格视频会议里参与者只能轮流发言，非正式交流与临时搭话难以发生，小组讨论体验差。
