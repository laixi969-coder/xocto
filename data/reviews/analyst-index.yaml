  market: ''
  job: 个人投资者在决定跟随某位分析师的荐股前，需要核对该分析师过去的喊单记录与实际结果，以判断是否值得参考。
  job_en: Before deciding to follow an analyst's stock picks, an individual investor needs to check that
    analyst's past calls against actual outcomes to judge whether the advice is worth using.
  pain: 荐股内容大量存在但历史命中率不透明，投资者只能凭印象或营销话术判断，跟错人的代价是真实亏损。
  pain_en: Stock-call content is abundant but historical hit rates are opaque, so investors judge by impression
    or marketing, and following the wrong person costs real money.
  current_alternative: 手动搜索分析师过往发言、看社交平台截图、依赖券商研报或付费荐股群。
  current_alternative_en: Manually searching an analyst's past statements, reading social-media screenshots,
    or relying on brokerage research and paid stock-tip groups.
  usage_reason: 推断：如果索引真能给出可核对的喊单历史与结果对照，投资者就不必逐条翻找旧发言，在决定是否跟单前多一道可核验的检查；但候选材料只有一句自述，没有说明数据来源、覆盖范围或交付形式，无法确认这一步负担是否真的被减少。
  usage_reason_en: 'Inference: if the index really provides checkable call history against outcomes, investors
    would not have to dig through old posts one by one and would gain a verifiable check before following
    a call. But the candidate material is a single self-description with no data source, coverage or deliverable,
    so it cannot be confirmed that this step is actually reduced.'
