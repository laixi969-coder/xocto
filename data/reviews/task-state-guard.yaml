    to incorrect deliveries or duplicated work.
  current_alternative: 目前开发者可能手动检查数据库或日志，或依赖代理自身的恢复机制，但缺乏系统性的核对工具。
  current_alternative_en: Currently developers may manually inspect databases or logs, or rely on the
    agent's own recovery mechanisms, but lack systematic reconciliation tools.
  usage_reason: 该工具提供状态预览和明确标记，能减少人工核对时间，提高代理任务的可靠性。
  usage_reason_en: The tool provides state preview and explicit marking, reducing manual reconciliation
    time and improving agent task reliability.
