  market: ''
  job: 软件工程师在 AI 代理批量改写代码后，需要处理大量自动生成的改动，并在合并前确认这些改动符合仓库既有规则。
  job_en: Software engineers, after AI agents rewrite code in bulk, must handle large volumes of generated
    changes and confirm they follow existing repository rules before merging.
  pain: AI 生成代码的速度超过人工审阅速度，逐行 review 成为瓶颈，漏审会带来线上故障。
  pain_en: AI generates code faster than humans can review it, so line-by-line review becomes the bottleneck
    and missed checks cause production incidents.
  current_alternative: 靠人工逐行审阅、CI 里零散的 lint 与测试，或口头约定规范。
  current_alternative_en: Manual line-by-line review, scattered lint and tests in CI, or unwritten conventions.
  usage_reason: 推断：它把仓库规则固化成提交前的自动关卡，省掉人工逐行比对规范这一步，因此团队在 AI 生成改动量大、又必须保证合规时会选择它。
  usage_reason_en: 'Inference: it turns repository rules into automatic pre-commit gates, removing the
    manual step of checking each line against conventions, so teams adopt it when AI-generated volume
    is high and compliance matters.'
