  market: ''
  job: 会议参与者（如销售、顾问、项目经理）在会前准备、会中记录、会后跟进的连续节点上，处理口头讨论内容，要产出可发送的书面记录与待办。
  job_en: Meeting participants such as salespeople, consultants and project managers handle spoken discussion
    across preparation, in-meeting capture and follow-up, and must produce sendable written records and
    action items.
  pain: 会议信息散落在口头讨论里，会后靠回忆补写纪要容易漏掉承诺和细节；现有做法要么边听边打字，要么会后重听录音。
  pain_en: Meeting information lives in spoken discussion, and writing notes afterwards from memory easily
    loses commitments and details; current practice is either typing while listening or replaying recordings
    later.
  current_alternative: 人工速记或边听边打字、通用语音转写工具加人工整理、会后重听录音补写纪要。
  current_alternative_en: Manual shorthand or typing while listening, generic speech-to-text tools plus
    manual cleanup, or replaying recordings to write notes afterwards.
  usage_reason: 推断：如果它能在会中直接产出结构化文字、省掉会后重听录音这一步，那么高频开会的销售和顾问会在需要当天发出纪要和待办时选择它；但公开材料只有一句定位，无法确认它是否真的减少了这一步，因此需求强度未明。
  usage_reason_en: 'Inference: if it produces structured text during the meeting and removes the step
    of replaying recordings afterwards, frequent meeting-goers such as salespeople and consultants would
    choose it when notes and action items must go out the same day; however, public material offers only
    a one-line positioning, so whether that step is actually removed cannot be confirmed and demand strength
    is unclear.'
