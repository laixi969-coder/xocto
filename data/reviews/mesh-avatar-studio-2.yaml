  market: ''
  job: 插画师或虚拟主播手上有一张角色插画，要把它变成能被面部或动作实时驱动的 2D 虚拟形象，用于直播或游戏。
  job_en: An illustrator or VTuber has a character illustration and needs it turned into a 2D avatar that
    can be driven in real time by face or motion for streaming or games.
  pain: 传统流程要在专业软件里手动切层、补画被遮挡部位、逐块绑定骨骼，对非动画专业的人门槛高、耗时长。
  pain_en: The traditional route requires manual layer slicing, redrawing occluded parts and binding bones
    piece by piece in professional software, which is slow and steep for non-animators.
  current_alternative: 在专业绑定软件里手工切图与绑定，或外包给绑定师，或直接买现成模型。
  current_alternative_en: Hand-slicing and rigging in professional software, outsourcing to a rigger,
    or buying a ready-made model.
  usage_reason: 推断：相比手工切层与逐块绑定，它把切图、网格化和动作绑定交给代理与本地编辑器一次完成，省掉补画遮挡部位和逐块绑骨这两步；对没有动画背景、又需要自有角色形象的虚拟主播和独立开发者，会在出新角色时选它。
  usage_reason_en: 'Inference: versus manual slicing and piece-by-piece rigging, it handles slicing, meshing
    and motion binding in one pass via the agent and local editor, removing the steps of redrawing occluded
    parts and binding bones individually; VTubers and indie developers without animation backgrounds who
    need their own character would pick it when launching a new avatar.'
