  market: ''
  job: 使用编码代理（如 Claude Code）的开发者在一轮会话进行中，把当前会话上下文与已安装的可用技能列表交给 CLI，需要判断下一步该调用哪个技能，并据此继续推进任务。
  job_en: A developer using a coding agent (e.g. Claude Code) mid-session feeds the live session context
    plus the list of installed skills into the CLI and must decide which skill to invoke next to keep
    the task moving.
  pain: 技能数量增长后，代理容易选错技能或一次全选，开发者要反复纠正并浪费上下文轮次；公开材料只说明排序与弃权机制存在，未提供用户抱怨或错误率数据，痛点强度属工作流结构推理。
  pain_en: As skill counts grow, agents pick the wrong skill or invoke everything, forcing repeated corrections
    and wasted context turns; public material only shows that ranking and abstention exist, not user complaints
    or error rates, so pain intensity is a workflow-structure inference.
  current_alternative: 当前做法是开发者在提示里手工点名技能，或完全交给模型自行判断，没有独立的排序、结构化输出与弃权环节。
  current_alternative_en: Today developers name the skill by hand in the prompt or leave the choice entirely
    to the model, with no separate ranking, structured output, or abstention step.
  usage_reason: 推断：相较手工在提示里点名技能，它读取实时会话上下文后直接输出排序 JSON，并在不确定时弃权，省去开发者自己比对上下文与技能清单的那一步；因此维护大量内部技能、且已接入
    Claude Code hooks 的团队更可能试用。仓库仅有星标增长，无留存或复购证据。
  usage_reason_en: 'Inference: versus naming a skill by hand in the prompt, it reads live session context
    and emits ranked JSON, abstaining when unsure, removing the step where the developer manually matches
    context against the skill list; teams maintaining many internal skills and already using Claude Code
    hooks are the likeliest triers. The repo shows only star growth, no retention or repeat-use evidence.'
