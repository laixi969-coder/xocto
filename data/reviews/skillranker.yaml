  - gate: model
    status: insufficient
    reason: 开源仓库未披露收费方式，且依赖第三方 API key，买方与付费路径不明；这是判断，不是已验证事实。
    evidence_ids:
    - ev-247a65b1623a34f5
  - gate: truth
    status: insufficient
    reason: 排序准确率、弃权是否可靠、本地反馈是否真的改善结果均无公开数据。
