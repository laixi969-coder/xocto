  market: ''
  job: 嵌入式开发者在为 ESP32 等无网络或低功耗设备添加语音交互时，需要把语音转文字和文字转语音跑在设备本地，完成可离线运行的语音输入输出。
  job_en: Embedded developers adding voice interaction to no-network or low-power devices such as ESP32
    need speech-to-text and text-to-speech running locally on the device to deliver offline voice input
    and output.
  pain: 云端语音 API 依赖联网、按次计费，且在隐私敏感或断网场景不可用，开发者要自己拼装离线模型与音频链路。
  pain_en: Cloud speech APIs require connectivity, charge per call, and fail in privacy-sensitive or offline
    scenarios, forcing developers to assemble offline models and audio pipelines themselves.
  current_alternative: 调用云端语音 API，或自行拼装开源语音模型与音频编解码，工作量大且依赖网络。
  current_alternative_en: Calling cloud speech APIs, or hand-assembling open-source speech models with
    audio codecs, which is laborious and network-dependent.
  usage_reason: 推断：相较云端 API 方案，它把识别与合成直接放到设备端运行，省去联网调用与按次计费这一步，因此对断网、低功耗或隐私敏感的硬件开发者更有吸引力；但尚无用户反馈或客户案例支持持续使用。
  usage_reason_en: 'Inference: compared with cloud API approaches, it runs recognition and synthesis directly
    on-device, removing the connectivity call and per-call billing step, which appeals to hardware developers
    with offline, low-power or privacy-sensitive needs; no user feedback or customer cases yet support
    sustained use.'
