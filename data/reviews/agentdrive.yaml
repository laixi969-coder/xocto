  market: ''
  job: 构建代理应用的开发者在代理需要跨会话保留和修改文件时，需要一套可持久化、可回溯版本的存储，以便代理任务能接着上次的状态继续。
  job_en: Developers building agent applications need persistent, versioned storage when agents must keep
    and modify files across sessions, so a task can continue from its previous state.
  pain: 代理产生的文件散落在本地或临时目录，跨会话丢失、无法回溯，出问题难以定位；但公开材料没有说明这一痛点在实际项目中的严重程度。
