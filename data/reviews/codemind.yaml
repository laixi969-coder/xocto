  market: ''
  job: 软件开发者把一段明确的编码任务交给代理执行，然后检查返回的代码能否直接进入项目。
  job_en: A software developer hands a defined coding task to an agent, then checks whether the returned
    code can go straight into the project.
  pain: 写代码本身耗时，但更麻烦的是代理产出的代码需要逐行核对、跑测试、判断能不能合并，验收负担没有消失。
  pain_en: Writing the code takes time, but the harder part is that agent output must be read line by
    line, tested and judged mergeable, so the review burden does not disappear.
  current_alternative: 开发者自己写，或用代码补全工具逐段生成后手工拼接，再靠本地测试和代码评审兜底。
  current_alternative_en: Developers write it themselves, or generate it piecewise with completion tools
    and stitch it by hand, relying on local tests and code review as the safety net.
  usage_reason: 推断：相比逐段补全，它把“整段任务”作为输入单位，减少开发者反复描述上下文和拼接片段的那一步；但公开材料没有说明它如何降低验收成本，因此哪类团队会长期采用仍缺少证据。
  usage_reason_en: 'Inference: versus piecewise completion it takes a whole task as the input unit, removing
    the step where developers re-describe context and stitch fragments; but public material does not say
    how it lowers review cost, so which teams would keep using it lacks evidence.'
