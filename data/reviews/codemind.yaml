  pain: 公开材料只承诺“拿回能跑的代码”，说明痛点在于代理产出后仍需逐行核对、跑测试、判断能否合并，验收负担并未消失；这是从产品承诺反推的工作流推理，尚无用户抱怨或案例佐证。
  pain_en: The public claim only promises 'code that works', implying the pain is that agent output still
