  market: ''
  job: 网站开发者或技术SEO工程师在新建或改版营销落地页时，把页面代码交给 AI 编码代理，要求代理按技术 SEO 规范完成结构化标记、性能与 Core Web Vitals 优化，交付一个可上线且通过
    PageSpeed 检测的落地页。
  job_en: A web developer or technical SEO engineer hands landing-page code to an AI coding agent and
    asks it to produce a launchable page with correct structured markup, performance and Core Web Vitals
    work, verified against PageSpeed.
  pain: 技术 SEO 的检查项分散在渲染、图片、脚本加载、结构化数据与 Core Web Vitals 上，开发者常在上线后才发现分数不达标，再回头逐项返工；不解决的后果是页面排名与转化受损，且返工成本落在开发排期上。
  pain_en: Technical SEO checks are scattered across rendering, images, script loading, structured data
    and Core Web Vitals; developers often discover failures only after launch and rework each item, hurting
    ranking and conversion while consuming engineering schedule.
  current_alternative: 当前替代是开发者凭经验手工调优，或使用 Lighthouse、PageSpeed Insights 等检测工具先测后改，再配合零散的 SEO 检查清单；这些工具只报告问题，不直接完成修复动作。
  current_alternative_en: Today developers hand-tune by experience, or run Lighthouse / PageSpeed Insights
    and scattered SEO checklists; these tools report problems but do not perform the fixes.
  usage_reason: 推断：相较先测后改的旧流程，该技能把 SEO 规则直接注入 AI 编码代理的生成过程，在写页面代码的同一步就产出符合技术 SEO 要求的实现，省去上线后逐项排查与返工这一步；因此正在用
    AI 代理生成落地页、又缺少专职技术 SEO 的开发者会在建页阶段选择它。
  usage_reason_en: 'Inference: unlike the test-then-fix loop, the skill injects SEO rules into the agent''s
    generation step so the page is written to technical-SEO requirements in the same pass, removing post-launch
    item-by-item rework; developers already generating pages with AI agents but lacking dedicated technical
    SEO would adopt it at build time.'
