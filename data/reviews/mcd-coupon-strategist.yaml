  market: ''
  job: 普通消费者在麦当劳门店点餐前，面对菜单、优惠券和满减规则，要决定买哪几样、怎么凑单才能花最少的钱。
  job_en: An ordinary consumer, before ordering at a McDonald's store, faces a menu, coupons and threshold
    discounts and must decide which items and combinations cost the least.
  pain: 优惠券、第二份半价、满减门槛叠加后，人工算最优组合很费神，还容易为了凑单多花钱。
  pain_en: Stacked coupons, second-item discounts and spend thresholds make manual optimization tedious,
    and users often overspend just to hit a threshold.
  current_alternative: 自己心算或凭经验点单，或在社交平台搜别人整理的省钱攻略，规则一变就失效。
  current_alternative_en: Mental math or habit-based ordering, or reading user-compiled money-saving guides
    on social platforms that go stale when rules change.
  usage_reason: 推断：相比自己心算，它直接读取门店菜单与券规则并输出一个可下单的组合，省掉逐条比对券门槛这一步；对价格敏感、每周多次点单的人，在规则更新后仍能拿到确定答案，因此会优先用它而不是搜攻略。
  usage_reason_en: 'Inference: versus mental math, it reads the store menu and coupon rules and outputs
    one orderable combination, removing the step of checking each threshold by hand; price-sensitive users
    ordering several times a week get a definite answer even after rules change, so they would reach for
    it instead of searching guides.'
