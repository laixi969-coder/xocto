  market: ''
  job: Linux/Wayland 桌面用户在不方便打字或需要快速记录时，对着麦克风口述，把语音变成文字直接落到当前正在编辑的应用里。
  job_en: A Linux/Wayland desktop user, when typing is inconvenient or notes must be captured fast, speaks
    into the microphone and gets the words inserted directly into the application currently being edited.
  pain: 主流语音输入法长期偏向 Windows 和 macOS，Linux 桌面用户要么手动打字，要么把音频传到云端服务，既慢又涉及隐私。
  pain_en: Mainstream voice input has long favored Windows and macOS, so Linux desktop users either type
    by hand or upload audio to cloud services, which is slow and raises privacy concerns.
  current_alternative: 手动打字，或使用需要联网、把音频上传到云端的语音转写服务，再复制粘贴回目标应用。
  current_alternative_en: Typing by hand, or using cloud transcription services that upload audio and
    then copy-pasting the result back into the target application.
  usage_reason: 推断：相较手动打字或云端转写再粘贴，它在本地完成识别并把文字直接注入当前应用，省掉了上传音频和复制粘贴两步，因此在意隐私或网络受限的 Linux 用户会在长文本口述时选择它。
  usage_reason_en: 'Inference: compared with typing by hand or cloud transcription plus pasting, it recognizes
    locally and injects text straight into the active application, removing the upload and copy-paste
    steps, so privacy-conscious or offline Linux users would pick it for long dictation.'
