  market: ''
  job: 独立开发者或小团队市场人员在产品上线前需要一支宣传片时，让编码 agent 读取产品信息生成带配乐的视频，再指着画面逐帧提出修改。
  job_en: Independent developers or small marketing teams who need a launch video before shipping let
    a coding agent read product information to generate a scored video, then point at frames to request
    revisions.
  pain: 宣传片通常要写脚本、找剪辑与动效外包，周期以周计且修改靠文字描述，小团队赶上线时既贵又慢。
  pain_en: Launch videos usually require scripting plus outsourced editing and motion design, take weeks,
    and revisions rely on written descriptions, making them costly and slow for small teams on a ship
    deadline.
  current_alternative: 旧做法是找剪辑或动效外包按项目报价，或用通用视频模板工具自行拼素材。
  current_alternative_en: The old way is hiring editors or motion designers per project, or assembling
    assets in generic video template tools.
  usage_reason: 推断：相较外包按文字来回改片，它让 agent 直接读产品信息出片，并支持指着画面定位修改，省去写修改说明与等待返工的环节，因此赶上线的小团队会先试。
  usage_reason_en: 'Inference: compared with outsourcing and revising via written notes, it lets the agent
    read product information to produce the film and supports pointing at frames to locate changes, skipping
    revision briefs and rework waiting, so small teams on a launch deadline would try it first.'
