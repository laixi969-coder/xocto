  market: ''
  job: 口播视频创作者（如知识口播、带货口播）在剪映里剪完原片后，拿到字幕稿，需要为整条视频配上与口播节奏对齐的动效层（关键词弹出、图表、贴纸、转场），并保持原片画质不被二次压缩。
  job_en: Talking-head video creators (knowledge or commerce talking-head clips) who have cut the base
    footage in CapCut take their subtitle script and need to build a motion-graphics overlay layer (keyword
    pops, charts, stickers, transitions) aligned to the spoken rhythm, without re-compressing the base
    footage.
  pain: 口播视频的动效层通常要逐句手动加关键帧、对齐字幕时间轴，一条几分钟的视频往往要花数小时；而把动效直接渲染进原片会二次压缩画质，创作者被迫在“省时间”和“保画质”之间取舍。
  pain_en: Overlay motion graphics on talking-head videos are usually keyframed line by line and manually
    aligned to the subtitle timeline, which takes hours for a few minutes of video; baking overlays into
    the base footage also re-compresses it, forcing creators to trade time savings against image quality.
  current_alternative: 当前替代方式是：在剪映等剪辑软件里手动逐句添加动效与关键帧；或使用剪映自带模板/贴纸，但模板与口播内容不匹配、仍需大量手工调整；或直接放弃动效层，只保留字幕。
  current_alternative_en: Today creators either hand-keyframe overlays line by line inside CapCut, use
    CapCut's built-in templates and stickers (which rarely match the spoken content and still need heavy
    manual adjustment), or skip overlays entirely and keep only subtitles.
