  usage_reason_en: 'Inference: versus full-repo scans or post-push CI checks, it narrows scanning to the
    changed lines and has a separate reviewer process re-check each finding, cutting the burden of triaging
    false positives so Claude Code/Codex users get a verdict tied to their own diff before pushing.'
