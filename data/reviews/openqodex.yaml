  pain_en: AI coding assistants inflate the volume of changed lines, so pre-push security and secret risk
    scales with the diff; full-repo scans are noisy and slow, so developers skip checks and push secrets
    or vulnerable dependencies that are costlier to fix later.
  current_alternative: 现有替代是仓库级 SAST/密钥扫描平台、CI 流水线中的检查，或依赖开发者手动 review 与 pre-commit 钩子；这些做法要么在推送后才报、要么对全仓产生大量误报。
