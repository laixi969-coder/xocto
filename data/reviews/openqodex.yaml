    scanners whose findings a person judges one by one.
  usage_reason: 推断：它把扫描限定在改动行并让独立审查进程复核每条发现，开发者不必在整库扫描结果里逐条筛选，推送前就能拿到与本次改动相关的结论，因此中小团队中负责合并代码的人可能选择它；实际误报率尚无公开证据。
  usage_reason_en: 'Inference: by scoping scans to changed lines and having a separate reviewer process
    recheck each finding, it spares developers from filtering whole-repository scan output and gives push-time
    conclusions tied to the change, which may lead merge owners in small teams to choose it; actual false-positive
    rates have no public evidence yet.'
