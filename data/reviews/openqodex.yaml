  market: ''
  job: 开发者在把改动推送到仓库前，需要对自己改动的代码行做安全、密钥、依赖与规范检查，并拿到可复核的审查结论。
  job_en: Before pushing changes to a repository, developers need security, secret, dependency and lint
    checks on the lines they changed, plus review conclusions they can verify.
  pain: 人工评审容易漏掉密钥泄露与依赖风险，上线后才发现问题的修复成本更高；公开材料未给出误报与漏报数据。
  pain_en: Manual review easily misses leaked secrets and dependency risks, and problems found after release
    cost more to fix; public material gives no false-positive or miss-rate data.
  current_alternative: 现有做法是人工代码评审，或使用独立的 SAST、密钥与依赖扫描工具，再靠人逐条判断扫描结果。
  current_alternative_en: The current approach is manual code review, or separate SAST, secret and dependency
    scanners whose findings a person judges one by one.
  usage_reason: 推断：它把扫描限定在改动行并让独立审查进程复核每条发现，开发者不必在整库扫描结果里逐条筛选，推送前就能拿到与本次改动相关的结论，因此中小团队中负责合并代码的人可能选择它；实际误报率尚无公开证据。
  usage_reason_en: 'Inference: by scoping scans to changed lines and having a separate reviewer process
    recheck each finding, it spares developers from filtering whole-repository scan output and gives push-time
    conclusions tied to the change, which may lead merge owners in small teams to choose it; actual false-positive
    rates have no public evidence yet.'
