  market: ''
  job: 使用 Claude Code 或 Codex 的开发者，在把本地改动推送到仓库之前，对本次改动的代码行运行 SAST、密钥、依赖与 lint 扫描，再由独立审查进程逐条复核扫描发现，得到针对改动行的审查结论，以决定是否推送。
  job_en: Developers using Claude Code or Codex run SAST, secrets, dependency and lint scanners on only
    the lines they changed before pushing, then a separate reviewer process re-checks each scanner finding
    against every changed line, producing a per-change review verdict before the push.
  pain: AI 编码助手让改动量骤增，推送前的安全与密钥风险随行数放大；传统全仓扫描噪声大、反馈慢，开发者容易在推送前跳过检查，把密钥或依赖漏洞带进仓库，事后修复代价更高。
  pain_en: AI coding assistants inflate the volume of changed lines, so pre-push security and secret risk
    scales with the diff; full-repo scans are noisy and slow, so developers skip checks and push secrets
    or vulnerable dependencies that are costlier to fix later.
  current_alternative: 现有替代是仓库级 SAST/密钥扫描平台、CI 流水线中的检查，或依赖开发者手动 review 与 pre-commit 钩子；这些做法要么在推送后才报、要么对全仓产生大量误报。
  current_alternative_en: Today's alternatives are repo-level SAST/secret scanning platforms, CI pipeline
    checks, or manual review and pre-commit hooks; these either report only after the push or flood the
    whole repo with false positives.
  usage_reason: 推断：相较全仓扫描或 CI 事后检查，它把扫描范围收窄到本次改动的行，并用独立审查进程复核每条发现，从而减少开发者逐条甄别误报的负担，让使用 Claude Code/Codex
    的开发者能在推送前一步拿到与本次改动直接对应的结论。
  usage_reason_en: 'Inference: versus full-repo scans or post-push CI checks, it narrows scanning to the
    changed lines and has a separate reviewer process re-check each finding, cutting the burden of triaging
    false positives so Claude Code/Codex users get a verdict tied to their own diff before pushing.'
