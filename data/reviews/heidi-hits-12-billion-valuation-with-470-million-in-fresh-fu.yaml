  market: ''
  job: 临床医生在门诊或问诊过程中，面对医患口头对话这一原始材料，需要把它变成可归档、可用于后续诊疗的病历记录。
  job_en: A clinician, during an outpatient visit or consultation, faces the raw material of a spoken
    doctor-patient conversation and needs to turn it into an archivable medical note usable for follow-up
    care.
  pain: 问诊时医生要同时听、问、记，事后补写病历往往占用下班时间，记录不全还会影响后续诊疗与合规。
  pain_en: During the visit the doctor must listen, ask and write at once; notes are often finished after
    hours, and incomplete records hurt follow-up care and compliance.
  current_alternative: 旧做法是医生自己手写或打字录入，或由医疗文员、 scribe 事后整理，也有用通用语音转写再手工改写的。
  current_alternative_en: The old way is the doctor typing or handwriting the note, or a medical scribe
    cleaning it up afterwards, sometimes with generic speech-to-text that is then rewritten by hand.
  usage_reason: 相较医生事后凭记忆补写或通用转写再改写，它把问诊对话直接转成结构化病历草稿，省掉从零组织病史、主诉与处置这一段，医生只需核对修改；推断常处理大量门诊文书、又缺少专职文员的医生会因此选择它。
  usage_reason_en: Compared with reconstructing notes from memory afterwards or rewriting generic transcripts,
    it turns the consultation conversation directly into a structured note draft, removing the step of
    assembling history, complaint and plan from scratch so the doctor only reviews and edits; the inference
    is that doctors handling heavy outpatient paperwork without a dedicated scribe would choose it for
    that reason.
