  market: ''
  job: 摄影记者或活动组织者在拍摄含陌生人面孔的抗议、集会照片后，需要在发布或交付前对这些图片做脱敏处理。
  job_en: A photojournalist or event organizer, after shooting protests or gatherings with strangers'
    faces, needs to redact those images before publishing or delivering them.
  pain: 公开发布可识别人脸的照片会带来隐私与安全风险，逐张手动模糊既慢又容易漏，把原图上传到云端工具又等于把敏感素材交出去。
  pain_en: Publishing identifiable faces creates privacy and safety risk; manual blurring is slow and
    error-prone, while uploading originals to cloud tools means handing over sensitive material.
  current_alternative: 用 Photoshop 等软件逐张手动模糊，或使用需要上传图片的在线打码服务。
  current_alternative_en: Manually blurring each image in Photoshop or similar software, or using online
    redaction services that require uploading the photos.
  usage_reason: 相较逐张手动模糊，它在浏览器本地一次性完成人脸检测、模糊与元数据清除，省掉逐张框选和上传素材这两步，因此处理敏感照片的记者和组织者会在发布前选择它；这是基于产品能力的推断，尚无用户反馈支持。
  usage_reason_en: Compared with manual per-image blurring, it does face detection, blurring and metadata
    removal in one local browser pass, removing the per-image selection step and the upload step, so journalists
    and organizers handling sensitive photos would choose it before publishing; this is inference from
    product capability, not supported by user feedback.
