  pain_en: Multi-platform work is scattered across separate clients with repeated manual clicking, and
    agents struggle to call them reliably; yet the public material only states unified commands and JSON
    output, without saying which manual step is replaced or how failures are handled.
  current_alternative: 人工在各平台客户端逐个操作，或分别写各平台的脚本与爬虫。
  current_alternative_en: Manual clicking in each platform's client, or writing separate scripts and scrapers
    per platform.
  usage_reason: 推断：相较逐个平台写脚本，它把多平台动作收敛成一套命令与 JSON 输出，省掉为每个平台单独适配接口这一步，因此同时维护多个平台账号的运营团队或做 Agent 的开发者可能选择它；但缺少实际调用、留存或客户案例证据，无法确认已被长期使用。
  usage_reason_en: 'Inference: versus writing scripts per platform, it collapses multi-platform actions
    into one command set and JSON output, removing the step of adapting an interface for each platform,
    so operations teams running many accounts or agent developers may pick it. No evidence of real usage,
    retention or customer cases, so long-term adoption cannot be confirmed.'
