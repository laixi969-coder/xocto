  market: ''
  job: 开发者在让编码代理执行多步任务时，需要查看代理状态、干预步骤并确认改动，而不是只看终端日志。
  job_en: Developers running multi-step coding agents need to inspect agent state, intervene in steps
    and confirm changes instead of reading terminal logs.
  pain: 长任务代理的中间状态藏在日志里，开发者难以判断哪一步出错、改了什么，也不敢放手让它跑完。
  pain_en: Intermediate state of long-running agents hides in logs, so developers struggle to see which
    step failed or what changed and hesitate to let it finish.
  current_alternative: 目前多靠终端输出、编辑器内置的代理面板或人工逐步确认。
  current_alternative_en: Today this is mostly done through terminal output, built-in agent panels in
    editors, or manual step-by-step confirmation.
  usage_reason: 推断：若界面能把代理每一步的状态与改动集中呈现并支持回退，开发者就不必在日志里逐行比对，因此跑长任务的团队会尝试；但公开材料未说明状态粒度、回滚能力或与现有编辑器的差异，无法确认它比旧做法少哪一步。
  usage_reason_en: 'Inference: if the UI centralises each agent step''s state and changes and supports
    rollback, developers no longer compare log lines by hand, so teams running long tasks would try it;
    but the material does not state state granularity, rollback ability or differences from existing editors,
    so which step it removes is unconfirmed.'
