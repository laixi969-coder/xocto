  market: ''
  job: 研发团队负责人在成员更替或复盘时，处理散落在多个编码代理会话里的历史记录，要还原某次改动为什么这样做、谁参与过。
  job_en: An engineering team lead, during handover or retrospective, works through history scattered
    across many coding-agent sessions to reconstruct why a change was made and who was involved.
  pain: 代理会话记录分散且难以检索，团队知识随会话结束而流失，新人或接手者只能重新问人或重读代码。
  pain_en: Agent session logs are scattered and hard to search, so team knowledge evaporates when a session
    ends and newcomers must re-ask people or re-read code.
  current_alternative: 目前靠人工翻聊天记录、翻提交历史，或直接问当事人；也有人干脆放弃追溯。
  current_alternative_en: Today people manually scroll chat logs, dig through commit history, or just
    ask the person involved; some simply give up on tracing it.
  usage_reason: 推断：如果它能把代理会话自动归集成可检索的关系图谱，接手者就不必逐条翻会话，可直接定位相关决策；但公开材料未说明输入格式、检索效果或是否有人复核，因此尚不能确认用户会持续使用。
  usage_reason_en: 'Inference: if it automatically consolidates agent sessions into a searchable relationship
