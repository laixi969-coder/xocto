  job_en: SREs and platform engineers, after AI inference services go live, work with GPU and inference-cluster
    metrics, logs and alerts to diagnose reliability and performance issues and handle capacity and incidents.
  pain: 推理服务的故障与成本波动同时出现在 GPU、网络和应用层，旧监控按主机和请求切分，排障要跨多个面板手工拼接，定位慢且容易漏掉容量拐点。
  pain_en: Inference failures and cost swings appear across GPU, network and application layers at once,
    while legacy monitoring is split by host and request, forcing manual cross-panel stitching that is
    slow and misses capacity inflection points.
  current_alternative: 现有替代是通用 APM 加自建 Prometheus/Grafana 面板，以及云厂商自带的 GPU 监控，团队靠值班手册和人工经验把几套数据拼起来。
  current_alternative_en: The current alternative is general APM plus self-built Prometheus/Grafana dashboards
    and cloud-vendor GPU monitoring, with teams stitching several data sets together through runbooks
    and manual experience.
  usage_reason: 推断：相较手工拼接多套面板，它把推理集群的指标、日志与告警放在同一处并围绕 AI 工作负载组织，减少排障时跨工具取数这一步，因此自建推理集群、值班压力大的平台团队会在故障与扩容决策时选择它。
  usage_reason_en: 'Inference: versus manually stitching multiple dashboards, it places inference-cluster
    metrics, logs and alerts in one place organised around AI workloads, removing the cross-tool data-gathering
    step, so platform teams running their own clusters under on-call pressure would choose it for incident
    and scaling decisions.'
