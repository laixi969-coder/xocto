  pain_en: Such tasks previously required manually switching between interfaces, copying and pasting and
    confirming step by step, which is tedious, easily interrupted and slow.
  current_alternative: 旧做法是用户自己在浏览器和本地软件里逐步操作，或使用只输出文本建议的对话式助手，再手动执行每一步。
  current_alternative_en: The old way is users operating step by step in browsers and local software themselves,
    or using chat assistants that only output text suggestions and then executing each step manually.
  usage_reason: 相较只给建议的对话助手，Manus 通过云电脑环境直接执行操作并交付结果，减少用户逐步手动执行这一环节；官方称 Cascade Agent 框架使任务耗时缩短 28.2%、运行成本降低
