  market: ''
  job: 编译器与运行时工程师在把 AI 生成的并行计算代码部署到 GPU 前，需要处理源码与验证脚本两套材料，完成正确性检查并让程序在 CPU 或 GPU 上跑通。
  job_en: Compiler and runtime engineers, before deploying AI-generated parallel code to GPUs, work with
    two sets of material — source code and verification scripts — to check correctness and get the program
    running on CPU or GPU.
  pain: AI 生成的并行代码错误往往在运行期才暴露，人工审查和补写测试成本高；候选材料未给出任何用户抱怨、采用或复购证据。
  pain_en: Errors in AI-generated parallel code often surface only at runtime, and manual review plus
    test writing is costly; the candidate material provides no user complaints, adoption or repeat-use
    evidence.
  current_alternative: 现有做法是人工审查 AI 输出，再另写测试或验证脚本，并在 CPU 与 GPU 之间分别维护代码路径。
  current_alternative_en: The current practice is to manually review AI output, write separate tests or
    verification scripts, and maintain separate code paths for CPU and GPU.
  usage_reason: 推断：若证明机制真能在编译阶段拦截错误，工程师可省去为 AI 生成代码补写验证脚本这一步，并在同一份源码上切换 CPU 与 GPU；但候选材料只有官网定位与社区讨论热度，缺少文档、实测或用户反馈来支撑这一因果，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if the proof mechanism really catches errors at compile time, engineers
    could skip writing verification scripts for AI-generated code and switch CPU/GPU from one source;
    but the material only offers site positioning and community attention, lacking docs, hands-on tests
    or user feedback to support this causal claim, so it is not yet confirmed that users would choose
    it for this reason.'
