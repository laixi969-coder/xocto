  market: ''
  job: 软件工程师在合并请求堆积、审查意见真假混杂时，需要处理代码差异并判断哪些问题必须改、哪些可以忽略，最终完成一次可合并的审查。
  job_en: Software engineers facing a backlog of merge requests and noisy review comments must process
    code diffs, decide which issues are real, and complete a mergeable review.
  pain: 人工逐条读 diff 和告警耗时，误报多时审查者会逐渐忽略全部提示，真正的问题被淹没。
  pain_en: Reading every diff and alert by hand is slow, and when false positives pile up reviewers start
    ignoring all warnings, burying real issues.
  current_alternative: 目前多由资深工程师人工审查，或使用静态分析工具与代码托管平台自带的检查，误报和噪音需要人工过滤。
  current_alternative_en: Today senior engineers review manually, or teams use static analysis and built-in
    code-hosting checks whose noise must be filtered by hand.
  usage_reason: 相较人工逐条读 diff，它先对差异做自动分诊并给出逐行意见，把“判断哪条告警值得看”这一步从审查者手里拿走；推断在误报率高、审查积压的团队里，工程师会因此选择它。
  usage_reason_en: Compared with reading every diff manually, it triages the diff and produces line-level
    comments, removing the 'which alert matters' step from the reviewer; inference is that engineers on
    teams with high false-positive rates and review backlogs would choose it for this reason.
