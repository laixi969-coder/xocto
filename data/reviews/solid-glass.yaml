  market: ''
  job: 前端或产品设计师在搭建 AI 应用界面、需要统一视觉与交互规范时，处理组件样式与交互规则，要完成一套可直接复用的界面规范。
  job_en: A front-end or product designer building an AI application interface and needing consistent
    visual and interaction rules works through component styles and interaction patterns to produce a
    directly reusable interface spec.
  pain: AI 应用界面缺少成熟范式，团队每次都要从零定样式和交互，重复劳动且体验不一致。
  pain_en: AI application interfaces lack established patterns, so teams define styles and interactions
    from scratch each time, duplicating work and producing inconsistent experiences.
  current_alternative: 现有做法是直接套用通用设计系统或组件库，再自行改造出 AI 场景需要的样式。
  current_alternative_en: Today teams adopt a general-purpose design system or component library and then
    adapt it themselves for AI scenarios.
  usage_reason: 推断：它把 AI 场景需要的材质与交互规则预先定好，设计师不必从通用组件库逐项改造，因此正在快速搭 AI 界面的独立开发者和小团队会直接采用；但仓库只有星数增长，没有采用或付费证据。
  usage_reason_en: 'Inference: it predefines the material and interaction rules AI scenarios need, so
    designers avoid adapting a general component library item by item, which is why indie developers and
    small teams building AI interfaces quickly would adopt it; but the repo shows only star growth, with
    no adoption or payment evidence.'
