  market: ''
  job: 反爬虫工程师或自动化测试工程师在需要让自动化浏览器访问带机器人检测的站点时，处理被检测站拦截的会话，要完成让自动化流量被判定为普通 Chrome 并稳定通过检测的任务。
  job_en: Anti-bot engineers or automation test engineers who need an automated browser to reach sites
    with bot detection handle sessions blocked by detection, aiming to make automated traffic score as
    ordinary Chrome and pass checks reliably.
  pain: 公开材料显示其卖点是检测站按普通 Chrome 评分、且是编译进二进制的 C++ 补丁而非 JS 注入；这对应旧做法（JS 注入或改 UA）容易被指纹识别、需要反复调试的痛点，但公开材料未给出用户抱怨原文或失败代价数据。
  pain_en: Public material shows the selling point is that detection sites score it as ordinary Chrome,
    via C++ patches compiled into the binary rather than JS injection; this maps to the pain that JS-injection
    or UA-spoofing approaches are easily fingerprinted and need repeated tuning, though no user complaint
    text or failure-cost data is public.
  current_alternative: 旧做法是 JS 注入式指纹伪装、改 User-Agent、使用普通无头浏览器或商业反检测浏览器；公开材料未说明用户具体从哪一种迁移过来。
  current_alternative_en: The prior approach is JS-injection fingerprint spoofing, User-Agent rewriting,
    plain headless browsers, or commercial anti-detect browsers; public material does not say which one
    users migrate from.
  usage_reason: 推断：相较 JS 注入在页面层被检测脚本识别的旧做法，它把指纹修改放在源码级 C++ 补丁并编译进二进制，减少了在页面层被识破后反复调参这一步负担，因此需要长期稳定通过检测的自动化工程师会在检测站频繁拦截时选择它；公开材料未提供用户自述动机。
  usage_reason_en: 'Inference: compared with JS injection that detection scripts can spot at the page
    layer, it moves fingerprint changes into source-level C++ patches compiled into the binary, removing
    the step of repeatedly retuning after page-layer detection, so engineers needing stable long-term
    passing would choose it when detection sites block frequently; no user-stated motivation is public.'
