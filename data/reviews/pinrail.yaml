  market: ''
  job: 软件工程师或技术负责人在同时运行多个编码智能体时，需要逐个查看它们产生的代码改动，决定哪些合并、哪些退回。
  job_en: A software engineer or engineering lead running several coding agents at once needs to inspect
    the code changes each one produced and decide which to merge and which to reject.
  pain: 多个智能体并行工作时，改动散落在不同终端和分支，人工要反复切换才能看清全貌，容易漏审或误合。
  pain_en: With several agents working in parallel, changes scatter across terminals and branches, forcing
    repeated context switching that makes missed or wrong merges likely.
  current_alternative: 在终端、编辑器与代码托管平台的合并请求页面之间来回切换，逐个查看 diff。
  current_alternative_en: Switching between terminals, the editor and pull-request pages on a code host
    to read each diff one by one.
  usage_reason: 推断：它把分散的待审改动集中成一个队列，工程师在一个界面里逐条处理，省掉在多个工具间来回找改动这一步，因此同时跑多个智能体的个人或小团队会在审阅环节选择它；但公开材料没有用户反馈或重复使用证据，长期留存无法确认。
  usage_reason_en: 'Inference: it gathers scattered pending changes into one queue so the engineer handles
    them in a single view, removing the step of hunting for changes across tools, so individuals or small
    teams running several agents may adopt it at the review step; public material has no user feedback
    or repeat-use evidence, so long-term retention is unconfirmed.'
