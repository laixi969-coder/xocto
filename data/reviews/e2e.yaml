  market: ''
  job: 测试工程师在版本发布前，为 Web、iOS、Android 三端编写并维护端到端测试脚本，确认关键流程没有回归。
  job_en: QA engineers write and maintain end-to-end test scripts for web, iOS and Android before a release
    to confirm key flows have not regressed.
  pain: 三端脚本各写一遍、维护成本高，界面一改就要同步修多处，回归测试常被压缩或跳过。
  pain_en: Scripts must be written once per platform and maintained in parallel; any UI change forces
    edits in several places, so regression testing is often compressed or skipped.
  current_alternative: 现有做法是各端分别使用 Appium、Detox、Playwright 等框架手写脚本，或由人工按用例逐条点测。
  current_alternative_en: The current practice is hand-written scripts per platform using Appium, Detox
    or Playwright, or manual click-through testing against a checklist.
  usage_reason: 推断：若代理能直接接收测试意图并跨三端执行，团队可省去为每端分别编写和维护脚本这一步，把回归测试从“改脚本”变成“描述任务”。但公开材料只有一句框架定位，未说明输入、执行与结果形态，因此尚不能确认它真能减少这一步负担。
  usage_reason_en: 'Inference: if agents can take a testing intent and execute it across three platforms,
    teams could skip writing and maintaining a script per platform, turning regression testing from editing
    scripts into describing tasks. But the public material is only a one-line positioning with no input,
    execution or output detail, so it cannot yet be confirmed that this step is actually reduced.'
