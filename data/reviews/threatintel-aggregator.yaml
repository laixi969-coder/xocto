  market: ''
  job: 安全运营中心分析师在每日值班时，面对多个外部威胁情报源推送的 IOC、报告和告警，需要筛出与本组织资产相关的条目，并转成可部署的检测规则。
  job_en: During daily shifts, a SOC analyst receives IOCs, reports and alerts pushed by multiple external
    threat intelligence feeds, must filter the items relevant to the organization's assets, and turn them
    into deployable detection rules.
  pain: 情报源分散、格式不一，人工逐条阅读和映射 ATT&CK 耗时，且容易漏掉与自身资产相关的条目；不处理的后果是检测规则更新滞后。
  pain_en: Feeds are fragmented and inconsistently formatted; reading and mapping each item to ATT&CK
    by hand is slow and easily misses items relevant to one's own assets, leaving detection rules stale.
  current_alternative: 分析师手工浏览情报源邮件与网页，用表格记录 IOC，再凭经验写 Sigma 或 Sentinel 规则；或购买商业威胁情报平台。
  current_alternative_en: Analysts manually browse feed emails and pages, log IOCs in spreadsheets, and
    hand-write Sigma or Sentinel rules from experience; or they buy a commercial threat intelligence platform.
  usage_reason: 相较手工浏览与表格记录，它把情报源聚合后由 AI 先做一轮分诊并自动映射 ATT&CK，分析师只需复核被筛出的条目，省掉逐条阅读和手工归类这一步；预算有限、又已用 Azure
    Sentinel 的安全团队会因此选择它（推断）。
  usage_reason_en: Compared with manual browsing and spreadsheets, it aggregates feeds and lets AI do
    a first triage pass with automatic ATT&CK mapping, so analysts only review the filtered items instead
    of reading and classifying each one; security teams with limited budget already on Azure Sentinel
    would choose it for that reason (inference).
