  market: ''
  job: 手机、手表、智能家居或机器人用户，在无网络或不便等待云端的场景下，对着设备说“开灯”等指令，需要本机在几十毫秒内完成语音理解与动作执行。
  job_en: A phone, watch, smart-home, or robot user, in a no-network or cloud-latency-intolerant situation,
    speaks a command such as 'turn on the light' and needs the device to understand and act locally in
    tens of milliseconds.
  pain: 云端语音助手依赖联网，断网或弱网时指令失效，且往返云端带来可感知延迟；把大模型塞进端侧又受内存与算力限制，用户要么忍受等待，要么放弃语音控制。
  pain_en: Cloud voice assistants require connectivity, fail offline or on weak networks, and add perceptible
    round-trip latency; fitting a capable model on-device is constrained by memory and compute, so users
    either wait or abandon voice control.
  current_alternative: 云端语音助手（如手机自带助手、智能音箱）或本地小模型/规则式语音命令；前者依赖网络与云端算力，后者能力有限、需手工配置。
  current_alternative_en: Cloud voice assistants (built-in phone assistants, smart speakers) or local
    small models / rule-based voice commands; the former depends on network and cloud compute, the latter
    is limited and requires manual setup.
  usage_reason: 推断：相较云端助手，Needle2 把 8-29MB 的模型直接跑在本机，省去联网与云端往返这一步，因此在断网、弱网或对延迟敏感的场景下，需要离线即时语音控制的手机、手表、智能家居与机器人用户会倾向选择它；公开材料尚未给出用户实际采用与持续使用的证据。
  usage_reason_en: 'Inference: versus cloud assistants, Needle2 runs an 8-29MB model directly on-device,
    removing the connectivity and cloud round-trip step, so users needing offline, low-latency voice control
    on phones, watches, smart-home devices, and robots would prefer it in no-network or latency-sensitive
    situations; public materials do not yet show actual adoption or sustained use.'
