  next_validation: 收集该仓库的 README、issue 与 discussion，确认筛查动作的输入输出、人工确认边界和接入方式。
  market: ''
  job: AI 应用运维或安全工程师在 agent 接入真实业务工具后，需要在每次工具调用和返回结果进入下游系统前完成筛查，决定放行还是拦截。
  job_en: AI application operations or security engineers, after an agent is connected to real business
    tools, must screen each tool call and returned result before it reaches downstream systems and decide
    whether to allow or block it.
  pain: agent 一旦能改数据、发请求，一次越权调用或异常返回就可能直接写坏业务记录，而现有做法往往只在事后看日志，缺少调用发生时的把关点。
  pain_en: Once an agent can change data and send requests, a single unauthorised call or abnormal result
    can corrupt a business record, while current practice usually only reviews logs after the fact and
    lacks a checkpoint at call time.
  current_alternative: 目前多由团队自己写校验脚本、在 agent 框架里加人工确认步骤，或事后翻日志排查，没有统一的门禁环节。
  current_alternative_en: Today teams mostly write their own validation scripts, add manual confirmation
    steps inside the agent framework, or dig through logs afterwards, with no unified gate.
  usage_reason: 推断：如果它真能在调用发生的当下接收工具调用与结果并给出放行或拦截判断，就省掉了事后翻日志再回滚的那一步，对已经让 agent 操作生产数据的团队有吸引力；但公开材料没有说明判断依据、误拦处理和接入方式，因此尚不能确认用户会持续使用。
  usage_reason_en: 'Inference: if it really receives tool calls and results at call time and returns an
    allow-or-block decision, it removes the step of digging through logs and rolling back afterwards,
    which appeals to teams already letting agents touch production data; however the public material does
    not explain the decision basis, handling of false blocks or integration, so continued use cannot be
    confirmed.'
