  market: ''
  job: 建站服务商或中小企业网站运营者在搭建与维护企业站页面时，用可视化搭建器和设计 token 调整版式，并通过 MCP 让 Claude 参与页面或内容改动，产出可上线的页面。
  job_en: A web agency or SMB site operator, building and maintaining business site pages, adjusts layouts
    with the visual builder and design tokens and lets Claude take part in page or content edits over
    MCP, producing publishable pages.
  pain: 多站点改版要在模板、样式与内容之间反复同步，人工改一处容易破坏其他页面的版式一致性。
  pain_en: Multi-site redesigns require repeated syncing between templates, styles and content, and a
    manual change in one place easily breaks layout consistency elsewhere.
  current_alternative: 用 WordPress 等 CMS 加插件手工改模板，或让前端逐个页面调整样式。
  current_alternative_en: Using WordPress-style CMS with plugins to edit templates by hand, or having
    front-end developers adjust styles page by page.
  usage_reason: 相较在传统 CMS 里逐页改模板和样式，它用设计 token 统一约束版式并让 Claude 通过 MCP 直接改页面，减少跨页面同步样式这一步；推断同时维护多个企业站的代理商更可能因此选择它。
  usage_reason_en: Compared with editing templates and styles page by page in a traditional CMS, it constrains
    layouts with design tokens and lets Claude edit pages over MCP, removing the step of syncing styles
    across pages; inference is that agencies maintaining several business sites would choose it for this.
