  market: ''
  job: 运维或值班工程师在夜间收到生产环境告警时，处理报错日志、监控指标和告警上下文，要完成故障定位与修复，让服务恢复。
  job_en: An on-call or site reliability engineer receiving a production alert at night works through
    error logs, monitoring metrics and alert context to locate and fix the fault and restore the service.
  pain: 夜间被叫醒后要在信息不全、时间压力大的情况下排查生产故障，响应慢会直接造成服务中断时长。
  pain_en: Being woken at night means diagnosing a production fault under incomplete information and time
    pressure, and slow response directly extends service downtime.
  current_alternative: 现有做法是人工值班加告警平台（如 PagerDuty 类工具）通知，再由工程师手动登录查看日志和回滚。
  current_alternative_en: The current practice is human on-call duty plus alerting tools that notify,
    after which engineers log in manually to read logs and roll back.
  usage_reason: 推断：若 agent 能在告警触发后自动拉取日志与指标并给出可回滚的修复动作，可省去工程师被叫醒后手动收集上下文这一步，因此没有专职夜班运维、又常出夜间故障的团队会考虑试用；但公开材料未说明它接入哪些系统、修复是否需人工确认，也缺少任何采用或留存证据。
  usage_reason_en: 'Inference: if the agent can automatically pull logs and metrics after an alert fires
    and propose a rollback-safe fix, it removes the manual context-gathering step after an engineer is
    woken, so teams without dedicated night-shift operations that frequently hit night incidents may try
    it; however, public material does not say which systems it connects to or whether fixes need human
    confirmation, and there is no adoption or retention evidence.'
