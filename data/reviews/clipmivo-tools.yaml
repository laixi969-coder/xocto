  market: ''
  job: 营销运营或电商卖家在需要批量产出短视频素材时，把商品图文、脚本或已有素材交给 ClipmivoAI 的接口或本地 MCP 服务，生成视频片段，再人工筛选出可投放的初稿。
  job_en: Marketing operators or e-commerce sellers who need short-video assets in bulk hand product images,
    scripts or existing material to ClipmivoAI's API or local MCP server to generate clips, then manually
    pick the drafts worth placing.
  pain: 短视频投放需要持续、成批的素材，人工逐条剪辑和套模板耗时且难以跟上投放节奏；外包制作又慢又贵，改一版要重新沟通。
  pain_en: Short-video ad placement needs a steady stream of assets; editing each clip by hand or filling
    templates is slow and hard to keep up with, while outsourcing is costly and every revision needs another
    round of briefing.
  current_alternative: 目前多由运营自己用剪辑软件套模板逐条制作，或外包给剪辑师、使用网页版视频生成工具手动一条条生成再下载。
  current_alternative_en: Today operators either cut each clip themselves in editing software with templates,
    outsource to freelance editors, or generate clips one by one in a web video tool and download them
    manually.
  usage_reason: 相较逐条手工生成或外包，接口与本地 MCP 服务让脚本或商品数据可以直接批量送入生成流程，省掉逐条上传、等待和下载的重复操作，因此需要成批出片的投放团队会优先尝试；这是基于产品能力的工作流推断，尚无客户案例或留存数据支持。
  usage_reason_en: Compared with generating clips one by one or outsourcing, the API and local MCP server
    let scripts or product data be fed into the generation pipeline in batches, removing repeated upload,
    wait and download steps, so teams that need clips at volume are likely to try it first; this is a
    workflow inference from product capability, not supported by customer cases or retention data.
