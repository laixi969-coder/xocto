  market: ''
  job: 零售门店或品牌营销人员在复盘货架陈列和店内广告位效果时，处理普通监控摄像头拍到的顾客画面，要判断顾客实际看向哪里。
  job_en: Retail store or brand marketing staff reviewing shelf displays and in-store ad placements process
    shopper footage from ordinary security cameras to determine where shoppers actually look.
  pain: 过去判断陈列和广告位效果靠人工观察、销量对比或专用眼动设备，前者主观、后者昂贵且部署门槛高。
  pain_en: Judging display and ad effectiveness used to rely on manual observation, sales comparisons
    or dedicated eye-tracking hardware; the first is subjective and the latter is costly and hard to deploy.
  current_alternative: 人工巡店记录、A/B 陈列对比销量，或采购专用眼动追踪设备与第三方客流分析服务。
  current_alternative_en: Manual store walks, A/B display tests against sales, or purchasing dedicated
    eye-tracking devices and third-party foot-traffic analytics.
  usage_reason: 推断：它直接复用门店已有的普通摄像头画面，用开源模型估算视线落点，省去采购专用眼动设备和现场标注这一步，因此预算有限、已有摄像头的零售运营方会在陈列复盘时尝试它；目前缺少精度与真实门店采用证据。
  usage_reason_en: 'Inference: it reuses existing ordinary store cameras and estimates gaze targets with
    open models, removing the need to buy dedicated eye-tracking hardware and manually annotate footage,
    so budget-constrained retail operators with cameras may try it during display reviews; accuracy and
    real store adoption evidence are still missing.'
