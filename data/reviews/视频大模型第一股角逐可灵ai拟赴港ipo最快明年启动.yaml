  usage_reason_en: 'Inference: versus outsourced shoots or stock stitching, it compresses script-to-clip
    into one generation, skipping scheduling and first-cut editing, so e-commerce and ad teams producing
    frequent test assets pick it, with humans still selecting and clearing clips.'
