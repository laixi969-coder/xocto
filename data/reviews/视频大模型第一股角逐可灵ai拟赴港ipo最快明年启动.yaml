    or recutting; ads and e-commerce need many style-consistent variants for placement tests.
  current_alternative: 旧做法是找拍摄团队或剪辑外包，或用素材库拼接加简单动效，前者贵且慢，后者同质化严重、难以按脚本定制。
  current_alternative_en: The old route is hiring a shoot crew or editing vendor, or stitching stock footage
    with simple motion effects; the first is expensive and slow, the second is generic and hard to tailor
    to a script.
