  market: ''
  job: 短视频创作者、广告创意和电商内容运营在需要按脚本或参考图产出可投放的动态素材时，用文字或图片提示生成视频片段，再自行剪辑、配音和投放。
  job_en: Short-video creators, ad creatives and e-commerce content operators generate clips from text
    or image prompts when they need publishable motion assets from a script or reference image, then edit,
    dub and place them.
  pain: 实拍或外包制作一条素材成本高、周期长，改一版就要重拍或重剪；广告与电商又需要大量风格一致的变体做投放测试。
