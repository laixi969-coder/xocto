  next_validation: 收集 Punch 官方产品页或文档，确认它接收的输入材料、AI 执行的具体动作与最终交付物。
  market: ''
  job: 群聊参与者（如项目群、卖家群成员）在聊天记录被大量无关消息淹没时，需要把其中被反复引用或需要留存的信息挑出来并保存下来，以便之后查找。
  job_en: Group chat participants (e.g. project or seller group members) whose chat history is flooded
    with noise need to pick out and keep the messages that are repeatedly cited or worth retaining, so
    they can find them later.
  pain: 群聊信息流速度快、上下文碎片化，重要内容很快被刷走；候选资料没有说明用户目前因此付出什么代价，也没有用户抱怨或替代行为的记录。
  pain_en: Group chat moves fast and context is fragmented, so important content is quickly buried; the
    candidate material does not state what this costs users today, and there is no record of user complaints
    or workaround behaviour.
  current_alternative: 公开材料未说明现有替代方式；按常见做法推断，用户可能手动截图、收藏或复制到备忘录，但这是推断，不是候选资料中的事实。
  current_alternative_en: The public material does not describe existing alternatives; by common practice
    one might infer users screenshot, bookmark or copy messages into notes, but this is inference, not
    a fact in the candidate material.
  usage_reason: 候选资料只有一句产品说明，无法说明它相较旧做法减少了哪一步负担或改善了哪项可核对结果，因此无法给出使用理由；缺少的是对输入材料、AI 动作与交付物的具体描述。
  usage_reason_en: The candidate material contains only a one-line product description and cannot show
    which step of the old workflow it removes or which verifiable result it improves, so no usage reason
    can be given; what is missing is a concrete description of input material, AI action and deliverable.
