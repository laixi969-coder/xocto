    to perform selection, coloring, measurement, and figure generation on a loaded PDB structure inside
    a live PyMOL session, and obtain a usable structural image or analysis result; they want to drive
    this with natural-language instructions through Claude Code, with the MCP server applying actions
    to the running PyMOL session over XML-RPC.
  pain: PyMOL 的操作依赖命令行语法与脚本，非专职写脚本的研究者常需反复查文档、试命令、手动重做视图；把 AI 接入实时会话可减少在“描述意图”和“写出正确 PyMOL 命令”之间的来回翻译成本。这是基于产品能力与工作流结构的推断，公开材料未提供用户抱怨或耗时数据。
  pain_en: PyMOL operations depend on command-line syntax and scripting, so researchers who are not dedicated
    scripters often have to re-check documentation, trial commands, and manually redo views; connecting
    an AI to the live session can reduce the back-and-forth of translating intent into correct PyMOL commands.
    This is an inference from product capability and workflow structure, not from public user complaints
    or timing data.
  current_alternative: 旧做法是手动在 PyMOL GUI 或命令行里逐条输入命令、写 PyMOL 脚本，或把结构导出到其他工具再处理；公开材料未说明用户具体替代了哪一步。
