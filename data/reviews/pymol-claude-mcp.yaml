    which step users actually replace.
  usage_reason: 推断：相较手动敲 PyMOL 命令或写脚本，该产品通过 MCP 把 Claude Code 的自然语言指令直接转成对实时 PyMOL 会话的 XML-RPC 调用，省去用户自己查语法、拼命令这一步，因此不熟悉
    PyMOL 脚本、但需要快速出结构图或做结构分析的研究者会在探索性分析场景下选择它。公开材料尚无用户反馈或案例证实这一动机。
  usage_reason_en: 'Inference: compared with manually typing PyMOL commands or writing scripts, the product
