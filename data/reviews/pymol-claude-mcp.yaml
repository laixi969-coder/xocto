  job: 结构生物学家或计算化学家在分析蛋白质/分子结构时，需要把已加载的 PDB 结构在 PyMOL 会话里完成选择、着色、测量、出图等操作，并拿到可用的结构图像或分析结果；他们希望用自然语言指令驱动
