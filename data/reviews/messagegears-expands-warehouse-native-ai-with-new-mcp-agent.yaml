    be judged from public facts.
  current_alternative: 推断：企业通常把仓库数据导出到独立营销云或 CDP，再在其中配置触达与预测，这一旧流程的具体形态未在材料中说明。
  current_alternative_en: 'Inference: enterprises typically export warehouse data into a separate marketing
    cloud or CDP and configure outreach and prediction there; the exact shape of this old workflow is
    not described in the material.'
  usage_reason: 推断：若 AI 能直接在仓库内读取数据并调用预测模型，可省去数据导出与同步这一步，从而让营销团队在数据更新后更快触发动作；但材料未给出客户案例或使用反馈，无法确认这一取舍是否被用户实际选择。
  usage_reason_en: 'Inference: if AI can read data and call predictive models directly inside the warehouse,
    the export-and-sync step could be removed, letting marketing teams act sooner after data updates;
    however, the material provides no customer case or user feedback, so it is unconfirmed whether users
    actually make this trade-off.'
