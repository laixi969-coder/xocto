  job_en: Marketing operations and CRM owners whose customer data already lives in their own warehouse
    want to trigger personalized outreach and predictions from that data without first copying it into
    an external marketing platform.
  pain: 候选材料只给出功能清单（MCP、Agent API、预测模型），没有说明此前由谁、用什么工具、花多久完成同一件事，因此痛点强度无法从公开事实判断。
