  market: ''
  job: 处理敏感资料的知识工作者在不能把材料上传云端的情况下，需要在本机读取数据、汇总信息并完成多步任务，最终拿到留在设备上的结果。
  job_en: Knowledge workers handling sensitive material, who cannot upload it to the cloud, need to read
