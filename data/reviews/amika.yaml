  market: ''
  job: 使用编码代理的开发者或小团队，在多人需要同时查看和操作同一套代码与运行环境时，处理本地或云端的开发环境，要完成让人类与代理在同一环境里协同执行任务。
  job_en: Developers or small teams using coding agents who need several people to view and operate the
    same code and runtime, working with local or cloud development environments to let humans and agents
    execute tasks in one shared environment.
  pain: 代理在个人机器上运行，环境配置和状态难以共享，多人协作时容易出现环境不一致、重复搭建和结果无法复现的问题。
  pain_en: Agents run on individual machines, so environment configuration and state are hard to share,
    and multi-person collaboration suffers from inconsistent environments, repeated setup and irreproducible
    results.
  current_alternative: 旧做法是各自在本地搭建环境，或用容器、远程开发机与共享仓库约定配置，靠文档和口头同步保持环境一致。
  current_alternative_en: The old approach is for each person to set up locally, or to use containers,
    remote development machines and shared repositories with agreed configuration, keeping environments
    aligned through documentation and verbal sync.
  usage_reason: 推断：相较各自本地搭建再靠文档同步，Amika把代码与运行环境放进同一个可共同进入的云工作站，减少的是环境重复搭建和状态对齐这一步，因此多人同时使用编码代理、且对结果可复现性有要求的团队会考虑它；目前没有客户案例或使用数据支持。
  usage_reason_en: 'Inference: compared with local setup plus documentation sync, Amika puts code and
    runtime into one jointly accessible cloud workstation, removing the step of repeated environment setup
    and state alignment, so teams where several people use coding agents and need reproducible results
    may consider it; there is no customer case or usage data supporting this yet.'
