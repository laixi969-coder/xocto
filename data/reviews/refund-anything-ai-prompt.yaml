  market: ''
  job: 普通消费者在订阅、数字购买或预订被拒退时，整理订单凭证与拒退理由，写出一封能推动对方退款的交涉函件。
  job_en: An ordinary consumer whose subscription, digital purchase or booking refund was refused gathers
    order proof and the rejection reason, then writes a letter that can move the counterparty to refund.
  pain: 多数人不知道适用哪条消费者保护规则，也不知道措辞升级到什么程度，往往写一封邮件被拒后就放弃，钱直接损失。
  pain_en: Most people do not know which consumer-protection rule applies or how far to escalate the wording,
    so they often give up after one rejected email and simply lose the money.
  current_alternative: 自己搜索模板、在论坛问人、反复给客服发邮件，或直接放弃这笔钱。
  current_alternative_en: Searching for templates, asking in forums, repeatedly emailing customer support,
    or simply writing the money off.
  usage_reason: 相较自己找模板，它把“查适用规则、定语气、写升级路径”三步合成一次生成，用户只需补订单事实即可得到可直接发送的函件；推断在跨境订阅和小额预订纠纷中，怕麻烦又不想放弃退款的消费者会先试它。
  usage_reason_en: Compared with hunting for templates, it merges three steps — finding the applicable
    rule, setting the tone and writing the escalation path — into one generation, so the user only supplies
    order facts and gets a sendable letter; by inference, consumers facing cross-border subscription or
    small booking disputes who dislike the hassle but not the loss will try it first.
