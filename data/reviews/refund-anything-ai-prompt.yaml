  market: ''
  job: 普通消费者在订阅、数字购买或预订被商家拒绝退款时，把订单信息、拒退理由和所在辖区交给这套提示词，让模型按“先礼貌交涉、后法律升级”两段生成可直接发送的退款函件，覆盖30多个司法辖区，用户自己核对事实后发出。
  job_en: An ordinary consumer whose subscription, digital purchase or booking refund was refused hands
    the order details, refusal reason and jurisdiction to this prompt so the model drafts a two-stage
    refund letter (polite request first, legal escalation second) across 30+ jurisdictions, which the
    user fact-checks and sends.
  pain: 拒退后消费者面对的是不对称博弈：商家有模板化话术和客服流程，个人既不知道本地消费者法赋予什么权利，也不知道该写什么措辞才有效，往往在第一次被拒后就放弃，损失的是已付金额本身。
  pain_en: 'After a refusal the consumer faces an asymmetric fight: the merchant has scripted responses
    and support workflows, while the individual neither knows what local consumer law grants nor what
    wording works, so many give up after the first rejection and lose the money already paid.'
  current_alternative: 现有替代是自己在搜索引擎里零散查消费者权益条款、在论坛抄别人的投诉信模板、直接打客服电话反复交涉，或者干脆放弃这笔钱；这些做法要么耗时，要么措辞不对口，要么根本不知道有申诉路径。
  current_alternative_en: Today people piece together consumer-law clauses from search results, copy complaint-letter
    templates from forums, repeatedly call support, or simply write the money off; these routes are slow,
    poorly worded for the specific case, or assume the user even knows an escalation path exists.
  usage_reason: 推断：相较自己搜条款和抄模板，该提示词把“判断适用哪条消费者保护规则、按辖区组织措辞、并预先写好升级到法律威胁的第二封信”这几步一次性完成，用户只需填入订单事实并核对，因此被拒退且金额值得追讨的消费者会在第一次交涉失败后选择它。
  usage_reason_en: 'Inference: versus searching clauses and copying templates, the prompt collapses the
    steps of picking the applicable consumer-protection rule, wording it per jurisdiction, and pre-writing
    the second escalation letter into one pass, so a consumer with a refused refund worth chasing would
    turn to it after the first rejection fails.'
