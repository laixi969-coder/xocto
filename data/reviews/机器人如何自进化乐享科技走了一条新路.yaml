  market: ''
  job: 餐饮门店或中央厨房在营业高峰接到随机点单时，由机器人处理食材与工具、烤制翻面并上菜，把一单烧烤完整出餐。
  job_en: During peak hours, a restaurant or central kitchen receiving random orders has a robot handle
    ingredients and tools, grill, flip and serve, completing one grill order end to end.
  pain: 后厨烧烤依赖熟练工连续盯火、翻面和上菜，人手紧张时出餐慢、品质不稳；临时加单或打断会打乱节奏。
  pain_en: Grill work depends on skilled staff continuously watching heat, flipping and serving; with
    thin staffing, output is slow and uneven, and added orders or interruptions break the rhythm.
  current_alternative: 目前主要靠厨师手工完成，或使用固定程序的烧烤设备，遇到打断和变化需要人工重新接管。
  current_alternative_en: Today this is mostly done by hand by cooks, or with fixed-program grilling equipment
    that needs a human to take over when interruptions or changes occur.
  usage_reason: 推断：相较固定程序设备，它试图在被打断或加单后自行重新寻找信息、调整动作继续推进任务，减少人工重新接管这一步；但直播中出现停顿与失败，是否真能减少人工介入尚无公开证据。
  usage_reason_en: 'Inference: versus fixed-program equipment, it tries to re-find information and adjust
    motions to continue after an interruption or added order, removing the step where a human takes over;
    the livestream showed pauses and failures, so whether it truly reduces human intervention is not yet
    publicly evidenced.'
