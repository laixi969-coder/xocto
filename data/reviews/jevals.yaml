  market: ''
  job: AI 团队在模型上线前评估输出质量时，需要把一批模型输出逐条判定为合格或不合格，用于回归比对和发布决策。
  job_en: Before shipping a model, an AI team needs to judge a batch of model outputs as pass or fail
    for regression comparison and release decisions.
  pain: 用另一个模型当评委打分时，评分口径不稳定、结果不可复现，团队难以把判定结果直接接入评测流程做比对，只能人工复核或反复调提示词。
  pain_en: Using another model as a judge gives unstable, non-reproducible scores, so teams cannot plug
    the verdicts into their evaluation pipeline for comparison and must re-check by hand or keep rewriting
    prompts.
  current_alternative: 当前做法是写提示词让 LLM 当评委打分，或人工抽样逐条阅读输出，再靠脚本把自由文本分数解析成可用字段。
  current_alternative_en: Today teams prompt an LLM to score as a judge, or sample and read outputs by
    hand, then parse free-text scores into usable fields with scripts.
  usage_reason: 相较自由文本打分，它要求用户先定义带类型的判定规则，模型按规则返回结构化判定，省掉把非结构化评分解析成字段这一步，并让同一规则可重复用于回归比对；这是基于产品说明的工作流推断，尚无用户留存或复购证据。
  usage_reason_en: Compared with free-text scoring, it has users define typed decision rules and returns
    structured verdicts, removing the step of parsing unstructured scores into fields and making the same
    rule reusable for regression comparison; this is workflow inference from the product description,
    with no retention or repeat-use evidence yet.
