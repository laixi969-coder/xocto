  market: ''
  job: AI 团队在模型上线前做质量评估时，需要判断一批模型输出是否达标，处理的是评测集里的输入输出样本。
  job_en: AI teams assessing quality before a model launch need to judge whether a batch of model outputs
    meets the bar, working on input-output samples in an evaluation set.
  pain: 用另一个模型当评委时，打分口径不稳定、结果难以复现，同一批样本多次评测结论可能不一致，团队无法据此做上线决策。
  pain_en: When another model acts as judge, scoring criteria drift and results are hard to reproduce;
    the same sample batch can yield inconsistent verdicts across runs, leaving teams unable to make launch
    decisions.
  current_alternative: 写提示词让 LLM 评委打分、人工抽样复核、用规则脚本做关键词或格式检查。
  current_alternative_en: Prompting an LLM judge to score, manually sampling for review, or using rule
    scripts for keyword and format checks.
  usage_reason: 推断：若判定规则以带类型的方式固定下来，团队可省去反复调评委提示词和人工比对打分口径这一步，评测结论也能被版本化追溯；但公开材料未给出判定类型定义、与现有评测框架的衔接或稳定性对比数据，减少负担的程度无法确认。
  usage_reason_en: 'Inference: if decision rules are fixed in typed form, teams could skip repeatedly
    tuning judge prompts and manually reconciling scoring criteria, and verdicts become version-traceable;
    however, public material gives no decision type definitions, integration with existing evaluation
    frameworks, or stability comparisons, so the extent of effort saved cannot be confirmed.'
