  market: ''
  job: 小团队或外包团队的额度管理员，在只有部分成员持有 AI 订阅、又要按具体任务交付时，把可用额度分配给执行任务的成员并完成调用。
  job_en: A quota admin in a small or outsourced team, when only some members hold AI subscriptions and
    work is delivered task by task, allocates usable quota to the member doing the task and completes
    the call.
  pain: 共享账号意味着密码外泄、并发冲突和用量无法归属；不共享则要么重复购买订阅，要么有人干不了活。
  pain_en: Sharing an account leaks passwords, causes concurrent-session conflicts and makes usage unattributable;
    not sharing means buying duplicate subscriptions or leaving someone unable to work.
  current_alternative: 把账号密码发给同事、共用一台机器，或干脆每人各买一份订阅。
  current_alternative_en: Sending account credentials to colleagues, sharing one machine, or simply buying
    a separate subscription per person.
  usage_reason: 相较直接共享账号，它把访问拆成按任务的授权，成员不需要拿到他人密码即可调用，管理员也能看到额度用在哪；推断这类用户会在多人共用少量订阅、又需要区分任务归属时选择它。
  usage_reason_en: Compared with sharing an account outright, it splits access into per-task grants so
    a member can call the model without holding someone else's password and the admin can see where quota
    went; the inference is that such users pick it when few subscriptions are shared by many people and
    task attribution matters.
