  market: ''
  job: 团队 AI 订阅额度管理员在团队里只有部分成员购买了 AI 订阅时，按任务把可用调用额度分配给指定成员，让成员完成写作、编码等具体任务而不必登录他人账号。
  job_en: A team AI subscription quota administrator allocates usable call quota task by task to specific
    members when only some teammates hold AI subscriptions, so members can complete writing or coding
    tasks without signing in to someone else's account.
  pain: 共享订阅的常见做法是传递账号密码或让成员共用同一登录态，带来凭据泄露、会话冲突、用量无法按任务归属的问题；管理员也无法按任务粒度控制谁用了多少。
  pain_en: The common way to share a subscription is passing around credentials or sharing one login session,
    which creates credential-leak risk, session conflicts, and no per-task attribution of usage; the admin
    also cannot control who consumed how much at task granularity.
  current_alternative: 公开材料未直接描述旧流程，但产品定位本身指向的替代方式是成员共用同一账号登录、或各自重复购买订阅、或管理员手工转达额度。
  current_alternative_en: Public materials do not directly describe the old workflow, but the positioning
    implies the alternatives are members sharing one account login, each buying a duplicate subscription,
    or the admin manually relaying quota.
  usage_reason: 推断：相较传递账号密码，产品把额度按任务转给指定成员，成员拿到的是可用调用能力而非他人凭据，从而减少凭据外泄与登录态冲突这一步负担；需要按任务分配额度又不想共享密码的团队管理员会因此选择它。
  usage_reason_en: 'Inference: compared with passing credentials around, the product transfers quota task
    by task to a named member, who receives usable call capability rather than someone else''s credentials,
    removing the credential-leak and session-conflict step; admins who must allocate quota per task without
    sharing passwords would choose it.'
