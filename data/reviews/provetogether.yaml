  next_validation: 收集 provetogether 问题页的公开进展记录或形式化校验说明，确认智能体产出的证明步骤是否被机器验证、是否有研究者引用或采用。
  market: ''
  job: 数学研究者和形式化证明工作者在推进未解猜想时，需要把猜想拆成可验证的引理，并逐条确认证明步骤是否成立。
  job_en: Mathematicians and formal-proof workers advancing an open conjecture need to split it into verifiable
    lemmas and confirm step by step whether each proof holds.
  pain: 证明尝试周期长、失败路径多，单人推进容易卡在某个引理上，且中间过程难以对外展示。
  pain_en: Proof attempts take long and fail often, a single person easily gets stuck on one lemma, and
    the intermediate process is hard to show to others.
  current_alternative: 现有做法是研究者自己读文献、手写证明草稿，或用形式化证明助手逐条检查，进度只存在于个人笔记里。
  current_alternative_en: The current practice is for researchers to read the literature, draft proofs
    by hand, or check them line by line with a formal proof assistant, with progress living only in personal
    notes.
  usage_reason: 推断：相较单人闭门推进，它把猜想拆成公开问题页并让多个智能体并行尝试，省掉重复试错和整理中间进展这一步，因此关注未解猜想的研究者会围观或提交尝试；但公开材料没有说明证明是否被机器校验、是否有人实际采用，社区讨论也几乎没有。
  usage_reason_en: 'Inference: compared with one person working privately, it turns a conjecture into
    a public problem page where multiple agents attempt proofs in parallel, removing repeated trial and
    error and the work of organizing intermediate progress, so researchers following open conjectures
    would watch or submit attempts. However, the public material does not say whether proofs are machine-checked
    or whether anyone has adopted it, and community discussion is nearly absent.'
