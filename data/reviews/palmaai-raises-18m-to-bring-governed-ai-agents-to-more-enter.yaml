  market: ''
  job: 企业 AI 平台或合规人员要在智能体接入内部系统后，处理智能体运行日志与权限记录，确认某次自动执行是否越权并留下可审计结论。
  job_en: Enterprise AI platform or compliance staff, after agents are connected to internal systems,
    work through agent runtime logs and permission records to confirm whether a given automated action
    exceeded authority and to leave an auditable conclusion.
  pain: 智能体自动执行时，人工难以逐步复核它调用了哪些系统、用了什么权限；出问题后缺少可追溯记录。
  pain_en: When agents act automatically, people cannot easily review step by step which systems they
    called and with what permissions, and after an incident there is little traceable record.
  current_alternative: 目前多靠人工抽查日志、在流程里加审批节点，或干脆限制智能体权限范围。
  current_alternative_en: Today this is mostly manual log sampling, added approval steps in the workflow,
    or simply restricting agent permissions.
  usage_reason: 推断：若它能在运行时记录并拦截越权调用，可省去事后人工翻日志这一步，让合规人员直接拿到可审计结论；但公开材料未说明拦截规则、报告形态与人工确认环节，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if it records and blocks out-of-scope calls at runtime, it could remove
    the manual log-trawling step and hand compliance staff an auditable conclusion; however the public
    material does not describe blocking rules, report format or human confirmation, so it is not yet established
    that users would choose it for this.'
