  market: ''
  job: 软件工程师或 AI 工程师在同时运行多个编码 agent（如并行修改同一仓库的不同模块）时，需要把各 agent 的修改意图先汇总到 Git 之上的协调层，判断哪些意图互相冲突，再决定合并顺序与方案，避免等到代码层面才暴露冲突。
  job_en: A software or AI engineer running multiple coding agents in parallel on the same repository
    needs to submit each agent's change intent to a coordination layer above Git, detect which intents
    conflict, and decide merge order and resolution before conflicts surface at the code level.
  pain: 多个 agent 并行改同一仓库时，各自只看到局部上下文，容易做出互相矛盾的修改（例如一个删接口、另一个依赖该接口），冲突往往在合并或测试阶段才暴露，返工成本高；Git 只能比对文本差异，无法表达和比对“意图”。
  pain_en: When multiple agents edit the same repository in parallel, each sees only local context and
    can make mutually contradictory changes (one removes an interface another depends on); conflicts surface
    late at merge or test time, forcing costly rework. Git compares text diffs, not intents.
  current_alternative: 当前替代方式是人工串行调度 agent、靠 Git 分支与 PR 评审在代码层发现冲突，或让单个 agent 顺序执行任务；这些做法把冲突检测推迟到代码或评审阶段，缺少意图层的提前比对。
  current_alternative_en: Today teams serialize agents manually, or rely on Git branches and PR review
    to catch conflicts at the code layer, or run a single agent sequentially; all defer conflict detection
    to code or review time with no intent-level comparison.
  usage_reason: 推断：相较人工串行或纯 Git 分支评审，Foremerge 让每个 agent 先把修改意图提交到协议层，由协议在写代码前比对意图并标记冲突，从而把冲突发现从合并/评审阶段前移到意图提交阶段，减少一次返工合并。会选用它的是同时跑多个编码
    agent、且已感到合并冲突代价的团队。
  usage_reason_en: 'Inference: versus manual serialization or plain Git branch review, Foremerge has each
    agent submit its change intent to the protocol, which compares intents and flags conflicts before
    code is written, moving detection from merge/review to intent submission and avoiding one rework cycle.
    Teams already running multiple coding agents and feeling merge-conflict cost are the likely adopters.'
