  market: ''
  job: 建筑承包商或小型设计工作室在报建前，拿到业主提供的现场照片、旧图纸 PDF 或手绘草图，需要产出可提交审批的合规施工蓝图。
  job_en: A contractor or small design studio, before permit submission, receives site photos, old PDF
    drawings, or hand sketches from the owner and needs to produce a code-compliant construction blueprint
    ready for approval.
  pain: 制图与规范核对依赖人工，周期长、按小时计费贵，且一处规范疏漏就会导致退件重做，直接拖住开工时间。
  pain_en: Drafting and code checking are manual, slow, and billed hourly, and a single code omission
    triggers rejection and rework, directly delaying the start of construction.
  current_alternative: 雇制图员或结构工程师按小时画图，或使用 AutoCAD、SketchUp 等通用制图软件从零绘制，再人工对照当地规范逐条核对。
  current_alternative_en: Hiring a drafter or structural engineer on hourly billing, or drawing from scratch
    in general tools such as AutoCAD or SketchUp, then manually checking each item against local codes.
  usage_reason: 推断：相较从零制图再人工查规范，它把照片、PDF 或草图直接转成图纸初稿，省掉的是第一版底图绘制这一步，让承包商在等工程师排期之前就能拿到可讨论的版本；因此工期紧、预算有限、项目标准化程度高的住宅改造承包商会先试用它。
  usage_reason_en: 'Inference: compared with drafting from scratch and manually checking codes, it converts
    a photo, PDF, or sketch directly into a first-pass drawing set, removing the step of drawing the base
    plan, so a contractor can have a discussable version before an engineer is available; contractors
    on tight schedules with limited budgets and standardized residential remodels are the ones likely
    to try it first.'
