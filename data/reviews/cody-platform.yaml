  market: ''
  job: 企业研发团队在把编码 agent 接入内部代码仓库时，由治理负责人处理 agent 的写入请求与权限配置，要完成一次可审计、可回滚的代码变更。
  job_en: When an enterprise engineering team connects a coding agent to internal repositories, a governance
    owner handles the agent's write requests and permission settings to complete an auditable, rollback-capable
    code change.
  pain: 编码 agent 直接改仓库时，缺少人审、权限边界和审计记录，出错后难以追溯责任，团队不敢放开使用。
  pain_en: When a coding agent edits repositories directly, there is no human review, permission boundary
    or audit record, making accountability hard to trace after errors and leaving teams unwilling to widen
    access.
  current_alternative: 目前多靠人工在代码评审里逐条检查 agent 提交，或用分支保护和 CI 规则临时兜底，治理逻辑散落在多个工具里。
  current_alternative_en: Today teams mostly rely on manual review of agent commits or ad-hoc branch protection
    and CI rules, with governance logic scattered across several tools.
  usage_reason: 推断：相较散落的评审与 CI 规则，它把审批、权限、事务性写入和审计收进一条显式状态机，减少团队自己拼治理链的搭建步骤，因此正在试点编码 agent 的研发团队会先拿它跑通流程。
  usage_reason_en: 'Inference: compared with scattered review and CI rules, it folds approval, permissions,
    transactional writes and audit into one explicit state machine, cutting the work of assembling a governance
    chain yourself, so teams piloting coding agents would use it to trial the flow first.'
