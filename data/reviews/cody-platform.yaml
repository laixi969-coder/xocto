  market: ''
  job: 企业研发团队的 AI 编码工具治理负责人，在把编码 agent 接入内部代码仓库与 CI 流程时，需要让 agent 的每次改动都经过人审、统一权限校验、事务性写入和审计留痕，从而在可控前提下跑通一条可复现的
    agent 工作流。
  job_en: An AI coding tool governance owner in an enterprise engineering team, when wiring a coding agent
    into internal repositories and CI, must route every agent change through human review, unified permission
    checks, transactional writes, and audit logging so the agent workflow can run under control.
  pain: 编码 agent 直接写仓库会带来越权改动、半途失败留下脏状态、事后无法追溯谁批准了哪次写入等问题；治理负责人若没有一条把审批、权限、事务与审计串起来的链路，就只能靠人工盯守或干脆禁止 agent
