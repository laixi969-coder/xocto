  pain_en: A coding agent writing directly to repositories risks unauthorized changes, half-finished dirty
    state, and no trace of who approved which write; without a chain linking approval, permissions, transactions,
    and audit, the governance owner must either babysit the agent or ban it from production repos, so
    agent output never enters the formal development flow.
  current_alternative: 当前替代方式包括：让 agent 只产出补丁由人工复制提交、用 CI 分支保护加人工 review 兜底、或直接禁用 agent 写权限；这些做法把治理负担压回人工，缺少统一权限与事务性写入的机制保证。
  current_alternative_en: Current alternatives include having the agent only emit patches that humans
