  market: ''
  job: 开发者使用 AI 编码代理时，希望代理快速产出可运行的代码，而不是陷入自我管理的记账、哈希、锁等仪式。
  job_en: Developers using AI coding agents want agents to quickly produce runnable code, not get stuck
    in self-invented bookkeeping, hashes, locks, and certification rituals.
  pain: 代理在编码过程中花费大量时间在自我验证和记账上，导致实际工作停滞，交付延迟。
  pain_en: Agents spend significant time on self-verification and bookkeeping during coding, stalling
    real work and delaying delivery.
  current_alternative: 目前开发者手动调整代理的提示词或工作流，或忍受代理的低效行为。
  current_alternative_en: Currently developers manually adjust agent prompts or workflows, or tolerate
    inefficient agent behavior.
  usage_reason: 该技能包直接针对代理的常见低效行为，提供即插即用的解决方案，开源且免费，开发者容易尝试。
  usage_reason_en: This skill pack directly targets common agent inefficiencies, offering a plug-and-play
    solution, open-source and free, easy for developers to try.
