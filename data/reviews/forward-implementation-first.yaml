  market: ''
  job: 使用 Claude Code、Codex 等 AI 编码代理的开发者，在让代理完成一个具体编码任务时，需要代理直接产出可运行的实现代码，而不是把时间花在代理自己发明的收据、哈希、锁、认证仪式等记账步骤上。
  job_en: Developers using AI coding agents such as Claude Code and Codex, when assigning a concrete coding
    task, need the agent to produce runnable implementation code instead of spending the run on self-invented
    bookkeeping such as receipts, hashes, locks, and certification rituals.
  pain: 公开仓库说明指出代理会在自创的记账与认证仪式上停滞，真实编码工作被推迟；对开发者而言这意味着等待时间变长、token 消耗在非交付动作上，且需要人工打断或重写提示词才能把代理拉回实现。
  pain_en: The public repository description states agents stall on self-invented bookkeeping and certification
    rituals, delaying real coding work; for developers this means longer waits, tokens spent on non-delivery
    actions, and manual interruption or prompt rewriting to pull the agent back to implementation.
  current_alternative: 当前替代方式是开发者手动调整提示词或工作流、在代理跑偏时人工打断，或直接忍受代理的低效行为；这些做法都依赖每次任务的人工干预，没有把“先交付再验证”固化成可复用的规则。
  current_alternative_en: The current alternative is manually adjusting prompts or workflows, interrupting
    the agent when it drifts, or simply tolerating the inefficient behavior; all of these rely on per-task
    human intervention and do not codify 'ship first, then verify' into a reusable rule.
  usage_reason: 推断：相较每次手动改提示词或中途打断，该技能包把“先交付实现、验证后置”作为可安装的规则注入 Claude Code、Codex 等代理，减少的是开发者反复纠正代理跑偏这一步负担；因此当代理频繁在自创记账上停滞、而开发者又不想逐次盯守时，会尝试安装它。仓库星标从
    161 缓慢增至 167 只说明关注度，不构成持续使用证据。
  usage_reason_en: 'Inference: compared with manually rewriting prompts or interrupting mid-run each time,
    this skill pack injects ''ship the implementation first, defer verification'' as an installable rule
    into agents like Claude Code and Codex, removing the repeated burden of correcting agent drift; developers
    whose agents frequently stall on self-invented bookkeeping and who do not want to babysit every run
    would try installing it. The star count creeping from 161 to 167 indicates attention on'
