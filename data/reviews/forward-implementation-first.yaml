  market: ''
  job: 开发者指挥 AI 编码代理完成任务时，希望代理持续推进实现、直接产出可运行代码，而不是停在自创的记账、哈希、锁与认证流程上。
  job_en: Developers directing AI coding agents want the agent to push the implementation
    through and produce runnable code, not stall on self-invented bookkeeping, hashes,
    locks, and certification rituals.
  pain: 仓库自述代理会停滞在自创记账与认证仪式上，浪费算力与时间、延迟交付；该痛点与代理用户手动改提示词绕过的旧流程吻合（属结构推理），独立用户抱怨记录尚未核验。
  pain_en: The repo's own description says agents stall on self-invented bookkeeping
    and certification rituals, wasting compute and time and delaying delivery; this
    matches the old workaround of hand-tuning prompts (structural reasoning), while
    independent user complaints remain unverified.
  current_alternative: 开发者在系统提示词或 CLAUDE.md 中手写规则约束代理，或反复打断纠正其自创流程，或直接忍受低效行为。
  current_alternative_en: Developers hand-write rules in system prompts or CLAUDE.md,
    repeatedly interrupt and correct the agent's invented rituals, or simply tolerate
    the inefficiency.
  usage_reason: 免费开源、即装即用，直接对准常见低效行为；星标约一周由 152 升至 163 显示关注与试用意愿——这是关注信号，不等于付费或留存。
  usage_reason_en: It is free, open source, and plug-and-play, directly targeting
    a common inefficiency; stars rose from 152 to 163 in about a week, showing attention
    and willingness to try—attention only, not payment or retention.
