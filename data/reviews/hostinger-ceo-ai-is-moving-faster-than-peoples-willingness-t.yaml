  market: ''
  job: 非技术创业者和小微企业主在要把一个生意放到线上时，处理域名、主机、建站模板和商品信息这些材料，目标是在不雇开发者的前提下拿到一个能收款、能对外访问的站点。
  job_en: Non-technical founders and small-business owners putting a business online handle domains, hosting,
    site templates and product information, aiming to end up with a reachable, payment-capable site without
    hiring a developer.
  pain: 旧流程里装 WordPress 要上传文件、建数据库、逐项配置，出错就整站打不开；不会技术的人只能雇人或者放弃上线，时间与金钱成本都落在最不懂技术的人身上。
  pain_en: In the old workflow, installing WordPress meant uploading files, creating a database and configuring
    each item, and one mistake could take the whole site down; people without technical skill had to hire
    someone or give up on launching, with the time and money cost falling on those least equipped to handle
    it.
  current_alternative: 当前替代是托管主机的一键安装、外包给建站工作室或自由开发者，以及用通用建站 SaaS 自己拖拽模板；这些方式要么仍要自己判断配置，要么把改动交到别人手里、按次付费。
  current_alternative_en: Current alternatives are one-click installs on managed hosting, outsourcing
    to a site studio or freelance developer, and drag-and-drop templates in generic site-building SaaS;
    these either still require the user to judge configuration or hand changes to someone else on a per-job
    basis.
  usage_reason: 推断：相较一键安装后仍要自己选主题、配插件、写文案，Hostinger 把生成与托管放在同一账户里，用户描述生意即可得到可访问站点，省掉的是“装完之后还要找人做内容与配置”这一步；因此已经付过托管费、又不想再雇人的小商家会在首次上线或改版时选它。
  usage_reason_en: 'Inference: compared with a one-click install that still leaves the user choosing themes,
    configuring plugins and writing copy, Hostinger keeps generation and hosting in one account so a described
    business yields a reachable site, removing the step of finding someone to do content and configuration
    after install; small merchants already paying for hosting who do not want to hire again would choose
    it at first launch or a redesign.'
