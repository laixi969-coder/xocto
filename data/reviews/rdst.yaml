  market: ''
  job: 数据库工程师在版本发布或流量变化后，需要判断 Postgres/MySQL 的查询是否变慢，并定位是哪条查询、哪次改动造成的。
  job_en: After a release or traffic shift, database engineers must judge whether Postgres/MySQL queries
    have slowed and identify which query and change caused it.
  pain: 性能回退往往在用户投诉后才被发现，人工比对慢日志和执行计划耗时且容易漏掉偶发查询。
  pain_en: Regressions are often found only after user complaints, and manually comparing slow logs and
    execution plans is slow and misses intermittent queries.
  current_alternative: 依赖数据库自带慢查询日志、APM 面板或自建脚本定期巡检，再人工比对历史执行计划。
  current_alternative_en: Relying on built-in slow query logs, APM dashboards or self-written scripts
    for periodic checks, then manually comparing historical execution plans.
  usage_reason: 推断：相较事后翻慢日志，常驻本地 agent 能在回退出现时直接指出受影响的查询，省去人工比对历史执行计划这一步，因此没有专职 DBA 但数据库是核心依赖的团队更可能采用。
  usage_reason_en: 'Inference: versus digging through slow logs after the fact, a resident local agent
    can point at the affected queries when a regression appears, removing the manual plan-comparison step,
    so teams without a dedicated DBA but with a database-critical product are more likely to adopt it.'
