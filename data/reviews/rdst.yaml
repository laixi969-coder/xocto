  market: ''
  job: 数据库工程师在版本发布或流量结构变化后，面对 Postgres/MySQL 实例中成百上千条查询，需要判断哪些查询的执行表现发生了回退，并定位到具体查询与改动。
  job_en: After a release or traffic-mix change, database engineers facing hundreds of queries on Postgres/MySQL
    instances must determine which queries regressed and trace them to a specific query and change.
  pain: 公开材料只说明它监控查询回退，未给出用户抱怨或事故记录；从工作流看，回退通常在用户投诉或延迟告警后才暴露，而慢查询日志与执行计划需要人工逐条比对，偶发查询容易漏掉，这是结构推理而非用户口述。
  pain_en: Public material only states it watches for query regressions, with no user complaints or incident
    records; structurally, regressions surface only after user complaints or latency alerts, and slow
    logs plus execution plans must be compared by hand, easily missing intermittent queries — this is
    inference, not user testimony.
  current_alternative: 依赖数据库自带慢查询日志、APM 面板或自建脚本定期巡检，再人工比对历史执行计划与查询统计。
  current_alternative_en: Relying on built-in slow query logs, APM dashboards, or self-written periodic
    scripts, then manually comparing historical execution plans and query statistics.
  usage_reason: 推断：相较事后翻慢日志并逐条比对执行计划，常驻本地 agent 持续观察查询表现并在回退出现时直接标出受影响查询，省去人工筛选与历史比对这一步，因此数据库是核心依赖但缺少专职
    DBA 的团队更可能在发布后选择它。
  usage_reason_en: 'Inference: versus digging through slow logs and comparing plans one by one after the
    fact, a resident local agent continuously watches query behavior and flags affected queries when a
    regression appears, removing the manual filtering and historical comparison step, so teams with a
    database-critical product but no dedicated DBA are more likely to adopt it after a release.'
