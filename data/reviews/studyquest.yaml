  market: ''
  job: 学生在复习备考时，把课堂笔记或教材摘录交给产品，希望得到可用于自测的练习题和游戏化复习材料。
  job_en: While revising, a student hands class notes or textbook excerpts to the product and expects
    self-test exercises and gamified revision material.
  pain: 笔记多为线性文字，重读耗时且难以判断是否真正记住，自测题往往要自己手抄或另找题库。
  pain_en: Notes are mostly linear text, slow to reread and hard to test recall against, and self-test
    questions usually have to be hand-copied or sourced from a separate question bank.
  current_alternative: 用 Anki 等卡片工具手工制卡，或在题库 App 里刷现成题目，再配合纸质笔记重读。
  current_alternative_en: Manually building cards in tools like Anki, drilling ready-made questions in
    quiz apps, and rereading paper notes.
  usage_reason: 推断：若它能把已有笔记直接转成可玩的练习，就省掉手工制卡或另找题库这一步，学生会在临考复习、笔记已成型的阶段选择它；但公开材料未说明题型质量与是否需人工校对，动机尚无用户反馈支持。
  usage_reason_en: 'Inference: if it converts existing notes directly into playable practice, it removes
    the step of hand-building cards or hunting for a question bank, so students would pick it near exams
    once notes are settled; however public material does not describe question quality or any human review,
    and no user feedback supports the motive.'
