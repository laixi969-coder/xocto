    verbal confirmation is slow and prone to friction.
  current_alternative: 此前靠口头商量、在点餐小程序里反复加减，再用计算器或聊天记录手动分摊。
  current_alternative_en: Previously done by talking it through, repeatedly adding and removing items
    in an ordering mini-app, then splitting manually with a calculator or chat messages.
  usage_reason: 推断：它把每个人的心愿直接合成一桌并给出官方核价与按人分餐，省去反复加减和手动分摊这一步，因此团体聚餐的组织者会在下单前使用它；尚无留存或复购证据。
  usage_reason_en: 'Inference: it merges each person''s wishes into one table with official pricing and
    a per-person split, removing the repeated add-remove and manual splitting step, so group organizers
    may use it before placing an order; no retention or repeat-use evidence yet.'
