  market: ''
  job: 一群同事或朋友在聚餐点餐时，需要把每个人想吃的单品凑成一桌并算清各自该付多少钱。
  job_en: A group of colleagues or friends ordering a shared meal needs to combine everyone's desired
    items into one table and work out what each person owes.
  pain: 多人点餐时口味分散、总价和分摊容易算错，反复口头确认耗时且容易起争执。
