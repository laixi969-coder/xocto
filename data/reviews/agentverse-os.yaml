  market: ''
  job: 独立开发者或小团队在自有服务器上同时跑编码代理和自托管应用时，需要隔离工作区、备份更新和内网访问控制，以便安全地长期运行这些工具。
  job_en: Solo developers or small teams running coding agents and self-hosted apps on their own server
    need isolated workspaces, backups and private-network access control so these tools can run safely
    over time.
  pain: 把代理和自托管服务装在一台机器上，环境互相干扰、备份和更新要手工处理、公网暴露有风险；公开材料没有说明这些痛点在真实使用中的频率与代价。
  pain_en: Putting agents and self-hosted services on one machine causes environments to interfere, backups
    and updates must be handled by hand, and public exposure is risky; the public material does not show
    how often or how costly this is in practice.
  current_alternative: 开发者目前用 Docker、手动脚本、云主机或现成的自托管面板自行拼装环境。
  current_alternative_en: Developers currently assemble environments themselves using Docker, manual scripts,
    cloud hosts or existing self-hosting panels.
  usage_reason: 推断：相比自己拼 Docker 与备份脚本，它用一条安装命令给出隔离工作区、应用库和内网访问，省掉环境搭建与暴露配置这几步，因此自托管倾向强的开发者可能采用；但缺少用户反馈与重复使用证据。
  usage_reason_en: 'Inference: instead of assembling Docker and backup scripts, one install command provides
    isolated workspaces, an app store and private-network access, removing setup and exposure configuration,
    so self-hosting-oriented developers may adopt it; user feedback and repeat-use evidence are missing.'
