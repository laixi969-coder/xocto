  current_alternative_en: Hiring shoot crews or editing freelancers clip by clip, or manually assembling
    output from general-purpose generation tools and filtering by hand.
  usage_reason: 推断：相较逐条外包，它把脚本到可用片段的环节压缩为一次生成加人工挑选，减少等待拍摄与反复沟通的步骤，因此需要高频测试素材的投放团队会在批量出片时选择它；尚无留存或复购证据。
