  market: ''
  job: DevOps 与平台工程师在终端里处理 Kubernetes 集群时，需要按命名空间/工作负载定位 Pod、翻看容器日志、exec 进容器排查、把本地端口转发到 Service，并借助上下文感知
    AI 解释当前资源状态，从而完成一次故障定位或日常巡检。
  job_en: DevOps and platform engineers working in a terminal against a Kubernetes cluster need to locate
    pods by namespace/workload, read container logs, exec into containers, port-forward a local port to
    a service, and use context-aware AI to interpret the current resource state, in order to complete
    an incident triage or routine inspection.
  pain: kubectl 的旧流程要求工程师记住并手敲一长串子命令与资源名，在多个终端窗口间反复复制 Pod 名、命名空间和上下文；排查一次故障往往要在 get、describe、logs、exec、port-forward
    之间来回切换，出错和重复输入的成本高。
  pain_en: The legacy kubectl flow forces engineers to recall and hand-type long subcommand and resource-name
    chains, repeatedly copying pod names, namespaces and contexts across terminal windows; a single triage
    bounces between get, describe, logs, exec and port-forward, making typos and repeated typing costly.
  current_alternative: 当前替代方式是原生 kubectl 命令行，辅以 k9s 等既有 TUI、Lens 等图形化 Kubernetes 面板，或云厂商控制台；这些工具要么仍以键盘命令为主，要么需要离开终端打开独立
    GUI。
  current_alternative_en: The current alternatives are the native kubectl CLI, existing TUIs such as k9s,
    graphical Kubernetes dashboards such as Lens, or cloud-provider consoles; these are either still keyboard-command
    driven or require leaving the terminal for a separate GUI.
  usage_reason: 推断：相较纯 kubectl 或 k9s，k10s 把资源列表做成可点击对象，并在同一终端内直接触发日志、exec 与端口转发，省去手敲资源名和切换窗口这一步；相较 Lens
    类 GUI，它保持单 Go 二进制、不离开终端。因此习惯终端工作、又不想记全 kubectl 子命令的工程师会在日常排查时选择它。
  usage_reason_en: 'Inference: versus plain kubectl or k9s, k10s makes resource rows clickable and triggers
    logs, exec and port-forward inside the same terminal, removing the step of hand-typing resource names
    and switching windows; versus GUI tools like Lens it stays a single Go binary without leaving the
    terminal. Engineers who live in the terminal but do not want to memorize every kubectl subcommand
    would therefore pick it for day-to-day triage.'
