    status: supported
    reason: 它解决的是终端内管理 Kubernetes 集群的需求：kubectl 需手敲长命令、多窗口复制资源名，排查一次故障要在 get/logs/exec/port-forward 间反复切换，痛点刚性且高频。k10s
      以可点击 TUI 在同一终端完成这些动作，交付路径明确；此为工作流结构推理，尚无用户评价佐证。
