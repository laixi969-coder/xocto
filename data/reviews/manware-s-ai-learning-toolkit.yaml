  current_alternative_en: Using general coding assistants like ChatGPT/Copilot to get code, or self-serving
    official docs, Stack Overflow and tutorial videos; these either give answers without explanation or
    require the user to structure their own learning path.
  usage_reason: 推断：相较通用助手直接输出代码，该工具把代理行为约束为教学者，对同一段输入产出解释与教学反馈，用户因此省去“先拿代码再自己反推原理”或反复追问的步骤；正在学习新代码库或做代码审查、且以理解而非交付为目标的开发者会选它。
  usage_reason_en: 'Inference: versus general assistants that emit code, this toolkit constrains the agent
    to act as a teacher, producing explanation and teaching feedback for the same input, removing the
    step of reverse-engineering the reasoning from generated code or repeatedly re-prompting; developers
    learning a new codebase or reviewing code with understanding rather than delivery as the goal would
    choose it.'
