  market: ''
  job: 开发者在自学新语言、新框架或做代码审查时，把一段代码或一个报错问题交给 AI，要求它像老师一样讲清原理与思路，而不是直接吐出可复制的成品代码，从而真正理解这段代码。
  job_en: While self-learning a new language or framework, or reviewing code, a developer hands a snippet
    or an error question to an AI and asks it to teach the underlying principle and reasoning instead
    of dumping copy-pasteable finished code, so the developer actually understands the code.
  pain: 主流代码助手默认以最快速度给出可运行答案，开发者复制后往往并不理解，遇到变体问题仍不会；想学原理就得自己另找教程、逐行追问，学习与查代码被拆成两套流程。
  pain_en: Mainstream coding assistants default to producing runnable answers as fast as possible; developers
    paste them without understanding and still fail on variants, while learning the principle means hunting
    separate tutorials and asking line-by-line, splitting lookup and learning into two workflows.
  current_alternative: 直接用 ChatGPT、Copilot、Cursor 等通用代码助手要答案，或去搜索教程、文档、Stack Overflow，再自己拼凑理解。
  current_alternative_en: Asking general coding assistants such as ChatGPT, Copilot or Cursor for the
    answer, or searching tutorials, docs and Stack Overflow and piecing the understanding together manually.
  usage_reason: 推断：相较通用助手直接给代码，该工具把代理行为约束成教学式输出，省掉用户自己反复追问“为什么这样写”的那一步，并让解释与当前代码片段绑定；因此正在学新栈或做代码审查、希望理解而非抄答案的开发者会在这种情境下选它。
  usage_reason_en: 'Inference: versus general assistants that hand over code, this toolkit constrains
    the agent to teaching-style output, removing the step where users repeatedly ask ''why is it written
    this way'' and binding the explanation to the current snippet; developers learning a new stack or
    reviewing code who want understanding rather than a pasted answer would pick it in that situation.'
