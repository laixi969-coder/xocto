  market: ''
  job: 开发者在自学新语言、新框架或做代码审查时，把一段代码或一个报错丢给 AI 代理，希望拿到逐行解释、概念背景与改进建议，从而真正理解代码而不是直接抄走生成结果。
  job_en: Developers learning a new language/framework or reviewing code hand a snippet or error to an
    AI agent and want line-by-line explanation, conceptual background and improvement suggestions, so
    they understand the code instead of copying generated output.
  pain: 通用编码代理默认直接产出可粘贴的代码，学习者拿到答案却学不到原理，遇到同类问题仍不会写；想弄懂一段陌生代码只能自己查文档、翻博客或反复追问，理解成本高且容易半途放弃。
  pain_en: General coding agents default to producing paste-ready code, so learners get an answer without
    the reasoning and still cannot solve similar problems; understanding unfamiliar code means digging
    through docs, blogs or repeated follow-up prompts, which is costly and easy to abandon.
  current_alternative: 直接使用 ChatGPT/Copilot 等通用编码助手要代码，或自己查官方文档、Stack Overflow、教程视频；这些替代要么给答案不给解释，要么需要用户自己组织学习路径。
  current_alternative_en: Using general coding assistants like ChatGPT/Copilot to get code, or self-serving
    official docs, Stack Overflow and tutorial videos; these either give answers without explanation or
    require the user to structure their own learning path.
  usage_reason: 推断：相较通用助手直接输出代码，该工具把代理行为约束为教学者，对同一段输入产出解释与教学反馈，用户因此省去“先拿代码再自己反推原理”或反复追问的步骤；正在学习新代码库或做代码审查、且以理解而非交付为目标的开发者会选它。
  usage_reason_en: 'Inference: versus general assistants that emit code, this toolkit constrains the agent
    to act as a teacher, producing explanation and teaching feedback for the same input, removing the
    step of reverse-engineering the reasoning from generated code or repeatedly re-prompting; developers
    learning a new codebase or reviewing code with understanding rather than delivery as the goal would
    choose it.'
