  market: ''
  job: 投资分析师在初筛一家公司或一个赛道时，需要把访谈笔记、公开资料和行业数据整理成可复核的调研文档，供投委会讨论。
  job_en: When first screening a company or sector, an investment analyst must turn interview notes, public
    materials and industry data into a reviewable research document for the investment committee.
  pain: 调研步骤散落在个人笔记和模板里，换人接手就断档，重复劳动多，结论依据难以追溯。
  pain_en: Research steps are scattered across personal notes and templates, break down when work changes
    hands, involve much repetition, and leave conclusions hard to trace.
  current_alternative: 靠个人经验加 Word/Excel 模板手工拼装，或购买第三方数据库与研究报告。
  current_alternative_en: Manual assembly from personal experience plus Word/Excel templates, or paid
    third-party databases and research reports.
  usage_reason: 推断：相较手工拼模板，它把调研拆成固定步骤并配模板与记忆库，减少重新搭框架和翻找历史结论的动作，因此适合人手少、需要交接的早期基金分析师。
  usage_reason_en: 'Inference: compared with manual template assembly, it fixes research into defined
    steps with templates and a memory store, cutting the work of rebuilding frameworks and hunting past
    conclusions, which suits analysts at small early-stage funds that need handovers.'
