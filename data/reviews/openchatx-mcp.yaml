    custom scripts wrapping the OpenAI API and local tools.
  usage_reason: 推断：相较手动复制粘贴，它把“模型输出→本地执行→结果回传”收敛为一条 MCP 连接内的自动往返，省去用户逐条搬运命令与回贴报错的动作；同时复用已付费的 ChatGPT 订阅而非另购客户端，因此已付费
    ChatGPT、又需要模型直接改动本机文件或跑本地命令的开发者会在这种场景下选择它。
  usage_reason_en: 'Inference: versus manual copy-paste, it collapses ''model output → local execution
