  pain: ChatGPT 网页端只能对话，无法直接触达本机文件系统与命令行；用户要把模型给出的代码或命令手动复制到终端执行、再把报错贴回对话，来回搬运且容易出错。这是从产品能力与旧流程对比得出的结构推理，公开材料未提供用户抱怨原文。
  pain_en: The ChatGPT web surface is conversational only and cannot reach the local filesystem or shell;
