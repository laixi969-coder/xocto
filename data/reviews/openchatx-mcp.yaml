  current_alternative: 手动复制粘贴代码到本地终端执行并回贴结果；或改用 Cursor、Claude Desktop、Cline 等自带本地执行能力的客户端；或自行编写脚本封装 OpenAI
    API 与本地工具。
  current_alternative_en: Manually copy-pasting code into a local terminal and pasting results back; or
