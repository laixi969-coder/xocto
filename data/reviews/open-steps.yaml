  market: ''
  job: 开发者在AI编码代理完成任务后，需要确认它到底做成了什么、下一步该做什么。
  job_en: After an AI coding agent finishes a task, developers need to confirm what it actually accomplished
    and what to do next.
  pain: 代理输出的汇报冗长含糊，且代理给自己打分不可信；逐行读日志和改动太慢，漏看会埋下隐患。
  pain_en: Agent reports are long and vague, and an agent grading its own work is untrustworthy; reading
    logs and diffs line by line is slow, and missed details hide risks.
  current_alternative: 开发者直接读diff和运行日志，或让同一个代理自我总结，后者带有自评偏差。
  current_alternative_en: Developers read diffs and logs directly, or ask the same agent to summarize
    itself, which carries self-assessment bias.
  usage_reason: 一个独立于代理会话的转译层给出直白结论和可执行步骤，降低误信代理自评的风险，上手成本低。
  usage_reason_en: An independent translation layer outside the agent session gives plain verdicts and
    followable steps, lowering the risk of trusting the agent's self-assessment at low adoption cost.
