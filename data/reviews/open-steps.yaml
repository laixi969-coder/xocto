  job_en: Developers or technical leads need to understand the execution process and results of AI coding
    agent outputs when reviewing them, to decide whether to adopt or take further action.
  pain: AI 代理的输出往往冗长、技术性强，难以快速把握关键结论和下一步行动，导致审查效率低。
  pain_en: AI agent outputs are often verbose and technical, making it hard to quickly grasp key conclusions
    and next steps, reducing review efficiency.
  current_alternative: 目前开发者通常直接阅读原始日志或代码 diff，或依赖自身技术判断，缺乏结构化的通俗摘要。
  current_alternative_en: Currently developers often read raw logs or code diffs directly, or rely on
    their own technical judgment, lacking structured plain-language summaries.
  usage_reason: 开源且 MIT 许可，可免费集成到现有工作流，降低采用门槛；社区讨论和星标表明有初步关注。
  usage_reason_en: Open source with MIT license, free to integrate into existing workflows, lowering adoption
    barriers; community discussion and stars indicate initial interest.
