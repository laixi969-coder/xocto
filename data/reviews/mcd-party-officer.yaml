  market: ''
  job: 家长或活动组织者在筹办麦当劳门店儿童派对时，要判断能不能凑够人数、包场还是拼团、选哪一天，并发出招募和邀请。
  job_en: A parent or organizer planning a kids' party at a McDonald's store must judge whether enough
    people will join, whether to buy out or share the venue, which date to pick, and then send recruitment
    and invitations.
  pain: 成团人数、门店档期和预算互相牵制，靠微信群反复问人、手动比价，常常拖到最后办不成。
  pain_en: Headcount, store availability and budget constrain each other; asking around in chat groups
    and comparing manually often drags on until the event falls apart.
  current_alternative: 在家长群里反复接龙统计人数，自己打电话问门店档期，再用模板拼邀请函。
  current_alternative_en: Repeated roll-calls in parent chat groups, calling the store for availability,
    and assembling invitations from templates.
  usage_reason: 推断：相比群里接龙加电话问档期，它把成团概率、包场与拼团成本和可选日期放在一次判断里，省掉反复统计与比价这一步；对要办儿童生日会、又怕凑不齐人的家长，会在定日子之前先用它筛方案。
  usage_reason_en: 'Inference: versus chat-group roll-calls plus phone calls, it puts group-formation
    odds, buyout-versus-shared cost and candidate dates into one judgment, removing repeated counting
    and price comparison; parents planning a kids'' birthday who fear not filling the group would screen
    options with it before fixing a date.'
