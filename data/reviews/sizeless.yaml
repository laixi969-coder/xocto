  market: ''
  job: 市政工程勘察人员在道路改造或管线施工前，需要处理探测数据与历史图纸，弄清地下既有管线的位置，以避免施工挖断。
  job_en: A municipal engineering surveyor preparing road renovation or pipeline work needs to process
    detection data and historical drawings to establish where existing underground utilities run, so excavation
    does not cut them.
  pain: 地下管线资料分散、年代不一，误判会导致停工、事故与赔偿，现有手段靠人工比对图纸和现场试探。
  pain_en: Underground utility records are scattered and of mixed vintage; misjudgment causes stoppages,
    accidents and compensation, and current practice relies on manual drawing comparison and on-site probing.
  current_alternative: 现有做法是查阅纸质或电子图纸、用管线探测仪现场测量，必要时开挖探坑确认。
  current_alternative_en: Current practice is consulting paper or digital drawings, using utility locators
    on site, and digging test pits when necessary.
  usage_reason: 推断：若它能把探测数据与历史图纸合成可核验的管线模型，就能减少现场反复试探这一步，因此勘察单位会在资料复杂的老城区项目中试用；但公开材料未说明输入与输出，选择理由尚不成立。
  usage_reason_en: 'Inference: if it can merge detection data and historical drawings into a verifiable
    utility model, it would cut repeated on-site probing, so survey firms would trial it on complex old-city
    projects; but public material does not describe inputs or outputs, so the reason to choose it is not
    yet established.'
