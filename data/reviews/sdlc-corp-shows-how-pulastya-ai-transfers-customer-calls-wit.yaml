  market: ''
  job: 呼叫中心客服在客户来电需要转接给人工坐席或另一部门时，处理这通电话的对话内容，把上下文完整交接给下一位接听者，让客户不必重新描述问题。
  job_en: Call center staff handle an incoming customer call that must be transferred to a human agent
    or another department, handing the conversation context to the next person so the customer does not
    have to restate the problem.
  pain: 转接时上下文丢失，客户要重复说明，坐席要重新问一遍，通话变长且体验变差；但公开材料没有给出客户抱怨、通话时长或转接失败率等具体证据。
  pain_en: Context is lost during transfers, customers repeat themselves and agents re-ask, making calls
    longer and the experience worse; however, the public material gives no concrete evidence such as complaints,
    call duration or transfer failure rates.
  current_alternative: 常见做法是坐席口头复述、内部转接备注、工单系统记录，或让客户挂断后重新拨打；这些做法是否被本产品替代，公开材料未说明。
  current_alternative_en: Common practice is verbal recaps by agents, internal transfer notes, ticketing
    records, or asking the customer to hang up and call again; whether this product replaces those practices
    is not stated in the public material.
  usage_reason: 推断：如果产品确实能在转接时自动携带对话上下文，就能省掉坐席复述和客户重述这一步，减少通话时长与重复提问，因此转接频繁的呼叫中心可能选择它；但缺少客户反馈或实测数据，无法确认这一效果。
  usage_reason_en: 'Inference: if the product truly carries conversation context through a transfer, it
    removes the agent recap and customer restatement step, cutting call duration and repeated questions,
    so call centers with frequent transfers may choose it; without customer feedback or test data, this
    effect cannot be confirmed.'
