  market: ''
  job: 施工总包或项目团队在收到设计图纸后、开工前进行图纸会审；处理对象是成套施工图，任务是找出错漏碰缺与可施工性问题，避免现场返工。
  job_en: A general contractor or project team runs a drawing review after receiving design drawings and
    before construction starts; the materials are full construction drawing sets, and the task is to find
    clashes, errors, and buildability issues to avoid rework.
  pain: 图纸审查依赖少数资深工程师逐张人眼比对，耗时长且易漏项；漏掉的问题到现场才暴露，返工成本高。
  pain_en: Drawing review depends on a few senior engineers eyeballing sheets one by one; it is slow and
    easy to miss items, and missed problems surface on site where rework costs are high.
  current_alternative: 旧做法是资深工程师或监理用 CAD 图和纸质图逐张人工核对，依赖个人经验，周期以天计，覆盖度不稳定。
  current_alternative_en: The old way is senior engineers or supervisors manually cross-checking CAD and
    paper drawings sheet by sheet, relying on personal experience, taking days with unstable coverage.
  usage_reason: 推断：相较人工逐张翻图，产品让视觉模型直接读图并标出疑似问题，把逐项核对压缩为对机器标注的复核，减少会审准备时间；无留存或复购证据，此为工作流推理。
  usage_reason_en: 'Inference: instead of flipping through drawings manually, a vision model reads the
