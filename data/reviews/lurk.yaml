    spreadsheets, mostly requiring self-written keywords and case-by-case judgment.
  usage_reason: 推断：相比手动搜索，lurk 用 AI 持续接收两个平台的帖子并自动筛出意向线索，省去逐条阅读和跨平台切换这一步，因此预算有限、又需要持续获客的独立开发者或小团队会尝试它；但线索准确率与是否被长期留在工作流中尚无公开证据。
  usage_reason_en: 'Inference: versus manual search, lurk uses AI to continuously ingest posts from both
    platforms and auto-filter intent leads, removing the step of reading each post and switching platforms,
    so budget-constrained indie developers or small teams needing steady lead flow would try it; however,
    lead accuracy and long-term workflow retention have no public evidence yet.'
