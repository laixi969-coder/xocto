  market: ''
  job: 移动应用测试或自动化人员面对一个没有开放接口的手机应用，需要让 AI agent 在真实 iPhone 上完成点击、输入等操作，以完成测试或流程执行任务。
  job_en: Mobile QA or automation staff facing a phone app with no open API need an AI agent to perform
    taps and typing on a real iPhone to complete a test or workflow task.
  pain: 没有 API 的应用只能靠人工在真机上反复点按，回归测试和重复流程耗时且难以规模化。
  pain_en: Apps without APIs can only be exercised by hand on real devices, making regression testing
    and repetitive flows slow and hard to scale.
  current_alternative: 人工在真机上手动操作，或使用 Appium 等基于无障碍层的自动化脚本，遇到封闭应用时仍需人工兜底。
  current_alternative_en: Manual operation on real devices, or accessibility-layer automation scripts
    such as Appium, which still need human fallback for closed apps.
  usage_reason: 推断：相较人工逐台点按或维护易碎的自动化脚本，它让 agent 直接驱动真机执行动作，可能减少编写和维护脚本这一步负担；但公开材料未给出稳定性、成功率或客户案例，因此哪类用户会持续选择它尚无法确认。
  usage_reason_en: 'Inference: compared with tapping devices by hand or maintaining fragile automation
    scripts, it lets an agent drive a real device directly, potentially removing the burden of writing
    and maintaining scripts; however, public material gives no stability, success-rate or customer evidence,
    so which users would keep choosing it cannot be confirmed.'
