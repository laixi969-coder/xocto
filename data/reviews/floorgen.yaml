  next_validation: 收集 FloorGen 官方页面上的输出示例与定价说明，核对平面图精度和收费方式。
  market: ''
  job: 业主或设计师在装修或购房前，需要把口头需求变成一张能讨论、能修改的户型平面图。
  job_en: Before renovating or buying, a homeowner or designer needs to turn verbal requirements into
    a floor plan that can be discussed and revised.
  pain: 不会画图的人只能靠口头描述或手绘草图沟通，设计师则要花时间把需求转成初稿，来回改图拖慢决策。
  pain_en: People who cannot draw rely on verbal descriptions or rough sketches, while designers spend
    time converting requirements into a first draft, and repeated redraws slow decisions.
  current_alternative: 手绘草图、Excel 或纸笔标注、专业 CAD 软件，或直接付费请设计师出初稿。
  current_alternative_en: Hand sketches, spreadsheet or paper annotations, professional CAD software,
    or paying a designer for a first draft.
  usage_reason: 推断：相较手绘或 CAD，它让用户用一句话或一张草图就得到可继续修改的平面图，省掉从零画图这一步，因此装修前需要快速比选方案的业主和小型设计团队会先试用它。
  usage_reason_en: 'Inference: compared with hand sketching or CAD, it turns a sentence or a rough sketch
    into a revisable floor plan, removing the step of drawing from scratch, so homeowners comparing options
    before renovation and small design teams would try it first.'
