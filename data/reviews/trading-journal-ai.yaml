  market: ''
  job: 个人交易者在自己电脑上导入券商导出的 CSV 成交流水，把零散记录整理成完整回合交易与 KPI，再让 Claude 生成交易日记式复盘，最终自己核对并确认复盘结论。
  job_en: An individual trader imports broker-exported CSV fills on their own machine, reconstructs round-trip
    trades and KPIs, then has Claude draft a diary-style review that the trader verifies and confirms.
  pain: 券商导出的成交流水是逐笔碎片，个人交易者难以手工配对成回合交易并统计胜率、盈亏比等指标；复盘靠手写表格或凭记忆，容易漏掉亏损单与重复犯错，且把完整交易记录交给云端工具存在隐私顾虑。
  pain_en: Broker CSV exports are fragmented fills that are hard to pair into round trips and to aggregate
    into win rate or payoff metrics; manual spreadsheet or memory-based review misses losing trades and
    repeated mistakes, and uploading full trade history to a cloud tool raises privacy concerns.
  current_alternative: 手工 Excel/Google Sheets 记账、券商自带报表、或通用云端交易日志（如 TraderVue、Edgewonk 类工具），后者需要上传成交数据并注册账号。
  current_alternative_en: Manual Excel or Google Sheets bookkeeping, broker-native reports, or generic
    cloud trading journals that require uploading fills and creating an account.
  usage_reason: 推断：相较手工表格，它自动把 CSV 逐笔成交配对成回合交易并算出 KPI，省掉手工配对与公式维护这一步；相较云端日志，它在本机运行、无需账号、无遥测，因此在意成交数据隐私、又想要
    AI 复盘草稿的个人交易者会在本地复盘时选择它。
  usage_reason_en: 'Inference: versus manual spreadsheets it automatically pairs CSV fills into round
    trips and computes KPIs, removing manual pairing and formula upkeep; versus cloud journals it runs
    locally with no account and no telemetry, so privacy-conscious individual traders who still want an
    AI review draft would pick it for local review sessions.'
