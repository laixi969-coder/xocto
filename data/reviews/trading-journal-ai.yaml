  job_en: An individual trader after market close organizes broker-exported trade CSVs, needs to reconstruct
    scattered fills into round trips and review profit and loss causes to guide the next trade.
  pain: 手工在表格里配对买卖、计算盈亏和统计指标耗时且易错，复盘往往流于感觉，难以坚持。
