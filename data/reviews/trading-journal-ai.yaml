    so review often stays impressionistic and hard to sustain.
  current_alternative: 目前多用 Excel 手工记账、券商自带对账单或通用笔记软件写复盘，缺少自动配对与结构化分析。
  current_alternative_en: Today people use Excel manually, broker statements or generic note apps for
    review, lacking automatic pairing and structured analysis.
  usage_reason: 推断：相较手工表格，它直接读取券商 CSV 自动生成回合交易与指标，省去配对和计算这一步，再让模型基于结构化结果写复盘，因此高频交易者会在每日收盘后选择它；公开材料尚无留存或付费证据。
  usage_reason_en: 'Inference: versus manual spreadsheets, it reads broker CSV directly to generate round
