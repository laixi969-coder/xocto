  market: ''
  job: 用户在一个 AI 工具里聊到一半，因额度、能力或价格原因想换到另一个模型，需要把已有上下文带过去继续。
  job_en: Mid-session in one AI tool, a user wants to switch to another model for quota, capability, or
    price reasons and needs to carry the existing context over.
  pain: 换工具意味着重新粘贴或重述背景，长对话重述成本高，还容易丢失此前的约束条件。
  pain_en: Switching tools means re-pasting or re-explaining the background; re-stating a long thread
    is costly and easily loses earlier constraints.
  current_alternative: 旧做法是手动复制粘贴历史消息，或在新工具里重新描述一遍需求。
  current_alternative_en: The old way is manually copying and pasting the history, or restating the request
    from scratch in the new tool.
  usage_reason: 推断：相较手动复制粘贴，它把会话上下文整体搬运过去，省掉重述背景这一步，因此经常在多个模型间比较输出、或额度用尽被迫换工具的用户会在中途切换时选择它。
  usage_reason_en: 'Inference: versus manual copy-paste, it moves the whole session context across, removing
    the step of re-explaining background, so users who compare outputs across models or hit quota limits
    pick it when switching mid-task.'
