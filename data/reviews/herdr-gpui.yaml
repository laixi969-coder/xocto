  market: ''
  job: 开发者在本地同时运行多个编码 agent 时，需要查看各终端会话、工作区和 Git worktree 的状态，并切换到需要处理的那个会话。
  job_en: When developers run several coding agents locally, they need to see the state of each terminal
    session, workspace and Git worktree and switch to the one that needs attention.
  pain: 多个 agent 会话分散在不同终端窗口，开发者难以判断哪个还在跑、哪个卡住、哪个改了哪个 worktree。
  pain_en: Multiple agent sessions are scattered across terminal windows, so developers struggle to tell
    which is still running, which is stuck and which one touched which worktree.
  current_alternative: 开发者目前靠多个终端标签页、tmux 或 IDE 内置终端手动切换和辨认会话。
  current_alternative_en: Developers currently switch between and identify sessions manually using multiple
    terminal tabs, tmux or the IDE's built-in terminal.
  usage_reason: 推断：相较手动翻找终端标签，它把会话、工作区和 worktree 汇总到一个原生窗口，减少辨认当前状态这一步；但公开材料未说明开发者是否长期使用，也未见留存或复购证据。
  usage_reason_en: 'Inference: compared with hunting through terminal tabs, it aggregates sessions, workspaces
    and worktrees into one native window, removing the step of identifying current state; however, public
    material does not show sustained use, retention or repeat usage.'
