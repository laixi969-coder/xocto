  market: ''
  job: 移动应用开发者在用 AI 编码代理修改 iOS/Android 项目代码时，需要把代码变更落到真机或模拟器上构建并看到可运行预览，以确认改动是否成立。
  job_en: Mobile app developers using an AI coding agent to modify iOS/Android project code need the change
    built and previewed on a simulator or device to confirm it works.
  pain: 移动端构建链路重：Xcode/Gradle 编译、签名、模拟器启动与安装步骤多且慢，AI 代理改完代码后开发者要手动切出编辑器跑一遍构建才能看到结果，反馈回路被拉长；纯文本 diff 无法暴露编译错误与运行时崩溃。
  pain_en: 'Mobile build chains are heavy: Xcode/Gradle compile, signing, simulator boot and install are
    slow and multi-step, so after an agent edits code the developer must leave the editor and run a build
    manually; a text diff cannot surface compile errors or runtime crashes.'
  current_alternative: 在 OpenCode 等通用 AI 编码代理里改完代码后，手动切到 Xcode/Android Studio 或命令行执行构建、启动模拟器并安装，再回到编辑器继续迭代。
  current_alternative_en: After editing in a general AI coding agent such as OpenCode, developers switch
    to Xcode/Android Studio or the CLI to build, boot a simulator and install, then return to the editor
    to iterate.
  usage_reason: 推断：相较手动切出编辑器跑构建，MobileCode 把构建与预览动作内嵌进代理循环，代理接收代码变更后直接触发 iOS/Android 构建并交付可运行预览，省去开发者手动执行构建、启动模拟器与安装这一步，因此正在用
    AI 代理写移动端代码、又不想反复切工具的开发者会在迭代验证时选择它。
  usage_reason_en: 'Inference: versus manually leaving the editor to run a build, MobileCode embeds build-and-preview
    into the agent loop, so the agent triggers the iOS/Android build on each code change and returns a
    runnable preview, removing the manual build, simulator-boot and install step; developers already using
    an AI agent on mobile code who want to avoid tool-switching would pick it for iteration checks.'
