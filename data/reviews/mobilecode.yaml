  market: ''
  job: 移动应用开发者在用 AI 编码代理修改 iOS/Android 项目代码时，需要把改动落到可运行的模拟器或设备预览上，以确认界面与交互是否真的按预期工作。
  job_en: Mobile app developers using an AI coding agent to modify iOS/Android project code need to turn
    those edits into a running simulator or device preview to confirm the UI and interactions actually
    behave as intended.
  pain: 移动端构建链路长且平台绑定：改完代码后要切出编辑器、跑 Xcode/Gradle 构建、启动模拟器或连真机，才能看到结果；AI 代理生成的改动若无法即时构建预览，开发者就得在代理与构建工具之间反复搬运和排错，反馈回路被拉长。
  pain_en: 'Mobile build chains are long and platform-bound: after an edit you must leave the editor,
    run Xcode/Gradle, and boot a simulator or device to see the result; if agent-generated changes cannot
    be built and previewed inline, developers shuttle between the agent and build tooling, stretching
    the feedback loop.'
  current_alternative: 通用 AI 编码代理（如 OpenCode 本身）只改代码不负责移动端构建预览，开发者需手动切到 Xcode/Android Studio 或命令行构建，再自行启动模拟器核对。
  current_alternative_en: General AI coding agents (including OpenCode itself) edit code but do not handle
