  job_en: A backend or full-stack engineer starts, builds and debugs project scripts in a local terminal,
    needing to get the project running and see the results.
  pain: 项目命令分散在 README、package.json 或同事口口相传里，换项目或换机器就要重新拼命令，跑错命令的代价是时间浪费。
  pain_en: Project commands are scattered across READMEs, package.json or colleagues' memory, so switching
    projects or machines means reassembling commands, and a wrong command costs time.
  current_alternative: 手敲 npm run / make / docker compose 等命令，或维护一份自己的 shell 别名与脚本。
  current_alternative_en: Typing npm run / make / docker compose by hand, or maintaining personal shell
    aliases and scripts.
  usage_reason: 推断：如果它真能识别项目类型并给出正确的运行命令，用户省下的是“查文档、拼命令、试错”这一步，因此常切换项目或带新人的团队会先试它；但公开材料只有一句描述，是否减少这一步负担无法核对。
  usage_reason_en: 'Inference: if it really detects the project type and produces the right run command,
    the user skips looking up docs, assembling commands and trial and error, so teams that switch projects
    often or onboard newcomers would try it first; but public material is one line only, so whether that
    step is actually reduced cannot be checked.'
