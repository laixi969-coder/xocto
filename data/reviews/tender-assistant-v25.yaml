  market: ''
  job: 投标专员或商务经理在收到一份几十到上百页的招标文件后，需要逐条提取资质、技术参数、评分办法和废标条款，再据此撰写可提交的投标响应文档，并交由技术、商务、法务等角色分头复核。
  job_en: A bid specialist or business manager receives a tender document of dozens to hundreds of pages,
    must extract qualification, technical, scoring and disqualification clauses, then draft a submittable
    bid response and route it to technical, commercial and legal reviewers.
  pain: 招标文件条款密集且废标项分散，人工通读容易漏项，一旦漏掉实质性响应要求即被废标，前期投入全部作废；多角色复核靠邮件和批注往返，版本与责任难以追溯。
  pain_en: Tender clauses are dense and disqualifying items are scattered; manual reading misses requirements,
    and a single missed substantive response voids the bid and wastes all prior effort, while multi-role
    review via email and comments loses version and accountability traceability.
  current_alternative: 目前主要靠人工通读招标文件、Word 模板套写、Excel 清单逐条核对，以及邮件或微信群分发批注复核。
  current_alternative_en: Today the work is done by manually reading the tender, filling Word templates,
    checking items against Excel lists, and circulating comments by email or chat groups.
  usage_reason: 推断：相较人工通读加模板套写，它把招标文件解析、行业 Skill 抽取要点、草稿生成和按角色审查串成一条链，并保留 AI 采用的可追溯记录，投标专员在赶标期可少走一遍人工摘录与分发批注的流程；但公开材料未显示用户反馈或持续使用证据。
  usage_reason_en: 'Inference: versus manual reading plus template filling, it chains tender parsing,
    industry-skill extraction, draft generation and role-based review with a traceable AI-adoption record,
    letting bid specialists skip one pass of manual extraction and comment distribution during deadline
    crunches; public materials show no user feedback or sustained-use evidence.'
