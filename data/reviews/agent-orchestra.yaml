  market: ''
  job: 开发者在同时运行 3 个及以上 AI agent 处理同一代码库任务时，需要把规划、实现、复核、验收分派给不同 agent，并处理它们各自产出的代码与文档，最终交付一份经过独立复核、人工确认验收的改动。
  job_en: Developers running three or more AI agents on the same codebase task must assign planning, implementation,
    review and acceptance across agents, reconcile their code and document outputs, and deliver a change
    that has passed independent review and human sign-off.
  pain: 多 agent 并行时没有角色与写入边界，容易出现多个 agent 同时改同一文件造成冲突、无人独立复核、上下文重复传递推高 token 与 API 成本，最终产出无法确认是否可信。
  pain_en: Without role and write boundaries, parallel agents edit the same files, no one independently
    reviews, context is re-sent and inflates token/API cost, and the final output cannot be trusted.
  current_alternative: 当前替代方式是开发者手工编排多个 agent 会话、口头约定谁写哪个文件、自己充当复核者，或干脆退回单 agent 串行执行。
  current_alternative_en: Today developers hand-orchestrate multiple agent sessions, verbally agree on
    file ownership, act as the reviewer themselves, or fall back to a single serial agent.
  usage_reason: 推断：相较手工编排，它自动识别各 agent 的工具与专长并分配协调者/实现者/验证者角色，用单一主写入者机制消除文件冲突，并把重要任务固定为“规划→实现→独立复核→最终验收”，从而省去人工分派与冲突排查这一步，并让复核成为流程内动作；因此正在用多
    agent 并行开发的团队会在需要可信交付时选择它。
  usage_reason_en: 'Inference: versus manual orchestration it auto-detects each agent''s tools and strengths,
    assigns coordinator/implementer/verifier roles, removes file conflicts via a single primary writer,
    and fixes important tasks into plan→implement→independent review→acceptance, eliminating manual dispatch
    and conflict triage and making review an in-flow step; teams already running parallel agents would
    pick it when they need trustworthy delivery.'
