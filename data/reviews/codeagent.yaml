  market: ''
  job: 软件工程师在终端里面对一个已有代码仓库，需要完成多步改动并跑通测试，材料是仓库源码、命令输出和测试结果。
  job_en: A software engineer in the terminal faces an existing repository and must complete multi-step
    changes and get tests passing, working from source code, command output and test results.
  pain: 改动分散在多个文件，需要反复读代码、改文件、跑命令、看报错再改，手工循环耗时且容易漏掉依赖。
  pain_en: Changes span many files, forcing repeated reading, editing, running commands and fixing errors;
    the manual loop is slow and easy to miss dependencies.
  current_alternative: 旧做法是开发者自己在编辑器与终端之间切换，手工搜索、编辑并逐条运行测试；或使用编辑器内的补全与聊天插件。
  current_alternative_en: The old way is the developer switching between editor and terminal, manually
    searching, editing and running tests one by one, or using in-editor completion and chat plugins.
  usage_reason: 推断：相较手工逐文件修改，它把“读仓库—规划—改文件—跑测试”串成一个可见循环，减少反复切换与重复敲命令的步骤，因此习惯终端工作流、任务边界清晰的工程师会先试用它。
  usage_reason_en: 'Inference: versus manual file-by-file editing, it chains read-repo, plan, edit and
    test into one visible loop, cutting context switching and repeated command typing, so engineers who
    live in the terminal and have well-scoped tasks are likely to try it first.'
