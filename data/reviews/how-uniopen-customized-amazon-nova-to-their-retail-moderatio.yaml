  market: ''
  job: 零售平台内容审核团队按平台政策审核商品与用户内容，需要把通用模型调成符合自身审核口径的判定流程。
  job_en: Retail platform content-moderation teams review listings and user content against platform policy
    and need a general model tuned to their own moderation criteria.
  pain: 平台审核口径与通用模型默认口径不一致，直接调用通用接口会带来误判，需要额外人工兜底；这是从审核任务结构推出的判断。
  pain_en: Platform moderation criteria differ from a general model's defaults, so calling a generic API
    directly produces misjudgments that need extra human fallback; this is inferred from the moderation
    task structure.
  current_alternative: 此前由审核团队按政策人工审核，或用规则与通用模型接口加人工复核。
  current_alternative_en: Previously handled by moderation teams reviewing against policy manually, or
    by rules plus generic model APIs with human review.
  usage_reason: 相较直接调用通用审核接口，它把平台自有政策通过监督微调写进模型，并用业务评测与发布闸门控制上线质量，减少通用口径误判带来的返工；有自有审核口径的零售平台会在误判成本高时选择它（推断）。
  usage_reason_en: Compared with calling a generic moderation API, it writes the platform's own policy
    into the model via supervised fine-tuning and gates release on business evaluation, cutting rework
    from generic-criteria misjudgments; retail platforms with their own criteria would choose it when
    misjudgment costs are high (inference).
