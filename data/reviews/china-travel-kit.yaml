  market: ''
  job: 开发入境中国旅游应用或 AI 行程助手的开发者，在需要把签证、交通、景点、支付等中国旅行信息接入自己的 CLI、HTTP 服务或 MCP 客户端时，处理结构化旅游数据，完成可溯源的数据查询与行程生成。
  job_en: Developers building China inbound travel apps or AI itinerary assistants need to plug visa,
    transport, attraction and payment information into their own CLI, HTTP service or MCP client, working
    with structured travel data to deliver source-traceable queries and itinerary generation.
  pain: 中国入境旅游信息分散在多个官方与第三方来源，格式不统一、更新频繁，开发者自行抓取和清洗成本高，且难以向用户说明数据出处；LLM 直接生成又容易给出过时或错误的签证、交通信息。
  pain_en: China inbound travel information is scattered across official and third-party sources with
    inconsistent formats and frequent updates; scraping and cleaning it is costly, provenance is hard
    to show users, and raw LLM output often gives outdated or wrong visa and transport details.
  current_alternative: 开发者手动抓取网页、拼凑公开统计，或直接依赖通用大模型生成行程；旅行者则使用通用攻略网站和搜索引擎自行整理。
  current_alternative_en: Developers manually scrape pages, stitch together public statistics, or rely
    on general LLMs to generate itineraries; travelers use generic guide sites and search engines to assemble
    plans themselves.
  usage_reason: 推断：相较手动抓取或纯 LLM 生成，该工具包以 CLI、HTTP API 和 MCP 三种接口直接输出带来源标注的中国入境旅游数据，开发者可省去自建抓取与清洗管线，并在
    MCP 场景下让 AI 助手调用可溯源数据而非凭记忆作答，因此面向做中国入境游产品的开发者与 AI 工具集成者。
  usage_reason_en: 'Inference: versus manual scraping or pure LLM generation, the kit exposes source-aware
    China inbound travel data through CLI, HTTP API and MCP, letting developers skip building their own
    scraping and cleaning pipeline and letting AI assistants in MCP setups call traceable data instead
    of answering from memory, so it appeals to developers building China inbound travel products and AI
    tool integrators.'
