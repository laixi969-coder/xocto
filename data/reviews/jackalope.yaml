  market: ''
  job: 同时使用多个编码智能体的开发者，在同一个项目里让不同代理分别处理不同代码任务，需要把分散在多个终端会话里的改动汇总起来。
  job_en: Developers running several coding agents who assign different code tasks to different agents
    in one project and need to gather changes scattered across multiple terminal sessions.
  pain: 多代理并行时上下文、改动归属和冲突处理分散在各会话，用户要手工搬运和比对；但公开材料只有一句功能描述，无法确认这一痛点强度。
  pain_en: With parallel agents, context, change attribution and conflict handling are scattered across
    sessions and users must move and compare them by hand; but the public material is a single feature
    line, so the intensity of this pain cannot be confirmed.
  current_alternative: 分别开多个终端或 IDE 窗口运行各编码代理，手工复制上下文并自行比对改动。
  current_alternative_en: Running each coding agent in separate terminal or IDE windows, copying context
    by hand and comparing changes manually.
  usage_reason: 推断：若共享工作区确实能让多个代理读写同一份上下文并集中呈现改动，用户可省去在会话间搬运上下文和比对差异的步骤，因此同时使用多个编码代理的开发者会尝试它；公开材料未给出留存或重复使用证据。
  usage_reason_en: 'Inference: if the shared workspace really lets several agents read and write one context
    and shows changes in one place, users skip moving context between sessions and diffing by hand, so
    developers running multiple coding agents would try it; no retention or repeat-use evidence is public.'
