  market: ''
  job: 产品、运营或工程人员在需要让 AI 代理复现一段软件操作时，先录下自己的屏幕操作视频，再把它变成代理可执行的提示词。
  job_en: A product, ops or engineering person who needs an AI agent to reproduce a software operation
    records their own screen session and turns it into an executable prompt for the agent.
  pain: 把一段操作过程写成代理能执行的指令，需要逐步骤回忆和描述，容易漏掉隐含的点击顺序与判断条件。
  pain_en: Writing an operation into agent-executable instructions requires recalling and describing each
    step, and implicit click order and decision conditions are easily missed.
  current_alternative: 目前多靠人工手写提示词、录屏后配文字说明，或直接口述给代理，缺少从录制到指令的固定转换环节。
  current_alternative_en: Today people mostly hand-write prompts, pair a recording with written notes,
    or dictate to the agent, with no fixed conversion step from recording to instructions.
  usage_reason: 推断：如果转换能保留操作顺序和界面上下文，用户可省去逐步手写指令这一步，因此常做重复软件操作演示的团队会先试用；但公开材料未给出转换准确度或人工校对要求，无法确认它是否真的减少返工。
  usage_reason_en: 'Inference: if the conversion preserves step order and interface context, users skip
    writing instructions step by step, so teams that often demo repetitive software operations would try
    it; public material gives no accuracy or review requirement, so reduced rework is unconfirmed.'
