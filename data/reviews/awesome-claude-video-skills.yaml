  market: ''
  job: 视频剪辑师或短视频运营在需要批量产出成片时，把素材交给编码代理，由代理调用技能包完成剪辑与渲染，拿到可发布的视频文件。
  job_en: A video editor or short-video operator who needs batch output hands footage to a coding agent,
    which uses a skill package to cut and render, and receives a publishable video file.
  pain: 素材到成片之间的拼接、套模板、导出仍要人工在剪辑软件里逐步操作，重复劳动多；但清单本身没有说明它替用户省掉了哪一步。
  pain_en: Going from raw footage to a finished clip still means manual step-by-step work in an editor,
    with heavy repetition; the list itself does not say which step it removes for the user.
  current_alternative: 用剪辑软件手工剪辑，或购买现成的模板化视频工具。
  current_alternative_en: Editing by hand in video software, or buying existing template-based video tools.
  usage_reason: 推断：相比手工剪辑，把技能包装进编码代理后，代理可直接读取素材并调用渲染工具，省去逐条拖拽拼接这一步，因此需要批量出片且已在使用编码代理的团队会尝试；目前没有用户反馈或留存证据支持这一判断。
  usage_reason_en: 'Inference: compared with manual editing, installing a skill package into a coding
    agent lets the agent read footage and call rendering tools directly, removing the step of dragging
    and joining clips one by one, so teams that already use coding agents and need batch output may try
    it; there is no user feedback or retention evidence yet.'
