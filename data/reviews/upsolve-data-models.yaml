  market: ''
  job: 数据分析师或业务负责人在用 AI 查询公司经营数据时，处理内部指标口径与业务术语，要完成让模型按统一口径回答业务问题。
  job_en: A data analyst or business lead querying company operating data with AI works with internal
    metric definitions and business terminology to make the model answer business questions under one
    shared definition.
  pain: 同一指标在不同团队口径不一致，模型按字面理解容易给出错误答案，纠正口径往往靠人工反复解释。
  pain_en: The same metric means different things across teams, models interpret it literally and answer
    wrongly, and correcting definitions usually relies on repeated manual explanation.
  current_alternative: 目前多靠人工维护指标字典、在提示词里反复粘贴定义，或由数据团队逐次解释口径。
  current_alternative_en: Today teams maintain metric dictionaries by hand, paste definitions into prompts
    repeatedly, or have the data team explain definitions case by case.
  usage_reason: 相较每次在提示词里重贴定义，它把指标口径与业务词汇集中交给模型，减少重复解释这一步，因此口径复杂的中型企业数据团队会考虑使用；这是基于产品定位的推断，尚无客户案例佐证。
  usage_reason_en: Compared with re-pasting definitions into prompts each time, it centralizes metric
    definitions and business vocabulary for the model, removing the repeated explanation step, so data
    teams at mid-sized firms with complex metrics may consider it; this is an inference from positioning,
    not a customer case.
