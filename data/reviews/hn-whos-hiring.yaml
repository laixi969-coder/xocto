  market: ''
  job: 求职者在集中找工作时，把社区招聘帖和自己的简历作为材料，要完成的任务是从大量帖子中挑出值得投递的少数几条。
  job_en: A job seeker, during an active search, uses community hiring posts and their own resume as input
    to pick the few posts worth applying to.
  pain: 招聘帖分散、格式不一，逐条读完再判断是否匹配耗时且容易漏掉合适岗位。
  pain_en: Hiring posts are scattered and inconsistently formatted, so reading each one to judge fit is
    slow and suitable roles get missed.
  current_alternative: 求职者通常手动翻帖、用关键词搜索或表格记录，逐条比对简历。
  current_alternative_en: Job seekers typically scroll threads manually, use keyword search, or keep a
    spreadsheet, comparing each post to the resume by hand.
  usage_reason: 推断：相较手动翻帖，它把简历作为排序依据直接对帖子打分排序，省掉逐条阅读和初筛这一步，因此正在集中投递、面对大量帖子的求职者会先试它。
  usage_reason_en: 'Inference: versus manual scrolling, it scores and ranks posts against the resume,
    removing the step of reading and pre-screening each one, so seekers facing many posts during an active
    search would try it first.'
