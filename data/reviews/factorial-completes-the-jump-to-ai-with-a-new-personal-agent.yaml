  market: ''
  job: 中小企业 HR 负责人或员工在办理请假、报销、入职等日常人事事务时，需要跨多个 HR 模块查询和提交材料，并完成一次审批或记录。
  job_en: An SMB HR lead or employee handling leave, expenses or onboarding must look up and submit material
    across several HR modules and complete one approval or record.
  pain: 材料只说明这是一个个人智能体，没有说明它替代了哪一步人工操作、减少了哪次查询或提交，因此痛点无法从公开事实中还原。
  pain_en: The material only says this is a personal agent; it does not say which manual step it replaces
    or which lookup or submission it removes, so the pain cannot be reconstructed from public facts.
  current_alternative: 现有替代是 Factorial 自身的 HR 模块界面，员工和 HR 在多个页面之间手工切换、查询和填写。
  current_alternative_en: The current alternative is Factorial's own HR module interface, where employees
    and HR staff switch between pages, look things up and fill forms by hand.
  usage_reason: 推断：如果该智能体能直接读取既有 HR 数据并一次完成查询或提交，用户可能因为省去跨模块切换而选择它；但材料未给出任何功能细节、用户反馈或使用数据，这一因果链目前无法核实。
  usage_reason_en: 'Inference: if the agent can read existing HR data and complete a lookup or submission
    in one step, users might choose it to avoid switching between modules; however the material gives
    no feature detail, user feedback or usage data, so this causal chain cannot currently be verified.'
