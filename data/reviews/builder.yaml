  usage_reason: 推断：相较自己配环境写代码或订阅其他生成平台，Puter 把 AI 模型调用做成无需 API key、无用量限制的浏览器内接口，用户少走申请密钥、配置后端这一步，因此想低成本试做原型的非专业开发者可能选择它；这是基于产品能力的推断，不是已证实的采用动机。
  usage_reason_en: 'Inference: compared with hand-coding in a self-configured environment or subscribing
    to other generation platforms, Puter exposes AI model calls as an in-browser API requiring no API
