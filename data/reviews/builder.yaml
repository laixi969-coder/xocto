  market: ''
  job: 非专业开发者或小团队在需要快速验证一个网站或小应用想法时，用自然语言描述需求，让 AI 生成可运行的站点或应用代码，拿到能打开、能演示的原型。
  job_en: Non-professional developers or small teams who need to quickly validate a website or app idea
    describe requirements in natural language and have AI generate runnable site or app code, producing
    a prototype they can open and demo.
  pain: 公开材料只说明 Puter 提供浏览器内应用与免费 AI 接口，未记录用户抱怨、失败代价或频率；从工作流结构推理，非专业开发者从零写前端、配环境、接模型 API 的启动成本高，这是该任务的结构性摩擦，但缺用户口述证据。
  pain_en: Public materials only show Puter offering in-browser apps and a free AI API, with no recorded
    user complaints, failure costs, or frequency; by workflow inference, the setup cost of writing frontend,
    configuring environments, and wiring model APIs from scratch is a structural friction for non-professional
    developers, but user-voice evidence is absent.
  current_alternative: 公开材料未直接说明用户现在怎么做；可核对的替代是 Lovable、Replit、v0 等同类平台，以及自己搭环境写代码，但项目自身未提供对比或迁移证据。
  current_alternative_en: Public materials do not directly state how users do this today; verifiable alternatives
    are comparable platforms such as Lovable, Replit, and v0, or hand-coding with a self-configured environment,
