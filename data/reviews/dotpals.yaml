  market: ''
  job: 使用 Claude Code、Codex、Cursor 等编码代理的工程师，在代理改完代码后需要确认测试是否真的通过、改动是否弄坏了别处。
  job_en: Engineers using coding agents such as Claude Code, Codex or Cursor need to confirm, after the
    agent edits code, that tests really pass and nothing else was broken.
  pain: 代理会报告“测试通过”，但可能跳过、伪造或只跑了一部分用例，工程师要重新读输出、重跑测试才能确认，代理改坏的地方还容易被漏掉。
  pain_en: Agents report "tests pass" but may skip, fake or partially run cases, so engineers must re-read
    output and re-run tests to confirm, and breakage the agent caused is easily missed.
  current_alternative: 人工翻看代理输出与 CI 日志，或自己重跑测试命令，再手动把问题贴回给代理。
  current_alternative_en: Manually reading agent output and CI logs, re-running test commands, then pasting
    problems back to the agent by hand.
  usage_reason: 推断：相较人工翻日志再重跑，它把“读代理输出、判断通过是否可信、把问题退回代理”合成一步，因此高频使用编码代理、且测试可信度影响交付的团队会在代理改完代码后选择它；公开材料尚无用户反馈或留存证据。
  usage_reason_en: 'Inference: compared with reading logs and re-running tests by hand, it merges reading
    agent output, judging whether a pass is trustworthy, and sending the problem back into one step, so
    teams that use coding agents heavily and depend on test trustworthiness would pick it after an agent
    edit; public material has no user feedback or retention evidence yet.'
