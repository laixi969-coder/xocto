  current_alternative_en: Today people watch a terminal or chat window to reply live, or let the agent
    stop and wait, with no fixed interface for collecting and answering agent questions asynchronously.
  usage_reason: 推断：把代理提问集中到一个可异步填写的界面，用户不必守在运行现场，长任务可以跨时区或跨班次推进，因此常跑长流程代理的团队会采用；公开材料未给出留存或复购证据。
  usage_reason_en: 'Inference: centralizing agent questions into an asynchronously fillable interface
    means users need not stay at the run, so long tasks can progress across time zones or shifts, which
    is why teams running long agent flows would adopt it; no retention or repeat-use evidence is public.'
