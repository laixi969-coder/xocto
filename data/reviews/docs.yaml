  job_en: An engineer or operator running an AI agent answers the agent's questions asynchronously when
    execution reaches a step needing human confirmation, so the task can finish.
  pain: 代理中途提问时人不在场，任务就卡住；把问题塞进聊天窗口又难以追踪哪些已答、哪些待答。
