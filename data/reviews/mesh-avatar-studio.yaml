  market: ''
  job: 虚拟主播运营者或独立游戏美术在只有一张角色插画、需要让角色在直播或游戏里动起来时，用本地编辑器把插画切成网格并生成动画，交付一个可用的动态头像。
  job_en: A VTuber operator or indie game artist who has only one character illustration and needs the
    character to move in a stream or game uses the local editor to slice the illustration into a mesh
