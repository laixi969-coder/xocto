  market: ''
  job: 学生、作者或投稿人在提交论文、稿件、作业前，需要向学校、期刊或平台证明这段文字由本人撰写而非 AI 生成。
  job_en: Before submitting a paper, manuscript, or assignment, a student, author, or contributor must
    prove to a school, journal, or platform that the text was written by them rather than generated by
    AI.
  pain: 机构普遍要求原创声明，但作者拿不出可核验的写作过程证据，只能被动接受检测工具的判定，误判时缺少申诉依据。
  pain_en: Institutions widely require originality declarations, yet authors have no verifiable evidence
    of their writing process and must accept detector verdicts, with no basis to appeal a false positive.
  current_alternative: 目前主要靠 AI 检测器打分、作者口头声明，或保留草稿与编辑历史等零散材料。
  current_alternative_en: Public materials do not yet show how users complete this job today or what they
    replace.
  usage_reason: 推断：如果 iwrote 能把写作过程转成机构可核验的凭证，作者在提交环节就不必只依赖检测器分数，被误判时也有据可依；但公开材料未说明它采集什么证据、由谁采信，因此尚不能确认用户会因此选择它。
  usage_reason_en: 'Inference: if iwrote could turn the writing process into institution-verifiable proof,
    authors would not depend solely on detector scores at submission and would have grounds when falsely
    flagged; however, the public material does not say what evidence it collects or who accepts it, so
    it is not yet confirmed that users would choose it for this reason.'
