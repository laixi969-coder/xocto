  usage_reason_en: 'Inference: compared with hiring voice actors, the demo turns Darija text directly
    into speech with voice cloning, removing the steps of booking people, studios and re-recording, so
    creators needing cheap batch dialect audio would try it; yet public material has no quality, licensing
    or payment evidence, so long-term replacement of human work is unconfirmed.'
