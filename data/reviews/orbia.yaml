    impression alone.
  usage_reason: 推断：相较人工目检，Orbia 用统一基准对生成片段打分，减少逐帧比对这一步，让团队在选片时有可比较的依据；是否被持续使用尚无公开证据。
  usage_reason_en: 'Inference: versus manual inspection, Orbia scores clips on a shared benchmark, removing
