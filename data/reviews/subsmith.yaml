  market: ''
  job: 语言学习者希望用自己感兴趣的视频内容学习外语，需要字幕和翻译辅助。
  job_en: Language learners want to study foreign languages using videos they are interested in, needing
    subtitles and translations.
  pain: 现有语言学习材料枯燥，通用教材与个人兴趣脱节，自制学习材料费时费力。
  pain_en: Existing language learning materials are boring, generic textbooks are disconnected from personal
    interests, and creating custom materials is time-consuming.
  current_alternative: 手动查找带字幕的视频，或使用通用字幕工具，但缺乏学习功能。
  current_alternative_en: Manually finding videos with subtitles, or using generic subtitle tools, but
    lacking learning features.
  usage_reason: AI 自动生成字幕和翻译，将兴趣内容转化为学习材料，节省时间且个性化。
  usage_reason_en: AI automatically generates subtitles and translations, turning interest-based content
    into learning materials, saving time and personalizing.
