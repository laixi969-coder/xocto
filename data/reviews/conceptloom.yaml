  market: ''
  job: 自学者在编码代理里学一门新技术时，需要有人先摸清自己已经会什么，再给出下一步学什么，并在多次会话之间记住进度，避免每次从零开始。
  job_en: A self-directed learner studying a new technology inside a coding agent needs something to first
    establish what they already know, then say what to learn next, and remember progress across sessions
    instead of starting from zero each time.
  pain: 自学时不知道自己的薄弱点在哪，学过的内容下次会话就丢，容易反复看已经会的东西，也说不清自己到底掌握没有。
  pain_en: Self-study leaves people unsure where their weak spots are; what was covered is lost by the
    next session, so they re-read what they already know and cannot tell whether they have actually mastered
    it.
  current_alternative: 旧做法是自己列学习清单、看教程视频，或者把笔记存在另一个文档里手动对照。
  current_alternative_en: The old behaviour is keeping a self-made study list, watching tutorial videos,
    or storing notes in a separate document and cross-checking manually.
  usage_reason: 推断：它把“自己列清单、自己记进度”换成由代理维护的知识地图与跨会话进度，因此已经在用编码代理学习、又苦于进度丢失的人会尝试它；仓库 56 星说明有开发者关注，但没有学习完成率或留存证据。
  usage_reason_en: 'Inference: it replaces ''keep your own list and track your own progress'' with a knowledge
    map and cross-session progress maintained by the agent, so people already learning through coding
    agents and losing their progress would try it; 56 stars indicate developer attention, but there is
    no completion-rate or retention evidence.'
