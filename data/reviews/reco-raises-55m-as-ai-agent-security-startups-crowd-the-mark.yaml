  market: ''
  job: 企业安全与合规团队在内部各业务线批量部署 AI agent 后，需要盘点这些 agent 的身份、权限和数据访问范围，处理权限清单与调用日志，完成越权识别与治理动作。
  job_en: After business lines deploy AI agents at scale, enterprise security and compliance teams must
    inventory these agents' identities, permissions and data access, working through permission lists
    and call logs to identify over-privilege and drive remediation.
  pain: agent 由各团队自行创建，权限往往一次给足且长期不回收，安全团队既不知道有多少 agent 在跑，也无法回答它们能碰到哪些敏感数据；出事时缺少可追溯的责任链。
  pain_en: Agents are spun up by individual teams, often granted broad and never-revoked permissions,
    so security teams neither know how many agents are running nor which sensitive data they can reach,
    and lack an auditable chain of responsibility when incidents occur.
  current_alternative: 目前多靠人工表格登记、云厂商原生 IAM 策略审查和事后日志排查，跨系统、跨云时难以拼出完整视图。
  current_alternative_en: Today this is mostly manual spreadsheets, native cloud IAM policy reviews and
    after-the-fact log forensics, which rarely assemble a complete cross-system, cross-cloud view.
  usage_reason: 相较人工登记与事后日志排查，它把 agent 身份、权限和调用行为自动汇聚成一份可处置清单，省去安全团队逐系统手工拼权限关系的那一步，因此已批量上 agent 的强合规企业会在审计或事故复盘时选择它；这是基于产品定位的推断，公开材料未给出客户留存或复购证据。
  usage_reason_en: Compared with manual registries and after-the-fact log forensics, it automatically
    aggregates agent identities, permissions and call behavior into a remediation-ready list, removing
    the step of manually stitching permission relationships system by system, so regulated firms running
    many agents would pick it during audits or incident reviews; this is inference from positioning, as
    public materials show no retention or repeat-purchase evidence.
