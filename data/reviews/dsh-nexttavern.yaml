  current_alternative_en: Authors typically use a general chat assistant with manual setting pasting,
    or a roleplay front end like SillyTavern with self-managed memory, maintaining world books and style
    by hand.
  usage_reason: 相较手动粘贴设定，它把人物卡、世界书和文风预设作为可复用输入，用混合检索和本地嵌入模型自动召回相关记忆，减少作者每轮重述设定的动作；推断这类长篇创作者会在设定量大、需要跨章节一致时选择它。
  usage_reason_en: Compared with pasting settings by hand, it treats character cards, world books and
    style presets as reusable inputs and auto-recalls relevant memory via hybrid retrieval and a local
    embedding model, cutting the per-turn restating of settings; inference is that long-form creators
    pick it when settings are large and cross-chapter consistency matters.
