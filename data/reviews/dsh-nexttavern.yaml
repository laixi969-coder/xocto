    interface, repeatedly paste character cards and worldviews, or rely on front-ends such as SillyTavern
    plus manual summarization to sustain memory; these alternatives leave the memory-maintenance burden
    on the creator.
  usage_reason: 相较手工粘贴与人工摘要，该插件用关键词加语义混合检索配合本地嵌入模型自动召回相关设定与历史片段，并把人物卡、世界书、文风预设纳入同一流程，减少创作者每轮重述设定的步骤；这是基于产品能力与任务结构作出的推断，尚无用户反馈或案例证实其实际留存。
  usage_reason_en: Compared with manual pasting and hand-written summaries, the plugin uses hybrid keyword
    and semantic retrieval with a local embedding model to automatically recall relevant settings and
    history, and folds character cards, world books and style presets into one flow, cutting the step
    of restating settings each turn. This is an inference from product capability and task structure;
    no user feedback or case yet confirms retention.
