  job_en: A roleplay creator or interactive fiction writer continuing a long story handles character cards,
    world books and style presets, needs the AI to keep characters consistent across many turns and advance
    the plot, and ends with exportable long-form text.
  pain: 通用聊天窗口的上下文有限，长篇设定容易丢失或前后矛盾，作者要反复粘贴设定、手动纠正人物口吻，越写越难维持一致性。
