  market: ''
  job: 开发者在本地或服务器上让编码代理执行任务后，需要把代理启动的每条命令收干净，避免留下占资源的后台进程。
  job_en: After letting a coding agent run tasks locally or on a server, a developer needs every command
    the agent started to be cleaned up so no resource-hogging background process is left behind.
  pain: 代理会自己起进程，跑完不回收，残留任务占端口和内存，排查起来费时。
  pain_en: Agents start their own processes and do not reap them, so leftovers hold ports and memory and
    are time-consuming to trace.
  current_alternative: 手工用进程查看命令找出残留进程再逐个杀掉，或重启机器。
  current_alternative_en: Manually hunting leftover processes with process-listing commands and killing
    them one by one, or rebooting the machine.
