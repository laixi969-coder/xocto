  market: ''
  job: 同时运行多个编码智能体的开发者在终端里需要随时知道哪个智能体在等待输入或审批，以便及时分派下一步任务而不遗漏。
  job_en: A developer running several coding agents at once needs to know at any moment which agent is
    waiting for input or approval, so they can dispatch the next step without missing one.
  pain: 并行智能体会各自停在等待确认的节点，开发者只能逐个窗口切换查看，容易漏掉卡住的会话，等待时间被浪费。
  pain_en: Parallel agents each stall at a confirmation point, and the developer can only switch windows
    one by one, easily missing a stuck session and wasting the waiting time.
  current_alternative: 手动在多个终端标签或窗口之间切换，或靠记忆与通知逐个检查智能体状态。
  current_alternative_en: Manually switching between terminal tabs or windows, or checking agent status
    one by one from memory and notifications.
  usage_reason: 推断：相比逐个窗口切换，它把多个智能体的等待状态汇总到一处并直接指出需要人工介入的那个，省掉的是轮询查找这一步；因此同时跑多个智能体的开发者会在并行任务变多时选择它。公开材料未提供用户反馈或留存数据。
  usage_reason_en: 'Inference: instead of switching windows one by one, it aggregates the waiting states
    of several agents in one place and points directly at the one needing human input, removing the polling
    step; developers running multiple agents would pick it as parallel tasks grow. Public material provides
    no user feedback or retention data.'
