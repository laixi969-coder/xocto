  market: ''
  job: 独立音乐人或短视频创作者手上只有一段哼出的旋律，需要把它变成能直接用的成品歌曲，用于发布或配乐。
  job_en: An independent musician or short-video creator has only a hummed melody and needs it turned
    into a finished song usable for release or scoring.
  pain: 没有编曲和制作能力的人，从哼唱到成品歌要经过编曲、录音、混音多道工序，通常要找人协作或学 DAW，成本高、周期长。
  pain_en: Without arrangement or production skills, going from a hum to a finished song requires arranging,
    recording and mixing, usually by hiring people or learning a DAW, which is costly and slow.
  current_alternative: 找编曲或制作人外包、用现成伴奏套唱，或在 DAW 里自己一步步做。
  current_alternative_en: Outsourcing to an arranger or producer, singing over ready-made backing tracks,
    or building it step by step in a DAW.
  usage_reason: 推断：它把“哼唱”直接当作输入，省掉把旋律转写成谱、再找人编曲这一步，因此只有旋律灵感、没有制作能力的人会先试它；但公开材料没有说明成品可控程度、版权归属或是否可商用，无法确认它能否替代现有外包流程。
  usage_reason_en: 'Inference: it takes the hum directly as input, skipping the step of transcribing the
