  market: ''
  job: 零基础或转行的编程初学者在自学时，面对教程与练习脱节的问题，要在一个能立刻动手的环境里完成可运行的小项目。
  job_en: Beginner or career-switching programmers studying alone, facing a gap between tutorials and
    practice, need an environment where they can immediately build a runnable mini-project.
  pain: 看视频和文档学不会动手，环境配置和项目选题卡住大多数人，缺少即时反馈。
  pain_en: Watching videos and reading docs does not build hands-on skill; environment setup and project
    selection block most learners, and immediate feedback is missing.
  current_alternative: 看免费视频教程、刷在线题库，或跟着博客一步步抄代码。
  current_alternative_en: Watching free video courses, grinding online exercises, or copying code step
    by step from blog posts.
  usage_reason: 推断：它把练习包成有进度感的关卡并由智能体直接生成可运行代码，省掉配置环境和找选题这两步，因此自学者会在入门阶段尝试；尚无完课或付费证据。
  usage_reason_en: 'Inference: it wraps practice into leveled stages and has the agent generate runnable
    code directly, removing environment setup and project selection, so self-learners would try it at
    the entry stage; no completion or payment evidence yet.'
