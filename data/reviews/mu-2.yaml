  market: ''
  job: 软件工程师在本地或自托管环境里让编码代理修改代码库时，需要代理先判断哪些调用是常规操作、哪些需要大模型推理，再执行代码改动并返回结果。
  job_en: Software engineers working in a local or self-hosted setup need a coding agent to first decide
    which calls are routine and which need large-model reasoning, then apply code changes and return the
    result.
  pain: 编码代理若把每次调用都交给大模型，token 成本与延迟随任务量线性上升；开发者要么忍受慢和贵，要么手工拆分任务。
  pain_en: If a coding agent sends every call to a large model, token cost and latency rise linearly with
    task volume; developers either tolerate slow, expensive runs or split tasks by hand.
  current_alternative: 开发者目前多直接使用单一大型编码代理，或自己写脚本按规则分流调用，缺少现成的分层调度。
  current_alternative_en: Developers currently use a single large coding agent directly, or write their
    own scripts to route calls by rule, with no ready-made tiered scheduler.
  usage_reason: 推断：相较全部交给大模型的旧做法，它先用小模型判定常规调用，把大模型算力留给需要推理的步骤，从而减少每次任务的 token 消耗与等待；对自托管、按量付费的团队更可能被选择。公开材料未给出成本或留存数据。
  usage_reason_en: 'Inference: compared with routing everything to a large model, it uses a small model
    to classify routine calls and reserves large-model compute for reasoning steps, cutting token spend
    and wait time per task; teams that self-host and pay per use are more likely to choose it. Public
    material gives no cost or retention data.'
