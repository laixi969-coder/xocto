    keyword bots; complex issues still escalate to people.
  usage_reason: 推断：相较宏模板和关键词机器人，Tori 直接读取工单内容与账户背景生成针对性回复或执行请求，减少客服查资料和起草这一步；客户成功团队在工单积压、重复问题多时会选择它。候选材料未提供客户案例或留存数据，实际效果尚不可核对。
  usage_reason_en: 'Inference: compared with macros and keyword bots, Tori reads the ticket content and
    account context to draft a targeted reply or execute the request, cutting the lookup-and-draft step;
    customer success teams would choose it when tickets pile up and repetitive issues dominate. The candidate
    material provides no customer cases or retention data, so actual results are not yet verifiable.'
