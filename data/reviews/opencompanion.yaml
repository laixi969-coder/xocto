  job_en: An engineer maintaining several repositories runs multiple AI coding CLIs in parallel, handling
    each terminal's output and questions, aiming to monitor progress and reply in one place.
  pain: 公开材料只说明它把多个 CLI 收进一个界面，未给出切换窗口造成的具体损失或用户抱怨，痛点强度无法确认。
  pain_en: Public material only says it gathers several CLIs into one interface; it gives no concrete
    cost of window switching or user complaints, so pain intensity cannot be confirmed.
  current_alternative: 目前工程师在多个终端窗口或标签页之间手动切换，逐个查看和回复。
  current_alternative_en: Today engineers manually switch between multiple terminal windows or tabs, checking
    and replying one by one.
  usage_reason: 推断：若它确实能统一呈现多个 CLI 的状态与提问，工程师可省去逐个窗口切换这一步，因此并行跑多个编码 agent 的人会尝试它；缺少采用与留存证据，无法确认已进入日常工作流。
  usage_reason_en: 'Inference: if it truly unifies the status and questions of several CLIs, engineers
    could skip switching windows one by one, so people running multiple coding agents in parallel may
    try it; adoption and retention evidence is missing, so entry into daily workflows cannot be confirmed.'
