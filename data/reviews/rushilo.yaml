  market: ''
  job: 视频剪辑人员在已有素材上完成粗剪与调整，需要快速产出可交付的成片。
  job_en: Video editors making rough cuts and revisions from existing footage need to produce a deliverable
    cut quickly.
  pain: 时间线逐段拖拽耗时，改稿时重复操作多，沟通修改意见还要来回确认。
  pain_en: Dragging clip by clip on a timeline is slow, revisions repeat the same operations, and feedback
    rounds require back-and-forth confirmation.
  current_alternative: 使用 Premiere、Final Cut 等剪辑软件手工操作时间线，或把需求写成文字交给剪辑师。
  current_alternative_en: Manually operating a timeline in Premiere, Final Cut or similar editors, or
    writing the request out and handing it to an editor.
  usage_reason: 推断：相较手工拖拽时间线，用对话下达剪辑指令可省去逐段操作这一步，因此素材量大、改稿频繁的短视频团队更可能尝试它。
  usage_reason_en: 'Inference: versus manual timeline dragging, issuing edit instructions conversationally
    removes the clip-by-clip operation step, so short-video teams with large footage libraries and frequent
    revisions are more likely to try it.'
