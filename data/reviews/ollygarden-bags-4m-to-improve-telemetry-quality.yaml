  market: ''
  job: 可观测性工程师在日志与追踪量失控、后端账单上涨时，处理 OpenTelemetry 埋点与遥测数据，要完成埋点精简与数据质量修复。
  job_en: Observability engineers, when log and trace volume runs away and backend bills rise, work on
    OpenTelemetry instrumentation and telemetry to slim instrumentation and repair data quality.
  pain: 不可靠和冗余遥测推高存储与处理成本，也让工程师和 AI agent 更难找到相关信息；不处理的后果是持续付费买垃圾数据，排障时间被噪声吞掉。
  pain_en: Unreliable and redundant telemetry inflates storage and processing cost and makes it harder
    for engineers and AI agents to find relevant information; not fixing it means paying continuously
    for junk data while noise eats troubleshooting time.
  current_alternative: 靠人工审查埋点、采样率配置、日志级别调整，或直接购买更贵的可观测性后端容量来兜住数据量。
  current_alternative_en: Manual instrumentation review, sampling-rate and log-level tuning, or simply
    buying more capacity from a pricier observability backend to absorb the volume.
  usage_reason: 相较人工逐条审查埋点，它持续评估遥测质量并在源头生成修复，把「先发现哪段埋点有问题」这一步从人工排查变成自动定位，因此自建 OpenTelemetry、后端账单敏感的中型工程团队会在日志量失控时选择它；这是基于产品能力的推断，尚无公开留存或复购证据。
  usage_reason_en: Compared with manually reviewing instrumentation line by line, it continuously assesses
    telemetry quality and generates fixes at the source, turning 'find which instrumentation is broken'
    from manual triage into automatic location, so mid-sized teams running their own OpenTelemetry and
    sensitive to backend bills would pick it when log volume runs away; this is inference from product
    capability, with no public retention or repeat-use evidence yet.
