  market: ''
  job: 独立游戏或 UGC 创作者在搭建奇域类 2D 沙箱玩法时，需要编写规则脚本并反复调试场景，直到能跑起来。
  job_en: Indie or UGC creators building 2D sandbox gameplay in the Qiyu style need to write rule scripts
    and repeatedly debug scenes until they run.
  pain: 沙箱规则脚本编写与调试门槛高、迭代慢，创作者常卡在把想法变成可运行场景这一步。
  pain_en: Writing and debugging sandbox rule scripts is high-threshold and slow to iterate, and creators
    often stall at turning an idea into a runnable scene.
  current_alternative: 手写 Lua 脚本、参考社区示例，或在引擎里手动搭建与试错。
  current_alternative_en: Hand-writing Lua scripts, copying community examples, or manually building and
    trial-and-error in an engine.
  usage_reason: 推断：相比纯手写脚本，它把模型通过 MCP 接到沙箱状态上，让 AI 直接生成或驱动内容，减少从想法到可运行场景之间的手工编码与调试步骤，因此做沙箱玩法的个人创作者会尝试它。
  usage_reason_en: 'Inference: versus hand-writing scripts, it wires models into sandbox state via MCP
    so AI directly generates or drives content, cutting the manual coding and debugging between an idea
    and a runnable scene, so individual sandbox creators would try it.'
