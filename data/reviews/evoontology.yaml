  market: ''
  job: 数据工程师或分析师在让编码 agent 查询企业数据仓库时，处理数据表与字段关系，要让 agent 写出符合业务含义的查询。
  job_en: Data engineers or analysts, when having coding agents query an enterprise warehouse, handle
    table and field relationships so the agent writes queries that match business meaning.
  pain: agent 不了解字段的业务含义，容易写出语义错误的查询，目前靠人工维护数据字典或逐次纠正。
  pain_en: Agents do not know what fields mean in business terms and write semantically wrong queries,
    currently handled by hand-maintained data dictionaries or repeated correction.
  current_alternative: 人工维护数据字典与文档，或在每次提问时把表结构粘贴给 agent。
  current_alternative_en: Hand-maintained data dictionaries and docs, or pasting schema into the prompt
    on each request.
  usage_reason: 推断：相较每次粘贴表结构，它把本体层沉淀下来并随使用进化，省掉重复解释字段含义这一步，因此长期维护同一套数仓的团队会考虑采用。
  usage_reason_en: 'Inference: compared with pasting schema each time, it persists the ontology and evolves
    it with use, removing the step of re-explaining field meaning, so teams maintaining one warehouse
    long term would consider it.'
