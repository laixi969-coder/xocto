    cropped images are even harder to trace, stretching evidence-gathering time.
  current_alternative: 用通用搜索引擎的以图搜图，或在社交平台人工翻找，往往只能找到相似图而非同一人。
  current_alternative_en: Using reverse image search in general search engines or manually browsing social
    platforms, which usually returns similar images rather than the same person.
  usage_reason: 推断：相较通用以图搜图只返回相似图，它按人脸特征检索并给出候选页面，把人工翻找变成逐条核实，因此做侵权取证与事实核查的人会在需要确认身份来源时选它。
  usage_reason_en: 'Inference: unlike general reverse image search that returns similar images, it searches
    by facial features and returns candidate pages, turning manual browsing into item-by-item verification,
    which is why infringement and fact-checking users choose it when they need to confirm a source identity.'
