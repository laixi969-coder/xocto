  market: ''
  job: 调查人员或记者拿到一张人脸照片时，上传图片检索公开网络中出现同一张脸的页面，得到可继续核实的线索列表。
  job_en: Investigators or journalists holding a face photo upload it to search public web pages containing
    the same face and receive a lead list for further verification.
  pain: 靠关键词和人工翻找无法从一张脸反查来源，图片被转载、裁剪后更难追溯，取证时间被拉长。
