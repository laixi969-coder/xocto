  job_en: After receiving an interview invitation, a job seeker inputs the target job description and
    their own resume history, runs mock Q&A and gets improvement feedback to perform better in the real
    interview.
  pain: 面试准备通常缺少可反复练习且针对本人经历的对象，找真人模拟成本高、时间难约，临场表达容易失手。
  pain_en: Interview prep usually lacks a repeatable partner tailored to one's own history; human mock
    interviews are costly and hard to schedule, and live delivery is easy to fumble.
  current_alternative: 旧做法是背通用题库、找朋友或付费教练模拟，或自己对着镜子练习。
  current_alternative_en: The old approach is memorizing generic question banks, asking friends or paying
    a coach for mock sessions, or practicing alone in front of a mirror.
  usage_reason: 推断：相较通用题库，它按岗位与个人经历生成针对性问题并即时给出反馈，省去找人和约时间这一步，因此时间紧、预算有限的求职者会在面试前一周选择它。
  usage_reason_en: 'Inference: compared with generic question banks, it generates questions tied to the
    role and personal history and gives immediate feedback, removing the step of finding a person and
    scheduling, so time- and budget-constrained candidates would pick it in the week before an interview.'
