  market: ''
  job: 日语学习者在读课文、看动漫或做题时遇到句子，需要把这些句子变成可反复听的听力材料并安排复习，以提升听力与记忆。
  job_en: A Japanese learner meets sentences while reading textbooks, watching anime or doing exercises,
    and needs to turn them into repeatable listening material with scheduled review to improve listening
    and retention.
  pain: 通用听力教材与自己的学习材料脱节，学习者要手动把句子录成音频、再自己排复习计划，这一步既费时又容易中断。
  pain_en: Generic listening courses are disconnected from the learner's own material, so learners must
    manually record sentences into audio and schedule review themselves, a step that is time-consuming
    and easily dropped.
  current_alternative: 旧做法是用 Anki 自制卡片、自己录音或找现成音频，再手动设置间隔重复；也有人干脆只听统一课程音频。
  current_alternative_en: The old way is building Anki cards, recording audio yourself or hunting existing
    audio, then setting spaced repetition manually; some just listen to a uniform course audio.
  usage_reason: 推断：相较手动录音加自制卡片的旧流程，Tori 把“自有句子→听力音频→复习排程”合并成一步，省去录音与排程负担，因此自有语料多、又需要听力训练的日语学习者会在备考或追番后集中使用它。
  usage_reason_en: 'Inference: versus manually recording and building cards, Tori merges ''own sentences
    to listening audio to review schedule'' into one step, removing the recording and scheduling burden,
    so Japanese learners with a large personal corpus and listening needs would use it after test prep
    or anime sessions.'
