    simply shipping a single-language release.
  usage_reason: 相较在设计工具里逐语言手工重做，它用模板把同一套版式复用到各语言截图，减少重复排版这一步，因此畏惧多语言素材工作量的独立开发者会在准备上架时选择它。这是基于产品能力的推断，尚无用户反馈支持。
  usage_reason_en: Compared with manually redoing screenshots per language in a design tool, it reuses
