    name: AI数据中心贷款打包出售
    decision: market_context
    summary_zh: 2026年11月，一批数据中心贷款被打包出售，涉及星际之门项目。这一融资端变化意味着AI基础设施建设的资金成本与再融资渠道可能收紧，进而影响AI算力供给的扩张节奏与推理成本曲线；对依赖外部融资的算力项目而言，交付与扩张的不确定性上升。上述影响为推断，材料未给出具体贷款规模或买方信息。
    summary_en: In November 2026, a batch of data center loans was packaged and sold, including exposure
      to the Stargate project. This financing-side shift implies potentially tighter funding costs and
      refinancing channels for AI infrastructure buildout, which could affect the pace of compute supply
      expansion and the inference cost curve; for compute projects reliant on external financing, delivery
      and expansion uncertainty rises. These implications are inference; the material provides no loan
      size or buyer details.
    event_summary_zh: 2026年11月，一批数据中心贷款被打包出售，其中包含星际之门项目相关敞口。
    event_summary_en: In November 2026, a batch of data center loans was packaged and sold, including
      exposure related to the Stargate project.
