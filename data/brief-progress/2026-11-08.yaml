    summary_zh: 英国金融行为监管局（FCA）于2026年11月发布对英国金融服务领域AI应用的评估，指出良好实践与待改进领域。该监管审视明确了金融机构在采用AI时需满足的合规与治理要求，对AI在受监管行业的部署节奏与交付方式构成约束（推断）。
    summary_en: The UK Financial Conduct Authority (FCA) published in November 2026 an assessment of AI
      use in UK financial services, highlighting good practice and areas for improvement. This supervisory
      review sets out compliance and governance expectations for financial institutions adopting AI, shaping
      the pace and delivery of AI deployment in a regulated sector (inference).
    event_summary_zh: FCA于2026年11月发布英国金融服务AI应用评估，列出良好实践与待改进领域。
    event_summary_en: The FCA published in November 2026 an assessment of AI use in UK financial services,
      listing good practices and areas for improvement.
