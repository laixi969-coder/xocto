  the-agentic-web-is-here:
    slug: the-agentic-web-is-here
    name: The agentic web is here
    decision: market_context
    summary_zh: 2026年11月，有报道称自主软件代理使用互联网执行任务的设想已落地，Meta 的 Muse、OpenAI 的 Dots 和 Anthropic 的 Claude Duet
      等工具被授予访问用户邮箱和银行账户的权限，同时出现了一系列令人担忧的事件。这意味着代理型 AI 正从演示走向真实账户与交易场景，采用门槛下降的同时，权限与安全风险成为交付与竞争的关键变量（推断）。
    summary_en: In November 2026, a report said the vision of autonomous software agents using the internet
      to carry out tasks has been realized, with tools such as Meta's Muse, OpenAI's Dots, and Anthropic's
      Claude Duet granted access to users' email inboxes and bank accounts, alongside a series of worrying
      incidents. This means agentic AI is moving from demos into real accounts and transactions, lowering
      adoption barriers while making permissions and security risks a key variable for delivery and competition
      (inference).
    event_summary_zh: 2026年11月2日的报道指出，Meta Muse、OpenAI Dots 和 Anthropic Claude Duet 等代理工具已被授予访问用户邮箱和银行账户的权限，并伴随一系列安全事件。
    event_summary_en: A November 2, 2026 report noted that agent tools including Meta Muse, OpenAI Dots,
      and Anthropic Claude Duet have been granted access to users' email inboxes and bank accounts, alongside
      a series of security incidents.
