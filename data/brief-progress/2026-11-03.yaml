      recreation of specific existing games, effective in version 2.1.314 released October 30. The rule
      aims to reduce liability from model outputs, but the material notes it is unlikely to curb the existing
      wave of AI-assisted game porting and copying, implying that platform-policy constraints have limited
      practical control over downstream AI-generated content (inference).
    event_summary_zh: Anthropic 在 Claude Code 系统提示中新增规则，禁止复刻特定现有游戏，该规则出现在 10 月 30 日发布的 2.1.314 版本中。
