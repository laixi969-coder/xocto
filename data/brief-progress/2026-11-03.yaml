  raising-the-quality-of-insights-in-agentic-analytics:
    slug: raising-the-quality-of-insights-in-agentic-analytics
    name: agentic analytics
    decision: market_context
    summary_zh: 2026年11月发布的调查报告显示，受访企业由分析智能体生成的洞察中平均仅48%带来业务改善，描述性洞察质量获多数认可，但用于驱动行动的规范性洞察评价分化。这意味着智能体分析在交付环节仍受洞察质量制约，错误洞察触发错误行动可能带来声誉或财务损失，影响企业对该类
      AI 应用投资回报的实现。
    summary_en: A survey report published in November 2026 found that on average only 48% of insights
      generated by analytics agents at surveyed organizations lead to business improvement; descriptive
      insights are widely praised while prescriptive insights that drive actions receive mixed reviews.
      This means agentic analytics delivery remains constrained by insight quality, and flawed insights
      triggering incorrect actions can cause reputational or financial damage, affecting enterprises'
      ability to realize ROI on such AI applications.
    event_summary_zh: 调查报告显示，受访企业分析智能体生成的洞察中平均仅48%带来业务改善，规范性洞察质量评价分化。
    event_summary_en: The survey report shows that on average only 48% of insights generated by analytics
      agents at surveyed organizations lead to business improvement, with mixed reviews of prescriptive
      insight quality.
