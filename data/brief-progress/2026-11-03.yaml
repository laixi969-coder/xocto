    name: Stop counting tokens, start counting what ships
    decision: market_context
    summary_zh: 2026年11月，有分析指出，AI 编程代理单次任务消耗的 token 可达普通对话提示的 10 至 50 倍，按 token 计费使高价值工作流同时成为最昂贵的工作流；文中提到
      Uber 在扩大某编程代理工具使用后于 4 月耗尽 2026 年 AI 预算，某主流代码助手从固定费率转向按量计费，Gartner 预测到 2028 年 AI 编程 token 成本将超过开发者平均薪资。这意味着
      AI 编程的采用成本结构正从席位订阅转向用量驱动，企业若以 token 用量或统一上限控制支出，可能压制真正产出软件的工作流，因此衡量指标需转向每次合并请求的成本（推断）。
    summary_en: In November 2026, an analysis noted that a single AI coding-agent task can consume 10
      to 50 times more tokens than a basic chat prompt, so per-token pricing makes the most valuable workflows
      the most expensive; it cited Uber exhausting its 2026 AI budget by April after expanding use of
      a coding-agent tool, a major code assistant moving from flat-rate pricing to metered credits, and
      a Gartner forecast that AI coding token costs will surpass average developer salaries by 2028. This
      means the cost structure of AI coding adoption is shifting from seat subscriptions to usage-driven
      billing, and blanket token caps may suppress the workflows that actually ship software, so measurement
      should move to cost per merged pull request (inference).
    event_summary_zh: 2026年11月2日的分析文章汇总了 AI 编程代理的 token 消耗特征，并引用 Uber 预算耗尽、某主流代码助手转向按量计费及 Gartner 对 2028
      年成本的预测。
    event_summary_en: A November 2, 2026 analysis summarized token consumption patterns of AI coding agents
      and cited Uber's exhausted budget, a major code assistant's shift to metered billing, and Gartner's
      2028 cost forecast.
