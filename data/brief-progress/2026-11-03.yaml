    decision: market_context
    summary_zh: Anthropic 于 2026 年 10 月底在 Claude Code 系统提示中加入禁止复刻特定现有游戏的新规则，并在 10 月 30 日发布的 2.1.314 版本中生效。该规则意在降低模型输出引发的版权责任，但材料指出这难以遏制已出现的
      AI 辅助游戏移植与复制浪潮，意味着平台政策层面的约束对下游 AI 生成内容的实际管控能力有限（推断）。
