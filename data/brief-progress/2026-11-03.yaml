  political-ads-turn-against-data-centers:
    slug: political-ads-turn-against-data-centers
    name: Political ads turn against data centers
    decision: market_context
    summary_zh: 2026年10月，提及数据中心的美国政治广告中仅3%表示支持，57%表示反对，其余未明确表态；同期美国人口普查局企业调查显示，2026年10月初有24.6%的企业称使用“超级智能”类工具，高于2025年11月下旬的17.3%。数据中心面临的政治阻力上升，可能推高AI算力基础设施的选址与建设成本，进而影响AI应用的成本与交付节奏；企业侧使用率上升则反映采用面在扩大。上述对成本与采用的影响为推断。
    summary_en: In October 2026, only 3% of US political ads mentioning data centers supported them, while
      57% opposed them and the rest took no clear stance; separately, the US Census Bureau business survey
      showed 24.6% of firms reporting use of 'super intelligence' tools in early October 2026, up from
      17.3% in late November 2025. Rising political resistance to data centers may raise siting and construction
      costs for AI compute infrastructure, affecting AI application costs and delivery timelines, while
      higher firm-level usage points to broadening adoption. These cost and adoption implications are
      inferences.
    event_summary_zh: 2026年10月，提及数据中心的美国政治广告中仅3%支持、57%反对；美国人口普查局企业调查显示2026年10月初24.6%的企业称使用“超级智能”类工具，高于2025年11月下旬的17.3%。
    event_summary_en: In October 2026, only 3% of US political ads mentioning data centers supported them
      versus 57% opposed; the US Census Bureau business survey showed 24.6% of firms reporting use of
      'super intelligence' tools in early October 2026, up from 17.3% in late November 2025.
