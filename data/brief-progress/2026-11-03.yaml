    name: Global venture funding, Q3 2026
    decision: market_context
    summary_zh: 2026 年前三季度全球风险投资额接近 6800 亿美元，创历史新高，但种子期与早期公司的融资笔数持续下降，资金高度集中于超大额轮次：第三季度约三分之一资金流向仅 27 家十亿美元级融资公司。这意味着早期
      AI 创业公司获取启动资金的竞争更激烈，而头部公司则拥有更充裕的资本用于算力与人才投入。
    summary_en: 'Global venture funding reached nearly $680 billion through the first three quarters of
      2026, a record, while the number of seed and early-stage deals kept falling and capital concentrated
      in mega-rounds: about one-third of Q3 funding went to just 27 companies raising billion-dollar-plus
      rounds. This implies tougher competition for early-stage AI startups seeking initial capital, while
      leading companies have more abundant capital for compute and talent.'
    event_summary_zh: 2026 年第三季度数据显示，全球风险投资额创纪录地接近 6800 亿美元，但融资笔数下降，约三分之一季度资金集中于 27 家十亿美元级融资公司。
    event_summary_en: Q3 2026 data showed global venture funding at a record nearly $680 billion while
      deal counts fell, with about one-third of quarterly funding concentrated in 27 billion-dollar-plus
      rounds.
