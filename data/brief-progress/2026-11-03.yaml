  google把tpu卖进客户机房云厂商正在变成ai系统公司-智能启示录:
    slug: google把tpu卖进客户机房云厂商正在变成ai系统公司-智能启示录
    name: Google TPU
    decision: market_context
    summary_zh: Google 将 TPU 销售延伸至客户自有数据中心，云厂商由此从算力租赁转向交付整套 AI 系统。这一变化意味着企业部署 AI 时可选择自建算力而非完全依赖公有云，对云服务的交付形态与竞争格局构成影响（推断）。
    summary_en: Google extended TPU sales into customers' own data centers, shifting cloud providers from
      renting compute toward delivering full AI systems. This means enterprises deploying AI can build
      their own compute instead of relying entirely on public cloud, affecting cloud delivery models and
      competition (inference).
    event_summary_zh: Google 将 TPU 推向客户自有数据中心部署。
    event_summary_en: Google moved TPU offerings into customer-owned data center deployments.
