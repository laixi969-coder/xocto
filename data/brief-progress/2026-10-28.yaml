    slug: no-human-at-the-helm-delaware-plan-would-let-ai-agents-run-e
    name: Delaware Artificial Intelligence Company (AIC) proposal
    decision: market_context
    summary_zh: 美国众议院监督与政府改革委员会主席 James Comer 致信特拉华州州长 Matt Meyer，要求提供该州拟设立“人工智能公司”（AIC）这一新公司形式的文件，并称该提案可能被用来让人类所有者规避
      AI 鲁莽有害行为的法律责任。这一监管争议若推进，将影响 AI 代理运营企业的责任归属与合规成本，进而影响 AI 代理在业务交付中的采用边界；目前仅为提案与国会质询阶段，尚未形成规则。
    summary_en: US House Oversight Committee chairman James Comer wrote to Delaware Governor Matt Meyer
      requesting documents on the state's proposed Artificial Intelligence Company (AIC) entity, arguing
      it could let human owners evade liability for reckless or harmful AI actions. If pursued, this regulatory
      dispute would shape liability and compliance costs for AI-agent-run businesses and thus the adoption
      boundary for AI agents in delivery; it remains a proposal and congressional inquiry, not a rule.
    event_summary_zh: 美国众议院监督与政府改革委员会主席 James Comer 致信特拉华州州长 Matt Meyer，要求提供该州设立“人工智能公司”（AIC）新公司形式的文件，并批评该提案可能被用于规避
      AI 行为的法律责任。
    event_summary_en: US House Oversight and Government Reform Committee chairman James Comer wrote to
      Delaware Governor Matt Meyer seeking documents on the state's plan to create an Artificial Intelligence
      Company (AIC) entity, criticizing the proposal as open to abuse that could shield owners from liability
      for AI actions.
