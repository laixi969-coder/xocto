      Leading the Future 一年内支出 4500 万美元，Anthropic 支持的 Public First Action 亦参与投入。数据中心选址与电力成本的政治阻力上升，可能推高
      AI 算力基础设施的交付周期与合规成本（推断），但材料未给出具体项目取消或电价数据。
    summary_en: In 2026, rapid data center buildout has sparked local opposition across U.S. communities
      and become an issue in congressional and gubernatorial campaigns, while the Leading the Future super
      PAC backed by Marc Andreessen and Greg Brockman has spent $45 million in a year and the Anthropic-backed
      Public First Action is also spending. Rising political friction over siting and power costs may
      lengthen delivery timelines and raise compliance costs for AI compute infrastructure (inference),
      though the material provides no specific project cancellations or electricity price data.
    event_summary_zh: 2026 年美国数据中心建设引发多地地方反对并进入竞选议题，相关科技政治行动委员会一年内支出 4500 万美元。
