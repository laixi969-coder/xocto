  帮用户抢-iphone-折叠屏的-agent正在塑造-ai-时代电商的形状:
    slug: 帮用户抢-iphone-折叠屏的-agent正在塑造-ai-时代电商的形状
    name: Shopify
    decision: market_context
    summary_zh: 2026 年 9 月 21 日，Shopify 宣布与 Meta 的 Muse 个人 Agent 深度合作，允许其通过 Shop Pay 在所有 Shopify 店铺完成结账；同期亚马逊封禁
      Muse 等未经授权的 AI 代理。Shopify 披露 2026 年一季度 AI 搜索带来的订单同比增长接近 13 倍、AI 带来的店铺流量增长 8 倍，二季度这两项倍数回落至 3 倍，且公司承认
      agentic commerce 相对其 1160 亿美元季度 GMV 仍然很小。这意味着电商平台对 Agent 的准入政策正在分化，Agent 渠道的订单增长基数小、倍数收敛快，短期内难以成为独立营收来源（推断）。
    summary_en: On September 21, 2026, Shopify announced a deep partnership with Meta's Muse personal
      agent, letting it complete checkout via Shop Pay across all Shopify stores, while Amazon blocked
      Muse and other unauthorized AI agents in the same period. Shopify reported that in Q1 2026 orders
      from AI search grew nearly 13x year over year and AI-driven store traffic grew 8x, with both multiples
      falling to 3x in Q2, and the company acknowledged agentic commerce remains small relative to its
      $116 billion quarterly GMV. This indicates e-commerce platforms are diverging on agent access policy,
      and agent-channel order growth starts from a small base with rapidly converging multiples, making
      it unlikely to become a standalone revenue source in the near term (inference).
    event_summary_zh: Shopify 于 2026 年 9 月 21 日宣布与 Meta 的 Muse Agent 合作，允许其通过 Shop Pay 在全部 Shopify 店铺结账；公司披露
      2026 年一季度 AI 搜索订单同比增长近 13 倍、AI 流量增长 8 倍，二季度两项倍数均回落至 3 倍。
    event_summary_en: On September 21, 2026, Shopify announced a partnership with Meta's Muse agent allowing
      checkout via Shop Pay across all Shopify stores; the company disclosed that in Q1 2026 AI-search
      orders grew nearly 13x year over year and AI traffic grew 8x, with both multiples falling to 3x
      in Q2.
