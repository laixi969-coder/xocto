    name: Amazon SageMaker AI
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: Amazon SageMaker AI 训练与处理作业新增 Seekable OCI（SOCI）索引镜像支持，可惰性加载容器镜像，仅拉取启动所需文件并在后台流式加载其余部分，作业启动时间从数分钟缩短至数秒，且无需修改作业定义、入口点或数据通道。
    event_summary_en: Amazon SageMaker AI added Seekable OCI (SOCI) indexed image support for training
      and processing jobs, enabling lazy container image loading that fetches only the files needed to
      start and streams the rest in the background, cutting job start time from minutes to seconds without
      changes to job definitions, entry points, or data channels.
