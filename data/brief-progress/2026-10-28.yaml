    name: Robotics Startup Venture Funding
    decision: market_context
    summary_zh: 2026 年第三季度全球机器人初创企业风险投资总额达 99 亿美元，超过 2025 年同期的 43 亿美元；2026 年前三季度累计同比增长约 185%，其中中国 132
      亿美元、美国 121 亿美元领先。资金集中流向 Xpeng Robotics（9 亿美元）和 AI² Robotics（7.36 亿美元 C 轮）等物理 AI 公司，意味着机器人训练与部署的资本供给显著扩大，但这是投资侧变化，尚不能推断产品成熟度或商业化已同步兑现（推断）。
    summary_en: Global venture funding to robotics startups reached $9.9 billion in Q3 2026, more than
      double the $4.3 billion in Q3 2025, with cumulative Q1-Q3 2026 funding up about 185% year over year,
      led by China at $13.2 billion and the U.S. at $12.1 billion. Capital concentrated in physical AI
      companies such as Xpeng Robotics ($900 million) and AI² Robotics ($736 million Series C), meaning
      the capital supply for robot training and deployment has expanded markedly; this is an investment-side
      shift and does not yet establish that product maturity or commercialization has kept pace (inference).
    event_summary_zh: 2026 年第三季度机器人初创企业全球风险投资为 99 亿美元，2026 年前三季度同比增长约 185%，中国和美国分别以 132 亿和 121 亿美元领先。
    event_summary_en: Global venture funding to robotics startups was $9.9 billion in Q3 2026, with Q1-Q3
      2026 up about 185% year over year, led by China at $13.2 billion and the U.S. at $12.1 billion.
