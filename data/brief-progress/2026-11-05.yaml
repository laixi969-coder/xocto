    slug: big-tech-claims-voters-ai-backlash-is-anti-trump-not-anti-te
    name: US data center ballot measures
    decision: market_context
    summary_zh: 在近期美国选举中，10 个州共 44 项限制数据中心的措施有 38 项获得通过，包括多项暂停令和禁令，另有反对 AI 的候选人当选。分析认为这些措施主要影响计划于 2028
      年的未来项目，而非已开工或 2027 年前获批的项目。这意味着 AI 数据中心扩张面临地方监管阻力上升，可能推高未来算力部署的审批与合规成本（推断）。
    summary_en: In recent US elections, 38 of 44 measures across 10 states seeking to restrict data centers
      passed, including numerous moratoriums and bans, and anti-AI candidates were elected. Analysts suggest
      these mainly affect future projects planned for 2028 rather than those under construction or approved
      through 2027. This means AI data center expansion faces rising local regulatory resistance, potentially
      raising approval and compliance costs for future compute deployment (inference).
    event_summary_zh: 美国 10 个州共 44 项限制数据中心的投票措施中 38 项获得通过，包含多项暂停令和禁令；分析认为主要影响 2028 年规划的未来项目。
    event_summary_en: Of 44 ballot measures across 10 US states seeking to restrict data centers, 38 passed,
      including numerous moratoriums and bans; analysts say these mainly affect future projects planned
      for 2028.
