    slug: uber-only-fulfilled-4-rides-from-ai-agents-last-quarter
    name: Uber
    decision: market_context
    summary_zh: Uber 在 2026 年第三季度财报电话会上首次披露，第三方 AI 代理仅促成 4 次行程，万圣节当周 AI 代理完成的 Uber Eats 订单约 500 单，而同期平台总行程与配送量达
      3.2 亿次。这表明代理式下单在出行与配送场景中的实际渗透仍极低，短期内难以改变平台的分发与议价结构；对 AI 应用而言，代理接入现有平台的商业价值仍待验证（推断）。
    summary_en: In its Q3 2026 earnings call, Uber disclosed for the first time that third-party AI agents
      arranged only four rides, and about 500 Uber Eats orders during the week of Halloween, against roughly
      320 million total rides and deliveries in the period. This shows agent-driven ordering remains a
      negligible share of mobility and delivery volume and is unlikely to reshape platform distribution
      or bargaining power in the near term; for AI applications, the commercial value of agents plugging
      into existing platforms is still unproven (inference).
    event_summary_zh: Uber 在 2026 年第三季度财报电话会上首次披露第三方 AI 代理促成的交易量：仅 4 次行程，万圣节当周约 500 单外卖，而平台同期总交易量为 3.2
      亿次。
    event_summary_en: 'In its Q3 2026 earnings call, Uber disclosed for the first time the volume of transactions
      arranged by third-party AI agents: only four rides and about 500 delivery orders in the week of
      Halloween, against 320 million total transactions on the platform in the period.'
