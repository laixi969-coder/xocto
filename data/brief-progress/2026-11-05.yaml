    name: open model inference market
    decision: market_context
    summary_zh: 2026年11月，一项针对开放模型采用与推理市场的测量研究指出，现有平台指标、初创公司营销数据和公开评测均不精确，尚无法可靠判断开放模型推理市场规模及其增长。该事实意味着开放模型生态缺乏可信的采用与成本基准，企业在选型与预算时面临更高的信息不确定性（推断）。
    summary_en: In November 2026, a measurement study of open-model adoption and inference found that
      platform metrics, startup marketing data and public evaluations remain imprecise, so the size and
      growth of the open-model inference market cannot yet be reliably determined. This means the open-model
      ecosystem lacks trusted adoption and cost benchmarks, raising information uncertainty for enterprise
      model selection and budgeting (inference).
    event_summary_zh: 一项研究发布开放模型采用与性能数据看板，并指出当前所有开放模型采用指标都极不精确。
    event_summary_en: A study released a dashboard aggregating open-model adoption and performance data
      and noted that all current open-model adoption metrics are highly imprecise.
