    slug: ainews-behind-latent-space-kill-my-saas-jev-ai-in-2026-aiei
    name: Weight-Space Programming
    decision: market_context
    summary_zh: 2026年11月初，多个研究团队报告前沿大模型可直接生成或编辑小型神经网络的权重，无需梯度训练或外部工具，且跨模型代际出现明显能力跃升，已有多次独立复现。若该能力成立，可能改变模型训练与小型网络构建的成本结构（推断），但材料仅涉及实验性复现，尚不能说明行业已整体转向。
    summary_en: In early November 2026, several research groups reported that frontier large models can
      directly generate or edit the weights of small neural networks without gradient training or external
      tools, with a sharp capability jump across model generations and multiple independent replications.
      If the capability holds, it could change the cost structure of model training and small-network
      construction (inference), but the material covers only experimental replications and does not show
      the industry has shifted as a whole.
    event_summary_zh: 2026年11月初，多个研究团队报告前沿大模型可直接生成或编辑小型神经网络权重，无需梯度训练或工具，跨模型代际出现明显能力跃升，并已有多次独立复现。
    event_summary_en: In early November 2026, several research groups reported that frontier large models
      can directly generate or edit the weights of small neural networks without gradient training or
      tools, with a sharp capability jump across model generations and multiple independent replications.
