    slug: pcper
    name: Vizio
    decision: market_context
    summary_zh: 2026年11月，有报道称Vizio智能电视在用户选择退出数据收集后仍继续追踪观看行为，此前相关罚款已达2000万美元。这一事实表明智能电视端的数据合规与用户同意机制存在执行缺口，对依赖电视端行为数据训练或投放的AI应用而言，数据来源的合法性与可审计性风险上升。
    summary_en: In November 2026, reports said Vizio smart TVs continue tracking viewing behavior even
      after users opt out of data collection, following $20 million in related fines. This indicates an
      enforcement gap in smart-TV data compliance and consent, raising legality and auditability risks
      for AI applications that rely on TV viewing data for training or targeting.
