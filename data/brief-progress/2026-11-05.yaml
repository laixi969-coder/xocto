  google-hasn8217t-figured-out-how-to-make-ai-pay-like-its-sea:
    slug: google-hasn8217t-figured-out-how-to-make-ai-pay-like-its-sea
    name: Alphabet
    decision: market_context
    summary_zh: Alphabet 在2026年第三季度财报中披露，搜索查询量增速为五年来最快，但搜索收入同比增速从上一季度的约17%放缓至12%，付费点击增速从13%降至8%；公司今年计划投入约2000亿美元基础设施支出，主要用于支持AI，财报发布后股价下跌约14%。这表明AI搜索改造尚未转化为与投入相称的广告变现增长，对依赖搜索广告覆盖AI推理成本的商业模式构成压力，也意味着AI搜索产品的单位经济性仍待验证。
    summary_en: In its Q3 2026 earnings, Alphabet reported the fastest search query growth in five years,
      but Search revenue growth slowed to 12% year over year from roughly 17% in the prior quarter, and
      paid-click growth fell from 13% to 8%; the company plans about $200 billion of infrastructure spending
      this year, largely for AI, and its shares fell about 14% after the report. This indicates that AI-driven
      search changes have not yet translated into ad monetization growth commensurate with the investment,
      pressuring the model of funding AI inference costs from search advertising and leaving the unit
      economics of AI search products unproven.
    event_summary_zh: Alphabet 披露2026年第三季度搜索收入同比增长12%，低于上一季度的约17%；付费点击增速从13%降至8%；搜索查询量增速为五年来最快；公司今年计划投入约2000亿美元基础设施支出，主要用于AI。
    event_summary_en: Alphabet reported Q3 2026 Search revenue growth of 12% year over year, down from
      roughly 17% in the prior quarter; paid-click growth slowed from 13% to 8%; search query growth was
      the fastest in five years; and the company plans about $200 billion of infrastructure spending this
      year, largely for AI.
