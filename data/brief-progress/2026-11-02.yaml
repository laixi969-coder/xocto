    name: AI表外负债
    decision: market_context
    summary_zh: AI相关表外负债在90天内增加近1万亿美元，总额突破4.1万亿美元。这一融资结构变化意味着AI基础设施扩张正更多依赖资产负债表外安排，可能抬高相关企业的财务风险敞口，并影响AI算力与应用的成本和融资环境（推断）。
    summary_en: AI-related off-balance-sheet liabilities rose by nearly $1 trillion in 90 days, exceeding
      $4.1 trillion in total. This financing shift means AI infrastructure expansion relies more on off-balance-sheet
      arrangements, which could raise financial risk exposure and affect the cost and funding environment
      for AI compute and applications (inference).
    event_summary_zh: AI相关表外负债在90天内增加近1万亿美元，总额突破4.1万亿美元。
    event_summary_en: AI-related off-balance-sheet liabilities grew by nearly $1 trillion in 90 days,
      surpassing $4.1 trillion.
