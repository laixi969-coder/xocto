    slug: bonus-features-november-1-2026-91-of-patients-want-their-per
    name: Bonus Features – November 1, 2026
    decision: market_context
    summary_zh: 2026年11月1日发布的行业汇总显示，91%的患者希望AI用于诊断时须经其授权，64%的医疗机构计划部署AI处理理赔与拒付管理。这反映医疗AI的采用正从诊断环节扩展到后台理赔运营，同时患者授权要求构成部署约束，推断将推高合规与流程设计成本。
    summary_en: 'An industry roundup published on November 1, 2026 reports that 91% of patients want their
      permission required when AI is used for diagnosis, and 64% of providers plan to deploy AI for claims
      and denials management. This indicates healthcare AI adoption is extending from diagnosis into back-office
      claims operations, while patient-consent requirements act as a deployment constraint; inference:
      this raises compliance and workflow-design costs.'
    event_summary_zh: 2026年11月1日的行业汇总披露两项调查数据：91%的患者希望AI用于诊断时须经其授权，64%的医疗机构计划部署AI处理理赔与拒付管理。
    event_summary_en: 'An industry roundup on November 1, 2026 disclosed two survey figures: 91% of patients
      want their permission required when AI is used for diagnosis, and 64% of providers plan to deploy
      AI for claims and denials management.'
