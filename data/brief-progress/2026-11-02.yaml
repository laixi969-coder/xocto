  11月首批广东启动ai智能体应用师人才培训计划不懂代码也可学20周岁以上市民均可报考:
    slug: 11月首批广东启动ai智能体应用师人才培训计划不懂代码也可学20周岁以上市民均可报考
    name: AI智能体应用师人才培训计划
    decision: market_context
    summary_zh: 广东于11月启动首批“AI智能体应用师人才培训计划”，面向20周岁以上市民开放，不要求编程基础。该计划反映AI智能体应用岗位的人才培养正在地方层面落地，可能扩大智能体工具的使用人群，但材料未披露培训规模、课程内容或与具体企业的合作，对成本和竞争格局的影响尚不明确（推断）。
    summary_en: Guangdong launched its first batch of an "AI agent application specialist" training program
      in November, open to residents aged 20 and above with no coding requirement. The program shows local-level
      workforce development for AI agent application roles, which could broaden the user base for agent
      tools, but the material does not disclose scale, curriculum or corporate partnerships, so the effect
      on costs and competition remains unclear (inference).
    event_summary_zh: 广东于11月启动首批“AI智能体应用师人才培训计划”，20周岁以上市民均可报考，不要求懂代码。
    event_summary_en: Guangdong launched the first batch of its "AI agent application specialist" training
      program in November, open to residents aged 20 and above without coding skills.
