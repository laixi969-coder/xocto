    slug: 双十一ai暗战电商想提升交易-消费者要全网比价
    name: 双十一AI暗战：电商想提升交易 消费者要全网比价
    decision: market_context
    summary_zh: 2026年双十一期间，电商平台用 AI 提升交易转化，消费者则用 AI 做全网比价，双方目标出现分化。这意味着 AI 在电商场景的采用已进入买卖双方博弈阶段，平台侧交付重点转向转化效率，而消费者侧工具削弱了平台的信息优势，竞争更依赖价格与商品本身。
    summary_en: 'During the 2026 Double 11 shopping festival, e-commerce platforms used AI to lift transaction
      conversion while consumers used AI to compare prices across sites, splitting the two sides'' goals.
      This means AI adoption in e-commerce has entered a stage of buyer-seller contention: platforms focus
      delivery on conversion efficiency, while consumer-side tools erode platforms'' information advantage,
      making competition depend more on price and the goods themselves.'
    event_summary_zh: 2026年双十一期间，电商平台以 AI 提升交易，消费者以 AI 进行全网比价。
    event_summary_en: During the 2026 Double 11 festival, e-commerce platforms used AI to boost transactions
      while consumers used AI for cross-site price comparison.
