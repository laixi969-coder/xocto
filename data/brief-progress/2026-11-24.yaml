        usage_reason_zh: 材料只说明可在沙箱中运行工具，未说明相较旧做法减少哪一步负担或改善哪项可核对结果，用户为何选择它属于推断且缺乏依据。
        usage_reason_en: The material only says tools can run in a sandbox and does not explain which
