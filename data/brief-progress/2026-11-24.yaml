        usage_reason_en: 'Inference: it keeps goals, capability assignments, progress, outputs and acceptance
          in one record, cutting the step of scrolling chats for evidence at handoff, so small teams handing
          off to others may try it; no retention or repeat-use evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决人和 AI Agent 混编后分工与验收散落、交接返工的问题，痛点具体；但公开材料只有仓库简介，实际流程未核验。
