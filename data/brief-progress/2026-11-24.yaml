    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT Services
    jobs:
    - 开发者在没有电脑或服务器时，用 iPhone 或 iPad 打开本地 DeepSeek Harness，处理代码或文本任务并当场拿到结果
    jobs_en:
    - Developers open a local DeepSeek Harness on iPhone or iPad when no computer or server is available,
      process code or text tasks and get results on the spot
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在没有电脑或服务器的场景下，于 iPhone 或 iPad 上打开 fish-pocket，由本机运行的 DeepSeek Harness 接收代码或文本任务并当场执行，界面为原生
      iOS 应用；用户拿到的是本机生成的结果，具体支持的任务范围与交付形态仍待核验。
    inspiration: 趋势：模型运行正从云端和桌面下沉到手机本机，移动端开始承载原本必须开电脑才能做的开发任务。切入：可从需要离线、隐私敏感或现场作业的开发者与运维人群进入，按本机运行环境或企业部署授权收费；公开材料尚未披露定价。
    summary_en: When no computer or server is available, developers open fish-pocket on iPhone or iPad,
      where a locally running DeepSeek Harness receives code or text tasks and executes them on the spot
      in a native iOS interface; users get locally generated results, while the exact task scope and delivery
      form still need verification.
    inspiration_en: 'Trend: model execution is moving from cloud and desktop down to the phone itself,
      so mobile devices begin to carry development tasks that previously required a computer. Entry: start
      with developers and operators who need offline, privacy-sensitive or on-site work, charging for
      the local runtime or enterprise deployment licenses; public materials do not yet disclose pricing.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在没有电脑或服务器可用时，用 iPhone 或 iPad 打开 fish-pocket，把代码或文本任务交给本机运行的 DeepSeek Harness 并当场取得结果。
        job_en: When no computer or server is available, developers open fish-pocket on iPhone or iPad,
          hand code or text tasks to a locally running DeepSeek Harness and get results on the spot.
        pain_zh: 离开电脑时，原本只能在桌面或服务器上跑的模型任务被迫中断，远程连服务器又受网络和配置限制。
        pain_en: Away from a computer, model tasks that normally run on desktop or server are interrupted,
          and remote server access is constrained by network and configuration.
        current_alternative_zh: 旧做法是回到电脑前运行，或通过远程连接、云端 API 在手机上间接调用模型。
        current_alternative_en: The old approach is to return to a computer, or to call models indirectly
          on the phone via remote connections or cloud APIs.
        usage_reason_zh: 推断：它把模型运行环境直接装进手机本机，省去开电脑或配置远程服务器这一步，因此需要离线或隐私敏感处理的开发者会在移动场景下选择它；公开材料尚无留存或付费证据。
        usage_reason_en: 'Inference: it puts the model runtime directly on the phone, removing the step
          of opening a computer or configuring a remote server, so developers needing offline or privacy-sensitive
          processing would choose it in mobile settings; public materials show no retention or payment
          evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决离开电脑时模型任务中断的问题，把运行环境搬进手机本机，痛点具体且交付可当场发生；买方尚不清晰。
        evidence_ids:
        - ev-b8707466451e8cb8
        - ev-cf03db661983ccca
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 294 增至 437 的关注度信号，缺少用户评价或采用证据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-b8707466451e8cb8
        - ev-cf03db661983ccca
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价、付费路径或企业授权方式，收入来源只能推断为个人购买或企业部署。
        evidence_ids:
        - ev-cf03db661983ccca
      - gate: truth
        status: insufficient
        reason: 本机运行能否在手机上稳定完成实际开发任务、结果是否可靠，缺少可复现实测与人工确认边界说明。
        evidence_ids:
        - ev-b8707466451e8cb8
      next_validation: 收集该应用在 App Store 的官方定价与内购说明，以及仓库 issue 中关于本机运行任务范围与结果可靠性的讨论。
  flashbrowse:
    slug: flashbrowse
    name: flashbrowse
    decision: watching
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
