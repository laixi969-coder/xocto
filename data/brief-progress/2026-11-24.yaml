    jobs:
    - 使用 Claude Code 的开发者需要在代理执行多步工具调用时判断它正在做什么、是否偏离任务
    jobs_en:
    - Developers using Claude Code need to see what the agent is doing across multi-step tool calls and
      whether it is drifting from the task
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 的开发者会在代理连续调用工具、跑子任务时打开它，把原本只能从聊天滚动日志里猜的执行过程，转成聊天旁一张实时点亮的流程图，标出工具调用、模型步骤、钩子和子代理。用户最终拿到的是对代理当前动作的可视化，仍需自己判断结果对错；具体流程与交付细节仍待核验。
    inspiration: 趋势：代理执行链变长后，看懂代理在做什么本身成了新负担，而不只是写代码。切入：从需要审计代理行为的开发团队或受监管行业的工程流程进入，做可留存的执行记录与偏离告警，而非只做实时动画；卖法未披露。
    summary_en: Developers using Claude Code open it while the agent runs multi-step tool calls and subagents,
      turning what was previously guessed from a scrolling chat log into a live map beside the chat that
      lights up tool calls, model steps, hooks and subagents. The user gets a visualization of the agent's
      current actions and still judges correctness themselves; the exact workflow and deliverables remain
      to be verified.
    inspiration_en: 'Trend: as agent execution chains lengthen, understanding what the agent is doing
      becomes its own burden, not just writing code. Entry: start from engineering teams or regulated
      industries that need auditable agent behavior, offering retained execution records and drift alerts
      rather than only a live animation; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 的开发者，在代理连续调用工具、跑子任务时，需要弄清它当前做到哪一步、是否偏离原任务。
        job_en: A developer using Claude Code, while the agent runs consecutive tool calls and subtasks,
          needs to know which step it is on and whether it has drifted from the task.
        pain_zh: 代理执行过程只以滚动日志呈现，步骤多时难以追踪，出错后定位成本高。
        pain_en: Agent execution appears only as a scrolling log, hard to follow across many steps and
          costly to diagnose after an error.
        current_alternative_zh: 翻看聊天记录和终端输出，或凭经验猜测代理状态。
        current_alternative_en: Reading back through chat history and terminal output, or guessing the
          agent's state from experience.
        usage_reason_zh: 推断：它把分散在日志里的工具调用与子代理步骤集中到一张实时图上，减少开发者回翻日志定位当前步骤的动作，因此多步任务频繁的开发者会在调试或监督代理时选用它。
        usage_reason_en: 'Inference: it consolidates tool calls and subagent steps scattered in logs into
          one live map, cutting the step of scrolling back to locate the current action, so developers
          running many multi-step tasks would pick it when debugging or supervising an agent.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理多步执行时难以追踪进度和定位偏离的需求，痛点来自日志式呈现的结构缺陷，交付为可视化状态。
        evidence_ids:
        - ev-91eb21caca17eb14
        - ev-4c34025a24f1a2c0
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度证据，缺少用户评价或案例说明它被持续用于监督代理。
        evidence_ids:
        - ev-4c34025a24f1a2c0
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或商业交付方式，买方与收费模式不明。
        evidence_ids:
        - ev-91eb21caca17eb14
      - gate: truth
        status: insufficient
        reason: 可视化贴近监督代理的第一性目标，但缺少它能否准确反映真实执行、误报与人工边界的公开验证。
        evidence_ids:
        - ev-91eb21caca17eb14
      next_validation: 收集该仓库的 issue 与 discussion，查看用户是否报告用它定位代理偏离或调试多步任务的真实案例。
