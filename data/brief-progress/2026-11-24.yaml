        - ev-0962f7b695b4c19b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 429 到 442 的关注度信号，没有用户评价或采用讨论说明谁在持续使用。
        evidence_ids:
        - ev-18d65a12bf256ae8
        - ev-0962f7b695b4c19b
      - gate: model
        status: insufficient
        reason: 开源插件，未见定价或付费路径；买方可能是依赖 DeepSeek Harness 的开发者或团队，属推断。
        evidence_ids:
        - ev-18d65a12bf256ae8
      - gate: truth
        status: insufficient
        reason: 本地执行与 SHA256 校验可确定性交付，但人工确认边界和实际产出质量未在材料中说明。
