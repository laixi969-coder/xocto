  豆包工作上线ai巨头狂卷办公场景独立客户端成标配:
    slug: 豆包工作上线ai巨头狂卷办公场景独立客户端成标配
    name: 豆包工作
    decision: watching
    event_summary_zh: 2026年9月，飞书发布8.0版并与豆包工作原生融合，飞书CEO谢欣称把智能体当作“一等公民”；同期有报道称豆包工作上线，办公场景出现独立客户端趋势。候选材料未给出豆包工作的具体功能、定价、客户或使用数据。
    event_summary_en: In September 2026, Feishu released version 8.0 with native integration of Doubao
      Work, and Feishu CEO Xie Xin said agents would be treated as "first-class citizens"; reports in
      the same period said Doubao Work launched and that standalone clients are becoming common in office
      scenarios. The candidate materials give no specific features, pricing, customers or usage data for
      Doubao Work.
    category: AI + 效率
    project_type: new_application
    industries:
    - 企业协同办公
    - 办公软件
    industries_en:
    - Enterprise collaboration
    - Office software
    jobs:
    - 企业员工在飞书内处理文档、消息与任务时，调用智能体完成跨应用的信息整理与待办推进；具体输入与交付仍待核验
    jobs_en:
    - Enterprise employees working with documents, messages and tasks inside Feishu invoke agents to consolidate
      cross-application information and advance to-dos; specific inputs and deliverables remain to be
      verified
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 企业员工在飞书等协同办公工具里处理文档、消息和待办时，可调用豆包工作的智能体来整理跨应用信息并推进任务；据材料，飞书8.0已与豆包工作原生融合，但豆包工作具体接收什么材料、执行哪些动作、最终交付什么，候选资料未说明，具体流程或交付仍待核验。
    inspiration: 趋势是协同办公平台把智能体当作原生组件而非外挂插件，办公入口的竞争从“有没有AI”转向“智能体能否直接读写工作数据”。切入可考虑从飞书生态之外的中小企业办公场景入手，做与具体业务系统（如合同、报销、客户跟进）绑定的智能体交付，而不是再做一个通用办公助手；卖法可围绕按流程或按结果计费，但公开价格未披露，不可假设。
    summary_en: When employees handle documents, messages and to-dos inside collaboration tools such as
      Feishu, they can invoke Doubao Work agents to consolidate cross-application information and push
      tasks forward; materials say Feishu 8.0 natively integrates Doubao Work, but what inputs it receives,
      which actions it performs and what it delivers are not described in the candidate materials, so
      the concrete workflow and deliverables remain to be verified.
    inspiration_en: The trend is that collaboration platforms treat agents as native components rather
      than plug-ins, shifting competition from "having AI" to "whether agents can directly read and write
      work data." An entry point could be office scenarios for small and mid-sized firms outside the Feishu
      ecosystem, building agents tied to specific business systems such as contracts, expense claims or
      customer follow-up, rather than another general office assistant; pricing could be per process or
      per outcome, but no public price is disclosed and must not be assumed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业员工在飞书内处理文档、消息与待办时，调用智能体完成跨应用信息整理与任务推进。
        job_en: Enterprise employees working with documents, messages and to-dos in Feishu invoke agents
          to consolidate cross-application information and advance tasks.
        pain_zh: 办公信息分散在文档、聊天和任务系统中，员工需要手工在多个界面之间复制、汇总和跟进，重复劳动多且容易遗漏。
        pain_en: Work information is scattered across documents, chats and task systems, forcing employees
          to manually copy, consolidate and follow up across multiple interfaces, which is repetitive
          and error-prone.
        current_alternative_zh: 员工手工在飞书文档、群聊和任务列表之间切换整理，或使用通用聊天助手复制粘贴内容后再自行归档。
        current_alternative_en: Employees manually switch among Feishu docs, group chats and task lists
          to organize work, or paste content into general chat assistants and file it themselves.
        usage_reason_zh: 推断：相较手工跨界面复制汇总，豆包工作若能在飞书内直接读取文档与消息并生成待办或摘要，可省去员工逐条搬运和整理的一步；但候选材料未给出具体动作与交付，该因果仍待核验。
        usage_reason_en: 'Inference: compared with manually copying and consolidating across interfaces,
          Doubao Work could save the step of moving and organizing items one by one if it can directly
          read documents and messages inside Feishu and produce to-dos or summaries; the candidate materials
          do not specify the actions or deliverables, so this causal link remains to be verified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决办公信息分散、员工需手工跨界面汇总跟进的痛点，旧行为明确；但具体交付形态材料未说明。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: consensus
        status: insufficient
        reason: 仅有飞书8.0原生融合的报道，缺少豆包工作自身的用户采用、留存或客户案例。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: model
        status: insufficient
        reason: 买方可能是使用飞书的企业，但候选未披露豆包工作的定价、计费方式或采购路径，属判断而非已验证事实。
        evidence_ids:
        - ev-ccc63841d29abcbb
      - gate: truth
        status: insufficient
        reason: 智能体直接读写办公数据涉及权限与准确性边界，材料未说明人工确认机制与交付确定性。
        evidence_ids:
        - ev-3d7dc64ced8edd77
      next_validation: 收集豆包工作官方产品页或飞书8.0发布说明，核对其具体功能、权限边界与是否披露定价或客户案例。
