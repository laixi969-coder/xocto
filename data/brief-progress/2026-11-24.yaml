    open_source: true
    summary_zh: 面向需要在本地或低显存设备上运行大模型的人：NariQ 把 Qwen3.8-27B 量化成约 10 GB 的 GGUF 文件，用户下载后交给本地推理工具加载，得到接近 BF16
      精度的 27B 模型输出。具体量化方法与精度损失范围仍待核验。
    inspiration: 趋势：27B 级模型被压到消费级显存可承载的体积，本地部署的门槛继续下移。切入：不做又一个量化文件，而是面向有数据不能出内网的行业（如律所、诊所、制造质检）做“模型+本地部署+效果验收”的交付，按部署或验收结果收费；价格未披露，属判断。
    summary_en: 'For people who need to run a large model locally or on low-VRAM hardware: NariQ packages
      Qwen3.8-27B as a roughly 10 GB GGUF file that users load in a local inference tool to get near-BF16
      27B output. The quantization method and actual accuracy loss still need verification.'
    inspiration_en: 'Trend: a 27B-class model compressed into a file consumer GPUs can hold keeps lowering
      the bar for local deployment. Entry: rather than shipping another quantized file, sell model-plus-on-premise-deployment-plus-acceptance-testing
      to industries that cannot send data outside their network, such as law firms, clinics or factory
      QA, charging per deployment or acceptance result; pricing is undisclosed and this is a judgment.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 数据不能出内网的团队（如律所、诊所、制造企业）需要在自有显卡上跑一个能力尚可的大模型，处理内部文档与问答任务。
        job_en: Teams whose data cannot leave their intranet, such as law firms, clinics or manufacturers,
          need a reasonably capable model on their own GPUs to handle internal documents and Q&A.
        pain_zh: 直接跑 BF16 的 27B 模型需要远超普通工作站的显存；调用云端 API 又违反数据不出内网的要求。
        pain_en: Running a 27B model at BF16 needs far more VRAM than an ordinary workstation has, while
          calling a cloud API violates the no-data-leaves-intranet rule.
        current_alternative_zh: 旧做法是采购更贵的多卡服务器，或退而使用更小的模型、接受能力下降，或干脆继续人工处理。
