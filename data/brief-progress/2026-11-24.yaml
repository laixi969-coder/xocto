    project_type: new_application
    industries:
    - 金融服务
    industries_en:
    - Financial services
    jobs:
    - 金融机构岗位人员处理日常业务材料并产出岗位交付物
    jobs_en:
    - Staff in financial institutions processing routine business materials and producing role-specific
      deliverables
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 金融机构的岗位人员（如投研、风控、运营等）在完成日常业务材料时打开它，由智能体接收业务材料并执行岗位相关处理，最终产出岗位交付物；具体接收哪些材料、执行哪些动作、人工如何复核，公开材料尚未说明，具体流程或交付仍待核验。
    inspiration: 趋势：金融智能体开始从“通用问答”转向按岗位切分交付，说明买方更愿意为明确岗位产出付费。切入：从券商投研、银行风控等单一岗位的固定交付物（如尽调底稿、风险报告）入手，按产出计费；但需先核验其岗位清单与交付形态，避免与通用金融助手正面竞争。
    summary_en: Staff in financial institutions (for example research, risk or operations roles) open
      it while preparing routine business materials; the agent takes in business materials and performs
      role-related processing to produce role-specific deliverables. Which materials it ingests, what
      actions it performs and how humans review the output are not described in the public material, so
      the concrete workflow and deliverables still need verification.
    inspiration_en: 'Trend: financial agents are moving from generic chat toward role-by-role delivery,
      suggesting buyers pay for clearly defined role outputs. Entry: start from a single role''s fixed
      deliverable in brokerage research or bank risk control (for example due-diligence working papers
      or risk reports) and charge per output; first verify its role list and delivery format to avoid
      head-on competition with general financial assistants.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 金融机构的岗位人员（如投研、风控、运营）在处理日常业务材料时，需要按岗位要求产出报告、底稿或分析结论等交付物。
        job_en: Staff in financial institutions (such as research, risk or operations roles) need to produce
          reports, working papers or analyses to role requirements while processing routine business materials.
        pain_zh: 金融岗位交付物格式固定、重复劳动多，且对准确性和合规要求高；公开材料未说明其具体痛点来源，此判断为工作流推理。
        pain_en: Financial role deliverables are highly standardized and repetitive yet demand accuracy
          and compliance; the public material does not state the specific pain source, so this is workflow
          inference.
        current_alternative_zh: 岗位人员手工整理材料、套用模板撰写，或使用通用大模型对话后再人工改写。
        current_alternative_en: Staff manually compile materials and write from templates, or use general
          LLM chat and then rewrite by hand.
        usage_reason_zh: 推断：若智能体能直接接收岗位业务材料并按岗位产出交付物，可减少从零整理与套模板的步骤，因此需要批量产出固定交付物的金融岗位人员会在日常业务中尝试它；其实际减少哪一步、交付是否确定，公开材料尚未核验。
        usage_reason_en: 'Inference: if the agent can directly ingest role business materials and produce
          role deliverables, it removes the step of compiling from scratch and filling templates, so financial
          staff who must produce standardized deliverables at volume would try it; which step it actually
          removes and whether delivery is reliable are not yet verified publicly.'
      gates:
      - gate: value
        status: supported
        reason: 它解决金融岗位按固定要求产出交付物的重复劳动问题，痛点刚性且交付可指向具体岗位产出；具体岗位与交付形态仍待核验。
        evidence_ids:
        - ev-10f01ef03a3685f4
        - ev-d657ff0e35c6a040
      - gate: consensus
        status: insufficient
        reason: 仅有发布报道，未见客户采用、岗位清单或使用反馈，共识证据不足。
        evidence_ids:
        - ev-c2e220138fae5db7
      - gate: model
        status: insufficient
        reason: 未披露定价、买方与收费方式，钱从哪来只能推断为金融机构采购，属判断非事实。
        evidence_ids:
        - ev-10f01ef03a3685f4
      - gate: truth
        status: insufficient
        reason: “按岗位交付”的承诺能否确定性交付、人工复核边界如何，公开材料未说明。
        evidence_ids:
        - ev-d657ff0e35c6a040
      next_validation: 收集FinWork官方产品页或发布稿，核验其岗位清单、交付物形态与定价页。
