    inspiration: 趋势：大模型厂商开始把安全审查做成可直接跑在旧代码上的开源检查器，说明 AI 正从写代码走向替人做上线前的风险判断。切入：从仍大量运行 PHP 旧站的中小托管商、建站外包团队切入，按每次上线扫描或按站点包年收费，卖的是拦截一次真实注入的结果，而不是又一个通用代码助手。
