      w-okada''s RVC v2 real-time voice changer as a portable 64-bit build with precompiled CUDA/DirectML
      runtimes, so users unzip and convert microphone audio to a target timbre during streaming or recording,
      with hot-reloadable JSON configuration. Actual audio quality, latency and stability remain to be
      verified.'
    inspiration_en: 'Trend: open-source real-time voice cloning has made model capability common, so value
      shifts to whether ordinary users can install and run it reliably. Entry: target streamers, audiobook
      narrators and game companions who already pay for voice tools, selling a ready-to-run portable pack
      or hosted service rather than another model; latency and stability are what these users would pay
      for.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 主播或配音爱好者在直播或录音时，需要把自己的声音实时换成目标音色，并希望免安装直接运行。
        job_en: Streamers or voice hobbyists need to convert their own voice to a target timbre in real
          time during streaming or recording, and want to run it without installation.
        pain_zh: 原版 RVC 实时变声依赖 Python 环境和 CUDA 配置，非技术用户装环境、调依赖成本高，常卡在跑不起来。
        pain_en: The original RVC real-time voice changer depends on a Python environment and CUDA setup;
          non-technical users struggle with installation and dependency tuning and often cannot get it
          running.
        current_alternative_zh: 用户此前要么自己配 Python/CUDA 环境跑 w-okada 原版，要么用商业变声软件，前者门槛高、后者音色定制有限。
        current_alternative_en: Users previously either configured Python/CUDA to run the original w-okada
          build themselves, or used commercial voice changers with limited timbre customization.
        usage_reason_zh: 推断：它把预编译运行环境和便携包直接交付，省去用户自己装 Python、配 CUDA 的步骤，因此没有技术背景但想实时变声的主播会优先选它；实际延迟与稳定性尚无公开反馈支撑。
        usage_reason_en: 'Inference: it ships precompiled runtimes and a portable package, removing the
          step of installing Python and configuring CUDA, so non-technical streamers wanting real-time
          conversion would prefer it; public feedback on latency and stability is not yet available.'
      gates:
      - gate: value
        status: supported
        reason: 它解决非技术用户在直播或录音中实时变声、又不想配环境的需求，痛点具体且旧流程门槛高。
        evidence_ids:
        - ev-5b91605bfd03fed4
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标数，缺少用户评价、使用反馈或社区讨论，无法判断是否形成采用共识。
        evidence_ids:
        - ev-5b91605bfd03fed4
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或托管服务信息，钱从哪来尚不清楚，这是判断不是事实。
        evidence_ids:
        - ev-5b91605bfd03fed4
      - gate: truth
        status: insufficient
        reason: 实时延迟、音质和稳定性没有可核验的实测或用户反馈，交付确定性未确认。
        evidence_ids:
        - ev-5b91605bfd03fed4
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对延迟、音质和安装成功率的实际反馈。
  saccade:
