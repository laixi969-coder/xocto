      page, a CLI runner and a SHA256-verified installer; repository stars rose from 429 to 442.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在 DeepSeek Harness 中调用本地 craft-anything 命令行生成或处理产物时，通过该插件把 MCP 调用转接到本地 CLI 并查看运行状态
