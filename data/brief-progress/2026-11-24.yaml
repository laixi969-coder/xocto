        - ev-2e2e1a9bbfe8d53e
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是个人自学者或培训机构，属判断而非已验证事实。
        evidence_ids:
        - ev-1b29921994fb3ec0
      - gate: truth
        status: insufficient
        reason: 依赖使用者自备 Claude Code，批改质量与人工确认边界未公开，交付确定性尚无法核对。
        evidence_ids:
