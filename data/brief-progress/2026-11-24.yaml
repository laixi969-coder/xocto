      MCP calls to the local CLI and check run status
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在 DeepSeek Harness 里需要调用本地 craft-anything 命令行时，这个插件把 mcp__craft__* 请求桥接到本地 CLI，并提供
      clean-room/deep 模式切换、状态页和 SHA256 校验安装器；用户最终得到的是在编辑器内触发的本地命令执行与状态反馈，具体产出内容与人工确认环节仍待核验。
