  tinker-ai-skill:
    slug: tinker-ai-skill
    name: tinker-ai-skill
    decision: watching
    event_summary_zh: 2026年11月7日，drost-ai 发布开源 Agent Skill，可把用户在 Claude Code 中的会话记录交给 Tinker 微调一个 agentic
      模型，并声明兼容 Claude Code、Codex 与 OpenCode；截至11月24日仓库约335星，星数一周内基本持平。
    event_summary_en: On 7 November 2026, drost-ai released an open-source Agent Skill that fine-tunes
      an agentic model with Tinker on a user's own Claude Code sessions, stated to work in Claude Code,
      Codex and OpenCode; the repository had about 335 stars by 24 November, essentially flat over the
      week.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code 等编码代理的开发者，在反复纠正代理同类错误后，把历史会话整理成训练数据并提交微调，以获得更贴合自身代码习惯的模型
    jobs_en:
    - Developers using coding agents such as Claude Code who, after repeatedly correcting the same agent
      mistakes, turn past sessions into training data and submit a fine-tune to get a model aligned with
      their own code habits
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex 或 OpenCode 的开发者，在发现代理反复犯同类错误后，可调用这个技能把本地会话记录交给 Tinker 做微调，最终得到一个按自己习惯调整过的模型；训练数据如何筛选、微调后效果如何核对，公开材料未说明，具体流程与交付仍待核验。
    inspiration: 趋势是编码代理的个性化正从改提示词走向用真实会话做微调，模型层能力被商品化后，差异落在“谁的会话数据更值钱”。切入可考虑面向有大量代理使用记录的软件团队，做会话数据的清洗、脱敏与微调托管，按次或按团队收费；但当前星数平稳，尚未看到付费或复用证据。
    summary_en: Developers using Claude Code, Codex or OpenCode can invoke this skill to send local session
      logs to Tinker for fine-tuning after the agent repeats the same mistakes, ending with a model adjusted
      to their habits; how training data is filtered and how results are checked is not described, so
      the concrete workflow and deliverable remain to be verified.
    inspiration_en: The trend is that coding-agent personalization is moving from prompt tweaks to fine-tuning
      on real sessions; as model capability commoditizes, the edge sits in whose session data is more
      valuable. An entry point is hosting session cleaning, redaction and fine-tuning for software teams
      with heavy agent usage, charged per run or per team; stars are flat and no payment or reuse evidence
      is visible yet.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者，在代理反复犯同类错误、每次都要手动纠正时，把历史会话整理成训练样本并提交微调，得到一个更贴合自身代码库的模型。
        job_en: Developers using coding agents who, when the agent repeats the same mistakes and needs
          manual correction each time, turn past sessions into training samples and submit a fine-tune
          to get a model better aligned with their codebase.
        pain_zh: 通用编码代理不了解具体项目的约定与历史，用户只能反复在提示词里重申规则，或在每次会话中重新纠正，纠正成本随使用频率累积。
        pain_en: General coding agents do not know a project's conventions and history, so users must
          restate rules in prompts or re-correct in every session, and the correction cost accumulates
          with usage.
        current_alternative_zh: 旧做法是写更长的规则文件、维护提示词模板，或人工在每次会话中重复纠正；也有人自建脚本导出会话再自行训练。
        current_alternative_en: The old approach is longer rule files, maintained prompt templates, or
          manual re-correction each session; some build their own scripts to export sessions and train
          separately.
        usage_reason_zh: 推断：它把“导出会话—整理样本—提交微调”这几步收进一个可在编码代理内调用的技能，减少了手动搬运数据这一环，因此高频使用代理且项目约定稳定的开发者会在反复纠正后尝试它；是否真的改善结果尚无公开对照。
        usage_reason_en: 'Inference: it folds exporting sessions, preparing samples and submitting a fine-tune
          into one skill callable inside coding agents, removing the manual data-shuttling step, so developers
          with heavy agent use and stable conventions may try it after repeated corrections; no public
          comparison shows improved results yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理不懂项目约定、用户反复纠正的痛点，旧做法是维护提示词或手工纠正，结构上成立；但效果是否可核对尚无公开对照。
        evidence_ids:
        - ev-5a227067d4900b52
        - ev-0e3cb9a3fc475bb0
      - gate: consensus
        status: insufficient
        reason: 仓库约335星且一周内基本持平，说明有开发者关注，但没有讨论、issue 或采用案例表明它进入日常工作流。
        evidence_ids:
        - ev-5a227067d4900b52
        - ev-40c00a25edcafe2b
      - gate: model
        status: insufficient
        reason: 开源技能本身无定价，付费方可能是 Tinker 的微调服务或团队自建托管，公开材料未说明谁付钱，这是判断不是已验证事实。
        evidence_ids:
        - ev-0e3cb9a3fc475bb0
      - gate: truth
        status: insufficient
        reason: 微调是否真能减少纠正次数、会话数据脱敏与安全边界如何，公开材料未给出可复现结果，交付确定性未核验。
        evidence_ids:
        - ev-5a227067d4900b52
      next_validation: 收集该仓库的 issue、discussion 或 README 中的实测对比，确认微调后代理错误率或纠正次数是否有可核对变化。
