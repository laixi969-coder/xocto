        evidence_ids:
        - ev-44791e4c5db47fcd
      - gate: truth
        status: insufficient
        reason: 缺少可复现实测或文档说明其页面状态读取是否准确、能否确定性交付。
        evidence_ids:
        - ev-44791e4c5db47fcd
      next_validation: 查看该仓库的 README 与 issue，确认它读取页面状态的具体机制和可复现的实测结果。
