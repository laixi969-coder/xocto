          video tools with limited control over continuity and pacing.
        usage_reason_zh: 推断：该技能让编码代理直接生成整段镜头代码并按配音定时，省去在剪辑软件里逐段排镜头和对时轴这一步，因此需要批量产出解说短片、又缺剪辑人手的团队会尝试它。
        usage_reason_en: 'Inference: the skill has a coding agent generate the whole camera sequence as
