    - 开发者在已有 CLI 与订阅下想并行跑多个代理任务时，需要集中管理各代理的输出与状态
    jobs_en:
    - Developers running several coding agents such as Claude Code, Codex and OpenCode at once need one
      workbench to view and dispatch them while keeping human judgment
    - Developers with existing CLIs and subscriptions wanting to run parallel agent tasks need a central
      place to manage each agent's output and status
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在同时使用 Claude Code、Codex、OpenCode 等 40 多个编码代理时，icode-workbench 接收这些代理的 CLI 与订阅，在一个工作台里统一调度并展示运行情况，最终交付是集中管理界面，人工仍需保留判断。具体调度方式、并发上限与交付细节仍待核验。
    inspiration: 趋势：编码代理从单一工具走向多代理并行，开发者开始需要一个统一调度层。切入：从已同时订阅多个编码代理的团队或个人开发者入手，卖统一工作台与团队协作；但代理厂商自带界面可能吞掉这一层，需先验证多代理并行的真实痛点强度。
    summary_en: When developers use more than 40 coding agents such as Claude Code, Codex and OpenCode
      at once, icode-workbench takes their CLIs and subscriptions and dispatches and displays them in
      one workbench, delivering a central management interface while humans keep judgment. Dispatch mechanics,
      concurrency limits and delivery details remain to be verified.
    inspiration_en: 'Trend: coding agents are moving from single tools to parallel multi-agent use, and
      developers start to need a unified dispatch layer. Entry: start with teams or solo developers already
      subscribing to several coding agents, selling a unified workbench and team collaboration; but agent
      vendors'' built-in interfaces may absorb this layer, so the real pain of parallel agents needs validation
      first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同时运行多个编码代理时，需要在一个工作台里统一查看、调度并保留人工判断。
        job_en: Developers running several coding agents at once need one workbench to view, dispatch
