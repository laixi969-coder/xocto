        status: insufficient
        reason: 未进入：价值关未成立，且仓库仅 2 个星标，无采用或讨论证据。
        evidence_ids:
        - ev-2f80ff0f3dfd5bf0
      - gate: model
        status: insufficient
        reason: 未进入：价值关未成立，买方与付费路径无从判断。
        evidence_ids:
        - ev-5270689d337a1fd1
      - gate: truth
        status: insufficient
        reason: 未进入：无法核对交付是否确定发生，论文与数据是否对应亦未披露。
        evidence_ids:
        - ev-5270689d337a1fd1
      next_validation: 收集 ART 论文的公开页面或仓库 README，确认论文主题、数据内容与使用说明。
