    summary_en: When developers need to call the local craft-anything CLI inside DeepSeek Harness, this
      plugin bridges mcp__craft__* requests to that CLI and adds a clean-room/deep mode switch, a status
      page and a SHA256-verified installer; users get editor-triggered local command execution and status
      feedback, while the actual outputs and human confirmation steps remain unverified.
    inspiration_en: The trend is model hosts plugging into local command-line tools via MCP, attaching
      generation to concrete execution chains. The opening is teams needing reproducible local builds
      and verification, e.g. auditable install checks, run logs and mode switches; as a bridge layer,
      the value must rest on verifiable local execution rather than generation itself.
