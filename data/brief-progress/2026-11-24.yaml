        current_alternative_en: The material does not describe existing alternatives such as other inference
          frameworks or managed cloud inference services.
        usage_reason_zh: 材料仅显示星标增长与讨论热度，未说明相较旧做法减少了哪一步负担，无法判断用户选择原因。
