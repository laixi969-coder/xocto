          to generate stroke-by-stroke whiteboard animation lessons for classroom or self-study playback.
        pain_zh: 手绘白板讲解视频需要教师逐帧绘制和录制，制作一条课程耗时长、难以批量复制；现有替代是人工录屏或静态图文，标准化讲解产能受限。
        pain_en: Hand-drawn whiteboard explainer videos require teachers to draw and record frame by frame,
          making each lesson slow and hard to replicate at scale; current alternatives are manual screen
          recording or static text and images, limiting standardized explainer output.
        current_alternative_zh: 教师自己手绘并录屏，或用静态图文、通用视频工具拼接讲解，缺少把知识点自动转成逐笔动画的环节。
        current_alternative_en: Teachers draw and record by hand, or assemble explanations from static
          text and images and generic video tools, with no step that turns a topic into stroke-by-stroke
          animation automatically.
        usage_reason_zh: 推断：相较人工逐帧绘制录屏，它让模型直接产出笔画序列并支持交互回放，省去绘制与录制这一步，因此需要批量标准化讲解视频的教培或内训人员会在备课时选择它；但课程是否达到教学可用、是否被重复使用尚无公开证据。
        usage_reason_en: 'Inference: versus manual frame-by-frame drawing and recording, it has models
          output stroke sequences with interactive replay, removing the drawing and recording step, so
          tutoring or training staff needing many standardized explainer videos would choose it when preparing
          lessons; public evidence on classroom readiness or repeated use is still missing.'
      gates:
