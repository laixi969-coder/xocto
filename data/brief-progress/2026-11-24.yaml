      - gate: consensus
        status: insufficient
        reason: 公开时约 168 星、22 个未关闭议题，说明有初步关注，但没有用户评价或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-4713040057f01ec3
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价或付费路径；买方可能是企业工程团队，但这是判断而非已验证事实。
        evidence_ids:
        - ev-4713040057f01ec3
      - gate: truth
        status: insufficient
        reason: 仓库描述简短，索引方式、准确性与人工确认边界均未公开，无法核对交付是否确定发生。
