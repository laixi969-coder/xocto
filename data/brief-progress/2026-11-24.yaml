      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: GIS 分析师在查找 Esri 产品文档、工具用法或数据说明时，向助手提问以定位所需资料。
        job_en: GIS analysts looking up Esri product documentation, tool usage or data descriptions ask
          the assistant to locate the material.
        pain_zh: 专业 GIS 软件的文档分散且术语密集，人工检索耗时；该痛点来自对专业软件文档的一般认识，候选材料未提供用户抱怨。
        pain_en: Documentation for professional GIS software is scattered and jargon-heavy, making manual
          search slow; this pain comes from general knowledge of professional software docs, not from
          user complaints in the candidate material.
        current_alternative_zh: 用户目前自行翻阅帮助文档、论坛帖或向同事请教。
        current_alternative_en: Users currently read help documentation, forum posts or ask colleagues.
        usage_reason_zh: 推断：若助手能直接理解自然语言问题并返回对应文档段落或操作步骤，可省去用户自行筛选关键词与翻阅多页文档的一步；但候选未披露其实际能力，无法确认这一因果成立。
        usage_reason_en: 'Inference: if the assistant understands natural-language questions and returns
          the relevant documentation passage or steps, it removes the step of choosing keywords and paging
          through documents; the candidate does not disclose actual capability, so this causal claim is
          unconfirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决专业 GIS 软件文档检索慢的问题，但候选仅有标题，无法确认输入、动作与交付，价值结构无法还原。
        evidence_ids:
        - ev-aa6c07459ee7b9a6
      - gate: consensus
        status: insufficient
        reason: 未进入：仅有官方介绍标题，无用户采用、评价或使用场景描述。
        evidence_ids:
