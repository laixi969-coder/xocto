    summary_en: Developers using Claude Code, Cursor or Codex open pstack after the AI claims a fix, so
      the change is checked against its own work before merging. It takes the AI's code change and runs
      a verification step, returning a pass-or-fail result; the exact checks, coverage and human sign-off
      are still unverified.
    inspiration_en: 'Trend: the bottleneck in AI coding is shifting from generation to acceptance, and
      self-checking is becoming a separate product. Entry: start with small dev teams or outsourced delivery
      shops that are sensitive to shipped quality, charging per verification or per project rather than
      building another coding assistant; configurable standards are not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code、Cursor 或 Codex 的开发者让 AI 改完代码后，需要先确认它是否真的修好，再决定是否合并或交付。
        job_en: Developers using Claude Code, Cursor or Codex need to confirm whether AI-edited code actually
          fixes the problem before merging or shipping.
        pain_zh: AI 常声称已修复但问题仍在，开发者要自己重跑验证、逐行复查，返工和误合并的风险落在人身上。
        pain_en: AI often claims a fix while the bug remains, forcing developers to rerun checks and re-read
          diffs themselves, with rework and bad merges landing on them.
        current_alternative_zh: 开发者手动重跑测试、自己读 diff，或依赖现有 CI 与代码评审流程兜底。
        current_alternative_en: Developers manually rerun tests, read the diff themselves, or lean on
          existing CI and code review to catch it.
