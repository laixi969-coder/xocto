        current_alternative_en: Developers read docs and integrate manually, or stick with an incumbent
          email service such as SendGrid already in use.
        usage_reason_zh: 相较手动读文档接入，Resend 通过面向代理优化的文档让编码代理直接选中并写出接入代码，减少开发者比对与试错的一步；这是基于访谈中 AEO 研究结论的推断，尚无留存或复购数据佐证。
        usage_reason_en: Compared with manual doc reading, Resend's agent-optimized docs let coding agents
