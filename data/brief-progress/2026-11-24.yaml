  introducing-the-amazon-bedrock-trusted-access-api-with-anthr:
    slug: introducing-the-amazon-bedrock-trusted-access-api-with-anthr
    name: Amazon Bedrock
    decision: market_context
    event_summary_zh: 2026年11月24日，AWS 宣布 Amazon Bedrock 的 trusted access program API 正式可用，并公开预览 Anthropic
      的 Enterprise Frontier Safeguards 与 Enterprise Data Controls 两项准入计划，覆盖通过 Cyber Verification Program
      使用的 Claude 模型。该变化把前沿模型的安全审查、数据留存位置与审批流程收拢到云平台统一入口，意味着企业接入高能力模型的合规环节被平台化，应用方的接入成本与交付确定性受平台政策约束。
    event_summary_en: On 24 November 2026, AWS announced general availability of the trusted access program
      API on Amazon Bedrock and a public preview of Anthropic's Enterprise Frontier Safeguards and Enterprise
      Data Controls, covering Claude models used through the Cyber Verification Program. The change consolidates
      safety review, data-retention location and approval for frontier models into one cloud-platform
      entry point, meaning enterprise access to capable models is now gated by platform policy, which
      affects integration cost and delivery certainty for application builders.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是云平台的模型准入与合规接口更新，不是独立应用。它把多家模型厂商的安全审查、资格核验与数据控制选项集中到同一入口，供企业管理员用既有权限体系审批。
    inspiration: 平台把前沿模型的合规准入收进统一入口，说明应用层的差异化不能建立在“能调用最强模型”上；垂直产品应把合规审查、数据留存与审批流程本身做成可交付环节。
    summary_en: This is a cloud-platform update to model access and compliance interfaces, not a standalone
      application. It centralises safety review, eligibility checks and data-control options from multiple
      model providers into one entry point that enterprise administrators approve through existing permission
      systems.
    inspiration_en: By folding frontier-model compliance access into one platform entry point, the update
      shows application differentiation cannot rest on 'access to the strongest model'; vertical products
      should make compliance review, data retention and approval themselves a deliverable step.
