    industries_en:
    - software development
    - cloud computing
    jobs:
    - 用 AI 生成应用的个人开发者或小团队在准备上线、需要预估云与模型调用成本时，处理代码库和用量假设，得到不同用户规模下的运行费用估算与高成本代码提示
    jobs_en:
    - Individual developers or small teams who built apps with AI assistance estimate cloud and model-call
      costs before launch, working from the codebase and usage assumptions to get running-cost estimates
      at different user scales and flags for costly code patterns
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 用 AI 生成应用的个人开发者在上线前打开它，把代码库交给这个 Claude Code 技能，按 100、1k、10k、100k 用户四档估算运行成本，标出会推高账单的代码写法，并生成可分享的费用单。具体估算口径与准确度仍待核验。
    inspiration: 趋势：AI 生成代码让上线门槛降低，但把成本判断推到了更晚、更痛的位置，账单成为新的交付风险。切入：从独立开发者和小团队的上线前成本审查环节进入，可做按次出报告或与云账单对账的付费服务；目前只有开源技能形态，尚无定价与付费证据。
    summary_en: Before launch, an individual developer who built an app with AI assistance hands the codebase
      to this Claude Code skill, which estimates running costs at 100, 1k, 10k and 100k users, flags code
      patterns that inflate the bill, and renders a shareable receipt. The estimation method and accuracy
      still need verification.
    inspiration_en: 'Trend: AI-generated code lowers the barrier to shipping but pushes cost judgment
      later and makes the bill a new delivery risk. Entry: start from the pre-launch cost review step
      for indie developers and small teams, potentially selling per-report estimates or reconciliation
      against cloud bills; today it is only an open-source skill with no pricing or payment evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 用 AI 生成应用的个人开发者或小团队，在上线前需要知道不同用户规模下的运行成本，处理代码库和用量假设，产出费用估算与高成本代码清单。
        job_en: Individual developers or small teams who built apps with AI assistance need to know running
          costs at different user scales before launch, working from the codebase and usage assumptions
          to produce cost estimates and a list of expensive code patterns.
        pain_zh: AI 生成代码时很少考虑云与模型调用成本，账单往往在上线后才暴露，返工代价高；开发者缺少在发布前把成本说清楚的手段。
        pain_en: AI-generated code rarely accounts for cloud and model-call costs, so the bill often surfaces
          only after launch when rework is expensive; developers lack a way to make costs explicit before
          release.
        current_alternative_zh: 靠手工估算、翻云厂商定价页、或等真实账单出来再优化，缺少结构化的上线前成本审查。
        current_alternative_en: Manual estimates, reading cloud pricing pages, or waiting for the real
          bill and optimizing afterwards, with no structured pre-launch cost review.
        usage_reason_zh: 推断：它直接在代码库上按用户规模档位算出费用并指出推高账单的写法，省去开发者逐项翻定价页和手工推算的那一步，因此准备上线的独立开发者会在发布前用它做一次成本检查。
        usage_reason_en: 'Inference: it computes costs by user-scale tier directly on the codebase and
          points out patterns that inflate the bill, removing the step of reading pricing pages item by
          item and estimating by hand, so indie developers about to launch would use it for a pre-release
          cost check.'
      gates:
      - gate: value
        status: supported
        reason: 它解决上线前不知道运行成本、账单滞后暴露的痛点，交付是分档费用估算与高成本代码提示，结构上成立；估算准确度未核验。
        evidence_ids:
        - ev-41bb8735d9867caf
        - ev-b5e62ad55e7d85e5
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，属关注度而非采用证据，没有用户反馈或案例说明它被纳入发布流程。
        evidence_ids:
        - ev-b5e62ad55e7d85e5
      - gate: model
        status: insufficient
        reason: 开源技能无定价页，买方与付费路径未披露；可能来自开发者订阅或按次报告，这是判断不是事实。
        evidence_ids:
        - ev-41bb8735d9867caf
      - gate: truth
        status: insufficient
        reason: 估算依赖用量假设，能否确定性交付接近真实的费用结果缺少可复现实测或对账证据。
        evidence_ids:
        - ev-b5e62ad55e7d85e5
      next_validation: 收集该仓库的 README 与 issue/discussion，查找是否有可复现的估算示例或与真实云账单对账的结果。
