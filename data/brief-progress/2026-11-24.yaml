        pain_zh: 这些事务本身不难，但要在多个 App 或网站间切换、比价、填地址和支付，打断用户当下正在做的事；不做的代价是事情被拖延或干脆放弃。
        pain_en: These tasks are not hard, but switching among apps or sites, comparing, filling addresses
          and paying interrupts what the user is doing; the cost of not doing them is delay or abandonment.
        current_alternative_zh: 用户自己打开生鲜、票务、鲜花或场地预订 App 逐项操作，或请家人朋友代办；现有公开材料未显示用户已改用 Instinct。
        current_alternative_en: Users open grocery, ticketing, flower or court-booking apps themselves,
