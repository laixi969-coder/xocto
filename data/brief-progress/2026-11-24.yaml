      record; the exact deliverable and human confirmation step still need verification.'
    inspiration_en: 'Trend: as coding agents take on longer tasks, measuring and constraining their process
      quality is shifting from personal habit to a recordable object. Entry: start with teams that lean
      heavily on coding agents, turn time allocation and before/after comparisons into an auditable review
      record, and charge per seat or per review report; so far only open-source star growth is visible
      and the paid path is undisclosed.'
