    inspiration: 趋势：白板讲解这类原本靠教师手绘录屏的旧流程，正被拆成“模型生成笔画序列+可回放”的自动化环节。切入：从需要大量标准化讲解视频的教培机构或企业内训入手，卖按课程条数交付的成品，而非工具席位；开源仓库的盲评对比可作为选模型的依据。
