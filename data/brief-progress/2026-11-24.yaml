  sprite-stacking:
    slug: sprite-stacking
    name: sprite-stacking
    decision: watching
    event_summary_zh: 2026年11月20日发布的 sprite-stacking 是一个面向编码代理的开源技能，把四张像素画视图合成为可旋转的伪 3D 精灵；仓库收藏数在四天内从
      375 增至 696。
    event_summary_en: Released on 2026-11-20, sprite-stacking is an open-source agent skill that combines
      four pixel-art views into a rotatable fake-3D sprite; repository stars rose from 375 to 696 within
      four days.
    category: AI + 创作
    project_type: open_source
    industries:
    - 游戏开发
    - 数字内容创作
    industries_en:
    - Game Development
    - Digital Content Creation
    jobs:
    - 独立游戏美术在制作像素角色时，把已有的四向像素视图交给代理，生成可旋转的伪 3D 精灵用于游戏内展示
    - Pixel artists at indie game studios feed four directional pixel views to an agent to produce a rotatable
      fake-3D sprite for in-game display
    jobs_en:
    - Independent game artists producing pixel characters hand four directional pixel views to an agent
      to generate a rotatable fake-3D sprite for in-game display
    - Pixel artists at indie game studios feed four directional pixel views to an agent to produce a rotatable
      fake-3D sprite for in-game display
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 像素画师或独立游戏美术在已有角色四向像素图时，把四张视图交给编码代理执行该技能，合成可旋转的伪 3D 精灵，用于游戏内展示或素材预览；最终交付是可直接旋转查看的精灵图，是否需人工修图仍待核验。
    inspiration: 趋势：像素美术开始把多视图合成这类重复工序交给编码代理执行，而不是手工逐帧绘制。切入：从独立游戏和复古风格素材工作室进入，按角色或素材包交付可旋转精灵，而非卖通用生成工具；具体定价与付费意愿尚未披露。
    summary_en: When a pixel artist or indie game artist already has four directional pixel views of a
      character, they hand the four views to a coding agent running this skill, which composites them
      into a rotatable fake-3D sprite for in-game display or asset preview; the deliverable is a sprite
      that can be spun, and whether manual retouching is still needed remains unverified.
    inspiration_en: 'Trend: pixel artists are handing repetitive multi-view compositing to coding agents
      instead of drawing every frame by hand. Entry: start with indie games and retro-style asset studios,
      delivering rotatable sprites per character or asset pack rather than a generic generator; pricing
      and willingness to pay are not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立游戏美术在制作像素角色时，把已有的四向像素视图交给编码代理，生成可旋转的伪 3D 精灵用于游戏内展示。
        job_en: Indie game artists making pixel characters hand four directional pixel views to a coding
          agent to generate a rotatable fake-3D sprite for in-game display.
        pain_zh: 手工把多视图合成可旋转精灵需要逐帧对齐和绘制，重复且耗时；不做的后果是角色只能平面展示或需额外美术工时。
        pain_en: Hand-compositing multiple views into a rotatable sprite requires frame-by-frame alignment
          and drawing, which is repetitive and slow; skipping it means characters stay flat or need extra
          art hours.
        current_alternative_zh: 美术手工逐帧绘制旋转帧，或用通用图像工具拼接后手动调整。
        current_alternative_en: Artists draw rotation frames by hand or stitch views with generic image
          tools and adjust manually.
        usage_reason_zh: 推断：相较手工逐帧绘制，该技能让代理直接接收四张视图并输出可旋转精灵，省去逐帧对齐这一步，因此像素画师在需要快速产出可旋转角色时会选择它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: compared with hand-drawing frames, the skill lets an agent take four
          views and output a rotatable sprite, removing the frame-alignment step, so pixel artists may
          choose it when they need rotatable characters quickly; no user feedback or retention evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决像素角色多视图合成可旋转精灵的重复工序，痛点具体，旧做法是手工逐帧绘制，结构上成立。
        evidence_ids:
        - ev-e53a5375ace2219a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏增长，缺少用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-e53a5375ace2219a
        - ev-a18cfc3f7bfba417
        - ev-f4f7d41c74231607
      - gate: model
        status: insufficient
        reason: 开源技能无定价与付费路径，买方是个人美术还是工作室尚不清楚，属判断非事实。
        evidence_ids:
        - ev-f4f7d41c74231607
      - gate: truth
        status: insufficient
        reason: 交付是否需人工修图、合成质量能否稳定满足游戏内使用，公开材料未说明。
        evidence_ids:
        - ev-e53a5375ace2219a
      next_validation: 收集该仓库的 issue 与 discussion，查看用户是否报告合成结果可直接用于游戏或仍需人工修图。
