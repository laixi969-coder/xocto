      demand_read:
        job_zh: 使用 Claude Code 或 Codex 的开发者，在长时间让编程助手执行任务后，需要复盘时间花在哪些步骤、哪些指令或技能改动真正改善了结果，并据此调整助手的指令与工具配置。
