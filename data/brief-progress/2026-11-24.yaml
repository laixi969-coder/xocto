      signal_level: 需求存疑
      demand_read:
        job_zh: 构建浏览器自动化智能体的开发者在调试网页交互时，需要让智能体实时读取页面语义状态，以判断下一步操作。
        job_en: Developers building browser-automation agents need the agent to read live page semantic
