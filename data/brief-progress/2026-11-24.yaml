    summary_zh: 三维美术师只有一张参考图时，可在 Blender 环境中调用这个面向编码代理的技能，让它按图像配准视角、做贴图拟合，并回放建模过程，最终得到与参考图对齐的可编辑立体模型；具体精度与人工修整量仍待核验。
    inspiration: 趋势：单图到可编辑三维资产正从演示走向可回放的建模流程。切入：从游戏与影视的概念设定环节进入，把“参考图→可雕刻草模”做成按资产计费的交付，而非卖建模软件席位。
    summary_en: 'When a 3D artist has only one reference image, this coding-agent skill runs inside Blender:
      it registers views against the image, performs map-fitting passes and replays the modeling, yielding
      an editable 3D model aligned to the reference. Actual accuracy and manual cleanup effort remain
      unverified.'
    inspiration_en: 'Trend: single-image-to-editable-3D is moving from demos toward replayable modeling
      pipelines. Entry: start from game and film concept art, selling a per-asset ''reference image to
      sculptable blockout'' deliverable rather than software seats.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师或概念设计师在只有一张设定图时，需要据此在 Blender 中做出可继续雕刻的立体模型，用于造型验证或资产制作。
        job_en: A 3D artist or concept designer with only one setting image needs to build a sculptable
          3D model in Blender for shape validation or asset production.
        pain_zh: 从单张图手工重建三维形体需要反复对位、调整比例和贴图，耗时且依赖经验；不做的后果是造型验证被推迟或资产外包成本上升。
        pain_en: Manually rebuilding 3D form from a single image requires repeated alignment, proportion
          tuning and texturing; skipping it delays shape validation or raises outsourcing cost.
        current_alternative_zh: 旧做法是美术师在 Blender 或 ZBrush 中对照参考图手工建模，或使用图生三维模型工具后再大量修整。
        current_alternative_en: The old way is manual modeling against the reference in Blender or ZBrush,
          or using image-to-3D tools followed by heavy cleanup.
        usage_reason_zh: 推断：它把视角配准、贴图拟合和建模回放串成一次可复现的流程，减少美术师逐视角手动对位这一步，因此需要快速得到可雕刻草模的美术师会在概念阶段选用它；尚无用户反馈或客户案例支持这一动机。
        usage_reason_en: 'Inference: it chains view registration, map-fitting and modeling replay into
          one reproducible pass, cutting the per-view manual alignment step, so artists needing a fast
          sculptable blockout would pick it at concept stage; no user feedback or customer case supports
          this motive yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单张参考图到可编辑三维模型的转换需求，痛点是对位与重建耗时；交付为可回放的 Blender 建模结果，结构上成立，属工作流推理。
        evidence_ids:
        - ev-fb591d990ebcb8da
        - ev-efe3883b85a8f54e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏数缓慢增长，缺少用户评价、案例或社区讨论，无法判断美术师是否真的把它纳入工作流。
        evidence_ids:
        - ev-efe3883b85a8f54e
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是个人美术师或工作室，属判断而非已验证事实。
        evidence_ids:
        - ev-fb591d990ebcb8da
      - gate: truth
        status: insufficient
        reason: 尚未核验生成模型与参考图的贴合精度、人工修整量及是否贴近可交付资产标准，确定性交付存疑。
        evidence_ids:
        - ev-fb591d990ebcb8da
      next_validation: 收集该仓库的 issue 与 discussion，查看使用者对生成模型精度、修整工作量和 Blender 回放可用性的公开反馈。
    event_summary_zh: 2026 年 11 月 8 日发布的开源项目 image-to-sculpt 在仓库中持续获得收藏，从 297 增至 309，本次新增事实仅为收藏数变化，无发布、客户或定价信息。
