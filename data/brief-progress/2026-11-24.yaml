    summary_zh: 开发者在让编码代理实现邮件发送功能时，代理会检索并选择邮件 API，Resend 通过面向代理的文档与推荐优化被优先选中；用户最终拿到代理写好的接入代码与投递结果，人工仍需确认配置与域名验证。
