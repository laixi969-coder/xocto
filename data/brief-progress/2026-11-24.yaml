      when organizing footage and doing rough cuts. Public material only describes it as an 'AI video
      editor'; what instructions the AI takes, which editing step it performs, and the final deliverable
      still need verification.
    inspiration_en: 'Trend: video editing is shifting from manual timeline work toward stating editing
      intent in natural language, and open-source desktop tools are following. Entry: start with high-frequency
      rough-cut users such as short-video teams or e-commerce product-video makers, delivering fixed ''footage
      in, cut out'' templates rather than a general timeline; pricing is undisclosed and needs verification.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 剪辑师或内容创作者在拿到原始素材后，需要快速完成粗剪和片段处理，导出可发布的视频。
        job_en: After receiving raw footage, an editor or content creator needs to quickly complete a
          rough cut and clip edits, then export a publishable video.
        pain_zh: 手工在时间轴上逐段裁剪、拼接耗时且重复，粗剪阶段尤其枯燥；不做的后果是发布周期被拖长。
        pain_en: Manually trimming and assembling clips on a timeline is time-consuming and repetitive,
          especially in rough-cut stages; not doing it delays publishing cycles.
        current_alternative_zh: 传统桌面剪辑软件（如 Premiere、Final Cut）手工操作，或使用在线 AI 剪辑工具。
        current_alternative_en: Manual work in traditional desktop editors (e.g., Premiere, Final Cut)
          or online AI editing tools.
        usage_reason_zh: 推断：若它能把自然语言指令直接转成粗剪动作，用户可省去逐段手动裁剪这一步，从而在素材量大、需要快速出片时选择它；但公开材料未说明具体动作与效果，需核验。
        usage_reason_en: 'Inference: if it turns natural-language instructions directly into rough-cut
          actions, users skip manual clip-by-clip trimming and would choose it when footage volume is
          large and fast turnaround is needed; public material does not specify the actions or results,
          so this needs verification.'
      gates:
      - gate: value
        status: supported
        reason: 它解决粗剪阶段手工裁剪耗时的问题，痛点具体且交付可指向成片；但具体 AI 动作未披露。
        evidence_ids:
        - ev-0f21330fc7f97772
        - ev-6fa9ebfb038fa226
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数持续增长，属关注度信号，不能证明剪辑师已把它留在工作流。
        evidence_ids:
        - ev-6fa9ebfb038fa226
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或商业交付路径的公开材料。
        evidence_ids:
        - ev-0f21330fc7f97772
      - gate: truth
        status: insufficient
        reason: 未见用户反馈或成片案例，AI 剪辑动作与人工确认边界不明。
        evidence_ids:
        - ev-6fa9ebfb038fa226
      next_validation: 收集 Scarlet 仓库 README 或 release 说明，核验其 AI 具体执行哪些剪辑动作及交付形态。
