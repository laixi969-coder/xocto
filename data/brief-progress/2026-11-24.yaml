        status: insufficient
        reason: 开源免费项目，未见付费路径；可能靠定制形象或赞助，这是判断而非已验证事实。
        evidence_ids:
        - ev-361ae82c937a7a4a
      - gate: truth
        status: insufficient
        reason: AI 捏猫与 MCP 的具体能力未在材料中说明，交付确定性待核验。
        evidence_ids:
        - ev-361ae82c937a7a4a
      next_validation: 查看 kurocat 仓库的 issue 与文档，确认 AI 捏猫功能的实际输入输出与密码遮挡的实现方式。
  lasik:
    slug: lasik
