          or using a cloud assistant that needs connectivity.
        usage_reason_zh: 推断：Aether 把本地模型与 bash、文件、MCP 工具打包进一个应用，用户不必在 Termux 里逐条手写命令，也不必把文件传出设备，因此在无网或隐私敏感的手机场景下会被选择；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: Aether bundles a local model with bash, file and MCP tools in one
          app, so users need not hand-write each command in Termux or move files off the device, which
          is why it may be chosen in offline or privacy-sensitive phone scenarios; no user feedback or
          retention evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决在手机上离线执行脚本与文件操作的需求，痛点是无网或数据不出机时缺少可用手段；买方尚不清晰。
        evidence_ids:
        - ev-55cfcde6ca431dc6
        - ev-40aeef23728f708a
      - gate: consensus
        status: insufficient
        reason: 仅有约 40 星的开源关注度，没有用户评价、讨论或采用证据说明真实使用场景。
        evidence_ids:
        - ev-40aeef23728f708a
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露；可能靠捐赠或后续服务，但公开材料未说明，属判断而非事实。
        evidence_ids:
        - ev-55cfcde6ca431dc6
      - gate: truth
        status: insufficient
        reason: 本地模型在手机上的稳定性、工具执行的安全边界与人工确认机制均未在材料中说明。
        evidence_ids:
        - ev-55cfcde6ca431dc6
      next_validation: 收集该仓库的 issue 与 discussion，确认用户实际使用场景、本地模型运行稳定性及工具执行的安全边界。
