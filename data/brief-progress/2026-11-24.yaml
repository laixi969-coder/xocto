        pain_en: Facing job postings and their own experience, job seekers struggle to judge fit and how
          to adjust their resume and direction; this is an inference, as the public material gives no
          user pain description.
        current_alternative_zh: 自行搜索岗位、手动改简历、向朋友或职业顾问咨询，或在通用聊天助手里零散提问。
        current_alternative_en: Searching postings themselves, editing resumes manually, consulting friends
          or career advisors, or asking scattered questions in general chat assistants.
        usage_reason_zh: 若它能把简历与岗位信息一次性组织成可执行的建议或匹配清单，就省去用户在多个工具间搬运材料的步骤；但公开材料未说明具体动作与交付，因此用户为何选择它仍属推断，缺少使用反馈这一环。
