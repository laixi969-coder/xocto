      app, which uses the user's own Claude Code to build a full course, study schedule and grading, delivering
      an executable plan and scores; input formats, grading quality and human review steps still need
      verification.
    inspiration_en: 'Trend: self-study is shifting from finding existing courses to generating a course
      for one''s own goal with automatic grading. Entry: target exam-prep and career-switch learners with
      hard deadlines, selling per-course or per-grading results rather than seats; the open-source version
      first tests whether schedules and grading are actually followed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自学者在准备新学科或考试时，把零散资料交给工具，生成带排期和批改的课程，并按计划完成学习。
