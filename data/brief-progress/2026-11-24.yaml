      的治理与出口管制争议置于公开监管审视之下，可能加大其合规与政策风险，并影响 AI 芯片供应预期（推断）。
    summary_en: After Jensen Huang was reinstated as Nvidia CEO on November 23, 2026, the US Senate scheduled
      him to testify publicly next week about his affair with a suspected Chinese spy, following bipartisan
      calls for him to appear. The congressional hearing puts Nvidia's governance and export-control disputes
      under public regulatory scrutiny, potentially raising compliance and policy risk and affecting AI
      chip supply expectations (inference).
    event_summary_zh: 美国参议院安排黄仁勋在下周公开作证，涉及其与疑似中国间谍的婚外情，此前两党均要求其出席。
    event_summary_en: The US Senate scheduled Jensen Huang to testify publicly next week regarding his
      affair with a suspected Chinese spy, following bipartisan calls for him to appear.
