          service to set up a persistent, session-aware download queue to complete queuing and resumption
          of large files.
        pain_zh: 大文件下载在会话中断后需要重来，批量任务缺少统一排队，开发者要手工盯着进度并反复重试。
        pain_en: Large-file downloads must restart after a session breaks, batch tasks lack unified queuing,
          and developers must manually watch progress and retry repeatedly.
        current_alternative_zh: 开发者通常用命令行下载工具、脚本循环或手工重试来管理大文件下载。
