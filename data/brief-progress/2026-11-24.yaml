    summary_zh: Nvidia 董事会在 2026 年 11 月 23 日投票决定，在黄仁勋因多起丑闻辞职 11 天后立即恢复其 CEO 与董事长职务，部分依据是美国政府高层对其不构成国家安全风险的保证；与此同时，多个政府部门正就国家安全、会计与公司治理问题展开调查。这一治理不确定性影响
      AI 算力核心供应商的决策连续性与监管风险，进而波及下游 AI 应用的成本与供给预期（推断）。
    summary_en: On November 23, 2026, Nvidia's board voted to reinstate Jensen Huang as CEO and chairman
      effective immediately, 11 days after he resigned amid multiple scandals, partly based on assurances
      from senior US government levels that his reinstatement poses no national security risk; multiple
      government departments are meanwhile investigating national security, accounting and corporate governance
      issues. This governance uncertainty affects decision continuity and regulatory risk at a core AI
      compute supplier, with knock-on effects on downstream AI application cost and supply expectations
      (inference).
    event_summary_zh: Nvidia 董事会于 2026 年 11 月 23 日投票，在黄仁勋辞职 11 天后立即恢复其 CEO 与董事长职务，部分依据美国政府高层关于其不构成国家安全风险的保证。
    event_summary_en: Nvidia's board voted on November 23, 2026 to reinstate Jensen Huang as CEO and chairman
      effective immediately, 11 days after his resignation, partly based on senior US government assurances
      that he poses no national security risk.
