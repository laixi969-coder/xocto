        usage_reason_zh: 推断：相较自己在多个 App 间切换并逐步填写，Instinct 通过短信或电话接收一句自然语言需求，并直接操作手机和电脑完成下单，省去用户打开、搜索和填写的那几步；需要跨
          App 完成临时事务、又不想中断手头工作的用户会因此尝试它。公开材料未披露支付授权与失败处理，这是采用能否持续的关键缺口。
        usage_reason_en: 'Inference: compared with switching among apps and filling forms step by step,
          Instinct takes one natural-language request by text or phone and operates a phone and computer
