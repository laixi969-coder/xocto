      Canvas. For image-editing application builders this means editable capability keeps moving down
      to the model layer, so application value must sit in industry-specific assets and delivery workflows;
      the model itself is not a standalone product, and integration details and pricing remain unverified.
    inspiration_en: 'Trend: precise editing is being supplied directly by a large model vendor, compressing
      the value of generic retouching interfaces. Entry: avoid building another canvas tool; embed editable
      images into a concrete delivery step, such as batch reworking e-commerce product shots or compliant
      replacement of real-estate listing photos, and charge per output.'
