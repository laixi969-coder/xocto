      - gate: consensus
        status: insufficient
        reason: 代理首选次数来自单一 AEO 研究，且另一项研究显示 Postmark 在多数模型上居首，共识尚不稳定。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: model
        status: insufficient
        reason: 候选未披露定价与付费数据，买方推断为使用邮件 API 的开发团队，属判断而非已验证事实。
        evidence_ids:
        - ev-9b623a318120e7c8
      - gate: truth
        status: insufficient
        reason: 代理写出的接入代码是否被人工复核、投递结果是否稳定，公开材料未说明。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      next_validation: 收集 Resend 官方定价页与客户案例，确认按发送量计费方式及团队实际采用与复购情况。
