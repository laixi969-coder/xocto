        - ev-837bcd2caba0324c
        - ev-e69daa08e655bc6e
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未披露付费路径或商业主体，买方与收费方式不明。
        evidence_ids:
        - ev-837bcd2caba0324c
      - gate: truth
        status: insufficient
        reason: 依赖 Windows Sandbox 与本地系统，交付确定性受宿主环境限制，缺少实测与安全边界材料。
        evidence_ids:
        - ev-837bcd2caba0324c
