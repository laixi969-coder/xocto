      a clean machine by hand; sandbox-mcp uses an MCP server and CLI to automate creating throwaway Windows
      Sandbox environments where the program under test runs. The user ends up with a disposable test
      machine; the exact test orchestration and result collection flow still needs verification.
    inspiration_en: 'Trend: handing environment setup such as ''spin up a clean machine and run it once''
      to an agent is spreading from cloud dev environments to local desktop systems. Entry: start from
      high-frequency small tasks like installer validation and defect reproduction for Windows desktop
      software, targeting independent software vendors and outsourced QA teams, charged per run or per
      environment, though no pricing is disclosed in public materials.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在验证 Windows 应用或脚本时，需要一台干净、可丢弃的 Windows 环境来运行待测程序并观察结果。
