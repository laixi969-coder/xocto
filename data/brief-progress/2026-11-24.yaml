  blender-ai-copilot-bridge:
    slug: blender-ai-copilot-bridge
    name: blender-ai-copilot-bridge
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与游戏美术
    - 建筑与产品可视化
    industries_en:
    - 3D animation and game art
    - Architecture and product visualization
    jobs:
    - 三维美术师在 Blender 中搭建或修改场景时，把建模、材质、灯光等操作交给 AI 客户端执行，并逐项确认结果
    - 技术美术在批量调整场景对象与参数时，通过本地接口让 AI 代理调用受控的场景工具完成改动
    jobs_en:
    - 3D artists building or revising a scene in Blender hand modeling, material and lighting steps to
      an AI client and confirm each result
    - Technical artists batch-adjusting scene objects and parameters let an AI agent call supervised scene
      tools through a local endpoint
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在 Blender 里搭建或修改场景时，原本要手动完成建模、材质、灯光等操作；这个开源桥接把 27 个受监督的场景工具通过本地接口开放给 OpenCode 等兼容客户端，由
      AI 代理调用这些工具改动场景，用户拿到的是被修改的场景，每一步仍需人工确认。具体交付质量与监督机制仍待核验。
    inspiration: 趋势：三维创作工具正被拆成可被 AI 代理调用的受控操作，而不是让模型直接生成成品。切入：从独立游戏美术和建筑可视化的重复场景调整环节进入，卖可审计的批量改动与回滚，而不是卖通用聊天。
    summary_en: When 3D artists build or revise a scene in Blender, they normally do modeling, material
      and lighting work by hand; this open-source bridge exposes 27 supervised scene tools over a local
      endpoint to OpenCode and compatible clients, letting an AI agent call those tools to change the
      scene, with each step still confirmed by a human. Delivery quality and supervision remain to be
      verified.
    inspiration_en: 'Trend: 3D creation tools are being split into supervised operations an AI agent can
      call, rather than having the model output finished assets. Entry: start with repetitive scene adjustments
      in indie game art and architectural visualization, selling auditable batch edits and rollback rather
      than a generic chat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 中搭建或修改场景时，把建模、材质、灯光等重复操作交给 AI 客户端执行，并逐项确认结果。
        job_en: 3D artists building or revising a Blender scene hand repetitive modeling, material and
          lighting steps to an AI client and confirm each result.
        pain_zh: 场景里大量对象与参数需要逐个手动调整，重复且耗时；让模型直接生成又难以控制具体对象。
        pain_en: Many objects and parameters need manual adjustment one by one, which is repetitive and
          slow, while direct model generation gives little control over specific objects.
        current_alternative_zh: 美术师手动在 Blender 界面里逐项操作，或写 Python 脚本批量处理，脚本需要自己维护且难以自然语言驱动。
        current_alternative_en: Artists operate item by item in the Blender UI, or write Python scripts
          for batch work that they must maintain and cannot drive in natural language.
        usage_reason_zh: 相较手动逐项操作或自写脚本，它把场景操作封装成受监督的工具供 AI 客户端调用，减少编写和维护脚本这一步，并保留逐步确认；推断技术美术在批量调整场景时会因此选择它。
        usage_reason_en: Compared with manual item-by-item work or self-written scripts, it wraps scene
          operations as supervised tools an AI client can call, removing the step of writing and maintaining
          scripts while keeping step-by-step confirmation; inference is that technical artists choose
          it for batch scene adjustments.
      gates:
      - gate: value
        status: supported
        reason: 它解决三维场景中重复手动调整对象与参数的需求，痛点具体，交付为被修改的场景且需人工确认。
        evidence_ids:
        - ev-e320ff42d4be9799
        - ev-aef0d2a4108e2ef9
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，缺少用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-0ce85acd31f14052
        - ev-aef0d2a4108e2ef9
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，这是判断而非已验证事实。
        evidence_ids:
        - ev-e320ff42d4be9799
      - gate: truth
        status: insufficient
        reason: 受监督工具能否确定性交付场景改动、出错如何回滚，公开材料未给出可核验结果。
        evidence_ids:
        - ev-e320ff42d4be9799
      next_validation: 收集该仓库的 issue 与 discussion，核验用户对受监督场景工具实际改动结果与回滚机制的反馈。
  blender-ai-copilot-studio:
    slug: blender-ai-copilot-studio
    name: blender-ai-copilot-studio
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 影视与动画制作
    - 游戏开发
    - 建筑与室内可视化
    industries_en:
    - Film and animation production
    - Game development
    - Architecture and interior visualization
    jobs:
    - 三维美术师在接到文字分镜或场景需求时，用自然语言让助手在 Blender 中搭建和调整场景，再人工检查并修正结果
    - 独立动画或游戏团队在原型阶段快速生成可编辑的三维场景草稿，替代逐项手动建模与摆位
    jobs_en:
    - 3D artists describe a scene brief in plain language so the assistant performs Blender scene operations,
      then manually review and fix the result
    - Indie animation or game teams generate editable 3D scene drafts for prototyping instead of manually
      modeling and placing every object
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在接到文字分镜或场景需求时，打开这个 Blender 内的对话工作室，用自然语言描述场景，助手通过内置场景工具执行建模与摆位等操作，最终得到可继续编辑的 Blender
      场景，仍需人工检查修正。具体支持哪些操作、交付质量如何，公开材料仅来自仓库自述，仍待核验。
    inspiration: 趋势是三维创作工具开始被自然语言指令接管，把“描述需求—手动建模”的链路压缩成“描述—生成草稿—人工修”。切入可考虑面向影视预演、游戏原型或建筑可视化的外包团队，按场景草稿或预演片段交付收费，而不是卖插件席位；但需先确认生成结果能否稳定进入正式制作流程。
    summary_en: When 3D artists receive a text brief or storyboard, they open this chat studio inside
      Blender, describe the scene in plain language, and the assistant performs modeling and placement
      operations through built-in scene tools, producing an editable Blender scene that still needs human
      review. Which operations are supported and how reliable the output is remain unverified beyond the
      repository's own description.
    inspiration_en: The trend is that 3D authoring tools are being driven by natural-language instructions,
      compressing the brief-to-manual-modeling chain into describe, generate a draft, then fix by hand.
      An entry point is serving previsualization, game prototyping or architectural visualization teams
      with per-scene or per-previz delivery rather than plugin seats, but first confirm the output reliably
      enters a real production pipeline.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师或小型制作团队在接到文字分镜或场景需求时，需要把描述变成 Blender 中可编辑的场景，再人工检查修正。
        job_en: A 3D artist or small production team receives a text brief or storyboard and must turn
          it into an editable Blender scene, then review and fix it manually.
        pain_zh: 从文字需求到三维场景要逐项手动建模、摆位和调参，重复劳动多、前期草稿耗时长，小团队尤其吃紧。
        pain_en: Turning a text brief into a 3D scene requires manual modeling, placement and parameter
          tuning step by step, with heavy repetitive work and slow early drafts, especially for small
          teams.
        current_alternative_zh: 现在多靠美术师在 Blender 里手工搭建，或用素材库拼装、外包给建模人员，前期草稿阶段反复沟通。
        current_alternative_en: Today artists mostly build by hand in Blender, assemble from asset libraries,
          or outsource modeling, with repeated back-and-forth during the early draft stage.
        usage_reason_zh: 推断：相较纯手工搭建，它让用户用一句话触发场景操作，省去逐项点击建模与摆位的第一步，因此赶原型或预演的三维美术师会在需要快速出可编辑草稿时尝试它；但生成质量与稳定性尚无用户反馈支持。
        usage_reason_en: 'Inference: compared with purely manual building, it lets users trigger scene
          operations with one sentence, skipping the first step of clicking through modeling and placement,
          so 3D artists under prototyping or previz deadlines may try it for fast editable drafts; output
          quality and stability are not yet backed by user feedback.'
      gates:
      - gate: value
        status: supported
        reason: 它解决文字需求到三维场景草稿的转换痛点，旧流程是手工建模摆位，结构上成立，但交付确定性未核验。
        evidence_ids:
        - ev-d761818d3d2735db
        - ev-5049c4702b9df683
      - gate: consensus
        status: insufficient
        reason: 仓库星数从约173升至517，属关注度信号，不能证明三维美术师已持续采用或形成共识。
        evidence_ids:
        - ev-d761818d3d2735db
        - ev-5049c4702b9df683
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或客户案例，谁付钱及如何重复交付尚不清楚，这是判断不是已验证事实。
        evidence_ids:
        - ev-5049c4702b9df683
      - gate: truth
        status: insufficient
        reason: 未见用户反馈或实测，无法确认生成场景能否稳定进入正式制作流程，人工修正成本是否可接受未知。
        evidence_ids:
        - ev-5049c4702b9df683
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对生成场景质量、可编辑性和人工修正成本的公开反馈。
