      - gate: truth
        status: insufficient
        reason: AI 代理读取并指向元素的能力描述来自项目自述，缺少可复现实测与人工确认边界说明。
        evidence_ids:
        - ev-3760e0274be97f02
      next_validation: 收集该仓库的 issue、discussion 或可复现演示，核验 AI 代理读取并指向画布元素的实际效果与人工确认环节。
