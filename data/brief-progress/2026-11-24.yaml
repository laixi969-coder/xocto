  oregon-and-virginia-sue-spacex-over-groks-porn-deepfakes:
    slug: oregon-and-virginia-sue-spacex-over-groks-porn-deepfakes
    name: Grok
    decision: market_context
    summary_zh: 2026年11月23日，俄勒冈州与弗吉尼亚州总检察长分别起诉 SpaceX，指控其未对 Grok 的 AI 生成色情深度伪造内容采取行业标准防护并虚假宣传安全性。这是针对生成式
      AI 内容安全与平台责任的州级监管行动，意味着深度伪造防护不足将带来法律与合规成本，并可能推动 AI 产品在内容审核与安全声明上的投入。
    summary_en: On November 23, 2026, the attorneys general of Oregon and Virginia separately sued SpaceX,
      alleging it failed to apply industry-standard safeguards against Grok's AI-generated sexualized
      deepfakes and falsely promoted safety. This is state-level regulatory action on generative AI content
      safety and platform responsibility, implying legal and compliance costs for inadequate deepfake
      safeguards and likely pushing AI products to invest more in content moderation and safety claims.
    event_summary_zh: 俄勒冈州与弗吉尼亚州总检察长分别对 SpaceX 提起诉讼，指控其忽视 Grok 的 AI 色情深度伪造防护并虚假宣传平台安全性。
    event_summary_en: The attorneys general of Oregon and Virginia filed separate lawsuits against SpaceX,
      accusing it of ignoring safeguards against Grok's AI sexualized deepfakes and falsely promoting
      platform safety.
  pcb-orders-surge-561-why-is-the-ai-industry-chain-still-faci:
