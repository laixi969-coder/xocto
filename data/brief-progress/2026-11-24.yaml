        current_alternative_en: Previously this relied on manual spreadsheet scheduling, rule-of-thumb
          heuristics, or generic spreadsheet and ERP modules, which struggle to find feasible solutions
          in complex cases.
        usage_reason_zh: 相较人工表格排程，求解器把约束一次性建模并自动搜索可行解，减少反复试算与手工调整的步骤，因此计划部门在约束复杂的排产或调度场景下会选择它；这是基于产品能力的推断。
        usage_reason_en: Compared with manual spreadsheet scheduling, a solver models constraints once
          and searches for feasible solutions automatically, cutting repeated trial-and-error and manual
          adjustment, so planning teams choose it in complex scheduling scenarios; this is an inference
          from product capability.
