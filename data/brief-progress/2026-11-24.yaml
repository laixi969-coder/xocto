    name: Crunchbase Current Valuation Model
    decision: market_context
    summary_zh: Crunchbase 于 2026 年 11 月发布 Current Valuation Model，估算未上市独角兽自上一轮融资以来的估值变化，将 1900 余家独角兽合计估值从约
      9 万亿美元上调至约 11 万亿美元，并估算 Thinking Machines Lab 从 120 亿美元升至 400 亿美元、Sierra 从近 160 亿美元升至 315 亿美元。该模型为
      AI 初创公司提供了融资轮次之外的估值参照，可能影响其后续融资定价与投资者对 AI 应用层公司的竞争判断；上述数值为模型估算而非实际交易，属推断。
    summary_en: In November 2026 Crunchbase released its Current Valuation Model, which estimates how
      private unicorn valuations have changed since their last funding rounds, raising the combined value
      of more than 1,900 unicorns from roughly $9 trillion to about $11 trillion and estimating Thinking
      Machines Lab at $40 billion (up from $12 billion) and Sierra at $31.5 billion (up from nearly $16
      billion). The model gives AI startups a valuation reference beyond their last round, which could
      influence future fundraising terms and how investors judge competition among AI application companies;
      these are model estimates rather than actual transactions, and the effect is inferred.
    event_summary_zh: Crunchbase 推出 Current Valuation Model，估算独角兽当前估值，其中 Thinking Machines Lab 由 120 亿美元升至
      400 亿美元，Sierra 由近 160 亿美元升至 315 亿美元。
    event_summary_en: Crunchbase launched its Current Valuation Model, estimating current unicorn values,
      including Thinking Machines Lab rising from $12 billion to $40 billion and Sierra from nearly $16
      billion to $31.5 billion.
