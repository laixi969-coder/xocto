      check on code and configuration for leaked secrets, access control, dependencies, runaway costs,
      unfinished code and Docker/hosting readiness, then outputs a plain-language report. The exact coverage
      and false-positive rate still need verification.
    inspiration_en: 'Trend: AI lets people without coding skills ship deployable apps, making pre-launch
      security and cost review a new bottleneck. Entry: start from the pre-launch check step for solo
      developers and small teams, selling per-report checks or embedding into hosting platforms; today
      there is only an open-source repo, with no pricing or adoption evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 用 AI 生成应用的非专业开发者，在上线前需要检查代码与配置中的密钥泄露、访问控制、依赖、成本失控和托管就绪度，并拿到能看懂的结论。
        job_en: Non-professional builders of AI-generated apps need a pre-launch check of code and configuration
          for leaked secrets, access control, dependencies, runaway costs and hosting readiness, with
          a readable conclusion.
        pain_zh: AI 生成的应用往往缺少安全审查，密钥硬编码、权限过宽、依赖混乱和云成本失控在上线后才暴露，非专业开发者自己也看不懂技术细节。
        pain_en: AI-generated apps often lack security review; hardcoded secrets, over-broad permissions,
          messy dependencies and runaway cloud costs surface only after launch, and non-professional builders
          cannot read the technical details themselves.
        current_alternative_zh: 靠人工逐项自查、请朋友或外包做代码审查，或直接上线后等出事再修；多数人没有系统化的上线前检查清单。
        current_alternative_en: Manual self-checks, asking a friend or outsourcing a code review, or simply
          launching and fixing problems later; most people have no systematic pre-launch checklist.
        usage_reason_zh: 推断：相较人工自查或外包审查，它在部署前一次性扫描密钥、权限、依赖、成本与托管配置并输出通俗报告，把“看不懂技术细节”这一步转成可读结论，因此非专业开发者在上线前会选用它。
        usage_reason_en: 'Inference: compared with manual self-checks or outsourced review, it scans secrets,
