    summary_en: GIS analysts open this assistant to ask about Esri product documentation, tool usage or
      data descriptions and locate the material they need. What the AI receives, what actions it performs
      and whether it delivers documentation answers or operation results are not stated beyond the title;
      the concrete workflow and deliverable remain unverified.
    inspiration_en: 'Trend: professional geospatial software is moving its documentation and operation
      entry points into a conversational assistant, suggesting the retrieval layer of vertical software
      is being rebuilt. Entry: start from onboarding and internal knowledge lookup in surveying and planning
      organisations, sold per seat or per deployment; first confirm it truly replaces manual documentation
      search.'
