  财跃星辰发布finwork-v10-金融智能体开启按岗位交付规模化落地新阶段:
    slug: 财跃星辰发布finwork-v10-金融智能体开启按岗位交付规模化落地新阶段
    name: FinWork
    decision: watching
    event_summary_zh: 财跃星辰于2026年11月21日发布金融智能体FinWork V1.0，宣称以“按岗位交付”的方式推进规模化落地；公开材料未披露具体岗位清单、交付形式、客户与定价。
    event_summary_en: On November 21, 2026, Caiyue Xingchen released FinWork V1.0, a financial agent it
      says is delivered role by role to support scaled deployment; the public material does not disclose
      the specific roles, delivery format, customers or pricing.
