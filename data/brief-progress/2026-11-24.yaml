    summary_zh: 开发者在提交代码或上线前打开它，对 Web 应用、依赖包和 AI 代理配置做漏洞扫描，覆盖 XSS、SQL 注入、泄露密钥和依赖 CVE，最终拿到漏洞清单；扫描结果如何处置、是否需人工复核，材料未说明。
