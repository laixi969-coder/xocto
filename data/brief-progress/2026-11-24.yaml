    - 个人知识管理
    industries_en:
    - Digital reading and publishing
    - Personal knowledge management
    jobs:
    - 微信读书用户在整理书架和回顾年度阅读时，把书架、阅读统计与书籍内容交给插件，生成年度书墙、统计视图和 AI 总结，用于个人复盘与分享
    jobs_en:
    - WeChat Reading users organizing their bookshelf and reviewing a year of reading hand bookshelf data,
      reading statistics and book content to a plugin that produces a yearly book wall, statistics views
      and AI summaries for personal review and sharing
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 微信读书用户整理书架或做年度阅读回顾时，把书架条目、阅读时长等记录交给这个开源插件，由它生成年度书墙、阅读统计，并调用 DeepSeek 对书籍内容做总结；用户拿到可视化的阅读档案和摘要，具体数据来源、总结质量与人工校对环节仍待核验。
    inspiration: 趋势：阅读类平台沉淀了大量个人阅读数据，但官方只给基础统计，第三方插件开始把“年度复盘”这类仪式性需求接走。切入：面向读书社群、知识博主或企业读书会，做按人/按季度的阅读报告与书单摘要，卖报告而非卖工具；需先确认微信读书数据接口的稳定性和授权边界。
    summary_en: When WeChat Reading users tidy their bookshelf or do a yearly reading review, they hand
      bookshelf entries and reading records to this open-source plugin, which builds a yearly book wall
      and statistics views and calls DeepSeek to summarize book content; users get a visualized reading
      archive and summaries, while data sources, summary quality and any manual review step still need
      verification.
    inspiration_en: 'Trend: reading platforms accumulate rich personal reading data but offer only basic
      stats, so third-party plugins are taking over the ritual of the yearly review. Entry: target reading
      communities, knowledge bloggers or corporate book clubs with per-person or per-quarter reading reports
      and book-list summaries, selling the report rather than the tool; first confirm the stability and
      authorization boundaries of WeChat Reading data access.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 微信读书用户在年末或整理书架时，把书架条目、阅读时长和书籍内容交给插件，生成年度书墙、统计视图和 AI 书籍总结，用于个人复盘和社交分享。
        job_en: At year-end or while tidying their shelf, WeChat Reading users hand bookshelf entries,
          reading time and book content to the plugin to produce a yearly book wall, statistics views
          and AI book summaries for personal review and social sharing.
        pain_zh: 平台自带的统计维度有限，用户想回顾一年读了什么、每本书讲了什么，只能自己截图、手抄书单或另开笔记整理，费时且难成体系。
        pain_en: The platform's built-in statistics are limited; to review a year of reading and recall
          what each book covered, users must screenshot, hand-copy book lists or rebuild notes elsewhere,
          which is slow and fragmented.
        current_alternative_zh: 手动截图书架、在笔记软件里抄书单、用通用聊天助手逐本总结，或干脆不做年度回顾。
        current_alternative_en: Manually screenshotting the shelf, copying book lists into note apps,
          summarizing each book with a general chatbot, or simply skipping the yearly review.
        usage_reason_zh: 推断：插件把书架与阅读记录一次性拉取并自动排版成书墙和统计，省去逐条截图与手抄这一步；AI 总结让用户不必逐本重读即可回顾内容，因此重视年度复盘和分享的读书用户会在年末选择它。
        usage_reason_en: 'Inference: the plugin pulls shelf and reading records in one pass and auto-lays
          them out as a book wall and statistics, removing the step of screenshotting and hand-copying
          each entry; AI summaries let users recall content without rereading each book, so users who
          value yearly review and sharing would pick it at year-end.'
      gates:
      - gate: value
        status: supported
        reason: 它解决读书用户年度复盘和书籍回顾的需求，痛点是平台统计有限、手动整理费时；交付为书墙、统计与摘要，结构上成立，属工作流推理。
        evidence_ids:
        - ev-e6950eeb13b96919
        - ev-9693f5e4bd279b2b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 70 缓慢增至 103，属关注度而非持续采用；没有用户评价或使用频次证据说明它被留在阅读流程里。
        evidence_ids:
        - ev-e6950eeb13b96919
        - ev-62ca6d73ac95e40a
      - gate: model
        status: insufficient
        reason: 开源插件无公开定价与付费路径，买方可能是个人用户或读书社群，但公开材料未披露任何收费方式，这是判断不是已验证事实。
        evidence_ids:
        - ev-9693f5e4bd279b2b
      - gate: truth
        status: insufficient
        reason: 依赖第三方阅读平台的数据接口，接口稳定性与授权边界未在材料中说明；AI 总结质量与是否需要人工校对也缺少可核验信息。
        evidence_ids:
        - ev-e6950eeb13b96919
      next_validation: 收集该仓库 README 与 issue/discussion 中关于微信读书数据获取方式、接口稳定性及用户实际使用反馈的公开记录。
