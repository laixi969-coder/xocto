    - 直播主播或录制教程的创作者在 OBS 中叠加桌面画面时，需要一个随打字动作变化的透明宠物图层，并避免输入密码时被拍到
    jobs_en:
    - Live streamers or tutorial creators overlaying their desktop in OBS need a transparent pet layer
      that reacts to typing and hides passwords from capture
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 直播主播或录制教程的创作者在 OBS 里叠加桌面画面时打开 kurocat，它提供随打字动作变化的透明置顶猫咪图层，并在输入密码时遮挡画面。项目还提到 AI 捏猫与 MCP，但具体由模型接收什么、生成什么交付仍待核验。
    inspiration: 趋势：桌面陪伴类小工具开始与直播叠加、AI 生成形象结合，把情绪价值做成可展示的画面元素。切入：可从 VTuber、教学录屏和编程直播人群进入，卖定制形象或订阅式素材包；但需先确认
      AI 生成部分是否真的可用，而非仅作宣传。
    summary_en: Live streamers or tutorial creators open kurocat while overlaying their desktop in OBS;
      it provides a transparent always-on-top cat layer that reacts to typing and masks the screen when
      a password is entered. The project also mentions AI cat generation and MCP, but what the model receives
      and what it delivers still need verification.
    inspiration_en: 'Trend: small desktop-companion tools are merging with live-stream overlays and AI-generated
      characters, turning emotional value into a visible on-screen element. Entry: target VTubers, tutorial
      screen-recorders and coding streamers, selling custom characters or subscription asset packs; first
      confirm the AI generation part actually works rather than being promotional.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 直播主播或录屏创作者在 OBS 中叠加桌面时，需要让画面有随打字变化的宠物元素，同时避免输入密码等敏感内容被直播出去。
        job_en: Streamers or screen-recording creators overlaying their desktop in OBS need a pet element
          that reacts to typing while keeping sensitive input such as passwords out of the broadcast.
        pain_zh: 现有桌面宠物与直播叠加工具要么不支持透明源，要么无法在输入密码时遮挡，创作者需自行处理隐私风险。
        pain_en: Existing desktop-pet and overlay tools either lack transparent sources or cannot mask
          the screen during password entry, leaving creators to handle privacy risk themselves.
        current_alternative_zh: 创作者目前使用 Bongo Cat 等桌面宠物、OBS 自带图层或手动切换场景来规避敏感画面。
        current_alternative_en: Creators currently use desktop pets such as Bongo Cat, built-in OBS layers,
          or manually switch scenes to avoid sensitive screens.
        usage_reason_zh: 推断：相较手动切换场景或另找遮挡方案，kurocat 把随打字变化的宠物图层与输密码遮挡放在同一透明源里，减少直播中临时操作；面向需要展示桌面又担心隐私的直播与录屏人群。
        usage_reason_en: 'Inference: compared with manually switching scenes or finding a separate mask,
          kurocat puts the typing-reactive pet layer and password masking in one transparent source, reducing
          live adjustments; aimed at streamers and screen recorders who show their desktop but worry about
          privacy.'
      gates:
      - gate: value
        status: supported
        reason: 它解决直播叠加桌面时既要有互动宠物元素、又要遮挡密码的痛点，旧做法是手动切场景，结构上成立。
        evidence_ids:
        - ev-361ae82c937a7a4a
      - gate: consensus
        status: insufficient
        reason: 415 星与 68 次 fork 只说明关注度，未见用户评价或持续使用证据，不能证明已进入日常工作流。
        evidence_ids:
