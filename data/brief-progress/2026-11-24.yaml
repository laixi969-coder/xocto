  guizang-game-skill:
    slug: guizang-game-skill
    name: 歸藏 Game Skill
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 电子游戏
    - 互动娱乐
    industries_en:
    - Video Games
    - Interactive Entertainment
    jobs:
    - 独立游戏原型开发者或小型工作室在立项早期，用 Claude Code 或 Codex 处理玩法设想与美术素材，要产出一个可在浏览器直接试玩的 3D 动作游戏原型
    jobs_en:
    - Indie game prototypers or small studios in early concept stage use Claude Code or Codex to turn
      gameplay ideas and art assets into a playable browser 3D action game prototype
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 独立游戏原型开发者或小型工作室在立项早期打开它，把玩法设想交给 Claude Code 或 Codex，由该技能生成 three.js 单文件网页游戏与 AI 生成的美术素材，最终拿到一个可在浏览器直接试玩的
      3D 动作游戏原型，附有演示《雾锁山门》；具体生成流程与人工确认环节仍待核验。
    inspiration: 趋势：把“做可玩原型”从写引擎代码压缩成一次代理调用，说明游戏早期验证环节正在被拆开重做。切入：面向独立游戏团队或游戏化营销需求方，按可玩原型或关卡交付收费，而非卖工具；壁垒在关卡设计与美术风格库，不在模型本身。
    summary_en: Indie game prototypers or small studios open it early in concept stage, hand gameplay
      ideas to Claude Code or Codex, and the skill generates a single-file three.js browser game with
      AI-generated art assets, yielding a playable 3D action game prototype; a demo titled Wusuo Shanmen
      is included, while the exact generation flow and human review steps remain unverified.
    inspiration_en: 'Trend: turning ''make a playable prototype'' from engine coding into a single agent
      call shows early game validation being rebuilt. Entry: target indie studios or gamified-marketing
      buyers, charging per playable prototype or level rather than selling a tool; the moat is level design
      and art style libraries, not the model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立游戏原型开发者或小型工作室在立项早期，用 Claude Code 或 Codex 处理玩法设想与美术素材，要产出一个可在浏览器直接试玩的 3D 动作游戏原型。
        job_en: Indie game prototypers or small studios in early concept stage use Claude Code or Codex
          to turn gameplay ideas and art assets into a playable browser 3D action game prototype.
        pain_zh: 过去做可玩原型要写引擎代码、搭场景、找美术，周期长且依赖多人协作，想法验证成本高。
        pain_en: Building a playable prototype used to require engine code, scene setup and art sourcing,
          taking long cycles and multiple collaborators, making idea validation costly.
        current_alternative_zh: 手工用 Unity 或 three.js 写原型，或外包给小型开发团队，或只停留在文档与概念图。
        current_alternative_en: Hand-coding prototypes in Unity or three.js, outsourcing to small dev
          teams, or stopping at documents and concept art.
        usage_reason_zh: 相较手工搭原型，该技能让代理一次性生成单文件网页游戏与素材，省去引擎配置与素材搜集环节，因此独立开发者或小团队在需要快速验证玩法时可能选择它；这是基于产品能力的推断，尚无用户反馈支持。
        usage_reason_en: Compared with hand-building prototypes, the skill lets an agent generate a single-file
          browser game and assets in one pass, skipping engine setup and asset sourcing, so indie developers
          or small teams may pick it when validating gameplay fast; this is an inference from product
          capability, not supported by user feedback yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决游戏立项早期做可玩原型成本高的问题，把引擎编码与素材搜集压缩为一次代理生成，痛点具体且交付可试玩。
        evidence_ids:
        - ev-b83ec043bf9fdc69
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度证据，缺少用户反馈或案例说明开发者是否真的用它替代旧原型流程。
        evidence_ids:
        - ev-b83ec043bf9fdc69
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，买方可能是独立开发者或工作室，但钱从哪来尚不明确，这是判断不是已验证事实。
        evidence_ids:
        - ev-b83ec043bf9fdc69
      - gate: truth
        status: insufficient
        reason: 演示可玩说明交付存在，但生成质量、可复用性与人工修正成本缺少公开材料，确定性交付尚未核验。
        evidence_ids:
        - ev-b83ec043bf9fdc69
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者实际使用中报告的原型生成质量与人工修正环节。
  home-mate:
    slug: home-mate
    name: Home Mate
    decision: watching
    category: AI + 生活
    project_type: open_source
    industries:
    - 智能家居
    - 消费电子
    industries_en:
    - smart home
    - consumer electronics
    jobs:
    - 家庭用户在客厅或多房间场景用智能音箱控制家电、播放内容时，需要把语音请求分发到正确的房间设备并执行
    - 家庭用户在小米 LX06 或 Echo Dot 2 上想用本地语音助手替代云端语音服务时，需要自行部署并维护运行环境
    jobs_en:
    - Home users controlling appliances or playing content by voice in a living room or multi-room setting
      need requests routed to the right room device and executed
    - Home users wanting a local voice assistant on Xiaomi LX06 or Echo Dot 2 instead of cloud voice services
      need to deploy and maintain the runtime themselves
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 家庭用户在客厅或多房间用智能音箱下语音指令时，Home Mate 接收语音请求，由多房间声学仲裁决定哪台设备响应，再在本地运行语音助手，并通过 Vue 3 控制台查看和管理。最终交付是设备执行动作与本地控制界面；具体识别准确率、支持的指令范围和部署门槛仍待核验。
    inspiration: 趋势：智能音箱的语音入口正被本地化、可自托管的运行时重新拆开，用户开始在意语音数据不出户。切入：从在意隐私、已有多台旧音箱的家庭或智能家居爱好者入手，卖部署与调优服务而非硬件；但多房间仲裁的实际体验和旧设备兼容性是成败关键，需先验证。
    summary_en: When household users give voice commands to smart speakers in a living room or across
      rooms, Home Mate receives the request, uses multi-room acoustic arbitration to decide which device
      responds, runs the voice assistant locally, and exposes a Vue 3 console for viewing and management.
      The deliverable is device actions plus a local control interface; recognition accuracy, supported
      command scope and deployment difficulty remain to be verified.
    inspiration_en: 'Trend: the smart-speaker voice entry point is being re-opened by local, self-hostable
      runtimes as users care about voice data staying at home. Entry: start with privacy-minded households
      or smart-home hobbyists who already own several old speakers, selling deployment and tuning rather
      than hardware; multi-room arbitration quality and legacy-device compatibility are the make-or-break
      points and need validation first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 家庭用户在客厅或多房间用智能音箱控制家电、播放内容时，需要语音请求被正确路由到对应房间设备并执行。
        job_en: Household users controlling appliances or playing content by voice across rooms need requests
          routed to the correct room device and executed.
        pain_zh: 云端语音助手存在隐私顾虑，多台音箱同时响应会造成混乱，旧设备官方支持可能减弱。
        pain_en: Cloud voice assistants raise privacy concerns, multiple speakers responding at once causes
          confusion, and official support for older devices may weaken.
