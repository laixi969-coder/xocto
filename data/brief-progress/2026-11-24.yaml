    summary_zh: 独立开发者或小团队把任务清单交给 AI 编码代理，代理按任务完成代码修改、评审并推进到合并，只在需要人判断的节点叫停询问。用户最终拿到已合并的代码变更，关键决策仍由人确认。具体评审规则与交付边界仍待核验。
    inspiration: 趋势：编码代理正从“补全一行代码”走向“接管整条任务流水线”，人的角色收缩到决策点。切入：可从有明确验收标准、任务颗粒度小的外包交付或内部维护型团队进入，按完成并合并的任务计费，而非按席位卖工具；但需先证明代理产出的合并质量可稳定复现。
    summary_en: A solo developer or small team feeds a task ledger to AI coding agents that make code
      changes, review them and push toward merge, pausing to ask the human only at decision points. The
      user ends up with merged code changes while key decisions stay human-confirmed. Review rules and
      delivery boundaries still need verification.
    inspiration_en: 'Trend: coding agents are moving from completing a line to owning a whole task pipeline,
      shrinking the human to decision points. Entry: target outsourcing delivery or internal maintenance
      teams with small, clearly verifiable tasks and charge per completed-and-merged task rather than
      per seat; first prove merged output quality is repeatable.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队把待办任务交给 AI 编码代理，由代理完成修改、评审并合并，人只在关键决策点介入。
        job_en: A solo developer or small team hands backlog tasks to AI coding agents that make changes,
          review and merge, with the human stepping in only at key decisions.
        pain_zh: 小团队人力有限，逐条写代码、评审、合并占用大量时间，任务积压；不解决则交付变慢、维护欠账累积。
        pain_en: Small teams have limited hands; writing, reviewing and merging each task eats time and
          backlogs grow; unresolved, delivery slows and maintenance debt accumulates.
        current_alternative_zh: 人工逐条开发与评审，或用单点代码补全工具后仍由人串联评审与合并流程。
        current_alternative_en: Manual task-by-task development and review, or single-point code completion
          tools with humans still stitching review and merge together.
        usage_reason_zh: 推断：相较人工串联每一步，它把任务从清单到合并的流转交给代理自动推进，只在决策点叫人，减少逐条跟进与评审排队的负担；适合任务颗粒小、验收标准清晰的团队。
        usage_reason_en: 'Inference: versus humans chaining each step, it lets agents drive tasks from
          ledger to merge and calls people only at decisions, cutting per-task follow-up and review queueing;
          suits teams with small tasks and clear acceptance criteria.'
      gates:
      - gate: value
        status: supported
        reason: 它解决小团队逐条开发评审合并耗时、任务积压的问题，旧流程与不解决的后果可还原，属工作流推理。
        evidence_ids:
        - ev-ac9355373b5182a3
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度增长，缺少用户评价或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-ba2b726c284fdc50
        - ev-ac9355373b5182a3
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方或收费路径，买方与变现方式未核验。
        evidence_ids:
        - ev-ac9355373b5182a3
      - gate: truth
        status: insufficient
        reason: 代理产出的合并质量、评审可靠性与人工边界尚无公开实测或案例支撑。
        evidence_ids:
        - ev-ac9355373b5182a3
      next_validation: 收集仓库 issue/discussion 或文档中关于代理合并质量、评审规则与人工介入边界的公开记录。
