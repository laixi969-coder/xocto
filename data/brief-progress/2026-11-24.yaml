    regions: []
    regions_en: []
    open_source: true
    summary_zh: 自学者或培训者在开始一门新学科时，把主题交给这个 Windows 应用，它借助使用者自己的 Claude Code 生成完整课程、学习排期与批改，用户拿到可执行的课程计划和评分结果；具体输入格式、批改质量与人工确认环节仍待核验。
    inspiration: 趋势：个人学习正从“找现成课程”转向“按自己目标现造课程并自动批改”。切入：面向考证、转岗自学这类有明确截止日的人群，卖按课程或按批改次数计费的结果，而不是卖工具席位；开源版先验证排期与批改是否真被坚持使用。
