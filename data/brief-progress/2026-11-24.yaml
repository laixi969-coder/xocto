        current_alternative_zh: 用单个编码助手逐条对话推进，或人工把任务分给多名开发者并靠项目管理工具跟踪。
        current_alternative_en: Advancing one task at a time in a single coding assistant, or manually
          assigning tasks to several developers and tracking them in project tools.
        usage_reason_zh: 相较逐条对话，Missions 让用户先设预算再派发多支代理团队，把任务拆分与成本上限放在同一处控制，减少逐个跟进与切换的负担；这是基于产品描述的工作流推断，尚无用户反馈佐证。
        usage_reason_en: Compared with one-by-one chat, Missions lets users set a budget before dispatching
          agent teams, putting task splitting and cost ceilings in one place and cutting per-task follow-up
          and switching; this is workflow inference from the product description, not user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决并行编码任务的拆分、跟进与预算控制问题，痛点具体且不解决的代价是可核对的交付延迟；买方与付费路径尚未披露。
        evidence_ids:
        - ev-47d92893f2915ebe
      - gate: consensus
        status: insufficient
        reason: 仅有产品发布描述，没有用户评价、采用规模或团队实际使用的公开信号。
        evidence_ids:
        - ev-47d92893f2915ebe
      - gate: model
        status: insufficient
        reason: 未披露定价与计费方式，无法判断按预算额度还是按席位收费，买方归属只能推断为开发团队。
        evidence_ids:
        - ev-47d92893f2915ebe
      - gate: truth
        status: insufficient
        reason: 多代理并行产出的代码质量、人工审核边界与安全责任尚无材料说明，交付确定性未核验。
        evidence_ids:
        - ev-47d92893f2915ebe
      next_validation: 收集 Replit Missions 官方文档或定价页，确认预算计费方式、代理团队交付形态与人工审核环节。
