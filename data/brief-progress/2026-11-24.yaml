        status: insufficient
        reason: 未进入：未披露定价、买方或收费方式；Esri 为既有商业软件厂商，付费路径存在但无材料支持。
        evidence_ids:
        - ev-aa6c07459ee7b9a6
      - gate: truth
        status: insufficient
        reason: 未进入：无法判断答案是否可核对、是否需人工确认，安全与人工边界不明。
        evidence_ids:
        - ev-aa6c07459ee7b9a6
      next_validation: 收集 Esri 官方 AI Assistant（Beta）产品页或发布博客全文，确认其输入、输出与可用范围。
