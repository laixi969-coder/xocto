    summary_zh: 个人用户在日常处理分散在多个应用与设备里的日程、消息和待办时打开它，助手读取这些连接来源并生成主动提示卡片，用户据此决定下一步动作。具体接入哪些应用、卡片如何触发、记忆如何存储与纠错，公开材料尚未说明，交付流程仍待核验。
