    summary_zh: 在电脑上同时跑 Codex、Claude Code、DeepSeek 等代理命令行的用户，可以在桌面和手机即时通讯界面里并排查看多个会话、在手机上恢复命令行会话，并把目标拆成任务交给多个机器人互相传递。最终交付是会话进度与任务流转，具体流程和交付仍待核验。
