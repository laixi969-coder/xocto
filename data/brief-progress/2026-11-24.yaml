    summary_zh: 2026年11月24日报道显示，AI 产业链 PCB 订单增长 56.1%，但电路板供应仍短缺。这反映 AI 硬件需求扩张正造成上游元器件供给紧张，可能推高 AI 服务器与算力基础设施的交付周期和成本。
    summary_en: A November 24, 2026 report shows PCB orders in the AI supply chain grew 56.1% while circuit
      board supply remains short. This indicates expanding AI hardware demand is tightening upstream component
      supply, potentially raising lead times and costs for AI servers and compute infrastructure.
    event_summary_zh: 报道称 AI 产业链 PCB 订单增长 56.1%，同时电路板仍面临短缺。
    event_summary_en: Reports indicate PCB orders in the AI supply chain grew 56.1% while circuit boards
      remain in shortage.
