      on the phone, the local model calls bash, file and MCP tools plus subagents, and runs inside an
      offline Alpine/Proot runtime. The user gets script results or file changes; delivery boundaries
      and human confirmation steps still need verification.'
    inspiration_en: The trend is moving the agent runtime from the cloud onto a personal device, with
      model and toolchain closing the loop locally. A wedge could target offline, privacy-sensitive field
      work, e.g. a field engineer handling local files and scripts without network; pricing is undisclosed,
      so local-model usability and stability on phones must be confirmed first.
