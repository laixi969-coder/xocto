          to patch or block the release.
        pain_zh: PHP 旧站长期由小团队维护，注入类漏洞往往在上线后才被发现，人工代码审计慢且依赖少数有经验的人，漏掉一次就可能造成服务器被控。
        pain_en: Legacy PHP sites are maintained by small teams, injection flaws are often found only
          after release, manual code audit is slow and depends on a few experienced people, and one miss
          can mean a compromised server.
        current_alternative_zh: 目前多靠人工代码审计、通用静态扫描工具或上线后由安全事件倒逼排查，缺少针对 PHP 注入到命令执行这条链路的快速检查。
