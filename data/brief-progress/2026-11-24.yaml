    jobs_en:
    - YouTube creators turning a script into storyboard, captured footage and a finished cut use this
      workflow to process the script and footage and produce a first-cut edit
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向 YouTube 创作者的开源剪辑工作流：创作者在写完脚本、准备录制时打开它，把脚本与素材交给流程，由 AI 生成分镜、组织拍摄素材并推进动画与剪辑，最终得到一版可继续人工修改的成片初稿；具体输入格式与交付形态仍待核验。
    inspiration: 趋势是视频生产从“人剪”转向“脚本直接驱动分镜与初剪”，把最耗时的结构搭建前置给模型。切入可放在中小创作者与知识类频道：按成片条数或分钟数交付初剪，而不是卖编辑器席位；但需先确认它是否真能稳定产出可用的分镜与剪辑结果。
    summary_en: 'An open-source editing workflow for YouTube creators: after writing a script and before
      recording, the creator feeds the script and footage into the pipeline, where AI builds a storyboard,
      organizes captured material and drives animation and cutting to produce a first-cut draft for human
      revision; exact input formats and deliverables still need verification.'
    inspiration_en: 'The trend is video production shifting from hand-editing to scripts directly driving
      storyboards and rough cuts, pushing the most tedious structural work onto models. The opening is
      small and mid-size creators and knowledge channels: sell finished rough cuts per video or per minute
      rather than editor seats, but first confirm it reliably produces usable storyboards and cuts.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: YouTube 创作者在脚本定稿后，需要把文字转成分镜、安排拍摄素材并剪出成片初稿，再交给人工精修。
        job_en: After finalizing a script, a YouTube creator must turn text into a storyboard, arrange
          footage and cut a first draft before human polishing.
        pain_zh: 分镜与初剪高度依赖手工，反复搭结构、找素材、对齐节奏耗时长，且创作者往往不是专业剪辑师。
        pain_en: Storyboarding and rough cutting are heavily manual; rebuilding structure, finding footage
          and matching pacing is slow, and creators are often not professional editors.
        current_alternative_zh: 用通用剪辑软件手工分镜与剪辑，或把脚本交给外包剪辑师，靠模板和反复沟通推进。
        current_alternative_en: Hand storyboarding and editing in general editing software, or handing
          scripts to freelance editors, relying on templates and repeated back-and-forth.
        usage_reason_zh: 推断：相较手工分镜再剪，它把脚本直接转成分镜与初剪，减少从零搭结构这一步，让不擅长剪辑的创作者在脚本完成后就能拿到可修改的初稿；但仓库无说明与案例，实际交付质量未核验。
        usage_reason_en: 'Inference: versus hand storyboarding then editing, it converts the script directly
          into storyboard and rough cut, removing the from-scratch structuring step so non-editor creators
          get a revisable draft right after scripting; with no docs or cases, actual output quality is
          unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决脚本到分镜与初剪的手工搭建问题，痛点具体且创作者常缺剪辑能力；交付能否稳定仍待核验。
        evidence_ids:
        - ev-9af8863b18aa0d8a
        - ev-809ba42d36cf9f82
      - gate: consensus
        status: insufficient
        reason: 仅有星标增长，无 fork、issue 或用户反馈，无法判断是否被真实创作者采用。
        evidence_ids:
        - ev-5dec608492999d67
        - ev-809ba42d36cf9f82
      - gate: model
        status: insufficient
        reason: 未见定价、付费路径或客户案例，买方与收费方式不明，属判断而非已验证事实。
        evidence_ids:
        - ev-809ba42d36cf9f82
      - gate: truth
        status: insufficient
        reason: 缺少说明文档与可复现产出，无法确认分镜与剪辑结果是否贴近创作者第一性目标。
        evidence_ids:
        - ev-9af8863b18aa0d8a
      next_validation: 收集该仓库的 README 与发布说明，确认输入格式、输出交付物及是否有可复现的示例成片。
