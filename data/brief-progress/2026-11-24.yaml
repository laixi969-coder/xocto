  auto-ontology-mcp:
    slug: auto-ontology-mcp
    name: auto-ontology-mcp
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 开发者把个人知识库接入 Claude、ChatGPT 等 MCP 客户端，让助手在回答时检索自己的语义层与笔记
    - 开发者在本地搭建知识检索服务，避免为每次查询配置 LLM API 密钥
    jobs_en:
    - Developers connect a personal knowledge base to MCP clients such as Claude and ChatGPT so the assistant
      retrieves their own semantic layer and notes when answering
    - Developers run a local knowledge-retrieval service without configuring an LLM API key for each query
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者把 NVIDIA Auto Ontology 的语义层和个人知识库封装成 MCP 服务，接入 Claude、ChatGPT 等支持 MCP 的客户端；助手在回答时调用该服务检索自己的笔记与语义结构，无需另配
      LLM API 密钥。用户最终拿到的是助手基于自有知识库给出的回答，具体检索范围、更新方式和交付质量仍待核验。
    inspiration: 趋势：个人知识库正从独立笔记应用变成可被多个助手调用的检索层，谁掌握结构化语义谁就掌握上下文入口。切入：面向律师、咨询顾问、研究员这类笔记量大且反复检索的群体，做“把已有笔记整理成可被助手调用的语义层”的托管服务，按知识库规模或检索次数收费；开源版已证明有人愿意接入，但托管与行业模板仍是空位。
    summary_en: Developers wrap NVIDIA Auto Ontology's semantic layer and a personal knowledge base as
      an MCP server that Claude, ChatGPT and other MCP clients can call; the assistant queries that service
      to retrieve the user's notes and semantic structure without a separate LLM API key. The user gets
      answers grounded in their own knowledge base; retrieval scope, update flow and delivery quality
      still need verification.
    inspiration_en: 'Trend: personal knowledge bases are shifting from standalone note apps into a retrieval
      layer that multiple assistants call, so whoever owns the structured semantics owns the context entry
      point. Wedge: for lawyers, consultants and researchers with large, repeatedly searched notes, offer
      a hosted service that turns existing notes into an assistant-callable semantic layer, priced by
      knowledge-base size or query volume; the open-source version shows willingness to connect, while
      hosting and industry templates remain open.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或知识工作者在让 Claude、ChatGPT 等助手回答自己领域问题时，需要把个人笔记和语义结构接入助手，让回答基于自有材料而非通用训练数据。
        job_en: Developers or knowledge workers who want Claude, ChatGPT and similar assistants to answer
          domain questions need to connect their personal notes and semantic structure so answers rest
          on their own material rather than generic training data.
        pain_zh: 个人知识散落在笔记和文档里，助手默认读不到；每次手动粘贴上下文既慢又容易漏，且要额外配置模型密钥。
        pain_en: Personal knowledge is scattered across notes and documents that assistants cannot read
          by default; pasting context manually each time is slow, error-prone and requires extra model
          keys.
        current_alternative_zh: 手动复制粘贴笔记进对话、用通用检索插件，或自建向量库脚本接入助手。
        current_alternative_en: Manually copying notes into the chat, using generic retrieval plugins,
          or building a custom vector-store script to connect to the assistant.
        usage_reason_zh: 推断：它把语义层和知识库封装成标准 MCP 服务，用户只需在客户端配置一次地址即可让助手检索自有材料，省去每次粘贴上下文和单独配置模型密钥的步骤；需要让助手稳定引用个人知识库的开发者会因此选择它。
        usage_reason_en: 'Inference: it packages the semantic layer and knowledge base as a standard MCP
          service, so users configure an address once in the client and the assistant retrieves their
          own material, removing repeated context pasting and separate model-key setup; developers who
          need assistants to reliably cite a personal knowledge base would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决助手读不到个人知识库、每次手动粘贴上下文的问题，痛点具体且替代动作明确；但检索准确度和交付质量尚无公开证据。
        evidence_ids:
        - ev-2568af1bdcf47fd8
        - ev-6cc9885a32494d7b
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 503 增至 541，说明有开发者关注，但没有 issue、讨论或使用反馈证明它进入日常工作流。
        evidence_ids:
        - ev-2568af1bdcf47fd8
        - ev-6cc9885a32494d7b
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明托管服务、企业版或任何付费路径，买方与收费方式均未披露。
        evidence_ids:
        - ev-6cc9885a32494d7b
      - gate: truth
        status: insufficient
        reason: 未读到检索准确率、知识库更新机制与安全边界说明，能否确定性交付自有知识检索仍待核验。
        evidence_ids:
        - ev-2568af1bdcf47fd8
      next_validation: 收集该仓库的 issue、discussion 或 README 中的部署与检索准确度说明，确认它是否被实际用于日常知识检索。
