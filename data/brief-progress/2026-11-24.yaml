    open_source: true
    summary_zh: 面向需要旁白的视频或课程制作者：他们原本要自己录音或找配音，现在把录音与脚本交给基于开源声音克隆的流程，由 AI 生成自然口语旁白并混音成成品；具体输入格式、人工校对环节与交付形态仍待核验。
