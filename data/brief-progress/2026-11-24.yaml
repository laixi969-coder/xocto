      to context and quota consumption, spawning ''token-saving'' middleware around single IDEs. Entry:
      target team developers paying by quota, starting from long sessions and large-repo context, possibly
      charging by saved quota or seat; but the plugin is tied to one platform and would be erased if the
      platform builds in compression, so first confirm whether the compression is reusable across tools.'
