          time went and whether changes to instructions or skills actually improved results, then adjust
          the agent's instructions and tooling.
        pain_zh: 编程助手一次执行很多步骤，开发者很难判断时间耗在哪个环节、改过的指令或技能是否真的让结果变好，只能凭印象调整，容易反复试错。
        pain_en: A coding agent runs many steps at once, so developers struggle to tell which stage consumed
          time and whether edited instructions or skills actually improved outcomes; they adjust by impression
          and retry repeatedly.
        current_alternative_zh: 开发者目前靠人工翻看会话记录、凭记忆对比改动前后效果，或干脆不记录，直接凭感觉重写提示词与技能。
        current_alternative_en: Developers currently scroll through session logs by hand, compare before/after
          by memory, or skip recording entirely and rewrite prompts and skills on feel.
        usage_reason_zh: 推断：相较人工翻日志，它在本地自动记录时间去向，并把复盘结论写回助手指令与技能，省掉手动整理对比这一步，让改动是否有效有数据可查；因此重度使用编程助手、需要反复调优配置的开发者会在调参前后选择它。
        usage_reason_en: 'Inference: unlike manually reading logs, it automatically records time allocation
          locally and writes review conclusions back into the agent''s instructions and skills, removing
          the manual comparison step and making change effectiveness checkable with data; developers who
          lean heavily on coding agents and repeatedly tune configurations would choose it around such
          tuning.'
        usage_reason_en_note: ''
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者无法判断编程助手时间去向与改动是否有效的问题，痛点具体，旧做法是人工翻日志和凭感觉调参。
