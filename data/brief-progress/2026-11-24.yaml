        usage_reason_en: 'Inference: versus manual reruns and line-by-line review, pstack automatically
          puts the AI''s change through a self-check after delivery, moving the ''is it really fixed''
          step off the developer; this appeals to those who edit code with AI often and fear bad merges,
          though real verification quality is not publicly evidenced.'
      gates:
      - gate: value
