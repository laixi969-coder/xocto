      each edit into a supervised tool call: proposed, approved by the user, executed in sequence, cancellable
      after the current step and undoable by name. The user gets stepwise-confirmable, reversible edits;
      the exact delivery form and human-confirmation boundary still need verification.'
    inspiration_en: 'Trend: AI in 3D creation is moving from one-click generation toward controlled actions
      that are approvable and undoable, reducing the risk of damaging assets. Entry: start from the asset-editing
      step of independent 3D artists and small animation studios, charging per reversible edit step or
      project delivery; pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 中调整场景或模型时，让 AI 逐步提出并执行建模与场景编辑操作，再按步骤确认、取消或撤销，完成可回退的修改。
        job_en: 3D artists working in Blender let an AI propose and execute modeling and scene-edit operations
          step by step, approving, cancelling or undoing each step to complete reversible changes.
        pain_zh: AI 直接改动三维资产容易误改且难回退，美术师需要逐项确认每一步操作，避免破坏已有模型与场景。
        pain_en: AI directly modifying 3D assets can cause mistaken edits that are hard to reverse; artists
          need to confirm each operation to avoid damaging existing models and scenes.
        current_alternative_zh: 目前美术师多在 Blender 内手工建模与调整，或使用生成式工具后手动清理结果，缺少可逐步审批与撤销的 AI 编辑流程。
        current_alternative_en: Artists currently model and adjust manually inside Blender, or clean up
          generative-tool output by hand, lacking a stepwise approvable and undoable AI editing flow.
        usage_reason_zh: 相较手工修改或事后清理生成结果，它把每次 AI 编辑拆成先提出、经批准再执行的工具调用，并支持按名称撤销，减少误改后返工这一步负担；推断关注可回退编辑的美术师会在处理已有资产时选择它。
        usage_reason_en: Compared with manual edits or post-hoc cleanup of generated output, it splits
          each AI edit into a proposed, approved, then executed tool call with undo-by-name, reducing
          the rework burden after mistaken edits; by inference, artists who value reversible editing would
