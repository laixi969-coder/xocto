        pain_zh: 自学时缺少现成课程结构、进度安排和反馈，容易半途放弃；找现成课程又未必贴合自己的目标和材料。
        pain_en: Self-study lacks course structure, pacing and feedback, so learners drop off; existing
          courses may not fit their own goals and materials.
        current_alternative_zh: 自己搜教程、拼凑视频和笔记，或报名通用网课，进度与批改靠自律或人工。
        current_alternative_en: Searching tutorials, piecing together videos and notes, or enrolling in
          generic online courses, with pacing and grading left to self-discipline or people.
        usage_reason_zh: 推断：相较自己拼资料，它把“定大纲—排进度—出题—批改”几步一次性生成，用户少做规划与找题，因此有明确截止日的自学者会尝试；是否被长期坚持使用尚无公开证据。
        usage_reason_en: 'Inference: versus assembling materials oneself, it generates outline, schedule,
