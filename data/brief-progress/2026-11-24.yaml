    inspiration: 趋势：营销工作正从“人写提示词”转向“把行业方法固化成可复用技能包”，本地商家这类预算小、需求碎的群体是明显切口。切入：从本地服务商家的开店、上新、投放节点切入，卖按门店或按次交付的营销包，而非通用工具订阅；价格未披露，不预设。
