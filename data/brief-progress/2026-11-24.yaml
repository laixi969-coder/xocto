    summary_en: On August 31, 2026, AMD released ROCm 10, a new version of its GPU AI compute software
      stack for running and optimizing AI workloads on AMD hardware. The candidate material gives no performance,
      support-scope or delivery details, so concrete capabilities remain unverified.
    inspiration_en: 'Trend: competition in GPU compute software stacks is moving from a single-vendor
      ecosystem toward multiple coexisting stacks, which could affect bargaining room over compute for
      AI applications. Entry: an opportunity in this layer would be tooling and services that migrate
      existing CUDA workloads to non-Nvidia hardware, aimed at mid-sized teams running their own inference
      clusters; migration cost and compatibility data are not public, so this is inference.'
