    inspiration: 趋势：职业规划与求职辅导这类高信任、强个性化的服务，开始有人尝试用可配置的 AI 代理承接。切入：若要做，应从具体人群（如转行工程师、应届生）和具体交付（改一版简历、给一份岗位匹配清单）入手，而不是做泛化的“职业经纪人”；该项目的实际交付尚不清楚，不宜直接照搬。
    summary_en: Aimed at individuals using DeepSeek Harness and self-described as a personal career broker,
      but the public material offers only a positioning line and repository metrics. It does not state
      at which step users open it, whether it takes a resume or job information, what action it performs,
      or what result it delivers; the concrete workflow and deliverable remain unverified.
    inspiration_en: 'Trend: career planning and job-search coaching, a high-trust and highly personalized
      service, is starting to be attempted through configurable AI agents. Entry: a real attempt should
      start from a specific group (e.g. career-switching engineers, new graduates) and a specific deliverable
      (a revised resume, a job-match list) rather than a generic career broker; this project''s actual
      deliverable is unclear and should not be copied directly.'
