        evidence_ids:
        - ev-bb5f37e97e49adea
        - ev-7aa9577c07bec0bc
      - gate: model
        status: insufficient
        reason: 开源自托管，未见定价或付费路径，钱可能来自部署支持或托管服务，这是判断不是已验证事实。
        evidence_ids:
