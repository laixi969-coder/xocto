        reason: 开源项目未见定价或付费路径，钱可能来自赞助或后续商业版，这是判断而非已验证事实。
        evidence_ids:
        - ev-0c2604213aeec047
      - gate: truth
        status: insufficient
        reason: 降幅数据来自仓库自述，未见独立复现；且绑定单一平台，平台内置压缩即可能抹平其价值。
        evidence_ids:
