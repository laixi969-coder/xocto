          code and docs scattered across repositories into searchable understanding material when scoping
          a change or locating modules, so they can judge relevant modules and dependencies.
        pain_zh: 多仓库代码与文档分散，人工逐个仓库搜索和阅读耗时，且容易漏掉跨仓库依赖；这是从任务结构推出的判断。
        pain_en: Code and docs are scattered across repositories, so searching and reading each one by
