    inspiration: 补丁窗口期成为独立的安全交付环节，说明“不停机修复”正在被拆成可单独采购的能力；切入可考虑面向受监管行业的生产系统补丁编排与审计，但需先确认 Shirudo 的实际部署形态与维护主体。
    summary_en: 'Operations and security teams open Shirudo while patching production Linux machines:
      it acts as a runtime that blocks attacks on running processes without a restart, letting teams finish
      the patch rollout before dealing with reboots. The deliverable is protection during the patch window;
      deployment details and human confirmation steps still need verification.'
    inspiration_en: The patch window becoming its own security deliverable shows 'fix without downtime'
      is being split into a separately purchasable capability; an entry point could be patch orchestration
      and audit for production systems in regulated industries, but Shirudo's actual deployment form and
      maintainer must be confirmed first.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 运维与安全工程师在给生产 Linux 服务器打补丁时，需要在不重启、不停机的前提下阻断针对运行中系统的攻击，并完成补丁上线。
        job_en: Operations and security engineers patching production Linux servers need to block attacks
          on running systems without restart or downtime while completing the patch rollout.
        pain_zh: 打补丁通常要重启或停机，而生产系统停机会带来业务中断；在补丁尚未全部上线的时间窗里，运行中的进程暴露在已知漏洞攻击下。
        pain_en: Patching usually requires a restart or downtime, and downtime on production systems interrupts
          business; during the window before patches are fully rolled out, running processes are exposed
          to known-vulnerability attacks.
        current_alternative_zh: 常见做法是排维护窗口停机打补丁、用负载均衡摘流逐台重启，或临时加 WAF 规则；这些做法要么牺牲可用性，要么需要额外人工配置。
        current_alternative_en: Common practice is scheduling maintenance windows for downtime patching,
          draining traffic via load balancers and rebooting host by host, or adding temporary WAF rules;
          these either sacrifice availability or require extra manual configuration.
        usage_reason_zh: 推断：相较停机打补丁或临时加规则，Shirudo 在运行中直接拦截攻击，省去为补丁单独排维护窗口这一步，因此对不能停机的生产系统运维团队有吸引力；候选未提供用户反馈或采用数据。
        usage_reason_en: 'Inference: compared with downtime patching or ad-hoc rules, Shirudo blocks attacks
          while systems run, removing the step of scheduling a separate maintenance window for patches,
          which appeals to operations teams on systems that cannot go down; the candidate provides no
          user feedback or adoption data.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是补丁窗口期内生产系统不能停机又必须防攻击的需求，痛点刚性且交付动作明确；买方与计价未披露。
        evidence_ids:
