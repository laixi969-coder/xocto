      to an AI agent, which runs 32 marketing skills (research, positioning, copy, pages, SEO, AI search,
      ads, email, content and a local-business pack) to produce marketing drafts; publishing and ad spend
      still need human confirmation, and delivery quality remains to be checked.'
    inspiration_en: 'Trend: marketing work is shifting from hand-written prompts to reusable skill packs
      that encode industry methods, and small local businesses with small budgets and fragmented needs
      are a clear entry point. Entry: start from local service merchants'' opening, launch and campaign
      moments and sell per-store or per-deliverable marketing packages rather than generic tool subscriptions;
      pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 本地商家或为其服务的营销人员，在开店、上新或投放前，需要把业务信息整理成定位、文案、落地页和广告素材，交给 AI 代理按技能包产出可用草稿。
        job_en: A local business or the marketer serving it, before opening, launching or advertising,
          needs to turn business information into positioning, copy, landing pages and ad assets, and
          have an AI agent produce usable drafts via the skill pack.
        pain_zh: 小商家和代运营者缺少专职营销人手，定位、文案、页面和投放素材往往分散在多个模板与手工步骤里，重复劳动多且质量不稳。
        pain_en: Small merchants and agencies lack dedicated marketing staff; positioning, copy, pages
          and ad assets are scattered across templates and manual steps, causing repetitive work and uneven
          quality.
        current_alternative_zh: 旧做法是套用通用模板、外包给自由职业者，或直接在通用聊天助手里零散提问，缺少把调研到投放串起来的固定流程。
        current_alternative_en: The old way is generic templates, freelancers, or scattered questions
          in a general chatbot, without a fixed process linking research to campaign assets.
        usage_reason_zh: 推断：相较零散提问或套模板，技能包把调研、定位、文案、页面和 SEO 拆成固定步骤交给代理执行，减少用户反复组织提示词和拼接产出的负担；本地商家包进一步贴近门店场景，因此小商家和代运营者会在开店或投放准备时试用。
        usage_reason_en: 'Inference: compared with scattered prompts or templates, the skill pack breaks
          research, positioning, copy, pages and SEO into fixed steps for the agent, reducing the burden
          of repeatedly composing prompts and stitching outputs; the local-business pack fits store scenarios,
          so small merchants and agencies would try it when preparing openings or campaigns.'
      gates:
      - gate: value
        status: supported
        reason: 它解决小商家和代运营者缺少营销人手、素材制作分散重复的问题，旧做法是模板、外包或零散提问，结构上成立，属工作流推理。
        evidence_ids:
        - ev-aceb5abd3e446000
      - gate: consensus
        status: insufficient
        reason: 仓库关注度持续上升，但公开材料没有用户评价或客户案例说明谁在什么场景持续使用，关注度不等于采用。
        evidence_ids:
        - ev-aceb5abd3e446000
        - ev-1b490daf75f4beb7
      - gate: model
        status: insufficient
        reason: MIT 开源、免费分发，未见定价或付费路径；钱可能来自后续服务或定制，这是判断而非已验证事实。
        evidence_ids:
        - ev-aceb5abd3e446000
      - gate: truth
        status: insufficient
        reason: 技能包依赖代理执行，产出质量与人工确认边界未见公开实测，交付确定性尚缺证据。
        evidence_ids:
        - ev-aceb5abd3e446000
      next_validation: 收集该仓库的 issue 与 discussion，查看用户实际使用场景、产出质量反馈与是否有人提出付费定制需求。
    event_summary_zh: 2026 年 11 月中旬起，boring-marketing-skills 以 MIT 协议发布 32 个面向 AI 代理的营销技能，含本地商家包；仓库关注度在约一周内从
      199 升至 821。
