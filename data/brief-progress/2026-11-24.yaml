  mutinybim:
    slug: mutinybim
    name: mutinybim
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 建筑与工程
    - 建筑设计
    industries_en:
    - Architecture and Engineering
    - Building Design
    jobs:
    - 建筑设计师或结构工程师在修改同一栋建筑信息模型时，需要让同事与 AI 代理在同一模型上协同编辑并核对改动
    - BIM 工具开发者需要为不同专业（如结构、机电）扩展建模能力并让脚本与 AI 代理调用同一套建模内核
    jobs_en:
    - Architects or structural engineers revising a shared building information model need colleagues
      and AI agents to edit the same model and reconcile changes
    - BIM tool developers extending modeling capability for trades such as structure or MEP need scripts
      and AI agents to call the same modeling kernel
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向建筑建模场景，mutinybim 提供开源建筑模型引擎：一个共享内核、按专业划分的插件，以及脚本优先的工具服务器，让人类与 AI 代理在同一模型上编辑。具体由谁在哪个设计节点打开、AI
      接收什么输入并产出何种可核对交付，公开材料未说明，流程与交付仍待核验。
    inspiration: 趋势：建筑信息模型这类重资产、强专业分工的旧流程，开始出现把建模内核开放给脚本与 AI 代理的尝试。切入：可从中小设计院或单一专业（如结构、机电）的模型修改与协同核对环节进入，卖法未披露，不宜假设。
    summary_en: 'For building modeling, mutinybim offers an open-source building model engine: one shared
      kernel, trade-specific add-ons, and a script-first tool server so people and AI agents edit the
      same model. Public material does not say who opens it at which design step, what input the AI receives,
      or what checkable deliverable results; the workflow and delivery remain to be verified.'
    inspiration_en: 'Trend: heavy, highly specialized legacy workflows like building information modeling
      are seeing attempts to open the modeling kernel to scripts and AI agents. Entry: start from model
      revision and coordination checks in small design firms or a single trade such as structure or MEP;
      pricing is undisclosed and should not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 建筑设计师或结构工程师在修改同一栋建筑信息模型时，需要让同事与 AI 代理在同一模型上协同编辑并核对改动。
        job_en: Architects or structural engineers revising a shared building information model need colleagues
          and AI agents to edit the same model and reconcile changes.
        pain_zh: 多专业协同建模时，改动分散在不同工具与脚本里，人工核对版本与专业间冲突负担重；这是从产品定位作出的推断。
        pain_en: In multi-trade collaborative modeling, changes scatter across tools and scripts, making
          manual version and clash checks burdensome; this is an inference from the product positioning.
        current_alternative_zh: 现有做法是使用商业 BIM 软件配合各自脚本与人工比对，跨专业改动靠会议和人工核对。
        current_alternative_en: The current approach is commercial BIM software with separate scripts
          and manual comparison, with cross-trade changes reconciled in meetings and by hand.
        usage_reason_zh: 推断：相较各自脚本加人工比对，它让脚本与 AI 代理调用同一建模内核，减少改动分散在多套工具间再人工合并的一步，因此多专业协同的设计团队可能选择它；尚无用户反馈或客户案例支持。
        usage_reason_en: 'Inference: versus separate scripts plus manual comparison, it lets scripts and
          AI agents call one modeling kernel, removing the step of merging changes scattered across tools,
          so multi-trade design teams may choose it; no user feedback or customer cases support this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多专业协同建模中改动分散、人工核对负担重的问题，旧流程与替代方式可还原；买方与付费路径公开材料未说明。
        evidence_ids:
        - ev-ddc72c25aedf439b
        - ev-a035d18593f49a6e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 66 缓慢升至 118，属关注度信号，不能证明设计团队已持续采用。
        evidence_ids:
        - ev-ddc72c25aedf439b
        - ev-a035d18593f49a6e
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明谁付费、按什么计价，商业模式无法核验。
        evidence_ids:
        - ev-a035d18593f49a6e
      - gate: truth
        status: insufficient
        reason: AI 代理与人类共编同一模型能否确定性交付、冲突如何处理，公开材料未说明，需核验。
        evidence_ids:
        - ev-ddc72c25aedf439b
      next_validation: 收集 mutinybim 官方文档或仓库 issue/discussion，确认 AI 代理与人类共编同一模型时的冲突处理与交付结果。
  my-ai-coding-workflow:
    slug: my-ai-coding-workflow
    name: my-ai-coding-workflow
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 AI 编程代理的开发者，在让代理改代码前，用规划、关键审查和差异审计三步流程检查代理产出的改动，决定是否合入
    jobs_en:
    - Developers using AI coding agents run a planning, critical-review and diff-audit pipeline over agent-produced
      changes before deciding whether to merge
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 AI 编程代理的开发者，在让代理动手改代码前，打开这套指令与技能集合，让代理先做规划、再接受关键审查、最后审计代码差异，最终拿到一份可逐项核对的改动审查结果；人工仍需确认是否合入。具体交付形态与流程细节仍待核验。
    inspiration: 趋势：AI 编程代理开始承担实际改代码，审查代理产出成为新的瓶颈环节，而非写代码本身。切入：从需要合规留痕的团队切入，把审查步骤做成可审计的交付物，按团队或按审查次数收费；但该仓库目前只是个人整理的指令集，尚无产品化交付与付费路径。
    summary_en: Developers using AI coding agents open this instruction and skill set before letting an
      agent change code, having the agent plan first, then undergo critical review, then audit the diff,
      ending with a checkable review of the change; a human still confirms whether to merge. The exact
      delivery form and process details remain to be verified.
    inspiration_en: 'Trend: as AI coding agents make real code changes, reviewing agent output becomes
      the new bottleneck rather than writing code itself. Entry: start with teams needing auditable records,
      turning the review step into an auditable deliverable priced per team or per review; today the repository
      is a personal instruction set with no productized delivery or payment path.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 AI 编程代理的开发者，在代理产出代码改动后，用规划、关键审查、差异审计三步检查改动，决定是否合入。
        job_en: Developers using AI coding agents check agent-produced changes through planning, critical
          review and diff audit before deciding whether to merge.
        pain_zh: 代理一次生成大量改动，人工逐行核对负担重，容易漏掉错误或越界修改；不审查就合入会带来返工和线上风险。
        pain_en: An agent produces large changes at once, making line-by-line human checking heavy and
          easy to miss errors or out-of-scope edits; merging without review brings rework and production
          risk.
        current_alternative_zh: 开发者目前靠人工读 diff、代码评审工具或临时提示词让代理自查，流程零散且不可复用。
        current_alternative_en: Developers currently read diffs manually, use code review tools, or ad-hoc
          prompts to make agents self-check, with fragmented and non-reusable process.
        usage_reason_zh: 推断：相较人工逐行读 diff，它把规划、审查、差异审计固化为可重复的三步，减少每次重新设计检查步骤的负担，因此频繁用代理改代码的开发者会在合入前选择它。
        usage_reason_en: 'Inference: versus reading diffs line by line, it fixes planning, review and
          diff audit into a repeatable three-step process, cutting the burden of redesigning checks each
          time, so developers who frequently use agents choose it before merging.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理大量改代码后人工审查负担重、易漏错的问题，旧做法是人工读 diff，痛点刚性且交付可核对。
        evidence_ids:
        - ev-68c5645373172a59
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度证据，缺少用户反馈或团队采用案例说明真实使用。
        evidence_ids:
        - ev-68c5645373172a59
      - gate: model
        status: insufficient
        reason: 开源指令集，未见定价、付费或商业交付路径，买方与收费方式不明。
        evidence_ids:
        - ev-68c5645373172a59
      - gate: truth
        status: insufficient
        reason: 未见留存、复购或重复使用证据，无法确认已进入团队工作流；审查能否确定性交付也待核验。
        evidence_ids:
        - ev-68c5645373172a59
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有团队报告实际采用该三步审查流程及其结果。
