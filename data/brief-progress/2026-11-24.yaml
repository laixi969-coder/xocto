    name: FlightTrack
    decision: watching
    event_summary_zh: 开发者 bkazez 于 2026-11-22 在社区发帖称自己两次重写了 FlightTrack 航班追踪应用，并给出其 App Store 页面；本次没有披露用户量、收入、定价或客户案例。
    event_summary_en: On 2026-11-22 developer bkazez posted in a community forum that they rewrote the
      FlightTrack flight-tracking app twice and linked its App Store page; no user counts, revenue, pricing
      or customer cases were disclosed.
    category: AI + 生活
    project_type: new_application
    industries:
    - 航空出行
    - 旅游
    industries_en:
    - air travel
    - tourism
    jobs:
    - 旅客在出行前和转机时查询航班状态与登机口变更
    jobs_en:
    - Travelers checking flight status and gate changes before trips and during layovers
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 旅客在出行前或转机时打开 FlightTrack，输入航班号或航线，查看航班状态、登机口与延误信息，最终拿到一条可核对的航班动态；候选材料只给出 App Store 页面和开发者自述，AI
      具体接收什么、执行什么动作，以及人工确认环节，具体流程或交付仍待核验。
    inspiration: 航班追踪本身是成熟品类，机会不在再做一个查询界面，而在把延误、登机口变更与后续接驳（改签、酒店、接送机）串成一次可执行的处置；切入可考虑常出差人群或差旅管理方，按处理一次行程变更收费，而非卖订阅工具。
    summary_en: Travelers open FlightTrack before a trip or during a layover, enter a flight number or
      route, and see status, gate and delay information, ending with a checkable flight update; the candidate
      material only provides an App Store page and the developer's own note, so what the AI ingests, what
      action it performs and where a human confirms remain to be verified.
    inspiration_en: Flight tracking is a mature category, so the opening is not another lookup screen
      but chaining delays and gate changes into an executable fix for connections, rebooking, hotels and
      airport transfers; the entry point could be frequent business travelers or corporate travel managers,
      charged per handled itinerary change rather than a subscription tool.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 旅客在出行前或转机时，处理航班号、航线与登机口信息，要确认航班是否准点以及接驳是否还赶得上。
        job_en: Before a trip or during a layover, a traveler works with flight numbers, routes and gate
          information to confirm whether the flight is on time and whether a connection is still catchable.
        pain_zh: 航班状态和登机口变更分散在航司通知、机场屏和多个应用里，旅客需要反复核对，误机或错过接驳的代价高；候选材料没有给出用户对这一痛点的直接陈述。
        pain_en: Flight status and gate changes are scattered across airline notices, airport screens
          and multiple apps, forcing repeated checking, and a missed flight or connection is costly; the
          candidate material contains no direct user statement of this pain.
        current_alternative_zh: 航司官方 App 推送、机场大屏、搜索引擎航班卡片，以及 FlightAware 等成熟航班追踪服务。
        current_alternative_en: Airline app notifications, airport screens, search-engine flight cards,
          and established trackers such as FlightAware.
        usage_reason_zh: 推断：若产品能把延误与登机口变更直接对应到用户的具体接驳并给出下一步动作，就省去旅客在多个来源之间来回核对这一步；但候选材料未说明 AI 在其中做了什么，也未给出任何采用或留存证据，因此尚不能判断用户会因此选择它。
        usage_reason_en: 'Inference: if the product maps delays and gate changes directly onto the user''s
          specific connection and proposes the next action, it removes the step of cross-checking several
          sources; however, the material does not say what the AI does, nor offer any adoption or retention
          evidence, so it is not yet possible to judge that users would choose it for this.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决旅客核对航班状态与接驳的需求，痛点真实存在，但候选只有开发者自述和商店页，未说明 AI 具体动作与交付，价值结构无法确认。
        evidence_ids:
        - ev-c2f3dbec60e31dc4
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区帖子和 5 个点数，没有用户评价、下载或使用数据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-c2f3dbec60e31dc4
      - gate: model
        status: insufficient
        reason: 未披露定价、买方或收费方式；航班追踪类应用通常面向个人订阅，但这是判断而非已验证事实。
        evidence_ids:
        - ev-c2f3dbec60e31dc4
      - gate: truth
        status: insufficient
        reason: 无法核对 AI 是否贴近航班处置的第一性目标、承诺能否确定性交付，也看不到人工确认边界。
        evidence_ids:
        - ev-c2f3dbec60e31dc4
      next_validation: 收集 FlightTrack 的 App Store 版本说明与用户评价，确认其是否真的用 AI 处理航班变更并给出接驳处置建议。
