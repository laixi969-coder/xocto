    summary_zh: 弗吉尼亚州和俄勒冈州于2026年11月23日率先起诉SpaceX，指控其旗下Grok在所谓安全措施上线后仍生成非自愿私密影像和儿童性虐待内容，并称相关声明具有误导性。该诉讼把生成式模型的内容安全责任推向司法审查，可能提高AI图像产品的合规与审核成本；对行业整体影响属推断。
    summary_en: On November 23, 2026, Virginia and Oregon became the first states to sue SpaceX, alleging
      that its Grok still generates non-consensual intimate imagery and child sexual abuse material despite
      claimed safeguards, and that its statements were misleading. The suit pushes content-safety liability
      for generative models into court review and may raise compliance and moderation costs for AI image
      products; broader industry impact is inferred.
    event_summary_zh: 弗吉尼亚州和俄勒冈州于2026年11月23日起诉SpaceX，指控Grok仍生成非自愿私密影像和儿童性虐待内容，并称其安全声明具有误导性。
    event_summary_en: On November 23, 2026, Virginia and Oregon sued SpaceX, alleging Grok still produces
      non-consensual intimate imagery and child sexual abuse material and that its safety claims were
      misleading.
