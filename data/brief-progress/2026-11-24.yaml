  sessionly:
    slug: sessionly
    name: sessionly
    decision: watching
    event_summary_zh: 2026年11月13日，sessionly 以开源项目形式公开，提供跨 Claude Code、Codex、Cursor 和 Grok 的本地会话账本，记录各会话做了什么、花了多少成本、哪些产出被保留；公开仓库显示
      113 个星标、3 个 fork、4 个未关闭 issue。
    event_summary_en: 'On 13 November 2026, sessionly was released as an open-source project: a local-first
      ledger across Claude Code, Codex, Cursor and Grok sessions recording what each session did, what
      it cost and what survived; the public repository shows 113 stars, 3 forks and 4 open issues.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用多个 AI 编码代理的开发者，在一天或一个项目结束后，需要回看各会话改动了哪些文件、消耗了多少 token 成本、哪些改动被保留，以便决定保留或回退哪些工作
    jobs_en:
    - Developers using several AI coding agents who, at the end of a day or project, need to review which
      files each session changed, how much token cost it consumed and which changes survived, in order
      to keep or revert work
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex、Cursor 等编码代理的开发者，在一天或一个项目结束后打开它，处理的是分散在各工具里的会话记录与改动痕迹；它把这些会话做了什么、消耗多少成本、哪些改动被保留汇总成一份本地账本，让开发者据此判断保留或回退哪些工作。具体成本口径与保留判定方式仍待核验。
    inspiration: 趋势：编码代理从单工具走向多工具并用，会话本身成了需要被记账和审计的新资产。切入：先服务同时用两三个编码代理的小型工程团队或外包工作室，按项目交付一份“代理工作与成本对账”，卖法可以是团队版订阅或按项目结算，价格未披露。
    summary_en: Developers using coding agents such as Claude Code, Codex and Cursor open it at the end
      of a day or project, working from session records and change traces scattered across tools; it consolidates
      what each session did, what it cost and which changes survived into a local ledger so developers
      can decide what to keep or revert. The exact cost accounting and survival criteria still need verification.
    inspiration_en: 'Trend: coding agents are used across several tools at once, making sessions themselves
      an asset that needs bookkeeping and auditing. Entry: start with small engineering teams or outsourcing
      studios running two or three coding agents, delivering a per-project reconciliation of agent work
      and cost; the selling model could be a team subscription or per-project billing, with pricing undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用多个 AI 编码代理的开发者，在一天或一个项目结束后，需要回看各会话改动了哪些文件、消耗了多少 token 成本、哪些改动被保留，以便决定保留或回退哪些工作。
        job_en: Developers using several AI coding agents who, at the end of a day or project, need to
          review which files each session changed, how much token cost it consumed and which changes survived,
          in order to keep or revert work.
        pain_zh: 多个编码代理并行后，改动与花费散落在各自工具里，开发者难以说清哪次会话产生了什么结果、钱花在哪，回退和复盘都要手工翻查。
        pain_en: With several coding agents running in parallel, changes and spend are scattered across
          tools, so developers struggle to say which session produced what and where money went; reverting
          and reviewing require manual digging.
        current_alternative_zh: 旧做法是逐个工具翻看会话历史、用 git 日志和账单页面手工拼凑，或干脆不复盘。
        current_alternative_en: The old approach is to browse each tool's session history, piece things
          together manually from git logs and billing pages, or skip review altogether.
        usage_reason_zh: 推断：它把跨工具的会话、成本与保留结果收进一份本地账本，省去在多个工具和账单页之间来回对照这一步，因此同时用两三个编码代理、需要按项目对账的开发者会在收工时选择它；目前尚无留存或付费证据。
        usage_reason_en: 'Inference: it gathers cross-tool sessions, cost and survival outcomes into one
          local ledger, removing the step of cross-checking several tools and billing pages, so developers
          running two or three coding agents and needing per-project reconciliation would pick it at wrap-up;
          there is no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行后改动与花费说不清、复盘要手工翻查的问题，痛点具体且不解决的后果可核对；买方尚不明确。
        evidence_ids:
        - ev-2db461c25ea91345
      - gate: consensus
        status: insufficient
        reason: 仅有 113 个星标和 4 个 issue，属于关注度信号，未见用户反馈说明它已进入日常复盘流程。
        evidence_ids:
        - ev-2db461c25ea91345
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、企业采购或按项目收费的公开路径，钱从哪来只能推断。
        evidence_ids:
        - ev-2db461c25ea91345
      - gate: truth
        status: insufficient
        reason: 成本口径与“哪些改动被保留”的判定方式未在材料中说明，交付确定性尚不可核对。
        evidence_ids:
        - ev-2db461c25ea91345
      next_validation: 收集该仓库的 issue 与 discussion，确认开发者实际用它复盘哪些会话、成本口径如何计算，以及是否出现团队使用或付费意愿的公开表述。
  sketchcraft-2:
    slug: sketchcraft-2
    name: sketchcraft
    decision: watching
    event_summary_zh: 2026年11月13日发布的开源推拉式3D建模器 sketchcraft，提供桌面应用、命令行和MCP服务器；仓库星标从11月22日的116增至11月24日的140。
    event_summary_en: Sketchcraft, an open-source push/pull 3D modeler released on November 13, 2026,
      offers a desktop app, CLI and MCP server; repository stars rose from 116 on November 22 to 140 on
      November 24.
    category: AI + 创作
    project_type: open_source
    industries:
    - 工业设计
    - 建筑与空间设计
    - 创客与3D打印
    industries_en:
    - industrial design
    - architecture and spatial design
    - maker and 3D printing
    jobs:
    - 工业设计师在概念阶段把草图轮廓快速拉成可检查的三维体块，用于内部讨论
    - 建筑或空间设计从业者在方案初期把平面轮廓转成体量模型，用于向客户说明空间关系
    - 创客在3D打印前把简单轮廓做成可导出的实体模型
    jobs_en:
    - Industrial designers turning sketch outlines into checkable 3D massing blocks during concept stage
      for internal review
    - Architecture and spatial design practitioners converting plan outlines into massing models early
      in a scheme to explain spatial relations to clients
    - Makers building simple solid models from outlines before 3D printing
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 做概念设计的人先画出二维轮廓，再在 sketchcraft 里把它拉起成三维体块，用于内部讨论或打印前检查；它提供桌面应用、命令行和 MCP 服务器三种入口，AI 具体接收什么、执行哪一步，公开材料没有说明，具体流程或交付仍待核验。
    inspiration: 趋势：开源建模工具开始把命令行和 MCP 接口当作一等入口，意味着三维建模可能被接进自动化流程，而不只是人手拖拽。切入：从创客和3D打印前的快速体块验证切入，卖按模型或按次生成的结果，而不是卖软件席位；价格未披露，不能假设。
    summary_en: People doing concept design draw a 2D outline and pull it into a 3D massing block in sketchcraft
      for internal discussion or pre-print checks; it ships as a desktop app, CLI and MCP server, but
      what the AI receives and which step it performs is not stated in the public material, so the concrete
      workflow and deliverable still need verification.
    inspiration_en: 'Trend: open-source modeling tools are treating CLI and MCP interfaces as first-class
      entry points, suggesting 3D modeling may be wired into automated pipelines rather than only hand-dragged.
      Wedge: start with makers validating massing before 3D printing and charge per model or per run as
      an outcome rather than per seat; pricing is undisclosed and must not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工业设计师、建筑方案从业者或创客在概念阶段拿到一张二维轮廓草图，需要快速得到可检查的三维体块，用于内部讨论、客户说明或打印前确认。
        job_en: Industrial designers, early-stage architecture practitioners or makers hold a 2D outline
          sketch at concept stage and need a checkable 3D massing block for internal review, client explanation
          or pre-print confirmation.
        pain_zh: 从二维轮廓到三维体块通常要在完整建模软件里手工重建轮廓再拉伸，概念阶段反复改形时这一步重复且耗时；不做的后果是方案讨论只能停留在平面图上。
        pain_en: Going from a 2D outline to a 3D block usually means manually rebuilding the outline and
          extruding it in full modeling software; this step repeats and drags when shapes change at concept
          stage, and skipping it leaves scheme discussion stuck on flat drawings.
        current_alternative_zh: 用 SketchUp、Blender、Rhino 等完整建模软件手工描轮廓再推拉，或用纸笔和实体模型沟通体量。
        current_alternative_en: Manually tracing outlines and push/pulling in full modelers such as SketchUp,
          Blender or Rhino, or communicating massing with pen, paper and physical models.
        usage_reason_zh: 推断：相较在完整建模软件里重建轮廓，sketchcraft 直接以已有轮廓为输入拉起体块，省掉描边重建这一步，因此概念阶段需要反复改形的设计师和创客会在快速验证体量时选择它；公开材料未给出用户反馈或留存数据。
        usage_reason_en: 'Inference: compared with rebuilding outlines in a full modeler, sketchcraft
          pulls a block directly from an existing outline, removing the retracing step, so designers and
          makers who iterate shapes at concept stage would pick it for fast massing checks; public material
          provides no user feedback or retention data.'
      gates:
      - gate: value
        status: supported
        reason: 它解决从二维轮廓到可检查三维体块的转换需求，概念阶段反复改形时手工重建轮廓是真实负担，旧替代行为明确。
        evidence_ids:
        - ev-5517aab57da638ff
        - ev-6081c97b930fabb1
        - ev-c9227be6681fef56
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从116增至140的关注度信号，没有用户评价、客户案例或社区讨论说明谁在什么场景持续使用。
        evidence_ids:
        - ev-5517aab57da638ff
        - ev-c9227be6681fef56
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径、托管服务或企业支持，买方是个人创客还是设计团队尚不清楚，这是判断不是已验证事实。
        evidence_ids:
        - ev-5517aab57da638ff
      - gate: truth
        status: insufficient
        reason: 推拉建模本身是成熟能力，AI 与 MCP 入口具体承担哪一步未说明，交付是否确定发生缺少可复现实测。
        evidence_ids:
        - ev-5517aab57da638ff
        - ev-c9227be6681fef56
      next_validation: 收集 sketchcraft 仓库的 issue 与 discussion，确认用户实际用它完成哪类建模任务以及 MCP 入口的具体调用方式。
