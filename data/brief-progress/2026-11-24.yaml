full:
  art-paper-data:
    slug: art-paper-data
    name: art-paper-data
    decision: watching
    event_summary_zh: 2026年11月14日，Anthropic 在代码托管平台发布 ART 论文的数据包仓库，公开说明仅为“ART 手稿的数据包”，未披露论文主题、数据内容或使用方式。
    event_summary_en: On November 14, 2026, Anthropic published a repository described only as the data
      package for the ART manuscript, without disclosing the paper's topic, dataset contents, or usage.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 目前公开材料只说明这是 Anthropic 一份名为 ART 的手稿所附的数据包，未说明谁会打开它、处理什么材料、AI 在其中执行什么动作，也未说明最终交付什么。具体流程或交付仍待核验。
    inspiration: 趋势：前沿模型公司开始把研究手稿的数据以独立仓库形式公开，研究复现的供给方式在变化。切入：若数据包对应可复现的评测或训练流程，机会在面向研究团队的数据整理与复现服务，但需先确认
      ART 论文主题与数据规模。
    summary_en: Public material only states this is the data package for an Anthropic manuscript called
      ART; it does not say who opens it, what material is processed, what action AI performs, or what
      is delivered. The concrete workflow or deliverable remains unverified.
    inspiration_en: 'Trend: frontier model labs are releasing manuscript data as standalone repositories,
      changing how research reproducibility is supplied. Entry: if the package supports a reproducible
      evaluation or training pipeline, the opening is data preparation and reproduction services for research
      teams, pending confirmation of the ART paper''s topic and data scale.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 公开材料未说明谁在什么工作节点使用该数据包、处理什么材料、要完成什么任务；仅知其为一份手稿的配套数据。
        job_en: Public material does not state who uses this data package at what work step, what material
          is processed, or what task is completed; it is known only as companion data for a manuscript.
        pain_zh: 无法从现有事实判断它缓解哪一步痛苦；论文主题与数据内容均未披露。
        pain_en: Existing facts do not show which step's pain it relieves; the paper topic and dataset
          contents are undisclosed.
        current_alternative_zh: 研究复现通常依赖论文附录、补充材料或作者另行提供的代码与数据，但本仓库是否替代其中某一步尚不清楚。
        current_alternative_en: Research reproduction typically relies on paper appendices, supplementary
          materials, or code and data provided separately by authors, but whether this repository replaces
          any of those steps is unclear.
        usage_reason_zh: 无法判断：缺少论文主题、数据内容与使用说明，无法说明相较旧做法减少了哪一步负担。
        usage_reason_en: 'Cannot be judged: the paper topic, data contents, and usage instructions are
          missing, so no step''s burden relative to prior practice can be identified.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决什么需求、什么痛点均无法从公开事实还原，仅有“手稿数据包”一句说明。
        evidence_ids:
