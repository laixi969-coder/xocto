      to the checker, and the tool judges whether an injection path could turn into command execution,
      returning a risk conclusion that a human uses to decide whether to patch or block the release; the
      exact detection scope and output format still need verification.
    inspiration_en: 'Trend: a major model vendor is packaging security review as an open-source checker
      that runs on legacy code, showing AI moving from writing code to judging pre-release risk. Entry:
      target small hosting providers and web-build agencies still running PHP sites, charging per release
      scan or per site annually, selling the outcome of blocking a real injection rather than another
      general coding assistant.'
