      checklists, is not stated in the candidate material; the concrete workflow and deliverable remain
      to be verified.
    inspiration_en: 'Trend: offline-capable knowledge bases are being treated as a backup for missing
      infrastructure rather than an add-on to online services. Entry: start from disconnected settings
      such as emergency management, remote worksites and disaster response, selling pre-deployed offline
      knowledge packs and on-site retrieval rather than a general assistant; institutional buyers are
      plausible but no pricing is disclosed.'
    req_initial:
