  fireworks-ai:
    slug: fireworks-ai
    name: Fireworks AI
    decision: market_context
    event_summary_zh: 2026年11月，Fireworks AI 在数周内第二次通报安全事件，黑客经由其服务访问了 Notion 客户的聊天记录；同期报道称客户因 GPU 供给紧张而非安全因素继续留用，公司还以开放模型作为
      Anthropic 的替代方案对外推介。
    event_summary_en: In November 2026, Fireworks AI notified customers of a second security incident
      within weeks, with hackers reaching Notion customers' chat transcripts through its service; reporting
      meanwhile said customers stayed because of GPU scarcity rather than security, and the company pitched
      open models as an alternative to Anthropic.
    category: 基础层
    project_type: new_application
    industries:
    - 云计算与模型托管
    - 企业软件
    industries_en:
    - Cloud Computing and Model Hosting
    - Enterprise Software
    jobs:
    - AI 应用团队在选型时评估推理托管供应商的供给稳定性与数据安全边界
    - AI application teams evaluating inference hosting vendors for capacity stability and data-security
      boundaries
    jobs_en:
    - AI application teams evaluating inference hosting vendors for capacity stability and data-security
      boundaries
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 模型推理托管与多模型路由服务，供 AI 应用团队把模型调用外包出去；本批材料只覆盖其安全事件与供给紧张，具体定价与交付流程仍待核验。
    inspiration: 推理托管已进入供给紧张与安全事件并存的阶段，说明这一层的机会不在再做一个聚合路由，而在于把可审计的数据边界和故障隔离做成可交付承诺，卖给把客户数据交给第三方的应用团队。
    summary_en: A model inference hosting and multi-model routing service that lets AI application teams
      outsource model calls; this batch only covers its security incidents and tight supply, with pricing
      and delivery flow still unverified.
    inspiration_en: Inference hosting now combines tight supply with repeated security incidents, so the
      opening is not another routing aggregator but auditable data boundaries and fault isolation sold
      as a deliverable promise to teams handing customer data to a third party.
  fish-pocket-3:
    slug: fish-pocket-3
