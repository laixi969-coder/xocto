    summary_zh: 星汐面向已经整理好记忆档案的个人用户，把这些条目连成一张可视化的星图，让用户按关系浏览和回顾过往记录。它具体接收什么格式的档案、如何生成关系、最终交付是静态图还是可交互界面，公开材料尚未说明，具体流程或交付仍待核验。
