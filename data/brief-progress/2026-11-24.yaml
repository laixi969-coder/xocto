    summary_zh: 面向断网或无基础设施场景的使用者，lastbook 把生存、地图与重建类知识做成可离线调用的资料库，用户在现场打开它检索所需内容。AI 具体接收什么、执行什么动作，以及最终交付形态（问答、检索结果还是可执行清单）在候选材料中未说明，具体流程或交付仍待核验。
    inspiration: 趋势：离线可用的知识库开始被当作基础设施缺位时的备份，而不是在线服务的附属功能。切入：可从应急管理、偏远工地、灾害救援等断网场景进入，卖的是预先部署的离线知识包与现场检索，而非通用助手；付费方可能是机构采购，但公开材料未披露定价。
