      this download service and hand download tasks to a global, session-aware persistent queue, ultimately
      receiving files after queuing and resumption; deployment details and delivery boundaries remain
      to be verified.
    inspiration_en: 'Trend: infrastructure around model toolchains, such as downloads and queuing, is
      starting to be split out as standalone pieces. Entry: target teams that batch-pull model weights
      or datasets, entering at the download queue and resumption step; a hosted-service model is conceivable,
      but pricing is undisclosed.'
