      - gate: consensus
        status: insufficient
        reason: 星标与讨论量只反映关注度，不能证明持续采用或形成共识。
        evidence_ids:
        - ev-d3fc4a55c6b43b78
      - gate: model
        status: insufficient
        reason: 材料未披露付费方、定价或商业模式，无法判断收入来源。
        evidence_ids:
        - ev-749a41df539a0582
      - gate: truth
        status: insufficient
        reason: 未进入：价值不成立，缺少具体任务、交付与人工边界信息。
        evidence_ids:
        - ev-749a41df539a0582
      next_validation: 收集 DeepInfer 官方仓库的 README 与部署文档，核验其支持的硬件门槛、部署步骤与可复现的吞吐/延迟实测数据。
