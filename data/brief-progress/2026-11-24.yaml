          so non-professional builders would pick it before launch.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 生成应用上线前缺少安全与成本审查的问题，痛点具体且不处理的后果可核对；买方尚不清晰。
        evidence_ids:
