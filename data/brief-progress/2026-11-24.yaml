  ai-data-centers-throw-another-wrench-into-chaotic-un-climate:
    slug: ai-data-centers-throw-another-wrench-into-chaotic-un-climate
    name: COP31 AI data center electricity debate
    decision: market_context
    summary_zh: 2026年11月COP31气候大会在土耳其安塔利亚闭幕期间，AI 数据中心用电激增成为谈判中的争议议题，代表们需在 electrifying 全球经济与控制能耗之间权衡。这意味着
      AI 算力扩张面临更紧的电力与监管约束，可能推高推理与训练成本并影响数据中心选址与交付节奏（推断）。
    summary_en: During the COP31 climate conference that closed in Antalya, Turkey, in November 2026,
      surging electricity demand from AI data centers became a contentious issue in negotiations, with
      delegates weighing economy-wide electrification against power consumption. This implies tighter
      power and regulatory constraints on AI compute expansion, which could raise inference and training
      costs and affect data center siting and delivery timelines (inference).
    event_summary_zh: COP31 气候大会在安塔利亚闭幕，AI 数据中心用电激增成为会议争议焦点之一。
    event_summary_en: The COP31 climate conference closed in Antalya with surging AI data center electricity
      demand as one of the contentious issues.
