    summary_zh: 面向构建浏览器自动化智能体的开发者：据候选资料，它试图为 AI 智能体提供实时的浏览器语义状态，让智能体在操作网页时读到页面当前结构而非静态快照。具体输入、动作与交付流程在现有材料中未展开，具体流程或交付仍待核验。
