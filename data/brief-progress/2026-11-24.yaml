        status: insufficient
        reason: 仅有一方发布说明，缺少运维社区讨论、issue 或独立评价来证明场景共识。
        evidence_ids:
        - ev-ae172f60fd49ec9b
      - gate: model
        status: insufficient
        reason: 开源运行时，候选未说明维护方分工、支持服务或任何付费路径，钱从哪来无法判断。
        evidence_ids:
        - ev-ae172f60fd49ec9b
      - gate: truth
        status: insufficient
        reason: 未披露部署形态、误拦截边界与人工确认环节，承诺能否确定性交付尚不可核对。
        evidence_ids:
        - ev-ae172f60fd49ec9b
