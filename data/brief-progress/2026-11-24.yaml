      - gate: consensus
        status: insufficient
        reason: 仓库星数从 73 增至 297 只说明关注度上升，缺少用户反馈或案例说明开发者已把它留在工作流。
        evidence_ids:
        - ev-0a9e40080b9c80a5
        - ev-c99ab09cb467911b
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未披露定价、付费方或商业交付方式，钱从哪来尚不清楚。
        evidence_ids:
        - ev-c99ab09cb467911b
      - gate: truth
        status: insufficient
        reason: 本地记录与写回指令的闭环在描述中成立，但缺少实测或用户证据证明复盘结论确实改善结果。
        evidence_ids:
