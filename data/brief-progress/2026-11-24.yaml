        current_alternative_zh: 分别打开各代理的终端或自带界面，手动切换和记录。
        current_alternative_en: Open each agent's terminal or built-in interface separately and switch
          and record manually.
        usage_reason_zh: 推断：相较逐个打开终端，icode-workbench 把多个代理的 CLI 与订阅汇入一个工作台统一调度展示，减少切换和跟踪输出的步骤，因此已订阅多个编码代理的开发者会尝试。
        usage_reason_en: 'Inference: versus opening terminals one by one, icode-workbench funnels several
          agents'' CLIs and subscriptions into one workbench for unified dispatch and display, cutting
          switching and output-tracking steps, so developers already subscribing to several coding agents
          would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理分散在多个 CLI 中难以统一调度与跟踪的痛点，旧做法是逐个终端切换，结构上成立。
        evidence_ids:
        - ev-57979c34c230de71
        - ev-b7d83cf3b851ab00
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 180 增至 192，缺少用户评价或采用反馈，共识未明。
        evidence_ids:
        - ev-57979c34c230de71
        - ev-b7d83cf3b851ab00
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-57979c34c230de71
      - gate: truth
        status: insufficient
        reason: 多代理调度的实际稳定性、并发上限与交付确定性均未核验。
        evidence_ids:
        - ev-57979c34c230de71
        - ev-b7d83cf3b851ab00
      next_validation: 收集该仓库的 issue 与 discussion，查看多代理并行调度的实际使用反馈与稳定性问题。
