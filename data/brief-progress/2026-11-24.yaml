        job_zh: 前端或创意开发者在制作元素密集、带动效的网页时，把大量真实 DOM 节点放到同一画布上，用编辑器调整位置尺寸并预览着色器与过渡效果，同时让 AI 代理读取并指向具体元素，完成布局与动效调试。
        job_en: Front-end or creative developers building element-dense, motion-heavy web pages place
          many live DOM nodes on one canvas, adjust position and size in an editor, preview shaders and
          transitions, and let an AI agent read and point at specific elements to finish layout and motion
          debugging.
        pain_zh: 元素数量多时，传统 DOM 排版和逐项调试动效负担重，静态设计稿与最终页面之间存在落差，AI 也难以定位到具体界面元素。
        pain_en: With many elements, conventional DOM layout and per-item motion debugging are heavy,
          there is a gap between static mockups and the final page, and AI struggles to locate specific
          interface elements.
        current_alternative_zh: 用常规前端框架手写布局与动效，或在设计工具里做静态稿再交给开发还原，AI 编码助手只能改代码而看不到画布上的具体元素。
        current_alternative_en: Hand-writing layout and motion in a conventional front-end framework,
          or making static mockups in a design tool and handing them to developers, with AI coding assistants
          editing code but not seeing specific elements on a canvas.
        usage_reason_zh: 推断：相较手写布局和静态稿还原，它把真实 DOM 节点直接放到 GPU 绘制的画布上，编辑器一步完成选中、移动和缩放，AI 代理能读取并指向具体元素，减少“设计稿到代码”的转译和逐项定位动效的负担，因此元素密集页面的创意开发者会在调试阶段选择它。
        usage_reason_en: 'Inference: compared with hand-written layout and mockup handoff, it puts live
          DOM nodes on a GPU-drawn canvas where the editor selects, moves and resizes in one step and
          the AI agent can read and point at specific elements, reducing mockup-to-code translation and
          per-item motion locating, so creative developers on element-dense pages would choose it during
          debugging.'
      gates:
      - gate: value
        status: supported
        reason: 它解决元素密集网页的布局与动效调试需求，痛点在于手写排版和静态稿还原负担重；买方尚不清晰，属工作流推理。
        evidence_ids:
        - ev-3760e0274be97f02
        - ev-67a0d907f5f030b0
      - gate: consensus
        status: insufficient
        reason: 只有开源仓库关注度缓慢增长，没有用户评价、客户案例或采用数据说明谁在什么场景持续使用。
        evidence_ids:
        - ev-3760e0274be97f02
        - ev-67a0d907f5f030b0
      - gate: model
        status: insufficient
        reason: 未披露定价或收费方式，开源项目可能的付费路径（托管、支持、按项目）均为推断，不是已验证事实。
        evidence_ids:
