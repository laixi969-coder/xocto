    summary_zh: Blender 用户在做场景或模型修改时，打开这个插件式工作流，AI 把每次编辑拆成受监督的工具调用，先提出、经用户批准后按顺序执行，可在当前步骤后取消并按名称撤销。用户最终拿到的是可逐步确认、可回退的编辑结果；具体交付形态与人工确认边界仍待核验。
    inspiration: 趋势：三维创作里的 AI 正从“一键生成”转向把每一步操作变成可审批、可撤销的受控动作，降低误改资产的风险。切入：可从独立三维美术师和小型动画工作室的资产修改环节进入，按可回退的编辑步骤或项目交付收费；价格未披露，不臆测。
