    name: Replit Missions
    decision: watching
    event_summary_zh: Replit 于 2026 年 11 月 22 日发布 Missions，用户可设定预算并协调多支 AI 代理团队执行任务；候选材料仅有一句产品描述，未披露定价、客户或使用数据。
