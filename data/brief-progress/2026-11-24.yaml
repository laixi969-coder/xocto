        evidence_ids:
        - ev-7d205ae360288db2
        - ev-60b413981c02cc32
      - gate: model
        status: insufficient
        reason: 开源技能未见定价或付费路径，买方可能是内容团队或营销方，但公开材料未披露，属判断而非已验证事实。
        evidence_ids:
        - ev-60b413981c02cc32
      - gate: truth
        status: insufficient
        reason: 交付为代码生成的短片，能否稳定产出可播放成片、人工需确认哪些环节，公开材料未说明。
        evidence_ids:
        - ev-60b413981c02cc32
