    regions: []
    regions_en: []
    open_source: true
    summary_zh: Aether 是一个面向 Android 的开源本地大模型聊天应用，用户在手机上打开它，把指令交给本地模型，由模型调用 bash、文件与 MCP 工具、子代理，并在离线 Alpine/Proot
