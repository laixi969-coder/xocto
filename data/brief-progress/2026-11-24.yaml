      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数缓慢增长，没有用户评价、客户案例或使用反馈说明谁在什么场景下采用。
        evidence_ids:
        - ev-7fd7627055dea98d
      - gate: model
        status: insufficient
        reason: 仓库未披露定价或付费路径，开源项目如何变现、由谁付费尚不明确，这是判断而非已验证事实。
        evidence_ids:
        - ev-2f2e047e5a475d13
      - gate: truth
        status: insufficient
        reason: 检查项覆盖范围、误报率和实际拦截效果没有公开材料，无法确认交付是否确定发生。
        evidence_ids:
        - ev-2f2e047e5a475d13
      next_validation: 收集该仓库的 issue、discussion 或 README 中的实测示例，核验检查项覆盖范围与误报情况。
