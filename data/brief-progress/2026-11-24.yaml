  burp-sectivai:
    slug: burp-sectivai
    name: Sectiv
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 信息安全
    - 软件与互联网服务
    industries_en:
    - Information Security
    - Software & Internet Services
    jobs:
    - 安全测试人员在 Burp Suite 中截获 Web 流量后，挑选请求并指定 IDOR、XSS、SQLi、SSRF 等审查目标，让 AI 生成含复现步骤、影响、PoC 与 CWE/CVE 的漏洞报告，再人工确认后导出
      HTML/MD/JSON
    - 渗透测试团队在项目交付前，把已抓取的流量批量交给插件做安全审查，汇总成按严重度排序的仪表盘，用于撰写客户报告
    jobs_en:
    - Security testers who capture web traffic in Burp Suite select requests and a review goal (IDOR,
      XSS, SQLi, SSRF), have AI draft a vulnerability report with reproduction steps, impact, PoC and
      CWE/CVE, then confirm manually and export HTML/MD/JSON
    - Penetration testing teams hand captured traffic to the plugin before delivery to produce a severity-ranked
      dashboard for client reports
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安全测试人员在 Burp Suite 里截获 Web 流量后，挑选请求并指定 IDOR、XSS、SQLi、SSRF 等审查目标，插件让 AI 生成含描述、复现步骤、影响、PoC
      与 CWE/CVE 的漏洞条目，汇总成按严重度排序的仪表盘，并可导出 HTML/MD/JSON；结论仍需人工确认。具体误报率与真实项目中的交付流程仍待核验。
    inspiration: 趋势：漏洞审查正从人工逐条看请求，转向在既有抓包工具里由 AI 先出带复现步骤和 PoC 的初稿。切入：从渗透测试团队的报告撰写环节进入，把“写报告”这一步按份或按项目收费，而不是卖插件席位；壁垒在漏洞知识库与误报控制，不在模型本身。
    summary_en: After capturing web traffic in Burp Suite, security testers pick requests and a review
      goal (IDOR, XSS, SQLi, SSRF); the plugin has AI draft vulnerability entries with description, reproduction
      steps, impact, PoC and CWE/CVE, aggregates them into a severity-ranked dashboard, and exports HTML/MD/JSON.
      Findings still need human confirmation. False-positive rates and real project delivery flows remain
      to be verified.
    inspiration_en: 'Trend: vulnerability review is shifting from reading each request by hand to having
      AI draft findings with reproduction steps and PoC inside the existing interception tool. Entry:
      start from the report-writing step of penetration testing teams and charge per report or per project
      rather than per plugin seat; the moat is the vulnerability knowledge base and false-positive control,
      not the model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全测试人员在 Burp Suite 中截获 Web 流量后，挑选请求并指定审查目标，让 AI 生成含复现步骤、影响、PoC 与 CWE/CVE 的漏洞报告，人工确认后导出。
        job_en: Security testers capture web traffic in Burp Suite, select requests and a review goal,
          have AI draft a vulnerability report with reproduction steps, impact, PoC and CWE/CVE, then
          confirm and export.
        pain_zh: 人工逐条阅读请求、判断漏洞类型并手写复现步骤和报告耗时且易漏；不做的后果是交付慢或漏报。
        pain_en: Reading each request by hand, classifying the vulnerability and writing reproduction
          steps and reports is slow and error-prone; skipping it means slow delivery or missed findings.
        current_alternative_zh: 测试人员手动在 Burp 中逐条查看请求，凭经验判断漏洞，再用文档工具手写报告。
        current_alternative_en: Testers manually inspect each request in Burp, judge vulnerabilities by
          experience, and hand-write reports in document tools.
        usage_reason_zh: 推断：插件直接在已抓取的流量上按指定漏洞类型生成带复现步骤和 PoC 的条目并汇总成仪表盘，省去从零起草报告这一步，因此渗透测试人员在写客户报告时会选择它；尚无用户反馈或客户案例证实长期使用。
        usage_reason_en: 'Inference: the plugin works on already-captured traffic, drafts entries with
          reproduction steps and PoC for the chosen vulnerability types and aggregates them into a dashboard,
          removing the from-scratch report drafting step, so penetration testers may choose it when writing
          client reports; no user feedback or customer cases yet confirm sustained use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决安全测试人员逐条读请求、手写漏洞报告的需求，痛点是报告耗时易漏；旧做法是人工查看加文档手写，结构上成立，属工作流推理。
        evidence_ids:
        - ev-1b33737336b251ec
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，属关注度而非采用证据；缺少用户评价或团队使用案例。
        evidence_ids:
        - ev-1b33737336b251ec
        - ev-0cbe543ecf8e55c3
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是安全团队或按项目付费的客户，属判断而非已验证事实。
        evidence_ids:
        - ev-1b33737336b251ec
      - gate: truth
        status: insufficient
        reason: AI 生成漏洞结论的误报率与人工确认边界未披露，交付确定性待核验。
        evidence_ids:
        - ev-1b33737336b251ec
      next_validation: 收集该仓库的 issue/discussion 或 README 中的实测样例，核验 AI 生成漏洞条目的误报率与人工确认流程。
    event_summary_zh: 2026 年 11 月 4 日，开发者 zack0x01 在开源仓库发布 Sectiv，一个基于 Burp Suite Montoya API、用 Kotlin
      与 Swing 构建的 AI 安全审查插件，可按 IDOR、XSS、SQLi、SSRF 等目标审查已抓取流量并导出报告；截至 11 月 24 日仓库约 118 星。
    event_summary_en: On November 4, 2026, developer zack0x01 released Sectiv, an AI security review plugin
      for Burp Suite built with Kotlin and Swing on the Montoya API, which reviews captured traffic against
      goals such as IDOR, XSS, SQLi and SSRF and exports reports; the repository had about 118 stars as
      of November 24.
