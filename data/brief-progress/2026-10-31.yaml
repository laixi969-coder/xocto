  maines-data-center-revolt-will-decide-who-controls-the-senat:
    slug: maines-data-center-revolt-will-decide-who-controls-the-senat
    name: Maine data center debate
    decision: market_context
    summary_zh: 2026 年美国中期选举前夕，缅因州围绕 AI 数据中心扩张的争议成为参议院选战的核心议题之一，选民在辩论现场就数据中心对气候和水资源的影响提出抗议。这一政治压力意味着 AI
      数据中心的选址与建设可能面临更强的本地审查和许可阻力，进而影响 AI 算力供给的扩张节奏与成本（后者为推断）。
    summary_en: Ahead of the 2026 US midterms, controversy over AI data center expansion became a central
      issue in Maine's Senate race, with voters protesting at a debate over the facilities' climate and
      water impacts. This political pressure implies that siting and construction of AI data centers may
      face stronger local scrutiny and permitting resistance, which could affect the pace and cost of
      expanding AI compute capacity (the latter is an inference).
    event_summary_zh: 缅因州围绕 AI 数据中心扩张的争议在 2026 年中期选举前升级为参议院选战的核心议题，选民在辩论现场就气候与水资源影响提出抗议。
    event_summary_en: Controversy over AI data center expansion in Maine escalated into a central Senate
      campaign issue ahead of the 2026 midterms, with voters protesting at a debate over climate and water
      impacts.
  making-it-easier-for-websites-to-express-ai-training-prefere:
    slug: making-it-easier-for-websites-to-express-ai-training-prefere
    name: OpenAI
    decision: market_context
    summary_zh: OpenAI 于 2026 年 10 月 30 日宣布将遵守一个共享的 robots.txt 信号，供网站运营者向参与该机制的提供商表达其 AI 训练偏好。这意味着 AI
      训练数据的获取开始受到网站方偏好的约束，可能抬高训练数据获取的合规成本，并改变模型提供方之间的数据竞争格局（推断）。
    summary_en: On October 30, 2026, OpenAI announced it will honor a shared robots.txt signal that lets
      website operators express their AI training preferences to participating providers. This means AI
      training data acquisition begins to be constrained by site owners' preferences, potentially raising
      compliance costs for training data and shifting data competition among model providers (inference).
    event_summary_zh: OpenAI 宣布将遵守一个共享的 robots.txt 信号，帮助网站运营者向参与该机制的提供商传达其 AI 训练偏好。
    event_summary_en: OpenAI announced it will honor a shared robots.txt signal to help website operators
      communicate their AI training preferences to participating providers.
  managing-amazon-bedrock-costs-end-to-end-a-playbook-for-fino:
    slug: managing-amazon-bedrock-costs-end-to-end-a-playbook-for-fino
    name: Amazon Bedrock
    decision: market_context
    summary_zh: AWS 于 2026 年 10 月 30 日发布面向 FinOps 与平台团队的 Amazon Bedrock 成本管理指南，指出智能体工作流每次任务会发起多次模型调用并携带更大上下文，token
      消耗随自主程度和上下文规模而非用户交互次数增长。这提示 AI 应用的成本结构正从按对话计费转向按工作流设计决定，团队需按工作负载归集与预算控制支出（推断）。
    summary_en: On October 30, 2026, AWS published a cost-management playbook for Amazon Bedrock aimed
      at FinOps and platform teams, noting that agentic workflows issue many model invocations per task
      with larger context, so token consumption scales with autonomy and context size rather than user
      interactions. This suggests AI application cost structures are shifting from per-conversation billing
      toward being determined by workflow design, requiring teams to attribute and budget spend by workload
      (inference).
    event_summary_zh: AWS 发布 Amazon Bedrock 端到端成本管理指南，说明智能体工作流的 token 消耗随自主程度与上下文规模增长，需按工作负载归集和预算控制生成式
      AI 支出。
    event_summary_en: AWS published an end-to-end Amazon Bedrock cost management playbook explaining that
      agentic workflow token consumption grows with autonomy and context size, requiring generative AI
      spend to be attributed and budgeted by workload.
