      and omni), an experimental streaming-audio API in mtmd, and realtime audio input/output through
      new /v1/realtime and /tts endpoints; it also adds architecture support for DeepSeek V4.1 Flash,
      SenseNova U1, Beam, Kolibri-1, Flint, Muse Spark and Granite Switch Decision, reworks sparse attention
      (QSA/DSA) onto a fused masking op in the core, and introduces a 50/50 SLRU cache for host-resident
      MoE experts.
  google-ai-mode-sends-57-of-product-links-to-google-shopping:
    slug: google-ai-mode-sends-57-of-product-links-to-google-shopping
    name: Google AI Mode
    decision: market_context
    summary_zh: 一项研究显示，Google AI Mode 将 57% 的商品链接导向 Google Shopping。这意味着 AI 搜索入口正在把商业流量集中回 Google 自有购物平台，对依赖自然搜索获客的电商与比价服务构成分发渠道收窄的影响；该比例来自单一研究，尚不足以推断整个
      AI 搜索行业的分发格局已改变。
    summary_en: A study found that Google AI Mode routes 57% of product links to Google Shopping. This
      indicates that the AI search entry point is concentrating commercial traffic back into Google's
      own shopping platform, narrowing distribution for e-commerce and price-comparison services that
      rely on organic search acquisition; the figure comes from a single study and is not sufficient to
      conclude that distribution across the entire AI search industry has shifted.
    event_summary_zh: 一项研究称，Google AI Mode 产生的商品链接中有 57% 指向 Google Shopping。
    event_summary_en: A study reports that 57% of product links generated by Google AI Mode point to Google
      Shopping.
  google-ai-overviews-are-pushing-news-boxes-out-of-search-res:
    slug: google-ai-overviews-are-pushing-news-boxes-out-of-search-res
    name: Google AI Overviews
    decision: market_context
    summary_zh: 据一项研究，Google 的 AI Overviews 正在把新闻信息框挤出搜索结果，显示 AI 摘要正在改变搜索结果的呈现方式。这一变化意味着新闻发布者的搜索曝光可能被
      AI 摘要分流，进而影响其流量与广告收入；对 AI 应用而言，则说明生成式摘要正在重塑信息分发入口的竞争格局。该结论来自单一研究，尚不足以推断整个搜索行业已完成转向。
    summary_en: According to a study, Google's AI Overviews are pushing news boxes out of search results,
      indicating that AI summaries are changing how search results are presented. This shift means news
      publishers' search visibility may be diverted by AI summaries, affecting their traffic and ad revenue;
      for AI applications, it shows generative summaries are reshaping competition at the information
      distribution entry point. The finding comes from a single study and is not enough to infer that
      the entire search industry has already turned.
    event_summary_zh: 一项研究称，Google 的 AI Overviews 正在将新闻信息框挤出搜索结果。
    event_summary_en: A study says Google's AI Overviews are pushing news boxes out of search results.
