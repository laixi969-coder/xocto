  wikipedias-operator-says-a-bad-ai-copyright-ruling-could-thr:
    slug: wikipedias-operator-says-a-bad-ai-copyright-ruling-could-thr
    name: Wikimedia Foundation
    decision: market_context
    summary_zh: Wikimedia Foundation 于 2026 年 10 月就纽约时报诉 OpenAI 与微软等 AI 版权案提交法庭意见书，主张应允许大模型使用受版权作品训练，但不应允许聊天机器人向用户复述这些内容。该立场若被采纳，将影响
      AI 训练数据的合法边界与内容方授权成本；若判决过于宽泛，则可能同时限制 AI 工具在开放网络上的可用性（推断）。
    summary_en: In October 2026 the Wikimedia Foundation filed an amicus brief in the copyright cases
      pitting The New York Times against OpenAI and Microsoft, arguing that training large language models
      on copyrighted works should be legally protected while chatbots should not reproduce that content
      to users. If adopted, this position would shape the legal boundaries of AI training data and content
      licensing costs; an overly broad ruling could also restrict the availability of AI tools on the
      open web (inference).
    event_summary_zh: Wikimedia Foundation 就纽约时报诉 OpenAI 与微软的 AI 版权案提交法庭意见书，主张保护大模型使用受版权作品训练，但反对聊天机器人向用户复述这些内容。
    event_summary_en: The Wikimedia Foundation filed an amicus brief in the New York Times v. OpenAI and
      Microsoft AI copyright cases, arguing for protecting LLM training on copyrighted works while opposing
      chatbots reproducing that content to users.
