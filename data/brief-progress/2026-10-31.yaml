    decision: market_context
    summary_zh: 据传在AI相关资产遭抛售的背景下，OpenAI的融资目标被下调逾三成，估值同步调降。若属实，这将改变头部模型公司的资本供给预期，进而影响其算力投入与模型交付节奏；该信息为传闻，尚待证实。
    summary_en: Amid a sell-off in AI-related assets, OpenAI's reported fundraising target was cut by
      more than 30% with a corresponding valuation reduction. If accurate, this would change capital-supply
      expectations for leading model companies, affecting their compute investment and model delivery
      pace; the report is unconfirmed.
    event_summary_zh: 有报道称，在AI资产抛售背景下，OpenAI的融资目标被削减逾三成，估值同步下调。
    event_summary_en: Reports say OpenAI's fundraising target was cut by more than 30% amid an AI asset
      sell-off, with its valuation lowered accordingly.
