    decision: market_context
    summary_zh: 穆迪就AI相关贷款规模上升发出警告，指出2027至2029年存在再融资风险。这一信用风险信号意味着AI基础设施建设的融资成本可能上升，进而影响AI应用的资本开支与交付节奏（推断）。
    summary_en: Moody's warned about rising AI-related lending and flagged refinancing risk for 2027-2029.
      This credit-risk signal implies potentially higher financing costs for AI infrastructure buildout,
      which could affect capex and delivery pace for AI applications (inference).
    event_summary_zh: 穆迪警告AI相关贷款规模上升，并指出2027至2029年存在再融资风险。
    event_summary_en: Moody's warned of rising AI-related lending and flagged refinancing risk in 2027-2029.
