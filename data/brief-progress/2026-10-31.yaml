    summary_en: On October 30, 2026, Intel issued fourth-quarter guidance below market expectations and
      warned that weak PC demand and rising memory prices could persist into the first half of 2027; its
      shares fell more than 30% intraday that day. The change implies continued pressure on PC-related
      chip demand and memory costs, affecting the hardware cost and replacement cycle of on-device AI
      PCs; for AI applications, the supply and pricing outlook for local inference compute is under pressure
      (inference).
    event_summary_zh: 英特尔2026年第三季度营收同比增长21%至165.1亿美元，但第四季度业绩指引低于市场预期，并警告PC疲软与内存涨价或持续至2027年上半年，10月30日开盘后股价盘中跌幅一度超过30%。
    event_summary_en: Intel's third-quarter 2026 revenue rose 21% year over year to $16.51 billion, but
      its fourth-quarter guidance came in below market expectations, and it warned that PC weakness and
      memory price increases may persist into the first half of 2027; its shares fell more than 30% intraday
      after the October 30 open.
