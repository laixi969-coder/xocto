interpretation:
  15家机构联合倡议未经金融机构授权-智能体不得对金融客户端实施读屏模拟点击或自动化操控:
    slug: 15家机构联合倡议未经金融机构授权-智能体不得对金融客户端实施读屏模拟点击或自动化操控
    name: 15家机构联合倡议：未经金融机构授权 智能体不得对金融客户端实施读屏、模拟点击或自动化操控
    decision: market_context
    summary_zh: 2026年10月30日，15家机构联合发布倡议，要求智能体在未经金融机构授权时不得对金融客户端实施读屏、模拟点击或自动化操控。该倡议为金融场景中的智能体自动化设定了授权边界，意味着面向金融客户端的AI代理在接入与操作层面将面临更严格的合规要求，可能抬高交付门槛并改变竞争方式（推断）。
    summary_en: On October 30, 2026, 15 institutions jointly issued an initiative stating that agents
      must not perform screen reading, simulated clicks or automated control on financial client apps
      without authorization from the financial institution. The initiative sets an authorization boundary
      for agent automation in financial scenarios, implying that AI agents targeting financial client
      apps will face stricter compliance requirements at the integration and operation level, potentially
      raising delivery barriers and changing competition (inference).
    event_summary_zh: 15家机构于2026年10月30日联合倡议：未经金融机构授权，智能体不得对金融客户端实施读屏、模拟点击或自动化操控。
    event_summary_en: On October 30, 2026, 15 institutions jointly proposed that agents must not perform
      screen reading, simulated clicks or automated control on financial client apps without authorization
      from financial institutions.
