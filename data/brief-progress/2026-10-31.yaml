    slug: the-biggest-names-in-ai-are-backing-a-new-way-to-opt-out-of
    name: IETF robots.txt AI training opt-out policy token
    decision: market_context
    summary_zh: 2026年10月，OpenAI、Google、Microsoft 与 Anthropic 表示将采用一项由 Anthropic 标准技术负责人 Kevin Kelley 在
      IETF 提出的共享“policy token”信号，写入网站 robots.txt，使发布者一次设置即可对多家 AI 公司表达训练数据偏好。该机制若落地，将降低发布者逐家协商的成本，并可能改变
      AI 训练数据的获取条件与合规交付方式；对模型训练成本与数据竞争格局的影响尚待实际采用情况验证（推断）。
    summary_en: In October 2026, OpenAI, Google, Microsoft and Anthropic said they will adopt a shared
      "policy token" signal proposed within the IETF by Anthropic standards technical lead Kevin Kelley,
      placed in a site's robots.txt so publishers can express AI training preferences to multiple AI companies
      at once. If implemented, it would lower publishers' cost of negotiating with each vendor and could
      change how AI training data is acquired and how compliance is delivered; effects on training costs
      and data competition remain to be seen in actual adoption (inference).
    event_summary_zh: 2026年10月，OpenAI、Google、Microsoft 与 Anthropic 表示将采用一项写入 robots.txt 的共享“policy token”标准，让发布者一次性对多家
      AI 公司设置训练数据偏好；该提案由 Anthropic 的 Kevin Kelley 在 IETF 提出。
    event_summary_en: In October 2026, OpenAI, Google, Microsoft and Anthropic said they will adopt a
      shared "policy token" standard in robots.txt that lets publishers set AI training preferences for
      multiple companies at once; the proposal was made by Anthropic's Kevin Kelley within the IETF.
