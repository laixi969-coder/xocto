    name: Travel Tech Funding
    decision: market_context
    summary_zh: 2026年前三季度，旅游科技初创公司共融资22亿美元，按融资额与交易数量计可能创2018年以来最低，尽管一批主打AI的旅游创业公司仍在融资。这表明AI并未扭转该赛道的资本收缩，AI旅游应用的扩张将更依赖有限资本下的商业化验证（推断）。
    summary_en: Through the first three quarters of 2026, travel tech startups raised $2.2 billion, potentially
      the lowest since at least 2018 by both dollars and deal count, even as a wave of AI-focused travel
      startups continues to raise. This indicates AI has not reversed the sector's capital contraction,
      and expansion of AI travel applications will depend more on commercial validation under limited
      capital (inference).
    event_summary_zh: 2026年前三季度旅游科技初创公司融资22亿美元，融资额与交易数量可能为2018年以来最低，AI创业公司未能扭转融资放缓。
    event_summary_en: Travel tech startups raised $2.2 billion in the first three quarters of 2026, potentially
      the lowest dollars and deal count since at least 2018, with AI startups failing to reverse the funding
      slowdown.
