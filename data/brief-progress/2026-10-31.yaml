    slug: 65-of-ai-assisted-shoppers-trust-creator-reviews-to-validate
    name: '65% of AI-assisted shoppers trust creator reviews to validate product recommendations: IAB'
    decision: market_context
    summary_zh: IAB于2026年10月30日发布数据称，65%的AI辅助购物者信任创作者评测以验证产品推荐。该数据表明AI辅助购物中的推荐验证环节仍依赖创作者内容，对AI购物应用意味着推荐可信度建设与内容合作是采用与转化的关键（推断）。
    summary_en: On October 30, 2026, IAB released data showing that 65% of AI-assisted shoppers trust
      creator reviews to validate product recommendations. The data indicates that recommendation validation
      in AI-assisted shopping still relies on creator content, implying for AI shopping applications that
      building recommendation credibility and content partnerships is key to adoption and conversion (inference).
    event_summary_zh: IAB于2026年10月30日发布数据：65%的AI辅助购物者信任创作者评测以验证产品推荐。
    event_summary_en: On October 30, 2026, IAB released data showing that 65% of AI-assisted shoppers
      trust creator reviews to validate product recommendations.
