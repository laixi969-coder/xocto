    slug: 英特尔盘前暴跌近25营收指引远逊预期pc疲软至少拖到2027年-市场参考
    name: Intel
    decision: market_context
    summary_zh: 英特尔在2026年10月30日发布低于市场预期的第四季度业绩指引，并警告个人电脑市场疲软与内存价格上涨可能持续至2027年上半年，当日股价盘中跌幅一度超过30%。这一变化意味着PC相关芯片需求与内存成本压力将持续，进而影响端侧AI
