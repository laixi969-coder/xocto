  basically-no-one-is-using-ai-agents-for-their-doordash-order:
    slug: basically-no-one-is-using-ai-agents-for-their-doordash-order
    name: DoorDash
    decision: market_context
    summary_zh: DoorDash 首席执行官 Tony Xu 在 2026 年第三季度财报电话会上表示，外部 AI 代理自上线以来仅在其平台产生数百笔订单，而该季度平台总订单量接近 10
      亿笔。这一数据表明，在点餐这类低决策成本的简单任务上，代理式购物尚未形成实际采用；Xu 认为代理的价值更可能出现在需要长时间考虑的大额购买决策中（推断：这意味着代理渠道短期内难以成为高频消费平台的增量入口）。
    summary_en: 'On its Q3 2026 earnings call, DoorDash CEO Tony Xu said outside AI agents have generated
      only several hundred orders since launch, against just under 1 billion total orders in the quarter.
      The figure shows agentic commerce has yet to gain real adoption for simple, low-consideration tasks
      like food ordering; Xu sees agent value more in long-consideration, high-stakes purchases (inference:
      agent channels are unlikely to become a meaningful incremental entry point for high-frequency consumer
      platforms in the near term).'
    event_summary_zh: DoorDash 披露 2026 年第三季度外部 AI 代理累计仅带来数百笔订单，占该季度近 10 亿笔总订单的极小比例。
    event_summary_en: DoorDash disclosed that outside AI agents produced only several hundred orders cumulatively,
      a negligible share of the nearly 1 billion orders it handled in Q3 2026.
