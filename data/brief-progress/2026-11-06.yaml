      than 4x the $389 million recorded in all of 2025, with three companies accounting for most of the
      funding; labor shortages and the AI data-center building boom are intensifying competition for workers
      and pushing contractors toward automated construction technology. This signals a marked increase
      in capital available to construction automation, which could accelerate deployment and competition
      for related AI applications on job sites.
    event_summary_zh: 2026年至10月29日，建筑与机器人领域公司融资约16亿美元，超过2025年全年3.89亿美元的四倍，其中三家公司占大部分资金；Bedrock Robotics的自主挖掘系统已在得克萨斯州和内华达州的商业项目中无人工操作运行。
    event_summary_en: Through Oct. 29, 2026, companies spanning construction and robotics raised about
      $1.6 billion, more than 4x the $389 million recorded in all of 2025, with three companies accounting
      for most of it; Bedrock Robotics said its autonomous excavator systems were operating without human
      operators on commercial projects in Texas and Nevada.
