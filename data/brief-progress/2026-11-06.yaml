    decision: market_context
    summary_zh: 2026年至10月29日，建筑机器人相关公司融资约16亿美元，超过2025年全年3.89亿美元的4倍，主要由三家公司贡献大部分资金；劳动力短缺与AI数据中心建设热潮加剧用工竞争，推动承包商采用自动化施工技术。这意味着建筑自动化领域的资本供给显著增加，可能加快相关AI应用在工地的部署与竞争。
