    slug: 360参与发起智能体发展自律公约-助力构建可信智能体生态
    name: '360'
    decision: market_context
    summary_zh: 2026年11月，360参与发起《智能体发展自律公约》，推动建立可信智能体生态。该公约属于行业自律性安排，反映智能体应用在安全与可信方面的治理需求上升，可能影响企业部署智能体时的合规与交付要求；材料未披露具体条款或约束力，相关影响为推断。
    summary_en: In November 2026, 360 co-initiated the Self-Discipline Convention on Agent Development
      to help build a trustworthy agent ecosystem. The convention is an industry self-regulatory arrangement,
      reflecting rising governance demand around agent safety and trustworthiness; it may affect compliance
      and delivery requirements for enterprises deploying agents. The material does not disclose specific
      provisions or binding force, so these implications are inferred.
    event_summary_zh: 2026年11月，360参与发起《智能体发展自律公约》，助力构建可信智能体生态。
    event_summary_en: In November 2026, 360 co-initiated the Self-Discipline Convention on Agent Development
      to help build a trustworthy agent ecosystem.
  404media-3:
    slug: 404media-3
    name: Proton
    decision: market_context
    summary_zh: 2026年10月，Proton计划就AI对员工进行“重新面试”以决定岗位去留，随后其CEO取消了该计划；同期有报道称美国选民对AI数据中心持压倒性反对态度。企业以AI为由重审岗位引发争议并被迫撤回，显示AI引入在组织与用工层面的阻力，可能影响企业AI部署的推进节奏与公众接受度；选民态度与数据中心建设的关系为推断。
    summary_en: In October 2026, Proton planned to 're-interview' staff about AI to decide who keeps their
      jobs, and its CEO subsequently canceled the plan; meanwhile, reports said American voters overwhelmingly
      reject AI data centers. A company's AI-driven job review drew controversy and was withdrawn, showing
      organizational and workforce resistance to AI adoption that may affect the pace of enterprise AI
      rollouts and public acceptance; the link between voter sentiment and data center construction is
      inferred.
    event_summary_zh: 2026年10月，Proton计划就AI对员工进行“重新面试”以决定岗位去留，随后其CEO取消了该计划。
    event_summary_en: In October 2026, Proton planned to 're-interview' staff about AI to decide who keeps
      their jobs, and its CEO subsequently canceled the plan.
