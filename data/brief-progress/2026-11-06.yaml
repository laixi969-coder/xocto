      workforce. The change means AI assistants are reaching large student populations through institutional
      education channels, potentially lowering barriers to student use and driving adoption of AI tools
      in higher-education delivery; the material does not disclose the number of institutions, coverage
      scale or pricing terms, so impact is inferred.
