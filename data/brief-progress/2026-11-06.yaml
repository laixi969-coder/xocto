      geometry and textures. This shows neural rendering being brought to the streaming version of an
      already-released game; by inference it raises the visual-quality bar for cloud gaming and increases
      demand for GPU inference capacity.
    event_summary_zh: Hogwarts Legacy 于 2026 年 11 月 5 日在 GeForce NOW 上线 NVIDIA DLSS 5 与 3D-Guided Neural
      Rendering 更新，提升光照与材质细节并保留原有几何与纹理。
