    summary_zh: Google 于 2026 年 11 月 5 日发布 Gemini Omni 1.2 Flash，支持原生 15 秒视频生成与编辑、更强一致性，并将价格下调 30%。对 AI
      应用而言，更长的原生视频片段与更低单价降低了视频生成类应用的调用成本，可能加剧视频生成模型在价格与可用时长上的竞争（推断）。
    summary_en: On November 5, 2026, Google released Gemini Omni 1.2 Flash, adding native 15-second video
      generation and editing, stronger consistency and a 30% price cut. For AI applications, longer native
      clips and a lower unit price reduce the cost of calling video-generation models and may intensify
      competition on price and usable clip length among video-generation models (inference).
    event_summary_zh: Google 发布 Gemini Omni 1.2 Flash，支持原生 15 秒视频生成与编辑、更强一致性，价格降低 30%。
