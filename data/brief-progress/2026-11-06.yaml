    name: AI talent and acquisition moves
    decision: market_context
    summary_zh: 2026 年 11 月初，AI 行业出现多项人事与并购变动：Cat Wu 离开 Anthropic 的 Claude Code 团队转投 OpenAI 负责核心产品 PM，Sharon
      Zhou 离开 AMD 加入 Anthropic，Factory 收购 HumanLayer，Meta 收购 Conductor。这些变动表明头部 AI 公司正在争夺产品负责人和智能体基础设施团队，可能加快产品迭代节奏并加剧竞争（推断）。
    summary_en: 'In early November 2026, the AI industry saw several personnel and acquisition moves:
      Cat Wu left Anthropic''s Claude Code team to lead Core Products PM at OpenAI, Sharon Zhou left AMD
      for Anthropic, Factory acquired HumanLayer, and Meta acquired Conductor. These moves indicate that
      leading AI companies are competing for product leaders and agent-infrastructure teams, which may
      accelerate product iteration and intensify competition (inference).'
    event_summary_zh: Cat Wu 离开 Anthropic 加入 OpenAI 负责核心产品 PM，Sharon Zhou 离开 AMD 加入 Anthropic，Factory
      收购 HumanLayer，Meta 收购 Conductor。
    event_summary_en: Cat Wu left Anthropic to lead Core Products PM at OpenAI, Sharon Zhou left AMD for
      Anthropic, Factory acquired HumanLayer, and Meta acquired Conductor.
