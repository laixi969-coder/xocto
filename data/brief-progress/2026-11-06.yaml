    name: NVIDIA
    decision: market_context
    summary_zh: NVIDIA 于 2026 年 11 月发布技术说明，称其已率先在加速计算栈中采用 HBM3e 与 HBM4，并以 GPU、CPU、网络、存储与软件的全栈协同设计应对大模型、长上下文与智能体应用带来的显存压力。这意味着
      AI 推理与智能体部署的显存成本压力短期内难以缓解，厂商竞争将更多转向内存层级利用效率而非单纯堆叠容量（推断）。
    summary_en: In November 2026 NVIDIA published a technical note saying it was first to adopt HBM3e
      and HBM4 into its accelerated computing stack and is addressing memory pressure from larger models,
      longer contexts and agentic applications through full-stack codesign of GPUs, CPUs, networking,
      storage and software. This implies that memory cost pressure on AI inference and agent deployment
      is unlikely to ease in the near term, and competition will shift toward efficiency in using the
      memory hierarchy rather than raw capacity alone (inference).
    event_summary_zh: NVIDIA 于 2026 年 11 月 5 日发布技术博客，说明其率先将 HBM3e 与 HBM4 引入加速计算栈，并通过 GPU、CPU、网络、存储与软件的全栈协同设计提升每字节内存的有效算力，以应对模型变大、上下文变长和智能体应用带来的显存压力。
    event_summary_en: On November 5, 2026, NVIDIA published a technical blog stating it was first to bring
      HBM3e and HBM4 into its accelerated computing stack and uses full-stack codesign across GPUs, CPUs,
      networking, storage and software to get more useful work per byte of memory, addressing memory pressure
      from larger models, longer contexts and agentic applications.
