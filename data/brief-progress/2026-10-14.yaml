    summary_zh: 卫星运营商在轨采集影像或传感数据后，过去需把原始数据下传地面站再排队处理，延迟高、带宽贵。Satlyt 提供可装在多家厂商卫星上的开放软件，让 AI 在星上直接处理这些数据，输出处理后的结果而非原始数据流；具体支持哪些模型、算力平台与交付形态仍待核验。
    inspiration: 趋势：算力正从地面数据中心向在轨边缘迁移，卫星不再只是采集端。切入：可从遥感影像、海事与农业监测这类对时效敏感、下传带宽成本高的数据方切入，按处理结果或数据订阅收费；但轨道硬件周期长、客户集中，早期更适合与已有星座运营商绑定，而非自建星座。
    summary_en: Satellite operators that collect imagery or sensor data in orbit must downlink raw data
      to ground stations and queue it for processing, which is slow and bandwidth-expensive. Satlyt offers
      open software installable on satellites from multiple vendors so AI processes that data on-orbit
      and returns processed output rather than raw streams; which models, compute platforms and delivery
      forms are supported remains unverified.
    inspiration_en: 'Trend: compute is migrating from ground data centers to on-orbit edge, so satellites
      become processing nodes, not just sensors. Entry: start with time-sensitive, bandwidth-expensive
      data such as remote sensing, maritime and agricultural monitoring, charging per processed result
      or data subscription; long hardware cycles and concentrated buyers favor partnering with existing
      constellation operators rather than building one.'
