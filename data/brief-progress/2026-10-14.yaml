full:
  muse-by-meta:
    slug: muse-by-meta
    name: Meta Muse
    decision: watching
    event_summary_zh: 2026年10月，Meta 发布 Muse 系列前沿模型（Muse Wonder 与 Muse Wonder Full），据公开报道其部分基准成绩超过 Fable
      与 Astra，并引发分析师对 Meta 的看多评级。
    event_summary_en: In October 2026, Meta released the Muse frontier model family (Muse Wonder and Muse
      Wonder Full), reported to beat Fable and Astra on some benchmarks, drawing a bullish analyst call
      on Meta.
    category: 基础层
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Meta 于 2026 年 10 月发布 Muse 系列前沿模型，属模型层发布而非独立应用产品；公开材料只给出基准对比与分析师评级，未提供可核验的独立产品工作流、定价或客户采用事实。
    inspiration: 模型层竞争加剧会压低推理成本、抬高应用侧可交付上限，但本条只说明供给端变化，不构成可抄的应用切口；对创业者的意义在于观察哪类旧流程会因成本下降首次变得可自动化。
    summary_en: Meta released the Muse frontier model family in October 2026; this is a model-layer release
      rather than a standalone application, and public material offers only benchmark comparisons and
      analyst ratings, with no verifiable product workflow, pricing, or customer adoption facts.
    inspiration_en: Intensifying model-layer competition tends to lower inference costs and raise what
      applications can deliver, but this item only describes supply-side change and offers no replicable
      application wedge; its value to founders is watching which legacy workflows become automatable for
      the first time as costs fall.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人事务与日程处理、跨应用信息检索与整理、日常写作与内容草稿
        job_en: Personal task and schedule handling, Cross-app information retrieval and organizing, Everyday
          writing and content drafting
        pain_zh: 它试图减少完成这项任务时的摩擦；公开用户材料尚未说明不解决的具体代价、发生频率或后果。
        pain_en: The product targets friction in this job, but public user evidence does not yet show
          the cost, frequency, or consequence of leaving it unsolved.
        current_alternative_zh: 公开材料尚未说明用户目前如何完成这项工作、它实际替代了什么。
        current_alternative_en: Public materials do not yet show how users complete this job today or
          what they replace.
        usage_reason_zh: 用户要完成的任务是：个人事务与日程处理、跨应用信息检索与整理、日常写作与内容草稿；现有材料尚未说明，用户相较原有做法为什么会选择它。
        usage_reason_en: 'The task is: Personal task and schedule handling, Cross-app information retrieval
          and organizing, Everyday writing and content drafting Public materials do not yet explain why
          users choose this product over their existing approach.'
      gates:
      - gate: value
        status: supported
        reason: 它试图帮助用户完成：“普通用户在需要跨应用处理日程、检索资料或起草文字时打开它，把自然语言任务交给代理执行；公开材料只说明它是“帮你把事情做完”的个人AI代理，具体接收哪些数据、执行哪些动作、交付什么结”。公开用户材料同时记录了痛点或既有替代行为，价值结构已有依据。
        evidence_ids:
        - ev-57c7b6287708e7cd
      - gate: consensus
        status: insufficient
        reason: 未见持续使用、部署、复购或公开用户反馈，不能据此判断是否形成共识。
        evidence_ids:
        - ev-e7115adeaa48190f
      - gate: model
        status: insufficient
        reason: 付钱的人尚未核验：未见付费主体、定价或单位经济；这是模式缺口，不是需求不存在。
        evidence_ids: []
      - gate: truth
        status: insufficient
        reason: 交付能否确定发生、以及人工/安全边界，尚缺可复现的公开证据。
        evidence_ids: []
      next_validation: 公开补证：查找官方定价、客户案例或部署文档，确认谁付钱、不使用的代价及可确定交付的结果。
  adhelm-cli:
    slug: adhelm-cli
    name: AdHelm CLI
    decision: watching
    category: AI + 商业
    project_type: open_source
    industries:
    - 广告与营销服务
    - 软件与互联网服务
    industries_en:
    - Advertising and marketing services
    - Software and internet services
    jobs:
    - 广告投放运营人员
    - 增长营销负责人
    jobs_en:
    - Ad operations specialist
    - Growth marketing lead
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 广告投放人员原本要在各广告平台后台之间切换、手工改预算和出价；AdHelm CLI 是一个开源命令行工具，让操作者在终端里对广告账户执行管理动作，最终拿到的是账户配置的变更结果。它具体接管哪些平台、哪些投放动作，以及是否需要人工复核，公开材料尚未说明，具体流程与交付仍待核验。
    inspiration: 趋势：广告投放这类高度重复、跨后台的运营动作，正在被命令行和脚本化接口重新组织，而不是继续留在网页后台里点。切入：可以从独立站卖家、投放代运营团队这类同时管多个广告账户的小团队进入，先做批量改预算、批量暂停这类高频动作，按账户数或代管规模收费；但公开材料未披露定价，也未说明支持哪些广告平台，这是判断不是已验证事实。
    summary_en: Ad buyers used to switch between ad platform dashboards and change budgets and bids by
      hand; AdHelm CLI is an open-source command-line tool that lets an operator run management actions
      on ad accounts from a terminal, with the account configuration change as the output. Which platforms
      and which campaign actions it actually covers, and whether a human still reviews changes, are not
      stated in the public material, so the exact workflow and deliverable remain unverified.
    inspiration_en: 'Trend: repetitive cross-dashboard ad operations are being reorganised into command-line
      and scripted interfaces instead of staying inside web dashboards. Entry point: start with small
      teams such as independent store sellers or ad agencies that manage several ad accounts at once,
      doing high-frequency actions like bulk budget edits and bulk pausing, and charge per account or
      per managed spend; no pricing is disclosed, so this is a judgement, not a verified fact.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 广告投放运营人员在同时管理多个广告账户时，需要批量调整预算、出价或暂停投放，原本要在各平台后台逐个操作。
        job_en: An ad operations specialist managing several ad accounts at once needs to bulk adjust
          budgets, bids or pause campaigns, which previously meant editing each platform dashboard one
          by one.
        pain_zh: 跨后台重复点击、口径不一致、改错难回滚，是投放日常里最耗时的部分；不做的代价是预算继续按错误配置消耗。
        pain_en: Repeated cross-dashboard clicking, inconsistent settings and hard-to-roll-back mistakes
          are the most time-consuming part of daily ad operations; not fixing it means budget keeps burning
          on wrong settings.
        current_alternative_zh: 目前多数团队靠人工在网页后台操作，或用各平台自带脚本与第三方投放工具，但这些工具通常绑定单一平台。
        current_alternative_en: Most teams still work by hand in web dashboards, or use platform-native
          scripts and third-party ad tools that are usually tied to a single platform.
        usage_reason_zh: 推断：相较逐个后台手工改配置，命令行方式可以把同一批改动写成可复用、可审计的指令，减少重复点击和漏改，因此同时管多个账户的小团队会在批量调整时选择它；公开材料没有用户反馈或留存证据，无法确认它已被长期留在工作流里。
        usage_reason_en: 'Inference: compared with editing each dashboard by hand, a command-line approach
          turns the same batch of changes into reusable, auditable commands, cutting repeated clicking
          and missed edits, so small teams managing several accounts would pick it for bulk changes; there
          is no public user feedback or retention evidence confirming it is kept in the workflow long
          term.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨广告后台重复操作、批量改配置的需求，痛点具体且不做的代价是预算按错误配置消耗；但公开材料未说明支持哪些平台，价值判断基于工作流推理。
        evidence_ids:
        - ev-e04422dd31b1eed3
      - gate: consensus
        status: insufficient
        reason: 只有一条产品页描述，没有用户评价、社区讨论或采用数据，无法判断投放人员是否真的会从网页后台转向命令行。
        evidence_ids:
        - ev-e04422dd31b1eed3
      - gate: model
        status: insufficient
        reason: 未披露定价、买方或收费方式；广告代运营团队与独立站卖家是可能的付费方，但这是判断，不是已验证事实。
        evidence_ids:
        - ev-e04422dd31b1eed3
      - gate: truth
        status: insufficient
        reason: 无法核对它是否真能确定性执行广告账户变更、是否需人工复核、出错如何回滚，这些是交付可信度的关键缺口。
        evidence_ids:
        - ev-e04422dd31b1eed3
      next_validation: 收集 AdHelm CLI 的官方仓库或文档，确认其支持的广告平台清单、可执行的投放动作范围以及是否提供变更审计与回滚说明。
  agent-security:
    slug: agent-security
    name: agent-security
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与互联网服务
    - 信息安全服务
    industries_en:
    - Software and internet services
    - Information security services
    jobs:
    - 平台工程师
    - 安全工程师
    jobs_en:
    - Platform engineer
    - Security engineer
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发团队让 AI 编码代理在本机执行命令、读写文件时，缺少一层可控的边界；agent-security 是一个本地优先的开源网关，在设备上对代理的工具调用施加策略、检测密钥泄露并记录动作，最终产出的是被拦截或放行的调用记录与审计日志。策略如何配置、误拦如何处理，公开材料未说明，具体流程仍待核验。
    inspiration: 趋势：随着编码代理拿到终端和文件系统权限，安全边界从“管人”变成“管代理的每一次工具调用”，这类控制点正在成为新的基础设施位置。切入：可以从已经把编码代理接进 CI 或本地开发流程的中小工程团队进入，先做密钥外泄拦截和调用审计这类可核对的结果，按开发者席位或仓库数收费；公开材料未披露定价，也未给出客户案例，这是判断不是已验证事实。
    summary_en: When a development team lets an AI coding agent run commands and read or write files on
      a machine, there is no controllable boundary; agent-security is a local-first open-source gateway
      that applies policies to the agent's tool calls on-device, detects secrets and records actions,
      producing blocked or allowed call records and an audit log. How policies are configured and how
      false blocks are handled are not stated, so the exact workflow remains unverified.
    inspiration_en: 'Trend: as coding agents gain terminal and filesystem access, the security boundary
      shifts from managing people to managing every tool call an agent makes, and this control point is
      becoming a new infrastructure position. Entry point: start with small engineering teams that already
      run coding agents in CI or local development, deliver checkable outcomes such as secret-leak blocking
      and call auditing, and charge per developer seat or per repository; no pricing or customer cases
      are disclosed, so this is a judgement, not a verified fact.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 平台或安全工程师在把 AI 编码代理接入本地开发或 CI 流程时，需要限制代理能调用哪些工具、能碰哪些文件，并留下可追溯记录。
        job_en: A platform or security engineer wiring an AI coding agent into local development or CI
          needs to limit which tools and files the agent can touch and keep a traceable record.
        pain_zh: 代理一旦拿到终端权限，误删文件、把密钥写进日志或调用外部接口都可能在无人察觉时发生；不设边界的代价是一次事故就足以让团队停用代理。
        pain_en: Once an agent has terminal access, deleting files, leaking secrets into logs or calling
          external endpoints can happen unnoticed; the cost of no boundary is that one incident can make
          a team abandon the agent.
        current_alternative_zh: 目前多数团队靠人工审查代理输出、限制运行环境，或干脆不给代理写权限，缺少针对工具调用这一层的统一策略。
        current_alternative_en: Most teams rely on manually reviewing agent output, sandboxing the runtime,
          or simply withholding write access, with no unified policy at the tool-call layer.
        usage_reason_zh: 推断：相较人工审查输出或直接不给写权限，本地网关在调用发生的那一刻做拦截和记录，把事后排查变成事前阻断，因此已经在用编码代理的工程团队会在放开权限前先接入它；仓库仅
          69 星、无 issue 讨论，尚无采用或留存证据。
        usage_reason_en: 'Inference: compared with reviewing output afterwards or withholding write access,
          a local gateway blocks and records at the moment of the call, turning after-the-fact investigation
          into pre-emptive blocking, so teams already using coding agents would adopt it before granting
          broader permissions; with only 69 stars and no issue discussion, there is no adoption or retention
          evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理获得终端权限后缺少工具调用边界的需求，痛点是密钥外泄与误操作不可控，不设边界的代价明确；判断基于工作流推理。
        evidence_ids:
        - ev-9e282935c5c4eee6
      - gate: consensus
        status: insufficient
        reason: 仓库 69 星、1 个 fork、0 个 issue，没有用户反馈或社区讨论，无法判断工程团队是否真的会在放开代理权限前接入。
        evidence_ids:
        - ev-9e282935c5c4eee6
      - gate: model
        status: insufficient
        reason: 未披露定价与买方；可能由工程团队自建或按席位采购，但这是判断，不是已验证事实。
        evidence_ids:
        - ev-9e282935c5c4eee6
      - gate: truth
        status: insufficient
        reason: 无法核对策略配置方式、误拦处理与审计日志的完整性，这些决定它能否被当作确定性安全边界使用。
        evidence_ids:
        - ev-9e282935c5c4eee6
      next_validation: 收集 agent-security 仓库的 README 与 issue/discussion，确认策略配置方式、支持的代理与工具范围，以及是否有团队公开报告实际拦截或审计结果。
  agor:
    slug: agor
    name: Agor
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与互联网服务
    industries_en:
    - Software and internet services
    jobs:
    - 软件工程师
    - 技术团队负责人
    jobs_en:
    - Software engineer
    - Engineering team lead
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 工程师独自跑编码代理时，进度、上下文和结果只留在自己机器上；Agor 是一个开源项目，定位为让多人共同运行和查看代理，最终产出的是团队共享的代理运行状态。它具体共享哪些内容、如何合并多人操作，公开材料只有一句描述，具体流程与交付仍待核验。
    inspiration: 趋势：编码代理从个人工具变成团队协作对象，围绕代理的共享状态、分工和交接正在形成新的协作层。切入：可以从已经多人同时使用编码代理的工程团队进入，先解决代理运行状态与上下文的共享，按团队或席位收费；公开材料未披露定价、客户或使用数据，这是判断不是已验证事实。
    summary_en: When an engineer runs a coding agent alone, progress, context and results stay on that
      one machine; Agor is an open-source project positioned as letting several people run and view agents
      together, with shared agent run state as the output. What exactly is shared and how multiple people's
      actions are merged is not described beyond one line, so the workflow and deliverable remain unverified.
    inspiration_en: 'Trend: coding agents are moving from a personal tool to a team object, and a new
      collaboration layer around shared agent state, division of labour and handover is forming. Entry
      point: start with engineering teams where several people already run coding agents, solve sharing
      of agent run state and context first, and charge per team or per seat; no pricing, customers or
      usage data are disclosed, so this is a judgement, not a verified fact.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 软件工程师在团队里同时运行多个编码代理时，需要让别人看到代理在做什么、接手未完成的运行，原本只能靠口头同步或各自重跑。
        job_en: A software engineer running several coding agents inside a team needs others to see what
          the agents are doing and take over unfinished runs, which previously meant verbal sync or re-running
          everything.
        pain_zh: 代理运行状态不共享会造成重复劳动和上下文丢失，但公开材料没有说明这种重复在团队里有多频繁、代价有多大。
        pain_en: Unshared agent run state causes duplicated work and lost context, but the public material
          does not show how often this happens in teams or how costly it is.
        current_alternative_zh: 目前团队通常各自在本地跑代理，用聊天工具同步进度，或把结果提交到代码仓库让同事查看。
        current_alternative_en: Teams today usually run agents locally, sync progress in chat, or push
          results to a code repository for colleagues to review.
        usage_reason_zh: 推断：相较口头同步或各自重跑，共享代理运行状态可以让同事直接接手未完成的运行，减少重复劳动，因此多人同时用编码代理的团队可能选择它；但公开材料只有一句定位描述，连共享的具体对象都未说明，无法确认用户会采用。
        usage_reason_en: 'Inference: compared with verbal sync or re-running, shared agent run state lets
          a colleague pick up an unfinished run, reducing duplicated work, so teams running agents in
          parallel might choose it; but the public material is a single positioning line that does not
          even state what is shared, so adoption cannot be confirmed.'
      gates:
      - gate: value
        status: challenged
        reason: 它试图解决多人运行编码代理时状态不共享的问题，但公开材料只有一句定位，连共享什么、谁在什么情况下用都写不出来，痛点强度无法判断。
        evidence_ids:
