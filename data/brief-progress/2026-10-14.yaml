        pain_zh: 自己看不出问题在哪，找同行或导师点评要排队、要人情，通用聊天工具给的建议又太泛，落不到具体镜头或段落。
        pain_en: They cannot see what is wrong, peer or mentor critique requires queuing and favors, and
          general chat tools give advice too generic to apply to a specific shot or section.
        current_alternative_zh: 发到社群求点评、找前辈付费咨询，或用通用聊天工具问一遍再自己筛。
        current_alternative_en: Posting to communities for critique, paying a senior for consultation,
          or asking a general chat tool and filtering the answer themselves.
