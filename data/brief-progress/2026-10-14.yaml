        evidence_ids:
        - ev-e94b71f364c8f2fb
      - gate: truth
        status: insufficient
        reason: 识别模型、是否离线、准确率与人工校对边界均未披露，交付确定性无法核对。
        evidence_ids:
        - ev-e94b71f364c8f2fb
      next_validation: 收集 Sayso 仓库 README 与 release 说明，确认所用语音识别模型、是否支持离线运行及准确率或校对要求。
