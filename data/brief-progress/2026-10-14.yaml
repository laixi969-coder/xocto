    jobs:
    - 云平台工程师在需要把 AWS 依赖迁到自有硬件时，用现有 AWS CLI 脚本和 IAM 策略在本地集群上跑通 EC2/S3/EKS 工作负载
    jobs_en:
    - Cloud platform engineers who need to move AWS-dependent workloads onto their own hardware, running
      EC2/S3/EKS workloads on local clusters using existing AWS CLI scripts and IAM policies
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向需要摆脱公有云账单或数据出境的云平台工程师：他们原本要重写 Terraform、CLI 脚本和 IAM 策略才能迁到私有硬件，Spinifex 让 AWS CLI 命令保持不变，在本机硬件上直接跑
      EC2/S3/IAM/EKS 等价服务。用户拿到的是可继续用原有脚本操作的本地云环境；具体兼容边界与生产可用性仍待核验。
    inspiration: 趋势：把公有云 API 兼容层搬到自有硬件，正在从大厂专属能力变成开源项目，说明「云退出成本」本身成了可产品化的痛点。切入：先服务被 AWS 账单或合规逼着做私有化、但不愿重写工具链的中小云团队与受监管行业
      IT 部门，按节点或按迁移项目收费；不要从通用 IaaS 正面打，从「AWS CLI 不改一行」的迁移切口进。
    summary_en: 'For cloud platform engineers who need to escape public-cloud bills or data-residency
      constraints: instead of rewriting Terraform, CLI scripts and IAM policies to move onto private hardware,
      Spinifex keeps AWS CLI commands unchanged and runs EC2/S3/IAM/EKS-equivalent services on local hardware.
      The deliverable is a local cloud environment operable with existing scripts; compatibility boundaries
      and production readiness still need verification.'
    inspiration_en: 'Trend: moving a public-cloud API compatibility layer onto owned hardware is shifting
      from a hyperscaler-only capability to open-source projects, meaning cloud exit cost itself is becoming
      a productizable pain point. Entry: start with small cloud teams and regulated-industry IT departments
      forced into private deployment by AWS bills or compliance but unwilling to rewrite their toolchain,
      charging per node or per migration project; do not attack generic IaaS head-on, enter through the
      ''AWS CLI unchanged'' migration wedge.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 云平台工程师在云账单或数据合规压力下，需要把跑在 AWS 上的服务迁到自有硬件，同时保留现有 CLI 脚本、IAM 策略和 S3 调用方式。
        job_en: Under cloud-bill or data-compliance pressure, cloud platform engineers must move AWS-hosted
          services onto their own hardware while keeping existing CLI scripts, IAM policies and S3 call
          patterns.
        pain_zh: 迁到私有云通常意味着重写 Terraform、CLI 脚本和权限模型，迁移工期长且容易出错，团队因此迟迟不动。
        pain_en: Moving to private cloud usually means rewriting Terraform, CLI scripts and permission
          models, making migration long and error-prone, so teams keep postponing it.
        current_alternative_zh: 继续付公有云账单，或改用 OpenStack、VMware 等私有云并重写整套工具链，或自建脚本封装。
        current_alternative_en: Keep paying public-cloud bills, or switch to OpenStack/VMware private
          cloud and rewrite the whole toolchain, or hand-roll wrapper scripts.
        usage_reason_zh: 推断：因为 AWS CLI 命令保持不变，工程师不必重写脚本和权限配置就能在自有硬件上跑通同等服务，省掉迁移中最耗时的一步改写工作，因此被账单或合规逼着私有化、又不想动工具链的团队会先试用它。
        usage_reason_en: 'Inference: because AWS CLI commands stay unchanged, engineers can run equivalent
          services on their own hardware without rewriting scripts and permission configs, removing the
          most time-consuming rewrite step of migration, so teams pushed to privatize by bills or compliance
          but unwilling to touch their toolchain will try it first.'
      gates:
      - gate: value
        status: supported
        reason: 它解决云迁移中重写工具链这一具体负担，痛点由账单与合规压力驱动，旧做法是继续付费或整体换私有云栈，结构上成立。
        evidence_ids:
        - ev-2e4689cff207a9f1
      - gate: consensus
        status: insufficient
        reason: 社区讨论量很小，尚无客户案例或企业采用证据，无法判断团队是否真的把它放进迁移流程。
        evidence_ids:
        - ev-2e4689cff207a9f1
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明商业主体、支持服务或收费方式，买方与付费路径均未核验。
        evidence_ids:
        - ev-2bc29ac9dc054138
      - gate: truth
        status: insufficient
        reason: 从 3 个 AWS 服务扩到 11 个说明迭代持续，但兼容深度、生产可用性与安全边界缺少公开验证材料。
        evidence_ids:
        - ev-2bc29ac9dc054138
      next_validation: 收集 Spinifex 官方文档或仓库中关于 AWS API 兼容范围与生产部署要求的说明页。
