        current_alternative_zh: 现有做法是用户自己在各 App 内手动完成，或使用系统语音助手、快捷指令等有限自动化。
        current_alternative_en: Today users do it manually inside each app, or rely on limited automation
          such as system voice assistants and shortcuts.
        usage_reason_zh: 推断：若智能体能直接接收意图并跨应用执行多步操作，用户可省去逐 App 点击与切换这一步；但公开材料未给出可核验的智能体能力、交付确定性或用户反馈，因此尚不能确认用户会因此选择它。
        usage_reason_en: 'Inference: if the agent can take intent and execute multi-step cross-app actions,
          users could skip the step of tapping and switching app by app; but the public material gives
