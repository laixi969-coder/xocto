        usage_reason_en: 'Inference: compared with per-machine SSH plus self-hosted dashboards, it gathers
          multi-machine state and actions into one console, removing the tool-switching and manual status
          aggregation step, so small teams without a dedicated SRE would pick it during incident triage;
          public material provides no user feedback or retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多台服务器状态分散、操作入口不统一的需求，痛点是逐台登录与面板切换，旧行为明确；买方与付费方式未说明。
        evidence_ids:
        - ev-6d8ad131628f4d1a
      - gate: consensus
        status: insufficient
        reason: 仅一句产品说明，没有用户评价、客户案例或采用数据，无法判断运维人群是否已形成共识。
        evidence_ids:
        - ev-6d8ad131628f4d1a
      - gate: model
        status: insufficient
        reason: 未见定价页，按机器数还是按席位收费不明，钱可能来自中小团队订阅，这是判断不是已验证事实。
        evidence_ids:
        - ev-6d8ad131628f4d1a
