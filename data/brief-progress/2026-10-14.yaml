        evidence_ids:
        - ev-13fd36bb2d88ba03
      - gate: model
        status: insufficient
        reason: 未进入：无对外定价、买方或收费路径信息。
        evidence_ids:
        - ev-13fd36bb2d88ba03
      - gate: truth
        status: insufficient
        reason: 未进入：无法核验对外交付的确定性与安全边界。
        evidence_ids:
        - ev-13fd36bb2d88ba03
      next_validation: 收集 Anthropic 关于 Antique 与 Scion 的官方工程博客或文档，核对其是否对外提供、支持哪些仓库规模与工作流。
