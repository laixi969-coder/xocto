  natural-language-security-queries-at-orca-security-using-ama:
    slug: natural-language-security-queries-at-orca-security-using-ama
    name: Orca Security Discovery AI
    decision: watching
    event_summary_zh: Orca Security 与 AWS 合作，基于 Amazon Bedrock 构建云安全自然语言查询代理 Discovery AI，将用户自然语言提问转换为
      Sonar 图谱的结构化 JSON 查询，相较基线降低了 90% 的查询成本、93% 的输入 token 与 75% 的延迟。
    event_summary_en: Orca Security partnered with AWS to build Discovery AI on Amazon Bedrock, translating
      natural language questions into structured Sonar graph queries across 900+ cloud models and reducing
      query cost by 90%, input tokens by 93%, and latency by 75% compared to baseline.
    category: AI + 效率
    project_type: ai_transformation
    industries:
    - 网络安全
    - 云计算
    industries_en:
    - Cybersecurity
    - Cloud Computing
    jobs:
    - 安全分析师
    - 安全运维工程师
    jobs_en:
    - Security Analyst
    - SecOps Engineer
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 安全分析师在排查多云基础设施安全风险时，无需手工编写包含复杂关系和算子的 JSON 查询；系统接收自然语言提问并转换为 Sonar 图谱查询语句，最终直接返回对应云资产风险的检索结果，分析师仅需核对查询条件与返回资产。
    inspiration: 趋势：复杂垂直领域 DSL 正在被自然语言编译器层替代，大模型充当结构化查询生成器。切入：面向已有复杂图谱或专有数据模型的 B2B 软件，构建针对特定领域元数据的 NL-to-Query
      中间件，按查询调用或席位升级收费。
    summary_en: Security analysts querying multi-cloud risks no longer need to write complex JSON queries
      across 900+ models; the tool translates natural language into structured Sonar graph queries, returning
      filtered cloud asset records for analyst verification.
    inspiration_en: 'Trend: Complex domain-specific DSLs are being abstracted away by LLM translation
      layers into graph queries. Angle: Build NL-to-DSL middleware for enterprise SaaS with intricate
      data models, monetized via usage-based query calls or tier upgrades.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全分析师在调查多云资产风险或应急响应时，面对 900 多类资源模型与 18 种运算符，需要快速检索出符合特定配置缺陷或风险关联的云资源。
        job_en: Security analysts investigating multi-cloud risks or incidents need to quickly filter
          and retrieve specific vulnerable cloud resources across 900+ models and 18 operators.
        pain_zh: Sonar 系统支持 900 多个模型与嵌套关系，分析师必须精准记忆模型名称并手写复杂 JSON 语法，构建门槛高且在排障紧急时刻极其耗时。
        pain_en: Sonar requires exact model names, nested relationship navigation, and 18 operators in
          manual JSON; building queries is slow and error-prone during urgent triage.
        current_alternative_zh: 分析师查阅内部文档字典，手工编写带有过滤算子和嵌套关系的 Sonar 专有 JSON 结构化查询，或依赖资深安全工程师协助编写。
        current_alternative_en: Analysts look up internal docs and manually draft proprietary Sonar JSON
          queries with operators and nested joins, or ask senior engineers for assistance.
        usage_reason_zh: 推断相较手工构造多层嵌套 JSON，产品通过自然语言直接编译出合规的 Sonar 结构化语法，省去了查阅模型字典与拼装算子的步骤，让不熟悉专有 DSL 的分析师也能在数秒内发起合规查询。
        usage_reason_en: Compared to manually assembling nested JSON, it compiles natural language into
          Sonar queries, removing manual syntax lookups and enabling fast investigation.
      gates:
      - gate: value
        status: supported
        reason: 解决安全分析师面对 900 多类模型手写专有 JSON 查询门槛高、排障耗时的刚性痛点，结构清晰且交付可核验。
        evidence_ids:
        - ev-cf3ec54071b8ff9b
      - gate: consensus
        status: supported
        reason: 官方披露已在内部实现查询成本降低 90%、延迟降低 75%，证明在核心安全图谱检索场景已被实际采用与优化。
        evidence_ids:
        - ev-cf3ec54071b8ff9b
      - gate: model
        status: insufficient
        reason: 属于 Orca 主平台内部集成的 AI 功能升级，未披露是否独立收费或作为高阶版权益，商业化变现路径尚不明确。
        evidence_ids:
        - ev-cf3ec54071b8ff9b
      - gate: truth
        status: supported
        reason: 将自然语言映射为专有 DSL 并在沙箱图谱中执行，输出受严格 Schema 约束，交付确定性高且有人工核对边界。
        evidence_ids:
        - ev-cf3ec54071b8ff9b
      next_validation: Orca Security 官方定价页或版本功能说明，以确认 Discovery AI 是作为全员标配基础能力还是高阶订阅专属权益。
