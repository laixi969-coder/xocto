      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: B2B 软件公司的竞争情报分析师或产品营销经理在准备竞品对战卡、赢单输单复盘、定位与定价材料、发布方案和销售赋能内容时，需要把分散的竞品信息整理成可交付材料。
        job_en: A competitive intelligence analyst or product marketing manager at a B2B software company
          needs to turn scattered competitor information into deliverable material when preparing battlecards,
          win-loss reviews, positioning and pricing material, launch plans and sales enablement content.
        pain_zh: 这类材料靠人工翻官网、销售反馈和零散笔记拼装，更新慢且版本混乱；不解决的后果是销售拿着过时对战卡去见客户。
        pain_en: Such material is assembled by hand from websites, sales feedback and scattered notes,
          so it updates slowly and versions diverge; the cost of not solving it is sellers meeting customers
          with outdated battlecards.
