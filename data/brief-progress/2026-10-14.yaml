    summary_zh: 做视频或图像生成的人在本地 ComfyUI 工作流里，需要调用 Seedance、Kling、FLUX LoRA、Suno 等 180 多个托管模型时，装上这套自定义节点，把请求发到云端按次付费出图出片，不必自备
