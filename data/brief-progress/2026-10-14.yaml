      - gate: value
        status: insufficient
        reason: 未进入：这是云平台授权与计费能力更新，不是独立产品，不做真需求判定。
        evidence_ids:
        - ev-bb72f4ce04d82d3a
      - gate: consensus
        status: insufficient
        reason: 未进入：无独立产品的采用或共识证据。
        evidence_ids:
        - ev-bb72f4ce04d82d3a
      - gate: model
        status: insufficient
        reason: 未进入：付费路径属于 AWS 平台自身计费体系，非独立产品模式。
        evidence_ids:
        - ev-bb72f4ce04d82d3a
      - gate: truth
        status: insufficient
        reason: 未进入：平台能力更新，不适用产品级求真检查。
        evidence_ids:
        - ev-bb72f4ce04d82d3a
