    event_summary_zh: 2026 年 10 月 2 日有报道称 arXiv 出台投稿新规，每人每月最多提交 2 篇，拒稿不退额度；同期一篇 2026 年 9 月 22 日发布的论文提出仅凭页面结构识别
      AI 生成网页内容。
    event_summary_en: On October 2, 2026, reports said arXiv introduced a submission cap of at most two
      papers per person per month with no quota refund on rejection; separately, a paper published September
      22, 2026 proposed identifying AI-generated web content from page structure alone.
    summary_zh: 这是学术预印本平台与检测研究层面的变化，不是独立产品：投稿额度收紧改变研究者的发布节奏，结构特征识别 AI 网页则为内容审核与搜索质量提供新的技术路径，两者对 AI 应用的成本与采用影响仍属推断。
    summary_en: 'This is a change at the preprint-platform and detection-research level, not a standalone
      product: tighter submission quotas change researchers'' publishing cadence, while structure-based
      AI web content detection offers a new technical path for content moderation and search quality;
      the cost and adoption impact on AI applications remains an inference.'
    inspiration: 趋势：AI 生成内容的识别开始从文本特征转向页面结构特征，同时预印本平台的供给端被限流。切入：内容审核、搜索质量与出版合规环节可能出现对结构级检测的需求，但需先确认该方法的误判率与可复现性。
    inspiration_en: 'Trend: detection of AI-generated content is shifting from text features toward page-structure
      features, while preprint platforms throttle supply. Entry: structure-level detection demand may
      appear in content moderation, search quality and publishing compliance, but the method''s false-positive
      rate and reproducibility must first be confirmed.'
