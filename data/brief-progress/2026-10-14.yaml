    summary_zh: 面向日常手机用户，在通勤或外出需要跨应用处理消息、日程和操作时打开；按发布说法，大模型原生智能体接收用户意图并代为执行多步手机操作，最终交付一个完成的任务结果，人工仍需确认关键动作。具体流程、可执行范围与交付边界仍待核验。
    inspiration: 趋势：大模型开始被塞进手机系统层，把“打开 App 一步步点”变成“说出意图让设备代办”，这会重划移动端入口与 App 分发。切入：不要做整机，先做某个高频旧流程的智能体层，例如出行改签、报销贴票、家庭账单核对，按完成的任务收费；窗口是否已关取决于系统级入口是否被厂商锁定。
    summary_en: For everyday phone users who, while commuting or out, need to handle messages, schedules
      and actions across apps; per the announcement, an LLM-native agent takes the user's intent and performs
      multi-step phone actions, delivering a completed task while the user still confirms key steps. The
      concrete flow, executable scope and delivery boundary remain unverified.
    inspiration_en: 'Trend: LLMs are being pushed into the phone system layer, turning ''open an app and
      tap step by step'' into ''state intent and let the device act'', which redraws the mobile entry
      point and app distribution. Entry: don''t build a handset; build the agent layer for one high-frequency
      legacy flow such as trip rebooking, expense receipt filing or household bill reconciliation, charging
      per completed task. Whether the window is still open depends on whether vendors lock the system-level
      entry.'
