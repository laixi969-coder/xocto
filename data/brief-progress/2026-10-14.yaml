    decision: watching
    category: AI + 效率
    project_type: new_application
    industries:
    - 企业通用办公
    - 教育与培训
    industries_en:
    - General corporate office work
    - Education and training
    jobs:
    - 需要做汇报材料的职场人
    - 教师与培训讲师
    jobs_en:
    - Office worker preparing a presentation
    - Teacher or corporate trainer
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 职场人和讲师在赶汇报、课件时，原本要自己找模板、逐页排版；AiPPT.cn 让用户输入主题或大纲，由 AI 生成整套演示文稿，最终拿到可继续编辑的 PPT 文件。它具体接收什么输入、生成后人工要改多少，公开材料未提供细节，具体流程与交付仍待核验。
    inspiration: 趋势：演示文稿这类高频、低差异化的办公产出，正在从“人排版”转向“人给大纲、机器出初稿”，价值从模板库转移到生成与改写环节。切入：可以从高校教师、企业培训这类课件需求稳定但预算有限的人群进入，按份数或按学期收费；公开材料未披露定价与客户，这是判断不是已验证事实。窗口方面，通用
      PPT 生成已是拥挤品类，正面拼模板数量意义不大，更可行的切口是绑定具体场景的模板与合规要求。
    summary_en: Office workers and trainers rushing a report or course deck used to find templates and
      lay out every slide by hand; AiPPT.cn takes a topic or outline and has AI generate a full presentation,
      with an editable PPT file as the output. What inputs it accepts and how much manual rework the draft
      needs are not detailed in the public material, so the workflow and deliverable remain unverified.
    inspiration_en: 'Trend: presentation work, a high-frequency and low-differentiation office output,
      is shifting from humans doing layout to humans giving an outline and machines producing a first
      draft, moving value from template libraries to generation and rewriting. Entry point: start with
      groups such as university teachers and corporate trainers whose deck needs are steady but budgets
      are limited, and charge per deck or per term; no pricing or customers are disclosed, so this is
      a judgement, not a verified fact. The generic PPT generation category is already crowded, so competing
      on template count is weak, and a more viable wedge is binding to a specific scenario''s templates
      and compliance requirements.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 职场人或培训讲师在临近汇报、上课时，需要把主题或大纲变成一套可用的演示文稿，原本要自己找模板并逐页排版。
        job_en: An office worker or trainer close to a report or class needs to turn a topic or outline
          into a usable deck, which previously meant finding templates and laying out every slide by hand.
        pain_zh: 排版耗时且与内容质量无关，赶时间时最容易被压缩；不做的代价是要么熬夜排版，要么交出一份粗糙的材料。
        pain_en: Layout work is time-consuming and unrelated to content quality, and it is the first thing
          squeezed under deadline; the cost of not solving it is either a late night of formatting or
          a rough deliverable.
        current_alternative_zh: 目前多数人用办公软件自带模板、第三方模板站，或把内容交给设计同事和外包排版。
        current_alternative_en: Most people use built-in office templates, third-party template sites,
          or hand content to a designer or an outsourced formatter.
        usage_reason_zh: 推断：相较自己找模板逐页排版，输入大纲直接得到可编辑初稿，省掉的是从空白页到成稿的排版环节，因此赶时间的职场人和讲师会在初稿阶段选择它；公开材料没有用户反馈或留存数据，无法确认它是否被长期留在工作流里。
        usage_reason_en: 'Inference: compared with finding templates and laying out slides by hand, feeding
          an outline and getting an editable first draft removes the layout step between blank page and
          finished deck, so time-pressed office workers and trainers would use it at the drafting stage;
          there is no public user feedback or retention data confirming it stays in the workflow long
          term.'
      gates:
      - gate: value
        status: supported
        reason: 它解决把主题或大纲快速变成可用演示文稿的需求，痛点是排版耗时且与内容质量无关，不做的代价是交付粗糙或熬夜；判断基于工作流推理。
        evidence_ids: []
      - gate: consensus
        status: insufficient
        reason: 只有访问量数据，没有用户评价或案例说明职场人与讲师是否真的把初稿生成当作固定环节。
        evidence_ids: []
      - gate: model
        status: insufficient
        reason: 未披露定价与买方结构；个人订阅或学校、企业采购都可能，但这是判断，不是已验证事实。
        evidence_ids: []
      - gate: truth
        status: insufficient
        reason: 无法核对生成初稿的实际可用程度与人工返工量，这决定它是否真的省下排版时间。
        evidence_ids: []
      next_validation: 收集 AiPPT.cn 官方定价页与公开客户案例，确认其收费方式、面向个人还是机构，以及生成初稿后用户实际返工程度的公开描述。
