    name: Sainaptic
    decision: queued
    event_summary_zh: 2026 年 10 月 13 日，英国教育科技公司 Sainaptic 完成 100 万英镑融资，由 Cornerstone VC 与 Ufi Ventures
      联合领投，Elm Venture Partners 和 Brighteye Ventures 参投；同时与评估管理软件商 Skilltech Solutions 达成合作，将其技术提供给英国部分大型学徒制评估机构。公司称其领域数据训练的模型把部分资格证书的评分时间从
      45 分钟缩短到 8 秒，潜在年节省最高 15 万英镑，误差率低于 1%。
    event_summary_en: On 13 October 2026, UK edtech company Sainaptic raised £1 million co-led by Cornerstone
      VC and Ufi Ventures, with Elm Venture Partners and Brighteye Ventures participating, alongside a
      partnership with assessment management software provider Skilltech Solutions to make its technology
      available to some of the UK's largest apprenticeship assessment organisations. The company says
      its domain-trained models cut marking time for some qualifications from 45 minutes to eight seconds,
      with potential annual savings of up to £150,000 and an error rate below 1%.
    category: AI + 效率
    project_type: new_application
    industries:
    - 教育
    - 职业培训
    - 资格认证
    industries_en:
