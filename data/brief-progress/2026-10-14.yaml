    name: Alchera Technologies
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: Alchera Technologies 于 2026 年 10 月 13 日宣布完成 270 万英镑种子轮融资，由 Maven Capital Partners
      通过 British Business Bank 的 South West Investment Fund 领投 200 万英镑，Baves Entrepreneurship Fund、The
      FSE Group、Innovate UK 的 Investor Partnership 计划及现有投资方 Cambridge Applied Research 参投。该公司成立于 2016
      年，利用专有机器学习整合多种交通与情境数据源，帮助地方政府、公路运营方及其顾问分析道路与公交网络运行状况并决定行动，客户包括 Lancashire City Council 和 City of
      York Council，其技术可将交通数据分析时间从数周缩短至数秒。
    event_summary_en: Alchera Technologies announced on 13 October 2026 that it raised £2.7 million in
      seed funding, led by Maven Capital Partners through the British Business Bank's South West Investment
      Fund with a £2 million investment, with participation from the Baves Entrepreneurship Fund, The
      FSE Group, Innovate UK's Investor Partnership programme and existing investor Cambridge Applied
      Research. Founded in 2016, the company uses proprietary machine learning to combine multiple transport
      and contextual data sources, helping local authorities, highways operators and their advisors analyse
      road and bus network performance and decide where to act; its customers include Lancashire City
      Council and the City of York Council, and it says its technology cuts transport data analysis time
      from weeks to seconds.
