        usage_reason_en: 'Inference: if the agent understands intent and calls services directly, users
          skip opening apps and filling fields step by step, so they would try it on high-frequency, fixed-path
          tasks; however no user feedback or retention evidence is public, so long-term use cannot be
          confirmed.'
      gates:
