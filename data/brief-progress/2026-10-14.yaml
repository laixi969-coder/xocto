    summary_en: 'A native macOS mail client: while users work through their inbox, it offers one-click
      extraction of sign-in codes and layers AI on email content; which fields the AI receives and what
      it delivers still needs verification.'
    inspiration_en: 'Trend: high-frequency, fixed-format inbox mail such as verification codes and notifications
      is moving from human scanning to machine extraction. Entry: start with ops, finance or support staff
      who log into back-office systems all day, auto-filing codes, bills and notices; pricing is undisclosed
      and the AI''s exact action still needs checking.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: macOS 上的个人用户或小团队，在一天里反复打开收件箱处理邮件时，需要把验证码、通知和待回复邮件分开处理，尽快完成登录或回复。
        job_en: An individual or small team on macOS repeatedly opening the inbox during the day needs
          to separate verification codes, notifications and mails awaiting reply, to finish logging in
          or replying quickly.
        pain_zh: 验证码和通知邮件混在正常邮件里，需要逐封点开、复制、切回原页面粘贴，重复动作多且容易打断正在做的事。
        pain_en: Codes and notifications sit among real mail, forcing users to open each one, copy and
          paste back into the original page — repetitive and disruptive to the task at hand.
        current_alternative_zh: 现在多数人用系统自带邮件客户端或网页邮箱，靠手动搜索、肉眼扫读和复制粘贴来取验证码。
        current_alternative_en: Most people use the built-in mail client or webmail, manually searching,
          scanning by eye and copy-pasting to grab codes.
        usage_reason_zh: 推断：相较手动逐封点开复制，它把验证码类邮件在收件箱层面直接摘出，省掉“打开邮件—找数字—切回页面”这几步，因此频繁登录后台的运营、财务、客服类用户会优先试用；但公开材料未说明
          AI 具体处理什么、是否收费，长期留存无证据。
        usage_reason_en: 'Inference: versus opening and copying each mail by hand, it surfaces code-type
          mail at the inbox level, removing the open-find-switch-back steps, so ops, finance and support
          users who log in constantly would try it first; public material does not say what the AI does
          or whether it charges, and there is no retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决收件箱里验证码与通知邮件混排、需逐封点开复制的问题，痛点具体且高频，旧替代行为清晰；但 AI 具体动作未披露。
