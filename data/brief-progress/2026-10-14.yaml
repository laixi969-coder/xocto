        job_en: Satellite operators collecting remote-sensing or sensor data in orbit need to process
          it onboard and downlink usable results instead of raw data to ground stations.
        pain_zh: 原始数据下传受带宽和地面站窗口限制，处理排队造成延迟，对时效敏感的任务难以满足。
        pain_en: Raw downlink is limited by bandwidth and ground-station windows, and queued processing
          adds latency that time-sensitive tasks cannot tolerate.
        current_alternative_zh: 现有做法是把原始数据下传到地面数据中心，用地面算力处理，或依赖卫星厂商自带的封闭一体化方案。
        current_alternative_en: The current practice is downlinking raw data to ground data centers for
          processing, or relying on a satellite vendor's closed all-in-one stack.
        usage_reason_zh: 推断：若星上软件能减少下传数据量并缩短从采集到结果的时延，对带宽成本高、时效要求强的遥感与监测客户会有吸引力；但公开材料未给出客户案例、定价或实际在轨运行结果，采用动机尚无法核实。
        usage_reason_en: 'Inference: if onboard software cuts downlink volume and shortens time from capture
