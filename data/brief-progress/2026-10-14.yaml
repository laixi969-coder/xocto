          up hands at peak; hiring and retention costs rise and human throughput is uneven.
        current_alternative_zh: 目前主要靠店员手工折叠，或采购预折叠餐巾、改用一次性包装等折中做法，没有可连续运行数小时的自动化替代。
        current_alternative_en: Today it is mostly manual folding by staff, or workarounds such as pre-folded
          napkins and disposable packaging; there is no automation that runs unattended for hours.
        usage_reason_zh: 相较手工折叠，机器人代理在真实台面上连续执行抓取、折叠、堆叠，并在整摞被碰倒后自行恢复，把店员从这段重复劳动中移出；据访谈材料其连续 24 小时成功率 99.4%，因此高峰缺人、单店折叠量大的连锁餐饮会在该工位选择它。这是基于产品能力与任务结构的推断，公开材料未给出留存或复购数据。
        usage_reason_en: Compared with manual folding, the robot agent grasps, folds and stacks continuously
          on a real counter and recovers by itself after knocking over the stack, removing staff from
          that repetitive task; the interview material reports a 99.4% success rate over 24 hours, so
          chains with peak-hour staffing gaps and high folding volume would choose it for that station.
