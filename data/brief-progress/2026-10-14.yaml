  opencode-20:
    slug: opencode-20
    name: OpenCode
    decision: watching
    event_summary_zh: 2026 年 10 月 12 日，开源 AI 编码代理 OpenCode 发布 2.0 版本，公开材料仅给出“开源 AI 编码代理”这一句描述，未披露新增能力、定价或采用数据。
    event_summary_en: On 12 October 2026, the open-source AI coding agent OpenCode shipped version 2.0;
      the public material states only that it is an open-source AI coding agent, with no new capabilities,
      pricing or adoption data disclosed.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 软件工程师
    jobs_en:
    - Software engineers
    regions:
    - 全球
    regions_en:
    - Global
    open_source: true
    summary_zh: 软件工程师在本地代码仓库里让这个开源代理读取项目文件、按自然语言指令修改代码并运行命令，最终拿到改动后的代码与执行结果，是否合并仍由工程师自己确认。2.0 版本具体新增了什么、交付边界如何，公开材料未说明，具体流程或交付仍待核验。
    inspiration: 趋势：编码代理正从闭源订阅走向可自托管、可审计的开源形态，团队开始在意代码不出内网。切入：不要做又一个通用编码代理，而是把开源代理嵌进受监管行业的私有仓库——银行、医疗、政企的内部代码库需要本地部署与审计留痕，卖的是部署与合规交付，而不是模型能力。
    summary_en: A software engineer points this open-source agent at a local repository, lets it read
      project files, apply natural-language edits and run commands, and ends up with changed code plus
      execution output; merging is still the engineer's call. What version 2.0 actually adds and where
      its delivery boundary sits is not stated in the public material, so the concrete workflow and deliverable
      remain unverified.
    inspiration_en: 'Trend: coding agents are moving from closed subscriptions toward self-hostable, auditable
      open-source forms as teams care about code never leaving the intranet. Entry: skip building another
      general coding agent and instead embed an open-source agent inside regulated private repositories
      — banks, healthcare and government codebases need local deployment and audit trails, so sell deployment
      and compliance delivery rather than model capability.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 软件工程师在本地代码仓库中处理既有项目文件，需要让代理按自然语言指令完成代码修改与命令执行，最终得到可审查的代码改动。
        job_en: A software engineer works on existing project files in a local repository and needs an
          agent to apply natural-language edits and run commands, ending with reviewable code changes.
        pain_zh: 手工逐文件修改和反复切换终端与编辑器耗时，且把私有代码交给闭源云端代理存在合规与泄露顾虑。
        pain_en: Editing file by file and switching between terminal and editor is slow, and handing private
          code to a closed cloud agent raises compliance and leakage concerns.
        current_alternative_zh: 工程师手工改代码并自行运行测试，或使用闭源云端编码助手，代码需上传到第三方服务。
        current_alternative_en: Engineers edit code and run tests by hand, or use closed cloud coding
          assistants that require uploading code to a third-party service.
        usage_reason_zh: 推断：相较手工改代码，它把“读文件—改代码—跑命令”串成一次指令执行，减少逐文件编辑与终端切换；相较闭源云端助手，本地运行让代码不出内网，因此受合规约束的团队在私有仓库场景下更可能选择它。公开材料未给出留存或付费证据。
        usage_reason_en: 'Inference: versus manual editing it chains read-edit-run into one instruction,
          cutting per-file edits and terminal switching; versus closed cloud assistants, local execution
          keeps code inside the intranet, so compliance-bound teams are more likely to pick it for private
          repositories. No retention or payment evidence is public.'
      gates:
      - gate: value
        status: supported
        reason: 它解决工程师在本地仓库改代码、跑命令的需求，痛点是手工逐文件修改耗时且私有代码上云有合规顾虑，旧替代行为明确存在。
        evidence_ids:
        - ev-6e4a6a2d8f2bd5cf
      - gate: consensus
        status: insufficient
        reason: 公开材料只有一句产品定位，没有用户评价、客户案例或采用数据，无法判断工程师是否已把它放进日常工作流。
        evidence_ids:
        - ev-6e4a6a2d8f2bd5cf
      - gate: model
        status: insufficient
        reason: 未披露定价页或收费方式，开源项目可能靠托管、企业支持或云服务变现，这属于判断而非已验证事实。
        evidence_ids:
        - ev-6e4a6a2d8f2bd5cf
      - gate: truth
        status: insufficient
        reason: 2.0 版本新增能力、交付确定性、安全与人工确认边界均未在公开材料中说明，无法核对承诺能否稳定兑现。
        evidence_ids:
        - ev-6e4a6a2d8f2bd5cf
      next_validation: 收集 OpenCode 官方仓库的 release 说明与 issue/discussion，核对 2.0 版本实际新增能力、部署方式与人工确认边界。
  opencode-rust:
    slug: opencode-rust
    name: opencode-rust
    decision: watching
    event_summary_zh: 2026 年 10 月 13 日出现 opencode-rust 项目，用 Rust 重写开源 AI 编码代理，提供 CLI、TUI 与 HTTP 服务端，宣称本地运行代理无需
      Docker；公开仓库显示 62 个星标、1 个 fork、0 个未关闭 issue。
    event_summary_en: On 13 October 2026 the opencode-rust project appeared, rewriting an open-source
      AI coding agent in Rust with a CLI, TUI and HTTP server, claiming local agent runs without Docker;
      the public repository shows 62 stars, 1 fork and 0 open issues.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 软件工程师
    jobs_en:
    - Software engineers
    regions:
    - 全球
    regions_en:
    - Global
    open_source: true
    summary_zh: 软件工程师在本地机器上通过命令行或终端界面启动这个 Rust 版编码代理，让它读取代码、执行修改任务，并可通过 HTTP 服务端接入其他工具，最终拿到代码改动结果；宣称无需
      Docker 即可运行本地代理。具体交付边界与人工确认环节仍待核验。
    inspiration: 趋势：编码代理的竞争开始下沉到运行时与部署形态，谁能免去容器依赖、在受限机器上跑起来，谁就拿到内网场景。切入：面向无法装 Docker 的政企与制造业内网开发机，做轻量本地代理的打包、离线模型接入与运维交付，卖部署与运维而不是代理本身。
    summary_en: A software engineer starts this Rust-based coding agent locally via CLI or terminal UI,
      lets it read code and carry out edit tasks, and can wire it into other tools through an HTTP server,
      ending with code changes; it claims to run local agents without Docker. The exact delivery boundary
      and human confirmation step remain unverified.
    inspiration_en: 'Trend: competition among coding agents is sinking into runtime and deployment form
      — whoever removes the container dependency and runs on restricted machines wins intranet scenarios.
      Entry: target government, enterprise and manufacturing intranet dev machines that cannot install
      Docker, and sell packaging, offline model hookup and operations delivery for a lightweight local
