    summary_zh: 微软推出全新自研AI芯片，目标是降低对英伟达GPU的依赖。这一变化意味着大型云厂商在AI算力供给上开始更多采用自研方案，若规模化落地，可能改变AI推理与训练的算力成本结构和GPU供应格局；但材料未披露芯片型号、性能或部署规模，对成本与竞争格局的实际影响尚待验证（推断）。
