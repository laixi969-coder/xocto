  mixture-of-experts-kernel-engineering-on-amazon-sagemaker-ai:
    slug: mixture-of-experts-kernel-engineering-on-amazon-sagemaker-ai
    name: Amazon SageMaker AI
    decision: market_context
    event_summary_zh: 2026年10月13日，AWS 在官方博客发布 MoE 内核工程实践，说明在 SageMaker AI 上通过 fused MoE 把 token 路由、数据重排与专家网络计算合并为单次批处理操作，替代原先分离的顺序循环执行，并针对
      NVIDIA Hopper 的 WGMMA 指令做硬件相关优化。
    event_summary_en: On October 13, 2026, AWS published an official blog post on MoE kernel engineering,
      describing how fused MoE on SageMaker AI merges token routing, data shuffling and expert network
      computation into a single batched GPU operation instead of separate sequential loops, with hardware-specific
      optimizations for NVIDIA Hopper's WGMMA instructions.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是 AWS 官方发布的一篇 MoE 推理内核优化技术说明，不是独立产品：它讲的是在 SageMaker AI 上如何把专家路由与专家计算融合成一次批处理、并针对 Hopper
