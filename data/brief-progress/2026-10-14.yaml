        usage_reason_en: 'Inference: if it can automatically complete probing and path attempts within
          an authorized scope, it could cut manual enumeration and verification steps for security engineers,
          so security service providers running pentest engagements or firms without a dedicated security
          team might try it; without user feedback or delivery-outcome evidence, this choice cannot be
