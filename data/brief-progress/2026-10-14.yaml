      signal_level: 初步成立
      demand_read:
        job_zh: 电网、管道、铁路等关键设施的运维工程师需要按周期巡检资产，处理飞行器采集的影像与传感数据，产出缺陷清单和巡检报告。
        job_en: Maintenance engineers for grids, pipelines and railways must inspect assets on a fixed
          cycle, process imagery and sensor data collected by the aircraft, and produce defect lists and
          inspection reports.
        pain_zh: 直升机巡检成本高、排期受天气与空域限制，人工判读影像耗时且依赖资深人员经验，漏检会直接带来停电、泄漏等运维风险。
        pain_en: Helicopter inspection is expensive and constrained by weather and airspace scheduling,
          while manual image reading is slow and depends on scarce senior expertise; missed defects translate
          directly into outage or leak risk.
        current_alternative_zh: 租用直升机或有人机搭载相机，由工程师事后逐帧查看航拍影像并手工整理报告。
        current_alternative_en: Chartering helicopters or manned aircraft with cameras, then having engineers
          review aerial imagery frame by frame and compile reports by hand.
        usage_reason_zh: 推断：相较租直升机加人工判读，HyLight 用自有飞艇承担飞行采集、由 AI 先筛出疑似缺陷，把工程师从逐帧看图压缩到复核候选缺陷这一步，因此巡检预算固定、资产分布广的能源与交通运营方会在排期紧或人力不足时选择它。
        usage_reason_en: 'Inference: compared with chartering helicopters and reading imagery manually,
          HyLight uses its own airship for collection and lets AI pre-filter suspected defects, cutting
          engineers'' work down to reviewing candidates; operators with fixed inspection budgets and widely
          spread assets would choose it when schedules are tight or staff are short.'
      gates:
      - gate: value
        status: supported
        reason: 它解决关键设施按周期巡检的需求，痛点是直升机成本高、人工判读慢且漏检有运维后果，旧替代行为明确存在。
