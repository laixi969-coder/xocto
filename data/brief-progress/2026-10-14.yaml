    summary_zh: 法国能源与交通运营商的运维团队在需要对高压线路、管道等关键设施做定期巡检时，原本要租用直升机并人工判读航拍影像；HyLight 用自研氢动力飞艇执行飞行采集，再由 AI 分析数据，最终交付巡检结果与缺陷判断，人工仍需复核。具体交付格式与准确率指标仍待核验。
