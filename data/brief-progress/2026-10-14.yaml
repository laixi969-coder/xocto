  llm-gemini-035:
    slug: llm-gemini-035
    name: Gemini 4 Argon
    decision: market_context
    summary_zh: 2026 年 10 月 13 日，Google 通过 Gemini API 及每月 100 美元的订阅计划发布 Gemini 4 Argon 模型，定价为每百万输入 token
      2 美元、每百万输出 token 10 美元，与 GPT-6 Sol 持平，约为 Claude Opus 5.5 的一半，并计划于 12 月 1 日将价格翻倍至与 Opus 5.5 相同。这一发布与后续涨价安排意味着前沿模型在
      agentic 场景下的单位成本竞争仍在持续，开发者需要在模型能力与 token 消耗效率之间重新权衡，短期低价窗口可能推动采用，但涨价预期会促使应用方提前评估多模型切换与成本锁定策略。
    summary_en: On October 13, 2026, Google released the Gemini 4 Argon model via the Gemini API and its
      $100/month subscription plan, priced at $2 per million input tokens and $10 per million output tokens,
      on par with GPT-6 Sol, about half the price of Claude Opus 5.5, and set to double in price on December
      1 to match Opus 5.5. This release and the planned price increase indicate that unit-cost competition
      among frontier models in agentic scenarios continues, requiring developers to reweigh model capability
      against token-consumption efficiency; the short-term low-price window may drive adoption, while
      the expected increase will push application builders to evaluate multi-model switching and cost-locking
      strategies in advance.
    event_summary_zh: Google 通过 Gemini API 及每月 100 美元的订阅计划发布 Gemini 4 Argon 模型，定价为每百万输入 token 2 美元、每百万输出
      token 10 美元，与 GPT-6 Sol 持平，约为 Claude Opus 5.5 的一半，并计划于 12 月 1 日将价格翻倍。
