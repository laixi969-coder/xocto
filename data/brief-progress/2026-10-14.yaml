      KBC Focus Fund、Runa Capital、Inflection 以及 Quantum Systems 联合创始人兼联合 CEO Florian Seibel 以个人身份参投；自
      2024 年成立以来累计种子轮融资达 1800 万美元。此前其首款芯片已展示在单一处理器架构上同时完成信号处理、AI 推理与实时控制。
    event_summary_en: Ubitium announced on 13 October 2026 that it raised $14 million in new seed funding
      led by Ibex Investors, with participation from OpenOcean, existing investors KBC Focus Fund, Runa
      Capital and Inflection, and Florian Seibel, co-founder and co-CEO of Quantum Systems, investing
      personally; total seed funding since its founding in 2024 now stands at $18 million. Its first chip
      previously demonstrated signal processing, AI inference and real-time control on a single processor
      architecture.
  ubitium-raises-14m-to-bring-universal-computing-to-physical:
    slug: ubitium-raises-14m-to-bring-universal-computing-to-physical
    name: Ubitium
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: Ubitium 于 2026 年 10 月 13 日宣布完成 1400 万美元新种子轮融资，由 Ibex Investors 领投，OpenOcean、现有投资方
      KBC Focus Fund、Runa Capital、Inflection 以及 Quantum Systems 联合创始人兼联合 CEO Florian Seibel 以个人身份参投；自
      2024 年成立以来累计种子轮融资达 1800 万美元。该公司正在开发面向机器人、无人机、车辆和工业设备等物理 AI 应用的可重构处理器，其可编程处理单元可按机器负载在传感、AI 推理与实时控制之间动态分配算力，此前首款芯片已展示在单一架构上完成这三类任务。
    event_summary_en: Ubitium announced on 13 October 2026 that it raised $14 million in new seed funding
      led by Ibex Investors, with participation from OpenOcean, existing investors KBC Focus Fund, Runa
      Capital and Inflection, and Florian Seibel, co-founder and co-CEO of Quantum Systems, investing
      personally; total seed funding since its founding in 2024 now stands at $18 million. The company
      is developing a reconfigurable processor for physical AI applications such as robots, drones, vehicles
      and industrial equipment, whose programmable processing elements dynamically allocate computing
      resources between sensing, AI inference and real-time control depending on the machine's workload;
      its first chip previously demonstrated all three functions on a single architecture.
  uk-launches-refugee-focused-venture-fund-with-initial-300000:
    slug: uk-launches-refugee-focused-venture-fund-with-initial-300000
    name: Refugee Venture Fund
    decision: market_context
    summary_zh: 2026 年 10 月 13 日，The Entrepreneurial Refugee Network（TERN）在 Atomico 支持下发起 Refugee Venture
      Fund，初始资金 30 万英镑并计划增至 50 万英镑，预计向 3 至 5 家难民创办的公司各投资 5 万至 10 万英镑，以建立业绩记录，之后再推进计划中的 1000 万英镑基金；Dominus、This
      Day Foundation 和 Future Leaders 为创始投资方。TERN 与 Square 的研究估计，英国已有 26,500 名难民创业者贡献 5.2 亿英镑经济产出，另有约
      51 亿英镑潜在经济活动空间。该基金针对难民创业者缺乏英国经营记录、职业网络较小、不熟悉融资生态等融资障碍，意味着英国早期 AI 与科技创业融资渠道出现一个面向特定创始人群体的小规模新增供给，但单笔金额有限，对整体融资环境的改变仍需观察。
    summary_en: On 13 October 2026, The Entrepreneurial Refugee Network (TERN), with support from Atomico,
      launched the Refugee Venture Fund with £300,000 in initial capital and plans to increase this to
      £500,000, expecting to invest £50,000–£100,000 in three to five refugee-founded companies to establish
      a track record ahead of a planned £10 million fund; Dominus, This Day Foundation and Future Leaders
      are founding investors. Research by TERN and Square estimates that 26,500 refugee entrepreneurs
      already contribute £520 million to the UK economy, with an estimated £5.1 billion in potential additional
      economic activity. The fund targets barriers refugee entrepreneurs face, including limited UK business
      track records, smaller professional networks and unfamiliarity with the funding ecosystem, meaning
      a small new source of early-stage UK AI and tech startup financing aimed at a specific founder group
      has appeared, though individual cheque sizes are limited and any change to the broader funding environment
      remains to be seen.
    event_summary_zh: Refugee Venture Fund 于 2026 年 10 月 13 日成立，初始资金 30 万英镑，计划增至 50 万英镑，预计向 3 至 5 家难民创办的公司各投资
      5 万至 10 万英镑，为后续计划中的 1000 万英镑基金建立业绩记录；该基金由 The Entrepreneurial Refugee Network 在 Atomico 支持下设立，创始投资方包括
      Dominus、This Day Foundation 和 Future Leaders。
    event_summary_en: The Refugee Venture Fund launched on 13 October 2026 with £300,000 in initial capital,
      plans to increase this to £500,000, and expects to invest £50,000–£100,000 in three to five refugee-founded
      companies to build a track record ahead of a planned £10 million fund; it was established by The
      Entrepreneurial Refugee Network with support from Atomico, and founding investors include Dominus,
      This Day Foundation and Future Leaders.
