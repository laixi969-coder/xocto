    open_source: true
    summary_zh: 消费者在麦当劳点餐前打开它：AI 通过麦当劳 MCP 拉取菜单与全部可用优惠券，计算最省的点餐组合并给出结果，示例中巨无霸套餐从 ¥47 降到 ¥21.9；用户仍需自行在官方渠道下单，优惠是否实时有效与核价口径待核验。
    inspiration: 趋势是优惠券组合这类原本靠人肉试算的比价动作，开始被 Agent 技能接管，且数据来自品牌官方接口。切入可考虑把这套组合优化做成面向多品牌外卖、企业团餐或代下单服务的比价层，按省下的金额或订单抽成收费，而不是只做单品牌免费技能。
    summary_en: 'A consumer opens this before ordering at McDonald''s: the AI pulls the menu and all available
      coupons through a McDonald''s MCP server, computes the cheapest combination and returns it, with
      an example cutting a Big Mac meal from ¥47 to ¥21.9; the user still orders through official channels,
      and coupon validity and pricing basis remain unverified.'
    inspiration_en: The trend is that coupon-combination price hunting, once done by hand, is being taken
      over by agent skills fed by official brand interfaces. A wedge is to turn this optimizer into a
      comparison layer across delivery brands, corporate group meals or order-concierge services, charging
      on savings or order commission rather than a free single-brand skill.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 普通消费者在麦当劳点餐前，需要从菜单和一堆优惠券里挑出最便宜的组合，再自己去官方渠道下单。
        job_en: An ordinary consumer, before ordering at McDonald's, needs to pick the cheapest combination
          from the menu and a pile of coupons, then order through official channels.
        pain_zh: 优惠券规则叠加复杂，人工试算容易漏掉更省的组合，点完才发现多花钱；这是高频、可量化的损失。
        pain_en: Coupon stacking rules are complex, manual trial-and-error misses cheaper combinations,
          and the loss is only noticed after paying; it is frequent and quantifiable.
        current_alternative_zh: 自己在官方 App 里逐个试算优惠券，或看社交平台上的省钱攻略帖。
        current_alternative_en: Trying coupons one by one in the official app, or reading money-saving
          guides on social platforms.
        usage_reason_zh: 推断：相较人工试算，它一次性枚举菜单与全部可用券并直接给出最省组合，省掉的是逐张试券这一步，因此对价格敏感、常点套餐的用户在点餐前会先跑一次。
        usage_reason_en: 'Inference: versus manual trial-and-error, it enumerates the menu and all available
          coupons at once and returns the cheapest combination, removing the step of testing coupons one
          by one, so price-sensitive frequent set-meal buyers would run it before ordering.'
      gates:
      - gate: value
        status: supported
        reason: 它解决点餐前从菜单与优惠券中选出最省组合的需求，痛点是人工试算易漏、直接造成多花钱，属于高频且可量化的损失。
        evidence_ids:
        - ev-381541fc1e926994
        - ev-df60ddd197c0dc5e
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 104 增至 151，说明关注度上升，但没有公开证据显示用户已把它固定进日常点餐流程。
        evidence_ids:
        - ev-381541fc1e926994
        - ev-df60ddd197c0dc5e
      - gate: model
        status: insufficient
        reason: 作为参赛开源技能无定价页，买方与收费方式未披露；若走代下单或抽成，需依赖官方渠道授权，这是判断不是已验证事实。
        evidence_ids:
        - ev-df60ddd197c0dc5e
      - gate: truth
        status: insufficient
        reason: 省 53% 的示例来自项目自述，优惠券是否实时有效、核价是否与官方一致均无独立材料支持。
        evidence_ids:
        - ev-381541fc1e926994
      next_validation: 收集该仓库 README 或 issue 中关于优惠券实时有效性、核价一致性与实际下单结果的公开记录。
  mcd-wrapped:
    slug: mcd-wrapped
    name: mcd-wrapped
    decision: watching
    category: AI + 生活
    project_type: open_source
    industries:
    - 餐饮零售
    - 快餐连锁
    industries_en:
    - Food & Beverage Retail
    - Quick Service Restaurants
    jobs:
    - 消费者个人消费数据回顾与分享
    jobs_en:
    - Personal consumption data review and sharing
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 消费者在年末或想回顾自己吃麦当劳的记录时打开它：把消费数据整理成全景报告与个人年报，并配上方言播报；候选资料未说明 AI 具体接收哪些数据、如何生成播报，具体流程与交付仍待核验。
    inspiration: 趋势是消费数据被重新包装成可分享的年度内容，方言播报把本地化表达变成差异化。切入可考虑为连锁品牌或本地生活平台做可定制的年度回顾内容，按活动或品牌授权收费，而不是只做单品牌开源玩具。
    summary_en: 'A consumer opens this at year-end or when reviewing their McDonald''s history: consumption
      data is turned into a panorama report and a personal annual review with dialect voice-over; the
      candidate material does not say what data the AI receives or how the voice-over is produced, so
      the flow and deliverable remain unverified.'
    inspiration_en: The trend is consumption data repackaged as shareable annual content, with dialect
      voice-over as the local differentiator. A wedge is building customizable annual-review content for
      chain brands or local-life platforms, charged per campaign or brand license, rather than a single-brand
      open-source toy.
    req_initial:
      verdict: pseudo_demand
      signal_level: 需求存疑
      demand_read:
        job_zh: 消费者在年末想回顾自己一年吃了多少次麦当劳，并生成一份可分享的个人年报。
        job_en: A consumer at year-end wanting to review how often they ate at McDonald's and produce
          a shareable personal annual report.
        pain_zh: 回顾消费记录本身不是刚性任务，官方 App 已有订单历史；方言播报提供的是新鲜感，不用它也不会失去什么。
        pain_en: Reviewing consumption history is not a rigid task, and the official app already keeps
          order history; dialect voice-over is novelty, and nothing is lost without it.
        current_alternative_zh: 翻官方 App 的订单记录，或直接截图分享。
        current_alternative_en: Browsing order history in the official app, or simply sharing screenshots.
        usage_reason_zh: 推断：它被选择主要因为方言播报和年报形式带来的分享欲，减少的是自己整理数据的动作，而不是解决某个受阻的任务。
        usage_reason_en: 'Inference: it is chosen mainly for the sharing appeal of dialect voice-over
          and annual-report format, removing the effort of compiling data rather than unblocking a stalled
          task.'
      gates:
      - gate: value
        status: challenged
        reason: 它解决的是消费数据回顾与分享的情绪价值，官方订单历史已覆盖查询，不用它也不会失去什么，刚性不足。
        evidence_ids:
        - ev-25ae554844743f67
      - gate: consensus
        status: insufficient
        reason: 仅有 89 星与 9 次 fork，属于关注度信号，无法说明用户会重复使用或把它留在流程里。
        evidence_ids:
        - ev-25ae554844743f67
      - gate: model
        status: insufficient
        reason: 开源项目无定价页，买方与收费方式未披露；若面向品牌做活动内容，付费方是品牌而非消费者，这是判断不是已验证事实。
        evidence_ids:
        - ev-25ae554844743f67
      - gate: truth
        status: insufficient
        reason: 候选资料未说明数据来源与授权方式，个人消费数据的获取边界不清，交付是否确定发生无法核对。
        evidence_ids:
        - ev-25ae554844743f67
      next_validation: 收集该仓库 README 中关于消费数据来源、授权方式与方言播报生成流程的公开说明。
  meal-puzzle:
    slug: meal-puzzle
    name: meal-puzzle
    decision: watching
    category: AI + 生活
    project_type: open_source
    industries:
    - 餐饮零售
    - 快餐连锁
    industries_en:
    - Food & Beverage Retail
    - Quick Service Restaurants
    jobs:
    - 多人聚餐时的点餐组合与分账
    jobs_en:
    - Group meal ordering and per-person splitting
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 一群人在聚餐点单时打开它：把每个人想吃的拼成一桌，基于真实麦当劳菜单做心愿组合、官方核价并按人分餐；候选资料未说明 AI 具体接收什么输入、如何完成核价与分餐，具体流程与交付仍待核验。
    inspiration: 趋势是多人协作点单这类需要反复沟通的环节，开始由 Agent 汇总偏好并直接给出可下单的组合与分账。切入可考虑把这套偏好汇总与分账能力做成面向企业团餐、外卖拼单或会议用餐的订购工具，按订单或席位收费。
    summary_en: 'A group opens this when ordering a shared meal: individual wishes are assembled into
      one table, with wish combinations based on the real McDonald''s menu, official pricing and per-person
      splitting; the candidate material does not say what input the AI receives or how pricing and splitting
      are done, so the flow and deliverable remain unverified.'
    inspiration_en: The trend is that multi-person ordering, once requiring back-and-forth, is being handled
      by agents that aggregate preferences and return an orderable combination with a split. A wedge is
      turning preference aggregation and splitting into an ordering tool for corporate group meals, delivery
      pooling or meeting catering, charged per order or seat.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 一群同事或朋友聚餐点单时，需要把每个人想吃的汇总成一桌，并算出各自该付多少钱。
        job_en: A group of colleagues or friends ordering a shared meal needs to aggregate everyone's
          wishes into one table and work out what each person owes.
        pain_zh: 多人点单要在群里反复确认口味与预算，凑单和分账靠人工算，容易算错或来回改。
        pain_en: Group ordering requires repeated confirmation of tastes and budget in a chat, and combining
          and splitting are done by hand, which is error-prone and causes rework.
        current_alternative_zh: 在微信群里逐个问想吃什么，再用计算器或收款工具手动分账。
        current_alternative_en: Asking one by one in a group chat, then splitting manually with a calculator
          or payment tool.
        usage_reason_zh: 推断：相较群里反复确认，它把每个人的心愿直接汇总成可下单组合并给出按人分餐结果，省掉的是汇总与算账这两步，因此常组织聚餐的人会在下单前用它。
        usage_reason_en: 'Inference: versus repeated group-chat confirmation, it aggregates each person''s
          wishes into an orderable combination and returns a per-person split, removing the aggregation
          and arithmetic steps, so frequent organizers would use it before ordering.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多人点单时汇总口味与分账的需求，痛点是群里反复确认和人工算账易错，属于聚餐场景中真实存在的摩擦。
        evidence_ids:
        - ev-b15f11455306ae37
      - gate: consensus
        status: insufficient
        reason: 仅有 112 星与 5 次 fork，属于关注度信号，没有公开证据显示它被重复用于实际聚餐点单。
        evidence_ids:
        - ev-b15f11455306ae37
      - gate: model
        status: insufficient
        reason: 开源项目无定价页，买方与收费方式未披露；若面向企业团餐，付费方可能是行政或餐饮服务商，这是判断不是已验证事实。
        evidence_ids:
        - ev-b15f11455306ae37
      - gate: truth
        status: insufficient
        reason: 候选资料未说明核价是否与官方一致、分餐结果是否可直接下单，交付确定性无法核对。
        evidence_ids:
        - ev-b15f11455306ae37
      next_validation: 收集该仓库 README 或 issue 中关于官方核价一致性、分餐结果与真实下单流程的公开记录。
  memorysync:
    slug: memorysync
    name: MemorySync
    decision: watching
    category: 基础层
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 面向 AI agent 开发者的记忆层产品，宣称让 agent 跨会话保留上下文；具体接入方式、存储对象与交付结果在公开材料中只有一句描述，流程仍待核验。
    inspiration: 趋势是 agent 的持久记忆正从模型内置能力拆成独立服务；切入要看它是否绑定某个具体行业会话（如客服工单、销售跟进），否则只是通用零件，难有定价权。
    summary_en: A memory layer for AI agents that claims to let agents retain context across sessions;
      the public material offers only a one-line description, so its integration path, stored objects
      and delivered output still need verification.
    inspiration_en: The trend is that persistent agent memory is splitting off from model providers into
      standalone services; the opening depends on whether it binds to a specific industry conversation
      such as support tickets or sales follow-up, otherwise it stays a generic part with little pricing
      power.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: AI agent 开发者需要在多轮、跨会话的任务中让 agent 记住用户偏好与历史结论，避免每次重述背景。
        job_en: AI agent developers need agents to remember user preferences and prior conclusions across
          multi-turn, cross-session tasks instead of restating context each time.
        pain_zh: 上下文窗口有限，长任务中历史信息被截断，用户要反复粘贴背景，agent 输出前后不一致。
        pain_en: Context windows are limited, history gets truncated in long tasks, users repeatedly paste
          background, and agent output is inconsistent over time.
        current_alternative_zh: 开发者自己写向量库加检索，或把摘要塞回提示词，或依赖模型厂商自带的会话记忆。
        current_alternative_en: Developers hand-roll a vector store plus retrieval, stuff summaries back
          into prompts, or rely on the session memory shipped by model vendors.
        usage_reason_zh: 推断：若它把写入、检索和过期策略封装成一次调用，开发者可省掉自建记忆管道的工程步骤，因此做多轮 agent 的团队会试用；但公开材料未给出接入方式与留存证据。
        usage_reason_en: 'Inference: if it wraps writing, retrieval and expiry into a single call, developers
          skip building their own memory pipeline, so teams shipping multi-turn agents would try it; the
          public material shows no integration detail or retention evidence.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决 agent 跨会话遗忘的问题，痛点真实，但公开材料只有一句描述，无法确认替代了哪一步旧工作，价值结构尚不能判定。
        evidence_ids:
        - ev-050ca21b71828702
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区提交与 1 条评论，没有开发者讨论或采用迹象，无法判断是否形成共识。
        evidence_ids:
        - ev-050ca21b71828702
      - gate: model
        status: insufficient
        reason: 未见定价页或买方说明；记忆层可能按调用量向开发者收费，也可能被模型厂商内置能力吞掉，这是判断不是已验证事实。
        evidence_ids:
        - ev-050ca21b71828702
      - gate: truth
        status: insufficient
        reason: 无法核对记忆的准确性、过期策略与人工边界，承诺能否确定性交付未知。
        evidence_ids:
        - ev-050ca21b71828702
      next_validation: 抓取 MemorySync 官方文档或定价页，确认它存储什么、如何接入以及是否按调用量收费。
  minimax-h3-character-swap-lora:
    slug: minimax-h3-character-swap-lora
    name: MiniMax-H3 Character Swap LoRA
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 影视与短视频制作
    - 广告营销
    industries_en:
    - Film and short-video production
    - Advertising and marketing
    jobs:
    - 视频换脸与角色替换
    jobs_en:
    - Video face and character replacement
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 基于 MiniMax-H3 ref2va LoRA 的视频角色替换演示空间，创作者上传视频与参考角色后得到替换结果；具体输入格式、时长限制与人工复核环节仍待核验。
    inspiration: 趋势是视频角色替换从后期软件的手工抠像，变成一次模型调用；切入可看短剧、广告本地化这类需要同一角色跨素材复用的团队，卖按条交付而非卖工具。
    summary_en: A demo space for video character swap built on the MiniMax-H3 ref2va LoRA, where creators
      upload a video and a reference character to get a swapped result; input format, length limits and
      human review steps still need verification.
    inspiration_en: The trend is that video character replacement moves from manual rotoscoping in post
      software to a single model call; the opening is teams in short drama or ad localization that reuse
      one character across assets, selling per-clip delivery rather than a tool.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 短剧或广告制作人员在需要同一角色出现在多条素材、或替换演员时，处理原始视频与角色参考图，产出可用的替换片段。
        job_en: Short-drama or ad producers handling raw footage and a character reference to produce
          usable swapped clips when one character must appear across assets or an actor must be replaced.
        pain_zh: 传统换脸依赖逐帧抠像与合成，耗时长且对非专业剪辑者门槛高，演员档期或授权变动会直接卡住交付。
        pain_en: Traditional face swapping relies on frame-by-frame rotoscoping and compositing, which
          is slow and hard for non-editors, and actor availability or licensing changes can block delivery.
        current_alternative_zh: 用后期软件手工抠像合成，或外包给特效团队，或使用早期换脸工具处理单张图片。
        current_alternative_en: Manual rotoscoping and compositing in post software, outsourcing to VFX
          teams, or earlier face-swap tools that only handle still images.
        usage_reason_zh: 推断：它把角色替换压缩成上传视频加参考图的一次生成，省掉逐帧抠像这一步，因此需要批量复用同一角色的短剧与广告团队会先试用；公开材料未提供客户案例或重复使用证据。
        usage_reason_en: 'Inference: it compresses character replacement into one generation from a video
          plus a reference image, removing the frame-by-frame rotoscoping step, so short-drama and ad
          teams reusing one character at volume would try it first; no customer case or repeat-use evidence
          is public.'
      gates:
      - gate: value
        status: supported
        reason: 它解决视频中角色替换耗时且门槛高的问题，痛点刚性，旧做法是逐帧抠像合成，替代路径清晰。
        evidence_ids:
        - ev-fef3b71b694d8719
      - gate: consensus
        status: insufficient
        reason: 仅有 2 个点赞，没有创作者讨论或作品展示，尚不能判断是否形成使用共识。
        evidence_ids:
        - ev-fef3b71b694d8719
      - gate: model
        status: insufficient
        reason: 作为开源演示空间没有定价与买方信息；可能的付费方是短剧与广告制作团队，这是判断不是已验证事实。
        evidence_ids:
        - ev-fef3b71b694d8719
      - gate: truth
        status: insufficient
        reason: 未说明肖像授权、内容合规与人工复核边界，交付的确定性与安全边界未知。
        evidence_ids:
        - ev-fef3b71b694d8719
      next_validation: 查看该演示空间的说明与讨论区，确认输入格式、时长限制以及是否附带授权与合规说明。
