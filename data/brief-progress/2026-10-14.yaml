    summary_zh: 高盛与摩根大通拒绝承销一笔利率达 11% 的 AI 芯片相关贷款，表明头部投行对 AI 算力融资的信用风险趋于谨慎。这意味着 AI 基础设施扩张的债务融资渠道可能收窄、成本上升，进而影响算力供给方的资本开支节奏与
      AI 应用侧的算力价格预期（后者为推断）。
    summary_en: Goldman Sachs and JPMorgan declined to underwrite an AI chip-related loan carrying an
      11% interest rate, signaling that top investment banks are turning cautious on the credit risk of
      AI compute financing. This implies that debt financing channels for AI infrastructure expansion
      may narrow and become more expensive, affecting the capex pace of compute suppliers and expectations
      for AI compute prices on the application side (the latter is an inference).
    event_summary_zh: 高盛与摩根大通拒绝承销一笔利率为 11% 的高息 AI 芯片贷款。
