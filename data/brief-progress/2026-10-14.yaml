    summary_zh: 面向做 AI 应用界面的前端与设计工程师：在搭建对话或生成式界面时，它提供一套带材质与触感风格的组件与样式规范，工程师据此拼出界面。具体覆盖哪些组件、是否含可运行代码与文档，公开材料未说明，交付形态仍待核验。
