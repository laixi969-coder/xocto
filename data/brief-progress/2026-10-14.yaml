      and read aerial imagery by hand when inspecting critical assets such as power lines and pipelines;
      HyLight flies its own hydrogen-powered airship to collect the data, applies AI analysis, and delivers
      inspection results and defect findings, with human review still required. Delivery format and accuracy
      metrics remain to be verified.
