    open_source: false
    summary_zh: 做视频、图像等多媒体内容的创作者在作品停在中等水平时，把素材或成稿交给它，得到针对性的改进建议，再自己改一版；它具体接收哪些格式、给出什么粒度的反馈仍待核验。
    inspiration: 趋势是生成工具普及后，瓶颈从“做不出来”转向“做得好不好”，点评与审美反馈成为新环节。切入可考虑面向短视频代运营或广告创意团队做带行业标准的评审服务，按稿件收费；定价未披露，不能预设。
    summary_en: Multimedia creators whose work is stuck at a middling level submit assets or drafts and
      receive targeted improvement advice before revising themselves; which formats it accepts and how
      granular the feedback is still need checking.
    inspiration_en: The trend is that once generation tools spread, the bottleneck shifts from producing
      to producing well, making critique and taste feedback a new step. A wedge is a review service with
      industry standards for short-video agencies or ad creative teams, charged per draft; no pricing
      is disclosed, so none is assumed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 做视频、图像等多媒体内容的创作者，在作品已经能看但不够好时，需要有人指出具体哪里该改，再自己动手改一版。
        job_en: Multimedia creators whose work is watchable but not good enough need someone to point
