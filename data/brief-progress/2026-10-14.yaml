  spacex-and-google-both-said-no-now-his-software-is-riding-a:
    slug: spacex-and-google-both-said-no-now-his-software-is-riding-a
    name: Satlyt
    decision: watching
    event_summary_zh: 2026年10月13日报道，前谷歌与SpaceX产品经理创办的Satlyt完成800万美元融资，用于在卫星上运行AI；其定位是面向多家卫星厂商的开放轨道计算软件，对标SpaceX封闭的一体化方案。
    event_summary_en: 'Reported on 2026-10-13: Satlyt, founded by a former Google and SpaceX product manager,
      raised $8M to run AI on satellites, positioning itself as open orbital-computing software usable
      across multiple satellite operators, in contrast to SpaceX''s closed all-in-one approach.'
    category: 基础层
    project_type: new_application
    industries:
    - 航天
    - 卫星通信
    - 地理空间数据
    industries_en:
