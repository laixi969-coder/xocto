    regions_en:
    - United States
    open_source: false
    summary_zh: 处理敏感数据的公司在让业务部门用大模型时，把请求先送进这个网关，由它做脱敏、模型路由和调用留痕，再返回结果；具体支持哪些模型、部署形态与合规认证仍待核验。
    inspiration: 趋势是受监管行业用模型前先要一层可控的调用与留痕，而不是直接连模型厂商。切入可考虑面向保险理赔、医疗记录、法律尽调这类已有合规压力的场景做行业化网关，把审计材料一并交付；定价未披露，不能预设。
    summary_en: Companies handling sensitive data send requests through this gateway first, which redacts,
      routes to models and logs the call before returning results; supported models, deployment forms
      and compliance certifications still need checking.
    inspiration_en: The trend is that regulated industries need a controllable, logged call layer before
      using models rather than connecting directly to vendors. A wedge is an industry-specific gateway
      for insurance claims, medical records or legal due diligence that ships audit material alongside;
      no pricing is disclosed, so none is assumed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 金融、医疗、法律等处理敏感数据的公司，在让员工用大模型处理内部文档和客户资料时，需要先经过一层脱敏与留痕，才能放行使用。
        job_en: Companies in finance, healthcare and law that handle sensitive data need a redaction and
          logging layer before letting employees use models on internal documents and client material.
        pain_zh: 直接把敏感数据发给模型厂商有合规与泄露风险，安全团队不敢放行，业务部门只能私下用消费级工具，反而更不可控。
        pain_en: Sending sensitive data straight to model vendors carries compliance and leak risk, security
          teams block it, and business units quietly use consumer tools, which is even less controllable.
        current_alternative_zh: 禁用外部模型、自建内部封装，或让员工用个人账号处理后再人工删改。
        current_alternative_en: Banning external models, building an in-house wrapper, or letting staff
          use personal accounts and manually clean up afterwards.
        usage_reason_zh: 推断：网关把脱敏、路由和日志放在一次调用里完成，安全团队不必逐个审批工具，业务部门也不用绕开流程，因此有明确合规压力的公司会先试它；尚无公开客户案例证明已长期使用。
        usage_reason_en: 'Inference: the gateway does redaction, routing and logging in one call, so security
          teams need not approve each tool and business units need not bypass process, which is why companies
          under clear compliance pressure would try it; no public customer case yet shows long-term use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决敏感数据不能直接进模型的问题，痛点是合规不放行导致业务绕道，旧做法是禁用或自建封装，结构上成立。
        evidence_ids:
        - ev-11bb73066bab29dd
      - gate: consensus
        status: insufficient
        reason: 仅见社区讨论 33 点、16 条评论，没有客户名单或采购证据，无法判断共识是否形成。
        evidence_ids:
        - ev-11bb73066bab29dd
      - gate: model
        status: insufficient
        reason: 未见公开定价与买方类型说明，to B 收费路径属判断而非已验证事实。
        evidence_ids:
        - ev-11bb73066bab29dd
      - gate: truth
        status: insufficient
        reason: 脱敏是否彻底、日志能否作为审计材料、人工复核边界均无公开材料支撑。
        evidence_ids:
        - ev-11bb73066bab29dd
      next_validation: 收集 Consus 官方定价页或客户案例，确认其脱敏与审计能力的具体交付形式。
