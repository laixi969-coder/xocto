      - gate: consensus
        status: insufficient
        reason: 已与法国大型能源与交通运营商签约，说明有采购方，但公开材料未给出客户数量、合同金额或续约情况。
        evidence_ids:
        - ev-17c833eb8ceac384
      - gate: model
        status: insufficient
        reason: 融资方与投资额已披露，但未说明按飞行架次、按里程还是按报告收费，买方预算归属仍属推断。
        evidence_ids:
        - ev-17c833eb8ceac384
      - gate: truth
        status: insufficient
        reason: 氢动力飞艇加 AI 分析的交付确定性、缺陷识别准确率与人工复核边界均未公开，需看实测或客户验收材料。
        evidence_ids:
        - ev-17c833eb8ceac384
      next_validation: 收集 HyLight 官网或客户公告中关于巡检服务定价方式、交付报告样例或客户验收结果的公开材料。
