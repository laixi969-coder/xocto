  ai-coding-agents-generate-more-code-but-not-more-software:
    slug: ai-coding-agents-generate-more-code-but-not-more-software
    name: AI coding agents
    decision: market_context
    summary_zh: 哈佛大学研究人员Fiona Chen与James Stratton基于Jellyfish聚合的3亿条工程工作事件及数百家企业的实践数据发现，AI编码工具虽在编码阶段提升效率，但代码审查环节显著变长、拉取请求更易需要修改、审查者评论增多，下游约束吸收了编码阶段的效率增益，几乎没有证据表明企业因此提高软件产出或减少用工。这意味着AI编码代理的采用价值受制于审查与交付流程，工具供应商与企业需要把投入转向审查自动化、质量门禁和流程重构，而非单纯追求生成代码量。
    summary_en: Harvard researchers Fiona Chen and James Stratton, using aggregated analytics from Jellyfish
      covering 300 million engineering work events across hundreds of firms, found that while AI coding
      tools speed up the coding phase, code review lengthens significantly, pull requests more often require
      revisions, and reviewers leave more comments; downstream constraints absorb the coding-phase gains,
      with little evidence that firms increase software output or reduce employment. This means the value
      of AI coding agents is constrained by review and delivery processes, so vendors and enterprises
      must invest in review automation, quality gates, and process redesign rather than raw code volume.
    event_summary_zh: 一项覆盖数百家企业、基于3亿条工程工作事件的研究发现，AI编码工具带来的编码效率提升被代码审查等下游环节吸收，企业软件产出与用工未见明显变化。
    event_summary_en: A study covering hundreds of firms and 300 million engineering work events found
      that coding-phase efficiency gains from AI coding tools are absorbed by downstream steps such as
      code review, with no clear change in software output or employment.
