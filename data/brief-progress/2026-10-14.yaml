    summary_en: A writer opens Kraa 2.0 after finishing a draft, keeps polishing the text in its editor,
      and publishes through the same platform, ending up with a publicly readable piece. The candidate
      material only describes it as a text editor and publishing platform; what the AI receives, which
      step it performs, and whether a human still confirms the output are all unstated, so the concrete
      workflow and deliverable remain unverified.
    inspiration_en: 'Trend: writing and publishing are being folded into one tool, so the editor becomes
      the last step before content goes live rather than just a place to type. Entry point: start with
      independent writers and newsletter operators who have no editorial team, and turn the gap between
      finished draft and published post into one pipeline of formatting, visuals and distribution. Whether
      this product actually uses AI for any of those steps is not stated in the public material, so watch
      for a disclosed action and pricing model first.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 写作者在完成草稿后，需要把文本整理成可对外发布的内容并完成发布，处理对象是自己的稿件。
        job_en: A writer who has finished a draft needs to turn the text into publishable content and
          release it, working on their own manuscript.
        pain_zh: 候选资料没有说明任何具体痛点，既没有写清旧流程里哪一步难受，也没有说明不解决会有什么后果。
        pain_en: 'The candidate material states no concrete pain: it does not identify which step of the
          old process hurts, nor what happens if it is left unsolved.'
        current_alternative_zh: 公开材料未提及用户此前用什么方式写作和发布，无法还原旧替代行为。
        current_alternative_en: The public material does not mention how users wrote and published before,
          so the prior alternative cannot be reconstructed.
        usage_reason_zh: 无法判断。资料只有一句“文本编辑器与发布平台”，既没有说明 AI 承担哪一步，也没有用户反馈或案例支持选择理由，因此不能给出因果解释。
        usage_reason_en: Cannot be judged. The material is a single line describing a text editor and
          publishing platform; it neither says which step the AI handles nor offers user feedback or cases,
          so no causal reason for choosing it can be given.
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决写作到发布之间的衔接，但资料未写出任何具体痛点、旧流程或不采用的后果，连需求都难以还原。
        evidence_ids:
        - ev-c013ac6cd911ada0
      - gate: consensus
        status: insufficient
        reason: 未进入：价值关未成立。资料没有场景描述，也没有任何采用或讨论信号可判断共识卡在哪一环。
        evidence_ids:
        - ev-c013ac6cd911ada0
      - gate: model
        status: insufficient
        reason: 未进入：价值关未成立。资料未披露定价、买方或任何收费方式，无法判断钱从哪来。
        evidence_ids:
        - ev-c013ac6cd911ada0
      - gate: truth
        status: insufficient
        reason: 未进入：价值关未成立。资料未说明 AI 在流程中的具体动作与人工确认边界，无法核对交付是否确定。
        evidence_ids:
        - ev-c013ac6cd911ada0
      next_validation: 抓取 Kraa 官方产品页或更新日志，确认 AI 在写作到发布流程中具体执行哪一步动作，以及是否披露定价。
  kru:
    slug: kru
    name: kru
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息安全
    industries_en:
    - Software development
    - Information security
    jobs:
    - 开发者在让 AI 代理执行需要凭据的任务时，把密码、API 密钥、SSH 身份和 TOTP 交给代理使用而不暴露明文
    jobs_en:
    - Developers letting AI agents run tasks that need credentials, handing over passwords, API keys,
      SSH identities and TOTP without exposing plaintext
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在让 AI 代理执行需要登录或调用接口的任务时，把密码、API 密钥、SSH 身份和 TOTP 交给 kru 保管，代理通过本地 MCP 取用凭据，模型侧看不到明文。用户最终拿到的是代理能完成需要凭据的操作、而密钥不进入模型上下文这一结果。候选资料未说明凭据如何授权、轮换与审计，具体流程仍待核验。
    inspiration: 趋势：代理开始替人执行真实操作，凭据就从“人记住的东西”变成“要交给机器的东西”，谁管这把钥匙谁就卡在代理工作流的入口。切入：可以从给代理做凭据托管与最小授权这一层进入，面向已经在跑自动化代理的工程团队，按托管凭据数量或审计能力收费；但公开材料只有仓库描述与星标，是否有人真正把它放进日常流程尚未核验。
    summary_en: When developers let an AI agent run tasks that require login or API calls, they hand passwords,
      API keys, SSH identities and TOTP to kru, and the agent retrieves credentials through a local MCP
      so the model never sees plaintext. The result is that the agent can complete credential-dependent
      operations while secrets stay out of the model context. The material does not describe how credentials
      are authorized, rotated or audited, so the concrete flow remains unverified.
    inspiration_en: 'Trend: as agents start performing real operations on people''s behalf, credentials
      shift from something a human remembers to something handed to a machine, and whoever holds that
      key sits at the entrance of agent workflows. Entry point: build the credential custody and least-privilege
      layer for agents, aimed at engineering teams already running automated agents, charged by number
      of managed credentials or audit capability. The public material is only a repository description
      and star count, so real day-to-day adoption is unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在让 AI 代理执行需要登录、调用接口或连接服务器的任务时，需要把密码、API 密钥、SSH 身份和 TOTP 交给代理使用，同时不让明文进入模型上下文。
        job_en: When developers let an AI agent run tasks that require login, API calls or server access,
          they must give the agent passwords, API keys, SSH identities and TOTP while keeping plaintext
          out of the model context.
        pain_zh: 代理要干活就得拿到真实凭据，而把密钥直接写进提示词或配置文件，等于把长期有效的秘密暴露给模型和日志；一旦泄露，轮换成本高且影响面大。
        pain_en: An agent cannot act without real credentials, yet pasting secrets into prompts or config
          files exposes long-lived secrets to the model and to logs; a leak is costly to rotate and wide
          in blast radius.
        current_alternative_zh: 常见旧做法是把密钥写进环境变量或配置文件、直接贴进对话，或让代理使用权限过大的长期令牌。
        current_alternative_en: The common old practice is putting secrets in environment variables or
          config files, pasting them into the conversation, or giving the agent an over-privileged long-lived
          token.
        usage_reason_zh: 推断：相较把密钥直接交给模型，kru 把凭据留在本地、由代理通过 MCP 取用，减少了“把明文写进提示词或配置”这一步，因此正在跑自动化代理、又担心密钥进入模型上下文的开发者会选它。是否有留存或团队采用证据，公开材料尚未提供。
        usage_reason_en: 'Inference: compared with handing secrets straight to the model, kru keeps credentials
          local and lets the agent fetch them over MCP, removing the step of writing plaintext into prompts
          or config, so developers running automated agents who worry about secrets entering model context
          would pick it. Public material does not yet show retention or team adoption evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理执行任务时凭据必须可用又不能暴露明文的需求，痛点是密钥进入模型上下文后的泄露与轮换成本。
        evidence_ids:
        - ev-861bd922f765863d
        - ev-b1d04a4a87221232
      - gate: consensus
        status: insufficient
        reason: 仓库有约 125 星标，说明有开发者关注，但公开材料没有使用反馈或案例，无法判断共识卡在感知还是场景。
        evidence_ids:
        - ev-861bd922f765863d
        - ev-b1d04a4a87221232
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未披露任何定价或商业路径，钱可能来自 to B 支持或托管服务，这是判断而非已验证事实。
        evidence_ids:
        - ev-861bd922f765863d
      - gate: truth
        status: insufficient
        reason: 资料未说明凭据授权范围、轮换与审计机制，也无法核对代理取用凭据时的人工确认边界。
        evidence_ids:
        - ev-861bd922f765863d
        - ev-b1d04a4a87221232
      next_validation: 读取 kru 仓库的 README 与 issue/discussion，确认凭据授权、轮换与审计机制，以及是否有团队实际部署的公开记录。
