    inspiration: 趋势：生成式能力正从“出图”下沉到直接产出可执行脚本，把建模动作接进原有软件。切入：可从垂直资产类型（道具、建筑构件、角色绑定）或团队级资产规范切入，卖可复现的脚本与资产而非通用对话。
    summary_en: 'A Blender add-on: modelers describe the model they want in text or an image inside Blender,
      and the add-on generates working bpy code to create and edit 3D models; the user gets a script plus
      the resulting model and still runs and checks it in Blender.'
    inspiration_en: 'Trend: generative capability is moving from producing images to producing executable
      scripts that plug into existing software. Entry: vertical asset types (props, architectural parts,
      rigging) or team-level asset standards, selling reproducible scripts and assets rather than generic
      chat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 3D 建模师或独立游戏美术在 Blender 中需要快速搭出或修改一个具体模型时，用文字或参考图描述需求，让插件产出可运行的 bpy 脚本并生成模型。
        job_en: A 3D modeler or indie game artist who needs to quickly build or modify a specific model
          in Blender describes it in text or a reference image, and the add-on produces runnable bpy code
          and the model.
        pain_zh: 在 Blender 里手工建模或手写 bpy 脚本门槛高、耗时长，非程序员美术难以用脚本批量改模型。
        pain_en: Hand-modeling in Blender or hand-writing bpy scripts is slow and high-threshold, and
          non-programmer artists struggle to batch-modify models via scripts.
        current_alternative_zh: 手工建模、复制粘贴社区脚本、或在外部生成模型再导入 Blender。
        current_alternative_en: Manual modeling, copying community scripts, or generating models externally
          and importing them into Blender.
        usage_reason_zh: 推断：相较手工建模或手写脚本，它把“描述需求”直接转成可运行脚本，省去从零写 bpy 代码这一步，因此不熟悉脚本的美术在需要快速迭代模型时会选择它；是否长期留在工作流尚无留存证据。
        usage_reason_en: 'Inference: versus manual modeling or hand-written scripts, it turns a description
          directly into runnable code, removing the step of writing bpy from scratch, so artists unfamiliar
          with scripting would pick it for fast model iteration; no retention evidence shows it stays
          in the workflow.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 Blender 中建模与脚本门槛高的问题，痛点具体，交付为可运行脚本与模型，结构上成立。
        evidence_ids:
        - ev-dd3520a9742d5ed6
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标，缺少用户评价或案例，无法判断共识卡在感知还是场景。
        evidence_ids:
        - ev-dd3520a9742d5ed6
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或商业路径，买方与收费方式属判断而非已验证事实。
        evidence_ids:
        - ev-dd3520a9742d5ed6
      - gate: truth
        status: insufficient
        reason: 生成脚本能否稳定运行、出错时人工边界如何，公开材料未说明。
        evidence_ids:
        - ev-dd3520a9742d5ed6
      next_validation: 抓取该仓库 README 与 issue/discussion，确认生成脚本的实际成功率与用户反馈。
