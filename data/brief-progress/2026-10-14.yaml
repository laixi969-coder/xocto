        evidence_ids:
        - ev-15eb245f090d09dc
      - gate: model
        status: insufficient
        reason: 未披露定价、收费方式或买方类型，是判断而非已验证事实；航天客户多为项目制采购，付费路径仍不明。
        evidence_ids:
        - ev-15eb245f090d09dc
      - gate: truth
        status: insufficient
        reason: 开放软件能否在多家卫星硬件上确定性交付、算力与安全边界如何，公开材料均未说明。
        evidence_ids:
        - ev-15eb245f090d09dc
      next_validation: 收集 Satlyt 官方产品页或部署文档，确认其支持的卫星平台、在轨运行案例与收费方式。
