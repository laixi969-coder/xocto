        evidence_ids:
        - ev-2229da1586c520b2
      - gate: truth
        status: insufficient
        reason: 频道编排能否确定性交付、是否依赖人工配置均未说明，安全与人工边界也无公开材料。
        evidence_ids:
        - ev-2229da1586c520b2
      next_validation: 收集该插件的官方仓库说明与 issue/discussion，确认频道编排是否由 AI 生成、是否需要人工配置片单。
