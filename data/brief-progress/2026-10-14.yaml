    event_summary_zh: 2026年10月13日报道，Shopify 宣布向更多 AI 代理开放其商品目录：消费者可自行配置 AI 代理代为浏览和下单，不再需要与 Shopify 逐一建立合作集成，可访问目录超过十亿条商品（含站内与站外商品）。此前
      2025 年 9 月 Shopify 与 Meta 合作，仅允许其 Muse 代理代购。
    event_summary_en: 'Reported on 13 October 2026, Shopify said it will open its catalog to more AI agents:
      shoppers can configure their own agents to browse and buy on their behalf without a per-partner
      integration, reaching over a billion listings (both on and off Shopify storefronts). Previously,
      in September 2025, Shopify partnered with Meta so that only its Muse agent could purchase on a person''s
      behalf.'
