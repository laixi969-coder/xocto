    name: Meta
    decision: market_context
    summary_zh: 2026 年 10 月 13 日，Meta、Coinbase、Google、Microsoft、OpenAI、Starlink、Adobe 等科技公司与英国国家犯罪局、美国司法部、FBI
      等执法机构联合宣布，针对尼日利亚、加纳等西非国家的诈骗网络开展首次大规模联合打击行动。Meta 从 Facebook 和 Instagram 移除了超过 370 万个账号、页面和群组。这一跨行业执法协作表明，平台在反诈骗领域的信息共享与联合处置正在制度化，对依赖平台流量和账号体系的
      AI 应用而言，合规与风控成本上升，但也为反欺诈类 AI 工具创造了采用空间。
    summary_en: On October 13, 2026, Meta, Coinbase, Google, Microsoft, OpenAI, Starlink, Adobe and other
      tech companies, together with the UK National Crime Agency, the US Department of Justice, the FBI
      and other agencies, announced the first large-scale joint operation against scam networks based
      in West African nations including Nigeria and Ghana. Meta removed more than 3.7 million accounts,
      pages and groups from Facebook and Instagram. This cross-industry law-enforcement collaboration
      indicates that information sharing and joint takedowns against scams are becoming institutionalized,
      raising compliance and risk-control costs for AI applications that depend on platform traffic and
      account systems, while creating adoption space for anti-fraud AI tools.
    event_summary_zh: Meta、Coinbase、Google、Microsoft、OpenAI、Starlink、Adobe 等科技公司与英国国家犯罪局、美国司法部、FBI 等执法机构联合宣布，针对尼日利亚、加纳等西非国家的诈骗网络开展首次大规模联合打击行动；Meta
      从 Facebook 和 Instagram 移除了超过 370 万个账号、页面和群组。
    event_summary_en: Meta, Coinbase, Google, Microsoft, OpenAI, Starlink, Adobe and other tech companies,
      together with the UK National Crime Agency, the US Department of Justice, the FBI and other agencies,
      announced the first large-scale joint operation against scam networks based in West African nations
      including Nigeria and Ghana; Meta removed more than 3.7 million accounts, pages and groups from
      Facebook and Instagram.
