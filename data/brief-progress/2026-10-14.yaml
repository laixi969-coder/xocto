      cutting mistakes, silences and takes in an editor, Takes for Mac lets Claude Code perform the edit,
      so users hand over raw footage and get a finished cut. The granularity of edit control, human review
      step and export flow still need verification.'
    inspiration_en: 'Trend: editing, a time-intensive task that used to require skilled manual operation,
      is starting to be taken over directly by coding agents, showing that ''agents operating professional
      software'' is moving from demo to daily tool. Entry: start with knowledge bloggers and small marketing
      teams who appear on camera often but cannot afford an editor, charging per finished video or by
      subscription; do not build a generic editor, enter through the narrow talking-head ''record and
      ship'' scenario.'
    req_initial:
