      chat or generative UIs, it supplies a component and style specification with a material, tactile
      look that engineers assemble into screens. Which components are covered, and whether runnable code
      and docs are included, is not stated in the public material; the delivered form still needs verification.'
    inspiration_en: 'Trend: a design-specification supply layer for AI app interfaces is emerging separately
      from models, suggesting competition is shifting from model capability to product feel. Entry: start
      from vertical interface kits, e.g. chat UI specs for legal or clinical intake that ship compliance
      notices, source citations and human-review entry points as defaults, rather than a generic component
      library.'
