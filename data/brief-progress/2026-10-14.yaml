  carbonfarm-raises-7m-to-tackle-methane-emissions-from-rice-c:
    slug: carbonfarm-raises-7m-to-tackle-methane-emissions-from-rice-c
    name: CarbonFarm
    decision: queued
    event_summary_zh: 2026年10月13日，专注水稻脱碳的数字监测、报告与核查（MRV）服务商 CarbonFarm 宣布完成 700 万欧元超额认购的 A 轮融资，由 Colam
      Impact 领投，Proparco、Suma Capital、elea、Working Capital Fund、Albo、Bpifrance 参投，老股东 Serena、makesense（通过
      Racine²）与 Techmind 跟投；资金用于扩展技术并支持全球项目。
    event_summary_en: On 13 October 2026, CarbonFarm, a digital monitoring, reporting and verification
      (MRV) provider focused on rice decarbonisation, announced an oversubscribed EUR 7 million Series
      A led by Colam Impact, with Proparco, Suma Capital, elea, Working Capital Fund, Albo and Bpifrance
      participating, and existing investors Serena, makesense (via Racine²) and Techmind following on;
      the funds are to expand its technology and support projects worldwide.
    category: AI + 商业
    project_type: new_application
    industries:
    - 农业
    - 碳管理与气候金融
    industries_en:
    - Agriculture
    - Carbon management and climate finance
    jobs:
    - 水稻种植与合作社的碳减排项目开发与核查
    jobs_en:
    - Carbon reduction project development and verification for rice farming and cooperatives
    regions:
    - 欧洲
    - 东南亚
    regions_en:
    - Europe
    - Southeast Asia
    open_source: false
    summary_zh: 水稻种植者、合作社、农业企业和地方政府在申请气候资金或核算稻田甲烷减排时，需要把成千上万块小农户田块的水肥管理变化变成可核查的减排量。CarbonFarm 用卫星影像分析结合田间数据采集工具，把改进的水管理实践转化为可监测、可报告、可核查的
      MRV 记录，最终交付给项目方用于碳信用与气候融资；具体核查流程与人工复核边界仍待核验。
    inspiration: 趋势：碳核算正从人工填报走向卫星加田间数据的自动 MRV，水稻这类小农户主导、地块细碎的作物第一次有了可规模化的测量路径。切入：从水稻主产区的合作社或农业企业入手，卖核查结果而非软件席位，与碳信用买方或气候资金对接；难点在于地面数据采集与本地项目开发能力，这恰是非模型壁垒。
    summary_en: Rice growers, cooperatives, agribusinesses and local governments seeking climate finance
      or methane-reduction accounting must turn water and nutrient management changes across thousands
      of smallholder plots into verifiable reductions. CarbonFarm combines satellite imagery analysis
      with field-data collection tools to convert improved water management practices into monitorable,
      reportable and verifiable MRV records delivered to project developers for carbon credits and climate
      finance; the exact verification workflow and human review boundary remain to be verified.
    inspiration_en: 'Trend: carbon accounting is moving from manual reporting to automated MRV built on
      satellite plus field data, giving a smallholder-dominated, fragmented crop like rice a scalable
      measurement path for the first time. Entry: start with cooperatives or agribusinesses in major rice
      regions, sell verified outcomes rather than software seats, and connect to carbon credit buyers
      or climate finance; the hard part is ground data collection and local project development, which
      is precisely the non-model moat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 水稻合作社、农业企业和地方项目开发方在申请碳信用或气候资金时，需要把分散小农户田块上改进的水管理实践，整理成可被买方和核查方接受的减排量记录。
        job_en: Rice cooperatives, agribusinesses and local project developers applying for carbon credits
          or climate finance need to turn improved water management practices on scattered smallholder
          plots into emission-reduction records acceptable to buyers and verifiers.
        pain_zh: 稻田甲烷占人为甲烷排放约 12%，用水占全球淡水约 28%；改进水管理可减排最多 50%、节水 30% 且不减产，但小农户主导意味着要协调数千块田并可靠测量，人工填报既贵又难被采信。
        pain_en: Rice paddies account for roughly 12% of human-caused methane emissions and up to 28%
          of global freshwater use; improved water management can cut emissions by up to 50% and water
          use by 30% without yield loss, but smallholder dominance means coordinating thousands of plots
          and measuring reliably, which manual reporting does poorly and cheaply.
        current_alternative_zh: 项目方通常靠人工田间记录、抽样估算和第三方顾问编制核查报告，成本高、周期长，且难以覆盖大量分散地块。
        current_alternative_en: Project developers typically rely on manual field records, sample-based
          estimates and third-party consultants to compile verification reports, which is costly, slow
          and hard to extend across many scattered plots.
        usage_reason_zh: 推断：相较人工抽样填报，CarbonFarm 用卫星影像批量识别田块与灌溉状态，再用田间采集工具补齐地面数据，把原本需要逐块人工核算的一步压缩为可批量核查的记录，因此需要向碳信用买方或气候资金证明减排量的合作社与项目开发方会选它。
        usage_reason_en: 'Inference: versus manual sampling and reporting, CarbonFarm uses satellite imagery
          to identify plots and irrigation status at scale and field tools to fill in ground data, compressing
          plot-by-plot manual accounting into batch-verifiable records, so cooperatives and project developers
          that must prove reductions to credit buyers or climate funds would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决水稻减排量难以被可靠测量与核查的需求，痛点来自小农户分散与人工填报不可采信，改进水管理的减排与节水收益明确。
        evidence_ids:
        - ev-5355063a8b7899a9
      - gate: consensus
        status: insufficient
        reason: 公开材料只显示融资与业务描述，未见客户名单、采用规模或重复使用证据，买方共识尚无法核验。
        evidence_ids:
        - ev-5355063a8b7899a9
      - gate: model
        status: insufficient
        reason: 未披露定价与收费方式；推断收入可能来自项目开发服务费或碳信用相关分成，属判断而非已验证事实。
        evidence_ids:
        - ev-5355063a8b7899a9
      - gate: truth
        status: insufficient
        reason: 卫星加田间数据的 MRV 路径合理，但核查准确性、人工复核边界与第三方认证情况均未在材料中说明。
        evidence_ids:
        - ev-5355063a8b7899a9
      next_validation: 收集 CarbonFarm 官方定价或项目案例页面，核验其 MRV 交付是否被第三方碳标准认证及收费方式。
