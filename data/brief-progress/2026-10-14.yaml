        usage_reason_en: 'Inference: compared with purely manual review, such an offering could reduce
          the burden of item-by-item entry and comparison if it structures claim documents and produces
          a rule-based first assessment with an audit trail, so high-volume, compliance-heavy claims and
          underwriting teams would choose it at the case triage step; this material does not disclose
          the concrete actions or deliverables, so the judgement rests on positioning and task structure.'
