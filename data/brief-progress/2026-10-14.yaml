    inspiration: 趋势：消费信贷的承保环节正被 AI 重做，且已有公司用组合规模三倍增长和盈利证明这条路能跑通。切入：不要做通用借贷 App，可从西班牙语市场里银行覆盖不足的具体人群（如新移民、自由职业者）或
