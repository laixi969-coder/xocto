          产品营销团队会试用；公开材料未给出用户反馈或留存证据。
        usage_reason_en: 'Inference: compared with templates plus manual research, it turns fixed outputs
          such as battlecards and reviews into installable skills so the agent client already in use drafts
          them, removing the step of building structure from scratch, so B2B product marketing teams without
