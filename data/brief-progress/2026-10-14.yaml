  asd-ste100-skill-zh:
    slug: asd-ste100-skill-zh
    name: asd-ste100-skill-zh
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    - 技术文档与本地化
    industries_en:
    - Software and IT services
    - Technical documentation and localization
    jobs:
    - 技术文档工程师在编写中文说明书或合规文档时，用受控中文规则和确定性 linter 检查用词与句式，产出可交付的受控文本
    jobs_en:
    - Technical writers drafting Chinese manuals or compliance documents use controlled-Chinese rules
      and a deterministic linter to check wording and sentence patterns and deliver controlled text
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 面向写中文技术文档的人：在编写说明书、合规或本地化文本时，把草稿交给这套受控中文写作规则，由仅用标准库的确定性 linter 逐句检查用词与句式，输出可核对的修改结果；人工仍需确认术语与合规判断。具体流程与交付形态仍待核验。
    inspiration: 趋势：受控语言（如航空航天的简化技术英语）正被搬到中文技术写作，规则可被确定性程序检查，而不只是靠模型润色。切入：从医疗器械、航空、工业设备的中文说明书与本地化团队进入，把
      linter 嵌进文档评审环节；可考虑按文档或按团队授权收费，但公开材料未披露定价。
    summary_en: 'For people writing Chinese technical documents: while drafting manuals, compliance or
      localized text, they hand the draft to a set of controlled-Chinese writing rules, and a stdlib-only
      deterministic linter checks wording and sentence patterns sentence by sentence, returning verifiable
      edits; humans still confirm terminology and compliance. The exact workflow and deliverable form
      remain to be verified.'
    inspiration_en: 'Trend: controlled language (such as simplified technical English in aerospace) is
      being ported to Chinese technical writing, where rules can be checked by deterministic programs
      rather than only polished by a model. Entry: start with Chinese manuals and localization teams in
      medical devices, aviation and industrial equipment, embedding the linter into document review; charging
      per document or per team license is conceivable, but no pricing is disclosed in public materials.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 技术文档工程师在编写中文说明书、合规文档或本地化文本时，需要把口语化、歧义的表述改成受控、可核对的句式，并逐句确认用词是否符合规则。
        job_en: Technical writers drafting Chinese manuals, compliance documents or localized text need
          to turn colloquial, ambiguous phrasing into controlled, checkable sentences and confirm sentence
          by sentence whether wording follows the rules.
        pain_zh: 受控写作规则靠人工记忆和逐句比对，容易漏改；通用模型润色会改动术语和句式，反而破坏一致性，且结果不可复现。
        pain_en: Controlled-writing rules rely on human memory and sentence-by-sentence comparison, so
          misses are common; general model polishing alters terminology and sentence patterns, hurting
          consistency, and results are not reproducible.
        current_alternative_zh: 目前多靠人工对照风格指南逐句修改，或用通用大模型润色后再人工复核，缺少可复现的确定性检查。
        current_alternative_en: Today people mostly edit sentence by sentence against a style guide, or
          polish with a general LLM and then review manually, lacking a reproducible deterministic check.
        usage_reason_zh: 相较人工逐句比对或模型润色，它用仅依赖标准库的确定性 linter 直接标出违反受控中文规则的句子，减少人工查找违规表述这一步，并让同一份草稿的检查结果可复现；推断需要统一术语与合规表述的文档团队会因此选择它。
        usage_reason_en: Compared with manual sentence-by-sentence comparison or model polishing, it uses
          a stdlib-only deterministic linter to flag sentences violating controlled-Chinese rules, removing
          the step of manually hunting violations and making checks on the same draft reproducible; teams
          needing consistent terminology and compliance wording would plausibly choose it (inference).
      gates:
      - gate: value
        status: supported
        reason: 它解决中文技术文档写作中受控句式与术语一致性难以逐句核对的问题，痛点具体，交付是可核对的检查结果。
        evidence_ids:
        - ev-16510192fe78ca5a
        - ev-eda5a8673bed142f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标与简介，缺少文档团队采用、评价或案例，无法判断是否形成共识。
        evidence_ids:
        - ev-16510192fe78ca5a
        - ev-eda5a8673bed142f
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价、买方或收费方式；按文档或团队授权收费只是推断，不是已验证事实。
        evidence_ids:
        - ev-16510192fe78ca5a
      - gate: truth
        status: insufficient
        reason: 规则是否覆盖真实合规要求、linter 误报漏报如何，均无公开材料支持，交付确定性待核验。
        evidence_ids:
        - ev-16510192fe78ca5a
        - ev-eda5a8673bed142f
      next_validation: 收集该仓库的 README、规则清单与 issue/discussion，确认 linter 覆盖的规则范围与是否有文档团队实际使用反馈。
