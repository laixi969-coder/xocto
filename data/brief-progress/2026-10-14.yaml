  redesigning-source-control-at-anthropic:
    slug: redesigning-source-control-at-anthropic
    name: Anthropic
    decision: market_context
    event_summary_zh: Anthropic 公开说明其自建代码评审系统 Antique 与源码管理系统 Scion：2026 年 5 月日均合并约 2500 次代码变更，到 9 月已超过
      30000 次；主分支历史接近 100GB，压缩工作副本超过 25GB，每天为 CI 执行约 2500 万次代码检出。
    event_summary_en: 'Anthropic publicly described its in-house code review system Antique and source
      control system Scion: daily merged code changes rose from about 2,500 in May 2026 to over 30,000
      in September; main-branch history is nearly 100 GB, a compressed working copy exceeds 25 GB, and
      roughly 25 million code checkouts per day are performed for CI.'
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是 Anthropic 内部工程基础设施的变化，不是可对外购买的独立产品：AI 生成代码使合并频率与检出量激增，原有 Git 工作流在仓库体积和 CI 检出压力上失效，于是自建
      Antique 与 Scion。对 AI 应用的含义是，代码托管与评审环节的负载假设正在被改写，但该事实仅来自 Anthropic 一家，不能推断整个行业已经转向。
    inspiration: 趋势：当 AI 把代码产出速度提高一个数量级，瓶颈从写代码转移到评审、合并与仓库吞吐，托管与评审层的旧假设开始失效。切入：可从中小团队买得起的托管侧切入，例如面向高频 agent
      提交的评审队列、仓库瘦身与检出缓存服务；Anthropic 自建说明大厂会内化，第三方机会更可能在中小团队与跨云场景，具体定价与需求强度仍待核验。
    summary_en: 'This is a change in Anthropic''s internal engineering infrastructure, not an independently
      purchasable product: AI-generated code pushed merge frequency and checkout volume up sharply, breaking
      the assumptions of its Git workflow on repository size and CI load, so it built Antique and Scion.
      For AI applications it means the load assumptions of code hosting and review are being rewritten,
      but the fact comes from one company only and does not show the whole industry has shifted.'
    inspiration_en: 'Trend: when AI multiplies code output, the bottleneck moves from writing code to
      review, merging and repository throughput, and old assumptions in hosting and review break. Entry:
      sell hosting-side tooling that smaller teams can afford, such as review queues for high-frequency
      agent commits, repository slimming and checkout caching; Anthropic building in-house shows large
      firms will internalize this, so third-party room is more likely in smaller teams and multi-cloud
      settings, with pricing and demand strength still unverified.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: Anthropic 内部工程团队在 AI 生成代码大量涌入时，处理每日数万次代码变更与 CI 检出，要完成评审、合并与仓库吞吐的维持。
        job_en: Anthropic's internal engineering teams handle tens of thousands of daily code changes
          and CI checkouts as AI-generated code floods in, to keep review, merging and repository throughput
          running.
        pain_zh: 公开材料显示合并频率与检出量激增、仓库体积巨大，旧 Git 工作流在评审与检出环节承压；但这是单一公司的内部叙述，未提供外部用户的同类痛点证据。
        pain_en: Public material shows surging merge frequency and checkout volume plus a huge repository,
          straining the old Git workflow at review and checkout; but this is one company's internal account
          with no evidence of the same pain among outside users.
        current_alternative_zh: 继续使用 Git 及其托管平台，配合既有评审流程与 CI 缓存；Anthropic 的选择是自建 Antique 与 Scion 替代。
        current_en: Continuing with Git and its hosting platforms plus existing review flows and CI caching;
          Anthropic's choice was to build Antique and Scion instead.
        usage_reason_zh: 推断：若第三方提供同类能力，可能因省去自建与运维而吸引高频 agent 提交的中小团队；但公开材料未给出任何外部采用、付费或留存证据，因此无法确认用户会因此选择它。
        usage_reason_en: 'Inference: a third party offering similar capability might attract smaller teams
          with high-frequency agent commits by removing build-and-operate work; however no public evidence
          of outside adoption, payment or retention exists, so it cannot be confirmed that users would
          choose it.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决的是 AI 代码激增下的评审与仓库吞吐问题，痛点具体；但材料只来自 Anthropic 内部，未进入独立产品判定，故不给出真需求结论。
        evidence_ids:
