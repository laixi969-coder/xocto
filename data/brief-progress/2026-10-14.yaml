    summary_en: When preparing battlecards, win-loss reviews, positioning and pricing material, launch
      plans and sales enablement content, a competitive intelligence or product marketing person installs
      the Agent Skills offered by LMTY into clients such as Claude Code and Cursor, and the agent produces
      the material from those skills; live evidence is used when LMTY is connected. The exact inputs and
      deliverable format are not detailed in the public material and remain to be verified.
    inspiration_en: 'Trend: functions such as competitive intelligence and product marketing, long supported
      by templates and second-hand research, are being broken into installable skill packs embedded in
      the agent clients engineers and sellers already use. Entry: start with the product marketing teams
      of B2B software firms, turning win-loss records and pricing changes into a reusable evidence source
      and charging per seat or per report; the hard part is not the skills but where exclusive evidence
      comes from.'
