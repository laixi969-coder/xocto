      - gate: model
        status: insufficient
        reason: 按次付费的说法来自产品自述，未见公开定价页或实际付费记录，买方可能是个人创作者或内容团队，属判断而非已验证事实。
        evidence_ids:
        - ev-14c7f2884ec3d04f
      - gate: truth
        status: insufficient
        reason: 生成质量、失败重试与版权边界均无公开材料，交付能否确定性发生尚未核验。
