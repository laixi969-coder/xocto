  mcd-calorie-butler:
    slug: mcd-calorie-butler
    name: 麦麦热量管家
    decision: watching
    category: AI + 生活
    project_type: open_source
    industries:
    - 餐饮
    - 健康管理
    industries_en:
    - Food Service
    - Health Management
    jobs:
    - 减脂期点餐决策
    jobs_en:
    - Calorie-conscious ordering decisions
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 减脂期在麦当劳点餐的人，打开它输入想吃的品类或预算，AI 读取麦当劳 MCP 的菜单与热量数据，按“味热比”给出替换建议，最终拿到一份点餐清单；具体数据来源与人工确认环节仍待核验。
    inspiration: 趋势：连锁餐饮的菜单与营养数据一旦被 MCP 这类接口开放，点餐决策就能被第三方重做，而不必依赖品牌自己的 App。切入：从减脂、控糖、健身增肌这类有明确数值目标的人群进入，先做单一连锁品牌的“热量性价比”点单助手，再考虑按品牌或按营养目标扩展；未披露定价，卖法待核验。
    summary_en: For people ordering at McDonald's while cutting calories, this tool takes a requested
      category or budget, has AI read menu and calorie data through a McDonald's MCP, and returns swap
      suggestions ranked by taste-per-calorie, ending in an order list; the data source and any human
      confirmation step still need verification.
    inspiration_en: 'Trend: once chain restaurants expose menu and nutrition data through interfaces like
      MCP, ordering decisions can be rebuilt by third parties instead of the brand''s own app. Entry:
      start with people who have a numeric goal such as cutting calories, controlling sugar or bulking,
      build a single-chain calorie-value ordering helper, then extend by brand or nutrition goal; pricing
      is undisclosed and the business model is unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 减脂期的人在麦当劳门店或点餐页前，面对整份菜单和热量表，要选出一份既满足口味又不超当日热量预算的组合。
        job_en: A person cutting calories, standing at a McDonald's counter or ordering page, must pick
          a combination from the full menu and calorie table that satisfies taste without exceeding the
          day's calorie budget.
        pain_zh: 菜单热量信息分散、单看热量会牺牲口味，用户要在“想吃”和“该吃”之间反复权衡，容易放弃或点错。
        pain_en: Calorie information is scattered and optimizing purely for calories sacrifices taste,
          forcing repeated trade-offs between wanting and should-eat that lead to giving up or ordering
          wrong.
        current_alternative_zh: 自己查营养表、凭经验估算，或直接用品牌 App 的固定套餐，缺少按口味偏好做替换的步骤。
        current_alternative_en: Checking nutrition tables manually, estimating from experience, or taking
          fixed combos in the brand app, with no step that swaps items by taste preference.
        usage_reason_zh: 推断：相较手动查表，它把菜单和热量数据接进来后直接输出替换后的点餐清单，省掉逐项比对这一步，因此有明确热量目标又不想放弃口味的人会在点餐当下使用它。
        usage_reason_en: 'Inference: versus manual table lookup, it pulls menu and calorie data and outputs
          a swapped order list directly, removing the item-by-item comparison step, so people with a firm
          calorie target who won''t give up taste would use it at the moment of ordering.'
      gates:
      - gate: value
        status: supported
        reason: 它解决减脂人群点餐时热量与口味难兼顾的问题，痛点具体、场景高频，旧做法是手动查表估算；但公开材料未显示用户采用证据。
        evidence_ids:
        - ev-5de42ffc4bc60f9d
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏与派生数据，没有用户评价或讨论说明谁在什么场景下持续使用，共识卡在场景感知一环。
        evidence_ids:
        - ev-5de42ffc4bc60f9d
      - gate: model
        status: insufficient
        reason: 未披露定价或收费方式；可能来自 to C 订阅或品牌合作，这是判断而非已验证事实。
        evidence_ids:
        - ev-5de42ffc4bc60f9d
      - gate: truth
        status: insufficient
        reason: 依赖第三方 MCP 接口，菜单与热量数据的准确性、更新频率和人工确认边界均未说明，交付确定性待核验。
        evidence_ids:
        - ev-5de42ffc4bc60f9d
      next_validation: 收集该开源仓库的 issue、discussion 或 README 中关于麦当劳 MCP 数据来源、更新方式与用户实际使用反馈的公开记录。
  mcd-git:
    slug: mcd-git
    name: mcd-git
    decision: watching
    category: AI + 生活
    project_type: open_source
    industries:
    - 餐饮零售
    - 快餐连锁
    industries_en:
    - Food & Beverage Retail
    - Quick Service Restaurants
    jobs:
    - 开发者个人点餐与晒单
    jobs_en:
    - Developer personal ordering and shareable receipts
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 开发者在自己终端里点麦当劳时打开它：把购物车、凑单和下单映射成 git 的 add、rebase、push，AI 侧通过麦当劳 MCP 读取菜单与优惠并生成下单动作，最后产出
      3D 汉堡天际线或年度小票式的分享图；下单前仍需用户确认，具体核价与交付流程仍待核验。
    inspiration: 趋势是点餐这类高频消费动作开始被接进命令行与 Agent 技能，接口由品牌 MCP 提供而非爬虫。切入可考虑把同一套「菜单+优惠券+确认下单」的接口做成面向企业团餐或连锁门店的批量点单与对账工具，而不是继续做个人玩具。
    summary_en: 'A developer opens this in their terminal when ordering McDonald''s: cart, deal-stacking
      and checkout are mapped onto git''s add, rebase and push, with the AI side reading menu and coupons
      through a McDonald''s MCP server and producing a shareable 3D burger skyline or annual receipt image;
      the user still confirms before ordering, and pricing and delivery flow remain unverified.'
    inspiration_en: The trend is that everyday ordering is being wired into command lines and agent skills,
      with the interface supplied by a brand MCP rather than scrapers. A wedge is to turn the same menu-plus-coupon-plus-confirm-order
      interface into bulk ordering and reconciliation for corporate group meals or chain outlets, instead
      of another personal toy.
    req_initial:
      verdict: pseudo_demand
      signal_level: 需求存疑
      demand_read:
        job_zh: 开发者个人在终端里点一份麦当劳，需要选品、凑优惠并完成下单，同时想生成一张可分享的消费图。
        job_en: An individual developer ordering McDonald's from a terminal, needing to pick items, stack
          discounts and check out, plus generate a shareable consumption image.
        pain_zh: 用 git 语法点餐并不比打开官方 App 更省事，凑单和优惠在官方 App 里同样能完成；痛点主要是趣味和晒图，而非真实受阻。
        pain_en: Ordering via git syntax is no easier than the official app, and deal-stacking is already
          handled there; the pain is novelty and sharing, not a real blocker.
        current_alternative_zh: 麦当劳官方 App 或小程序点餐，优惠券由官方直接展示；晒单则用截图。
        current_alternative_en: The official McDonald's app or mini-program, where coupons are shown directly;
          sharing is done via screenshots.
        usage_reason_zh: 推断：只有把点餐当作可展示的开发者趣味、或想用命令行统一操作习惯的人才会选它，它减少的是切换 App 的动作，而不是点餐本身的负担。
        usage_reason_en: 'Inference: it appeals mainly to developers treating ordering as a displayable
          joke or wanting one command-line habit; it removes app-switching, not the burden of ordering
          itself.'
      gates:
      - gate: value
        status: challenged
        reason: 它解决的是终端点餐与晒图的趣味需求，官方 App 已覆盖选品、优惠与下单，不用它也不会失去什么，刚性不足。
        evidence_ids:
        - ev-a35b133311e31254
        - ev-bd4cefcb9497d21b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 77 增至 78，属于关注度信号，无法说明有人把它留在日常点餐流程里。
        evidence_ids:
        - ev-a35b133311e31254
        - ev-bd4cefcb9497d21b
      - gate: model
        status: insufficient
        reason: 开源项目无定价页，买方与付费路径均未披露；依赖麦当劳 MCP 的授权与调用额度，商业化路径不明。
        evidence_ids:
        - ev-bd4cefcb9497d21b
      - gate: truth
        status: insufficient
        reason: 下单前需用户确认，安全边界清楚；但核价是否与官方一致、优惠是否真实可用均无公开材料支持。
        evidence_ids:
        - ev-a35b133311e31254
      next_validation: 收集该仓库 README 与 issue/discussion 中关于实际下单成功率、核价一致性与优惠可用性的公开记录。
  mcd-saver-strategist:
