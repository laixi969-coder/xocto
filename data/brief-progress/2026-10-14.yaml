      image reading toward low-cost flight platforms with automated defect detection, packaged as a single
      delivered service. Entry: start with grid, pipeline or rail operators that already have mandatory
      inspection cycles and charge per kilometre inspected or per report rather than selling airships
      or software seats; a similar team could first bind one provincial maintenance operator to prove
      delivery.'
