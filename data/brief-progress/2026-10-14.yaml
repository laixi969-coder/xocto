  苏姿丰将2026年称为推理之年amd预测2030年cpu市场空间翻倍至2000亿美元:
    slug: 苏姿丰将2026年称为推理之年amd预测2030年cpu市场空间翻倍至2000亿美元
    name: AMD
    decision: market_context
    summary_zh: 2026年10月13日，AMD CEO苏姿丰公开将2026年称为“推理之年”，并预测到2030年CPU市场空间将翻倍至2000亿美元。这一表态意味着AMD把AI推理负载视为下一阶段算力需求的主要增长点，若推理需求确实从训练侧向部署侧转移，AI应用的单次调用成本与本地化部署可行性将随之改变，服务器CPU与加速器的竞争格局也可能被重新划分；上述市场空间预测为AMD自身判断，尚待验证。
    summary_en: On October 13, 2026, AMD CEO Lisa Su publicly called 2026 the "year of inference" and
      forecast that the CPU market will double to $200 billion by 2030. The statement positions AI inference
      workloads as the next main driver of compute demand; if demand does shift from training toward deployment,
      the per-call cost of AI applications and the feasibility of on-premise deployment would change accordingly,
      and competition between server CPUs and accelerators could be redrawn. The market-size forecast
      is AMD's own projection and remains unverified.
    event_summary_zh: AMD CEO苏姿丰将2026年称为“推理之年”，并预测2030年CPU市场空间翻倍至2000亿美元。
    event_summary_en: AMD CEO Lisa Su called 2026 the "year of inference" and forecast the CPU market
      will double to $200 billion by 2030.
