    summary_zh: 面向为编码代理搭建运行环境的开发者：当团队要把代理接进真实代码仓库时，它提供一个开源内核来承载代理的执行与调度，最终交付一套可自托管的代理运行底座；具体接入流程、支持的仓库类型与交付边界仍待核验。
    inspiration: 趋势是编码代理从单次对话走向需要长期驻留的执行底座，谁掌握代理与代码仓库之间的那一层，谁就掌握后续的计费与分发位置。切入可考虑从已有大量私有仓库、又必须自托管的中大型研发团队入手，按托管实例或私有部署收费；公开材料尚未披露定价，属推断。
    summary_en: 'For developers building a runtime for coding agents: when a team needs to wire agents
      into real code repositories, it offers an open-source kernel that carries agent execution and orchestration,
      delivering a self-hostable agent runtime; the exact onboarding flow, supported repository types
      and delivery boundary still need verification.'
    inspiration_en: The trend is coding agents moving from one-off chat toward a long-lived execution
      substrate; whoever owns the layer between agents and repositories owns the later billing and distribution
      position. A plausible entry is mid-to-large engineering teams with many private repos that must
      self-host, charged per hosted instance or private deployment; no public pricing is disclosed, so
      this is inference.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 开发者在把编码代理接入真实代码仓库时，需要处理仓库接入、代理调度与执行环境配置，要得到一套可复用、可自托管的代理运行底座。
        job_en: Developers wiring coding agents into real repositories must handle repo access, agent
          orchestration and execution environment setup to obtain a reusable, self-hostable agent runtime.
        pain_zh: 公开材料只给出“编码代理的开源内核”一句定位，未说明它替代了哪一步手工操作、谁在什么情况下会痛，痛点无法从现有事实还原。
        pain_en: Public material gives only the one-line positioning 'open-source kernel for coding agents'
          and does not say which manual step it replaces or who hurts under what circumstances, so the
          pain cannot be reconstructed from available facts.
        current_alternative_zh: 开发者目前自行拼接代理框架、容器与仓库权限脚本，或直接使用各家编码代理自带的运行环境。
        current_alternative_en: Developers currently stitch together agent frameworks, containers and
          repo-permission scripts, or simply use the runtime bundled with each coding agent.
        usage_reason_zh: 推断：若它能把仓库接入与代理调度收敛成一个自托管内核，团队可省去自行维护执行环境的一步；但公开材料未说明具体动作与可核对结果，因此无法确认用户为何选择它。
        usage_reason_en: 'Inference: if it collapses repo access and agent orchestration into one self-hosted
          kernel, teams could skip maintaining their own execution environment; but public material does
          not describe the concrete action or a checkable result, so why users would choose it cannot
          be confirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决编码代理接入真实仓库时的运行环境问题，但公开材料只有一句定位，说不清替代了哪一步旧操作、谁在什么情况下痛，价值结构无法还原。
        evidence_ids:
        - ev-3e5877b1f2cad1ed
      - gate: consensus
        status: insufficient
        reason: 未进入：仅有一条产品页定位描述，没有采用、讨论或客户案例，无法判断共识卡在哪一环。
        evidence_ids:
        - ev-3e5877b1f2cad1ed
      - gate: model
        status: insufficient
        reason: 未进入：开源项目，公开材料未说明托管、私有部署或支持服务的收费路径，买方与付费方式均未知。
        evidence_ids:
        - ev-3e5877b1f2cad1ed
      - gate: truth
        status: insufficient
        reason: 未进入：无法核对它是否贴近该工作的第一性目标，也无法判断承诺能否确定性交付。
        evidence_ids:
        - ev-3e5877b1f2cad1ed
      next_validation: 收集该开源仓库的 README 与 issue/discussion，确认它实际替代的旧步骤、支持的仓库类型与部署方式。
