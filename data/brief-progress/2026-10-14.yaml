      app PineDrama, launched in December 2025, passed 100 million cumulative downloads with about 7 million
      DAU and over 12 million downloads in September 2026 alone; it first launched in Brazil, the US and
      Indonesia with free full-episode viewing, ad monetization and a watch-to-earn coin mechanic.
    category: AI + 创作
    project_type: new_application
    industries:
    - 内容与娱乐
    - 广告与营销
    industries_en:
    - Media & Entertainment
    - Advertising & Marketing
    jobs:
    - 短剧内容运营与投放人员在免费短剧应用里筛选、编排和分发剧集，用广告与激励任务把观看转化为留存和收入
    jobs_en:
    - Short-drama content operations and monetization staff curating, scheduling and distributing episodes
      inside a free short-drama app, converting viewing into retention and ad revenue
    regions:
    - 巴西
    - 美国
    - 印尼
    regions_en:
    - Brazil
    - United States
    - Indonesia
