  laplace-intelligence-red-teams-robots-and-self-driving-cars:
    slug: laplace-intelligence-red-teams-robots-and-self-driving-cars
    name: Laplace Intelligence
    decision: watching
    event_summary_zh: 2026年10月13日报道，密歇根大学分拆公司 Laplace Intelligence 用 AI 智能体与交互式仿真在部署前对机器人和自动驾驶车辆做压力测试，并称公司已盈利，正在参加
      10 月 13-15 日旧金山 公开资料 Disrupt 的 Startup Battlefield。
    event_summary_en: 'Reported on October 13, 2026: University of Michigan spinout Laplace Intelligence
      uses AI agents and interactive simulation to stress-test robots and self-driving vehicles before
      deployment; it is described as profitable and is competing in Startup Battlefield at public reporting
      Disrupt in San Francisco on October 13-15.'
    category: AI + 开发
    project_type: new_application
    industries:
    - 自动驾驶与机器人
    - 汽车
    - 工业制造
    industries_en:
    - Autonomous vehicles and robotics
    - Automotive
    - Industrial manufacturing
    jobs:
    - 安全验证工程师
    - 自动驾驶测试工程师
    jobs_en:
    - Safety validation engineer
    - Autonomous driving test engineer
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 机器人或自动驾驶团队在实车、实机上路前，需要把感知与决策的失效场景找出来；Laplace Intelligence 让 AI 智能体在交互式仿真里生成并执行对抗性场景，输出可复现的失效案例供工程团队修复。具体场景库规模、交付形式与人工复核环节仍待核验。
    inspiration: 趋势：安全验证正从人工设计测试用例转向由智能体自动生成对抗场景，验证环节本身成为可收费的独立供给。切入：面向自动驾驶与机器人厂商的合规与安全团队，按验证项目或场景包收费；公开材料未披露定价，需先核验其场景库与客户案例。
    summary_en: Before robots or self-driving vehicles hit real roads, teams must surface failure modes
      in perception and decision-making; Laplace Intelligence has AI agents generate and run adversarial
      scenarios inside interactive simulation, producing reproducible failure cases for engineering teams
      to fix. Scenario-library scale, delivery format and human review steps still need verification.
    inspiration_en: 'Trend: safety validation is shifting from hand-written test cases to agent-generated
      adversarial scenarios, making validation itself a sellable standalone supply. Entry: sell to safety
      and compliance teams at autonomous-vehicle and robotics makers, priced per validation project or
      scenario pack; no public pricing is disclosed, so its scenario library and customer cases need verification
      first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自动驾驶或机器人公司的安全验证工程师，在车辆或机器人量产、上路前，处理仿真与路测数据，要找出会导致碰撞或误动作的失效场景并形成可复现的测试用例。
        job_en: A safety validation engineer at an autonomous-vehicle or robotics company, before a vehicle
          or robot ships or drives on public roads, works with simulation and road-test data to find failure
          scenarios that cause collisions or wrong actions and turn them into reproducible test cases.
        pain_zh: 人工设计对抗场景覆盖有限、耗时长，遗漏的边界情况要到实车阶段才暴露，返工成本高。
        pain_en: Hand-designed adversarial scenarios cover little and take long; missed edge cases only
          surface at the real-vehicle stage, where rework is expensive.
        current_alternative_zh: 内部测试团队手工编写场景、采购传统仿真软件，或直接靠实车路测积累里程。
        current_alternative_en: In-house test teams hand-write scenarios, buy traditional simulation software,
          or simply accumulate mileage through real-vehicle road testing.
        usage_reason_zh: 推断：相较手工编写用例，它让智能体自动生成并执行对抗场景，把“想不出边界情况”这一步交给系统，工程师只需复核输出的失效案例，因此覆盖面和复现性更可核对；缺少公开客户案例与留存数据，长期采用尚未证实。
        usage_reason_en: 'Inference: versus hand-written cases, it has agents generate and run adversarial
          scenarios, moving the ''can''t think of edge cases'' step to the system so engineers only review
          the surfaced failure cases, making coverage and reproducibility more checkable; public customer
          cases and retention data are missing, so long-term adoption is unproven.'
      gates:
      - gate: value
        status: supported
        reason: 它解决部署前失效场景覆盖不足、边界情况靠实车才暴露的痛点，旧做法是人工写用例与路测，结构上成立。
        evidence_ids:
        - ev-a2282e30891f2d21
      - gate: consensus
        status: insufficient
        reason: 仅有参加创业赛事的报道，未见客户名单、场景库规模或行业采购共识的公开证据。
        evidence_ids:
        - ev-a2282e30891f2d21
      - gate: model
        status: insufficient
        reason: 报道称公司已盈利，但未披露定价、买方类型与合同结构，收入来源属推断。
        evidence_ids:
        - ev-a2282e30891f2d21
      - gate: truth
        status: insufficient
        reason: 仿真验证能否覆盖真实道路的长尾风险、人工复核边界如何划分，公开材料未说明。
        evidence_ids:
        - ev-a2282e30891f2d21
      next_validation: 收集 Laplace Intelligence 官方产品页或客户案例，核验其场景库规模、交付形式与是否披露定价。
  less-scrolling-more-living-how-whimscope-is-turning-everyday:
    slug: less-scrolling-more-living-how-whimscope-is-turning-everyday
    name: Whimscope
    decision: watching
    event_summary_zh: 2026年10月13日报道，消费应用 Whimscope 于 2026 年 8 月 7 日在苹果 App Store 公开发布，此前经过小范围封闭测试；它按用户可用的时间、精力和心情推荐可执行的小型活动，并以
      Dream、Plan、Do 三步记录完成经历。
    event_summary_en: 'Reported on October 13, 2026: consumer app Whimscope launched publicly on the Apple
      App Store on August 7, 2026 after closed testing with a small group; it suggests doable small activities
      based on available time, energy and mood, and records completed experiences through a Dream, Plan,
      Do flow.'
    category: AI + 生活
    project_type: new_application
    industries:
    - 消费应用
    - 本地生活与休闲
    industries_en:
    - Consumer apps
    - Local life and leisure
    jobs:
    - 个人休闲活动规划
    jobs_en:
