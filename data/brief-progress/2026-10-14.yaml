    summary_en: Spanish consumers needing short-term liquidity or instalment shopping open Plazo, submit
      identity and income materials, and receive an AI-underwritten limit and repayment plan, with payments,
      shopping rewards and short-term borrowing in one app; the deliverable is a usable credit line and
      instalment plan, while the human review boundary remains unverified.
    inspiration_en: 'Trend: AI is redoing consumer-credit underwriting, and one company claims a tripled
      portfolio and profitability. Entry: avoid a generic lending app; enter via under-served Spanish-speaking
      segments (new migrants, freelancers) or the merchant-side BNPL risk and disbursement step, selling
      outcomes rather than tools.'
