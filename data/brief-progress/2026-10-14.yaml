      demand_read:
        job_zh: 西班牙消费者在需要短期周转或分期购物时，打开 Plazo 提交身份与收入材料，要拿到一笔可用的授信额度和还款方案。
        job_en: Spanish consumers needing short-term liquidity or instalment shopping open Plazo, submit
          identity and income materials, and need a usable credit line and repayment plan.
        pain_zh: 传统银行审批慢、材料多，信用记录薄的人群常被拒；短期资金缺口只能靠高成本替代渠道解决。
        pain_en: Traditional bank approval is slow and document-heavy, thin-file applicants are often
          rejected, and short-term gaps are covered by high-cost alternatives.
        current_alternative_zh: 线下银行网点、传统消费信贷机构，或非正规高息借贷渠道。
        current_alternative_en: Bank branches, traditional consumer lenders, or informal high-interest
          borrowing.
        usage_reason_zh: 推断：相较跑网点或等银行数日审批，Plazo 把身份与收入材料一次性提交后由 AI 承保即时给出额度，减少了往返与等待这一步负担，因此急需短期资金且银行覆盖不足的西班牙消费者会在该情境下选择它。
        usage_reason_en: 'Inference: versus visiting branches or waiting days for bank approval, Plazo
          takes identity and income materials once and returns an AI-underwritten limit immediately, removing
          the trip-and-wait step, so under-served Spanish consumers with urgent short-term needs would
          choose it in that situation.'
      gates:
