        evidence_ids:
        - ev-25f6f367bf10636a
      - gate: truth
        status: insufficient
        reason: AI 承保的合规边界、坏账与人工复核机制未公开，承诺能否确定性交付仍缺材料。
        evidence_ids:
        - ev-25f6f367bf10636a
      next_validation: 收集 Plazo 官方定价与费用页或西班牙监管机构（CNMV/Banco de España）公开的信贷机构登记与合规披露。
