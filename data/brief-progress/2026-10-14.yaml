  dishwasherbench:
    slug: dishwasherbench
    name: DishwasherBench
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 机器人学习研究者评估具身模型在真实家务操作上的表现
    - 机器人学习研究者评估具身模型在真实家务操作上的表现
    jobs_en:
    - Robotics researchers evaluating embodied models on real household manipulation tasks
    - Robotics researchers evaluating embodied models on real household manipulation tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 研究者或机器人团队在评测具身模型时，打开这个开源基准，把“把餐具装进洗碗机”这类真实家务操作交给前沿模型执行并记录结果，最终得到可比较的模型能力评分；具体评分口径、任务数量与是否含人工复核仍待核验。
    inspiration: 趋势：具身智能的评测正从仿真抓取转向“洗碗机装碗”这类有明确成败判定的家务流程，说明家务机器人开始需要可复现的验收标准。切入：可从家电厂商或租赁公寓的售后场景切，把“装载合格率”做成按次结算的验收服务，而不是卖模型；价格未披露，不做假设。
    summary_en: 'Researchers and robotics teams open this open-source benchmark when evaluating embodied
      models: they hand real household manipulation tasks such as loading a dishwasher to frontier models
      and record the outcomes, ending with comparable capability scores. The scoring rubric, task count
      and whether human review is included still need verification.'
    inspiration_en: 'Trend: embodied-AI evaluation is moving from simulated grasping to household routines
      like dishwasher loading that have a clear pass/fail, meaning home robots now need reproducible acceptance
      criteria. Entry: start from appliance makers or rental-property after-sales, selling per-run acceptance
      of load success rather than a model; no pricing is disclosed, so none is assumed.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 机器人学习研究者或具身智能团队在需要横向比较不同前沿模型的家务操作能力时，用统一任务集跑评测，产出可对比的分数。
        job_en: Robotics researchers or embodied-AI teams comparing frontier models' household manipulation
          ability run a shared task set to produce comparable scores.
        pain_zh: 家务操作缺少公认的验收标准，各家自建任务，结果无法横向比较，也无法判断模型是否真能完成一次完整装载。
        pain_en: Household manipulation lacks an accepted acceptance standard; each lab builds its own
          tasks, so results cannot be compared and it is unclear whether a model can complete a full load.
        current_alternative_zh: 自建仿真环境或小规模真机试验，靠论文里的自定义指标和视频演示说明能力。
        current_alternative_en: Self-built simulation environments or small real-robot trials, described
          through paper-specific metrics and demo videos.
        usage_reason_zh: 推断：相较自建任务，它把同一套家务流程固定下来，使不同模型的失败点可以直接对照，因此做具身评测或采购选型的研究者会先跑它；但目前没有公开证据显示有人已把它纳入常规评测流程。
        usage_reason_en: 'Inference: versus self-built tasks, it fixes one household routine so failure
          points across models can be compared directly, which is why researchers doing embodied evaluation
          or procurement screening would run it first; no public evidence yet shows it is part of a routine
          evaluation pipeline.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决的是具身模型缺少统一家务验收标准的问题，痛点真实但刚性未明：评测失败不直接造成损失，且尚无用户采用证据。
        evidence_ids:
        - ev-b1453747580fcbd5
      - gate: consensus
        status: insufficient
        reason: 社区讨论集中在“前沿模型能否装好洗碗机”这一话题，属于关注度而非持续采用，无法判断是否形成评测共识。
        evidence_ids:
        - ev-b1453747580fcbd5
      - gate: model
        status: insufficient
        reason: 开源基准本身没有披露付费路径，买方可能是机器人厂商或研究机构，这是判断而非已验证事实。
        evidence_ids:
        - ev-b1453747580fcbd5
      - gate: truth
        status: insufficient
        reason: 任务集、评分口径与是否含人工复核均未在材料中说明，承诺能否确定性交付无法核对。
        evidence_ids:
        - ev-b1453747580fcbd5
      next_validation: 收集该仓库的 README、任务清单与 issue/discussion，确认评测口径、任务数量及是否有外部团队提交结果。
  disney-offers-20m-for-characterais-scandal-plagued-chatbot-t:
    slug: disney-offers-20m-for-characterais-scandal-plagued-chatbot-t
    name: Character.AI
    decision: market_context
    event_summary_zh: 2026年10月，Character Technologies 在破产程序中披露，迪士尼出价 2000 万美元，购买其部分知识产权的“非独占永久许可”，具体资产范围未详细说明；此前
      2025 年 9 月迪士尼曾发停止侵权函，指控其滥用迪士尼角色。
    event_summary_en: In October 2026, during bankruptcy proceedings, Character Technologies disclosed
      that Disney offered $20 million for a "non-exclusive perpetual license" to certain of its intellectual
      property, without detailing which assets; in September 2025 Disney had sent a cease-and-desist accusing
      it of weaponizing Disney characters.
    category: 通用助手
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是一条关于角色对话类 AI 产品资产处置的行业事件：Character.AI 的运营方进入破产程序，迪士尼以 2000 万美元报价取得其部分知识产权的非独占永久许可。它反映的是角色
      IP 与生成式对话产品之间的版权与资产归属变化，而非一个可独立评估的新产品。
    inspiration: 趋势：角色 IP 方开始以许可或收购方式回收被生成式产品占用的形象资产，版权谈判从诉讼走向资产交易。切入：做角色类 AI 应用的团队应把 IP 授权成本与合规链路前置到产品设计里，而不是等规模起来后再补授权；面向版权方的授权管理与收益分成工具是可能的方向，但具体定价与需求强度仍待核验。
    summary_en: 'This is an industry event about asset disposal in a character-chatbot business: the operator
      of Character.AI entered bankruptcy proceedings, and Disney bid $20 million for a non-exclusive perpetual
      license to part of its intellectual property. It reflects a shift in copyright and asset ownership
      between character IP holders and generative chat products, not a new product that can be assessed
      on its own.'
    inspiration_en: 'Trend: character IP holders are starting to reclaim likeness assets used by generative
      products through licensing or acquisition, moving from litigation to asset deals. Entry point: teams
      building character AI apps should front-load IP licensing cost and compliance into product design
      rather than retrofitting after scale; licensing management and revenue-share tooling for rights
      holders is a possible direction, though pricing and demand strength remain unverified.'
  dlss-5-gets-toned-down-for-its-hogwarts-legacy-debut-next-mo:
    slug: dlss-5-gets-toned-down-for-its-hogwarts-legacy-debut-next-mo
    name: Nvidia DLSS 5
    decision: market_context
    event_summary_zh: 2026年10月，英伟达公布 DLSS 5 的新对比截图，显示其在《霍格沃茨之遗》正式上线前大幅收敛了此前引发争议的面部生成改动；该技术年初首次展示时因把角色面部改得明显失真而被玩家批评为“给游戏加生成式
      AI”。
    event_summary_en: In October 2026, Nvidia published new comparison screenshots showing DLSS 5 has
      significantly toned down the controversial facial-generation changes ahead of its proper debut in
      Hogwarts Legacy; when first shown earlier this year, the technology was criticized by gamers as
      "gen AI for video games" for visibly distorting character faces.
    category: 基础层
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是显卡厂商在游戏渲染管线中调整生成式增强效果的一次技术更新：DLSS 5 在正式进入《霍格沃茨之遗》前，把此前被批评的面部改动幅度调小。它属于平台级渲染能力变化，不是可独立评估的
      AI 应用产品。
    inspiration: 趋势：生成式增强进入游戏渲染管线后，玩家对“改脸”这类不可控改动的容忍度很低，厂商被迫在效果与保真之间回退。切入：面向游戏工作室的资产与画质一致性校验工具、以及可回滚的生成式后处理配置层，是可能的方向；但该判断基于一次效果调整，不能推断整个游戏行业已转向。
    summary_en: 'This is a technical update in which a GPU vendor adjusted generative enhancement inside
      the game rendering pipeline: DLSS 5 reduced the previously criticized magnitude of facial changes
      before its proper debut in Hogwarts Legacy. It is a platform-level rendering capability change,
      not an independently assessable AI application product.'
    inspiration_en: 'Trend: once generative enhancement enters the game rendering pipeline, players show
      low tolerance for uncontrollable changes such as altered faces, forcing vendors to roll back between
      effect and fidelity. Entry point: asset and visual-consistency validation tools for game studios,
      plus a rollback-capable configuration layer for generative post-processing, are possible directions;
      this judgment rests on a single effect adjustment and cannot be generalized to the whole game industry.'
  dyna-2-general-purpose-physical-agents-with-hour-long-autono:
    slug: dyna-2-general-purpose-physical-agents-with-hour-long-autono
    name: Dyna Robotics
    decision: watching
    event_summary_zh: Dyna Robotics 在发布 Dyna-2 世界动作模型（据称用一百万小时人类视频预训练）后，推出实体机器人代理 Dyna-2.1；据访谈材料，其叠餐巾任务连续
      24 小时成功率达 99.4%，并已在鼎泰丰每日折叠数千张餐巾。
    event_summary_en: After announcing the Dyna-2 world-action model (reportedly pre-trained on one million
      hours of human video), Dyna Robotics followed up with Dyna-2.1, a physical robot agent; per the
      interview material it reached a 99.4% success rate folding restaurant napkins for 24 hours straight
      and already folds thousands of napkins daily at Din Tai Fung.
    category: 基础层
    project_type: new_application
    industries:
    - 餐饮服务
    - 机器人
    - 制造业
    industries_en:
    - Food Service
    - Robotics
    - Manufacturing
    jobs:
    - 餐饮后厨备料与餐巾折叠
    - 机器人现场部署与运维
    jobs_en:
    - Restaurant back-of-house prep and napkin folding
    - Robot on-site deployment and operations
    regions:
    - 美国
    - 中国台湾
    regions_en:
    - United States
    - Taiwan
    open_source: false
    summary_zh: 餐饮门店后厨在备餐高峰需要有人反复折叠餐巾、整理成堆，Dyna Robotics 的机器人代理接收摄像头视觉与自身动作反馈，在真实台面上完成抓取、折叠、堆叠，并在整摞被碰倒后自行恢复；门店最终拿到的是持续数小时无人值守的折叠产出，据访谈材料在鼎泰丰每日折叠数千张，人工仍需负责异常处理与现场安全。
    inspiration: 趋势：物理操作正从演示视频走向按小时计的连续自主，衡量标准变成成功率与恢复能力，而不是动作好看。切入：从餐饮、食品加工这类重复、可计数、容错窗口明确的备料环节进入，按折叠件数或按班次卖结果，而不是卖机器人本体；先做单店单工位的连续运行数据，再谈复制。
    summary_en: In restaurant back-of-house prep, staff repeatedly fold and stack napkins during peak
      service. Dyna Robotics' robot agent takes camera vision and its own motion feedback, then grasps,
      folds and stacks on a real counter, recovering by itself after knocking over the whole stack; the
      store gets hours of unattended folding output, reportedly thousands of napkins a day at Din Tai
      Fung, while humans still handle exceptions and on-site safety.
    inspiration_en: 'Trend: physical manipulation is moving from demo videos to hour-scale autonomy, judged
      by success rate and recovery rather than how the motion looks. Entry: start with repetitive, countable
      prep steps in restaurants and food processing where the tolerance window is clear, and sell outcomes
      per folded item or per shift instead of selling the robot; collect continuous single-station run
      data before talking about replication.'
    req_initial:
