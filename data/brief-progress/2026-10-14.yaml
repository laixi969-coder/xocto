    name: Muse Wonder
    decision: market_context
    summary_zh: 2026 年 10 月，Meta AI 发布其称为“最强能力”的新模型 Muse Wonder 及 Muse Wonder Full，第三方评测将 Muse Wonder（Max）评为与
      GPT-6.1 Sol 相当，可能是 Meta 首批 Fable 级模型；Meta 自 8 月 5 日 Muse 1.2、9 月 2 日 Muse 1.3 以来保持约每月一次模型迭代。这一发布节奏与能力跃升表明前沿模型供给持续加速，模型能力差距在缩小，应用方获得更多可替代选择，但快速迭代也提高了模型选型、评测与迁移的持续成本。
    summary_en: In October 2026, Meta AI released Muse Wonder and Muse Wonder Full, which it calls its
      "most capable models"; third-party evaluation rates Muse Wonder (Max) as equivalent to GPT-6.1 Sol,
      possibly Meta's first Fable-class models, with Meta iterating roughly monthly since Muse 1.2 on
      August 5 and Muse 1.3 on September 2. This release cadence and capability jump indicate that frontier
      model supply continues to accelerate and capability gaps are narrowing, giving application builders
      more substitutable options, while rapid iteration also raises the ongoing cost of model selection,
      evaluation and migration.
    event_summary_zh: Meta AI 发布新模型 Muse Wonder 及 Muse Wonder Full，称其为“最强能力”模型，第三方评测将 Muse Wonder（Max）评为与
      GPT-6.1 Sol 相当，可能是 Meta 首批 Fable 级模型；Meta 自 8 月 5 日 Muse 1.2、9 月 2 日 Muse 1.3 以来保持约每月一次模型迭代。
    event_summary_en: Meta AI released new models Muse Wonder and Muse Wonder Full, calling them its "most
      capable models"; third-party evaluation rates Muse Wonder (Max) as equivalent to GPT-6.1 Sol, possibly
      Meta's first Fable-class models, with Meta iterating roughly monthly since Muse 1.2 on August 5
      and Muse 1.3 on September 2.
