      deliverable from clips into finished films, so the outsourced step in ads, short dramas and e-commerce
      detail videos can be replaced wholesale. Entry: start with agencies, cross-border sellers or short-drama
      studios that need long video at volume, charging per finished piece or per minute rather than selling
      generation credits, and nail script-to-film delivery before becoming a general creation platform.'
