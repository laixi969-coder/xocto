    inspiration: 趋势：建筑与地产这类纸质单据密集、利润薄的行业，后台财务第一次被拆成“识别—匹配—重算—待办”的可自动化链条，而不是加一个问答框。切入：从总包或地产开发商的项目会计环节进入，按项目或按单据量收费，把材料台账与成本台账打通；先做单一币种、单一项目制的公司，避开需要多国税务合规的大型集团。
    summary_en: Project finance staff at construction firms and property developers open it after receiving
      invoices, delivery notes, order confirmations and scanned records; it converts them into structured
      data, automatically matches related documents and recalculates invoice corrections, while AI agents
      prepare tasks and recommend next steps and approval decisions stay with employees, delivering a
      more current view of project costs. The exact workflow and deliverables still need verification.
    inspiration_en: 'Trend: in document-heavy, thin-margin construction and real estate, back-office finance
      is being split into an automatable chain of extraction, matching, recalculation and task preparation
      rather than a chat box. Entry: start at the project accounting step of a general contractor or developer,
      charge per project or per document volume, and connect material ledgers with cost ledgers; begin
      with single-currency, single-project firms and avoid large groups needing multi-country tax compliance.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 建筑公司或地产开发商的项目财务与后台行政人员，在收到供应商发票、送货单、订单确认和扫描件后，需要把这些单据录入并核对到对应项目成本上，完成付款审批前的匹配与成本归集。
        job_en: Project finance and back-office staff at construction firms or property developers receive
          supplier invoices, delivery notes, order confirmations and scanned records, and must enter and
          reconcile them against the right project costs, completing matching and cost allocation before
          payment approval.
        pain_zh: 这些公司长期靠电子表格和手工流程管理发票、合同与项目成本，导致审批延迟、项目财务可见度低，并错过降本机会；单据与成本之间靠人工比对，重复且易错。
        pain_en: These firms have long managed invoices, contracts and project costs with spreadsheets
          and manual processes, causing approval delays, limited visibility into project finances and
          missed cost-reduction opportunities; document-to-cost matching is manual, repetitive and error-prone.
        current_alternative_zh: 电子表格加人工录入与比对，或通用财务/ERP 系统里仍需人工完成的单据匹配环节。
        current_alternative_en: Spreadsheets plus manual entry and comparison, or the still-manual document
          matching step inside generic finance or ERP systems.
        usage_reason_zh: 相较人工逐张比对，它把发票、送货单、订单确认等转成结构化数据并自动匹配关联单据、重算发票更正项，减少的是“找单据、对金额、算更正”这几步手工负担，因此单据量大、项目成本需要及时可见的总包与开发商财务团队会在月末结算或付款审批前选择它；这是基于产品能力的推断，尚无客户案例或留存证据。
        usage_reason_en: Compared with comparing documents by hand one by one, it turns invoices, delivery
          notes and order confirmations into structured data, automatically matches related documents
          and recalculates invoice corrections, removing the manual steps of finding documents, checking
          amounts and computing corrections; contractors and developers with high document volume and
          a need for timely project cost visibility would therefore choose it around month-end closing
          or payment approval. This is an inference from product capability, with no customer case or
          retention evidence yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决建筑与地产项目财务把发票、送货单、订单确认核对进项目成本的需求，痛点是手工比对导致审批延迟与成本可见度低，旧行为明确存在。
        evidence_ids:
        - ev-5c656cbe5419537d
      - gate: consensus
        status: insufficient
        reason: 公开材料只有融资与产品说明，没有客户案例、用户评价或采用数据，无法判断财务人员是否已把它放进日常流程。
        evidence_ids:
        - ev-5c656cbe5419537d
      - gate: model
        status: insufficient
        reason: 未披露定价、计价方式与买方是总包、开发商还是财务外包方；按项目或按单据量收费只是判断，不是已验证事实。
        evidence_ids:
        - ev-5c656cbe5419537d
      - gate: truth
        status: supported
        reason: 审批决定保留在员工手中，AI 只做单据处理、匹配与计算，人工边界清楚，交付物是可核对的成本信息而非不可验证的生成内容。
        evidence_ids:
        - ev-5c656cbe5419537d
      next_validation: 收集 reebuild 官方定价页或公开客户案例，确认计价单位（按项目、按单据量或按席位）与已上线客户的实际使用范围。
