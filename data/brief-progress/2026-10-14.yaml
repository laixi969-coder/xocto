    name: SimpleClosure
    decision: queued
    event_summary_zh: 2026年10月13日报道显示，SimpleClosure 于今年4月在其关停服务中加入数据出售，通过 Asset Hub 平台帮创始人出售代码与 Google、Notion、Figma、Slack
      中的工作区数据；一位加密创业者据此获得约2.5万美元代码款和一笔约1.5万美元的待结工作区数据款，买方包括基础模型实验室、构建模拟工作区的供应商和成熟科技公司。
    event_summary_en: An October 13, 2026 report says SimpleClosure added data sales to its shutdown services
      in April, using its Asset Hub platform to help founders sell code and workspace data from Google,
      Notion, Figma and Slack; one crypto founder netted about $25,000 for code plus a pending roughly
      $15,000 for workspace data, with buyers including foundation model labs, simulated-workspace vendors
      and mature tech companies.
    category: AI + 商业
    project_type: ai_transformation
    industries:
    - 创业服务
    - 企业软件
    - 数据服务
    industries_en:
    - startup services
    - enterprise software
    - data services
    jobs:
    - 创业公司清算与资产处置
    - 训练数据采购
    - 法务与财税关停流程
    jobs_en:
    - startup wind-down and asset disposal
    - training data sourcing
    - legal and tax shutdown workflow
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 创业公司关停时，创始人原本要自己处理代码、邮件、聊天和文档的归档与处置；SimpleClosure 的 Asset Hub 把这些数字资产整理成可出售标的，对接基础模型实验室、模拟工作区供应商等买方，创始人拿到现金而非直接删除。数据合规、授权范围与最终成交价仍待核验。
    inspiration: 趋势是 AI 训练数据需求开始向“公司遗体”要供给，关停流程从纯法务服务变成资产变现入口。切入可做垂直行业的关停数据经纪与合规授权层，例如只服务 SaaS 或加密团队，按成交抽成而非按月收费；但数据来源合法性、员工与客户隐私边界是必须先解决的环节。
    summary_en: When a startup shuts down, founders used to archive or discard code, email, chat and documents
      themselves; SimpleClosure's Asset Hub packages those digital assets for sale to foundation model
      labs and simulated-workspace vendors so founders receive cash instead of deleting them. Data compliance,
      licensing scope and final sale prices still need verification.
    inspiration_en: The trend is that AI training-data demand is starting to source supply from dead companies,
      turning wind-down from a pure legal service into an asset-monetization entry point. A wedge is vertical
      shutdown data brokerage plus a compliance licensing layer, e.g. only for SaaS or crypto teams, charging
      on closed deals rather than seats; data provenance and employee/customer privacy boundaries must
      be solved first.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 创业公司创始人在决定关停、需要清理代码库和 Google、Notion、Figma、Slack 工作区数据时，要把这些数字资产处置掉并尽量换回现金。
        job_en: A startup founder winding down the company must dispose of the codebase and workspace
          data in Google, Notion, Figma and Slack, and wants to recover some cash from those digital assets.
        pain_zh: 关停时这些数据通常被直接删除或搁置，创始人既没有买方渠道，也不清楚哪些内容可以合法出售，等于把两年多的投入归零。
        pain_en: At shutdown this data is usually deleted or left idle; founders have no buyer channel
          and no clarity on what can legally be sold, effectively writing off years of work.
        current_alternative_zh: 旧做法是创始人自己找买家、在二手渠道零散出售代码，或直接删除数据并只走法律与财税关停流程。
        current_alternative_en: The old path is founders finding buyers themselves, selling code piecemeal
          on secondary channels, or simply deleting the data while only completing legal and tax wind-down
          steps.
        usage_reason_zh: 推断：相比自己找买家，Asset Hub 把代码与工作区数据打包成可挂牌资产并对接已存在的模型实验室与模拟工作区买方，省掉创始人自行寻找买方和议价这一步，因此手上有可售数字资产、又急于关停的创始人会优先用它。
        usage_reason_en: 'Inference: versus sourcing buyers alone, Asset Hub packages code and workspace
          data into listable assets and connects them to existing model-lab and simulated-workspace buyers,
          removing the founder''s step of finding and negotiating with buyers, so founders with sellable
          digital assets and an urgent wind-down would choose it first.'
      gates:
      - gate: value
        status: supported
        reason: 它解决关停时数字资产无处变现、只能删除的痛点，创始人已实际拿到约2.5万美元代码款，说明旧行为被替代且交付可核对。
        evidence_ids:
        - ev-1c2151a5fcb19d96
      - gate: consensus
        status: insufficient
        reason: 买方名单只提到基础模型实验室、模拟工作区供应商和成熟科技公司，没有公开的持续采购量或复购证据，共识强度未知。
        evidence_ids:
        - ev-1c2151a5fcb19d96
      - gate: model
        status: insufficient
        reason: 报道未披露 SimpleClosure 的收费方式、抽成比例或数据出售业务的收入规模，钱从哪一方来仍是判断而非已验证事实。
        evidence_ids:
        - ev-1c2151a5fcb19d96
      - gate: truth
        status: challenged
        reason: 出售员工邮件、聊天与文档涉及隐私与授权边界，报道未说明数据脱敏、员工同意和合规审查如何执行，交付确定性存疑。
        evidence_ids:
        - ev-1c2151a5fcb19d96
      next_validation: 收集 SimpleClosure 官方 Asset Hub 页面或其关停数据出售的公开条款，确认数据授权、脱敏与合规审查流程。
