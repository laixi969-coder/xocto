        pain_zh: 多台机器要分别登录、多套监控面板来回切换，状态分散导致定位慢；不解决的后果是故障响应时间被拉长。
        pain_en: Multiple machines require separate logins and several monitoring dashboards to be switched
          between, so scattered state slows diagnosis; the cost of not solving it is longer incident response
          time.
        current_alternative_zh: SSH 逐台登录加自建 Prometheus、Grafana 等面板，或用云厂商自带的多机控制台。
        current_alternative_en: Logging in to each machine over SSH plus self-hosted Prometheus and Grafana
          dashboards, or the multi-machine consoles bundled with cloud providers.
