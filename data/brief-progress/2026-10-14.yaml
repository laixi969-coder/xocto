        reason: 材料未披露定价、买方或收费方式；安全服务按项目收费是常见路径，但这是推断，不是已验证事实。
        evidence_ids:
        - ev-f4f57f8cf5c15b16
      - gate: truth
        status: insufficient
        reason: 自主渗透测试涉及授权范围与误伤责任，材料未说明人工确认与安全边界，交付确定性无法核对。
