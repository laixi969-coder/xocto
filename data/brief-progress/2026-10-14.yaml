    slug: github-8
    name: gongwen-kit
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries:
    - 公共管理
    - 企业行政
    industries_en:
    - Public Administration
    - Corporate Administration
    jobs:
    - 公文写作与格式审核
    - 党政机关及国企文秘
    jobs_en:
    - Official document drafting and format compliance review
    - Government and state-owned enterprise secretarial work
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 在政府、央国企写材料的人，起草完公文后要按国标逐项核对版式、要素和用语，现在可以在本地跑这个开源工具：它接收公文文本或文件，按国标生成、检索并机检格式问题，最后给出可修改的公文与问题清单，仍需人工确认定稿。具体支持的文种范围与交付形式仍待核验。
    inspiration: 趋势是国标、合规、格式这类有明文规则的文书工作正在被拆成可机检的环节，规则本身就是壁垒，不依赖模型能力。切入可以从党政机关、国企、事业单位的文秘岗或第三方代写机构进，按份或按年做格式机检与模板库，而不是卖通用写作助手；这类买方预算走行政或办公采购，具体价格未披露。
    summary_en: People who draft official documents in government bodies and state-owned enterprises must
      check layout, required elements and wording against national standards. This open-source tool takes
      document text or files, generates, searches and machine-checks official documents against those
      standards, and returns an editable document plus a list of issues, with a human still confirming
      the final version. The range of supported document types and delivery format still needs verification.
    inspiration_en: 'The trend is that rule-bound paperwork such as national standards, compliance and
      formatting is being split into machine-checkable steps, where the rules themselves are the moat
      rather than model capability. Entry point: secretarial roles in government bodies, state-owned enterprises
      and public institutions, or third-party drafting agencies, sold per document or per year for format
      checking and template libraries rather than as a general writing assistant; budgets would come from
      administrative or office procurement, and no pricing has been disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 政府机关、国企和事业单位的文秘或材料岗，在起草通知、请示、报告等公文后，需要按国标逐项核对版式、要素和用语，再提交领导审签。
        job_en: Secretarial or document staff in government bodies, state-owned enterprises and public
          institutions who, after drafting notices, requests and reports, must check layout, required
          elements and wording against national standards before submitting for leadership approval.
        pain_zh: 国标对字体、字号、行距、要素位置有硬性规定，人工逐项核对耗时且容易漏项，返工往往发生在送审之后。
        pain_en: National standards impose hard rules on fonts, sizes, line spacing and element placement;
          manual item-by-item checking is slow and error-prone, and rework often happens only after submission.
        current_alternative_zh: 目前多靠 Word 模板、老同事的经验和人工通读校对，或购买现成的公文排版软件，规则更新依赖个人记忆。
        current_alternative_en: Today this relies on Word templates, experienced colleagues' judgment
          and manual proofreading, or off-the-shelf document formatting software, with rule updates depending
          on individual memory.
        usage_reason_zh: 推断：相比人工逐条比对模板，它把国标规则固化成可重复执行的机检步骤，起草者能在送审前拿到一份问题清单并直接修改，减少因格式和要素缺失导致的退回；经常处理公文、又缺少专职校对岗的单位文秘会优先尝试。
        usage_reason_en: 'Inference: compared with manually comparing against a template item by item,
          it encodes national-standard rules into repeatable machine checks, so drafters get an issue
          list before submission and can fix it directly, reducing rejections caused by missing formatting
          and elements; secretarial staff who handle documents often without a dedicated proofreading
          role are the likeliest early users.'
      gates:
      - gate: value
        status: supported
        reason: 它解决公文起草后按国标核对版式与要素的需求，痛点是人工逐项核对耗时且送审后返工；旧做法是模板加人工通读，属于工作流推理。
        evidence_ids:
        - ev-f970f0df3a442e89
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区发布帖且无评论，尚无采用、留存或单位内部推广的公开证据，卡在场景感知环节。
        evidence_ids:
        - ev-f970f0df3a442e89
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径；判断上买方可能是机关、国企的行政办公采购或代写机构，属推断而非已验证事实。
        evidence_ids:
        - ev-f970f0df3a442e89
      - gate: truth
        status: insufficient
        reason: 作者称用真实文件回放测试，但未公开测试样本、文种覆盖范围与机检准确率，交付确定性无法核对。
        evidence_ids:
        - ev-f970f0df3a442e89
      next_validation: 收集该仓库的 README、issue 与 release 记录，核对它实际支持的公文文种、机检规则来源与真实文件回放结果。
    event_summary_zh: 2026 年 10 月 13 日，一位在上市公司和国企工作 20 年、现常与政府及央国企打交道的非程序员，在社区发布首个开源项目 gongwen-kit，称用
      Claude 辅助编写代码，功能为按国标生成、检索和机检公文，并称用真实文件反复回放测试。
    event_summary_en: On 13 October 2026, a non-programmer with 20 years at listed and state-owned companies,
      now working frequently with government and state-owned enterprises, released his first open-source
      project gongwen-kit in a community post, saying the code was written with Claude's help and that
      the tool generates, searches and machine-checks official documents against national standards, tested
      by repeatedly replaying real files.
