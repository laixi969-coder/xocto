        reason: 未披露定价、买方或收费方式；手机整机通常为 to C 硬件销售，但这是判断而非已验证事实。
        evidence_ids:
        - ev-18831ced0dea028f
      - gate: truth
        status: insufficient
        reason: 无法核验智能体是否贴近第一性目标、承诺能否确定性交付，以及安全与人工确认边界。
        evidence_ids:
        - ev-18831ced0dea028f
