        pain_en: Public material only says it is an autonomous penetration-testing system that won an
          attack-defense contest; it does not say which manual step it replaces, how false positives are
          handled, or how authorization and liability boundaries are set, so pain intensity cannot be
          judged from available facts.
        current_alternative_zh: 人工渗透测试、商业扫描器加人工验证、或开源扫描工具组合，具体替代对象未在材料中说明。
