      20 分钟保留机制反复锁定商品，使其他顾客无法购买。这一变化表明，面向消费者的电商平台开始主动设置技术壁垒，AI 购物智能体的可用范围将取决于各平台的反自动化政策，智能体购物应用的落地成本和不确定性随之上升。
    summary_en: On October 26, 2026, secondhand luxury consignment retailer The RealReal updated its bot
      defense system to make it harder for AI agents to shop on its site. Earlier testing showed an AI
      agent could exploit the site's 20-minute cart hold to repeatedly reserve listings and block other
      shoppers. The change shows consumer-facing retailers beginning to actively erect technical barriers,
      meaning the reach of AI shopping agents will depend on each platform's anti-automation policy, raising
      deployment cost and uncertainty for agentic commerce applications.
    event_summary_zh: The RealReal 更新机器人防御系统，限制 AI 智能体利用购物车保留机制锁定商品。
    event_summary_en: The RealReal updated its bot defense system to limit AI agents from exploiting its
      cart hold mechanism to lock up listings.
