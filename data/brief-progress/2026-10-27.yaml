      UK, Canada and India, covering teams including AI experiences, Copilot, CoreAI, Windows + Devices,
      Xbox, finance and HR, aiming to trim staff without another layoff round. This shows a large platform
      compressing personnel costs alongside AI investment expansion, with AI-related teams also in scope;
      for AI delivery and competition it suggests organizational restructuring and cost discipline accompany
      platform AI productization (inference).
    event_summary_zh: Microsoft于2026年10月向美国、英国、加拿大和印度最多6万名员工提供自愿离职补偿，覆盖AI体验、Copilot、CoreAI、Windows + Devices、Xbox、财务和人力资源等团队。
    event_summary_en: In October 2026 Microsoft offered voluntary buyouts to up to 60,000 employees in
