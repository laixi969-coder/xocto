    name: Joonko
    decision: market_context
    summary_zh: Joonko 创始人 Ilit Raz 承认在融资中虚构客户与收入并伪造银行对账单和采购订单，骗取约 2700 万美元，上月就联邦证券欺诈认罪；据 Cornerstone
      Research，2026 年上半年 AI 相关证券集体诉讼达 15 起，接近 2025 年全年的 16 起。这意味着 AI 创业公司对客户与收入指标的陈述面临更高法律审查，融资与交付叙事需以可核实事实为基础（推断）。
    summary_en: Joonko founder Ilit Raz admitted fabricating customers and revenue and forging a bank
      statement and purchase orders to raise roughly $27 million, and pleaded guilty last month to federal
      securities fraud; per Cornerstone Research, 15 AI-related securities class actions were filed in
      the first half of 2026, nearly matching the 16 filed in all of 2025. This means AI startups' claims
      about customers and revenue face heightened legal scrutiny, and fundraising and delivery narratives
      must rest on verifiable facts (inference).
    event_summary_zh: Joonko 创始人 Ilit Raz 就联邦证券欺诈认罪，其以虚构客户与收入、伪造银行对账单和采购订单的方式融资约 2700 万美元。
    event_summary_en: Joonko founder Ilit Raz pleaded guilty to federal securities fraud after raising
      roughly $27 million using fabricated customers and revenue and a forged bank statement and purchase
      orders.
