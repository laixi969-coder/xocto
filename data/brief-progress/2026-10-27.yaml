        status: insufficient
        reason: 它服务的是模型部署与推理执行，属于基础设施层，不是独立应用产品，无法按应用需求判定。
        evidence_ids:
        - ev-36e49bf9bc55f23a
        - ev-a6fa28c389fc4bcb
      - gate: consensus
        status: insufficient
        reason: 星标快速增长与社区讨论显示关注度高，但关注不等于持续采用，且无部署采用数据。
        evidence_ids:
        - ev-46a32e3527124bc3
        - ev-a6fa28c389fc4bcb
      - gate: model
        status: insufficient
        reason: 开源框架无公开定价或付费路径，商业模式未在材料中体现。
        evidence_ids:
        - ev-36e49bf9bc55f23a
      - gate: truth
        status: insufficient
        reason: 材料仅说明框架定位与热度，未提供交付结果或与替代方案的实测对比。
        evidence_ids:
        - ev-36e49bf9bc55f23a
        - ev-2614a707ec123c66
      next_validation: 收集 DeepInfer 官方仓库的部署文档与 issue/discussion，核对是否有可复现的部署门槛或吞吐对比数据。
