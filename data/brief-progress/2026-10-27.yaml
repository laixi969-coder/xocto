    name: data center freight theft
    decision: market_context
    summary_zh: 自 2026 年 6 月以来，针对运往数据中心的货物，公路盗窃者通过入侵货运经纪账户、投放虚假货运信息并伪造 GPS 坐标，已盗走超过 1 亿美元的数据中心设备。这一变化推高了数据中心硬件交付环节的安全与保险成本，并可能延缓设备到场时间，从而影响
      AI 算力基础设施的建设节奏（推断）。
    summary_en: Since June 2026, highway thieves targeting data-center-bound cargo have stolen more than
      $100 million in data center equipment by hacking freight broker accounts, posting fake shipments
      and spoofing GPS coordinates. This raises security and insurance costs in the data center hardware
      delivery chain and may delay equipment arrival, potentially affecting the pace of AI compute infrastructure
      buildout (inference).
    event_summary_zh: 自 2026 年 6 月以来，针对运往数据中心的货物，盗窃者通过入侵货运经纪账户、投放虚假货运信息并伪造 GPS 坐标，已盗走超过 1 亿美元的数据中心设备。
