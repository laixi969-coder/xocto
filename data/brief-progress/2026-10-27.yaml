  groundhog-day-for-ai-agents-prompt-caching-patterns-for-usin:
    slug: groundhog-day-for-ai-agents-prompt-caching-patterns-for-usin
    name: Amazon Bedrock
    decision: market_context
    summary_zh: 亚马逊云科技发布技术说明，介绍在 Amazon Bedrock 上调用 OpenAI 模型时使用提示缓存的模式，指出 AI 代理每一步都需重发工具定义、指令和历史结果，到第
      20 轮时需重读前 19 轮内容并由调用方为重复输入付费。该实践针对代理式应用的重复上下文成本，若被采用可降低多轮代理的推理开销，但材料未给出具体价格或采用数据（推断）。
    summary_en: Amazon Web Services published guidance on prompt caching patterns for calling OpenAI models
      on Amazon Bedrock, noting that AI agents must resend tool definitions, instructions and prior results
      at every step, so by turn 20 the model re-reads turns 1-19 and the caller pays for the repeated
      input. The practice targets the repeated-context cost of agentic applications and, if adopted, could
      lower inference spend for multi-turn agents, though the material provides no specific pricing or
      adoption figures (inference).
    event_summary_zh: 亚马逊云科技发布关于在 Amazon Bedrock 上使用 OpenAI 模型时提示缓存模式的技术文章，说明代理每一步都需重发完整上下文，并给出避免重复输入的处理方式。
    event_summary_en: Amazon Web Services published a technical article on prompt caching patterns for
      using OpenAI models on Amazon Bedrock, explaining that agents resend full context at every step
      and describing approaches to avoid repeated input.
