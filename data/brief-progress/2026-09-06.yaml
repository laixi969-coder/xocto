        current_alternative_zh: 目前开发者通常使用浏览器手动搜索、查阅官方文档或询问通用聊天助手。
        current_alternative_en: Currently developers typically use browsers for manual searches, consult
          official documentation, or ask general-purpose chat assistants.
        usage_reason_zh: 终端内直接完成研究可减少上下文切换，且能利用代理的自动化整合能力，对需要深度调研的开发者有吸引力。
        usage_reason_en: Completing research directly in the terminal reduces context switching and leverages
          the agent's automated synthesis, appealing to developers needing deep investigation.
      gates:
