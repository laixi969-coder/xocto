  129-亿美元英伟达拿下-hugging-face:
    slug: 129-亿美元英伟达拿下-hugging-face
    name: NVIDIA
    decision: market_context
    event_summary_zh: 据2026年8月26日报道，英伟达与公开模型社区达成收购协议，作价129亿美元，约为其2023年D轮45亿美元估值的三倍；此前两天公开模型社区才被曝出「正在探索出售」。
    event_summary_en: Reports on August 26, 2026 said NVIDIA and public model community reached an acquisition
      agreement at $12.9 billion, roughly triple its $4.5 billion Series D valuation from 2023, just days
      after public model community was first reported to be exploring a sale.
    summary_zh: 英伟达于2026年8月26日与开源模型托管平台公开模型社区达成收购协议，作价129亿美元。公开模型社区托管超300万个模型仓库、服务1300万开发者，是Llama、Qwen、Mistral等开源模型的事实分发层；英伟达在GPU训练与推理硬件之外进一步控制模型流通渠道，开源AI生态的分发与商业化规则可能随之集中。
    summary_en: NVIDIA reached an agreement on August 26, 2026 to acquire open-source model hosting platform
      public model community for $12.9 billion, about triple its $4.5 billion valuation from its 2023
      Series D round. public model community hosts over 3 million model repositories serving 13 million
      developers and acts as the de facto distribution layer for open models such as Llama, Qwen and Mistral;
      with the deal, NVIDIA extends beyond GPU hardware for training and inference into the model distribution
      channel, and the rules of the open-source AI ecosystem may become more concentrated.
