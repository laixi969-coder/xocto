        current_alternative_en: Relies on Git's conflict detection, but conflicts surface only at merge
          time, making fixes costly.
        usage_reason_zh: 随着 AI 编码 agent 的普及，团队需要工具来协调多个 agent 的工作，避免冲突。
        usage_reason_en: With the rise of AI coding agents, teams need tools to coordinate multiple agents
          and avoid conflicts.
