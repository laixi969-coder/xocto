  longgapsbetweenprimes:
    slug: longgapsbetweenprimes
    name: LongGapsBetweenPrimes
    decision: queued
    event_summary_zh: OpenAI 于 2026 年 9 月 2 日发布了一个 Lean 形式化证明仓库，涉及素数长间隙的界，开源后星标数从 22 增长至 35。
    event_summary_en: OpenAI released a Lean formalization repository on bounds for long gaps between
      primes on September 2, 2026; stars grew from 22 to 35 after open-sourcing.
    category: AI + 开发
    project_type: open_source
    industries:
    - 科研
    industries_en:
    - Scientific research
    jobs:
    - 数学研究者
    jobs_en:
    - Mathematics researchers
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 数学研究者在核对或复用素数长间隙界的证明时，可用该开源 Lean 形式化仓库：它把数论证明写成机器可检查的 Lean 代码，任何人可逐条核对定理是否成立；OpenAI 出品，具体由
      AI 生成到什么程度仍待核验。
    inspiration: 趋势：形式化数学证明正从人力密集的小圈子活，变成 AI 可产出的交付物，Lean 生态在加速。切入：不与前沿研究正面竞争，可从关键软件的形式化验证服务、高校数学课程与审稿辅助等环节进入。
    summary_en: An open-source Lean formalization by OpenAI of a bound on long gaps between primes. Mathematicians
      can open it to check or reuse a machine-verified number theory proof; the repo's exact AI generation
      workflow remains unverified.
    inspiration_en: 'Trend: formal proof is shifting from artisanal work to an AI-produced deliverable
      as the Lean ecosystem accelerates. Entry: avoid head-on frontier research; sell formal verification
      of critical software, university math courses, or referee assistance.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 把数论研究结果核对为机器可验证的形式化证明
        job_en: Verify number-theory results as machine-checked formal proofs
        pain_zh: 形式化依赖少数熟悉 Lean 的专家手工翻译证明，周期长，非专家难以复核
        pain_en: Manual formalization depends on a few Lean experts, takes long, and is hard for outsiders
          to double-check.
        current_alternative_zh: 由形式化社区专家手工编写 Lean 证明，或直接信任同行评审论文
        current_alternative_en: Hand-written Lean proofs by formalization community experts, or trusting
          peer-reviewed papers directly.
        usage_reason_zh: 数论研究者可复用机器核对的证明结果；仓库三天内星标从 22 增至 35，显示有人持续关注这类产出
        usage_reason_en: Number theorists can reuse machine-checked results; stars grew from 22 to 35
          in three days, showing sustained attention to this kind of output.
      gates:
      - gate: value
        status: supported
        reason: 它解决数学证明难以机器核对、形式化依赖少数专家的痛点，把素数长间隙界的证明交付为 Lean 可验证代码；此为工作流推理，仓库的直接采用证据仍薄。
        evidence_ids:
        - ev-f8e74371b7cfac3d
      - gate: consensus
        status: insufficient
        reason: 三天内星标从 22 升至 35，说明社区关注 AI 形式化进展；属早期关注度而非持续采用，且集中在数论小圈子。
        evidence_ids:
        - ev-9e6732963404dd2d
        - ev-73d9be14f7442de6
      - gate: model
        status: insufficient
        reason: 未见定价页或买方，开源仓库本身不收费；可能的收入路径只能推测为验证服务或能力背书，这是判断而非已验证事实。
        evidence_ids:
        - ev-f812850c4c3e8b37
      - gate: truth
        status: supported
        reason: Lean 编译通过即证明成立，交付确定性强，贴近证明可被机器核对的第一性目标；无安全与人工边界争议，貂丁风险低。
        evidence_ids:
        - ev-f8e74371b7cfac3d
      next_validation: 跟踪仓库后续的 issue 与 discussion，收集数学社区对其形式化正确性与复用情况的公开反馈。
