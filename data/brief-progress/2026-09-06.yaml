    name: commerce-agents
    decision: queued
    event_summary_zh: Anthropic 发布了 commerce-agents 参考蓝图，用于构建 Claude 驱动的购物和商家代理，并包含零售、电商、电信和娱乐领域的示例。仓库星标在五天内从
