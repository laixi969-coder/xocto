      input, execute actions (like moving and interacting), and observe outcomes, used for training and
      evaluating decision-making. Specific game mechanics and deliverables (like task completion) still
      need verification.
    inspiration_en: 'Trend: AI agents need richer interactive environments to test and evolve, making
      games an ideal training ground. Entry: design simulation game environments for specific industries
      (e.g., autonomous driving, robotics), or offer agent testing platforms for game companies, charging
      per test or outcome.'
