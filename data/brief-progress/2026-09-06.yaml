    summary_en: Mole is a deep research agent for developers that runs in the terminal. Developers launch
      it from the command line, input a research task, and it autonomously performs multi-step searches
      and information synthesis, returning cited results in the terminal. Specific workflow and delivery
      format still need verification.
    inspiration_en: 'Trend: deep research capabilities are moving from standalone web apps into developers''
      daily terminal environments, becoming an embedded part of coding workflows. Entry point: target
      developers who frequently consult documentation, API changes, and best practices, potentially charging
      per research task or via subscription, though pricing is not disclosed.'
