  book:
    slug: book
    name: Google AI Mode
    decision: queued
    event_summary_zh: Google 宣布 Search 中的 AI Mode 新增机票降价追踪、酒店预订与里程奖励查看，从信息查找扩展到代办部分行程规划与预订；另有第三方实测发现 AI
      Mode 展示同一商品的价格比传统搜索高约 21.6%。
    event_summary_en: Google announced that AI Mode in Search now tracks flight prices, helps book hotels,
      and shows miles and rewards, extending from information lookup into parts of trip planning and booking;
      a third-party test also found AI Mode displays the same products at prices about 21.6% higher than
      traditional search.
    category: 通用助手
    project_type: new_application
    industries:
    - 旅游
    - 在线旅游预订
    industries_en:
    - Travel
    - Online Travel Booking
    jobs:
    - 商务出行者
    - 休闲旅行者
    jobs_en:
    - Business Travelers
    - Leisure Travelers
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 计划出行、比价机票和酒店的用户在 Google Search 中打开 AI Mode，原来要自己开多个订票网站比价、反复查询票价涨跌。它接收用户的出行日期和行程需求，自动追踪机票价格变化并完成酒店搜索与预订步骤，用户在搜索内拿到可下单的酒店结果和降价提醒。
    inspiration: 趋势：搜索正从给链接走向直接完成交易，AI 中介在接管旅游业的交易入口。切入：别做通用助手正面打，切 Google 覆盖不到的垂直环节——特定目的地的本地化地面服务、长尾住宿供给、需要人工确认的团体行程，并按成交订单计费。
    summary_en: Travelers planning a trip use Google AI Mode in Search where they previously opened several
      booking sites to compare fares. Given travel dates and needs, it tracks flight prices and books
      hotels, returning bookable options and price-drop alerts in Search.
    inspiration_en: 'Trend: search now closes bookings instead of listing links, taking travel''s transaction
      entry. Entry: skip the general assistant; start where Google lacks coverage — local ground services,
      long-tail stays, group trips needing human confirmation, charging per booking.'
    req_initial:
      verdict: true_demand
      signal_level: 需求信号明确
      demand_read:
        job_zh: 旅行者在出发前有限时间内完成机票比价、降价追踪和酒店预订
        job_en: Travelers compare flights, track fares, and book hotels within limited time before a trip
        pain_zh: 票价反复波动需要人工反复查询，酒店比价要在多个订票网站之间切换，流程繁琐且容易错过降价
        pain_en: Fares fluctuate and need repeated manual checks; comparing hotels means switching across
          booking sites, and price drops are easily missed
        current_alternative_zh: Google Flights 降价提醒、Booking 与 Expedia 等 OTA 平台，以及人工旅行社
        current_alternative_en: Google Flights fare alerts, OTAs like Booking and Expedia, and human travel
          agents
        usage_reason_zh: 搜索本身就是旅行者的既有起点，在同一入口完成追踪和预订省去多站切换，降价提醒是可核对的交付
        usage_reason_en: Search is already travelers' starting point; finishing tracking and booking in
          one entry removes app switching, and fare alerts are a verifiable deliverable
      gates:
      - gate: value
        status: supported
        reason: 它解决旅行者行前比价、追踪降价、订酒店的需求，痛点高频且已存在降价提醒、OTA 等替代行为，旧行为刚性充分；此为按公开流程还原的结构判断。
        evidence_ids:
        - ev-266feaeb231d5a06
        - ev-0d39dffb368775c9
      - gate: consensus
        status: supported
        reason: Google Search 默认入口带来海量曝光，多家独立媒体跟进报道，第三方已开始实测其结果，公开关注成立；但这是平台曝光与媒体关注，不是产品级用户采用数据。
        evidence_ids:
        - ev-0d39dffb368775c9
        - ev-9c01ee5c5a5c1e2d
      - gate: model
        status: supported
        reason: 钱最可能来自旅游广告与预订佣金，由酒店和航司为交易入口付费；这是基于 Google 既有搜索商业模式的推断判断，不是已核验的定价或收入事实。
        evidence_ids:
        - ev-266feaeb231d5a06
        - ev-fed02273180e47d3
      - gate: truth
        status: supported
        reason: 产品贴近『以合适价格订到合适行程』的第一性任务，降价提醒与预订可确定性交付；但第三方实测同款商品贵 21.6% 指向交付质量缺口，需持续核对。
        evidence_ids:
        - ev-fed02273180e47d3
        - ev-0d39dffb368775c9
      next_validation: 持续抓取 Google Search 官方博客与帮助文档，收集 AI Mode 预订全面开放时披露的酒店、航司合作方名单与佣金模式。
  bot-crossing:
    slug: bot-crossing
    name: bot-crossing
    decision: queued
    category: AI + 生活
    project_type: open_source
    industries:
    - 游戏
    - 人工智能研究
    industries_en:
    - Gaming
    - AI research
    jobs:
    - AI 代理开发者
    - 游戏玩家
    jobs_en:
    - AI agent developers
    - Gamers
    regions: []
    regions_en: []
    open_source: true
    summary_zh: bot-crossing 是一个为 AI 代理设计的视频游戏环境。AI 代理在其中接收游戏状态输入，执行动作（如移动、交互），并观察结果，用于训练和评估代理的决策能力。具体游戏机制和交付物（如任务完成度）仍需核验。
    inspiration: 趋势：AI 代理需要更丰富的交互环境来测试和进化，游戏成为理想的训练场。切入：可针对特定行业（如自动驾驶、机器人）设计仿真游戏环境，或为游戏公司提供代理测试平台，按测试次数或结果收费。
    summary_en: bot-crossing is a video game environment designed for AI agents. Agents receive game state
      input, execute actions (like moving and interacting), and observe outcomes, used for training and
      evaluating decision-making. Specific game mechanics and deliverables (like task completion) still
      need verification.
    inspiration_en: 'Trend: AI agents need richer interactive environments to test and evolve, making
      games an ideal training ground. Entry: design simulation game environments for specific industries
      (e.g., autonomous driving, robotics), or offer agent testing platforms for game companies, charging
      per test or outcome.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 代理开发者需要一个可控、可重复的环境来测试和训练代理的决策能力。
        job_en: AI agent developers need a controlled, repeatable environment to test and train agents'
          decision-making.
        pain_zh: 真实环境测试成本高、不可控，难以复现特定场景。
        pain_en: Real-world testing is costly, uncontrollable, and hard to reproduce specific scenarios.
        current_alternative_zh: 使用模拟器或自建测试环境，但缺乏标准化和丰富性。
        current_alternative_en: Using simulators or self-built test environments, but lacking standardization
          and richness.
