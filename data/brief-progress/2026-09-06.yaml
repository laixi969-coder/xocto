    summary_zh: Foremerge 是一个开源协议，用于协调多个编码 AI agent 的工作，在 Git 之上检测意图冲突，避免代码冲突。开发者将多个 agent 的修改意图提交到该协议，它分析并标记冲突，最终返回协调后的合并方案。
    inspiration: 多 agent 协作是趋势，但需从具体团队协作场景切入，如大型代码库的并行开发。
    summary_en: Foremerge is an open-source protocol for coordinating multiple coding AI agents, detecting
      intent conflicts above Git to prevent code conflicts. Developers submit agents' modification intents,
      and it analyzes and flags conflicts, returning a coordinated merge plan.
    inspiration_en: Multi-agent collaboration is a trend, but entry should focus on specific team scenarios
      like parallel development in large codebases.
