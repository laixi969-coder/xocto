    - Global
    open_source: true
    summary_zh: 面向运行 AI 代理的团队，处理代理任务在重启或超时后卡死的问题。它接收代理的任务状态和 SQLite 变更记录，预览待提交的数据库改动，关闭过期的交付状态，避免代理误判成功。最终交付是任务状态的一致性和可审计的数据库变更预览，人工仍可确认后再提交。
    inspiration: AI 代理从演示走向生产时，状态一致性和失败恢复成为基础设施刚需。切入点是代理运行平台和运维工具，可围绕状态机、审计日志和可回滚交付做产品化，而非仅提供代码库。
    summary_en: For teams running AI agents, this tool handles tasks stuck after restarts or timeouts.
      It ingests agent task states and SQLite change logs, previews pending database modifications, and
      closes stale delivery states to prevent agents from falsely reporting success. The final output
      is consistent task state and auditable database change previews, with human confirmation before
      commit.
    inspiration_en: As AI agents move from demo to production, state consistency and failure recovery
      become infrastructure necessities. The entry point is agent operation platforms and tooling, productizing
      around state machines, audit logs, and reversible delivery rather than just a code library.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 代理在无人值守执行多步任务时，需要确保任务状态与数据库变更一致，避免因重启或超时导致状态卡死或误报成功。
        job_en: When AI agents execute multi-step tasks unattended, they need to ensure task state and
          database changes stay consistent, avoiding stuck states or false success after restarts or timeouts.
        pain_zh: 代理任务中断后，状态可能停留在旧值，数据库变更可能部分应用，导致后续操作基于错误状态，甚至重复执行或数据损坏。
        pain_en: After an agent task is interrupted, state may remain stale and database changes may be
          partially applied, causing subsequent operations to rely on incorrect state, leading to duplicate
          execution or data corruption.
        current_alternative_zh: 目前团队通常依赖人工检查日志和数据库，或编写一次性脚本清理状态，耗时且易错。
        current_alternative_en: Currently teams rely on manual log and database inspection, or write one-off
          scripts to clean up state, which is time-consuming and error-prone.
        usage_reason_zh: 代理任务自动化程度越高，状态管理越关键；该工具提供预览和关闭过期状态的能力，降低运维风险，因此值得采用。
        usage_reason_en: The more automated agent tasks become, the more critical state management is;
          this tool offers preview and stale-state closure capabilities, reducing operational risk, making
          it worth adopting.
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 代理任务中断后状态不一致、误判成功的痛点，交付可预览的数据库变更和状态清理，价值结构成立。
        evidence_ids:
        - ev-b66509a7cb03e823
      - gate: consensus
        status: insufficient
        reason: 开源仓库有 191 星，但尚无公开的采用案例或社区讨论，共识证据不足。
        evidence_ids:
        - ev-b66509a7cb03e823
      - gate: model
        status: insufficient
        reason: 未披露定价或商业模式，买方可能是代理平台或运维团队，但付费路径未验证。
        evidence_ids: []
      - gate: truth
        status: supported
        reason: 贴近代理运行的第一性目标——状态可靠，交付可预览，不夸大成功，安全边界清晰。
        evidence_ids:
        - ev-b66509a7cb03e823
      next_validation: 查找官方文档或仓库 issue 中是否有企业采用案例或部署规模数据。
