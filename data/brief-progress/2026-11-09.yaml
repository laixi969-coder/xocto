  创业者做-personal-agent有没有一线生机:
    slug: 创业者做-personal-agent有没有一线生机
    name: Personal Agent
    decision: market_context
    summary_zh: 2026 年 Personal Agent 产品形态集中出现，Manus 在 2025 年展示 Agent 任务执行形态，OpenClaw 在 2026 年将助手推向长期驻留个人环境的方向；同时
      Anthropic 将 Claude 订阅定价压至低于同等额度 API 成本，各家客户端推出并延长免费额度。这些变化意味着个人智能体的获客与任务数据积累依赖低价补贴，创业公司需自行购买模型与云端环境，交付成本高企，竞争资源向拥有模型、算力和入口的厂商倾斜（推断）。
    summary_en: 'In 2026 Personal Agent product forms emerged in clusters: Manus demonstrated agentic
      task execution in 2025, and OpenClaw in 2026 pushed assistants toward long-term residence in personal
      environments; meanwhile Anthropic priced Claude subscriptions below the API cost of equivalent quota,
      and vendors extended free quotas in their clients. These changes imply that user acquisition and
      task-data accumulation for personal agents rely on low-price subsidies, while startups must buy
      models and cloud environments themselves, keeping delivery costs high and tilting competitive resources
      toward vendors with models, compute and entry points (inference).'
    event_summary_zh: 2026 年 Personal Agent 产品形态集中出现，OpenClaw 将助手推向长期驻留个人环境；Anthropic 将 Claude 订阅定价压至低于同等额度
      API 成本，各家客户端推出并延长免费额度。
    event_summary_en: In 2026 Personal Agent product forms emerged in clusters, with OpenClaw pushing
      assistants toward long-term residence in personal environments; Anthropic priced Claude subscriptions
      below the API cost of equivalent quota, and vendors launched and extended free quotas in their clients.
