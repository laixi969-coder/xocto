    summary_zh: 英国上议院议员与下议院议员联合发起跨党派行动，拟推动在智能手机上强制预装儿童性虐待材料（CSAM）检测软件；若立法推进，将改变终端设备端内容扫描的合规要求，并影响 AI 内容审核与隐私技术的部署方式（推断）。
