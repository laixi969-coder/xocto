  工业和信息化部加强智能体终端设备进网管理:
    slug: 工业和信息化部加强智能体终端设备进网管理
    name: 工业和信息化部
    decision: market_context
    summary_zh: 工业和信息化部于2026年11月发布智能体终端设备进网管理新规，要求OTA现网升级须经专家评估后推送。该监管变化提高了智能体终端设备上市与固件升级的合规门槛，可能延长产品交付周期并增加厂商合规成本，对智能体硬件应用的推广节奏形成约束。
    summary_en: In November 2026, China's Ministry of Industry and Information Technology issued new rules
      for network access of agent terminal devices, requiring expert review before OTA upgrades are pushed
      to live networks. This regulatory change raises compliance barriers for launching agent devices
      and firmware updates, potentially lengthening delivery cycles and increasing vendor compliance costs,
      which constrains the rollout pace of agent hardware applications.
    event_summary_zh: 工业和信息化部发布智能体终端设备进网管理新规，明确OTA现网升级须经专家评估后推送。
    event_summary_en: The Ministry of Industry and Information Technology issued new rules for network
      access of agent terminal devices, specifying that OTA live-network upgrades must pass expert evaluation
      before being pushed.
  智能体终端进网管理新规落地ota现网升级须经专家评估后推送:
