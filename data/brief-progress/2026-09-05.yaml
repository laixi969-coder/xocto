        pain_en: AI agents lack codebase-wide architectural context, frequently exceeding effective context
          windows by reading too many files and repeating errors without version-controlled memory.
        current_alternative_zh: 手动在每次提示词中复制粘贴架构说明，或依靠通用的 diataxis 格式文档与多轮人工纠错。
        current_alternative_en: Manually copy-pasting architectural notes into prompts or relying on generic
          human-oriented documentation with tedious multi-turn manual corrections.
        usage_reason_zh: 开发者希望用与 Git 联动的程序化机制，以极低 Token 消耗为智能体精准输送代码决策与相关依赖。
        usage_reason_en: Developers want a deterministic, Git-linked mechanism to feed precise architectural
          decisions and dependencies to agents with minimal token overhead.
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 编码助手在大型项目中因缺乏架构上下文而胡乱写代码、重复造轮子的刚性痛点，结构成立。
        evidence_ids:
        - ev-e62946de03cc72c1
      - gate: consensus
        status: insufficient
        reason: 上下文管理已成为 AI 辅助编程领域的共识痛点，但该开源方案的实际团队采用规模仍待观察。
        evidence_ids:
        - ev-e62946de03cc72c1
      - gate: model
        status: insufficient
        reason: 目前为开源免费项目，尚未形成商业付费路径或企业级托管变现模式。
        evidence_ids:
        - ev-e62946de03cc72c1
      - gate: truth
        status: supported
        reason: 通过静态元数据与 CLI 程序化提供代码上下文，交付确定性高且符合工程约束。
        evidence_ids:
        - ev-e62946de03cc72c1
      next_validation: 观察该开源仓库的 Star 增长、Issue 反馈以及是否有企业在 CI/CD 中落地采用的公开案例。
