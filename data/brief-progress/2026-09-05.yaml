    regions_en:
    - Global
    open_source: true
    summary_zh: 转型工程师在系统学习大模型落地开发时打开该实验库，按照 24 周阶段任务运行配套代码；系统提供包含 RAG、微调、智能体与云平台的 43 个交互式 Notebook；交付的是完整跑通的工程案例代码与实操结果。
    inspiration: 趋势是 AI 学习从理论概念转向基于实战 Notebook 的工程流水线演练。切入点是不要做录播课平台，而是做针对企业真实业务架构（如跨云部署与 RAG 调优）的交互式工程实操沙箱。
    summary_en: Software engineers transitioning to AI use this 24-week curriculum with 43 runnable notebooks
      covering RAG, fine-tuning, MCP agents, and cloud deployment, delivering hands-on code for end-to-end
      case studies.
    inspiration_en: 'Trend: AI learning shifts from theory to interactive engineering pipelines. Entry:
      Build runnable cloud sandboxes for enterprise AI architectures rather than static video courses.'
    req_initial:
      verdict: true_demand
      signal_level: 需求信号明确
      demand_read:
        job_zh: 传统软件工程师需要快速掌握涵盖 LLM、RAG、Agent 及主流云端部署的端到端 AI 工程技能。
        job_en: Traditional software engineers need to master end-to-end AI engineering including LLMs,
          RAG, agents, and cloud deployments.
        pain_zh: 零散的 AI 教程缺乏连续实战案例，跨平台（Azure、Bedrock、Databricks）工程代码配置困难且容易报错。
        pain_en: Fragmented tutorials lack continuous case studies and reproducible cross-cloud deployment
          code.
        current_alternative_zh: 拼凑零散官方文档、购买静态录播课或在博客零碎复制代码调试。
        current_alternative_en: Piecing together scattered documentation, buying video courses, or debugging
          blog snippets.
        usage_reason_zh: 提供免注册、开源且含 43 个可运行 Notebook 的完整 24 周连续实战案例，获 308 星及社区热议。
        usage_reason_en: Provides a free, MIT-licensed 24-week course with 43 runnable notebooks and continuous
          case studies, gaining 308 stars in open-source tracking.
      gates:
      - gate: value
        status: supported
        reason: 工作流结构判断：通过 43 个连续实操 Notebook 解决工程师系统掌握 AI 全栈工程落地的痛点，交付可运行代码闭环。
        evidence_ids:
        - ev-94be3f8605da633b
      - gate: consensus
        status: supported
        reason: 公开材料显示其开源仓库星数增长至 308 颗，在社区讨论中获得 64 点赞与 87 条评论互动，学习采用信号明确。
        evidence_ids:
        - ev-94be3f8605da633b
      - gate: model
        status: insufficient
        reason: 目前采用 MIT 完全开源免费模式，尚未披露企业培训订制或云实验算力收费等商业模式。
        evidence_ids:
        - ev-94be3f8605da633b
      - gate: truth
        status: supported
        reason: 工作流结构判断：基于标准 Jupyter Notebook 和开源代码库交付，学习者可自主复现实操，交付结果确定性高。
        evidence_ids:
        - ev-94be3f8605da633b
      next_validation: Zorost 实验室后续是否推出基于该课程体系的企业付费培训或算力托管套件。
