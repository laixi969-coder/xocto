full:
  adchestra:
    slug: adchestra
    name: adchestra
    decision: watching
    category: AI + 商业
    project_type: new_application
    industries:
    - 广告营销
    industries_en:
    - Advertising & Marketing
    jobs:
    - 数字营销专员
    - 广告投放师
    jobs_en:
    - Digital Marketer
    - Ad Operations Specialist
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 广告投放人员在优化 Google Ads 时打开该工具，输入投放策略或调整指令；系统通过 MCP 协议解析并直接调用广告账户接口，执行出价与计划修改；交付的是已更新的账户状态与投放报告，关键变动需人工确认。
    inspiration: 趋势是垂直广告平台的管理控制权正通过标准协议开放给 AI 代理。切入点是不要做全能营销套件，先切单一广告渠道的高频调价与监控动作，按实际调优调用量或节省金额分成。
    summary_en: Marketers connect this MCP service to manage Google Ads campaigns via natural language.
      The tool parses instructions through the MCP protocol and executes live ad updates, requiring manual
      review for budget changes.
    inspiration_en: 'Trend: Vertical ad control panels are opening up to AI agents via protocols. Entry:
      Avoid broad suites; target high-frequency bidding adjustments on a single ad platform with usage-based
      pricing.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 广告投放专员需要通过自然语言或 AI 智能体快速查询和调优 Google Ads 广告账户。
        job_en: Ad operations specialists need to query and optimize Google Ads accounts using natural
          language or AI agents.
        pain_zh: 在 Google Ads 复杂后台手动切换界面配置参数繁琐且耗时，无法直接与工作流大模型联动。
        pain_en: Manually navigating complex Google Ads dashboards is slow and disconnected from LLM workflows.
        current_alternative_zh: 登录 Google Ads 网页控制台手动点选，或自行写脚本调用 Google Ads API。
        current_alternative_en: Manually clicking through the Google Ads console or building custom scripts
          with the Ads API.
        usage_reason_zh: 通过标准 MCP 协议打通 Google Ads 账户，让主流 AI 客户端能直接执行广告管理动作。
        usage_reason_en: Connects Google Ads via the MCP protocol, enabling standard AI clients to execute
          ad management actions directly.
      gates:
      - gate: value
        status: supported
        reason: 工作流结构判断：将复杂广告后台操作转化为 MCP 标准工具接口，解决投放人员手动调整的低效痛点，交付清晰。
        evidence_ids:
        - ev-dfdc3d823da572ef
      - gate: consensus
        status: insufficient
        reason: 公开材料表明作者构建了首个 Google Ads MCP 工具，但尚未见企业营销团队规模化真实采用的数据。
        evidence_ids:
        - ev-dfdc3d823da572ef
      - gate: model
        status: insufficient
        reason: 公开材料已证明其聚焦广告管理，但尚未公开商业订阅计划或代投抽成等买方付费路径。
        evidence_ids:
        - ev-dfdc3d823da572ef
      - gate: truth
        status: supported
        reason: 工作流结构判断：调用 Google Ads 官方接口执行明确参数变更，输出确定性配置结果，人工确认边界清晰。
        evidence_ids:
        - ev-dfdc3d823da572ef
      next_validation: 官方后续公布的定价与授权方案，或公开案例中展示的广告代管账户数据。
  agentic-resource-discovery:
    slug: agentic-resource-discovery
    name: Agentic Resource Discovery
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - Software Development
    jobs:
    - AI 工程师
    - 后端开发者
    jobs_en:
    - AI Engineer
    - Backend Developer
    regions:
    - 全球
    regions_en:
    - Global
    open_source: true
    summary_zh: 智能体开发者在构建多工具系统时调用该索引，输入所需工具的功能描述；系统跨公开注册表与 MCP 服务端 tools/list 进行混合检索，输出经过校验的端点与工具列表，供
      Agent 运行时动态调度。
    inspiration: 趋势是 MCP 工具生态膨胀使得动态发现与可用性校验成为刚需。切入点是不要做静态工具导航，而是做带有动态健康探针与权限鉴权的 Agent 工具路由网关。
    summary_en: Developers query this index when building multi-tool agent workflows. The system conducts
      hybrid search across registries and active MCP tool endpoints, returning verified tool lists for
      runtime routing.
    inspiration_en: 'Trend: MCP ecosystem growth makes active tool discovery and verification critical.
      Entry: Build an agent tool routing gateway with live health checks instead of static directories.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 开发者和自治智能体需要在运行时跨多个注册表搜索并验证可调用的 MCP 工具。
        job_en: AI developers and autonomous agents need to search and verify callable MCP tools across
          registries at runtime.
        pain_zh: MCP 工具散落在不同公共注册表中，缺乏统一检索入口且各工具可用性与接口结构缺乏统一校验。
        pain_en: MCP tools are scattered across registries without unified search or live capability verification.
        current_alternative_zh: 开发者手动在各平台查阅文档并写死固定 MCP 服务器连接。
        current_alternative_en: Developers manually search registries and hardcode fixed MCP server endpoints.
        usage_reason_zh: 提供跨公共注册表的联邦检索、动态工具接口提取以及评测基准 ARD-Bench。
        usage_reason_en: Provides federated search across public registries, live tool endpoint verification,
          and the ARD-Bench benchmark.
      gates:
      - gate: value
        status: supported
        reason: 工作流结构判断：解决智能体运行时跨注册表动态发现和校验 MCP 工具的痛点，工具检索与验证交付明确。
        evidence_ids:
        - ev-c60a8d36524deb52
      - gate: consensus
        status: insufficient
        reason: 公开材料显示代码库积累 52 颗星关注，但在主流 Agent 框架中的实际集成规模仍待验证。
        evidence_ids:
        - ev-c60a8d36524deb52
      - gate: model
        status: insufficient
        reason: 目前为开源索引项目，尚未披露企业级托管搜索 API 或商业授权等变现路径。
        evidence_ids:
        - ev-c60a8d36524deb52
      - gate: truth
        status: supported
        reason: 工作流结构判断：直接读取 MCP 协议规范的 tools/list 端点并结合基准评测，输出结果客观可复现。
        evidence_ids:
        - ev-c60a8d36524deb52
      next_validation: 主流智能体框架对该 ARD 索引模块的官方集成与生产环境调用讨论。
  agents-universe:
    slug: agents-universe
    name: agents-universe
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - Software Development
    jobs:
    - AI 工程师
    - 系统架构师
    jobs_en:
    - AI Engineer
    - System Architect
    regions:
    - 中国
    - 全球
    regions_en:
    - China
    - Global
    open_source: true
    summary_zh: 系统开发者在搭建复杂多智能体协作流程时引入该框架，输入多角色任务设定；系统在各智能体间同步与持久化项目工作记忆，协调子任务执行；最终交付上下文一致的协同产出，减少跨角色重复交互。
    inspiration: 趋势是多 Agent 协作从单次无状态调用演进为跨角色的持久化记忆共享。切入点是不要做泛用的概念级智能体框架，先深耕特定复杂业务流（如跨部门研发工单流转）中的状态同步。
    summary_en: Developers integrate this framework when building multi-agent collaborative workflows.
      It coordinates tasks and maintains shared, persistent project memory across individual agents for
      consistent context.
    inspiration_en: 'Trend: Multi-agent systems are shifting toward shared, persistent state. Entry: Solve
      memory synchronization for complex domain workflows rather than general agent frameworks.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在构建多智能体系统时需要让不同 Agent 共享项目上下文并沉淀长期工作记忆。
        job_en: Developers building multi-agent systems need agents to share context and retain long-term
          project memory.
        pain_zh: 多智能体协作时状态割裂，各 Agent 缺乏跨角色的共享记忆沉淀，导致重复计算和信息丢失。
        pain_en: Fragmented state across agents leads to loss of context and redundant steps in multi-agent
          workflows.
        current_alternative_zh: 开发者自行编写外部向量库或数据库脚本手动同步上下文。
        current_alternative_en: Developers manually write custom synchronization scripts using external
          vector databases or cache layers.
        usage_reason_zh: 开源提供了智能体间共享项目记忆与协同工作的抽象机制，获得社区 255 颗星关注。
        usage_reason_en: Provides an open-source framework for shared project memory and collaboration
          across agents with 255 open-source stars.
      gates:
      - gate: value
        status: supported
        reason: 工作流结构判断：针对多智能体协作中记忆难以共享的痛点，提供共享记忆层与协同机制，结构清晰。
        evidence_ids:
        - ev-df02306a3002376c
      - gate: consensus
        status: insufficient
        reason: 公开材料已证明其开源仓库获 255 颗星，但真实生产环境中的多 Agent 业务落地案例与持续使用仍待核验。
        evidence_ids:
        - ev-df02306a3002376c
      - gate: model
        status: insufficient
        reason: 公开材料显示当前为开源项目，未披露商业化授权方案或企业私有化部署收费模式。
        evidence_ids:
        - ev-df02306a3002376c
      - gate: truth
        status: supported
        reason: 工作流结构判断：基于共享记忆协议协调智能体动作，目标聚焦于工程上下文同步，交付边界明确。
        evidence_ids:
        - ev-df02306a3002376c
      next_validation: 项目仓库发布的生产落地案例与多 Agent 性能评测数据。
  ai-engineering-lab:
    slug: ai-engineering-lab
    name: AI-Engineering-Lab
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 教育培训
    - 软件开发
    industries_en:
    - Education & Training
    - Software Development
    jobs:
