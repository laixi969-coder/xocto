    summary_zh: 2026年10月21日，PHP 项目在协调披露流程提前泄露后，将原定10月22日的安全版本提前发布，覆盖整个 PHP 8.x 系列，修复两个远程代码执行漏洞（实际 CVSS
      9.2），并已有利用在传播。对 AI 应用而言，大量以 PHP 构建的网站与后端服务需紧急升级，短期内增加运维与交付负担；推断这也暴露了开源安全披露流程的脆弱性。
    summary_en: On October 21, 2026, the PHP project moved its security release up from October 22 after
      an early leak in the coordinated disclosure process, shipping fixes across the entire PHP 8.x line
      for two remote code execution holes (actual CVSS 9.2), with exploits already circulating. For AI
      applications, the many PHP-based sites and backends require urgent upgrades, adding short-term operations
      and delivery burden; this is inferred to also expose fragility in open-source security disclosure
      processes.
    event_summary_zh: PHP 于2026年10月21日提前发布覆盖 PHP 8.x 全系列的安全更新，修复两个远程代码执行漏洞，因披露流程泄露导致发布时间从10月22日提前。
    event_summary_en: PHP released security updates across the entire PHP 8.x line on October 21, 2026,
      fixing two remote code execution vulnerabilities, with the release moved up from October 22 due
      to a disclosure-process leak.
