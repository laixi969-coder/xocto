  data-centers-could-erase-decades-of-air-quality-gains:
    slug: data-centers-could-erase-decades-of-air-quality-gains
    name: Data center power demand
    decision: market_context
    summary_zh: 2026 年 10 月，报道指出得克萨斯州新建与规划中的数据中心用电需求激增，若全部接入电网，可能使当地空气污染回升至 2000 年代水平。这一变化意味着生成式 AI 基础设施的电力成本与环境合规压力上升，可能推高算力交付成本并加剧选址与供电方式的竞争。
    summary_en: In October 2026, reports indicated that surging electricity demand from new and proposed
      data centers in Texas could push local air pollution back to 2000s levels if all projects connect
      to the grid. This means higher power costs and environmental compliance pressure for generative
      AI infrastructure, potentially raising compute delivery costs and intensifying competition over
      siting and power sourcing.
    event_summary_zh: 报道称得克萨斯州新建和规划中的数据中心用电需求激增，若全部接入电网可能使当地空气污染回升至 2000 年代水平。
    event_summary_en: Reports said surging electricity demand from new and proposed data centers in Texas
      could push local air pollution back to 2000s levels if all projects connect to the grid.
