    - Global
    open_source: false
    summary_zh: 普通消费者在比价、准备下单或安排日常事务时打开 Meta Muse，把商品链接、预算、偏好或零散待办交给它；助手据此筛选商品、给出购买建议或整理出可执行清单，用户拿到的是建议与清单，最终下单和决定仍由本人确认。具体流程与交付边界仍待核验。
    inspiration: 趋势是通用助手正从问答走向替用户完成购物与日常事务，入口价值被大厂重新争夺。切入不在正面做通用助手，而在购物决策之后的履约环节：面向独立站卖家或本地服务商，做能被助手调用并确定性交付报价、库存与预约的接口层，按成交或预约结果收费。
    summary_en: Ordinary consumers open Meta Muse when comparing prices, preparing to buy or organizing
      daily affairs, handing over product links, budgets, preferences or scattered to-dos; the assistant
      shortlists items, gives purchase advice or turns notes into an actionable list, while the final
      purchase and decision stay with the user. The exact workflow and delivery boundary still need verification.
    inspiration_en: 'The trend is general assistants moving from answering questions to completing shopping
      and daily tasks, with big platforms re-fighting for the entry point. The opening is not another
      general assistant but the fulfillment layer after the shopping decision: an interface layer for
      independent sellers or local service providers that assistants can call to deterministically return
      quotes, stock and bookings, charged per transaction or booking.'
    req_initial:
      verdict: true_demand
      signal_level: 需求信号明确
      demand_read:
        job_zh: 普通消费者在比价、准备下单或安排日常事务时，把商品链接、预算、偏好和零散待办交给助手，要完成筛选商品、形成购买建议或整理出可执行清单的任务。
        job_en: Ordinary consumers comparing prices, preparing to buy or organizing daily affairs hand
          product links, budgets, preferences and scattered to-dos to the assistant to shortlist items,
          form purchase advice or produce an actionable list.
        pain_zh: 比价和挑选要在多个页面间来回切换，日常事务则散落在聊天、备忘录和日历里，用户需要自己汇总和判断，耗时且容易遗漏。
        pain_en: Comparison and selection require switching across many pages, while daily affairs are
          scattered across chats, notes and calendars, forcing users to aggregate and judge themselves,
          which is slow and error-prone.
        current_alternative_zh: 旧做法是自己在电商平台搜索、看评论、比价格，或用通用聊天助手逐条提问，再手工把结论抄进备忘录和日历。
        current_alternative_en: The old way is searching marketplaces, reading reviews and comparing prices
          oneself, or asking a general chat assistant question by question and manually copying conclusions
          into notes and calendars.
        usage_reason_zh: 推断：相较自己逐页比价和逐条整理，Muse 直接接收链接、预算与偏好并一次给出候选与建议，省去用户在多页面间汇总这一步；购物与个人事务被公司列为主要使用场景，但公开材料未说明留存与复购，长期留在工作流中尚无证据。
        usage_reason_en: 'Inference: rather than comparing page by page and organizing item by item, Muse
          takes links, budgets and preferences at once and returns candidates and advice, removing the
          aggregation step across pages; shopping and personal productivity are cited by the company as
          top activities, but public material does not show retention or repeat use, so long-term embedding
          in workflows is unproven.'
      gates:
      - gate: value
        status: supported
        reason: 它解决比价挑选与日常事务汇总的需求，痛点是多页面切换和手工整理；不采用则仍需自己汇总，交付为建议与清单，最终决定由用户确认。
        evidence_ids:
        - ev-5c83f69ce57cb103
      - gate: consensus
        status: supported
        reason: 公司称用户已超 1000 万且购物为主要场景，说明有规模采用；但公开材料未给出留存或重复使用数据，共识强度限于规模层面。
        evidence_ids:
        - ev-5c83f69ce57cb103
        - ev-92e515f5f8573f17
      - gate: model
        status: insufficient
        reason: 公开材料未披露 Muse 的定价、付费方式或买方结构，钱可能来自广告、电商导流或订阅，这是判断而非已验证事实。
        evidence_ids:
        - ev-5c83f69ce57cb103
      - gate: truth
        status: insufficient
        reason: 购物建议的准确性与下单履约是否确定性发生未见公开核验，且竞品同日推出同类助手，交付边界仍需观察。
        evidence_ids:
        - ev-87a991b659f037a0
      next_validation: 收集 Meta 官方对 Muse 的定价、订阅或电商导流收费说明，以及是否公布留存或重复使用数据。
