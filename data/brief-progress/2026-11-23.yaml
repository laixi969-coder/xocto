    inspiration: 趋势是代理从桌面浏览器延伸到手机端真实应用，手机成为代理的执行终端而非只读界面。切入可考虑面向需要批量处理手机端重复操作的小团队（如电商客服、社媒运营），卖按任务执行的托管服务；但手机权限、账号安全与操作可审计性才是壁垒，纯开源框架难直接收费。
    summary_en: 'Phone users or desktop-side agents open it when phone apps must be operated: an AI agent
      takes MCP commands from macOS, Windows or Linux, or is started by Pinky itself, performs actions
      on iPhone or Android while the user stays in the loop to confirm each step; the deliverable is an
      action completed on the phone, and which apps and operations are supported still needs verification.'
    inspiration_en: The trend is agents moving from desktop browsers into real phone apps, making the
      phone an execution endpoint rather than a read-only screen. An entry point is managed task execution
      for small teams doing repetitive phone operations, such as e-commerce support or social media ops,
      sold per task; phone permissions, account safety and auditable actions are the real moat, and a
      pure open-source framework is hard to charge for directly.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 手机用户或电脑端代理需要在 iPhone 或 Android 上完成跨应用操作时，由 AI 代理接收 MCP 指令执行手机上的动作，用户逐步确认结果。
        job_en: When a phone user or desktop-side agent needs cross-app operations on iPhone or Android,
          an AI agent takes MCP commands and performs actions on the phone while the user confirms each
          step.
        pain_zh: 手机端重复操作只能靠人手动点按，跨设备把电脑上的任务落到手机上缺少可交接的执行通道；不做的后果是这类操作仍要人工逐步完成。
