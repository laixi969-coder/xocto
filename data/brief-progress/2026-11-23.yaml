  cospan:
    slug: cospan
    name: cospan
    decision: watching
    event_summary_zh: 2026年11月15日，开源项目 cospan 发布，提供跨 Antigravity、Codex、Claude Code 与 DeepSeek Harness
      的异步委派协议，用于统一编排多个编码代理。
    event_summary_en: On 15 November 2026, the open-source project cospan was released, offering an async
      delegation protocol that connects Antigravity, Codex, Claude Code and DeepSeek Harness to orchestrate
      multiple coding agents.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在同时使用多个编码代理时，把同一任务分派给不同代理并汇总结果
    jobs_en:
    - Developers dispatching one task across several coding agents and consolidating the results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在同时使用 Codex、Claude Code 等多个编码代理时，打开 cospan 把任务按异步委派协议分发给不同代理，再取回各自结果；具体汇总方式与交付形态仍待核验。
    inspiration: 趋势：编码代理从单一大模型转向多代理并用，谁来管调度与结果合并成为新环节。切入：面向已同时订阅多个编码代理的工程团队，做任务分派与结果比对层，按团队席位或按任务量收费，价格未披露。
    summary_en: When developers run several coding agents such as Codex and Claude Code at once, they
      use cospan to dispatch tasks to different agents through an async delegation protocol and collect
      the results; the consolidation and delivery format still needs verification.
    inspiration_en: 'Trend: coding agents are shifting from a single model to several in parallel, making
      dispatch and result merging a new layer. Entry: target engineering teams already paying for multiple
      coding agents with a task-routing and result-comparison layer, sold per seat or per task; pricing
      is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同时使用多个编码代理处理同一代码库任务时，需要把子任务分派给不同代理并收回各自产出。
        job_en: Developers using several coding agents on the same codebase task need to dispatch subtasks
          to different agents and collect their outputs.
        pain_zh: 多个代理各自为政，开发者要手动复制任务、切换窗口、比对结果，重复劳动且容易漏掉某个代理的产出。
        pain_en: Agents work in isolation, so developers manually copy tasks, switch windows and compare
          outputs, duplicating effort and risking missed results.
        current_alternative_zh: 手动在多个终端或 IDE 窗口间切换，逐个粘贴提示词并人工汇总。
        current_alternative_en: Manually switching between terminals or IDE windows, pasting prompts one
          by one and consolidating by hand.
        usage_reason_zh: 推断：cospan 用一个异步委派协议把任务分发给多个代理并统一收回结果，省去逐个切换与手工汇总这一步，因此已同时订阅多个编码代理的团队会在并行任务时选择它。
        usage_reason_en: 'Inference: cospan uses one async delegation protocol to dispatch tasks to several
          agents and collect results centrally, removing the switch-and-merge step, so teams already paying
          for multiple coding agents would pick it for parallel tasks.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时的任务分派与结果汇总痛点，旧做法是手动切换与粘贴，结构上成立。
        evidence_ids:
        - ev-b28f67458459c2ea
      - gate: consensus
        status: insufficient
        reason: 仅有 51 星与 6 次 fork，缺少使用讨论与采用证据，场景共识未形成。
        evidence_ids:
        - ev-b28f67458459c2ea
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径，买方可能是团队订阅，属判断而非事实。
        evidence_ids:
        - ev-b28f67458459c2ea
      - gate: truth
        status: insufficient
        reason: 委派协议能否确定性交付合并结果、出错时如何回退，公开材料未说明。
        evidence_ids:
        - ev-b28f67458459c2ea
      next_validation: 收集该仓库的 issue 与 discussion，确认多代理结果合并与失败回退的实际使用反馈。
  cracked:
    slug: cracked
    name: cracked
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries:
