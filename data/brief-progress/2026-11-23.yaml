    summary_zh: 软件工程师在求职准备阶段打开它，把简历、LinkedIn、公开代码仓库 和作品集交给一组技能与代理，对照 O*NET 与 BLS 的职业数据打分并重写这些材料；最终拿到改写后的求职材料，仍需本人确认后投递。具体评分口径与交付质量仍待核验。
    inspiration: 趋势：求职材料正从人工润色转向对照公开职业数据自动打分与重写。切入：可从退役军人、转行工程师等具体求职人群进入，按改写份数或求职辅导打包收费；但免费开源套件本身难形成付费壁垒，需靠行业岗位数据与人工复核环节建立差异。
    summary_en: Software engineers open it while preparing a job search, feeding their resume, LinkedIn,
      public code repository and portfolio to a set of skills and agents that score and rewrite them against
      O*NET and BLS occupational data; the output is rewritten application materials that the user still
      confirms before applying. Scoring criteria and delivery quality remain to be verified.
    inspiration_en: 'Trend: job-search materials are moving from manual polishing to automatic scoring
      and rewriting against public occupational data. Entry: start with specific job-seeking groups such
      as veterans or career-switching engineers, charging per rewrite or as bundled coaching; a free open-source
      kit is hard to defend on its own, so differentiation must come from industry job data and a human
      review step.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 软件工程师在求职投递前，整理简历、LinkedIn、公开代码仓库 与作品集，对照目标岗位与职业数据改写材料，以通过筛选。
        job_en: Before applying, software engineers organize their resume, LinkedIn, public code repository
          and portfolio and rewrite them against target roles and occupational data to pass screening.
        pain_zh: 求职材料分散在多个平台，人工对照岗位要求逐项修改耗时且容易漏掉关键词与证据；不修改则可能在初筛被过滤。
        pain_en: Job-search materials are scattered across platforms; manually aligning each item to role
          requirements is slow and easily misses keywords and evidence, and skipping it risks being filtered
          out at screening.
        current_alternative_zh: 求职者通常自己逐条对照招聘描述改简历，或付费请职业顾问、简历代写服务人工润色。
        current_alternative_en: Job seekers typically rewrite resumes item by item against job descriptions
          themselves, or pay career coaches and resume-writing services to polish them manually.
        usage_reason_zh: 推断：它把简历、LinkedIn、公开代码仓库 与作品集一次性对照 O*NET 与 BLS 职业数据打分并重写，省去求职者逐平台比对岗位要求、手动改写的步骤；面向愿意用开源工具自助准备材料的工程师。缺少用户反馈与留存证据，实际改写质量尚未核验。
        usage_reason_en: 'Inference: it scores and rewrites resume, LinkedIn, public code repository and
          portfolio in one pass against O*NET and BLS occupational data, removing the step of comparing
          requirements platform by platform and rewriting by hand; aimed at engineers willing to self-serve
          with an open-source tool. User feedback and retention evidence are absent, so rewrite quality
          is unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决求职材料分散、需逐项对照岗位要求改写的问题，不处理的后果是被初筛过滤；旧做法是人工改简历或请顾问，痛点具体。
        evidence_ids:
        - ev-d6764cfeb6cd32c5
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 67 缓慢增至 76，属关注度而非采用证据；没有用户评价或使用案例说明求职者持续使用。
        evidence_ids:
        - ev-4e9be05b54364a7f
        - ev-d6764cfeb6cd32c5
      - gate: model
        status: insufficient
        reason: 项目免费开源，未披露付费路径或买方；可能靠求职辅导或 workshop 变现，这是判断而非已验证事实。
        evidence_ids:
        - ev-d6764cfeb6cd32c5
      - gate: truth
        status: insufficient
        reason: 评分是否贴近真实招聘筛选、改写是否可确定交付均无公开材料；免费套件也易被同类复制。
        evidence_ids:
        - ev-d6764cfeb6cd32c5
      next_validation: 收集该仓库的 issue、discussion 或 README 中的使用示例与用户反馈，核验评分口径与改写结果是否被求职者实际采用。
