      to handle coding or debugging tasks and get results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在没有电脑或服务器的场景下，于 iPhone 或 iPad 上打开 fish-pocket，在本机运行 DeepSeek Harness，界面为原生移动端。它接收用户提交的代码或调试任务并在设备本地执行，最终交付运行结果；具体支持的任务范围、模型能力和人工确认环节仍待核验。
    inspiration: 趋势：模型运行环境正从云端和桌面下沉到手机本地，移动端开始承载原本必须在电脑上完成的开发动作。切入：可从需要现场处理代码、又无法携带电脑的运维、外勤工程和独立开发者切入，卖点放在离线可用与数据不出设备，而非通用编码助手。
    summary_en: Developers open fish-pocket on an iPhone or iPad when no computer or server is available,
      running DeepSeek Harness natively on the device with a native mobile interface. It takes submitted
      code or debugging tasks and executes them locally, delivering run results; the exact task scope,
      model capability and human confirmation steps still need verification.
    inspiration_en: 'Trend: model runtimes are moving from cloud and desktop down to phones, so mobile
      devices begin to carry development actions once confined to a computer. Entry: target field operations,
      on-site maintenance and solo developers who must handle code without a laptop, selling offline availability
      and data staying on device rather than a generic coding assistant.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在没有电脑或服务器的现场，用 iPhone 或 iPad 打开本地运行环境，处理代码或调试任务并拿到运行结果。
        job_en: Developers at a site without a computer or server open a local runtime on iPhone or iPad
          to handle coding or debugging tasks and get results.
        pain_zh: 离开电脑就无法运行开发环境，把代码或数据传到云端又有隐私和联网依赖的顾虑。
        pain_en: Leaving the computer means losing the development environment, while sending code or
          data to the cloud raises privacy and connectivity concerns.
        current_alternative_zh: 携带笔记本远程连接服务器，或使用云端编码助手和网页版模型。
        current_alternative_en: Carrying a laptop to connect to a server remotely, or using cloud coding
          assistants and web-based models.
        usage_reason_zh: 推断：相较带笔记本远程连服务器，它在手机上直接本机运行模型环境，省去携带设备和联网这一步，因此无电脑、弱网或数据敏感场景的开发者会尝试它；公开材料尚无留存或付费证据。
        usage_reason_en: 'Inference: compared with carrying a laptop to connect remotely, it runs the
          model environment locally on the phone, removing the need to carry a device and stay online,
          so developers without a computer, on weak networks or handling sensitive data may try it; public
          materials show no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决离开电脑就无法运行开发环境、上传代码又有隐私顾虑的问题，痛点具体且交付为本地运行结果。
        evidence_ids:
        - ev-b8707466451e8cb8
        - ev-5c0b3e37ae9f6fb0
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 294 增至 422 的关注度信号，缺少用户评价或采用规模，不能证明持续使用。
        evidence_ids:
        - ev-b8707466451e8cb8
        - ev-5c0b3e37ae9f6fb0
      - gate: model
        status: insufficient
        reason: 公开材料未说明定价、付费方式或买方，开源项目可能靠捐赠或后续服务，属判断而非已验证事实。
        evidence_ids:
        - ev-5c0b3e37ae9f6fb0
      - gate: truth
        status: insufficient
        reason: 本机运行能否稳定交付、支持哪些任务尚未核验，移动端算力与人工确认边界不清。
        evidence_ids:
        - ev-b8707466451e8cb8
      next_validation: 收集该开源仓库的 issue 与 discussion，核实用户在手机上实际运行的任务类型、失败场景与重复使用反馈。
