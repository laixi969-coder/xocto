    - Education and training
    jobs:
    - 自学者在准备系统学习一门新学科时，把零散资料和课程大纲交给工具，生成带时间安排的课程与习题，并拿到批改结果
    jobs_en:
    - Self-learners preparing to study a new subject systematically hand scattered materials and a syllabus
      to the tool to generate a scheduled course with exercises and receive graded results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 自学的人在准备系统学一门新学科时打开它，把主题和手头资料交给自己的 Claude Code，由后者排出课程进度、生成讲义与习题并批改；用户拿到一份带时间表和评分的学习计划。课程质量与批改是否可靠仍取决于所用模型，具体流程与交付细节仍待核验。
    inspiration: 趋势是个人学习从“找现成课程”转向“按自己的目标现场生成课程与考核”。切入可放在职业考证、企业内部培训这类有明确考纲和通过标准的场景，卖的是排课加批改的结果，而不是再做一个通用学习助手；但必须先解决评分可信度这一环。
    summary_en: A self-learner opens it when preparing to study a new subject systematically, hands the
      topic and available materials to their own Claude Code, which lays out a course schedule, generates
      lessons and exercises and marks them; the user gets a timed study plan with scores. Course quality
      and grading reliability still depend on the model used, and the exact workflow and deliverables
      remain to be verified.
    inspiration_en: The trend is personal learning shifting from finding ready-made courses to generating
      a course and its assessments on the spot against one's own goal. The entry point is exam preparation
      or corporate training where a syllabus and pass standard already exist, selling scheduling plus
      grading as an outcome rather than another general study assistant; grading credibility must be solved
      first.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自学者在准备系统学习一门新学科时，把主题与零散资料交给工具，要完成排课、生成讲义习题并拿到批改结果。
        job_en: A self-learner preparing to study a new subject systematically hands the topic and scattered
          materials to the tool to schedule the course, generate lessons and exercises, and receive graded
          results.
        pain_zh: 自学最大的摩擦是没人排进度、没人出题、没人批改，学习者要自己在搜索、笔记和题库之间来回搬运，容易半途放弃。
        pain_en: The main friction in self-study is that nobody sets the pace, writes exercises or marks
          them, so learners shuttle between search, notes and question banks and often drop out.
        current_alternative_zh: 旧做法是买现成网课、用通用聊天助手零散提问，或自己整理大纲和题库，进度与反馈都靠自律。
        current_alternative_en: The old way is buying ready-made online courses, asking a general chat
          assistant ad hoc, or assembling a syllabus and question bank by hand, with pace and feedback
          resting on self-discipline.
        usage_reason_zh: 相较零散提问，它把排期、出题、批改串成一次交付，减少学习者在多个工具间搬运材料和自行设计练习的步骤；推断需要结构化学习路径的自学者会因此选择它，但批改是否可信尚无用户反馈支持。
        usage_reason_en: Compared with ad hoc questioning, it chains scheduling, exercise generation and
          grading into one delivery, cutting the steps of moving materials between tools and designing
          practice by hand; by inference self-learners needing a structured path would choose it, though
          no user feedback yet supports grading credibility.
      gates:
      - gate: value
