    jobs:
    - 个人开发者在显存有限的笔记本上本地运行小型语言模型，需要在对话之间释放内存以继续处理下一段输入
    jobs_en:
    - Individual developers running a small language model locally on a memory-constrained laptop, needing
      to free RAM between messages to continue with the next input
    regions: []
    regions_en: []
    open_source: true
    summary_zh: Gall 面向在 24GB 内存的 M2 笔记本上本地跑小型模型的开发者：它加载 Inkling 2 Mini，并在每条消息之间释放内存，让有限内存的机器能继续下一轮对话。具体交互界面与交付形态仍待核验。
    inspiration: 趋势：本地小模型开始被塞进消费级笔记本，内存成为比算力更早撞上的墙。切入：从显存/内存受限的个人开发者与边缘设备部署环节进入，卖可预测的本地推理内存管理，而非又一个聊天界面；价格未披露。
    summary_en: 'Gall targets developers running a small model locally on a 24GB M2 laptop: it loads Inkling
      2 Mini and frees RAM between messages so a memory-constrained machine can continue the next turn.
      The exact interface and delivery form still need verification.'
    inspiration_en: 'Trend: small local models are being pushed onto consumer laptops, where memory, not
      compute, is the first wall. Entry: start from memory-constrained individual developers and edge
      deployment, selling predictable local inference memory management rather than another chat UI; pricing
      is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人开发者在内存有限的笔记本上本地运行小型语言模型，需要在多轮对话之间腾出内存以继续处理下一段输入。
        job_en: An individual developer runs a small language model locally on a memory-limited laptop
          and needs to free memory between turns to keep processing the next input.
        pain_zh: 本地推理会持续占用内存，内存不足时对话中断或机器卡顿，用户只能重启进程或放弃本地运行。
        pain_en: Local inference keeps holding memory; when memory runs short the conversation breaks
          or the machine stalls, leaving users to restart the process or give up on local running.
        current_alternative_zh: 旧做法是手动重启推理进程、调低模型规模，或改用云端 API。
        current_alternative_en: The old way is manually restarting the inference process, shrinking the
          model, or switching to a cloud API.
        usage_reason_zh: 推断：Gall 在每条消息之间主动释放内存，省去用户手动重启进程这一步，使 24GB 机器能连续完成多轮本地对话，因此内存受限的本地开发者会在自建推理时选择它。
        usage_reason_en: 'Inference: Gall actively frees memory between messages, removing the manual
          process-restart step and letting a 24GB machine complete multiple local turns, so memory-constrained
          local developers would pick it for self-hosted inference.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地小模型在有限内存机器上跑不下去的问题，痛点是对话中断与手动重启，旧替代是重启进程或改用云端。
        evidence_ids:
        - ev-fc5ed11fc2b05d17
      - gate: consensus
        status: insufficient
