  agent-autoloop:
    slug: agent-autoloop
    name: agent-autoloop
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 命令行 Agent 使用者让后台任务在无人值守时继续推进，遇到需要判断的环节通过卡片确认
    jobs_en:
    - CLI agent users keep background tasks running unattended and confirm judgment calls through cards
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 命令行 Agent 的使用者在跑长任务时打开它，让 Agent 在后台自行接活并跟进；遇到拿不准的环节，它发出卡片请人拍板，用户最终拿到持续推进的任务结果，关键判断仍由人确认。具体交付形态与失败处理流程仍待核验。
    inspiration: 趋势是 Agent 从“一问一答”转向“后台长跑、人只在关键节点介入”，审批与交接成为新的控制点。切入可从需要无人值守跑批的团队入手，例如夜间构建、数据清洗或运维巡检，卖法可围绕托管运行与审计记录，而非再做一个
      Agent 框架。
    summary_en: CLI agent users run it during long tasks so the agent picks up and follows work in the
      background; when it is unsure it sends a card for a human decision, and the user gets continuing
      task output while key calls stay human-confirmed. The exact delivery format and failure handling
      still need verification.
    inspiration_en: The trend is agents moving from single-turn chat to long background runs where humans
      only step in at key points, making approval and handoff the new control surface. Entry could target
      teams needing unattended batch runs such as overnight builds, data cleaning or ops checks, selling
      hosted runs and audit trails rather than another agent framework.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 命令行 Agent 使用者在跑长任务时，让 Agent 在后台接活并跟进，遇到拿不准的环节通过卡片确认。
        job_en: CLI agent users let the agent pick up and follow long tasks in the background, confirming
          uncertain steps through cards.
        pain_zh: 长任务需要人一直盯着，Agent 中途卡住或反复询问会打断工作；不盯着又怕它跑偏。
        pain_en: Long tasks need constant watching; the agent stalling or repeatedly asking interrupts
          work, but leaving it alone risks drift.
        current_alternative_zh: 用户手动分步执行、定时查看终端输出，或干脆不用后台运行。
        current_alternative_en: Users run steps manually, check terminal output periodically, or avoid
          background runs altogether.
        usage_reason_zh: 推断：它把“持续盯终端”换成后台自动跟进，只在不确定处发卡片，减少反复查看与重新下指令的步骤，因此跑长任务的开发者会在无人值守场景选择它。
        usage_reason_en: 'Inference: it replaces constant terminal watching with background follow-up
          and only surfaces cards at uncertain points, cutting repeated checks and re-prompting, so developers
          running long tasks would pick it for unattended work.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长任务需人持续盯守、Agent 中途卡住打断工作的问题，痛点具体且交付可确定。
        evidence_ids:
        - ev-222a640a26f13728
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度增长，缺少用户反馈或案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-222a640a26f13728
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或托管服务，买方与收入模式不明。
        evidence_ids:
        - ev-222a640a26f13728
      - gate: truth
        status: insufficient
        reason: 卡片审批与后台跟进能否确定性交付、失败如何处理，公开材料未说明。
        evidence_ids:
        - ev-222a640a26f13728
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对后台跟进、卡片审批和失败处理的实际反馈。
  agent-crop:
    slug: agent-crop
    name: agent-crop
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code、Codex 等 AI 编程助手的开发者，在长时间会话后复盘时间花在哪、哪些指令或技能导致返工，并据此改写 agent 指令与工具配置
    jobs_en:
    - Developers using AI coding assistants such as Claude Code and Codex who, after long sessions, review
      where time went and which instructions or skills caused rework, then rewrite agent instructions
      and tool configs accordingly
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex 等 AI 编程助手的开发者，在会话结束后打开它，处理本地记录的 agent 运行时间与行为数据；它把复盘结果写回 agent 的指令、技能和工具配置，用户拿到一份可审计的改进记录。具体如何判定“改没改好”、交付形态与人工确认环节仍待核验。
    inspiration: 趋势：AI 编程助手已进入日常开发，但“agent 表现好不好、哪条指令导致返工”缺少可核对的记录，围绕 agent 行为的度量与调优正在成为一个独立环节。切入：从重度使用
      AI 编程助手的团队或个人开发者入手，卖“agent 调优与审计”而非又一个编码助手；可考虑按团队席位或按审计报告收费，价格未披露。
    summary_en: Developers using AI coding assistants such as Claude Code and Codex open it after a session
      to process locally recorded agent runtime and behavior data; it writes review findings back into
      the agent's instructions, skills and tool configs, giving the user an auditable improvement record.
      How it judges whether changes helped, the delivery format and the human confirmation step still
      need verification.
    inspiration_en: 'Trend: AI coding assistants are now part of daily development, yet there is little
      checkable record of how well an agent performed or which instruction caused rework, so measuring
      and tuning agent behavior is becoming its own step. Entry: start with heavy users of AI coding assistants,
      individuals or teams, selling agent tuning and auditing rather than another coding assistant; per-seat
      or per-audit-report pricing is plausible but undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code、Codex 等 AI 编程助手的开发者，在长时间会话后需要弄清时间花在哪、哪些指令或技能导致返工，并据此改写 agent 配置。
        job_en: Developers using AI coding assistants such as Claude Code and Codex need to understand,
          after long sessions, where time went and which instructions or skills caused rework, then rewrite
          agent configs accordingly.
        pain_zh: AI 编程助手的输出质量随指令与技能配置波动，但开发者缺少可核对的记录来判断改动是否真的减少了返工，只能凭感觉调提示词。
        pain_en: Output quality of AI coding assistants varies with instruction and skill configs, but
          developers lack checkable records to tell whether a change actually reduced rework, so they
          tune prompts by feel.
        current_alternative_zh: 开发者目前靠手动翻会话记录、凭印象改提示词，或干脆不调优，直接接受 agent 的返工。
        current_alternative_en: Developers currently scroll back through session logs, tweak prompts from
          memory, or skip tuning and simply accept agent rework.
        usage_reason_zh: 推断：它把本地时间与行为数据自动汇总并写回 agent 配置，省去开发者手动翻日志、逐条比对改动效果这一步，因此重度使用 AI 编程助手、在意返工成本的开发者会在调优时选择它。
        usage_reason_en: 'Inference: it automatically aggregates local timing and behavior data and writes
          findings back into agent configs, removing the manual step of scrolling logs and comparing change
          effects, so heavy users who care about rework cost would pick it when tuning.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 编程助手调优缺少可核对记录的问题，痛点是返工成本，旧做法是手动翻日志凭感觉改，结构上成立。
        evidence_ids:
        - ev-0a9e40080b9c80a5
        - ev-2ae2e8b3216f4bc2
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 73 增至 241 的关注度信号，没有用户反馈或案例说明开发者已把它纳入调优流程。
        evidence_ids:
        - ev-0a9e40080b9c80a5
        - ev-2ae2e8b3216f4bc2
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，是否走团队订阅或服务收费是判断而非已验证事实。
        evidence_ids:
        - ev-2ae2e8b3216f4bc2
      - gate: truth
        status: insufficient
        reason: “改没改好、用数据说话”的判定标准与人工确认边界未在材料中展开，交付确定性待核验。
        evidence_ids:
        - ev-0a9e40080b9c80a5
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者是否报告实际减少了返工或将其纳入日常调优流程。
