      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容审核员或普通读者在浏览社交媒体、新闻图片和二手交易图片时，需要判断画面是否为 AI 生成，以便决定是否采信、转发或放行。
        job_en: A content moderator or ordinary reader browsing social media, news images and marketplace
          listings needs to judge whether an image is AI-generated before trusting, sharing or approving
          it.
        pain_zh: AI 生成图片越来越难肉眼分辨，误信或误转会带来声誉与信任损失；逐张找外部检测工具又打断浏览流程。
        pain_en: AI-generated images are increasingly hard to spot by eye, and trusting or sharing them
          wrongly costs credibility; checking each one with an external tool breaks the browsing flow.
        current_alternative_zh: 靠肉眼经验判断，或把图片另存后上传到在线检测网站，再回到原页面。
        current_alternative_en: Judging by eye, or saving the image and uploading it to an online detector,
          then returning to the original page.
        usage_reason_zh: 推断：扩展在浏览当下就地标记可疑画面，省去另存、上传、回跳的步骤，因此高频看图的内容审核和事实核查人员会优先试用；但检测准确率与误报率尚无公开数据，是否长期留在工作流缺少证据。
        usage_reason_en: 'Inference: the extension flags suspicious images in place while browsing, removing
          the save-upload-return loop, so frequent image reviewers in moderation and fact-checking would
          try it first; accuracy and false-positive data are not public, so long-term retention is unproven.'
      gates:
      - gate: value
        status: supported
        reason: 它解决浏览中判断画面是否 AI 生成的需求，痛点是肉眼难辨且外部检测打断流程，旧替代行为清晰。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度缓慢增长，缺少用户评价或机构采用证据，无法判断场景共识。
        evidence_ids:
        - ev-5bec33e0fbf1a92f
        - ev-4a20a46ff87a58d6
      - gate: model
        status: insufficient
        reason: 开源免费，未见定价或付费路径，买方可能是媒体机构或平台，属判断而非已验证事实。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: truth
        status: insufficient
        reason: 本地检测能否确定性交付取决于准确率，公开材料未给出误报与漏报数据。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      next_validation: 收集该开源仓库的 issue 与讨论，查看用户报告的检测准确率、误报案例和实际使用场景。
