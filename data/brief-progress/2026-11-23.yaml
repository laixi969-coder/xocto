full:
  art-paper-data:
    slug: art-paper-data
    name: art-paper-data
    decision: watching
    event_summary_zh: 2026-11-14，Anthropic 在代码托管平台发布 ART 论文的数据包仓库，公开说明仅为论文数据包，未披露独立工具、定价或使用数据。
    event_summary_en: On 2026-11-14, Anthropic published a repository described as the data package for
      the ART manuscript; no standalone tool, pricing, or usage data was disclosed.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 研究者在复现或核查 ART 论文时打开这个仓库，拿到的是论文配套数据包而非可运行产品；它接收什么输入、产出什么交付、人工如何确认，公开材料均未说明，具体流程或交付仍待核验。
    inspiration: 趋势：前沿模型实验室开始把论文数据以可追溯仓库形式公开，研究复现的材料链在变短。切入：面向需要复现或审计模型行为证据的实验室与合规团队，做数据包到可运行评测的衔接环节；该仓库本身未披露任何收费方式。
    summary_en: Researchers reproducing or auditing the ART paper open this repository and receive a paper
      data package rather than a runnable product; what it ingests, what it delivers, and where humans
      must confirm are not described in the public material, so the concrete workflow and deliverable
      remain unverified.
    inspiration_en: 'Trend: frontier model labs are publishing paper data as traceable repositories, shortening
      the material chain for reproduction. Entry: serve labs and compliance teams that must reproduce
      or audit model-behavior evidence by bridging data packages to runnable evaluations; the repository
      itself discloses no pricing.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 研究者在复现或审计 ART 论文结论时，打开该仓库处理论文配套数据，要完成的是核对论文所用数据能否被独立复用；具体输入、动作与交付未在公开材料中说明。
        job_en: Researchers reproducing or auditing the ART paper's conclusions open this repository to
          handle the paper's companion data, aiming to check whether the data behind the paper can be
          reused independently; the inputs, actions, and deliverable are not described in the public material.
        pain_zh: 论文结论的可复现性依赖配套数据是否完整可追溯；公开材料未说明该数据包解决哪一步具体困难，也未给出使用者抱怨或替代做法。
        pain_en: Reproducibility of paper conclusions depends on whether companion data is complete and
          traceable; the public material does not state which concrete step this package addresses, nor
          does it show user complaints or workarounds.
        current_alternative_zh: 旧做法通常是向作者索取数据、从论文附录手工重建，或依赖第三方复现仓库；该仓库是否替代其中任一步，公开材料未说明。
        current_alternative_en: The prior practice is typically requesting data from authors, manually
          rebuilding from paper appendices, or relying on third-party reproduction repositories; whether
          this repository replaces any of these steps is not stated publicly.
        usage_reason_zh: 推断：若该数据包完整且带说明，研究者可省去向作者索取或从附录重建数据这一步；但公开材料未展示数据内容、文档或任何使用反馈，因此无法确认哪类用户会因此选择它。
        usage_reason_en: 'Inference: if the package is complete and documented, researchers could skip
          requesting data from authors or rebuilding it from appendices; however, the public material
          shows no data contents, documentation, or usage feedback, so it is unclear which users would
          choose it for that reason.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决论文数据可复现问题，但公开材料未说明数据内容、使用方式与交付结果，痛点强度与旧替代行为均无法确认。
        evidence_ids:
        - ev-5270689d337a1fd1
