        job_en: Android automation developers or testers who need an AI agent to operate phone apps while
          they keep using the phone, handling app UI operation tasks to complete unattended automation.
        pain_zh: agent 操作手机时会占用前台屏幕，用户无法同时使用手机，自动化任务与日常使用互相打断。
