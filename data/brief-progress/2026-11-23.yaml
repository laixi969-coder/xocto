  cinecode-2:
    slug: cinecode-2
    name: cinecode
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 广告与营销
    - 媒体与娱乐
    - 教育培训
    industries_en:
    - Advertising & Marketing
    - Media & Entertainment
    - Education & Training
    jobs:
    - 营销或内容团队需要低成本产出短片、广告或讲解视频时，把脚本和画面需求交给编码代理，由它生成逐帧画面与声音并交付可播放视频
    - 独立创作者制作音乐视频或长视频时，用代码化流程替代手工剪辑与合成，拿到成片后自行审看修改
    jobs_en:
    - Marketing or content teams needing low-cost short films, ads or explainer videos hand a script and
      visual brief to a coding agent that builds frames and sound and returns a playable video
    - Independent creators making music videos or long videos replace manual editing and compositing with
      a code-based pipeline, then review and revise the output
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 营销团队或独立创作者要做短片、广告、讲解视频时，把脚本和画面要求交给一个编码代理，它用代码逐帧搭建画面、设计声音，最后输出一个 MP4 成片。用户拿到的是可直接播放的视频文件，仍需自己审看和修改；具体生成质量、可控程度与人工返工环节仍待核验。
    inspiration: 趋势：视频生产正从剪辑软件里的手工拼接，转向用代码和代理批量生成整段成片，把“做视频”变成可脚本化、可复用的流程。切入：从预算有限、需要高频出片的中小广告主和讲解视频需求方进入，按成片或按项目收费；也可先做垂直题材模板（如产品讲解、课程片头），但成片质量与返工成本尚未核验。
    summary_en: When marketing teams or independent creators need a short film, ad or explainer, they
      give a script and visual brief to a coding agent that builds each frame in code, designs the sound
      and outputs an MP4. The user receives a playable video file and still has to review and revise it;
      generation quality, controllability and manual rework remain unverified.
    inspiration_en: 'Trend: video production is shifting from manual assembly in editing software toward
      code- and agent-generated whole films, making video a scriptable, reusable pipeline. Entry: start
      with budget-constrained small advertisers and explainer-video buyers, charging per finished video
      or per project, or begin with vertical templates such as product explainers and course intros; output
      quality and rework cost are not yet verified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 营销或内容团队在需要低成本、快速产出短片、广告或讲解视频时，把脚本和画面要求交给编码代理，由它生成逐帧画面与声音并交付可播放视频。
        job_en: Marketing or content teams needing low-cost, fast short films, ads or explainers hand
          a script and visual brief to a coding agent that builds frames and sound and returns a playable
          video.
        pain_zh: 传统视频制作要经过写脚本、拍摄或找素材、剪辑、配音配乐多道手工环节，周期长、外包贵；小团队难以高频出片。
        pain_en: Traditional video production runs through scripting, shooting or stock sourcing, editing
          and sound design by hand, taking long and costing much when outsourced; small teams struggle
          to ship frequently.
        current_alternative_zh: 用剪辑软件手工拼接素材，或外包给制作公司；也有用生成式视频模型逐段生成再人工拼接。
        current_alternative_en: Manual assembly in editing software, outsourcing to production houses,
          or generating clips with generative video models and stitching them by hand.
        usage_reason_zh: 推断：相较手工剪辑或外包，它把脚本到成片的多个环节交给一个编码代理一次完成，减少找素材、拼接和配乐的分步操作，因此预算有限、需要快速出片的小广告主和讲解视频需求方会尝试；成片质量与返工量尚无公开证据。
        usage_reason_en: 'Inference: versus manual editing or outsourcing, it hands scripting-to-finished-film
          steps to one coding agent in a single pass, cutting the step-by-step work of sourcing, stitching
          and scoring, so budget-constrained advertisers and explainer buyers may try it; output quality
          and rework volume lack public evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决低成本快速产出短片、广告和讲解视频的需求，痛点是手工剪辑与外包周期长、成本高；结构上成立，属工作流推理。
        evidence_ids:
        - ev-c9713583950f6b99
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度持续上升，缺少用户评价或客户案例说明真实使用场景与满意度。
        evidence_ids:
        - ev-86d4c8a990cabe02
        - ev-4999f41bd7ae76b2
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方式或买方；按成片或项目收费只是可能路径，属判断而非已验证事实。
        evidence_ids:
        - ev-c9713583950f6b99
      - gate: truth
        status: insufficient
        reason: 成片质量、可控性与人工返工边界未披露，能否确定性交付仍需核验。
        evidence_ids:
        - ev-86d4c8a990cabe02
      next_validation: 收集 cinecode 仓库的 issue、discussion 或示例成片，核验实际输出质量与人工返工环节。
