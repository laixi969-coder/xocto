    summary_zh: 使用 Claude Code、Cursor 或 Codex 的开发者，在 AI 声称已修复问题后，需要确认改动是否真的生效。pstack 让 AI 先运行并检验自己的改动，再给出结果；用户最终拿到的是经过自检的改动，还是仍需人工复核，具体流程与交付形态仍待核验。
    inspiration: 趋势：AI 写代码的瓶颈正从“生成”转向“验证”，谁能把自检环节做成可重复的流程，谁就掌握交付质量。切入：面向使用编码代理的团队，从“改动后自动跑通验证再交付”这一环节进入，按项目或按验证次数收费的方式可探索，价格未披露。
    summary_en: Developers using Claude Code, Cursor or Codex need to confirm that an AI-claimed fix actually
      works. pstack makes the AI run and test its own changes first before reporting a result; whether
      the output is a self-verified change or still needs human review, and the exact workflow and deliverable,
      remain to be verified.
    inspiration_en: 'Trend: the bottleneck in AI coding is shifting from generation to verification, and
      whoever turns self-checking into a repeatable step controls delivery quality. Entry: target teams
      using coding agents at the point where a change must be automatically validated before handoff;
      per-project or per-verification pricing could be explored, but no price is disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者让 AI 修改代码后，需要确认改动是否真的修好了问题，再决定是否合并或交付。
        job_en: Developers using coding agents need to confirm an AI-made code change actually fixes the
          problem before merging or shipping it.
        pain_zh: AI 常声称已修复但实际仍坏，开发者要自己重跑测试、逐行核对，返工和信任成本高。
        pain_en: AI often claims a fix that is still broken, forcing developers to rerun tests and check
          line by line, with high rework and trust cost.
        current_alternative_zh: 开发者手动运行测试、阅读 diff，或依赖现有 CI 与测试套件自行判断。
        current_alternative_en: Developers manually run tests, read diffs, or rely on existing CI and
          test suites to judge for themselves.
        usage_reason_zh: 推断：pstack 让 AI 在报告结果前先运行并检验自己的改动，把“重跑验证”这一步从开发者手上移到代理内部，减少人工复核负担；因此使用编码代理、又频繁遇到假修复的开发者会尝试它。
        usage_reason_en: 'Inference: pstack makes the AI run and test its own change before reporting,
          moving the re-verification step from the developer into the agent and reducing manual review;
          developers using coding agents who repeatedly hit false fixes would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 声称修复但实际未修好的验证需求，痛点在编码代理工作流中具体且刚性，交付是经过自检的改动。
        evidence_ids:
        - ev-4f5e5752c452df55
        - ev-606709490006d296
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或客户案例说明开发者是否真的把它留在工作流里。
        evidence_ids:
        - ev-606709490006d296
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方或商业模式，买方与收费路径尚不清晰。
        evidence_ids:
        - ev-4f5e5752c452df55
      - gate: truth
        status: insufficient
        reason: 自检能否确定性交付、是否覆盖真实缺陷，缺少可复现实测或部署文档佐证。
        evidence_ids:
        - ev-4f5e5752c452df55
      next_validation: 收集 pstack 官方文档或仓库 issue/discussion 中关于自检验证流程与真实缺陷覆盖的可复现说明。
    event_summary_zh: 2026 年 11 月 10 日发布 pstack，面向 Claude Code、Cursor 和 Codex 用户，让 AI 先检验自己的改动再报告结果；仓库星数从
      58 缓慢增至 69。
