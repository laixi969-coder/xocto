    name: selfsemester
    decision: watching
    event_summary_zh: 2026年11月4日发布的开源 Windows 应用，把任意主题转成带排期与评分的完整课程，由使用者自己的 Claude Code 生成并批改；仓库星标从11月16日的102增至11月22日的110，之后持平。
    event_summary_en: An open-source Windows app published on 4 November 2026 that turns any subject into
      a full scheduled and graded course, built and marked by the user's own Claude Code; repository stars
      rose from 102 on 16 November to 110 on 22 November, then held flat.
