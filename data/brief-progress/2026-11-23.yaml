    jobs:
    - 求职者在准备目标公司面试时，用终端输入公司名，让工具生成模拟面试题、带隐藏测试的在线测评和简历点评，以完成面试前演练
    jobs_en:
    - Job seekers preparing for a target company's interview enter the company name in a terminal to generate
      mock interview questions, online assessments with hidden tests, and resume critiques for pre-interview
      practice
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 求职者在准备某家公司面试时，在终端里选择目标公司，工具据此生成模拟面试题、带隐藏测试的在线测评和简历点评，覆盖 470 多家公司；用户拿到的是可自行练习的题目与反馈，具体题目质量与是否贴近真实面试仍待核验。
    inspiration: 趋势：求职准备正从买题库、找学长模拟，转向按目标公司即时生成演练材料。切入：可从留学生或转行者的单公司冲刺包入手，按公司或按次收费，但需先证明题目贴近真实面试。
    summary_en: When preparing for a specific company's interview, a job seeker picks the target company
      in a terminal and the tool generates mock interview questions, online assessments with hidden tests,
      and resume critiques across 470+ companies; the user gets practice material and feedback, while
      question quality and fidelity to real interviews remain unverified.
    inspiration_en: 'Trend: interview prep is shifting from buying question banks or asking seniors for
      mock sessions toward on-demand drills generated per target company. Entry: start with single-company
      sprint packs for overseas students or career switchers, priced per company or per session, but first
      prove the questions match real interviews.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 求职者在投递后、面试前，需要针对某家公司的题型和测评形式做演练，处理的是面试题、在线测评和简历材料，要完成的是拿到可练习的题目与改进反馈。
        job_en: After applying and before interviewing, a job seeker needs to rehearse a specific company's
          question types and assessment format, working with interview questions, online tests, and resume
          material to obtain practice items and improvement feedback.
        pain_zh: 目标公司的真实题型和测评形式分散在论坛帖、付费题库和熟人经验里，整理成本高，且很难针对单家公司快速成体系地练。
        pain_en: A target company's real question types and assessment formats are scattered across forum
          posts, paid question banks, and acquaintances' experience, making them costly to assemble and
          hard to practice systematically for one company.
        current_alternative_zh: 刷 LeetCode 等通用题库、买付费面经、找同学或学长做模拟面试、在论坛搜集该公司面经。
        current_alternative_en: Working through generic question banks like LeetCode, buying paid interview-experience
          packs, asking classmates or seniors for mock interviews, and gathering company-specific posts
          from forums.
        usage_reason_zh: 推断：相较通用题库和零散面经，它把公司选择、出题、隐藏测试和简历点评收进一次终端操作，省去跨多个来源搜集与拼装练习材料的一步，因此赶面试、需要单公司集中冲刺的求职者会尝试它。
        usage_reason_en: 'Inference: versus generic question banks and scattered interview posts, it folds
          company selection, question generation, hidden tests, and resume critique into one terminal
          action, removing the step of gathering and assembling practice material from multiple sources,
          so job seekers on a deadline needing a single-company sprint would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决求职者针对单家公司做面试演练的需求，痛点是题型与测评材料分散、整理成本高；买方尚不清晰。
        evidence_ids:
        - ev-5a255c25fcaabf0d
        - ev-0c2e7db55d24592d
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 291 增至 348 的关注度信号，缺少用户评价或采用证据，无法判断是否形成持续使用。
        evidence_ids:
        - ev-5a255c25fcaabf0d
        - ev-0c2e7db55d24592d
      - gate: model
        status: insufficient
        reason: 未见定价页或付费路径，开源项目可能的收入来源不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-0c2e7db55d24592d
      - gate: truth
        status: insufficient
        reason: 题目是否贴近真实面试、隐藏测试是否可信均无公开核验，交付确定性存疑。
        evidence_ids:
        - ev-5a255c25fcaabf0d
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对题目贴近真实面试程度的反馈。
  craft:
    slug: craft
    name: craft
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与互联网
    - 设计服务
    industries_en:
    - software and internet
    - design services
    jobs:
    - 前端或产品设计师在接到界面需求时，用 AI 代理读取设计系统与设计简报，生成含各状态的界面并做评审，以完成可交付的界面稿
    jobs_en:
    - Front-end or product designers receiving a UI request use an AI agent to read the design system
      and brief, generate screens with all states, and review them to deliver interface drafts
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 设计师或前端在接到界面需求时，通过 /craft-setup 写出设计简报，再由 /craft 依据设计系统生成含各状态的界面并做评审，可对接 Paper、pen.dev、Figma
      或 HTML；用户拿到的是界面稿与评审意见，人工仍需确认，具体交付质量待核验。
    inspiration: 趋势：设计系统正被当作 AI 代理的输入，界面生成从单屏草图走向带全状态的成套产出。切入：可从有成熟设计系统的中大型产品团队切入，按项目或按设计系统接入收费，但需先证明生成稿能直接进评审。
    summary_en: When a designer or front-end developer receives a UI request, /craft-setup writes the
      design brief and /craft generates screens with all states from the design system and reviews them,
      working with Paper, pen.dev, Figma, or HTML; the user gets interface drafts and review notes, human
      confirmation is still needed, and delivery quality remains unverified.
    inspiration_en: 'Trend: design systems are becoming inputs to AI agents, and UI generation is moving
      from single-screen sketches to full sets with all states. Entry: target mid-to-large product teams
      with mature design systems, priced per project or per design-system integration, but first prove
      generated drafts can go straight into review.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 设计师或前端在接到界面需求时，需要依据既有设计系统产出含空、加载、错误等各状态的界面，处理的是设计简报与组件规范，要完成的是可评审的界面稿。
        job_en: When receiving a UI request, a designer or front-end developer must produce screens covering
          empty, loading, error, and other states from an existing design system, working with the design
          brief and component specs to deliver reviewable interface drafts.
        pain_zh: 把设计系统落成每个状态的界面是重复劳动，容易漏状态、偏离规范，评审前还要人工补齐。
        pain_en: Turning a design system into every state of a screen is repetitive work prone to missing
          states and drifting from specs, and humans must fill gaps before review.
        current_alternative_zh: 设计师在 Figma 里手工搭各状态页面，或让通用 AI 生成单屏草图后再人工补状态与规范。
        current_alternative_en: Designers hand-build each state in Figma, or use general AI to generate
          single-screen sketches and then manually add states and specs.
        usage_reason_zh: 推断：相较手工搭页或通用 AI 出单屏草图，它先固化设计简报、再按设计系统生成全状态并自动评审，省去逐状态补稿和规范校对的一步，因此有成熟设计系统的团队在批量出界面时会选择它。
        usage_reason_en: 'Inference: versus hand-building pages or general AI producing single-screen
          sketches, it first fixes the design brief, then generates all states from the design system
          and auto-reviews them, removing the step of filling in each state and checking specs, so teams
          with mature design systems would choose it when producing screens at volume.'
      gates:
      - gate: value
        status: supported
        reason: 它解决按设计系统产出全状态界面的重复劳动，痛点是漏状态与偏离规范；买方与付费路径尚不清晰。
        evidence_ids:
        - ev-64b80d0a57d73f58
        - ev-e50a30ced439808a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 392 增至 426 的关注度信号，缺少用户评价或团队采用证据。
        evidence_ids:
        - ev-64b80d0a57d73f58
        - ev-e50a30ced439808a
      - gate: model
        status: insufficient
        reason: 未见定价或商业路径，开源项目的收入来源不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-e50a30ced439808a
      - gate: truth
        status: insufficient
        reason: 生成界面能否直接进评审、与设计系统的一致性如何均无公开核验，交付确定性存疑。
        evidence_ids:
        - ev-64b80d0a57d73f58
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对生成界面与设计系统一致性的实测反馈。
