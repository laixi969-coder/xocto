      AI-generated content and flags it without uploading anything; the user gets a per-item authenticity
      hint and still decides whether to trust it. Detection accuracy and false-positive rates remain to
      be verified.
    inspiration_en: 'Trend: as AI-generated content floods feeds, judging whether an image is real is
      shifting from platform responsibility to individual readers. Entry: start with newsrooms, fact-checking
      teams and marketplace image review, charging per check or by institutional subscription rather than
      a free plugin for everyone.'
