      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师或逆向分析人员在代码被 BLA 加固后，需要让编码代理重新读取真实代码，以完成审计、漏洞排查或修改任务。
        job_en: Security engineers or reverse engineers need coding agents to read real code again after
          BLA hardening, to complete audits, vulnerability checks or modifications.
        pain_zh: 加固后的代码对代理不可读，代理无法完成审计或修改，人工逐段还原耗时且易错。
        pain_en: Hardened code is unreadable to agents, so they cannot complete audits or edits; manual
          restoration is slow and error-prone.
        current_alternative_zh: 人工阅读混淆代码、手写还原脚本，或放弃让代理参与该部分工作。
        current_alternative_en: Humans read obfuscated code, hand-write restoration scripts, or give up
          on involving agents in that part of the work.
        usage_reason_zh: 推断：相较人工逐段还原，它用静态解析一次性把被遮蔽的代码还原成代理可读形式，省去手工还原这一步，因此需要让代理审计混淆代码的安全团队会在该场景选择它；尚无用户反馈或案例支持。
        usage_reason_en: 'Inference: compared with manual piece-by-piece restoration, it statically parses
          and restores obscured code into an agent-readable form in one pass, removing the manual restoration
          step, so security teams needing agents to audit obfuscated code would choose it in that situation;
          no user feedback or cases yet support this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理读不到加固代码、无法完成审计或修改的问题，痛点在安全与逆向场景中具体，交付为可读代码。
        evidence_ids:
        - ev-6cfbf1cb636ef3e7
        - ev-80027d0cc7dc6c0b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、issue 讨论或客户案例说明谁在什么场景使用。
        evidence_ids:
        - ev-783c6d68ea1de917
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、商业授权或付费路径，买方与收入模式未披露。
        evidence_ids:
        - ev-6cfbf1cb636ef3e7
      - gate: truth
        status: insufficient
        reason: 未披露还原准确度、覆盖范围与安全边界，能否确定性交付可读代码仍缺公开验证。
        evidence_ids:
        - ev-70f4be4984ff902c
      next_validation: 收集该仓库的 issue、discussion 或 README 中的实测说明，核验还原准确度与支持范围。
