  ai-manus20-12:
    slug: ai-manus20-12
    name: AI Manus
    decision: watching
    event_summary_zh: 2026年11月14日出现一个名为 AI Manus 的开源通用 AI Agent 仓库，描述称其可在沙箱环境中运行多种工具与操作；仓库星标从约651降至366，fork
      295，未见发布说明、文档或客户案例。
    event_summary_en: On 14 November 2026 a repository named AI Manus appeared, described as a general-purpose
      AI agent system that runs various tools and operations in a sandbox; stars fell from about 651 to
      366 with 295 forks, and no release notes, documentation or customer cases were provided.
    category: 通用助手
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者或运营人员在需要让 AI 在隔离环境中调用工具完成多步操作时会打开这个仓库；它接收任务后调度沙箱内的工具执行动作，最终产出操作结果。但具体输入形式、交付物形态和人工确认环节在公开材料中未说明，具体流程或交付仍待核验。
    inspiration: 趋势是通用 agent 的沙箱执行层被反复开源复刻，说明“让模型安全动手”本身正在商品化；切入不在再造一个通用 agent 框架，而在某个具体行业里把沙箱执行接到可核对的交付物上，例如给代运营团队做可回滚的批量账号操作，按任务结果收费。
    summary_en: Developers or operators open this repository when they need an AI to call tools and complete
      multi-step operations inside an isolated environment; it takes a task, dispatches tools in a sandbox
      and returns the operation results. The input format, deliverable form and human confirmation step
      are not described in the public material, so the concrete workflow and delivery remain to be verified.
    inspiration_en: The trend is that the sandbox execution layer of general agents is being repeatedly
      open-sourced, meaning 'letting models act safely' is commoditising. The opening is not another general
      agent framework but wiring sandbox execution to a checkable deliverable inside one specific industry,
      for example reversible batch account operations for agency teams, priced per completed task.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 开发者或运营人员需要让 AI 在隔离环境中调用多种工具完成多步操作任务，并拿到可用的执行结果。
        job_en: A developer or operator needs an AI to call multiple tools inside an isolated environment
          to complete a multi-step task and obtain a usable result.
        pain_zh: 直接让模型操作真实系统有误删、越权和不可回滚的风险，手工逐步执行又慢；公开材料只说明沙箱执行这一能力，未说明具体是谁在什么任务上受困。
        pain_en: Letting a model act on real systems risks deletion, privilege abuse and no rollback,
          while doing each step by hand is slow; the public material only states the sandbox capability
          and does not say who is stuck on which task.
        current_alternative_zh: 自行搭建脚本与容器、使用其他开源 agent 框架，或人工逐步执行并复核。
        current_alternative_en: Building scripts and containers in-house, using other open-source agent
