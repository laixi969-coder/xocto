          what each agent is doing and how far its output has gone, then decide which agent to add or
          dispatch tasks to.
        pain_zh: 多代理并行后，终端输出分散在多个窗口，开发者难以同时掌握进度，容易重复下发或漏看失败；这是从产品说明与工作流结构推出的判断。
