    open_source: false
    summary_zh: Trix 是一个终端工作区，面向同时运行多个编码代理的开发者：它把各代理的状态集中显示，标出哪一个正在等待用户输入或确认，用户据此切换到对应代理继续任务。具体支持哪些代理、如何接入以及交付形态仍待核验。
    inspiration: 趋势：编码代理从单个对话走向多个并行任务，调度与看护成为新的摩擦点。切入：可从需要同时盯多个代理的小型工程团队或外包交付团队进入，卖“代理值守与切换”而非又一个编码代理；具体流程与定价尚未披露。
    summary_en: 'Trix is a terminal workspace for developers running several coding agents at once: it
      surfaces each agent''s state and flags which one is waiting for user input or approval, so the user
      can switch to that agent and continue. Which agents it supports, how it connects, and its delivery
      form still need verification.'
    inspiration_en: 'Trend: coding agents are moving from a single conversation to multiple parallel tasks,
      making orchestration and babysitting the new friction. Entry: start with small engineering or outsourced
      delivery teams that must watch several agents at once, selling agent supervision and switching rather
      than another coding agent; workflow and pricing are not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 同时运行多个编码代理的开发者，在多个任务并行推进时，需要判断哪个代理卡在等待输入或确认，并切换过去继续。
        job_en: Developers running several coding agents in parallel need to tell which agent is stuck
          waiting for input or approval and switch to it to continue.
        pain_zh: 多代理并行时，等待状态分散在各终端里，用户要反复轮询才能发现被卡住的任务，空转时间被浪费。
        pain_en: With multiple agents in parallel, waiting states are scattered across terminals, so users
          must poll repeatedly to find stalled tasks and idle time is wasted.
        current_alternative_zh: 旧做法是逐个终端窗口切换查看，或凭记忆轮询各代理输出。
        current_alternative_en: The old way is switching between terminal windows one by one or polling
          each agent's output from memory.
        usage_reason_zh: 推断：Trix 把各代理状态汇总并标出等待项，省去逐个窗口轮询这一步，因此同时跑多个代理的开发者会在任务并行时选择它；尚无留存或付费证据。
        usage_reason_en: 'Inference: Trix aggregates agent states and flags waiting ones, removing the
          step of polling each window, so developers running several agents would pick it when tasks run
          in parallel; no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时等待状态分散、需要反复轮询的痛点，旧替代是逐窗口切换查看，结构上成立。
        evidence_ids:
        - ev-89dbfe478f4e0df1
      - gate: consensus
        status: insufficient
        reason: 仅有少量社区讨论，未见用户反馈或团队采用描述，强场景是否成立尚不清楚。
        evidence_ids:
        - ev-89dbfe478f4e0df1
      - gate: model
        status: insufficient
