        usage_reason_zh: 推断：相较必须守在屏幕前的对话式助手，它把整段任务交给代理在离开时执行，减少工程师逐轮确认的负担；但公开材料未说明验收与失败处理方式，是否被长期采用缺少证据。
        usage_reason_en: 'Inference: unlike assistants that require sitting at the screen, it hands a
