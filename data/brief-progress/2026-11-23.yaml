        - ev-2e2d5b71399076e5
      - gate: truth
        status: insufficient
        reason: 高杠杆购置 GPU 再转租，交付依赖上游供给与融资续接，材料未给出利用率或履约数据。
        evidence_ids:
        - ev-2e2d5b71399076e5
        - ev-0f123a3e850fbea1
      next_validation: 收集 CoreWeave 官方投资者关系页披露的最新季度营收、客户集中度与 GPU 利用率数据。
