    name: lot-map
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code 的开发者在其代理连续执行多步工具调用时，需要判断当前进行到哪一步、是否卡住或走偏，并据此决定是否中断或纠正
    jobs_en:
    - Developers using Claude Code need to see which step a multi-step agent run has reached, whether
      it is stuck or off track, and decide whether to interrupt or correct it
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 的开发者在其代理连续执行多步工具调用时，打开聊天旁的本地实时地图，工具调用、模型步骤、钩子、技能和子代理会随执行逐一亮起，帮助判断当前进行到哪一步、是否卡住或走偏；最终交付是一张可视状态图，具体流程与人工确认环节仍待核验。
    inspiration: 趋势：代理执行链变长后，可观测性从日志走向实时可视化，成为开发者判断是否干预的入口。切入：从使用编码代理的团队切入，做执行过程的可视审计与中断决策层，而非再做一个代理；可考虑按团队席位或私有部署收费，价格未披露。
    summary_en: When a Claude Code agent runs a long chain of tool calls, developers open a local live
      map beside the chat; tool calls, model steps, hooks, skills and subagents light up as they happen,
      helping them judge which step is running and whether it is stuck or off track. The deliverable is
      a visual state map; the exact workflow and human confirmation steps still need verification.
    inspiration_en: 'Trend: as agent runs get longer, observability shifts from logs to live visualization
      as the point where developers decide to intervene. Entry: target teams using coding agents and build
      a visual audit and interrupt-decision layer rather than another agent; per-seat or private-deployment
      pricing is plausible but undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 的开发者在其代理连续执行多步工具调用时，需要判断当前进行到哪一步、是否卡住或走偏，并据此决定是否中断或纠正。
        job_en: Developers using Claude Code need to see which step a multi-step agent run has reached,
          whether it is stuck or off track, and decide whether to interrupt or correct it.
        pain_zh: 代理执行链变长后，开发者只能从滚动日志里拼凑进度，难以快速发现卡死或偏离任务，纠错滞后。
        pain_en: As agent runs lengthen, developers must piece progress together from scrolling logs,
          making it hard to spot a stall or drift quickly and delaying correction.
        current_alternative_zh: 阅读终端日志、翻看对话记录，或凭经验等待代理跑完再检查结果。
        current_alternative_en: Reading terminal logs, scrolling back through the conversation, or waiting
          for the agent to finish and checking the result afterward.
        usage_reason_zh: 相较翻日志，它把工具调用、步骤和子代理以实时点亮的图形呈现，减少拼凑进度这一步，让开发者在执行中更快决定是否中断；这是基于产品能力的推断，尚无用户反馈佐证。
        usage_reason_en: Compared with reading logs, it renders tool calls, steps and subagents as a live
          lit-up map, removing the step of piecing progress together so developers can decide sooner whether
          to interrupt; this is an inference from product capability, not yet backed by user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决代理长链执行中进度不可见、纠错滞后的问题，旧做法是翻日志；痛点具体，交付为可视状态图。
        evidence_ids:
        - ev-91eb21caca17eb14
        - ev-e37cd745b55d4ee2
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度证据，缺少用户评价或团队采用案例说明是否进入日常工作流。
        evidence_ids:
        - ev-e37cd745b55d4ee2
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或商业主体，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-91eb21caca17eb14
      - gate: truth
        status: insufficient
        reason: 可视化是否准确反映代理真实状态、能否确定性交付，缺少实测与文档核验。
        evidence_ids:
        - ev-91eb21caca17eb14
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者是否报告用它发现卡死或纠正代理的实际案例。
