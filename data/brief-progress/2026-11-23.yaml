  burp-sectivai:
    slug: burp-sectivai
    name: Sectiv
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 信息安全
    - 软件与互联网服务
    industries_en:
    - Information Security
    - Software & Internet Services
    jobs:
    - 渗透测试人员在 Burp Suite 中抓取目标流量后，按 IDOR、XSS、SQLi、SSRF 等目标让 AI 复核请求并生成含复现步骤、影响、PoC 与 CWE/CVE 的漏洞报告
    jobs_en:
    - Penetration testers who, after capturing target traffic in Burp Suite, have AI review requests against
      goals such as IDOR, XSS, SQLi or SSRF and produce vulnerability reports with reproduction steps,
      impact, PoC and CWE/CVE
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 渗透测试人员在 Burp Suite 里抓完目标流量后，选定 IDOR、XSS、SQLi、SSRF 等复核目标，插件让 AI 读取这些请求并输出带严重度、复现步骤、影响、PoC
      与 CWE/CVE 的漏洞面板，可导出 HTML/MD/JSON，最终报告仍需人工确认。具体误报率与人工复核流程仍待核验。
    inspiration: 趋势：安全测试的“看流量—写漏洞报告”环节开始被 AI 接走，插件形态让它嵌进既有工具而非另起平台。切入：从渗透测试团队或众测提交者的报告撰写环节进入，按报告份数或席位收费；但误报与责任边界是这类产品的生死线，需先证明
      AI 结论可被复核。
    summary_en: After a penetration tester captures target traffic in Burp Suite, the plugin has AI read
      those requests against chosen review goals such as IDOR, XSS, SQLi or SSRF, and returns a severity
      dashboard with reproduction steps, impact, PoC and CWE/CVE, exportable to HTML/MD/JSON; the final
      report still needs human confirmation. Actual false-positive rate and human review flow remain unverified.
    inspiration_en: 'Trend: the ''read traffic, write the vulnerability report'' step of security testing
      is being handed to AI, and the plugin form embeds it in existing tools rather than a new platform.
      Entry: start from the report-writing step of pentest teams or bug-bounty submitters, charging per
      report or per seat; false positives and liability are the make-or-break, so AI conclusions must
      first prove reviewable.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 渗透测试人员在 Burp Suite 中抓取目标流量后，按 IDOR、XSS、SQLi、SSRF 等目标让 AI 复核请求，并整理成含复现步骤、影响、PoC 与 CWE/CVE
          的漏洞报告。
        job_en: After capturing target traffic in Burp Suite, penetration testers have AI review requests
          against goals like IDOR, XSS, SQLi or SSRF and compile vulnerability reports with reproduction
          steps, impact, PoC and CWE/CVE.
        pain_zh: 手工逐条看请求、判断漏洞类型、写复现步骤和影响描述耗时且易漏；报告质量直接决定客户或众测平台是否认可。
        pain_en: Manually reading each request, classifying the vulnerability and writing reproduction
          steps and impact is slow and error-prone; report quality directly determines whether clients
          or bounty platforms accept it.
        current_alternative_zh: 测试人员靠 Burp 自带扫描器加人工逐条分析，再用文档模板手写报告。
        current_alternative_en: Testers rely on Burp's built-in scanner plus manual request-by-request
          analysis, then hand-write reports from document templates.
        usage_reason_zh: 推断：插件把已抓取的流量直接送入 AI 复核并一次产出结构化报告字段，省去从零起草复现步骤与影响描述这一步；但误报仍需人工确认，因此适合需要快速出初稿的渗透测试或众测提交者。
        usage_reason_en: 'Inference: the plugin feeds captured traffic straight into AI review and outputs
          structured report fields in one pass, removing the step of drafting reproduction steps and impact
          from scratch; false positives still need human confirmation, so it suits pentesters or bounty
          submitters needing a fast first draft.'
      gates:
      - gate: value
        status: supported
        reason: 它解决渗透测试后写漏洞报告耗时易漏的需求，痛点在报告交付环节刚性；具体误报率未核验。
        evidence_ids:
        - ev-f8ff125e3c82e952
        - ev-7c752c52440dbcfe
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 113 缓慢增至 117，属关注度而非持续采用证据，缺少用户反馈或案例。
        evidence_ids:
        - ev-f8ff125e3c82e952
        - ev-7c752c52440dbcfe
      - gate: model
        status: insufficient
        reason: 开源插件未见定价或付费路径，买方可能是安全团队或众测个人，属判断非已验证事实。
        evidence_ids:
        - ev-7c752c52440dbcfe
      - gate: truth
        status: insufficient
        reason: AI 漏洞结论的误报与责任边界未披露，人工复核流程与交付确定性仍缺证据。
        evidence_ids:
        - ev-f8ff125e3c82e952
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对误报率、人工复核流程和报告可用性的实际反馈。
    event_summary_zh: 2026 年 11 月，开源项目 Sectiv 以 Burp Suite 插件形式发布，让 AI 按 IDOR、XSS、SQLi、SSRF 等目标复核抓取流量并生成含
      PoC 与 CWE/CVE 的漏洞报告，仓库星标约 117。
    event_summary_en: In November 2026, the open-source project Sectiv was released as a Burp Suite plugin
      that has AI review captured traffic against goals such as IDOR, XSS, SQLi and SSRF and generate
      vulnerability reports with PoC and CWE/CVE; the repository has about 117 stars.
  bytx-skills:
    slug: bytx-skills
    name: bytx-skills
    decision: watching
    category: AI + 商业
    project_type: open_source
    industries:
    - 加密货币交易
    - 金融服务
    industries_en:
    - crypto trading
    - financial services
    jobs:
    - 加密交易者在配置或测试自动交易策略时，把行情与下单指令交给 AI 助手，通过 MCP 服务或命令行在模拟盘执行并核对成交结果
    jobs_en:
    - Crypto traders configuring or testing automated trading strategies hand market data and order instructions
      to an AI assistant, executing on paper trading via an MCP server or CLI and checking fills
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 加密交易者想让 AI 助手代为查询行情、生成并执行下单指令时，可接入这套 MCP 服务、命令行工具与 Claude 技能；默认在模拟盘运行，真实下单需用户明确同意。用户最终拿到的是模拟成交与操作记录，真实资金动作仍由人确认。具体风控与交付流程仍待核验。
    inspiration: 趋势：交易类操作正被拆成可被 AI 助手调用的技能，默认模拟盘、需人工放行，说明“AI 代操作资金”的信任边界正在被工程化。切入：可从加密散户或量化小团队的策略回测与模拟盘环节进入，卖的是可审计的模拟执行与风控记录，而非直接代客下单。
    summary_en: When crypto traders want an AI assistant to look up market data and generate or place
      orders, they can plug in this MCP server, CLI and Claude skills; it runs on paper trading by default
      and requires explicit user approval for real orders. Users get simulated fills and an action log,
      while real money moves stay human-confirmed. Risk controls and delivery flow still need verification.
    inspiration_en: 'Trend: trading actions are being packaged as skills an AI assistant can call, with
      paper-by-default and human approval, showing the trust boundary for AI-driven money actions is being
      engineered. Entry: start from the backtest and paper-trading step for retail crypto traders or small
      quant teams, selling auditable simulated execution and risk logs rather than direct order placement.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 加密交易者在测试自动交易策略时，把行情查询与下单指令交给 AI 助手，在模拟盘执行并核对成交与操作记录。
        job_en: Crypto traders testing automated strategies hand market lookups and order instructions
          to an AI assistant, execute on paper trading and check fills and action logs.
        pain_zh: 手动在交易所界面反复查价、下单、记录，步骤碎且易错；直接让 AI 碰真钱又缺乏安全边界。
        pain_en: Manually checking prices, placing orders and logging them across exchange UIs is fragmented
          and error-prone; letting AI touch real money lacks a safety boundary.
        current_alternative_zh: 交易者自己盯盘手动下单，或用交易所自带的条件单与脚本，缺少 AI 可调用且默认模拟的执行层。
        current_alternative_en: Traders watch charts and place orders manually, or use exchange-native
          conditional orders and scripts, lacking an AI-callable execution layer that defaults to simulation.
        usage_reason_zh: 推断：相较手动下单，它把查价、生成指令、模拟执行串成一次 AI 调用，并默认模拟盘、真实下单需用户同意，减少了在多个界面间切换和误操作真金白银的风险，因此测试策略的加密交易者会先试用。
        usage_reason_en: 'Inference: versus manual ordering, it chains price lookup, instruction generation
          and simulated execution into one AI call, defaulting to paper trading with user approval for
          real orders, cutting UI switching and the risk of misusing real funds, so crypto traders testing
          strategies would try it first.'
      gates:
      - gate: value
        status: supported
        reason: 它解决交易者测试策略时查价、下单、记录分散且怕误动真钱的问题，默认模拟盘降低风险，痛点具体。
        evidence_ids:
        - ev-fe10ef7b8ea85151
        - ev-0bfaf9fd2211ae9f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标约 90，属关注度，未见用户评价或采用案例，无法判断是否形成使用共识。
        evidence_ids:
        - ev-0bfaf9fd2211ae9f
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是交易者或交易所，属判断而非已验证事实。
        evidence_ids:
        - ev-fe10ef7b8ea85151
      - gate: truth
        status: insufficient
        reason: 默认模拟盘与人工放行是好的安全设计，但真实风控、成交确定性与合规边界未见材料，需核验。
        evidence_ids:
        - ev-4d2f8ca8521f07fd
      next_validation: 收集该仓库的 issue、discussion 或官方文档，核验模拟盘执行、真实下单审批与风控的具体机制。
