  artificialanalysis:
    slug: artificialanalysis
    name: Artificial Analysis
    decision: queued
    event_summary_zh: 2026年10月28日，Artificial Analysis 发布 Intelligence Index v5，随后在10月29日将 Gemini 4 Carbon
      列为该指数第一，11月9日又将 Claude Fable 5.2 以 65 分列为最高分；同期独立评论指出，独立模型评测的难点在于设计有意义的基准，而非推高分数。
    event_summary_en: 'On 28 October 2026 Artificial Analysis released Intelligence Index v5, then ranked
      Gemini 4 Carbon as its new #1 on 29 October and Claude Fable 5.2 as the highest scorer at 65 on
      9 November; an independent commentary in the same period argued that the hard part of independent
      model evaluation is designing meaningful benchmarks rather than pushing scores up.'
    category: 基础层
    project_type: new_application
    industries:
    - 模型与 AI 基础设施
    - 企业软件与 IT 服务
    industries_en:
    - Models and AI Infrastructure
    - Enterprise Software and IT Services
    jobs:
    - 模型选型负责人或采购方在评估多个候选模型时，把自有业务用例的输入交给平台生成定制基准，拿到可对比的评分与排名，再据此决定采用哪个模型
    - AI 产品团队在上线前需要向内部或客户说明模型选择依据时，用定制基准产出可引用的评测结果，并自行复核结论
    jobs_en:
    - A model selection lead or buyer evaluating several candidate models submits their own business use-case
      inputs to generate a custom benchmark and receives comparable scores and rankings to decide which
      model to adopt
    - An AI product team needing to justify model choices internally or to clients before launch uses
      custom benchmarks to produce citable evaluation results and reviews the conclusions itself
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 模型选型负责人或采购方在比较多个候选模型时，打开 Artificial Analysis，把自有业务用例的输入交给它生成定制基准，平台执行评测并给出可对比的评分与排名；用户拿到的是用于选型决策的评测结果，最终采用哪个模型仍由人确认。具体定制流程与交付形式仍待核验。
    inspiration: 趋势：模型数量与迭代速度让“选哪个模型”从一次性调研变成持续决策，第三方评测正从榜单变成可定制的选型工具。切入：从有明确合规或成本约束的行业买方入手，例如金融、医疗的企业
      AI 团队，卖按次或按项目的定制评测报告，而不是卖通用榜单订阅；价格未披露，不预设。
    summary_en: A model selection lead or buyer comparing candidate models opens Artificial Analysis,
      submits their own business use-case inputs to generate a custom benchmark, and the platform runs
      the evaluation and returns comparable scores and rankings; the user gets evaluation results for
      a selection decision, while the final model choice stays with a human. The exact customisation workflow
      and deliverable format still need verification.
    inspiration_en: 'Trend: the growing number and rapid iteration of models turn ''which model to pick''
      from a one-off study into a recurring decision, so third-party evaluation is shifting from a leaderboard
      into a customisable selection tool. Entry: start with industry buyers facing clear compliance or
      cost constraints, such as enterprise AI teams in finance and healthcare, and sell per-run or per-project
      custom evaluation reports rather than a generic leaderboard subscription; pricing is undisclosed
      and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 模型选型负责人或采购方在评估多个候选模型时，把自有业务用例的输入交给平台生成定制基准，拿到可对比的评分与排名，据此决定采用哪个模型。
        job_en: A model selection lead or buyer evaluating several candidate models submits their own
          business use-case inputs to generate a custom benchmark and receives comparable scores and rankings
          to decide which model to adopt.
        pain_zh: 公开榜单只反映通用任务，无法回答自有业务场景下哪个模型更合适；自行搭评测要投入工程与标注成本，且结论难以对外引用。
        pain_en: Public leaderboards reflect generic tasks and cannot answer which model fits a specific
          business scenario; building an in-house evaluation costs engineering and labelling effort, and
          the results are hard to cite externally.
        current_alternative_zh: 依赖公开榜单排名、厂商自报数据，或由内部团队手工搭脚本跑少量样例。
        current_alternative_en: Relying on public leaderboard rankings and vendor-reported numbers, or
          having an internal team hand-build scripts to run a few samples.
        usage_reason_zh: 相较只看公开榜单或手工跑样例，平台把定制基准的生成与执行收进同一流程，减少搭建评测脚本和整理对比结果这两步负担，使选型方能在自有用例上得到可对比的评分；这是基于产品能力的推断，尚无客户案例证实其被长期留在选型流程中。
        usage_reason_en: Compared with reading public leaderboards or hand-running samples, the platform
          folds benchmark generation and execution into one flow, removing the steps of building evaluation
          scripts and consolidating comparison results so buyers get comparable scores on their own use
          cases; this is an inference from product capability, with no customer case yet showing it is
          kept in the selection workflow long term.
      gates:
      - gate: value
        status: supported
        reason: 它解决的是模型选型时“公开榜单不覆盖自有场景”的需求，痛点是评测成本高且结论难引用；买方与付费路径尚不清晰。
        evidence_ids:
        - ev-f21ad2839c01ec8f
        - ev-08610498cc06a990
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度集中在榜单发布与模型排名，未见选型方对定制基准的采用反馈或客户案例。
        evidence_ids:
        - ev-747d4fca34723fa0
        - ev-eea56632755da0e1
      - gate: model
        status: insufficient
        reason: 公开材料未披露定制基准的定价、按次或订阅的收费方式，也未说明买方是模型厂商还是企业客户；这是判断，不是已验证事实。
        evidence_ids:
        - ev-f21ad2839c01ec8f
      - gate: truth
        status: insufficient
        reason: 评测结论的可复现性与人工复核边界未见公开说明，独立评论也指出设计有意义基准本身很难，交付确定性待核验。
        evidence_ids:
        - ev-08610498cc06a990
      next_validation: 收集 Artificial Analysis 官方关于定制基准（Optima）的定价页或部署说明，确认收费方式与交付形式。
  auto-ontology-mcp:
    slug: auto-ontology-mcp
    name: auto-ontology-mcp
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 开发者把个人知识库接入 Claude、ChatGPT 等 MCP 客户端，让助手在回答时检索自己的语义层与笔记
    - 开发者在搭建助手上下文时，把分散的笔记与本体语义整理成可被客户端调用的检索层
    jobs_en:
    - Developers connect a personal knowledge base to MCP clients such as Claude and ChatGPT so the assistant
      retrieves from their own semantic layer and notes
    - Developers assembling assistant context turn scattered notes and ontology semantics into a retrievable
      layer callable by clients
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在给 Claude、ChatGPT 等 MCP 客户端配置上下文时，打开这个开源服务，把 NVIDIA Auto Ontology 的语义层和个人知识库接入，让助手在回答时检索这些内容；用户拿到的是可被客户端调用的知识检索接口，无需自备
      LLM API key。具体检索质量、部署步骤与交付边界仍待核验。
    inspiration: 趋势：个人知识库正从独立笔记应用变成助手可直接调用的检索层，谁掌握结构化语义谁就掌握上下文入口。切入：面向已有大量笔记但检索混乱的个人研究者或小团队，做“把旧笔记整理成可被助手稳定调用的语义层”的整理与托管服务，按整理量或托管收费；目前公开材料只显示仓库关注度，未披露定价与客户。
    summary_en: When configuring context for MCP clients such as Claude and ChatGPT, developers run this
      open-source server to plug in NVIDIA Auto Ontology's semantic layer and a personal knowledge base,
      letting the assistant retrieve from them; the deliverable is a knowledge-retrieval interface callable
      by clients without a separate LLM API key. Retrieval quality, deployment steps and delivery boundaries
      still need verification.
    inspiration_en: 'Trend: personal knowledge bases are shifting from standalone note apps into retrieval
      layers that assistants call directly, so whoever owns structured semantics owns the context entry
      point. Entry: for individual researchers or small teams with large but messy note collections, offer
      a service that turns old notes into a semantic layer assistants can reliably call, priced by volume
      organized or by hosting; public material so far shows only repository attention, with no disclosed
      pricing or customers.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或研究者把分散的个人笔记和本体语义接入 Claude、ChatGPT 等 MCP 客户端，让助手在回答时检索自己的资料，而不是只靠通用训练知识。
        job_en: Developers or researchers connect scattered personal notes and ontology semantics to MCP
          clients such as Claude and ChatGPT so the assistant retrieves their own material instead of
          relying only on general training knowledge.
        pain_zh: 个人知识散落在多个笔记工具里，助手无法直接读取；每次对话都要手动粘贴或重新整理上下文，重复且易漏。
        pain_en: Personal knowledge is scattered across note tools the assistant cannot read directly;
          each conversation requires manual pasting or re-assembling context, which is repetitive and
          error-prone.
        current_alternative_zh: 手动复制粘贴笔记进对话、用通用检索插件，或自己写脚本对接向量库。
        current_alternative_en: Manually copying notes into chats, using generic retrieval plugins, or
          writing custom scripts against a vector store.
        usage_reason_zh: 推断：它把语义层与知识库封装成 MCP 服务，客户端一次配置即可在回答时自动检索，省去每次手动粘贴和自建检索管道这一步；需要频繁让助手引用自有资料的用户会因此选择它。公开材料未提供检索准确率或留存数据。
        usage_reason_en: 'Inference: it packages the semantic layer and knowledge base as an MCP server,
          so one client configuration enables automatic retrieval during answers, removing the per-conversation
          pasting and self-built retrieval pipeline; users who often need the assistant to cite their
          own material would choose it for that. Public material provides no retrieval-accuracy or retention
          data.'
      gates:
      - gate: value
        status: supported
        reason: 它解决助手读不到个人知识、每次对话需手动粘贴上下文的问题，痛点具体且重复发生；但检索效果与部署成本未公开。
        evidence_ids:
        - ev-59a3c01e1dab8fe1
        - ev-c13c555e7efb2908
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度缓慢上升，缺少用户评价、issue 讨论或采用案例，无法判断是否形成稳定使用共识。
        evidence_ids:
        - ev-9730a8e1d1534c00
        - ev-c13c555e7efb2908
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价、托管服务或商业路径，买方与付费方式均不明确，这是判断而非已验证事实。
        evidence_ids:
        - ev-59a3c01e1dab8fe1
      - gate: truth
        status: insufficient
        reason: 检索准确率、部署门槛与人工确认边界均无公开材料，无法核对交付是否确定性发生。
        evidence_ids:
        - ev-2568af1bdcf47fd8
      next_validation: 收集该仓库的 issue 与 discussion，查看用户实际部署反馈与检索效果报告。
