  typefree:
    slug: typefree
    name: TypeFree
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries:
    - 移动输入法
    - 无障碍辅助
    industries_en:
    - mobile input methods
    - accessibility assistance
    jobs:
    - Android 用户在移动中或不方便打字时，用语音说出内容并借助码表/拼音键盘校正，完成消息或文档输入
    jobs_en:
    - Android users who are on the move or cannot easily type dictate content by voice and correct it
      with Rime table or pinyin keyboard to finish messages or documents
    regions: []
    regions_en: []
    open_source: true
    summary_zh: TypeFree 是 Android 原生输入法，把语音输入与 librime 码表/拼音全键盘放在同一键盘里，并提供全局悬浮胶囊；用户说话后由自带密钥的模型转成文字，再用码表或拼音修正后输入到目标应用。识别质量与中文场景表现仍待核验。
    inspiration: 趋势：语音输入与自定义码表输入法合流，用户自带模型密钥降低对单一厂商的依赖。切入：可从需要专业词表（如医学术语、行业缩写）的 Android 用户或无障碍人群进入，卖定制词表与离线可用性；定价未披露。
    summary_en: TypeFree is a native Android keyboard that combines voice input with a librime table/pinyin
      full keyboard and a global floating capsule; users speak, a bring-your-own-key model turns it into
      text, and they correct it with the table or pinyin before inserting into the target app. Recognition
      quality and Chinese-language performance still need verification.
    inspiration_en: 'Trend: voice input is merging with custom-table keyboards, and bring-your-own-key
      models reduce dependence on a single vendor. Entry: start with Android users who need specialized
      vocabularies (medical terms, industry abbreviations) or accessibility users, selling custom dictionaries
      and offline usability; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: Android 用户在走路、开车后或不便打字时，需要把口述内容转成文字，并用码表或拼音键盘修正后输入到聊天或文档应用。
        job_en: Android users who are walking, just after driving, or otherwise unable to type need to
          turn speech into text and correct it with a table or pinyin keyboard before inserting into chat
          or document apps.
        pain_zh: 系统语音输入对专业词和生僻字识别差，且与自定义码表输入法割裂，用户要在两个输入法之间切换并重复修改。
        pain_en: System voice input handles specialized terms and rare characters poorly and is split
          from custom-table keyboards, forcing users to switch between two input methods and re-edit.
        current_alternative_zh: 旧做法是用系统自带语音输入或第三方语音转写，再切回码表/拼音输入法手工改错。
        current_alternative_en: The old way is using the built-in voice input or a third-party transcriber,
          then switching back to a table/pinyin keyboard to fix errors by hand.
        usage_reason_zh: 推断：TypeFree 把语音转写与码表/拼音修正放在同一键盘内，省去切换输入法和二次粘贴这一步，因此需要专业词表或不便打字的 Android 用户会尝试它；尚无留存或付费证据。
        usage_reason_en: 'Inference: TypeFree puts voice transcription and table/pinyin correction in
          one keyboard, removing the step of switching input methods and pasting twice, so Android users
          needing specialized vocabularies or unable to type would try it; no retention or payment evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决语音输入与自定义码表割裂、专业词识别差导致反复切换改错的痛点，旧替代是两套输入法来回切。
        evidence_ids:
        - ev-9638c18730d4cb50
        - ev-07b359b27708f316
      - gate: consensus
        status: insufficient
        reason: 仓库星标缓慢增长，但未见用户评价或问题讨论说明真实使用场景，强场景是否成立不明。
        evidence_ids:
        - ev-9638c18730d4cb50
      - gate: model
        status: insufficient
        reason: 开源项目，未见付费或赞助路径；自带密钥意味着模型成本由用户承担，商业模式是判断不是已验证事实。
        evidence_ids:
        - ev-2fd4f06704fe0554
      - gate: truth
        status: insufficient
        reason: 语音识别准确率、中文与专业词表现、悬浮胶囊在第三方应用中的稳定性均无公开实测。
        evidence_ids:
        - ev-07b359b27708f316
      next_validation: 收集 TypeFree 仓库的 issue 与讨论，确认用户对语音识别准确率和码表修正流程的实际反馈。
  whiteboard-ai-tutor:
    slug: whiteboard-ai-tutor
    name: whiteboard-ai-tutor
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 教育
    - 在线学习
    industries_en:
    - Education
    - Online Learning
    jobs:
    - 教师或自学者在准备讲解材料时，把知识点交给系统生成逐笔绘制的白板动画课程，用于课堂或自学播放
    - 模型评测者在比较不同大模型的教学输出时，用同一批题目生成白板课程并做盲评
    jobs_en:
    - Teachers or self-learners preparing explanation material feed a topic to the system to generate
      stroke-by-stroke whiteboard animated lessons for class or self-study
    - Model evaluators comparing LLM teaching output generate whiteboard lessons on the same prompts and
      blind-review them
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 教师或自学者在准备讲解材料时，把知识点交给它，系统生成逐笔绘制的白板动画课程并可交互播放；项目还用同一批题目对 Claude、Gemini、DeepSeek 生成 288
      次课程、64 块白板做盲评对比。具体课程质量与人工校对环节仍待核验。
    inspiration: 趋势：把大模型输出变成可播放的教学过程，而不只是文字答案，说明教育内容正从“问答”走向“可演示的讲解”。切入：可从需要标准化讲解的学科培训或企业内训入手，卖按课程或按知识点生成的交付，而非卖工具席位；模型对比数据本身也可做成选型服务。
    summary_en: When teachers or self-learners prepare explanation material, they give a topic to this
      tool, which generates stroke-by-stroke whiteboard animated lessons with interactive playback; the
      project also ran 288 lesson generations and 64 blind-reviewed boards across Claude, Gemini and DeepSeek.
      Lesson quality and the human review step still need verification.
    inspiration_en: 'Trend: turning LLM output into a playable teaching process rather than a text answer
      shows educational content moving from Q&A to demonstrable explanation. Entry: target subject tutoring
      or corporate training that needs standardized explanations, selling per-course or per-topic generated
      deliverables rather than tool seats; the model comparison data itself could become a selection service.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 教师或自学者在准备一节课的讲解材料时，把知识点交给系统，得到可逐笔播放的白板动画课程，用于课堂演示或自学。
        job_en: A teacher or self-learner preparing a lesson hands a topic to the system and gets a stroke-by-stroke
          playable whiteboard animated lesson for classroom demo or self-study.
        pain_zh: 手绘白板讲解或做动画课件耗时，且要反复调整讲解顺序；纯文字答案难以展示推导过程。
        pain_en: Hand-drawing whiteboard explanations or building animated courseware is time-consuming
          and requires repeated reordering; plain text answers poorly show the derivation process.
        current_alternative_zh: 教师自己手绘白板、用 PPT 或录屏软件逐页制作，或直接口述讲解。
        current_alternative_en: Teachers draw on a whiteboard themselves, build slides page by page in
          PPT or screen-recording tools, or just explain verbally.
        usage_reason_zh: 推断：相较手工绘制或做 PPT，它把知识点直接转成逐笔动画并支持交互播放，省去逐帧制作这一步，因此需要快速产出可演示讲解的教师或自学者会在备课时选择它；尚无留存或付费证据。
        usage_reason_en: 'Inference: versus hand-drawing or building slides, it converts a topic directly
          into stroke-by-stroke animation with interactive playback, removing the frame-by-frame production
          step, so teachers or self-learners needing quick demonstrable explanations would pick it when
          preparing lessons; no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决备课与讲解中手绘或做动画课件耗时、推导过程难展示的痛点，交付是可播放的白板课程，结构上成立。
        evidence_ids:
        - ev-8c4d1f2b30cdf627
        - ev-2b0d2911dd722834
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数增长，属关注度信号，缺少教师实际采用或课堂使用的公开证据。
        evidence_ids:
        - ev-2b0d2911dd722834
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，买方可能是学校、培训机构或自学者，属判断而非已验证事实。
        evidence_ids:
        - ev-8c4d1f2b30cdf627
      - gate: truth
        status: insufficient
        reason: 课程质量与人工校对边界未公开，288 次生成与 64 块盲评是评测设计，不等于教学效果验证。
        evidence_ids:
        - ev-8c4d1f2b30cdf627
      next_validation: 收集该项目仓库的 issue/discussion 或官方页面，确认是否有教师实际用于课堂的案例或课程质量反馈。
