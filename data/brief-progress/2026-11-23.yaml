    open_source: true
    summary_zh: 视频制作者在需要产出带配音的短视频时打开这个开源工作台，把脚本与素材交给它，由它用 HTML/GSAP 或 Remotion 生成动画画面，并做自定义语音包与 AI 配音匹配，最终拿到可导出的视频成片；具体导出格式、人工确认环节与配音质量仍待核验。
    inspiration: 趋势：短视频批量生产正从剪辑软件手工拼接转向“脚本进、成片出”的代码化渲染管线。切入：面向电商详情页视频、投放素材这类高频改版场景，卖按条交付的成片而非工具席位；开源仓库尚无定价与客户案例，先看是否有团队把它接进真实投放流程。
    summary_en: When creators need short videos with voiceover, they open this open-source workbench,
      hand over scripts and assets, and it renders animated scenes via HTML/GSAP or Remotion while matching
      custom voice packs with AI voiceover, delivering an exportable video; export formats, human review
      steps and voice quality still need verification.
    inspiration_en: 'Trend: batch short-video production is shifting from manual timeline editing to a
      code-driven pipeline where a script goes in and a finished video comes out. Entry: target high-frequency
      revision work such as e-commerce detail videos and ad creatives, selling finished videos per piece
      rather than tool seats; the repository shows no pricing or customer cases yet, so first check whether
      any team has wired it into a real ad delivery workflow.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 视频制作者在需要批量产出带配音的短视频时，把脚本和素材交给工作台，由它生成 HTML/GSAP 或 Remotion 动画并匹配配音，最终拿到可导出的视频成片。
        job_en: Video creators producing short videos with voiceover in batches hand scripts and assets
          to the workbench, which generates HTML/GSAP or Remotion animations and matches voices, delivering
          an exportable video.
        pain_zh: 短视频需要反复改版和批量出片，手工在剪辑软件里逐条拼接动画、对齐配音耗时且难以复用；这是从功能说明推断的痛点，尚无用户反馈佐证。
        pain_en: Short videos need frequent revisions and batch output; manually assembling animations
          and syncing voiceover in editing software is slow and hard to reuse. This pain is inferred from
          the feature description, with no user feedback yet.
        current_alternative_zh: 用 Premiere、剪映等剪辑软件手工拼接，或分别用动画工具和配音工具再合成，改一版就要重做一遍。
