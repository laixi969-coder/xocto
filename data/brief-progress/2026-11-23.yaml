    inspiration: 趋势：解说短片的生产正从剪辑软件转向由编码代理直接生成运镜与时间轴。切入：面向做地理、历史、房产讲解的短视频团队，按成片或按项目交付，而不是卖通用剪辑工具；先解决素材到成片的最后一公里校对。
    summary_en: When creators need a narrated short film from photos, maps and cards, they invoke this
      skill inside coding agents such as Claude Code, Codex or Cursor, which generates film code with
      one continuous camera move timed to the voiceover. The output is a renderable film project; final
