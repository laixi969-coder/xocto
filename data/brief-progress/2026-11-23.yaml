    - 前端开发者或独立产品作者在让编码代理生成界面时，需要把代理产出的通用样式改成可用且风格独特的界面
    jobs_en:
    - Front-end developers or solo product builders using a coding agent to generate UI need to turn generic
      agent output into usable, distinctive interfaces
    - Front-end developers or solo product builders using a coding agent to generate UI need to turn generic
      agent output into usable, distinctive interfaces
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 前端开发者或独立产品作者在用编码代理生成界面时，打开这个面向编码代理的 UI/UX 技能，让代理按它给出的界面规范产出更可用、更有辨识度的页面，最终拿到可继续修改的界面代码；具体输入形式与交付边界仍待核验。
    inspiration: 趋势：编码代理已能写页面，但产出常是同质化模板，界面品味正成为代理工作流里可单独交付的一层。切入：面向独立开发者和小型产品团队，把行业界面规范做成可复用的代理配置或按项目交付的界面评审，而不是再做一个通用生成器。
    summary_en: When front-end developers or solo builders use a coding agent to generate UI, they load
      this UI/UX skill aimed at coding agents so the agent produces more usable, more distinctive pages,
      ending with interface code they can keep editing; the exact input format and delivery boundary still
      need verification.
    inspiration_en: 'Trend: coding agents can already write pages, but output tends toward generic templates,
      so interface taste is becoming a separately deliverable layer in agent workflows. Entry: serve indie
      developers and small product teams by packaging industry UI conventions as reusable agent configuration
      or per-project interface review, rather than another general generator.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 前端开发者或独立产品作者让编码代理生成页面时，需要把代理默认产出的通用界面改成可用、有辨识度的界面，并继续在代码里迭代。
        job_en: When front-end developers or solo builders have a coding agent generate pages, they need
          to turn the agent's default generic interface into a usable, distinctive one and keep iterating
          in code.
        pain_zh: 编码代理生成的界面往往样式雷同、可用性差，开发者要逐项手工调整布局、层级与视觉细节，返工多。
        pain_en: Interfaces produced by coding agents tend to look alike and have weak usability, forcing
          developers to hand-fix layout, hierarchy and visual detail with much rework.
        current_alternative_zh: 开发者自己写样式规范、套用现成组件库或设计模板，或事后请设计师返工。
        current_alternative_en: Developers write their own style rules, reuse existing component libraries
          or design templates, or have a designer rework the result afterward.
        usage_reason_zh: 推断：它把界面规范直接交给编码代理，在生成阶段就约束布局与视觉选择，减少事后逐项改样式这一步；在意界面质量又缺少设计师的独立开发者会因此选用它。
        usage_reason_en: 'Inference: it hands interface conventions directly to the coding agent, constraining
          layout and visual choices at generation time and cutting the later step of fixing styles item
          by item; indie developers who care about interface quality but lack a designer would pick it
          for that reason.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理产出界面同质、可用性差的问题，痛点具体，交付物是可继续修改的界面代码；但公开材料只到技能说明，实际效果未核验。
        evidence_ids:
        - ev-be8aff6116a39965
      - gate: consensus
        status: insufficient
        reason: 仓库星数从238缓慢升至262，属关注度而非采用证据，没有用户反馈或案例说明开发者把它留在工作流里。
        evidence_ids:
        - ev-7a841c2d3bea94a9
        - ev-be8aff6116a39965
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径；钱可能来自开发者订阅或团队定制，这是判断不是已验证事实。
        evidence_ids:
        - ev-be8aff6116a39965
      - gate: truth
        status: insufficient
        reason: 界面质量是否真比代理默认产出更好、是否贴近可用性第一性目标，缺少可复现实测与人工确认边界的说明。
        evidence_ids:
        - ev-be8aff6116a39965
      next_validation: 收集该仓库的 issue、discussion 或使用示例，核验开发者实际用它生成界面后的反馈与效果对比。
