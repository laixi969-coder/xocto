      pages and features in natural language, and the product generates runnable front-end and back-end
      code; users get a deployable prototype and review changes themselves. The exact workflow and delivery
      boundary still need verification.
    inspiration_en: 'Trend: natural-language app generation is moving from demos to funding and team expansion,
      suggesting the ''can''t code but need a product'' audience is treated as a real buyer. Entry: avoid
      a generic generator; start from vertical templates, e.g. listing sites for real-estate agents or
      booking and document intake for law firms, charging for launch delivery rather than seats.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 非技术创业者或小团队负责人在需要上线一个网页应用时，用自然语言描述需求，让产品生成可运行的前端与后端代码，并自行确认和修改结果。
        job_en: Non-technical founders or small teams who need to launch a web app describe requirements
          in natural language, have the product generate runnable front-end and back-end code, and review
          and revise the output themselves.
        pain_zh: 不会写代码的人要做产品，过去要么雇开发者、外包，要么用建站工具拼装，周期长、沟通成本高，改一版要等一轮。
        pain_en: People who cannot code but want to build a product previously had to hire developers,
          outsource, or assemble site builders, which is slow, communication-heavy, and each revision
          waits a cycle.
        current_alternative_zh: 雇自由开发者或外包团队、用无代码建站工具、或让技术合伙人代做。
        current_alternative_en: Hiring freelance developers or outsourcing teams, using no-code site builders,
          or having a technical co-founder build it.
        usage_reason_zh: 推断：相较外包与无代码拼装，它把“描述需求—生成可运行代码—就地修改”压进同一界面，减少把需求翻译给开发者再等交付的环节，因此需要快速验证想法的非技术创业者会在原型阶段选择它。
        usage_reason_en: 'Inference: compared with outsourcing and no-code assembly, it compresses ''describe—generate
          runnable code—revise in place'' into one interface, removing the step of translating requirements
          to a developer and waiting, so non-technical founders validating ideas would pick it at the
          prototype stage.'
      gates:
      - gate: value
        status: supported
        reason: 它解决不会写代码的人要做可运行应用的需求，痛点是外包周期长、沟通成本高，旧替代行为明确。
        evidence_ids:
        - ev-03f61e3d1904e2fb
      - gate: consensus
        status: insufficient
        reason: 有融资与榜单关注，但缺少公开的用户持续使用或复购证据，关注度不等于采用。
        evidence_ids:
        - ev-03f61e3d1904e2fb
        - ev-497b4ccd88cf22ad
      - gate: model
        status: insufficient
        reason: 买方可能是个人开发者与中小企业，但公开材料未给出定价与付费结构，属判断而非已验证事实。
        evidence_ids:
        - ev-03f61e3d1904e2fb
      - gate: truth
        status: insufficient
        reason: 生成代码能否确定性交付可上线产品、人工复核边界如何，公开材料未说明。
        evidence_ids:
        - ev-671f22b463fc2be4
      next_validation: 收集 Lovable 官方定价页与公开客户案例，核验其按什么计价、交付结果与人工复核边界。
