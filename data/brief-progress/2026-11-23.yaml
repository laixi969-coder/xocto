    summary_zh: 网站运营者或SEO顾问在需要排查站点技术问题、规划搜索优化时，在Claude内调用该技能，由它分析目标网站、评估搜索信号，输出按优先级排序的整改路线图；具体抓取范围、数据来源与人工复核环节仍待核验。
