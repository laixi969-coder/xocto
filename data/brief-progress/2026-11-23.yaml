        status: insufficient
        reason: 仅有仓库星标缓慢增长，没有用户评价或使用反馈说明学习者是否真的按课程走完。
        evidence_ids:
        - ev-03efbdac975596b8
        - ev-36e598ee0fc4ff37
      - gate: model
        status: insufficient
        reason: 未披露定价或付费路径，开源项目可能靠捐赠或自托管，买方与收费方式尚不明确，这是判断不是事实。
        evidence_ids:
        - ev-36e598ee0fc4ff37
      - gate: truth
        status: insufficient
        reason: 批改由使用者自己的模型完成，评分是否可靠、课程是否贴近考纲无法从现有材料核对。
        evidence_ids:
