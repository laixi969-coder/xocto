  flashprove:
    slug: flashprove
    name: FlashProve
    decision: watching
    event_summary_zh: 2026年10月30日，Anthropic 在代码托管平台公开 FlashProve 研究原型，用于对 AI 推理结果生成零知识证明；仓库自述为不再维护，公开星标从约974缓慢增至1077，未见发布、客户或定价信息。
    event_summary_en: On 30 October 2026, Anthropic published FlashProve, a research prototype for zero-knowledge
      proofs of AI inference, on a code-hosting platform; the repository describes itself as unmaintained,
      public stars drifted from about 974 to 1,077, and no release, customer or pricing information appeared.
    category: 基础层
    project_type: open_source
    industries:
    - 金融与保险
    - 医疗健康
    - 云计算与合规审计
    industries_en:
    - Financial services and insurance
    - Healthcare
    - Cloud computing and compliance auditing
    jobs:
    - 合规与风控人员在需要向外部审计方证明某次 AI 推理确实由指定模型按约定输入产生时，处理推理日志与模型版本记录，要交付可被第三方独立核验的证明
    - 审计与合规人员向监管或客户证明某次 AI 推理未被篡改时，整理推理日志和模型版本，产出可独立核验的证明
    jobs_en:
    - Compliance and risk staff who must show an external auditor that a given AI inference came from
      a specified model on agreed inputs, working from inference logs and model-version records to deliver
      a third-party verifiable proof
    - Auditors and compliance staff proving to a regulator or client that an AI inference was not tampered
      with, assembling inference logs and model versions into an independently checkable proof
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向需要向外部证明 AI 推理未被篡改的合规与审计人员：他们手里有推理日志和模型版本记录，FlashProve 接收推理过程并生成零知识证明，让第三方在不看到原始数据的情况下核验结果；目前是自述不再维护的研究原型，具体可用流程与交付形态仍待核验。
    inspiration: 趋势是 AI 推理的“可证明性”开始被当作合规材料而非纯学术问题；切入可放在受监管行业的模型审计环节，例如为保险理赔或医疗辅助诊断的模型输出出具可核验凭证，卖法可能是按次出具证明而非按席位。
    summary_en: 'For compliance and audit staff who must prove to outsiders that an AI inference was not
      tampered with: they hold inference logs and model-version records, and FlashProve takes the inference
      and produces a zero-knowledge proof so a third party can verify the result without seeing raw data;
      it is currently a self-described unmaintained research prototype, and the usable workflow and delivery
      form still need verification.'
    inspiration_en: The trend is that provability of AI inference is starting to be treated as compliance
      material rather than a purely academic question; the entry point is the model-audit step in regulated
      industries, such as issuing verifiable attestations for insurance claims or clinical decision support,
      potentially sold per proof rather than per seat.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 合规与审计人员在向监管方或客户说明某次 AI 推理确实由指定模型按约定输入产生时，处理推理日志与模型版本记录，要交付可被第三方独立核验的证明。
        job_en: Compliance and audit staff explaining to a regulator or client that a given AI inference
          came from a specified model on agreed inputs, working from inference logs and model-version
          records to deliver a third-party verifiable proof.
        pain_zh: 现有做法只能交出日志和自述，外部方无法独立确认推理未被篡改，争议时缺少可核验凭据。
        pain_en: Today they can only hand over logs and self-reporting; outsiders cannot independently
          confirm the inference was untampered, so disputes lack verifiable evidence.
        current_alternative_zh: 人工整理日志、模型版本记录和内部审计报告，由对方信任机构自述。
        current_alternative_en: Manually assembling logs, model-version records and internal audit reports,
          relying on the counterparty trusting the institution's own account.
        usage_reason_zh: 推断：相较只交日志，它把推理过程转成第三方可独立核验的证明，减少对方复核日志与信任自述这一步；受监管行业在需要对外出具模型审计材料时可能选择它。
        usage_reason_en: 'Inference: compared with handing over logs alone, it turns the inference into
          a proof a third party can independently check, removing the step of the counterparty re-examining
          logs and trusting self-reporting; regulated firms may choose it when they must issue model-audit
          material externally.'
      gates:
      - gate: value
        status: supported
        reason: 它解决对外证明 AI 推理未被篡改的需求，痛点是外部方无法独立核验，现有替代只有日志与自述。
        evidence_ids:
        - ev-3b9dfb1df72f641e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，无客户案例、部署记录或用户反馈说明谁在实际使用。
        evidence_ids:
        - ev-567baff4fb51c0db
      - gate: model
        status: insufficient
        reason: 仓库自述不再维护，未见定价、付费路径或商业交付方，买方与收费方式均未披露。
        evidence_ids:
        - ev-3b9dfb1df72f641e
      - gate: truth
        status: insufficient
        reason: 零知识证明推理的生成成本、延迟与可验证范围未在材料中给出，能否确定性交付仍待核验。
        evidence_ids:
        - ev-3b9dfb1df72f641e
      next_validation: 收集 FlashProve 仓库的 issue、discussion 与发布说明，确认是否有外部团队将其用于实际推理审计场景。
