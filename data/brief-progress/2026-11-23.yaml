  safe-anything:
    slug: safe-anything
    name: safe-anything
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息安全
    industries_en:
    - software development
    - information security
    jobs:
    - 开发者在提交代码或上线前，用扫描器检查 Web 应用与 AI agent 配置中的 XSS、SQL 注入、密钥泄露和依赖漏洞，并据结果修复
    jobs_en:
    - Developers run a scanner before committing code or shipping to check web apps and AI agent setups
      for XSS, SQL injection, leaked secrets and dependency CVEs, then fix the findings
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在提交代码或上线前打开它，扫描 Web 应用与 AI agent 配置中的 XSS、SQL 注入、密钥泄露和依赖 CVE，拿到漏洞清单后自行修复。具体扫描流程、误报处理和交付形式仍待核验。
    inspiration: 趋势：AI agent 的配置与密钥开始被纳入安全扫描范围，说明 agent 落地后安全审计需求外溢。切入：从中小团队上线前的轻量安全体检切入，按次或按仓库收费，而非卖通用扫描器。
    summary_en: Developers open it before committing code or shipping to scan web apps and AI agent setups
      for XSS, SQL injection, leaked secrets and dependency CVEs, then fix the findings themselves. The
      exact scan flow, false-positive handling and delivery format still need verification.
    inspiration_en: 'Trend: AI agent configs and secrets are entering the scope of security scanning,
      showing that agent adoption spills over into audit demand. Entry: start with lightweight pre-launch
      security checks for small teams, priced per scan or per repo rather than as a generic scanner.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在提交代码或上线前，用扫描器检查 Web 应用与 AI agent 配置中的 XSS、SQL 注入、密钥泄露和依赖漏洞，并据结果修复。
        job_en: Developers run a scanner before committing code or shipping to check web apps and AI agent
          setups for XSS, SQL injection, leaked secrets and dependency CVEs, then fix the findings.
        pain_zh: 漏洞和泄露密钥若在上线后才被发现，修复成本和暴露风险都更高；小团队往往没有专职安全人员逐项排查。
        pain_en: Vulnerabilities and leaked secrets found after launch cost more to fix and carry higher
          exposure risk; small teams often lack dedicated security staff to check each item.
        current_alternative_zh: 依赖人工代码审查、零散的开源扫描工具或商业 SAST 服务，AI agent 配置通常无人专门检查。
        current_alternative_en: Manual code review, scattered open-source scanners or commercial SAST
          services; AI agent setups usually go unchecked.
