        job_en: Development teams using AI coding agents need to turn conventions in AGENTS.md and PR
          comments into executable checks during review, so rules do not stay as text only.
        pain_zh: 写在文档和评论里的约定靠人自觉遵守，容易遗漏，代理生成的代码也可能违反约定而无人发现。
        pain_en: Conventions written in docs and comments rely on people remembering them and are easily
          missed, and agent-generated code may violate them unnoticed.
        current_alternative_zh: 团队目前靠人工评审、代码规范文档或手写 lint 规则来落实约定。
        current_alternative_en: Teams currently rely on manual review, style guides or hand-written lint
