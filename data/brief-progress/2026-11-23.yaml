  together-ai:
    slug: together-ai
    name: Together AI
    decision: market_context
    event_summary_zh: 2026年11月22日，Together AI 发布安全事件说明，披露2026年6月和7月部分请求存在提示词泄露问题。这是模型推理与多模型路由基础设施层的一次安全与信任事件，而非新的独立应用发布。
    event_summary_en: On 22 November 2026, Together AI published a security incident note disclosing prompt
      leakage affecting some requests in June and July 2026. This is a security and trust event in the
      model-inference and multi-model routing infrastructure layer, not the launch of a new standalone
      application.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Together AI 是面向开发者的模型推理与多模型路由基础设施，本次新增事实是其披露2026年6至7月部分请求的提示词泄露。对 AI 应用的含义是：把推理外包给第三方基础设施的团队，需要把提示词与上下文视为可能外泄的敏感资产，并在选型时把隔离与审计能力纳入成本与交付评估（推断）。
    inspiration: 趋势：推理与路由层竞争激烈、估值快速抬升，但安全事件说明这一层的信任成本正在显性化。切入：面向需要处理客户敏感文本的垂直应用团队，做提示词与上下文的最小化外发、脱敏前置或可审计的私有推理通道，按合规交付而非按
      token 差价收费。
    summary_en: Together AI is developer-facing model inference and multi-model routing infrastructure;
      the new fact is its disclosure of prompt leakage affecting some requests in June and July 2026.
      The implication for AI applications is that teams outsourcing inference must treat prompts and context
      as potentially exposed assets and weigh isolation and auditability in vendor selection (inference).
    inspiration_en: 'Trend: the inference and routing layer is crowded and rapidly revalued, yet this
      incident makes its trust cost explicit. Entry: serve vertical application teams handling sensitive
      client text with pre-send minimization, redaction, or auditable private inference channels, sold
      as compliance-grade delivery rather than token arbitrage.'
