      AI 应用的成本与上市时间（推断）。
    summary_en: On November 22, 2026, OpenAI's chief scientist proposed setting a speed limit on AI development,
      arguing that the industry must first agree on how to measure speed. If this governance discussion
      advances, it would affect the release cadence and compliance requirements of frontier models, and
      in turn the cost and time-to-market of AI applications that depend on model capabilities (inference).
    event_summary_zh: OpenAI 首席科学家提出对 AI 开发设定速度上限的设想，强调需先就衡量开发速度的指标达成行业共识。
