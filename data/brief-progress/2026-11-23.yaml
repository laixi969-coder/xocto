      加速插件，仓库自述可减少 34% 的 LLM 轮次、31% 的 token 配额消耗和 40% 的上传流量，且不改变原生界面与 diff；仓库星标从 188 增至 564。
    event_summary_en: 'On 2026-11-19, INK-Q published agy-fast on an open-source repository: a non-invasive
      MCP accelerator plugin for Google Antigravity (CLI/Desktop/IDE) that its README says cuts LLM turns
      by 34%, token quota use by 31% and upload traffic by 40% without changing the native UI or diffs;
      repository stars rose from 188 to 564.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Google Antigravity 编码的开发者，在长会话中反复调用模型、token 配额快速耗尽时，处理代码与上下文材料，要完成减少轮次和配额消耗的编码任务
    jobs_en:
    - Developers using Google Antrigravity who hit fast token-quota exhaustion in long sessions, working
      on code and context material to complete coding tasks with fewer turns and less quota use
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Google Antigravity 编码的开发者，在长会话里 token 配额消耗过快时打开这个插件；它作为 MCP 层接收模型调用请求并压缩轮次与上传内容，最终让用户以更少的模型轮次和配额完成同样的编码任务，原生界面与
      diff 保持不变。上述削减比例来自仓库自述，独立复现结果仍待核验。
    inspiration: 趋势：编码代理的竞争正从模型能力转向“每完成一个任务花多少轮次和配额”，成本控制开始被做成可插拔的中间层。切入：从按团队或按节省配额计费的代理成本治理入手，先服务重度使用编码代理的工程团队；但该层紧贴单一平台，平台一旦内置压缩，窗口会迅速收窄。
    summary_en: Developers using Google Antigravity open this plugin when token quota drains too fast
      in long sessions; it sits at the MCP layer, receives model calls and compresses turns and uploaded
      content so users finish the same coding task with fewer model turns and less quota, while the native
      UI and diffs stay unchanged. The stated reductions come from the repository itself and independent
      reproduction is still unverified.
    inspiration_en: 'Trend: competition among coding agents is shifting from raw model ability to how
      many turns and how much quota one task costs, and cost control is becoming a pluggable middle layer.
      Entry: sell agent cost governance per team or per quota saved, starting with engineering teams that
      lean heavily on coding agents; but this layer is tied to one platform, so the window narrows quickly
      if the platform builds compression in.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Google Antigravity 的开发者，在长编码会话中处理代码与上下文材料，要在配额耗尽前完成调试或改代码任务。
        job_en: Developers on Google Antigravity working through code and context in long coding sessions,
          trying to finish debugging or code changes before quota runs out.
        pain_zh: 编码代理每轮都携带大量上下文，轮次和 token 配额消耗快，用户要么频繁等待配额恢复，要么为更高额度付费。
        pain_en: Coding agents carry heavy context each turn, so turns and token quota drain fast; users
          either wait for quota to reset or pay for higher limits.
        current_alternative_zh: 旧做法是手动精简提示与上下文、减少追问，或直接购买更高配额；也有人忍受中断等待。
        current_alternative_en: The old approach is manually trimming prompts and context, asking fewer
          follow-ups, or buying a higher quota; others simply tolerate the interruptions.
        usage_reason_zh: 推断：插件在 MCP 层自动压缩轮次与上传内容，省去用户手动裁剪上下文这一步，并直接减少可核对的轮次与配额消耗，因此重度使用 Antigravity 的开发者会在长会话中选用它；仓库自述的削减比例尚无独立复现。
        usage_reason_en: 'Inference: the plugin compresses turns and uploads at the MCP layer, removing
          the manual context-trimming step and directly lowering checkable turn and quota use, so heavy
          Antigravity users would pick it for long sessions; the stated reductions have no independent
          reproduction yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理长会话中轮次与配额消耗过快的问题，痛点具体且不采用就要等待或加钱；买方尚不清晰。
        evidence_ids:
        - ev-6285173aa97ba2fb
        - ev-489a24001575432e
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 188 增至 564 只说明关注度上升，没有用户反馈或采用数据证明它被持续留在工作流里。
        evidence_ids:
        - ev-6285173aa97ba2fb
        - ev-0f902ce331e23ca2
        - ev-489a24001575432e
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；可能靠托管版或团队订阅变现，这是判断而非已验证事实。
        evidence_ids:
        - ev-489a24001575432e
      - gate: truth
        status: insufficient
        reason: 削减比例来自仓库自述，缺少可复现实测；且插件依附单一平台，平台内置压缩后价值可能被吸收。
        evidence_ids:
        - ev-6285173aa97ba2fb
        - ev-489a24001575432e
      next_validation: 收集仓库 issue 与 discussion 中用户对轮次和配额削减的可复现实测反馈。
