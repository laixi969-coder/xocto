    inspiration: 趋势：AI 生成内容泛滥后，'这条画面是不是真的'正从平台责任下沉到读者个人判断。切入：可从新闻编辑部、事实核查机构和二手交易平台的图片审核环节进入，按核查量或机构订阅收费，而不是做面向所有人的免费插件。
