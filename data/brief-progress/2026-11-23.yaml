  fireworks-ai:
    slug: fireworks-ai
    name: Fireworks AI
    decision: market_context
    event_summary_zh: 2026年11月，Fireworks AI 在数周内第二次通报安全事件，黑客经由该平台访问了 Notion 客户的聊天记录；同期报道称其客户因 GPU 供给紧张而继续留用，并称其以开放模型提供
      Anthropic 的替代方案。
    event_summary_en: In November 2026, Fireworks AI disclosed a second security incident within weeks,
      with attackers reaching Notion customers' chat transcripts through the platform; reporting in the
      same period said customers stay because of GPU scarcity and that it offers open models as an alternative
      to Anthropic.
    category: 基础层
    project_type: ai_transformation
    industries:
    - 云计算与算力服务
    - 企业软件
    industries_en:
    - Cloud and compute services
    - Enterprise software
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Fireworks AI 是面向开发者的模型推理与托管平台，开发者把开源或自研模型部署到其算力上对外提供调用。2026年11月它连续发生两起安全事件，其中一起导致 Notion
      客户的聊天记录被访问；同期报道称客户因 GPU 供给紧张而继续留用，并把它当作 Anthropic 的开放模型替代路径。
    inspiration: 推理托管层的竞争已从价格转向供给与信任：GPU 紧张让客户难以迁移，但连续泄露把“模型供应链安全”变成可单独售卖的一层。切入可考虑面向使用第三方推理平台的企业做调用审计、数据隔离与泄露溯源，按合规审查或事故响应收费，而不是再建一个推理平台。
    summary_en: Fireworks AI is a developer-facing model inference and hosting platform where teams deploy
      open or in-house models on its compute and serve them as APIs. In November 2026 it suffered two
      security incidents in quick succession, one of which exposed Notion customers' chat transcripts;
      reporting in the same period said customers stay because of GPU scarcity and that it positions open
      models as an alternative to Anthropic.
    inspiration_en: 'Competition in inference hosting has shifted from price to supply and trust: GPU
      scarcity makes customers sticky, but repeated breaches turn model supply-chain security into a layer
      that can be sold on its own. A wedge is call auditing, data isolation and breach tracing for enterprises
      using third-party inference platforms, charged per compliance review or incident response rather
      than building another inference platform.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 开发团队把开源或自研模型部署到第三方推理平台，向自己的应用提供稳定调用，并在事故后向客户说明数据流向。
        job_en: Engineering teams deploy open or in-house models on a third-party inference platform to
          serve their own applications reliably, and must explain data flows to customers after an incident.
        pain_zh: 推理平台一旦泄露，客户数据会经平台外流；但 GPU 供给紧张使迁移成本高，团队被迫在安全风险与算力可得性之间取舍。
        pain_en: When an inference platform is breached, customer data leaks through it; but GPU scarcity
          makes migration costly, forcing teams to trade security risk against compute availability.
        current_alternative_zh: 自建 GPU 集群、改用其他推理托管商，或继续留用现有平台并加强自身侧的数据脱敏与访问控制。
        current_alternative_en: Building their own GPU clusters, switching to another inference host,
          or staying and strengthening their own data masking and access controls.
        usage_reason_zh: 这是推断：客户留用主要因为算力供给而非安全能力，因此该平台本身并未以减少安全负担为卖点；真正可能被选择的是围绕第三方推理的审计与隔离工具，而这类工具目前没有公开证据。
        usage_reason_en: 'Inference: customers stay mainly because of compute supply rather than security
          capability, so the platform itself does not sell on reducing security burden; what might be
          chosen are auditing and isolation tools around third-party inference, for which no public evidence
          exists yet.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决的是模型托管与调用，但本次材料集中在安全事件与供给紧张，未说明用户为何在具体工作流中选择它而非自建或其他托管商。
        evidence_ids:
        - ev-4a19a86fa4222d89
        - ev-b96f1a99047c0224
        - ev-2d5155c3301f663c
      - gate: consensus
        status: insufficient
        reason: 材料只提到客户因 GPU 紧张而留用，没有可归因到该平台的采用规模、留存或复购数据。
        evidence_ids:
        - ev-4a19a86fa4222d89
      - gate: model
        status: insufficient
        reason: 未披露定价与买方结构；作为基础设施层，收入可能来自按调用量计费的开发者与企业，但这是判断而非已验证事实。
        evidence_ids:
        - ev-2d5155c3301f663c
      - gate: truth
        status: challenged
        reason: 数周内两次泄露且波及下游客户数据，交付的确定性与安全边界受到公开质疑。
        evidence_ids:
        - ev-309a8333911ae920
        - ev-9273cdbcc97fd565
        - ev-aa2da69ffb3fb536
      next_validation: 收集 Fireworks AI 官方安全公告或状态页，核验两次事件的披露范围、受影响客户与整改措施。
