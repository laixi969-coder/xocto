  icode-workbench:
    slug: icode-workbench
    name: icode-workbench
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - Software Development
    jobs:
    - 开发者在同时运行多个编码代理时，需要在一个工作台里启动、切换并查看各代理的终端输出，以完成代码修改任务
    jobs_en:
    - Developers running several coding agents at once need one workbench to launch, switch between and
      review each agent's terminal output to complete code changes
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在同时跑多个编码代理时打开这个工作台，把 Claude Code、Codex、OpenCode 等命令行代理接入同一界面，由它统一启动和切换各代理的终端会话；用户拿到的是各代理执行过程的集中视图，最终代码是否采纳仍由人判断。具体交付流程与人工确认环节仍待核验。
    inspiration: 趋势是多代理并行编码从个人脚本走向需要统一调度界面的阶段；切入可考虑为使用多个订阅制编码代理的小型工程团队做会话编排与结果比对，卖点放在减少切换与复核成本，而非再做一个编码模型。
    summary_en: Developers juggling several coding agents open this workbench to plug CLI agents such
      as Claude Code, Codex and OpenCode into one interface, which launches and switches their terminal
      sessions; the user gets a consolidated view of each agent's run while a human still decides what
      code to keep. The exact delivery flow and human sign-off step remain to be verified.
    inspiration_en: The trend is multi-agent coding moving from personal scripts to needing a shared orchestration
      surface; the opening is session orchestration and output comparison for small engineering teams
      already paying for several coding agents, sold on less context-switching and review overhead rather
      than another coding model.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同时运行多个编码代理时，需要在一个工作台里启动、切换并查看各代理的终端输出，以完成代码修改任务。
        job_en: Developers running several coding agents at once need one workbench to launch, switch
          between and review each agent's terminal output to complete code changes.
        pain_zh: 多个代理各开一个终端，切换、比对和追踪谁改了什么都要手工做，容易漏看或混淆结果。
        pain_en: Each agent gets its own terminal, so switching, comparing and tracking who changed what
          is manual and results are easily missed or confused.
        current_alternative_zh: 开发者自己开多个终端窗口或标签页，手动复制粘贴上下文并逐个检查输出。
        current_alternative_en: Developers open multiple terminal windows or tabs themselves, manually
          copy context and check each output one by one.
        usage_reason_zh: 推断：相较手工管理多个终端，它把多个 CLI 代理的会话收进同一界面统一启动和切换，减少在窗口间搬运上下文和逐个查找输出的步骤，因此同时使用多个编码代理的开发者会在并行改代码时选择它。
        usage_reason_en: 'Inference: versus hand-managing several terminals, it gathers multiple CLI agent
          sessions into one interface for launching and switching, cutting the steps of moving context
          between windows and hunting for each output, so developers using several coding agents would
          pick it when changing code in parallel.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时终端分散、结果难比对的问题，旧做法是自己开多个终端手工切换，痛点具体且可还原。
        evidence_ids:
        - ev-57979c34c230de71
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数这一关注度信号，没有用户反馈或采用证据说明开发者已把它放进日常流程。
        evidence_ids:
        - ev-57979c34c230de71
      - gate: model
        status: insufficient
        reason: 未披露定价与付费方式，买方可能是个人开发者或团队，钱从哪来尚不清楚，这是判断不是已验证事实。
        evidence_ids:
        - ev-57979c34c230de71
      - gate: truth
        status: insufficient
        reason: 依赖第三方 CLI 代理的接口与订阅，交付确定性受上游变化影响，且人工复核边界未在材料中说明。
        evidence_ids:
        - ev-57979c34c230de71
      next_validation: 收集该仓库的 issue 与 discussion，确认开发者是否报告在多代理并行场景中持续使用及遇到的具体障碍。
