        usage_reason_zh: 推断：它把代理状态、配额和机器健康集中到一块常驻小屏，省去反复切窗口这一步，因此同时跑多个代理、又不想盯屏幕的开发者会尝试；是否长期留在工作流尚无公开证据。
        usage_reason_en: 'Inference: it consolidates agent status, quotas and machine health onto one
