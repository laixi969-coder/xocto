    summary_zh: 技术文档作者在交付维修手册或操作说明前打开这个 agent 技能，把草稿交给它按 ASD-STE100 简化技术英语规则改写，并去掉 AI 写作痕迹；它只改写到约八成合规，最终术语与合规确认仍需人工完成，具体流程与交付形态仍待核验。
    inspiration: 趋势是受控语言、合规写作这类有硬标准的文档工作开始被拆成可调用的改写步骤，而不是整篇交给通用助手。切入可放在航空、工业设备等必须出 STE 版手册的供应链文档外包，按每份手册的合规改写收费；但公开材料只有技能说明与仓库关注度，尚未看到真实文档团队的使用记录。
    summary_en: Before delivering maintenance manuals or operating instructions, technical writers open
      this agent skill and hand it a draft to be rewritten toward ASD-STE100 Simplified Technical English
      while stripping AI writing tells; it only reaches roughly 80% compliance, so terminology and compliance
      sign-off still need a human, and the exact workflow and deliverable remain unverified.
    inspiration_en: The trend is that controlled-language and compliance writing, which carry hard standards,
      is being split into callable rewriting steps instead of being handed whole to a general assistant.
      An entry point is supply-chain documentation outsourcing in aerospace and industrial equipment,
      where STE versions of manuals are mandatory, priced per manual rewritten for compliance; public
      material so far only shows a skill description and repository attention, with no record of real
      documentation teams using it.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 技术文档作者在交付维修手册或操作说明前，把草稿改写成符合 ASD-STE100 简化技术英语规则的受控语言版本。
        job_en: Technical writers rewrite drafts of maintenance manuals or operating instructions into
          controlled Simplified Technical English compliant with ASD-STE100 before delivery.
        pain_zh: STE 规则条目多、术语与句式受限，人工逐句改写耗时且容易漏改；通用助手改写又常引入不合规表达和 AI 腔。
        pain_en: STE rules are numerous with restricted terms and sentence patterns, so manual sentence-by-sentence
          rewriting is slow and error-prone, while general assistants often introduce non-compliant phrasing
          and AI-sounding text.
        current_alternative_zh: 文档作者对照 STE 词典和规则手工改写，或用通用大模型改写后再人工逐条核对。
        current_alternative_en: Writers manually rewrite against the STE dictionary and rules, or use
          a general LLM and then check each line by hand.
        usage_reason_zh: 推断：它把草稿直接改写到约八成 STE 合规并去掉 AI 痕迹，减少从零逐句对照规则的那一步，因此需要批量产出受控语言文档的写作团队会在初稿阶段选用它，但剩余合规判断仍需人工。
        usage_reason_en: 'Inference: it rewrites a draft to roughly 80% STE compliance and removes AI
          tells, cutting the step of checking every sentence against the rules from scratch, so teams
          producing controlled-language documents in volume would use it at the draft stage, though remaining
          compliance judgment stays with humans.'
      gates:
      - gate: value
        status: supported
        reason: 它解决受控语言文档逐句改写耗时、通用助手改写不合规的问题，痛点刚性且交付可核对，但只到八成合规需人工收尾。
        evidence_ids:
        - ev-81a8a9f39c9af049
      - gate: consensus
        status: insufficient
        reason: 只有仓库关注度持续上升，没有文档团队采用、评价或案例，无法判断是否进入真实工作流。
        evidence_ids:
        - ev-b1eb70132765f83d
        - ev-81a8a9f39c9af049
      - gate: model
        status: insufficient
        reason: 开源技能无定价与付费路径，买方可能是文档外包商或制造企业，属判断而非已验证事实。
        evidence_ids:
        - ev-81a8a9f39c9af049
      - gate: truth
        status: insufficient
        reason: 八成合规的承诺能否稳定交付、术语一致性如何保证，公开材料未给出实测或人工复核流程。
        evidence_ids:
        - ev-81a8a9f39c9af049
      next_validation: 收集该仓库的 issue 与 discussion，看是否有文档团队报告实际改写结果与人工复核环节。
