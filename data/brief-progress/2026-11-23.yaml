        pain_zh: 真人中之人需长时间在线且成本高，角色记忆与语音一致性难维持。
        pain_en: Human avatars must stay online for long hours at high cost, and character memory and
          voice consistency are hard to maintain.
        current_alternative_zh: 雇佣真人中之人配音演出，或用脚本与预录内容拼凑直播。
