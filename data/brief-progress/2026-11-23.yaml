  binding-of-isaac-developer-removes-ai-music-from-repentance:
    slug: binding-of-isaac-developer-removes-ai-music-from-repentance
    name: 'The Binding of Isaac: Repentance Plus'
    decision: market_context
    summary_zh: '2026年11月，The Binding of Isaac: Repentance Plus 因游戏内一段模仿 GTA 的段落使用生成式 AI 音乐被玩家发现并遭差评轰炸，创作者
      Edmund McMillen 致歉并称事先不知情，开发方随后移除相关 AI 音乐。该事件表明平台要求披露生成式 AI 使用情况，玩家对未披露的 AI 内容存在明显抵触，AI 生成内容在商业游戏中的采用面临信任与合规成本。'
    summary_en: 'In November 2026, The Binding of Isaac: Repentance Plus was review-bombed after players
      found that a GTA-parody segment used generative AI music; creator Edmund McMillen apologized and
      said he was unaware, and the developer removed the AI music. The episode shows platform disclosure
      requirements for generative AI and player resistance to undisclosed AI content, raising trust and
      compliance costs for AI-generated content in commercial games.'
    event_summary_zh: 'The Binding of Isaac: Repentance Plus 被发现游戏内一段 GTA 主题段落使用带 Suno 元数据的 AI 音乐，遭 Steam
      差评轰炸，创作者致歉后相关 AI 音乐被移除。'
    event_summary_en: 'The Binding of Isaac: Repentance Plus was found to use AI music with Suno metadata
      in a GTA-themed segment, was review-bombed on Steam, and the AI music was removed after the creator
      apologized.'
