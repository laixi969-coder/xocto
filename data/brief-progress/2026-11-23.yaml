          repetitive cross-app tasks they would otherwise do manually step by step.
        pain_zh: 跨 App 的重复操作耗时且易错，现有自动化多依赖电脑、root 或 ADB，普通用户门槛高。
        pain_en: Repetitive cross-app operations are time-consuming and error-prone, and existing automation
