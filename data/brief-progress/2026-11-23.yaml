        usage_reason_en: 'Inference: customers choose it to get large Nvidia GPU capacity quickly, skipping
          self-build procurement and data-center lead time; but the public material covers only financing
          and bond pricing, with no retention or renewal evidence.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决大规模 GPU 算力的按需获取需求，痛点真实；但本次材料只讲融资与债券定价，未说明客户任务与交付结果。
        evidence_ids:
