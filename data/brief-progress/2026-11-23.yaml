    name: 哔哩哔哩
    decision: market_context
    summary_zh: 哔哩哔哩就“AI 大肥鱼”智能体账号泛滥发布调查问卷征集治理意见，表明平台开始针对批量生成的 AI 智能体账号制定治理规则。对 AI 应用而言，这意味着平台侧对智能体账号的合规与内容治理要求上升，相关运营方需承担更高的账号审核与内容责任（推断）。
    summary_en: Bilibili issued a survey to collect governance opinions on the proliferation of "AI Da
      Fei Yu" agent accounts, indicating the platform is moving to set rules for mass-generated AI agent
      accounts. For AI applications, this implies rising platform-side compliance and content-governance
      requirements for agent accounts, with operators facing heavier account review and content responsibility
      (inference).
    event_summary_zh: 哔哩哔哩就“AI 大肥鱼”智能体账号泛滥发布调查问卷，征集治理意见。
    event_summary_en: Bilibili released a survey seeking governance opinions on the proliferation of "AI
      Da Fei Yu" agent accounts.
