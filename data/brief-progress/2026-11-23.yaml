      demand_read:
        job_zh: 使用 AI 编程代理的开发者，在代理开始写代码前把需求整理成计划，并在合并前审查代理产出的代码差异。
        job_en: Developers using AI coding agents turn requirements into a plan before the agent writes
          code, and audit the agent's code diff before merging.
        pain_zh: 代理一次产出大量代码，人工逐行审查负担重，容易漏掉错误或越界改动；缺少固定审查步骤时，质量取决于个人习惯。
        pain_en: An agent produces a large volume of code at once, making line-by-line human review heavy
          and easy to miss errors or out-of-scope changes; without a fixed review step, quality depends
          on individual habits.
        current_alternative_zh: 开发者各自写提示词、凭经验人工读代码差异，或依赖代码托管平台的通用审查流程。
        current_alternative_en: Developers write their own prompts, read diffs manually by experience,
          or rely on the generic review flow of code hosting platforms.
        usage_reason_zh: 推断：它把审查拆成计划、批判性审查、差异审计三个固定步骤，减少开发者每次自行设计审查流程的负担，并让代理改动在合并前多一道可重复的检查；使用代理且重视代码质量的团队会因此选择它。
        usage_reason_en: 'Inference: it splits review into three fixed steps—planning, critical review
          and diff audit—reducing the burden of designing a review process each time and adding a repeatable
          check before agent changes are merged; teams using agents and caring about code quality would
          choose it for this.'
      gates:
