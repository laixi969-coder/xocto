    jobs:
    - 内容创作者或运营在把视频发到 Discord、微信、WhatsApp 等有体积上限的平台前，处理原始视频文件，把它压到指定大小并尽量保住画质
    jobs_en:
    - Content creators and social media operators preparing a video for size-capped platforms such as
      Discord, WeChat or WhatsApp, working from the original file to hit an exact size while preserving
      quality
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 内容创作者或运营在把视频发到 Discord、微信、WhatsApp 这类有体积上限的平台前，打开 halfsize 处理原始视频文件，它用 FFmpeg 在本地把视频压到指定大小，并把
      HDR 转为 SDR，同时用 VMAF/SSIM 给出画质对比。用户拿到的是符合平台上限的视频文件，画质取舍需自行确认；它也可作为 MCP 服务供 AI 代理调用。
    inspiration: 趋势：平台体积上限长期逼着创作者手工试参数，压缩正从“凭经验调码率”变成“给定目标体积自动求解”。切入：面向短视频运营与社群发布者，按“压到指定大小且画质可核对”卖结果，可做批量与多平台预设；是否收费与定价未披露，不可假设。
    summary_en: Before posting a video to size-capped platforms like Discord, WeChat or WhatsApp, content
      creators and operators open halfsize on the original file; it compresses locally with FFmpeg to
      an exact target size, tone-maps HDR to SDR, and reports VMAF/SSIM quality comparisons. Users get
      a file that fits the platform cap and must judge the quality trade-off themselves; it also runs
      as an MCP server for AI agents.
    inspiration_en: 'Trend: platform size caps have long forced creators to hand-tune parameters, and
      compression is shifting from experience-based bitrate guessing to solving for a target size. Entry:
      target short-video operators and community posters, selling a verifiable result of exact size with
      checkable quality, plus batch and per-platform presets; pricing is undisclosed and must not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容创作者或运营在把视频发到 Discord、微信、WhatsApp 等有体积上限的平台前，处理原始视频文件，把它压到指定大小并尽量保住画质。
        job_en: Content creators and social media operators preparing a video for size-capped platforms
          such as Discord, WeChat or WhatsApp, working from the original file to hit an exact size while
          preserving quality.
        pain_zh: 平台体积上限是硬约束，手工调码率往往要反复试压、反复上传才能过，且 HDR 素材直接压容易偏色。
        pain_en: Platform size caps are hard constraints; hand-tuning bitrate often means repeated trial
          compressions and re-uploads to get under the limit, and HDR footage shifts color when compressed
          naively.
        current_alternative_zh: 用通用视频编辑软件或在线压缩站手工设码率，反复试压；或直接降低分辨率牺牲画质。
        current_alternative_en: Manually setting bitrate in general video editors or online compressors
          and re-trying, or simply lowering resolution and sacrificing quality.
        usage_reason_zh: 相较手工试码率，它直接以目标体积为输入反解压缩参数，省去反复试压与重传这一步，并用 VMAF/SSIM 让画质损失可核对；推断需要频繁往有上限平台发视频的创作者会因此选择它。
        usage_reason_en: Compared with hand-tuning bitrate, it takes the target size as input and solves
          for compression parameters, removing repeated trial compressions and re-uploads, and makes quality
          loss checkable via VMAF/SSIM; by inference, creators who frequently post to capped platforms
          would choose it for this.
      gates:
      - gate: value
        status: supported
        reason: 它解决视频发往有体积上限平台时反复试压、画质难判断的痛点，输入目标体积即可交付合规文件，价值结构成立。
        evidence_ids:
        - ev-fad83ad2cc2e172f
        - ev-852ac0ca90f16c91
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，属关注度证据，未见用户评价或客户案例说明持续使用。
        evidence_ids:
        - ev-fad83ad2cc2e172f
        - ev-e471d968415d8a5e
      - gate: model
        status: insufficient
        reason: 开源项目，未披露定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-fad83ad2cc2e172f
      - gate: truth
        status: supported
        reason: 本地运行、以目标体积为约束，并用 VMAF/SSIM 给出可核对画质指标，交付结果可验证。
        evidence_ids:
        - ev-852ac0ca90f16c91
        - ev-fad83ad2cc2e172f
      next_validation: 收集 halfsize 仓库的 issue 与 discussion，查看用户是否反馈反复使用、批量处理或多平台预设需求。
