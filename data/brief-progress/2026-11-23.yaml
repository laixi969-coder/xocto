    - Software & Internet Services
    jobs:
    - AI 安全研究员在模型上线前，用同一套可复现用例对多家模型做越狱与护栏测试，并整理出可对比的评估结果
    - 安全工程师在接入第三方大模型时，用对抗样本验证护栏是否失效，并输出给合规或采购方
    jobs_en:
    - AI security researchers run reproducible jailbreak and guardrail tests across multiple model providers
      before launch and compile comparable evaluation results
    - Security engineers validate guardrail failures with adversarial samples when integrating third-party
      LLMs and report results to compliance or procurement
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向 AI 安全研究者的开源测试台：在模型上线或接入前，把同一批对抗与越狱用例跑在多家模型上，做护栏有效性对比。用户最终拿到的是可复现的测试结果，具体报告格式与人工复核环节仍待核验。
    inspiration: 趋势：模型接入方开始需要可复现的第三方安全评估，而不是各家自说自话。切入：从需要向采购或合规交代模型安全性的企业安全团队入手，卖可复现的评估报告而非测试工具本身；价格未披露，不臆测。
    summary_en: 'An open-source test bench for AI security researchers: before a model ships or is integrated,
      it runs the same adversarial and jailbreak cases across multiple providers to compare guardrail
      effectiveness. Users get reproducible test results; report format and human review steps still need
      verification.'
    inspiration_en: 'Trend: model integrators increasingly need reproducible third-party security evaluation
      rather than vendor self-reports. Entry: target enterprise security teams that must justify model
      safety to procurement or compliance, selling reproducible evaluation reports rather than the test
      tool; pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 安全研究员或接入方工程师在模型上线或采购前，用统一对抗用例测试多家模型的越狱抵抗与护栏表现，形成可对比结论。
        job_en: AI security researchers or integrator engineers test multiple models' jailbreak resistance
          and guardrails with unified adversarial cases before launch or procurement, producing comparable
          conclusions.
        pain_zh: 各家模型的安全声明口径不一，手工拼测试脚本难以复现和横向对比，出问题后难以向采购或合规交代。
        pain_en: Vendor safety claims use inconsistent standards; hand-built test scripts are hard to
          reproduce and compare, making it difficult to justify to procurement or compliance when issues
          arise.
        current_alternative_zh: 安全团队自建脚本、零散跑红队测试，或直接采信模型厂商的安全说明。
        current_alternative_en: Security teams build their own scripts, run ad-hoc red-team tests, or
          simply trust vendor safety statements.
        usage_reason_zh: 推断：它把多模型对抗测试收敛成一套可复现用例，减少自建脚本和结果对齐的步骤，因此需要横向对比或对外交代模型安全性的团队会在评估阶段选用它。
        usage_reason_en: 'Inference: it consolidates multi-model adversarial testing into one reproducible
          case set, cutting the work of building scripts and aligning results, so teams needing cross-model
          comparison or external safety justification would pick it during evaluation.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多模型安全评估口径不一、难复现的痛点，替代自建脚本与采信厂商声明，交付可对比测试结果。
        evidence_ids:
        - ev-70170f4d3a0697fa
        - ev-8ca5b5e0df5d0f08
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度，未见企业安全团队采用或客户案例，共识强度未明。
        evidence_ids:
        - ev-8ca5b5e0df5d0f08
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径，买方可能是企业安全预算，属判断而非已验证事实。
        evidence_ids:
        - ev-70170f4d3a0697fa
      - gate: truth
        status: insufficient
        reason: 未见测试覆盖范围、误报率或人工复核边界的公开说明，交付确定性待核验。
        evidence_ids:
        - ev-70170f4d3a0697fa
      next_validation: 收集该仓库的 issue/discussion 与 README，确认测试用例覆盖范围、结果报告格式及是否有企业用户反馈。
