  github-30:
    slug: github-30
    name: VeriCorpus
    decision: queued
    event_summary_zh: 2026年11月，开发者 wasabihu 公开对 19.4k★ 的 Rust 检索引擎 XERJ 做中文法规与财报 RAG 实测：不改引擎，仅加纯 Python
      查询适配层与 PDF 文本修复器，同一批 33,575 个分块上证据块 R@3 从 0.2222 升至 0.9111，端到端 Oracle 达成率从 5.3% 升至 97.4%；两份 PR 已合入
      XERJ 主库，工具包以 Apache-2.0 开源。
    event_summary_en: 'In November 2026, developer wasabihu published a Chinese legal and financial-filing
      RAG benchmark on the 19.4k-star Rust search engine XERJ: without touching the engine, a pure-Python
      query adapter and PDF text repair layer lifted evidence-chunk R@3 from 0.2222 to 0.9111 and end-to-end
      Oracle attainment from 5.3% to 97.4% on the same 33,575 chunks; two PRs were merged into XERJ and
      the toolkit is open-sourced under Apache-2.0.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 法律服务
    - 金融与投资
    - 医疗健康
    industries_en:
    - legal services
    - finance and investment
    - healthcare
    jobs:
    - 法务或合规人员在检索中国现行法规条文时，需要把阿拉伯数字条号与中文数字写法对应起来，并拿到可引用的原文块
    - 投研分析师在阅读港交所或 SEC 中英文财报 PDF 时，需要修复表格折行与字符抽取错误后定位到具体财务数据
    - 临床研究人员在查阅三线表试验数据时，需要从表格中准确召回对应行并判断问题是否可回答
    jobs_en:
    - Legal and compliance staff searching Chinese statutes must map Arabic-numeral article numbers to
      Chinese-numeral wording and retrieve citable source chunks
    - Investment analysts reading HKEX or SEC Chinese/English filing PDFs must repair table line breaks
      and character-extraction errors before locating specific financial figures
    - Clinical researchers querying three-line trial tables must accurately retrieve matching rows and
      judge whether a question is answerable
    regions:
    - 中国
    - 中国香港
    - 美国
    regions_en:
    - China
    - Hong Kong SAR, China
    - United States
    open_source: true
    summary_zh: 做本地中文法规、财报或临床文档检索的开发者，在把 PDF 切块喂给检索或问答系统时打开它：它接收原始分块与查询，执行条号归一、简繁术语对齐、PDF 字符与表格修复，并拒答不可回答问题，最终交付可引用的证据块和评测脚本；检索结果仍需人工核对原文。
    inspiration: 趋势：中文长 PDF 与合规语料的检索质量瓶颈不在模型，而在条号写法、简繁术语和 PDF 抽取错误这些脏活上，谁把这些脏活产品化谁就拿到交付确定性。切入：从律所、投研和临床文档团队的中文财报/法规检索环节进入，卖可核验的召回率与拒答率，而不是再卖一个通用问答界面。
    summary_en: 'Developers building local retrieval over Chinese statutes, financial filings or clinical
      documents open it when chunking PDFs for search or QA: it takes raw chunks and queries, normalizes
      article numbering, aligns simplified and traditional terminology, repairs PDF character and table
      errors, and refuses unanswerable questions, delivering citable evidence chunks plus an evaluation
      script; retrieved results still need human checking against the source.'
    inspiration_en: 'Trend: the retrieval bottleneck for Chinese long PDFs and compliance corpora sits
      not in the model but in dirty work such as numeral conventions, simplified/traditional term drift
      and PDF extraction errors; whoever productizes that dirty work gains delivery certainty. Entry:
      start from the Chinese filing and statute retrieval step inside law firms, investment research and
      clinical documentation teams, selling verifiable recall and refusal rates rather than another generic
      QA interface.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 法务、投研或临床文档人员需要在中文法规、港交所/SEC 财报和临床试验表中定位可引用的原文块，并判断某个问题是否根本没有答案。
        job_en: Legal, investment-research or clinical documentation staff need to locate citable source
          chunks in Chinese statutes, HKEX/SEC filings and clinical trial tables, and judge whether a
          question has no answer at all.
        pain_zh: 默认词法检索在中文场景下条号写法不一致、简繁术语断链、PDF 抽取错字与表格折行导致漏召，同时对不可回答问题过度召回，用户拿到一堆弱相关分块还得逐条回原文核对。
        pain_en: Default lexical retrieval misses Chinese matches because article numbering differs, simplified
          and traditional terms break, and PDF extraction garbles characters and table line breaks; it
          also over-retrieves on unanswerable questions, leaving users to check many weak chunks against
          the source.
        current_alternative_zh: 用户目前靠人工翻 PDF、关键词搜索加肉眼比对，或自行写脚本清洗文本；也有人直接换向量库，但脏文本问题依旧存在。
        current_alternative_en: Users currently page through PDFs manually, run keyword search and eyeball
          matches, or write their own cleaning scripts; some switch vector stores, but the dirty-text
          problem remains.
        usage_reason_zh: 推断：相较人工翻页与裸关键词检索，它在查询前统一条号写法、修复 PDF 字符与表格断行、并对不可回答问题直接拒答，把“先清洗再核对”这一步前移，因此处理中文长
          PDF 的法务与投研人员会在需要可引用证据时选择它；公开材料未提供留存或付费证据。
        usage_reason_en: 'Inference: compared with manual paging and bare keyword search, it normalizes
          numbering, repairs PDF characters and table breaks before querying, and refuses unanswerable
          questions outright, moving the clean-then-check step earlier; legal and investment users handling
          long Chinese PDFs would choose it when citable evidence matters. Public materials show no retention
          or payment evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决中文法规与财报检索漏召和过度召回的问题，痛点具体且不解决的后果是可引用证据缺失；买方尚不清晰。
        evidence_ids:
        - ev-45eb4babd9476d6b
      - gate: consensus
        status: insufficient
        reason: 仅有一篇作者自述实测与合入的 PR，缺少独立复现、用户评价或团队采用记录。
        evidence_ids:
        - ev-45eb4babd9476d6b
      - gate: model
        status: insufficient
        reason: 以 Apache-2.0 开源发布，未见定价、商业授权或按结果收费的安排，付费路径未披露。
        evidence_ids:
        - ev-45eb4babd9476d6b
      - gate: truth
        status: supported
        reason: 基准给出同批分块前后对比与拒答结果，且修复限定在日期上下文，交付可核对；但评测由作者自建，需外部复现。
        evidence_ids:
        - ev-45eb4babd9476d6b
      next_validation: '收集 XERJ 仓库中 #3377 内核 CJK 支持议题的讨论与后续提交，确认中文检索修复是否被上游采纳及是否有第三方复现该基准。'
