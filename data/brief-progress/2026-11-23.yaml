        pain_en: While waiting for test results the person has left the desk, so asking which assertion
          failed means walking back or copying terminal output into another chat window, breaking context.
        current_alternative_zh: 起身回电脑看终端，或把输出复制到另一个聊天窗重新解释项目上下文；也可能用远程桌面。
