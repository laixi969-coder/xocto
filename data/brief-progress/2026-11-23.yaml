      个百分点，并伴随增发与可转债。对 AI 应用的含义是：算力供给方的资金成本被重新定价，若这一成本传导到租用价格，应用层的推理与训练开支可能上升；这是推断，材料未给出终端定价变化。
    inspiration: 趋势：算力融资被按更高风险溢价定价，说明供给扩张越来越依赖杠杆而非现金流。切入：应用层创业者应把推理成本当作会波动的变量来设计产品，优先选择单位任务算力消耗低、可按结果收费的形态；基础设施侧的机会在于帮中小买家做算力采购与成本对冲，而非再建一座
      GPU 云。
    summary_en: 'CoreWeave rents Nvidia GPU compute to customers such as Microsoft. The new facts: it
      raised about $1 billion in debt to buy GPUs, and its data-center bond coupon is 9.25%, 2.7 points
      above peers, alongside an equity offering and convertible notes. For AI applications this means
      the supplier''s cost of capital is being repriced; if that passes into rental prices, inference
      and training costs at the application layer could rise. That is an inference; the material gives
      no end-customer pricing change.'
    inspiration_en: 'Trend: compute financing is being priced at a higher risk premium, so capacity expansion
      leans more on leverage than cash flow. Entry: application builders should treat inference cost as
      a volatile input and favor low-compute-per-task, outcome-priced products; on the infrastructure
      side the opening is helping smaller buyers procure and hedge compute cost, not building another
      GPU cloud.'
