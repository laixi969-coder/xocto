  baseten:
    slug: baseten
    name: Baseten
    decision: market_context
    event_summary_zh: 2026年10月30日至31日，多家媒体报道 Baseten 正以约 300 亿美元估值启动新一轮融资，较 6 月水平翻倍以上；同期它被列入 Madrona 2026
      智能应用 40 的 Enabler 阶段名单。
    event_summary_en: On October 30–31, 2026, multiple outlets reported that Baseten is raising a new
      round at roughly a $30 billion valuation, more than double its June level; it was also named to
      Madrona's 2026 Intelligent Applications 40 in the Enabler stage.
    category: 基础层
    project_type: ai_transformation
    industries:
    - 云计算与模型托管
    - 软件开发
    industries_en:
    - Cloud Computing and Model Hosting
    - Software Development
    jobs: []
    jobs_en: []
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: Baseten 是面向企业的模型部署与推理托管平台，开发者把训练好的模型交给它上线，由平台负责 GPU 调度与推理服务。本次新增事实是融资估值传闻与榜单入选，而非新的产品交付或客户数据。
    inspiration: 推理托管与多模型路由的估值一年翻倍以上，说明模型上线这一层的需求真实存在，但资本已高度集中、尚无明确赢家。切入不应再做一个通用托管平台，而应看垂直行业里谁在为“模型上线后的运维与合规”付钱，例如受监管行业的私有化推理交付。
    summary_en: Baseten is an enterprise platform for deploying and hosting trained models, handling GPU
      scheduling and inference serving for developers. The new facts here are a reported funding valuation
      and a list inclusion, not new product delivery or customer data.
    inspiration_en: Valuations for inference hosting and multi-model routing more than doubling in a year
      show real demand at the model-serving layer, but capital is already concentrated with no clear winner.
      The opening is not another general hosting platform but vertical delivery of post-launch operations
      and compliance, e.g. private inference for regulated industries.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 应用团队在模型训练完成后，需要把模型部署成可稳定调用的线上推理服务，并处理 GPU 容量与扩缩容。
        job_en: After training, AI application teams need to deploy models as stable online inference
          services and manage GPU capacity and scaling.
        pain_zh: 自建推理集群要处理 GPU 采购、调度、冷启动与运维，团队负担重且容量利用率低。
        pain_en: Self-hosting inference means handling GPU procurement, scheduling, cold starts and operations,
          a heavy burden with low utilization.
        current_alternative_zh: 团队自建 Kubernetes 加 GPU 集群，或直接用云厂商的通用推理服务。
        current_alternative_en: Teams build their own Kubernetes and GPU clusters, or use generic cloud
          inference services.
        usage_reason_zh: 推断：相较自建集群，Baseten 把模型打包、GPU 调度与扩缩容收进一个托管流程，减少团队在运维环节的投入，因此缺少专职基础设施人员的 AI 应用团队会在上线阶段选择它。
        usage_reason_en: 'Inference: compared with self-built clusters, Baseten folds model packaging,
          GPU scheduling and scaling into one managed flow, cutting operations work, so AI teams without
          dedicated infrastructure staff would choose it at launch.'
      gates:
      - gate: value
        status: supported
        reason: 它解决模型上线后的推理托管与 GPU 调度问题，自建集群的运维负担是真实痛点。
        evidence_ids:
        - ev-506938a307a75889
      - gate: consensus
        status: insufficient
        reason: 仅有榜单入选与融资传闻，缺少公开客户采用或使用规模数据。
        evidence_ids:
        - ev-506938a307a75889
        - ev-56eba7ffb2d52e14
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与付费客户结构，买方与收费方式无法核验。
        evidence_ids:
        - ev-506938a307a75889
      - gate: truth
        status: insufficient
        reason: 缺少交付结果与留存数据，无法确认推理托管是否被长期留在工作流中。
        evidence_ids:
        - ev-56eba7ffb2d52e14
        - ev-85db4ff4c02ee146
      next_validation: 收集 Baseten 官方定价页或公开客户案例，核验其收费方式与已上线客户的实际使用情况。
