      - gate: truth
        status: insufficient
        reason: 实时延迟、直播稳定性与人工接管边界均未在材料中说明。
        evidence_ids:
        - ev-f1de3979f0f54362
      next_validation: 收集该产品官方定价页或直播平台上的实际使用案例，核验延迟与人工接管方式。
