  ai算力供给承压阿里云增速将放缓但千亿美元营收目标不变:
    slug: ai算力供给承压阿里云增速将放缓但千亿美元营收目标不变
    name: 阿里云
    decision: market_context
    summary_zh: 阿里云在2026年11月表示，受AI算力供给承压影响，其增速将放缓，但仍维持千亿美元营收目标不变。这一变化意味着AI算力供给瓶颈可能推高云服务成本并制约AI应用的交付节奏，同时头部云厂商在算力紧张下仍坚持长期营收目标，反映竞争焦点转向算力保障与规模化交付能力（推断）。
    summary_en: In November 2026, Alibaba Cloud said its growth will slow due to pressure on AI compute
      supply, while keeping its US$100 billion revenue target unchanged. This implies that AI compute
      bottlenecks may raise cloud service costs and constrain the delivery pace of AI applications, while
      the leading cloud provider still holds its long-term revenue target amid compute tightness, suggesting
      competition is shifting toward compute assurance and large-scale delivery capability (inference).
    event_summary_zh: 阿里云在2026年11月表示，受AI算力供给承压影响，其增速将放缓，但千亿美元营收目标不变。
    event_summary_en: In November 2026, Alibaba Cloud said its growth will slow due to pressure on AI
      compute supply, while its US$100 billion revenue target remains unchanged.
