  codingsh:
    slug: codingsh
    name: coding.sh
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code、Codex、Cursor 等编码代理的开发者，在任务结束后回看代理执行了哪些步骤、消耗多少成本，以排查错误和核算开销
    jobs_en:
    - Developers using coding agents such as Claude Code, Codex and Cursor review what the agent did and
      what it cost after a task, to debug failures and account for spend
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex、Cursor 等编码代理的开发者，在代理跑完任务后打开 coding.sh，让它接收代理的执行记录与花费数据，在本地呈现代理做过什么、花了多少。用户拿到的是可回看的执行与成本视图，用于排查和核算；具体采集方式、评测流程与交付形态仍待核验。
    inspiration: 趋势：编码代理开始承担多步任务后，团队需要知道代理做了什么、花了多少，这类“代理执行记录”正在成为新的运维对象。切入：从需要向客户或老板交代 AI 编码开销的小型开发团队进入，先做按任务留痕与成本归集，再考虑按团队或按项目收费；价格未披露。
    summary_en: Developers using coding agents such as Claude Code, Codex and Cursor open coding.sh after
      a task so it can take in the agent's execution records and cost data and show locally what the agent
      did and what it spent. Users get a reviewable view of actions and cost for debugging and accounting;
      how records are captured, how evals run and the delivery form still need verification.
    inspiration_en: 'Trend: as coding agents take on multi-step tasks, teams need to know what the agent
      did and what it cost, making agent execution records a new operational object. Entry: start with
      small dev teams that must justify AI coding spend to clients or managers, first task-level traces
      and cost attribution, then team or project pricing; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code、Codex、Cursor 等编码代理的开发者，在代理完成一次多步任务后，需要回看代理执行了哪些操作、消耗多少成本，以定位错误并核算开销。
        job_en: Developers using coding agents such as Claude Code, Codex and Cursor need to review what
          actions the agent took and what it cost after a multi-step task, to locate errors and account
          for spend.
        pain_zh: 编码代理一次任务会执行多步操作并产生费用，开发者缺少统一回看入口，出错时难以复现，成本也难以归因到具体任务。
        pain_en: A coding agent performs many steps and incurs cost in one task; developers lack a single
          review point, making failures hard to reproduce and cost hard to attribute to a task.
        current_alternative_zh: 依赖各代理自带的日志或终端输出，手动翻查，或干脆不追踪成本。
        current_alternative_en: Relying on each agent's own logs or terminal output, checking manually,
          or not tracking cost at all.
        usage_reason_zh: 推断：相较逐个翻查代理日志，它在本地汇总执行记录与花费，减少定位错误和核算成本时的翻找步骤，因此需要向团队或客户交代 AI 编码开销的开发者会尝试它。
        usage_reason_en: 'Inference: versus checking each agent''s logs, it aggregates execution records
          and spend locally, cutting the search step when locating errors and accounting for cost, so
          developers who must justify AI coding spend to a team or client would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理执行后难以回看操作与成本的问题，痛点具体，旧做法是翻查分散日志；买方尚不清晰。
