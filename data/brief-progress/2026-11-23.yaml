    summary_en: Software engineers hand pending coding tasks to Omi CLI when leaving the desk, and the
      agent makes code changes unattended; the user returns to review them. Which task types are supported
      and how results are delivered and verified remain unverified beyond a one-line description.
    inspiration_en: The trend is coding agents moving from in-conversation completion to unattended task
      hosting, where the selling point becomes dependable completion rather than speed. A wedge is wiring
      unattended agents to repetitive changes with clear acceptance criteria, such as dependency upgrades
      or test backfill, charged per successfully merged change; stable acceptance of agent output must
      be shown first.
