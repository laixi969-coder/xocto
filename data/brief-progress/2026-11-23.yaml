    summary_zh: 同时使用 Claude Code、Codex 等命令行编码代理的开发者，在需要跨机器并行跑任务时打开 myco：它把各台机器上的代理接入同一个自托管中枢，让一个代理找到另一个、分派子任务并回传结果，还能按计划触发、用手机查看。用户拿到的是跨设备接续的代理任务流，具体交付质量与失败处理仍待核验。
    inspiration: 趋势是编码代理从单机单会话走向多代理、多机器的协作调度，谁掌握任务分派与结果汇总这一层，谁就贴近开发者的日常入口。切入可放在需要多台机器跑长任务的团队，例如把夜间批量重构、跨仓库迁移这类任务交给代理编排，按团队自托管部署收费；但通用代理编排层竞争激烈，需先确认它在失败重试与结果核对上比手工开多个终端强在哪。
    summary_en: 'Developers who already run Claude Code, Codex and similar command-line coding agents
      open myco when they need tasks running in parallel across machines: it connects agents on each machine
      to one self-hosted hub so one agent can find another, delegate a subtask and return the result,
      with scheduled runs and phone access. What users get is a cross-device stream of agent tasks; delivery
      quality and failure handling still need verification.'
    inspiration_en: The trend is coding agents moving from a single local session to multi-agent, multi-machine
      orchestration, and whoever owns task dispatch and result collection sits close to the developer's
      daily entry point. The opening is teams that run long jobs across several machines, such as overnight
      batch refactors or cross-repository migrations, sold as self-hosted deployment; but generic agent
      orchestration is crowded, so first confirm how it beats manually opening several terminals on retries
      and result checking.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 同时使用多个命令行编码代理的开发者，在本机或远程机器上并行跑任务时，需要把子任务分派给另一个代理并收回结果，或在离开电脑后用手机查看已排期的任务。
        job_en: Developers running several command-line coding agents in parallel on local or remote machines
          need to hand a subtask to another agent and collect its result, or check scheduled tasks from
          a phone while away from the desk.
        pain_zh: 多个代理分散在不同终端和机器上，任务分派、结果回收和跨设备接续都要人工复制粘贴与切换窗口，长任务跑起来后难以追踪。
        pain_en: Agents are scattered across terminals and machines, so dispatching tasks, collecting
          results and continuing across devices means manual copy-paste and window switching, and long-running
          jobs are hard to track.
        current_alternative_zh: 开发者现在通常手工开多个终端、用 SSH 连远程机器、靠聊天窗口或笔记传递中间结果，没有统一的分派与回传通道。
        current_alternative_en: Developers currently open several terminals by hand, SSH into remote machines
          and pass intermediate results through chat or notes, with no unified dispatch and reply channel.
        usage_reason_zh: 相较手工开终端和 SSH，myco 用一个自托管中枢让代理之间直接发现并回传结果，省掉人工搬运中间产物这一步；推断需要跨机器跑长任务的开发者会因此选择它，但公开材料未显示留存或团队采用证据。
        usage_reason_en: Compared with opening terminals and SSH sessions by hand, myco uses one self-hosted
          hub so agents discover each other and return results directly, removing the manual step of moving
          intermediate output; the inference is that developers running long cross-machine jobs would
          choose it, though public material shows no retention or team adoption evidence.
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理跨机器分派与结果回收的需求，痛点是手工切换终端和 SSH 搬运结果；旧流程清晰，价值结构成立。
        evidence_ids:
        - ev-bb5f37e97e49adea
        - ev-4d08d4bfe2c2738a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 144 增至 155，属于关注度而非持续采用，缺少团队使用或重复调度证据。
        evidence_ids:
        - ev-4d08d4bfe2c2738a
      - gate: model
        status: insufficient
        reason: 开源自托管，未见定价或付费路径；推断可能靠托管服务或团队支持收费，这是判断不是已验证事实。
        evidence_ids:
        - ev-4d08d4bfe2c2738a
      - gate: truth
        status: insufficient
        reason: 跨机器代理协作贴近编码任务目标，但失败重试、结果核对与安全边界未见文档说明。
        evidence_ids:
        - ev-bb5f37e97e49adea
      next_validation: 收集 myco 仓库的 issue 与 discussion，确认跨机器任务分派失败重试和结果回传的实际使用反馈。
