    summary_en: 'Teams work with AI agents inside self-hosted Slack-style channels and DMs: agents run
      on Claude, ChatGPT/Codex, Gemini or Grok, call MCP tools, use their own computer and browser, follow
      routines and keep memory, with human approvals on key actions, delivering results in the channel.
      Specific industry workflows and delivery quality remain to be verified.'
    inspiration_en: The trend is putting AI agents into the same interface where teams already communicate,
      rather than a separate chat window; an entry point is serving teams that need data kept on internal
      networks, charging for deployment and operations rather than tokens.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 团队负责人在自托管协作工具中，把重复的检索、资料整理与跨工具执行任务交给 AI 代理，并在频道内审批其产出。
        job_en: Team leads delegate repetitive retrieval, document organization and cross-tool execution
          to AI agents inside a self-hosted collaboration tool, approving output in channels.
        pain_zh: 现有做法要在 Slack 等工具与多个 AI 聊天窗口之间来回切换，复制粘贴上下文，且敏感数据难以交给外部 SaaS；代理动作缺少审批与留痕。
        pain_en: Current practice means switching between Slack-like tools and multiple AI chat windows,
          copying context by hand, while sensitive data is hard to hand to external SaaS; agent actions
          lack approval and audit trails.
        current_alternative_zh: 团队目前用 Slack 或飞书等沟通工具加人工复制到通用聊天助手，或自行拼接脚本与机器人，缺少统一的代理运行与审批环境。
        current_alternative_en: Teams currently use Slack or Feishu-style tools plus manual copying into
          general chat assistants, or stitch together scripts and bots, lacking a unified environment
          for running and approving agents.
        usage_reason_zh: 推断：相较在聊天工具与 AI 窗口间手工搬运上下文，它把代理直接放进频道，代理可调用工具、使用浏览器并按例程执行，关键步骤走审批，减少复制粘贴与结果追溯的负担；重视数据自托管的团队会因此选择它。
        usage_reason_en: 'Inference: compared with manually moving context between chat tools and AI windows,
          it places agents directly in channels where they can call tools, use a browser and follow routines
          with approvals on key steps, cutting copy-paste and traceability burden; teams valuing self-hosting
          would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决团队在沟通工具与多个 AI 窗口间搬运上下文、敏感数据难外发、代理动作无审批的问题，痛点具体且交付可确定。
        evidence_ids:
        - ev-d61e271d35fa21f7
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度增长，缺少团队实际采用、频道使用或客户案例证据，无法判断共识是否形成。
        evidence_ids:
        - ev-d61e271d35fa21f7
      - gate: model
        status: insufficient
        reason: AGPL 开源加自托管部署，付费路径可能是部署运维或企业支持，但公开材料未披露定价与买方，属判断而非已验证事实。
        evidence_ids:
        - ev-d61e271d35fa21f7
      - gate: truth
        status: insufficient
        reason: 代理拥有电脑与浏览器权限，审批机制是否足以约束误操作、交付是否稳定，公开材料未给出可复现实测。
        evidence_ids:
        - ev-d61e271d35fa21f7
      next_validation: 收集该仓库的部署文档与 issue/discussion，核实审批机制、权限边界及是否有团队公开的实际使用案例。
