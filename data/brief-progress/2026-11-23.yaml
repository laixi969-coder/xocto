      - gate: truth
        status: insufficient
        reason: 无人值守改动的验收、回滚与安全边界未公开，无法判断能否确定性交付。
        evidence_ids:
        - ev-cf728ce437259030
      next_validation: 收集 Omi CLI 官方文档或定价页，确认任务类型、验收与失败处理方式。
