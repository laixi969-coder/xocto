  tarobird-2:
    slug: tarobird-2
    name: tarobird
    decision: watching
    category: AI + 开发
    project_type: new_application
    industries:
    - 软件开发
    industries_en:
    - Software Development
    jobs:
    - 开发者在手机上查看并继续本机运行的编码代理会话，处理多任务与多代理协作
    jobs_en:
    - Developers resuming locally running coding-agent sessions from a phone while coordinating multiple
      tasks and agents
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向日常使用 AI 编码代理的人，把 Codex、Claude Code、DeepSeek 等命令行代理集中到一个桌面与手机端即时通讯界面里，用户可并排开多个会话、在手机上续接本机
      CLI 会话，并把目标拆成任务分派给不同机器人。最终交付是会话与任务结果，具体协作流程与稳定性仍待核验。
    inspiration: 编码代理正从单次对话变成需要调度、续接和多人多机协作的常驻工作流，界面层因此出现空位。切入可考虑为外包团队或小型工作室做代理会话的交接与审计层，按席位或按项目收费，而不是再做一个通用聊天壳。
    summary_en: For people who use AI coding agents daily, it gathers command-line agents such as Codex,
      Claude Code and DeepSeek into one desktop and mobile messaging interface, letting users run sessions
      side by side, resume local CLI sessions from a phone and split goals into tasks for different bots.
      The deliverable is sessions and task results; collaboration flow and reliability still need verification.
    inspiration_en: Coding agents are moving from single conversations to persistent workflows that need
      scheduling, resumption and multi-machine coordination, leaving a gap at the interface layer. A wedge
      is a handoff and audit layer for agent sessions aimed at outsourcing teams or small studios, priced
      per seat or per project rather than as another generic chat shell.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 同时使用多个编码代理的开发者，在离开电脑或需要并行推进多个任务时，要在手机上查看、续接并分派本机运行的代理会话。
        job_en: Developers running several coding agents need to view, resume and dispatch locally running
          agent sessions from a phone when away from the desk or juggling parallel tasks.
        pain_zh: 多个 CLI 代理各自独立，切换终端、记住会话状态、在手机上无法续接，导致并行任务难以管理。
        pain_en: Multiple CLI agents are isolated, so switching terminals, tracking session state and
          resuming from a phone is hard, making parallel work difficult to manage.
        current_alternative_zh: 用户目前靠多个终端窗口、tmux 或远程桌面手动切换和续接会话。
        current_alternative_en: Users currently juggle terminal windows, tmux or remote desktop to switch
          and resume sessions manually.
        usage_reason_zh: 推断：它把多个代理会话收进一个即时通讯式界面并支持手机续接，省去在终端间切换和远程登录的步骤，因此对同时跑多个编码代理的开发者有吸引力；仓库仅有星标，缺少实际使用与留存证据。
        usage_reason_en: 'Inference: it puts multiple agent sessions into one messaging-style interface
          with phone resumption, removing terminal switching and remote login steps, which appeals to
          developers running several coding agents; the repository only shows stars, with no usage or
          retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理会话分散、无法在手机上续接的痛点，交付是可并排查看与分派的会话界面。
        evidence_ids:
        - ev-e0ab8ab239b9dcf7
      - gate: consensus
        status: insufficient
        reason: 仅有仓库 180 星标，属关注度信号，未见用户评价或采用描述。
        evidence_ids:
        - ev-e0ab8ab239b9dcf7
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或商业交付路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-e0ab8ab239b9dcf7
      - gate: truth
        status: insufficient
        reason: 未核验多代理协作的稳定性、手机续接的可靠性及安全边界，确定性交付仍缺一环。
        evidence_ids:
        - ev-e0ab8ab239b9dcf7
      next_validation: 收集该仓库的 issue 与发布说明，查看用户对手机续接、多代理协作稳定性与安全配置的反馈。
