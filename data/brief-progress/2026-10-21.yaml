    slug: latest-open-artifacts-25-deepseek-v41-flash-1017-american-ma
    name: 中国商务部前沿AI模型国际共享预审批政策提案
    decision: market_context
    summary_zh: 2026年10月，中国商务部发布政策提案（尚未成为法律），拟要求前沿AI模型及部分其他技术在向国际共享前获得政府预审批，开源技术将适用自动审批。该提案若落地，将增加中国开源模型跨境发布与海外采用的合规不确定性，并可能影响全球开发者获取低成本开放权重模型的渠道；目前仅为提案，实际影响仍待观察（推断）。
    summary_en: In October 2026, China's Ministry of Commerce released a policy proposal (not yet law)
      that would require frontier AI models and some other technologies to obtain government pre-approval
      before international sharing, with open-source technologies set for automatic approval. If enacted,
      it would add compliance uncertainty to cross-border releases and overseas adoption of Chinese open-weight
      models and could affect global developers' access to low-cost open models; it remains only a proposal,
      so actual impact is still to be observed (inference).
    event_summary_zh: 中国商务部发布政策提案，拟对前沿AI模型及部分技术的国际共享实施政府预审批，开源技术将适用自动审批。
    event_summary_en: China's Ministry of Commerce released a policy proposal to require government pre-approval
      for international sharing of frontier AI models and some technologies, with automatic approval for
      open-source technologies.
