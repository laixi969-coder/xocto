      GPT-6.1 Sol，推理在北美境内处理并保留数据驻留控制。
    event_summary_en: Amazon Bedrock now lets customers in the Canada (Central) and Canada West (Calgary)
      Regions invoke OpenAI GPT-5.6 (Sol, Terra, Luna), GPT-6 (Astra, Sol, Luna) and GPT-6.1 Sol through
      cross-Region inference, with inference processed in North America and data-residency controls retained.
