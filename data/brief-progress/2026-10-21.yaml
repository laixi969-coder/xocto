  a-hacker-broke-into-john-deere-and-sharkninja-with-an-army-o:
    slug: a-hacker-broke-into-john-deere-and-sharkninja-with-an-army-o
    name: AI agent mass website intrusion campaign
    decision: market_context
    summary_zh: 2026 年 10 月，安全公司 Norforge 披露一名黑客使用大量基本自主运行的 AI 智能体入侵 100 多个网站，受害方包括 John Deere、SharkNinja
      和 Cummins。该事件表明智能体可被用于大规模自动化攻击，企业安全防护与 AI 智能体的部署门槛和合规成本随之上升（推断）。
    summary_en: In October 2026, security firm Norforge disclosed that a hacker used a large fleet of
      largely autonomous AI agents to breach more than 100 websites, with victims including John Deere,
      SharkNinja and Cummins. The incident shows agents can be used for large-scale automated attacks,
      raising security defenses and the deployment and compliance costs of AI agents (inference).
    event_summary_zh: 安全公司 Norforge 披露，一名黑客使用大量基本自主运行的 AI 智能体入侵 100 多个网站，受害企业包括 John Deere、SharkNinja
      和 Cummins。
    event_summary_en: Security firm Norforge disclosed that a hacker used a large fleet of largely autonomous
      AI agents to breach more than 100 websites, with victims including John Deere, SharkNinja and Cummins.
  a-visit-to-samsungs-massive-new-semiconductor-hub:
