    name: Samsung Pyeongtaek semiconductor complex
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: 三星在韩国平泽的半导体制造园区已有三座晶圆厂全天候运转，第四座即将投产；第五座建设曾在2024年内存需求下滑时停工，后因AI带来的内存需求激增而重启。
    event_summary_en: Samsung's Pyeongtaek semiconductor manufacturing complex in South Korea has three
      fabs running around the clock and a fourth coming online; construction of a fifth was halted during
      the 2024 memory demand downturn and restarted as AI-driven memory demand surged.
