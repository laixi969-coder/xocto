      AI 应用供给的影响需视具体项目而定，属推断。
    summary_en: The European Institute of Innovation and Technology (EIT) launched a €40 million funding
      call on October 20, 2026, offering up to €1.25 million per selected project over 18 months to help
      universities turn research in manufacturing and deep tech into commercial products. Joint applications
      from universities and businesses may expand early-stage funding and commercialization support for
      European deep tech; effects on AI application supply depend on the projects selected and are inference.
    event_summary_zh: EIT 启动 4000 万欧元的 2026 年资助征集，单个入选项目在 18 个月内最高可获 125 万欧元，申请方须由高校、企业、研究机构或公共机构等联合组成。
    event_summary_en: EIT launched a €40 million 2026 funding call offering up to €1.25 million per selected
