  meta-drops-the-word-train-from-its-commercial-tos-after-ai-b:
    slug: meta-drops-the-word-train-from-its-commercial-tos-after-ai-b
    name: Meta
    decision: market_context
    summary_zh: Meta 在 2026 年 10 月 30 日生效的新商业服务条款引发争议后，删除了条款中“train”一词，且未主动通知用户。该条款此前被专家解读为可借商业主页抓取网站内容用于
      AI 训练，从而规避向新闻机构支付许可费；措辞调整虽回应了批评，但未改变条款实质，增加了企业在 AI 训练数据合规上的不确定性。
    summary_en: After backlash, Meta removed the word "train" from its new commercial terms of service
      taking effect October 30, 2026, without notifying users. Experts had warned the terms could let
      Meta scrape sites linked from business pages for AI training and avoid licensing fees to news organizations;
      the wording change responds to criticism but leaves the substance and compliance uncertainty for
      AI training data unresolved.
    event_summary_zh: Meta 在争议后从其 10 月 30 日生效的商业服务条款中删除“train”一词，且未告知用户条款措辞已变更。
    event_summary_en: Meta removed the word "train" from its commercial terms of service effective October
      30 after backlash, without alerting users to the changed language.
  meta-tries-to-scapegoat-staff-who-downloaded-torrents-to-spa:
    slug: meta-tries-to-scapegoat-staff-who-downloaded-torrents-to-spa
    name: Meta
    decision: market_context
    summary_zh: 2026 年 10 月，美国治安法官 Thomas Hixon 在图书作者集体诉讼及出版商诉讼中作出发现令，要求 Meta 明确指认授权通过 Anna's Archive、LibGen
      等影子图书馆下载书籍用于 AI 训练的高管。Meta 此前以“非正式方式”为由称无人作出决策；该裁定把 AI 训练数据来源的版权责任推向管理层，可能提高企业获取训练数据的法律与合规成本。
    summary_en: In October 2026, Magistrate Judge Thomas Hixon issued a discovery order requiring Meta
      to identify executives who authorized downloading books from shadow libraries such as Anna's Archive
      and LibGen for AI training, in a authors' class action and a publisher suit. Meta had argued its
      early dataset work followed an "informal approach" with no decision-makers; the ruling pushes copyright
      liability for AI training data onto management and may raise legal and compliance costs of sourcing
      training data.
    event_summary_zh: 法院发现令要求 Meta 指认授权从影子图书馆下载书籍用于 AI 训练的高管，涉及作者集体诉讼与出版商诉讼。
    event_summary_en: A court discovery order requires Meta to name executives who authorized downloading
      books from shadow libraries for AI training, in an authors' class action and a publisher lawsuit.
  metas-new-commercial-terms-say-if-its-ai-makes-a-mistake-it:
    slug: metas-new-commercial-terms-say-if-its-ai-makes-a-mistake-it
    name: Meta
    decision: market_context
    summary_zh: Meta 新商业条款规定，若其 AI 出错，法律责任由客户承担。该条款与同期训练数据条款争议叠加，意味着使用 Meta AI 的企业需自行承担输出错误风险，可能影响企业对
      AI 工具的采用意愿与合同责任分配。
    summary_en: Meta's new commercial terms place legal liability on customers when its AI makes a mistake.
      Combined with the parallel dispute over training-data terms, businesses using Meta AI must bear
      the risk of erroneous outputs, which may affect adoption willingness and how contractual liability
      is allocated.
    event_summary_zh: Meta 新商业条款规定其 AI 出错时法律责任归于客户。
    event_summary_en: Meta's new commercial terms state that if its AI makes a mistake, legal liability
      falls on the customer.
