  emudhra-intermediate-ca-compromise:
    slug: emudhra-intermediate-ca-compromise
    name: eMudhra
    decision: market_context
    summary_zh: eMudhra 的八个中间 CA 证书私钥被泄露，这些证书链接受 Mozilla、微软、苹果和 Chrome 根程序及众多下游信任库信任；依赖内置受信证书列表的软件需更新证书清单，uv
      0.13.4、pip 26.2.2 和 certifi 2026.10.19 已发布升级后的证书列表。该事件意味着依赖 TLS 信任链的 AI 应用与工具链必须同步更新证书包，否则面临中间人攻击与交付中断风险（推断）。
    summary_en: The private keys of eight eMudhra intermediate CA certificates were compromised; these
      certificates chain to roots trusted by the Mozilla, Microsoft, Apple and Chrome root programs and
      by many downstream trust stores. Software that bundles a list of trusted certificates needs to update
      it, and uv 0.13.4, pip 26.2.2 and certifi 2026.10.19 have shipped upgraded certificate lists. This
      means AI applications and toolchains relying on the TLS trust chain must update their certificate
      bundles in step or face man-in-the-middle and delivery disruption risks (inference).
    event_summary_zh: eMudhra 八个中间 CA 证书私钥被泄露，相关证书链接受主流根程序信任；uv 0.13.4、pip 26.2.2 和 certifi 2026.10.19
      已发布更新后的证书列表。
    event_summary_en: The private keys of eight eMudhra intermediate CA certificates were compromised,
      and the certificates chain to major root programs; uv 0.13.4, pip 26.2.2 and certifi 2026.10.19
      have released updated certificate lists.
