    decision: market_context
    summary_zh: 美国国土安全部于 2026 年 10 月 20 日下令联邦机构禁用中国 AI 公司 DeepSeek，理由是安全担忧。这一监管限制将压缩 DeepSeek 在美国政府及受联邦合规约束的机构中的使用空间，并可能促使相关采购转向本土模型供应商；对更广泛企业市场的影响尚不明确，属推断。
    summary_en: The U.S. Department of Homeland Security ordered federal agencies on October 20, 2026
      to ban Chinese AI company DeepSeek over security concerns. The regulatory restriction narrows DeepSeek's
      use across U.S. government and federally compliance-bound organizations and may push related procurement
      toward domestic model providers; effects on the broader enterprise market remain unclear and are
      inference.
    event_summary_zh: 美国国土安全部下令联邦机构禁用中国 AI 初创公司 DeepSeek，理由为安全担忧。
    event_summary_en: The U.S. Department of Homeland Security ordered federal agencies to ban Chinese
      AI startup DeepSeek over security concerns.
