  china-reportedly-recruited-ai-exec-to-spy-on-jensen-huang:
    slug: china-reportedly-recruited-ai-exec-to-spy-on-jensen-huang
    name: Nvidia
    decision: market_context
    summary_zh: 据报道，中国国家安全部招募 Megaspeed 高管 Alice Huang，针对英伟达 CEO 黄仁勋收集美国 AI 芯片信息，并试图影响公司对华出口最先进芯片。该事件凸显
      AI 芯片出口管制下的地缘政治与合规风险，可能影响先进算力的跨境供给与获取成本（推断）。
    summary_en: China's Ministry of State Security reportedly recruited Megaspeed executive Alice Huang
      to gather information on US AI chips from Nvidia CEO Jensen Huang and to potentially influence the
      company to make its most advanced chips available to China. The episode highlights geopolitical
