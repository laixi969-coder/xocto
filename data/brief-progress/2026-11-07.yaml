      1 秒内拒绝新请求，已签发令牌 5 分钟内过期，并由 Amazon Bedrock AgentCore 兑换短期访问令牌。
    event_summary_en: 'AWS and Okta published Part 1 describing Okta Cross App Access: agents are registered
      in Okta, administrators approve reachable applications, and Okta evaluates policy on each act-on-behalf
      request; in tests new requests were refused within about 1 second after a user''s assignment was
      removed, issued tokens expired within 5 minutes, and Amazon Bedrock AgentCore redeemed short-lived
      access tokens.'
