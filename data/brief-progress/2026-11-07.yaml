    name: Meta
    decision: market_context
    summary_zh: 2026 年 11 月，Meta 在数周反对声后无限期推迟商业条款更新，该更新原本要求 Meta Business 账户用户允许对 Facebook 外链网站进行大规模 AI
      训练。这一平台政策撤回意味着 AI 训练数据的获取边界与授权成本仍受监管和舆论约束，影响依赖外部网页数据的模型训练与内容授权格局（推断）。
    summary_en: In November 2026, Meta indefinitely delayed a commercial terms update after weeks of backlash;
      the update would have required Meta Business account users to allow extensive AI training on external
      websites linked on Facebook. This platform policy retreat means the boundaries and licensing costs
      of AI training data remain constrained by regulation and public pressure, affecting model training
      and content licensing that rely on external web data (inference).
    event_summary_zh: Meta 在数周反对声后无限期推迟商业条款更新，该更新原本要求 Meta Business 账户用户允许对 Facebook 外链网站进行大规模 AI 训练。
    event_summary_en: After weeks of backlash, Meta indefinitely delayed a commercial terms update that
      would have required Meta Business account users to allow extensive AI training on external websites
      linked on Facebook.
  dont-waste-a-good-backlash:
    slug: dont-waste-a-good-backlash
    name: Don’t waste a good backlash
    decision: market_context
    summary_zh: 2026年美国中期选举后，民主党明确将对人工智能加强审查，关注点包括AI安全、对劳动力市场的影响、权力集中以及数据中心选址争议；纳斯达克市值蒸发逾2.5万亿美元，投资者撤离AI基础设施环节。美国选民通过了44项地方措施中的43项以放缓数据中心建设。这意味着AI基础设施扩张面临更高的地方审批与社区成本，超大规模厂商为换取建设速度可能支付更高代价，进而影响AI应用的成本与交付节奏（推断）。
    summary_en: After the 2026 US midterms, Democrats made clear that artificial intelligence would face
      heightened scrutiny over AI safety, labor-market impact, concentration of power and data-center
      siting; more than $2.5 trillion was wiped off the Nasdaq as investors fled the infrastructure side
      of the AI trade. US voters passed 43 of 44 local measures to slow data-center construction. This
      implies higher local approval and community costs for AI infrastructure build-out, and hyperscalers
      may pay more for speed, affecting the cost and delivery pace of AI applications (inference).
    event_summary_zh: 2026年美国中期选举后，民主党表明将对AI加强审查，美国选民通过44项地方措施中的43项以放缓数据中心建设，纳斯达克市值蒸发逾2.5万亿美元。
    event_summary_en: After the 2026 US midterms, Democrats signaled heightened scrutiny of AI, US voters
      passed 43 of 44 local measures to slow data-center construction, and more than $2.5 trillion was
      wiped off the Nasdaq.
