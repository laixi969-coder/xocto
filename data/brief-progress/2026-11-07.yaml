    name: Ramp data shows AI spending stalling just as Anthropic nears its IPO
    decision: market_context
    summary_zh: 2026年11月，Ramp 的数据显示 AI 使用量持续上升，但企业 AI 支出已经停滞，主要支出方通过降价和更精细的成本控制压缩开支。这意味着 AI 应用的单次调用成本下降、企业采购更趋理性，可能削弱投资者对
      AI 超高速增长的假设，并加剧模型与云服务商之间的价格与效率竞争。
    summary_en: In November 2026, Ramp data showed AI usage continuing to climb while enterprise AI spending
      stalled, with the largest spenders cutting costs through price reductions and tighter cost controls.
      This implies lower per-call costs and more disciplined enterprise procurement, potentially undercutting
      investor assumptions of AI hypergrowth and intensifying price and efficiency competition among model
      and cloud providers.
    event_summary_zh: Ramp 数据显示，2026年11月 AI 使用量继续增长，但企业 AI 支出停滞，主要支出方转向降价与成本控制。
    event_summary_en: Ramp data showed that in November 2026 AI usage kept climbing while enterprise AI
      spending stalled, as major spenders shifted to price cuts and cost controls.
