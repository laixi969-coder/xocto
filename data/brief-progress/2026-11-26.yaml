      and machines in traffic analytics, which undermines the old way of pricing and evaluating content
      by human visits. Entry: start from the traffic accounting step of content sites, e-commerce and
      ad-monetized publishers, turning ''agent traffic share'' into a reconcilable report, then consider
      charging per site or per monitored traffic; pricing is not disclosed.'
