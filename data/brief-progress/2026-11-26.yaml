    summary_zh: SAP 顾问或企业 IT 人员在核对 S/4HANA 里的库存、订单、供应商记录时，打开这个只读 MCP 服务器，让 AI 助手通过 RFC/BAPI、私有云 OData
      或公有云已发布 API 取数并整理成答复；每次调用留审计记录，凭证留在本地，最终结论仍需人工确认。具体部署流程与交付形态仍待核验。
    inspiration: 趋势：企业核心系统开始被拆成可被 AI 只读访问的数据接口，而不是先做聊天界面。切入：从 SAP 顾问与实施外包团队入手，卖按查询或按审计合规交付的只读取数服务，先解决“查一条数据要跑事务码”的旧步骤；不要从通用
      ERP 助手正面打。
    summary_en: When SAP consultants or enterprise IT staff need to check inventory, order or vendor records
      in S/4HANA, they run this read-only MCP server so an AI assistant can fetch data via RFC/BAPI, private-cloud
      OData or public-cloud released APIs and compile an answer; every call is audited and credentials
      stay local, with human confirmation still required. Deployment flow and delivery form remain to
      be verified.
    inspiration_en: 'Trend: core enterprise systems are being exposed as read-only data interfaces for
      AI rather than as chat UIs first. Entry: start with SAP consultants and implementation outsourcers,
      selling read-only data access billed per query or per audit-compliant delivery, replacing the old
      step of running a transaction code to look up one record; do not attack head-on with a generic ERP
      assistant.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: SAP 顾问或企业 IT 人员在核对 S/4HANA 中的库存、订单或供应商记录时，让 AI 助手读取这些数据并整理成可读答复。
        job_en: SAP consultants or enterprise IT staff checking inventory, order or vendor records in
          S/4HANA let an AI assistant read the data and compile a readable answer.
        pain_zh: 旧做法要记事务码、手工导出表格或找 BASIS 开权限，查一条记录耗时长，且把凭证交给第三方有合规顾虑。
        pain_en: The old way requires memorizing transaction codes, manually exporting spreadsheets or
          asking BASIS for access; a single lookup is slow and handing credentials to third parties raises
          compliance concerns.
        current_alternative_zh: 手工跑 SAP 事务码、导出 Excel 再人工比对，或由内部开发写定制报表。
        current_alternative_en: Manually running SAP transaction codes, exporting to Excel for human comparison,
          or having internal developers build custom reports.
        usage_reason_zh: 推断：相较手工跑事务码和导出表格，它把取数动作交给 AI 助手直接调用只读接口，省掉导出与格式整理一步，并以本地凭证和逐次审计降低合规阻力，因此需要频繁查
          SAP 数据的顾问会先试用。
        usage_reason_en: 'Inference: versus manually running transaction codes and exporting spreadsheets,
          it lets the AI assistant call read-only interfaces directly, removing the export-and-reformat
          step and lowering compliance friction via local credentials and per-call auditing, so consultants
          who query SAP data often would try it first.'
      gates:
