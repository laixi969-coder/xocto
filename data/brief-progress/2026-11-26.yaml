  lasik:
    slug: lasik
    name: lasik
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 编码代理在受 BLA 加固的代码库上工作时，需要读取真实源码以完成修改或逆向分析任务
    jobs_en:
    - Coding agents working on BLA-hardened codebases need to read the real source to complete edits or
      reverse-engineering tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 当编码代理或逆向分析人员面对经过 BLA（Blind LLM Agents）加固、源码被遮蔽的代码库时，lasik 以静态 CLI 和 MCP 服务的形式接收目标代码，还原出可读的真实源码，且不执行目标程序。用户拿到的是去遮蔽后的代码文本，供代理继续阅读或分析；具体还原范围与准确度仍待核验。
    inspiration: 趋势：代理开始被当作需要“看得见代码”的正式使用者，围绕代理可读性的工具层正在出现。切入：从安全审计、遗留系统逆向这类必须读真实源码的环节进入，面向做代码审计或代理基础设施的团队，按审计项目或工具授权收费；但这类去遮蔽工具与安全加固方向天然对立，合规边界要先想清楚。
    summary_en: When coding agents or reverse engineers face a codebase hardened with BLA (Blind LLM Agents)
      where source is obscured, lasik takes the target code as a static CLI and MCP server and reconstructs
      readable real source without executing the target. Users get de-obscured code text for the agent
      to keep reading or analyzing; the exact scope and accuracy of reconstruction still need verification.
    inspiration_en: 'Trend: agents are being treated as legitimate readers of code, spawning a tooling
      layer around agent readability. Entry: start from security audit and legacy reverse engineering
      where real source must be read, selling to audit or agent-infrastructure teams per audit project
      or tool license; but de-obfuscation inherently opposes hardening, so compliance boundaries must
      be settled first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 编码代理或逆向分析人员在遇到被 BLA 加固、源码不可读的代码库时，需要还原出可读源码以继续修改或分析任务。
        job_en: Coding agents or reverse engineers facing a BLA-hardened codebase with unreadable source
          need to reconstruct readable source to continue edits or analysis.
        pain_zh: 加固后的代码对代理不可读，代理无法定位和修改逻辑，人工逆向又慢又易错。
        pain_en: Hardened code is unreadable to agents, which cannot locate or modify logic, while manual
          reverse engineering is slow and error-prone.
        current_alternative_zh: 人工逐段逆向、手动去混淆，或直接放弃让代理处理这类代码。
        current_alternative_en: Manual step-by-step reverse engineering, hand de-obfuscation, or simply
          not letting agents touch such code.
        usage_reason_zh: 推断：相较人工去混淆，lasik 以静态方式一次性还原可读源码且不执行目标，省去逐段手工还原这一步，因此做代码审计或代理基础设施的团队在遇到加固代码时会选择它；尚无用户反馈或案例支持这一动机。
        usage_reason_en: 'Inference: versus manual de-obfuscation, lasik statically reconstructs readable
          source in one pass without executing the target, removing the step of hand-restoring each segment,
          so audit or agent-infrastructure teams would pick it on hardened code; no user feedback or cases
          yet support this motive.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理读不到加固代码、无法继续修改或分析的需求，痛点在审计与逆向场景中刚性，交付为可读源码文本。
        evidence_ids:
        - ev-e42f9c953c4cc873
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标约 150 的社区关注，缺少用户评价或采用案例，无法判断是否形成使用共识。
        evidence_ids:
        - ev-e42f9c953c4cc873
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，商业化模式尚不清晰。
        evidence_ids:
        - ev-e42f9c953c4cc873
      - gate: truth
        status: insufficient
        reason: 去遮蔽与安全加固方向对立，合规与滥用边界未在材料中说明，交付准确度也未核验。
        evidence_ids:
        - ev-e42f9c953c4cc873
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有真实用户报告在审计或逆向场景中使用并反馈还原效果。
