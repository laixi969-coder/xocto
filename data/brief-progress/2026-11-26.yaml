      Blender 场景，仍需人工检查与微调。具体交付质量与出错后的修正流程仍待核验。
    inspiration: 趋势：三维内容生产正从手工建模转向“用文字下指令、由代理在软件内执行操作”，Blender 这类开源工具成为接入点。切入：面向影视分镜、游戏原型和建筑可视化的外包团队，按场景或镜头交付而非按席位收费；但需先确认代理操作的可控性与返工成本，否则只是把建模负担换成调试负担。
    summary_en: When 3D artists receive a written brief or storyboard, they open this chat studio inside
      Blender, describe the scene in natural language, and multi-agent teams call 27 built-in scene tools
      to perform modeling and scene operations in Blender, producing an editable Blender scene that still
      needs manual review and refinement. Delivery quality and error-recovery flow remain to be verified.
    inspiration_en: 'Trend: 3D content production is shifting from manual modeling toward natural-language
      instructions executed by agents inside the software, with open tools like Blender as the entry point.
      Entry: target outsourced teams in storyboarding, game prototyping and architectural visualization,
      selling per scene or shot rather than per seat; first confirm controllability and rework cost, or
      the modeling burden just becomes a debugging burden.'
