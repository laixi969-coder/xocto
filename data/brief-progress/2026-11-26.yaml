        job_zh: 接手遗留系统的开发者在维护或重构前，把现有源码整理成可追溯的规格说明，以便理解系统并规划改动。
        job_en: Developers inheriting legacy systems turn existing source into traceable specifications
          before maintaining or refactoring, so they can understand the system and plan changes.
        pain_zh: 遗留系统缺少文档，开发者需逐文件阅读源码才能理解逻辑，耗时且易遗漏关键约束。
