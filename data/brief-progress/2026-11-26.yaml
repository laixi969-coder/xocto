    name: AMD ROCm 10
    decision: market_context
    event_summary_zh: AMD 发布 ROCm 10 软件栈，宣称用于加速 AI 开发与性能；候选材料只有标题，未给出性能对比数据、支持的芯片型号或发布时间之外的采用情况。
    event_summary_en: AMD released the ROCm 10 software stack, described as accelerating AI development
      and performance; the candidate material is headline-only, with no benchmark comparisons, supported
      chip models or adoption evidence beyond the announcement.
    summary_zh: AMD 发布 ROCm 10 软件栈，属于面向开发者的底层软件更新，而非独立应用产品。它可能影响在非英伟达硬件上训练和推理的成本结构，但材料未提供性能数据或采用情况，因此只能作为基础层竞争背景，不能推断算力市场格局已改变。
    summary_en: AMD released the ROCm 10 software stack, a developer-facing infrastructure update rather
      than a standalone application. It may affect the cost structure of training and inference on non-Nvidia
      hardware, but the material offers no performance data or adoption evidence, so it is only background
      on infrastructure competition and cannot support a claim that the compute market has shifted.
    inspiration: 趋势是算力供给方在软件栈上争夺开发者，以降低对单一芯片厂商的依赖；切入不在自研编译器，而在把特定行业模型的迁移与调优做成可交付服务，按迁移结果收费。
    inspiration_en: The trend is compute suppliers competing for developers at the software-stack layer
      to reduce dependence on a single chip vendor; the opening is not building a compiler but packaging
      migration and tuning of industry-specific models as a deliverable service, priced on migration outcomes.
