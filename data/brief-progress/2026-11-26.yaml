  devvm:
    slug: devvm
    name: devvm
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息技术服务
    industries_en:
    - software development
    - IT services
    jobs:
    - 开发者在切换多个项目或让编码代理接手任务时，需要为每个项目准备隔离环境并配置工具链，以便安全地开始写代码或运行代理
    jobs_en:
    - Developers switching between multiple projects or handing tasks to a coding agent need an isolated
      per-project environment with the toolchain configured, so they can safely start coding or run the
      agent
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在多个项目间切换，或让编码代理接手任务时，打开 devvm 为每个项目准备一台带好工具链的隔离虚拟机，代理或人直接在沙箱里开始写代码。最终交付是一个可用的隔离开发环境；具体如何创建、复用和回收环境仍待核验。
    inspiration: 趋势：编码代理开始承担实际任务后，环境隔离与工具链准备从开发者个人习惯变成代理能否安全运行的前置条件。切入：面向同时维护多个仓库、又让代理跑代码的小型工程团队，按项目或按代理运行次数提供托管沙箱；开源版已积累关注，但托管与计费方式尚未披露。
    summary_en: When developers switch between projects or hand tasks to a coding agent, they open devvm
      to get an isolated VM per project with the toolchain already set up, so the agent or the person
      can start coding inside a sandbox. The deliverable is a usable isolated dev environment; how environments
      are created, reused and torn down still needs verification.
    inspiration_en: 'Trend: as coding agents take on real tasks, environment isolation and toolchain setup
      move from a personal habit to a precondition for running agents safely. Entry: serve small engineering
      teams maintaining several repos and running agents on code, with hosted sandboxes priced per project
      or per agent run; the open-source project has gathered attention, but hosting and pricing are not
      disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在多个项目间切换，或让编码代理接手任务时，需要为每个项目准备隔离环境并配好工具链，以便安全开始写代码或运行代理。
        job_en: Developers switching between projects or handing tasks to a coding agent need an isolated
          per-project environment with the toolchain configured, so they can safely start coding or run
          the agent.
        pain_zh: 手工为每个项目搭环境、处理依赖冲突和代理误改本机文件，是重复且易出错的一步；不解决的后果是代理跑不起来或污染本地环境。
        pain_en: Manually setting up each project's environment, handling dependency conflicts and preventing
          agents from altering local files is repetitive and error-prone; without it, agents fail to run
          or pollute the local machine.
        current_alternative_zh: 开发者通常手工配置本地环境、用容器或脚本自建沙箱，或依赖云开发环境；这些做法需要自己维护工具链和隔离边界。
        current_alternative_en: Developers typically configure local environments by hand, build sandboxes
          with containers or scripts, or rely on cloud dev environments; these require maintaining the
          toolchain and isolation boundary themselves.
        usage_reason_zh: 推断：相较手工搭环境和自建容器，devvm 以“每个项目一台预装工具链的隔离虚拟机”减少配置与隔离维护这一步，让代理可直接在沙箱内运行；同时维护多仓库并跑代理的开发者会因此选择它。
        usage_reason_en: 'Inference: compared with manual setup and self-built containers, devvm reduces
          the configuration and isolation-maintenance step by giving each project a pre-provisioned isolated
          VM, letting agents run inside the sandbox; developers maintaining several repos and running
          agents would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决为每个项目准备隔离环境与工具链的需求，痛点是重复配置和代理污染本机；旧做法是手工搭环境或自建容器，结构上成立。
        evidence_ids:
        - ev-c91083c26490dbb7
        - ev-e77f714a16382c86
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度持续上升，缺少用户评价、客户案例或社区讨论说明真实采用与选择动机。
        evidence_ids:
        - ev-e77f714a16382c86
      - gate: model
        status: insufficient
        reason: 未披露定价、托管方式或买方；开源项目可能的付费路径是托管沙箱或团队版，这是判断而非已验证事实。
        evidence_ids:
        - ev-c91083c26490dbb7
      - gate: truth
        status: insufficient
        reason: 隔离与工具链预装能否确定性交付、代理运行的安全边界如何，公开材料未给出可核验细节。
        evidence_ids:
        - ev-c91083c26490dbb7
      next_validation: 收集 devvm 官方文档或仓库 README 中关于环境创建、隔离边界与是否提供托管或定价的公开说明。
    event_summary_zh: devvm 于 2026-11-06 发布，定位为每个项目一台带工具链的隔离虚拟机，供人或编码代理直接开始写代码；其仓库关注度从 11 月中旬的 633 持续升至
      11 月 26 日的 805。
    event_summary_en: devvm launched on 2026-11-06 as one isolated VM per project with the toolchain ready,
      for a person or coding agent to start coding; its repository attention rose steadily from 633 in
      mid-November to 805 on 2026-11-26.
