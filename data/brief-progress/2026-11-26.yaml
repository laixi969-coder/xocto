        job_zh: 短视频运营者与播客制作人在直播或长访谈结束后，面对数小时原始录像，要挑出高光片段并剪成可发布的竖屏短片。
        job_en: Short-video operators and podcast producers, after a livestream or long interview, face
          hours of raw footage and must pick highlight segments and cut them into publishable vertical
          shorts.
        pain_zh: 人工回看数小时素材、标记时间点再逐段剪辑，是重复且耗时的机械劳动；把素材上传到第三方云剪辑工具又带来素材外泄与按量计费的顾虑。
        pain_en: Manually reviewing hours of footage, marking timestamps and cutting segment by segment
          is repetitive mechanical labor; uploading to third-party cloud clipping tools raises footage-leakage
          and metered-cost concerns.
        current_alternative_zh: 旧做法是剪辑师用 Premiere 等软件拖时间轴人工切片，或使用云端自动切片服务并上传全部素材。
