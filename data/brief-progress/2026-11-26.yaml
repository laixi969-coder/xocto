      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标增长，缺少顾问或企业实际采用、部署案例的公开证据。
        evidence_ids:
        - ev-84862d1664f65658
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是实施商或企业 IT，属判断而非已验证事实。
        evidence_ids:
        - ev-7479bce34f978892
      - gate: truth
        status: insufficient
        reason: 只读与审计设计贴近合规目标，但未见真实环境部署与交付结果，确定性交付仍待核验。
        evidence_ids:
        - ev-7479bce34f978892
