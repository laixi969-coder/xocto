        status: insufficient
        reason: 它试图解决求职材料与职业方向缺乏针对性的问题，但公开材料未说明具体输入、动作与交付，痛点刚性无法确认。
        evidence_ids:
        - ev-09b9b8693edce293
        - ev-61fbb4f1ffffd01e
        - ev-23624d66564eb9b6
