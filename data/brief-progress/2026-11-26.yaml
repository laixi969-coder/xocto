        evidence_ids:
        - ev-ef0e9733a5ef2079
      - gate: truth
        status: insufficient
        reason: 缓存保活与崩溃恢复能否确定性交付、节省多少 token 均无公开实测。
        evidence_ids:
        - ev-ef0e9733a5ef2079
      next_validation: 收集仓库 issue 与 README 中的实测说明，核验缓存保活与崩溃恢复的实际效果及 token 节省数据。
