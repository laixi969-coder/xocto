  fireworks-ai:
    slug: fireworks-ai
    name: Fireworks AI
    decision: market_context
    event_summary_zh: 2026年11月，Fireworks AI 在数周内第二次通报安全事件，黑客经由该平台访问了 Notion 客户的聊天记录；同期报道称客户因 GPU 供给紧张而非安全因素继续留用。这属于模型推理与路由基础设施的供给与信任问题，不是独立应用产品的新增事实。
    event_summary_en: In November 2026, Fireworks AI disclosed a second security incident within weeks,
      with hackers reaching Notion customers' chat transcripts through the platform; reporting meanwhile
      said customers stayed because of GPU scarcity rather than security. This is a supply-and-trust issue
      in model inference and routing infrastructure, not a new fact about a standalone application product.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Fireworks AI 是面向开发者的模型推理与多模型路由服务，客户把模型调用交给它运行。本批材料只涉及安全事件与 GPU 供给紧张，未提供可核验的独立应用工作流或交付结果。
    inspiration: 推理与路由层正在被 GPU 供给和供应链安全重新定价：买方选择供应商时，算力可得性压过安全承诺。切入不在再做一个聚合层，而在为受监管行业提供可审计的私有推理与数据隔离交付，按合规结果而非
      token 计价。
    summary_en: Fireworks AI is a developer-facing model inference and multi-model routing service that
      runs customers' model calls. This batch only covers security incidents and GPU scarcity, with no
      verifiable standalone application workflow or delivery outcome.
    inspiration_en: 'The inference and routing layer is being repriced by GPU supply and supply-chain
      security: buyers weigh compute availability above security promises. The opening is not another
      aggregation layer but auditable private inference and data isolation for regulated industries, priced
      on compliance outcomes rather than tokens.'
  flashbrowse:
    slug: flashbrowse
    name: flashbrowse
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息服务
    industries_en:
    - Software and IT services
    jobs:
    - AI 代理开发者需要让代理读取网页内容时，把网页结构压缩成代理可处理的输入并执行浏览器操作
    jobs_en:
    - AI agent developers who need agents to read web pages compress page structure into agent-consumable
      input and drive browser actions
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向构建网页操作代理的开发者：代理需要读取网页时，它把页面结构压缩成更省 token 的输入，并驱动无头浏览器执行点击等操作，最终让代理拿到可继续处理的结果。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势是代理开始直接操作网页，网页读取与 token 成本成为一层独立供给。切入可从需要批量抓取并操作网页的垂直流程（如电商比价、表单填报）做起，按任务结果收费，而非只卖浏览器组件。
    summary_en: 'For developers building web-operating agents: when an agent needs to read a page, it
      compresses page structure into a more token-efficient input and drives a headless browser to perform
      actions such as clicks, so the agent receives a result it can continue processing. The exact delivery
      form and human confirmation step remain to be verified.'
    inspiration_en: The trend is agents operating web pages directly, making page reading and token cost
      a separate supply layer. An entry point is vertical flows that need bulk page reading and action
      (e.g. price comparison, form filling), charging per task outcome rather than selling a browser component.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 代理开发者在让代理读取和操作网页时，需要把页面内容转成代理能处理的输入，并完成点击、跳转等动作。
        job_en: AI agent developers, when having agents read and operate web pages, need to convert page
          content into agent-consumable input and complete clicks and navigation.
        pain_zh: 原始网页对代理来说冗长且噪声大，token 消耗高、解析慢，开发者要自己拼浏览器与解析链路。
        pain_en: Raw web pages are verbose and noisy for agents, consuming many tokens and parsing slowly,
          forcing developers to stitch together browser and parsing pipelines themselves.
        current_alternative_zh: 开发者自行组合无头浏览器、HTML 解析与提示词裁剪，或使用通用浏览器自动化工具。
        current_alternative_en: Developers combine headless browsers, HTML parsing and prompt trimming
          themselves, or use general browser automation tools.
        usage_reason_zh: 推断：它把页面结构压缩后直接交给代理，省去开发者自建解析与裁剪环节，因此需要低成本网页读取的代理开发者会试用；但尚无用户反馈或持续使用证据。
        usage_reason_en: 'Inference: it compresses page structure and hands it to the agent, removing
          the need for developers to build parsing and trimming themselves, so agent developers needing
          low-cost page reading may try it; there is no user feedback or sustained-use evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理读取网页时 token 高、解析慢的问题，痛点具体，替代的是开发者自建浏览器与解析链路。
        evidence_ids:
        - ev-c38193504abe365a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数变化，缺少用户评价、issue 讨论或采用案例，无法判断真实使用。
        evidence_ids:
        - ev-c38193504abe365a
        - ev-ca92c202b4a52f42
        - ev-b3c8667bc3bc7325
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-c38193504abe365a
      - gate: truth
        status: insufficient
        reason: 未见与具体工作流绑定的交付结果或人工边界说明，承诺能否确定性交付仍缺证据。
        evidence_ids:
        - ev-c38193504abe365a
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有开发者描述实际接入代理工作流的使用场景与结果。
