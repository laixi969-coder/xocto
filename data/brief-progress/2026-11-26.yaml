        evidence_ids:
        - ev-69cefd60439be4c8
      - gate: truth
        status: insufficient
        reason: 会话挖掘结论是否可复核、人工确认边界如何设定均未说明，交付确定性无法核对。
        evidence_ids:
        - ev-69cefd60439be4c8
