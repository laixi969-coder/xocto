      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 短视频运营者在准备新脚本时，拆解已有爆款视频的脚本结构与节奏，产出可编辑的复刻方案和多个成本估算版本。
        job_en: Short-video operators deconstruct the script structure and pacing of existing hit videos
          when preparing new scripts, producing editable replication plans and multiple cost-estimated
          variants.
        pain_zh: 爆款结构靠人反复看片、手记拆解，慢且依赖个人经验，换人就走样。
        pain_en: Hit structures are deconstructed by repeated manual viewing and note-taking, which is
