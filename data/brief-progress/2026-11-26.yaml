  blender-ai-copilot-lab:
    slug: blender-ai-copilot-lab
    name: blender-ai-copilot-lab
    decision: watching
    event_summary_zh: 该开源仓库于2026年11月12日发布，提供在Blender内以管理者—执行者—审阅者代理团队执行多步场景简报的实验环境，含任务看板、审阅发现、每个受阻任务一次纠正尝试、具名撤销与内置MCP服务器；截至11月26日约507星、13次分叉、45个未关闭议题。
    event_summary_en: The open-source repository was published on 2026-11-12, offering an experimental
      environment inside Blender where manager–worker–reviewer agent teams execute multi-step scene briefs,
      with a live task board, review findings, one correction attempt per blocked task, named undo and
      a built-in MCP server; by 2026-11-26 it had about 507 stars, 13 forks and 45 open issues.
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与游戏美术
    - 影视与广告制作
    industries_en:
    - 3D animation and game art
    - Film and advertising production
    jobs:
    - 三维美术师在接到场景搭建简报时，让代理团队在Blender中分步生成并审阅场景，自己通过任务看板确认或撤销改动
    - 独立动画制作者在赶交付时，用代理批量处理重复建模与布置步骤，并逐项核对审阅发现
    jobs_en:
    - A 3D artist receiving a scene brief lets agent teams build and review the scene step by step in
      Blender, confirming or undoing changes via the task board
    - An independent animator facing a deadline uses agents to handle repetitive modeling and layout steps
      and checks review findings item by item
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师接到场景搭建简报后，在Blender内启动管理者—执行者—审阅者代理团队，由代理分步执行建模与布置，任务看板实时显示进度与审阅发现，受阻任务可尝试一次纠正，用户可具名撤销改动并最终确认场景。具体交付质量与人工确认比例仍待核验。
    inspiration: 趋势：三维内容生产正从“人逐步操作软件”转向“人审阅代理的分步产出”，审阅与撤销机制成为关键。切入：面向接外包单的小型动画与游戏美术团队，按场景或镜头交付收费，先解决重复布置与返工核对这一环；价格未披露，需自行设计。
    summary_en: After receiving a scene brief, a 3D artist starts manager–worker–reviewer agent teams
      inside Blender; the agents execute modeling and layout step by step, a live task board shows progress
      and review findings, blocked tasks get one correction attempt, and the user can undo named changes
      before confirming the scene. Delivery quality and the share of human confirmation still need verification.
    inspiration_en: 'Trend: 3D content production is shifting from people operating software step by step
      to people reviewing agents'' stepwise output, making review and undo mechanisms critical. Entry:
      target small outsourced animation and game-art teams, charge per scene or shot, and start with repetitive
      layout and rework checking; pricing is undisclosed and must be designed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在接到场景搭建简报时，需要把文字需求变成Blender中可用的场景，并逐项确认代理改动是否正确。
        job_en: When a 3D artist receives a scene brief, they must turn the text requirement into a usable
          Blender scene and confirm item by item whether agent changes are correct.
        pain_zh: 场景搭建包含大量重复建模与布置步骤，手工逐步操作耗时，且代理自动改动后难以追溯和回退，返工成本高。
        pain_en: Scene building involves many repetitive modeling and layout steps; manual step-by-step
          work is slow, and agent-made changes are hard to trace and roll back, raising rework cost.
        current_alternative_zh: 美术师通常在Blender中手工逐步搭建，或使用零散脚本与通用聊天助手生成片段，再自行拼接和检查。
        current_alternative_en: Artists typically build step by step manually in Blender, or use scattered
          scripts and general chat assistants to generate fragments, then stitch and check them themselves.
        usage_reason_zh: 推断：相较手工逐步搭建，该工具把多步场景简报拆给代理团队执行，并用任务看板、审阅发现和具名撤销减少逐项核对与回退的负担，因此接单量大的美术师在重复布置环节可能选择它；尚无用户反馈证实。
        usage_reason_en: 'Inference: compared with manual step-by-step building, the tool splits multi-step
          scene briefs across agent teams and uses a task board, review findings and named undo to reduce
          item-by-item checking and rollback burden, so high-volume artists may choose it for repetitive
          layout; no user feedback confirms this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决三维美术师把场景简报变成可用场景时的重复搭建与改动追溯痛点，旧流程是手工逐步操作，结构上成立。
        evidence_ids:
        - ev-7f6eeb413c7d3ba1
        - ev-76a2af8098b06b2f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数与分叉，缺少用户评价、客户案例或重复使用证据，无法判断是否形成持续采用。
        evidence_ids:
        - ev-76a2af8098b06b2f
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是工作室或个体美术师，属判断而非已验证事实。
        evidence_ids:
        - ev-7f6eeb413c7d3ba1
      - gate: truth
        status: insufficient
        reason: 代理分步产出能否确定性交付可用场景、人工确认比例多高，公开材料未说明，需实测。
        evidence_ids:
        - ev-7f6eeb413c7d3ba1
        - ev-66a61432d95c3a03
      next_validation: 收集该仓库的issue与discussion，查看是否有用户报告实际完成场景交付及人工确认比例。
