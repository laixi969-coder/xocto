    summary_zh: 使用 Google Antigravity 的开发者，在长会话里遇到上下文配额耗尽或会话崩溃时打开这个插件；它自动保持缓存热度、显示实时上下文用量并尝试恢复崩溃会话，最终让用户拿到未中断的会话和更少的
      token 消耗。具体恢复机制与效果仍待核验。
