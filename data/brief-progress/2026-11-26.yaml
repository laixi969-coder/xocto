        evidence_ids:
        - ev-10f7b204039a70d2
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是工作室内部自建或外包计费，属判断而非已验证事实。
        evidence_ids:
        - ev-20a13f3d93d0d092
      - gate: truth
