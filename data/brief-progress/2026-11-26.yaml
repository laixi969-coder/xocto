    summary_zh: 2026年11月25日，美国多州总检察长对Character.AI破产出售方案提出异议，指出该交易拟转让逾2100万个美国账户的敏感个人数据，其中210万个账户注册者为未成年人。这一监管介入表明，AI对话产品积累的用户私密数据在资产处置中正面临隐私合规审查，可能抬高同类AI应用的数据资产交易与合规成本。
