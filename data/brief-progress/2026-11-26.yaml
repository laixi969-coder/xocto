        job_zh: 使用多个 AI 编码工具的团队负责人在成本复盘时，需要弄清各工具与成员的 AI 花费去向并决定调整。
        job_en: A team lead using several AI coding tools needs to see where AI spend goes across tools
          and members during cost review and decide what to adjust.
        pain_zh: 多工具订阅后 AI 支出分散，难以归因到人或项目，超支时找不到原因。
        pain_en: With multiple subscriptions, AI spend is scattered and hard to attribute to people or
          projects, so overruns have no clear cause.
        current_alternative_zh: 各工具后台账单、手工表格汇总或财务事后对账。
        current_alternative_en: Each tool's own billing dashboard, manual spreadsheets, or after-the-fact
          finance reconciliation.
        usage_reason_zh: 推断：只读 MCP 服务把分散在各工具的用量与花费汇总成可查询的答案，省去逐个后台导出再手工合并的一步，因此多工具并用的团队在月度复盘时会选择它；尚无用户反馈证实。
        usage_reason_en: 'Inference: the read-only MCP service aggregates usage and spend across tools
          into a queryable answer, removing the step of exporting each dashboard and merging by hand,
          so multi-tool teams would pick it at monthly review; no user feedback confirms this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多工具 AI 支出分散、难以归因的痛点，成本复盘是真实且反复发生的工作节点。
        evidence_ids:
        - ev-a65f7fee24c3988e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数变化，无用户评价或团队采用证据，共识未形成。
        evidence_ids:
        - ev-9130d35204ef24f4
        - ev-a65f7fee24c3988e
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，付费路径不清；这是判断，不是已验证事实。
        evidence_ids:
        - ev-a65f7fee24c3988e
      - gate: truth
        status: insufficient
        reason: 未说明数据接入方式与只读边界，能否确定性交付花费归因无法核对。
        evidence_ids:
        - ev-a65f7fee24c3988e
      next_validation: 收集 TraxAgent 官网的接入文档或定价页，核验其数据来源、支持的 AI 工具范围与计费方式。
  user-interview-skill:
    slug: user-interview-skill
    name: user-interview-skill
    decision: watching
    category: AI + 商业
    project_type: open_source
    industries:
    - 用户研究
    - 产品设计
    industries_en:
    - user research
    - product design
    jobs:
    - 产品研究员在准备一对一访谈时，把研究目标整理成中性、不诱导的访谈提纲，供后续访谈执行使用
    jobs_en:
    - Product researchers preparing one-on-one interviews turn research goals into neutral, non-leading
      interview guides for later interview execution
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 产品研究员在准备一对一用户访谈时，把研究目标交给它，由 AI 生成一份措辞中性的访谈提纲，供 Claude Code、Codex、Cursor 等编码代理使用；用户拿到的是可直接照着提问的提纲，具体流程与交付质量仍待核验。
    inspiration: 趋势：访谈提纲这类研究前置工作正被拆成可复用的代理技能，说明垂直研究流程开始被 AI 接管。切入：从独立研究者和小型产品团队入手，把“避免诱导性提问”做成可核对的产出标准，而非通用提示词。
    summary_en: When product researchers prepare one-on-one user interviews, they hand their research
      goals to this agent skill, which generates a neutral, non-leading interview guide for use in Claude
      Code, Codex and Cursor; the user gets a guide they can follow when asking questions, though the
      exact workflow and output quality remain to be verified.
    inspiration_en: 'Trend: interview-guide drafting is being split into reusable agent skills, showing
      vertical research workflows starting to be taken over by AI. Entry: start with independent researchers
      and small product teams, making ''avoid leading questions'' a checkable output standard rather than
      a generic prompt.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 产品研究员在准备一对一用户访谈时，把研究目标整理成中性、不诱导的访谈提纲，供后续访谈执行使用。
        job_en: Product researchers preparing one-on-one interviews turn research goals into neutral,
          non-leading interview guides for later interview execution.
        pain_zh: 访谈提纲容易写成诱导性问题，导致访谈结果失真，而研究员往往缺少时间反复打磨措辞。
        pain_en: Interview guides easily become leading questions, distorting results, and researchers
          often lack time to refine wording repeatedly.
        current_alternative_zh: 研究员自己手写提纲，或套用模板后人工修改措辞。
        current_alternative_en: Researchers write guides by hand or adapt templates and manually revise
          wording.
        usage_reason_zh: 推断：相较手写或套模板，它直接在编码代理里按中性措辞生成提纲，减少反复改写措辞这一步；需要快速准备访谈的研究者会因此选择它。
        usage_reason_en: 'Inference: versus hand-writing or templates, it generates neutral-wording guides
          directly inside coding agents, cutting the step of repeated rewording; researchers needing fast
          interview prep would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决访谈提纲易诱导、措辞打磨耗时的问题，痛点具体且交付可确定。
        evidence_ids:
        - ev-3a21256f867b0f4c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数，缺少用户评价或采用证据，无法判断是否形成共识。
        evidence_ids:
        - ev-3a21256f867b0f4c
      - gate: model
        status: insufficient
        reason: 免费开源技能，未见付费路径或买方，商业模式未明。
        evidence_ids:
        - ev-3a21256f867b0f4c
      - gate: truth
        status: insufficient
        reason: 未见实测输出质量或与人工提纲的对比，交付确定性待核验。
        evidence_ids:
        - ev-3a21256f867b0f4c
      next_validation: 收集仓库 issue/discussion 或独立评价中对该技能生成提纲质量的实测反馈。
