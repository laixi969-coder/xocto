    summary_en: A November 26, 2026 report said CoreWeave holds $132.5 billion in AI compute backlog and
      discussed whether credit markets overestimate its default risk. This reflects tension between long-term
      contract commitments of AI compute suppliers and credit pricing, with potential implications for
      AI application costs and supply stability; the assessment is market opinion, not confirmed fact.
