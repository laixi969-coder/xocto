    slug: safe-anything
    name: safe-anything
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息安全
    industries_en:
    - software development
    - information security
    jobs:
    - 开发者在合并代码或上线前，对自建 Web 应用与 AI agent 配置做漏洞扫描，拿到可定位的漏洞清单
    jobs_en:
    - Developers scan their own web apps and AI agent configurations for vulnerabilities before merging
      or shipping, and receive a locatable list of findings
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在提交代码或上线前，用它对自建 Web 应用和 AI agent 配置做漏洞扫描，覆盖 XSS、SQL 注入、泄露密钥和依赖 CVE；用户拿到的是漏洞清单，具体定位方式与修复建议仍待核验。
    inspiration: 趋势：AI agent 配置本身开始被当作需要审计的攻击面，安全扫描从传统 Web 应用延伸到 agent 部署。切入：可从中小团队上线前的固定检查环节进入，把扫描结果直接对接代码托管平台的合并请求，按仓库或按次收费；但需先确认它相对成熟扫描器的差异。
    summary_en: Before committing code or shipping, developers use it to scan their own web apps and AI
      agent setups for XSS, SQL injection, leaked secrets and dependency CVEs; users get a list of findings,
      while how findings are located and remediation guidance remain unverified.
    inspiration_en: 'Trend: AI agent configurations are starting to be treated as an attack surface needing
      audit, extending security scanning beyond classic web apps. Entry: target the pre-ship check step
      in small teams and wire findings into merge requests, charging per repo or per scan; first confirm
      how it differs from established scanners.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在合并代码或上线前，对自己维护的 Web 应用和 AI agent 配置做安全扫描，拿到可定位的漏洞清单。
        job_en: Before merging or shipping, developers scan the web apps and AI agent setups they maintain
          and get a locatable list of vulnerabilities.
        pain_zh: 漏洞若在上线后才被发现，修复成本和暴露风险都更高；小团队往往没有专职安全人员，手工排查 XSS、注入和泄露密钥既慢又易漏。
        pain_en: Vulnerabilities found after launch cost more to fix and raise exposure; small teams often
          lack dedicated security staff, and manually checking for XSS, injection and leaked secrets is
          slow and error-prone.
        current_alternative_zh: 使用成熟的商业或开源扫描器，或由开发者手工审查代码与配置。
        current_alternative_en: Established commercial or open-source scanners, or developers manually
          reviewing code and configuration.
        usage_reason_zh: 推断：它把多种检查合并为一次扫描并覆盖 AI agent 配置，可能减少在多个工具间切换和手工排查的步骤；但相对成熟扫描器的准确率与误报率尚无公开对比，这是用户是否选择它的关键未知。
        usage_reason_en: 'Inference: it bundles several checks into one scan and covers AI agent setups,
          potentially cutting tool-switching and manual checking; but accuracy and false-positive rates
          versus established scanners are not publicly compared, which is the key unknown for adoption.'
      gates:
      - gate: value
        status: supported
        reason: 它解决上线前发现漏洞的需求，痛点刚性且不处理的后果明确；但相对成熟扫描器的差异未说明。
        evidence_ids:
        - ev-41bd48beb68d525f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，缺少用户评价或团队采用案例，无法判断是否进入实际工作流。
        evidence_ids:
