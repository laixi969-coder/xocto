  agent-theater:
    slug: agent-theater
    name: agent-theater
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者同时运行多个编码代理时，需要观察每个代理当前在做什么、是否卡住，以便决定下一步指令
    jobs_en:
    - Developers running multiple coding agents need to see what each agent is doing and whether it is
      stuck, in order to decide the next instruction
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在同时运行多个编码代理时打开它，把代理的运行状态放到像素风舞台上展示，让用户看到各代理的进展与卡点；最终拿到的是可视化的运行画面，具体交互与交付仍待核验。
    inspiration: 趋势：多代理并行后，人盯代理状态成了新的负担，可视化监控从开发者工具里长出来。切入：先服务同时跑多个编码代理的小团队，把“哪个代理卡住、该先看谁”做成可收费的监控面板，而不是只做像素风装饰。
    summary_en: Developers open it while running several coding agents at once; it renders agent activity
      on a pixel-art stage so users can see progress and stalls. The concrete interactions and deliverables
      still need verification.
    inspiration_en: 'Trend: parallel agents make watching their state a new burden, so visual monitoring
      is emerging from developer tooling. Entry: serve small teams running multiple coding agents by making
      ''which agent is stuck, who to check first'' a paid monitoring panel rather than pixel-art decoration.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 开发者同时运行多个编码代理时，需要判断每个代理在做什么、是否卡住，再决定下一步指令。
        job_en: When running several coding agents at once, developers need to judge what each agent is
          doing and whether it is stuck before issuing the next instruction.
        pain_zh: 多代理并行后，终端日志交错，开发者难以快速分辨哪个代理在推进、哪个已停滞，只能逐个翻看输出。
        pain_en: With parallel agents, interleaved terminal logs make it hard to tell which agent is progressing
          and which has stalled; developers must scan outputs one by one.
        current_alternative_zh: 逐个查看各代理的终端输出或日志窗口，靠人工比对判断状态。
        current_alternative_en: Checking each agent's terminal output or log window manually and comparing
          states by hand.
        usage_reason_zh: 推断：它把各代理状态集中到一个可视化画面，减少逐个翻日志的步骤；但公开材料只说明像素风展示，是否真能降低判断负担、用户是否重复使用均无证据。
        usage_reason_en: 'Inference: it consolidates agent states into one visual view, cutting the step
          of scanning logs one by one; but public material only describes a pixel-art display, with no
          evidence it reduces judgment effort or is reused.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决多代理并行时状态难辨的问题，痛点结构存在，但公开材料只描述像素风展示，未说明如何呈现卡点与进展，价值交付不确定。
        evidence_ids:
        - ev-15b1d4bd83e921d1
        - ev-9358d8a19bd37322
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标数，属关注度而非采用证据，没有用户反馈说明它进入工作流。
        evidence_ids:
        - ev-15b1d4bd83e921d1
        - ev-a8f6491896b88877
        - ev-9358d8a19bd37322
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径，买方与收费方式均未披露。
        evidence_ids:
        - ev-9358d8a19bd37322
      - gate: truth
        status: insufficient
        reason: 无法核对它是否贴近监控代理状态的第一性目标，也未说明人工确认边界与安全处理。
        evidence_ids:
        - ev-15b1d4bd83e921d1
      next_validation: 收集该仓库的 README 与 issue/discussion，确认它具体展示哪些代理状态、是否被用户报告用于日常多代理工作流。
  agent-vscreen:
    slug: agent-vscreen
    name: agent-vscreen
    decision: watching
    category: 基础层
    project_type: open_source
    industries:
    - 移动应用与软件服务
    industries_en:
    - Mobile Apps and Software Services
    jobs:
    - 安卓用户让手机上的 AI agent 在后台操作应用，同时自己继续使用手机前台
    jobs_en:
    - Android users let an on-device AI agent operate apps in the background while they keep using the
      phone's foreground
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安卓用户想让手机上的 AI agent 替自己操作应用时，原来 agent 会占用前台屏幕、打断自己用手机。agent-vscreen 通过 Shizuku 或 root
      在手机上开出一块不可见的虚拟副屏，让 agent 在那块屏上打开并操作应用，用户前台照常使用；最终交付是 agent 在后台完成的应用操作，具体任务流程与人工确认环节仍待核验。
    inspiration: 趋势：手机 agent 开始需要“不打扰用户”的执行环境，屏幕资源本身成了被拆开重做的一层。切入：从需要长时间在手机后台跑任务的人群（如批量处理消息、跨应用填表、自动化测试）进入，可做面向团队的托管副屏或按任务计费的执行环境；当前只有开源工具，付费路径未披露。
    summary_en: When Android users want an on-device AI agent to operate apps for them, the agent normally
      takes over the foreground screen and interrupts their own phone use. agent-vscreen opens an invisible
      virtual secondary display via Shizuku or root, so the agent can open and operate apps there while
      the user keeps the foreground; the deliverable is the app actions the agent completes in the background,
      while the concrete task flow and human confirmation steps still need verification.
    inspiration_en: 'Trend: phone agents increasingly need an execution environment that does not disturb
      the user, making screen resources a layer being rebuilt. Entry: start with people who need long-running
      background phone tasks (bulk messaging, cross-app form filling, automated testing) and offer a managed
      secondary display or per-task execution environment; only an open-source tool exists today and the
      paid path is undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安卓用户希望 AI agent 在手机上替自己完成跨应用操作，同时自己继续正常使用手机前台，不被打断。
        job_en: Android users want an AI agent to complete cross-app operations on their phone while they
          keep using the foreground normally without interruption.
        pain_zh: 手机 agent 执行任务时会占用前台屏幕，用户要么干等，要么被打断；同一块屏幕无法同时服务人和 agent。
        pain_en: A phone agent occupies the foreground screen while executing, forcing users to wait or
          be interrupted; one screen cannot serve both the person and the agent.
        current_alternative_zh: 旧做法是让 agent 在前台跑、用户暂停使用手机，或另备一台设备/模拟器，或手动逐步操作。
        current_alternative_en: The old approach is to let the agent run in the foreground while the user
          pauses phone use, or to use a second device/emulator, or to operate step by step manually.
        usage_reason_zh: 推断：agent-vscreen 用 Shizuku 或 root 开出一块不可见副屏，把 agent 的操作从用户前台挪走，省去用户暂停用机或另备设备这一步，因此需要手机后台长跑任务的用户会选它；尚无留存或付费证据。
        usage_reason_en: 'Inference: agent-vscreen uses Shizuku or root to create an invisible secondary
          display and moves agent actions off the user''s foreground, removing the need to pause phone
          use or prepare a second device, so users with long-running background phone tasks would choose
          it; no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决手机 agent 与用户争抢同一块屏幕的问题，痛点具体、旧替代（暂停用机或另备设备）成本明确，交付是后台完成的应用操作。
        evidence_ids:
        - ev-7918d23a7e44469b
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数缓慢增长，属关注度信号，缺少用户评价或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-a1ec3d43ec5dffd5
        - ev-7918d23a7e44469b
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是个人开发者或企业自动化团队，属判断而非已验证事实。
        evidence_ids:
        - ev-7918d23a7e44469b
      - gate: truth
        status: insufficient
        reason: 依赖 Shizuku 或 root 的权限边界与安全风险未在材料中说明，任务失败或误操作时的人工兜底也未核验。
        evidence_ids:
        - ev-e0fd36347dfac49a
      next_validation: 收集该仓库的 issue 与 discussion，确认实际使用场景、权限配置与失败处理方式。
