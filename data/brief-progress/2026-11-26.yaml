    summary_zh: 纳税人在申报或遇到税务疑问时打开它，把税务问题交给 AI 助手获取答复，替代部分人工咨询；材料只说明 FBR 推出该助手，具体能回答哪些问题、答复是否可核对仍待核验。
    inspiration: 趋势：税务机关把咨询入口交给 AI，替代热线与柜台问答。切入：从纳税申报前的规则解释与材料清单这类高频重复问题进入，与官方税则数据绑定；材料未披露采购与运营方式。
    summary_en: Taxpayers open it when filing or facing tax questions, giving the question to an AI assistant
      for an answer instead of part of human inquiry; the material only says FBR launched it, and which
      questions it can answer and whether answers are verifiable remain unverified.
    inspiration_en: 'Trend: tax authorities are handing the inquiry front door to AI, replacing hotline
      and counter Q&A. Entry: start from high-frequency pre-filing rule explanations and document checklists
      tied to official tax data; procurement and operating model are not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 纳税人在申报或遇到税务疑问时处理税则与申报材料，需弄清适用规则与办理步骤；税务人员需回应大量重复咨询。
        job_en: Taxpayers handle tax rules and filing materials when filing or facing questions and need
          to understand applicable rules and steps; tax staff answer many repetitive inquiries.
        pain_zh: 税则复杂、咨询渠道有限，纳税人反复排队或自行查文件；这是从任务结构推断，材料未给出用户抱怨。
        pain_en: Tax rules are complex and inquiry channels limited, so taxpayers queue repeatedly or
          dig through documents; inferred from task structure, not stated complaints.
        current_alternative_zh: 税务热线、柜台咨询、官网文件与第三方会计。
        current_alternative_en: Tax hotlines, counter inquiries, official documents and third-party accountants.
        usage_reason_zh: 推断：相较排队打热线或翻文件，它把问题直接转为答复，省去等待与检索步骤，使申报期遇到具体疑问的纳税人选择它；材料未提供使用量或留存证据。
        usage_reason_en: 'Inference: versus queuing on hotlines or reading documents, it turns a question
          directly into an answer, removing waiting and search steps, so taxpayers with specific filing-season
          questions choose it; no usage or retention evidence is provided.'
      gates:
      - gate: value
        status: supported
        reason: 它解决纳税人查税则、问办理步骤时渠道有限、重复咨询多的问题，交付为问题答复。
        evidence_ids:
        - ev-62e478522be0fc7e
