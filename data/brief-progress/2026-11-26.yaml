full:
  art-paper-data:
    slug: art-paper-data
    name: art-paper-data
    decision: watching
    event_summary_zh: 2026年11月14日，Anthropic 在代码托管平台发布 art-paper-data 仓库，自述为 ART 论文的数据包；截至11月26日仅2个星标、2个复刻，未披露论文主题、数据内容或使用方式。
    event_summary_en: On November 14, 2026, Anthropic published the art-paper-data repository, described
      as a data package for the ART manuscript; as of November 26 it has only 2 stars and 2 forks, with
      no disclosed paper topic, dataset contents, or usage.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 研究者在复现或引用 ART 论文时打开该仓库，原本需要自行整理论文配套数据；仓库自述为论文数据包，但具体接收什么数据、如何被使用、最终交付哪些文件均未在公开材料中说明，具体流程或交付仍待核验。
    inspiration: 趋势是模型厂商把论文配套数据单独开源，让复现与评测有可追溯的原料；切入可放在为研究团队做论文数据包的版本管理、许可标注与复现校验，但需先看清 ART 论文本身解决什么问题。
    summary_en: Researchers open this repository when reproducing or citing the ART paper, where they
      previously had to assemble companion data themselves; it is described as a data package for the
      manuscript, but what data it holds, how it is used, and what files it delivers are not stated publicly,
      so the concrete workflow and deliverable remain unverified.
    inspiration_en: The trend is model vendors open-sourcing paper companion data so reproduction and
      evaluation have traceable inputs; the opening is tooling for research teams to version, license,
      and verify such data packages, but the ART paper's actual problem must be read first.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 研究者在复现或引用 ART 论文时，需要拿到论文配套数据，以核对结论或在此基础上继续实验。
        job_en: Researchers reproducing or citing the ART paper need its companion data to check results
          or build further experiments.
        pain_zh: 论文配套数据往往散落或缺失，复现者要自行拼凑，难以确认版本与口径；但该仓库是否缓解这一点，公开材料未说明。
        pain_en: Companion data for papers is often scattered or missing, forcing reproducers to assemble
          it and making version and scope hard to confirm; whether this repository eases that is not stated
          publicly.
        current_alternative_zh: 复现者通常向作者索要数据、从论文附录手工整理，或放弃复现。
        current_alternative_en: Reproducers typically request data from authors, manually reconstruct
          it from appendices, or abandon reproduction.
        usage_reason_zh: 推断：若该仓库确实包含论文所用数据与说明，复现者可省去向作者索要和手工整理的一步；但目前只有一句自述，缺少数据内容、许可与使用说明，无法确认这一负担是否真的被减少。
        usage_reason_en: 'Inference: if the repository truly contains the paper''s data and documentation,
          reproducers could skip requesting files and manual assembly; but only a one-line description
          exists, with no contents, license, or usage notes, so the burden reduction cannot be confirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决论文数据复现难的问题，但公开材料只有一句自述，说不清数据内容与交付，痛点是否被缓解无法判断。
        evidence_ids:
        - ev-5270689d337a1fd1
        - ev-11c9464e7e04a4e1
      - gate: consensus
        status: insufficient
        reason: 仅2个星标、2个复刻，无讨论或引用记录，看不出研究者是否已把它纳入复现流程。
        evidence_ids:
        - ev-2f80ff0f3dfd5bf0
        - ev-296bd647dca7af59
      - gate: model
        status: insufficient
        reason: 未披露定价、资助或商业路径；作为论文数据包，买方与收费方式均无公开信息，这是判断而非已验证事实。
        evidence_ids:
        - ev-5270689d337a1fd1
      - gate: truth
        status: insufficient
        reason: 无法核对数据是否与论文结论一致、许可是否允许复用，交付确定性未明。
        evidence_ids:
        - ev-11c9464e7e04a4e1
      next_validation: 收集 ART 论文的公开页面或预印本，确认该数据包对应的研究主题、数据内容与许可条款。
