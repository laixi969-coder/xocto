    - 开发者在自托管环境中接入自有模型，对代码改动做自动评审并把发现回写到代码托管平台
    jobs_en:
    - Engineering teams manually reading each change and writing review comments before merging GitLab
      or public code repository merge requests, then queuing the merge
    - Developers running self-hosted automated review of code changes with their own model and posting
      findings back to the code hosting platform
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 工程团队在合并 GitLab 或 公开代码仓库 的合并请求前打开它，把待评审的代码改动交给自托管平台；它用用户自带的 OpenAI 兼容模型生成评审发现并回写到代码托管平台，同时提供合并队列与评审工作区。用户拿到的是内联评审意见和排队后的合并动作，人工仍需确认是否采纳。具体流程与交付细节仍待核验。
    inspiration: 趋势：代码评审正从人工逐条阅读转向由团队自带模型、在自有环境内完成的自动评审，并把结果直接写回代码托管平台。切入：面向有代码不能外传顾虑的中大型研发团队，卖自托管部署与合并队列治理，而不是卖模型调用；是否按席位或按仓库收费尚未披露。
    summary_en: Engineering teams open it before merging GitLab or public code repository merge requests
      and hand the pending code changes to a self-hosted platform; it uses a user-supplied OpenAI-compatible
      model to generate review findings and posts them back to the code host, alongside a merge queue
      and review workspace. Users get inline review comments and a queued merge action, with humans still
      confirming what to adopt. The exact workflow and delivery still need verification.
    inspiration_en: 'Trend: code review is moving from line-by-line human reading toward automated review
      run inside the team''s own environment with their own model, writing results back to the code host.
      Entry: target mid-to-large engineering teams that cannot send code outside, selling self-hosted
      deployment and merge-queue governance rather than model calls; per-seat or per-repo pricing is not
      disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工程团队在合并 GitLab 或 公开代码仓库 的合并请求前，需要有人逐条阅读代码改动、写出评审意见，再决定是否合并。
        job_en: Before merging GitLab or public code repository merge requests, engineering teams need
          someone to read each code change, write review comments, and decide whether to merge.
        pain_zh: 评审依赖人工逐条阅读，改动多时排队等待，评审意见质量随人波动；代码不能外传的团队又难以直接用外部托管评审服务。
        pain_en: Review depends on humans reading every change, queues build up when changes are many,
          comment quality varies by reviewer, and teams that cannot send code outside struggle to use
          hosted review services.
        current_alternative_zh: 人工评审加代码托管平台自带的评审界面，或使用外部托管的 AI 评审服务。
        current_en: Manual review plus the code host's built-in review UI, or externally hosted AI review
          services.
        usage_reason_zh: 推断：相较纯人工评审，它把待评审改动交给团队自带的模型生成内联发现并回写代码托管平台，减少逐条初读这一步；相较外部托管服务，自托管让代码不出内网，因此有代码外传顾虑的团队会在合并前选择它。
        usage_reason_en: 'Inference: versus purely manual review, it feeds pending changes to the team''s
          own model to generate inline findings posted back to the code host, cutting the first line-by-line
          read; versus hosted services, self-hosting keeps code inside the network, so teams with data-egress
          concerns would choose it before merging.'
      gates:
      - gate: value
        status: supported
        reason: 它解决合并前逐条人工评审的负担，痛点具体且旧流程清楚；自托管回应代码外传顾虑。
        evidence_ids:
        - ev-510842251ef21f7e
      - gate: consensus
        status: insufficient
        reason: 仅见仓库星标与分支数，属关注度，未见团队采用或评审质量反馈。
        evidence_ids:
        - ev-510842251ef21f7e
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，自托管开源可能靠部署或支持收费，这是判断不是事实。
        evidence_ids:
        - ev-510842251ef21f7e
      - gate: truth
        status: insufficient
        reason: 未见评审结果被采纳的比例或人工复核边界，交付确定性尚无法核对。
        evidence_ids:
        - ev-510842251ef21f7e
      next_validation: 收集 arnold 官方文档或仓库 issue/discussion 中关于部署方式、模型接入与评审结果采纳情况的公开记录。
