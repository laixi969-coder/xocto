      from 66 on 2026-11-12 to 126 on 2026-11-26 in a steady small climb, with no single-day spike.
    category: AI + 开发
    project_type: open_source
    industries:
    - 建筑与工程
    - 建筑设计
    industries_en:
    - Architecture and Engineering
    - Architectural Design
    jobs:
    - 建筑设计师或结构工程师在方案修改阶段，需要让同事与 AI 代理同时改动同一份建筑信息模型，并核对各专业构件是否一致
    - BIM 工具开发者需要为不同专业（结构、机电）编写脚本插件，在统一内核上批量修改模型构件
    jobs_en:
    - Architects or structural engineers revising a scheme need colleagues and AI agents to edit the same
      building information model at once and check cross-discipline consistency
    - BIM tool developers write script add-ons for different trades (structure, MEP) to batch-edit model
      elements on one shared kernel
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 建筑设计师或工程师在改方案时打开它，把同一份建筑模型交给同事和 AI 代理共同编辑；AI 通过脚本化工具服务接收指令并改动模型构件，用户最终拿到更新后的共享模型，各专业改动是否冲突仍需人工核对。具体交付流程与协作边界仍待核验。
    inspiration: 趋势：建筑信息模型正从单人桌面软件转向“人和 AI 代理共编同一模型”的协作内核，脚本接口成为 AI 进入专业软件的入口。切入：从结构、机电等单一专业的批量改构件脚本做起，先服务中小设计院或
      BIM 外包团队，按项目或按专业插件收费；不要一上来做全专业平台。
    summary_en: Architects or engineers open it while revising a scheme and let colleagues and AI agents
      edit the same building model together; the AI receives instructions through a script-first tool
      server and changes model elements, and the user gets an updated shared model, with cross-discipline
      conflicts still needing human review. The concrete delivery flow and collaboration boundaries remain
      to be verified.
    inspiration_en: 'Trend: building information modeling is shifting from single-user desktop software
      toward a shared kernel where people and AI agents co-edit one model, with script interfaces as the
      entry point for AI into professional software. Entry: start with batch element-editing scripts for
      one trade such as structure or MEP, serving small design firms or BIM outsourcing teams, charged
      per project or per trade add-on; do not start as a full-discipline platform.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 建筑设计师或结构工程师在方案修改阶段，需要让同事与 AI 代理同时改动同一份建筑信息模型，并核对各专业构件是否一致。
        job_en: Architects or structural engineers revising a scheme need colleagues and AI agents to
          edit the same building information model simultaneously and check cross-discipline consistency.
        pain_zh: 传统 BIM 软件以单人桌面文件为中心，多人改动要来回传文件、合并版本，跨专业冲突往往到后期才被发现，返工成本高。
        pain_en: Traditional BIM software centers on single-user desktop files, so multi-person edits
          require file passing and version merging, and cross-discipline clashes are often found late,
          making rework costly.
        current_alternative_zh: 用桌面 BIM 软件加共享文件夹或版本管理，靠人工合并模型、开会核对冲突；脚本改动多由开发者单独写插件完成。
        current_alternative_en: Desktop BIM software plus shared folders or version control, with manual
          model merging and meetings to check clashes; scripted edits are usually done by developers writing
          separate add-ons.
        usage_reason_zh: 推断：相较传文件再人工合并，它让 AI 代理通过脚本化工具服务直接在同一内核上改构件，减少一次文件往返与手工重建模型的步骤，因此需要频繁批量改模型的专业团队会在方案反复调整时选择它。
        usage_reason_en: 'Inference: compared with passing files and merging by hand, it lets AI agents
          edit elements directly on one shared kernel through a script-first tool server, removing one
          file round-trip and manual model rebuild, so teams that batch-edit models frequently would choose
          it during repeated scheme revisions.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多人及 AI 共编同一建筑模型、减少文件合并与跨专业冲突核对的需求，痛点具体；谁付费尚不清楚。
        evidence_ids:
        - ev-ddc72c25aedf439b
        - ev-cc3f770e1f651c72
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏数缓慢上升，无设计院或工程师采用、案例或讨论证据，无法判断专业用户是否形成共识。
        evidence_ids:
        - ev-cc3f770e1f651c72
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、商业授权或付费插件说明，买方与收费路径未披露，这是判断不是已验证事实。
        evidence_ids:
        - ev-ddc72c25aedf439b
      - gate: truth
        status: insufficient
        reason: 脚本化工具服务让 AI 改模型的方向贴近第一性目标，但未见冲突检测、人工确认边界或实测结果，交付确定性待核验。
        evidence_ids:
        - ev-ddc72c25aedf439b
      next_validation: 收集 mutinybim 官方文档或仓库 issue/discussion 中关于多专业协作、冲突检测与人工确认流程的说明，以核验交付确定性。
