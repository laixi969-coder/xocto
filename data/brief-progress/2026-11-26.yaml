    - 软件与互联网服务
    industries_en:
    - Websites and content publishing
    - Software and internet services
    jobs:
    - 网站运营者在已有站点上接入问答或搜索入口，让访客用自己的 ChatGPT、Claude、Gemini 或 OpenRouter 账号完成提问与检索
    jobs_en:
    - Website operators add an answering search or chat entry to an existing site, letting visitors query
      through their own ChatGPT, Claude, Gemini or OpenRouter accounts
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 网站运营者在已有站点上需要加一个能回答问题的搜索框或对话入口时，接入 TensorPass 的开源 SDK，由访客通过 AI Wallet 浏览器扩展使用自己的 ChatGPT、Claude、Gemini
      或 OpenRouter 账号执行问答与检索，站点侧拿到的是嵌入后的交互入口；具体计费与交付边界仍待核验。
    inspiration: 趋势是把模型成本从站点方转移到访客自带的账号，站点只提供入口。切入可考虑面向内容站、独立电商和文档站，卖“接入与托管”而非模型调用；但访客是否愿意装扩展、站点是否愿意让答案脱离自有数据，是这条路径能否成立的关键，目前没有采用证据。
    summary_en: When a site operator needs an answering search box or chat entry on an existing site,
      they embed TensorPass's open-source SDK; visitors query through their own ChatGPT, Claude, Gemini
      or OpenRouter accounts via the AI Wallet browser extension, and the site gets an embedded interaction
      entry. Pricing and delivery boundaries remain unverified.
    inspiration_en: The trend is shifting model cost from the site to visitors' own accounts, with the
      site supplying only the entry point. A possible entry is content sites, independent shops and docs
      sites, selling integration and hosting rather than model calls; whether visitors install an extension
      and whether sites accept answers leaving their own data are the open questions, and no adoption
      evidence exists yet.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 网站运营者要在已有站点上加一个能回答问题的搜索框或对话入口，让访客就站内内容提问并得到回答。
        job_en: A site operator wants an answering search box or chat entry on an existing site so visitors
          can ask about site content and get answers.
        pain_zh: 站点自建问答需要承担模型调用成本与密钥管理，访客也常要跳出站点去通用助手重新描述问题；候选材料只说明技术接入方式，未给出站点或访客的实际痛点证据。
        pain_en: Building Q&A in-house means bearing model costs and key management, and visitors often
          leave the site to re-describe questions in a general assistant; the material only describes
          the integration method, with no evidence of actual site or visitor pain.
        current_alternative_zh: 站点自建检索或客服机器人、嵌入第三方问答插件，或访客直接去通用对话助手提问。
        current_alternative_en: Sites build their own search or support bots, embed third-party Q&A plugins,
          or visitors simply ask a general chat assistant.
        usage_reason_zh: 推断：相较自建模型调用，它把推理放到访客自己的账号上，站点少承担一步调用成本与密钥管理；但访客需先安装浏览器扩展，这一前置动作是否被接受没有公开证据，因此选择动机尚不成立。
        usage_reason_en: 'Inference: versus self-hosted model calls, it moves inference to visitors''
          own accounts, sparing the site one step of cost and key management; but visitors must first
          install a browser extension, and no public evidence shows that step is accepted, so the choice
          motive is not yet established.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图让站点低成本提供问答入口，但材料只讲接入方式，未说明站点或访客的具体痛点与不采用后果。
        evidence_ids:
        - ev-61db78945e2408d8
        - ev-8dae38af1aef38a1
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 42 增至 46，属关注度而非站点采用或访客使用证据。
        evidence_ids:
        - ev-61db78945e2408d8
        - ev-3af4f7bf342ad8c2
        - ev-8dae38af1aef38a1
      - gate: model
        status: insufficient
        reason: 未披露定价与付费方，站点侧或扩展侧谁付费无法判断，属判断而非已验证事实。
        evidence_ids:
        - ev-8dae38af1aef38a1
      - gate: truth
        status: insufficient
        reason: 访客需安装扩展才能使用自有账号，交付是否确定发生缺少实测或文档说明。
        evidence_ids:
        - ev-61db78945e2408d8
      next_validation: 收集 AI Connect 官方文档中的部署与计费说明，以及是否有公开站点上线案例或仓库 issue 讨论实际接入效果。
  airbot:
    slug: airbot
    name: Airbot
    decision: watching
    category: AI + 效率
    project_type: new_application
    industries: []
    industries_en: []
    jobs:
    - 管理者或独立工作者在日常事务中接收主动推送的提醒与待办，由 AI 首席助理通过短信先行发起对话
    jobs_en:
    - Managers or independent workers receive proactive reminders and to-dos in daily work, with an AI
      chief of staff opening the conversation over text message
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 面向需要有人替自己盯事务的管理者或独立工作者，Airbot 以“会先给你发短信的 AI 首席助理”形式出现，主动发起消息；具体接收哪些材料、执行什么动作、最终交付什么，候选材料只有一句定位，流程与交付仍待核验。
    inspiration: 趋势是助手从被动应答转向主动发起，把提醒从应用内推到短信这类高频通道。切入可考虑面向个人管理者或小团队负责人，按结果或按席位收费；但主动推送若无明确任务边界，容易沦为通知噪音，目前没有用户反馈支持其被长期使用。
    summary_en: Aimed at managers or independent workers who need someone watching their affairs, Airbot
      presents itself as an AI chief of staff that texts you first and initiates messages; what materials
      it takes in, what actions it performs and what it delivers are not described beyond a one-line positioning,
      so the workflow and delivery remain unverified.
    inspiration_en: The trend is assistants moving from passive replies to initiating contact, pushing
      reminders from in-app to high-frequency channels like SMS. A possible entry is individual managers
      or small-team leads, charged per outcome or per seat; but proactive pushes without clear task boundaries
      risk becoming notification noise, and no user feedback supports sustained use.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 管理者或独立工作者在日常事务中需要有人替自己盯住待办与提醒，由 AI 助理通过短信主动发起对话。
        job_en: Managers or independent workers need someone watching their to-dos and reminders in daily
          work, with an AI assistant opening conversations over text message.
        pain_zh: 候选材料只有一句定位，未说明用户具体在哪个环节难受、不采用会失去什么，痛点无法从公开事实还原。
        pain_en: The material offers only a one-line positioning and does not say where users actually
          struggle or what they lose without it, so the pain cannot be reconstructed from public facts.
        current_alternative_zh: 用户目前用日历提醒、待办应用或直接让通用对话助手安排事务。
        current_alternative_en: Users currently rely on calendar reminders, to-do apps, or simply ask
