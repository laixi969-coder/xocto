    open_source: true
    summary_zh: 面向 DeepSeek Harness 用户的个人职业经纪人插件：求职者在准备跳槽或评估职业方向时打开它，把简历与职业诉求交给它，由它整理出求职或职业规划建议。具体输入、动作与交付仍待核验。
    inspiration: 趋势：职业规划这类高信任、强个性化的服务开始被拆成可对话的代理，而不是一次性简历工具。切入：从具体人群（如应届生、转行者）的单一环节切入，例如把简历与目标岗位对齐成一份可投递的修改稿；卖法未披露，需先核验其实际交付物。
    summary_en: 'A personal career-broker plugin for DeepSeek Harness users: job seekers preparing to
      switch jobs or assess career direction open it, hand over their resume and career goals, and it
      organizes job-search or career-planning advice. The exact inputs, actions and deliverables still
      need verification.'
    inspiration_en: 'Trend: high-trust, highly personalized career services are being broken into conversational
      agents rather than one-off resume tools. Entry: start from a single step for a specific group (e.g.
      new graduates or career changers), such as aligning a resume with a target role into a submittable
      revision; pricing is undisclosed and the actual deliverable needs verification.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 求职者在准备跳槽或评估职业方向时，把简历与职业诉求交给它，由它整理出可执行的求职或职业规划建议。
        job_en: Job seekers preparing to switch jobs or assess career direction hand over their resume
          and career goals, and it organizes actionable job-search or career-planning advice.
        pain_zh: 职业方向与求职材料缺乏针对性，自己难以判断简历与目标岗位是否匹配。
        pain_en: Career direction and job-search materials lack targeting, and it is hard to judge whether
          a resume matches a target role.
        current_alternative_zh: 自己改简历、找朋友或职业顾问咨询、在招聘平台反复投递试错。
        current_alternative_en: Editing the resume alone, asking friends or career consultants, or repeatedly
          applying on job platforms by trial and error.
        usage_reason_zh: 推断：相较自己改简历或找人咨询，它把简历与职业诉求一次性交给代理整理成建议，可能减少反复沟通与试错的一步；但公开材料未说明具体输入、动作与交付，选择动机尚不能作为事实。
        usage_reason_en: 'Inference: compared with editing alone or consulting someone, it hands the resume
          and goals to an agent in one pass to organize advice, potentially cutting a round of back-and-forth;
          but public materials do not describe the inputs, actions or deliverables, so the choice motive
          cannot yet be stated as fact.'
      gates:
