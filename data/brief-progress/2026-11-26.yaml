  vibecodesurf:
    slug: vibecodesurf
    name: VibeCode.surf
    decision: watching
    event_summary_zh: 2026年11月21日，VibeCode.surf 以“AI 代码编辑器，由代理构建、运行并测试应用”的定位出现在产品社区，除这一句定位外没有披露定价、客户、使用数据或具体工作流细节。
    event_summary_en: On 21 November 2026, VibeCode.surf appeared in a product community with the positioning
      of an AI code editor where agents build, run and test an app; beyond that one-line description it
      disclosed no pricing, customers, usage data or workflow detail.
    category: AI + 开发
    project_type: new_application
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 独立开发者或小团队在需要从零搭建并跑通一个可运行应用时，把需求交给代理生成、运行和测试代码，自己负责验收结果
    jobs_en:
    - Solo developers or small teams building and running a working app from scratch hand requirements
      to agents that generate, run and test code, and review the result themselves
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 独立开发者或小团队在要从零搭出一个能跑的应用时，把需求交给编辑器里的代理去生成、运行并测试代码，自己负责验收。候选资料只有一句定位，具体输入形式、代理能改哪些文件、测试结果如何呈现仍待核验。
    inspiration: 趋势是编码代理从补全走向“自己跑起来再交付”，竞争点从写代码速度转向谁能把运行与测试闭环做稳。切入可放在非专业开发者的具体建站或内部工具场景，按可运行交付物收费；但该产品尚无定价与采用证据，窗口判断需等更多公开材料。
    summary_en: Solo developers or small teams who need a working app from scratch hand requirements to
      agents inside the editor that generate, run and test code, then review the result themselves. The
      candidate material is a single positioning line; the input format, which files agents may change,
      and how test results are surfaced still need verification.
    inspiration_en: The trend is coding agents moving from autocomplete to running and delivering the
      app, shifting competition from typing speed to a stable run-and-test loop. An entry point is non-professional
      builders making sites or internal tools, charged per working deliverable; this product has no pricing
      or adoption evidence yet, so the window call needs more public material.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队在要从零搭出一个可运行应用时，把需求交给编辑器内的代理生成、运行并测试代码，自己验收最终结果。
        job_en: Solo developers or small teams building a runnable app from scratch hand requirements
          to agents in the editor that generate, run and test code, and review the final result themselves.
        pain_zh: 从写代码到真正跑起来、跑通测试之间有多步手工衔接，出错后要自己定位；对不熟悉全栈的人，卡点常在运行与调试而非写第一行代码。
        pain_en: Getting from written code to a running, tested app involves several manual handoffs and
          self-diagnosis of failures; for people without full-stack depth the blocker is often running
          and debugging, not the first line of code.
        current_alternative_zh: 用通用 AI 编程助手补全代码，再自己在本机配置环境、运行、读报错并反复修改；或直接用现成的低代码/模板建站工具。
        current_alternative_en: Using general AI coding assistants for completion, then configuring the
          environment locally, running, reading errors and iterating by hand; or using ready-made low-code
          or template site builders.
        usage_reason_zh: 推断：相较补全式助手，它把运行与测试也交给代理执行，减少用户手动配环境、跑命令、读报错再回贴的往返；需要快速得到可运行原型而非精细控制代码的独立开发者会因此选择它。该因果尚无用户反馈支持。
        usage_reason_en: 'Inference: unlike completion-style assistants, it also lets agents run and test,
          cutting the manual loop of setting up the environment, running commands, reading errors and
          pasting them back; solo developers who need a runnable prototype fast rather than fine code
          control would pick it. No user feedback supports this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决从需求到可运行应用之间运行与调试的手工衔接痛点，旧做法是补全助手加本机手动跑测，结构上成立；买方与付费方式未披露。
        evidence_ids:
        - ev-fe2914c83d2763b6
      - gate: consensus
        status: insufficient
        reason: 只有一句产品定位，没有用户评价、社区讨论或采用数据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-fe2914c83d2763b6
      - gate: model
        status: insufficient
        reason: 未披露定价、计费方式或买方类型；按席位还是按产出收费只能作为判断，不是已验证事实。
        evidence_ids:
        - ev-fe2914c83d2763b6
      - gate: truth
        status: insufficient
        reason: 代理自动运行与测试能否确定性交付、出错时人工边界如何划分，公开材料未说明，需看文档或实测。
        evidence_ids:
        - ev-fe2914c83d2763b6
      next_validation: 收集 VibeCode.surf 官方产品页或文档，确认代理运行与测试的具体流程、人工确认环节及是否公开定价。
