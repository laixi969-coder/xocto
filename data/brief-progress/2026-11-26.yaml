        - ev-e913555eecd0eb41
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，买方可能是学校、培训机构或个人教师，均未核验。
        evidence_ids:
        - ev-5746b46f91f0259e
      - gate: truth
        status: insufficient
        reason: 生成质量有盲评对比，但讲解准确性、教学效果与安全边界无公开材料，需看实际课程产出。
        evidence_ids:
        - ev-5746b46f91f0259e
      next_validation: 收集该仓库的 issue/discussion 或示例课程页，确认是否有教师实际用于备课并反馈讲解准确性。
    event_summary_zh: 2026年11月11日发布的开源白板 AI 导师，公开了跨 Claude、Gemini、DeepSeek 的 288 次生成与 64 块盲评白板对比，仓库星数从约
      470 增至 567。
    event_summary_en: An open-source whiteboard AI tutor released on 2026-11-11 published a comparison
      across Claude, Gemini and DeepSeek covering 288 generation runs and 64 blind-reviewed boards; repository
      stars rose from about 470 to 567.
  xxd-pstack:
    slug: xxd-pstack
    name: pstack
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code、Cursor 或 Codex 的开发者让 AI 改完代码后，需要先让 AI 自己运行并验证改动是否真的生效，再决定是否接受结果
    jobs_en:
    - Developers using Claude Code, Cursor or Codex need the AI to run and verify its own code change
      before they accept the result
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Cursor 或 Codex 的开发者，在 AI 声称已修复问题后，打开 pstack 让 AI 先自行运行并检验这次改动；用户拿到的是经过自测的改动结果，仍需人工确认。具体检验流程与交付形态仍待核验。
    inspiration: 趋势：AI 编码代理开始被要求对自己的产出负责，验证环节从人转向代理自测。切入：从独立开发者和小团队的高频改 bug 环节进入，卖的是“改完即验”的确定性，而非又一个编码助手。
    summary_en: Developers using Claude Code, Cursor or Codex open pstack after the AI claims a fix, so
      the AI first runs and checks its own change; the user gets a self-tested change that still needs
      human confirmation. The exact verification flow and deliverable remain to be verified.
    inspiration_en: 'Trend: coding agents are being pushed to answer for their own output, moving verification
      from the human to the agent. Entry: start with independent developers and small teams fixing bugs
      frequently, selling the certainty of ''verified on change'' rather than another coding assistant.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code、Cursor 或 Codex 的开发者让 AI 改完代码后，需要先让 AI 自己运行并验证改动是否真的生效，再决定是否接受结果。
        job_en: Developers using Claude Code, Cursor or Codex need the AI to run and verify its own code
          change before they accept the result.
        pain_zh: AI 常声称已修复但实际仍坏，开发者要手动复跑、复测才能发现，返工成本高。
        pain_en: AI often claims a fix that is still broken, forcing developers to manually rerun and
          retest, which is costly rework.
        current_alternative_zh: 开发者自己手动运行测试、复现问题、逐条核对 AI 的改动。
        current_alternative_en: Developers manually run tests, reproduce the issue and check each AI change
          themselves.
        usage_reason_zh: 推断：相较人工复跑，pstack 让 AI 在交付前先自行执行并检验改动，减少开发者发现“假修复”的那一步返工；因此频繁用 AI 改 bug 的开发者会在验收前选择它。
        usage_reason_en: 'Inference: versus manual reruns, pstack has the AI execute and check its change
          before delivery, cutting the rework step of catching a fake fix; developers who frequently fix
          bugs with AI would choose it before acceptance.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 声称已修复但实际仍坏的问题，痛点具体，替代的是开发者手动复跑复测这一步。
        evidence_ids:
        - ev-8a3dbe0f4dcdfff5
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，缺少用户评价或采用证据说明开发者是否真的把它放进验收流程。
        evidence_ids:
        - ev-ff0418adf8a0a25a
      - gate: model
        status: insufficient
        reason: 公开材料未说明定价与付费方，开源项目可能靠赞助或后续商业版，属判断而非已验证事实。
        evidence_ids:
        - ev-8a3dbe0f4dcdfff5
      - gate: truth
        status: insufficient
        reason: 自测能否确定性发现假修复、误报率如何，缺少可复现实测与文档说明。
        evidence_ids:
        - ev-8a3dbe0f4dcdfff5
      next_validation: 收集 pstack 官方文档或仓库 README 中关于自测流程、误报处理与可复现实测的说明。
