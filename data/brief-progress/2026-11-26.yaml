    summary_zh: 教师或课程设计者在备课时打开它，把要讲的知识点交给系统，AI 逐笔生成白板板书动画并支持交互回放，最终得到一段可播放的讲解课。候选材料只给出生成与盲评流程，具体学科范围、人工校对环节和交付格式仍待核验。
    inspiration: 趋势：白板讲解这类需要教师手绘、录屏、剪辑的旧流程，正被拆成“给知识点、出动画”的一步。切入：从K12或职业培训里需要大量重复讲解的科目进入，按课时或按课程包卖生成服务，而非卖工具席位；模型对比数据可作为质量背书。
    summary_en: Teachers or course designers open it during lesson prep, hand a topic to the system, and
      the AI draws a whiteboard explainer stroke by stroke with interactive playback, producing a playable
      lesson. The candidate only shows the generation and blind-review process; subject scope, human review
      step and delivery format remain unverified.
    inspiration_en: 'Trend: the old workflow of hand-drawing, screen-recording and editing whiteboard
      lessons is being collapsed into ''give a topic, get an animation''. Entry: start with K12 or vocational
      subjects that need heavy repeated explanation, and sell per-lesson or per-course-pack generation
      rather than tool seats; the model comparison data can back quality claims.'
    req_initial:
      verdict: true_demand
