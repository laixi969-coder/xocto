    jobs:
    - 移动应用测试工程师在版本发布前，需要覆盖多机型、多语言的界面流程与无障碍检查，用并行代理在模拟器上跑用例并汇总缺陷
    - 移动应用开发者在上线前自查多设备布局与翻译问题，用代理批量截图与走查并拿到问题清单
    jobs_en:
