      product describes requirements in natural language; Lovable generates front-end and back-end code
      and deploys it, and the user gets a runnable app whose correctness and security still need human
      review. Delivery boundaries and pricing remain to be verified.
    inspiration_en: 'Trend: natural-language generation of deployable apps is moving from demo to real
      launch, and the scale of financing shows capital expects this workflow to persist. Entry: avoid
      head-on competition with a general generator; go vertical, such as listing sites for real-estate
      agents or booking and document-intake pages for law firms, charging per launched site or per project,
      with moats in industry templates and compliance review.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 非技术创业者或小团队负责人要把一个网页应用想法变成可访问的产品，输入是需求描述，输出是可运行并部署的应用。
        job_en: A non-technical founder or small-team lead wants to turn a web-app idea into an accessible
          product, inputting a requirements description and receiving a runnable, deployed app.
        pain_zh: 过去要么自己学编程，要么花钱请开发者或外包，周期长、沟通成本高，想法验证被工程排期卡住。
        pain_en: Previously they had to learn to code or pay developers or agencies, with long cycles
          and high communication cost, so idea validation was blocked by engineering schedules.
        current_alternative_zh: 雇自由开发者、找外包团队、用网站搭建工具拼模板，或干脆放弃验证。
        current_alternative_en: Hiring freelance developers, engaging agencies, assembling templates with
          website builders, or abandoning validation.
        usage_reason_zh: 推断：相较外包或模板建站，产品把需求描述直接转成可部署代码，省去需求转译和首版搭建这一步，因此想快速验证想法、又缺少工程资源的人会在首版上线前选择它；是否长期留在工作流中缺少留存证据。
        usage_reason_en: 'Inference: compared with outsourcing or template builders, the product turns
          a requirements description directly into deployable code, removing the requirement-translation
          and first-build step, so people wanting fast validation without engineering resources would
          choose it before a first launch; evidence of long-term retention is lacking.'
      gates:
      - gate: value
        status: supported
        reason: 它解决非技术人群把想法变成可上线应用的需求，痛点是工程资源与周期，旧替代是外包或模板建站，结构上成立。
        evidence_ids:
        - ev-03f61e3d1904e2fb
      - gate: consensus
        status: insufficient
        reason: 有融资与估值报道，但缺少公开的付费客户、使用规模或留存数据，无法判断共识是否转化为持续采用。
        evidence_ids:
        - ev-03f61e3d1904e2fb
        - ev-497b4ccd88cf22ad
      - gate: model
        status: insufficient
        reason: 公开材料未说明定价与买方结构，按订阅或按项目收费只是推断，付费路径尚未核验。
        evidence_ids:
        - ev-03f61e3d1904e2fb
      - gate: truth
        status: insufficient
        reason: 生成代码的正确性与安全边界需人工确认，公开材料未给出交付确定性证据。
        evidence_ids:
        - ev-671f22b463fc2be4
      next_validation: 收集 Lovable 官方定价页与公开客户案例，核验计费方式与交付结果。
