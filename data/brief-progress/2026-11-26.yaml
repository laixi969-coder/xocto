        usage_reason_en: 'Inference: versus hand-drawing and recording, it hands the ''draw the board''
          step to the model stroke by stroke with playback, removing drawing and editing work, so teachers
          or course teams needing bulk explainer lessons would try it; public material shows no retention
          or payment.'
      gates:
      - gate: value
        status: supported
        reason: 它解决白板讲解制作耗时的问题，痛点具体且交付是可直接播放的课，结构上成立；学科范围与人工校对仍不清。
