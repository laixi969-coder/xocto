        - ev-31b31b5995e5518a
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价、付费路径或买方；可能靠开源社区与后续服务变现，这是判断而非已验证事实。
        evidence_ids:
        - ev-31b31b5995e5518a
      - gate: truth
        status: insufficient
        reason: 模板化分工与证据核验贴近任务第一性目标，但缺少实际使用中的交付结果与人工边界说明。
        evidence_ids:
