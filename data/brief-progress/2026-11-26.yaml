        pain_en: Going from a written brief to an editable 3D scene requires artists to manually model,
          place and tune parameters step by step, with much repetitive work and slow early prototyping.
        current_alternative_zh: 美术师在 Blender 中手工建模与摆放，或使用资产库和脚本插件批量生成，再人工调整。
        current_alternative_en: Artists model and place objects manually in Blender, or use asset libraries
          and scripting add-ons for batch generation, then adjust by hand.
        usage_reason_zh: 推断：相较纯手工建模，它把“描述需求—摆放对象—调参数”的前几步交给代理在 Blender 内直接执行，减少从零搭建场景的起步动作；但代理操作是否可控、返工是否更少尚无用户反馈支持。
