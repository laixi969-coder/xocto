      and the user gets a resumed task plus a side panel. Real effect remains unverified.
    inspiration_en: 'Trend: coding agents are moving from one-shot generation to multi-agent orchestration,
      making stuck recovery and approval boundaries a separate step. Entry: target teams already on Antigravity,
      starting from read-only re-inspection and auto-retry after a stall; no pricing is disclosed.'
