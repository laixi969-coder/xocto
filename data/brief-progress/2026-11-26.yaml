    summary_zh: 独立开发者或小团队负责人在推进一项开发任务时，打开这套角色与分组模板，把任务分派给多个 AI 角色，并要求每个角色提交证据、说明步骤、完成交接；用户最终拿到可核验的分工与交接记录，仍需自己确认结论。具体流程与交付形态仍待核验。
    inspiration: 趋势：一个人借助多个 AI 角色完成原本需要小团队的工作，正在从“单次对话”走向“分工、核证、交接”的流程化。切入：可从独立开发者和小型外包团队接单后的任务拆解与验收环节进入，卖的是可核验的交接记录而非模型能力；仓库仅显示关注度，尚无付费与留存证据。
