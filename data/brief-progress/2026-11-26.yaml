      making promotional assets, the marketer enters category or product information, and AI performs
      product research, opportunity analysis and video generation to produce publishable promotional videos;
      delivery quality and human review steps remain to be verified.'
    inspiration_en: Affiliate product selection and asset production are being split into an automatable
      pipeline, shifting from selling tools to delivering promotional output. An entry point is affiliate
      marketers in one vertical category (e.g. home or beauty), charging per usable generated video or
      per sales result rather than a generic subscription.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 联盟营销者在选品和制作推广视频时，处理产品与品类信息，要完成从调研到产出可发布推广内容的任务。
        job_en: Affiliate marketers handling product and category information need to go from research
          to publishable promotional content.
        pain_zh: 选品靠人工翻榜单和竞品，视频制作耗时长，跨品类重复劳动多。
        pain_en: Product selection relies on manually scanning rankings and competitors, video production
          is slow, and work repeats across categories.
        current_alternative_zh: 人工浏览平台榜单、用剪辑软件或通用生成工具逐条制作视频。
        current_alternative_en: Manually browsing platform rankings and producing videos one by one with
          editing or generic generation tools.
        usage_reason_zh: 推断：平台把调研、机会分析和视频生成串成一条流程，减少在多个工具间切换和逐条剪辑的步骤，因此需要批量产出推广素材的联盟营销者会尝试它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: the platform chains research, opportunity analysis and video generation
          into one flow, cutting tool-switching and per-video editing, so affiliate marketers needing
          bulk promotional assets may try it; no user feedback or retention evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决联盟营销者选品调研与视频制作耗时的问题，旧流程是人工翻榜单加逐条剪辑，痛点具体。
        evidence_ids:
        - ev-1276c738871fd058
        - ev-1de9a8b1c1fc177d
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从81到85的小幅变化，无用户评价或采用证据，无法判断共识。
        evidence_ids:
        - ev-1276c738871fd058
        - ev-1de9a8b1c1fc177d
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，按产出或订阅收费均为推断，付费路径未核验。
        evidence_ids:
        - ev-1276c738871fd058
      - gate: truth
        status: insufficient
        reason: 生成视频能否直接发布、是否需人工审核、结果是否可核对均无材料支持。
        evidence_ids:
        - ev-1de9a8b1c1fc177d
      next_validation: 收集该仓库的 README、issue 或 discussion，确认视频生成的实际交付流程与是否有人报告使用结果。
