    inspiration: 趋势：AI 编码代理已能一次生成大量代码，瓶颈从“写”转到“审”，审查流程本身开始被产品化。切入：从需要合规留痕的团队（如金融、医疗软件外包）进入，把三段审查做成可交付的审计记录并按项目收费，而不是卖提示词。
    summary_en: 'Developers using AI coding agents open this instruction and skill set before merging
      large generated changes: the agent first drafts a plan, then performs a critical review, then audits
      the diff line by line. The deliverable is a change that passed three checks, though a human still
      confirms the review conclusions. Exact workflow and delivery details remain to be verified.'
    inspiration_en: 'Trend: AI coding agents now generate large amounts of code at once, so the bottleneck
      shifts from writing to reviewing, and the review process itself is becoming a product. Entry: start
      with teams needing auditable trails (e.g. finance or healthcare software outsourcing), package the
      three-stage review as a deliverable audit record billed per project rather than selling prompts.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 AI 编码代理的开发者在大段生成代码合并前，需要先做计划、关键审查和差异审计，以拦截错误改动。
        job_en: Developers using AI coding agents need to plan, critically review and audit diffs before
          merging large generated changes, to catch faulty edits.
        pain_zh: AI 代理一次产出大量代码，人工逐行核对负担重，遗漏错误会进入主干。
        pain_en: AI agents produce large volumes of code at once, making line-by-line human checking heavy
          and letting missed errors reach the main branch.
        current_alternative_zh: 开发者各自凭经验写提示词、手动读 diff，或依赖代码评审工具，流程不统一。
        current_alternative_en: Developers write prompts ad hoc, read diffs manually, or rely on code
          review tools, with no consistent process.
        usage_reason_zh: 相较各自手写提示词和通读 diff，它把计划、关键审查、差异审计固化为三段固定动作，减少遗漏审查步骤的负担；推断需要可重复审查流程的团队会因此选用。
        usage_reason_en: Compared with ad hoc prompts and reading diffs manually, it fixes planning, critical
          review and diff audit into three repeatable steps, reducing the burden of skipped review stages;
          inferred that teams needing a repeatable review process would choose it.
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 生成代码量大后审查负担重、错误易漏进主干的问题，痛点具体，交付为经三段检查的改动。
        evidence_ids:
        - ev-7e332098b97b6225
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或团队采用案例，无法判断共识是否形成。
        evidence_ids:
        - ev-77bd6cf3be544b8a
        - ev-7e332098b97b6225
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径，钱从哪来尚不清楚。
        evidence_ids:
        - ev-7e332098b97b6225
      - gate: truth
        status: insufficient
        reason: 审查流程能否稳定拦截错误、人工确认边界如何，缺少实测或案例支持。
        evidence_ids:
        - ev-7e332098b97b6225
      next_validation: 收集该仓库的 issue 与 discussion，查看使用者对三段审查流程的实际反馈与采用情况。
