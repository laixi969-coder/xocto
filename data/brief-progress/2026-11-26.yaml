    inspiration: 趋势是代理从聊天窗口走向本地桌面，直接操作文件与网页；切入可考虑把这类本地代理封装成面向具体职业的例行任务包，例如财务对账或电商后台巡检，按任务结果收费，而非卖通用代理框架。
