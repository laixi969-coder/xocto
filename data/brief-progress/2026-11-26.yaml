  dsh-ensp:
    slug: dsh-ensp
    name: dsh-ensp
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 信息与通信技术培训
    - 网络工程
    industries_en:
    - ICT training
    - network engineering
    jobs:
    - 网络工程师或学员在备考华为认证、搭建实验拓扑时，用命令行生成 .topo 文件、启停设备并逐条下发配置，拿到带逐条报错的实验环境
    - 网络实验课讲师在准备课堂演示时，批量生成并启动多台虚拟设备，把配置脚本一次性推送到实验环境
    jobs_en:
    - Network engineers or certification candidates building Huawei lab topologies generate .topo files,
      start/stop devices and push configuration command by command, getting per-command error reports
    - Lab instructors preparing classroom demos batch-generate and start virtual devices and push configuration
      scripts into the lab environment
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 网络工程师或华为认证学员在搭建 eNSP 实验环境时，原本要在图形界面里逐个拖拽设备、手工敲配置；这个开源工具用命令行生成 .topo 拓扑文件、启停设备并逐条下发配置，每条命令单独报错。用户最终拿到一个可复现的实验环境，具体是否接入大模型生成配置，材料未说明，仍待核验。
    inspiration: 趋势：网络设备实验这类高度依赖厂商模拟器的旧流程，正被脚本化重做，把“点鼠标搭拓扑”变成可版本化的命令。切入：从华为认证培训机构和高校网络实验室进入，卖批量实验环境与自动判分，而不是卖单个脚本；是否用
      AI 生成配置是待核验的差异点。
    summary_en: Network engineers and Huawei certification candidates building eNSP labs normally drag
      devices and type configuration by hand in a GUI. This open-source tool generates .topo topology
      files, starts and stops devices and pushes configuration one command at a time with per-command
      error reporting. The user ends up with a reproducible lab environment; whether an LLM generates
      the configuration is not stated in the material and remains to be checked.
    inspiration_en: 'Trend: vendor-simulator lab setup, a manual old workflow, is being scripted into
      versionable commands. Entry: sell batch lab environments and auto-grading to Huawei certification
      training providers and university network labs rather than a single script; whether AI generates
      configuration is the unverified differentiator.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 网络工程师或认证学员在备考和授课时，需要反复搭建华为 eNSP 实验拓扑并下发设备配置，完成可复现的实验。
        job_en: Network engineers or certification candidates repeatedly build Huawei eNSP lab topologies
          and push device configuration to complete reproducible labs.
        pain_zh: 图形界面里逐个拖拽设备、手工敲配置、出错后逐台排查，重复劳动多且难以复现同一实验。
        pain_en: Dragging devices and typing configuration by hand in a GUI, then debugging device by
          device, is repetitive and hard to reproduce.
        current_alternative_zh: 在 eNSP 图形界面手工搭建拓扑并逐台输入命令，或自己写零散脚本。
        current_alternative_en: Building topologies by hand in the eNSP GUI and typing commands per device,
          or writing ad-hoc scripts.
        usage_reason_zh: 推断：它把拓扑生成、设备启停和配置下发收进一条命令，并逐条报错，省去在图形界面重复点击和逐台排查的步骤，因此需要批量复现实验的学员和讲师会选用它。
        usage_reason_en: 'Inference: it folds topology generation, device start/stop and configuration
          push into one command with per-command errors, removing repeated GUI clicks and device-by-device
          debugging, so candidates and instructors who need batch-reproducible labs would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决搭建华为 eNSP 实验拓扑和下发配置的重复劳动，痛点具体，旧做法是图形界面手工操作。
        evidence_ids:
        - ev-14c58a6c6e9c73f6
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 90 增至 253 的关注度信号，没有用户评价或采用案例说明谁在持续使用。
        evidence_ids:
        - ev-14c58a6c6e9c73f6
        - ev-e73fc459560ed2ab
