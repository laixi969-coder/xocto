        status: insufficient
        reason: 仓库星标从约 42 增至 85，属关注度信号，未见用户评价或客户案例说明持续使用。
        evidence_ids:
        - ev-782e3a1281ae5b83
        - ev-ce68c1c4c05b4052
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径，买方可能是开发者自用或团队采购，属判断而非已验证事实。
        evidence_ids:
