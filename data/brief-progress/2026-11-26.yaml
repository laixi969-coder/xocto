        current_alternative_en: Developers manually read source and write docs themselves, or rely on
          scattered historical comments.
        usage_reason_zh: 推断：它让 AI 代理批量生成带出处引用的规格，并用独立校验代理核对，可能减少逐文件阅读和手工整理文档的步骤；但校验代理能否可靠降低错误尚无公开证据。
        usage_reason_en: 'Inference: it has an AI agent batch-generate specs with cited evidence and a
