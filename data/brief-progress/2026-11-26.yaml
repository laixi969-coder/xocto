    summary_en: 'An open-source kit for software engineers job hunting: users feed in their resume, LinkedIn,
      public code repository and portfolio, and it scores them against O*NET and BLS occupational data,
      then rebuilds the materials. The deliverable is rewritten application materials; the exact rewrite
      flow and human review step remain to be verified.'
    inspiration_en: 'Trend: job application materials are shifting from manual polishing to automated
      scoring and rewriting against public occupational data. Entry: start with specific job-seeking groups
      such as veterans or career switchers, and charge per rewritten package or as a career-coaching service
      rather than a free script.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 软件工程师在求职投递前，整理简历、LinkedIn、公开代码仓库 与作品集，对照目标岗位要求改写材料，以通过初筛。
        job_en: Before applying, software engineers organize their resume, LinkedIn, public code repository
          and portfolio and rewrite them against target job requirements to pass initial screening.
        pain_zh: 求职材料分散在多个平台，与岗位要求的匹配靠人工判断，改写到什么程度算合格没有参照，反复修改耗时且容易漏项。
        pain_en: Application materials are scattered across platforms, matching to job requirements is
          judged manually, there is no reference for how much rewriting is enough, and repeated edits
          are time-consuming and easy to miss items.
        current_alternative_zh: 求职者自己逐条对照招聘描述手改，或请朋友、职业顾问看一遍，或用通用聊天助手润色。
        current_alternative_en: Job seekers manually compare against job descriptions and edit, or ask
          friends or career advisors to review, or use general chat assistants to polish.
        usage_reason_zh: 推断：它把简历、LinkedIn、公开代码仓库 和作品集一次性对照公开职业数据打分并重写，省去求职者逐平台比对和反复润色的步骤，因此缺少职业顾问、又想快速对齐岗位要求的工程师会尝试它。
        usage_reason_en: 'Inference: it scores and rewrites resume, LinkedIn, public code repository and
          portfolio in one pass against public occupational data, removing the step of cross-platform
          comparison and repeated polishing, so engineers without a career advisor who want to align quickly
          with job requirements would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决求职材料与岗位要求对齐的需求，痛点是多平台材料分散、人工比对耗时，旧做法是手改或请人看，结构上成立。
        evidence_ids:
        - ev-e05e172742b3ab2a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或求职者实际采用反馈，无法判断是否形成使用共识。
        evidence_ids:
        - ev-e05e172742b3ab2a
      - gate: model
        status: insufficient
        reason: 免费开源，未披露付费路径或服务收费，买方可能是求职者本人或职业培训机构，属判断而非已验证事实。
        evidence_ids:
        - ev-007df001377790d4
      - gate: truth
        status: insufficient
        reason: 对照 O*NET 与 BLS 数据打分可核验，但改写结果是否真能提升通过率缺少交付结果证据。
        evidence_ids:
        - ev-e05e172742b3ab2a
      next_validation: 收集该仓库的 issue、discussion 或使用反馈，确认求职者实际用它改写材料后的结果与重复使用情况。
