    inspiration: 趋势：角色资产生产正从纯手工雕刻转向“照片/扫描输入 + 自动重建 + 引擎交付”的流水线，模型能力被抹平后，壁垒落在与 Blender、Unreal 的管线贴合度上。切入：从独立游戏团队和外包角色工作室进入，卖按角色资产计价的交付，而不是卖插件席位；先解决皮肤与面部细节这一最耗时的环节。
    summary_en: When game or film artists need Unreal-ready characters, they feed photos or existing meshes
      into this tool, which fits, reconstructs skin and outputs MetaHuman assets inside Blender; artists
      still confirm the final asset. The exact workflow and delivery quality remain to be verified.
    inspiration_en: 'Trend: character asset production is shifting from pure manual sculpting to a pipeline
      of photo/scan input, automatic reconstruction and engine delivery; as model capability commoditizes,
      the moat sits in tight fit with Blender and Unreal pipelines. Entry: start with indie game teams
      and outsourced character studios, selling per-character-asset delivery rather than plugin seats,
      and first solve the most time-consuming step of skin and facial detail.'
