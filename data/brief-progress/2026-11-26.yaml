    jobs_en:
    - Developers taking over legacy systems use an AI coding agent to reverse-engineer existing source
      into specs with cited evidence, then have a separate verifier agent check them
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 接手遗留代码的开发者用 AI 编码代理把现有源码转成规格说明，每条陈述标注出处（文件:行号），再由独立校验代理核对；最终拿到可供维护或重构的规格文档，人工仍需确认。
    inspiration: 趋势：AI 编码从写新代码转向理解存量系统，规格成为人与代理之间的中间产物。切入：可从企业遗留系统交接与重构评估环节进入，按项目交付规格文档；但需先确认校验代理的实际效果与人工复核成本。
    summary_en: Developers inheriting legacy code use an AI coding agent to turn existing source into
      specifications, each statement citing its evidence (path:line), then a separate verifier agent checks
      them; the output is a spec document for maintenance or refactoring, still needing human confirmation.
    inspiration_en: 'Trend: AI coding is shifting from writing new code to understanding existing systems,
      with specs as the intermediate artifact between people and agents. Entry: target legacy handover
      and refactoring assessment in enterprises, delivering spec documents per project; first confirm
      the verifier''s real effect and human review cost.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
