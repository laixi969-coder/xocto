    - 个人用户在本地电脑上想要私密的陪伴对话时，处理角色设定、长期记忆与语音聊天，完成不把聊天内容上传云端的持续对话
    - 个人用户在离线或隐私敏感环境下，需要与带记忆和语音的虚拟角色进行日常对话，完成不依赖云服务的陪伴体验
    jobs_en:
    - An individual user who wants private companionship chat on a local PC handles persona settings,
      long-term memory and voice chat to sustain conversations without uploading content to the cloud
    - An individual user in an offline or privacy-sensitive setting needs ongoing dialogue with a memory-
      and voice-enabled virtual character without relying on cloud services
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人用户在自己的 Windows 电脑上打开这个本地程序，设定虚拟角色的性格，程序接收文字与语音输入并维护长期记忆，让对话在本地持续进行而不把内容上传云端；用户拿到的是可离线运行的陪伴对话，具体记忆机制、语音质量与交付稳定性仍待核验。
    inspiration: 趋势：陪伴类对话正从云端订阅转向本地运行，隐私成为一部分用户愿意牺牲模型能力换取的条件。切入：可从对隐私敏感、不愿把私密对话交给云端的个人用户切入，卖点是本地部署与数据不出设备；开源项目本身尚无定价与付费路径，商业化方式未披露。
    summary_en: An individual opens this local program on a Windows PC, sets a virtual character's personality,
      and the program takes text and voice input while keeping long-term memory so the conversation runs
      locally without uploading content to the cloud; the user gets an offline-capable companion chat,
      while the memory mechanism, voice quality and delivery reliability still need verification.
    inspiration_en: 'Trend: companion chat is shifting from cloud subscriptions toward local execution,
      with privacy becoming a trade-off some users accept for weaker models. Entry: start with privacy-sensitive
      individuals who do not want intimate conversations handed to cloud providers, selling local deployment
      and data staying on-device; the open-source project discloses no pricing or paid path, so monetization
      is unknown.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在自己的电脑上想要私密陪伴对话时，设定角色性格并处理文字与语音输入，完成不把内容上传云端的持续对话。
        job_en: An individual wanting private companionship chat on their own PC sets a persona and handles
          text and voice input to sustain conversation without uploading content to the cloud.
        pain_zh: 云端陪伴产品需要把私密对话交给服务商，用户对隐私泄露和内容被留存有顾虑；离线或网络受限时云端方案不可用。
        pain_en: Cloud companion products require handing intimate conversations to a provider, raising
          privacy and retention concerns, and cloud options fail offline or on restricted networks.
        current_alternative_zh: 使用云端 AI 陪伴应用或订阅服务，接受内容上传；或完全不用，靠普通聊天工具与真人社交。
        current_alternative_en: Using cloud AI companion apps or subscriptions while accepting uploads,
          or not using them at all and relying on ordinary chat tools and human social contact.
        usage_reason_zh: 推断：相较云端陪伴应用，它在本地完成对话与记忆存储，减少把私密内容交给第三方这一步，因此在意隐私或网络受限的个人用户会在本地环境选择它；尚无用户反馈或留存证据支持长期使用。
        usage_reason_en: 'Inference: compared with cloud companion apps, it runs conversation and memory
          storage locally, removing the step of handing intimate content to a third party, so privacy-conscious
          or network-restricted individuals may choose it locally; no user feedback or retention evidence
          yet supports long-term use.'
      gates:
