        evidence_ids:
        - ev-a296ae50e3eb9083
      - gate: model
        status: insufficient
        reason: 未披露定价与付费方，to C 还是 to B 无法判断，属判断而非事实。
        evidence_ids:
        - ev-a296ae50e3eb9083
      - gate: truth
        status: insufficient
        reason: 主动短信推送的任务边界与人工确认环节未说明，交付确定性无法核验。
        evidence_ids:
        - ev-a296ae50e3eb9083
      next_validation: 收集 Airbot 官方产品页或定价页，确认它接收哪些输入、执行哪些动作、如何收费，以及是否有公开用户评价。
  artificialanalysis:
    slug: artificialanalysis
    name: Artificial Analysis
    decision: queued
    event_summary_zh: Artificial Analysis 于 2026 年 10 月 28 日发布 Intelligence Index v5，随后在 10 月 29 日与 11
      月 9 日分别将 Gemini 4 Carbon 与 Claude Fable 5.2 列为该指数第一；其候选页面还提供按用例创建自定义基准的工具。
    event_summary_en: Artificial Analysis released Intelligence Index v5 on 2026-10-28, then ranked Gemini
      4 Carbon and Claude Fable 5.2 as the top model on that index on 2026-10-29 and 2026-11-09 respectively;
      its candidate page also offers a tool to create custom benchmarks for any use case.
    category: 基础层
    project_type: new_application
    industries:
    - 软件与信息服务
    - 企业采购
    industries_en:
    - Software and IT services
    - Enterprise procurement
    jobs:
    - 企业技术选型负责人在评估多个大模型时，把候选模型和自家任务样本交给基准工具，得到可比较的评分以决定采购或上线哪个模型
    - AI 产品团队在模型换代时，用自定义基准复测同一批任务，判断新模型是否值得替换现有模型
    jobs_en:
    - An enterprise technology-selection lead evaluating several large models submits candidate models
      and in-house task samples to a benchmarking tool to get comparable scores for a procurement or launch
      decision
    - An AI product team re-running the same task set on a custom benchmark when a new model generation
      ships, to judge whether the new model is worth replacing the current one
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 企业技术选型人员或 AI 产品团队在比较多个大模型时，打开 Artificial Analysis，把候选模型和自家任务样本交给它，由它跑分并给出可比较的评分与排名；用户拿到的是模型对比结论，用于采购或替换决策，具体自定义基准的输入方式和交付形态仍待核验。
    inspiration: 趋势：模型迭代加快后，第三方独立评测成了选型环节的公共基础设施，单一榜单已不够，按用例定制评测正在出现。切入：从有明确采购预算的企业技术选型或模型供应商竞争情报切入，卖按项目出具的评测报告，而不是卖榜单流量；价格未披露，不臆测。
    summary_en: When enterprise technology-selection staff or AI product teams compare several large models,
      they open Artificial Analysis, submit candidate models and in-house task samples, and receive comparable
      scores and rankings; the deliverable is a model-comparison conclusion used for procurement or replacement
      decisions, while the exact input format and output of the custom benchmark tool still need verification.
    inspiration_en: 'Trend: as model iterations accelerate, independent third-party evaluation has become
      shared infrastructure for selection, and a single leaderboard is no longer enough, so use-case-specific
      benchmarking is emerging. Entry: start from enterprise technology selection with real procurement
      budgets or from model-vendor competitive intelligence, selling per-project evaluation reports rather
      than leaderboard traffic; pricing is undisclosed and not guessed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业技术选型负责人或 AI 产品团队在采购或替换大模型时，需要把多个候选模型放到同一批自家任务上比较，才能决定上线哪个。
        job_en: An enterprise technology-selection lead or AI product team procuring or replacing a large
          model needs to compare several candidates on the same set of in-house tasks before deciding
          which to launch.
        pain_zh: 模型厂商自报的分数口径不一，团队自己搭评测要花大量工程时间，且难以横向比较；选错模型的代价是上线后返工和成本浪费。
        pain_en: Vendor-reported scores use inconsistent methodologies, building an in-house evaluation
          takes substantial engineering time, and cross-model comparison is hard; choosing the wrong model
          means rework and wasted cost after launch.
        current_alternative_zh: 团队通常看厂商发布的榜单、社区口碑或自己临时写脚本跑几个样例，口径不统一且难以复现。
        current_alternative_en: Teams typically rely on vendor-published leaderboards, community reputation,
          or ad-hoc scripts run on a few samples, with inconsistent and hard-to-reproduce methodology.
        usage_reason_zh: 推断：相较临时脚本和厂商自报分数，它把多个模型放到统一口径下跑分并给出可比较排名，减少了团队自建评测和校准口径的那一步负担，因此有采购决策权的技术选型者会在模型换代时选择它。
        usage_reason_en: 'Inference: compared with ad-hoc scripts and vendor-reported scores, it runs
          multiple models under one methodology and produces comparable rankings, removing the step of
          building and calibrating an in-house evaluation, so technology-selection staff with procurement
          authority would choose it when a model generation changes.'
      gates:
      - gate: value
        status: supported
        reason: 它解决企业选型时多模型难以同口径比较的痛点，旧做法是看厂商榜单或临时脚本，不比较就可能选错模型返工。
        evidence_ids:
        - ev-f21ad2839c01ec8f
        - ev-08610498cc06a990
      - gate: consensus
        status: insufficient
        reason: 有社区讨论和独立评论指出独立评测难度被低估，但未见企业采购方公开采用或付费的证据。
        evidence_ids:
        - ev-08610498cc06a990
      - gate: model
        status: insufficient
        reason: 推断：买方可能是企业技术选型方或模型厂商的竞争情报需求，但公开材料未见定价页或付费路径，属判断而非已验证事实。
        evidence_ids:
        - ev-f21ad2839c01ec8f
      - gate: truth
        status: insufficient
        reason: 榜单排名更新频繁，但自定义基准能否确定性交付、评测口径是否贴近真实任务，公开材料尚不足以核验。
        evidence_ids:
        - ev-747d4fca34723fa0
        - ev-eea56632755da0e1
      next_validation: 收集 Artificial Analysis 官方定价页或企业客户案例，确认自定义基准是否按项目收费及交付形态。
  blender-ai-copilot-flow:
    slug: blender-ai-copilot-flow
    name: blender-ai-copilot-flow
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与视觉特效
    - 游戏开发
    industries_en:
    - 3D animation and VFX
    - game development
