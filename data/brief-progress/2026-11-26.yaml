      - gate: model
        status: insufficient
        reason: 开源项目未见定价或商业路径，买方可能是平台或机构，这是判断不是已验证事实。
        evidence_ids:
        - ev-469178394f2aa36c
      - gate: truth
        status: insufficient
        reason: 检测准确率与误判边界未公开，能否确定性交付核查结论待核验。
        evidence_ids:
        - ev-4af05c1194fcd71e
      next_validation: 收集该仓库的部署文档或可复现实测结果，确认检测准确率与使用方式。
