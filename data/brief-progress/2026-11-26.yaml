      format still need verification.
    inspiration_en: 'Trend: as AI coding assistants enter team workflows, proving that tuning an agent
      actually works is shifting from gut feel to auditable evidence. Entry: start with small engineering
      teams running multiple coding agents, selling before/after comparison of agent configuration changes
      rather than another code-completion tool; pricing is undisclosed.'
