      - gate: model
        status: insufficient
        reason: 未披露定价或付费路径，开源项目可能的收入来源无法从公开材料确认，这是判断而非事实。
        evidence_ids:
        - ev-c7c247006d842d51
      - gate: truth
        status: insufficient
        reason: 未说明部署失败处理、回滚与权限控制，承诺能否确定性交付仍缺公开材料。
        evidence_ids:
