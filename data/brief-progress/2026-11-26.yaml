  ollama-ollama-v04018:
    slug: ollama-ollama-v04018
    name: Ollama
    decision: market_context
    event_summary_zh: 2026年11月24日，Ollama 发布 v0.40.18，改动集中在 Metal 上的 MLX 残差融合、跨架构共享张量辅助与模型初始化、llama.cpp
      版本升级至 b12651 并移除 Jetpack5 支持，以及 Inkling2 在 Metal 上的解码、预填充与草稿轮次提速。这些是本地推理引擎的性能与兼容性更新，属于基础层工具迭代，不构成新的独立应用或行业工作流变化。
    event_summary_en: On 24 November 2026, Ollama released v0.40.18, with changes focused on MLX residual
      fusion on Metal, shared tensor helpers and model setup across architectures, a llama.cpp bump to
      b12651 with Jetpack5 support removed, and faster Metal decode, prefill and draft rounds for Inkling2.
      These are performance and compatibility updates to a local inference engine, i.e. base-layer tooling
      iteration rather than a new standalone application or a change in an industry workflow.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: Ollama 是本地运行大模型的推理引擎，开发者在自己机器上加载模型并调用接口。本次版本更新只涉及 Metal 后端算子融合、张量辅助代码复用、llama.cpp 依赖升级和特定模型的解码提速，属于底层性能维护，具体交付仍是本地推理服务本身。
    inspiration: 趋势：本地推理引擎的竞争已落到具体硬件后端和模型架构的算子级优化，说明端侧跑模型正从能用走向好用。切入：不要做又一个推理引擎，而是围绕特定行业对数据不出本地的硬约束，做封装好的本地部署交付与运维服务。
    summary_en: 'Ollama is a local LLM inference engine: developers load models on their own machines
      and call them through an API. This release only touches Metal backend operator fusion, shared tensor
      helper code, a llama.cpp dependency bump and faster decoding for a specific model; it is low-level
      performance maintenance, and the deliverable remains the local inference service itself.'
    inspiration_en: 'Trend: competition among local inference engines has moved down to operator-level
      optimisation for specific hardware backends and model architectures, showing on-device model running
      is shifting from workable to usable. Entry: don''t build another inference engine; instead package
      local deployment and operations for industries with a hard requirement that data never leaves their
      premises.'
