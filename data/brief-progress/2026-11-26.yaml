  codecheck:
    slug: codecheck
    name: CodeCheck
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 金融服务
    - 软件开发
    industries_en:
    - Financial Services
    - Software Development
    jobs:
    - 开发者在提交代码前，用插件对源码做静态安全审查并处理告警
    - 安全工程师在代码评审环节复核 AI 给出的漏洞提示
    jobs_en:
    - Developers run a static security review on source code via a plugin before committing and triage
      the alerts
    - Security engineers review AI-flagged vulnerabilities during code review
    regions:
    - 澳大利亚
    regions_en:
    - Australia
    open_source: true
    summary_zh: 开发者在提交代码前，通过 Claude Code 或 Codex 插件对源码发起一次由大模型驱动的静态安全审查，拿到漏洞提示后仍需人工确认。具体支持的漏洞类型、误报处理与交付形式仍待核验。
    inspiration: 趋势：安全审查正从独立扫描工具前移到编码代理内部，审查动作贴着写代码发生。切入：可从金融、医疗等强合规行业的代码评审环节进入，卖“审查+整改建议”的结果而非席位；该产品由银行发布，说明买方可能就是受监管机构。
    summary_en: Before committing code, developers trigger an LLM-powered static security review of source
      code through a Claude Code or Codex plugin and receive vulnerability hints that still need human
      confirmation. Supported vulnerability types, false-positive handling and delivery format remain
      unverified.
    inspiration_en: 'Trend: security review is moving from standalone scanners into coding agents, happening
      right where code is written. Entry: start from code review in regulated sectors such as finance
      and healthcare, selling review-plus-remediation outcomes rather than seats; a bank publishing it
      suggests the buyer may be the regulated institution itself.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在提交代码前，用插件对源码做静态安全审查，安全工程师在评审环节复核 AI 给出的漏洞提示。
        job_en: Developers run a plugin-based static security review on source code before committing,
          and security engineers review AI-flagged vulnerabilities during code review.
        pain_zh: 安全审查常滞后于编码，独立扫描工具需要额外配置和切换，漏洞发现晚、修复成本高。
        pain_en: Security review often lags behind coding; standalone scanners need extra setup and context
          switching, so vulnerabilities are found late and cost more to fix.
        current_alternative_zh: 独立静态扫描工具（如 SAST 平台）加人工安全评审，或在代码评审中靠人工经验排查。
        current_alternative_en: Standalone static analysis (SAST) platforms plus manual security review,
          or relying on reviewer experience during code review.
        usage_reason_zh: 推断：它把审查动作嵌进开发者已在用的编码代理，省去切换到独立扫描平台并配置规则的一步，让漏洞提示出现在提交前；受监管行业的团队更可能因此选用。
        usage_reason_en: 'Inference: it embeds review into the coding agent developers already use, removing
          the step of switching to a standalone scanner and configuring rules, so vulnerability hints
          appear before commit; teams in regulated sectors are more likely to adopt it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决安全审查滞后于编码、需切换独立扫描工具的问题，痛点刚性且交付可确定；买方是否付费未披露。
        evidence_ids:
        - ev-5eb462b8cb7c6a69
        - ev-f06e221c091f04bd
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标等关注度信号，缺少开发者实际采用或安全团队使用的公开证据。
        evidence_ids:
        - ev-f06e221c091f04bd
      - gate: model
        status: insufficient
        reason: 未披露定价与付费路径；由银行发布，推断可能走机构内部或企业采购，但这是判断不是事实。
        evidence_ids:
        - ev-5eb462b8cb7c6a69
      - gate: truth
        status: insufficient
        reason: 未公开误报率、漏报率或审查结果的可核对数据，交付确定性尚无法验证。
        evidence_ids:
        - ev-5eb462b8cb7c6a69
      next_validation: 收集该插件仓库的 issue 与 discussion，查看开发者对误报、漏报和实际使用场景的公开反馈。
