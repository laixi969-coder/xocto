        usage_reason_en: 'Inference: versus users opening a to-do app themselves, it initiates over SMS
          and removes one opening step; but push quality and task boundaries are undisclosed, so it is
          unclear why users would pick it over existing reminder tools.'
      gates:
      - gate: value
        status: insufficient
        reason: 只有一句产品定位，无法说清它解决什么具体任务与痛点，价值关证据不足。
        evidence_ids:
        - ev-a296ae50e3eb9083
      - gate: consensus
        status: insufficient
