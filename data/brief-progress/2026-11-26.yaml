    inspiration: 趋势：AI 生成代码让“能跑起来”和“能安全上线”之间的差距被拉大，安全审查正从大公司流程下沉到个人开发者。切入：从用 AI 快速搭 Supabase 后端的独立开发者和小型外包团队入手，把扫描做成上线前的固定检查步骤，或按项目交付一次性安全审查报告收费；价格未披露，不预设。
    summary_en: Developers building Next.js/Supabase apps with AI open it before launch; the scanner reads
      the codebase and configuration, checks 92 rules covering leaked secrets, Supabase row-level permission
      settings and SKILL.md prompt injection, and returns a list of issues, with the developer still deciding
      what to fix. False-positive rates and the repair workflow remain to be verified.
    inspiration_en: 'Trend: AI-generated code widens the gap between ''it runs'' and ''it is safe to ship'',
      pushing security review from big-company process down to individual developers. Entry: start with
      solo developers and small outsourcing teams who use AI to build Supabase backends, making the scan
      a fixed pre-launch step, or selling a one-off security review report per project; pricing is undisclosed
      and not assumed.'
    req_initial:
