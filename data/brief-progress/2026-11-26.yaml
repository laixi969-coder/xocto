    project_type: open_source
    industries:
    - 教育培训
    - 公共服务
    industries_en:
    - Education and training
    - Public services
    jobs:
    - 备考公务员考试的考生在整理教材与真题时，用系统解析资料、生成练习卷并批改，形成自己的复习闭环
    - 自学考生在本地部署后，用 RAG 问答查资料并跟踪薄弱知识点
    jobs_en:
    - Civil service exam candidates organizing textbooks and past papers use the system to parse materials,
      generate practice papers and grade them into a personal review loop
    - Self-study candidates deploy it locally, query materials via RAG Q&A and track weak knowledge points
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 备考公务员考试的人，面对大量教材、真题和笔记，需要整理知识点、出题自测并批改。该系统在本地解析资料、构建知识地图，用 RAG 回答提问，并生成与批改练习卷，把复习串成闭环；实际出题质量与批改准确度仍待核验。
    inspiration: 趋势：考公这类高竞争、资料密集的备考场景，正被本地部署的 AI 学习系统拆成解析、出题、批改、学情四步。切入：可从考公培训机构的题库与批改环节切入，按套卷或按批改量收费；本地部署降低资料外泄顾虑，但出题与批改的准确度是待核验的关键。
    summary_en: People preparing for China's civil service exam face large volumes of textbooks, past
      papers and notes, and need to organize knowledge points, generate self-test questions and have them
      graded. The system parses materials locally, builds a knowledge map, answers questions via RAG,
      and generates and grades practice papers into a review loop; actual question quality and grading
      accuracy still need verification.
    inspiration_en: 'Trend: high-competition, material-heavy exam prep such as civil service exams is
      being split by locally deployed AI study systems into parsing, question generation, grading and
      learning tracking. Entry: start from the question bank and grading step of exam-prep institutions,
      charging per paper set or per graded volume; local deployment reduces data-leak concerns, but question
      and grading accuracy are the key unknowns.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 备考公务员考试的考生在整理教材与真题时，需要把资料变成可自测的练习卷并得到批改，以定位薄弱知识点。
        job_en: Civil service exam candidates organizing textbooks and past papers need to turn materials
          into self-test practice papers and get them graded to locate weak knowledge points.
        pain_zh: 资料量大、手工整理知识点和出题耗时，做完题后缺少及时批改与薄弱点反馈。
        pain_en: Material volume is large, manually organizing knowledge points and writing questions
          is time-consuming, and after practice there is little timely grading or feedback on weak points.
        current_alternative_zh: 买纸质题库和网课、用通用聊天助手问答，或自己手抄整理笔记与错题。
        current_alternative_en: Buying printed question banks and online courses, asking general chat
          assistants, or hand-copying notes and wrong answers.
        usage_reason_zh: 推断：相较纸质题库与通用助手，它把资料解析、出题、批改和学情记录放在同一本地流程里，减少在多个工具间搬运资料的一步；但出题与批改准确度、是否被持续使用尚无公开证据。
        usage_reason_en: 'Inference: compared with printed question banks and general assistants, it puts
          material parsing, question generation, grading and learning records into one local workflow,
          removing a step of moving materials between tools; public evidence on question and grading accuracy
          and continued use is still missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决考公备考中资料整理、自测出题与批改的需求，痛点是手工整理和缺少及时反馈；结构上成立，属工作流推理。
        evidence_ids:
        - ev-6c8db56c499cd227
        - ev-9b93dc7146a295a0
      - gate: consensus
        status: insufficient
        reason: 星标从 44 增至 127 只说明关注度上升，没有用户评价或案例说明考生在什么场景下持续使用。
        evidence_ids:
        - ev-6c8db56c499cd227
        - ev-dd74f3335b83d12c
        - ev-9b93dc7146a295a0
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是考生个人或培训机构，属判断而非已验证事实。
        evidence_ids:
        - ev-9b93dc7146a295a0
      - gate: truth
        status: insufficient
        reason: AI 出卷与改卷的准确度、是否贴近真实考试标准，公开材料未给出可核对结果。
        evidence_ids:
        - ev-6c8db56c499cd227
      next_validation: 收集仓库 issue 或讨论中关于出题与批改准确度的用户反馈，以及是否有培训机构采用或付费的记录。
  memoryworks:
    slug: memoryworks
    name: MemoryWorks
    decision: watching
    event_summary_zh: 2026-11-24 在 AI 产品社区出现 MemoryWorks，定位为“面向人与 AI 代理的公司记忆”，公开材料只有这一句定位，未披露具体流程、客户或定价。
    event_summary_en: MemoryWorks appeared in an AI product community on 2026-11-24, positioned as "company
      memory for people and AI agents"; the public material contains only this positioning line, with
      no disclosed workflow, customers or pricing.
    category: AI + 效率
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 公开材料只说明它面向公司内部的人与 AI 代理提供“记忆”，具体是谁在什么工作节点打开、AI 接收哪些材料、执行什么动作、最终交付什么，均未披露，具体流程或交付仍待核验。
    inspiration: 趋势是团队开始把内部知识沉淀当作 AI 代理可调用的资产，而不是散落在文档和聊天里。切入可考虑从知识更新频繁、交接成本高的具体职能（如客户成功、售前方案）入手，先解决“同一问题反复向不同人解释”的环节；该产品本身尚未给出可核验的流程，不宜直接照搬。
    summary_en: The public material only says it offers "memory" for people and AI agents inside a company;
      who opens it at which work step, what materials the AI receives, what actions it performs and what
      is delivered are all undisclosed, so the concrete workflow or deliverable still needs verification.
    inspiration_en: The trend is that teams start treating internal knowledge as an asset AI agents can
      call on, rather than leaving it scattered across documents and chat. A possible entry is a specific
      function with frequent knowledge updates and costly handovers, such as customer success or pre-sales
      proposals, starting with the step where the same question is explained again to different people;
      this product itself has not shown a verifiable workflow, so it should not be copied directly.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 公开材料未说明具体使用者与工作节点，只能推断为团队成员在交接或向 AI 代理交代背景时，需要调用公司既有知识。
        job_en: The public material does not identify the user or work step; it can only be inferred that
          team members need to call on existing company knowledge when handing over work or briefing an
          AI agent.
        pain_zh: 推断：公司知识分散在文档与聊天记录中，人与 AI 代理每次都要重新获取背景，重复解释成本高。这是结构推理，不是用户陈述。
        pain_en: 'Inference: company knowledge is scattered across documents and chat logs, so people
          and AI agents must re-acquire context each time, making repeated explanation costly. This is
          structural reasoning, not a user statement.'
        current_alternative_zh: 现有做法通常是共享文档、内部 wiki 或聊天记录检索，再由人手动整理后交给 AI。
        current_alternative_en: The current approach is usually shared documents, an internal wiki or
          chat search, with a person manually assembling the context before handing it to an AI.
        usage_reason_zh: 推断：若它能把公司知识整理成人与 AI 代理都可直接调用的形式，可省去每次重新翻文档、拼背景这一步；但公开材料未说明具体动作与交付，无法确认这一负担是否真的被减少。
        usage_reason_en: 'Inference: if it can organize company knowledge into a form both people and
          AI agents can call directly, it would remove the step of re-reading documents and assembling
          context each time; however, the public material does not describe the action or deliverable,
          so it is unconfirmed whether that burden is actually reduced.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决公司知识分散、人与 AI 代理重复获取背景的问题，痛点结构成立，但公开材料只有一句定位，无法确认具体任务与交付。
        evidence_ids:
        - ev-89ab4454952de97f
      - gate: consensus
        status: insufficient
        reason: 除一条产品定位外没有用户评价、采用或社区讨论证据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-89ab4454952de97f
      - gate: model
        status: insufficient
        reason: 未披露买方、定价或收费方式；公司记忆类产品可能向企业按席位或按用量收费，但这是判断，不是已验证事实。
        evidence_ids:
        - ev-89ab4454952de97f
      - gate: truth
        status: insufficient
        reason: 无法核验记忆的准确性、更新机制与人工确认边界，承诺能否确定性交付尚不清楚。
        evidence_ids:
        - ev-89ab4454952de97f
      next_validation: 收集 MemoryWorks 官方产品页或文档，确认其输入材料、记忆更新方式与交付形态。
  mep:
    slug: mep
    name: MEP (Motion Edit Protocol)
    decision: watching
    event_summary_zh: 2026-11-19 起公开的 MEP（Motion Edit Protocol）是一个基于文件的开放协议，让任意 AI 助手编辑视频项目；其代码仓库关注数从
      59 增至 75，同期仅有 1 个未关闭 issue。
    event_summary_en: MEP (Motion Edit Protocol), public since 2026-11-19, is an open file-based protocol
      that lets any AI assistant edit a video project; its repository stars rose from 59 to 75, with only
      1 open issue in the same period.
    category: AI + 创作
    project_type: open_source
    industries:
    - 视频制作
    - 影视后期
    industries_en:
    - video production
    - post-production
    jobs:
    - 剪辑师在已有工程文件中让 AI 助手按指令修改片段与时间线，并保留可回退的工程结构
    jobs_en:
    - Editors ask an AI assistant to modify clips and timelines inside an existing project file while
      keeping a reversible project structure
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 视频剪辑师在已有剪辑工程里需要批量改动片段、时间线或参数时，MEP 让 AI 助手直接读写该工程文件来执行修改，而不是靠人逐条点选；用户最终拿到的是被改动的工程文件，仍需人工在剪辑软件中检查确认。具体支持哪些剪辑软件与操作范围仍待核验。
    inspiration: 趋势是 AI 从生成素材转向直接操作专业软件的工程文件，把“说一句改一版”带进后期流程。切入可考虑面向短视频批量生产或广告素材迭代的团队，按项目或按成片交付收费；但协议本身不是产品，真正的机会在谁能把工程文件的兼容性与回退安全做扎实。
    summary_en: When video editors need to change clips, timelines or parameters in bulk inside an existing
      editing project, MEP lets an AI assistant read and write that project file to carry out the edits
      instead of a person clicking through each item; the user receives a modified project file that still
      needs human review in the editing software. Which editors and operations are supported still needs
      verification.
    inspiration_en: The trend is AI moving from generating assets to directly operating the project files
      of professional software, bringing "say it once, get a new cut" into post-production. A possible
      entry is teams doing high-volume short-video production or ad creative iteration, charged per project
      or per finished cut; the protocol itself is not a product, and the real opportunity lies with whoever
      makes file compatibility and safe rollback solid.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 剪辑师在已有剪辑工程中需要批量调整片段、时间线或参数时，让 AI 助手直接对工程文件执行修改，再由人检查成片。
        job_en: When editors need to adjust clips, timelines or parameters in bulk within an existing
          editing project, they let an AI assistant modify the project file directly, then review the
          result themselves.
        pain_zh: 推断：剪辑软件中的重复性改动需要逐条手动点选，批量调整耗时且易漏；让 AI 参与又缺少能读写工程文件的通用接口。
        pain_en: 'Inference: repetitive changes in editing software require manual clicking item by item,
          making bulk adjustments slow and error-prone, while involving AI lacks a common interface that
          can read and write project files.'
        current_alternative_zh: 现有做法是剪辑师在软件里手动逐条修改，或把素材导出后交给生成式工具重做，工程结构随之丢失。
        current_alternative_en: The current approach is for editors to modify items manually in the software,
          or export assets and redo them with generative tools, losing the project structure.
        usage_reason_zh: 推断：相较手动逐条修改，MEP 让 AI 直接对工程文件下达改动，减少重复点选这一步；相较导出重做，它保留了可回退的工程结构，因此批量迭代素材的剪辑团队会考虑采用。
        usage_reason_en: 'Inference: compared with manual item-by-item edits, MEP lets AI issue changes
          directly to the project file, removing the repetitive clicking step; compared with exporting
          and redoing, it keeps a reversible project structure, so editing teams iterating on assets in
          bulk would consider it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决剪辑师在工程文件中批量改动需逐条手动操作的问题，旧流程明确，交付物是可回退的工程文件。
        evidence_ids:
        - ev-2bcc611de0120c19
      - gate: consensus
        status: insufficient
        reason: 仓库关注数从 59 增至 75 属关注度信号，未见用户评价或实际采用案例，不能证明持续使用。
        evidence_ids:
        - ev-065f7712a497bf68
        - ev-2bcc611de0120c19
      - gate: model
        status: insufficient
        reason: 作为开放协议本身不直接收费，商业路径可能来自配套工具或服务，但公开材料未披露，属判断而非事实。
        evidence_ids:
        - ev-2bcc611de0120c19
      - gate: truth
        status: insufficient
        reason: 未核验支持哪些剪辑软件、改动出错时如何回退，以及人工确认边界是否清晰。
        evidence_ids:
        - ev-2bcc611de0120c19
      next_validation: 查看 MEP 仓库的 README 与 issue 讨论，确认其支持的剪辑软件范围与回退机制。
