  ai-is-straining-americas-open-records-systems:
    slug: ai-is-straining-americas-open-records-systems
    name: AI-driven public records requests
    decision: market_context
    summary_zh: 美国多地的公共记录系统正因 AI 驱动的数据采集而承压：风险投资支持的初创公司已筹集超过 1 亿美元，用于从数千个机构收集数据，小镇书记员收到的采购记录请求从每年一次增至每季度、每月甚至更频繁。这推高了公共机构的响应负担与合规成本，也为自动化记录处理工具创造了需求（推断）。
    summary_en: 'US public records systems are under strain from AI-driven data harvesting: venture-backed
      startups have raised upwards of $100 million to collect data from thousands of agencies, and a small-town
      clerk saw purchasing-record requests rise from about once a year to quarterly, monthly or more.
      This raises response burdens and compliance costs for public agencies and creates demand for automated
      records-processing tools (inference).'
    event_summary_zh: 风险投资支持的初创公司已筹集逾 1 亿美元，用于从数千个美国公共机构采集记录，导致地方公共记录请求频率显著上升。
    event_summary_en: Venture-backed startups have raised upwards of $100 million to collect records from
      thousands of US public agencies, sharply increasing the frequency of local public records requests.
