    - 独立动画或建模工作者在赶交付时，需要把重复的场景整理动作交给助手执行并逐项确认
    jobs_en:
    - 3D artists building or revising a scene in Blender need to batch-adjust objects, materials and lights,
      previously done by hand-picking and writing Python scripts
    - Solo animators or modelers under delivery pressure want repetitive scene-cleanup actions executed
      by an assistant with step-by-step confirmation
    regions: []
    regions_en: []
    open_source: true
    summary_zh: Blender 用户在做场景搭建或修改时打开这个插件，把自然语言指令交给接入的模型，由它调用 27 个受监督的场景工具去改物体、材质和灯光，用户逐项确认后得到改动后的场景；具体交付边界与失败处理仍待核验。
    inspiration: 趋势是三维软件里的 AI 从生成贴图、模型，转向直接操作场景结构本身。切入可放在中小动画工作室和独立建模者的重复场景整理环节，按插件订阅或按项目交付收费；但通用大模型加工具调用能否稳定处理复杂场景，仍是这个方向的门槛。
    summary_en: Blender users open this add-on while building or revising a scene, hand natural-language
      instructions to a connected model, and the model calls 27 supervised scene tools to change objects,
      materials and lights; users confirm each step and get a modified scene. Delivery boundaries and
      failure handling still need verification.
    inspiration_en: The trend is AI inside 3D software moving from generating textures and models toward
      directly manipulating scene structure. The opening is repetitive scene cleanup for small animation
      studios and solo modelers, sold as an add-on subscription or per-project delivery; whether general
      models plus tool calls can reliably handle complex scenes remains the barrier.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 里搭建或修改场景时，需要批量调整物体、材质与灯光，原本靠手动点选或自己写 Python 脚本完成。
        job_en: 3D artists building or revising a Blender scene need to batch-adjust objects, materials
          and lights, previously done by hand-picking or writing their own Python scripts.
        pain_zh: 重复的场景整理动作耗时且容易漏改，写脚本又有门槛，非程序背景的美术师只能一遍遍手动操作。
        pain_en: Repetitive scene cleanup is slow and error-prone, and scripting has a learning curve,
          so artists without coding backgrounds repeat manual operations.
        current_alternative_zh: 手动在 Blender 界面里逐项操作，或自己写、找现成的 Python 脚本和几何节点。
        current_alternative_en: Manual item-by-item work in the Blender UI, or writing or finding existing
          Python scripts and geometry nodes.
        usage_reason_zh: 推断：相较手动点选或写脚本，用户用自然语言描述改动，由模型调用受监督的场景工具执行并逐项确认，省去把意图翻译成脚本或重复点击的那一步，因此非程序背景的美术师在批量整理场景时会选择它。
        usage_reason_en: 'Inference: versus manual picking or scripting, users describe changes in natural
          language and the model calls supervised scene tools with step-by-step confirmation, removing
          the step of translating intent into scripts or repeated clicks, so artists without coding backgrounds
          choose it for batch scene cleanup.'
      gates:
