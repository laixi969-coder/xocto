        job_zh: 用 AI 生成 Next.js/Supabase 应用的开发者，在上线前需要检查代码中的密钥泄露、数据库行级权限配置错误和提示注入风险，再决定是否修复后发布。
        job_en: Developers building Next.js/Supabase apps with AI need to check code for leaked secrets,
          misconfigured database row-level permissions and prompt-injection risks before launch, then
          decide whether to fix and ship.
        pain_zh: AI 生成的代码往往能跑但权限与密钥配置不安全，开发者缺少安全审查经验，上线后可能暴露数据；不检查的代价是数据泄露或返工。
        pain_en: AI-generated code often runs but has unsafe permission and secret settings; developers
          lack security-review experience and may expose data after launch, with leaks or rework as the
          cost of skipping checks.
        current_alternative_zh: 目前多靠人工逐文件检查、通用 SAST 工具或上线后才发现问题；这些工具不针对 Supabase 行级权限和 SKILL.md 提示注入。
