        job_en: Small dev teams or solo developers publishing code to their own servers, handling Git
          repositories and server configuration to complete a reachable, reproducible deployment.
        pain_zh: 自托管部署通常要手写 CI 脚本、配置反向代理与证书、处理环境差异，步骤零散且容易出错，没有专职运维的团队负担明显。
        pain_en: Self-hosted deployment usually requires hand-written CI scripts, reverse proxy and certificate
          setup and handling environment differences; steps are scattered and error-prone, a clear burden
          for teams without dedicated ops.
        current_alternative_zh: 手写 shell 脚本或 CI 配置、使用 Docker Compose 手动部署，或改用 Vercel、Netlify 等托管平台放弃自有服务器。
        current_alternative_en: Hand-written shell scripts or CI configs, manual Docker Compose deployment,
          or giving up own servers for hosted platforms such as Vercel or Netlify.
        usage_reason_zh: 推断：相较手写脚本，它把拉取代码、构建与上线收进一条命令，减少逐步配置服务器这一环的负担，因此没有运维岗、又想保留自有服务器的团队会在新项目上线时选择它；候选材料未提供用户反馈或留存证据。
