  fcc-signs-off-on-spacexs-plan-to-put-up-to-1-million-data-ce:
    slug: fcc-signs-off-on-spacexs-plan-to-put-up-to-1-million-data-ce
    name: SpaceX Starmind
    decision: market_context
    event_summary_zh: 2026年11月25日，美国联邦通信委员会（FCC）批准SpaceX的“Starmind”计划，允许其部署最多100万颗搭载AI芯片的卫星，并要求2033年前至少部署一颗、2040年前达到100万颗规模；FCC同时推迟了对600公里以上卫星处置方式的裁定。这是该机构首次批准完整的AI卫星星座。
    event_summary_en: On November 25, 2026, the FCC authorized SpaceX's "Starmind" initiative to deploy
      up to 1 million AI-chip-equipped satellites, requiring at least one satellite by 2033 and the 1
      million milestone by 2040, while deferring a ruling on disposal of satellites above 600km. It is
      the agency's first approval of a full AI-satellite constellation.
    summary_zh: 这是一项监管授权而非可使用的AI应用：FCC为SpaceX的太空AI数据中心星座发放许可，设定了2033年和2040年的部署节点。对AI应用而言，它意味着算力供给的一种远期可能路径，但时间跨度以十年计，短期内不改变应用侧的成本、采用或交付。
    summary_en: 'This is a regulatory authorization, not a usable AI application: the FCC licensed SpaceX''s
      space AI data-center constellation with 2033 and 2040 deployment milestones. For AI applications
      it represents a long-horizon possible compute path, but over a decade out it does not change near-term
      application cost, adoption or delivery.'
    inspiration: 趋势：算力供给开始被当作基础设施政策问题处理，太空数据中心从概念进入许可阶段。切入：对应用创业者而言，短期不应把成本押注在太空算力上；可关注的是地面推理成本与延迟敏感场景，以及围绕卫星数据回传、在轨数据处理的合规与运维服务。
    inspiration_en: 'Trend: compute supply is being treated as infrastructure policy, with space data
      centers moving from concept to licensing. Angle: application founders should not bet near-term costs
      on orbital compute; watch instead ground-side inference cost and latency-sensitive use cases, plus
      compliance and operations services around satellite data downlink and in-orbit processing.'
  from-spectrum-to-structure-identifying-molecules-with-mass-s:
    slug: from-spectrum-to-structure-identifying-molecules-with-mass-s
    name: Mass Spec Skills for Google Antigravity
    decision: watching
    event_summary_zh: 2026年11月24日，Google DeepMind发布面向Google Antigravity的Mass Spec Skills，用于解读串联质谱数据。公开材料仅说明其能力定位，未披露定价、客户采用或使用数据。
    event_summary_en: On November 24, 2026, Google DeepMind released Mass Spec Skills for Google Antigravity
      to interpret tandem mass spectra. The public material states only its capability positioning, with
      no pricing, customer adoption or usage data disclosed.
    category: AI + 开发
    project_type: new_application
    industries:
    - 生命科学
    - 化学分析
    - 制药
    industries_en:
    - life sciences
    - chemical analysis
    - pharmaceuticals
    jobs:
    - 质谱分析人员在拿到串联质谱图谱后，需要判断分子结构，原本依赖专家经验和数据库比对，现尝试让Antigravity中的技能给出候选结构并人工复核
    jobs_en:
    - mass spectrometry analysts who, after obtaining tandem mass spectra, must determine molecular structure,
      previously relying on expert judgment and database matching, now try having the Antigravity skill
      propose candidate structures for human review
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 科研或制药实验室的质谱分析人员在拿到串联质谱图谱后打开它，把谱图交给Antigravity中的技能，由模型给出可能的分子结构候选，最终仍需分析人员判断确认。具体输入格式、准确率与交付形式仍待核验。
    inspiration: 趋势：模型厂商开始把领域知识封装成可调用的“技能”，直接嵌入科研工具链。切入：质谱解读只是分析化学的一个环节，真正的机会在把谱图、化合物库与实验记录连成可复核的流程，卖给有合规要求的制药与检测实验室；但需先确认该技能是否可独立于Antigravity使用。
    summary_en: Mass spectrometry analysts in research or pharma labs open it after obtaining tandem mass
      spectra, feed the spectra to the Antigravity skill, and receive candidate molecular structures from
      the model, with analyst confirmation still required. Input formats, accuracy and delivery form remain
      to be verified.
    inspiration_en: 'Trend: model vendors are packaging domain knowledge as callable skills embedded directly
      in scientific toolchains. Angle: mass-spec interpretation is one step in analytical chemistry; the
      real opening is linking spectra, compound libraries and lab records into a reviewable workflow sold
      to regulated pharma and testing labs, but first confirm whether the skill works outside Antigravity.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 质谱分析人员在拿到串联质谱图谱后，需要判断未知分子的结构，原本靠专家经验和谱库比对完成，现在尝试让Antigravity中的技能给出候选结构再人工复核。
        job_en: Mass spectrometry analysts who, after obtaining tandem mass spectra, must determine unknown
          molecular structures, previously via expert judgment and spectral library matching, now try
          having the Antigravity skill propose candidates for human review.
        pain_zh: 谱图解读依赖少数专家，耗时长且结果依赖个人经验；谱库覆盖不到的化合物难以快速定性。
        pain_en: Spectrum interpretation depends on scarce experts, is slow, and results vary by individual;
          compounds outside library coverage are hard to identify quickly.
        current_alternative_zh: 人工读谱、商业谱库检索与专业软件比对，必要时送交资深专家复核。
        current_alternative_en: Manual spectrum reading, commercial spectral library search and specialized
          software matching, with escalation to senior experts when needed.
        usage_reason_zh: 推断：相较人工读谱与谱库检索，该技能把谱图直接转成候选结构，减少从原始谱图到初步假设的这一步手工比对，因此缺少资深专家的实验室或需要快速初筛的分析人员会尝试它；准确率与复核成本尚无公开证据。
        usage_reason_en: 'Inference: versus manual reading and library search, the skill turns spectra
          directly into candidate structures, cutting the manual matching step from raw spectrum to initial
          hypothesis, so labs lacking senior experts or needing fast triage may try it; accuracy and review
          cost lack public evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决质谱图谱解读依赖少数专家、耗时长的问题，旧流程是人工读谱与谱库比对，痛点具体且刚性。
        evidence_ids:
        - ev-5e1c64b83854dd86
      - gate: consensus
        status: insufficient
        reason: 公开材料只有能力描述，未见科研人员评价、实验室采用或案例，场景共识尚未形成。
        evidence_ids:
        - ev-5e1c64b83854dd86
      - gate: model
        status: insufficient
        reason: 未披露定价与买方路径；推断买方为制药与检测实验室，但这是判断而非已验证事实。
        evidence_ids:
        - ev-5e1c64b83854dd86
      - gate: truth
        status: insufficient
        reason: 未见准确率、误判处理与人工复核边界，交付确定性无法核对。
        evidence_ids:
        - ev-5e1c64b83854dd86
      next_validation: 收集Google DeepMind官方文档或博客中关于Mass Spec Skills的输入格式、准确率基准与是否可脱离Antigravity使用的说明。
