  lot-map-2:
    slug: lot-map-2
    name: lot-map
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在使用 Claude Code 执行多步任务时，需要旁路查看工具调用、模型步骤、钩子、技能与子代理的实时状态，以判断代理当前在做什么
    jobs_en:
    - Developers running multi-step tasks in Claude Code need a side view of live tool calls, model steps,
      hooks, skills and subagents to tell what the agent is currently doing
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在 Claude Code 聊天窗口旁打开 lot-map，它把代理的工具调用、模型步骤、钩子、技能和子代理以实时地图形式点亮，数据仅存本地，支持 8 种语言。用户拿到的是对代理执行过程的即时可视化，具体交付与人工确认环节仍待核验。
    inspiration: 趋势：编码代理承担多步任务后，过程可观测性成为新的旧流程缺口，开发者开始为“看懂代理在做什么”单独找工具。切入：从使用编码代理的团队与个人开发者进入，做本地优先的代理执行可视化与审计，可按团队席位或私有部署收费，价格未披露。
    summary_en: Developers open lot-map beside the Claude Code chat; it lights up the agent's tool calls,
      model steps, hooks, skills and subagents as a live map, stored locally and available in 8 languages.
      What users get is immediate visibility into the agent's execution; the exact deliverable and human
      confirmation steps still need verification.
    inspiration_en: 'Trend: as coding agents take on multi-step tasks, process observability becomes a
      new gap in the old workflow, and developers now look for separate tools to see what the agent is
      doing. Entry: start with teams and individual developers using coding agents, offering local-first
      agent execution visibility and audit, priced per seat or private deployment; pricing is undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在使用 Claude Code 执行多步任务时，需要旁路查看工具调用、模型步骤、钩子、技能与子代理的实时状态，以判断代理当前在做什么。
        job_en: Developers running multi-step tasks in Claude Code need a side view of live tool calls,
          model steps, hooks, skills and subagents to tell what the agent is currently doing.
        pain_zh: 编码代理执行多步任务时，聊天窗口只显示结果，开发者难以判断中间哪一步在做什么、是否走偏，排查和信任成本高。
        pain_en: When a coding agent runs multi-step tasks, the chat window shows only results; developers
          struggle to see which intermediate step is doing what and whether it has gone off track, raising
          debugging and trust costs.
        current_alternative_zh: 旧做法是翻看终端日志、逐条阅读代理输出，或凭经验猜测代理状态。
        current_alternative_en: The old approach is scrolling terminal logs, reading agent output line
          by line, or guessing the agent's state from experience.
        usage_reason_zh: 相较翻日志，lot-map 把工具调用与模型步骤以实时地图并排呈现，减少开发者逐条回溯输出以定位当前步骤的负担；推断关注代理可观测性的开发者会在调试多步任务时选择它。
        usage_reason_en: Compared with scrolling logs, lot-map presents tool calls and model steps as
          a live map side by side, reducing the burden of tracing output line by line to locate the current
          step; by inference, developers focused on agent observability will choose it when debugging
          multi-step tasks.
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者看不懂编码代理中间步骤的需求，痛点在于排查与信任成本，旧做法是翻日志，结构上成立。
        evidence_ids:
        - ev-d15139abf3b94db5
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，缺少用户评价或客户案例说明开发者是否持续使用。
        evidence_ids:
        - ev-91eb21caca17eb14
        - ev-d15139abf3b94db5
      - gate: model
        status: insufficient
        reason: 未披露定价与付费路径，买方可能是使用编码代理的团队，属判断而非已验证事实。
        evidence_ids:
        - ev-d15139abf3b94db5
      - gate: truth
        status: insufficient
        reason: 本地可视化贴近调试目标，但缺少交付确定性与人工边界说明。
        evidence_ids:
        - ev-d15139abf3b94db5
      next_validation: 收集 lot-map 仓库的 issue 与 discussion，查看开发者是否反馈持续用于日常调试。
