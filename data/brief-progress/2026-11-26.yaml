        evidence_ids:
        - ev-af01e32680c13266
      - gate: truth
        status: insufficient
        reason: 受监督工具调用与逐项确认贴近可控交付，但复杂场景下的失败处理与人工边界尚无公开材料。
        evidence_ids:
        - ev-af01e32680c13266
