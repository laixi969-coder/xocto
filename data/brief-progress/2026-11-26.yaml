    open_source: false
    summary_zh: 客服运营负责人面对呼叫中心与在线客服积累的大量会话记录，原本靠管理者主观圈定AI改造场景；ZENAVA据称从5000通会话中归纳出业务需求，帮助确定哪些环节交给AI。具体输入格式、分析动作与最终交付物仍待核验。
    inspiration: 趋势：客服AI的竞争点正从“接起电话”前移到“先判断哪些场景值得自动化”，场景发现本身成为交付环节。切入：面向中大型呼叫中心做会话挖掘与场景排序，按诊断报告或改造项目收费，而不是再卖一套对话机器人。
    summary_en: Customer-service operations leads sit on large volumes of call-center and chat transcripts
      and previously let managers pick AI scenarios by intuition; ZENAVA reportedly distills business
      needs from 5,000 conversations to decide which steps go to AI. The input format, analysis steps
      and final deliverable still need verification.
    inspiration_en: 'Trend: competition in customer-service AI is moving upstream from answering calls
      to deciding which scenarios are worth automating, making scenario discovery a deliverable in itself.
      Entry: sell conversation mining and scenario ranking to mid-size and large call centers as a diagnostic
      report or transformation project, rather than another chatbot.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 客服运营负责人在规划AI改造时，处理呼叫中心与在线客服的历史会话，要找出可自动化的高频业务场景并排出优先级。
        job_en: Customer-service operations leads planning AI adoption work through historical call-center
          and chat transcripts to find high-frequency automatable scenarios and rank them.
        pain_zh: 场景由管理者凭经验拍定，容易选错方向，改造投入后才发现不是真实高频需求。
        pain_en: Scenarios are picked from managerial intuition, so teams can invest in automation and
          only later find it does not match real high-frequency needs.
        current_alternative_zh: 人工抽听录音、看报表或由业务负责人凭印象列场景清单。
        current_alternative_en: Manually sampling recordings, reading reports, or having business owners
          list scenarios from memory.
        usage_reason_zh: 推断：相较人工抽听，产品批量读取会话并归纳需求，减少抽样覆盖不足和主观选场景这一步，因此规划AI改造的客服负责人会在立项前使用它。
        usage_reason_en: 'Inference: unlike manual sampling, the product reads conversations in bulk and
          summarizes needs, cutting the step of thin sampling and subjective scenario selection, so customer-service
          leads use it before scoping an AI project.'
      gates:
