    inspiration: 趋势：AI生成视频普及后，鉴别从“看单帧”转向按时间窗多维度交叉核查。切入：从平台内容审核或新闻事实核查的取证环节进入，按核查份数或案件收费；但需先确认检测准确率是否可核对。
    summary_en: When content moderators or fact-checkers receive a suspected AI-generated video, it calls
      sub-agents by time window to check appearance, physics, common sense, on-screen text and audio,
      producing judgments on suspicious segments; humans still review conclusions. Accuracy and deployment
      remain to be verified.
    inspiration_en: 'Trend: as AI-generated video spreads, detection shifts from single-frame inspection
      to multi-dimension cross-checking by time window. Entry: start from the forensic step of platform
      content moderation or news fact-checking and charge per check or case; first confirm whether detection
      accuracy is verifiable.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容审核或事实核查人员在收到疑似AI生成的视频时，按时间窗调用子代理检查画面、物理、常识、字幕与音频，产出可疑片段判断。
        job_en: Content moderators or fact-checkers receiving suspected AI-generated videos call sub-agents
          by time window to check appearance, physics, common sense, on-screen text and audio, producing
          judgments on suspicious segments.
        pain_zh: AI生成视频越来越逼真，人工逐帧看片难以覆盖物理与音频破绽，漏判代价高。
        pain_en: AI-generated videos grow more realistic; manual frame-by-frame review struggles to cover
          physics and audio flaws, and misses are costly.
        current_alternative_zh: 人工逐帧观看加单点检测工具，凭经验判断。
        current_alternative_en: Manual frame-by-frame viewing plus single-point detection tools, judged
          by experience.
        usage_reason_zh: 推断：它把多维度检查拆给子代理并行执行，减少人工逐帧看片和分别调用检测工具的负担，因此需要批量核查的平台审核或事实核查团队会在处理可疑视频时选择它；尚无用户反馈或采用证据。
        usage_reason_en: 'Inference: it splits multi-dimension checks across sub-agents in parallel, reducing
          manual frame-by-frame viewing and separate tool calls, so platform moderation or fact-checking
          teams needing batch checks may choose it for suspicious videos; no user feedback or adoption
          evidence yet.'
      gates:
