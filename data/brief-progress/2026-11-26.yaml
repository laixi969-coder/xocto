  ainews-math-proofs-are-landing-faster-than-we-can-read-them:
    slug: ainews-math-proofs-are-landing-faster-than-we-can-read-them
    name: AI-assisted mathematical research
    decision: market_context
    summary_zh: 2026 年 AI 辅助数学研究产出加速：年内已记录 64 项精选进展，其中 11 月占 20 项，包括谷歌 Cogentic 的六篇预印本；OpenAI 的论文目录列出
      375 个结果族共 730 篇手稿，并记录了 10 月因一处符号错误导致三篇撤稿。这表明前沿模型正被用于形式化数学发现，但产出数量与可靠性之间存在明显落差（推断）。
    summary_en: 'AI-assisted mathematical research output accelerated in 2026: 64 selected advances were
      recorded this year, 20 of them in November, including six preprints from Google''s Cogentic; OpenAI''s
      catalogue lists 730 manuscripts across 375 result families and records three October withdrawals
      after a sign error. This shows frontier models being used for formal mathematical discovery, with
      a clear gap between volume and reliability (inference).'
    event_summary_zh: 2026 年已记录 64 项 AI 辅助数学进展，11 月占 20 项；OpenAI 目录列出 375 个结果族共 730 篇手稿，并记录 10 月因符号错误撤回三篇。
    event_summary_en: Sixty-four AI-assisted math advances were recorded in 2026, 20 of them in November;
      OpenAI's catalogue lists 730 manuscripts across 375 result families and records three October withdrawals
      after a sign error.
