          from department protocols, local ordinances and internal guidelines, and leave a checkable record.
        pain_zh: 这些材料分散在部门内部文件里，通用助手查不到；警员靠记忆、翻手册或问同事，容易漏掉本地条款，处置依据难以追溯。
