      - gate: truth
        status: insufficient
        reason: 是否由 AI 驱动、删减范围如何界定未公开，交付确定性待核验。
        evidence_ids:
        - ev-062b372f127848a9
      next_validation: 收集该仓库的 README 与 issue，确认删减由 AI 还是规则驱动，以及测试通过作为保留条件的实际实现。
