  kurocat:
    slug: kurocat
    name: KuroCat
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: AI + 生活
    project_type: open_source
    industries:
    - 直播与内容创作
    - 个人软件
    industries_en:
    - Live streaming and content creation
    - Personal software
    jobs:
    - 主播或录屏创作者在直播/录制时需要一个透明置顶的桌面形象随打字动作反馈，用于画面装饰与互动
    - 个人用户在桌面输入密码等敏感操作时希望有遮挡提示，避免被旁观或录屏泄露
    jobs_en:
    - Streamers and screen-recording creators need a transparent always-on-top desktop character that
      reacts to typing for on-screen decoration and interaction
    - Individual users want a visual cover cue during sensitive typing such as passwords to avoid shoulder-surfing
      or recording leaks
    regions:
    - 中国
    - 全球
    regions_en:
    - China
    - Global
    open_source: true
    summary_zh: 主播或录屏创作者在直播、录制时打开这款开源桌面宠物，它会以透明置顶窗口跟随键盘输入做出打字动作，并可接入 OBS 作为透明源叠加到画面；用户还能用 AI 生成自定义猫形象。个人用户输入密码时它提供遮挡提示。最终交付是一个可自定义的桌面伴侣与直播叠加素材，具体
      AI 生成流程与交付质量仍待核验。
    inspiration: 趋势：桌面陪伴类小工具正从纯装饰走向“可接入直播画面 + 可自定义形象”，开源项目靠社区二创扩散。切入：面向直播与短视频创作者做可换皮、可接 OBS 的互动挂件，卖点不在模型而在形象素材与主播定制；也可切入企业录屏培训场景做敏感输入遮挡。
    summary_en: Streamers and screen-recording creators run this open-source desktop pet during broadcasts;
      it follows keyboard input with typing animations in a transparent always-on-top window and can be
      layered into OBS as a transparent source, while users can generate custom cat characters with AI.
      It also offers a cover cue during password entry. The deliverable is a customizable desktop companion
      and stream overlay asset; the AI generation flow and output quality still need verification.
    inspiration_en: 'Trend: desktop companion toys are moving from pure decoration toward stream-overlay
      integration and customizable characters, spreading through community remixes in open source. Entry:
      build swappable, OBS-ready interactive widgets for streamers and short-video creators, competing
      on character assets and creator customization rather than the model; a second angle is sensitive-input
      masking for corporate screen-recording training.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 主播或录屏创作者在直播和录制时，需要一个透明置顶、随打字动作反馈的桌面形象叠加到画面里，完成画面装饰与观众互动；个人用户在输入密码时需要一个遮挡提示。
        job_en: Streamers and screen-recording creators need a transparent always-on-top character that
          reacts to typing and overlays their footage for decoration and audience interaction; individual
          users need a cover cue when typing passwords.
        pain_zh: 直播画面缺少个性化互动元素，主播要么手工做静态贴图，要么用功能受限的同类工具；录屏或直播时输入敏感信息容易被旁观者看到。
        pain_en: Live footage lacks personalized interactive elements, so streamers either hand-make static
          overlays or use limited alternatives; sensitive input during recording can be seen by onlookers.
        current_alternative_zh: 旧做法是使用 Bongo Cat 等桌面宠物或手工制作的静态 OBS 贴图，形象固定、跨平台支持有限，遮挡需求基本靠手动切换窗口。
        current_alternative_en: The old approach is Bongo Cat-style desktop pets or hand-made static OBS
          overlays with fixed characters and limited cross-platform support; masking is mostly done by
          manually switching windows.
        usage_reason_zh: 推断：相较静态贴图，它把键盘输入直接映射为透明置顶窗口里的实时动作，并可直接作为 OBS 透明源叠加，省去主播逐帧制作或手动同步的一步；开源与多平台支持让主播能自行换形象。缺少留存与付费证据，长期使用尚未核验。
        usage_reason_en: 'Inference: unlike static overlays, it maps keystrokes directly to real-time
          motion in a transparent always-on-top window and can be layered into OBS as a transparent source,
          removing the step of frame-by-frame authoring or manual syncing; open source and multi-platform
          support let streamers swap characters themselves. Retention and payment evidence are absent,
          so sustained use is unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决直播画面缺少个性化互动元素、以及录屏时敏感输入暴露的问题；旧做法是静态贴图或手动遮挡，痛点具体但强度中等。
        evidence_ids:
        - ev-361ae82c937a7a4a
        - ev-9953cafe099eea42
      - gate: consensus
        status: insufficient
        reason: 开源仓库星数从 415 增至 1056 说明关注度上升，但缺少用户评价或主播实际采用案例，无法确认持续使用。
        evidence_ids:
        - ev-361ae82c937a7a4a
        - ev-425751a188d0ee2e
        - ev-9953cafe099eea42
      - gate: model
        status: insufficient
        reason: 项目免费开源，公开材料未披露付费路径或赞助收入，买方与收费方式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-9953cafe099eea42
      - gate: truth
        status: insufficient
        reason: 交付为本地桌面程序，确定性较高；但 AI 生成形象的实际效果与安全边界未见材料，需核验。
        evidence_ids:
        - ev-9953cafe099eea42
      next_validation: 收集该开源仓库的 issue 与 discussion，确认主播实际接入 OBS 的使用反馈与 AI 生成形象的实际效果。
