      coding tasks; it takes the existing MCP calls and context, compresses model turns and upload traffic
      so the same task uses less token quota. The exact compression method and delivery boundary still
      need verification.
    inspiration_en: 'Trend: cost of coding-agent usage is being optimized separately, leaving room for
      a plugin layer that trims token quota. Entry: sell usage governance to quota-billed teams, but first
      verify whether compression changes code correctness, otherwise it saves quota without saving rework.'
