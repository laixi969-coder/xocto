    name: inMusic
    decision: market_context
    summary_zh: 在 AI 编程代理和逆向工程工具使音乐硬件固件更容易被修改后，拥有 Akai、Moog、Native Instruments 等品牌的 inMusic 宣布将开放部分设备，转向拥抱改装社区；Roland
      等厂商尚未回应。这表明 AI 工具正在改变硬件厂商对固件封闭策略的取舍，但影响目前集中在音乐设备这一细分市场，尚不能推断整个行业已转向开源。
    summary_en: After AI coding agents and reverse-engineering tools made music-hardware firmware easier
      to modify, inMusic, the parent of Akai, Moog and Native Instruments, said it will open up some devices
      and embrace the modding community, while others such as Roland have not responded. This shows AI
      tools are shifting hardware vendors' calculus on closed firmware, but the effect is so far confined
      to the music-gear niche and does not support a claim that the whole industry has turned open source.
    event_summary_zh: inMusic 宣布将开放旗下部分音乐设备，以回应 AI 编程代理和逆向工程工具带来的固件改装潮；Roland 等厂商暂未表态。
    event_summary_en: inMusic said it will open up some of its music devices in response to firmware modding
      enabled by AI coding agents and reverse-engineering tools, while vendors such as Roland have not
      yet responded.
