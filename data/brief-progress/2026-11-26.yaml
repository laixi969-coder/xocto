        job_zh: 使用 Google Antigravity 的开发者，在长对话或大仓库任务中处理代码上下文时，需要减少模型轮次与 token 配额消耗以完成同一编码任务。
        job_en: Developers using Google Antigravity who, during long conversations or large-repo tasks,
          process code context and need to cut model turns and token quota consumption to finish the same
          coding task.
        pain_zh: 编码代理的长任务会反复调用模型并上传大量上下文，配额消耗快，开发者要么等待额度恢复，要么减少任务规模。
        pain_en: Long coding-agent tasks repeatedly call the model and upload large context, burning quota
          fast; developers either wait for quota to reset or shrink the task.
        current_alternative_zh: 旧做法是手动精简提示与上下文、拆分任务，或直接购买更高配额；这些都需要开发者自己判断和操作。
        current_alternative_en: The old way is manually trimming prompts and context, splitting tasks,
          or buying a higher quota; all require the developer to judge and act.
        usage_reason_zh: 推断：插件在不改原生界面与 diff 的前提下压缩轮次和上传流量，省去开发者手动精简上下文这一步，因此配额紧张的 Antigravity 用户会尝试它；但压缩是否影响代码正确性尚无公开验证。
        usage_reason_en: 'Inference: the plugin compresses turns and upload traffic without changing the
          native UI or diffs, removing the manual context-trimming step, so quota-constrained Antigravity
          users would try it; whether compression affects code correctness is not publicly verified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理长任务中 token 配额消耗过快的问题，痛点是配额有限与任务规模冲突，旧做法是手动精简上下文或买更高配额。
        evidence_ids:
        - ev-6285173aa97ba2fb
        - ev-a8ce2c3e9d8471a8
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 188 增至 1544 说明关注度上升，但缺少开发者实际长期使用或复用的公开证据。
        evidence_ids:
        - ev-6285173aa97ba2fb
        - ev-a8ce2c3e9d8471a8
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露；可能靠赞助或后续商业版，这是判断不是已验证事实。
        evidence_ids:
        - ev-a8ce2c3e9d8471a8
      - gate: truth
        status: insufficient
        reason: 宣称减少轮次与流量，但压缩是否改变代码正确性、是否依赖特定 Antigravity 版本，公开材料未说明。
        evidence_ids:
        - ev-6285173aa97ba2fb
      next_validation: 收集该仓库的 issue 与 discussion，核验压缩后代码正确性反馈及是否出现长期复用或版本兼容问题。
