      demand_read:
        job_zh: 教师或课程设计者在备课时把知识点交给系统，生成可逐步播放的白板讲解动画，用于课堂或自学材料。
        job_en: Teachers or course designers hand a topic to the system during lesson prep to generate
          a step-by-step whiteboard explainer animation for class or self-study.
        pain_zh: 白板讲解需要手绘、录屏、剪辑多道工序，制作一段几分钟的课往往要数小时，重复科目尤其耗人。
