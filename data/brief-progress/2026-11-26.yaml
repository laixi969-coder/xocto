      the tool proposes cuts and keeps each cut only if the project's own tests still pass, leaving a
      smaller codebase with passing tests. Whether AI or rules drive it, and how cut scope is bounded,
      still need verification.
    inspiration_en: 'Trend: AI coding is shifting from writing new code to cleaning and maintaining existing
      code, with deletion tasks becoming separately tooled. Entry: start with legacy-system maintenance
      teams and sell on the outcome that tests still pass; pricing is not disclosed in public material.'
