  ars-live-recap-dont-expect-military-attacks-on-data-centers:
    slug: ars-live-recap-dont-expect-military-attacks-on-data-centers
    name: 'Ars Live recap: Don’t expect military attacks on data centers to stop'
    decision: market_context
    summary_zh: 2026 年，中东地区首次出现针对 Amazon 数据中心的军事攻击，俄罗斯与乌克兰之间也互相对对方数据中心发动大规模无人机袭击。讨论指出，公共云数据中心因承载军方计算任务而具有军民两用属性，因而成为军事打击目标。这一变化意味着依赖公共云的
      AI 应用面临新的物理安全与连续性风险，云服务交付的韧性要求上升（推断）。
    summary_en: In 2026, Amazon data centers in the Middle East came under military attack for the first
      time, and Russia and Ukraine exchanged large-scale drone strikes on each other's data centers. The
      discussion notes that public cloud data centers are dual-use because they run military compute workloads,
      making them military targets. This means AI applications relying on public cloud face new physical-security
      and continuity risks, raising resilience requirements for cloud service delivery (inference).
    event_summary_zh: 公开讨论记录显示，2026 年中东地区首次发生针对 Amazon 数据中心的军事攻击，俄乌之间也出现针对彼此数据中心的大规模无人机互袭。
    event_summary_en: A public discussion recap notes that in 2026 Amazon data centers in the Middle East
      were attacked militarily for the first time, and Russia and Ukraine exchanged large-scale drone
      strikes on each other's data centers.
