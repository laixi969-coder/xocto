      还是规则驱动、删减范围如何界定仍待核验。
    inspiration: 趋势：AI 编程从写新代码转向清理与维护存量代码，删减类任务开始被单独工具化。切入：从遗留系统维护团队进入，按“测试仍通过”的结果交付；公开材料未披露定价。
