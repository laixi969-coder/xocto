    open_source: false
    summary_zh: 独立开发者或小团队在只有想法、还没有代码时打开 Omi X 2.0，把需求描述交给它，由它生成并部署应用；用户拿到的是可运行的生产环境应用。候选材料只有一句宣传语，具体输入形式、生成范围、人工确认环节与交付质量仍待核验。
