    - 三维美术师在 Blender 中调整场景与模型时，把 AI 提出的每一步修改先审阅再执行，并需要能按步骤撤销
    - 3D artists reviewing and approving each AI-proposed edit to a Blender scene, with step-level undo
    jobs_en:
    - 3D artists reviewing and approving each AI-proposed edit to a Blender scene, with step-level undo
    - 3D artists reviewing and approving each AI-proposed edit to a Blender scene, with step-level undo
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向 Blender 三维美术师的开源插件：AI 对场景的每次修改都以受监督的工具调用形式先提出、经用户批准后按顺序执行，可在当前步骤后取消、按名称撤销，并内置 MCP 服务器。具体交付质量与人工确认边界仍待核验。
    inspiration: 趋势：三维创作里的 AI 正从“一键生成”转向“可审阅、可撤销的受控编辑”，把责任留在美术师手里。切入：从动画与游戏外包团队中重复性场景搭建、材质调整环节进入，卖可审计的批量修改而非生成整件作品；价格未披露。
    summary_en: 'An open-source Blender add-on: each AI edit to a scene is proposed as a supervised tool
      call, approved by the user, executed in sequence, cancellable after the current step and undoable
      by name, with a built-in MCP server. Delivery quality and human-confirmation boundaries still need
      verification.'
    inspiration_en: 'Trend: AI in 3D creation is shifting from one-click generation to reviewable, undoable
      controlled edits that keep responsibility with the artist. Entry: start with repetitive scene assembly
      and material tweaks in animation and game outsourcing teams, selling auditable batch edits rather
      than whole assets; pricing is undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 中调整场景或模型时，让 AI 提出修改方案，自己逐步审阅、批准并执行，出错时按步骤撤销。
        job_en: 3D artists working in Blender let AI propose scene or model edits, then review, approve
          and execute them step by step, undoing by step when something goes wrong.
        pain_zh: 直接让 AI 改场景容易产生不可控、难回滚的改动，美术师要花时间排查和手工复原。
        pain_en: Letting AI edit scenes directly produces uncontrolled, hard-to-roll-back changes that
          artists must spend time diagnosing and manually restoring.
        current_alternative_zh: 美术师手工逐步建模与调整，或使用生成式工具后大量返工修正。
        current_alternative_en: Artists model and adjust manually step by step, or use generative tools
          and then do heavy rework to fix results.
        usage_reason_zh: 推断：相较一次性生成后返工，它把每次 AI 修改拆成先提议、再批准、按序执行并可命名撤销的步骤，减少了排查不可控改动和手工复原这一环，因此需要可控批量修改的三维美术师会在场景调整时选择它。
        usage_reason_en: 'Inference: instead of generating once and reworking, it splits each AI edit
          into propose, approve, execute in order and named undo, removing the step of diagnosing uncontrolled
          changes and restoring by hand, so 3D artists needing controlled batch edits would pick it for
          scene adjustments.'
      gates:
      - gate: value
        status: supported
        reason: 它解决三维美术师让 AI 改场景时改动不可控、难回滚的痛点，把编辑拆成可审阅可撤销的步骤，旧做法是手工调整或生成后返工。
        evidence_ids:
        - ev-da0f222c954ee755
        - ev-bb83b9120c5f5cb7
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏数缓慢增长，缺少用户评价、客户案例或采用数据，无法判断美术师是否真的把它留在工作流。
        evidence_ids:
        - ev-bb83b9120c5f5cb7
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，钱可能来自赞助或后续商业版，这是判断不是已验证事实。
        evidence_ids:
        - ev-da0f222c954ee755
      - gate: truth
        status: insufficient
        reason: 受控工具调用与按名撤销的设计贴近可审计编辑目标，但缺少实测与交付质量证据，人工确认边界仍待核验。
        evidence_ids:
        - ev-63286206de4c2dd0
      next_validation: 收集该仓库的 issue 与 discussion，查看美术师对受控编辑与撤销机制的实际使用反馈和可复现实测记录。
