    summary_zh: 移动应用测试人员在版本发布前打开它，把原本要人工在多台真机或模拟器上逐个点按的界面流程交给多个并行代理执行；代理在iOS模拟器和Android模拟器上走查，找出流程中断、翻译、布局和无障碍问题，最终产出缺陷清单，仍需人工确认哪些是真实缺陷。
    inspiration: 趋势：移动端质量检查正从人工逐机点按转向代理并行走查，测试成本从设备与人手转向用例设计与结果复核。切入：从中小App团队发布前的多语言与无障碍回归测试进入，按次或按项目卖走查报告，而非只卖开源脚本；缺陷判定的人工复核环节是差异化空间。
    summary_en: Mobile app testers open it before a release and hand the UI flows they used to tap through
      manually on multiple devices or emulators to several parallel agents; the agents walk iOS Simulators
      and Android emulators to find broken flows, translation, layout and accessibility bugs and produce
      a defect list, which humans still need to confirm.
    inspiration_en: 'Trend: mobile quality checks are shifting from manual device-by-device tapping to
      parallel agent walkthroughs, moving testing cost from devices and hands to case design and result
      review. Entry: start with pre-release multi-language and accessibility regression testing for small
      app teams, selling walkthrough reports per run or per project rather than only an open-source script;
      human confirmation of defects is the differentiation space.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 移动应用测试工程师或开发者在版本发布前，需要覆盖多机型、多语言界面流程与无障碍检查，用并行代理在模拟器上跑用例并汇总缺陷清单。
        job_en: Mobile QA engineers or developers before a release need to cover multi-device, multi-language
          UI flows and accessibility checks, using parallel agents on emulators to run cases and compile
          a defect list.
        pain_zh: 多设备、多语言的界面走查靠人工逐台点按，覆盖慢且容易漏掉翻译、布局和无障碍问题，发布前回归成本高。
        pain_en: Multi-device, multi-language UI walkthroughs rely on manual tapping device by device,
          which is slow to cover and easily misses translation, layout and accessibility issues, making
          pre-release regression costly.
        current_alternative_zh: 人工在多台真机或模拟器上逐项点按，或使用传统UI自动化脚本，需要自行编写和维护用例。
        current_alternative_en: Humans tap through items on multiple real devices or emulators, or use
          traditional UI automation scripts that must be written and maintained by hand.
        usage_reason_zh: 推断：相较人工逐台点按，它用多个并行代理同时在模拟器上走查并直接产出缺陷清单，减少了逐设备重复操作和人工记录这一步，因此需要快速覆盖多机型回归的移动团队会在发布前选择它。
        usage_reason_en: 'Inference: compared with manual device-by-device tapping, it uses several parallel
          agents to walk emulators at once and directly produce a defect list, removing repeated per-device
          operation and manual logging, so mobile teams needing fast multi-device regression coverage
          would choose it before release.'
      gates:
      - gate: value
        status: supported
        reason: 它解决发布前多机型、多语言界面走查覆盖慢、易漏的问题，旧做法是人工逐台点按或自维护UI脚本，痛点具体。
        evidence_ids:
        - ev-d0c165ffb8b85376
      - gate: consensus
        status: insufficient
        reason: 仓库星标快速增长说明开发者关注，但缺少真实团队采用、缺陷命中率或持续使用的公开证据。
        evidence_ids:
        - ev-eb7c0cbafbabe3f4
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方；可能靠托管服务或企业支持变现，这是判断不是已验证事实。
        evidence_ids:
        - ev-d0c165ffb8b85376
      - gate: truth
