    jobs:
    - 开发者在同时使用多个编码代理时，把同一任务分派给不同代理并汇总异步结果
    jobs_en:
    - Developers dispatching the same task across multiple coding agents and collecting asynchronous results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者同时使用 Codex、Claude Code 等多个编码代理时，cospan 通过一个异步委派协议把任务分发给不同代理并回收结果，让用户在一个入口管理多代理协作。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势是多编码代理并存，开发者开始需要跨代理的调度层；切入可从已同时订阅两三个编码代理的小型工程团队入手，卖统一调度与结果汇总，而非再做一个编码代理。
    summary_en: When developers use several coding agents such as Codex and Claude Code at once, cospan
      routes tasks to different agents through one asynchronous delegation protocol and collects the results,
      giving users a single entry point for multi-agent work. The exact deliverables and human review
      steps still need verification.
    inspiration_en: The trend is multiple coding agents coexisting, creating demand for a cross-agent
      scheduling layer; the entry point is small engineering teams already paying for two or three coding
      agents, selling unified dispatch and result aggregation rather than another coding agent.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者同时订阅多个编码代理时，需要把同一开发任务分派给不同代理，并汇总各自的异步输出。
        job_en: Developers subscribed to multiple coding agents need to dispatch the same development
          task to different agents and aggregate their asynchronous outputs.
        pain_zh: 多个代理各有界面和会话，任务分派与结果回收要人工在多个窗口间搬运，容易丢失上下文和进度。
        pain_en: Each agent has its own interface and session, so dispatching tasks and collecting results
          requires manual copying between windows, risking lost context and progress.
        current_alternative_zh: 开发者手动在多个代理窗口间切换、复制提示词和结果，或只固定用一个代理。
