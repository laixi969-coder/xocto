        job_en: Game or film artists producing Unreal-ready characters from photos or existing meshes,
          completing modeling, texturing and MetaHuman delivery inside Blender.
        pain_zh: 角色建模与皮肤、面部细节重建耗时长，且从 Blender 到 Unreal MetaHuman 的转换需要反复手工调整，拖慢项目排期。
        pain_en: Character modeling and skin/facial detail reconstruction are time-consuming, and converting
          from Blender to Unreal MetaHuman requires repeated manual adjustment, slowing project schedules.
        current_alternative_zh: 美术在 Blender 或 ZBrush 中手工雕刻与贴图，再手动导入 Unreal 调整 MetaHuman 参数，或外包给角色制作团队。
        current_alternative_en: Artists sculpt and texture manually in Blender or ZBrush, then manually
          import into Unreal to tune MetaHuman parameters, or outsource to character production teams.
        usage_reason_zh: 推断：相较纯手工雕刻与手动转换，它把照片/网格贴合、皮肤重建和 MetaHuman 输出串成一条自动链路，减少重复建模与格式转换的手工步骤，因此赶排期的独立游戏团队和外包角色工作室会在角色资产量产时选择它。
        usage_reason_en: 'Inference: compared with pure manual sculpting and manual conversion, it chains
          photo/mesh fitting, skin reconstruction and MetaHuman output into one automated path, cutting
          repetitive modeling and format-conversion steps, so schedule-pressed indie game teams and outsourced
          character studios would choose it for volume character asset production.'
      gates:
      - gate: value
        status: supported
        reason: 它解决角色建模与皮肤重建耗时长、Blender 到 Unreal 转换反复手工调整的痛点，旧流程与不解决的后果清晰，属工作流推理。
        evidence_ids:
