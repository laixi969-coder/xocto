    summary_zh: 短视频运营者或播客制作人在直播、长访谈结束后，把数小时的原始录像交给自部署的 PeakCut，由它调用用户自带的 AI 密钥定位高光片段并切出短片；用户拿到的是可发布的片段文件，仍需自行复核与调整。具体剪辑精度、导出规格与人工确认环节仍待核验。
    inspiration: 趋势：长视频到短视频的切片正从人工拖时间轴，变成由模型先定位高光再自动出片，且开源自部署形态把素材留在本地。切入：面向直播机构、播客与知识类账号做按条计费的切片交付，卖成片而非软件席位；开源版已证明有人愿意折腾部署，缺的是替他们承担算力与审片的那一层。
    summary_en: Short-video operators or podcast producers, after a livestream or long interview, feed
      hours of raw footage into a self-hosted PeakCut, which uses the user's own AI key to locate highlight
      segments and cut clips; users receive publishable clip files and still need to review and adjust
      them. Clip accuracy, export specs and the human review step remain to be verified.
    inspiration_en: 'Trend: turning long video into shorts is moving from manually scrubbing a timeline
      to a model locating highlights and auto-cutting, with self-hosted open source keeping footage local.
      Entry: sell per-clip delivery to livestream agencies, podcasts and knowledge accounts, charging
      for finished clips rather than seats; the open-source version shows people will deploy it, and the
      missing layer is someone absorbing compute and review for them.'
