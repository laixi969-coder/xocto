        - ev-56983b8ab21bde6c
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是工作室或外包团队，但这是判断而非已验证事实。
        evidence_ids:
        - ev-56983b8ab21bde6c
      - gate: truth
        status: insufficient
        reason: 代理在 Blender 内执行操作的可控性、出错修正与人工边界未见材料，交付能否确定性发生仍待核验。
        evidence_ids:
