    summary_zh: 使用 Google Antigravity 的开发者，在多智能体任务卡住或测试未过时，打开这个插件，AI 按任务路由指令与智能体、在只读模式下换视角排查并自动续跑，用户得到继续推进的任务与右侧控制面板；实际效果仍待核验。
