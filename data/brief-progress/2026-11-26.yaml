    summary_zh: 面向黑色星期五期间的消费者，在选购时滑动浏览 Shopify 店铺的真实购物车优惠，帮助筛选并决定购买。公开材料只有一句描述，AI 具体接收什么、如何筛选与呈现优惠均未说明，具体流程与交付仍待核验。
    inspiration: 趋势：促销季的比价与筛选开始被做成滑动式发现界面。切入：从促销季集中、SKU 海量的独立站卖家或导购场景切入，按成交佣金或商家推广收费；需先确认优惠数据来源与是否实时。
    summary_en: For Black Friday shoppers, Hold'em lets users swipe through real cart deals across Shopify
      stores to filter and decide purchases. Public material offers only a one-line description; what
      the AI receives and how deals are filtered and presented are unstated, so the workflow and delivery
      remain to be verified.
    inspiration_en: 'Trend: promo-season price comparison and filtering is being turned into a swipe-based
      discovery interface. Entry: start with independent-store sellers or shopping guides during concentrated
      promo seasons with huge SKUs, charging per transaction commission or merchant promotion; first confirm
      deal data sources and real-time freshness.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 消费者在黑色星期五选购时，滑动浏览 Shopify 店铺的真实购物车优惠，筛选并决定购买。
        job_en: A shopper swipes through real Black Friday cart deals across Shopify stores to filter
          and decide purchases.
        pain_zh: 促销季优惠分散在大量独立站，消费者需逐个比价、判断真假折扣，耗时且易错过。
        pain_en: Promo-season deals are scattered across many independent stores; shoppers must compare
          one by one and judge real discounts, which is time-consuming and easy to miss.
        current_alternative_zh: 逐个访问店铺、看优惠汇总帖或比价网站，手动记录与比较。
        current_alternative_en: Visiting stores one by one, reading deal roundups or comparison sites,
          and manually tracking and comparing.
        usage_reason_zh: 推断：相较逐个逛店比价，滑动式浏览把分散的购物车优惠集中呈现，省去逐个打开店铺这一步；促销季集中购物的消费者会因此试用。公开材料未说明优惠数据来源与更新频率。
        usage_reason_en: 'Inference: instead of browsing stores one by one, swipe browsing aggregates
          scattered cart deals, removing the step of opening each store; shoppers during concentrated
          promo seasons would try it. Public material does not state deal data sources or update frequency.'
      gates:
      - gate: value
        status: supported
        reason: 它解决促销季优惠分散、比价耗时的需求，旧做法是逐个逛店或看汇总帖，结构上成立。
        evidence_ids:
        - ev-6347e36eaa19954f
      - gate: consensus
        status: insufficient
        reason: 仅有产品页一句描述，无用户评价或采用规模证据。
        evidence_ids:
        - ev-6347e36eaa19954f
      - gate: model
        status: insufficient
        reason: 未披露定价与收费方式；按成交佣金或商家推广收费是推断。
        evidence_ids:
        - ev-6347e36eaa19954f
      - gate: truth
        status: insufficient
        reason: 未说明优惠数据来源、实时性与是否含真实购物车价格，交付确定性待核验。
        evidence_ids:
        - ev-6347e36eaa19954f
      next_validation: 收集 Hold'em 官方产品页，确认优惠数据来源、更新频率与是否展示真实购物车价格。
  image-to-sculpt:
    slug: image-to-sculpt
    name: image-to-sculpt
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 3D 建模与数字内容制作
    - 游戏与影视美术
    industries_en:
    - 3D modeling and digital content production
    - Game and film art
    jobs:
    - 3D 美术师或独立建模者在只有一张参考图时，用编码代理驱动 Blender 反复拟合视图，产出与参考图对齐的雕刻模型
    jobs_en:
    - 3D artists or independent modelers with only one reference image use a coding agent to drive Blender
      through repeated view fitting and produce a sculpt aligned to that image
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 3D 美术师或独立建模者手上只有一张参考图时，可让编码代理调用这个开源技能：它按参考图配准视角、做多轮贴图拟合，并在 Blender 中回放生成过程，最终得到与参考图对齐的雕刻模型和过程录像。具体精度、可编辑性与人工修正环节仍待核验。
    inspiration: 趋势：单张图片到可编辑 3D 资产的链路正被拆成可复用的代理技能，而不是一个大而全的建模软件。切入：从游戏外包、手办与道具打样这类“先有参考图、再要可改模型”的小批量环节进入，按交付模型或打样件收费，而不是卖工具订阅。
    summary_en: 'When a 3D artist or independent modeler has only one reference image, they can have a
      coding agent run this open-source skill: it registers views against the image, performs multiple
      map-fitting passes, and replays the build in Blender, yielding a sculpt aligned to the reference
      plus a process recording. Actual accuracy, editability and the human correction step still need
      verification.'
    inspiration_en: 'Trend: the path from a single image to an editable 3D asset is being split into reusable
      agent skills rather than one monolithic modeling suite. Entry: start with small-batch game outsourcing,
      figurine and prop prototyping where a reference image must become an editable model, and charge
      per delivered model or prototype rather than per-seat software.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 3D 美术师或独立建模者只有一张参考图时，用编码代理驱动 Blender 反复拟合视角，产出与参考图对齐的雕刻模型。
        job_en: A 3D artist or independent modeler with only one reference image uses a coding agent to
          drive Blender through repeated view fitting to produce a sculpt aligned to that image.
        pain_zh: 从单张图手工重建 3D 模型需要反复对位、调形和重做，耗时且依赖熟练度；不做的后果是参考图无法快速转成可编辑资产。
        pain_en: Manually rebuilding a 3D model from a single image requires repeated alignment, reshaping
          and rework, is slow and skill-dependent; without it, a reference image cannot quickly become
          an editable asset.
        current_alternative_zh: 旧做法是建模师在 Blender 或同类软件里手工对图建模，或使用图生 3D 模型服务再大量修模。
        current_alternative_en: The old way is a modeler hand-building against the image in Blender or
          similar software, or using image-to-3D services and then heavily fixing the mesh.
        usage_reason_zh: 推断：相较纯手工对图建模，它把视角配准与多轮贴图拟合交给代理自动执行并回放过程，减少反复对位这一步负担，因此只有单张参考图、又需要可编辑模型的独立建模者或小团队会尝试它。
        usage_reason_en: 'Inference: compared with purely manual image-based modeling, it hands view registration
          and multiple map-fitting passes to an agent that also replays the process, cutting the repeated
          alignment step, so independent modelers or small teams with a single reference image who need
          an editable model would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单张参考图转可编辑 3D 模型时反复对位与调形的痛点，旧流程是手工对图建模，结构上成立；精度与人工修正量仍待核验。
        evidence_ids:
        - ev-9d1de00443b40eb1
        - ev-815fd574b75e01c9
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 305 增至 345 的关注度信号，缺少用户评价、案例或重复使用证据，不能证明已进入工作流。
        evidence_ids:
        - ev-9d1de00443b40eb1
        - ev-815fd574b75e01c9
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价与买方，可能靠定制交付或服务收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-815fd574b75e01c9
      - gate: truth
        status: insufficient
        reason: 交付是否确定性发生、模型精度能否满足生产要求、人工修模边界如何，公开材料均未说明。
        evidence_ids:
        - ev-9d1de00443b40eb1
      next_validation: 收集仓库 issue 与 discussion 中用户对生成模型精度、修模工作量和 Blender 回放可用性的实际反馈。
  inkling-2-mini:
    slug: inkling-2-mini
    name: Inkling 2 Mini
    decision: market_context
    event_summary_zh: Thinking Machines Lab 于 2026 年 11 月 20 日发布开源权重模型 Inkling 2 Mini，权重约 20GB，官方演示在 48GB
      内存的 MacBook Pro 上离线运行，模型卡推荐 32GB 及以上内存的 Apple silicon 或 32GB 及以上显存的其他 GPU；11 月 24 日该模型上线 Vercel
      AI Gateway，11 月 25 日出现单张 RTX PRO 6000 上的推理优化实践。
    event_summary_en: Thinking Machines Lab released the open-weight model Inkling 2 Mini on November
      20, 2026, with roughly 20GB of weights; the official demo ran offline on a 48GB MacBook Pro, while
      the model card recommends Apple silicon with 32GB+ memory or other GPUs with 32GB+ VRAM. It became
      available on Vercel AI Gateway on November 24, and inference optimization on a single RTX PRO 6000
      appeared on November 25.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 这是模型发布而非独立应用：Thinking Machines Lab 发布开源权重模型，开发者可在本地高内存设备上离线推理。它对应用层的影响是本地部署门槛与推理成本可能变化，但具体成本降幅与采用情况仍待核验。
    inspiration: 趋势：开源权重模型向可本地运行的小体量推进，应用层可把敏感数据的处理留在本地。切入：从对数据出境敏感、又需要离线可用的行业（如法律、医疗文书处理）进入，做围绕本地模型的工作流封装；这是推断，尚无该模型在垂直行业的采用证据。
    summary_en: 'This is a model release rather than a standalone application: Thinking Machines Lab published
      open weights that developers can run offline on high-memory local devices. Its implication for applications
      is a possible shift in local deployment thresholds and inference cost, though the actual cost reduction
      and adoption remain unverified.'
    inspiration_en: 'Trend: open-weight models are moving toward locally runnable small sizes, letting
      application layers keep sensitive data processing on-device. Entry: start with industries sensitive
      to data leaving premises but needing offline availability, such as legal or medical document handling,
      and wrap workflows around the local model; this is inference, with no adoption evidence in vertical
      industries yet.'
  intelligent-organization:
    slug: intelligent-organization
    name: intelligent-organization
    decision: watching
    event_summary_zh: 该开源仓库于 2026 年 11 月 15 日创建，11 月 24 日至 26 日星标数从 396 增至 489；项目自述为人与 AI Agent 按原子能力协作，串联目标、分工、进展、成果、验收与交接，当前仅支持本机多账号，跨设备协作列为后续方向。
    event_summary_en: The open-source repository was created on November 15, 2026, and its stars rose
      from 396 to 489 between November 24 and 26. It describes itself as coordinating humans and AI agents
      by atomic capabilities across goals, division of labor, progress, outputs, acceptance and handover;
      it currently supports only local multi-account use, with cross-device collaboration listed as future
      work.
    category: AI + 效率
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 研发团队负责人在多人多 Agent 并行开发时，处理任务拆分、进展同步与成果验收材料，要完成分工与交接的闭环
    jobs_en:
    - R&D team leads handling task breakdown, progress sync and deliverable acceptance materials when
      multiple people and agents work in parallel, aiming to close the loop of division of labor and handover
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 研发团队负责人在多人、多 AI Agent 并行推进任务时打开它，把目标、分工、进展、成果与验收记录串成一条链，减少重复沟通与返工；当前只支持本机多账号，跨设备协作尚未提供，具体交付形态仍待核验。
    inspiration: 趋势：多 Agent 并行工作后，协调与验收成为新的瓶颈，而非生成能力本身。切入：从研发团队的任务交接与验收环节进入，卖法可围绕团队协作而非单席位；这是推断，尚无付费或留存证据。
    summary_en: R&D team leads open it when people and multiple AI agents work in parallel, chaining goals,
      division of labor, progress, outputs and acceptance records to cut repeated communication and rework.
      It currently supports only local multi-account use, cross-device collaboration is not yet available,
      and the exact deliverable form remains unverified.
    inspiration_en: 'Trend: once multiple agents work in parallel, coordination and acceptance become
      the new bottleneck rather than generation itself. Entry: start from the task handover and acceptance
      step in R&D teams, potentially selling team-level collaboration rather than per-seat; this is inference,
      with no payment or retention evidence yet.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 研发团队负责人在多人、多 AI Agent 并行推进任务时，处理任务拆分、进展同步与成果验收材料，要完成分工与交接的闭环。
        job_en: R&D team leads handling task breakdown, progress sync and deliverable acceptance materials
          when people and multiple AI agents work in parallel, aiming to close the loop of division of
          labor and handover.
        pain_zh: 多 Agent 并行后，目标、分工与验收散落在聊天和文档里，重复沟通与返工频发，交接时难以确认谁做了什么、成果是否达标。
        pain_en: With parallel agents, goals, division of labor and acceptance are scattered across chats
          and documents, causing repeated communication and rework, and making it hard at handover to
          confirm who did what and whether outputs meet the bar.
        current_alternative_zh: 用聊天群、任务看板与文档手工同步，靠人记忆和口头确认交接。
        current_alternative_en: Manual syncing via chat groups, task boards and documents, relying on
          memory and verbal confirmation for handover.
        usage_reason_zh: 相较手工在聊天与文档间同步，它把目标、分工、进展、成果与验收记录串成一条链，减少交接时反复确认这一步负担；推断研发团队在多 Agent 并行时会因此选择它，但尚无用户反馈或留存证据。
        usage_reason_en: Compared with manually syncing across chats and documents, it chains goals, division
          of labor, progress, outputs and acceptance records, reducing the burden of repeated confirmation
          at handover; inference suggests R&D teams would choose it for parallel agents, but there is
          no user feedback or retention evidence yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决多 Agent 并行时分工、进展与验收散落导致的重复沟通和返工，痛点具体，旧做法是聊天与文档手工同步。
        evidence_ids:
        - ev-f8585781a9b0ab19
        - ev-47c072743a5eac16
      - gate: consensus
        status: insufficient
        reason: 星标数在数日内增长，说明有关注度，但仓库无 issue、无用户评价，无法判断是否形成持续使用共识。
        evidence_ids:
        - ev-e46a4b3ef5d53a89
        - ev-47c072743a5eac16
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或买方说明；钱可能来自团队订阅或企业部署，这是判断而非已验证事实。
        evidence_ids:
        - ev-47c072743a5eac16
      - gate: truth
        status: insufficient
        reason: 当前仅支持本机多账号，跨设备协作未提供，多人协作这一核心承诺能否确定性交付仍待核验。
        evidence_ids:
        - ev-47c072743a5eac16
      next_validation: 收集该仓库的 issue 与 discussion，确认是否有团队实际用于多人多 Agent 的任务交接与验收。
