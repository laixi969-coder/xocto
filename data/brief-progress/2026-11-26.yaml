  together-ai:
    slug: together-ai
    name: Together AI
    decision: market_context
    event_summary_zh: 2026年11月22日，Together AI 发布安全事件说明，承认2026年6月和7月的部分请求存在提示词泄露；此前它被列入 Madrona 2026 Intelligent
      Applications 40 的 Enabler 阶段，材料称其与 Baseten、Fireworks、Fal、OpenRouter 的估值同比约翻倍或更多，GPU 容量与多模型路由需求超过供给。
    event_summary_en: On 22 November 2026, Together AI published a security-event notice acknowledging
      prompt leakage in some requests from June and July 2026; it had earlier been named to Madrona's
      2026 Intelligent Applications 40 in the Enabler stage, with the material stating that it and Baseten,
      Fireworks, Fal and OpenRouter are roughly doubling or more their valuations year over year as demand
      for GPU capacity and multi-model routing outstrips supply.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Together AI 是面向开发者的模型推理与 GPU 算力平台，本次新增事实是它披露了2026年6至7月部分请求的提示词泄露事件；材料同时把它列为算力与多模型路由供给紧张下的基础设施受益方。对
      AI 应用的含义是：把推理外包给第三方平台时，提示词与请求内容的隔离和审计成为交付风险的一部分，应用方需要把供应商安全事件纳入选型与合规成本。
    inspiration: 这属于基础设施层的竞争与风险变化，不是可抄的应用切口；对创业者的提示是，模型路由与算力供给的议价权仍在平台侧，应用层的机会更可能出现在对数据隔离、可审计交付有硬要求的垂直场景，而不是再做一个聚合层。
    summary_en: Together AI is a model-inference and GPU compute platform for developers; the new fact
      is its disclosure of prompt leakage affecting some requests in June and July 2026, while the material
      also places it among infrastructure beneficiaries of tight GPU capacity and multi-model routing
      supply. For AI applications this means outsourcing inference makes prompt and request isolation
      and auditing part of delivery risk, so application builders must price supplier security incidents
      into vendor selection and compliance.
    inspiration_en: This is an infrastructure-layer competition and risk shift rather than a copyable
      application wedge; the implication for founders is that bargaining power in routing and compute
      remains with platforms, so application-layer openings are more likely in vertical settings with
      hard data-isolation and auditable-delivery requirements than in building another aggregation layer.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 开发团队在构建需要多模型调用或大规模推理的 AI 应用时，把模型托管与算力调度交给第三方平台，以完成上线交付。
        job_en: Development teams building AI applications that need multi-model calls or large-scale
          inference hand model hosting and compute scheduling to a third-party platform to ship their
          product.
        pain_zh: 自建推理集群需要 GPU 采购、调度与运维能力，小团队难以承担；但外包又带来请求内容与提示词暴露给第三方的风险，本次泄露事件正说明这一痛点。
        pain_en: Self-hosting inference requires GPU procurement, scheduling and operations that small
          teams struggle to sustain, yet outsourcing exposes request content and prompts to a third party,
          as the disclosed leakage illustrates.
        current_alternative_zh: 自建 GPU 集群、直接调用单一模型厂商 API，或使用其他推理托管与路由服务。
        current_alternative_en: Building in-house GPU clusters, calling a single model vendor's API directly,
          or using other inference-hosting and routing services.
        usage_reason_zh: 推断：团队选择它是因为可在同一平台切换多个模型并按需扩容，省去自建调度这一步；但本次安全事件削弱了其在敏感数据场景下的说服力，是否仍被长期留在工作流中缺少公开留存证据。
        usage_reason_en: 'Inference: teams choose it to switch among multiple models on one platform and
          scale on demand, removing the need to build scheduling themselves; however, the security incident
          weakens its case for sensitive-data workloads, and public evidence that it stays in workflows
          long term is lacking.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决的是推理托管与多模型路由需求，痛点真实，但本次材料以安全事件和估值为主，未给出具体应用方交付结果。
        evidence_ids:
        - ev-9258e7c855c5dc6a
        - ev-91987420534bff3b
      - gate: consensus
        status: insufficient
        reason: 仅有榜单入选与社区讨论，缺少可归因到该平台的功能级采用或留存数据。
        evidence_ids:
        - ev-9258e7c855c5dc6a
      - gate: model
        status: insufficient
        reason: 材料只提到估值同比翻倍，未披露定价结构、客户付费或合同细节，买方与收费路径无法核验。
        evidence_ids:
        - ev-9258e7c855c5dc6a
      - gate: truth
        status: challenged
        reason: 官方承认提示词泄露，说明交付的确定性与数据隔离承诺存在缺口，需看后续整改说明。
        evidence_ids:
        - ev-91987420534bff3b
      next_validation: 收集 Together AI 官方安全事件页的后续整改说明与状态页记录，核验提示词泄露的范围、修复措施与对客户的通知方式。
