    event_summary_en: A customer-case report dated 2026-11-23 says Tianrun Rongtong ZENAVA identified
      business needs from 5,000 conversations instead of letting managers define AI scenarios by intuition;
      beyond the headline, it gives no client name, deployment scope or outcome data.
    category: AI + 商业
    project_type: ai_transformation
    industries:
    - 客户服务
    - 企业软件
    industries_en:
    - Customer Service
    - Enterprise Software
    jobs:
    - 客服运营负责人在梳理呼叫中心与在线客服的会话记录时，需要从大量对话中找出可交给AI处理的业务场景，并据此确定改造范围
    jobs_en:
