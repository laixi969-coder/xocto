      description, and it generates and deploys an application; the user receives a running production
      application. The candidate material contains only a tagline, so the input format, generation scope,
      human confirmation steps and delivery quality still need verification.
    inspiration_en: 'Trend: compressing idea-to-launch into a single conversation is turning application
      building from outsourced engineering into something an individual can finish. Entry: avoid a general-purpose
      generator for everyone; start from a standard business system in one vertical (e.g. small-clinic
      booking, freight quote sheets) and charge for a delivered, live system rather than selling seats.'
