      and requests approval when needed. The user receives completed actions, with key steps still requiring
      human confirmation. The concrete workflows and delivery boundaries remain to be verified.
    inspiration_en: The trend is agents moving from chat windows onto the local desktop to operate files
      and web pages directly. The opening is to package such local agents into routine task bundles for
      specific occupations, such as finance reconciliation or e-commerce backend checks, charging per
      task outcome rather than selling a generic agent framework.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户或小团队在桌面上需要跨多个应用完成重复性杂事（如整理文件、巡检网页后台）时，打开 PiBot 用自然语言下达任务，由它执行多步操作并交付结果。
        job_en: An individual or small team facing repetitive cross-application chores on the desktop,
          such as organizing files or checking web backends, opens PiBot, issues a natural-language task,
          and lets it perform multi-step actions and deliver results.
        pain_zh: 这类杂事需要在多个应用间手动切换、重复点击，耗时且易漏；现有通用聊天助手无法直接操作本地电脑与浏览器。
        pain_en: Such chores require manual switching across applications and repeated clicking, which
          is time-consuming and error-prone; existing general chat assistants cannot directly operate
          the local computer and browser.
        current_alternative_zh: 用户目前靠手动操作各应用，或使用脚本与单一自动化工具拼接，缺少能理解自然语言并跨应用执行的本地代理。
        current_alternative_en: Users currently operate each application manually or stitch together scripts
