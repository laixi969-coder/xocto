      this set of roles and group templates, assign the task to multiple AI roles, and require each role
      to submit evidence, explain its steps and hand off results; the user ends up with a verifiable division
      of labour and handoff record, but still confirms the conclusions themselves. The exact workflow
      and deliverable form remain to be verified.
    inspiration_en: 'Trend: one person using multiple AI roles to do work that used to need a small team
      is moving from single chats toward a process of division, evidence-checking and handoff. Entry:
      start from the task-splitting and acceptance step of solo developers and small outsourcing teams
      after they win a job, selling verifiable handoff records rather than model capability; the repository
      shows attention only, with no payment or retention evidence yet.'
