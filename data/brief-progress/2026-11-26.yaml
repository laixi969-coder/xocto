      能换算成可核对成本。
    summary_en: Developers using Google Antigravity open this plugin when long sessions hit context-quota
      limits or crashes; it keeps the cache warm, shows live context usage and attempts to rescue crashed
      sessions, leaving the user with an uninterrupted session and lower token spend. The rescue mechanics
      and actual savings still need verification.
    inspiration_en: 'Trend: context and quota cost for coding agents is becoming a separately optimizable
      layer rather than something only model vendors control. Entry: start with teams heavily using one
      coding agent and sell session-keepalive plus a quota dashboard, but first show token savings translate
      into verifiable cost.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Google Antigravity 编码的开发者，在长会话中处理上下文配额与缓存命中问题，需要保住会话不中断并减少 token 消耗。
        job_en: Developers coding with Google Antigravity who, during long sessions, manage context quota
          and cache hits to keep sessions alive and cut token use.
        pain_zh: 长会话中上下文配额耗尽或会话崩溃会打断编码，重开会话又要重新喂上下文，既费时又费 token。
        pain_en: Running out of context quota or a crashed session interrupts coding, and restarting means
          re-feeding context, costing both time and tokens.
        current_alternative_zh: 目前开发者多靠手动重开会话、精简提示或自行监控用量来绕过，缺少自动保活与恢复手段。
        current_alternative_en: Today developers mostly reopen sessions manually, trim prompts or watch
          usage by hand, with no automatic keepalive or recovery.
        usage_reason_zh: 推断：相较手动重开会话，插件自动保持缓存热度并尝试恢复崩溃会话，减少重新喂上下文这一步，因此重度使用 Antigravity 的开发者会在长会话中选用它；节省效果尚无公开数据。
        usage_reason_en: 'Inference: versus manually reopening sessions, the plugin keeps the cache warm
          and attempts to rescue crashes, removing the re-feeding step, so heavy Antigravity users would
          pick it for long sessions; savings are not publicly documented.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长编码会话中配额耗尽与会话崩溃打断工作的问题，痛点具体且不解决的代价是重喂上下文与 token 浪费。
        evidence_ids:
        - ev-ef0e9733a5ef2079
        - ev-30d7a1f023095d9b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，缺少用户评价或采用证据说明开发者是否真的把它留在工作流里。
        evidence_ids:
