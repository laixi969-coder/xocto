        status: supported
        reason: 它解决三维场景中重复调整物体、材质与灯光的任务，痛点是手动操作耗时且脚本有门槛，替代行为明确存在。
        evidence_ids:
        - ev-af01e32680c13266
      - gate: consensus
        status: insufficient
        reason: 仓库关注度在两周内从约 173 升至 503 后趋平，只能说明关注度，缺少用户评价或采用案例证明持续使用。
