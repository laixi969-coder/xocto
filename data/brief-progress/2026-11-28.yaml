        job_zh: 开发者在本地运行 DeepSeek Harness 批量下载模型或数据文件时，需要让下载任务在会话中断后继续，并拿到完整文件。
        job_en: Developers running DeepSeek Harness locally need bulk model or data downloads to survive
          session interruptions and still deliver complete files.
        pain_zh: 大文件下载中断后需从头重来，多任务并行时难以跟踪进度；这是从仓库描述推断的痛点，尚无用户反馈佐证。
        pain_en: Large downloads restart from scratch after interruption and parallel tasks are hard to
          track; this pain is inferred from the repository description, with no user feedback yet.
        current_alternative_zh: 直接用命令行工具或浏览器下载，靠手动重试和本地脚本拼接。
        current_alternative_en: Downloading directly via command-line tools or a browser, relying on manual
