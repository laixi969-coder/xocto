      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队在本地或自有服务器上同时跑多个 AI 编码代理，需要从大量运行日志和输出中找出真正需要人处理的结果。
        job_en: Solo developers or small teams run several AI coding agents on local machines or own servers
          and need to find, among large volumes of run logs and output, the results that truly need human
          handling.
        pain_zh: 代理运行过程冗长且分散，人要么全程盯着输出，要么事后翻日志，容易漏掉失败或需要决策的节点；这是从产品说明与代理工作流推导的判断。
        pain_en: Agent runs are long and scattered, so people either watch output continuously or dig
          through logs afterwards, easily missing failures or decision points; this is an inference from
          the product description and agent workflows.
        current_alternative_zh: 目前多靠终端窗口、日志文件或通用通知工具人工盯守与事后检索。
        current_alternative_en: Today this is mostly handled by watching terminal windows, log files or
          generic notification tools manually and searching afterwards.
        usage_reason_zh: 相较人工盯终端和翻日志，它把代理运行结果汇总后只推送需要关注的部分，减少持续盯守和事后检索这一步；需要数据留在自有机器、又同时跑多个代理的开发者会在这种情况下选择它，此为推断。
        usage_reason_en: Compared with manually watching terminals and reading logs, it aggregates agent
          run output and pushes only what needs attention, removing the step of continuous watching and
          later searching; developers who need data to stay on their own machines while running several
          agents would choose it in that situation, as an inference.
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理运行时输出冗长、人需持续盯守或事后翻日志的问题，痛点来自代理工作流结构，属工作流推理。
        evidence_ids:
        - ev-f42f8aed8611be9f
      - gate: consensus
        status: insufficient
        reason: 仅有官网一句话与仓库星标分叉，未见用户评价或采用描述，无法判断是否形成使用共识。
        evidence_ids:
        - ev-f42f8aed8611be9f
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，可能来自开发者自付或团队采购，属判断而非已验证事实。
        evidence_ids:
        - ev-f42f8aed8611be9f
      - gate: truth
        status: insufficient
        reason: 筛选规则、交付形态与人工确认边界未说明，能否确定性交付“只看要紧事”仍待核验。
        evidence_ids:
        - ev-f42f8aed8611be9f
