  fireworks-ai:
    slug: fireworks-ai
    name: Fireworks AI
    decision: market_context
    event_summary_zh: 2026年11月，Fireworks AI 在数周内第二次通报安全事件，黑客经由其访问到 Notion 客户的聊天记录；同期报道称客户因 GPU 供给紧张而非安全因素继续留用。这属于模型推理供给层的平台与安全结构变化，不是独立应用产品。
    event_summary_en: In November 2026, Fireworks AI disclosed a second security incident within weeks,
      with hackers reaching Notion customers' chat transcripts through it; reporting in the same period
      said customers stayed because of GPU scarcity rather than security. This is a platform and security
      shift in the model-inference supply layer, not a standalone application product.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 模型推理与托管服务商，向应用开发者提供开放模型的调用与 GPU 容量。本次公开材料集中在安全事件与供给紧张，未提供可核验的独立应用工作流。
    inspiration: 推理供给层出现安全与容量双重约束，说明依赖单一托管方的应用存在交付风险；切入点在为垂直应用做可切换的多模型路由与合规审计，而非再建一个通用推理平台。
    summary_en: A model inference and hosting provider offering open-model API access and GPU capacity
      to application developers. The public material here centers on security incidents and tight supply,
      with no verifiable standalone application workflow.
    inspiration_en: Security and capacity constraints in the inference layer mean applications depending
      on a single host carry delivery risk; the opening is switchable multi-model routing plus compliance
      auditing for vertical apps, not another general inference platform.
  flashbrowse:
    slug: flashbrowse
    name: flashbrowse
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息服务
    industries_en:
    - Software and IT Services
    jobs:
    - AI 代理开发者需要在代理执行网页操作时，把页面结构压缩成模型可读的输入，并完成点击、抓取等自动化任务
    jobs_en:
    - AI agent developers need to compress page structure into model-readable input and complete click
      and scrape automation tasks when an agent operates a web page
    regions: []
    regions_en: []
    open_source: true
    summary_zh: AI 代理开发者构建网页自动化时，打开 flashbrowse 这个开源无头浏览器与 MCP 服务，它把页面可访问性树压缩成更省 token 的输入，供代理执行点击与抓取；最终交付是代理可调用的浏览动作，具体流程与稳定性仍待核验。
    inspiration: 趋势：代理要真正操作网页，瓶颈正从模型能力转向页面输入成本与执行速度。切入：可从需要大量网页操作的垂直流程（如电商比价、表单填报、合规抓取）切入，卖按任务或按成功抓取计费的结果，而非浏览器组件本身；该开源项目尚无付费与采用证据。
    summary_en: When AI agent developers build web automation, they open flashbrowse, an open-source headless
      browser and MCP server that compresses the page accessibility tree into a more token-efficient input
      for agents to click and scrape; the deliverable is a browser action callable by the agent, while
      the concrete workflow and reliability still need verification.
    inspiration_en: 'Trend: for agents to actually operate the web, the bottleneck is shifting from model
      capability to page input cost and execution speed. Entry: start from vertical workflows heavy in
      web operations (price comparison, form filling, compliance scraping) and sell results billed per
      task or per successful scrape rather than a browser component; this open-source project has no payment
      or adoption evidence yet.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 代理开发者在让代理执行网页点击、抓取和表单操作时，需要把网页内容转成模型能读且成本可控的输入，并稳定完成动作。
        job_en: AI agent developers, when having agents perform web clicks, scraping and form operations,
          need to convert page content into model-readable, cost-controlled input and complete actions
          reliably.
        pain_zh: 原始网页 HTML 冗长，直接喂给模型消耗大量 token 且噪声多；通用浏览器自动化对代理不友好，速度和成本都受限。
        pain_en: Raw web HTML is verbose, consuming many tokens and adding noise when fed to models; general
          browser automation is unfriendly to agents, limiting speed and cost.
        current_alternative_zh: 开发者自行用 Playwright、Puppeteer 等通用浏览器自动化工具加自写解析脚本，或直接抓取原始 HTML 交给模型。
        current_alternative_en: Developers use general browser automation tools like Playwright or Puppeteer
          with self-written parsing scripts, or feed raw HTML directly to models.
        usage_reason_zh: 推断：相较自写解析脚本，它把可访问性树压缩后直接作为代理输入，减少页面到模型之间的清洗步骤和 token 消耗，因此需要大量网页操作的代理开发者会在构建抓取或操作流程时选择它；尚无用户反馈或客户案例支持。
        usage_reason_en: 'Inference: compared with self-written parsing scripts, it compresses the accessibility
          tree directly as agent input, reducing the cleaning step and token consumption between page
          and model, so agent developers with heavy web operations would choose it when building scraping
          or operation flows; no user feedback or customer cases support this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理操作网页时页面输入冗长、token 成本高的问题，痛点具体，旧做法是自写解析脚本或直接喂原始 HTML。
        evidence_ids:
        - ev-c38193504abe365a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 99 增至 112，属关注度信号，缺少用户评价或采用案例说明真实使用。
        evidence_ids:
        - ev-c38193504abe365a
        - ev-f1b0f9e3e7332770
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或商业交付路径，钱从哪来尚不明确，这是判断不是已验证事实。
        evidence_ids:
        - ev-f1b0f9e3e7332770
      - gate: truth
        status: insufficient
        reason: 未见稳定性实测、issue 讨论或交付结果证据，能否确定性完成网页操作仍待核验。
        evidence_ids:
        - ev-c38193504abe365a
      next_validation: 收集该仓库的 issue、discussion 或可复现实测，核验其在真实网页操作中的成功率与稳定性。
