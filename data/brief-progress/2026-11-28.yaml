    jobs:
    - 工程负责人在多个团队使用 Claude Code、Cursor 等编码助手后，需要按人或按项目核对 AI 工具花费并决定削减哪部分预算
    - 研发团队在月度成本复盘时，把分散在各编码助手和 API 的用量记录汇总成可解释的支出明细
    jobs_en:
    - An engineering lead who needs to attribute AI coding-assistant spend by person or project and decide
      which budget to cut after teams adopt Claude Code and Cursor
    - A development team consolidating scattered assistant and API usage records into an explainable spend
      breakdown during a monthly cost review
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 工程负责人或研发团队在多个编码助手并行使用后，需要弄清 AI 预算花在谁身上、该削减哪部分。TraxAgent 以只读 MCP 服务和 Claude Code 插件的形式，让用户在
      Claude、ChatGPT、Cursor 等对话界面里直接查询用量与支出，并给出可调整项；最终交付是一份可追问的支出归因结果，具体数据来源与计费口径仍待核验。
    inspiration: 趋势：编码助手从单人试用走向团队按席位采购后，AI 支出开始像云账单一样需要归因和治理，成本可见性本身成为采购决策的一环。切入：从已同时采购多个编码助手的研发团队或工程财务环节进入，卖的是按项目/按人的支出归因与削减建议，而不是再做一个编码助手；是否按用量或按席位收费尚未披露。
    summary_en: After teams run several coding assistants in parallel, an engineering lead needs to know
      who consumed the AI budget and what to cut. TraxAgent ships as a read-only MCP server and Claude
      Code plugin so users can query usage and spend inside Claude, ChatGPT or Cursor and get suggested
      adjustments; the deliverable is an interrogable spend attribution, while the underlying data sources
      and billing definitions still need verification.
    inspiration_en: 'Trend: as coding assistants move from individual trials to team seat purchases, AI
      spend starts to need attribution and governance like a cloud bill, making cost visibility part of
      the buying decision. Entry: start from engineering or finance in teams already paying for multiple
      coding assistants, selling per-project and per-person spend attribution plus cut recommendations
      rather than another coding assistant; usage-based or seat-based pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工程负责人或研发团队在多个编码助手并行使用后，需要按人或按项目核对 AI 工具花费，并决定削减哪部分预算。
        job_en: An engineering lead or development team needs to attribute AI tool spend by person or
          project and decide which budget to cut after running several coding assistants in parallel.
        pain_zh: AI 编码工具的用量分散在多个产品和 API 账户里，账单只给出总额，难以回答谁在用、哪部分浪费，成本复盘时缺少可解释的明细。
        pain_en: Usage is scattered across multiple assistant products and API accounts, bills show only
          totals, and it is hard to answer who is using what or where waste sits, leaving cost reviews
          without an explainable breakdown.
        current_alternative_zh: 旧做法是人工导出各平台账单、用表格汇总，或干脆按总额粗放分摊，无法定位到具体人或项目。
        current_alternative_en: The old approach is manually exporting each platform's bills into spreadsheets
          or allocating the total crudely, which cannot be traced to a specific person or project.
        usage_reason_zh: 推断：相较人工导表汇总，TraxAgent 让用户在已打开的 Claude、Cursor 等界面里直接追问支出归因并获得可调整项，省去跨平台导出与手工对齐这一步；因此同时采购多个编码助手、需要做成本复盘的团队会在月度核算时选择它。
        usage_reason_en: 'Inference: compared with manual bill exports, TraxAgent lets users ask spend-attribution
          questions inside the Claude or Cursor interface they already have open and get suggested adjustments,
          removing the cross-platform export and manual reconciliation step; teams paying for several
          coding assistants and running cost reviews would pick it at monthly accounting time.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码助手并行后 AI 支出无法按人按项目归因、成本复盘缺明细的问题，痛点刚性来自真实账单压力；买方应为已付费的研发团队，但公开材料未确认。
        evidence_ids:
        - ev-9130d35204ef24f4
        - ev-6ad3d96ee678f5ac
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数在 136 至 174 之间小幅波动，属关注度信号，未见团队采用或持续使用的公开证据。
        evidence_ids:
        - ev-9130d35204ef24f4
        - ev-be4def1d031e10ce
        - ev-6ad3d96ee678f5ac
      - gate: model
        status: insufficient
        reason: 未披露定价、计费方式或买方类型，钱可能来自研发团队订阅或按用量收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-9130d35204ef24f4
      - gate: truth
        status: insufficient
        reason: 只读 MCP 与插件形态降低了接入风险，但数据来源、计费口径与归因准确性均未公开，交付能否确定发生仍待核验。
        evidence_ids:
        - ev-9130d35204ef24f4
        - ev-a65f7fee24c3988e
      next_validation: 收集 TraxAgent 官方定价页或部署文档，确认其数据接入来源、计费口径与按人/按项目归因的具体交付方式。
