      the viewfinder scene in real time and overlays dynamic framing suggestions (rule of thirds, leading
      lines, negative space). Users get instant composition cues while shooting, replacing post-shot tutorial-checking
      or trial-and-error.'
    inspiration_en: 'Trend: real-time AI visual guidance is moving from pro cameras to phones; ''before-you-shoot''
      advice is more rigid than post-processing. Entry: target beginner phone photographers with subscription
      composition coaching, expand into travel/street-photography template packs, or partner with phone
      OEMs for pre-install.'
