          LLMs lack domain-specific data and structured retrieval, yielding low-confidence outputs.
        current_alternative_zh: 手动检索 + 笔记软件 + 通用 LLM 聊天；或 Elicit / Consensus 等科研摘要工具；部分团队仍依赖导师口头指导。
