        usage_reason_zh: 推断：它把简历、LinkedIn、公开代码仓库 与作品集一次性对照公开职业数据打分并重写，省去求职者逐份猜测标准再手改的步骤，因此材料多、时间紧的转码求职者会先试它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: it scores and rewrites resume, LinkedIn, public code repository and
