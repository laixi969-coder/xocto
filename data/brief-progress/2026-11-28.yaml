        - ev-a51e10d8da57d95e
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价与买方，付费路径只能推断为团队自建或按项目交付，尚无已验证事实。
        evidence_ids:
        - ev-a51e10d8da57d95e
      - gate: truth
        status: insufficient
        reason: 跨厂互审与沙箱验证能否稳定交付、人工确认边界在哪，公开材料未给出可复现结果。
        evidence_ids:
        - ev-a51e10d8da57d95e
      next_validation: 收集该仓库的 issue、discussion 或 README 中的可复现实测记录，确认跨厂互审与 Docker 沙箱验证的实际交付结果。
