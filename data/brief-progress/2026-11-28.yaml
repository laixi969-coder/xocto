  baseten:
    slug: baseten
    name: Baseten
    decision: market_context
    event_summary_zh: 2026年10月30日至31日，多家媒体报道 Baseten 正以约300亿美元估值启动新一轮融资，较2026年6月水平翻倍以上；同期它被列入 Madrona
      2026 Intelligent Applications 40 的 Enabler 阶段。报道同时称 Baseten、Together AI、Fireworks、Fal、OpenRouter
      等推理与多模型路由厂商估值同比普遍翻倍，GPU 容量与路由需求超过供给，尚无一家明显拉开差距。
    event_summary_en: On October 30-31, 2026, multiple outlets reported that Baseten is raising a new
      round at roughly a $30 billion valuation, more than double its June 2026 level; it was also named
      to Madrona's 2026 Intelligent Applications 40 at the Enabler stage. The same reporting says Baseten,
      Together AI, Fireworks, Fal and OpenRouter are broadly doubling valuations year over year as GPU
      capacity and multi-model routing demand outstrip supply, with no clear winner yet.
    category: 基础层
    project_type: ai_transformation
    industries:
    - 云计算与算力基础设施
    - 软件开发
    industries_en:
    - Cloud and compute infrastructure
    - Software development
    jobs:
    - AI 应用团队在模型部署与推理扩容时采购算力与路由服务
    - AI application teams procuring compute and routing capacity when deploying and scaling model inference
    jobs_en:
    - AI application teams procuring compute and routing capacity when deploying and scaling model inference
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: Baseten 是面向 AI 应用团队的模型部署与推理基础设施服务商，本次新增事实是其在2026年10月底被报道以约300亿美元估值启动新一轮融资，较6月翻倍以上，并被列入
      Madrona 2026 Intelligent Applications 40 的 Enabler 阶段。该候选属于算力与推理供给层的资本与竞争格局变化，不是面向具体行业旧流程的独立应用，故作为市场背景处理。
    inspiration: 推理与路由层的估值集体翻倍，说明 AI 应用的成本结构正被上游算力供给重新定价；对创业者而言，机会不在再做一个模型托管商，而在把推理成本下降转化为某个垂直行业按结果收费的交付能力。
    summary_en: Baseten provides model deployment and inference infrastructure for AI application teams.
      The new fact is that in late October 2026 it was reported to be raising a new round at roughly a
      $30 billion valuation, more than double June's level, and was named to Madrona's 2026 Intelligent
      Applications 40 at the Enabler stage. This candidate reflects capital and competitive dynamics in
      the compute and inference supply layer rather than an independent application for a specific industry
      workflow, so it is treated as market context.
    inspiration_en: Valuations across the inference and routing layer doubling together show that AI application
      cost structures are being repriced by upstream compute supply; the opening for founders is not another
      model host but turning lower inference cost into result-priced delivery inside a specific vertical.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: AI 应用团队在模型上线与流量增长时，需要把模型部署到可扩容的推理环境并控制单位调用成本。
        job_en: AI application teams need to deploy models into scalable inference environments and control
          per-call cost as traffic grows.
        pain_zh: 自建推理集群需要运维与容量规划，需求高峰时 GPU 供给紧张，团队难以在成本与延迟之间稳定取舍。
        pain_en: Self-hosted inference requires operations and capacity planning, GPU supply is tight
          at peak demand, and teams struggle to balance cost against latency reliably.
        current_alternative_zh: 自建 GPU 集群、直接使用云厂商托管推理服务，或接入多家模型 API 自行做路由。
        current_alternative_en: Self-built GPU clusters, cloud providers' managed inference services,
          or calling multiple model APIs and routing in-house.
        usage_reason_zh: 推断：相较自建集群，托管推理把容量扩容与部署运维交给服务商，减少团队在峰值时手动扩机器和调优的步骤；但公开材料未提供客户留存或复购数据，无法确认长期采用。
        usage_reason_en: 'Inference: compared with self-built clusters, managed inference shifts capacity
          scaling and deployment operations to the vendor, removing manual machine provisioning and tuning
          at peak; public materials provide no retention or repeat-purchase data, so sustained adoption
          is unconfirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决 AI 团队部署与扩容推理的需求，痛点真实；但本候选材料聚焦估值与榜单，未给出具体客户工作流与交付结果。
        evidence_ids:
        - ev-506938a307a75889
        - ev-56eba7ffb2d52e14
      - gate: consensus
        status: insufficient
        reason: 仅有估值翻倍与行业榜单信号，属于资本与关注度证据，不能说明客户已形成稳定使用共识。
        evidence_ids:
        - ev-56eba7ffb2d52e14
        - ev-85db4ff4c02ee146
      - gate: model
        status: insufficient
        reason: 买方为 AI 应用团队，付费路径存在，但公开材料未披露定价、合同或收入结构，无法核验可重复交付。
        evidence_ids:
        - ev-506938a307a75889
      - gate: truth
        status: insufficient
        reason: 推理基础设施贴近真实工程需求，但缺少可核对的延迟、成本或交付结果材料，确定性交付未被验证。
        evidence_ids:
        - ev-56eba7ffb2d52e14
      next_validation: 收集 Baseten 官方定价页或公开客户案例，核验其推理服务的计价方式与已披露的交付结果。
