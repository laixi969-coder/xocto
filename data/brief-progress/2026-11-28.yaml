    open_source: true
    summary_zh: 个人量化交易者或研究员在评估 LLM 选股策略时打开它，把冻结时点的历史行情、VIX 与新闻交给交易智能体回测，系统在每次运行中检查是否偷看未来数据，并给出榜单排名与模拟或实盘下单结果；实盘资金决策仍需人确认，具体风控与交付流程待核验。
    inspiration: 趋势：LLM 交易智能体开始出现可复现的回测与防前视偏差评测，说明这一层竞争正从“能不能选股”转向“结果可不可信”。切入：从券商投研或量化团队的策略评审环节进入，卖可审计的回测与偏差报告，而不是卖交易信号；面向个人投资者的合规边界需另行核验。
    summary_en: 'Retail quant traders or researchers open it to evaluate LLM stock-picking strategies:
      frozen point-in-time prices, VIX and news are fed to trading agents for backtesting, each run is
      checked for look-ahead bias, and leaderboard rankings plus paper or live order results are returned;
      real-money decisions still need human sign-off, and the risk controls and delivery flow remain to
      be verified.'
    inspiration_en: 'Trend: LLM trading agents are getting reproducible backtests and look-ahead-bias
      checks, shifting competition from whether an agent can pick stocks to whether its results can be
      trusted. Entry: start from the strategy-review step in brokerage research or quant teams and sell
      auditable backtest and bias reports rather than trade signals; compliance boundaries for retail
      investors need separate verification.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人量化交易者或研究员在决定是否把 LLM 选股策略投入实盘前，用冻结的历史行情与新闻回测智能体，并检查前视偏差，得到可对照的策略表现。
        job_en: Retail quant traders or researchers backtest LLM stock-picking agents on frozen historical
          prices and news and check for look-ahead bias before committing real money, aiming for comparable
          strategy performance.
        pain_zh: LLM 交易策略的回测常因偷看未来新闻或数据口径不一而虚高，用户难以判断策略真实表现，错误结论直接对应资金损失。
        pain_en: Backtests of LLM trading strategies are often inflated by look-ahead news leakage or
          inconsistent data, so users cannot judge real performance, and wrong conclusions translate directly
          into capital losses.
        current_alternative_zh: 自己搭回测脚本、用通用回测框架手工拼接新闻数据，或直接相信智能体给出的收益曲线。
        current_alternative_en: Writing custom backtest scripts, manually stitching news into generic
          backtest frameworks, or simply trusting the return curves an agent reports.
        usage_reason_zh: 推断：相较自建脚本，它把冻结时点行情与新闻、每次运行的前视偏差检查和统一榜单打包成一次可复现的回测，减少用户自行对齐数据与排查数据泄漏的步骤，因此重视策略可信度的量化研究者会在评审阶段选择它。
        usage_reason_en: 'Inference: compared with self-built scripts, it packages frozen point-in-time
          prices and news, a per-run look-ahead check and a shared leaderboard into one reproducible backtest,
          cutting the work of aligning data and hunting leakage, so quant researchers who care about credibility
          would pick it at the review stage.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 LLM 交易策略回测中前视偏差与数据口径不一导致结论失真的问题，痛点直接对应资金损失，旧做法是自建脚本或盲信收益曲线。
        evidence_ids:
        - ev-dcde1d538139bbd3
      - gate: consensus
        status: insufficient
        reason: 仓库关注度从约480升至489，属关注度信号，未见用户评价、客户案例或持续使用证据，无法判断共识是否形成。
        evidence_ids:
        - ev-564ffa1bc70ffcaa
        - ev-dcde1d538139bbd3
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价与付费路径；推断可能来自券商投研、量化团队或面向个人投资者的订阅，但均未核验。
        evidence_ids:
        - ev-dcde1d538139bbd3
      - gate: truth
        status: insufficient
        reason: 回测防前视偏差贴近交易研究的第一性目标，但实盘接入10家券商的安全边界、风控与人工确认流程公开材料不足。
        evidence_ids:
        - ev-dcde1d538139bbd3
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对回测结果可信度、前视偏差检查有效性和实盘接入风控的实际反馈。
  sample-reverse-spec-flow:
    slug: sample-reverse-spec-flow
    name: sample-reverse-spec-flow
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息服务
    industries_en:
    - Software and IT services
    jobs:
    - 维护遗留系统的工程师在接手缺少文档的旧代码库时，让 AI 代理读取源码并生成带 path:line 引用的规格说明，再由独立校验代理核对，用于维护或按规格重做应用
    jobs_en:
    - Engineers maintaining legacy systems, when taking over an old codebase lacking documentation, have
      an AI agent read the source and produce specifications with path:line citations, checked by a separate
      verifier agent, for maintenance or spec-driven rebuild
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 接手缺少文档的旧代码库的工程师，把现有源码交给 Claude Code 或 Kiro 这类编码代理，由它反向生成每条都标注 path:line 依据的规格说明，再由独立校验代理逐条核对；用户拿到的是可复核的规格文档，用于维护现有系统或按规格重做应用。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：编码代理正从“写新代码”延伸到“读懂存量代码”，把无文档的遗留系统转成可被代理消费的规格，是旧系统维护与重写之间新出现的一层。切入：从外包与系统集成商的遗留系统交接、合规审计前的文档补齐环节进入，按项目或按代码库交付规格，而不是卖通用工具；仓库目前仅约
      80 星，尚无客户与付费证据。
    summary_en: Engineers inheriting an undocumented legacy codebase hand the existing source to a coding
      agent such as Claude Code or Kiro, which reverse-generates specifications citing path:line evidence
      for each statement, then a separate verifier agent checks them. The user gets a reviewable spec
      document for maintaining the system or rebuilding it spec-first. The exact deliverable and human
      sign-off step still need verification.
    inspiration_en: 'Trend: coding agents are moving from writing new code to reading existing code, turning
      undocumented legacy systems into agent-consumable specs — a new layer between maintenance and rewrite.
      Entry: start with legacy handover at outsourcing and systems-integration firms, or documentation
      catch-up before compliance audits, selling per project or per codebase rather than a generic tool;
      the repo has only about 80 stars and no customer or payment evidence yet.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 维护遗留系统的工程师在接手缺少文档的旧代码库时，让 AI 代理读取源码生成带 path:line 引用的规格说明，再由校验代理核对，用于维护或按规格重做应用。
        job_en: Engineers maintaining legacy systems, when taking over an old codebase lacking documentation,
          have an AI agent read the source and produce path:line-cited specifications, checked by a verifier
          agent, for maintenance or spec-driven rebuild.
        pain_zh: 旧系统缺少文档，工程师只能逐文件阅读源码来理解行为，交接和改动前的梳理耗时且容易漏掉隐含逻辑。
        pain_en: Legacy systems lack documentation, so engineers must read source file by file to understand
          behavior; handover and pre-change mapping is slow and easily misses implicit logic.
        current_alternative_zh: 人工逐文件阅读源码、口头交接、零散补写文档，或直接让编码代理在无规格情况下改代码。
        current_alternative_en: Reading source file by file manually, verbal handover, ad-hoc documentation,
          or letting a coding agent edit code without a spec.
        usage_reason_zh: 推断：相较人工通读源码，它让代理一次性产出每条带 path:line 依据的规格，并由独立校验代理核对引用，减少“读完还要自己整理成文档”这一步，且结论可回溯；接手陌生代码库或准备重写的团队会因此选择它。
        usage_reason_en: 'Inference: versus manual source reading, it has the agent produce specs with
          path:line evidence in one pass and a separate verifier check the citations, removing the step
          of turning reading notes into documentation while keeping claims traceable; teams inheriting
          unfamiliar code or planning a rewrite would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决旧代码库缺文档、工程师需逐文件阅读才能理解行为的问题，交付为可回溯的规格说明；痛点刚性来自交接与改动前的理解成本。
        evidence_ids:
        - ev-b02c5595da1e060e
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 48 增至 80，属关注度信号，未见用户评价、客户案例或团队采用证据，无法判断是否进入实际工作流。
        evidence_ids:
        - ev-b02c5595da1e060e
        - ev-b0478a8f7c8f2d58
      - gate: model
        status: insufficient
        reason: 未见定价、买方或付费路径；作为 AWS 示例仓库，商业交付方式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-b0478a8f7c8f2d58
      - gate: truth
        status: insufficient
        reason: 规格由代理生成、再由独立代理校验，引用可回溯是贴近第一性目标的机制；但校验代理能否可靠发现错误、人工确认边界如何，公开材料未说明。
        evidence_ids:
        - ev-b02c5595da1e060e
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有团队报告在真实遗留代码库上使用并指出规格遗漏或校验失败的具体案例。
  sap-data-mcp:
