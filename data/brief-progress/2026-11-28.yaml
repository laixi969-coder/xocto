        reason: 仅有仓库星标与分支增长，属开发者关注度，缺少商家侧采用或成交反馈。
        evidence_ids:
        - ev-97b14b8724e3aaae
      - gate: model
        status: insufficient
        reason: 开源免费，未披露收费或分成方式；买方可能是使用它的建站者，付费路径未核验。
        evidence_ids:
        - ev-37f8dcb3f534dd51
      - gate: truth
        status: insufficient
        reason: 自动生成站点与自动收款能否被商家接受、成交是否真实发生，缺少客户案例或实测。
        evidence_ids:
        - ev-bbfac00b92e024cf
      next_validation: 收集 garimpo 仓库的 issue、discussion 或 README 中的实际使用案例与成交反馈，核验商家是否接受自动生成的预览站并完成付款。
