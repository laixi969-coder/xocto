      RL 流水线的训练环境与数据集；实验室按独家（溢价）或共享（折价）方式采购，试点单逐步扩为长期合作。具体定价与已签约客户名称未在公开材料中披露。
    inspiration: 趋势：RL 训练正从手工造数据走向工程化流水线，能设计验证器的资深工程师成为稀缺瓶颈，前沿实验室倾向于外包而非自建。切入：医疗影像、法律 NLP 等垂直行业模型团队同样需要定制
      RL 环境与验证器，按交付结果计费比卖通用数据集壁垒更高，窗口在前沿实验室尚未覆盖的中腰部行业。
    summary_en: ML teams at frontier labs expanding RL training need tasks slightly beyond current model
      capability plus automated verifiers. G2i dispatches senior engineers to design tasks, select seed
      data, and write scoring verifiers, delivering RL-ready training environments and datasets. Labs
      buy exclusively (premium) or shared (discounted); pilots scale into ongoing contracts. Specific
      pricing and named customers are not disclosed publicly.
    inspiration_en: 'Trend: RL training is shifting from hand-crafted datasets to engineered pipelines;
      senior engineers who can design verifiers are the scarce bottleneck, and labs prefer outsourcing
      over in-house builds. Entry: vertical-domain model teams (medical imaging, legal NLP) need the same
      custom RL environments—outcome-based pricing beats raw-data marketplaces, and the window sits in
      mid-tier industries frontier labs have not yet covered.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 前沿 AI 实验室的 RL 训练负责人，在扩展模型能力边界时，需要设计略超模型当前水平的训练任务、准备种子数据并编写可自动评分的验证器，以支撑 RL 流水线的下一轮迭代。
        job_en: RL training leads at frontier AI labs, when expanding the model's capability boundary,
          must design tasks slightly beyond current model level, prepare seed data, and write automated
          scoring verifiers to support the next RL pipeline iteration.
        pain_zh: 设计一个"刚好超出现有能力"的 RL 任务并配好验证器，需要资深工程师数周投入；自建团队人力成本高且优先级常让位于推理与部署，而通用数据集市无法提供与任务绑定的验证逻辑，导致
          RL 训练卡在数据与验证器环节。
        pain_en: Designing an RL task that is just beyond the model's capability plus a matching verifier
          takes senior engineers weeks; in-house teams have high headcount costs and deprioritize this
          work for inference and deployment, while generic data marketplaces cannot deliver task-bound
          verification logic, stalling RL training at the data-and-verifier stage.
        current_alternative_zh: 实验室内部由高级工程师手工设计任务与验证器，或采购通用数据集自行补写验证脚本；部分团队从招聘工程师转向外包，但缺乏统一交付标准。
        current_alternative_en: Labs rely on internal senior engineers to hand-craft tasks and verifiers,
          or buy generic datasets and write verification scripts in-house; some teams shift from hiring
          to outsourcing but lack a unified delivery standard.
        usage_reason_zh: （推断）相较自建团队数周投入，G2i 以项目制交付设计好的任务 + 种子数据 + 验证器，将 RL 数据准备周期压缩为按单采购；独家溢价机制让实验室愿意为数据独占付费。前沿实验室在
          RL 规模扩大、验证器成为瓶颈时选择外购；中腰部行业团队因缺乏资深 RL 工程师同样有采用动机，但尚无公开案例证实。
        usage_reason_en: (Inference) Compared to weeks of in-house engineering, G2i delivers a designed
          task + seed data + verifier as a project deliverable, compressing RL data preparation to per-order
          procurement; the exclusive-premium model means labs pay for data exclusivity. Frontier labs
          outsource when RL scales and verifiers become the bottleneck; mid-tier industry teams lacking
          senior RL engineers share the same motivation, but no public case confirms adoption.
      gates:
      - gate: value
        status: supported
        reason: RL 训练需要任务略超模型能力 + 可自动评分验证器，资深工程师设计是核心瓶颈；G2i 将此环节外部化，买方（前沿实验室）与旧流程（自建/通用数据集）均可从创始人描述中还原。
        evidence_ids:
        - ev-1a786ee88d251fbe
      - gate: consensus
        status: insufficient
        reason: 试点单扩为长期合作表明有客户在采用，但无具名客户、无公开使用规模或环比数据；单场赞助播客不构成独立共识信号。
        evidence_ids:
        - ev-1a786ee88d251fbe
      - gate: model
        status: supported
        reason: 买方为前沿实验室，付费路径为项目制合同（独家溢价/共享折价），从试点到长期合作的销售漏斗已描述；具体单价未披露，但收费结构清晰。
        evidence_ids:
        - ev-1a786ee88d251fbe
      - gate: truth
        status: insufficient
        reason: 创始人描述了工作流与验证器设计方法，但缺乏独立第三方核验：无交付 SLA、无客户评价、无公开案例；来源为 G2i 赞助的播客，存在推广偏差。
        evidence_ids:
        - ev-1a786ee88d251fbe
      next_validation: G2i 官网是否上线定价页或客户案例，核验按项目/按结果计费的具体结构与已签约实验室名单。
