          or multiple rework rounds.
        current_alternative_zh: 手工在 Blender 等软件里对着参考图逐面建模，或使用图生三维的在线服务再导入修整。
        current_alternative_en: Modeling face by face against the reference in Blender or similar software,
          or using image-to-3D online services and then importing for cleanup.
        usage_reason_zh: 推断：相较纯手工逐面建模，它把视图配准与贴图拟合交给代理自动执行并可在 Blender 回放，减少反复比对比例这一步；需要可编辑网格且愿意人工收尾的建模者会因此选择它。
        usage_reason_en: 'Inference: versus purely manual face-by-face modeling, it hands view registration
          and map fitting to an agent that runs automatically and replays in Blender, cutting the repeated
          proportion-comparison step; modelers who need an editable mesh and will finish by hand would
          choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单张参考图到可编辑三维模型的重建需求，痛点是手工比对比例耗时易走形，旧做法是逐面建模或图生三维后修整。
        evidence_ids:
        - ev-abe8c7b428c410a1
        - ev-03a9b31c44a906c5
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-aba47bb02440a73a
        - ev-03a9b31c44a906c5
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是美术外包或个人建模者，属判断而非已验证事实。
        evidence_ids:
        - ev-03a9b31c44a906c5
      - gate: truth
        status: insufficient
        reason: 交付精度、人工返工量和是否贴近第一性建模目标尚无公开实测，安全与人工边界未说明。
        evidence_ids:
        - ev-abe8c7b428c410a1
