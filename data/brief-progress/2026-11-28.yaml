        evidence_ids:
        - ev-1b9b78cf1be7dd02
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价、付费路径或商业主体，买方与收费方式均未明，这是判断不是已验证事实。
        evidence_ids:
        - ev-a75fdb4fc3f156d1
      - gate: truth
        status: insufficient
        reason: 审查流程能否确定性交付、是否贴近第一性目标，缺少实测与案例支持，暂无法核验。
        evidence_ids:
        - ev-a75fdb4fc3f156d1
      next_validation: 收集该仓库的 issue、discussion 或 README 中的实际使用案例与流程说明，核验三段审查是否被真实采用。
