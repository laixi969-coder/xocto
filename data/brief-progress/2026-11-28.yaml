        evidence_ids:
        - ev-db175fa5da097923
        - ev-671b3fc29e700a9d
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价、买方或收费方式，开源项目可能靠托管或服务收费，这是判断不是已验证事实。
        evidence_ids:
        - ev-671b3fc29e700a9d
      - gate: truth
        status: insufficient
        reason: 未说明 AI 具体执行哪一步、成片质量与人工确认边界，交付确定性无法核对。
