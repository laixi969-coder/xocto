    name: G2i
    decision: watching
    event_summary_zh: G2i 创始人 Gabe Greenberg 在 AI Engineer CODE 2026（旧金山）公开说明业务：为前沿实验室定制训练数据与 RL 环境，高级工程师设计任务、挑选种子数据并编写自动评分验证器；实验室按独家（溢价）或共享（折价）方式采购，小批量试点单逐步扩为长期合作。G2i
