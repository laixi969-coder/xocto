      CODE 2026 (San Francisco): custom training data and RL environments for frontier labs, with senior
      engineers designing tasks, selecting seed data, and writing automated verifiers. Labs purchase data
      exclusively (premium) or shared (discounted); pilot orders scale into ongoing engagements. G2i co-organized
      and sponsored the event.'
    category: 基础层
    project_type: new_application
