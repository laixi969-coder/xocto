        usage_reason_zh: 推断：相较在完整CAD里从零搭体块，它让用户直接从已有轮廓草图推拉出可编辑三维形体，省掉重新建模这一步，因此概念阶段频繁改形的设计师和创客会在早期方案比较时选择它；公开材料尚未给出用户留存或付费证据。
        usage_reason_en: 'Inference: compared with building volumes from scratch in full CAD, it lets
          users extrude an existing outline sketch into an editable 3D form, removing the rebuild step,
          so designers and makers who iterate on form at the concept stage would pick it for early option
          comparison; public materials do not yet show retention or payment evidence.'
      gates:
