    open_source: true
    summary_zh: 用户在浏览网页或社交信息流时，浏览器扩展在本地对页面上的图片和视频做 AI 生成检测并给出标记，用户据此决定是否采信或转发；检测在设备端完成，具体准确率、误报处理和人工复核流程仍待核验。
    inspiration: 趋势：合成图像与视频进入日常信息流后，“这条内容是不是 AI 做的”正从专业核查变成普通浏览动作。切入：可从事实核查机构、新闻编辑室和电商商品图审核这类已有明确核验责任的环节进入，按核查量或团队席位收费；消费端免费扩展难以直接变现，需先证明检测准确率与误报成本可接受。
