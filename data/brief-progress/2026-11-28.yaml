      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；依赖 Google Antigravity 平台，收费方式与可持续性不明。
        evidence_ids:
        - ev-1195ad7261d9d89a
      - gate: truth
        status: insufficient
        reason: 降幅数字为仓库自述，未见独立实测或 issue 中的复现结果，确定性交付仍缺证据。
        evidence_ids:
        - ev-1195ad7261d9d89a
      next_validation: 收集该仓库 issue/discussion 中开发者对轮次、配额与流量降幅的独立复现记录。
