        - ev-048176d65c017613
        - ev-3dc875823e8784aa
      - gate: consensus
        status: insufficient
        reason: 属于极度垂直的底层安全工具，开源星数尚在两位数，尚未形成广泛采用共识。
        evidence_ids:
        - ev-3dc875823e8784aa
      - gate: model
        status: insufficient
        reason: 目前为纯开源技术构件，未提供商业化定价或企业技术支持方案，付费路径未验证。
        evidence_ids:
        - ev-048176d65c017613
      - gate: truth
        status: supported
        reason: 提供确定性的二进制指令执行与追踪数据，交付结果可客观核验，无模型幻觉干扰交付。
        evidence_ids:
        - ev-3dc875823e8784aa
