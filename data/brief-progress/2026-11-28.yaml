    slug: ai-硬件竞争白热化openai-反诉苹果窃密iphone-18-量产再度推迟王兴回应美团与小微试点合作
    name: OpenAI
    decision: market_context
    summary_zh: 2026年11月27日，OpenAI在美国加州圣何塞联邦法院对苹果提起反诉，指控苹果窃取商业机密并阻挠其与硬件供应商合作，此前苹果已于7月起诉OpenAI。该诉讼围绕未来AI设备主导权展开，意味着AI硬件竞争从产品层面延伸到法律与供应链层面，可能影响AI终端设备的交付节奏与供应商合作格局（推断）。
    summary_en: On November 27, 2026, OpenAI filed a countersuit against Apple in the U.S. District Court
      for the Northern District of California, San Jose, alleging theft of trade secrets and obstruction
      of its cooperation with hardware suppliers; Apple had sued OpenAI in July. The dispute centers on
      who will lead future AI devices, extending AI hardware competition from products into legal and
      supply-chain terrain and potentially affecting delivery timelines and supplier relationships for
      AI devices (inference).
    event_summary_zh: OpenAI于2026年11月27日对苹果提起反诉，指控其窃取商业机密并阻挠与硬件供应商合作，双方由此进入互诉阶段。
    event_summary_en: On November 27, 2026, OpenAI countersued Apple, alleging trade secret theft and
      obstruction of its hardware supplier cooperation, turning the dispute into mutual litigation.
  ainews-inside-the-exploding-coding-data-market:
    slug: ainews-inside-the-exploding-coding-data-market
    name: Coding Data Market
    decision: market_context
    summary_zh: 2026年11月，多家成立约一年的创业公司通过为前沿实验室提供编程训练数据，年收入达到约1亿美元量级；训练数据供应商需设计任务、选择起始数据并构建可评分的验证器，实验室会为竞争对手无法购买的数据支付溢价。这意味着AI编程模型的数据采购正形成独立且高毛利的供给市场，推高前沿实验室的训练成本，同时为数据工程与验证工具带来新的竞争空间（推断）。
    summary_en: In November 2026, multiple roughly one-year-old startups reached about $100 million in
      annual revenue by supplying coding training data to frontier labs; suppliers design tasks, choose
      starting data and build graders, and labs pay a premium for data competitors cannot buy. This indicates
      an independent, high-margin supply market for AI coding model data, raising frontier-lab training
      costs and opening competition in data engineering and verification tooling (inference).
    event_summary_zh: 2026年11月，报道称多家成立约一年的创业公司通过向前沿实验室出售编程训练数据，年收入达到约1亿美元；供应商需设计任务、选择起始数据并构建验证器，实验室为独家数据支付溢价。
    event_summary_en: In November 2026, reports said multiple roughly one-year-old startups reached about
      $100 million in annual revenue selling coding training data to frontier labs; suppliers design tasks,
      choose starting data and build verifiers, and labs pay a premium for exclusive data.
