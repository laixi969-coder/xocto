        - ev-bacc1c289c7cb435
      - gate: model
        status: insufficient
        reason: 开源插件本身无定价，买方与付费路径未披露，可能靠代做短剧或按片收费，属判断而非已验证事实。
        evidence_ids:
        - ev-867c0e590d933c8f
      - gate: truth
