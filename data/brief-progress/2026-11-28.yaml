    summary_zh: 开发者在本地运行 DeepSeek Harness 批量拉取模型或数据文件时，打开这个下载服务，把下载任务交给一个可跨会话保留的队列，由它排队、续传并返回下载结果；具体支持的文件类型、断点恢复方式和部署流程仍待核验。
