    inspiration: 趋势：大模型厂商开始把安全审查做成可直接嵌入代码流程的开源检查器，而不是只卖模型调用。切入：面向仍大量维护 PHP 遗留系统的中小托管商和外包团队，把这类检查接进上线前的固定卡点，按项目或按次出报告收费；具体规则与误报表现尚未核验。
    summary_en: Security engineers open it before merging or releasing a PHP project, hand the code to
      the scanner, and get findings on patterns that could be exploited to run shell commands, which they
      use to block or fix; the exact rules, false-positive rate and output format still need verification.
    inspiration_en: 'Trend: model vendors are packaging security review as an open-source checker that
      plugs into the code pipeline rather than selling only model calls. Entry: target small hosting providers
      and outsourced teams still maintaining legacy PHP systems, wiring this check into a fixed pre-release
      gate and charging per project or per report; the rules and false-positive behavior are not yet verified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师在 PHP 项目合并或上线前，用该工具扫描待检代码，找出可能被利用来执行系统命令的写法，并决定是否拦截或修复。
        job_en: Security engineers scan PHP code with this tool before merge or release, find patterns
          that could be exploited to run shell commands, and decide whether to block or fix.
        pain_zh: PHP 遗留系统里命令注入类写法隐蔽且分散，人工逐处排查慢且容易漏，漏掉一处就可能变成可被远程利用的入口。
        pain_en: Command-injection patterns in legacy PHP are hidden and scattered; manual review is slow
          and leaky, and one miss can become a remotely exploitable entry point.
        current_alternative_zh: 靠人工代码评审、通用静态分析工具或事后渗透测试来发现这类问题。
        current_alternative_en: Manual code review, generic static analysis tools, or after-the-fact penetration
          testing.
