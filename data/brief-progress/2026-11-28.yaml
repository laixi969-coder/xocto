    regions_en: []
    open_source: true
    summary_zh: 开发团队在合并代码或部署 AI agent 前，用该 Rust 命令行扫描器一次检查代码库的 XSS、SQL 注入、泄露密钥、依赖 CVE 及 AI agent 配置缺陷；扫描输出带严重等级的漏洞报告，开发者据此判断哪些必须修复后才能上线。
    inspiration: 趋势：安全扫描对象从代码漏洞扩展到 AI agent 配置，agent 正进入生产环境。切入：不跟 Snyk 抢传统 SAST，从 AI agent 配置审计切入，面向接入
      LLM 的 DevOps 团队，按扫描结果收费。
    summary_en: Before merges or AI agent deployments, dev teams run this Rust CLI scanner to check XSS,
      SQL injection, leaked secrets, dependency CVEs, and agent misconfigurations in one pass; it outputs
      a severity-tagged report for fix-or-ship decisions.
    inspiration_en: Security scanning is expanding from code vulns to AI agent configs as agents enter
      production. Enter from agent-config audit for DevOps teams integrating LLMs, pricing per scan result
      rather than per seat.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发团队在 CI/CD 流水线或手动合并前，对代码仓库和 AI agent 配置进行安全扫描，确认无高危漏洞后才允许上线。
        job_en: Dev teams scan code repos and AI agent configs for vulnerabilities before CI/CD merges
          or manual releases, confirming no critical issues before shipping.
        pain_zh: 传统安全工具分散在 SAST、secret scanner、CVE checker 等多个产品里，且均未覆盖 AI agent 配置（提示词注入面、权限边界、数据泄露路径），团队需手动拼接多工具并靠人判断
          agent 配置是否安全。
        pain_en: Security tools are fragmented across SAST, secret scanners, and CVE checkers; none cover
          AI agent configs (prompt injection surface, permission boundaries, data leak paths), so teams
          chain tools manually and eyeball agent configs.
        current_alternative_zh: 分别运行 SonarQube、Snyk、TruffleHog 做代码和依赖扫描，AI agent 配置部分靠开发者自查或尚未纳入流程。
        current_alternative_en: Run SonarQube, Snyk, TruffleHog separately for code and dependency scanning;
          AI agent configs are manually reviewed or not yet part of the process.
        usage_reason_zh: 相比逐个跑多工具再手动检查 agent YAML/JSON，safe-anything 一条命令同时覆盖传统漏洞与 agent 配置缺陷，输出统一分级报告，减少工具切换和人工拼接时间；推断：团队在
          agent 上线前会把它加入 CI 作为强制关卡。
        usage_reason_en: 'Versus running multiple tools sequentially and manually checking agent YAML/JSON,
          safe-anything covers traditional vulns and agent config defects in one command with a unified
          report, cutting tool-switching; inferred: teams gate CI on it before agent deployments.'
      gates:
      - gate: value
        status: supported
        reason: 安全合规是硬性需求，工具碎片化和 agent 配置无覆盖是真实痛点；7 天 800% star 增长验证开发者关注度；扫描即出报告，交付确定。
        evidence_ids:
        - ev-acb26fa743abce9b
        - ev-86fc052808fec899
      - gate: consensus
        status: insufficient
        reason: star 增长快但无客户案例、无付费记录、无 CI 集成公开数据；无法判断是否形成持续采用。
        evidence_ids:
        - ev-acb26fa743abce9b
      - gate: model
        status: insufficient
        reason: 开源免费，未见定价页或商业版；推断可能走 open-core 或企业赞助，无公开证据。
        evidence_ids: []
      - gate: truth
        status: supported
        reason: Rust 本地二进制，扫描结果可复现；AI agent 配置扫描是新增能力，检测深度是否超越静态规则匹配仍待实测。
        evidence_ids:
        - ev-acb26fa743abce9b
      next_validation: 检查 safe-anything 仓库是否新增 公开代码仓库 Actions / GitLab CI 集成模板或企业版定价页，以判断是否从终端工具向流水线强制关卡演进。
