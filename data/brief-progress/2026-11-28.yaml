      the script, asset images and 15-second per-episode photoreal-style storyboards, then calls the Jimeng
      official CLI to render images and clips on its canvas, with cross-episode handoff and mechanical
      fault checks, finally assembling a full film; output quality and the human review step still need
      verification.
    inspiration_en: 'Trend: short-drama production is shifting from manual storyboarding plus outsourced
      shooting toward a conversational pipeline that chains script, storyboard and rendering. Entry: start
      with small production teams or independent writers who need batch photoreal-style short dramas,
      selling per-episode or per-film delivery rather than the plugin itself; pricing is undisclosed and
      not invented.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 短剧创作者在只有一句话故事、需要产出多集真人质感短片时，用它生成剧本、资产图和每集15秒分镜，再在即梦画布出图出片并拼成整部片。
