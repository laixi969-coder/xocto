      on images and videos and flags AI-generated ones so the user can decide whether to trust or share
      them; detection happens locally, while accuracy, false-positive handling and human review flow still
      need verification.
    inspiration_en: 'Trend: as synthetic images and video enter everyday feeds, checking whether content
      is AI-made is shifting from specialist verification to a routine browsing action. Entry: start with
      newsrooms, fact-checking organizations and e-commerce product-image review, where a verification
      duty already exists, and charge per check or per seat; a free consumer extension is hard to monetize
      until detection accuracy and false-positive cost are shown acceptable.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 事实核查人员或普通用户在浏览网页和社交信息流时，面对图片和视频，需要判断其是否为 AI 生成，再决定采信、转发或下架。
        job_en: Fact-checkers or ordinary users browsing web pages and social feeds need to judge whether
          an image or video is AI-generated before trusting, sharing or taking it down.
        pain_zh: 合成内容混入日常信息流后，肉眼难以分辨，误信或误转会带来声誉与事实风险；逐张送第三方检测又打断浏览流程。
        pain_en: Synthetic content mixed into everyday feeds is hard to spot by eye, and trusting or sharing
          it carries reputational and factual risk; sending each item to a third-party detector interrupts
          browsing.
        current_alternative_zh: 目前多靠肉眼判断、平台自带标注、反向搜图或把文件上传到独立检测网站，步骤分散且需要离开当前页面。
        current_alternative_en: Today people rely on eyeballing, platform labels, reverse image search
          or uploading files to standalone detection sites, which is fragmented and requires leaving the
