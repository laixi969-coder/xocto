    summary_zh: 技术文档作者或工程师在交付英文说明书、维修手册前，打开这个 agent 技能，把草稿交给它按 ASD-STE100 简化技术英语规则改写，并去掉 AI 写作痕迹；用户拿到的是改写后的文本，是否达到
      80% 合规及最终定稿仍需人工核对。具体流程与交付仍待核验。
    inspiration: 趋势：受控语言（如简化技术英语）这类有明确规则手册的写作标准，正被做成可调用的改写技能，说明合规写作开始从人工培训转向工具化。切入：可从航空、工业设备、医疗器械的说明书与维修手册供应链进入，按文档份数或合规审校结果收费；但需先确认它是否真能对齐
      STE100 词典与句式规则，而非只做去 AI 味。
    summary_en: Before delivering English manuals or maintenance instructions, technical writers or engineers
      run a draft through this agent skill, which rewrites it toward ASD-STE100 Simplified Technical English
      and strips AI writing tells. The user gets rewritten text; whether it reaches the claimed 80% compliance
      and the final sign-off still need human checking. The exact workflow and deliverable remain to be
      verified.
    inspiration_en: 'Trend: controlled-language standards such as Simplified Technical English, which
      come with explicit rulebooks, are being packaged as callable rewriting skills, suggesting compliance
      writing is shifting from human training toward tooling. Entry: start from the documentation supply
      chain of aviation, industrial equipment and medical devices, charging per document or per compliance
      review; first confirm it actually follows STE100 dictionary and sentence rules rather than only
      removing AI tone.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 技术文档作者或工程师在交付英文说明书、维修手册前，把草稿改写成符合简化技术英语规则的版本。
        job_en: Technical writers or engineers rewriting English manuals and maintenance instructions
          into Simplified Technical English compliant versions before delivery.
        pain_zh: 受控语言规则细碎，人工逐句对照规则手册改写耗时且易漏；AI 生成的文本又常带不符合规范的表达。
        pain_en: Controlled-language rules are granular; manually rewriting sentence by sentence against
          a rulebook is slow and error-prone, and AI-generated text often carries non-compliant phrasing.
        current_alternative_zh: 人工按 STE100 规则手册逐句改写，或依赖培训过的写作者与外部审校。
        current_alternative_en: Manual sentence-by-sentence rewriting against the STE100 rulebook, or
          relying on trained writers and external reviewers.
        usage_reason_zh: 推断：它把规则检查与改写合并为一次 agent 调用，减少逐句对照手册的步骤，因此需要批量处理英文技术文档的团队会尝试；但合规准确度与人工复核成本尚缺公开证据。
        usage_reason_en: 'Inference: it merges rule checking and rewriting into one agent call, cutting
          the step of checking each sentence against the manual, so teams handling English technical documents
          in bulk may try it; public evidence on compliance accuracy and human review cost is still missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决受控语言文档改写耗时且易漏规则的问题，痛点具体，交付为改写后文本，结构上成立。
        evidence_ids:
        - ev-81a8a9f39c9af049
        - ev-b90c17737adbd46b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度，缺少技术写作者的实际使用反馈或客户案例。
        evidence_ids:
        - ev-b90c17737adbd46b
      - gate: model
        status: insufficient
        reason: 开源技能无公开定价与付费路径，买方可能是文档团队或合规部门，属判断而非已验证事实。
        evidence_ids:
        - ev-81a8a9f39c9af049
      - gate: truth
        status: insufficient
        reason: 宣称改写至 80% 合规，但缺少对 STE100 规则覆盖度与人工复核量的可核验材料。
        evidence_ids:
        - ev-81a8a9f39c9af049
      next_validation: 收集该仓库的 issue、discussion 或文档，核对其是否引用 ASD-STE100 词典与句式规则，以及用户对合规准确度的反馈。
    event_summary_zh: 2026 年 11 月 9 日发布的开源 agent 技能 STE80 Humanizer，宣称按 ASD-STE100 简化技术英语改写文本并去除 AI 写作痕迹；至
      11 月 28 日仓库星数约 1,169。
    event_summary_en: The open-source agent skill STE80 Humanizer, published on 9 November 2026, claims
      to rewrite text toward ASD-STE100 Simplified Technical English and remove AI writing tells; by 28
      November the repository had about 1,169 stars.
