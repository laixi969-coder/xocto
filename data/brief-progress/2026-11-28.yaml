    open_source: true
    summary_zh: 电商卖家或短视频投放人员在制作商品带货视频和 UGC 广告时，打开这个本地工作台，把商品素材、数字人资产和参考灵感放进无限画布与多轨时间线，由 AI 参与生成与剪辑，最终拿到可继续人工调整的视频草稿。具体生成环节与成片质量仍待核验。
    inspiration: 趋势：电商短视频与 UGC 广告的制作正从外包拍摄和剪辑软件，转向把素材库、灵感拆解和剪辑放进同一个本地工作台。切入：从中小电商卖家和投放团队的商品视频批量产出环节进入，卖法可围绕按成片或按投放素材量计费，但公开材料未披露定价，需先核验。
    summary_en: When e-commerce sellers or short-video ad buyers make product videos and UGC ads, they
      open this local workbench, place product assets, digital-human assets and reference inspiration
      onto an infinite canvas and multi-track timeline, and AI participates in generation and editing
      to produce a video draft for further manual adjustment. The exact generation steps and output quality
      still need verification.
    inspiration_en: 'Trend: e-commerce short-video and UGC ad production is shifting from outsourced shoots
      and editing software toward a single local workbench combining asset libraries, inspiration teardown
      and editing. Entry: start from the batch product-video output step of small e-commerce sellers and
      ad teams; pricing could be per finished video or per ad asset, but no pricing is disclosed and must
      be verified first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 电商卖家或短视频投放人员要为商品批量制作带货视频和 UGC 广告，需要把商品素材、数字人资产和参考灵感整理成可剪辑的多轨视频成片。
        job_en: E-commerce sellers or short-video ad buyers need to batch-produce product videos and UGC
          ads, assembling product assets, digital-human assets and reference inspiration into an editable
          multi-track video deliverable.
        pain_zh: 商品视频和 UGC 广告需求高频且量大，传统上要外包拍摄或由剪辑师逐条手工剪辑，素材分散、灵感拆解与成片制作割裂，单条成本和时间都高。
        pain_en: Product videos and UGC ads are high-frequency and high-volume; traditionally they require
          outsourced shoots or editors cutting each clip by hand, with scattered assets and a gap between
          inspiration teardown and final editing, making each clip costly and slow.
