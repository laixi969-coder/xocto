        evidence_ids:
        - ev-b73d22d8367c2c1c
      - gate: model
        status: insufficient
        reason: MIT 免费开源，未见付费路径或按结果收费的安排，买方与收入模式未披露。
        evidence_ids:
        - ev-b73d22d8367c2c1c
      - gate: truth
        status: insufficient
        reason: 技能包为提示与流程封装，交付质量依赖所用模型，人工确认边界与本地商家包效果仍待核验。
        evidence_ids:
        - ev-b73d22d8367c2c1c
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有用户报告实际用于本地商家营销并给出交付结果。
