        pain_zh: 传统短剧要先写剧本、画分镜、找拍摄团队，跨集还要保持人物与场景一致，周期长、成本高，单集衔接容易出错。
        pain_en: Traditional short dramas require writing a script, drawing storyboards and hiring a shoot
          crew, while keeping characters and scenes consistent across episodes, which is slow, costly
          and error-prone at episode handoffs.
        current_alternative_zh: 创作者目前靠人工写剧本、手绘或外包分镜，再用多个出图出片工具分别生成后手动拼接。
