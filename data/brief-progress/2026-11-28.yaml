  aiconnect:
    slug: aiconnect
    name: AI Connect
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 网站与内容出版
    - 软件与互联网服务
    industries_en:
    - Websites and Content Publishing
    - Software and Internet Services
    jobs:
    - 网站运营者在站内加入问答或搜索入口时，让访客用自己已登录的 ChatGPT、Claude、Gemini 或 OpenRouter 账号完成对话与检索，并拿到可嵌入 React、Web Components
      的组件
    jobs_en:
    - Website operators adding an in-site Q&A or search entry let visitors run chat and retrieval through
      their own logged-in ChatGPT, Claude, Gemini or OpenRouter accounts, and receive components embeddable
      in React and Web Components
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 网站运营者要在站内加问答框或可回答的搜索栏时，原本得自己接模型 API、管密钥和计费；AI Connect 是 TensorPass 的开源 SDK，通过 AI Wallet
      浏览器扩展让访客用自己已登录的 ChatGPT、Claude、Gemini 或 OpenRouter 账号跑对话与检索，交付可嵌入 React、Web Components 的组件，具体计费与人工确认环节仍待核验。
    inspiration: 趋势：把模型成本转给访客自有账号，是站内 AI 入口的一种新计费结构。切入：面向内容站、文档站和独立电商，从“访客自带账号的站内搜索与问答”这一环节进入，卖点可落在免密钥托管与按站点部署，价格未披露。
    summary_en: When a website operator wants an in-site Q&A box or an answering search bar, they normally
      wire up model APIs, keys and billing themselves. AI Connect is TensorPass's open-source SDK that,
      via the AI Wallet browser extension, lets visitors run chat and retrieval on their own logged-in
      ChatGPT, Claude, Gemini or OpenRouter accounts, delivering components embeddable in React and Web
      Components; billing and human review steps remain unverified.
    inspiration_en: 'Trend: shifting model cost onto visitors'' own accounts is a new billing structure
      for in-site AI entry points. Entry: target content sites, docs sites and independent e-commerce,
      starting from visitor-owned-account in-site search and Q&A, with the pitch on key-free hosting and
      per-site deployment; pricing is undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 网站运营者在站内加入问答或搜索入口时，让访客用自己已登录的模型账号完成对话与检索，并拿到可嵌入页面的组件。
        job_en: Website operators adding an in-site Q&A or search entry let visitors run chat and retrieval
          through their own logged-in model accounts and receive embeddable components.
        pain_zh: 站内 AI 入口要自建密钥托管、调用计费和限流，运营者不愿承担这部分成本与运维。
        pain_en: In-site AI entry points require self-managed key custody, usage billing and rate limiting,
          which operators do not want to own.
        current_alternative_zh: 自接模型 API 并自管密钥与账单，或干脆不做站内 AI 入口。
        current_alternative_en: Wiring model APIs directly with self-managed keys and bills, or skipping
          an in-site AI entry point altogether.
        usage_reason_zh: 推断：它把调用成本转到访客自有账号，运营者省去密钥托管与按量计费这一步，因此在意成本的小型内容站和文档站会先试；尚无留存或付费证据。
        usage_reason_en: 'Inference: it moves call cost to visitors'' own accounts, sparing operators
          key custody and metered billing, so cost-sensitive small content and docs sites would try it
          first; no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决站内 AI 入口的密钥托管与调用计费负担，痛点具体，旧做法是自接 API 或不做。
        evidence_ids:
        - ev-61db78945e2408d8
      - gate: consensus
        status: insufficient
        reason: 仓库星数仅数十且增长平缓，属关注度信号，不能证明站点运营者持续采用。
        evidence_ids:
        - ev-283cc900081e91df
      - gate: model
        status: insufficient
        reason: 公开材料未说明 TensorPass 如何收费、谁付费，买方路径未核验。
        evidence_ids:
        - ev-61db78945e2408d8
      - gate: truth
        status: insufficient
        reason: 依赖访客安装浏览器扩展，交付是否稳定发生缺少实测与部署文档证据。
        evidence_ids:
        - ev-3af4f7bf342ad8c2
      next_validation: 收集 TensorPass 官方定价页或部署文档，确认站点方与访客各自的付费与调用路径。
