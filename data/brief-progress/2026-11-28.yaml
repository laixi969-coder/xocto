  pop-agent:
    slug: pop-agent
    name: PopAgent
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用编码代理的开发者在其推理过程中发现方向错误时，中途打断并纠正，避免整轮重跑
    jobs_en:
    - Developers using coding agents interrupt mid-turn to correct a wrong direction in the reasoning
      stream, avoiding a full rerun
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用编码代理的开发者会在代理执行到一半时打开 PopAgent 的本地网页界面，查看推理流，并在发现方向错误时中途插入纠正，同时管理模型与工具；它兼容 pi、Codex、Claude
      Code、OpenCode 和 DSH，会话直接保存在引擎自己的文件里，不建数据库、不注册账号。用户最终拿到的是被及时纠偏的代理执行过程，具体交付质量与人工确认环节仍待核验。
    inspiration: 趋势：编码代理的瓶颈正从“能不能写代码”转向“跑偏后如何低成本纠偏”，中途干预成为新的控制点。切入：从需要长时间无人值守跑代理的团队进入，做可审计的干预与回放层，按团队席位或私有部署收费；不要从通用聊天界面切入。
    summary_en: Developers running coding agents open PopAgent's local web UI mid-run to watch the reasoning
      stream, cut in with a correction before the turn finishes, and manage models and tools. It works
      with pi, Codex, Claude Code, OpenCode and DSH, and keeps sessions in the engine's own files with
      no database or account. The user gets a corrected agent run; delivery quality and human sign-off
      steps still need verification.
    inspiration_en: 'Trend: the bottleneck for coding agents is shifting from writing code to cheaply
      correcting a run that goes off track, making mid-run intervention a new control point. Entry: start
      with teams that let agents run unattended for long stretches and sell an auditable intervention
      and replay layer per seat or via private deployment; do not start from a generic chat UI.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者在其推理过程中发现方向错误时，中途打断并纠正，避免整轮重跑。
        job_en: Developers using coding agents interrupt mid-turn to correct a wrong direction in the
          reasoning stream, avoiding a full rerun.
        pain_zh: 编码代理一轮执行耗时长，跑偏后只能等结束再重来，浪费时间和 token；现有终端界面难以在推理中途看清并插入修正。
        pain_en: A coding-agent turn takes long; when it goes off track the user must wait for it to finish
          and rerun, wasting time and tokens, and terminal UIs make it hard to see and inject a correction
          mid-reasoning.
        current_alternative_zh: 开发者通常直接在终端里跑代理，跑偏后中断整轮、改提示再重跑，或事后人工修补产出。
        current_alternative_en: Developers typically run agents in a terminal, kill the whole turn when
          it drifts, edit the prompt and rerun, or fix the output by hand afterwards.
        usage_reason_zh: 推断：相较中断重跑，PopAgent 让用户在推理流进行中直接插入纠正，省掉整轮重跑这一步；需要长时间跑代理并希望及时纠偏的开发者会因此选择它。
        usage_reason_en: 'Inference: versus killing and rerunning, PopAgent lets users inject a correction
          while the reasoning stream is still running, removing the full rerun step; developers running
          long agent sessions who want timely correction would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理跑偏后只能整轮重来的问题，痛点在长任务中刚性，中途纠偏可减少重跑成本。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
        - ev-df859f0a3e7cc888
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数增长，缺少用户反馈或案例说明开发者确实在中途纠偏。
        evidence_ids:
        - ev-df859f0a3e7cc888
      - gate: model
        status: insufficient
        reason: 开源本地工具，未见定价或付费路径，买方与收费方式不明，属判断非事实。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
      - gate: truth
        status: insufficient
        reason: 会话存于引擎自有文件、无账号，交付依赖底层代理，纠偏是否确定性生效缺实测。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者是否报告中途纠偏的实际使用与效果。
    event_summary_zh: 2026-11-23 发布的 PopAgent 开源仓库在数日内星数从 129 增至 152，新增对 pi、Codex、Claude Code、OpenCode
      和 DSH 的兼容说明。
    event_summary_en: The PopAgent open-source repository, published on 2026-11-23, grew from 129 to 152
      stars within days and added compatibility notes for pi, Codex, Claude Code, OpenCode and DSH.
  proactive-assistant:
