      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全研究员或逆向工程师在分析二进制、Android 应用或 GPU 内核时，需要读懂结构、重命名符号并打补丁，完成逆向与修改。
        job_en: Security researchers or reverse engineers analyzing binaries, Android apps or GPU kernels
          need to understand structure, rename symbols and apply patches to complete reverse engineering
          and modification.
        pain_zh: 逆向分析长期依赖人工逐段阅读汇编、手工维护符号名和补丁，耗时长且高度依赖个人经验；改错一步就要回退重来。
        pain_en: Reverse analysis has long relied on manually reading assembly, maintaining symbol names
          and patches by hand; it is slow and highly dependent on individual experience, and one wrong
          step forces a rollback.
        current_alternative_zh: 现有做法是 IDA、Ghidra 等反汇编工具加人工脚本，或由资深工程师带新人逐段讲解。
        current_alternative_en: The current approach is disassemblers such as IDA and Ghidra plus hand-written
          scripts, or senior engineers walking juniors through code section by section.
        usage_reason_zh: 推断：相较人工逐段读汇编并手写补丁，代理直接读取文件、重命名符号并生成补丁，减少的是“读懂结构—定位—改写”这一串手工步骤；因此处理陌生二进制或内核代码的安全团队会在需要快速摸清结构时选择它。
        usage_reason_en: 'Inference: compared with manually reading assembly and hand-writing patches,
          the agent directly reads files, renames symbols and generates patches, cutting the manual chain
          of understand-locate-rewrite; security teams facing unfamiliar binaries or kernel code would
          therefore choose it when they need to map structure quickly.'
      gates:
      - gate: value
        status: supported
        reason: 它解决逆向分析中读汇编、维护符号与打补丁的手工负担，旧流程与不采用的代价清楚；买方与付费方式尚不明确。
        evidence_ids:
        - ev-eac96f3c2685a5de
        - ev-209af9d3b7122562
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度缓慢增长，缺少用户评价、客户案例或团队采用证据，无法判断是否形成共识。
        evidence_ids:
        - ev-209af9d3b7122562
      - gate: model
        status: insufficient
        reason: 未披露定价、收费方式或买方类型；5700 万欧元融资报道与该项目是否同一实体无法确认，不能作为收入证据。
        evidence_ids:
        - ev-4c18f88c64c5fb83
      - gate: truth
        status: insufficient
        reason: 补丁正确性、人工复核边界与安全责任未说明，交付能否确定性发生仍缺公开材料。
        evidence_ids:
        - ev-eac96f3c2685a5de
