    inspiration: 趋势：助手竞争从“问答”转向“主动推送”，记忆与多设备接入成为差异点。切入：从有明确高频提醒需求的垂直人群（如日程密集的专业人士）进入，做可解释、可关闭的主动提醒，按订阅收费；不要从泛个人助理正面切入。
    summary_en: Individual users connect their apps and devices to proactive-assistant, which builds long-term
      memory and proactively surfaces reminder cards across web, macOS and iOS. The user gets prompts
      without asking. Which data it reads, how cards are generated and how false positives are handled
      are not stated in public material, so the concrete workflow and delivery still need verification.
    inspiration_en: 'Trend: assistant competition is shifting from question answering to proactive surfacing,
      with memory and multi-device access as differentiators. Entry: start with a vertical group that
      has clear high-frequency reminder needs, such as schedule-dense professionals, and sell explainable,
      dismissible proactive alerts by subscription; do not attack generic personal assistants head-on.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在日常中连接自己的应用与设备，让助手基于长期记忆主动推送提醒卡片，代替自己主动发起查询。
        job_en: Individual users connect their apps and devices so the assistant proactively surfaces
          reminder cards from long-term memory instead of initiating queries themselves.
        pain_zh: 用户需要反复主动查询和记挂事项，容易遗漏；现有助手多为被动问答，不会在合适时机主动提醒。
        pain_en: Users must repeatedly query and remember things themselves and easily miss them; most
          assistants are passive Q&A and do not prompt at the right moment.
        current_alternative_zh: 用户目前靠日历、待办应用和手动提醒，或主动向通用助手提问来获取信息。
        current_alternative_en: Users currently rely on calendars, to-do apps and manual reminders, or
          actively ask a general assistant.
        usage_reason_zh: 推断：相较手动设提醒或主动查询，它通过长期记忆与多设备接入在合适时机自动弹出卡片，省掉用户自己记挂和发起查询这一步；希望减少遗漏的个人用户会因此尝试。
        usage_reason_en: 'Inference: versus setting reminders by hand or querying actively, it uses long-term
          memory and device connections to surface cards at the right moment, removing the step of remembering
          and initiating a query; users who want fewer misses would try it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决用户需反复主动查询、易遗漏事项的问题，主动提醒在日程密集场景有刚性，但误报风险需核验。
        evidence_ids:
        - ev-eba9c002dd34b5f9
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 50 增至 79，缺少用户反馈说明主动卡片确实被使用。
        evidence_ids:
        - ev-eba9c002dd34b5f9
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径，个人订阅还是其他买方不明，属判断非事实。
        evidence_ids:
        - ev-b313c39939727fb5
      - gate: truth
        status: insufficient
        reason: 长期记忆与主动推送的准确性和隐私边界未披露，交付能否确定性发生缺实测。
        evidence_ids:
        - ev-ff8c0e2a962c9ec9
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对主动卡片准确性与误报的实际反馈。
    event_summary_zh: 2026-11-15 发布的 proactive-assistant 开源仓库在两周内星数从 50 增至 79，持续更新网页、macOS 和 iOS 三端说明。
