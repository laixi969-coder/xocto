        status: supported
        reason: 它解决概念阶段草图到可编辑三维体块的重建负担，痛点具体且旧流程可指认；买方与付费路径尚未公开。
        evidence_ids:
        - ev-5517aab57da638ff
        - ev-0b9f2661e6a4aa62
      - gate: consensus
        status: insufficient
        reason: 仓库星标从116升至208、开放议题31个，说明有开发者关注，但没有用户评价或客户案例证明场景共识。
        evidence_ids:
        - ev-5517aab57da638ff
        - ev-0b9f2661e6a4aa62
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明收入来源、定价或企业采购路径，钱从哪来无法核验。
