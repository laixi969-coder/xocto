        reason: 仅一次大会亮相，无公开定价页、客户案例或采用量数据，无法判断市场是否已认可该形态。
        evidence_ids:
        - ev-05e3ce099f290b3b
      - gate: model
        status: insufficient
        reason: 未披露定价、支持模型列表、部署方式与售后，买方付费路径与交付确定性无法核验。
        evidence_ids:
        - ev-05e3ce099f290b3b
      - gate: truth
        status: insufficient
        reason: 无实际推理性能对比、总拥有成本测算或安全合规认证材料，无法确认交付结果是否优于云API。
        evidence_ids:
        - ev-05e3ce099f290b3b
      next_validation: 联想官网P7产品页的定价、支持模型列表与企业部署文档
