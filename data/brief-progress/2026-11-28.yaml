  inference-optimization-playbook:
    slug: inference-optimization-playbook
    name: inference-optimization-playbook
    decision: watching
    event_summary_zh: 2026年11月20日，作者 alesha-pro 在开源仓库发布 97 条在消费级 GPU（4 张 RTX 3090、专家权重放内存）上加速超大 MoE 模型的实测假设记录，区分有效与无效做法，并附一份可供编码代理直接使用的技能说明；仓库现有
      118 星、21 次分叉。
    event_summary_en: On 2026-11-20, author alesha-pro published an open repository recording 97 tested
      hypotheses on speeding up very large MoE models on consumer GPUs (4x RTX 3090 with experts in RAM),
      separating what worked from what failed, plus a ready-to-use skill for coding agents; the repo currently
      has 118 stars and 21 forks.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 个人开发者或小团队在自有消费级显卡上部署大 MoE 模型时，查阅实测记录选择量化、卸载与并行配置
    - 独立研究者评估本地推理方案时，用失败案例排除不可行路径
    jobs_en:
    - Individual developers or small teams deploying large MoE models on their own consumer GPUs consult
      the tested records to choose quantization, offloading and parallelism settings
    - Independent researchers evaluating local inference options use the failure cases to rule out infeasible
      paths
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人开发者或小团队在自有消费级显卡上跑超大 MoE 模型时，会打开这份实测记录：它把 97 条关于量化、专家权重放内存、多卡并行的尝试逐条写明有效或失败及原因，用户据此排除走不通的配置，拿到一份可照做的调优清单；编码代理也可直接读取其中的技能说明。具体配置是否可复现仍待核验。
    inspiration: 趋势：大模型本地推理正从“能不能跑”转向“怎么在便宜硬件上跑得动”，实测经验本身成了稀缺资产。切入：面向买不起多卡服务器的小型 AI 团队或私有化部署集成商，把这类硬件实测整理成按显卡型号和模型规模索引的调优服务或部署验收清单，按部署项目收费，而非卖工具订阅。
    summary_en: 'When individual developers or small teams run very large MoE models on their own consumer
      GPUs, they open this tested record: it lists 97 attempts at quantization, keeping expert weights
      in RAM and multi-GPU parallelism, marking each as working or failed and why, so users can rule out
      dead-end configurations and get a tuning checklist to follow; coding agents can also read the included
      skill notes. Whether the configurations reproduce is still unverified.'
    inspiration_en: 'Trend: local inference of large models is shifting from ''can it run'' to ''how to
      make it run on cheap hardware'', making hands-on test records a scarce asset. Entry: target small
      AI teams or private-deployment integrators who cannot afford multi-GPU servers, packaging such hardware
      tests into tuning services or deployment acceptance checklists indexed by GPU model and model size,
      charged per deployment project rather than as tool subscriptions.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人开发者或小团队在只有消费级显卡的情况下，要决定如何配置量化、专家权重卸载和多卡并行，才能让超大 MoE 模型在本地跑起来。
        job_en: Individual developers or small teams with only consumer GPUs must decide how to configure
          quantization, expert offloading and multi-GPU parallelism so a very large MoE model runs locally.
        pain_zh: 本地推理的配置组合极多，官方文档通常面向数据中心硬件，试错一次要花数小时甚至数天，失败原因难以归因。
        pain_en: Local inference has a huge configuration space, official docs usually target data-center
          hardware, each trial costs hours or days, and failures are hard to attribute.
        current_alternative_zh: 翻阅论坛帖子、零散博客和模型社区讨论，或直接反复试错。
        current_alternative_en: Reading forum posts, scattered blogs and model community threads, or simply
          trial and error.
        usage_reason_zh: 推断：相较零散帖子，它把 97 条尝试按有效与失败分类并写明原因，用户可直接排除走不通的配置，减少反复试错的时间；只有需要本地部署大 MoE 模型且硬件受限的人才会在选型阶段打开它。
        usage_reason_en: 'Inference: compared with scattered posts, it classifies 97 attempts as working
          or failed with reasons, letting users rule out dead-end configurations and cutting trial-and-error
          time; only those needing local deployment of large MoE models under hardware constraints would
          open it at the selection stage.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地部署大 MoE 模型时配置试错成本高、失败难归因的问题，痛点具体且不解决的代价是可计的时间浪费。
        evidence_ids:
        - ev-683ea1a783e8d32a
      - gate: consensus
        status: insufficient
        reason: 118 星与 21 次分叉只说明有初步关注，没有讨论、引用或复现反馈证明它被持续使用。
        evidence_ids:
        - ev-683ea1a783e8d32a
      - gate: model
        status: insufficient
        reason: 开源仓库无定价与付费路径，买方可能是私有化部署集成商，这是判断而非已验证事实。
        evidence_ids:
        - ev-683ea1a783e8d32a
      - gate: truth
        status: insufficient
        reason: 实测结论是否可复现、是否覆盖主流模型与显卡组合，公开材料未给出验证记录。
        evidence_ids:
        - ev-683ea1a783e8d32a
      next_validation: 收集仓库 issue 与 discussion 中其他用户复现或报告失败的记录，确认实测结论的可复现性。
