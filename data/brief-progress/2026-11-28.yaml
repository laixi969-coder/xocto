        usage_reason_zh: 推断：相较手动重试，持久队列把中断后的续传和任务跟踪交给服务处理，减少重新下载整份文件的负担；但缺少用户反馈证明开发者会长期使用。
        usage_reason_en: 'Inference: versus manual retries, a persistent queue handles resume and task
          tracking after interruption, cutting the burden of re-downloading whole files; user feedback
          proving long-term use is missing.'
      gates:
