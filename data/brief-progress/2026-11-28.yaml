    jobs_en:
    - Developers switching between Claude Code, Codex and other agent CLIs in a local terminal need a
      single entry point to launch and invoke these command-line agents to complete coding tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在本地终端里原本要分别启动 Claude Code、Codex、PI、OMP 等 Agent 命令行工具，dsh-ccgui 把这些 CLI 接入 DeepSeek
      Harness 的统一界面，让用户在同一处调用不同代理执行编码任务。最终交付仍是各代理产出的代码或终端结果，人工需自行核对；具体交互流程与交付形态仍待核验。
    inspiration: 趋势是编码代理从单一模型走向多 CLI 并存，开发者开始需要一个调度层而非再学一个工具。切入可考虑面向已同时使用多个 Agent CLI 的中小研发团队，做统一调用与成本可见的入口；但该仓库仅
      56 星、无付费与采用证据，窗口与卖法均未验证。
    summary_en: Developers previously had to launch Claude Code, Codex, PI and OMP agent CLIs separately
      in a local terminal; dsh-ccgui plugs these CLIs into a unified DeepSeek Harness interface so users
      can invoke different agents from one place to run coding tasks. The deliverable is still each agent's
      code or terminal output, which the user must check; the exact interaction flow and delivery form
      remain to be verified.
    inspiration_en: The trend is coding agents moving from a single model to multiple coexisting CLIs,
      creating demand for a scheduling layer rather than another tool to learn. A possible entry is a
      unified invocation and cost-visibility front end for small engineering teams already using several
      agent CLIs; with only 56 stars and no payment or adoption evidence, both the window and the business
      model are unverified.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在本地终端里同时使用 Claude Code、Codex、PI、OMP 等 Agent CLI 时，需要一个统一入口启动并调用它们来完成编码任务。
        job_en: Developers using Claude Code, Codex, PI and OMP agent CLIs side by side in a local terminal
          need one entry point to launch and invoke them for coding tasks.
        pain_zh: 多个 Agent CLI 各自有启动方式与界面，切换成本高，上下文和调用记录分散，容易重复配置。
        pain_en: Each agent CLI has its own launch method and interface, so switching is costly, context
          and invocation history are scattered, and configuration gets repeated.
        current_alternative_zh: 开发者分别打开各 CLI 的终端窗口，手动记忆命令与配置，或自己写脚本封装。
        current_alternative_en: Developers open separate terminal windows for each CLI, memorize commands
          and configs manually, or write their own wrapper scripts.
        usage_reason_zh: 推断：它把多个 Agent CLI 收进同一界面，减少逐个启动和切换终端的步骤，因此同时使用多个编码代理的开发者会在需要对比或串联调用时选择它；尚无留存或付费证据。
        usage_reason_en: 'Inference: it gathers several agent CLIs into one interface, cutting the steps
          of launching and switching terminals one by one, so developers using multiple coding agents
          may choose it when comparing or chaining calls; no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多 Agent CLI 分散启动、切换成本高的问题，旧做法是逐个开终端或自写脚本，痛点具体且可还原。
