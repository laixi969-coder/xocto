    open_source: true
    summary_zh: 构建者在本地电脑或自有服务器上运行 AI 代理时打开它，把代理产生的运行过程与结果交给它汇总，只保留需要人关注的部分；用户最终拿到的是筛选后的提醒或结果，具体筛选规则、交付形态与人工确认环节仍待核验。
    inspiration: 趋势：AI 编码代理从云端托管走向自托管，运行过程与结果分散在个人机器上，谁来做“只看要紧事”的收件箱成为新环节。切入：从需要数据不出本地的独立开发者和小团队进入，先做代理运行结果的筛选与提醒，卖法可围绕自托管部署与团队席位，但公开材料未披露价格，需先核验。
    summary_en: Builders open it while running AI agents on their own computers or servers, feeding the
      agents' run output into it so only the parts needing human attention remain; users get a filtered
      alert or result, while the filtering rules, delivery form and human confirmation step still need
      verification.
    inspiration_en: 'Trend: AI coding agents are moving from cloud hosting toward self-hosting, scattering
      run output across personal machines, which makes a ''only what matters'' inbox a new layer. Entry:
      start with solo developers and small teams that need data to stay local, filtering and alerting
      on agent run results, with self-hosted deployment and team seats as possible pricing, though no
      public price is disclosed and must be verified first.'
