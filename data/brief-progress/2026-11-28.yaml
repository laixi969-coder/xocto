        reason: 它解决浏览时判断图片视频是否 AI 生成的需求，痛点是肉眼难辨且逐张外送检测打断流程，旧替代分散。
        evidence_ids:
        - ev-dd49b6d68e23e448
        - ev-785b1a2fb3cf1e7f
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度缓慢增长，缺少用户评价、客户案例或采用数据，无法判断是否形成稳定使用。
        evidence_ids:
        - ev-785b1a2fb3cf1e7f
      - gate: model
        status: insufficient
        reason: 开源免费，未见定价或付费路径；可能面向机构按核查量或席位收费，但这是判断而非已验证事实。
        evidence_ids:
        - ev-dd49b6d68e23e448
      - gate: truth
        status: insufficient
        reason: 本地检测的准确率、误报处理和人工复核边界均无公开材料，承诺能否确定性交付尚不清楚。
        evidence_ids:
        - ev-dd49b6d68e23e448
