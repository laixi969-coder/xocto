  resend:
    slug: resend
    name: Resend
    decision: queued
    event_summary_zh: Resend 入选 Madrona 2026 年 Intelligent Applications 40 早期阶段名单；另有一项独立研究称，在 102 次可提取的邮件服务推荐中，Claude
      Code 有 64 次首选 Resend，而 SendGrid 仅 7 次居首、55 次作为备选出现。
    event_summary_en: Resend was named to Madrona's 2026 Intelligent Applications 40 list at the early
      stage; a separate independent study reported that Claude Code picked Resend first in 64 of 102 extractable
      email-service recommendations, while SendGrid came first only 7 times and appeared as an alternative
      55 times.
    category: AI + 开发
    project_type: new_application
    industries:
    - 软件开发
    - 互联网服务
    industries_en:
    - software development
    - internet services
    jobs:
    - 开发者在给应用接入事务性邮件时，让编码代理生成发信代码并选择邮件服务商，需要拿到可运行的集成与投递配置
    jobs_en:
    - Developers wiring transactional email into an app ask a coding agent to generate sending code and
      pick an email provider, and need a working integration and delivery setup
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 开发者在应用里接入注册确认、密码重置等事务性邮件时，把需求交给编码代理，代理会直接生成调用 Resend 的发信代码和域名配置；用户拿到可运行的集成，投递与退信处理仍需人工核对。具体流程与交付细节仍待核验。
    inspiration: 趋势：编码代理开始替开发者做技术选型，邮件服务商的竞争从文档和价格前移到“代理是否默认推荐你”。切入：面向中国出海 SaaS 与独立开发者，做被代理优先检索和引用的接入文档与示例仓库，按投递量或按结果计费，而不是只卖
      API 额度。
    summary_en: When developers add signup confirmations or password resets to an app, they hand the task
      to a coding agent, which generates Resend sending code and domain configuration; the user gets a
      runnable integration, while delivery and bounce handling still need human checks. The exact workflow
      and deliverables remain to be verified.
    inspiration_en: 'Trend: coding agents now make technology choices for developers, so email providers
      compete on being the agent''s default recommendation rather than only on docs and price. Entry:
      for China-based SaaS exporters and indie developers, build integration docs and example repos that
      agents retrieve and cite first, charging by delivery volume or outcome rather than API credits alone.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在应用上线前接入注册确认、密码重置等事务性邮件，让编码代理生成发信代码并选定服务商，要拿到能跑通的集成。
        job_en: Before launch, developers add transactional email such as signup confirmations and password
          resets, asking a coding agent to generate sending code and pick a provider, and need a working
          integration.
        pain_zh: 自建 SMTP 要处理送达率、域名认证和退信，选错服务商后迁移成本高；开发者往往直接接受代理给出的第一个方案。
        pain_en: Self-hosting SMTP means handling deliverability, domain authentication and bounces, and
          switching providers later is costly; developers often accept the agent's first suggestion.
        current_alternative_zh: 旧做法是开发者自行比较 SendGrid、Postmark 等厂商文档，手动写集成代码并配置 DNS 记录。
        current_alternative_en: The old way is for developers to compare SendGrid, Postmark and other
          vendors' docs themselves, hand-write the integration and configure DNS records.
        usage_reason_zh: 推断：Resend 通过让代理在生成代码时直接产出可用的发信集成，省去开发者逐个比对文档和手写 SDK 调用这一步，因此接受代理补丁的开发者会在接入邮件时选择它；尚无留存或复购证据。
        usage_reason_en: 'Inference: by having agents emit a usable sending integration directly, Resend
          removes the step of comparing docs and hand-writing SDK calls, so developers who accept agent
          patches pick it when adding email; no retention or repeat-purchase evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者接入事务性邮件时选型与集成成本高的问题，旧流程是逐个比对厂商文档并手写代码，痛点具体且交付可核对。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: consensus
        status: insufficient
        reason: 仅有代理推荐分布的独立研究，缺少开发者实际采用、留存或团队迁移的公开证据。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与付费结构，买方可能是开发者或企业，但付费路径尚未核验。
        evidence_ids:
        - ev-9b623a318120e7c8
      - gate: truth
        status: supported
        reason: 邮件投递是上线必需环节，送达与退信处理可被结果检验，产品贴近该工作的第一性目标。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      next_validation: 收集 Resend 官方定价页与公开客户案例，核验其计费方式与付费客户类型。
