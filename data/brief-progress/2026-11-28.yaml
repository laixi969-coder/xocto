  knowledge-galaxy:
    slug: knowledge-galaxy
    name: knowledge-galaxy
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries:
    - 研究与学术
    - 知识管理
    industries_en:
    - Research and Academia
    - Knowledge Management
    jobs:
    - 研究人员或学生在与 AI 对话、读论文后，把散落的要点整理成可检索、可关联的个人知识库
    jobs_en:
    - Researchers or students organizing scattered takeaways from AI conversations and papers into a searchable,
      linked personal knowledge base
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 它作为 DeepSeek Harness 的插件，在用户与 AI 对话、读论文或做研究方案时，把聊到的知识点随手收录进一个可筛选、可连线、可在星图里漫游的知识看板。用户最终拿到一张可视化的知识地图；具体收录与连线的自动化程度、人工确认环节仍待核验。
    inspiration: 趋势：AI 对话正在成为研究者的主要输入源，但对话内容本身不留存、难复用，把“对话产物沉淀成结构化知识”是一个正在出现的环节。切入：从研究生、独立研究者这类高频读论文、做方案的人群进入，卖点不是聊天，而是把零散对话变成可回溯的知识资产；可考虑按个人订阅或团队知识库收费，价格未披露。
    summary_en: As a DeepSeek Harness plugin, it lets users capture knowledge points from AI conversations,
      papers and research plans into a filterable, linkable knowledge board they can roam as a star map.
      The user ends up with a visualized knowledge map; how much capture and linking is automated, and
      where human confirmation is needed, still needs verification.
    inspiration_en: 'Trend: AI conversations are becoming a primary input for researchers, yet the content
      is not retained or reused, so turning conversation output into structured knowledge is an emerging
      step. Entry: start with graduate students and independent researchers who read papers and draft
      plans frequently; the pitch is not chatting but turning scattered dialogue into a traceable knowledge
      asset, potentially sold as a personal subscription or team knowledge base, with pricing undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 研究人员或学生在与 AI 对话、读论文、写研究方案后，需要把散落各处的要点整理成可检索、可关联的个人知识库。
        job_en: After AI conversations, paper reading and drafting research plans, researchers or students
          need to organize scattered takeaways into a searchable, linked personal knowledge base.
        pain_zh: 对话和阅读产生的知识散落在聊天记录、笔记和浏览器标签里，事后难以找回和串联，重复劳动多。
        pain_en: Knowledge from conversations and reading is scattered across chat logs, notes and browser
          tabs, hard to retrieve and connect later, causing repeated work.
        current_alternative_zh: 手动复制到 Notion、Obsidian 等笔记工具，或干脆不整理，靠记忆和搜索历史找回。
        current_alternative_en: Manually copying into note tools like Notion or Obsidian, or not organizing
          at all and relying on memory and search history.
        usage_reason_zh: 推断：相较手动复制粘贴到笔记软件，它在对话发生的当下就把知识点收录并支持连线成图，省去事后整理这一步；常读论文、做方案的研究者可能因此在同一工具内完成沉淀。是否真正减少负担取决于收录与连线的自动化程度，尚缺用户反馈佐证。
        usage_reason_en: 'Inference: compared with manually copying into note apps, it captures knowledge
          points at the moment of conversation and supports linking them into a map, saving the later
          organizing step; researchers who read papers and draft plans often may consolidate within one
          tool. Whether it truly reduces burden depends on automation of capture and linking, and user
          feedback is still lacking.'
      gates:
      - gate: value
        status: supported
        reason: 它解决对话与阅读产生的知识散落、难复用的问题，痛点在研究场景中真实存在，交付为可视化知识看板。
        evidence_ids:
        - ev-f847dbd30596bea1
        - ev-b7aaaf030e6f56d1
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数缓慢增长，缺少用户评价或使用场景描述，无法判断是否形成稳定使用共识。
        evidence_ids:
        - ev-b7aaaf030e6f56d1
      - gate: model
        status: insufficient
        reason: 开源免费，未见定价或付费路径，买方与收费方式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-f847dbd30596bea1
      - gate: truth
        status: insufficient
        reason: 依赖 DeepSeek Harness 生态，收录与连线是否可靠、是否需大量人工整理尚无材料，交付确定性待核验。
        evidence_ids:
        - ev-475f1fc5dbeeae44
      next_validation: 收集该仓库的 issue、discussion 或 README 中的使用示例，确认知识收录与连线是否需要大量人工整理。
