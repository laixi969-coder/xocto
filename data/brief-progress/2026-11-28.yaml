      the call to action from "Try Instinct" to "Text Instinct" and adding a blog link; the product still
      uses text or phone calls as its entry point and claims it can operate a phone and computer to order
      ingredients, book train tickets, buy groceries, send flowers and find a court. No pricing, customer
      cases or usage-scale data appeared in this event.
