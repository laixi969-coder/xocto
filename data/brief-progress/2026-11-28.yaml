          moment; built-in grid lines are fixed rule-of-thirds and cannot adapt to the actual scene.
        current_alternative_zh: 手机自带三分法网格线，或拍后翻教程对照修改，或完全凭经验试。
        current_alternative_en: Built-in phone grid lines (rule of thirds), post-shot tutorial comparison,
          or pure trial-and-error.
        usage_reason_zh: 推断：slay 在取景时由 AI 根据实际场景内容动态给出构图建议，比固定三分线更贴合具体画面，因此拍照入门者在不自信时会打开它。具体 AI 判断机制与持续使用证据尚未核验。
