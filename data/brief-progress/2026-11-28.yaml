        pain_zh: 长时间编码时缺少轻量的状态提示与情绪陪伴，直播画面也缺少可展示的互动元素；但不用它也能正常编码，痛点刚性不足。
        pain_en: Long coding sessions lack lightweight status cues and emotional companionship, and streams
