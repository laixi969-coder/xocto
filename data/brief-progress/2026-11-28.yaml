    summary_zh: 安全工程师或逆向分析人员在审计被 BLA（Blind LLM Agents）加固遮蔽的代码时打开它：它以静态 CLI 和 MCP 服务接收目标代码，还原被遮蔽的真实代码供编码代理读取，本身不执行目标程序；用户拿到可读代码后仍需自行判断漏洞。具体还原范围与准确度仍待核验。
    inspiration: 趋势：编码代理开始被当作代码审计的执行者，但加固与反加固的攻防随之出现，代理“看不见代码”成了新瓶颈。切入：从安全审计、逆向工程团队切入，卖可核验的还原报告而非工具本身；但这类能力天然贴近攻防边界，合规与滥用风险是首要门槛。
    summary_en: 'Security engineers or reverse engineers open it when auditing code obfuscated by BLA
      (Blind LLM Agents) hardening: a static CLI and MCP server take the target code and restore the hidden
      source for coding agents to read, without executing the target. Users get readable code but must
      still judge vulnerabilities themselves. The restoration scope and accuracy remain to be verified.'
    inspiration_en: 'Trend: coding agents are being used as code-audit executors, and hardening versus
      de-hardening has emerged, making ''the agent cannot see the code'' a new bottleneck. Entry: target
      security-audit and reverse-engineering teams and sell verifiable restoration reports rather than
      the tool; but this capability sits close to offensive boundaries, so compliance and abuse risk is
      the first gate.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师在代码审计或逆向分析时，需要让编码代理读取被 BLA 加固遮蔽的真实代码，以完成漏洞定位。
        job_en: Security engineers auditing or reverse-engineering code need coding agents to read real
          code hidden by BLA hardening in order to locate vulnerabilities.
        pain_zh: 加固遮蔽让编码代理读不到真实代码，审计流程被迫退回人工逐段还原，拖慢漏洞定位。
        pain_en: Hardening hides the real code from coding agents, forcing audits back to manual line-by-line
          restoration and slowing vulnerability location.
        current_alternative_zh: 人工阅读混淆代码、手写脚本还原，或干脆放弃让代理参与审计。
        current_alternative_en: Manually reading obfuscated code, writing ad-hoc restoration scripts,
          or dropping agents from the audit entirely.
        usage_reason_zh: 推断：相较人工逐段还原，它以静态方式一次性还原被遮蔽代码并直接供代理读取，省去手工还原这一步，因此安全审计人员在代理读不到代码时会选择它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: versus manual line-by-line restoration, it statically restores hidden
          code in one pass for agents to read, removing the manual restoration step, so security auditors
          would pick it when agents cannot read code; no user feedback or retention evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理在加固代码上读不到真实源码、审计被迫人工还原的问题，痛点具体且不解决会拖慢漏洞定位。
        evidence_ids:
        - ev-783c6d68ea1de917
        - ev-0a4b7700e854b64f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，属关注度而非采用证据，缺少用户反馈或案例说明谁在什么场景使用。
        evidence_ids:
        - ev-0a4b7700e854b64f
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是安全团队或企业采购，但公开材料未披露，属判断非事实。
        evidence_ids:
        - ev-783c6d68ea1de917
      - gate: truth
        status: challenged
        reason: 还原准确度与合规边界未披露，贴近攻防用途可能带来滥用与法律风险，承诺能否确定性交付存疑。
        evidence_ids:
        - ev-783c6d68ea1de917
      next_validation: 收集仓库 issue/discussion 中关于还原准确度与使用场景的公开讨论，以核验实际交付效果与合规边界。
