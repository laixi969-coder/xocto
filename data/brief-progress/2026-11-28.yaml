        - ev-66c4a6bc1d1a52a3
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或商业主体，钱可能来自企业自建或服务商交付，属判断而非已验证事实。
        evidence_ids:
        - ev-66c4a6bc1d1a52a3
      - gate: truth
        status: insufficient
        reason: 只读与审计设计贴近合规目标，但缺少实际部署、误查率与人工确认边界的公开材料。
        evidence_ids:
