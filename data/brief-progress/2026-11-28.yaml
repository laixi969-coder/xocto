    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在同时使用多个编码代理时，把同一任务分派给不同代理并汇总异步结果
    jobs_en:
    - Developers dispatching one task across multiple coding agents and collecting asynchronous results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在同时使用 Codex、Claude Code 等多个编码代理时，通过 cospan 的统一异步委派协议把任务分发给不同代理并回收结果。它替代的是逐个代理手动切换、复制上下文和比对输出的做法；具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势是多编码代理并存，团队开始面对“选哪个代理、结果怎么合并”的新协调成本。切入可从已有代理重度使用的工程团队入手，做任务分派与结果比对的协调层；仓库目前只有数十星标，尚无付费或采用证据，卖法未披露。
    summary_en: When developers run several coding agents such as Codex and Claude Code at once, cospan
      uses one asynchronous delegation protocol to dispatch tasks to different agents and collect their
      results. It replaces manually switching between agents, copying context and comparing outputs; the
      exact delivery form and human review step still need verification.
    inspiration_en: The trend is multiple coding agents coexisting, so teams now face a new coordination
      cost of choosing an agent and merging results. The entry point is engineering teams already heavy
      on agents, offering a dispatch and result-comparison layer; the repo has only dozens of stars with
      no payment or adoption evidence, and pricing is undisclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同一项目里同时调用多个编码代理处理任务时，需要把任务分派出去并汇总各自的异步结果。
        job_en: Developers running several coding agents on one project need to dispatch tasks and collect
          each agent's asynchronous results.
        pain_zh: 逐个代理手动切换、重复粘贴上下文、再人工比对输出，步骤繁琐且容易漏掉某个代理的结果。
        pain_en: Switching agents by hand, re-pasting context and manually comparing outputs is tedious
          and easy to leave one agent's result unchecked.
        current_alternative_zh: 开发者目前靠手动在多个代理界面间切换、复制粘贴上下文并自行整理输出。
        current_alternative_en: Developers currently switch between agent interfaces by hand, copy-paste
          context and organize outputs themselves.
        usage_reason_zh: 推断：cospan 用统一异步委派协议把任务一次分发给多个代理并回收结果，省去逐个切换和重复粘贴这一步，因此同时使用多个编码代理的开发者会在多代理协作时选择它；尚无留存或付费证据。
        usage_reason_en: 'Inference: cospan uses one async delegation protocol to send a task to several
          agents and collect results, removing the per-agent switching and re-pasting step, so developers
          running multiple coding agents would pick it for multi-agent work; no retention or payment evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并存下的任务分派与结果汇总痛点，旧做法是手动切换和粘贴，结构上成立，属工作流推理。
        evidence_ids:
        - ev-b28f67458459c2ea
        - ev-571d7ee873601619
      - gate: consensus
        status: insufficient
        reason: 仅见仓库星标从 51 缓增至 78，属关注度信号，未见用户评价或团队采用案例。
        evidence_ids:
        - ev-b28f67458459c2ea
        - ev-571d7ee873601619
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或商业主体，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-571d7ee873601619
      - gate: truth
        status: insufficient
        reason: 统一委派协议能否稳定交付、多代理结果如何合并与人工确认，公开材料未说明。
        evidence_ids:
        - ev-b28f67458459c2ea
      next_validation: 收集 cospan 仓库的 README 与 issue/discussion，核验多代理委派的实际交付流程、人工确认环节与是否有团队采用案例。
