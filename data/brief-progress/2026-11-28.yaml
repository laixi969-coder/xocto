      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 习惯用 iPhone 拍照但构图不自信的摄影入门者，在取景时不确定主体摆放、留白比例或对称方式，需要实时知道「此刻这样拍好不好」。
