        job_zh: 安全研究员在进行安卓应用逆向与风控对抗时，需要模拟执行 ARM64 .so 二进制文件以分析其内部函数调用行为与解密算法。
        job_en: Security researchers reverse engineering Android apps to analyze internal function calls
