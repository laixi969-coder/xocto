    summary_zh: 安全研究员或逆向工程师在分析 macOS、Windows、Linux 二进制、Android 应用或 GPU 内核时打开它，由 ACP 代理读取文件、重命名符号并打补丁，最终拿到被修改的二进制或内核产物；补丁是否需人工复核、具体交付流程仍待核验。
    inspiration: 趋势：逆向工程这类高门槛、强经验依赖的工作开始被代理拆成“读—改名—打补丁”的可执行步骤。切入：从移动应用安全审计或 GPU 内核调试这类小圈子切入，按项目或按分析报告收费，而不是卖通用席位；开源版已积累关注，但商业化路径与买方尚未披露。
    summary_en: Security researchers or reverse engineers open it when analyzing macOS, Windows, Linux
      binaries, Android apps or GPU kernels; an ACP agent reads the files, renames symbols and applies
      patches, and the user ends up with modified binaries or kernel artifacts. Whether patches need human
      review and the exact delivery flow remain to be verified.
    inspiration_en: 'Trend: reverse engineering, a high-barrier, experience-heavy job, is being broken
      into executable steps of read, rename and patch by agents. Entry: start from mobile app security
      auditing or GPU kernel debugging, charging per project or per analysis report rather than per seat;
      the open-source project has gathered attention, but its commercialization path and buyers are not
      disclosed.'
