        status: insufficient
        reason: 仅见仓库星数从 54 到 56 的小幅变化，无用户评价或社区讨论说明真实采用。
        evidence_ids:
        - ev-db090062e5d01045
        - ev-5ad1cdb535208871
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或企业采购路径，买方与收费方式不明。
        evidence_ids:
        - ev-8253a0c479974e5b
      - gate: truth
        status: insufficient
        reason: 统一入口能否稳定适配多个快速变化的 CLI 尚不可核验，交付确定性存疑。
        evidence_ids:
        - ev-db090062e5d01045
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有开发者报告日常使用、适配问题或提出付费/赞助意愿。
