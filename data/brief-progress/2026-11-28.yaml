        usage_reason_en: (Inferred) Versus pure cloud APIs, the P7 pins inference to local hardware, converting
          per-usage billing to a one-time purchase. For enterprises above a monthly token threshold with
          data-sovereignty constraints, marginal per-token cost approaches zero, so compliance-sensitive
          SMEs adopt local solutions as usage scales. No customer cases or retention data; long-term workflow
          adoption unconfirmed.
      gates:
      - gate: value
        status: supported
        reason: Token成本痛点真实且结构性：用量越大支出越高，数据合规叠加使纯云方案存在刚性需求缺口；本地推理是明确解法。买方为IT采购或CIO线，付费路径为硬件一次性采购。
        evidence_ids:
