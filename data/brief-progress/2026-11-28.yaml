    project_type: open_source
    industries:
    - 小微企业服务
    - 本地生活服务
    - 数字营销
    industries_en:
    - small business services
    - local services
    - digital marketing
    jobs:
    - 自由职业建站者或小型代理机构在开发本地商家客户时，从地图检索无网站的小店，用 garimpo 生成带店名的预览站并通过 WhatsApp 报价收款，完成从线索到成交的初步转化
    jobs_en:
    - Freelance web builders or small agencies prospecting local merchants search maps for shops without
      websites, use garimpo to generate a named preview site and quote and collect payment via WhatsApp,
      completing the lead-to-sale step
    regions:
