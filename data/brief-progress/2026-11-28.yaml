    - personal data privacy
    - consumer rights
    jobs:
    - 个人在发现自己的信息被数据经纪商收录时，用脚本整理并提交删除请求，以完成个人信息清除
    jobs_en:
    - An individual who finds their data listed by data brokers uses the script to organize and file removal
      requests to clear personal information
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人在发现自己的信息被数据经纪商收录时，打开这个开源脚本，由它整理并提交删除请求，最终拿到已发出的清除申请记录；具体覆盖哪些经纪商、是否需人工逐条确认，资料未说明，仍待核验。
    inspiration: 趋势：数据经纪商批量收录个人信息，个人清除请求正从手工逐站填表变成可脚本化的重复劳动。切入：从隐私维权、身份盗用善后这类高焦虑人群进入，按清除结果或订阅收费，而非卖脚本本身。
    summary_en: When a person finds their information listed by data brokers, they run this open-source
      script, which organizes and files removal requests, leaving them with a record of submitted deletion
      requests; which brokers are covered and whether manual confirmation is needed is not stated and
      remains to be verified.
    inspiration_en: 'Trend: data brokers bulk-list personal information, so individual removal requests
      are shifting from manual form-filling site by site into scriptable repetitive work. Entry: start
      with high-anxiety users such as privacy advocates or identity-theft recovery, charging for removal
      outcomes or subscription rather than the script itself.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人发现自己的姓名、电话或地址被数据经纪商公开收录时，用脚本整理并提交删除请求，完成个人信息清除。
        job_en: When a person finds their name, phone or address publicly listed by data brokers, they
          use the script to organize and file removal requests to clear personal information.
        pain_zh: 数据经纪商数量多、每家流程不同，手工逐站查找和填表耗时且容易漏掉，不处理的后果是个人信息长期被公开检索。
        pain_en: There are many data brokers with different processes; manually finding and filling forms
          site by site is slow and error-prone, and the consequence of inaction is personal information
          remaining publicly searchable.
        current_alternative_zh: 手工逐家访问经纪商网站、填写删除表单，或付费使用商业隐私清除服务。
        current_alternative_en: Manually visiting each broker site and filling removal forms, or paying
          for commercial privacy-removal services.
        usage_reason_zh: 推断：脚本把逐站查找和填表合并为一次批量提交，减少重复操作这一步负担，因此在意隐私、又不愿付费订阅清除服务的个人会在发现信息被收录时选择它。
        usage_reason_en: 'Inference: the script merges site-by-site lookup and form-filling into one batch
          submission, reducing the repetitive step, so privacy-conscious individuals unwilling to pay
          for removal subscriptions would choose it upon finding their data listed.'
      gates:
      - gate: value
        status: supported
        reason: 它解决个人信息被数据经纪商公开收录后逐站提交删除请求的重复劳动，痛点具体且不处理有长期暴露后果。
        evidence_ids:
        - ev-c8cc9b98e93ba41e
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度较高，但未见用户反馈说明脚本实际清除了哪些经纪商、成功率如何。
        evidence_ids:
        - ev-c8cc9b98e93ba41e
        - ev-67eb2698c9fd20e0
      - gate: model
        status: insufficient
        reason: 开源脚本本身无定价，付费路径可能来自托管清除服务或订阅，公开材料未披露。
        evidence_ids:
        - ev-67eb2698c9fd20e0
      - gate: truth
        status: insufficient
        reason: 覆盖的经纪商范围、请求是否被受理、人工确认环节均未说明，交付确定性待核验。
        evidence_ids:
        - ev-c8cc9b98e93ba41e
      next_validation: 收集该仓库 README 与 issue 中关于覆盖经纪商清单、删除请求受理结果和人工确认步骤的公开说明。
