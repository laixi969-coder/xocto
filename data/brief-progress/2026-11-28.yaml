  chinas-insurance-market-for-people-with-pre-existing-conditi:
    slug: chinas-insurance-market-for-people-with-pre-existing-conditi
    name: China's insurance market for people with pre-existing conditions
    decision: market_context
    summary_zh: 2026年11月28日报道，中国带病体保险市场今年规模超过220亿元，但近半数受访者表示不知道该买哪款产品。这一信息不对称意味着保险选购与核保环节存在AI辅助匹配与咨询的应用空间，但市场规模数据本身不构成独立产品（推断）。
    summary_en: A 28 November 2026 report said China's insurance market for people with pre-existing conditions
      exceeded 22 billion yuan this year, yet nearly half of respondents said they did not know which
      policy to buy. This information asymmetry suggests room for AI-assisted matching and advisory in
      insurance selection and underwriting, though the market-size figure alone does not constitute a
      standalone product (inference).
    event_summary_zh: 2026年11月28日报道，中国带病体保险市场今年规模超过220亿元，近半数受访者表示不知道该买哪款产品。
    event_summary_en: A 28 November 2026 report said China's insurance market for people with pre-existing
      conditions exceeded 22 billion yuan this year, with nearly half of respondents saying they did not
      know which policy to buy.
