      a playable demo called Fog-Locked Mountain Gate. Users get a directly testable prototype page; the
      generation flow, asset sourcing and manual-edit boundary still need verification.
    inspiration_en: 'Trend: coding agents are turning game making from engine engineering into a describe-generate-play
      loop, cutting prototype cost to one conversation. Entry: target indie studios and gamified-marketing
      teams at the gameplay-validation and ad-prototype step, charging per playable prototype rather than
      per seat; engine-grade production pipelines remain out of scope.'
    req_initial:
