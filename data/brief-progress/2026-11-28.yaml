        usage_reason_zh: 推断：若它能把素材直接转成带字幕的粗剪，创作者就省掉逐段剪切与对齐字幕这一步，因此会在素材多、交付急的情况下试用；公开材料未给出用户反馈，无法确认是否被长期留在工作流。
