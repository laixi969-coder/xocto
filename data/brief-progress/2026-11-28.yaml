    summary_zh: 个人用户在独处或想与固定角色持续聊天时打开这个开源原型，它用本地记忆保存过往对话、可选语音回应，让角色延续此前内容继续对话。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：角色陪伴类 AI 正从通用聊天转向带长期记忆和语音的固定人格，开源原型让个人开发者也能低成本试。切入：可从二次元/游戏同人角色社群或情感陪伴场景进入，卖点是把角色记忆与语音做成可订阅的持续陪伴，而非一次性对话；价格未披露，不臆测。
    summary_en: An individual opens this open-source prototype during solitary time or for ongoing chat
      with a fixed persona; it stores past dialogue in local memory and optionally replies by voice so
      the character continues from earlier content. The exact delivery form and human confirmation step
      still need verification.
    inspiration_en: 'Trend: character-companion AI is moving from generic chat toward fixed personas with
      long-term memory and voice, and open-source prototypes let individual developers try this cheaply.
      Entry: start from fan-fiction or game-character communities or emotional-companionship scenarios,
      selling persistent memory-plus-voice companionship as a subscription rather than one-off chat; pricing
      is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在独处或想与某个固定角色持续互动时，打开带本地记忆和可选语音的 AI 角色，延续此前对话并获得回应。
        job_en: An individual opens a character-based AI companion with local memory and optional voice
          during solitary time or for ongoing interaction with a fixed persona, continuing prior dialogue
          and getting a reply.
        pain_zh: 通用聊天助手每次对话容易丢失角色设定和过往内容，用户要反复重述背景，陪伴感被打断。
        pain_en: Generic chat assistants tend to lose persona settings and past content between sessions,
          forcing users to restate context and breaking the sense of companionship.
        current_alternative_zh: 用户目前用通用聊天助手手动粘贴角色设定，或在角色扮演社区里靠人工维持人设，记忆和语音需自己拼接。
        current_alternative_en: Users currently paste persona settings into generic chat assistants by
          hand, or rely on human effort in role-play communities to keep a persona, stitching memory and
          voice themselves.
        usage_reason_zh: 推断：相较手动重述设定的旧做法，它把角色设定与过往对话存入本地记忆并在下次对话中自动带入，减少每次重建人设这一步，因此在意连续陪伴感的个人用户会在长期角色对话时选择它。
        usage_reason_en: 'Inference: versus manually restating settings, it stores persona and past dialogue
          in local memory and carries them into the next session, removing the step of rebuilding the
          persona each time, so users who value continuity would pick it for long-running character chats.'
      gates:
      - gate: value
        status: supported
        reason: 它解决固定角色对话中记忆丢失、需反复重述设定的痛点，本地记忆加语音让连续陪伴可交付；属工作流推理。
        evidence_ids:
        - ev-b7b213d5ecd2c17e
        - ev-3f54b826d37d877a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 45 增至 133 的关注度信号，无用户评价或社区讨论说明真实使用场景。
        evidence_ids:
        - ev-b7b213d5ecd2c17e
        - ev-3f54b826d37d877a
      - gate: model
        status: insufficient
        reason: 开源原型未披露定价或付费路径，买方可能是个人订阅或开发者二次开发，属判断非已验证事实。
        evidence_ids:
        - ev-3f54b826d37d877a
      - gate: truth
        status: insufficient
        reason: 本地记忆与语音能否稳定交付、角色一致性是否可靠，公开材料未给出可复现结果。
        evidence_ids:
        - ev-b7b213d5ecd2c17e
      next_validation: 收集该仓库的 issue、discussion 或 README 中的使用说明与用户反馈，核验本地记忆与语音的实际交付效果。
