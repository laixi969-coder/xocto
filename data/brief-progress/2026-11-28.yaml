  granola:
    slug: granola
    name: Granola
    decision: queued
    event_summary_zh: 2026年10月29日，Granola 在会议记录产品中加入听写功能，此前 Wispr 已在听写应用中增加会议记录；Granola 同时入选 Madrona 2026
      年 Intelligent Applications 40 中期榜单。
    event_summary_en: On October 29, 2026, Granola added a dictation feature to its meeting-notetaker
      product after Wispr added meeting notes to its dictation app; Granola was also named to Madrona's
      2026 Intelligent Applications 40 in the mid-stage category.
    category: AI + 效率
    project_type: new_application
    industries:
    - 企业软件
    - 专业服务
    industries_en:
    - Enterprise Software
    - Professional Services
    jobs:
    - 会议参与者在不中断对话的情况下记录要点，会后整理成可检索的会议记录与知识条目
    jobs_en:
    - Meeting participants capture key points without interrupting the conversation and turn them into
      searchable meeting notes and knowledge entries afterward
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 会议参与者开会时打开 Granola，它接收现场对话音频并生成会议记录；2026年10月起它也能接收口述内容转成文字。用户拿到的是可编辑的会议笔记，并据公开报道正被定位为可沉淀为企业知识库的材料，具体归档与检索流程仍待核验。
    inspiration: 趋势：会议记录工具正从个人效率插件转向企业知识沉淀层，语音输入成为争夺入口。切入：可从垂直行业（如律所、咨询、销售团队）的会后知识归档环节进入，按团队知识库交付收费，而非只卖个人席位；与通用会议记录正面拼功能已难有差异。
    summary_en: Meeting participants open Granola during a call; it takes in live conversation audio and
      produces meeting notes, and since October 2026 it can also turn dictated speech into text. Users
      get editable meeting notes that public reporting says are being repositioned as material for an
      enterprise knowledge base; the archiving and retrieval workflow still needs verification.
    inspiration_en: 'Trend: meeting-note tools are shifting from personal productivity add-ons toward
      an enterprise knowledge layer, with voice input as the contested entry point. Entry: start from
      the post-meeting knowledge archiving step in a vertical such as law firms, consultancies or sales
      teams, and charge for team knowledge delivery rather than individual seats; competing head-on on
      generic note-taking features is already hard to differentiate.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 会议参与者在不打断对话的情况下记录要点，会后把零散讨论整理成可检索、可复用的会议记录与知识条目。
        job_en: Meeting participants capture key points without interrupting the conversation and turn
          scattered discussion into searchable, reusable meeting notes and knowledge entries afterward.
        pain_zh: 手写笔记会漏掉内容，会后凭记忆补记耗时且失真；录音回听成本高，团队层面的会议知识难以沉淀和检索。
        pain_en: Handwritten notes miss content, and reconstructing them from memory afterward is slow
          and lossy; replaying recordings is costly, and meeting knowledge is hard to accumulate and search
          at team level.
        current_alternative_zh: 人工手记加会后整理、录音回听，或使用其他会议转写工具；企业侧常靠人工把纪要贴进文档或知识库。
        current_alternative_en: Manual note-taking plus post-meeting cleanup, replaying recordings, or
          other meeting transcription tools; on the enterprise side, people often paste summaries into
          documents or knowledge bases by hand.
        usage_reason_zh: 推断：相较手记加回听，Granola 在会议进行中直接接收对话音频并产出可编辑笔记，省去会后逐段回听和从零起草这一步；新增听写则让同一入口覆盖口述输入。哪类用户会长期留下，公开材料尚无留存或复购证据。
        usage_reason_en: 'Inference: compared with manual notes plus replay, Granola takes in conversation
          audio during the meeting and produces editable notes, removing the step of replaying segments
          and drafting from scratch afterward; the new dictation extends the same entry point to spoken
          input. Public materials do not yet show retention or repeat-use evidence for which users stay.'
      gates:
      - gate: value
        status: supported
        reason: 它解决会议中记录不全、会后整理费时的问题，痛点刚性且交付物（会议笔记）明确；买方是个人还是企业团队尚不清楚。
        evidence_ids:
        - ev-6604734c13a60cb5
      - gate: consensus
        status: insufficient
        reason: 仅有入选榜单与功能发布报道，缺少用户评价或团队采用案例，无法判断共识卡在感知还是场景。
        evidence_ids:
        - ev-6604734c13a60cb5
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与付费方式，钱可能来自个人订阅或企业采购，这是判断而非已验证事实。
        evidence_ids:
        - ev-6604734c13a60cb5
      - gate: truth
        status: insufficient
        reason: 会议笔记贴近第一性目标，但企业知识层的承诺能否确定性交付、人工校对边界如何，公开材料未说明。
        evidence_ids:
        - ev-6604734c13a60cb5
      next_validation: 收集 Granola 官方定价页或企业版部署说明，确认按席位还是按团队知识库计价及交付边界。
