          a local app to talk with a virtual character and expects memory to stay on the device.
        pain_zh: 云端陪伴类产品需要上传私密对话，用户担心内容被存储、审查或泄露；同时云端服务可能改规则、涨价或停服。
        pain_en: Cloud companionship products require uploading intimate conversations, raising fears
          of storage, moderation or leakage, and cloud services may change rules, raise prices or shut
          down.
        current_alternative_zh: 使用云端AI聊天应用或角色扮演社区，接受数据上传；或完全不用，靠通用聊天工具临时对话且无长期记忆。
        current_alternative_en: Using cloud AI chat apps or role-play communities and accepting uploads,
          or not using them at all and relying on general chat tools with no persistent memory.
        usage_reason_zh: 推断：相较云端聊天应用，它把模型与记忆放在本机，用户不必把私密对话交给第三方服务器，因此对隐私敏感、愿意自行安装软件的用户会在需要长期角色对话时选择它；该动机尚无用户反馈支持。
        usage_reason_en: 'Inference: unlike cloud chat apps, it keeps the model and memory on the local
          machine so users need not hand intimate conversations to a third-party server; privacy-sensitive
          users willing to install software would choose it for long-running character chats. This motive
          is not yet supported by user feedback.'
      gates:
