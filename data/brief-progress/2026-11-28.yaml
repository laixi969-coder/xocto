    - meeting facilitators
    regions:
    - 全球
    regions_en:
    - global
    open_source: true
    summary_zh: 面向律师、咨询师、医疗从业者等处理敏感对话的职场人，yogurt 在本机完成会议录音的 AI 转录与摘要，不向云端上传音频，也不以机器人身份加入会议；用户直接获得本地保存的结构化笔记，无需订阅
      Granola、Otter 或 Fireflies。
    inspiration: 趋势：合规压力正把会议记录从云端推向本地处理，企业采购开始要求音频不出内网。切入：从法律、医疗、心理咨询等强合规行业进入，做本地部署 B2B 方案；开源 C 端获客，B
      端按会议室年费收费。
    summary_en: Free open-source local AI meeting notes for Mac/Windows/Linux. Transcribes and summarizes
      recordings on-device—no bot joins the call, no audio leaves the machine. Replaces Granola, Otter,
      or Fireflies subscriptions for privacy-sensitive professionals.
    inspiration_en: 'Trend: compliance pressure is shifting meeting notes to on-device processing; enterprises
      now require audio to stay in-network. Entry: target legal, medical, and counseling firms with local
      B2B deployment; open-source app drives acquisition, B2B tier charges per-room fees.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 律师、心理咨询师、医疗从业者等需要记录敏感对话的专业人士，在每次 30–90 分钟的客户或团队会议后，需要把录音转成可检索的文本笔记和要点摘要，同时确保对话内容不离开本机。
        job_en: Legal practitioners, therapists, and clinicians who record 30–90-minute client or team
          sessions and need transcript notes and action-item summaries while keeping audio on the local
          machine.
        pain_zh: 现有云端工具（Granola、Otter、Fireflies）要求把原始音频上传到第三方服务器，且通常以机器人身份加入会议，触发客户隐私顾虑和合规限制；手动整理录音则耗时且容易遗漏关键信息。
        pain_en: Cloud-based tools require uploading raw audio to third-party servers and typically join
          the call as a bot, triggering client-privacy and compliance concerns; manual transcription is
          time-consuming and error-prone.
        current_alternative_zh: 手动听录音整理笔记，或使用云端转录工具但接受音频上传和机器人参会；部分机构用内网部署的 Whisper 但缺乏自动摘要和结构化笔记。
        current_alternative_en: Manually listening to and transcribing recordings, or using cloud tools
          while accepting audio upload and bot participation; some organizations run local Whisper but
          lack auto-summarization and structured notes.
        usage_reason_zh: 推断：相较云端工具，yogurt 把转录和摘要全部放在本机执行，消除了音频上传到第三方这一合规阻断步骤，因此强合规行业的会议负责人在无法使用云端 SaaS
          时会选择它；免费开源降低试错成本，但尚无留存或重复使用的公开证据。
        usage_reason_en: (Inferred) Compared to cloud tools, yogurt runs transcription and summarization
          entirely on-device, removing the compliance-blocking step of uploading audio to a third party;
          meeting leads in compliance-heavy firms would pick it when SaaS is prohibited. Free open-source
          lowers trial cost, but no public retention or repeat-use evidence yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决的需求是：敏感行业（律所、诊所）在无法使用云端 SaaS 时需要把会议录音变成结构化笔记。痛点刚性——合规制度直接禁止音频外传，旧做法（手动整理或内网 Whisper）缺摘要和笔记结构。产品具体动作：本机转录+摘要、无机器人入会，直接消除合规阻断步骤。买方可能是合规驱动的机构采购，但公开材料未确认。
        evidence_ids:
        - ev-a1fff3993388db9e
      - gate: consensus
        status: insufficient
        reason: 三周增长约 780 颗星（~260/周）显示持续社区兴趣，但星标属于关注度指标，不等同于持续使用或付费采用；未见客户案例、企业部署反馈或留存数据。
        evidence_ids:
        - ev-f9dc0d6d4973140a
        - ev-a1fff3993388db9e
      - gate: model
        status: insufficient
        reason: 公开材料无定价页、无 B2B 层级、无企业部署文档。推断：最自然的收费路径是按会议室或按席位收年费的企业内网版，C 端免费开源做获客；这是判断，不是已验证事实。
        evidence_ids:
        - ev-a1fff3993388db9e
      - gate: truth
        status: supported
        reason: 核心承诺（音频留在本机、无机器人入会）与会议记录的第一性目标（捕获内容而不泄露隐私）一致，且跨平台本地处理在技术上可确定性交付；94 个 open issues 表明活跃开发与使用。
        evidence_ids:
        - ev-a1fff3993388db9e
      next_validation: 官方仓库或 issue 区是否出现企业内网部署文档（Docker / Air-gapped 安装指南）、B2B 付费层级公告，或合规行业用户的部署反馈帖。
