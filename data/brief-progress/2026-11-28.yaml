    - 个人用户在需要送花给朋友或找周末球场时，用短信描述需求，由助手代为查找并下单，用户拿到可核对的预订或购买结果
    jobs_en:
    - An individual who suddenly needs ingredients, a weekend train ticket or daily goods hands the request
      to the assistant by text or phone call, and it operates a phone and computer to place the order,
      leaving the user with an executed order or booking that still needs payment and detail confirmation
    - An individual who wants to send flowers to a friend or find a weekend court describes the need by
      text, the assistant searches and orders on their behalf, and the user gets a checkable booking or
      purchase result
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 个人在临时要订食材、订周末火车票、买日用品、送花或找球场时，用短信或电话把需求告诉 Instinct，它代替用户操作手机和电脑上的应用完成下单或预订，用户拿到已执行的订单或预订结果，支付与细节仍需本人确认；具体执行流程、失败处理和交付边界仍待核验。
    inspiration: 趋势是个人助理从“回答问题”走向“替人操作现有应用”，把订票、买菜这类跨应用琐事收进一个短信入口。切入可考虑从某一类高频、结果可核对的本地事务（如周末出行或生鲜补货）做起，按成功完成的订单收费，而不是卖通用助手席位；但必须先解决支付授权与失败回滚，否则用户不敢把真实下单交给它。
    summary_en: When an individual suddenly needs ingredients, a weekend train ticket, daily goods, flowers
      or a court, they tell Instinct by text or phone call; it operates apps on a phone and computer to
      place the order or booking, and the user gets an executed result while payment and details still
      need personal confirmation. The exact execution flow, failure handling and delivery boundary remain
      to be verified.
    inspiration_en: The trend is personal assistants moving from answering questions to operating existing
      apps, folding cross-app chores like ticketing and grocery runs into one text entry point. A wedge
      could start with one high-frequency local task whose result is checkable, such as weekend travel
      or grocery restocking, and charge per successfully completed order rather than per assistant seat;
      payment authorization and failure rollback must be solved first, or users will not hand over real
      purchases.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在临时需要订食材、订周末火车票、买日用品、送花或找球场时，用短信或电话把需求交给助手，由它操作手机和电脑上的应用完成下单或预订，用户拿到可核对的结果。
        job_en: An individual who suddenly needs ingredients, a weekend train ticket, daily goods, flowers
          or a court hands the request to the assistant by text or phone call; it operates apps on a phone
          and computer to place the order or booking, and the user gets a checkable result.
        pain_zh: 这些琐事分散在多个应用里，用户要自己切换、比价、填地址和支付，临时起意时尤其费时；不做的代价是要么放弃，要么花十几分钟手动完成。
        pain_en: These chores are scattered across several apps, so users must switch, compare, fill addresses
          and pay themselves, which is especially costly on short notice; the cost of not doing it is
          either giving up or spending ten-plus minutes manually.
        current_alternative_zh: 用户自己在各应用里搜索下单，或让家人朋友代办；现有通用助手多停留在给建议和链接，不代替操作。
        current_alternative_en: Users search and order themselves in each app, or ask family and friends;
          existing general assistants mostly stop at advice and links rather than operating on the user's
          behalf.
        usage_reason_zh: 推断：相较自己在多个应用间切换下单，Instinct 通过短信或电话接收一句需求并直接操作手机和电脑上的应用完成下单，省掉用户逐个打开应用、搜索和填单的步骤，因此临时起意、不想手动操作的用户会在琐事场景选择它；但支付授权与失败处理是否可靠尚无公开证据。
        usage_reason_en: 'Inference: compared with switching among apps and ordering manually, Instinct
          takes one request by text or phone call and directly operates apps on a phone and computer to
          complete the order, removing the steps of opening each app, searching and filling forms, so
          users acting on short notice who do not want to do it manually would choose it; whether payment
          authorization and failure handling are reliable has no public evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是跨应用琐事下单要用户自己切换、搜索、填单和支付的麻烦，痛点具体且临时起意时更明显；买方是谁尚不清楚。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-770b0fa6cb4c42d6
      - gate: consensus
        status: insufficient
        reason: 官网只给出可执行任务的示例，没有用户评价、客户案例或采用数据，无法判断是否有人持续把真实下单交给它。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-40c38047ef2de745
      - gate: model
        status: insufficient
        reason: 未见定价页或收费方式，钱可能来自个人订阅或按单收费，这是判断而非已验证事实；支付授权与退款责任也未说明。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-fb85b5d60137bdcd
      - gate: truth
        status: insufficient
        reason: 代替用户操作真实账户下单，承诺能否确定性交付、失败如何回滚、人工边界在哪，公开材料均未说明。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-770b0fa6cb4c42d6
      next_validation: 收集 Instinct 官方定价页或帮助文档，确认其收费方式、支付授权与下单失败处理规则。
