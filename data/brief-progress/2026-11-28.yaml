        - ev-350454cb83564b9b
      - gate: consensus
        status: insufficient
        reason: 公开仓库约 45 星、8 个 fork，只能说明有初步关注，没有团队持续使用或评审量数据。
        evidence_ids:
        - ev-590a4d87579e8558
      - gate: model
        status: insufficient
        reason: 开源自托管，付费路径未披露；推断可能来自企业内部部署与支持服务，但这是判断而非已验证事实。
        evidence_ids:
        - ev-510842251ef21f7e
      - gate: truth
        status: insufficient
        reason: 模型评审意见仍需人工确认，交付边界清楚；但缺少误报率、评审耗时或合并结果的可核对数据。
        evidence_ids:
        - ev-350454cb83564b9b
      next_validation: 收集 arnold 仓库的 issue/discussion 与发布说明，确认是否有团队报告实际评审量、误报处理或自托管部署案例。
