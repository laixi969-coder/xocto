    summary_zh: 面向关注医疗进展的读者，在查阅某种疾病是否已有 AI 相关疗法时打开该站点，浏览按疾病归类的追踪清单。资料只显示其定位为“追踪 AI 治愈的疾病”，具体收录标准、信息来源与更新方式仍待核验，用户最终拿到的是清单条目而非诊疗结论。
    inspiration: 趋势：AI 医疗成果正被公众当作可检索的“战绩表”来消费，说明疾病级疗效信息存在整理需求。切入：可从肿瘤、罕见病等具体病种切入，做带原始论文与试验编号出处的疗效追踪，卖给患者组织、药企医学事务或医疗媒体，而非做泛疾病榜单。
    summary_en: For readers following medical progress, this site is opened when checking whether a disease
      has an AI-related therapy, showing a disease-by-disease tracking list. The material only states
      its positioning as tracking diseases cured by AI; inclusion criteria, sources and update method
      still need verification, and users get list entries rather than clinical conclusions.
    inspiration_en: 'Trend: AI medical results are being consumed by the public as a searchable scoreboard,
      showing demand for organizing disease-level efficacy information. Entry: start from specific disease
      areas such as oncology or rare disease, tracking efficacy with links to original papers and trial
      IDs, sold to patient groups, pharma medical affairs or health media rather than a generic disease
      ranking.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 患者或医疗信息关注者在查阅某种疾病是否已有 AI 相关疗法时，打开该站点浏览按疾病归类的清单，以判断某项进展是否与 AI 有关。
        job_en: Patients or health-information readers open the site when checking whether a disease has
          an AI-related therapy, browsing a disease-by-disease list to judge whether a development involves
          AI.
        pain_zh: AI 医疗成果散落在论文、新闻稿和监管公告中，非专业读者难以按病种汇总核对，容易把宣传口径当成疗效。
        pain_en: AI medical results are scattered across papers, press releases and regulatory notices,
          making it hard for non-specialists to aggregate and verify by disease, and easy to mistake marketing
          claims for efficacy.
        current_alternative_zh: 旧做法是自行搜索新闻、论文摘要或病友社区讨论，逐条比对，耗时且难以判断可信度。
        current_alternative_en: The old approach is searching news, paper abstracts or patient-community
          threads and comparing them one by one, which is slow and hard to judge for credibility.
        usage_reason_zh: 推断：若该站点能按病种给出带出处的条目，用户可省去跨来源检索与归类的步骤；但当前材料未显示收录标准、来源标注或更新机制，无法确认它比自行搜索更可靠。
        usage_reason_en: 'Inference: if the site lists entries by disease with sources, users skip cross-source
          searching and sorting; but the material shows no inclusion criteria, source attribution or update
          mechanism, so it cannot be confirmed as more reliable than self-searching.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决按病种汇总 AI 医疗进展的检索负担，痛点结构存在，但材料未说明收录标准与来源，交付是否可信无法判断。
        evidence_ids:
        - ev-f742eb264026960b
        - ev-ef2cffb5431bc54d
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度较高，但热度只说明关注度，不能证明读者会持续回来核对清单。
        evidence_ids:
        - ev-f742eb264026960b
      - gate: model
        status: insufficient
        reason: 未见定价、付费方或赞助模式；患者组织、药企或媒体的付费路径只是推断，不是已验证事实。
        evidence_ids:
        - ev-f742eb264026960b
        - ev-ef2cffb5431bc54d
      - gate: truth
        status: challenged
        reason: “AI 治愈疾病”的表述本身可能夸大疗效，缺少论文与试验编号出处时存在误导风险，人工审核边界不明。
        evidence_ids:
