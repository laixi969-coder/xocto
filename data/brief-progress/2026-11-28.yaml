  大厂的应届生名额正在先让给-ai-预算:
    slug: 大厂的应届生名额正在先让给-ai-预算
    name: 微软 AI 组织转型与应届生招聘收缩
    decision: market_context
    summary_zh: 微软 CEO 萨提亚·纳德拉公开承认微软已放慢应届生招聘，并称首要任务是把现有员工调整到合适位置、构建人与 AI 分工的“软件工厂”模式，再逐步把 AI 预算花满。微软全职员工约
      22.3 万人，一年减少约 5000 人，同期营收增长 18%，产品研发人员从 8 万降至 7.7 万，并首次向大部分软件工程师提供自愿离职方案。对 AI 应用的含义是：企业把原本用于初级人力的预算转向
      AI 工具与调用额度，入门级岗位需求被压缩，交付更依赖有经验的工程师与 AI 协作（推断）。
    summary_en: Microsoft CEO Satya Nadella publicly acknowledged that the company has slowed graduate
      hiring, saying the priority is to reposition existing staff and build a software-factory model dividing
      work between people and AI before fully spending its AI budget. Microsoft has about 223,000 full-time
      employees, roughly 5,000 fewer than a year earlier while revenue grew 18%; product R&D headcount
      fell from 80,000 to 77,000, and the company offered voluntary departure to most software engineers
      for the first time. The implication for AI adoption is that firms are shifting budgets once earmarked
      for junior staff toward AI tools and usage quotas, compressing entry-level demand and making delivery
      more dependent on experienced engineers working with AI (inference).
    event_summary_zh: 微软 CEO 纳德拉公开承认应届生招聘放慢，公司一年减少约 5000 名全职员工、营收同期增长 18%，产品研发人员从 8 万降至 7.7 万，并首次向大部分软件工程师提供自愿离职方案。
    event_summary_en: Microsoft CEO Nadella publicly acknowledged slower graduate hiring; the company
      cut about 5,000 full-time employees over a year while revenue grew 18%, reduced product R&D headcount
      from 80,000 to 77,000, and offered voluntary departure to most software engineers for the first
      time.
