    name: arnold
    decision: watching
    event_summary_zh: PhonePe 于 2026 年 11 月开源 arnold：一个自托管的代码评审平台，接入 公开代码仓库 PR 与 GitLab MR，提供优先合并队列、评审工作区，并用用户自带的
      OpenAI 兼容模型把评审意见以行内评论回写到代码托管平台；公开仓库约 45 星、8 个 fork。
    event_summary_en: 'PhonePe open-sourced arnold in November 2026: a self-hosted code review platform
      that connects to public code repository PRs and GitLab MRs, offering a prioritised merge queue,
      a review workspace, and AI review comments posted inline back to the forge using a user-supplied
      OpenAI-compatible model; the public repository shows about 45 stars and 8 forks.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 金融科技
    industries_en:
    - software development
    - fintech
    jobs:
    - 工程团队在合并前需要人工逐条阅读 PR/MR 改动并写评审意见时，用 arnold 让模型先产出可回写的行内发现，再由评审人确认
    - 开发者在多个仓库排队合并时，用 arnold 的优先合并队列决定合并顺序
    jobs_en:
    - Engineering teams reading each PR/MR diff by hand and writing review comments before merge use arnold
      to have a model draft inline findings posted back, which reviewers then confirm
    - Developers merging across many repositories use arnold's prioritised merge queue to order merges
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 工程团队在合并代码前打开它：arnold 接收 公开代码仓库 PR 或 GitLab MR 的改动，用团队自带的 OpenAI 兼容模型生成评审发现并以行内评论回写到代码托管平台，同时提供合并队列和评审工作区；最终交付是待人工确认的评审意见与合并顺序，具体流程细节仍待核验。
    inspiration: 趋势：代码评审正从人工逐条读 diff 转向模型先出发现、人再确认的分工，且模型由使用方自带。切入：面向有私有代码不能外发的金融、政企研发团队，卖自托管部署与评审规则配置，而不是卖模型调用；窗口在于大厂评审工具多绑定自家托管平台。
    summary_en: 'Engineering teams open it before merging code: arnold takes public code repository PR
      or GitLab MR changes, uses the team''s own OpenAI-compatible model to generate review findings posted
      back as inline comments, and adds a merge queue and review workspace; the deliverable is review
      comments and merge order pending human confirmation, with workflow details still to be verified.'
    inspiration_en: 'Trend: code review is shifting from humans reading every diff to models drafting
      findings that people confirm, with the model supplied by the user. Entry: target fintech and public-sector
      engineering teams whose private code cannot leave their network, selling self-hosted deployment
      and review-rule configuration rather than model calls; the opening exists because large-vendor review
      tools mostly bind to their own hosting platforms.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工程团队在合并前需要逐条阅读 PR/MR 改动并写评审意见时，用 arnold 让模型先产出可回写的行内发现，再由评审人确认。
        job_en: When engineering teams must read each PR/MR change and write review comments before merging,
          they use arnold to have a model draft inline findings posted back, which reviewers then confirm.
        pain_zh: 评审是合并前的必经人工环节，改动多时排队等待和漏看风险都落在评审人身上；私有代码又常不允许发到外部 SaaS 评审服务。
        pain_en: Review is a mandatory manual step before merge; with many changes, queueing delays and
          missed issues fall on reviewers, and private code often cannot be sent to external SaaS review
          services.
        current_alternative_zh: 人工在 公开代码仓库/GitLab 界面逐条读 diff 并写评论，或使用绑定托管平台的评审机器人与外部 SaaS 评审工具。
        current_alternative_en: People read diffs and write comments manually in the public code repository/GitLab
          interface, or use review bots bound to the hosting platform and external SaaS review tools.
        usage_reason_zh: 推断：相较人工逐条读 diff，arnold 用自带模型先生成行内发现并回写到 PR/MR，减少评审人从零起草意见这一步；自托管与自带模型让不能外发代码的团队也能用，因此这类团队会在私有仓库评审时选择它。
        usage_reason_en: 'Inference: compared with reading every diff by hand, arnold uses a self-supplied
          model to draft inline findings posted back to the PR/MR, removing the step of writing comments
          from scratch; self-hosting and bring-your-own-model let teams with non-exportable code use it,
          so such teams would pick it for private-repo review.'
      gates:
