    summary_zh: 2026年11月25日报道，Character.AI计划拍卖用户私密聊天数据，遭多州总检察长质疑。该事件表明对话式AI产品的用户数据商业化正受到监管审视，可能影响同类产品的数据变现路径与用户信任（推断）。
    summary_en: Reports on 25 November 2026 said Character.AI planned to auction users' private chat data,
      drawing challenges from multiple state attorneys general. The episode shows that commercialization
      of user data by conversational AI products is under regulatory scrutiny, which may affect data monetization
      paths and user trust for similar products (inference).
    event_summary_zh: 2026年11月25日报道，Character.AI计划拍卖用户私密聊天数据，遭多州总检察长质疑。
