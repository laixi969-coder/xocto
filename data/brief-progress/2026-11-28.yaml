    slug: 蚂蚁灵波发布lingbot-map-20模型自己修正空间记忆把地图画更准
    name: LingBot-Map 2.0
    decision: market_context
    event_summary_zh: 2026 年 11 月 27 日，蚂蚁灵波科技发布流式三维重建模型 LingBot-Map 2.0，称其能自行修正“空间记忆”以提升建图精度。这是模型层面的能力更新，不是独立应用产品；对下游应用意味着三维重建的输入质量与实时性可能改善，但成本、采用与交付影响尚无材料支持，属推断。
    event_summary_en: On 27 November 2026, Ant Lingbo Technology released LingBot-Map 2.0, a streaming
      3D reconstruction model that it says corrects its own spatial memory to improve mapping accuracy.
      This is a model-level capability update rather than a standalone application; it may improve input
      quality and real-time performance for downstream 3D applications, but effects on cost, adoption
      and delivery are not supported by the material and remain inference.
    category: 基础层
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 蚂蚁灵波科技于 2026 年 11 月 27 日发布的流式三维重建模型，接收连续采集的图像流并实时重建三维地图，通过自行修正“空间记忆”减少建图漂移。它面向需要现场建图的开发者与机器人、测绘等下游团队，属于模型能力更新而非独立应用，具体交付形态与使用流程仍待核验。
    inspiration: 趋势：三维重建正从离线拼接走向流式在线建图，模型开始自己纠错，下游应用的门槛随之下降。切入：可从机器人巡检、室内测绘等需要边走边建图的现场环节进入，把模型能力封装成按次交付的建图结果，而非卖模型本身。
    summary_en: A streaming 3D reconstruction model released by Ant Lingbo Technology on 27 November 2026.
      It takes a continuous image stream and rebuilds a 3D map in real time, correcting its own spatial
      memory to reduce drift. It targets developers and downstream robotics or surveying teams that need
      on-site mapping; it is a model update rather than a standalone application, and its delivery form
      and workflow still need verification.
    inspiration_en: 'Trend: 3D reconstruction is moving from offline stitching to streaming on-site mapping,
      with models correcting themselves, lowering the bar for downstream applications. Entry: start from
      field steps such as robot inspection or indoor surveying that need mapping while moving, packaging
      the capability as per-job mapping output rather than selling the model itself.'
