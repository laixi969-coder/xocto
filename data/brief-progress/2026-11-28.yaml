    inspiration: 趋势：MCP 协议正从高层 API 渗透至底层二进制逆向与动态分析，使 AI 具备操作系统级别的执行调试能力。切入：从移动安全合规审计或固件脱壳切入，按复杂样本分析或漏洞排查任务计费，不与通用开发插件竞争。
    summary_en: Security researchers run this tool when analyzing Android ARM64 shared libraries; it exposes
      MCP interfaces to execute binaries in a pure Rust emulator, tracing calls via zero-copy tooling
      and returning verifiable execution logs while humans verify anti-tamper logic.
    inspiration_en: 'Trend: MCP is extending AI agents into low-level binary reversing and dynamic emulation.
      Wedge: Enter via mobile app security auditing and automated unpacking services, charging per complex
      binary analysis task rather than generic IDE coding subscriptions.'
