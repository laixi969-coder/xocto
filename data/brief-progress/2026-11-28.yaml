      - gate: model
        status: insufficient
        reason: 开源项目，未见托管定价或付费路径，买方与收费方式不明。
        evidence_ids:
        - ev-c4f66f07b66a5ebb
      - gate: truth
        status: insufficient
        reason: 尚无文档说明断点恢复与安全边界，交付确定性无法核对。
        evidence_ids:
        - ev-3049a78c2e0b10aa
