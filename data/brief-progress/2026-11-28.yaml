      changes and task dispatch
    jobs_en:
    - Chinese-speaking developers orchestrating multiple coding agents on a local desktop to handle code
      changes and task dispatch
    - Developers managing parallel coding-agent sessions and reviewing their output on a desktop workbench
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 中文开发者在自己电脑上打开星尘 Agent 桌面工作台，把编码任务分派给多个 AI 代理并查看它们的改动；具体如何合并结果、人工确认环节与交付形态仍待核验。
    inspiration: 趋势：编码代理从单轮对话走向多代理并行，桌面端成为调度与审阅的落点。切入：从中文开发者管理多个代理会话的审阅环节进入，做任务分派与改动核对，而不是再做一个编码模型。
    summary_en: Chinese-speaking developers open the Stardust Agent desktop workbench on their own machine
      to dispatch coding tasks to multiple AI agents and review their changes; how results are merged,
      where humans confirm, and the delivery form still need verification.
    inspiration_en: 'Trend: coding agents are moving from single-turn chat to parallel multi-agent work,
      with the desktop becoming the place to dispatch and review. Entry: start from the review step where
      Chinese-speaking developers manage several agent sessions, doing task dispatch and change checking
      rather than building another coding model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 中文开发者在本地桌面同时跑多个编码代理时，需要分派任务并核对各代理改了什么。
        job_en: Chinese-speaking developers running several coding agents locally need to dispatch tasks
          and check what each agent changed.
        pain_zh: 多代理并行后改动分散、难以追踪，开发者要在多个会话间来回切换核对，容易漏看冲突。
        pain_en: With parallel agents, changes scatter and are hard to track; developers switch between
          sessions to check, and conflicts get missed.
        current_alternative_zh: 在多个终端或编辑器窗口里分别开代理会话，手工复制任务、逐个比对改动。
        current_alternative_en: Opening separate agent sessions across terminals or editor windows, copying
          tasks by hand and comparing changes one by one.
        usage_reason_zh: 推断：相较手工多窗口管理，它把任务分派与改动查看收进一个桌面工作台，减少在会话间切换和手工比对这一步，因此同时用多个编码代理的中文开发者会在并行任务时选择它。
        usage_reason_en: 'Inference: versus juggling multiple windows by hand, it gathers task dispatch
          and change review into one desktop workbench, cutting the switching and manual comparison step,
          so Chinese-speaking developers using several coding agents would pick it for parallel tasks.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时任务分派与改动核对分散的问题，旧行为是多窗口手工管理。
        evidence_ids:
        - ev-37298ef139db362a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标与分支数，未见用户反馈或采用案例。
        evidence_ids:
        - ev-37298ef139db362a
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露，买方与收费方式属判断而非事实。
        evidence_ids:
        - ev-37298ef139db362a
      - gate: truth
        status: insufficient
        reason: 多代理结果如何合并、人工确认边界与稳定性尚未核验。
        evidence_ids:
        - ev-37298ef139db362a
      next_validation: 收集星尘 Agent 仓库的 issue 与 discussion，确认多代理结果合并方式与人工确认环节。
