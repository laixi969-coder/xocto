      batch of submitted removal requests. The candidate does not say whether AI generates or checks the
      requests; the exact flow still needs verification.
    inspiration_en: Personal data removal is shifting from filling forms site by site to scripted bulk
      submission, showing privacy cleanup is becoming automatable repetitive work. The opening is a subscription
