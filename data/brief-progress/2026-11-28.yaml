    summary_zh: 短剧创作者在拿到剧本后，用这套 37 个脚本把分镜生成、AI 视频提示词编译、剪映/CapCut 草稿输出和逐帧质检串成一条可复测流水线；跑完后得到一条能直接导入剪辑软件、通过帧级检查的竖屏样片，选角与节奏仍需人工确认。
    inspiration: 趋势：竖屏短剧产能正从剧组协作转向单人 AI 流水线，分镜与质检是瓶颈环节。切入：面向小团队和独立创作者卖
    summary_en: Short-drama creators run 37 scripts to chain storyboard generation, AI prompt compilation,
      Jianying/CapCut draft export, and frame-level QC into a re-runnable pipeline; output is a vertical
      clip ready for the editor, with casting and pacing still human-confirmed.
    inspiration_en: 'Trend: vertical short-drama production shifts from crew to solo AI pipelines; storyboarding
      and QC are the bottlenecks. Entry: sell a script-to-rough-cut workflow to small teams and solo creators,
      priced per episode or minute, not per seat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 短剧制作团队中的编导或后期人员，在拿到已完成剧本后，需要用 AI 视频生成工具产出竖屏样片，再导入剪映/CapCut 完成剪辑与逐帧质检。
        job_en: A director or post-production person on a short-drama team, after receiving a finished
          script, must produce a vertical clip via AI video generation and import it into Jianying/CapCut
          for editing and frame-level QC.
        pain_zh: 从剧本到可过质检的竖屏样片，分镜、提示词调优、草稿输出、逐帧检查四个环节靠人工经验衔接，一个小团队做一条 60 秒样片常需两天以上。
        pain_en: From script to a QC-passing vertical clip, storyboard, prompt tuning, draft export, and
          frame-level check are stitched together by hand; a small team often needs two or more days for
          one 60-second clip.
        current_alternative_zh: 编导手写分镜脚本，逐条调试 AI 视频提示词，人工导出草稿到剪映，再一帧一帧看片挑错，环节间靠口头交接。
        current_alternative_en: The director hand-writes a storyboard, tunes each AI video prompt one
          by one, manually exports the draft to Jianying, then reviews frame-by-frame; handoffs between
          steps are verbal.
        usage_reason_zh: 这套脚本把四个环节压成 37 步可执行指令，减少编导在环节间手动翻译和返工的负担；推断：小团队或独立创作者在需要快速出样片时直接跑通全流程，大团队仍保留人工选角与节奏判断。
        usage_reason_en: 'The 37 scripts compress four steps into runnable instructions, cutting manual
          translation and rework between stages; inferred: small teams or solo creators run the full pipeline
          when speed matters, while larger teams keep human casting and pacing calls.'
      gates:
      - gate: value
        status: supported
        reason: 竖屏短剧从剧本到样片的旧流程依赖多人手动衔接分镜、提示词、剪辑和质检，痛点是环节间返工和周期长；买方为短剧制作小团队或独立创作者，但公开材料未确认谁在付费。
        evidence_ids:
        - ev-10da73d003ce40a3
      - gate: consensus
        status: insufficient
        reason: 112 星、0 fork、0 issue，说明有下载和浏览但未见社区共建或客户案例；无法确认已有制作团队将其留在日常流程中。
        evidence_ids:
        - ev-6a6319a15dc545a3
        - ev-10da73d003ce40a3
      - gate: model
        status: insufficient
        reason: 仓库为免费开源脚本集，无定价页、无 SaaS 层、无按条或按分钟计费信号；商业路径未明，推断可能以工作流咨询或模板授权变现，但材料未证实。
        evidence_ids:
        - ev-10da73d003ce40a3
      - gate: truth
        status: supported
        reason: 流水线被描述为可编译、可测试，帧级 QC 提供确定性交付标准；输入（剧本）到输出（可导入剪辑软件的样片）闭环明确。
        evidence_ids:
        - ev-10da73d003ce40a3
      next_validation: 检查该仓库是否出现 fork、issue 讨论或 Star 增长曲线是否持续超过一周（非单日脉冲），以判断是否有真实制作团队在复用或扩展这套流水线。
  yogurt-2:
    slug: yogurt-2
    name: yogurt
    decision: queued
    event_summary_zh: yogurt 仓库星标从 11 月 10 日的约 2,987 增至 28 日的 3,765，三周增长约 780 颗，保持每周约 260 颗的稳定增速，无一次性爆发。
    event_summary_en: yogurt repo stars grew from ~2,987 on Nov 10 to 3,765 on Nov 28, a gain of ~780
      over three weeks at a steady ~260/week pace with no single spike.
    category: AI + 效率
    project_type: open_source
    industries:
    - 专业服务
    - 医疗
    - 法律
    industries_en:
