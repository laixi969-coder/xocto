          then generate with separate image and video tools and stitch manually.
        usage_reason_zh: 推断：相较人工分镜加多工具拼接，它把剧本、资产图、分镜和出图出片收进同一条对话流程，并做跨集接力与事故检查，减少在多个工具间搬运和手动对齐人物场景的步骤，因此需要批量出片的短剧团队会尝试它。
        usage_reason_en: 'Inference: versus manual storyboarding plus multi-tool stitching, it folds script,
          asset images, storyboards and rendering into one conversational flow with cross-episode handoff
          and fault checks, cutting the steps of moving between tools and manually aligning characters
          and scenes, so teams needing batch output would try it.'
