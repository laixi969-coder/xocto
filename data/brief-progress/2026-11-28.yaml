    summary_zh: 面向使用 Google Antigravity 的开发者，以插件方式接入其 CLI、桌面端与 IDE，在保留原生界面与 diff 的情况下压缩 AI 编码会话的轮次、token
      配额与上传流量。仓库自述称轮次降约 34%、配额降约 31%、上传流量降约 40%，独立复现仍待核验。
    inspiration: 趋势：AI 编码的用量配额成为团队实际成本，围绕配额与流量的优化开始形成独立工具层。切入：从按用量付费或配额受限的工程团队进入，卖可核对的配额节省结果而非功能清单；价格未披露。
    summary_en: For developers using Google Antigravity, it plugs into its CLI, desktop and IDE to compress
      AI coding session turns, token quota and upload traffic while keeping the native UI and diffs. The
      repository claims about 34% fewer turns, 31% lower quota and 40% less upload traffic; independent
      reproduction still needs verification.
    inspiration_en: 'Trend: AI coding usage quotas have become a real team cost, and optimization around
      quota and traffic is forming a separate tool layer. Entry: start from engineering teams paying by
      usage or capped by quota, selling verifiable quota savings rather than a feature list; pricing is
      not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Google Antigravity 的开发者在不改动原生界面与 diff 的前提下，压缩 AI 编码会话的轮次、token 配额与上传流量。
        job_en: Developers using Google Antigravity compress AI coding session turns, token quota and
          upload traffic without changing the native UI or diffs.
        pain_zh: AI 编码会话消耗大量轮次与 token 配额，配额受限或按量计费时直接转化为成本与中断。
        pain_en: AI coding sessions consume many turns and token quota, which directly becomes cost and
          interruption when quota is capped or billed by usage.
        current_alternative_zh: 开发者手动精简提示、减少上下文或等待配额重置，缺少不改动工作流的压缩手段。
        current_alternative_en: Developers manually trim prompts, cut context or wait for quota resets,
          lacking a compression method that leaves the workflow intact.
        usage_reason_zh: 推断：它以插件方式在保留原生界面与 diff 的前提下减少轮次与配额消耗，省去手动精简提示和等待配额的那一步，因此配额受限或按量付费的开发者会尝试；仓库自述的降幅尚无独立复现，也无留存证据。
        usage_reason_en: 'Inference: as a plugin it cuts turns and quota use while keeping the native
          UI and diffs, removing the step of manually trimming prompts and waiting for quota, so developers
          with capped or metered usage may try it; the claimed reductions lack independent reproduction
          and retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 编码会话的配额与流量成本问题，痛点具体且可量化；降幅数据来自仓库自述，需独立复现。
