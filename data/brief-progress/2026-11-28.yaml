    jobs:
    - 使用 AI 编程代理的开发者，在让代理改动代码前，用规划、批判性审查和差异审计三段流程检查代理产出，以决定是否合并
    jobs_en:
    - Developers using AI coding agents run a three-stage planning, critical review and diff audit process
      on agent output before deciding whether to merge
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 AI 编程代理的开发者，在代理准备改动代码时，打开这套指令与技能集合，让代理先做规划、再做批判性审查、最后审计代码差异，最终拿到一份可复核的改动方案与审查结论；人工仍需自行确认是否合并。具体流程与交付细节仍待核验。
    inspiration: 趋势：AI 编程代理已能大量产出代码，瓶颈从“写”转向“审”，围绕代理产出的审查流程开始被单独产品化。切入：可从需要合规留痕的团队切入，把审查步骤做成可审计记录，按团队或项目收费；但仓库仅约
      350 星、无付费与采用证据，窗口与需求强度均未明。
    summary_en: Developers using AI coding agents open this instruction and skill set when an agent is
      about to change code, having the agent plan first, then critically review, then audit the diff,
      ending with a reviewable change plan and review conclusion; a human still confirms whether to merge.
      The exact workflow and deliverables remain to be verified.
    inspiration_en: 'Trend: AI coding agents now produce large amounts of code, so the bottleneck shifts
      from writing to reviewing, and review processes around agent output are starting to be productized
      separately. Entry: target teams needing compliance trails, turning review steps into auditable records
      and charging per team or project; but the repo has only about 350 stars with no pricing or adoption
      evidence, so the window and demand strength are unclear.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 AI 编程代理的开发者，在代理准备改动代码前，用规划、批判性审查和差异审计三段流程检查代理产出，以决定是否合并。
        job_en: Developers using AI coding agents run a three-stage planning, critical review and diff
          audit process on agent output before deciding whether to merge.
        pain_zh: 代理生成的代码量大且容易夹带错误，人工逐行审查负担重，漏审会带来缺陷与返工。
        pain_en: Agent-generated code is voluminous and error-prone, making line-by-line human review
          heavy, and missed reviews cause defects and rework.
        current_alternative_zh: 开发者目前靠人工读 diff、零散提示词或各自积累的检查清单来审查代理产出。
        current_alternative_en: Developers currently review agent output by manually reading diffs, using
          ad-hoc prompts, or relying on self-built checklists.
        usage_reason_zh: 推断：相较人工逐行读 diff，它把审查拆成规划、批判性审查、差异审计三步固定动作，减少遗漏环节的负担，因此使用代理改代码的开发者会在合并前选择它；尚无用户反馈或采用数据支持。
        usage_reason_en: 'Inference: compared with reading diffs line by line, it splits review into fixed
          planning, critical review and diff audit steps, reducing the burden of missed steps, so developers
          using agents would choose it before merging; no user feedback or adoption data yet supports
          this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理产出代码的审查需求，痛点是人工逐行审查负担重且易漏，旧做法是人工读 diff 与零散清单，结构上成立。
        evidence_ids:
