        usage_reason_zh: 推断：扩展在浏览当下就地标记可疑内容，省去复制文件、切换到检测网站再返回的步骤，因此对需要高频核验信息流的事实核查和内容审核人员更有吸引力；准确率与误报率尚无公开证据。
        usage_reason_en: 'Inference: the extension flags suspicious content in place while browsing, removing
          the copy-file, switch-to-detector, return steps, which appeals to fact-checkers and content
          reviewers who verify feeds frequently; public evidence on accuracy and false-positive rates
          is still missing.'
      gates:
      - gate: value
