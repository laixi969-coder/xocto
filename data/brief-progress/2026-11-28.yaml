    inspiration: 趋势：代码迁移正在从一次性全量生成演进为带双重核验的渐进式重构。切入：瞄准金融高频交易或基础设施中的遗留 Python/Go 系统迁移，按通过核验的重构模块或交付用例收费，避免大模型幻觉导致的编译与逻辑回归风险。
