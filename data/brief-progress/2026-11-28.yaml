full:
  art-paper-data:
    slug: art-paper-data
    name: art-paper-data
    decision: watching
    event_summary_zh: 2026年11月14日，Anthropic 在代码托管平台发布名为 art-paper-data 的仓库，自述为“ART 论文的数据包”，公开指标仅显示 2 个星标、2
      个复刻、0 个未决议题。
    event_summary_en: On November 14, 2026, Anthropic published a repository named art-paper-data, described
      as the data package for the ART manuscript; public metrics show only 2 stars, 2 forks and 0 open
      issues.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 目前公开材料只说明它是某篇 ART 论文配套的数据包，未交代谁会打开它、接收什么材料、执行什么处理、最终交付什么；具体流程与交付仍待核验。
    inspiration: 趋势：前沿模型公司开始把论文配套数据单独公开，可能成为研究复现与评测数据供给的一环。切入：若面向需要复现实验的实验室或评测团队，可从数据版本管理与可复现交付切入；该仓库是否具备这一用途尚无材料支持，属推断。
    summary_en: Public material only describes it as a data package accompanying an ART manuscript; it
      does not say who opens it, what material it takes in, what processing it performs, or what it delivers.
      The concrete workflow and deliverable remain unverified.
    inspiration_en: 'Trend: frontier model companies are publishing paper companion data as separate artifacts,
      which could become a supply channel for research replication and evaluation data. Entry: for labs
      or evaluation teams needing to reproduce experiments, one could start from data versioning and reproducible
      delivery; whether this repository serves that purpose is unsupported and is inference only.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 公开材料未说明具体使用者与任务；仅可推断为需要复现 ART 论文结果的研究人员，在复现实验时处理论文配套数据，要完成结果核对。
        job_en: Public material names no specific user or task; it can only be inferred that researchers
          reproducing the ART paper would handle its companion data to check results.
        pain_zh: 论文配套数据分散、版本不清会让复现实验难以对齐；但该仓库是否解决这一痛点没有材料支持，属推断。
        pain_en: Scattered, unversioned paper data makes replication hard to align; whether this repository
          addresses that pain is unsupported and is inference.
        current_alternative_zh: 研究人员通常向作者索取数据、从论文附录或补充材料中手工整理，或直接放弃复现。
        current_alternative_en: Researchers typically request data from authors, manually assemble it
          from appendices or supplementary material, or skip replication.
        usage_reason_zh: 若该仓库提供带版本的数据包，可省去逐项向作者索取与手工整理的步骤；但公开材料未给出数据内容、许可或使用说明，因此这一理由仅为推断。
        usage_reason_en: If the repository provides a versioned data package, it could remove the step
          of requesting files from authors and assembling them by hand; however, public material gives
          no data contents, license or usage notes, so this reason is inference only.
      gates:
      - gate: value
        status: insufficient
        reason: 它可能解决论文数据复现的整理负担，但公开材料未说明数据内容、使用者与交付结果，需求与痛点尚无法确认。
        evidence_ids:
        - ev-5270689d337a1fd1
        - ev-2f80ff0f3dfd5bf0
      - gate: consensus
        status: insufficient
        reason: 仅有 2 个星标、2 个复刻，属关注度规模证据，不能说明研究社区已形成采用共识。
        evidence_ids:
