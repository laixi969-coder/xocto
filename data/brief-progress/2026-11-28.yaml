    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安全团队在监控到疑似AI代理攻击框架（如PentAGI、HexStrike、Strix）活动时，打开这套开源检测规则库，把KQL、Sigma、Suricata、YARA等规则导入Sentinel、Splunk或Elastic，得到可执行的狩猎查询与IOC清单，用于确认告警；规则是否覆盖真实攻击、误报率如何，公开材料未说明，具体交付效果仍待核验。
    inspiration: 趋势：攻击方开始用自主AI代理跑渗透流程，防守方需要对应的检测资产，这比单个扫描工具大一步。切入：从托管安全服务商（MSSP）或中大型企业SOC切入，把“AI代理攻击面”的检测规则做成订阅式情报加规则更新服务；公开材料未披露定价，属推断。
    summary_en: When security teams see suspected activity from AI-agent attack frameworks such as PentAGI,
      HexStrike, or Strix, they open this open-source detection rule set and import KQL, Sigma, Suricata,
      and YARA rules into Sentinel, Splunk, or Elastic to get runnable hunting queries and IOC lists for
      confirming alerts; whether the rules cover real attacks and their false-positive rate is not stated
      publicly, so delivery quality remains to be verified.
    inspiration_en: 'Trend: attackers now run penetration workflows with autonomous AI agents, so defenders
      need matching detection assets — a step larger than any single scanning tool. Entry: sell to managed
      security service providers or mid-to-large enterprise SOCs as a subscription intelligence-and-rule-update
      service for the AI-agent attack surface; pricing is not disclosed, so this is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全运营分析师在监控到疑似AI代理攻击框架活动时，用KQL、Sigma、YARA等规则在Sentinel、Splunk、Elastic中编写并调优狩猎查询，完成威胁确认与告警。
        job_en: Security operations analysts investigating suspected AI-agent attack framework activity
          write and tune hunting queries in Sentinel, Splunk, or Elastic using KQL, Sigma, and YARA rules
          to confirm threats and raise alerts.
        pain_zh: AI代理攻击框架是新出现的攻击面，旧有检测规则库不覆盖这些工具的行为特征，分析师要从零手写查询，确认慢且易漏。
        pain_en: AI-agent attack frameworks are a new attack surface that legacy rule libraries do not
          cover, forcing analysts to hand-write queries from scratch, which is slow and error-prone.
        current_alternative_zh: 分析师自行研究攻击框架行为、手写Sigma/YARA规则，或依赖厂商通用威胁情报订阅。
        current_alternative_en: Analysts research framework behavior themselves, hand-write Sigma/YARA
          rules, or rely on vendors' generic threat-intelligence feeds.
        usage_reason_zh: 它把多个AI代理攻击框架的检测逻辑预先写成可直接导入主流SIEM/EDR的规则和IOC，省去分析师从零逆向攻击行为再转写查询的一步；推断，安全团队在遇到这类新型告警时会选择它，但公开材料未给出误报率或实际拦截结果。
        usage_reason_en: It pre-writes detection logic for several AI-agent attack frameworks into rules
          and IOCs importable into mainstream SIEM/EDR, removing the step of reverse-engineering attack
          behavior and translating it into queries; this is inference, and no false-positive or interception
          results are disclosed.
      gates:
      - gate: value
        status: supported
        reason: 它解决安全团队面对AI代理攻击框架时缺少现成检测规则、需从零手写查询的痛点，旧替代行为明确，结构上成立。
        evidence_ids:
        - ev-3ddd98d6651666a3
        - ev-258deb2fa030301d
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度信号，缺少安全团队实际部署或客户案例支持持续采用。
        evidence_ids:
        - ev-efd781db5e3d3e21
        - ev-258deb2fa030301d
      - gate: model
        status: insufficient
        reason: 开源规则库，公开材料未说明付费路径或商业主体，钱可能来自企业订阅或服务，属推断。
        evidence_ids:
        - ev-3ddd98d6651666a3
      - gate: truth
        status: insufficient
        reason: 规则是否覆盖真实攻击、误报率与维护频率未公开，交付确定性待核验。
        evidence_ids:
        - ev-258deb2fa030301d
      next_validation: 收集该仓库的issue/discussion或发布说明，核验规则更新频率、误报反馈与是否有安全团队报告实际检测结果。
    event_summary_zh: 2026年11月20日前后，ThreatDefence发布并持续扩充面向AI代理攻击框架的开源检测规则集，覆盖ARTEX、PentAGI、HexStrike、Strix等框架，提供KQL、Sigma、Suricata、YARA等格式；仓库星数在数日内从约417升至796。
    event_summary_en: Around November 20, 2026, ThreatDefence released and kept expanding an open-source
      detection rule set for AI-agent attack frameworks including ARTEX, PentAGI, HexStrike, and Strix,
      in KQL, Sigma, Suricata, and YARA formats; repository stars rose from about 417 to 796 within days.
  agilespec:
    slug: agilespec
    name: AgileSpec
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发团队在把需求交给 AI 编码助手前，整理用户故事、验收标准与迭代任务，让 AI 按规格产出代码
    jobs_en:
    - development teams organizing user stories, acceptance criteria and sprint tasks before handing work
      to AI coding assistants so code is produced against a spec
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向使用 AI 编码助手的开发团队，在需求进入编码前把用户故事、验收标准与迭代任务整理成规格，再交给 AI 执行。候选材料只给出仓库简介与星数，具体输入、动作与交付流程仍待核验。
    inspiration: 趋势：AI 编码助手把瓶颈从写代码推到写清规格，规格与验收正在成为新的交付环节。切入：从外包团队或中小研发团队的需求评审环节进入，卖按项目交付的规格与验收包，而非又一个编码插件；价格未披露。
    summary_en: For development teams using AI coding assistants, it organizes user stories, acceptance
      criteria and sprint tasks into a spec before coding begins, then hands it to the AI. The candidate
      only provides a repository description and star count; the concrete inputs, actions and deliverables
      still need verification.
    inspiration_en: 'Trend: AI coding assistants push the bottleneck from writing code to writing clear
      specs, making specs and acceptance criteria a new delivery step. Entry: start from the requirements
      review step of outsourcing or small engineering teams, selling per-project spec and acceptance packages
      rather than another coding plugin; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发团队在把需求交给 AI 编码助手前，整理用户故事、验收标准与迭代任务，让 AI 按规格产出代码。
        job_en: Development teams organize user stories, acceptance criteria and sprint tasks before handing
          requirements to AI coding assistants so code is produced against a spec.
        pain_zh: AI 编码助手按模糊需求产出偏离预期的代码，返工与验收争议增加；团队缺少把需求转成可执行规格的固定环节。
        pain_en: AI coding assistants produce off-target code from vague requirements, increasing rework
          and acceptance disputes; teams lack a fixed step to turn requirements into executable specs.
        current_alternative_zh: 团队靠口头沟通、零散文档或直接在对话里反复纠正 AI，规格散落在聊天记录中。
        current_alternative_en: Teams rely on verbal communication, scattered documents, or repeatedly
          correcting the AI in chat, with specs scattered across conversation logs.
        usage_reason_zh: 推断：它把用户故事、验收标准与迭代任务集中成一份可交给 AI 的规格，减少反复在对话里澄清需求的那一步，因此需求评审频繁、返工成本高的团队会尝试；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: it consolidates user stories, acceptance criteria and sprint tasks
          into one spec that can be handed to the AI, reducing the step of repeatedly clarifying requirements
          in chat, so teams with frequent requirements reviews and high rework costs may try it; no user
          feedback or retention evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 编码前需求模糊导致返工的问题，痛点具体；但公开材料只有仓库简介，规格如何生成与交付未核验。
        evidence_ids:
        - ev-e076119e4d753041
        - ev-837a18578b0c32f4
      - gate: consensus
        status: insufficient
        reason: 仓库星数仅 43，属早期关注度，不能说明团队已把它放进需求评审流程。
        evidence_ids:
        - ev-837a18578b0c32f4
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径，买方与收费方式不明。
        evidence_ids:
        - ev-e076119e4d753041
      - gate: truth
        status: insufficient
        reason: 未见规格模板、验收结果或与 AI 编码助手配合的实测，承诺能否确定性交付仍缺证据。
        evidence_ids:
        - ev-e076119e4d753041
      next_validation: 收集该仓库 README 与 issue/discussion 中关于规格模板、验收标准与 AI 编码助手配合的实测记录。
