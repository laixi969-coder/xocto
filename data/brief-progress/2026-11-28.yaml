        pain_zh: 早期概念阶段用完整CAD建模过重，画完草图后要重新在三维软件里搭体块，反复改形时这一步最耗时间；不做的后果是方案比较变慢、沟通只能靠平面图。
        pain_en: 'Full CAD modeling is heavy at the early concept stage: after sketching, users must rebuild
          volumes in 3D software, and this step is the slowest when iterating on form; skipping it slows
          option comparison and leaves communication stuck at 2D drawings.'
        current_alternative_zh: 用SketchUp、Rhino或Blender手工推拉体块，或在纸上画草图后交给建模同事；部分人用通用图像生成工具出概念图但拿不到可编辑模型。
        current_alternative_en: Hand-extruding volumes in SketchUp, Rhino or Blender, or sketching on
