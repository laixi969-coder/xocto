      subtitle erasure and translation dubbing into one footage-cleaning pipeline. Entry point: micro-drama
      distributors or cross-border short-video agencies, charged per clip or per delivered cut; but watermark
      removal touches platform rules and copyright, so compliance room must be checked first.'
