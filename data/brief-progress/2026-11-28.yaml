    jobs:
    - 教师或自学者在准备讲解材料时，把知识点交给系统生成逐笔绘制的白板动画课程，并回放检查讲解是否连贯
    - 模型评测者在比较不同模型的白板讲解生成质量时，用同一批题目批量生成课程并做盲评
    jobs_en:
    - Teachers or self-learners preparing explanation material hand a topic to the system to generate
      a stroke-by-stroke whiteboard lesson and replay it to check coherence
    - Model evaluators comparing whiteboard explanation quality generate lessons in batches from the same
      prompts and blind-review them
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 教师或自学者在准备讲解材料时，把知识点交给它，模型逐笔生成白板动画课程并可交互回放；同时它用同一批题目对 Claude、Gemini、DeepSeek 生成 288 节课、64
      块白板做盲评对比。用户拿到的是可播放的白板讲解，具体是否支持编辑与导出仍待核验。
    inspiration: 趋势：白板讲解这类原本靠老师手绘录屏的内容，开始被拆成可批量生成、可横向比较的模型任务。切入：从需要大量重复讲解的环节进入，例如教辅机构把题库转成白板讲解，或评测方把白板讲解质量做成可复现的公开基准；卖法未披露，不宜假设。
    summary_en: When a teacher or self-learner prepares explanation material, they hand a topic to it
      and a model generates a stroke-by-stroke animated whiteboard lesson that can be replayed interactively;
      it also runs the same prompts across Claude, Gemini and DeepSeek to produce 288 lessons and 64 blind-reviewed
      boards for comparison. The user gets a playable whiteboard explanation; whether editing and export
      are supported still needs checking.
    inspiration_en: 'Trend: whiteboard explanations, once hand-drawn and screen-recorded by teachers,
      are being split into a batch-generatable, model-comparable task. Entry: start where repeated explanation
      is heaviest, such as tutoring firms converting question banks into whiteboard lessons, or evaluators
      turning whiteboard quality into a reproducible public benchmark; pricing is undisclosed and should
      not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 教师或自学者在准备讲解材料时，把知识点交给系统生成逐笔绘制的白板动画课程，并回放检查讲解是否连贯。
        job_en: A teacher or self-learner preparing explanation material hands a topic to the system to
          generate a stroke-by-stroke whiteboard lesson and replays it to check coherence.
        pain_zh: 手绘白板讲解需要逐帧录制和反复重录，制作一节讲解耗时且难以批量复用；不同模型生成质量参差，缺少可比较的评测。
        pain_en: Hand-drawn whiteboard explanations require frame-by-frame recording and retakes, making
          one lesson slow to produce and hard to reuse at scale; model output quality varies and comparable
          evaluation is scarce.
        current_alternative_zh: 老师用录屏软件手绘讲解，或用通用聊天模型生成文字讲稿再自己配图；评测方靠零散主观体验比较模型。
        current_alternative_en: Teachers hand-draw while screen-recording, or use general chat models
          for a text script and add visuals themselves; evaluators compare models through scattered subjective
          impressions.
        usage_reason_zh: 推断：相较手绘录屏，它把讲解直接生成为逐笔动画并支持回放，省去录制与重录这一步；相较纯文字讲稿，白板动画更接近课堂讲解形态，因此需要批量产出讲解的教师或做模型对比的评测者会试用。
        usage_reason_en: 'Inference: versus hand-drawn screen recording, it generates the explanation
          directly as stroke-by-stroke animation with playback, removing the record-and-retake step; versus
          text-only scripts, the whiteboard form is closer to classroom explanation, so teachers needing
          batch output or evaluators comparing models would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决讲解材料制作慢、难批量复用的问题，把知识点直接转成可回放的白板动画，痛点具体；但编辑与导出能力未核验。
        evidence_ids:
        - ev-2b0d2911dd722834
        - ev-1bde8c4c59db4b4c
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 549 缓慢升至 577，属关注度信号，不能证明教师已把它放进日常备课流程。
        evidence_ids:
        - ev-2b0d2911dd722834
        - ev-1bde8c4c59db4b4c
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或机构采购信息；买方可能是教辅机构或平台，这是判断而非已验证事实。
        evidence_ids:
        - ev-1bde8c4c59db4b4c
      - gate: truth
        status: insufficient
        reason: 白板动画是否真能替代老师讲解、生成内容准确性如何，缺少课堂使用或学生反馈证据。
        evidence_ids:
        - ev-2b0d2911dd722834
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有教师或机构报告实际用于备课、以及编辑导出需求。
