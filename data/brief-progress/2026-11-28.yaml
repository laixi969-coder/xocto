        job_en: ERP consultants or analysts checking procurement, inventory or finance data in S/4HANA
          let an AI assistant fetch it through read-only interfaces, then confirm manually before reporting.
        pain_zh: SAP 数据分散在 RFC/BAPI、OData 与公有云 API 中，手工导出或写报表耗时长；直接让 AI 连生产系统又担心误写和凭据外泄。
        pain_en: SAP data is scattered across RFC/BAPI, OData and public-cloud APIs; manual exports or
          report building are slow, while letting AI connect to production raises write-risk and credential-leak
          concerns.
        current_alternative_zh: 顾问手工跑事务码、导出 Excel 或由 IT 写定制报表；或干脆不让 AI 接触 ERP。
        current_alternative_en: Consultants run transaction codes and export Excel manually, or IT builds
          custom reports; or AI is simply kept away from ERP.
        usage_reason_zh: 推断：相较手工导出，它把查询动作交给 AI 助手并限定只读、逐次审计、凭据本地保存，减少了取数这一步的手工负担，也让 IT 更敢放行；因此需要频繁查 ERP
          数据又受合规约束的顾问与管理员会考虑它。
        usage_reason_en: 'Inference: versus manual exports, it hands querying to an AI assistant while
