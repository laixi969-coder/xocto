        pain_en: Manual cross-language rewrites are tedious and error-prone, carrying high risk of silent
          regressions without automated behavioral verification.
        current_alternative_zh: 人工编写对应的 Rust 模块并重写整套测试用例，或者使用通用生成式 AI 补全但需手动反复调试行为一致性。
