    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向使用 SAP S/4HANA 的企业：ERP 顾问或分析师在需要查采购、库存、财务数据时，让 AI 助手通过 RFC/BAPI、私有云 OData 或公有云已发布 API
      以只读方式查询，调用留痕、凭据留在本地，最终拿到查询结果，仍需人工确认后使用。具体查询范围与交付形态仍待核验。
    inspiration: 趋势：企业核心系统（ERP）正被拆成可被 AI 助手只读调用的数据接口，安全审计和凭据本地化成了准入门槛。切入：从 SAP 生态的咨询与运维服务商入手，把“只读、可审计的
      ERP 数据接入”做成交付物，按接入系统或审计合规收费；不要从通用助手正面打。
    summary_en: 'For companies running SAP S/4HANA: ERP consultants or analysts let an AI assistant query
      procurement, inventory or finance data read-only via RFC/BAPI, private-cloud OData or public-cloud
      released APIs, with every call audited and credentials kept local; results still need human confirmation.
      Exact query scope and delivery form remain to be verified.'
    inspiration_en: 'Trend: core enterprise systems (ERP) are being exposed as read-only data interfaces
      for AI assistants, with audit trails and local credentials becoming the entry bar. Entry: start
      with SAP consulting and managed-service firms, packaging auditable read-only ERP access as a deliverable
      billed per connected system or compliance audit; do not attack generic assistants head-on.'
    req_initial:
