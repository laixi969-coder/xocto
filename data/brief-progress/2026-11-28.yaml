    inspiration: 趋势：三维建模正从重型CAD套件向“草图即体块”的轻量入口迁移，MCP接口说明有人想让AI代理直接调用建模动作。切入：从工业设计与创客的早期概念环节进入，卖按导出模型或按项目计费的结果，而不是卖席位；先解决草图到可编辑体块这一步，别一上来做完整CAD。
