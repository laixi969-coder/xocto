    open_source: true
    summary_zh: 面向巴西本地商家获客的自由职业者和小代理机构：他们原本要在 Google Maps 逐个找没有网站的小店，再手工做样例页、发 WhatsApp 报价。garimpo 自动检索商家、按店名生成预览网站，接入
      WhatsApp 对话并用 Pix、Mercado Pago 或 Stripe 收款，成交后流程自动结束；人工仍需确认商家意向与站点内容。
    inspiration: 趋势：本地小商家建站这类低客单服务正被拆成“找线索—出样例—收款”的可自动化流水线。切入：从巴西等 Pix 即时支付普及、WhatsApp 为商务主渠道的市场进入，按成交或按线索收费，而非卖软件席位；壁垒在本地商家数据与支付通道，不在模型。
    summary_en: 'For freelancers and small agencies selling websites to Brazilian local merchants: they
      used to hunt Google Maps for shops without sites, hand-build sample pages and quote over WhatsApp.
      garimpo automatically finds businesses, generates a preview site named after each, runs WhatsApp
      conversations and collects payment via Pix, Mercado Pago or Stripe, closing the loop after payment;
      humans still confirm merchant intent and site content.'
    inspiration_en: 'Trend: low-ticket local website building is being split into an automatable pipeline
      of lead finding, sample generation and payment collection. Entry: start in markets like Brazil where
      instant Pix payments and WhatsApp commerce are standard, charging per closed deal or per lead rather
      than per seat; the moat is local merchant data and payment rails, not the model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自由职业建站者或小代理机构在开发本地商家客户时，从地图检索无网站的小店，生成带店名的预览站，通过 WhatsApp 报价并收款，完成从线索到成交的初步转化。
        job_en: Freelance web builders or small agencies prospecting local merchants search maps for shops
          without websites, generate a named preview site, quote and collect payment via WhatsApp, completing
          the lead-to-sale step.
        pain_zh: 逐个在 Google Maps 找无网站商家、手工做样例页、反复在 WhatsApp 报价催款，环节多且重复，单个小商家客单低，人工成本容易吃掉利润。
        pain_en: Finding businesses without sites one by one on Google Maps, hand-building sample pages
          and repeatedly quoting and chasing payment on WhatsApp is repetitive and multi-step; with low
          ticket sizes, manual cost easily eats the margin.
        current_alternative_zh: 自由职业者用表格记录线索、用建站工具手工搭样例、在 WhatsApp 里逐条沟通并线下或转账收款。
        current_alternative_en: Freelancers track leads in spreadsheets, hand-build samples with site
          builders, chat one by one on WhatsApp and collect payment by transfer or in person.
        usage_reason_zh: 相较手工找线索和搭样例，garimpo 把检索商家、按店名生成预览站、WhatsApp 沟通与 Pix 等收款串成一条自动流程，减少逐条复制和催款步骤；推断会吸引客单低、需大量触达的巴西本地建站者，但成交质量与商家接受度尚无公开证据。
        usage_reason_en: Compared with manual lead hunting and sample building, garimpo chains business
          search, named preview generation, WhatsApp outreach and Pix-style payment into one automated
          flow, cutting copy-paste and payment-chasing steps; inference suggests it appeals to Brazilian
          local web builders with low tickets and high outreach volume, though deal quality and merchant
          acceptance lack public evidence.
      gates:
      - gate: value
        status: supported
        reason: 它解决本地建站者找线索、出样例、报价收款多环节重复的问题，旧流程人工成本高，结构上成立，属工作流推理。
        evidence_ids:
        - ev-37f8dcb3f534dd51
        - ev-97b14b8724e3aaae
      - gate: consensus
