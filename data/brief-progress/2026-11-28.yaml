    summary_zh: 开发者在编码助手（Claude Code、Codex）里提交改动前打开该插件，它接收源代码并运行大模型驱动的静态安全审查，输出可读的缺陷清单；是否修复与合并仍由开发者或安全评审人确认。具体规则覆盖范围与误报处理流程仍待核验。
