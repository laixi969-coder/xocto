          demographic and economic data ask an AI assistant in natural language; the server queries the
          INE API and returns statistics for citation, with manual checking of definitions still required.
        pain_zh: INE 官网需要逐层找表、下载文件并自行整理，跨指标比对耗时且容易用错口径；不解决则取数慢、引用来源难追溯。
