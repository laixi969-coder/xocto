  pennsylvania-will-require-labels-on-ai-generated-ads:
    slug: pennsylvania-will-require-labels-on-ai-generated-ads
    name: Pennsylvania Artificial Intelligence Deceptive Advertising Act
    decision: market_context
    summary_zh: 宾夕法尼亚州州长 Josh Shapiro 于 2026 年 10 月签署《人工智能欺骗性广告法》，要求任何经 AI 显著修改或生成的广告（图像、视频、音频或文本）以与广告相同的形式加注标签，覆盖大企业电视广告与本地小商户传单，且不限于广告投放地。这是美国首批要求
      AI 内容披露的州级立法之一，意味着 AI 生成营销素材的交付需内置标注与合规流程，广告主与生成工具供应商面临新增合规成本（推断）。
    summary_en: Pennsylvania Governor Josh Shapiro signed the Artificial Intelligence Deceptive Advertising
      Act in October 2026, requiring any ad significantly modified or generated by AI, whether image,
      video, audio, or text, to carry a label in the same format as the ad itself. It covers TV commercials
      from large companies and local small-business flyers alike, regardless of where the ad runs. As
      one of the first state laws mandating AI content disclosure, it means AI-generated marketing assets
      must build labeling and compliance into delivery, adding compliance costs for advertisers and generative
      tool vendors (inference).
    event_summary_zh: 宾夕法尼亚州州长 Josh Shapiro 签署《人工智能欺骗性广告法》，要求经 AI 显著修改或生成的图像、视频、音频或文本广告以相同形式加注披露标签。
    event_summary_en: Pennsylvania Governor Josh Shapiro signed the Artificial Intelligence Deceptive
      Advertising Act, requiring image, video, audio, or text ads significantly modified or generated
      by AI to carry a disclosure label in the same format as the ad.
