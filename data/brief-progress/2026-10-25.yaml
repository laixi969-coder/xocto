    summary_zh: Minuttia 于 2026 年 10 月发布研究称，AI 搜索引用的“最佳工具”榜单中最多有一半由厂商自己撰写。这意味着 AI 搜索的答案来源存在利益冲突，用户获取工具信息的可信度下降，依赖第三方评测的采购与选型流程需要重新评估引用来源。
    summary_en: In October 2026 Minuttia published a study finding that up to half of the 'best tools'
      lists cited by AI search are written by the vendors themselves. This means AI search answers carry
      a conflict-of-interest risk, reducing trust in the tool information users receive and forcing buying
      and selection processes that rely on third-party reviews to reassess their cited sources.
    event_summary_zh: Minuttia 发布研究，发现 AI 搜索引用的“最佳工具”榜单中最多一半由厂商自行撰写。
