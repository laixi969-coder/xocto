  forced-to-pick-groks-ai-model-chooses-republicans-openais-pi:
    slug: forced-to-pick-groks-ai-model-chooses-republicans-openais-pi
    name: Grok
    decision: market_context
    summary_zh: 2026年10月一项研究显示，在近500场选举中，Grok 与 OpenAI 的 GPT 对候选人的推荐存在超过90%的分歧，Grok 明显偏向共和党候选人，GPT 偏向民主党候选人。该事实表明通用大模型在政治类推荐上存在系统性倾向差异，对依赖模型输出做公共信息分发的应用构成可信度与合规风险；这是推断，材料未涉及具体产品调整。
    summary_en: An October 2026 study found that across nearly 500 election races, Grok and OpenAI's GPT
      disagreed on candidate recommendations in more than 90% of cases, with Grok leaning toward Republican
      candidates and GPT toward Democratic ones. This indicates systematic differences in political recommendation
      tendencies among general-purpose models, posing credibility and compliance risks for applications
      that distribute public information based on model output; this is an inference, as the material
      does not describe any specific product change.
    event_summary_zh: 2026年10月公布的一项研究称，在近500场选举中，Grok 与 OpenAI 的 GPT 对候选人的推荐分歧超过90%，前者偏向共和党、后者偏向民主党。
    event_summary_en: A study published in October 2026 reported that across nearly 500 election races,
      Grok and OpenAI's GPT disagreed on candidate recommendations in more than 90% of cases, with the
      former leaning Republican and the latter Democratic.
