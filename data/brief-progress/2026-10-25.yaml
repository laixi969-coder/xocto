  cio:
    slug: cio
    name: Meta
    decision: market_context
    summary_zh: Meta 在 2026 年 10 月修改企业 AI 合同条款，规定其 AI 出错时法律责任由客户承担。这一责任转移降低了供应商的合规与赔付风险，但把 AI 应用的责任成本推给企业客户，可能影响企业采购与部署
      AI 的意愿，并推动同类供应商在合同条款上跟进（推断）。
    summary_en: In October 2026 Meta revised its enterprise AI contract terms so that legal liability
      for AI errors falls on the customer. The shift lowers the vendor's compliance and indemnity exposure
      but pushes the cost of AI liability onto enterprise customers, which may affect their willingness
      to procure and deploy AI and could prompt similar vendors to follow on contract terms (inference).
    event_summary_zh: Meta 在新企业合同中规定，其 AI 出错时法律责任由客户承担。
    event_summary_en: Meta's new enterprise contract states that legal responsibility for its AI's mistakes
      lies with the customer.
