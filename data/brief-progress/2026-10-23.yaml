      AI 负载展开，但材料未给出具体产品、客户或出货数据，影响仍属方向性判断（推断）。
    summary_en: An October 2026 report says that with the next general-purpose computing product yet to
      emerge, the RISC-V architecture is prioritizing AI scenarios for growth. For AI applications this
      suggests chip and instruction-set supply may increasingly be organized around AI workloads, but
      the material provides no specific products, customers or shipment data, so the impact remains a
      directional inference.
    event_summary_zh: 有报道称，在下一个通用计算产品尚未出现的情况下，RISC-V 正优先在 AI 场景中寻找增长点。
