  your-next-customer-might-be-an-agent-heres-how-to-build-your:
    slug: your-next-customer-might-be-an-agent-heres-how-to-build-your
    name: AI agent commerce
    decision: market_context
    summary_zh: 2026 年，品牌开始同时面向人类消费者和代为搜索、比价并下单的 AI 智能体两类客户；智能体可能在人类看到商品页之前就完成购买决策，这意味着品牌需要让商品信息可被机器解析。该变化对
      AI 应用意味着电商与营销环节的智能体采用正在扩大，品牌的内容与数据交付方式需要同时适配机器读者。
    summary_en: 'In 2026, brands are beginning to sell to two customer bases at once: humans and AI agents
      that search, compare and purchase on their behalf. Agents may make purchasing decisions before a
      human ever sees a product page, which means brands need product information that machines can parse.
      For AI applications, this implies growing agent adoption in e-commerce and marketing, and brand
      content and data delivery must serve machine readers as well as people.'
    event_summary_zh: 有观点指出，2026 年品牌面对的第二类客户是代为搜索和购买的 AI 智能体，智能体可能在人类看到商品页前就做出购买决策。
    event_summary_en: A commentary notes that in 2026 brands face a second customer base of AI agents
      that search and buy on consumers' behalf, and agents may decide purchases before a human sees the
      product page.
