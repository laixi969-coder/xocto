  10年期美债收益率跌回500ai资本开支退潮成债市另类量化宽松:
    slug: 10年期美债收益率跌回500ai资本开支退潮成债市另类量化宽松
    name: 10年期美债收益率跌回5.00%，AI资本开支退潮成债市"另类量化宽松"
    decision: market_context
    summary_zh: 10年期美债收益率跌回5.00%，报道将其与AI资本开支退潮联系起来，视为债市的"另类量化宽松"。若AI资本开支确实放缓，可能降低AI基础设施与应用端的投入强度，进而影响AI服务的成本结构与竞争节奏；但材料仅给出标题式判断，未提供资本开支数据，相关影响为推断。
    summary_en: The 10-year US Treasury yield fell back to 5.00%, and the report links this to a pullback
      in AI capital expenditure, describing it as an "alternative quantitative easing" for the bond market.
      If AI capex is indeed slowing, it could reduce investment intensity in AI infrastructure and applications,
      affecting the cost structure and competitive pace of AI services; however, the material offers only
      a headline-level claim without capex data, so this impact is inferred.
    event_summary_zh: 10年期美债收益率跌回5.00%，报道将AI资本开支退潮描述为债市的"另类量化宽松"。
    event_summary_en: The 10-year US Treasury yield fell back to 5.00%, with the report describing a pullback
      in AI capital expenditure as "alternative quantitative easing" for the bond market.
