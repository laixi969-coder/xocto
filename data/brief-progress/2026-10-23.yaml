  hackers-got-a-four-day-head-start-on-epic-php2shell-vulnerab:
    slug: hackers-got-a-four-day-head-start-on-epic-php2shell-vulnerab
    name: PHP2Shell
    decision: market_context
    summary_zh: 2026年10月，亚马逊披露，借助 AI 工具发现的一处编程语言漏洞在公开披露前四天即被攻击者尝试利用，并称该漏洞已在野被广泛利用，各国政府与企业正紧急修补。这意味着 AI
      辅助漏洞发现正在压缩从发现到利用的时间窗口，对依赖该语言构建的 AI 应用而言，安全修补与交付节奏将更受制于上游基础设施风险（推断）。
    summary_en: In October 2026, Amazon disclosed that a programming-language vulnerability found with
      AI tools was exploited by attackers four days before public disclosure, and said the flaw is now
      being broadly exploited in the wild as governments and companies rush to patch. This means AI-assisted
      vulnerability discovery is compressing the window between discovery and exploitation; for AI applications
      built on that language, security patching and delivery cadence will be more constrained by upstream
      infrastructure risk (inference).
    event_summary_zh: 亚马逊表示，借助 AI 工具发现的一处编程语言漏洞在公开披露前四天已有攻击者尝试利用，并称该漏洞目前已在野被广泛利用。
    event_summary_en: Amazon said a programming-language vulnerability discovered with AI tools was already
      being exploited by attackers four days before public disclosure, and that the flaw is now being
      broadly exploited in the wild.
