    name: Minuttia
    decision: market_context
    summary_zh: Minuttia 于 2026 年 10 月发布研究称，AI 搜索引用的“最佳工具”榜单中最多有一半由工具厂商自己撰写；这意味着 AI 搜索的答案来源存在利益冲突，用户对推荐结果的信任成本上升，也促使
      AI 搜索产品在引用来源审核与内容质量上加强竞争。
    summary_en: Minuttia published a study in October 2026 finding that up to half of the 'best tools'
      lists cited by AI search are written by the vendors themselves; this means AI search answers draw
      on sources with conflicts of interest, raising the trust cost for users and pushing AI search products
      to compete on citation vetting and content quality.
    event_summary_zh: Minuttia 发布研究，发现 AI 搜索引用的“最佳工具”榜单中最多有一半由厂商自行撰写。
