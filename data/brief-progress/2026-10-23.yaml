  ai-到处挖漏洞一整年终于给人类爆了个大的:
    slug: ai-到处挖漏洞一整年终于给人类爆了个大的
    name: PHP2Shell
    decision: market_context
    summary_zh: 2026年8月，安全公司 Calif 在 OpenAI「Patch the Planet」项目下使用 GPT-5.6 Sol 审计 PHP 内核，发现两个内存管理漏洞（合称
      PHP2Shell，官方评分 9.2）；Wiz 同期借助 Gemini 4 Argon 与 GPT-5.6 Sol 独立发现同一漏洞。10月20日漏洞信息提前泄露，PHP 官方将补丁提前至10月21日发布，芬兰、荷兰、法国、德国、比利时等多国政府机构在补丁发布前后预防性下线网站。该事件表明，低成本模型已能把过去需要数周手工调试的漏洞挖掘压缩到数天，开源基础设施的安全审计成本与周期显著下降，同时也意味着漏洞披露节奏和应急下线将成为更频繁的运维负担（推断）。
    summary_en: In August 2026, security firm Calif used GPT-5.6 Sol under OpenAI's Patch the Planet program
      to audit the PHP core and found two memory-management flaws collectively called PHP2Shell (rated
      9.2 by PHP); Wiz independently found the same flaws using Gemini 4 Argon and GPT-5.6 Sol. After
      details leaked on October 20, PHP moved its patch release up to October 21, and government agencies
      in Finland, the Netherlands, France, Germany and Belgium took sites offline preventively around
      the patch. The episode shows cheaper models compressing vulnerability discovery that once took weeks
      of manual debugging into days, lowering the cost and cycle time of security audits for open-source
      infrastructure, while making disclosure scrambles and emergency takedowns a more frequent operational
      burden (inference).
    event_summary_zh: Calif 与 Wiz 分别借助 GPT-5.6 Sol、Gemini 4 Argon 等模型独立发现 PHP 核心的 PHP2Shell 漏洞，PHP 官方于10月21日提前发布补丁，多国政府机构预防性下线网站。
    event_summary_en: Calif and Wiz independently discovered the PHP2Shell flaws in the PHP core using
      models including GPT-5.6 Sol and Gemini 4 Argon; PHP released a patch early on October 21, and several
      governments took sites offline preventively.
