    slug: nvidia-transforms-european-retail-from-digital-discovery-to
    name: NVIDIA
    decision: market_context
    summary_zh: NVIDIA 于 2026 年 10 月披露欧洲零售客户案例：Shopify 基于 Nemotron 3.5 Lightning 后训练出 Sidekick 的 GraphQL
      子代理，内部基准显示准确率超过某前沿模型，服务成本降低 90%、响应快 7 倍；另有推理优化软件在五个用例中实现最高 12 倍推理成本下降。这表明开放模型后训练与推理优化正在压低 AI 应用的单位成本，但材料仅覆盖个别客户案例，不能据此推断整个零售行业已转向。
    summary_en: 'In October 2026 NVIDIA disclosed European retail customer cases: Shopify post-trained
      Nemotron 3.5 Lightning for a Sidekick GraphQL subagent, reporting on its internal benchmark higher
      accuracy than a leading frontier model, 90% lower serving cost and 7x faster responses; separate
      inference optimization software delivered up to 12x lower inference cost across five use cases.
      This shows open-model post-training and inference optimization are lowering unit costs for AI applications,
      but the material covers only individual customer cases and does not support concluding that retail
      as a whole has shifted.'
    event_summary_zh: NVIDIA 公布欧洲零售案例：Shopify 后训练 Nemotron 3.5 Lightning 用于 Sidekick 子代理，称服务成本降低 90%、响应快
      7 倍，另有推理优化在五个用例中实现最高 12 倍成本下降。
    event_summary_en: 'NVIDIA published European retail cases: Shopify post-trained Nemotron 3.5 Lightning
      for a Sidekick subagent, claiming 90% lower serving cost and 7x faster responses, while inference
      optimization delivered up to 12x lower cost across five use cases.'
