  ainews-openais-patch-the-planet-program-is-1-of-2-parties-to:
    slug: ainews-openais-patch-the-planet-program-is-1-of-2-parties-to
    name: OpenAI Patch the Planet
    decision: market_context
    summary_zh: 2026年8月，OpenAI 的 Patch the Planet 项目资助安全公司 Calif 使用 GPT-5.6 Sol 审计 PHP 内核，与 Wiz 各自独立发现
      PHP2Shell 漏洞；此前 OpenAI 还推出面向一线防御者的 Daybreak，提供 10 亿美元补贴以获取其网络安全模型与产品。这表明模型厂商正以补贴方式把 AI 引入关键开源软件的安全审计，漏洞发现供给增加、披露与修复的协同压力上升（推断）。
    summary_en: In August 2026, OpenAI's Patch the Planet program funded security firm Calif to audit
      the PHP core with GPT-5.6 Sol, which independently found the PHP2Shell flaws alongside Wiz; OpenAI
      had earlier introduced Daybreak for frontline defenders with a $1 billion subsidy for access to
      its cyber models and products. This shows model vendors subsidizing AI-driven security audits of
      critical open-source software, increasing the supply of vulnerability discoveries and the coordination
      pressure around disclosure and patching (inference).
    event_summary_zh: OpenAI 的 Patch the Planet 项目资助 Calif 使用 GPT-5.6 Sol 审计 PHP 内核并发现 PHP2Shell 漏洞；此前
      OpenAI 已推出面向一线防御者的 Daybreak，并提供 10 亿美元补贴。
    event_summary_en: OpenAI's Patch the Planet program funded Calif to audit the PHP core with GPT-5.6
      Sol, leading to the PHP2Shell discovery; OpenAI had earlier launched Daybreak for frontline defenders
      with a $1 billion subsidy.
  ais-hidden-storage-bill-what-inference-leaves-behind:
    slug: ais-hidden-storage-bill-what-inference-leaves-behind
    name: AI 推理存储成本
    decision: market_context
    summary_zh: 2026年10月，西部数据公布内部测量：一段返回给用户的 8 秒 720p 视频（3.97MB）在后端留下超过 500MB 的关联数据，包括日志、缓存上下文和中间渲染结果。该数据说明推理持续运行会不断累积存储开销，AI
      应用的成本规划不能只看 GPU 算力，存储与数据治理将成为交付成本的一部分（推断）。
    summary_en: In October 2026, Western Digital published internal measurements showing that an 8-second
      720p clip returned to a user (3.97MB) left more than 500MB of associated back-end data, including
      logs, cached context and intermediate renders. The data indicates that continuously running inference
      keeps accumulating storage overhead, so AI cost planning cannot focus on GPU compute alone; storage
      and data governance become part of delivery cost (inference).
    event_summary_zh: 西部数据公布内部测量，一段 8 秒 720p 视频（3.97MB）在后端留下超过 500MB 的日志、缓存上下文和中间渲染等关联数据。
    event_summary_en: Western Digital published internal measurements showing an 8-second 720p clip (3.97MB)
      leaves more than 500MB of associated back-end data such as logs, cached context and intermediate
      renders.
