  浙江省工业智能体平台建设指南试行印发包含基础设施核心引擎智能体构建应用交互四大核心模块:
    slug: 浙江省工业智能体平台建设指南试行印发包含基础设施核心引擎智能体构建应用交互四大核心模块
    name: 浙江省工业智能体平台建设指南（试行）
    decision: market_context
    summary_zh: 浙江省于2026年10月印发《浙江省工业智能体平台建设指南（试行）》，将工业智能体平台划分为基础设施、核心引擎、智能体构建、应用交互四大核心模块。这是地方层面对工业智能体平台架构的规范性文件，意味着工业智能体的建设从企业自发探索转向有统一模块划分的参考框架，供应商的产品设计需对齐该结构，采购与验收也可能以此为依据；对AI应用而言，标准化降低了工业客户的选型与集成成本，但也提高了平台在基础设施与引擎层的合规门槛。
    summary_en: 'Zhejiang province issued the Trial Guidelines for Building Industrial Agent Platforms
      in October 2026, dividing such platforms into four core modules: infrastructure, core engine, agent
      construction and application interaction. The local policy gives industrial agents a standardized
      reference architecture, shifting deployment from ad hoc enterprise experiments toward a common module
      structure that vendors must align with and that may inform procurement and acceptance; for AI adoption
      it lowers selection and integration costs for industrial customers while raising compliance requirements
      at the infrastructure and engine layers.'
    event_summary_zh: 浙江省印发《浙江省工业智能体平台建设指南（试行）》，明确工业智能体平台包含基础设施、核心引擎、智能体构建、应用交互四大核心模块。
    event_summary_en: 'Zhejiang province issued the Trial Guidelines for Building Industrial Agent Platforms,
      specifying four core modules for industrial agent platforms: infrastructure, core engine, agent
      construction and application interaction.'
