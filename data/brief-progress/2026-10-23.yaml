  designing-an-ai-serving-harness-built-to-last:
    slug: designing-an-ai-serving-harness-built-to-last
    name: AI serving harness
    decision: market_context
    summary_zh: 2026 年 10 月 22 日的分析文章指出，企业 AI 的竞争重点正从模型能力转向模型周边的服务工程系统，包括架构、内存管理、调度与优化；文章认为这决定了智能能否可靠、经济、规模化地交付，并主张投资应围绕具体工作负载而非模型选择展开。这意味着
      AI 应用的交付成本与可靠性将更多取决于服务层工程，而非单次模型发布。
    summary_en: An analysis published on October 22, 2026 argues that enterprise AI competition is shifting
      from model capability to the serving harness around the model, including architecture, memory management,
      scheduling and optimization; it says this determines whether intelligence can be delivered reliably,
      economically and at scale, and that investment should follow the workload rather than the model
      choice. This implies AI application delivery cost and reliability will depend more on serving-layer
      engineering than on any single model release.
    event_summary_zh: 一篇分析文章提出，企业 AI 的竞争优势正从模型选择转向模型周边的服务工程系统，包括架构、内存管理、调度与优化决策。
    event_summary_en: An analysis argues that enterprise AI advantage is shifting from model choice to
      the serving harness around the model, including architecture, memory management, scheduling and
      optimization decisions.
  donating-agent-skills-to-the-agentic-ai-foundation:
    slug: donating-agent-skills-to-the-agentic-ai-foundation
    name: Agent Skills
    decision: market_context
    summary_zh: 2026 年 10 月 22 日，Anthropic 宣布将 Agent Skills 标准捐赠给 Linux 基金会下的 Agentic AI Foundation（AAIF），该基金会由
      Anthropic 与 Block、OpenAI 共同创立，此前已接收 Model Context Protocol。此举将智能体技能规范转为厂商中立的开放标准，可能降低跨厂商智能体工具与技能生态的碎片化，影响
      AI 应用的互操作与集成成本。
    summary_en: On October 22, 2026, Anthropic announced it is donating the Agent Skills standard to the
      Agentic AI Foundation (AAIF) under the Linux Foundation, which Anthropic co-founded with Block and
      OpenAI and which previously received the Model Context Protocol. The move turns the agent skills
      specification into a vendor-neutral open standard, potentially reducing fragmentation across vendors'
      agent tooling and skill ecosystems and affecting interoperability and integration costs for AI applications.
    event_summary_zh: Anthropic 宣布将 Agent Skills 标准捐赠给 Linux 基金会下的 Agentic AI Foundation，使其成为厂商中立的开放标准。
    event_summary_en: Anthropic announced it is donating the Agent Skills standard to the Agentic AI Foundation
      under the Linux Foundation, making it a vendor-neutral open standard.
