    name: NVIDIA DSX POD
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: 英伟达在柏林GTC上发布DSX POD模块化AI工厂参考设计，由7个液冷机架组成、采用800V直流供电，戴尔、HPE、联想、鸿海等参与制造，预计2027年初交付，官方称现场条件就绪时部署时间可从约6个月缩短至最快14天；同时发布DSX
