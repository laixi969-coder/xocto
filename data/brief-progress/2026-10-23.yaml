      months to as fast as 14 days when site power and cooling are ready, alongside DSX MaxLPS and DSX
      Flex power-management tools.
  欧洲-ai等来了黄仁勋-2:
    slug: 欧洲-ai等来了黄仁勋-2
    name: NVIDIA OpenShell
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: 英伟达在柏林GTC上发布OpenShell企业参考架构，将6月推出的开源策略控制运行时部署到Vera Rubin GPU、Vera CPU与BlueField-4
      DPU全栈硬件上，由Sentry安全框架在DPU侧隔离越界智能体；ServiceNow已可基于该架构制定并撤销智能体权限，Anthropic、OpenAI、微软、谷歌云、AWS、SAP等列入合作名单。
    event_summary_en: At GTC Berlin, NVIDIA released the OpenShell enterprise reference architecture,
      deploying its June open-source policy-controlled runtime across Vera Rubin GPUs, Vera CPUs and BlueField-4
      DPUs, with the Sentry security framework isolating out-of-bounds agents on the DPU; ServiceNow can
      already define and revoke agent permissions on the architecture, with Anthropic, OpenAI, Microsoft,
      Google Cloud, AWS and SAP among partners.
