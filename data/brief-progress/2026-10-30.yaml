  sap-replaces-pricey-ai-models-with-more-affordable-alternati:
    slug: sap-replaces-pricey-ai-models-with-more-affordable-alternati
    name: SAP
    decision: market_context
    summary_zh: SAP 于 2026 年 10 月将成本高昂的 AI 模型替换为更便宜的替代方案，并称目标实现超过 20 亿欧元的效率提升。这表明企业级 AI 部署正从追求最强模型转向成本优化，可能压低单次调用成本并改变模型供应商之间的竞争格局；对行业整体转向的判断仍属推断。
    summary_en: In October 2026 SAP replaced costly AI models with cheaper alternatives and said it targets
      more than EUR 2 billion in efficiency gains. This indicates enterprise AI deployment is shifting
      from pursuing the most capable models toward cost optimization, which could lower per-call costs
      and reshape competition among model providers; any claim of an industry-wide shift remains an inference.
    event_summary_zh: SAP 将成本高昂的 AI 模型替换为更便宜的替代方案，目标实现超过 20 亿欧元的效率提升。
    event_summary_en: SAP swapped costly AI models for cheaper alternatives and targets more than EUR
      2 billion in efficiency gains.
