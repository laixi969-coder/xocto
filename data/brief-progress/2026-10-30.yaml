  aws-will-be-a-1t-business-jassy-says-but-first-it-will-spend:
    slug: aws-will-be-a-1t-business-jassy-says-but-first-it-will-spend
    name: Amazon Web Services
    decision: market_context
    summary_zh: 亚马逊 CEO Jassy 于 2026 年 10 月 29 日表示 AWS 目标成为万亿美元收入业务，并称需继续大规模资本开支以争夺 AI 云计算主导地位。这释放出头部云厂商持续加码
      AI 算力投入的信号，可能推高行业算力供给与竞争强度；对 AI 应用成本与交付的具体影响材料未量化，属推断。
    summary_en: On October 29, 2026, Amazon CEO Jassy said AWS aims to become a $1 trillion revenue business
      and that continued large capital spending is needed to compete for AI cloud leadership. This signals
      sustained AI compute investment by a leading cloud provider and may raise industry compute supply
      and competitive intensity; the material does not quantify effects on AI application costs or delivery,
      which is an inference.
    event_summary_zh: 亚马逊 CEO Jassy 表示 AWS 目标成为万亿美元收入业务，并称需继续大规模资本开支以争夺 AI 云计算主导地位。
    event_summary_en: Amazon CEO Jassy said AWS aims to become a $1 trillion revenue business and that
      continued large capital spending is needed to compete for AI cloud leadership.
  aws收入劲增39但ai支出吓退市场亚马逊q3自由现金流恶化线上销售乏力盘后跳水-财报见闻:
    slug: aws收入劲增39但ai支出吓退市场亚马逊q3自由现金流恶化线上销售乏力盘后跳水-财报见闻
    name: Amazon Web Services
    decision: market_context
    summary_zh: 亚马逊 2026 年第三季度 AWS 收入同比增长 39%，为近五年最高增速，但 AI 相关支出引发市场担忧，自由现金流恶化，盘后股价下跌。这显示 AI 云需求强劲与资本开支压力并存，可能加剧云厂商在算力投入与盈利之间的权衡；对
      AI 应用定价与交付的影响材料未给出，属推断。
    summary_en: In Amazon's third quarter of 2026, AWS revenue grew 39% year over year, its fastest in
      nearly five years, but AI-related spending worried the market, free cash flow deteriorated, and
      the stock fell after hours. This shows strong AI cloud demand alongside capital expenditure pressure,
      potentially sharpening cloud providers' trade-off between compute investment and profitability;
      the material gives no effect on AI application pricing or delivery, which is an inference.
