  series-b-funding-is-up-but-fewer-deals-are-getting-done:
    slug: series-b-funding-is-up-but-fewer-deals-are-getting-done
    name: U.S. Series B startup funding
    decision: market_context
    summary_zh: 2026 年美国 B 轮融资总额约 480 亿美元，为多年来最高，但交易数量低于上年并可能创多年新低；单笔低于 3000 万美元的轮次占比从 2021 至 2025 年约一半降至不足三分之一，而至少
      110 家公司完成 1 亿美元以上 B 轮。资本向少数 AI 公司集中，意味着中小 AI 创业公司融资更难、竞争更依赖头部资源；对 AI 应用交付节奏的影响属推断。
    summary_en: U.S. Series B funding totaled about $48 billion in 2026, the highest in years, while deal
      counts fell below year-ago levels and are on track for a multiyear low; rounds under $30 million
      dropped from about half of deals in 2021-2025 to under a third, while at least 110 companies raised
      $100 million or more. Capital is concentrating around a handful of AI companies, meaning smaller
      AI startups face harder fundraising and competition increasingly favors well-funded leaders; effects
      on AI application delivery pace are an inference.
    event_summary_zh: 2026 年美国 B 轮融资约 480 亿美元，为多年来最高，但交易数量低于上年并可能创多年新低；小额轮次占比大幅下降，至少 110 家公司完成 1 亿美元以上
      B 轮。
    event_summary_en: U.S. Series B funding reached about $48 billion in 2026, the highest in years, but
      deal counts fell below year-ago levels and are on track for a multiyear low; small rounds shrank
      sharply while at least 110 companies raised $100 million or more.
