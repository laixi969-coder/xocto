    name: robot imports national security proclamation
    decision: market_context
    summary_zh: 美国总统特朗普于 2026 年 10 月 28 日发布公告，将外国制造的工业机器人进口列为国家安全威胁，下令与贸易伙伴展开新谈判，并保留未来加征关税的可能；依赖此类机器人的通用汽车、福特、特斯拉、波音和洛克希德·马丁等企业制造运营可能受扰，机器人供应链成本与采购不确定性上升（推断）。
    summary_en: On October 28, 2026, US President Donald Trump issued a proclamation declaring imports
      of foreign-made industrial robots a national security threat, ordering new negotiations with trading
      partners and holding out the possibility of future tariffs; manufacturing operations of companies
      relying on such robots, including General Motors, Ford, Tesla, Boeing and Lockheed Martin, could
      be disrupted, raising supply-chain cost and procurement uncertainty for robotics (inference).
