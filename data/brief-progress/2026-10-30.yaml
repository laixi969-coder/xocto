      MoE experts.
  google-ai-gets-cagey-when-asked-who-won-the-2020-elections:
    slug: google-ai-gets-cagey-when-asked-who-won-the-2020-elections
    name: Google AI Mode
    decision: market_context
    summary_zh: 2026年10月，有用户测试发现 Google AI Mode 在被问及2020年和2024年美国总统选举获胜者时，不再直接给出答案，而是引导用户查阅联邦选举委员会等外部来源，但对更早的历次选举仍能给出详细回答。这一变化表明，生成式搜索产品在政治敏感事实上开始采取回避式回答策略，可能降低用户对AI直接问答的信任，并推动用户转向原始来源核实，进而影响AI搜索在信息类查询中的采用与竞争定位。
    summary_en: In October 2026, user testing found that Google AI Mode no longer answers directly when
      asked who won the 2020 and 2024 US presidential elections, instead directing users to outside sources
      such as the Federal Election Commission, while still giving detailed answers for earlier elections.
      The change shows generative search products adopting evasive answer strategies on politically sensitive
      facts, which may reduce user trust in direct AI answers and push users toward primary sources, affecting
      adoption and competitive positioning of AI search for informational queries.
    event_summary_zh: 2026年10月，用户测试显示 Google AI Mode 对2020年和2024年美国总统选举获胜者的问题给出回避性回答，要求用户查阅联邦选举委员会等外部来源，而对更早的选举仍能直接作答。
    event_summary_en: In October 2026, user testing showed Google AI Mode gave evasive answers on who
      won the 2020 and 2024 US presidential elections, directing users to outside sources such as the
      Federal Election Commission, while still answering directly for earlier elections.
