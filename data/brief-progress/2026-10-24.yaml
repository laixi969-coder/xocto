    name: AI-assisted retro game decompilation and recompilation
    decision: market_context
    summary_zh: 2026 年 10 月，借助新 AI 工具，复古游戏的反编译与重编译移植项目在浏览器、手机和混合现实等平台频繁出现并走红；报道同时指出这类项目正在冲击原有的游戏保存社区。这表明
      AI 降低了逆向工程与跨平台移植的门槛，使个人爱好者能更快交付移植作品，但也带来社区协作与版权治理方面的摩擦（后者为推断）。
    summary_en: In October 2026, new AI tools drove a surge of retro-game decompilation and recompilation
      ports appearing and going viral on browsers, phones and mixed reality; the report also notes these
      projects are straining established game-preservation communities. This shows AI lowering the barrier
      to reverse engineering and cross-platform porting, letting hobbyists ship ports faster, while creating
      friction around community collaboration and rights governance (the latter is inference).
    event_summary_zh: 报道称，过去一个月里借助新 AI 工具，复古游戏反编译与重编译移植项目在浏览器、iPhone 和混合现实等平台频繁走红，同时冲击了游戏保存社区。
    event_summary_en: The report says that over the past month new AI tools have made retro-game decompilation
      and recompilation ports go viral frequently on browsers, iPhone and mixed reality, while disrupting
      game-preservation communities.
