    name: GPT-6
    decision: market_context
    summary_zh: 有报道称 GPT-6 在 COBOL 迁移任务上达到 97.9% 的准确率，若属实，将把企业遗留系统迁移的瓶颈从代码改写转向企业内部的流程与数据治理，可能降低大型机现代化项目的交付成本。该数据来自单一报道，尚不足以推断整个企业软件迁移市场已经转向。
    summary_en: Reports claim GPT-6 reached 97.9% accuracy on COBOL migration tasks; if accurate, this
      would shift the bottleneck in legacy system migration from code rewriting to enterprise process
      and data governance, potentially lowering delivery costs for mainframe modernization projects. The
      figure comes from a single report and is not sufficient to conclude that the entire enterprise software
      migration market has shifted.
    event_summary_zh: 有报道称 GPT-6 在 COBOL 迁移任务上达到 97.9% 的准确率。
    event_summary_en: Reports claim GPT-6 achieved 97.9% accuracy on COBOL migration tasks.
