    slug: 法国世界报-中国手机微短剧的90由ai制作成本大幅下降但创作者的收入却暴跌
    name: 中国 AI 微短剧制作
    decision: market_context
    summary_zh: 据法国世界报报道，中国手机微短剧约90%由AI制作，制作成本大幅下降，但创作者收入暴跌。这意味着AI生成内容已进入规模化生产阶段，降低了内容制作门槛与单位成本，同时压缩了创作者端的收益空间，可能加剧内容供给过剩与价格竞争（推断）。
    summary_en: According to Le Monde, about 90% of Chinese mobile short dramas are now produced with
      AI, sharply lowering production costs while creator incomes have plunged. This indicates AI-generated
      content has entered scaled production, lowering the barrier and unit cost of content creation while
      squeezing creator-side returns, potentially intensifying content oversupply and price competition
      (inference).
    event_summary_zh: 报道称中国手机微短剧约90%由AI制作，制作成本大幅下降，创作者收入暴跌。
    event_summary_en: The report states that about 90% of Chinese mobile short dramas are made with AI,
      production costs have fallen sharply, and creator incomes have plunged.
