    slug: updated-google-privacy-policy-says-your-gmail-might-be-used
    name: Google
    decision: market_context
    summary_zh: Google 于 2026 年 10 月 16 日更新隐私政策，删除了“不基于 Drive、Gmail、Photos 内容展示个性化广告”的明确限制，改为在数据与其他 Google
      服务共享时可能用于广告，并与其 2026 年初推出的 Personal Intelligence 机制相衔接。这意味着用户敏感数据可经 AI 产品流入广告体系，对 AI 应用而言，数据授权边界与合规成本上升，采用
      Personal Intelligence 类功能的隐私风险成为竞争与信任因素（推断）。
    summary_en: On October 16, 2026, Google updated its privacy policy, removing the explicit limit that
      personalized ads would not be based on content from Drive, Gmail, or Photos, and instead allowing
      such data to inform ads when shared with other Google services, tying into its Personal Intelligence
      mechanism launched in early 2026. This means sensitive user data can flow through AI products into
      advertising; for AI applications, data-consent boundaries and compliance costs rise, and privacy
      risk around Personal Intelligence-style features becomes a factor in competition and trust (inference).
    event_summary_zh: Google 于 2026 年 10 月 16 日更新隐私政策，不再明确承诺不基于 Gmail、Drive、Photos 内容做个性化广告，改为在数据与其他 Google
      服务共享时可能用于广告。
    event_summary_en: On October 16, 2026, Google updated its privacy policy to no longer explicitly promise
      not to use Gmail, Drive, and Photos content for personalized ads, instead allowing such data to
      inform ads when shared with other Google services.
