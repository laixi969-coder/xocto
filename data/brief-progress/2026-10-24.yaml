  now-google-says-it-might-use-your-gmail-and-google-photos-da:
    slug: now-google-says-it-might-use-your-gmail-and-google-photos-da
    name: Google
    decision: market_context
    summary_zh: Google 于 2026 年 10 月 16 日更新隐私政策，在“不将 Drive、Gmail、Google Photos 数据用于个性化广告”的承诺中加入例外：若用户选择将这些服务的数据提供给支持个性化广告的其他
      Google 服务，则可用于定向广告。这意味着把个人数据接入 AI Mode 等搜索工具的用户，其数据可能进入广告定向；对 AI 应用而言，个性化功能与广告变现的边界被重新划定，用户对数据接入的信任成本上升（推断）。
    summary_en: 'On October 16, 2026, Google updated its privacy policy to add an exception to its promise
      not to use Drive, Gmail, or Google Photos data for personalized ads: if a user chooses to make data
      from these services available to other Google services that support personalized ads, it may be
      used for targeted advertising. Users who connect such data to AI Mode and other Search tools could
      therefore see it feed ad targeting; for AI applications this redraws the line between personalization
      and ad monetization and raises the trust cost of data connection (inference).'
    event_summary_zh: Google 于 2026 年 10 月 16 日修改隐私政策，为“不将 Drive、Gmail、Google Photos 数据用于个性化广告”的承诺增加例外：用户若选择将这些数据提供给支持个性化广告的其他
      Google 服务，即可用于定向广告。
    event_summary_en: 'On October 16, 2026, Google amended its privacy policy to add an exception to its
      pledge not to use Drive, Gmail, or Google Photos data for personalized ads: if a user opts to make
      that data available to other Google services supporting personalized ads, it may be used for targeted
      advertising.'
