  ai-is-getting-good-at-math-heres-why:
    slug: ai-is-getting-good-at-math-heres-why
    name: AI Is Getting Good at Math. Here’s Why.
    decision: market_context
    summary_zh: 据材料，OpenAI 的内部模型在 2026 年 5 月给出 Erdős 单位距离猜想的反例，随后在 6 月发布 Cycle Double Cover 问题的证明、7 月给出另外十个开放问题的解、9
      月给出 Navier-Stokes 的证明；Anthropic 则发布了费马大定理的形式化及黎曼猜想的相关上界。这些是模型在数学研究任务上的能力进展，意味着 AI 可被用于更长的推理链条与形式化验证类工作；材料未给出成本、定价或采用数据，其对应用成本与商业竞争的影响尚不明确（推断）。
    summary_en: According to the material, an internal OpenAI model produced a counterexample to the Erdős
      unit distance conjecture in May 2026, followed by a published proof of the Cycle Double Cover problem
      in June, solutions to ten more open problems by July, and a proof of Navier-Stokes in September;
      Anthropic published a formalization of Fermat's Last Theorem and advanced bounds on the Riemann
      hypothesis. These are capability advances on mathematical research tasks, suggesting AI can be applied
      to longer reasoning chains and formal-verification work; the material provides no cost, pricing
      or adoption data, so implications for application cost and commercial competition remain unclear
      (inference).
    event_summary_zh: OpenAI 内部模型在 2026 年 5 月给出 Erdős 单位距离猜想反例，6 月发布 Cycle Double Cover 问题证明，7 月给出另外十个开放问题的解，9
      月给出 Navier-Stokes 证明；Anthropic 发布费马大定理形式化及黎曼猜想相关上界。
    event_summary_en: An internal OpenAI model produced a counterexample to the Erdős unit distance conjecture
      in May 2026, published a proof of the Cycle Double Cover problem in June, solutions to ten more
      open problems by July, and a Navier-Stokes proof in September; Anthropic published a formalization
      of Fermat's Last Theorem and advanced bounds on the Riemann hypothesis.
