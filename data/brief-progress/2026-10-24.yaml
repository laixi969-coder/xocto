    summary_zh: 在 GTC 上，Vertiv 与 NVIDIA 展示了将 AI 工厂部署时间减半的方案，指向 AI 数据中心供电与散热交付周期的缩短，可能降低算力基础设施的上线时间与建设成本，从而影响
      AI 应用的算力供给节奏。该进展为两家公司联合方案，尚不足以推断整个数据中心行业交付周期已普遍缩短。
    summary_en: At GTC, Vertiv and NVIDIA presented an approach that halves AI factory deployment time,
      pointing to shorter delivery cycles for power and cooling in AI data centers that could reduce time-to-online
      and construction costs for compute infrastructure, thereby affecting the pace of compute supply
      for AI applications. The progress is a joint solution from the two companies and is not sufficient
      to conclude that delivery cycles across the data center industry have generally shortened.
