  google-will-let-schools-disable-its-ai-tools-but-not-without:
    slug: google-will-let-schools-disable-its-ai-tools-but-not-without
    name: Google
    decision: market_context
    summary_zh: Google 于 2026 年 11 月宣布，使用其教育产品的学校默认不启用 AI 工具，需管理员手动开启；受影响产品包括 Gemini、Gemini Notebook、Gemini
      in Classroom 与 Google Search，且无法单独选择，禁用 AI 即同时失去搜索。该政策把 AI 与搜索捆绑，使学校在采用 AI 与保留基础检索之间被迫取舍，可能影响教育场景中
      AI 工具的采用节奏与交付方式（推断）。
    summary_en: In November 2026 Google announced that schools using its education products will be opted
      out of AI tools by default, with administrators required to enable them manually; affected products
      include Gemini, Gemini Notebook, Gemini in Classroom and Google Search, with no partial opt-in,
      so disabling AI also removes Search. The policy bundles AI with search, forcing schools to trade
      off AI adoption against basic retrieval, which may affect the pace of adoption and delivery of AI
      tools in education (inference).
    event_summary_zh: Google 宣布使用其教育产品的学校默认不启用 AI 工具，需管理员手动开启；受影响产品包括 Gemini、Gemini Notebook、Gemini in
      Classroom 与 Google Search，禁用 AI 将同时失去搜索。
    event_summary_en: Google announced that schools using its education products will be opted out of
      AI tools by default, with administrators enabling them manually; affected products include Gemini,
      Gemini Notebook, Gemini in Classroom and Google Search, and disabling AI also removes Search.
