  data-centers-are-turning-to-old-jet-engines-as-the-wait-for:
    slug: data-centers-are-turning-to-old-jet-engines-as-the-wait-for
    name: Data center power supply
    decision: market_context
    summary_zh: 2026 年 11 月，数据中心建设方因接入电网与新涡轮机需等待数年，转而采用被淘汰的旧喷气发动机供电。这一做法效率更低、环保性更差，反映 AI 算力扩张正受电力供给瓶颈制约，可能推高数据中心建设与运营成本，并影响
      AI 应用的交付节奏（推断）。
    summary_en: In November 2026, data center builders facing years-long waits for grid access and new
      turbines turned to once-discarded jet engines for power. The approach is less efficient and less
      environmentally friendly, indicating that AI compute expansion is constrained by power supply bottlenecks,
      which may raise data center construction and operating costs and affect AI application delivery
      timelines (inference).
    event_summary_zh: 由于接入电网和新涡轮机需等待数年，数据中心建设方开始采用被淘汰的旧喷气发动机作为供电方案。
    event_summary_en: With years-long waits for grid access and new turbines, data center builders began
      using once-discarded jet engines as a power solution.
