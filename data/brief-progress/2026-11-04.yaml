  asia:
    slug: asia
    name: US tech giants' AI debt
    decision: market_context
    summary_zh: 2026 年 11 月有报道称，美国科技巨头与 AI 相关的隐性债务在六个月内增长 90%，达到 3.2 万亿美元。若该数据成立，AI 基础设施扩张的融资结构将更依赖债务，可能抬高资本成本并加剧算力供给方的财务风险，进而影响
      AI 应用的长期定价与竞争格局（推断）。
    summary_en: A November 2026 report said US tech giants' hidden AI-related debt grew 90% in six months
      to $3.2 trillion. If accurate, AI infrastructure expansion would rely more heavily on debt financing,
      potentially raising capital costs and increasing financial risk for compute suppliers, which could
      in turn affect long-term AI application pricing and competition (inference).
