      signal_level: 需求存疑
      demand_read:
        job_zh: 开发者或研究团队在需要让模型自主完成多步任务时，打开该原型仓库，输入任务目标与可用工具，试图得到一个可运行的自主智能体流程；具体输入材料与交付物仍待核验。
        job_en: Developers or research teams, when they need a model to complete multi-step tasks autonomously,
          open this prototype repository, provide task goals and available tools, and try to obtain a
          runnable autonomous agent workflow; specific inputs and deliverables still need verification.
        pain_zh: 公开材料只说明这是“迈向更自主的智能体系统”的原型，未说明它替代了哪一步旧工作、谁在什么情况下会痛；痛点无法从现有事实还原。
        pain_en: Public material only says this is a prototype moving toward a more autonomous agent system;
          it does not state which legacy step it replaces or who feels pain in what situation, so the
          pain cannot be reconstructed from available facts.
        current_alternative_zh: 开发者目前多用现成的智能体框架或自行拼接工具调用流程；该原型与这些做法的具体差异未在材料中说明。
        current_alternative_en: Developers currently use existing agent frameworks or hand-assemble tool-calling
          pipelines; how this prototype differs is not described in the material.
        usage_reason_zh: 推断：若该原型能减少自行搭建任务分解与工具调用链的工程量，开发者可能因省去这一步而试用；但公开材料未给出可核对的结果或用户反馈，无法确认选择动机。
        usage_reason_en: 'Inference: if the prototype reduces the engineering effort of building task
          decomposition and tool-calling chains, developers might try it to skip that step; however, public
          material offers no verifiable results or user feedback, so the motivation cannot be confirmed.'
