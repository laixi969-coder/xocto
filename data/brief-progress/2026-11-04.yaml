    summary_zh: 加利福尼亚州于2026年11月推出被称为“No Robo Bosses Act”的新规，限制雇主在用工管理中使用AI。该监管变化意味着企业在招聘、排班与绩效评估等环节部署AI代理时需增加合规审查与人工监督，可能抬高相关AI应用的部署成本并改变交付方式；具体条款细节未在材料中给出，影响为推断。
    summary_en: California introduced new restrictions in November 2026, described as the 'No Robo Bosses
      Act', on employers' use of AI. The regulatory change means companies deploying AI agents in hiring,
      scheduling and performance evaluation must add compliance review and human oversight, which may
      raise deployment costs and alter delivery for such AI applications; specific provisions are not
      detailed in the material and the impact is inferred.
