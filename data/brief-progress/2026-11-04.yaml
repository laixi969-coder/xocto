    event_summary_en: 'Ollama released v0.40.14: `ollama launch claude` now applies the model''s output
      token limit for Claude Code so cloud models no longer hit the 128k default cap; cloud web search
      responses on `/api/chat` decode correctly; OpenAI-compatible endpoints no longer override a model''s
      packaged sampler defaults; `/v1/responses` preserves readable input content; the app can retry ChatGPT
      disconnect failures; `ollama launch codex` verifies ChatGPT routing before configuring; and top-k
