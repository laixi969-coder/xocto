    summary_en: ''
    event_summary_zh: Ollama v0.40.14 发布：`ollama launch claude` 现在为 Claude Code 应用模型输出 token 上限，避免云模型触及
      128k 默认上限；修复 `/api/chat` 云网页搜索响应解码；OpenAI 兼容端点不再覆盖模型打包的采样器默认值；`/v1/responses` 保留可读输入内容；应用可重试 ChatGPT
