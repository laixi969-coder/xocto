    slug: ukraines-drone-strikes-spur-hasty-russian-plans-for-undergro
    name: Russia data center relocation
    decision: market_context
    summary_zh: 2026 年 11 月，乌克兰无人机打击损坏了 Yandex、Sberbank、VKontakte 等运营的数据中心及 AI 超算设施，导致数百万俄罗斯用户云服务中断；俄罗斯电信企业
      Rostelecom 与 Norilsk 讨论将部分数据中心转入地下，克里姆林宫还要求数据中心为紧急国家需求预留算力。这一变化意味着俄罗斯境内 AI 算力供给面临物理安全与政策双重约束，云服务连续性和模型训练成本承压，可能推动算力向境外或更分散的设施转移（推断）。
    summary_en: In November 2026, Ukrainian drone strikes damaged data centers and AI supercomputer facilities
      operated by Yandex, Sberbank, VKontakte and others, disrupting cloud services for millions of Russian
      users; state telecom Rostelecom discussed moving some data centers underground with Norilsk, and
      the Kremlin began requiring operators to reserve computing capacity for emergency state needs. This
      means Russian AI compute supply faces both physical-security and policy constraints, pressuring
      cloud continuity and training costs and potentially pushing capacity abroad or toward more dispersed
      sites (inference).
    event_summary_zh: 乌克兰无人机打击损坏了俄罗斯多家科技与金融机构的数据中心及 AI 超算设施，Rostelecom 与 Norilsk 讨论将数据中心转入地下，俄政府要求数据中心预留紧急国家算力。
    event_summary_en: Ukrainian drone strikes damaged data centers and AI supercomputer facilities of
      several Russian tech and financial institutions; Rostelecom and Norilsk discussed moving data centers
      underground, and the Russian government required operators to reserve emergency state computing
      capacity.
