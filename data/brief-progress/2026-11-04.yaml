  国家发改委聚焦矿山开采应急救灾等险脏累繁难场景通过人工智能解决行业痛点:
    slug: 国家发改委聚焦矿山开采应急救灾等险脏累繁难场景通过人工智能解决行业痛点
    name: 国家发展和改革委员会
    decision: market_context
    summary_zh: 国家发改委于2026年11月提出聚焦矿山开采、应急救灾等“险脏累繁难”场景，推动以人工智能解决行业痛点。该政策信号指向高危与重体力行业的AI替代需求，可能带动相关行业智能化应用的采用与交付，但材料未给出具体项目、预算或时间表，对成本与竞争格局的影响尚属推断。
    summary_en: In November 2026, China's National Development and Reform Commission proposed targeting
      hazardous, dirty, exhausting, repetitive and difficult scenarios such as mining and emergency rescue,
      promoting AI to address industry pain points. The policy signal points to AI substitution demand
      in high-risk and heavy-labor industries and could drive adoption and delivery of intelligent applications
      in those sectors, but the material provides no specific projects, budgets or timelines, so effects
      on cost and competition remain inference.
    event_summary_zh: 国家发改委提出聚焦矿山开采、应急救灾等“险脏累繁难”场景，通过人工智能解决行业痛点。
    event_summary_en: China's National Development and Reform Commission proposed focusing on hazardous,
      dirty, exhausting, repetitive and difficult scenarios such as mining and emergency rescue, using
      AI to address industry pain points.
