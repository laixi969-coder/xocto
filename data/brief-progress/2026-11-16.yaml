  sedimem:
    slug: sedimem
    name: sedimem
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用多个编码代理的开发者需要跨会话保留项目事实，避免重复、冲突或过时的记忆写入
    jobs_en:
    - Developers running multiple coding agents need to carry project facts across sessions without duplicated,
      conflicting or stale memory writes
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Codex CLI、Claude Code 等编码代理的开发者，在跨会话继续同一项目时打开它，把此前对话中产生的事实写入一份本地只追加的真相层；它通过 MCP 接入并设四道写入卫生与代理裁决，处理冗余、重复、冲突和过时条目，最终让多个代理共用同一份记忆。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：编码代理开始被当作长期协作者，记忆的写入质量而非记忆容量成为新问题。切入：从多人共用同一代码库、多个代理并行改动的团队入手，卖可审计的记忆变更记录与冲突裁决，而不是再做一个记忆存储。
    summary_en: Developers running coding agents such as Codex CLI and Claude Code open it when resuming
      a project across sessions, writing facts from earlier conversations into a local append-only truth
      layer; it connects via MCP with four write-hygiene checks and an agent adjudication loop to handle
      redundant, duplicated, conflicting and stale entries so several agents share one memory. The exact
      delivery form and human confirmation step still need verification.
    inspiration_en: 'Trend: coding agents are treated as long-running collaborators, making memory write
      quality rather than memory volume the new problem. Entry: start with teams sharing one codebase
      where several agents edit in parallel, and sell an auditable memory change log plus conflict adjudication
      rather than another memory store.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用多个编码代理的开发者，在跨会话继续同一项目时，需要把此前对话中的项目事实带入新会话，并避免重复、冲突或过时的记忆污染后续判断。
        job_en: Developers running multiple coding agents need to carry project facts from earlier conversations
          into new sessions while preventing duplicated, conflicting or stale memory from polluting later
          decisions.
        pain_zh: 多个代理各自积累记忆时，同一事实会被反复写入、版本互相冲突或长期过时，开发者要手工比对和清理，否则代理会基于错误前提继续改代码。
        pain_en: When several agents accumulate memory separately, the same fact gets rewritten, versions
          conflict or go stale, forcing developers to reconcile and clean by hand or let agents keep editing
          code on wrong premises.
        current_alternative_zh: 目前多靠手工维护的说明文件、每次重述上下文，或各代理自带的会话记忆，缺少跨代理共用的写入规则与冲突处理。
        current_alternative_en: Today this relies on hand-maintained instruction files, restating context
          each time, or each agent's own session memory, with no shared write rules or conflict handling
          across agents.
        usage_reason_zh: 相较手工比对说明文件，它把事实写入变成只追加并经过四道卫生检查与代理裁决的动作，减少开发者逐条核对重复与冲突的那一步；推断，经常切换代理或长周期项目的开发者会因此选用它。
        usage_reason_en: Compared with hand-reconciling instruction files, it turns fact writes into append-only
          actions passing four hygiene checks and agent adjudication, removing the step where developers
          check duplicates and conflicts line by line; inference, developers who switch agents often or
          run long projects would choose it for this.
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理跨会话记忆的重复、冲突与过时问题，开发者当前靠手工维护说明文件绕过，痛点具体且不处理的后果明确。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
        - ev-3bf18957347ecfa7
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度随时间上升，未见用户评价、issue 讨论或团队采用记录，无法判断是否形成使用共识。
        evidence_ids:
        - ev-3bf18957347ecfa7
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是团队开发者或企业，属判断而非已验证事实。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
      - gate: truth
        status: insufficient
        reason: 写入卫生与裁决闭环的实际效果缺少可复现实测，也未说明人工确认边界，交付确定性待核验。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有开发者报告跨代理记忆冲突被实际解决的使用记录。
