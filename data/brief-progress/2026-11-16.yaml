  blender-ai-copilot-bridge:
    slug: blender-ai-copilot-bridge
    name: blender-ai-copilot-bridge
    decision: watching
    event_summary_zh: 2026年11月12日发布的开源项目，为 Blender 提供 MCP 桥接，向 OpenCode 等兼容客户端开放 27 个受监督的场景工具，本地端点采用带认证的
      Streamable HTTP；仓库星标从 332 增至 491。
    event_summary_en: An open-source project published on 2026-11-12 that provides an MCP bridge for Blender,
      exposing 27 supervised scene tools to OpenCode and compatible clients over an authenticated Streamable
      HTTP local endpoint; repository stars rose from 332 to 491.
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与游戏美术
    - 影视与广告制作
    industries_en:
    - 3D animation and game art
    - Film and advertising production
    jobs:
    - 三维美术师在 Blender 中搭建或修改场景时，把重复的物体摆放、参数调整等操作交给外部 AI 客户端，通过受监督的工具调用完成场景编辑并逐项确认结果
    jobs_en:
    - 3D artists building or editing scenes in Blender hand repetitive object placement and parameter
      tweaks to an external AI client, which performs supervised tool calls and lets the artist confirm
      each result
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在 Blender 里搭建或修改场景时，通过本地带认证的 MCP 端点把 27 个受监督的场景工具开放给 OpenCode 等 AI 客户端，由客户端调用这些工具执行物体摆放、参数调整等操作，美术师逐项确认后得到修改后的场景；具体工具清单与交付边界仍待核验。
    inspiration: 趋势是三维软件开始把场景操作拆成可被外部代理调用的受监督工具，而不是让 AI 直接生成成品模型。切入可放在游戏美术外包或影视预演团队：把重复布景、批量参数调整这类低创意环节交给代理，按项目或按场景交付收费，美术师保留最终确认权。
    summary_en: When 3D artists build or edit scenes in Blender, they expose 27 supervised scene tools
      to AI clients such as OpenCode through an authenticated local MCP endpoint; the client calls these
      tools to place objects and adjust parameters, and the artist confirms each step to get the edited
      scene. The exact tool list and delivery boundary still need verification.
    inspiration_en: 'The trend is that 3D software is starting to expose scene operations as supervised
      tools callable by external agents, rather than having AI generate finished models. The entry point
      could be game-art outsourcing or film previs teams: hand low-creativity steps like repetitive set
      dressing and batch parameter tweaks to an agent, charge per project or per scene, and keep final
      approval with the artist.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 中搭建或修改场景时，把重复的物体摆放和参数调整交给外部 AI 客户端，通过受监督的工具调用完成编辑并逐项确认。
        job_en: 3D artists building or editing scenes in Blender delegate repetitive object placement
          and parameter tweaks to an external AI client, which performs supervised tool calls and lets
          them confirm each edit.
        pain_zh: Blender 中大量布景与参数调整是重复手工操作，脚本化门槛高，非程序化美术师难以批量处理。
        pain_en: Much set dressing and parameter tuning in Blender is repetitive manual work; scripting
          has a high barrier, so non-technical artists struggle to batch it.
        current_alternative_zh: 美术师手工逐项操作，或自行编写 Python 脚本，或使用 Blender 内置的几何节点做部分自动化。
        current_alternative_en: Artists operate item by item by hand, write their own Python scripts,
          or use Blender's built-in geometry nodes for partial automation.
        usage_reason_zh: 推断：相较手写脚本，产品把场景操作封装成受监督的工具调用，AI 客户端可直接执行并让美术师逐项确认，减少编写和调试脚本这一步；哪类用户会长期采用尚缺使用反馈证据。
        usage_reason_en: 'Inference: compared with hand-written scripts, the product wraps scene operations
          as supervised tool calls that an AI client can execute with per-step artist confirmation, removing
          the step of writing and debugging scripts; which users adopt it long term still lacks usage-feedback
          evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决三维美术师在 Blender 中重复布景与参数调整的手工负担，旧做法是逐项操作或自写脚本，痛点具体且交付可确认。
        evidence_ids:
        - ev-e320ff42d4be9799
        - ev-0ce85acd31f14052
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标增长，缺少用户评价、案例或讨论，无法判断美术师是否真的把它纳入工作流。
        evidence_ids:
        - ev-0ce85acd31f14052
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是个人美术师或工作室，付费路径尚不可见。
        evidence_ids:
        - ev-e320ff42d4be9799
      - gate: truth
        status: insufficient
        reason: 受监督工具调用与逐项确认的设计贴近可控编辑目标，但缺少实际交付结果与安全边界的公开材料。
        evidence_ids:
        - ev-e320ff42d4be9799
      next_validation: 收集该仓库的 issue 与 discussion，确认美术师实际用它完成了哪些场景编辑任务及遇到的问题。
