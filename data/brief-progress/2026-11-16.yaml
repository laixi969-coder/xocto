      to agents with reusable skill templates. Entry: serve small security consultancies or in-house security
      teams with reviewable test records and reports per authorized engagement rather than selling templates;
      the templates are free, so value sits in orchestration and result review.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师在获得授权的渗透测试或漏洞排查中，把目标站点信息与测试意图交给 AI 代理，用模板组织测试步骤并汇总发现，最终由人工复核出报告。
        job_en: Security engineers on authorized penetration tests or vulnerability triage hand target-site
          information and testing intent to AI agents, using templates to structure test steps and consolidate
          findings, with humans reviewing and issuing the report.
        pain_zh: 渗透测试的步骤编排、命令拼装和发现整理高度重复，工程师要在多个工具间手工搬运结果，容易漏项且报告整理耗时。
        pain_en: Penetration testing involves repetitive step planning, command assembly and finding consolidation;
          engineers manually move results across tools, risking omissions and slow report writing.
        current_alternative_zh: 工程师依靠个人经验、脚本库和零散笔记逐条执行测试，再手工整理成报告；或使用商业扫描器，但难以覆盖需要推理的测试路径。
        current_alternative_en: Engineers rely on personal experience, script libraries and scattered
          notes to run tests step by step and write reports by hand, or use commercial scanners that struggle
          with reasoning-heavy test paths.
        usage_reason_zh: 推断：相较手工拼命令，模板把测试意图直接映射为代理可执行的步骤与配置，减少从零编排和跨工具搬运的环节，因此承接授权测试的安全服务商或企业安全团队会在重复性测试中选用它；实际减少幅度缺少用户反馈佐证。
        usage_reason_en: 'Inference: versus hand-assembling commands, the templates map testing intent
          directly to agent-executable steps and configs, cutting from-scratch planning and cross-tool
          copying, so security consultancies or in-house teams doing authorized tests would pick it for
          repetitive work; the actual reduction lacks user feedback.'
      gates:
      - gate: value
