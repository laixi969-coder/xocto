    name: Pi-Remote
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在离开电脑时用手机查看并接管正在运行的 pi 编码代理会话，回答提示并发送命令
    jobs_en:
    - Developers monitoring and taking over a running pi coding-agent session from a phone while away
      from the computer, answering prompts and sending commands
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在离开电脑、编码代理仍在终端运行时打开它，把正在跑的 pi 终端会话镜像到手机或任意浏览器；AI 代理接收用户从手机发出的提示回答与命令，用户最终拿到可远程接管的运行过程，具体交付与人工确认边界仍待核验。
    inspiration: 趋势：编码代理开始长时间自主跑任务，人被迫守在终端前，远程接管成为新的操作环节。切入：从需要长时间跑代理的独立开发者和小团队进入，卖自托管或托管的远程会话通道；价格未披露，不臆测。
    summary_en: 'Developers open it when away from the computer while a coding agent keeps running in
      the terminal: it mirrors the live pi terminal session to a phone or any browser, the agent receives
      prompt answers and commands sent from the phone, and the user gets a remotely controllable run;
      the exact delivery and human-confirmation boundary still need verification.'
    inspiration_en: 'Trend: coding agents now run long autonomous tasks, forcing people to sit by the
      terminal, so remote takeover is becoming a new operating step. Entry: start with solo developers
      and small teams running long agent sessions, selling a self-hosted or hosted remote session channel;
      pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在离开电脑时，用手机查看正在运行的 pi 编码代理终端会话，回答代理的提示并发送新命令，让任务继续推进。
        job_en: While away from the computer, a developer uses a phone to watch a running pi coding-agent
          terminal session, answer the agent's prompts and send new commands so the task keeps moving.
        pain_zh: 编码代理跑长任务时人必须守在终端前，离开就看不到进度、无法回答提示，任务可能卡住或跑偏。
        pain_en: When a coding agent runs long tasks, someone must stay at the terminal; leaving means
          losing visibility, being unable to answer prompts, and risking a stalled or derailed run.
        current_alternative_zh: 旧做法是留在电脑前盯着终端，或用远程桌面、SSH 客户端连回机器，操作笨重且暴露面大。
        current_alternative_en: The old way is to stay at the terminal, or to connect back via remote
          desktop or an SSH client, which is clunky and widens the attack surface.
        usage_reason_zh: 相较远程桌面或 SSH，它把终端会话直接镜像到浏览器并端到端加密经自托管中继转发，省去配置远程连接这一步，让开发者在离开电脑时也能回答提示；这是基于产品能力的推断，尚无用户反馈佐证。
        usage_reason_en: Compared with remote desktop or SSH, it mirrors the terminal session straight
          to a browser with end-to-end encryption over a self-hosted relay, removing the remote-connection
          setup step so developers can answer prompts while away; this is an inference from product capability,
          not user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理长任务时人必须守在终端、离开就无法应答提示的痛点，旧替代是远程桌面或 SSH，结构上成立。
        evidence_ids:
        - ev-0864a1263247f676
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标数，属于关注度而非持续采用证据，缺少用户反馈或使用数据。
        evidence_ids:
        - ev-0dc1e37311cb05bf
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，这是判断不是已验证事实。
        evidence_ids:
        - ev-0864a1263247f676
      - gate: truth
        status: insufficient
        reason: 端到端加密与自托管中继是设计承诺，缺少部署文档或实测证明其确定性交付。
        evidence_ids:
        - ev-0864a1263247f676
      next_validation: 收集该仓库的部署文档或 issue/discussion，核验自托管中继的实际配置步骤与端到端加密是否可复现。
