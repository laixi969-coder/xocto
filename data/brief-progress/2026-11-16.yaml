        usage_reason_en: 'Inference: compared with writing a threat model from scratch, it turns the repository
          directly into a risk list with cited evidence, removing the step of mapping architecture and
          hunting for justification, so teams already using coding agents would pick it for a pre-integration
          review.'
      gates:
