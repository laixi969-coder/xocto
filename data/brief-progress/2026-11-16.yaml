    name: blender-ai-copilot-desk
    decision: watching
    event_summary_zh: 2026年11月12日发布的开源项目，为 Blender 提供可视化 AI 工作台，把对话、场景对象、视口快照、审批和任务板放在同一窗口，并内置 MCP 服务；仓库星标从
