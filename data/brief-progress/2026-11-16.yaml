    inspiration: 趋势是 Agent 能力正从黑箱产品变成可被拆开学习的工程对象，教学与参考实现本身成为入口。切入可放在面向转岗开发者或企业内部培训的 Agent 工程课，按课程或训练营收费，而非卖工具订阅；需先确认课程完整度与学习者完成率。
    summary_en: 'An AI agent tutorial plus a locally runnable implementation for beginners: learners start
      from a roughly 100-line minimal loop and add file read/write, command execution, MCP and long-term
      memory lesson by lesson, watching each step in a bundled web view; the deliverable is a working
      agent and a dissection of its mechanics, while course completeness and delivery quality remain to
      be verified.'
    inspiration_en: The trend is that agent capability is turning from a black-box product into an engineering
      object that can be taken apart and studied, making teaching and reference implementations an entry
      point. The opening is agent engineering courses for career-switching developers or corporate training,
      sold per course or cohort rather than as tool subscriptions; course completeness and learner completion
      rates need checking first.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 编程初学者或转岗开发者想理解 AI Agent 如何运作，需要从最小可运行循环开始，逐步加上文件读写、命令执行、MCP 与记忆，最终得到一个能本地跑起来并看清每一步的 Agent。
        job_en: Programming beginners or career-switching developers want to understand how AI agents
          work, starting from a minimal runnable loop and adding file I/O, command execution, MCP and
          memory, ending with a locally runnable agent whose every step is visible.
        pain_zh: 现有 Agent 框架文档零散、抽象层多，初学者难以把一次完整循环与工具调用串起来；直接读主流 Agent 源码门槛过高，缺少循序渐进的中间态。
        pain_en: Existing agent framework docs are scattered and heavily abstracted, so beginners struggle
          to connect a full loop with tool calls; reading mainstream agent source directly is too steep,
          and gradual intermediate steps are missing.
        current_alternative_zh: 读官方文档与博客、看视频教程、克隆开源 Agent 仓库自行摸索，或在通用助手里零散提问。
        current_alternative_en: Reading official docs and blogs, watching video tutorials, cloning open-source
          agent repos to explore alone, or asking scattered questions in general assistants.
        usage_reason_zh: 推断：相较零散文档，它把每项能力拆成一课并配可运行代码与网页端逐步观察，减少了初学者自行拼装最小闭环和调试不可见步骤的负担，因此自学者和做内部培训的团队会在入门阶段选择它。
        usage_reason_en: 'Inference: compared with scattered docs, it splits each capability into a lesson
          with runnable code and a web view for step-by-step observation, reducing the burden of assembling
          a minimal loop and debugging invisible steps, so self-learners and internal training teams would
          pick it at the onboarding stage.'
      gates:
      - gate: value
        status: supported
        reason: 它解决初学者理解 Agent 工作机制的需求，痛点是文档零散、源码门槛高，交付是可运行的分步实现，结构上成立。
        evidence_ids:
        - ev-fffaefb83a124da3
        - ev-fc4fafc9c1953431
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，缺少学习者完成率、课程评价或社区讨论等采用证据。
        evidence_ids:
        - ev-fc4fafc9c1953431
      - gate: model
        status: insufficient
        reason: 开源教程的付费路径未披露，可能来自课程、培训或赞助，属判断而非已验证事实。
        evidence_ids:
        - ev-fffaefb83a124da3
      - gate: truth
        status: insufficient
        reason: 课程完整度、代码可复现性与是否贴近真实 Agent 工程目标尚未核验。
        evidence_ids:
        - ev-fffaefb83a124da3
      next_validation: 收集该仓库的 issue、discussion 与课程页面，核实课程章节完整度、学习者反馈与是否有付费或培训入口。
  nano-edge-tts:
