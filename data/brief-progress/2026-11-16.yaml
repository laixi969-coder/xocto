        status: insufficient
        reason: 它解决多代理会话分散、状态难看清的问题，但公开材料只有仓库描述，缺少用户痛点与旧流程细节。
        evidence_ids:
        - ev-5b91fff4b159b04d
        - ev-4455c17c5474f74c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标数，属于关注度信号，不能说明开发者已把它纳入日常工作流。
        evidence_ids:
        - ev-5b91fff4b159b04d
        - ev-4455c17c5474f74c
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或商业交付路径，买方与收费方式不明。
        evidence_ids:
        - ev-5b91fff4b159b04d
      - gate: truth
        status: insufficient
        reason: 无法核验其布局是否真正降低切换负担，也未见与 Herdr App 的集成文档或实测。
        evidence_ids:
        - ev-4455c17c5474f74c
      next_validation: 收集该仓库的 README、issue 与 discussion，确认它如何与 Herdr App 集成以及用户报告的实际使用场景。
