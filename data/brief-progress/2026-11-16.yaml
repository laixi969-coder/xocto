        - ev-6499a2f1c9ab9e58
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是接单开发者或团队，但这是判断而非已验证事实。
        evidence_ids:
        - ev-6499a2f1c9ab9e58
      - gate: truth
        status: insufficient
        reason: 图标生成与风格一致性是否可靠、是否贴近设计交付的第一性目标，缺少可复现实测或用户反馈。
        evidence_ids:
        - ev-b56e61c62af71646
      next_validation: 收集该仓库的 issue、discussion 或 README 中的使用示例，核验生成图标的实际风格一致性与跨框架输出质量。
