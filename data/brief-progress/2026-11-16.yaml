  lasik:
    slug: lasik
    name: lasik
    decision: watching
    event_summary_zh: 2026-11-09 发布的开源 CLI 与 MCP 服务器 lasik，用于静态还原被 BLA（Blind LLM Agents）加固混淆的代码，使编码代理能重新读取真实代码；仓库星标从
      82 增至 133，未见客户案例或付费信息。
