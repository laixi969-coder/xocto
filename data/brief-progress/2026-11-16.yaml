  chat-demo:
    slug: chat-demo
    name: chat-demo
    decision: watching
    event_summary_zh: DeepSeek 官方账号下的 chat-demo 仓库自 2026-11-12 发布后，仓库星标从 839 增至 3,111，三天内约翻三倍；除仓库描述“Chat
      Demo”外，未提供功能、定价或使用数据。
