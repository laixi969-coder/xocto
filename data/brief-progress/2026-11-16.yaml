          switching cost; public materials give no user complaints or adoption evidence.
        current_alternative_zh: 开发者通常直接使用各代理自带的终端或聊天界面，靠手动切换窗口和记忆状态。
        current_alternative_en: Developers typically use each agent's own terminal or chat interface,
          switching windows manually and remembering state.
        usage_reason_zh: 推断：它把多个代理会话收进统一布局与侧边栏，减少逐个窗口查找状态的动作，因此多代理重度用户可能选择它；尚无留存或使用反馈支持。
        usage_reason_en: 'Inference: it gathers multiple agent sessions into one layout and sidebar, cutting
          the step of hunting through windows for status, so heavy multi-agent users may choose it; no
          retention or usage feedback supports this yet.'
      gates:
