    event_summary_zh: 2026年10月30日，开发者0xProbabillity发布开源项目claudeberry，一个面向BlackBerry OS 7的SSH客户端，针对AI编码代理、tmux和语音输入做了适配，构建于berryssh之上；此后约两周仓库星标从40缓慢增至50。
