    jobs:
    - 3D 美术师或独立创作者拿到一张参考图后，需要据此在 Blender 中重建可用的三维雕刻模型，并核对各视角是否与参考图一致
    jobs_en:
    - A 3D artist or independent creator with a single reference image needs to rebuild a usable 3D sculpt
      in Blender and check each view against that reference
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 3D 美术师或独立创作者打开它时，手上通常只有一张参考图，原本要在 Blender 里手工对照多角度重建雕刻。这个开源项目让编码代理接收这张图，执行视角配准与贴图拟合，并在
      Blender 中回放建模过程、输出延时记录，最终得到按原图测量的三维雕刻；成品是否可直接用于生产仍需人工检查。
    inspiration: 趋势是单张图片到可测量三维资产的重建正在从研究演示走向可回放的工程流程。切入可放在游戏、手办或电商商品建模这类需要按参考图还原外形的小团队，把“按图重建并逐视角核对”做成按件交付的服务，而非卖工具；具体定价未披露。
    summary_en: A 3D artist or independent creator often starts with only one reference image and would
      otherwise rebuild the sculpt by hand in Blender across multiple views. This open-source project
      has a coding agent take that image, run view registration and map-fitting passes, replay the build
      in Blender and emit a timelapse, yielding a 3D sculpt measured against the original image; whether
      the result is production-ready still needs human review.
    inspiration_en: The trend is that single-image reconstruction of measurable 3D assets is moving from
      research demos toward replayable engineering pipelines. The opening is small teams in game props,
      figurines or e-commerce product modeling that must match a reference image, selling per-asset reconstruction
      with per-view checks as a service rather than a tool; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 3D 美术师或独立创作者拿到一张参考图后，需要据此在 Blender 中重建可用的三维雕刻模型，并核对各视角是否与参考图一致。
        job_en: A 3D artist or independent creator with a single reference image needs to rebuild a usable
          3D sculpt in Blender and check each view against that reference.
        pain_zh: 只有单张图时，多角度外形、比例和贴图都要靠手工反复比对重建，耗时且容易走形。
        pain_en: With only one image, multi-view shape, proportions and textures must be rebuilt by hand
          through repeated comparison, which is slow and error-prone.
        current_alternative_zh: 在 Blender 等软件里手工建模，或使用通用图生三维工具后再人工修形。
        current_alternative_en: Manual modeling in Blender or other software, or generic image-to-3D tools
          followed by manual shape fixing.
        usage_reason_zh: 推断：它把视角配准、贴图拟合和 Blender 回放串成一次可复现的流程，减少美术师逐视角手工比对和重建的步骤，因此需要按参考图还原外形的小团队会尝试它；尚无留存或客户案例证据。
        usage_reason_en: 'Inference: it chains view registration, map fitting and Blender replay into
          one reproducible pass, cutting the artist''s per-view manual comparison and rebuild steps, so
          small teams needing reference-accurate shapes may try it; no retention or customer-case evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单张参考图重建可测量三维雕刻的需求，痛点是多视角手工比对耗时易走形，旧做法明确。
        evidence_ids:
        - ev-99f9da20bd21b272
        - ev-c30b0e1ab743a782
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或采用讨论，无法判断强场景共识。
        evidence_ids:
        - ev-99f9da20bd21b272
        - ev-c30b0e1ab743a782
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方与收费方式均不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-c30b0e1ab743a782
      - gate: truth
        status: insufficient
        reason: 缺少成品是否可直接用于生产、人工返工比例与交付确定性的公开材料。
        evidence_ids:
        - ev-99f9da20bd21b272
      next_validation: 收集该仓库的 issue 与 discussion，查看使用者对重建精度、返工步骤和 Blender 回放可用性的实际反馈。
