  dsh-see-now:
    slug: dsh-see-now
    name: dsh-see-now
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT Services
    jobs:
    - 开发者或自动化操作人员需要让 AI 助手持续读取屏幕变化时，把桌面操作过程作为输入交给模型，完成基于当前画面的问答或操作指导
    jobs_en:
    - Developers or automation operators feed an ongoing desktop session to an AI assistant so it can
      answer questions or guide actions based on the current screen state
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在搭建屏幕感知类 AI 助手时打开它，把桌面画面按变化量筛帧、多帧拼成一张图后交给模型，让 AI 在静止画面下少消耗 token 地读取当前屏幕。用户拿到的是可接入自己流程的屏幕输入组件，具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：屏幕与桌面操作正成为 AI 助手的输入源，但连续截图的 token 成本是主要阻力。切入：面向做桌面自动化、客服远程协助或软件测试的团队，卖“按变化量取帧”的输入层，可考虑按调用量或按坐席收费，价格未披露。
    summary_en: Developers building screen-aware AI assistants use it to sample desktop frames by change
      amount and stitch several frames into one image before sending them to a model, so the AI can read
      the current screen with far fewer tokens on static content. Users get a screen-input component to
      wire into their own pipeline; the exact delivery form and human confirmation step still need verification.
    inspiration_en: 'Trend: screen and desktop activity are becoming inputs for AI assistants, and the
      token cost of continuous screenshots is the main blocker. Entry: sell a change-based frame-sampling
      input layer to teams doing desktop automation, remote support or software testing, possibly priced
      per call or per seat; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或自动化操作人员需要让 AI 助手持续读取屏幕变化时，把桌面操作过程作为输入交给模型，完成基于当前画面的问答或操作指导。
        job_en: Developers or automation operators feed an ongoing desktop session to an AI assistant
          so it can answer questions or guide actions based on the current screen state.
        pain_zh: 连续截图逐帧送入模型会迅速推高 token 成本，静止画面反复传输造成浪费，开发者需要自己处理取帧与压缩。
        pain_en: Sending every screenshot frame to a model quickly inflates token cost, static screens
          waste repeated uploads, and developers must handle sampling and compression themselves.
        current_alternative_zh: 开发者自行写截图脚本、手动挑选关键帧，或直接整段录屏后交给模型，成本与操作负担都更高。
        current_alternative_en: Developers write their own screenshot scripts, manually pick key frames,
          or hand whole screen recordings to a model, which costs more and adds manual work.
        usage_reason_zh: 它按画面变化量筛帧并把多帧拼成一张图，减少静止画面重复传输这一步，从而降低单次屏幕输入的 token 消耗；做桌面自动化或远程协助的开发者会在需要持续喂屏幕给模型时选择它。这是基于功能结构的推断，尚无用户反馈佐证。
        usage_reason_en: It samples frames by change amount and stitches several into one image, removing
          the repeated transmission of static screens and lowering token use per screen input; developers
          doing desktop automation or remote support would pick it when they need to keep feeding a screen
          to a model. This is an inference from the feature structure, not backed by user feedback yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决把持续变化的屏幕低成本喂给模型的需求，痛点是逐帧截图的 token 浪费，旧做法是自写脚本或整段录屏，结构上成立。
        evidence_ids:
        - ev-8762282f966dea57
        - ev-de1adf2de7ac323d
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 571 增至 662，属关注度信号，未见用户评价或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-8762282f966dea57
        - ev-de1adf2de7ac323d
      - gate: model
        status: insufficient
        reason: 开源项目未见定价、付费或商业交付路径，钱可能来自企业定制或托管服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-de1adf2de7ac323d
      - gate: truth
        status: insufficient
        reason: 取帧与拼图能否稳定还原操作意图、误读画面时的人工确认边界，公开材料未说明。
        evidence_ids:
        - ev-8762282f966dea57
      next_validation: 收集该仓库的 issue 与 discussion，确认是否有团队将其接入桌面自动化或远程协助流程并描述实际使用结果。
  dsh-super-kanban:
    slug: dsh-super-kanban
    name: dsh-super-kanban
