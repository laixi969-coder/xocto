    open_source: true
    summary_zh: 面向备考学生：把笔记、课件、录音和往年试题，或只给一个主题，转成带插图与 3D 的课程，再用装在电脑上的 AI 导师边答题边批改，并生成抽认卡和模拟考试。覆盖桌面与移动端，免费开源；实际批改质量与使用留存仍待核验。
    inspiration: 趋势：学习材料从“找现成课程”转向“用自己的资料现场生成课程与练习”。切入：从有大量自有讲义和往年题的考试人群进入，例如职业资格考试、大学期末，卖按科目或按考季的生成与批改服务；目前只有开源仓库，付费方未披露。
    summary_en: 'For exam-preparing students: it turns notes, slides, recordings and past papers, or just
      a topic, into a course with figures and 3D, then lets a tutor installed on the computer check exercises
      as they answer, plus flashcards and mock exams. It runs on desktop and mobile, free and open source;
      actual grading quality and retention still need verification.'
    inspiration_en: 'Trend: study material shifts from finding a ready-made course to generating a course
      and exercises on the spot from one''s own materials. Entry: start with exam groups holding large
      personal lecture notes and past papers, such as professional licensing or university finals, and
      sell generation and grading per subject or exam season; currently only an open-source repository
      with no disclosed payer.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 备考学生在复习阶段要把散落的笔记、课件、录音和往年试题整理成可练习的课程，并反复做题检验掌握程度。
        job_en: During revision, exam-preparing students need to turn scattered notes, slides, recordings
          and past papers into a practice-ready course and repeatedly test their mastery.
        pain_zh: 材料分散且格式不一，自己整理成题目和抽认卡耗时；做题后缺少即时批改，容易在错误理解上反复。
        pain_en: Materials are scattered and inconsistently formatted, so building questions and flashcards
          by hand is time-consuming; without immediate grading after practice, students can repeat the
          same misunderstanding.
        current_alternative_zh: 学生手工整理笔记、用通用聊天工具生成题目，或购买现成课程与题库。
        current_alternative_en: Students organize notes by hand, use general chat tools to generate questions,
          or buy ready-made courses and question banks.
        usage_reason_zh: 推断：它把自有资料直接转成课程、抽认卡和模拟考试，并在作答时即时批改，省去手工出题与对答案的步骤，因此拥有大量自有讲义的学生会在备考期选择它。
        usage_reason_en: 'Inference: it converts one''s own materials directly into a course, flashcards
          and mock exams and grades answers as they are given, removing the manual steps of writing questions
          and checking answers, so students with large personal notes would choose it during exam periods.'
      gates:
      - gate: value
        status: supported
        reason: 它解决备考时把自有资料转成练习并即时批改的需求，旧做法是手工整理和买现成题库，痛点具体。
        evidence_ids:
        - ev-7696fccde43bd8fa
        - ev-f7992f33e9185753
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 43 增至 59，属关注度信号，没有学生使用反馈或留存证据。
        evidence_ids:
        - ev-7696fccde43bd8fa
        - ev-f7992f33e9185753
      - gate: model
        status: insufficient
        reason: 免费开源，未披露付费路径或机构采购，商业模式不明。
        evidence_ids:
        - ev-f7992f33e9185753
      - gate: truth
        status: insufficient
        reason: 未说明批改准确率与人工复核边界，生成题目是否贴合考试要求无法核对。
        evidence_ids:
        - ev-f7992f33e9185753
      next_validation: 收集 aula 仓库的 issue 与讨论，查看学生反馈的批改准确性和实际复习使用情况。
