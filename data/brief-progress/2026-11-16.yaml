    event_summary_en: A kanban plugin for DeepSeek Harness released on 2026-11-04 that derives task goals,
      progress and issues from DSH sessions, supports session hand-off, subtasks and artifacts, and offers
      full-page and sidebar views; repository stars rose from 47 on 2026-11-14 to 107 on 2026-11-16.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 DeepSeek Harness 进行多会话开发的工程师，在会话切换或中断后需要整理任务目标、进度与遗留问题并交接给同事或下一轮会话
    jobs_en:
    - Engineers using DeepSeek Harness who, after switching or interrupting sessions, need to organize
      task goals, progress and open issues and hand them off to colleagues or the next session
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 DeepSeek Harness 的开发者在一个会话结束或切换时打开它，把原本散落在对话记录里的任务目标、进度和问题整理成看板卡片，并支持会话交接、拆子任务和挂产物；最终拿到一张可继续推进的任务板，具体交付质量与人工确认环节仍待核验。
    inspiration: 趋势：AI 编码会话正在变成需要被管理的“工作现场”，任务状态从对话里流失成为新的摩擦点。切入：面向使用长会话编码工具的小团队，做会话到任务板的沉淀与交接层，可按团队席位或私有部署收费；但该插件绑定单一
      harness，跨工具通用性是其天花板。
    summary_en: Developers using DeepSeek Harness open it when a session ends or switches, turning task
      goals, progress and issues scattered across conversation logs into kanban cards, with session hand-off,
      subtask splitting and artifact attachment; the result is a task board that can be carried forward,
      while delivery quality and human confirmation steps remain to be verified.
    inspiration_en: 'Trend: AI coding sessions are becoming a work site that needs managing, and losing
      task state inside conversations is a new friction point. Entry: build a session-to-board capture
      and hand-off layer for small teams using long-session coding tools, charged per seat or via private
      deployment; the plugin''s dependence on a single harness caps its cross-tool reach.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 DeepSeek Harness 的工程师在会话切换、中断或交接时，把对话中的任务目标、进度和遗留问题整理成可继续推进的任务条目。
        job_en: Engineers using DeepSeek Harness, when switching, interrupting or handing off sessions,
          turn task goals, progress and open issues from the conversation into task items that can be
          carried forward.
        pain_zh: 长会话里任务状态散落在对话记录中，切换会话或交接时容易丢失上下文和未完成事项，需要人工回翻记录重建进度。
        pain_en: In long sessions task state is scattered across conversation logs; switching or handing
          off easily loses context and unfinished items, forcing manual re-reading to rebuild progress.
        current_alternative_zh: 手动回翻对话记录、另开文档或外部看板自行摘录任务，或干脆依赖记忆继续。
        current_alternative_en: Manually re-reading conversation logs, copying tasks into a separate document
          or external board, or simply relying on memory.
        usage_reason_zh: 推断：相较手动摘录，它直接从 DSH 会话中提取目标、进度与问题并生成看板卡片，省去回翻记录和重新录入这一步，因此频繁切换会话的开发者会在交接或续做时选择它；目前缺少留存与重复使用证据。
        usage_reason_en: 'Inference: compared with manual note-taking, it extracts goals, progress and
          issues directly from DSH sessions into kanban cards, removing the re-reading and re-entry step,
          so developers who switch sessions often would choose it at hand-off or resume; retention and
          repeat-use evidence is still missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长编码会话中任务状态散落、交接丢失上下文的问题，旧做法是人工回翻记录重建进度，痛点具体且可核对。
        evidence_ids:
        - ev-e6f41de2343d6610
        - ev-57b67fd7eb249ed8
      - gate: consensus
        status: insufficient
        reason: 星标短期内从47增至107，说明有开发者关注，但缺少用户评价或采用讨论，无法判断是否形成稳定使用共识。
        evidence_ids:
        - ev-e6f41de2343d6610
        - ev-57b67fd7eb249ed8
      - gate: model
        status: insufficient
        reason: 开源插件未披露定价或付费路径，买方可能是使用该 harness 的团队，但收费方式与可重复交付尚未核验。
        evidence_ids:
        - ev-57b67fd7eb249ed8
      - gate: truth
        status: insufficient
        reason: 提取的任务目标与进度是否准确、是否需人工校正，公开材料未说明，交付确定性待核验。
        evidence_ids:
        - ev-e6f41de2343d6610
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对任务提取准确性和会话交接实际效果的反馈。
  dsh-watch-together:
    slug: dsh-watch-together
    name: dsh-watch-together
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 影视内容
    - 在线教育
    industries_en:
    - film and video content
    - online education
    jobs:
    - 观众在观看长视频时，需要有人同步讲解剧情或知识点，并随时提问
    - 创作者或教师在剪辑或备课时，需要按播放进度逐段核对画面与台词
    jobs_en:
    - Viewers watching long videos need synchronized commentary on plot or concepts and the ability to
      ask questions at any point
    - Creators or teachers reviewing footage need to check visuals and dialogue segment by segment along
      the playback timeline
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 观众在播放长视频时打开这个插件，它会跟随真实播放位置，在每段结束前把分镜画面和带秒台词交给智能体，智能体在悬浮窗里出声回应，也能听到房间声音。用户拿到的是与进度同步的陪看对话；具体交付质量与人工确认环节仍待核验。
    inspiration: 趋势：视频消费正从单向播放转向与智能体同步的伴随式互动，输入不再是整段视频，而是按播放进度切出的画面与台词。切入：可从在线教育的长课程或影视解说切入，按课程或剧集提供同步讲解与答疑，卖法未披露。
    summary_en: When watching a long video, a viewer opens this plugin; it follows the real playback position
      and hands the agent a storyboard frame plus time-stamped subtitles before each segment ends, and
      the agent replies by voice in a floating window while also hearing room audio. The user gets commentary
      synchronized to playback; delivery quality and any human confirmation step still need verification.
    inspiration_en: 'Trend: video consumption is shifting from one-way playback toward synchronized companionship
      with an agent, where the input is not the whole video but frames and dialogue sliced by playback
      position. Entry: start with long online courses or film commentary, offering synced explanation
      and Q&A per course or episode; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 观众在观看长视频时，希望有人跟着播放进度讲解剧情或知识点，并能随时提问；创作者或教师备课时需要按段落核对画面与台词。
        job_en: While watching a long video, a viewer wants commentary on plot or concepts that follows
          the playback and the ability to ask questions anytime; creators or teachers need to check visuals
          and dialogue segment by segment when preparing.
        pain_zh: 长视频信息密度低、理解门槛高，观众遇到不懂处只能暂停、回看或另开搜索，讲解与观看被拆成两件事。
        pain_en: Long videos are dense and hard to follow; when viewers hit something unclear they must
          pause, rewind, or open a separate search, splitting explanation from watching.
        current_alternative_zh: 观众靠弹幕、评论区、倍速或暂停后自行搜索；教师和创作者靠人工逐段拉片记笔记。
        current_alternative_en: Viewers rely on danmaku, comments, playback speed, or pausing to search
          themselves; teachers and creators review footage manually and take notes segment by segment.
        usage_reason_zh: 推断：相较暂停后另开搜索，插件按真实播放位置自动截取分镜画面与带秒台词交给智能体，省去观众自己定位和描述片段这一步，因此需要边看边问的观众或备课者会尝试它。
        usage_reason_en: 'Inference: compared with pausing to search separately, the plugin automatically
          captures the storyboard frame and time-stamped subtitles at the real playback position and passes
          them to the agent, removing the step of locating and describing the segment, so viewers who
          want to ask while watching or teachers preparing lessons would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长视频观看中讲解与观看分离、遇到疑问需暂停另搜的痛点，按播放进度自动送入画面与台词，交付与进度同步的陪看回应；属工作流推理。
        evidence_ids:
        - ev-6e1a9050a0a62311
        - ev-1e7492c4a164cb25
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从42缓慢增至47，属关注度而非持续采用证据，缺少用户反馈或使用案例说明谁在什么场景下反复使用。
        evidence_ids:
        - ev-6e1a9050a0a62311
        - ev-1e7492c4a164cb25
      - gate: model
        status: insufficient
        reason: 开源插件未披露定价或付费路径，买方可能是个人观众或教育机构，这是判断不是已验证事实。
        evidence_ids:
        - ev-1e7492c4a164cb25
      - gate: truth
        status: insufficient
        reason: 同步截帧与语音回应的确定性交付、延迟和误读风险未见实测，人工确认边界也未说明。
        evidence_ids:
        - ev-6e1a9050a0a62311
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有用户描述实际陪看场景与重复使用情况。
  dyz-med-paper-skills:
    slug: dyz-med-paper-skills
    name: dyz-med-paper-skills
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 医疗健康
    - 高等教育与科研
    industries_en:
    - Healthcare
    - Higher Education & Research
    jobs:
    - 临床医生或医学研究生在准备投稿时，用PubMed检索文献、整理统计结果并撰写中英文论文与审稿回复
    jobs_en:
    - 'Clinicians or medical graduate students preparing a submission: searching PubMed, organizing statistical
      results, and drafting Chinese/English manuscripts and reviewer responses'
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 面向中国医生和医学研究生的开源技能包，在准备论文或投稿时打开，把选题、PubMed 文献检索、统计分析、中英写作、选刊与审稿修回拆成 32 个可调用步骤，在 Claude
      Code、Codex 中执行，最终产出论文草稿、投稿与修回材料，仍需作者本人核对。具体流程与交付质量仍待核验。
    inspiration: 趋势：医学写作这类高门槛、强格式约束的旧流程，正被拆成可复用的分步技能，而不是一个通用聊天框。切入：从中国临床医生和医学研究生的投稿环节进入，把文献检索、统计与选刊做成按篇或按次交付的服务，而非卖工具；价格未披露，不预设。
    summary_en: An open-source skill pack for Chinese clinicians and medical graduate students preparing
      papers or submissions. It splits topic selection, PubMed search, statistical analysis, Chinese/English
      writing, journal selection and reviewer responses into 32 callable steps run inside Claude Code
      or Codex, producing drafts and submission materials that the author must still check. The concrete
      workflow and output quality remain to be verified.
    inspiration_en: 'Trend: high-barrier, format-heavy medical writing is being broken into reusable stepwise
      skills rather than one general chat box. Entry: start from the submission stage of Chinese clinicians
      and medical graduate students, selling per-paper or per-task delivery of search, statistics and
      journal selection rather than a tool; pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 中国临床医生或医学研究生在准备投稿时，需要检索 PubMed 文献、整理统计结果、撰写中英文论文并回复审稿意见。
        job_en: Chinese clinicians or medical graduate students preparing a submission need to search
          PubMed, organize statistical results, draft Chinese/English manuscripts and answer reviewer
          comments.
        pain_zh: 医学论文有严格的格式、统计与选刊要求，非英语母语作者在文献筛选、英文表达和修回上反复返工，耗时且容易出错。
        pain_en: Medical papers carry strict formatting, statistical and journal-fit requirements; non-native
          English authors rework literature screening, English phrasing and revisions repeatedly, which
          is slow and error-prone.
        current_alternative_zh: 通用聊天助手、翻译工具、导师或同行代改，以及人工逐条检索 PubMed 和手工整理参考文献。
        current_alternative_en: General chat assistants, translation tools, mentors or peers editing drafts,
          and manually searching PubMed and compiling references.
        usage_reason_zh: 推断：相较在通用聊天框里反复贴材料，它把检索、统计、写作、选刊和修回拆成固定步骤，减少作者在提示词与格式之间来回搬运的负担；需要处理整篇投稿材料的医生和研究生会因此选择它，但尚无用户反馈或案例支持。
        usage_reason_en: 'Inference: compared with pasting material into a general chat box, it splits
          search, statistics, writing, journal selection and revision into fixed steps, cutting the burden
          of shuttling between prompts and formats; clinicians and students handling a full submission
          would choose it for that, though no user feedback or case supports this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决医学论文从检索、统计到写作与修回的多环节任务，痛点是格式与语言门槛高、返工多，旧做法是人工检索加通用助手或他人代改。
        evidence_ids:
        - ev-ca538942f66e9cdf
        - ev-78abd740c1fc0cdf
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、使用案例或社区讨论，无法判断医生群体是否真的把它纳入投稿流程。
        evidence_ids:
        - ev-ca538942f66e9cdf
        - ev-93df87267bd30e6b
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是个人医生、医院科研部门或论文服务商，这是判断而非已验证事实。
        evidence_ids:
        - ev-ca538942f66e9cdf
      - gate: truth
        status: insufficient
        reason: 技能包依赖通用模型执行，交付质量与统计、文献引用的准确性缺少可复现实测，人工核对边界未说明。
        evidence_ids:
        - ev-78abd740c1fc0cdf
      next_validation: 收集该仓库的 issue、discussion 或使用案例，确认医生在真实投稿中如何调用这些技能及产出是否被采用。
  eas-observe:
    slug: eas-observe
    name: EAS Observe
    decision: watching
    category: AI + 开发
    project_type: new_application
    industries:
    - 移动应用开发
    - 软件
    industries_en:
    - mobile app development
    - software
    jobs:
    - React Native 应用开发者在上线前后排查崩溃与性能退化时，处理运行时监控数据并定位问题
    jobs_en:
    - React Native app developers investigating crashes and performance regressions before and after release,
      working with runtime monitoring data to locate the cause
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 面向 Expo 与 React Native 开发者的性能监控产品，开发者在上线前后打开它查看应用运行表现并定位问题。候选资料只给出一句定位描述，未说明它接收哪些运行时数据、执行何种分析、最终交付何种报告或告警，具体流程与交付仍待核验。
    inspiration: 趋势是移动端监控正从通用 APM 收窄到具体框架栈，把 Expo 生态的构建与发布链路当作分发入口。切入可考虑面向使用跨端框架的中小应用团队，按项目或按监控事件收费；但该产品是否已把监控数据转化为可执行的修复建议，公开材料尚未体现。
    summary_en: A performance monitoring product for Expo and React Native developers, opened before and
      after release to inspect app runtime behavior and locate problems. The candidate material gives
      only a one-line positioning statement and does not say which runtime data it ingests, what analysis
      it performs, or what report or alert it delivers; the concrete workflow and deliverable remain unverified.
    inspiration_en: The trend is mobile monitoring narrowing from generic APM to specific framework stacks,
      using the Expo build-and-release pipeline as a distribution entry point. A possible entry is small
      app teams on cross-platform frameworks, priced per project or per monitoring event; whether this
      product turns monitoring data into actionable fixes is not shown in public material.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: React Native 应用开发者在上线前后排查崩溃与性能退化时，处理运行时监控数据并定位问题。
        job_en: React Native app developers investigating crashes and performance regressions before and
          after release, working with runtime monitoring data to locate the cause.
        pain_zh: 跨端框架的崩溃与性能问题往往分散在构建、发布与运行时多个环节，开发者需要自己拼接日志才能判断退化来自哪里；候选材料未提供用户对这一痛点的直接陈述。
        pain_en: Crashes and performance issues in cross-platform frameworks are scattered across build,
          release and runtime stages, so developers must stitch logs together to judge where a regression
          came from; the candidate material offers no direct user statement of this pain.
        current_alternative_zh: 通用 APM 服务、框架自带日志与开发者手工排查；这些替代方式与 Expo 发布链路的衔接程度未在材料中说明。
        current_alternative_en: General-purpose APM services, framework-native logs and manual developer
          investigation; how well these connect to the Expo release pipeline is not described in the material.
        usage_reason_zh: 推断：若它能把 Expo 构建与发布环节的数据直接关联到具体版本和崩溃，开发者可省去跨工具拼接日志的一步；但材料只有一句定位描述，无法确认这一动作是否真实存在，也无法确认用户是否因此选择它。
        usage_reason_en: 'Inference: if it links Expo build and release data directly to specific versions
