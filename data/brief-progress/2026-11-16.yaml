  whiteboard-ai-tutor:
    slug: whiteboard-ai-tutor
    name: whiteboard-ai-tutor
    decision: watching
    event_summary_zh: 2026-11-11 发布的开源白板 AI 导师项目，用 6 个模型（含 Claude、Gemini、DeepSeek）逐笔生成 288 节课并做盲评对比；仓库星标从
      63 增至 195。
    event_summary_en: An open-source whiteboard AI tutor released on 2026-11-11 generated 288 lessons
      stroke by stroke across six models (including Claude, Gemini and DeepSeek) and blind-reviewed them;
      repository stars rose from 63 to 195.
    category: AI + 创作
    project_type: open_source
    industries:
    - 教育
    - 在线学习
    industries_en:
    - Education
    - Online learning
    jobs:
    - 教师或自学者在准备讲解数学、物理等需要逐步推导的内容时，让模型在白板上逐笔画出解题过程，得到可回看的板书式讲解
    jobs_en:
    - Teachers or self-learners preparing step-by-step explanations of math or physics ask the model to
      draw the derivation stroke by stroke on a whiteboard, obtaining a replayable board-style lesson
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 自学者或教师在需要逐步推导的讲解场景打开它，AI 接收题目后逐笔在白板上画出解题过程，用户拿到一段可回看的板书式讲解；项目同时用 288 节课对 6 个模型做盲评对比，具体教学效果与交付质量仍待核验。
    inspiration: 趋势：模型开始被要求输出“过程”而非只给答案，板书式逐步讲解把生成内容变成可检查的教学材料。切入：从K12数学、物理等强推导科目切入，面向教辅机构或一对一辅导老师，按可回看的讲解片段交付，而不是卖通用聊天入口。
    summary_en: A self-learner or teacher opens it when a step-by-step explanation is needed; the AI receives
      a problem and draws the solution stroke by stroke on a whiteboard, yielding a replayable board-style
      lesson. The project also blind-reviews 288 lessons across six models; actual teaching quality and
      delivery remain to be verified.
    inspiration_en: 'Trend: models are being asked to output the process, not just the answer, turning
      generated content into inspectable teaching material. Entry: start with derivation-heavy K12 math
      and physics, sell replayable explanation clips to tutoring firms or one-on-one tutors rather than
      a generic chat entry.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 教师或自学者在准备数学、物理等需要逐步推导的讲解时，让模型在白板上逐笔画出解题过程，得到可回看的板书式讲解。
        job_en: A teacher or self-learner preparing a step-by-step math or physics explanation asks the
          model to draw the derivation stroke by stroke on a whiteboard, obtaining a replayable board-style
          lesson.
        pain_zh: 纯文字答案难以展示推导顺序，学生看不懂中间步骤；人工录制板书讲解耗时，且难以批量覆盖题目。
