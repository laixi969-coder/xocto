    open_source: true
    summary_zh: 开发者在 Claude Code 或 Codex 的订阅额度用尽时打开它，把原本由高价模型逐行完成的编码任务交给便宜模型生成，再由测试判定哪些改动可以合入，最终拿到可提交的代码改动；人工仍需确认测试覆盖是否足够。具体计费与交付流程仍待核验。
    inspiration: 趋势是编码代理的瓶颈从模型能力转向订阅额度与单次调用成本，围绕“贵模型规划、便宜模型执行”的分层用法开始出现。切入可放在对成本敏感、已有测试体系的独立开发者与小团队，按节省的调用额度或按项目收费；但需先确认它是否只是转售模型额度。
    summary_en: When developers exhaust their Claude Code or Codex subscription quota, they open this
      to hand coding tasks that a premium model would write line by line to a cheaper model, then let
      tests decide which changes ship, ending with committable code changes; a human still has to confirm
      test coverage is sufficient. Pricing and delivery flow remain unverified.
    inspiration_en: The trend is that the bottleneck for coding agents is shifting from model capability
      to subscription quota and per-call cost, giving rise to a split pattern of expensive models planning
      and cheap models executing. The entry point is cost-sensitive solo developers and small teams that
      already have test suites, charged by saved quota or per project; first confirm whether it merely
      resells model access.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队在 Claude Code、Codex 触发用量上限时，把编码任务交给便宜模型生成代码，再用测试决定哪些改动可以合入。
        job_en: Solo developers or small teams hitting usage limits in Claude Code or Codex route coding
          tasks to a cheaper model to generate code, then use tests to decide which changes ship.
        pain_zh: 高价编码代理的订阅额度很快耗尽，任务被迫中断，或需要额外付费升级套餐。
        pain_en: Subscription quota on premium coding agents runs out quickly, interrupting work or forcing
          a paid plan upgrade.
        current_alternative_zh: 等待额度重置、升级更贵的套餐，或手动切换到更便宜的模型并自行核对输出。
        current_alternative_en: Waiting for quota reset, upgrading to a pricier plan, or manually switching
          to a cheaper model and checking output by hand.
        usage_reason_zh: 推断：它把便宜模型生成与测试判定串成一个动作，减少手动切换模型和逐条核对代码的步骤，因此额度紧张且已有测试的开发者会在赶进度时选择它；尚无留存或复购证据。
        usage_reason_en: 'Inference: it chains cheap-model generation with test-based gating into one
          action, cutting the manual model switching and line-by-line review, so quota-constrained developers
          with existing tests would pick it under deadline; no retention or repeat-use evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理额度耗尽导致任务中断的问题，痛点在按量付费的开发者中刚性，交付为可提交的代码改动。
        evidence_ids:
        - ev-6b63fc8492e1de37
        - ev-e48fbfa1cddf6731
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或客户案例说明谁在持续使用。
        evidence_ids:
        - ev-6b63fc8492e1de37
        - ev-88d82abb67bfa40e
      - gate: model
        status: insufficient
        reason: 未披露定价与付费路径，是否靠转售模型额度获利无法判断，这是判断不是已验证事实。
        evidence_ids:
        - ev-e48fbfa1cddf6731
      - gate: truth
        status: challenged
        reason: 便宜模型生成代码的质量依赖测试覆盖，测试不足时可能交付错误改动，安全边界未说明。
        evidence_ids:
        - ev-6b63fc8492e1de37
      next_validation: 收集 cheap-ag 官方定价页或仓库 README 中关于计费方式与模型来源的说明，确认它是自建流程还是转售模型额度。
