    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在调试 AI 代理工作流时打开它，处理的是代理执行过程中产生的工具调用记录；它把这些调用与决策过程本地录制下来，支持回放证据并从检查点分叉重跑，最终让开发者拿到可复查的失败路径与重跑结果，是否需人工确认仍待核验。
    inspiration: 趋势：代理开始替人执行多步操作后，出错时的可追溯性成为新的调试负担。切入：从需要审计代理行为的开发团队或合规敏感行业进入，卖可回放的执行记录与分叉重跑，而非再做一个代理框架；具体流程与交付仍待核验。
    summary_en: Developers open it while debugging AI agent workflows, working with the tool-call records
      produced during agent execution; it records those calls and decisions locally, supports replaying
      evidence and forking from checkpoints, and hands back a reviewable failure path and rerun result,
      with human confirmation still to be verified.
    inspiration_en: 'Trend: as agents execute multi-step actions for people, traceability of failures
      becomes a new debugging burden. Entry: start with development teams or compliance-sensitive industries
