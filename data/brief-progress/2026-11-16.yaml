          steps; hand-recording board explanations is slow and hard to scale across problems.
        current_alternative_zh: 老师手写板书或录屏讲解，学生看教材解析或搜题App的文字步骤。
        current_alternative_en: Teachers write on a board or record screen explanations; students read
          textbook solutions or text steps in homework-help apps.
        usage_reason_zh: 推断：相比文字解析，它把推导过程逐笔画出，学生能按顺序看到每一步，教师也省去录制板书的时间；需要可视化推导的自学者和辅导老师会因此选择它。
        usage_reason_en: 'Inference: unlike text solutions, it draws the derivation stroke by stroke so
          students see each step in order and teachers skip recording a board; self-learners and tutors
          needing visual derivations would choose it for that.'
      gates:
      - gate: value
        status: supported
        reason: 它解决逐步推导讲解难以呈现过程、人工录板书耗时的问题，板书式输出对应真实教学任务。
        evidence_ids:
        - ev-e52a76348bfe103d
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标增长，缺少教师或学生的使用反馈与采用证据。
        evidence_ids:
        - ev-ad0020a34435ea6a
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或机构采购信息。
        evidence_ids:
        - ev-e52a76348bfe103d
      - gate: truth
        status: insufficient
        reason: 288 节课盲评是模型对比，不等于教学效果或交付确定性已被验证。
        evidence_ids:
        - ev-e77587d819837e9b
      next_validation: 收集该仓库的 issue/discussion 或演示页，查看是否有教师或学生反馈实际用于课堂或自学。
  widefleet-cloud:
    slug: widefleet-cloud
    name: Widefleet Cloud
    decision: watching
