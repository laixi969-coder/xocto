        usage_reason_zh: 推断：相较在聊天工具与视口间切换，产品把快照、审批和任务板收进同一窗口，减少比对与记录这一步；是否被团队长期采用尚缺反馈证据。
        usage_reason_en: 'Inference: compared with switching between chat tools and the viewport, the
