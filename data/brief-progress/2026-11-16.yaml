        reason: 它解决授权渗透测试中步骤编排与发现整理重复、易漏项的问题，旧做法是手工拼命令和整理报告，痛点刚性明确。
        evidence_ids:
        - ev-64b951e2ff46f35a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标且近期缓慢回落，没有用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-7d33e11a6e29688a
        - ev-fd4e59f9852f7611
      - gate: model
        status: insufficient
        reason: 仓库为电子书配套资源，未见定价、付费或按项目收费的公开路径，买方与收费方式不明。
        evidence_ids:
        - ev-64b951e2ff46f35a
      - gate: truth
        status: insufficient
        reason: 模板能否稳定产出可复核的测试结果、人工复核边界如何划分，公开材料未说明。
        evidence_ids:
        - ev-64b951e2ff46f35a
      next_validation: 收集该仓库的 issue 与 discussion，确认是否有安全团队报告实际使用场景与结果复核方式。
