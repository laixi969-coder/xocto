        current_alternative_zh: 依赖资深译者多年手工翻译，或使用通用机器翻译后人工大改；前者慢且贵，后者对文学语气处理粗糙。
        current_alternative_en: Relying on senior translators working by hand for years, or generic machine
          translation followed by heavy human rewriting; the former is slow and costly, the latter handles
