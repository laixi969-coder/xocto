  dsh-prompt-rewriter:
    slug: dsh-prompt-rewriter
    name: dsh-prompt-rewriter
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 使用 DeepSeek Harness 等对话工具的用户在输入框里写好半成品草稿后，需要把它改成可执行的提示词再发送
    - 对话工具用户在处理模糊需求草稿时，需要在不发送的情况下先得到一版结构更完整的提示词
    jobs_en:
    - Users of chat tools such as DeepSeek Harness who have drafted a rough prompt in the composer need
      it turned into an executable prompt before sending
    - Chat-tool users handling vague requirement drafts need a more structured prompt version without
      sending the draft
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 DeepSeek Harness 等对话工具的用户在输入框写好半成品草稿后，点输入框旁的一键增强，工具把草稿原地改写成可执行的提示词，且不发送；用户拿到的是改写后的草稿，是否发送仍由自己决定。具体改写规则与交付质量仍待核验。
    inspiration: 趋势：提示词改写正从用户自己反复试错，变成嵌在输入框旁的一个动作。切入：可从垂直人群的固定任务入手，例如客服话术、招投标文件、跨境 listing 文案，把改写绑定到该任务的模板与验收标准上，而不是做通用提示词美化；卖法可考虑按团队席位或按任务包收费，价格未披露。
    summary_en: Users of chat tools such as DeepSeek Harness who have drafted a rough prompt in the composer
      click a one-click enhancement beside the input box; the tool rewrites the draft in place into an
      executable prompt without sending it. The user gets the rewritten draft and still decides whether
      to send. The rewriting rules and output quality remain to be verified.
    inspiration_en: 'Trend: prompt rewriting is moving from users'' own trial and error into a single
      action beside the composer. Entry: start from a fixed task of a vertical group, such as support
      scripts, tender documents or cross-border listing copy, and bind rewriting to that task''s templates
      and acceptance criteria rather than generic prompt polishing; pricing could be per seat or per task
      pack, but no price is disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 DeepSeek Harness 等对话工具的用户在输入框里写好半成品草稿后，需要把它改成可执行的提示词再发送，以避免反复追问和重写。
        job_en: Users of chat tools such as DeepSeek Harness who have drafted a rough prompt in the composer
          need it turned into an executable prompt before sending, to avoid repeated follow-ups and rewrites.
        pain_zh: 草稿往往含糊、缺约束，直接发送会得到跑偏的回答，用户只能自己反复补条件和重发，多花几轮对话。
        pain_en: Drafts are often vague and lack constraints; sending them yields off-target answers,
          so users must add conditions and resend over several rounds.
        current_alternative_zh: 用户自己手动补全提示词，或把草稿发给另一个模型让其改写再复制回来；也有人直接发送后靠追问修正。
        current_alternative_en: Users manually complete the prompt, or paste the draft into another model
          to rewrite and copy it back; some just send and correct through follow-ups.
        usage_reason_zh: 推断：相较手动补全或跨窗口复制，它在输入框旁原地改写且不发送，省掉了切换窗口和复制粘贴这一步，并让用户在发送前就能核对改写结果，因此常写模糊草稿的对话工具用户会在发送前选择它。
        usage_reason_en: 'Inference: compared with manual completion or copying across windows, it rewrites
          in place beside the composer without sending, removing the window-switch and copy-paste step
          and letting users review the rewrite before sending, so chat-tool users who often write vague
          drafts would choose it before sending.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是草稿含糊导致多轮返工的问题，痛点具体且高频；改写不发送、由用户确认，交付边界清楚。
        evidence_ids:
        - ev-0462f40b257bc4ce
        - ev-80815a5b62eb5c03
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏数缓慢增长，没有用户评价或采用案例说明谁在什么任务上持续使用。
        evidence_ids:
        - ev-80815a5b62eb5c03
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式与买方，是否有人付费无法从公开材料判断。
        evidence_ids:
        - ev-0462f40b257bc4ce
      - gate: truth
        status: insufficient
        reason: 改写质量、是否贴近用户真实任务目标以及是否会引入错误约束，均缺少可复现实测。
        evidence_ids:
        - ev-0462f40b257bc4ce
      next_validation: 收集该仓库的 issue 与 discussion，查看用户反馈的改写效果与具体使用任务。
