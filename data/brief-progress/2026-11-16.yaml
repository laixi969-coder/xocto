    slug: datasette-0656
    name: datasette 0.65.6
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: datasette 0.65.6 发布，从 1.0a43 回移了一项安全修复：当通过 add_database(db, name=..., route=...)
      注册的数据库其 route 与 name 不同时，被拒绝访问该数据库的参与者仍可从 /<route>.db 下载该数据库。
    event_summary_en: 'datasette 0.65.6 was released, backporting a security fix from 1.0a43: a database
      registered via add_database(db, name=..., route=...) with a route differing from its name could
      be downloaded from /<route>.db by actors denied access to it.'
  datasette-10a43:
    slug: datasette-10a43
    name: datasette 1.0a43
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: datasette 1.0a43 发布，为输出渲染器加入流式支持，内置 TSV 与 CSV 导出改用该机制，插件可通过新的 Response.stream()
      逐行流式输出整张表；同时修复了私有存储查询可能泄露标题与 SQL 的安全问题，并更新行页 JSON 表示。
    event_summary_en: datasette 1.0a43 was released with streaming support for output renderers, with
      built-in TSV and CSV exports now using it and plugins able to stream every row of a table via the
      new Response.stream(); it also fixed a security issue where private stored queries could expose
      their title and SQL, and updated the row page JSON representation.
