        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是个人学习者或教育机构，属判断而非已验证事实。
        evidence_ids:
        - ev-5825fcca3d99b747
      - gate: truth
        status: insufficient
        reason: 评分标准与课程质量缺少可复现检验，也未说明人工复核边界，交付确定性待核验。
        evidence_ids:
