      screen-reading agent that runs from a single APK. Entry: start with high-frequency cross-app operators
      such as e-commerce support, food-delivery merchants or remote help for elderly users, charging per
      managed device or per automation task; permission and safety boundaries are the delivery prerequisite
      that must be solved first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安卓手机用户在需要跨 App 重复操作或定时改系统设置时，让内嵌引擎读屏并代为点击、切换和调整设置，完成自动化任务。
        job_en: Android phone users who need repeated cross-app actions or scheduled system-setting changes
          let the embedded engine read the screen and perform taps, switches and setting adjustments to
          complete the automation task.
        pain_zh: 跨 App 的重复点击和定时设置只能手动一步步做，耗时且容易漏；过去要 ROOT 或装 Termux 才能自动化，门槛高。
        pain_en: Repeated cross-app taps and scheduled settings must be done manually step by step, which
          is slow and error-prone; automation previously required ROOT or Termux, a high barrier.
        current_alternative_zh: 手动操作手机；或用 Tasker、Auto.js 等需要配置脚本、部分需 ROOT 或额外运行环境的自动化工具。
        current_alternative_en: Manual phone operation, or automation tools like Tasker and Auto.js that
          require script configuration and sometimes ROOT or extra runtimes.
        usage_reason_zh: 推断：相较手动逐步点击或配置脚本，它把引擎内嵌进 App 进程，装一个 APK 即可读屏并执行操作，省去 ROOT、Termux 和脚本编写这一步，因此不想折腾环境的普通安卓用户会在重复跨
          App 任务时选择它。
        usage_reason_en: 'Inference: versus manual tapping or script setup, it embeds the engine in the
          app process so a single APK can read the screen and act, removing the ROOT, Termux and scripting
          step; ordinary Android users who avoid environment tinkering would pick it for repetitive cross-app
          tasks.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨 App 重复操作与定时改设置要手动逐步完成、旧自动化需 ROOT 或脚本的痛点，任务与旧替代清晰。
        evidence_ids:
        - ev-b52ad79b669bf0bb
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，属关注度证据，缺少用户反馈或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-d13d048ac81b8bc0
        - ev-b52ad79b669bf0bb
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，谁付钱、按设备还是按任务收费均未披露，这是判断不是已验证事实。
        evidence_ids:
        - ev-b52ad79b669bf0bb
      - gate: truth
        status: insufficient
        reason: 读屏与改系统设置涉及权限与安全边界，公开材料未说明失败处理、误操作防护与合规限制。
        evidence_ids:
        - ev-b52ad79b669bf0bb
      next_validation: 收集该仓库的 issue 与 discussion，核对真实用户报告的具体自动化任务、失败场景与权限处理方式。
