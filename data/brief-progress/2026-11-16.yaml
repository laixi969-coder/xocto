    summary_zh: AI 实验室的研究与数据团队在需要领域专家标注、评测样本或人类反馈数据时，通过 Mercor 招募并组织专家完成标注任务，最终拿到可用于模型训练与评估的数据集；具体交付流程、质量控制方式与计价方式在候选材料中未披露，仍待核验。
    inspiration: 趋势：模型厂商对高质量专家数据的采购正在变成一门大生意，估值信号说明供给端被资本重仓。切入：可从某个垂直领域（如医疗、法律、金融合规）的专家数据供给与质量验收环节进入，卖“可核验的标注结果”而非泛人力池；但该赛道已被大额资本占据，窗口判断需先核验其真实收入与客户结构。
    summary_en: When research and data teams at AI labs need domain-expert annotation, evaluation samples
      or human-feedback data, they recruit and organize experts through Mercor to complete annotation
      tasks and receive datasets usable for model training and evaluation; the specific delivery process,
      quality control and pricing are not disclosed in the candidate material and remain to be verified.
