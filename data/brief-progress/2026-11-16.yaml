    - Professional services
    jobs:
    - 非技术背景的创业者或小团队负责人在需要上线一个网页应用时，用自然语言描述需求，让产品生成可运行的前端与后端代码，并自行确认和修改结果
    - 产品经理或独立开发者需要快速做出可演示的原型时，把需求描述交给产品生成可交互页面，用于内部评审或客户演示
    jobs_en:
    - A non-technical founder or small team lead who needs to launch a web app describes requirements
