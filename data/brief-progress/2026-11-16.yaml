  hill-climb:
    slug: hill-climb
    name: Hill-Climb
    decision: watching
    event_summary_zh: 2026年11月2日发布的开源技能，让 Claude Code 与 Codex 的每次改动只有在锁定测试或基准分数变好时才被保留；仓库星标从11月12日的56增至11月16日的137。
    event_summary_en: An open-source skill released on 2 November 2026 that keeps a Claude Code or Codex
      change only if a locked test or benchmark scores better; repository stars rose from 56 on 12 November
      to 137 on 16 November.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用编码代理的开发者提交改动后，用锁定测试或基准判断该改动是否真的变好，再决定保留或回退
    jobs_en:
    - Developers using coding agents run locked tests or benchmarks after a change to decide whether to
      keep or revert it
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 或 Codex 的开发者在一轮改动完成后打开它，把这次改动交给预先锁定的测试或基准打分；只有分数变好才保留，否则回退。用户拿到的是被证据筛选过的代码版本，具体接入流程与人工确认环节仍待核验。
    inspiration: 趋势是编码代理的产出开始需要可核对的验收环节，而不只是生成速度。切入可从已有测试资产但缺少验收纪律的小型工程团队入手，把“改动必须过锁定基准”做成按项目或按仓库收费的守门服务；目前只有开源技能形态，商业路径未披露。
    summary_en: Developers using Claude Code or Codex open it after a round of changes and hand the change
      to a pre-locked test or benchmark; the change is kept only if the score improves, otherwise it is
      reverted. The user gets a code version filtered by evidence; the exact integration flow and human
      confirmation step still need verification.
    inspiration_en: The trend is that coding-agent output now needs a checkable acceptance step, not just
      generation speed. The entry point is small engineering teams that already have test assets but lack
      acceptance discipline, selling a per-project or per-repository gate that requires every change to
      pass locked benchmarks; today it exists only as an open-source skill and the commercial path is
      undisclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者在一轮改动完成后，需要判断这次改动是否真的让代码变好，再决定保留还是回退。
        job_en: After a round of changes, developers using coding agents need to judge whether the change
          actually improved the code before keeping or reverting it.
        pain_zh: 编码代理会声称任务完成，但完成与否缺少可核对的依据，开发者要自己重跑测试或人工比对，回退成本高。
        pain_en: Coding agents claim a task is done, but there is no checkable basis for that claim; developers
          must rerun tests or compare manually, and reverting is costly.
        current_alternative_zh: 开发者手动运行测试、凭经验审查代理输出，或直接接受改动后再发现问题。
        current_alternative_en: Developers run tests manually, review agent output by experience, or accept
          changes and discover problems later.
        usage_reason_zh: 推断：相较手动重跑测试，它把锁定测试或基准作为保留改动的唯一条件，省去开发者逐次判断“是否完成”的一步，因此已有测试资产、又用编码代理的团队会在改动频繁时选择它。
        usage_reason_en: 'Inference: compared with manually rerunning tests, it makes a locked test or
          benchmark the sole condition for keeping a change, removing the developer''s per-change judgement
          of whether work is done, so teams with existing test assets that use coding agents would choose
          it when changes are frequent.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理声称完成却缺少可核对依据的问题，痛点是回退与人工复核成本，旧做法是手动跑测试。
        evidence_ids:
        - ev-f257c0bd23f6314e
        - ev-267b6b751730d545
      - gate: consensus
        status: insufficient
        reason: 只有仓库星标增长，没有用户评价或团队采用记录，无法判断是否进入日常工作流。
        evidence_ids:
        - ev-267b6b751730d545
      - gate: model
        status: insufficient
        reason: 开源技能形态，未见定价、付费或企业采购路径，买方与收费方式均未披露。
        evidence_ids:
        - ev-f257c0bd23f6314e
      - gate: truth
        status: insufficient
        reason: 锁定测试或基准本身可能被代理针对优化，承诺能否确定性交付缺少实测与安全边界说明。
        evidence_ids:
        - ev-f257c0bd23f6314e
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有团队报告在真实项目中持续使用并给出保留或回退结果。
