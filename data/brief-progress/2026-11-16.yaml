      to ''agents generating them to a shared spec'', making design assets a callable production step.
      Entry: start with solo developers and small front-end teams doing interface work, delivering a consistent
      animated icon set as part of the project rather than selling an icon library; pricing per project
      or per set is not publicly disclosed.'
