    inspiration: 趋势：agent 生成内部应用的门槛下降后，瓶颈从“写出来”转到“安全上线并给同事用”。切入：面向中小企业的内部工具托管，把 SSO、权限和存储打包成上线环节，按部署或席位收费，而不是再做一个生成器。
