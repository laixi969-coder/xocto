        usage_reason_zh: 推断：相较通用机器翻译，该项目针对单部作品做专门处理，先产出整部初译，把译者从逐句起译的负担转移到校对与风格统一环节，因此承接长篇经典重译的编辑或工作室会试用它。
        usage_reason_en: 'Inference: compared with generic machine translation, the project targets a
          single work and produces a full first draft, shifting the translator''s burden from sentence-by-sentence
          drafting to proofreading and style unification, so editors or studios undertaking long classic
          re-translations would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长篇文学翻译周期长、风格难统一的痛点，把逐句起译变为校对初稿，旧流程与不采用代价清晰。
