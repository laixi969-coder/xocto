      business, and the valuation signal shows capital concentrating on the supply side. Entry: start
      from expert data supply and quality acceptance in one vertical (e.g. medical, legal, financial compliance),
      selling verifiable annotation outcomes rather than a generic labor pool; the category is already
      heavily capitalized, so window judgment requires verifying actual revenue and customer structure
      first.'
