    jobs:
    - 独立游戏开发者或原型设计者在验证玩法创意时，把玩法描述交给编码代理，生成可试玩的浏览器 3D 动作游戏原型，用于内部试玩与方向判断
    jobs_en:
    - Indie game developers or prototype designers validating a gameplay idea hand a gameplay description
      to a coding agent to generate a playable browser 3D action game prototype for internal playtesting
      and direction decisions
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 独立游戏开发者或原型设计者在验证玩法创意时，把玩法描述交给 Claude Code / Codex，该 skill 用 three.js 与 AI 生成素材产出单 HTML
      的浏览器 3D 动作游戏，并附可玩演示《雾锁山门》；最终交付是可试玩原型，具体流程与质量边界仍待核验。
    inspiration: 趋势：编码代理开始把“从零做可玩 3D 游戏”压缩成一次提示，游戏原型的成本结构在变。切入：面向独立游戏团队或游戏化营销方，从玩法验证与可试玩 demo 这一环节进入，按原型或按项目交付收费；但美术与手感仍需人工把关，窗口与付费意愿尚未核验。
    summary_en: When indie game developers or prototype designers validate a gameplay idea, they hand
      a gameplay description to Claude Code / Codex; the skill uses three.js and AI-generated assets to
      produce a single-HTML browser 3D action game, with a playable demo included. The deliverable is
      a playable prototype; the exact workflow and quality limits still need verification.
    inspiration_en: 'Trend: coding agents are compressing ''build a playable 3D game from scratch'' into
      a single prompt, changing the cost structure of game prototypes. Entry: target indie game teams
      or gamified-marketing buyers at the gameplay-validation and playable-demo step, charging per prototype
      or per project; art and game feel still need human review, and willingness to pay is unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立游戏开发者或原型设计者在验证玩法创意时，把玩法描述交给编码代理，生成可试玩的浏览器 3D 动作游戏原型，用于内部试玩与方向判断。
        job_en: Indie game developers or prototype designers validating a gameplay idea hand a gameplay
          description to a coding agent to generate a playable browser 3D action game prototype for internal
          playtesting and direction decisions.
        pain_zh: 从玩法想法到可试玩原型通常要写引擎代码、搭场景、找素材，周期长，早期创意难以低成本验证。
        pain_en: Going from a gameplay idea to a playable prototype usually requires engine code, scene
          setup and asset sourcing, taking long and making early ideas costly to validate.
        current_alternative_zh: 开发者手写 three.js/Unity 原型、用现成模板或外包做 demo，或干脆只画文档不做可玩版本。
        current_alternative_en: Developers hand-code three.js/Unity prototypes, use templates or outsource
          demos, or skip playable versions and stay at the design-doc stage.
        usage_reason_zh: 推断：相较手写引擎代码与搭场景，该 skill 让编码代理一次性生成单 HTML 的可玩 3D 动作游戏并附演示，减少从零搭建原型的那一步，因此独立开发者会在快速验证玩法时选择它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: compared with hand-coding engine logic and scenes, the skill lets
          a coding agent generate a single-HTML playable 3D action game with a demo in one pass, removing
          the from-scratch prototype step, so indie developers may choose it for fast gameplay validation;
          no user feedback or retention evidence yet.'
      gates:
      - gate: value
