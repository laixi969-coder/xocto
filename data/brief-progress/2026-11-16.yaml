    jobs:
    - 个人用户在本地整理 Markdown 笔记与资料时，用语义检索和带引用的问答找回并核对相关内容
    - 个人用户在 Windows 上归档研究材料时，构建本地知识库与知识图谱以便后续检索
    jobs_en:
    - Individual users organizing local Markdown notes and materials use semantic search and cited Q&A
      to retrieve and verify relevant content
    - Individual users archiving research materials on Windows build a local knowledge base and knowledge
      graph for later retrieval
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向 Windows 的个人用户在本地整理 Markdown 笔记与研究资料时，打开这款本地优先应用，把笔记汇成个人知识库与知识图谱；AI 接收这些笔记做语义检索和带引用来源的问答，用户拿到可回溯出处的检索结果与回答，仍需自行核对引用。具体交付流程与引用可靠性仍待核验。
    inspiration: 趋势：个人知识管理正从云端笔记转向本地优先、带引用溯源的检索问答，隐私与可核对性成为卖点。切入：可从律师、研究员、独立顾问等需要本地留存敏感材料的个人切入，按本地部署或一次性授权卖，而非按席位订阅；但需先证明检索与引用质量能替代手工翻查。
    summary_en: For Windows users organizing local Markdown notes and research materials, this local-first
      app consolidates notes into a personal knowledge base and knowledge graph; the AI performs semantic
      search and cited Q&A over those notes, returning retrievable results and answers with sources that
      users still verify. The exact delivery flow and citation reliability remain to be checked.
    inspiration_en: 'Trend: personal knowledge management is shifting from cloud notes toward local-first
      retrieval and Q&A with traceable citations, making privacy and verifiability selling points. Entry:
      target lawyers, researchers and independent consultants who keep sensitive materials locally, selling
      via local deployment or one-time license rather than per-seat subscription; first prove retrieval
      and citation quality can replace manual lookup.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在 Windows 上整理 Markdown 笔记与研究资料时，需要把散落文件汇成可检索的知识库，并在写作或查证时快速找回带出处的相关内容。
        job_en: Individual users organizing Markdown notes and research materials on Windows need to consolidate
          scattered files into a searchable knowledge base and quickly retrieve sourced content when writing
          or fact-checking.
        pain_zh: 笔记分散在多个文件，靠文件名和关键词手工翻查，跨主题关联难找；把资料上传云端又有隐私顾虑。
        pain_en: Notes are scattered across files, manual lookup by filename and keyword is slow, cross-topic
          links are hard to find, and uploading to the cloud raises privacy concerns.
        current_alternative_zh: 用本地文件夹加全文搜索，或把笔记导入云端笔记与通用聊天助手做问答，但后者需要上传材料且引用不易核对。
        current_alternative_en: Local folders with full-text search, or importing notes into cloud note
          apps and general chat assistants for Q&A, which require uploading materials and make citations
          hard to verify.
        usage_reason_zh: 推断：相较手工翻查文件，它把本地笔记直接建成知识库并做语义检索与带引用问答，减少逐文件查找和跨主题串联的步骤；注重隐私、材料不便上云的个人用户会因此选择它，但引用准确度与长期留存尚无公开证据。
        usage_reason_en: 'Inference: versus manual file lookup, it builds local notes into a knowledge
          base with semantic search and cited Q&A, cutting per-file searching and cross-topic linking;
          privacy-conscious users with materials they cannot upload may choose it, though citation accuracy
          and retention lack public evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地笔记分散、检索慢且不便上云的痛点，把笔记汇成可语义检索并带引用的知识库，旧行为是手工翻查文件。
        evidence_ids:
        - ev-8e6042c91b89ded1
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标数，属关注度而非持续采用；缺少用户评价或使用反馈说明是否真正进入工作流。
        evidence_ids:
        - ev-8e6042c91b89ded1
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方可能是个人一次性授权或本地部署，属判断而非已验证事实。
        evidence_ids:
        - ev-8e6042c91b89ded1
      - gate: truth
        status: insufficient
        reason: 带引用问答的准确性与本地知识图谱的实际效果无公开实测，交付确定性待核验。
        evidence_ids:
        - ev-8e6042c91b89ded1
      next_validation: 收集该仓库的 issue、discussion 或 README 中的实测说明，核验语义检索与带引用问答的实际准确度和使用反馈。
