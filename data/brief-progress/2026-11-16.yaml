  safeagents:
    slug: safeagents
    name: safeagents
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在让编码代理执行任务前，需要把代理运行限制在受控环境里，避免它直接改动本机文件或系统
    jobs_en:
    - Developers need to confine coding agents to a controlled environment before letting them execute
      tasks, so the agent cannot directly modify local files or the system
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在让编码代理执行任务前打开它，把代理接入受控运行环境，由它限制代理能触碰的文件与系统范围，最终拿到一次可安全执行的代理运行结果；具体隔离机制与交付形态仍待核验。
    inspiration: 趋势是编码代理开始替人动手，风险从“答错”变成“改坏本机”，沙箱与权限边界正成为代理落地的前置环节。切入可从需要让代理接触真实代码库但又不能放开本机权限的软件团队入手，卖法未披露。
    summary_en: Developers open it before letting a coding agent execute tasks, plugging the agent into
      a controlled runtime that limits which files and system areas it can touch, and end up with a safely
      executed agent run; the exact isolation mechanism and delivery form still need verification.
    inspiration_en: The trend is coding agents starting to act on their own, so the risk shifts from wrong
      answers to damaging the local machine, making sandboxes and permission boundaries a prerequisite
      for agent adoption. The entry point is software teams that need agents to touch real codebases without
      granting local machine rights; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在让编码代理执行任务前，需要把代理运行限制在受控环境里，避免它直接改动本机文件或系统。
        job_en: Before letting a coding agent execute tasks, developers need to confine the agent to a
          controlled environment so it cannot directly modify local files or the system.
        pain_zh: 编码代理一旦获得执行权限，就可能误删、误改本机文件或越权访问，开发者只能事后检查或干脆不敢放开权限。
        pain_en: Once a coding agent gains execution rights, it may delete or alter local files or access
          beyond its scope, leaving developers to check afterwards or simply not grant rights.
        current_alternative_zh: 旧做法是人工盯着代理逐步执行、用虚拟机或容器手工搭隔离环境，或干脆只让代理输出代码由人复制。
        current_alternative_en: The old approach is to watch the agent step by step, manually set up a
          VM or container, or only let the agent output code for a human to copy.
