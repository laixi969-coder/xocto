    summary_zh: 候选资料只给出一句“AI that grows your business alongside your team”，未说明谁在什么工作节点打开它、AI 接收什么材料、执行什么动作、交付什么结果。具体流程或交付仍待核验。
    inspiration: 趋势：团队协作型“增长助手”叙事在增多，但仅凭一句定位无法判断它替代了哪一步旧工作。切入：若要做，应从已有明确增长动作的小团队（如独立站运营、本地服务商获客）切入，把“谁在什么节点把什么数据交给它、拿回什么可核对产出”讲清；价格未披露，不预设卖法。
    summary_en: The candidate material offers only the line "AI that grows your business alongside your
      team"; it does not say who opens it at which work step, what material the AI receives, what action
      it performs, or what it delivers. The concrete workflow and deliverable remain unverified.
    inspiration_en: 'Trend: team-oriented "growth assistant" positioning is multiplying, but a one-line
      claim cannot show which old work step it replaces. Entry: a viable version would start with small
      teams that already run concrete growth actions (independent-store operators, local service providers)
      and state exactly who hands over what data at which step and what checkable output comes back; no
      pricing is disclosed, so no sales model is assumed.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 资料未说明具体使用者与工作节点，无法还原谁在处理什么材料、要完成什么任务。
        job_en: The material names no specific user or work step, so it is impossible to reconstruct who
          handles what material to complete which task.
        pain_zh: 未描述任何具体痛点或现有做法的摩擦点。
        pain_en: No concrete pain point or friction in current practice is described.
        current_alternative_zh: 未说明用户现在用什么方式完成同类工作。
        current_alternative_en: It does not say how users currently accomplish comparable work.
        usage_reason_zh: 缺少可核对的动作与交付，无法解释相较旧做法减少了哪一步负担；这是判断，不是已验证事实。
        usage_reason_en: With no checkable action or deliverable, there is no way to explain which step
          of burden it removes versus the old way; this is a judgment, not verified fact.
      gates:
      - gate: value
        status: challenged
        reason: 它解决什么需求、什么痛点都写不出来，仅有一句增长口号，价值关不成立。
        evidence_ids:
        - ev-5e6a0a39cdb6f35a
      - gate: consensus
        status: insufficient
        reason: 未进入：价值不成立，且无任何采用或讨论信号。
        evidence_ids:
        - ev-5e6a0a39cdb6f35a
      - gate: model
        status: insufficient
        reason: 未进入：价值不成立，买方与收费路径均无材料。
        evidence_ids:
        - ev-5e6a0a39cdb6f35a
      - gate: truth
        status: insufficient
        reason: 未进入：无法核对交付是否确定发生。
        evidence_ids:
        - ev-5e6a0a39cdb6f35a
      next_validation: 收集该产品官方页面的功能说明与定价页，确认它接收什么输入、产出什么交付物。
