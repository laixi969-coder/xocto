    regions: []
    regions_en: []
    open_source: false
    summary_zh: 企业内部开发者或业务团队用 agent 生成内部小工具后，打开 Widefleet Cloud 把应用部署上线，并接入 SSO 与存储，最终交给同事使用；具体部署流程、支持的
