        - ev-24e1fcab7efb168c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从40缓慢增至50，属关注度信号，未见用户评价或采用案例说明真实使用场景。
        evidence_ids:
        - ev-cb8638cbe8db7472
        - ev-24e1fcab7efb168c
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或商业模式说明，钱从哪来无法判断，这是判断不是已验证事实。
        evidence_ids:
        - ev-24e1fcab7efb168c
      - gate: truth
        status: insufficient
        reason: 面向BlackBerry OS 7这一极小众设备，交付依赖旧设备可用性，是否贴近第一性目标与能否持续交付仍缺公开证据。
        evidence_ids:
