        usage_reason_zh: 仅知它被第三方智能体平台列为可对接对象，这属于生态兼容信号，不能说明用户为何选择它；相较旧做法的具体减负环节缺失，无法形成因果判断。
        usage_reason_en: It is known only that a third-party agent platform lists it as a compatible target,
