        pain_zh: 长篇文学翻译周期长、人力成本高，风格一致性难维持；单人从头翻译整部作品在时间上几乎不可行。
        pain_en: Long-form literary translation takes a long time and heavy labor, style consistency is
          hard to maintain, and translating an entire work from scratch alone is nearly infeasible in
