      cart and compare prices across Nemlig, BilkaToGo and Rema1000, then confirm and pay themselves
    regions:
    - 丹麦
    regions_en:
    - Denmark
    open_source: true
    summary_zh: 丹麦消费者在线上买菜比价时，打开这个开源MCP服务，让AI助手在Nemlig、BilkaToGo、Rema1000三家超市里搜索商品、加入购物车并比较价格；付款环节始终由用户本人确认完成。具体交付流程和跨店比价准确度仍待核验。
    inspiration: 趋势：AI助手开始直接接入本地零售的购物车，把“比价+加购”这段重复劳动从人手里拿走，但把付款留给人。切入：从丹麦这类线上杂货渗透高、连锁超市多的单一市场做起，做跨店比价与补货清单的代理层；卖法可考虑向超市导流或订阅，价格未披露。
    summary_en: When Danish shoppers compare grocery prices online, they open this open-source MCP service
      so an AI assistant can search products, add items to cart and compare prices across Nemlig, BilkaToGo
      and Rema1000; the user always confirms and pays. The exact delivery flow and cross-store price accuracy
      still need verification.
    inspiration_en: 'Trend: AI assistants are plugging directly into local retail carts, removing the
      repetitive compare-and-add step while leaving payment to the human. Entry: start in a single market
      like Denmark with high online grocery penetration and several chains, building an agent layer for
      cross-store comparison and restock lists; monetization could be retail referral or subscription,
      pricing undisclosed.'
