        pain_zh: 真机上的重复点击与界面核对耗时且易漏，代理需要先能“看见并操作”手机才能接手这一步；这是从工具能力推断的痛点，公开材料未提供用户抱怨。
        pain_en: Repeated tapping and UI checking on real devices is slow and error-prone, and an agent
          must first be able to see and operate the phone to take over this step; this pain is inferred
          from the tool's capability, as no user complaints are provided.
        current_alternative_zh: 公开材料未描述现有替代；按常见做法推断，开发者使用 Appium 等自动化框架或手工操作真机，但本候选未提供对比事实。
        current_alternative_en: The public material does not describe current alternatives; by common
          practice developers use automation frameworks such as Appium or operate devices manually, but
          this candidate provides no comparison facts.
        usage_reason_zh: 推断：相较手写自动化脚本或逐台手工操作，它把手机直接暴露为代理可调用的接口，省去为每个操作单独编写脚本这一步，因此需要快速验证界面流程的开发者会试用；尚无留存或客户案例支持长期使用。
        usage_reason_en: 'Inference: compared with hand-written automation scripts or manual device operation,
          it exposes the phone as an interface the agent can call, removing the step of scripting each
          action, so developers needing quick UI-flow checks would try it; no retention or customer cases
          yet support long-term use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理无法操作真机的问题，让重复的界面点击与核对可由代理执行，旧流程是手写脚本或手工操作，结构上成立。
        evidence_ids:
        - ev-4a198069d135224b
        - ev-9d54876cf4adad0f
      - gate: consensus
        status: insufficient
        reason: 只有仓库星标从 104 增至 130，属关注度；没有 issue 讨论或用户反馈说明谁在什么场景采用。
        evidence_ids:
        - ev-9d54876cf4adad0f
      - gate: model
        status: insufficient
        reason: 开源项目无定价与付费路径，钱可能来自企业支持或托管服务，这是判断，不是已验证事实。
        evidence_ids:
        - ev-4a198069d135224b
      - gate: truth
        status: insufficient
        reason: 未说明设备覆盖、操作稳定性与失败处理，交付能否确定发生无法核对。
        evidence_ids:
        - ev-4a198069d135224b
      next_validation: 收集 phonedriver 仓库的 issue 与讨论，确认开发者实际用它完成哪些真机操作、遇到哪些稳定性问题。
