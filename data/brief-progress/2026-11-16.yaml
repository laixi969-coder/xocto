      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 行政、法务或文员在整理合同、扫描件等敏感 PDF 时，需要在本地完成合并、拆分、压缩或格式转换，并拿到可直接归档或交付的文档。
        job_en: Administrative, legal or clerical staff organizing sensitive PDFs such as contracts and
          scans need to merge, split, compress or convert them locally and obtain documents ready to archive
          or deliver.
        pain_zh: 在线 PDF 工具要求把原件上传到第三方服务器，涉密或含个人信息的文件存在泄露与合规风险；本地软件则往往收费、安装繁琐或功能分散。
        pain_en: Online PDF tools require uploading originals to third-party servers, creating leak and
          compliance risk for confidential or personal-data files; local software is often paid, cumbersome
          to install or fragmented across tools.
        current_alternative_zh: 继续使用 iLovePDF 等在线转换站，或购买 Adobe 等桌面软件，也有人用命令行工具自行拼装流程。
        current_alternative_en: Continuing with online converters such as iLovePDF, buying desktop software
          such as Adobe, or assembling command-line tools into a custom workflow.
        usage_reason_zh: 推断：若它确实在本地完成转换，用户可省去上传与下载往返这一步，文件不离开设备即可得到结果，因此有保密要求的机构人员会在处理敏感文档时优先选择它；但公开材料未说明具体功能与
          AI 环节，这一判断依赖后续核验。
        usage_reason_en: 'Inference: if it truly converts locally, users skip the upload-and-download
          round trip and get results without files leaving the device, so staff at organizations with
          confidentiality requirements would prefer it for sensitive documents; however, public materials
          do not describe the specific features or the AI step, so this judgment depends on later verification.'
      gates:
