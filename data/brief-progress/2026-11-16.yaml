    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在命令行里启动编码代理后，让它自己在后台接续多步任务并持续跟进；遇到拿不准的环节，代理会发出卡片请人拍板，其余时间不打断人。用户最终拿到的是代理推进后的任务结果，关键决策仍由人确认。具体支持哪些任务类型、交付边界如何，公开材料未提供细节，仍待核验。
    inspiration: 趋势：编码代理正从“一问一答”走向“后台长跑、只在关键点找人”，人的角色被压缩成审批节点。切入：可从需要人工签核的合规敏感开发环节（如金融、医疗内部系统改动）进入，卖“代理执行+审批留痕”的交付，而非再做一个编码代理本体；价格未披露，不预设。
    summary_en: After starting a coding agent in the terminal, developers let it pick up and carry multi-step
      tasks forward in the background; when it hits something uncertain it sends a card asking a human
      to decide, and otherwise stays out of the way. The user gets the agent's advanced task output, with
      key decisions still confirmed by a person. Which task types are supported and where delivery stops
      are not detailed in public material and remain to be checked.
    inspiration_en: 'Trend: coding agents are moving from one-shot Q&A toward long background runs that
      only pull humans in at decision points, shrinking the human role to an approval node. Entry: start
      from compliance-sensitive development steps that need human sign-off (e.g. internal system changes
      in finance or healthcare) and sell agent execution plus an approval trail rather than another coding
      agent; pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在命令行里把多步编码任务交给代理后台执行，代理在不确定处发卡片请人拍板，人只处理关键决策。
        job_en: Developers hand multi-step coding tasks to an agent running in the background in the terminal;
          the agent sends cards at uncertain points for a human to decide, and the human only handles
          key decisions.
        pain_zh: 长任务需要人一直盯着代理、逐步确认，打断专注；不盯着又怕代理跑偏。
        pain_en: Long tasks force people to babysit the agent and confirm step by step, breaking focus;
          not watching risks the agent going off track.
        current_alternative_zh: 人工逐步驱动编码代理，或干脆自己写；也有用脚本串联但缺少人工审批点。
        current_alternative_en: Driving the coding agent step by step by hand, or just writing the code
          oneself; some chain scripts but lack human approval points.
        usage_reason_zh: 推断：相较人工逐步驱动，它把“持续跟进”交给后台循环，只在不确定处弹卡片，减少逐步确认的负担，因此需要长时间无人值守跑编码任务的开发者会选它；公开材料未提供留存或客户案例。
