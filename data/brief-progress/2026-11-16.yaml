      compress or convert files locally instead of uploading originals to third-party online tools
    - Clerks preparing archived materials who batch-process PDF pages into deliverable documents
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 需要处理合同、扫描件等敏感 PDF 的行政或法务人员，原本把文件上传到 iLovePDF 这类在线工具做合并、拆分或转换；KrocPDF 主张在本地完成这些处理，让文件不离开自己的设备。具体支持哪些格式与操作、AI
      在其中承担什么动作，公开材料尚未说明，交付流程仍待核验。
    inspiration: 趋势是文档处理从在线 SaaS 转向本地优先，隐私敏感行业不愿再把原件交给第三方服务器。切入可放在律所、诊所、政务窗口这类有保密义务的机构，卖部署与合规而不是单个转换按钮；但必须先确认它是否真的具备
      AI 能力，否则只是又一个本地 PDF 工具。
    summary_en: Administrative or legal staff handling sensitive PDFs such as contracts and scans previously
      uploaded files to online tools like iLovePDF to merge, split or convert them; KrocPDF claims to
      perform this processing locally so files never leave the device. Which formats and operations are
      supported, and what role AI plays, are not stated in public materials, so the delivery flow still
      needs verification.
    inspiration_en: The trend is document processing moving from online SaaS toward local-first, as privacy-sensitive
      sectors stop handing originals to third-party servers. The opening is in law firms, clinics and
      government service counters that carry confidentiality obligations, selling deployment and compliance
      rather than a single convert button; but first confirm whether it actually has AI capability, otherwise
      it is just another local PDF tool.
