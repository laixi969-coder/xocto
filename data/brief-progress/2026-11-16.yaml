    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT Services
    jobs:
    - AI 应用团队在模型或代理上线前，用统一框架跑编码、终端、办公与网页任务的基准和性能测试，拿到可对比的评测结果
    jobs_en:
    - AI application teams run benchmarks and performance tests across coding, terminal, office and web
      tasks in one framework before shipping a model or agent, obtaining comparable evaluation results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: AI 应用团队在模型或代理上线前，会打开 ARSI-Evaluator，把编码、终端、办公、网页等任务的基准测试、代理评测和性能测试放进同一框架运行。它接收测试任务与配置，执行评测并汇总结果；用户拿到可横向对比的评测输出，具体支持的任务类型与交付格式仍待核验。
    inspiration: 趋势：代理评测正从零散脚本走向统一框架，评测本身开始成为独立环节。切入：可从需要向客户证明交付质量的 AI 外包与行业代理团队进入，按评测报告或验收结果收费；开源框架本身如何变现尚未披露。
    summary_en: Before shipping a model or agent, AI application teams open ARSI-Evaluator to run benchmarks,
      agent evaluations and performance tests for coding, terminal, office and web tasks inside one framework.
      It takes test tasks and configuration, executes evaluations and aggregates results; users get comparable
      evaluation output, while the exact task coverage and output formats still need verification.
    inspiration_en: 'Trend: agent evaluation is moving from scattered scripts to unified frameworks, making
      evaluation its own step. Entry: start with AI outsourcing and vertical agent teams that must prove
      delivery quality to clients, charging per evaluation report or acceptance result; how the open-source
      framework monetizes is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 应用团队在模型或代理上线前，用统一框架跑编码、终端、办公与网页任务的基准和性能测试，拿到可对比的评测结果。
        job_en: AI application teams run benchmarks and performance tests across coding, terminal, office
          and web tasks in one framework before shipping a model or agent, obtaining comparable evaluation
          results.
        pain_zh: 评测分散在多个脚本和工具里，跨任务类型的结果难以对齐，团队难以判断代理在真实任务上是否达标。
        pain_en: Evaluation is scattered across scripts and tools, results across task types are hard
          to align, and teams struggle to judge whether an agent meets the bar on real tasks.
        current_alternative_zh: 团队各自维护评测脚本，或分别使用不同基准工具再手工汇总结果。
        current_alternative_en: Teams maintain their own evaluation scripts or use separate benchmark
          tools and manually aggregate results.
        usage_reason_zh: 推断：相较自建脚本再手工汇总，它把多类任务的评测收进同一框架执行并统一输出，减少拼接与对齐结果的步骤，因此需要跨任务对比代理表现的团队会在上线前选择它；是否被长期留在工作流尚无公开证据。
        usage_reason_en: 'Inference: compared with self-built scripts and manual aggregation, it runs
          evaluations for multiple task types in one framework with unified output, cutting the steps
          of stitching and aligning results, so teams needing cross-task agent comparison would choose
          it before launch; no public evidence yet that it stays in workflows long term.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理上线前跨任务评测分散、结果难对齐的问题，痛点具体且交付为可对比评测输出；买方尚不清晰。
        evidence_ids:
        - ev-42bed8f7b6fa8b91
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标等关注度信号，没有用户评价或团队采用案例说明谁在用、为何用。
        evidence_ids:
        - ev-42bed8f7b6fa8b91
        - ev-eb46d354023bdbc9
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、托管服务或企业支持等收入路径，属判断而非已验证事实。
        evidence_ids:
        - ev-42bed8f7b6fa8b91
      - gate: truth
        status: insufficient
        reason: 评测框架贴近第一性目标，但支持的任务范围、结果可复现性与人工复核边界均未在材料中说明。
        evidence_ids:
        - ev-eb46d354023bdbc9
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有团队报告实际用于上线前评测及结果复现情况。
  artificialanalysis:
    slug: artificialanalysis
    name: Artificial Analysis
    decision: queued
    event_summary_zh: 2026年10月28日，Artificial Analysis 发布 Intelligence Index v5；10月29日 Gemini 4 Carbon
      在该指数上登顶，11月9日 Claude Fable 5.2 以 65 分成为该指数迄今最高分。同期独立评论指出，独立模型评测的难点在于设计有意义的基准，而非把分数推高。
    event_summary_en: On 28 October 2026 Artificial Analysis released Intelligence Index v5; Gemini 4
      Carbon took the top spot on 29 October, and on 9 November Claude Fable 5.2 scored 65, the highest
      so far on that index. Independent commentary in the same period noted that the hard part of independent
      model evaluation is designing meaningful benchmarks, not pushing scores up.
    category: 基础层
    project_type: new_application
    industries:
    - 软件与信息服务
    - 企业采购与合规
    industries_en:
    - Software and IT services
    - Enterprise procurement and compliance
    jobs:
    - 企业 AI 平台负责人在选型时，需要把候选模型放到自家业务用例上比较，原来只能参考通用榜单或自行搭评测脚本，现在可用自定义基准得到可对比的评分结果
    - 模型团队在发布前需要向客户证明能力，原来靠自报分数或第三方通用榜单，现在用同一套自定义基准产出可复核的对比结果
    jobs_en:
    - An enterprise AI platform lead choosing a model must compare candidates on the company's own use
      case; previously limited to generic leaderboards or self-built eval scripts, now can obtain comparable
      scores from a custom benchmark
    - A model team preparing a launch must substantiate capability to customers; previously relying on
      self-reported scores or generic third-party leaderboards, now produces reviewable comparisons on
      the same custom benchmark
    regions:
    - 美国
    - 全球
    regions_en:
    - United States
    - Global
    open_source: false
    summary_zh: 企业 AI 选型人员或模型团队在需要比较模型时打开它，把自家用例的题目和评分标准交给平台，由平台运行候选模型并给出可对比的分数与排名；用户拿到的是自定义基准的评测结果，基准设计与结论解读仍需人工确认。具体流程与交付形式仍待核验。
    inspiration: 趋势：模型迭代加快后，通用榜单的说服力在下降，买方开始要求“按我的任务打分”。切入：从对模型选型负直接责任的企业 AI 平台团队或受监管行业的采购合规环节进入，卖的是可复核的评测报告而非榜单流量；价格未披露，不臆测。
    summary_en: 'Enterprise AI buyers or model teams open it when they need to compare models: they supply
      their own use-case prompts and scoring criteria, the platform runs the candidate models and returns
      comparable scores and rankings. The deliverable is a custom-benchmark evaluation result; benchmark
      design and interpretation still need human confirmation. The exact workflow and deliverable format
      remain to be verified.'
    inspiration_en: 'Trend: as model releases accelerate, generic leaderboards carry less weight and buyers
      ask to be scored on their own tasks. Entry: start with enterprise AI platform teams directly accountable
      for model selection, or procurement/compliance in regulated industries, selling reviewable evaluation
      reports rather than leaderboard traffic; pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业 AI 平台负责人或模型团队在选型与发布节点，把自家业务用例的题目和评分标准交给平台，运行候选模型并得到可对比的评分与排名。
        job_en: An enterprise AI platform lead or model team, at selection or launch time, hands its own
          use-case prompts and scoring criteria to the platform, runs candidate models and gets comparable
          scores and rankings.
        pain_zh: 通用榜单与真实业务任务脱节，自建评测脚本又要投入工程人力且难以横向对比，选错模型的代价落在后续集成和预算上。
        pain_en: Generic leaderboards diverge from real business tasks, while self-built eval scripts
          cost engineering effort and are hard to compare across teams; a wrong model choice shows up
          later in integration and budget.
        current_alternative_zh: 参考公开通用榜单、看厂商自报分数，或由工程团队临时写脚本跑一批样例。
        current_alternative_en: Consulting public generic leaderboards, trusting vendor-reported scores,
          or having engineers write ad-hoc scripts over a sample of prompts.
        usage_reason_zh: 推断：相较临时脚本，它把题目集、运行和评分放在同一流程里，省去搭评测环境与对齐口径这一步，使不同模型在同一标准下可比；需要向内部或客户解释选型依据的团队会因此选择它。
        usage_reason_en: 'Inference: versus ad-hoc scripts, it puts prompt sets, execution and scoring
          in one flow, removing the step of building an eval harness and aligning scoring conventions,
          so models are comparable on one standard; teams that must justify model choices internally or
          to customers would pick it for that.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是模型选型时缺少贴合自身任务的对比依据这一需求，痛点在采购与发布节点真实存在；买方是否为企业客户尚未核验。
        evidence_ids:
        - ev-f21ad2839c01ec8f
        - ev-08610498cc06a990
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度集中在指数发布与排名变化，尚无客户案例或持续使用证据说明团队已把它纳入选型流程。
        evidence_ids:
        - ev-747d4fca34723fa0
        - ev-eea56632755da0e1
      - gate: model
        status: insufficient
        reason: 公开材料未披露自定义基准的定价与收费方式，钱可能来自企业订阅或按报告收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-f21ad2839c01ec8f
      - gate: truth
        status: insufficient
        reason: 基准设计本身被独立评论指为难点，自定义基准能否稳定交付可信结论尚缺可复现实测或客户反馈。
        evidence_ids:
        - ev-08610498cc06a990
      next_validation: 收集 Artificial Analysis 官方关于自定义基准（Optima）的定价页或客户案例页面，确认收费方式与实际交付物。
  attest:
    slug: attest
    name: Attest
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - AI 应用开发者在把智能体接入业务流程前，用测试用例检查智能体的实际动作而非仅检查其输出文本
    jobs_en:
    - AI application developers checking an agent's actual actions, not only its text output, against
      test cases before connecting it to business workflows
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向构建智能体应用的开发者：在把智能体接入真实业务流程前，用测试用例检查它实际执行了哪些动作，而不只是看它说了什么。具体测试输入、判定方式和交付报告仍待核验。
    inspiration: 趋势：智能体开始替人执行动作，验收对象从“回答对不对”转向“动作做没做对”。切入：从需要审计智能体操作的高风险流程入手，例如客服退款、内部工单处理，卖可复核的动作测试报告；目前公开材料只有一句定位，机制与付费方均未披露。
    summary_en: 'For developers building agent applications: before connecting an agent to real business
      workflows, it checks which actions the agent actually performed, not only what it said. The concrete
      test inputs, pass criteria and delivered report still need verification.'
    inspiration_en: 'Trend: agents increasingly act on a user''s behalf, so acceptance shifts from whether
      the answer is right to whether the action was right. Entry: start from high-risk workflows that
      need auditable agent operations, such as customer refunds or internal ticket handling, and sell
      reviewable action-test reports; public material is currently only a one-line positioning with no
      disclosed mechanism or payer.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: AI 应用开发者在把智能体接入业务流程前，需要确认智能体实际执行了哪些动作，而不只是检查它输出的文字。
        job_en: Before connecting an agent to a business workflow, AI application developers need to confirm
          which actions the agent actually performed, not just review the text it produced.
        pain_zh: 智能体会调用工具、改动数据，仅检查回答文本无法发现误操作；公开材料未说明现有测试方式哪里不够用。
        pain_en: Agents call tools and change data, so checking only the answer text cannot catch wrong
          actions; the public material does not say where current testing falls short.
        current_alternative_zh: 开发者自行编写脚本或人工回放智能体操作来检查行为，具体做法未在材料中披露。
        current_alternative_en: Developers write their own scripts or manually replay agent operations
          to inspect behavior; the specific practice is not disclosed in the material.
        usage_reason_zh: 推断：若它能把智能体动作转成可复核的测试结果，开发者就不必逐条人工回放操作；但材料只有一句定位，无法确认它减少了哪一步负担。
        usage_reason_en: 'Inference: if it turns agent actions into reviewable test results, developers
          would not need to replay operations one by one by hand; but the material is a single positioning
          line, so which step of burden it removes cannot be confirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它要解决智能体动作难以验收的问题，但材料只有一句定位，说不清测试输入、判定与交付，痛点强度无法判断。
        evidence_ids:
        - ev-4d82df3860647d0b
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区提交和 6 个点赞、无评论，没有开发者采用或讨论证据。
        evidence_ids:
        - ev-4d82df3860647d0b
      - gate: model
        status: insufficient
        reason: 未披露定价、买方或收费方式，开源项目是否有商业路径不明。
        evidence_ids:
        - ev-4d82df3860647d0b
      - gate: truth
        status: insufficient
        reason: 无法核对测试是否贴近真实智能体行为，也未说明人工复核边界。
        evidence_ids:
        - ev-4d82df3860647d0b
      next_validation: 收集 Attest 官方文档或仓库 README，确认测试用例的输入形式、判定标准与输出报告。
