        - ev-e473b1713ec167b0
      - gate: consensus
        status: insufficient
        reason: 只有仓库星标增长，缺少用户评价或团队案例，无法确认审批流程被实际使用。
        evidence_ids:
        - ev-e473b1713ec167b0
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是个人美术师或工作室，付费路径尚不可见。
        evidence_ids:
        - ev-983a19b740c41335
      - gate: truth
        status: insufficient
        reason: 审批与任务板设计贴近可控交付，但缺少实际交付结果与人工边界说明的公开材料。
        evidence_ids:
        - ev-983a19b740c41335
