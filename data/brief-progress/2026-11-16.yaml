        pain_en: The stock system is no longer updated or is limited, leaving the device as idle hardware;
          finding images, flashing steps and repair methods separately is fragmented and hard.
        current_alternative_zh: 旧做法是让设备闲置、按零散论坛帖子自行摸索刷机，或直接购买新的语音设备。
        current_alternative_en: The old approach is to leave the device idle, piece together flashing
          from scattered forum posts, or buy a new voice device.
        usage_reason_zh: 推断：仓库把镜像、出镜像脚本和中英文刷机教程放在一处，减少了用户逐个搜集镜像与步骤的负担，因此持有该型号设备的爱好者会在想复活闲置硬件时选择它；是否长期使用缺少留存或复购证据。
        usage_reason_en: 'Inference: the repository puts the image, build scripts and bilingual flashing
          guide in one place, reducing the burden of collecting images and steps separately, so owners
          of this model would choose it when reviving idle hardware; long-term retention or repeat use
          lacks evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决闲置智能屏无法继续使用的问题，痛点是硬件变砖与刷机资料分散，旧替代是闲置或零散论坛摸索，结构上成立。
