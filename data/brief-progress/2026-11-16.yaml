        evidence_ids:
        - ev-f32d18407d9edd8e
        - ev-5e7754c4a050d21a
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价、付费路径或代运营收费方式，买方与收入来源尚不明确，这是判断而非已验证事实。
        evidence_ids:
        - ev-5e7754c4a050d21a
      - gate: truth
        status: insufficient
        reason: 依赖 Claude 代理生成画面与配音，成片质量与多语言准确性需实测；人工终审边界存在，但交付确定性未核验。
        evidence_ids:
