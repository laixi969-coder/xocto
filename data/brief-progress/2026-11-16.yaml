    name: Claude
    decision: market_context
    summary_zh: 2026年11月，英国付费使用AI的成年人比例升至二十分之一，年支出超过13亿美元，较两年前的1%和一年前的2.5%明显加速；同期Claude在英国的市场份额一年内翻了两番。这表明英国AI订阅需求正在快速上升，且用户向单一模型集中，可能加剧模型厂商在消费者市场的份额竞争。
    summary_en: In November 2026, one in twenty UK adults was paying for AI, spending more than $1.3 billion
      a year, up from 1% two years earlier and 2.5% a year earlier; over the same period Claude's UK share
      quadrupled in a year. This indicates rapidly rising UK AI subscription demand with users concentrating
      on a single model, which may intensify share competition among model providers in the consumer market.
    event_summary_zh: 英国付费AI用户占比从两年前的1%、一年前的2.5%升至二十分之一，年支出超13亿美元；Claude在英国的份额一年内翻了两番。
    event_summary_en: The share of UK adults paying for AI rose from 1% two years ago and 2.5% a year
      ago to one in twenty, with annual spending above $1.3 billion; Claude's UK share quadrupled in a
      year.
