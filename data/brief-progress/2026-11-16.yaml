        job_en: Data and research teams at AI labs need domain experts to produce annotation, rating and
          feedback samples when training or evaluating models, and use the platform to recruit and organize
          those experts for data production.
        pain_zh: 通用众包标注难以满足专业领域对准确性和一致性的要求，模型团队缺少可快速组织、可验收的专家供给，数据质量直接决定训练与评测结果是否可信。
        pain_en: Generic crowdsourced labeling struggles to meet accuracy and consistency requirements
          in specialized domains; model teams lack expert supply that can be organized quickly and accepted
          on quality, and data quality directly determines whether training and evaluation results are
          trustworthy.
        current_alternative_zh: 自建标注团队、外包给传统数据标注公司，或通过零散渠道自行招募专家，组织与验收成本高、周期长。
        current_alternative_en: Building in-house annotation teams, outsourcing to traditional data-labeling
          vendors, or recruiting experts ad hoc through scattered channels, all with high organizing and
          acceptance costs and long cycles.
        usage_reason_zh: 推断：相较自建团队或传统标注外包，平台把专家招募、任务分发与质量验收集中到一处，减少模型团队自行找人、培训与验收的环节，因此需要专业领域数据且时间紧的 AI
          实验室会选择它；候选材料未提供客户案例或复购证据，持续采用尚未核验。
        usage_reason_en: 'Inference: compared with in-house teams or traditional labeling outsourcing,
          the platform centralizes expert recruitment, task distribution and quality acceptance, reducing
          the steps model teams spend sourcing, training and vetting people, so AI labs needing domain
          data under time pressure would choose it; the candidate material offers no customer cases or
          repeat-use evidence, so sustained adoption is unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决模型团队缺少可快速组织、可验收的专业领域标注与评测数据这一需求，痛点在数据质量直接决定训练结果时是刚性的；买方为 AI 实验室，但具体付费结构未披露。
        evidence_ids:
        - ev-bc80df9f035de9e2
        - ev-8fae99cacf9778a5
      - gate: consensus
        status: insufficient
        reason: 候选材料只有估值标题，没有客户名单、使用规模或行业口碑，无法判断专业数据供给是否已成为稳定采购习惯。
        evidence_ids:
        - ev-bc80df9f035de9e2
        - ev-cf0134763845934a
      - gate: model
        status: insufficient
        reason: 未披露融资额、投资方、收入与计价方式，钱来自 AI 实验室采购还是资本叙事无法区分，存在依赖融资叙事的风险。
        evidence_ids:
        - ev-8fae99cacf9778a5
        - ev-cf0134763845934a
      - gate: truth
        status: insufficient
        reason: 专家标注的质量控制、交付确定性与人工复核边界均未在材料中说明，无法核对承诺能否稳定兑现。
        evidence_ids:
        - ev-bc80df9f035de9e2
      next_validation: 收集 Mercor 官方定价或服务说明页，以及公开客户案例，核验其数据交付方式与付费结构。
