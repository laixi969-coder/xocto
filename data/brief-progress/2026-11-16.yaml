    category: AI + 开发
    project_type: new_application
    industries:
    - 企业软件
    - 内部工具
    industries_en:
    - Enterprise software
    - Internal tools
    jobs:
    - 企业内部开发者或业务团队用 agent 生成内部小工具后，需要把它部署上线并接入单点登录与存储，交给同事实际使用
    jobs_en:
    - Internal developers or business teams that generated a small internal tool with an agent need to
