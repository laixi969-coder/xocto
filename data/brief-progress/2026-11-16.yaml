        job_en: Danish shoppers restocking and comparing prices online have an AI assistant search products,
          add to cart and compare prices across Nemlig, BilkaToGo and Rema1000, then confirm payment themselves.
        pain_zh: 跨三家超市手动搜索、逐个加购、自己记价格再对比，步骤琐碎且容易漏掉更便宜的选项。
        pain_en: Manually searching three supermarkets, adding items one by one and tracking prices to
          compare is tedious and easily misses cheaper options.
        current_alternative_zh: 用户分别打开各家超市App或网站，手动搜索、加购并自己记录价格做对比。
        current_alternative_en: Users open each supermarket app or site separately, search and add items
          manually, and track prices themselves to compare.
        usage_reason_zh: 推断：相较逐店手动操作，它让AI一次性跨店搜索、加购并汇总价格，省去重复打开多个App和手工记录比价这一步，因此常做线上采购、在意价格的丹麦用户会尝试；但尚无留存或复购证据。
        usage_reason_en: 'Inference: versus manual per-store work, it lets the AI search, add to cart
          and aggregate prices across stores in one pass, removing the repeated app-switching and manual
          price tracking, so price-conscious Danish online shoppers may try it; no retention or repeat-use
          evidence yet.'
      gates:
