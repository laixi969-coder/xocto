  github-24:
    slug: github-24
    name: 简造 ERP 社区版
    decision: watching
    event_summary_zh: 2026年11月15日，开发者 FawkesV 在社区发帖称，为亲戚的两三人机加工小厂用两天对接需求后做出轻量进销存“简造 ERP 社区版”，基础版已开源，支持
      Windows 本地安装，并加入入库订单、打印模板、委外、移动端及若干 AI 功能；帖中未披露具体 AI 动作、定价或客户采用数据。
    event_summary_en: On 15 November 2026, developer FawkesV posted that after two days of requirements
      work with a relative's two-to-three-person machining workshop, he built a lightweight inventory
      app, Jianzao ERP Community Edition; the basic version is open source, runs locally on Windows, and
      adds inbound orders, print templates, outsourcing, mobile access and some AI features. The post
      gives no specific AI action, pricing or customer adoption data.
    category: AI + 商业
    project_type: open_source
    industries:
    - 机械加工
    - 小型制造
    industries_en:
    - Machining
    - Small-scale manufacturing
    jobs:
    - 两三人小厂的老板或记账人员，在每天收工后处理入库单、出库单和委外加工记录，要完成当月收支汇总并看清每月收益
    jobs_en:
    - Owner or bookkeeper at a two-to-three-person workshop who, after each workday, handles inbound and
      outbound slips and outsourcing records to produce a monthly income-and-expense summary and see monthly
      profit
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 两三人机加工小厂的老板或记账人，在每天收工后打开它录入入库、出库和委外记录，替代手机记账和纸质本子；系统汇总出每月收支，并可打印单据。帖中称加入了 AI 相关功能，但具体接收什么材料、执行什么动作、人工如何确认均未说明，具体流程与交付仍待核验。
    inspiration: 趋势：小制造厂开始有人用 AI 把“手机记账＋纸质本子”的旧流程做成可本地安装的轻量软件，说明垂直小厂的记账需求正在被重新拆开。切入：从机加工、润滑剂、钢管修复这类接外派订单的两三人小厂进入，先做入库出库与月度收益这一最小闭环，按年或按厂收费；AI
      环节应落在识别单据或口述记账上，而不是堆功能。
    summary_en: The owner or bookkeeper of a two-to-three-person machining workshop opens it after each
      workday to enter inbound, outbound and outsourcing records, replacing phone notes and paper ledgers;
      the system sums up monthly income and expenses and can print slips. The post mentions AI features
      but does not say what material the AI takes in, what it does, or how a human confirms it, so the
      concrete workflow and deliverable still need verification.
    inspiration_en: 'Trend: small manufacturers are starting to use AI to turn the phone-notes-plus-paper-ledger
      routine into lightweight locally installed software, showing the bookkeeping workflow of tiny workshops
      is being redone. Entry: start with two-to-three-person machining, lubricant or pipe-repair shops
      that take outsourced orders, ship the minimal loop of inbound/outbound records and monthly profit,
      and charge per year or per shop; the AI step should sit on reading slips or voice entry rather than
      piling on features.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 两三人小厂的老板或记账人员，在每天收工后处理入库单、出库单和委外加工记录，要完成当月收支汇总并看清每月收益。
        job_en: The owner or bookkeeper of a two-to-three-person workshop handles inbound and outbound
          slips and outsourcing records after each workday to produce a monthly income-and-expense summary
          and see monthly profit.
        pain_zh: 现有进销存要么太贵、功能太多，要么不符合机加工小厂的业务，老板不熟悉操作；他们只能用手机或纸质本子记账，月底汇总收益费时且容易漏记。
        pain_en: Off-the-shelf inventory software is either too expensive and feature-heavy or does not
          fit small machining shops, and owners are unfamiliar with it; they fall back on phones or paper
          ledgers, so month-end profit summaries are slow and easy to get wrong.
        current_alternative_zh: 手机记账应用、纸质本子，或买来但用不惯的通用进销存软件；定制开发因负担不起而被放弃。
        current_alternative_en: Phone bookkeeping apps, paper ledgers, or general inventory software bought
          but not used; custom development is dropped as unaffordable.
        usage_reason_zh: 推断：相较手机记账和纸质本子，它把入库、出库、委外和月度收益汇总放进一个本地安装的界面，减少月底手工翻账和重算这一步；对不熟悉复杂 ERP 的中年小厂老板，操作门槛更低，因此这类用户会在需要按月看清收益时选择它。帖中未给出留存或付费证据。
        usage_reason_en: 'Inference: compared with phone notes and paper ledgers, it puts inbound, outbound,
          outsourcing and monthly profit summaries into one locally installed interface, removing the
          manual month-end re-tallying step; for older workshop owners unfamiliar with complex ERP it
          is easier to operate, so such users would pick it when they need a monthly profit view. The
          post gives no retention or payment evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决两三人小厂记入库出库、按月看收益的需求；旧做法是手机或本子记账，月底汇总费时易漏，痛点具体且反复发生。
        evidence_ids:
        - ev-2ebf186f8230ef90
      - gate: consensus
        status: insufficient
        reason: 只有一条社区帖和20条评论，未见小厂老板的采用反馈或重复使用记录，场景是否普遍成立仍缺公开证据。
        evidence_ids:
        - ev-2ebf186f8230ef90
      - gate: model
        status: insufficient
        reason: 未披露定价、买方付费方式或交付责任；开源基础版如何收费、AI 功能是否单独计价均不清楚，这是判断不是已验证事实。
        evidence_ids:
        - ev-2ebf186f8230ef90
      - gate: truth
        status: insufficient
        reason: 帖中只说加了 AI 相关功能，未说明 AI 接收什么材料、做什么动作、人工如何确认，交付确定性无法核对。
        evidence_ids:
        - ev-2ebf186f8230ef90
      next_validation: 收集该开源仓库的 README、issue 与 release 说明，核对 AI 功能的具体输入输出、部署方式和是否已有小厂实际使用记录。
