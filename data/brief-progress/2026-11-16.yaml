  tucano:
    slug: tucano
    name: tucano
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在本地 Mac、Windows 或 Linux 上同时推进多个编码任务时，把写代码、互相审查和调用已有工具的工作分派给多个代理，并在涉及真实系统改动前逐项确认
    - 开发团队负责人需要在合并前让多个代理交叉检查同一批代码改动，并保留人工放行环节
    jobs_en:
    - A developer running several coding tasks locally on Mac, Windows or Linux assigns writing, peer
      review and tool use to multiple agents, approving each action that touches real systems
    - A development team lead has multiple agents cross-check the same code changes before merge, keeping
      a human approval step
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在本地 Mac、Windows 或 Linux 上打开它，把写代码、互相审查和调用已有工具的任务分给多个代理，代理在频道里对话协作；涉及真实世界的动作会停下来等用户确认。用户最终拿到的是经代理互审、由人放行的代码改动，具体交付流程仍待核验。
    inspiration: 趋势：编码代理正从单次对话走向多代理分工与互审，人的角色收缩为放行关口。切入：可从需要审计留痕的受监管软件团队进入，卖“代理协作+人工审批记录”而非又一个编码助手；开源版已积累关注，但付费路径未披露。
    summary_en: A developer opens it locally on Mac, Windows or Linux and assigns coding, peer review
      and tool use to several agents that talk in channels; any action touching the real world waits for
      the user's approval. The deliverable is code changes reviewed by agents and released by a human;
      the exact delivery flow still needs verification.
    inspiration_en: 'Trend: coding agents are moving from single chats to multi-agent division of labour
      and peer review, with humans shrinking to an approval gate. Entry: target regulated software teams
      that need audit trails, selling agent collaboration plus human approval records rather than another
      coding assistant; the open-source build has attention but no disclosed paid path.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在本地机器上并行推进多个编码任务时，把写代码、互审和调用工具分派给多个代理，并对触及真实系统的动作逐项放行。
        job_en: A developer running several coding tasks in parallel on a local machine assigns writing,
          peer review and tool use to multiple agents and approves each action that touches real systems.
        pain_zh: 单个编码代理容易漏掉上下文、缺少交叉检查，且自动执行真实操作有风险；开发者要反复复制粘贴和人工复核。
        pain_en: A single coding agent misses context and lacks cross-checking, and autonomous real-world
          actions are risky; developers repeatedly copy, paste and manually re-check.
        current_alternative_zh: 在多个终端里分别开 Claude Code、Codex 等会话，人工在会话间搬运上下文并自己审查改动。
        current_alternative_en: Opening separate Claude Code or Codex sessions in multiple terminals,
          manually moving context between them and reviewing changes by hand.
        usage_reason_zh: 推断：它把多个代理放进同一频道互相审查，并在真实操作前强制人工确认，省去开发者在会话间搬运上下文和逐条自查的一步，因此需要并行编码且在意改动可控的开发者会试用。
        usage_reason_en: 'Inference: it puts several agents in shared channels to review each other and
          forces human confirmation before real actions, removing the step of moving context between sessions
          and self-checking each change, so developers doing parallel coding who care about control will
          try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多任务并行编码时上下文割裂和缺少互审的问题，痛点具体，人工放行环节可确定交付。
        evidence_ids:
        - ev-1991a61184f48b7c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度缓慢增长，缺少用户评价或团队采用案例，无法判断是否形成使用共识。
        evidence_ids:
        - ev-1991a61184f48b7c
        - ev-d21a59c1a22d4537
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价、付费路径或企业采购方式，买方与收入模式均未核验。
        evidence_ids:
        - ev-1991a61184f48b7c
      - gate: truth
        status: insufficient
        reason: 依赖已有编码代理，真实操作需人工放行是合理边界，但缺少交付结果与安全边界的实测材料。
        evidence_ids:
        - ev-1991a61184f48b7c
      next_validation: 收集该仓库的 issue 与 discussion，确认开发者实际用它完成的多代理协作任务及人工放行环节的反馈。
  uncut:
    slug: uncut
    name: uncut
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在脚本或 CI 中调用编码代理处理代码任务时，需要把代理接入自有工具链并控制其输出，避免代理静默截断或改写内容
    jobs_en:
    - Developers invoking a coding agent inside scripts or CI need to wire the agent into their own toolchain
      and control its output, avoiding silent truncation or rewriting
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在脚本、CI 或自有工具链里调用编码代理时打开它：它以单个约 7 MB 静态二进制、四个工具和标准输入输出接入，由调用方传入代码任务并接收代理输出，避免代理静默截断内容。用户拿到的是可嵌入自有流程的代理执行结果；具体工具清单与交付边界仍待核验。
    inspiration: 趋势：编码代理正从聊天界面下沉为可被脚本和 CI 调用的执行部件，控制权与可审计性成为新的竞争点。切入：从需要把代理嵌入内部流水线的工程团队入手，卖可复现的代理执行与审计，而非再做一个编码助手界面；定价未披露，不臆测。
    summary_en: 'Developers open it when invoking a coding agent inside scripts, CI or their own toolchain:
      it plugs in as a single ~7 MB static binary with four tools over plain stdin/stdout, taking code
      tasks from the caller and returning agent output without silently cutting content. Users get an
      agent run embeddable in their own pipeline; the exact tool list and delivery boundary still need
      verification.'
    inspiration_en: 'Trend: coding agents are sinking from chat UIs into script- and CI-callable execution
      parts, making control and auditability the new battleground. Entry: start with engineering teams
      embedding agents into internal pipelines, selling reproducible agent runs and audit rather than
      another coding assistant UI; pricing is undisclosed and not assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在脚本或 CI 中调用编码代理处理代码任务时，需要把代理接入自有工具链并控制其输出，避免代理静默截断或改写内容。
        job_en: Developers invoking a coding agent inside scripts or CI need to wire it into their own
          toolchain and control its output, avoiding silent truncation or rewriting.
        pain_zh: 通用编码代理在长任务中可能静默截断或改写内容，调用方难以在自动化流程里核对代理到底做了什么。
        pain_en: General coding agents may silently truncate or rewrite content on long tasks, making
          it hard for callers to verify what the agent actually did in automated flows.
        current_alternative_zh: 直接用通用编码代理的交互界面，或自行拼装脚本封装代理调用，缺少对输出完整性的控制。
        current_alternative_en: Using a general coding agent's interactive UI directly, or hand-rolling
          scripts to wrap agent calls, without control over output completeness.
        usage_reason_zh: 推断：相较在交互界面里手动跑代理，它以静态二进制和标准输入输出接入，让调用方在脚本中直接获得代理输出并减少人工核对截断的步骤，因此需要把代理嵌入流水线的工程团队会试用它。
        usage_reason_en: 'Inference: versus running an agent manually in an interactive UI, it plugs in
          as a static binary over stdin/stdout so callers get agent output directly in scripts and skip
          manual truncation checks, which is why teams embedding agents into pipelines would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者在自动化流程中调用编码代理并控制输出完整性的需求，痛点是不受控的截断与改写；旧做法是交互界面或自拼脚本。
        evidence_ids:
        - ev-0e95eec260f7ff06
        - ev-464b3e0cff9ff0da
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数在约 250–600 间波动，属关注度信号，缺少用户反馈或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-0e95eec260f7ff06
        - ev-750f2977f4530cb6
        - ev-464b3e0cff9ff0da
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或商业交付方式，买方与收费模式均未核验。
        evidence_ids:
        - ev-464b3e0cff9ff0da
      - gate: truth
        status: insufficient
        reason: 输出完整性承诺能否确定性交付缺少可复现实测或文档证据，安全与人工边界未说明。
        evidence_ids:
        - ev-0e95eec260f7ff06
      next_validation: 收集该仓库的 README 与 issue/discussion，核验四个工具的具体能力、输出完整性承诺及是否有用户报告实际接入脚本或 CI 的使用情况。
