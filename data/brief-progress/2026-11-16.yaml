      not seize the user''s screen, and a background virtual display decouples agent operation from user
      use. Entry: start from concrete Android automation scripts and cross-app data moving, targeting
      teams building phone agents or heavy automation users; monetization could center on a hosted execution
      environment rather than a plain open-source library, with no disclosed pricing.'
