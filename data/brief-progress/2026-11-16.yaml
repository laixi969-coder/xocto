  blender-ai-copilot-flow:
    slug: blender-ai-copilot-flow
    name: blender-ai-copilot-flow
    decision: watching
    event_summary_zh: 该开源仓库在 2026-11-12 创建后，星标数从 45 增至 510（截至 11-16 采集），同时有 48 个未关闭 issue，说明关注度快速上升但问题积压明显。
    event_summary_en: After the open-source repository was created on 2026-11-12, its stars rose from
      45 to 510 by the 11-16 collection, alongside 48 open issues, indicating fast-growing attention with
      a visible backlog of problems.
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与视觉特效
    - 游戏开发
    - 建筑与产品可视化
    industries_en:
    - 3D animation and VFX
    - game development
    - architecture and product visualization
    jobs:
    - 三维美术师在 Blender 中调整场景与模型时，把 AI 提出的每一步编辑作为可审批、可撤销的工具调用逐条执行，完成修改并保留可回退记录
    - 技术美术在搭建 Blender 自动化流程时，通过内置 MCP 服务把外部 AI 接入受控编辑序列
    jobs_en:
    - 3D artists adjusting scenes and models in Blender approve each AI-proposed edit as a supervised,
      undoable tool call and keep a rollback record
    - technical artists building Blender automation connect external AI through the built-in MCP server
      into a controlled edit sequence
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在 Blender 里改场景或模型时打开它，AI 把每次编辑拆成先提议、再经用户批准、按顺序执行的工具调用，当前步骤后可取消、可按名称撤销；用户拿到的是逐步受控的修改结果，仍需自己逐条确认。具体交付与稳定性仍待核验。
    inspiration: 趋势是 AI 进入专业创作软件时，竞争点从“能不能生成”转向“改动是否可控、可撤销、可审计”。切入可放在三维、影视后期这类返工成本高的环节，卖受控编辑与回退记录，而不是又一个生成按钮；但该仓库
      issue 积压，先看它能否把审批流做稳。
    summary_en: When 3D artists edit scenes or models in Blender, the tool turns each AI edit into a tool
      call that is proposed, approved by the user, then executed in sequence, cancellable after the current
      step and undoable by name; users get stepwise controlled changes and still confirm each one. Concrete
