    jobs_en:
    - Automation or web-operations developers who need an AI agent to batch-fill and submit forms across
      multiple tabs, handling React, Shadow DOM and iframe pages, to complete repeatable form-filling
      and submission tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在让 AI 代理操作网页时，打开这个开源 MCP 服务，把多标签页表单填写、紧凑的 DOM 增量快照、React/Shadow DOM/iframe 表单填写、磁盘文件上传和提交保护交给代理执行；用户拿到的是代理完成填表与提交的动作，具体流程与交付仍待核验。
    inspiration: 趋势：AI 代理操作网页的瓶颈正从“能不能点”转向“填得准、提交不出错”，表单与提交保护成为可单独做的一层。切入：从需要批量填报的行业后台（如保险录单、政务申报、电商上架）进入，卖可审计的填表与提交结果，而不是再做一个通用浏览器代理。
    summary_en: When developers let an AI agent operate web pages, they run this open-source MCP server
      so the agent handles multi-tab form filling, compact delta DOM snapshots, React/Shadow DOM/iframe
      form entry, disk file uploads and submit guards; the user gets the agent's fill-and-submit actions,
      while the exact workflow and delivery still need verification.
    inspiration_en: 'Trend: the bottleneck for web-operating AI agents is shifting from ''can it click''
      to ''does it fill correctly and submit safely'', making forms and submit guards a separable layer.
      Entry: start from industry back-offices that need bulk form entry (insurance intake, government
      filings, e-commerce listings) and sell auditable fill-and-submit outcomes rather than another general
      browser agent.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自动化测试或网页操作开发者，在让 AI 代理批量填写多标签页表单并提交时，处理 React、Shadow DOM 与 iframe 页面，要完成可重复的填表与提交任务。
        job_en: Automation or web-operations developers who need an AI agent to batch-fill and submit
          forms across multiple tabs, handling React, Shadow DOM and iframe pages, to complete repeatable
          form-filling and submission tasks.
        pain_zh: 网页表单结构复杂、跨标签页与 iframe，代理容易填错或误提交，开发者要反复调试选择器和提交逻辑。
        pain_en: Web forms are structurally complex across tabs and iframes, so agents easily mis-fill
          or mis-submit, forcing developers to repeatedly debug selectors and submit logic.
        current_alternative_zh: 开发者自己写 Playwright 脚本或直接用通用浏览器代理，逐个处理选择器、等待与提交校验。
        current_alternative_en: Developers hand-write Playwright scripts or use general browser agents,
          handling selectors, waits and submit checks one by one.
        usage_reason_zh: 推断：它把多标签页批量填表、DOM 增量快照和提交保护打包成代理可直接调用的动作，减少开发者逐页写选择器与提交校验的步骤，因此需要批量填报的自动化开发者会在复杂表单场景选择它。
        usage_reason_en: 'Inference: it packages multi-tab batch filling, delta DOM snapshots and submit
          guards into actions an agent can call directly, cutting the steps developers spend writing per-page
          selectors and submit checks, so automation developers doing bulk form entry would pick it for
          complex forms.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 代理在复杂网页表单上填错、误提交的问题，痛点具体且旧做法是手写脚本，结构上成立。
        evidence_ids:
        - ev-386aec8c98e6553c
        - ev-669726f003ee9b71
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度与少量社区讨论，缺少真实使用者的采用或评价证据。
        evidence_ids:
        - ev-669726f003ee9b71
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，钱可能来自企业定制或托管服务，属判断非事实。
        evidence_ids:
        - ev-669726f003ee9b71
      - gate: truth
        status: insufficient
        reason: 提交保护与填表准确性是否确定性交付，缺少可复现实测或 issue 反馈支持。
        evidence_ids:
        - ev-386aec8c98e6553c
      next_validation: 收集该仓库的 issue/discussion 与可复现实测，核验复杂表单下填表准确率与提交保护的实际表现。
    event_summary_zh: 2026-11-14 至 11-15，Turbo-Browser-MCP 在开源仓库发布并获约 109 星、社区讨论 47 分，提供面向 MCP 的批量表单、DOM
      增量与提交保护能力。
    event_summary_en: On 2026-11-14 to 11-15, Turbo-Browser-MCP was published as an open-source repository
      with about 109 stars and a 47-point community discussion, offering MCP-oriented batch forms, DOM
      deltas and submit guards.
  ggerganov-llamacpp-v100:
    slug: ggerganov-llamacpp-v100
    name: llama.cpp
    decision: market_context
    event_summary_zh: 2026年11月13日，llama.cpp 发布 v1.0.0：移除已弃用的公开 API，把 NextN/推测解码 API 提升进 llama.h，新增 OCP
      FP8 KV 缓存、可配置 CPU 份额的宿主内存 MoE 专家缓存、外部 PLE 分片加载，并新增三种文本架构、drama-3 TTS 与两个视觉模型支持，同时加固 llama-server
      的 SSRF 防护。这是本地推理基础设施的版本升级，不是独立应用产品。
    event_summary_en: 'On 13 November 2026, llama.cpp shipped v1.0.0: it removed the deprecated public
      API, promoted the NextN/speculative decoding API into llama.h, added OCP FP8 KV caches, a host-memory
      MoE expert cache with configurable CPU share, external PLE shard loading, three new text architectures,
      drama-3 TTS and two vision model families, and hardened llama-server against SSRF. This is an infrastructure
      release for local inference, not a standalone application product.'
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: llama.cpp 是本地运行大模型的推理引擎，开发者在自己机器或私有服务器上加载模型权重并对外提供推理服务时会用到它。v1.0.0 这次改动集中在接口清理、KV 缓存与
      MoE 专家缓存的显存/内存调度、新模型架构与语音视觉支持，以及 llama-server 的安全加固；它交付的是可编译的推理运行时，不是面向业务用户的成品应用，具体业务交付仍需使用者自行搭建。
    inspiration: 趋势：本地与私有化推理的运行时正在快速吸收新模型架构和显存优化，模型能力下沉到端侧和私有环境的成本门槛继续降低。切入：机会不在再造一个推理引擎，而在其之上做垂直行业的私有部署交付，例如把本地推理封装成律所文档审阅、医院病历脱敏或工厂质检的整机方案，按部署与运维收费；具体价格未披露。
    summary_en: 'llama.cpp is a local inference engine for running large models: developers load model
      weights on their own machines or private servers and expose inference through it. Release v1.0.0
      focuses on API cleanup, GPU/host memory scheduling for KV caches and MoE expert caches, support
      for new text, speech and vision architectures, and security hardening of llama-server. It delivers
      a compilable inference runtime rather than a finished business application; any end-user workflow
      still has to be built on top of it.'
    inspiration_en: 'Trend: local and private inference runtimes are quickly absorbing new model architectures
      and memory optimisations, lowering the cost of pushing model capability onto devices and private
      environments. Angle: the opportunity is not another inference engine but vertical private-deployment
      delivery on top of it, for example packaging local inference into turnkey setups for law-firm document
      review, hospital record de-identification or factory inspection, charged per deployment and operations;
      pricing is not disclosed.'
