    - Development teams run AI agents with tool and browser access in a self-hosted environment and have
      members approve the results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发团队在自托管的工作区里，把频道和私信中的任务交给接入 Claude、ChatGPT/Codex、Gemini 或 Grok 的 AI 代理，代理可调用 MCP 工具、使用自己的电脑与浏览器、按例程执行并保留记忆，成员对关键动作做审批；最终交付是代理在会话中完成的操作与结果，具体流程和交付质量仍待核验。
    inspiration: 趋势：团队协作界面正在变成人和 AI 代理共同工作的场所，代理从单次问答走向带工具、带审批的持续任务。切入：可从需要数据不出内网的研发团队或受监管行业切入，卖自托管部署与代理权限治理，而不是再做一个通用聊天入口；定价未披露，不能预设。
    summary_en: In a self-hosted workspace, development teams assign tasks in channels and DMs to AI agents
      backed by Claude, ChatGPT/Codex, Gemini or Grok; agents can call MCP tools, use their own computer
      and browser, run routines and keep memory, while members approve key actions. The deliverable is
      the actions and results agents complete in conversation; the exact workflow and output quality still
      need verification.
    inspiration_en: 'Trend: team collaboration surfaces are becoming places where people and AI agents
      work side by side, with agents moving from one-off answers to tool-using, approval-gated tasks.
      Entry: target R&D teams or regulated industries that cannot send data outside their network, selling
      self-hosted deployment and agent permission governance rather than another general chat entry; pricing
      is undisclosed and must not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发团队在自托管工作区里，把代码库排查、资料检索等任务交给频道中的 AI 代理，并审阅代理调用工具和浏览器后的产出。
        job_en: Development teams in a self-hosted workspace hand codebase triage and document lookup
          tasks to AI agents in channels, then review outputs after agents use tools and browsers.
        pain_zh: 团队既想让代理直接动手做事，又不能让代码和数据流出内网，还要对代理的每一步操作保留审批与追溯。
        pain_en: Teams want agents to actually do work, but cannot let code and data leave their network
          and need approval and traceability for each agent action.
        current_alternative_zh: 用公有云 Slack 加外部机器人，或让成员在聊天工具和终端之间手工搬运任务与结果。
        current_alternative_en: Using public-cloud Slack with external bots, or having members manually
          move tasks and results between chat tools and terminals.
        usage_reason_zh: 推断：相较公有云聊天加外部机器人，它把代理、工具调用、浏览器和审批放在同一自托管会话里，减少成员在聊天工具与执行环境之间搬运任务这一步，因此重视数据边界的研发团队会在需要代理动手时选择它。
        usage_reason_en: 'Inference: versus public-cloud chat plus external bots, it keeps agents, tool
          calls, browser and approvals in one self-hosted conversation, removing the step of moving tasks
          between chat and execution environments, so teams that care about data boundaries would pick
          it when they need agents to act.'
      gates:
      - gate: value
        status: supported
        reason: 它解决团队让 AI 代理动手做事又要把数据留在内网、并对操作保留审批的需求，痛点具体；买方与付费路径尚未披露。
        evidence_ids:
        - ev-45dbb5c54903b0d4
        - ev-d4306a34913861a2
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从约 320 增至 1524 的关注度信号，缺少团队实际采用或持续使用的公开证据。
        evidence_ids:
        - ev-45dbb5c54903b0d4
        - ev-d4306a34913861a2
      - gate: model
        status: insufficient
        reason: 开源 AGPL 项目，未见托管版定价、企业部署合同或按结果收费的公开材料，钱从哪来仍是判断而非事实。
        evidence_ids:
        - ev-d4306a34913861a2
      - gate: truth
        status: insufficient
        reason: 代理带浏览器与电脑权限，安全边界和人工审批能否确定性交付尚无公开实测或客户案例支持。
        evidence_ids:
        - ev-45dbb5c54903b0d4
      next_validation: 收集该仓库的 issue 与 discussion，确认是否有团队报告实际部署、代理权限治理与审批流程的使用情况。
