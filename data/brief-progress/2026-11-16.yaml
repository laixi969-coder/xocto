      back
    - A busy individual who suddenly needs a train ticket, groceries or a court booking hands the request
      to the assistant by text or call, and it places the order on the relevant site or app and reports
      back
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 个人用户在临时要订火车票、买杂货、送花或找周末球场时，用短信或电话把需求告诉 Instinct；它自称能像用户一样操作手机和电脑，替用户在这些网站或应用上完成下单，再把结果回报给用户。支付授权、失败处理和人工确认环节在公开材料中未说明，具体流程与交付仍待核验。
    inspiration: 趋势：个人事务的入口正从“打开一个个 App”转向“用一句话把跨应用的多步操作外包出去”，竞争点从回答质量变成能否真正完成下单这类有副作用的动作。切入：可从高频、低金额、失败可回滚的本地生活事务（买菜、订场地、送花）做起，按成功完成的订单收费，而不是卖订阅席位；高金额或需实名授权的出行票务应后置，并先解决支付授权与失败回滚。
    summary_en: When a person suddenly needs a train ticket, groceries, flowers or a weekend court, they
      tell Instinct by text or call; it claims to operate a phone and computer like the user to place
      those orders on the relevant sites or apps and report back. Payment authorization, failure handling
      and human confirmation are not described in public material, so the exact workflow and delivery
      still need verification.
    inspiration_en: 'Trend: the entry point for personal errands is shifting from opening many apps to
      outsourcing a multi-step, cross-app task in one sentence; the contest moves from answer quality
      to actually completing actions with side effects. Entry: start with high-frequency, low-value, reversible
      local errands (groceries, court booking, flowers) and charge per successfully completed order rather
      than per seat; defer high-value or identity-verified travel ticketing until payment authorization
      and rollback are solved.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在临时需要订火车票、买杂货、送花或找周末球场时，通过短信或电话把需求交给助手，由它代为在对应网站或应用上完成下单并回报结果。
        job_en: A person who suddenly needs a train ticket, groceries, flowers or a weekend court hands
          the request to the assistant by text or call, and it places the order on the relevant site or
          app and reports back.
        pain_zh: 这类事务分散在多个应用里，每一步都要自己搜索、比价、填表、付款，临时起意时尤其费时；用户真正想要的是事情被办完，而不是再多一个界面。
        pain_en: These errands are scattered across many apps, each requiring search, comparison, form
          filling and payment, which is especially costly on short notice; users want the task done, not
          another interface.
        current_alternative_zh: 现状是用户自己逐个打开订票、生鲜、鲜花和场地预订应用手动操作，或请家人朋友代办；也有人用通用聊天助手查信息，但最后一步仍要自己下单。
        current_alternative_en: Today users open ticketing, grocery, flower and court-booking apps one
          by one and act manually, or ask family and friends; some use general chat assistants for information
          but still place the order themselves.
        usage_reason_zh: 推断：相较逐个 App 手动操作，Instinct 让用户用已有的短信或电话直接表达需求，由它代为完成跨应用的下单动作，省去搜索、填表和切换应用这几步；因此临时起意、不愿自己操作多个应用的用户会尝试它。公开材料未说明支付授权与失败处理，这是采用能否持续的关键缺口。
        usage_reason_en: 'Inference: compared with manually working through several apps, Instinct lets
          users state the need in an existing text or call channel and has it carry out the cross-app
          ordering, removing search, form filling and app switching; users acting on short notice who
          dislike juggling apps would try it. Public material does not describe payment authorization
          or failure handling, a key gap for sustained use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是把跨应用的多步个人事务办完这一需求，痛点是分散操作与临时起意的时间成本；旧做法是逐个 App 手动下单，结构上成立，但支付与失败处理未说明。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-40c38047ef2de745
      - gate: consensus
        status: insufficient
        reason: 只有官网自述，未见用户评价、客户案例或社区讨论能说明有人真的把事务交给它并持续使用。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-40c38047ef2de745
      - gate: model
        status: insufficient
        reason: 官网未披露定价、收费方式或买方；按完成订单收费还是订阅只能作为推断，钱从个人用户来是判断而非已验证事实。
        evidence_ids:
        - ev-0b8efa462a241b8b
      - gate: truth
        status: insufficient
        reason: 它贴近“把事情办完”的第一性目标，但代下单涉及支付授权、身份与失败回滚，公开材料未说明这些边界如何确定性交付。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-40c38047ef2de745
      next_validation: 收集 Instinct 官方定价页或帮助文档，确认其收费方式以及代下单时的支付授权与失败处理规则。
