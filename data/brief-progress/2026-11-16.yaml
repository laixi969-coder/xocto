    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在没有电脑或服务器的情况下，于 iPhone 或 iPad 上打开 fish-pocket，在本机运行 DeepSeek Harness 并得到原生界面。它接收的是本地模型运行请求，执行的是在移动设备上启动该运行环境，用户最终拿到一个不依赖外部电脑或服务器的移动端操作界面；具体支持哪些任务与交付结果仍待核验。
    inspiration: 趋势：模型运行环境正从桌面和服务器向移动端下沉，随身设备开始承担原本需要固定机器的开发动作。切入：可从需要在现场、通勤或出差途中临时跑本地模型的开发者切入，卖点是不依赖外部机器的随身运行环境；具体任务边界与收费方式尚未披露，需先核验。
    summary_en: Developers open fish-pocket on an iPhone or iPad when no computer or server is available,
      running DeepSeek Harness locally through a fully native interface. It takes a local model-run request
      and launches that harness on the mobile device, leaving the user with a mobile interface that does
      not depend on an external computer or server; which tasks and outputs it supports still needs verification.
    inspiration_en: 'Trend: model runtimes are moving from desktops and servers down to mobile devices,
      letting pocket hardware take on development actions that once needed a fixed machine. Entry: start
      with developers who need to run local models on site, in transit or while travelling, selling a
      portable runtime that needs no external machine; task boundaries and pricing are not disclosed and
      need verification first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在没有电脑或服务器的场景下，用 iPhone 或 iPad 打开本地运行环境，处理需要本机模型的代码与调试任务。
        job_en: A developer without a computer or server opens a local runtime on an iPhone or iPad to
          handle coding and debugging tasks that need an on-device model.
        pain_zh: 离开固定机器就无法运行本地模型环境，临时任务要么推迟，要么另找设备。
        pain_en: Away from a fixed machine, the local model environment cannot run, so ad-hoc tasks are
          either postponed or need another device.
        current_alternative_zh: 等到回到电脑前再跑，或远程连接服务器；两者都依赖另一台机器在线。
        current_alternative_en: Wait until back at a computer, or connect remotely to a server; both depend
          on another machine being online.
        usage_reason_zh: 推断：相较等回到电脑或远程连服务器，它在手机上直接启动本机运行环境，省去另找设备和建立远程连接这一步，因此需要在现场或途中临时跑本地模型的开发者会尝试它；是否长期留在工作流尚无公开证据。
        usage_reason_en: 'Inference: compared with waiting for a computer or connecting remotely, it starts
          the local runtime directly on the phone, removing the step of finding another device and setting
          up a remote connection, so developers needing an on-the-spot local model run may try it; no
          public evidence yet that it stays in the workflow long term.'
      gates:
      - gate: value
        status: supported
        reason: 它解决离开固定机器就无法运行本地模型环境的问题，痛点具体，交付是移动端可用的运行界面；具体任务范围仍待核验。
        evidence_ids:
        - ev-bca682ef94126fd6
      - gate: consensus
        status: insufficient
        reason: 只有仓库关注度随时间缓慢上升，缺少用户评价或采用说明，无法判断场景共识。
        evidence_ids:
        - ev-bca682ef94126fd6
        - ev-166e716f30a435ff
      - gate: model
        status: insufficient
        reason: 开源项目，未披露定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
