    summary_en: 'Candidate materials describe an independent memory service plus plugin: during assistant
      conversations it stores verbatim evidence, organizes it in the background, and exposes life and
      emotion rules through a panel. The exact integration flow, retrieval quality and delivery form still
      need verification.'
    inspiration_en: 'Trend: assistant memory is being split out of built-in model features into a separately
      deployable layer, and whoever holds long-term memory holds user context. Entry: start with small
      service teams that must remember client preferences and history across sessions, such as personal
      trainers, consultants or outsourced support, charging per memory record or seat; the repository
      currently shows only star growth, with no usage or payment signal.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 个人用户希望助手跨会话记住自己的偏好与情绪背景；开发者希望把记忆能力接入自己的对话应用。
        job_en: Individual users want an assistant to remember their preferences and emotional context
          across sessions; developers want to plug memory capability into their own chat applications.
        pain_zh: 对话助手每次会话从零开始，用户要重复交代背景；现有记忆多为模型内置且不可查、不可迁移。
        pain_en: Assistants restart from zero each session, forcing users to restate context; existing
          memory is mostly built into the model, unsearchable and non-portable.
        current_alternative_zh: 用户手动粘贴历史对话、自建笔记，或依赖模型厂商自带的记忆开关。
        current_alternative_en: Users manually paste past conversations, keep their own notes, or rely
          on the memory toggle shipped by the model vendor.
        usage_reason_zh: 推断：它把原话证据留存并在后台整理成可查条目，减少用户每次重新交代背景这一步；但公开材料未显示谁在持续使用或付费，选择动机尚缺用户反馈支持。
        usage_reason_en: 'Inference: it keeps verbatim evidence and organizes it into searchable entries
          in the background, removing the step of restating context each time; public materials show no
          sustained usage or payment, so the choice motive lacks user-feedback support.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决跨会话记忆丢失、背景需重复交代的问题，痛点结构成立；但公开材料只有功能描述，未说明具体旧流程与不采用的后果。
        evidence_ids:
        - ev-2ed34b85d2639750
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从157缓慢增至188，属关注度而非采用证据，无用户评价或案例说明谁在真实场景使用。
        evidence_ids:
        - ev-6d0c9afe1f9130ee
        - ev-2ed34b85d2639750
      - gate: model
        status: insufficient
        reason: 未见定价页、付费路径或买方说明；开源项目可能靠托管服务或企业部署收费，这是判断不是已验证事实。
        evidence_ids:
        - ev-2ed34b85d2639750
      - gate: truth
        status: insufficient
        reason: 记忆的准确性与隐私边界未在材料中说明，无法核对它是否比模型内置记忆更可靠地交付。
        evidence_ids:
        - ev-2ed34b85d2639750
      next_validation: 收集该仓库的 README 与 issue/discussion，确认记忆检索的实际流程、部署方式及是否有用户报告持续使用。
