      changes and track a task board in one window to complete a round of scene editing
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在 Blender 中处理场景修改时，打开这个伴随窗口，把对话、场景对象、视口快照、审批和任务板放在一起，AI 提出改动后由美术师审批，任务板跟踪进度；具体模型接入与交付结果仍待核验。
    inspiration: 趋势是 AI 进入三维软件时先解决“人如何审阅和批准代理改动”，而不是直接生成模型。切入可放在需要多人协作审片的美术团队：把审批记录和任务板做成可追溯的交付凭证，按团队席位或项目收费。
    summary_en: When 3D artists handle scene edits in Blender, they open this companion window that combines
      chat, scene objects, viewport snapshots, approvals and a task board; AI proposes changes, the artist
      approves them, and the board tracks progress. Model integration and delivery results still need
      verification.
    inspiration_en: 'The trend is that when AI enters 3D software, the first problem is how people review
      and approve agent changes, not generating models directly. The entry point could be art teams that
      need multi-person review: make approval records and the task board a traceable delivery record,
      and charge per team seat or per project.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 中处理场景修改任务时，在同一窗口查看视口快照、审批 AI 提出的改动并跟踪任务板，完成一轮场景编辑。
