      client for BlackBerry OS 7 tuned for AI coding agents, tmux and voice input, built on berryssh;
      over roughly two weeks its repository stars rose slowly from 40 to 50.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在离开电脑时用旧款BlackBerry手机通过SSH连回服务器，查看并操作正在运行的AI编码代理会话与tmux窗口，完成继续推进或确认任务
    jobs_en:
    - Developers away from their computer use an old BlackBerry phone over SSH to reach their server,
      inspect and operate running AI coding agent sessions and tmux windows, and continue or confirm tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在外出、手边只有旧款BlackBerry OS 7手机时打开它，通过SSH连回服务器，查看并操作正在运行的AI编码代理会话和tmux窗口，还能用语音输入下达指令；最终拿到的是远程终端里的操作结果，具体流程与交付仍待核验。
    inspiration: 趋势是AI编码代理开始长时间在服务器上跑任务，人离开电脑后仍想查看和干预，远程接入这类会话成了新环节。切入可从需要随时盯住长任务的小团队或独立开发者入手，做轻量移动端接入与任务状态提醒，而非重做完整终端；是否收费未披露。
    summary_en: When developers are out and only have an old BlackBerry OS 7 phone, they open it to reach
      their server over SSH, inspect and operate running AI coding agent sessions and tmux windows, and
      can issue commands by voice; what they get is the result inside a remote terminal, and the exact
      workflow and delivery still need verification.
    inspiration_en: The trend is that AI coding agents now run long tasks on servers, and people away
      from their computer still want to check in and intervene, making remote access to these sessions
      a new step. An entry point is small teams or solo developers who need to watch long-running tasks,
      offering lightweight mobile access and task-status alerts rather than rebuilding a full terminal;
      pricing is not disclosed.
