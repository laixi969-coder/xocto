  baseten:
    slug: baseten
    name: Baseten
    decision: market_context
    event_summary_zh: 2026年10月30日至31日，多家媒体报道 Baseten 正以约300亿美元估值启动新一轮融资，较2026年6月的估值翻倍以上；同期它被列入 Madrona
      2026 Intelligent Applications 40 的 Enabler 阶段。报道同时称 Together AI、Fireworks、Fal、OpenRouter 等推理与多模型路由厂商估值同比翻倍或更多，尚无一家明显拉开差距。
    event_summary_en: On 30–31 October 2026, multiple outlets reported that Baseten is raising a new round
      at roughly a $30 billion valuation, more than double its June 2026 level; it was also named to Madrona's
      2026 Intelligent Applications 40 at the Enabler stage. The same reporting says inference and multi-model
      routing vendors such as Together AI, Fireworks, Fal and OpenRouter are also roughly doubling or
      more their valuations year over year, with no clear winner yet.
    category: 基础层
    project_type: ai_transformation
    industries:
    - 云计算与算力基础设施
    - 软件开发
    industries_en:
    - Cloud and compute infrastructure
    - Software development
    jobs:
    - AI 应用团队在模型上线前选择推理托管与路由方案，处理模型部署、扩缩容与多模型调用，完成稳定且可控成本的线上服务
    jobs_en:
    - AI application teams choosing inference hosting and routing before launch, handling model deployment,
      scaling and multi-model calls to deliver stable, cost-controlled production service
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: Baseten 是面向 AI 应用团队的模型推理托管与部署平台，团队把训练好的模型交给它上线、扩缩容并对外提供调用。本次新增事实是融资估值报道与行业榜单入选，而非新的产品能力或客户交付结果；具体定价与客户留存仍待核验。
    inspiration: 推理算力与多模型路由的估值集体翻倍，说明钱正涌向“把模型稳定跑起来”这一层，而不是应用层本身。切入不在正面拼 GPU 规模，而在被这层忽略的垂直场景：为受监管行业做可审计的私有推理与成本结算，或按调用结果而非算力时长收费。
    summary_en: 'Baseten is a model inference hosting and deployment platform for AI application teams:
      they hand over trained models to be served, scaled and called in production. The new facts here
      are funding-valuation reporting and a list inclusion, not new product capability or delivered customer
      outcomes; pricing and retention remain unverified.'
    inspiration_en: 'Valuations across inference compute and multi-model routing are doubling together,
      showing capital is flowing to the layer that keeps models running rather than to applications. The
      opening is not head-on GPU scale but vertical gaps this layer ignores: auditable private inference
      and cost settlement for regulated industries, or charging per delivered result rather than per compute
      hour.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 应用团队在模型上线前，需要把训练好的模型部署成可扩缩、可计费的线上服务，并处理多模型调用与成本控制。
        job_en: Before launch, AI application teams need to turn trained models into scalable, billable
          production services while handling multi-model calls and cost control.
        pain_zh: 自建推理集群要养基础设施团队、承担 GPU 闲置成本，模型版本与流量波动时扩缩容容易出错；这是工作流推理，公开材料未给出用户原话。
        pain_en: Self-hosting inference requires an infrastructure team, carries idle GPU cost, and scaling
          is error-prone as model versions and traffic fluctuate; this is workflow inference, not user
          testimony in the public material.
        current_alternative_zh: 团队自建 Kubernetes 推理集群，或直接调用模型厂商 API，再自行拼接路由与监控。
        current_alternative_en: Teams build their own Kubernetes inference clusters, or call model vendor
          APIs directly and stitch routing and monitoring themselves.
        usage_reason_zh: 推断：相较自建集群，托管平台把部署、扩缩容与多模型路由收进一个交付面，减少团队维护基础设施的那一步；因此缺少专职基础设施人手、又要快速上线多模型的团队会在上线前选择它。公开材料未提供留存或复购证据。
        usage_reason_en: 'Inference: versus self-built clusters, a hosted platform folds deployment, scaling
          and multi-model routing into one delivery surface, removing the step of maintaining infrastructure;
          teams without dedicated infra staff that must ship several models quickly would choose it before
          launch. No retention or repeat-purchase evidence is public.'
      gates:
      - gate: value
        status: supported
        reason: 它解决模型上线时的部署、扩缩容与多模型路由负担，替代自建集群这一具体旧流程；买方与付费路径公开材料未说明。
        evidence_ids:
        - ev-506938a307a75889
      - gate: consensus
        status: insufficient
        reason: 仅有榜单入选与融资估值报道，属于关注度与规模信号，未见开发者采用规模或客户案例。
        evidence_ids:
        - ev-506938a307a75889
        - ev-56eba7ffb2d52e14
      - gate: model
        status: insufficient
        reason: 报道只提估值翻倍，未披露定价结构、收入或毛利，无法判断按算力还是按结果收费。
        evidence_ids:
        - ev-56eba7ffb2d52e14
        - ev-85db4ff4c02ee146
      - gate: truth
        status: insufficient
        reason: 未见交付确定性、SLA 或安全边界材料；估值报道不能替代对推理结果可靠性的核验。
        evidence_ids:
        - ev-85db4ff4c02ee146
      next_validation: 收集 Baseten 官方定价页与公开客户案例，核对其计费方式（按算力时长还是按调用结果）及已披露的部署规模。
