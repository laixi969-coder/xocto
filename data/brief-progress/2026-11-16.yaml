  halfsize:
    slug: halfsize
    name: halfsize
    decision: watching
    event_summary_zh: 2026-11-03 发布的开源本地视频压缩工具，可把视频压到指定大小（如 Discord、微信 20 MB、WhatsApp 16 MB），HDR 转 SDR
      并用 VMAF/SSIM 校验质量，同时以 MCP server 形式供 AI 代理调用；仓库星标 104。
    event_summary_en: An open-source local video compressor released on 2026-11-03 that compresses video
      to an exact target size (e.g. Discord, WeChat 20 MB, WhatsApp 16 MB), tone-maps HDR to SDR and checks
      quality with VMAF/SSIM, and runs as an MCP server for AI agents; repository stars 104.
    category: AI + 效率
    project_type: open_source
    industries:
    - 内容创作
    - 社交媒体运营
    industries_en:
    - content creation
    - social media operations
    jobs:
    - 内容创作者或运营在向 Discord、微信、WhatsApp 等平台上传视频被大小限制卡住时，把视频交给该工具压到指定体积，得到可上传且质量可核验的文件
    jobs_en:
    - Content creators or operators blocked by upload size limits on Discord, WeChat or WhatsApp hand
      a video to the tool to compress it to an exact target size, getting an uploadable file with verifiable
      quality
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 内容创作者或运营在向 Discord、微信、WhatsApp 上传视频被大小限制卡住时，把视频交给该本地工具，它用 FFmpeg 压到指定体积、把 HDR 转 SDR 并用
      VMAF/SSIM 校验质量，最终得到可上传文件；同时以 MCP server 供 AI 代理调用，具体流程与质量边界仍待核验。
    inspiration: 趋势：平台上传体积限制是长期存在的硬约束，AI 代理开始把这类本地媒体处理步骤接进自动化流程。切入：面向社媒运营或内容团队，从“按平台规格一键出片”这一环节进入，可按次或按团队订阅收费；但压缩本身是成熟工具市场，差异化在质量校验与代理集成，付费意愿尚未核验。
    summary_en: When content creators or operators are blocked by upload size limits on Discord, WeChat
      or WhatsApp, they hand a video to this local tool, which uses FFmpeg to hit an exact target size,
      tone-maps HDR to SDR and checks quality with VMAF/SSIM, delivering an uploadable file; it also runs
      as an MCP server for AI agents, with exact workflow and quality limits still to verify.
    inspiration_en: 'Trend: platform upload size limits are a persistent hard constraint, and AI agents
      are starting to wire such local media steps into automated workflows. Entry: target social media
      operators or content teams at the ''one-click output to platform spec'' step, charging per use or
      per team subscription; compression is a mature tool market, so differentiation lies in quality checks
      and agent integration, and willingness to pay is unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容创作者或运营在向 Discord、微信、WhatsApp 等平台上传视频被大小限制卡住时，把视频交给该工具压到指定体积，得到可上传且质量可核验的文件。
        job_en: Content creators or operators blocked by upload size limits on Discord, WeChat or WhatsApp
          hand a video to the tool to compress it to an exact target size, getting an uploadable file
          with verifiable quality.
        pain_zh: 平台上传体积上限固定，手动调码率反复试压耗时，且压缩后画质是否可接受难以判断。
        pain_en: Platform upload caps are fixed, manually tuning bitrate and re-compressing is time-consuming,
          and judging whether quality is acceptable after compression is hard.
        current_alternative_zh: 用 HandBrake、在线压缩站或命令行 FFmpeg 反复试参数，凭肉眼判断画质。
        current_alternative_en: Using HandBrake, online compressors or command-line FFmpeg with repeated
          parameter trials, judging quality by eye.
        usage_reason_zh: 推断：相较反复试参数，该工具直接按目标体积压缩并用 VMAF/SSIM 给出质量指标，减少试错轮次，因此社媒运营在按平台规格出片时会选择它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: compared with repeated parameter trials, the tool compresses to a
