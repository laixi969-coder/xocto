  skills:
    slug: skills
    name: skills
    decision: watching
    event_summary_zh: 2026年9月17日，skills CLI 新增对 Notion 托管 skills 的支持；9月25日发布《State of agent skills》一文，同期该仓库在社区获得约390星、123次fork与40点讨论。
    event_summary_en: On 17 September 2026 the skills CLI added support for Notion-hosted skills; on 25
      September a 'State of agent skills' post appeared, while the repository drew roughly 390 stars,
      123 forks and 40 points of community discussion.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 使用编码代理开发软件的工程师
    jobs_en:
    - Engineers building software with coding agents
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用编码代理写代码的工程师，在规划任务、拆分步骤和并行处理多个代码分支时，打开这套公开的 skills 集合，把 PIV 循环、计划、worktree 等做法以可复用文件的形式交给代理执行；代理据此产出计划与代码改动，最终仍需工程师自行确认合并。具体交付流程与人工确认边界仍待核验。
    inspiration: 趋势是编码代理的“工作方法”正从个人提示词变成可分发、可托管的文件资产，连文档平台都开始托管这类技能包。切入可考虑面向特定技术栈或特定行业代码库（如金融、医疗合规代码）提供带审查步骤的技能包与配套验收清单，按团队订阅或按项目交付收费；价格未披露，不做假设。
    summary_en: Engineers who write code with coding agents open this public skills collection when planning
      tasks, splitting steps and running parallel code branches, handing reusable files for the PIV loop,
      planning and worktrees to the agent; the agent then produces plans and code changes, and the engineer
      still confirms the merge. The exact delivery flow and human review boundary remain to be verified.
    inspiration_en: The trend is that a coding agent's working method is turning from personal prompts
      into distributable, hostable file assets, with documentation platforms now hosting such skill packs.
      A wedge is to ship skill packs plus acceptance checklists for a specific stack or a regulated codebase
      such as finance or healthcare, sold per team subscription or per project; no pricing is disclosed,
      so none is assumed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理开发软件的工程师，在把需求拆成可执行步骤、并让代理在多个代码分支上并行改动时，需要一套可复用的操作规范，让代理按固定流程产出计划与代码改动。
        job_en: Engineers building software with coding agents need a reusable operating convention when
          breaking requirements into executable steps and letting the agent change several code branches
          in parallel, so the agent produces plans and code changes in a fixed flow.
        pain_zh: 代理每次都要重新交代流程，个人提示词散落各处、难以复用和共享，团队里不同人得到的产出格式不一致，返工和复核成本高。
        pain_en: The flow must be re-explained to the agent each time, personal prompts are scattered
          and hard to reuse or share, different team members get inconsistent output formats, and rework
          and review costs are high.
        current_alternative_zh: 各人自己维护的提示词片段、聊天记录里复制粘贴的指令，或团队内部零散文档。
        current_alternative_en: Self-maintained prompt snippets, instructions copy-pasted from chat history,
          or scattered internal team documents.
        usage_reason_zh: 相较各人自存提示词，它把规划、worktree 等步骤固化成可分发文件，代理直接读取执行，省去每次重新交代流程这一步，并让同一团队拿到格式一致的产出；这是基于产品能力与任务结构作出的推断，尚无留存或复购证据。
        usage_reason_en: Compared with individually stored prompts, it fixes planning and worktree steps
          into distributable files that the agent reads and executes, removing the step of re-explaining
          the flow each time and giving a team consistently formatted output; this is an inference from
          product capability and task structure, with no retention or repeat-use evidence yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理使用中流程需反复交代、产出格式不一致的痛点，旧做法是各人自存提示词，不采用的代价是重复返工与复核成本，结构上成立。
        evidence_ids:
        - ev-340d2dfd67c2e11a
        - ev-fe38b444d35412bc
      - gate: consensus
        status: insufficient
        reason: 社区有约390星、123次fork与40点讨论，属关注度信号，未见团队采用或持续使用的公开证据。
        evidence_ids:
        - ev-fe38b444d35412bc
      - gate: model
        status: insufficient
        reason: 开源仓库无定价页，买方与付费路径未披露；可能来自团队订阅或企业定制，这是判断而非已验证事实。
        evidence_ids:
        - ev-340d2dfd67c2e11a
      - gate: truth
        status: insufficient
        reason: 技能包由代理执行后仍需人工确认合并，交付确定性依赖代理能力，公开材料未给出可核对的交付结果。
        evidence_ids:
        - ev-fe38b444d35412bc
      next_validation: 收集该仓库的 issue 与 discussion，确认是否有团队报告在真实项目中重复使用并给出可核对的产出结果。
