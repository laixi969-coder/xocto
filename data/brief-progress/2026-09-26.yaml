      optimised kernel. Public material only gives the project name and community discussion volume; input
      format, benchmarking method, achieved speed-up, and whether human review is required are not described,
      so the concrete workflow and deliverable remain unverified.
    inspiration_en: The trend is agents taking over the most tedious trial-and-error part of performance
