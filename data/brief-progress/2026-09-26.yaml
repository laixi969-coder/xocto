  zh-tech-writing:
    slug: zh-tech-writing
    name: zh-tech-writing
    decision: watching
    event_summary_zh: 2026年9月24日，开发者 leter 在开源社区发布 zh-tech-writing，一个按阮一峰《中文技术文档的写作规范》约束中文技术文档写法的 Agent
      Skill，用于让 AI 产出短句、平实、无 AI 腔的中文文档；仓库当前约 198 星、8 次 fork，尚无定价或客户案例。
    event_summary_en: On 2026-09-24, developer leter released zh-tech-writing, an Agent Skill that constrains
      Chinese technical writing to the rules in Ruan Yifeng's 'Writing Standards for Chinese Technical
      Documentation', aiming at short, plain, AI-flavored-free Chinese docs; the repository currently
      has about 198 stars and 8 forks, with no pricing or customer cases disclosed.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 技术文档工程师
    jobs_en:
    - Technical writer
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 技术文档工程师或开发者写完中文说明、README、API 文档后，把它交给这个 Agent Skill 处理，它按阮一峰《中文技术文档的写作规范》对措辞和句式做约束，输出短句、平实、不带
      AI 腔的中文文本，最终仍需作者自己确认术语与事实是否准确。具体交付流程与人工确认环节仍待核验。
    inspiration: 趋势是中文技术写作的规范正在被写成可执行的约束，而不是停留在风格指南里；切入可以从开源项目文档、SDK 说明这类高频产出中文文档的团队入手，把规范检查做成提交前的一道关卡，而不是再做一个通用写作助手。
    summary_en: A technical writer or developer hands finished Chinese docs, READMEs or API references
      to this Agent Skill, which constrains wording and sentence structure according to Ruan Yifeng's
      'Writing Standards for Chinese Technical Documentation' and returns short, plain Chinese text without
      AI flavor; the author still has to confirm terminology and facts. The exact delivery flow and human
      review step remain unverified.
    inspiration_en: The trend is that Chinese technical writing standards are being turned into executable
      constraints rather than staying in style guides; the entry point is teams that produce Chinese docs
      frequently, such as open-source project documentation and SDK references, where the standard can
      become a pre-commit check instead of yet another general writing assistant.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 技术文档工程师或开源项目维护者在写完中文 README、API 文档或发布说明后，需要把文本改成符合中文技术写作规范的表达，再提交到仓库或对外发布。
        job_en: A technical writer or open-source maintainer, after drafting a Chinese README, API reference
          or release note, needs to rewrite the text to match Chinese technical writing standards before
          committing or publishing.
        pain_zh: AI 生成的中文技术文档常带翻译腔和空话，人工逐句改写耗时，且不同作者风格不统一，读者理解成本高。
        pain_en: AI-generated Chinese technical docs often carry translationese and filler; rewriting
          sentence by sentence is slow, styles diverge across authors, and readers pay the cost.
        current_alternative_zh: 目前多靠人工按风格指南逐句修改，或让通用大模型重写一遍，但通用模型本身就会产出 AI 腔，改完仍需人工再校。
        current_alternative_en: Today people either edit sentence by sentence against a style guide or
          ask a general LLM to rewrite, but general models themselves produce AI flavor, so manual re-checking
          remains.
        usage_reason_zh: 相较人工逐句改或通用模型重写，它把写作规范直接固化成对生成过程的约束，减少事后逐句返工这一步，因此经常产出中文技术文档、又在意文风一致性的开源维护者会在提交前使用它；这是基于产品能力的推断，尚无用户反馈佐证。
        usage_reason_en: Compared with manual line-by-line editing or a general model rewrite, it hard-codes
          the writing standard as a constraint on generation, removing the post-hoc rewriting step, so
          maintainers who frequently produce Chinese technical docs and care about consistent style would
          use it before committing; this is an inference from product capability, not supported by user
          feedback yet.
      gates:
      - gate: value
        status: supported
