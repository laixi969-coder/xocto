    slug: some-supabase-customers-are-publicly-exposing-reams-of-peopl
    name: Supabase
    decision: market_context
    summary_zh: 2026年9月，有调查发现部分 Supabase 客户因配置或安全不当，将大量用户数据公开暴露在网络上；这些应用多由 AI 生成或 vibe coding 方式构建。该事件表明，AI
      辅助快速生成应用在降低开发门槛的同时，把数据暴露风险直接带入交付环节，采用此类工具的企业需要把安全配置与权限审查纳入上线流程，否则数据泄露会成为规模化采用的主要阻力。
    summary_en: In September 2026, findings showed that some Supabase customers were publicly exposing
      reams of user data to the web because of improper configuration or security. Many of these apps
      were AI-generated or vibe-coded. The episode shows that while AI-assisted app generation lowers
      the barrier to building software, it pushes data-exposure risk directly into the delivery process;
      companies adopting such tools must fold security configuration and permission review into their
      launch workflow, or data leaks will become a major drag on scaled adoption.
    event_summary_zh: 调查发现部分 Supabase 客户因配置或安全不当，将大量用户数据公开暴露在网络上，相关应用多为 AI 生成或 vibe coding 构建。
    event_summary_en: An investigation found that some Supabase customers publicly exposed reams of user
      data to the web due to improper configuration or security, with many of the apps AI-generated or
      vibe-coded.
  sony-and-umg-are-suing-suno-again:
    slug: sony-and-umg-are-suing-suno-again
    name: Suno
    decision: market_context
    summary_zh: 2026年9月，索尼与环球音乐再次起诉 Suno，称其新的 v6 模型仍侵犯版权，理由是 v6 基于此前模型的用户输出训练，而这些输出又源自未经授权从 YouTube 等渠道获取的音乐。两家唱片公司是未签署授权协议的主要坚持者。该诉讼把生成式音乐模型的训练数据来源与再训练链条推入法律争议，意味着音频生成类
      AI 产品的合规成本与授权不确定性上升，可能影响其模型迭代节奏和商业采用。
    summary_en: In September 2026, Sony and Universal Music Group sued Suno again, claiming its new v6
      model still infringes their copyrights because v6 was trained on user outputs from previous models,
      which were themselves trained on unlicensed music taken from YouTube and other sources. The two
      labels are notable holdouts that did not sign licensing deals. The suit puts the training-data provenance
      and retraining chain of generative music models into legal dispute, implying higher compliance costs
      and licensing uncertainty for audio-generation AI products, which could affect their model iteration
      cadence and commercial adoption.
    event_summary_zh: 索尼与环球音乐再次起诉 Suno，称其新的 v6 模型仍侵犯版权，因其基于此前模型的用户输出训练，而这些输出源自未经授权获取的音乐。
    event_summary_en: Sony and Universal Music Group sued Suno again, claiming its new v6 model still
      infringes their copyrights because it was trained on user outputs from previous models that were
      themselves built on unlicensed music.
