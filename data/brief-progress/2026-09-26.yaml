    event_summary_zh: 2026年9月25日，Logolabs 在公开模型社区发布 Agate WebGPU，一个完全在浏览器内通过 WebGPU 运行的文生图空间，公开点赞数为 3。
    event_summary_en: On 25 September 2026, Logolabs published Agate WebGPU on a public model community,
      a text-to-image space running entirely in the browser on WebGPU, with 3 public likes.
