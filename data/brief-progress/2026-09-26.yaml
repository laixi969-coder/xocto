      project triggered knock-on effects in AI financing markets; in the same period, an $18 billion Oracle
      AI loan was reportedly sold at a discount, Oracle's force majeure notice shook the AI bond market,
      and Morgan Stanley said data center financing contracts face renewed scrutiny. These changes imply
      that debt financing costs and availability for AI infrastructure may tighten, which could affect
      compute supply and delivery timelines for AI applications (inference).
