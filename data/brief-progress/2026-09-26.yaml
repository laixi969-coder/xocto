      AI 产品还是内容订阅。
    summary_en: For people doing home rehabilitation exercises, it is opened in the morning inside WhatsApp
      to receive audio guidance and follow along with a set of movements. Public material only states
      that delivery is audio-first via WhatsApp; what the AI receives, what it does, and what verifiable
      output the user gets are not described, so the concrete workflow and deliverable remain unverified.
    inspiration_en: The trend is rehabilitation guidance moving from clinics and generic fitness apps
      into audio companions inside messaging apps, placing 'do the movement on time' into a window users
      already open daily. A wedge could be rehabilitation departments, postpartum recovery, or elderly
      chronic-care programmes with defined treatment cycles, priced per course rather than per seat; but
