    summary_en: An online clothes shopper opens this private fitting agent when choosing size and fit;
      it judges how well a garment fits based on the user's body or try-on information and hands off to
      JEV when needed, returning a fitting conclusion the shopper uses to decide on purchase. The exact
      inputs, JEV's role and the deliverable still need verification.
    inspiration_en: The trend is that return costs in apparel e-commerce are turning pre-purchase fit
      confirmation into a chargeable step, with agents judging size instead of only recommending. An entry
      point is independent designer brands or cross-border womenswear sellers, charging per reduced return
      or per try-on, provided real pattern data can be obtained.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 线上购买服装的消费者在选定款式后、下单前，面对尺码表和版型描述，需要判断这件衣服是否合身以避免退货。
        job_en: An online apparel shopper, after picking a style and before ordering, faces size charts
          and fit descriptions and needs to judge whether the garment will fit to avoid a return.
        pain_zh: 尺码表和模特图与自身体型不匹配，买错要承担退换货的时间和运费成本，反复试错让人放弃购买。
        pain_en: Size charts and model photos do not match one's own body, a wrong buy costs return time
          and shipping, and repeated trial and error makes shoppers abandon purchases.
        current_alternative_zh: 现在靠看评论里的身高体重参考、问客服、买多件再退，或干脆去线下试穿。
        current_alternative_en: Today shoppers rely on height and weight references in reviews, asking
          customer service, buying multiple sizes and returning, or simply trying on in stores.
        usage_reason_zh: 推断：相较翻评论和问客服，它把合身判断收敛成一次针对个人体型的结论，减少来回退换这一步，因此高频网购服装且退货困扰明显的人可能试用；但公开材料没有用户反馈或复购证据，无法确认它被长期使用。
        usage_reason_en: 'Inference: compared with reading reviews and asking customer service, it condenses
          the fit judgment into one conclusion for an individual body, cutting the back-and-forth return
          step, so frequent apparel shoppers with clear return pain may try it; however, public material
          has no user feedback or repeat-purchase evidence, so long-term use is unconfirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决线上买衣判断合身、减少退货的需求，痛点存在，但公开材料未说明输入与交付，刚性无法确认。
        evidence_ids:
        - ev-074350231ade2838
      - gate: consensus
        status: insufficient
        reason: 除一句官方描述外没有采用、评价或讨论证据，看不出卡在感知、想象还是场景环节。
        evidence_ids:
        - ev-074350231ade2838
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，消费者付费还是品牌付费无法判断，这是判断而非已验证事实。
        evidence_ids:
        - ev-074350231ade2838
      - gate: truth
        status: insufficient
        reason: JEV 的角色与人工介入边界不明，交付能否确定发生缺少材料支持。
        evidence_ids:
        - ev-074350231ade2838
      next_validation: 查找 Fit Receipt 的官方产品页或定价页，确认它接收哪些身体数据、JEV 承担什么角色以及是否按次或按月收费。
