    event_summary_en: 'On 25 September 2026, John Gruber commented on Meta''s Muse: each user gets a persistent
      Linux VM running in Meta''s cloud, it is packaged to be easy to install and use, presented as a
      cute mascot, and described as the first consumer-accessible agentic AI system; Gruber argues consumers
      do not grasp how powerful and risky it is, especially running on a Mac.'
