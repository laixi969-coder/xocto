  court-rules-trump-can-blacklist-anthropic-for-refusing-to-en:
    slug: court-rules-trump-can-blacklist-anthropic-for-refusing-to-en
    name: Anthropic
    decision: market_context
    summary_zh: 2026 年 9 月 25 日，美国上诉法院维持将 Anthropic 列为供应链风险的认定，起因是该公司拒绝为军事用途启用 Claude 的相关功能，法官称“过度受限的
      AI 模型”可能导致军事行动失败。这一裁定把模型安全限制与政府采购资格直接挂钩，意味着前沿模型厂商在安全策略与政府/国防订单之间的取舍将面临法律与商业后果，可能影响其在受监管市场的采用与交付。
    summary_en: On September 25, 2026, a U.S. appeals court upheld the designation of Anthropic as a supply
      chain risk, stemming from the company's refusal to enable certain Claude features for military use;
      the judges said 'overly constrained AI models' could cause military operations to fail. The ruling
      directly links model safety constraints to government procurement eligibility, meaning frontier
      model vendors now face legal and commercial consequences for the trade-off between safety policy
      and government/defense contracts, which could affect their adoption and delivery in regulated markets.
    event_summary_zh: 美国上诉法院维持将 Anthropic 列为供应链风险的认定，理由是其拒绝为军事用途启用 Claude 功能。
    event_summary_en: A U.S. appeals court upheld the designation of Anthropic as a supply chain risk
      over its refusal to enable Claude features for military use.
