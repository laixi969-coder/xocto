    event_summary_zh: 2026年9月25日，Datacor 公布在其 TrackAbout 平台内嵌入 Amazon Quick Sight 仪表盘与自然语言查询，为气体与焊接分销商提供自助租赁分析，底层是自动化跨云数据管道与多租户行级安全。这是既有行业软件厂商把云厂商的
      BI 与自然语言查询能力接入自身垂直平台的一次集成，而非新独立产品发布。
