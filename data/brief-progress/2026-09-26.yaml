  bidcraft:
    slug: bidcraft
    name: 标书匠 BidCraft
    decision: queued
    event_summary_zh: 2026年9月17日，开源项目标书匠 BidCraft 在代码托管平台公开，仓库显示 47 个星标、7 个复刻，基于 LangGraph 实现对话式技术标编制，支持招标文件解析、标段选择、标书编写、知识库提炼与对话式改稿。
    event_summary_en: On 17 September 2026, the open-source project BidCraft was published on a code-hosting
      platform, showing 47 stars and 7 forks; it uses LangGraph to build a conversational technical-bid
      drafting system that parses tender documents, selects bid sections, drafts the bid, distills a knowledge
      base and supports conversational revision.
    category: AI + 商业
    project_type: open_source
    industries:
    - 建筑工程
    - 招投标服务
    industries_en:
    - Construction
    - Tendering and bidding services
    jobs:
    - 投标专员
    - 技术标编制工程师
    jobs_en:
    - Bid specialist
    - Technical proposal writer
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 投标专员在拿到招标文件后打开它，把招标文件交给系统解析并选定标段，AI 据此起草技术标正文，再从企业知识库里提炼素材、按对话指令改稿，最终产出一份可提交的技术标初稿，仍需人工核对资质、业绩与响应条款。
    inspiration: 招投标这类高重复、强格式、按项目结算的文书工作，正在从“人写模板”转向“AI 起草＋人审条款”。切入点是先做透一个细分行业的评标口径与素材库，把交付物直接对齐评分表，而不是做通用文档助手；卖法可考虑按标段或按中标结果计价，但公开材料未披露定价。
    summary_en: A bid specialist opens it after receiving a tender document, hands the file to the system
      to parse and picks a bid section; the AI then drafts the technical proposal, pulls material from
      an enterprise knowledge base and revises on conversational instructions, producing a submittable
      first draft that still needs human checking of qualifications, track record and compliance clauses.
    inspiration_en: Tendering is high-repetition, format-heavy, project-billed paperwork that is shifting
      from humans filling templates to AI drafting plus human clause review. The entry point is to master
      one vertical's scoring rules and material library so the output maps to the evaluation table, rather
      than building a generic document assistant; pricing could be per bid section or tied to winning,
      though no public pricing is disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 投标专员或技术标编制工程师在收到招标文件后，需要把招标要求、企业资质与历史项目素材整理成一份符合评分表的技术标书并按时提交。
        job_en: A bid specialist or technical proposal writer receives a tender document and must turn
          tender requirements, company qualifications and past project material into a technical proposal
          that matches the scoring table and is submitted on time.
        pain_zh: 技术标篇幅长、格式与响应条款要求严格，素材散落在历史标书和个人电脑里，改稿要反复对照招标文件逐条检查，漏项或响应偏差会直接导致废标。
        pain_en: Technical bids are long, tightly formatted and clause-bound; material is scattered across
          past bids and personal drives, and revision means checking the tender document clause by clause,
          where a missed item or mismatched response can disqualify the bid.
        current_alternative_zh: 现在多靠 Word 模板加人工复制粘贴，从旧标书里翻找段落，再由有经验的投标人员逐条比对招标文件，耗时以天计。
        current_alternative_en: Today it is mostly Word templates plus manual copy-paste, digging paragraphs
          out of old bids and having an experienced bid writer compare the tender document line by line,
          which takes days.
        usage_reason_zh: 相较翻旧标书手工拼稿，它把招标文件解析、标段选择、正文起草和按对话改稿串成一条链，投标人员不必再从零找段落，只需核对资质与响应条款；推断，因为公开材料未给出用户留存或付费证据。
        usage_reason_en: Compared with manually assembling old bids, it chains tender parsing, section
          selection, drafting and conversational revision, so the writer no longer hunts for paragraphs
          from scratch and only verifies qualifications and response clauses; this is inference, as no
          retention or payment evidence is public.
      gates:
      - gate: value
        status: supported
        reason: 它解决投标专员编制技术标时素材散落、逐条比对招标文件的问题，不采用就要花数天手工拼稿并承担废标风险，旧流程与交付物清晰。
        evidence_ids:
        - ev-8bdc734dce73c665
      - gate: consensus
        status: insufficient
        reason: 仅见仓库星标与复刻，没有客户案例或投标团队采用记录，无法判断是否形成同行共识。
        evidence_ids:
        - ev-8bdc734dce73c665
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价或收费方式，买方可能是投标企业或服务商，这是判断而非已验证事实。
        evidence_ids:
        - ev-8bdc734dce73c665
      - gate: truth
        status: insufficient
        reason: 标书交付需人工核对资质与响应条款，仓库未说明评标准确率、幻觉控制或人工复核边界。
        evidence_ids:
        - ev-8bdc734dce73c665
      next_validation: 收集该仓库的 issue、discussion 或 README 中关于实际投标使用、评标结果与人工复核流程的公开记录。
