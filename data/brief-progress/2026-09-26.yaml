    summary_zh: 普通消费者在自己的电脑上安装 Muse 后，它会在 Meta 云端为这名用户单独跑一台持久 Linux 虚拟机，用户把日常任务交给这个常驻的智能体去执行，而不是自己逐步操作软件；目前公开材料只说明它易安装、被包装成吉祥物形象，具体能接收哪些材料、产出什么交付物仍待核验。
    inspiration: 趋势是智能体从聊天窗口走向每个用户独占的持久运行环境，能力边界从“回答问题”变成“替你操作机器”。切入不在通用助手本身，而在被它顺手替代的具体环节：个人电脑上的文件整理、跨软件重复操作、小型电商或自媒体日常运营，谁先把这些环节做成可核对、可回滚的交付，谁就拿到第一批愿意付费的人。
    summary_en: After a consumer installs Muse on their own computer, it runs a persistent Linux VM dedicated
      to that user in Meta's cloud, and the user hands everyday tasks to this always-on agent instead
      of operating software step by step; public material only says it is easy to install and presented
      as a mascot, and which materials it accepts and what it delivers still need verification.
    inspiration_en: 'The trend is agents moving from a chat window to a persistent environment owned by
      each user, shifting from answering questions to operating the machine. The opening is not the general
      assistant itself but the specific steps it replaces: file organisation on a personal computer, repetitive
      cross-app operations, daily operations for small shops or creators. Whoever turns those steps into
      checkable, reversible deliverables gets the first paying users.'
