      it returns model-generated responses, reportedly extending to smart glasses and other hardware.
      The public material does not describe the input materials, deliverables or human confirmation steps,
      so the concrete workflow and delivery remain unverified.'
    inspiration_en: The trend is that general assistants are moving from phone apps toward wearable entry
      points, shifting competition from raw model capability to device ownership and daily companionship
      scenarios. The opening is not general chat itself but specific unmet tasks on new entry points such
      as glasses, for example on-site capture, reminders and hands-free lookup; monetization could come
      with hardware or subscription, though no price is disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 需求存疑
      demand_read:
        job_zh: 普通消费者在通勤、行走或不便掏手机的场合，用语音向随身助手提出查询、记录或提醒类请求，并希望当场拿到回应。
