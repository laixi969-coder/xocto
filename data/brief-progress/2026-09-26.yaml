    event_summary_zh: 2026年9月25日，AWS 发布技术指南，说明如何在 Amazon SageMaker HyperPod 上运行开源强化学习框架 SkyRL，用 GRPO 对
      Qwen3-VL-8B 视觉语言模型做后训练，流程涵盖构建容器镜像、从 SageMaker Studio 启动 Ray 集群、提交并监控任务、托管训练出的 LoRA 适配器用于推理。
    event_summary_en: On September 25, 2026, AWS published a walkthrough for running the open-source reinforcement
      learning framework SkyRL on Amazon SageMaker HyperPod to post-train a Qwen3-VL-8B vision-language
      model with GRPO, covering container image builds, launching a Ray cluster from SageMaker Studio,
      submitting and monitoring jobs, and hosting the trained LoRA adapter for inference.
