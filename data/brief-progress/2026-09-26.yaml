  ggerganov-llamacpp-v050:
    slug: ggerganov-llamacpp-v050
    name: llama.cpp
    decision: market_context
    event_summary_zh: 2026年9月23日，llama.cpp 发布 v0.5.0，新增 HRM-Text（DFM Mimir 1B）支持、MiMo-V2.6 与 HunyuanOCR
      转换支持、ggml 0.25.0 后端改进、多地址 HTTP 绑定、函数调用返回图像输出，并修复若干对话解析与界面问题；CUDA conv2d 与 Metal MoE、SSM_CONV 融合得到优化。这是本地推理引擎的能力与性能更新，不是独立应用产品。
    event_summary_en: On 2026-09-23, llama.cpp released v0.5.0, adding HRM-Text (DFM Mimir 1B) support,
      MiMo-V2.6 and HunyuanOCR conversion support, ggml 0.25.0 backend improvements, multi-address HTTP
      binding, image outputs from function calls, and chat parser/UI fixes; CUDA conv2d and Metal MoE/SSM_CONV
      fusion were optimized. This is a capability and performance update to a local inference engine,
      not a standalone application product.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: llama.cpp 是本地运行大模型的推理引擎，开发者用它把模型权重转换并部署到自有硬件上。v0.5.0 扩大了可转换的模型范围（新增 HRM-Text、MiMo-V2.6、HunyuanOCR），并优化
      CUDA 与 Metal 后端算子，同时让服务端支持多地址绑定和函数调用返回图像。
    inspiration: 本地推理引擎持续把新模型和 OCR 类能力纳入转换链路，意味着在数据不能出内网的行业（医疗、法律、制造质检）里，把文档识别与生成放到自有硬件上跑的门槛在下降；切入点是围绕这些行业做私有化部署与结果交付，而不是再做一个通用推理引擎。
    summary_en: llama.cpp is an inference engine for running large models locally; developers use it to
      convert model weights and deploy them on their own hardware. v0.5.0 broadens convertible model coverage
      (adding HRM-Text, MiMo-V2.6, HunyuanOCR), optimizes CUDA and Metal backend kernels, and lets the
      server bind multiple addresses and return images from function calls.
    inspiration_en: A local inference engine steadily absorbing new models and OCR-style capabilities
      lowers the barrier to running document recognition and generation on in-house hardware in sectors
      that cannot send data outside their network, such as healthcare, legal and manufacturing QA; the
      opening is private deployment and outcome delivery for those sectors, not another general-purpose
      inference engine.
  harvey-turns-legal-context-into-stronger-drafts-with-gpt-6-a:
    slug: harvey-turns-legal-context-into-stronger-drafts-with-gpt-6-a
    name: Harvey
    decision: queued
    event_summary_zh: 2026年9月23日，OpenAI 发布材料称 Harvey 使用 GPT-6 Astra 生成结构更完整、更贴合上下文的法律文书，让律师把精力放在策略上；本次新增事实仅为模型能力与文书生成效果的描述，未披露客户、定价或采用数据。
    event_summary_en: On September 23, 2026, OpenAI published material stating that Harvey uses GPT-6
      Astra to produce more structured, context-aware legal documents so lawyers can focus on strategy;
      the only new fact is a description of model capability and drafting output, with no customer, pricing
      or adoption data disclosed.
    category: AI + 效率
    project_type: ai_transformation
    industries:
    - 法律服务
    industries_en:
    - Legal services
    jobs:
    - 律师
    jobs_en:
    - Lawyers
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 律所律师在起草合同、备忘录等法律文书时，把案件背景材料交给 Harvey，由模型生成结构更完整、更贴合上下文的法律文书初稿，律师再据此修改并决定策略；本次材料只说明文书生成效果，具体输入范围、交付格式与人工复核环节仍待核验。
    inspiration: 趋势是法律文书初稿的生成质量正被模型能力直接抬高，律所对“初稿”这一环的付费意愿已被反复验证。切入不在通用法律问答，而在具体文书类型加本地程序与判例数据：可从跨境并购、合规审查或中小律所的固定文书模板切入，按份或按案件收费，把人工复核留在律师一侧。
    summary_en: Lawyers at law firms drafting contracts and memos hand case background material to Harvey,
      which generates a more structured, context-aware first draft of the legal document that the lawyer
      then revises and uses to decide strategy; the material only describes drafting quality, and the
      exact inputs, deliverable format and human review step still need verification.
    inspiration_en: 'The trend is that first-draft legal document quality is being raised directly by
      model capability, and law firms'' willingness to pay for the drafting step is already well established.
      The opening is not generic legal Q&A but specific document types plus local procedural and case
      data: enter via cross-border M&A, compliance review or fixed templates for small and mid-size firms,
      charge per document or per matter, and keep human review on the lawyer''s side.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 律所律师在接到新案件或交易时，需要根据客户提供的背景材料和既有模板，起草合同、备忘录等法律文书初稿，再据此与客户和合伙人讨论策略。
        job_en: When taking on a new matter or deal, a law firm lawyer must draft a first version of contracts
          and memos from client background material and existing templates, then use it to discuss strategy
          with the client and partners.
        pain_zh: 法律文书初稿耗时长、格式与措辞要求高，律师大量时间花在重复的结构搭建和措辞调整上，压缩了真正需要判断的策略工作时间。
        pain_en: First drafts of legal documents are time-consuming and demand strict formatting and wording,
          so lawyers spend much time on repetitive structuring and phrasing, squeezing the strategy work
          that actually needs judgment.
        current_alternative_zh: 旧做法是律师或初级律师参照历史模板手工起草，再逐轮修改；部分团队使用通用大模型生成段落，但需要自行拼接上下文并核对格式与引用。
        current_alternative_en: The old way is for lawyers or junior associates to draft manually from
          past templates and revise over rounds; some teams use general-purpose LLMs for paragraphs but
          must assemble context themselves and check formatting and citations.
        usage_reason_zh: 相较手工套模板或零散使用通用模型，Harvey 直接接收案件背景材料并输出结构更完整、上下文更贴合的法律文书初稿，减少律师在结构搭建和措辞调整上的重复步骤；推断，处理高频文书类型的律所会在初稿环节选择它，但公开材料未给出留存或复购证据。
        usage_reason_en: Compared with manually applying templates or using general models piecemeal,
          Harvey takes case background material directly and outputs a more structured, context-aware
          first draft, cutting the repetitive structuring and phrasing steps; this is inference, and firms
          handling high-frequency document types would choose it at the drafting stage, though no retention
          or repeat-use evidence is public.
      gates:
      - gate: value
        status: supported
        reason: 它解决律师起草法律文书初稿耗时、结构搭建重复的问题，旧行为是手工套模板，痛点刚性且交付可核对；买方是律所，公开材料未说明具体付费方。
        evidence_ids:
        - ev-19118e98314ff5ec
      - gate: consensus
        status: insufficient
        reason: 公开材料只描述模型生成效果，没有客户案例、用户评价或采用规模，无法判断律所是否已把它放进日常流程。
        evidence_ids:
        - ev-19118e98314ff5ec
        - ev-8a6b3889410248c2
      - gate: model
        status: insufficient
        reason: 未披露定价、按席位还是按案件收费，也未说明买方是律所采购还是律师个人；这是判断，不是已验证事实。
        evidence_ids:
        - ev-19118e98314ff5ec
      - gate: truth
        status: insufficient
        reason: 法律文书对准确性和引用可追溯要求高，材料未说明人工复核边界、错误责任归属与数据安全处理方式。
        evidence_ids:
        - ev-19118e98314ff5ec
      next_validation: 收集 Harvey 官方定价页或客户案例页，确认其按席位还是按案件收费以及是否有律所公开采用。
  how-datacor-built-self-service-rental-analytics-with-amazon:
    slug: how-datacor-built-self-service-rental-analytics-with-amazon
    name: Datacor TrackAbout
