        usage_reason_en: 'Inference: versus blind prompt retries, inspecting internal files can locate
          the cause of one answer and remove the trial-and-error step; however public material shows no
          stable usage habit forming, so the motive remains inference.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决助手行为不透明、难以排查的问题，但公开材料未说明谁在什么任务中依赖它，痛点刚性未明。
        evidence_ids:
        - ev-602bd002dfeb43c8
      - gate: consensus
        status: insufficient
        reason: 仅有报道描述文件系统被暴露，未见采用规模或持续使用证据。
        evidence_ids:
        - ev-602bd002dfeb43c8
      - gate: model
        status: insufficient
        reason: 未进入：公开材料未披露任何收费或买方路径。
        evidence_ids:
        - ev-602bd002dfeb43c8
      - gate: truth
        status: challenged
        reason: 报道称暴露了本不打算公开的细节，安全与人工边界存在明显疑问。
        evidence_ids:
        - ev-602bd002dfeb43c8
      next_validation: 收集 Meta 官方关于 Muse 文件系统访问范围与安全边界的说明文档。
