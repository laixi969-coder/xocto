    event_summary_en: On 23 September 2026, Bleetz Network launched publicly, positioned as an AI agent-to-agent
      network for venture fundraising and scouting.
    category: AI + 商业
    project_type: new_application
    industries:
    - 风险投资
    - 创业服务
    industries_en:
    - Venture capital
