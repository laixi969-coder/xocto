    summary_zh: 销售或顾问在客户通话结束后打开它，把一段录音对话交给系统，由 AI 提取待办事项并生成跟进内容，用户拿到一份可执行的行动清单和跟进草稿，仍需自己确认后再发出。具体支持的录音来源、语言和交付格式在公开材料中未说明。
    inspiration: 会议记录转待办已是拥挤赛道，通用助手和会议工具都在做。真正的切口不在转写，而在某个垂直场景的后续动作：例如把房产带看录音直接变成给买家的房源对比与下次约看，或把保险理赔通话变成报案材料清单。卖点应是替谁省掉通话后那半小时的整理，而不是又一个录音总结器。
    summary_en: A sales rep or consultant opens it after a client call, feeds a recorded conversation
      to the system, and the AI extracts action items and drafts follow-up content; the user gets an actionable
      list and a follow-up draft that still needs human confirmation before sending. Supported recording
      sources, languages, and output formats are not stated in the public material.
    inspiration_en: 'Turning meeting recordings into to-dos is a crowded space already served by general
      assistants and meeting tools. The opening is not transcription but the downstream action in one
      vertical: turning a property viewing recording into a buyer-facing listing comparison and next appointment,
      or a claims call into a document checklist. The pitch should be whose half hour of post-call cleanup
      it removes, not another recording summarizer.'
