        job_zh: 普通消费者在自己的 Mac 或电脑上，把日常要处理的文件、网页操作和跨软件重复任务交给一个常驻智能体去执行，希望不用自己逐步点击就能拿到完成的结果。
        job_en: An ordinary consumer on their own Mac or PC hands everyday files, web operations and repetitive
          cross-app tasks to an always-on agent, hoping to get finished results without clicking through
          each step themselves.
        pain_zh: 公开材料只说明它强大且危险，没有给出用户原本卡在哪一步、不解决会失去什么；痛点只能从“手动逐步操作电脑”这一泛化场景推测，缺少具体抱怨或替代行为证据。
        pain_en: Public material only says it is powerful and dangerous; it does not show which step users
          were stuck on or what they lose by not solving it. The pain can only be inferred from the generic
          scenario of operating a computer step by step, with no specific complaint or workaround evidence.
        current_alternative_zh: 用户目前自己手动操作电脑，或使用已有的通用对话助手逐步询问再自己执行；也可能用脚本和自动化工具处理重复任务。
        current_en: Users currently operate the computer manually, or ask an existing general chat assistant
          step by step and then execute themselves; some use scripts and automation tools for repetitive
          tasks.
        usage_reason_zh: 推断：相较手动逐步操作或逐轮对话，Muse 通过给每个用户一台持久虚拟机，让智能体在同一个环境里连续执行多步任务，减少用户反复描述上下文和手动搬运结果的动作；但公开材料没有用户反馈或案例说明这一减少是否真的发生，因此这只是基于产品能力的判断。
        usage_reason_en: 'Inference: compared with manual step-by-step operation or turn-by-turn chat,
          Muse gives each user a persistent VM so the agent can carry out multi-step tasks in one environment,
          reducing the need to re-describe context and move results by hand; public material contains
          no user feedback or case showing this reduction actually happens, so this is a judgement based
          on product capability.'
