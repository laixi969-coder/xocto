        job_en: Office workers need to find information across internal documents, policies, and records
          and complete process tasks, such as drafting or checking an internal document against company
          rules.
        pain_zh: 企业知识分散在多个系统，通用助手不了解公司内部规定，员工需要人工翻找并逐条比对，容易出错。
        pain_en: Enterprise knowledge is scattered across systems, general assistants do not know internal
          rules, and employees must search and cross-check manually, which is error-prone.
        current_alternative_zh: 员工目前靠人工检索共享盘、内部Wiki或询问同事，再用通用对话工具改写文本。
        current_alternative_en: Employees currently search shared drives or internal wikis by hand, ask
