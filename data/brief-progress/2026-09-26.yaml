          interviewers in one day, they need a single link where each party picks an available slot.
        pain_zh: 多方约时间靠邮件来回确认，一轮排期要发多封邮件，跨时区时更容易反复改期。
        pain_en: Coordinating times across parties relies on email back-and-forth, taking several messages
          per round and causing repeated rescheduling across time zones.
        current_alternative_zh: 用邮件或即时通讯逐个确认时间，或用单人预约链接逐个发送。
        current_alternative_en: Confirming times one by one by email or chat, or sending single-person
          booking links individually.
        usage_reason_zh: 推断：相较逐个发送单人预约链接，它把多方选择收进同一个链接，省掉为每位参与者单独建链接和汇总回复的动作；因此一天要排多场会的招聘与销售岗位会优先尝试。
        usage_reason_en: 'Inference: compared with sending single-person booking links one by one, it
          collects multi-party choices into one link, removing the step of creating a separate link per
          participant and aggregating replies; recruiting and sales roles booking many meetings a day
          are therefore likely to try it first.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多方约时间反复确认的需求，痛点是邮件来回与跨时区改期，旧做法是逐个发送单人预约链接或人工确认。
        evidence_ids:
        - ev-749d6f646f0882db
      - gate: consensus
        status: insufficient
        reason: 公开材料只有一句产品说明，没有用户评价、客户案例或采用数据，共识无法判断。
        evidence_ids:
        - ev-749d6f646f0882db
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，按坐席还是按预约量收费不明，付费路径只能推断为面向团队或个人的订阅。
        evidence_ids:
        - ev-749d6f646f0882db
      - gate: truth
        status: insufficient
        reason: 跨时区换算、日历冲突与改期处理是否自动完成未说明，交付确定性无法核对。
        evidence_ids:
        - ev-749d6f646f0882db
      next_validation: 收集 Donna 官方定价页或公开使用案例，确认其计价方式以及是否与主流日历系统打通。
