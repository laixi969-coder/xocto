        pain_en: Public material does not describe how engineers previously tuned kernels, where they
          got stuck, or the real cost of not optimising, so the pain intensity cannot be confirmed.
        current_alternative_zh: 公开材料未提供现有替代方式，常见做法可能是手工改写内核、依赖编译器自动优化或使用性能分析工具，但候选资料未证实。
        current_alternative_en: No current alternative is given; common options might be hand-rewriting
