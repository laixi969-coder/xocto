    summary_zh: 早期投资人和创业者在寻找项目或募资时使用它，由 AI 智能体在网络上代为搜寻标的、传递募资信息并撮合双方；公开材料只说明这是智能体之间的募资与搜寻网络，具体输入材料、撮合流程与最终交付仍待核验。
    inspiration: 如果募资与项目搜寻的初步筛选真能交给智能体跑，早期投资的信息成本会被压低，切入点可能是某一垂直赛道（如地产科技、产业互联网）的标的库与尽调材料标准化，而不是做通用撮合网络；公开材料未披露定价与收费方式。
    summary_en: Early-stage investors and founders use it when scouting deals or raising money, with AI
      agents searching for targets, relaying fundraising information and matching the two sides; public
      material only describes an agent-to-agent fundraising and scouting network, so the concrete inputs,
      matching process and final deliverable still need verification.
    inspiration_en: If first-pass screening in fundraising and deal scouting can really be delegated to
      agents, the information cost of early-stage investing drops; the entry point may be a vertical deal
      library and standardized diligence material for one sector such as proptech or industrial internet,
      rather than a generic matching network; no pricing or charging model is disclosed.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 早期投资人在筛选项目、创业者在寻找投资人时，需要把项目材料与募资需求传递给对方并完成初步匹配。
        job_en: Early-stage investors screening deals and founders seeking investors need to pass project
          material and fundraising needs to the other side and complete an initial match.
        pain_zh: 公开材料只给出“智能体之间的募资与搜寻网络”一句定位，没有说明谁在什么环节遇到什么具体困难，痛点无法从现有事实还原。
        pain_en: Public material gives only the one-line positioning of an agent-to-agent fundraising
          and scouting network, without saying who hits what specific difficulty at which step, so the
          pain cannot be reconstructed from available facts.
        current_alternative_zh: 公开材料未说明它替代的是邮件触达、FA 中介、路演活动还是投资人社群，旧做法无法确认。
        current_alternative_en: Public material does not say whether it replaces cold email, finder agents,
          demo days or investor communities, so the prior practice cannot be confirmed.
        usage_reason_zh: 无法判断用户为何选择它：材料未说明智能体具体接收什么材料、执行什么动作、交付什么结果，因此缺少可解释的采用理由。
        usage_reason_en: 'There is no basis to explain why a user would choose it: the material does not
          say what the agents receive, what actions they take or what they deliver, so no defensible adoption
          reason exists.'
      gates:
      - gate: value
        status: challenged
        reason: 连解决什么需求、什么痛点都写不出来，只有一句网络定位，价值关不成立。
        evidence_ids:
        - ev-2379c994e9f9a352
      - gate: consensus
        status: insufficient
        reason: 未进入：价值不成立，且无采用或关注度证据可判断共识。
        evidence_ids:
        - ev-2379c994e9f9a352
      - gate: model
        status: insufficient
        reason: 未进入：价值不成立，买方与收费方式均未披露。
        evidence_ids:
        - ev-2379c994e9f9a352
      - gate: truth
        status: insufficient
        reason: 未进入：价值不成立，无法判断撮合结果能否确定性交付。
        evidence_ids:
        - ev-2379c994e9f9a352
      next_validation: 收集该产品官方页面或文档中关于智能体输入材料、撮合流程与交付结果的具体说明。
