      released for problem framing and assumption testing in coding, debugging, architecture, scientific
      research and product decisions; the repository has 102 stars.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 软件工程师
    jobs_en:
    - Software engineers
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在写代码、调试或做架构与产品决策前，把待解决的问题描述交给这个开源 Agent Skill，它按假设检验的方式对问题框定和前提假设逐条追问，最终输出一份被质疑过的问题陈述供人确认。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势是 AI 编码工具的重心从“写代码”前移到“先问对问题”，把需求澄清这一步交给 agent 反复质询。切入可以从软件外包、数据团队或科研课题组入手，把这种假设检验固化成立项评审前的固定环节，按项目或按评审次数收费，而不是卖一个通用插件。
    summary_en: Before writing code, debugging, or making architecture and product decisions, a developer
      hands the problem statement to this open-source Agent Skill, which interrogates the framing and
      underlying assumptions one by one and returns a challenged problem statement for human confirmation.
      The exact deliverable and human sign-off step still need verification.
    inspiration_en: The trend is that AI coding tools are shifting upstream from writing code to asking
      the right question first, handing requirement clarification to an agent that keeps challenging it.
      An entry point is software outsourcing shops, data teams or research groups, turning this assumption
      testing into a fixed step before project review and charging per project or per review rather than
      selling a generic plugin.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 软件工程师或产品负责人在立项、调试或架构选型前，面对一份需求描述或问题陈述，需要判断这个问题的定义和前提假设是否站得住。
        job_en: A software engineer or product owner, before project kickoff, debugging or architecture
          selection, faces a requirement description or problem statement and needs to judge whether the
          problem definition and its assumptions hold.
        pain_zh: 问题定义错误往往在写了很多代码之后才暴露，返工代价高；而人工自查假设容易受既有思路影响，缺少一个持续追问的对手。
        pain_en: A wrong problem definition often surfaces only after much code is written, making rework
          costly; self-checking assumptions is biased by existing thinking and lacks a persistent challenger.
        current_alternative_zh: 目前多靠同事评审、需求评审会或自己写文档反复推敲，没有固定工具，也没有可复用的质询流程。
        current_alternative_en: Today this relies on peer review, requirement review meetings or repeatedly
          refining documents alone, with no fixed tool and no reusable interrogation process.
        usage_reason_zh: 推断：相较评审会，它把质询变成随时可触发的一步，在动手前就暴露被忽略的假设，因此独立开发者或小团队在缺少评审资源时更可能试用它；但公开材料没有用户反馈或重复使用证据，无法确认它是否被留在工作流里。
        usage_reason_en: 'Inference: compared with review meetings, it turns interrogation into a step
          that can be triggered at any time and surfaces overlooked assumptions before work starts, so
          solo developers or small teams lacking review resources are more likely to try it; however,
          public material has no user feedback or repeat-use evidence, so it is unconfirmed whether it
          stays in the workflow.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决的是问题定义与假设检验需求，痛点真实但刚性未明，缺少用户反馈或旧流程替代证据，只能判需求强度未明。
        evidence_ids:
        - ev-b4d89ed74f1a511a
      - gate: consensus
        status: insufficient
        reason: 仅有 102 个星标，属于关注度信号，不能说明持续采用，也看不出卡在感知还是场景环节。
        evidence_ids:
        - ev-b4d89ed74f1a511a
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，买方是个人开发者还是团队无法判断，这是判断而非已验证事实。
        evidence_ids:
        - ev-b4d89ed74f1a511a
      - gate: truth
        status: insufficient
        reason: 问题框定贴近工作第一性目标，但交付是否确定、人工边界如何划分均无公开材料支持。
        evidence_ids:
        - ev-b4d89ed74f1a511a
      next_validation: 收集该仓库的 issue、discussion 或使用说明文档，确认是否有开发者描述在真实项目中重复使用它做问题框定。
