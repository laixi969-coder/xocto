    summary_zh: IMF 于 2026 年 9 月警告 AI 投资对债务融资的依赖正在扩大，2026 年全球 AI 投资规模可能突破 2 万亿美元。这意味着 AI 基础设施与应用扩张越来越依赖信贷市场，一旦融资条件收紧，算力与模型供给的成本和节奏可能承压，进而影响下游
      AI 应用的定价与交付能力（推断）。
    summary_en: In September 2026 the IMF warned that AI investment is increasingly reliant on debt financing,
      with global AI investment potentially exceeding USD 2 trillion in 2026. This means AI infrastructure
      and application expansion depends more heavily on credit markets; if financing conditions tighten,
      the cost and pace of compute and model supply could come under pressure, in turn affecting downstream
      AI application pricing and delivery (inference).
    event_summary_zh: IMF 警告 AI 债务融资依赖扩大，2026 年全球 AI 投资规模或突破 2 万亿美元。
