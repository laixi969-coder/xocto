    summary_zh: 2026年9月25日前后，市场传出甲骨文与Blue Owl相关数据中心项目延期预期，并引发AI融资市场连锁反应；同期甲骨文180亿美元AI贷款出现折价滞销，甲骨文发出“不可抗力”通知震动AI债市，大摩称数据中心融资合同面临重新审视。这些变化意味着AI基础设施的债务融资成本与可得性可能收紧，进而影响AI应用的算力供给与交付节奏（推断）。
