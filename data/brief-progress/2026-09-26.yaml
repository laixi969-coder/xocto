        pain_en: Public materials give only the positioning of 'managing personal digital assets' without
          stating the user's concrete trouble, frequency, or cost of not acting, so the pain cannot be
          reconstructed from available facts.
        current_alternative_zh: 公开材料未提及用户现在用什么方式管理数字资产，无法确认替代的是密码管理器、云盘、表格还是人工记忆。
        current_alternative_en: Public materials do not mention how users currently manage digital assets,
          so it is unclear whether it replaces a password manager, cloud drive, spreadsheet, or manual
          memory.
        usage_reason_zh: 缺少可核对的功能、输入与交付说明，无法解释用户为何会在具体情境下选择它而非旧做法；此处不做推断。
