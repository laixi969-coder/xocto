  decktly:
    slug: decktly
    name: Decktly
    decision: watching
    event_summary_zh: 2026年9月24日，开发者 Hannes Krieg 发布 Decktly，一款让用户在浏览器中像编辑 PowerPoint 一样编辑 HTML 演示文稿的工具；公开材料仅有一句产品描述，未披露定价、客户或使用数据。
    event_summary_en: On September 24, 2026, developer Hannes Krieg launched Decktly, a tool that lets
      users edit HTML presentations in the browser much like PowerPoint; public material is limited to
      a one-line description with no pricing, customers or usage data disclosed.
    category: AI + 效率
    project_type: new_application
    industries:
    - 市场营销
    - 教育培训
    industries_en:
    - Marketing
    - Education and training
    jobs:
    - 演示文稿制作
    - 网页内容编辑
    jobs_en:
    - Presentation production
    - Web content editing
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 做演示或网页内容的人，在需要改动一份已经写好的 HTML 幻灯片时打开它，把 HTML 文件交给工具，在可视化界面里像改 PowerPoint 一样调整文字、版式与页面，最终导出可用的
      HTML 演示文稿；AI 具体介入哪一步、是否需要人工复核，公开材料未说明，具体流程与交付仍待核验。
    inspiration: 趋势是演示文稿的载体正从 PPT 文件转向 HTML 页面，但改 HTML 一直要动代码，中间缺一层可视化编辑。切入可以从市场、培训这类高频做对外演示、又常把页面直接嵌进官网的团队开始，按“改一版页面”或按席位收费，前提是先确认它到底替掉了写代码那一步还是只做了预览。
    summary_en: 'People who build presentations or web content open it when they need to change an existing
      HTML slide deck: they hand over the HTML file, adjust text, layout and pages in a visual editor
      much like PowerPoint, and get back a usable HTML deck. Which step the AI actually performs and whether
      human review is required are not stated in the public material, so the exact workflow and deliverable
      still need verification.'
    inspiration_en: The trend is that decks are shifting from PPT files to HTML pages, yet editing HTML
      still means touching code, leaving a gap for a visual layer. A wedge is marketing and training teams
      who present externally and embed pages into their own sites, sold per revised page or per seat,
      once it is clear whether it replaces the coding step or only previews it.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 做演示或网页内容的人，在需要修改一份已存在的 HTML 演示文稿时，处理 HTML 文件与页面版式，要完成一次不写代码的版面和文字调整。
        job_en: People producing presentations or web content, when they need to revise an existing HTML
          deck, work on the HTML file and page layout to complete a text and layout edit without writing
          code.
        pain_zh: 公开材料只说明可以像 PowerPoint 一样编辑，没有说明原来这一步由谁、用什么工具、花多久完成，也没有用户抱怨或替代行为的记录，痛点强度无法确认。
        pain_en: The public material only says it edits like PowerPoint; it does not say who did this
          step before, with what tool, or how long it took, and there is no record of user complaints
          or workarounds, so pain intensity cannot be confirmed.
        current_alternative_zh: 推断：直接手写或修改 HTML/CSS，或把内容搬回 PowerPoint、Google Slides 再重新导出。
        current_alternative_en: 'Inference: hand-writing or editing HTML/CSS directly, or moving content
          back into PowerPoint or Google Slides and re-exporting.'
        usage_reason_zh: 推断：如果它真能把改版式这一步从改代码变成可视化拖拽，用户会在需要频繁微调同一份 HTML 演示时选它；但公开材料没有说明 AI 具体做了什么、也没有任何使用或留存证据，因此无法确认它比旧做法少哪一步负担。
        usage_reason_en: 'Inference: if it truly turns layout edits from code changes into visual dragging,
          users would pick it when repeatedly tweaking the same HTML deck; but the public material does
          not say what the AI does and shows no usage or retention evidence, so which burden it removes
          versus the old way cannot be confirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决改 HTML 演示要动代码这件事，但公开材料没有说明原来谁在做、花多久、不做的后果，痛点强度无法判断。
        evidence_ids:
