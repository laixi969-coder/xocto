        current_alternative_zh: 现在用通用跑步应用或教练给的表格，再手动把课表录入 Garmin，或直接照搬网上的备赛模板。
        current_alternative_en: Today people use generic running apps or a coach's spreadsheet, manually
          enter sessions into Garmin, or copy a template found online.
        usage_reason_zh: 相较自己排课表再逐条录入手表，它把计划生成与同步合并成一步，省掉手动录入；推断同时用 Garmin 备赛越野赛、又不请教练的人会因此选择它。
        usage_reason_en: Compared with building a schedule and entering each session into the watch, it
          merges plan generation and sync into one step, removing manual entry; by inference, Garmin-using
          trail runners without a coach would choose it.
      gates:
      - gate: value
        status: supported
        reason: 它解决越野跑备赛时计划不适配赛道、且需手动录入手表这一具体麻烦，旧做法是通用应用加手工录入，结构上成立，属工作流推理。
        evidence_ids:
        - ev-1b2e67ad1fb493ba
      - gate: consensus
        status: insufficient
        reason: 只有一句产品描述，没有用户评价或完赛案例，无法判断是否有人持续按它训练。
