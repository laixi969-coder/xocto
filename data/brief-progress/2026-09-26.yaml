    summary_zh: 面向需要出图但不愿把素材上传到云端的人，在浏览器里打开该页面，输入文字提示后由本地 WebGPU 直接生成图片，图片不离开本机；公开材料只说明「浏览器内文生图」，具体模型、生成质量、是否可商用以及是否需要人工筛选均未说明，具体流程或交付仍待核验。
    inspiration: 趋势是推理从云端 API 下沉到浏览器本地算力，把「素材不出本机」变成可卖点，这对有保密要求的出图场景比生成质量更关键。切入可考虑律所、医疗、地产等不能把未公开素材上传第三方云的设计与营销环节，按本地部署或按项目交付收费；但当前只有
      3 个点赞，尚无采用证据，先观察是否有人真的把它接进工作流。
    summary_en: For people who need images but do not want to upload assets to the cloud, it is opened
      in the browser, a text prompt is entered, and WebGPU generates the image locally so the file never
      leaves the machine. Public material only states 'text-to-image in the browser'; the model, output
      quality, commercial terms, and whether human review is needed are not described, so the concrete
      workflow and deliverable remain unverified.
    inspiration_en: The trend is inference moving from cloud APIs down to local browser compute, turning
      'assets never leave the machine' into a selling point, which matters more than image quality for
      confidential work. A wedge could be design and marketing steps in law firms, healthcare, or real
      estate that cannot upload unpublished assets to third-party clouds, priced by local deployment or
