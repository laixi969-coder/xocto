        usage_reason_en: Compared with reading a transcript and picking out items yourself, it merges
          action extraction and follow-up drafting into one step, removing re-listening and a second cleanup
          pass; by inference, people who take many client calls and do not want to spend half an hour
          afterward would choose it.
