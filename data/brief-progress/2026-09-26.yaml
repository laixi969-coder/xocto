        status: insufficient
        reason: 未进入：价值关未成立，买方、计价方式与付费路径均未披露。
        evidence_ids:
        - ev-677d441c2c1ceb61
      - gate: truth
        status: insufficient
        reason: 未进入：价值关未成立，无法核对代理模拟用户的结果是否可复现、能否确定性交付。
        evidence_ids:
        - ev-677d441c2c1ceb61
      next_validation: 收集 Jango 官方文档或演示，确认 AI 代理接入被测应用的方式、覆盖的多用户场景类型与测试结果输出形式。
