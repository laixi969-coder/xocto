    summary_en: A film editor or commercial director opens it when they have footage in hand and need
      a finished cut; per the public positioning, it frames AI filmmaking as a code-editor-style workspace,
      but what material the AI ingests, which editing or generation actions it performs, and what file
      it delivers are all undisclosed, so the concrete workflow and deliverable remain unverified.
    inspiration_en: 'Trend: AI video generation is shifting from one-shot output toward an editable workflow
      where rework cost decides who wins. Entry: start with commercial spots and e-commerce short videos
      that have hard deadlines and client acceptance criteria, charging per finished cut or per project
      rather than selling generic generation credits, and first solve the repeated-rework step.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 影视剪辑师或广告片导演在拿到拍摄素材、需要交付一条可过审的成片时，处理镜头、配音与节奏，完成剪辑定稿。
        job_en: A film editor or commercial director who has received shot footage and must deliver an
          approved final cut, working through shots, voiceover and pacing to lock the edit.
        pain_zh: 公开材料只给出“AI 电影制作的 Cursor”这一句定位，没有说明它替代剪辑中的哪一步、用户原来怎么绕过，痛点无法从现有事实还原。
        pain_en: The public material offers only the line "the Cursor of AI filmmaking" and does not say
          which editing step it replaces or how users worked around it, so the pain cannot be reconstructed
          from available facts.
        current_alternative_zh: 现有替代是 Premiere、DaVinci Resolve 等剪辑软件加人工逐帧调整，或直接用文生视频工具一次性出片；Hyperdream
          与这些做法的差异未被公开说明。
        current_alternative_en: The current alternatives are editing suites such as Premiere or DaVinci
          Resolve with manual frame-by-frame work, or one-shot text-to-video tools; how Hyperdream differs
          from these is not publicly explained.
        usage_reason_zh: 无法判断。缺少功能说明、操作流程与交付样例，无法说明它相较旧做法减少了哪一步负担，因此不能给出使用理由。
        usage_reason_en: Cannot be judged. With no feature description, workflow or sample deliverable,
          there is no way to say which step of the old process it removes, so no usage reason can be given.
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决成片剪辑这件事，但公开材料只有一句定位，说不清替代哪一步旧工作、痛点是什么，价值关无法成立。
