      calendar tools are highly concentrated, so whether it plugs into existing calendars and meeting
      systems decides if it is just another link page.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 招聘或销售人员在一天内需要与多位候选人、客户或面试官约时间时，要在一个链接里让各方各自选定可用时段。
