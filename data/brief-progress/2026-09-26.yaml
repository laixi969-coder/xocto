      - gate: model
        status: insufficient
        reason: 未披露定价与买方，个人订阅还是教练采购不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-1b2e67ad1fb493ba
      - gate: truth
        status: insufficient
        reason: 未说明计划是否随训练反馈调整、是否有人工教练把关，交付确定性无法核对。
        evidence_ids:
        - ev-1b2e67ad1fb493ba
      next_validation: 收集 Kliva 官方定价页或用户案例，确认计划是否随训练数据动态调整以及同步 Garmin 的实际方式。
