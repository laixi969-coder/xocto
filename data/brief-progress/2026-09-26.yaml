      and natural-language querying into its TrackAbout platform, giving gas and welding distributors
      self-service rental analytics on top of an automated cross-cloud data pipeline with multi-tenant
      row-level security. This is an existing vertical software vendor integrating a cloud provider's
      BI and natural-language query capability into its own platform, not the launch of a new standalone
      product.
