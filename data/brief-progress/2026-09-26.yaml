        usage_reason_zh: 推断：相较搜索翻页，Muse 在对话里一次给出整合后的回答，省掉逐页筛选与拼接这一步；加上它被放进用户已每天打开的 Meta 应用，用户不必再装新应用，因此日常轻量问答人群会顺手使用。
        usage_reason_en: 'Inference: versus paging through search results, Muse returns one consolidated
          answer in a conversation, removing the step of filtering and stitching pages; because it sits
          inside Meta apps users already open daily, they need no new install, so casual everyday question-askers
          adopt it by default.'
      gates:
      - gate: value
        status: supported
        reason: 它解决日常问答与写作中自己搜索、拼凑答案的痛点，旧行为明确且高频，交付为可直接使用的回答。
        evidence_ids:
        - ev-079f88e1ecf5589e
      - gate: consensus
        status: supported
        reason: 报道称其登上应用商店榜单前列并快速新增用户，说明已有规模采用，但公开材料未给出留存数据。
        evidence_ids:
        - ev-079f88e1ecf5589e
      - gate: model
        status: insufficient
        reason: 由 Meta 自有应用导流，付费路径未在公开材料中披露，买方与收费方式属推断。
        evidence_ids:
        - ev-079f88e1ecf5589e
      - gate: truth
        status: insufficient
        reason: 通用助手贴近日常任务，但公开材料未说明答案准确性边界与人工确认环节。
        evidence_ids:
        - ev-079f88e1ecf5589e
      next_validation: 收集 Meta 官方 Muse 页面或帮助文档，确认其功能边界、是否收费及数据处理说明。
  meta-makes-the-muse-filesystem-even-more-accessible:
    slug: meta-makes-the-muse-filesystem-even-more-accessible
    name: Meta Muse
    decision: watching
    event_summary_zh: 2026年9月25日报道称，Meta 让 Muse 的文件系统对用户更易访问，此前用户发现 Muse 会向好奇者暴露其文件系统，其中出现本不打算公开的细节。
    event_summary_en: A Sept 25, 2026 report said Meta made Muse's filesystem more accessible to users,
      after users found Muse exposed its filesystem and revealed details not meant to be public.
    category: 通用助手
    project_type: new_application
    industries:
    - 消费互联网
    industries_en:
    - Consumer Internet
    jobs:
    - 用户查看助手内部文件以了解其运行方式或排查异常
    - Users inspecting an assistant's internal files to understand its behavior or debug issues
