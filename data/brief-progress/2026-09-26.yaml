        usage_reason_zh: 相较自己排队等待，它把等待和转接的负担转移到代理身上，用户只需交代任务并接收结果；推断时间成本高、又必须打电话办成事的人会因此选择它。
        usage_reason_en: Compared with queuing yourself, it shifts waiting and transfers onto the agent,
