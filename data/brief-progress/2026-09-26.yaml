      which pulls in enterprise-specific context so the AI can answer or act on tasks and return usable
      office output; the exact inputs, action boundaries, and deliverables still need verification.
    inspiration_en: 'Trend: competition in office agents is shifting from raw model capability to whether
      they can plug into a company''s own context. Entry point: start with context curation and permission
      governance for one concrete function such as contracts, expense claims, or support knowledge bases,
      rather than a general office assistant.'
