    summary_zh: 普通用户在手机或 Meta 系应用内直接向 Muse 提出日常问题、写作或信息整理需求，Muse 以对话形式返回答案与草稿，用户自行判断是否采用。它属于大众默认入口型通用助手，具体交付流程与人工确认环节仍待核验。
