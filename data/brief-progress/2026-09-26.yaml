        usage_reason_zh: 推断：若企业上下文接入确实打通了权限与数据源，员工可省去在多个系统间翻找和逐条比对规定这一步，因此有内部知识治理需求的企业会在制度问答与文档起草场景选择它；但公开材料未给出客户案例或持续使用证据。
        usage_reason_en: 'Inference: if enterprise context integration genuinely connects permissions
          and data sources, employees skip the step of searching multiple systems and cross-checking rules
