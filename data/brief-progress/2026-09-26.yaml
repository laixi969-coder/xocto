    summary_zh: 个人用户在需要联系客服、改约或取消服务时打开它，把要办的事交给 AI 代理去拨打电话并完成沟通，用户拿到的是通话结果或转述。公开材料只有一句描述，具体支持哪些通话场景、是否需要用户在场确认、失败如何处理均未说明。
