      - gate: model
        status: insufficient
        reason: 未进入：价值关未成立，买方、计价方式与付费路径均未披露。
        evidence_ids:
        - ev-84aabf0747d43fc8
      - gate: truth
        status: insufficient
        reason: 未进入：价值关未成立，无法核对它是否贴近剪辑工作的第一性目标与确定性交付。
        evidence_ids:
