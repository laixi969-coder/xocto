    open_source: false
    summary_zh: 自由职业者或小型服务商在开会、外出无法接听客户来电时打开它，AI 接听来电并留下通话内容，用户事后回听再决定是否回拨；具体接听流程、录音交付形式与人工确认环节仍待核验。
    inspiration: 趋势：电话接听这一最传统的客户触点上，开始出现按“代接+留痕”交付的轻量 AI 服务，而不是通用语音助手。切入：从律师、房产经纪、维修派单这类漏接一通电话就丢一单的个体服务者切入，按代接通话量或按月订阅收费，先解决“漏接即丢单”这一环。
    summary_en: A freelancer or small service provider who is in a meeting or out of office opens it;
      the AI answers the incoming client call and captures the message, and the user listens back later
      to decide whether to return the call. The exact answering flow, recording delivery and human confirmation
      step still need verification.
    inspiration_en: 'Trend: the most traditional client touchpoint, the phone call, is starting to be
      delivered as a lightweight AI service that answers and logs calls rather than as a general voice
      assistant. Entry point: start with individual service providers such as lawyers, real-estate agents
      or dispatch-based repair workers for whom one missed call means one lost job, charging per answered
      call or by monthly subscription, and solve the missed-call-lost-deal step first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自由职业者与小型服务商在会议或外出无法接听客户来电时，需要让来电被接起并留下内容，事后回听决定是否回拨。
        job_en: When freelancers and small service providers are in meetings or out of office and cannot
          take a client call, they need the call answered and the message captured so they can listen
          back and decide whether to return it.
        pain_zh: 漏接一通客户来电可能直接丢掉一单，而人工代接或语音信箱要么成本高，要么只留一句留言、无法判断来电意图。
        pain_en: Missing one client call can directly lose a deal, while a human answering service is
          costly and plain voicemail leaves only a short message that does not convey the caller's intent.
        current_alternative_zh: 旧做法是运营商语音信箱、人工接线服务，或干脆不接、事后凭未接来电回拨。
        current_alternative_en: The old approach is carrier voicemail, a human answering service, or simply
          not answering and calling back later based on the missed-call log.
        usage_reason_zh: 推断：相较语音信箱只留一句录音，它把来电内容整理成可回听的记录，用户不必在通话当下中断手头工作，只需事后听一遍再决定回拨，因此漏接成本高的个体服务者会在外出或会议场景选择它。
        usage_reason_en: 'Inference: compared with voicemail that only leaves a short recording, it turns
          the call into a replayable record, so the user does not have to interrupt current work mid-call
          and only needs to listen once afterwards to decide whether to call back; providers with high
          missed-call cost would choose it when out of office or in meetings.'
      gates:
      - gate: value
        status: supported
        reason: 它解决漏接客户来电可能丢单的问题，痛点刚性来自个体服务者的收入直接挂钩接听，旧替代是语音信箱或人工接线。
        evidence_ids:
        - ev-42d9c67f7e9fffc7
      - gate: consensus
        status: insufficient
        reason: 除产品页自述外，没有用户评价、客户案例或采用数据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-42d9c67f7e9fffc7
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，按代接量或订阅收费只是推断，不是已验证事实。
        evidence_ids:
        - ev-42d9c67f7e9fffc7
      - gate: truth
        status: insufficient
        reason: 接听准确率、录音交付与人工确认边界均未公开，承诺能否确定性交付无法核对。
        evidence_ids:
        - ev-42d9c67f7e9fffc7
      next_validation: 收集Hola AI官方定价页或产品文档，确认其按什么计价、接听与留言交付的具体流程。
