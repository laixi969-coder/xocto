    summary_zh: 面向需要居家康复训练的人，在每天早晨按计划做理疗动作时打开 WhatsApp，接收音频形式的指导内容并跟着完成一组练习；公开材料只说明交付渠道是音频加 WhatsApp，AI
      具体接收什么输入、执行什么动作、最终交付什么可核对结果均未说明，具体流程或交付仍待核验。
