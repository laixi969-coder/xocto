    inspiration: 趋势是智能体开始接手性能工程里最枯燥的试错环节，把「改一版、跑一遍、看快了多少」的循环交给机器。切入可考虑把这种循环封装成按加速结果收费的服务，面向自研芯片团队、云厂商或需要压推理成本的模型公司；但当前只有社区讨论热度，没有客户或加速数据，先观察是否有人拿它跑真实生产内核。
