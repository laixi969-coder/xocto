    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在把真实数据交给外部 AI 接口前打开它，由代理把姓名、地址等敏感字段替换成看起来真实的假值，模型返回结果后在本地把假值还原成原文。用户拿到的是可继续使用的真实输出，但具体支持的字段类型、还原准确率和人工复核环节仍待核验。
    inspiration: 趋势是 AI 调用把企业内部数据送出门，隐私处理正从合规文档变成调用链上的一步。切入可放在医疗、法律、财税这类不能把客户原始材料外发的机构，卖点是本地还原与可审计的脱敏记录，而不是再做一个通用网关。
    summary_en: 'A developer opens it before sending real data to an external AI API: the proxy swaps
      names, addresses and similar sensitive fields for realistic fakes, then restores the originals locally
      after the model responds. The user gets usable real output, though supported field types, restoration
      accuracy and any human review step still need verification.'
    inspiration_en: The trend is that AI calls push internal data outside the company, so privacy handling
      is moving from compliance documents into the call chain itself. The opening is institutions such
      as clinics, law firms and accounting practices that cannot send raw client material out, sold on
      local restoration and an auditable redaction log rather than another generic gateway.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或数据合规负责人在把含客户姓名、地址、账号的工单、合同或病历交给外部大模型接口处理前，需要先让这些字段离开原文，再拿回可用的真实结果。
        job_en: A developer or data-compliance owner, before sending tickets, contracts or medical records
          containing client names, addresses and account numbers to an external LLM API, needs those fields
          to leave the original text and still get usable real results back.
        pain_zh: 直接调用外部模型意味着原始敏感数据离开本地，一旦泄露或违反客户合同，代价由使用方承担；手工脱敏再手工还原既慢又容易出错。
        pain_en: Calling an external model directly means raw sensitive data leaves the premises, and
          the user bears the cost of a leak or a contract breach; manual redaction followed by manual
          restoration is slow and error-prone.
        current_alternative_zh: 目前常见做法是人工把敏感字段改成占位符再贴进模型，或干脆不用外部模型、改用本地小模型，也有团队自建正则脱敏脚本。
        current_alternative_en: The common workaround is to hand-replace sensitive fields with placeholders
          before pasting into a model, to avoid external models and use a local small model instead, or
          for teams to write their own regex redaction scripts.
        usage_reason_zh: 相较人工替换占位符，它在请求链路上自动完成假值替换并在本地还原，省掉发送前改写和收到后逐条改回这两步；推断经常处理客户原始材料的团队会在无法自建脱敏流程时选择它。
        usage_reason_en: Compared with hand-replacing placeholders, it performs fake-value substitution
          inside the request path and restores locally, removing both the pre-send rewrite and the post-receive
          manual fix-back; by inference, teams that routinely handle raw client material will pick it
          when they cannot build their own redaction pipeline.
      gates:
      - gate: value
        status: supported
        reason: 它解决的是把敏感材料交给外部模型时的数据外泄与手工脱敏负担，旧做法是人工替换占位符或放弃外部模型，痛点刚性且可核对。
        evidence_ids:
        - ev-c9dd61d1675b6fb0
      - gate: consensus
        status: insufficient
        reason: 只有开源仓库的星标与社区讨论热度，没有客户案例或团队采用声明，无法判断是否形成共识。
        evidence_ids: []
      - gate: model
        status: insufficient
        reason: 仓库未披露定价或付费路径，买方可能是自建合规流程的企业，这是判断而非已验证事实。
        evidence_ids: []
      - gate: truth
        status: insufficient
        reason: 还原准确率、支持字段类型与人工复核边界均未公开，承诺能否确定性交付尚不可核对。
        evidence_ids: []
      next_validation: 收集该开源仓库的 README、issue 与 discussion，确认其支持的敏感字段类型、本地还原方式与是否有企业部署说明。
