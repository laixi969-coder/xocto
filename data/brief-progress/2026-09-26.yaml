    event_summary_zh: 2026年9月23日报道显示，Chamelio 完成 2600 万美元 A 轮融资，用于把 AI 代理投入企业法务团队工作。除融资额外，公开材料未给出客户数、定价、部署方式或使用数据。
    event_summary_en: A Sept 23, 2026 report says Chamelio raised a $26M Series A to put AI agents to
      work in corporate legal teams. Beyond the funding amount, the public material gives no customer
      count, pricing, deployment detail or usage data.
