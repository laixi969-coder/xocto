  polyglot:
    slug: polyglot
    name: Polyglot
    decision: watching
    event_summary_zh: 2026年9月21日，开发者 Dylan de Heer 发布 Polyglot，一款在 Mac 本地完成字幕创建与翻译的工具；公开材料仅有一句产品描述，未披露定价、客户、支持语言数量或使用数据。
    event_summary_en: On September 21, 2026, developer Dylan de Heer launched Polyglot, a Mac tool that
      creates and translates subtitles entirely on-device; public material is limited to a one-line description
      with no pricing, customers, supported language count or usage data disclosed.
    category: AI + 创作
    project_type: new_application
    industries:
    - 影视与视频制作
    - 教育培训
    industries_en:
    - Film and video production
    - Education and training
    jobs:
    - 字幕制作与翻译
    - 视频本地化
    jobs_en:
    - Subtitle creation and translation
    - Video localisation
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 做视频的人，在需要给一段素材配上字幕或翻成另一种语言时打开它，把视频或音频交给 Mac 上的本地处理，得到字幕文件与译文；因为全程在本地完成，素材不必上传到云端。具体支持哪些语言、翻译质量与人工校对环节，公开材料未说明，流程与交付仍待核验。
    inspiration: 趋势是视频本地化的量在涨，但把未公开素材传到云端字幕服务是很多团队不愿接受的。切入可以从对素材保密有硬要求的行业开始，比如企业培训、纪录片、法律取证视频，卖点是本地处理而非翻译质量本身，按导出条数或按年授权收费，前提是先确认本地模型的语言覆盖够不够用。
    summary_en: 'People working with video open it when they need subtitles for a clip or a translation
      into another language: they hand the video or audio to on-device processing on the Mac and get back
      subtitle files and a translation, with the footage never uploaded to the cloud. Which languages
      are supported, translation quality and any human proofreading step are not stated, so the workflow
      and deliverable still need verification.'
    inspiration_en: The trend is rising demand for video localisation, while many teams refuse to upload
      unreleased footage to cloud subtitle services. A wedge is industries with hard confidentiality needs
      such as corporate training, documentaries and legal evidence video, selling on-device processing
      rather than translation quality, priced per export or by annual licence, once local model language
      coverage is confirmed.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 做视频的人，在需要给一段素材加字幕或翻成另一种语言时，处理视频或音频文件，要完成字幕生成与译文交付。
        job_en: People working with video, when they need subtitles or a translation for a clip, work
          on video or audio files to produce subtitle files and a translated version.
        pain_zh: 公开材料只说明在 Mac 本地完成，没有说明原来这一步由谁做、花多久、成本多少，也没有用户抱怨或替代行为的记录，痛点强度无法确认。
        pain_en: The public material only says it runs locally on a Mac; it does not say who did this
          before, how long it took or what it cost, and there is no record of user complaints or workarounds,
          so pain intensity cannot be confirmed.
        current_alternative_zh: 推断：使用云端字幕或翻译服务，或人工听写加翻译，前者需要把素材上传。
        current_alternative_en: 'Inference: cloud subtitle or translation services, or manual transcription
          plus translation, the former requiring footage to be uploaded.'
        usage_reason_zh: 推断：如果本地处理确实能避免上传未公开素材，对保密有要求的团队会在处理内部培训或未发布内容时选它；但公开材料没有说明语言覆盖、翻译质量或任何使用证据，无法确认它比云端服务少哪一步负担。
        usage_reason_en: 'Inference: if on-device processing really avoids uploading unreleased footage,
          confidentiality-bound teams would pick it for internal training or unreleased content; but the
          material states no language coverage, translation quality or usage evidence, so which burden
          it removes versus cloud services cannot be confirmed.'
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决字幕制作与翻译这件事，但公开材料没有说明原来谁在做、花多久、不做的后果，痛点强度无法判断。
        evidence_ids:
        - ev-7406353b4fc85d4e
      - gate: consensus
        status: insufficient
        reason: 只有一句产品描述，没有用户评价、社区讨论或采用迹象，无法判断是否有人真的需要。
        evidence_ids:
        - ev-7406353b4fc85d4e
      - gate: model
        status: insufficient
        reason: 没有定价页，买方是个人创作者还是制作团队、按导出还是按授权收费均未披露，这是判断而非已验证事实。
        evidence_ids:
        - ev-7406353b4fc85d4e
      - gate: truth
        status: insufficient
        reason: 无法确认支持语言、翻译质量与是否需要人工校对，本地处理的交付确定性无从核对。
        evidence_ids:
        - ev-7406353b4fc85d4e
      next_validation: 收集 Polyglot 官方定价页或产品文档，确认支持语言范围、计价方式以及是否需要人工校对环节。
  recruitops-agent:
    slug: recruitops-agent
    name: recruitops-agent
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: AI + 商业
    project_type: open_source
    industries:
    - 招聘与人力资源服务
    industries_en:
    - Recruitment and HR services
    jobs:
    - 求职者批量投递与申请跟进
    jobs_en:
    - Job seekers managing bulk applications and follow-ups
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向求职者本人的本地优先招聘情报与投递运营工具：用户在自己的机器上运行它，让它接收职位信息与个人材料，代为完成职位筛选、申请提交和进度跟进，最终产出投递记录与待办清单；具体支持哪些招聘平台、是否需要人工逐条确认，公开材料未说明，流程与交付仍待核验。
    inspiration: 趋势是求职侧开始出现把「找职位—投递—跟进」整条链路交给 agent 的尝试，而不是只做简历润色。切入可以从特定人群做起，例如转行的技术人、需要批量投递的应届生或跨境求职者，按成功投递或面试邀约计费；但公开材料只有仓库描述，尚不足以判断它是否真的接入了主流招聘平台。
    summary_en: 'A local-first recruitment intelligence and application operations agent for job seekers:
      it runs on the user''s own machine, takes in job postings and personal materials, and handles screening,
      application submission and follow-up, producing an application log and to-do list. Which job platforms
      it supports and whether each submission needs human confirmation are not stated in the public material,
      so the workflow and deliverable remain unverified.'
    inspiration_en: The trend is that the job-seeker side is starting to hand the whole find-apply-follow-up
      chain to an agent rather than just polishing resumes. An entry point is a specific group such as
      career switchers, fresh graduates applying at volume, or cross-border applicants, charged per successful
      application or interview invitation. But the public material is only a repository description, which
      is not enough to tell whether it actually connects to mainstream job platforms.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 求职者在集中投递期，需要处理大量职位信息和个人材料，完成筛选、投递与后续跟进，并维持一份可追踪的投递记录。
        job_en: During an intensive job search, a candidate handles many postings and personal materials,
          completes screening, submission and follow-up, and keeps a trackable application record.
        pain_zh: 重复填写表单、逐条判断职位是否匹配、投递后忘记跟进，是求职者普遍抱怨的负担；但公开材料没有给出任何用户抱怨、使用记录或案例来证明这一痛点被该工具实际缓解。
        pain_en: Repeatedly filling forms, judging fit posting by posting, and losing track of follow-ups
          are widely reported burdens for job seekers, but the public material offers no user complaints,
          usage records or cases showing this tool actually relieves them.
        current_alternative_zh: 求职者目前多用招聘平台自带的批量投递、Excel 表格记录进度，或手动复制粘贴简历与求职信。
        current_alternative_en: Candidates currently rely on platforms' built-in bulk apply, spreadsheets
          to track progress, or manual copy-paste of resumes and cover letters.
        usage_reason_zh: 推断：如果它真能读取职位信息并自动完成表单填写与投递，就能省掉逐条复制粘贴和手工记录这一步，让批量投递的求职者少做重复劳动；但公开材料只有一句仓库描述，无法确认它是否真的接入招聘平台、是否只是本地脚本，因此无法判断用户为何会选择它。
        usage_reason_en: 'Inference: if it truly reads postings and completes form filling and submission
          automatically, it removes the copy-paste and manual logging step for high-volume applicants.
          But the public material is a single repository description, so it is impossible to confirm whether
          it connects to job platforms or is only a local script, and therefore why users would choose
          it.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决求职者批量投递与跟进的重复劳动，痛点方向可辨，但公开材料只有一句仓库描述，说不清它替代了哪一步具体旧流程，也未见任何用户使用或抱怨证据。
        evidence_ids:
        - ev-945e927715d13403
      - gate: consensus
        status: insufficient
        reason: 仓库有 78 个星标，说明有人关注，但没有讨论、issue 或用户反馈表明求职者已把它放进日常投递流程。
        evidence_ids:
        - ev-945e927715d13403
      - gate: model
        status: insufficient
        reason: 公开材料未说明买方是求职者个人订阅、招聘机构采购还是其他路径，也没有定价信息；这是判断，不是已验证事实。
        evidence_ids:
        - ev-945e927715d13403
      - gate: truth
        status: insufficient
        reason: 无法确认它是否真的对接招聘平台、投递是否需人工逐条确认，交付能否确定性发生缺少材料支持。
        evidence_ids:
        - ev-945e927715d13403
      next_validation: 收集该仓库的 README、issue 与 discussion，确认它实际对接哪些招聘平台、投递是否需要人工确认，以及是否有用户报告真实使用结果。
  accelerate-multimodal-rl-training-with-skyrl-on-amazon-sagem:
    slug: accelerate-multimodal-rl-training-with-skyrl-on-amazon-sagem
    name: SkyRL on Amazon SageMaker HyperPod
