      signal_level: 需求信号明确
      demand_read:
        job_zh: 普通消费者在手机上遇到日常提问、写文案或整理信息时，把材料交给 Muse，换取一段可直接使用的回答或草稿。
        job_en: Ordinary consumers with a daily question, a piece of writing or information to sort hand
