    summary_zh: 面向普通消费者的个人 AI 智能体，用户在日常对话与随身设备场景中向它提出请求，由模型生成回应并据称将延伸到智能眼镜等硬件形态；具体输入材料、交付物与人工确认环节在公开材料中未说明，具体流程或交付仍待核验。
    inspiration: 趋势是通用助手正从手机应用走向随身硬件入口，竞争点从模型能力转向设备与日常陪伴场景的占有。切入不在通用对话本身，而在眼镜等新入口上尚未被满足的具体任务，例如现场记录、提醒与随身查询，卖法可随硬件绑定或订阅，但公开材料未披露价格。
