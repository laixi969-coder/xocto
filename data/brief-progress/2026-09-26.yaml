      demand_read:
        job_zh: 酒店经营者在日常运营中需要处理房态、定价与点评回复等材料，以维持入住率与口碑。
        job_en: Hotel operators handle room inventory, pricing and review replies in daily operations
          to sustain occupancy and reputation.
        pain_zh: 中小酒店缺少专职运营人手，这些环节依赖人工经验，响应慢且质量不稳定。
