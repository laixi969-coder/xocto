    summary_en: When an individual needs to reach customer service, reschedule, or cancel a service, they
      open it and hand the task to an AI agent that places and conducts the call; the user receives the
      outcome or a recap. The public material is a single line and does not state which call scenarios
      are supported, whether the user must confirm in the loop, or how failures are handled.
    inspiration_en: 'The value of call delegation is not speech synthesis but whether the outcome is obtained:
      hold time, transfers, and rejections are absorbed by the agent. The opening is high-frequency, rule-bound
      scenarios such as carrier plan changes, clinic rescheduling, or delivery complaints, charged per
      completed task rather than a monthly seat. Compliance and identity verification, and who owns the
      call, must be settled first.'
