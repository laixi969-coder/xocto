    summary_zh: 越野跑爱好者在备赛期打开它，输入比赛与自身情况后由 AI 生成训练计划，并同步到 Garmin 手表上按天执行。用户拿到的是可穿戴设备里可执行的课表。公开材料只有一句描述，计划如何随训练反馈调整、是否含教练人工介入均未说明。
    inspiration: 训练计划生成本身不稀缺，稀缺的是与具体赛事、赛道爬升和手表生态的对接。切口可以更窄：只做某几场知名越野赛的备赛计划，或按赛道爬升与补给点定制，卖的是完赛概率而不是课表。与手表数据打通是留存关键，也是通用健身应用不愿做的细活。
    summary_en: During a race build-up, a trail runner opens it, enters the race and personal details,
      and the AI generates a training plan that syncs to a Garmin watch for day-by-day execution; the
      deliverable is an executable schedule on the wearable. The public material is one line and does
      not state how the plan adapts to training feedback or whether a human coach is involved.
    inspiration_en: Plan generation is not scarce; integration with a specific race, its elevation profile,
      and the watch ecosystem is. A narrower opening is to cover only a few well-known trail races, or
      to tailor plans to course elevation and aid stations, selling completion odds rather than a schedule.
      Watch data integration is both the retention hook and the tedious work general fitness apps avoid.
