        usage_reason_zh: 推断：相较人工导出后再汇总，把查询入口放进日常使用的租赁管理界面，可能减少一次数据搬运；但公开材料未给出用户反馈、采用或留存证据，无法确认用户因此选择它。
        usage_reason_en: 'Inference: compared with exporting and then aggregating by hand, placing the
