    summary_zh: 个人用户和知识工作者在浏览器或对话窗口里打开 Kimi，把长文档、网页资料或一段待办任务交给它；模型读取这些材料后做检索、摘要、问答与初稿生成，并可通过浏览器插件把一串网页操作固化成可复用的
      Skill，用户最终拿到整理后的文本或已执行的网页动作，关键结论仍需人工确认。
    inspiration: 通用助手这一层已被头部产品占据，正面拼模型和免费额度很难再切进去；更现实的方向是把这类长上下文与网页操作能力接到具体行业的旧流程上，例如律所卷宗检索、货代单证核对、地产尽调资料整理，按交付结果而不是按席位收费，谁掌握行业数据与合规责任谁就有壁垒。
    summary_en: Individuals and knowledge workers open Kimi in a browser or chat window and hand it long
      documents, web pages or a task; the model reads the material to search, summarize, answer and draft,
      and a browser plug-in can turn a sequence of web actions into a reusable Skill. Users get organized
      text or executed web actions, with key conclusions still needing human confirmation.
    inspiration_en: The general-assistant layer is already held by incumbents, so competing head-on on
      models or free quotas is hard; the more realistic opening is wiring long-context and browser-action
      capability into specific industries' old workflows, such as law-firm case-file search, freight document
      checking or property due-diligence compilation, charging for delivered results rather than seats,
      where industry data and compliance responsibility become the moat.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户与知识工作者在浏览器或对话窗口里处理长文档、网页资料和待办任务，需要快速得到检索结果、摘要或初稿，并把重复的网页操作固化下来复用。
        job_en: Individual users and knowledge workers handle long documents, web pages and tasks in a
          browser or chat window, needing fast search results, summaries or drafts, and wanting repetitive
          web actions captured for reuse.
        pain_zh: 长材料人工通读耗时，跨网页重复操作枯燥且易漏，通用助手此前上下文长度受限、无法直接操作网页，用户要在多个工具间搬运内容。
        pain_en: Reading long material manually is slow, repeated cross-page actions are tedious and error-prone,
          and earlier general assistants had limited context and could not act on web pages, forcing users
          to move content between tools.
        current_alternative_zh: 用户此前用搜索引擎加人工摘录、复制粘贴到文档，或使用上下文较短的对话助手分段处理，再手动执行网页操作。
        current_alternative_en: Users previously combined search engines with manual excerpting and pasting
          into documents, or used short-context chat assistants in segments and then performed web actions
          by hand.
        usage_reason_zh: 推断：相较分段粘贴与手动操作，Kimi 直接接收整份长材料并开放百万上下文，减少拆分与搬运这一步；浏览器插件把一串网页动作固化为可复用 Skill，减少重复点击，因此处理长资料或重复网页流程的用户会在这些场景选择它。
        usage_reason_en: 'Inference: versus segmented pasting and manual clicking, Kimi takes whole long
          documents with million-token context, removing the splitting and moving step, and the browser
          plug-in captures a sequence of web actions as a reusable Skill, cutting repeated clicks; users
          handling long material or repetitive web flows would choose it in those situations.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长材料通读与跨网页重复操作的需求，痛点是耗时与易漏，旧做法是人工摘录加手动点击，交付为整理文本或已执行动作，结构上成立。
        evidence_ids:
        - ev-fb4fe4891ec669d3
        - ev-04ebe22fab8d6640
      - gate: consensus
        status: insufficient
        reason: 公开材料只有模型发布与插件上线的报道，未见用户留存、复购或企业采购的公开证据，无法判断是否已进入长期工作流。
        evidence_ids:
        - ev-fb4fe4891ec669d3
        - ev-04ebe22fab8d6640
      - gate: model
        status: insufficient
        reason: 报道提到目标年收入 20 亿美元与港股 IPO 筹备，但未见官方定价页或已核验的付费客户，买方与付费路径仍属推断。
        evidence_ids:
        - ev-fb4fe4891ec669d3
      - gate: truth
        status: insufficient
        reason: 百万上下文与网页操作转 Skill 的确定性交付、错误率与人工复核边界均无公开材料支持，需看官方文档或实测。
        evidence_ids:
        - ev-04ebe22fab8d6640
      next_validation: 收集 Kimi 官方定价页与 K2.8 及浏览器插件的官方文档或可复现实测，核验上下文上限、网页操作成功率与人工复核边界。
