          stuck, or the actual loss caused by cloud uploads, so the pain intensity cannot be confirmed.
        current_alternative_zh: 公开材料未提供现有替代方式，常见做法可能是云端文生图服务或本地安装的绘图软件，但候选资料未证实。
        current_alternative_en: No current alternative is given; common options might be cloud text-to-image
          services or locally installed drawing software, but the candidate does not confirm this.
        usage_reason_zh: 无法判断。资料只说明在浏览器内本地生成，没有说明相较云端出图减少了哪一步负担或改善了哪项可核对结果，因此不能给出使用理由。
        usage_reason_en: Cannot be judged. The material only states local in-browser generation and does
          not say which step is reduced or which verifiable result improves versus cloud generation, so
          no usage reason can be given.
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决素材不出本机就能出图的问题，但资料未说明旧做法、痛点强度和不做的后果，需求是否成立无法判断。
        evidence_ids:
        - ev-c0e86151b247ac92
      - gate: consensus
        status: insufficient
        reason: 未进入：价值关未成立，公开点赞仅 3，无采用或持续使用证据。
        evidence_ids:
        - ev-c0e86151b247ac92
      - gate: model
        status: insufficient
        reason: 未进入：价值关未成立，无定价或付费路径信息。
