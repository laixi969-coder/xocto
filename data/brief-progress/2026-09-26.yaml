    decision: market_context
    summary_zh: 美国国防部在预算申请中提出五年内投入3030万美元，用于名为 Polygraph+ 或 Polygraph Next 的测谎项目，重点开发基于人工智能与机器学习的评分算法以及“远距离感知”技术。这是政府端对
      AI 感知与判定能力的一次具体采购需求，意味着面向国防与执法场景的 AI 供应商将获得新的合同机会，同时也把算法判定在敏感场景中的可靠性与合规争议推到台前（推断）。
    summary_en: The US Department of Defense has requested $30.3 million over five years for a polygraph
      program called Polygraph+ or Polygraph Next, focused on AI and machine-learning scoring algorithms
      and a technique called standoff sensing. This is a concrete government procurement demand for AI
      sensing and judgment capabilities, implying new contracting opportunities for vendors serving defense
      and law-enforcement scenarios while pushing questions of reliability and compliance in sensitive
      settings to the fore (inference).
    event_summary_zh: 美国国防部预算申请提出五年内投入3030万美元，用于名为 Polygraph+ 或 Polygraph Next 的改进型测谎项目，重点为基于人工智能与机器学习的评分算法及“远距离感知”技术。
    event_summary_en: A US Department of Defense budget request proposes $30.3 million over five years
