        current_alternative_zh: 公开材料未披露此前分销商如何获取租赁分析，可能依赖人工导出或既有报表，具体旧做法待核验。
        current_alternative_en: The public material does not disclose how distributors previously obtained
          rental analytics; it may have relied on manual exports or existing reports, and the prior practice
