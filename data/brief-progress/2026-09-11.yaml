    summary_en: ''
    event_summary_zh: OpenAI 于 2026 年 9 月 8 日公布由其未发布内部模型驱动的智能体生成的纳维-斯托克斯存在性与光滑性问题（千禧年大奖难题之一）解答，并附 Lean
      形式化证明，验证通过 GPT-6 Astra 完成；在全部尝试的问题上，智能体共发送约 490 万条消息、消耗约 3000 亿输出 token，其中该问题约占 270 万条消息、1300 亿
      token。该结果同时引发了关于抢发未发表成果与训练数据使用的争议。
    event_summary_en: On September 8, 2026, OpenAI announced an AI-generated resolution to the Navier–Stokes
      existence and smoothness problem, one of the Millennium Prize Problems, produced by agents running
      an unreleased internal model and including a formal proof in Lean verified via GPT-6 Astra; across
      all attempted problems the agents sent about 4.9 million messages and used roughly 300 billion output
      tokens, with about 2.7 million messages and 130 billion tokens on this problem. The announcement
      also drew controversy over scooping unpublished work and training-data use.
