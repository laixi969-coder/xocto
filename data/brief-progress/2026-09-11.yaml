      signal_level: 初步成立
      demand_read:
        job_zh: 做用户研究或客户洞察的团队在需要收集受访者反馈并形成结论时，把研究问题和访谈材料交给它，要完成的是拿到可用的研究结论。
        job_en: Teams doing user research or customer insight hand over research questions and interview
