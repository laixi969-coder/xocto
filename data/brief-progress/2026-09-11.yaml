        job_zh: 前端开发者或数据分析师需要把一份数据规格变成可用的表格或透视表界面，希望由编码 agent 直接生成而不是自己逐列搭。
        job_en: A front-end developer or data analyst needs to turn a data specification into a usable
          grid or pivot-table interface, and wants a coding agent to generate it instead of building column
          by column.
        pain_zh: agent 自由生成的表格代码往往结构混乱、交互缺失，人工还要回头重写排序、分页和透视逻辑。
