  huggingface-transformers-release-5170:
    slug: huggingface-transformers-release-5170
    name: Hugging Face Transformers
    decision: market_context
    event_summary_zh: 2026年9月9日，公开模型社区 Transformers 发布 v5.17.0，新增模型 HYV4（Hy4-Preview）：780B 参数混合专家架构，每
      token 仅激活 49B 参数；每层含 256 个路由专家加 1 个常驻共享专家，每 token 路由 8 个专家；上下文窗口 100 万 token；采用多头潜在注意力（MLA）把键值压缩进低秩潜表示。
    event_summary_en: 'On September 9, 2026, public model community Transformers released v5.17.0, adding
      the new model HYV4 (Hy4-Preview): a 780B-parameter mixture-of-experts model that activates 49B parameters
      per token, with 256 routed experts plus one always-active shared expert per layer and 8 experts
      routed per token, a 1M-token context window, and Multi-head Latent Attention (MLA) compressing keys
      and values into a low-rank latent.'
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 2026年9月9日，公开模型社区 Transformers 发布 v5.17.0，新增对 Hy4-Preview 的支持：一个 780B 参数、每 token 仅激活 49B
      的混合专家模型，带 100 万 token 上下文窗口，并用 MLA 将键值压缩进低秩潜表示。这意味着超大规模稀疏模型经主流开源库即可被应用开发者调用（推断：低激活比加键值压缩可能降低长上下文推理成本）；发布说明未含定价与性能实测，成本收益尚待核验，不宜据此推断长上下文应用已成主流。
    summary_en: 'On September 9, 2026, public model community Transformers shipped v5.17.0, adding support
      for Hy4-Preview: a 780B-parameter mixture-of-experts model activating only 49B parameters per token,
      with a 1M-token context window and MLA that compresses keys and values into a low-rank latent. Very
      large sparse models are now callable through a mainstream open-source library (inference: the low
      activation ratio plus KV compression may lower long-context inference cost); the release notes contain
      no pricing or benchmark data, so the cost claim stays unverified and one release does not prove
      long-context apps have gone mainstream.'
    inspiration: 趋势：超大 MoE 模型正以更低激活比接入主流开源工具链，长上下文能力的调用门槛在下降（推断）。切入：做长文档工作流的应用团队（如合同与卷宗审阅、财报与招股书分析）可把百万
      token 窗口当作基线能力重新设计交付物；未披露价格，不编定价。
    inspiration_en: 'Trend: very large MoE models are entering mainstream open-source tooling at lower
      activation ratios, lowering the bar for calling long-context capability (inference). Entry: application
      teams building long-document workflows (e.g., contract and case-file review, earnings and prospectus
      analysis) can treat a 1M-token window as a baseline capability and redesign their deliverables around
      it; no pricing has been disclosed, so none should be invented.'
    req_initial: null
