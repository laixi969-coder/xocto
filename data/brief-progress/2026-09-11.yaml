      verification.
    inspiration_en: The trend is that investors now sort AI applications by specific job to be done and
      owned domain rather than by model capability, with design given its own slot. A possible entry point
      is the last leg of the design delivery chain, the rework between mockup and runnable interface,
      sold to small product teams with fixed component standards and priced by output rather than seat;
      which old step this product actually replaces is not yet public, so watch first.
