    event_summary_en: Bug Hunt Bench, released on 25 August 2026, uses 105 real bugs from two production
      repositories to have frontier coding models such as GPT-6, Claude, Grok, Gemini and DeepSeek locate
      and fix them in their own CLIs, graded blind, with a live leaderboard and per-case receipts.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 软件开发者
    - 技术选型与采购人员
    jobs_en:
    - Software developers
    - Technical evaluation and procurement staff
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发团队在挑选编码模型时，面对各家自报的基准成绩，打开 Bug Hunt Bench 让它把两个生产仓库里的 105 个真实缺陷交给各模型在自身 CLI 中定位并修复，盲评后给出排行榜和逐条记录，最终得到一份可核对的横向对比；评测集是否持续更新、是否覆盖私有代码库仍待核验。
    inspiration: 趋势：编码模型的宣传分数与真实仓库里的缺陷修复能力之间出现落差，第三方盲评正在成为选型环节的独立供给。切入：可从需要为团队采购编码模型的技术负责人入手，用真实仓库缺陷而非合成题目做评测，卖点是对结果负责的对比报告，而不是再训练一个模型。
    summary_en: When choosing a coding model, a development team faces vendors' self-reported benchmark
      scores; Bug Hunt Bench takes 105 real bugs from two production repositories, has each model locate
      and fix them in its own CLI, grades blind, and returns a leaderboard with per-case receipts, giving
      a checkable side-by-side comparison; whether the set keeps updating and covers private codebases
      still requires verification.
    inspiration_en: 'Trend: a gap has opened between coding models'' advertised scores and their ability
      to fix bugs in real repositories, making third-party blind evaluation a separate supply for model
      selection. Entry point: start with technical leads buying coding models for a team, evaluating with
      real repository bugs rather than synthetic tasks, and selling a comparison report that stands behind
      its results instead of training another model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 技术负责人或开发者在为团队挑选编码模型时，处理各家公布的基准分数与自家代码库的真实缺陷，要判断哪个模型在实际仓库里更能定位并修复问题。
        job_en: When selecting a coding model for a team, a technical lead or developer works with vendors'
          published benchmark scores and the real bugs in their own codebase to judge which model actually
          locates and fixes problems in a real repository.
        pain_zh: 厂商自报的基准成绩与真实仓库表现常有落差，团队缺少可核对的横向对比，选错模型会在日常修复中持续付出代价。
        pain_en: Vendors' self-reported benchmarks often diverge from real repository performance, teams
          lack a checkable side-by-side comparison, and picking wrong keeps costing them in daily fixes.
        current_alternative_zh: 团队目前依赖厂商榜单、零散博客评测，或自己临时挑几个缺陷试跑。
        current_alternative_en: Teams currently rely on vendor leaderboards, scattered blog reviews, or
          hastily trying a few bugs themselves.
        usage_reason_zh: 推断：它用两个生产仓库的真实缺陷替代合成题目，并在各模型自己的 CLI 中盲评，省去团队自建评测集这一步，因此正在做模型选型的团队会参考它；公开材料未显示持续采用或付费证据。
        usage_reason_en: 'Inference: it replaces synthetic tasks with real bugs from two production repositories
          and grades blind inside each model''s own CLI, removing the step of building an in-house evaluation
          set, so teams choosing a model may consult it; public material shows no sustained adoption or
          payment evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码模型选型缺少可信横向对比的问题，痛点具体，且已有真实仓库缺陷与盲评流程作为交付。
        evidence_ids:
        - ev-29249af370247685
      - gate: consensus
        status: insufficient
        reason: 公开关注度有限，仓库收藏数处于低位，尚不能说明评测结果被广泛采信。
        evidence_ids:
        - ev-29249af370247685
      - gate: model
        status: insufficient
        reason: 公开材料未说明收费方式或买方，评测本身如何变现仍是判断而非已验证事实。
        evidence_ids:
        - ev-29249af370247685
      - gate: truth
        status: insufficient
        reason: 盲评与逐条记录提升了可信度，但评测集规模有限、是否持续更新与防作弊机制仍待核验。
        evidence_ids:
        - ev-29249af370247685
      next_validation: 收集 Bug Hunt Bench 的公开评测记录与仓库更新，确认评测集是否持续扩充并覆盖更多真实仓库。
