        reason: 仓库仅 102 星、20 次 fork，宣称的 19 万科学家使用无独立来源佐证，公开关注度不足以说明持续采用。
        evidence_ids:
        - ev-e62dcf6f6c509d0b
      - gate: model
        status: insufficient
        reason: 未见定价页或付费路径，技能库本身开源，钱可能来自企业定制或支持服务，这是判断而非已验证事实。
