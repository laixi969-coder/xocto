  lore:
    slug: lore
    name: lore
    decision: watching
    event_summary_zh: 开源项目 lore 公开其代码仓库，定位为 Claude Code、Codex 等 AI 编程会话的本地可搜索归档，目前约 143 颗星、40 个 fork，未披露定价或用户采用数据。
    event_summary_en: The open-source project lore published its repository as a local, searchable archive
      of Claude Code and Codex sessions; it shows about 143 stars and 40 forks, with no pricing or adoption
      data disclosed.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - Software Development
    jobs:
    - 使用 AI 编程助手的软件工程师
    jobs_en:
    - Software engineers using AI coding assistants
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者用 Claude Code、Codex 等 AI 编程助手完成任务后，原本只能翻找散落的本地会话记录来回忆改了什么、为什么改；lore 把这些会话存进本地可搜索档案，输入关键词即可查回历史会话。具体检索效果与交付形式仍待核验。
    inspiration: 趋势：AI 编程助手从单次问答走向跨会话长期协作，会话记忆开始被当作独立需求对待。切入：不与模型厂商正面拼记忆功能，可面向需要审计 AI 改码记录的团队或受监管行业，做可追溯的会话存档。
    summary_en: Developers using AI coding agents like Claude Code used to dig through scattered local
      session logs to recall past changes; lore archives sessions in a local, searchable store so keyword
      queries retrieve prior content. Retrieval quality remains unverified.
    inspiration_en: 'Trend: AI coding is shifting to cross-session collaboration, making agent memory
      a contested layer. Entry: target teams needing auditable records of AI code changes, not head-on
      competition with model vendors.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code、Codex 等 AI 编程助手的开发者，在隔天继续任务或接手旧项目时，需要从本地散落的会话记录中查回此前做过的改动、试过的方案与决策原因。
        job_en: A developer using AI coding agents like Claude Code or Codex, returning to a task the
          next day or picking up an old project, needs to retrieve prior changes, tried approaches, and
          decision rationale from scattered local session logs.
        pain_zh: 会话记录散落难检索，跨会话上下文丢失，开发者只能翻原始日志或重新口头解释背景，重复劳动且容易丢掉关键决策。
        pain_en: Session logs are scattered and hard to search; context is lost across sessions, forcing
          developers to dig through raw logs or re-explain background, wasting effort and losing key decisions.
        current_alternative_zh: 旧做法是翻终端或编辑器历史、手动维护记忆文件与笔记，或在每个新会话开头重新解释项目背景。
        current_alternative_en: 'The old approach: scrolling terminal or editor history, hand-maintaining
          memory files and notes, or re-explaining project context at the start of each new session.'
        usage_reason_zh: lore 把会话自动归档为可搜索的本地档案，用关键词即可查回历史决定，省去翻原始日志和向 AI 重新交代背景两步；推断：多项目切换的 AI 重度开发者最可能先用。缺留存与复用证据，不能断言已留在长期工作流。
        usage_reason_en: 'lore automatically archives sessions into a searchable local store, so a keyword
          query recovers past decisions, removing the log-digging and re-briefing steps; inference: heavy
          AI-assisted developers juggling projects would adopt first. Retention evidence is missing, so
          long-term workflow fit cannot yet be claimed.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨会话上下文丢失：开发者要查回此前改动与决策原因，旧做法靠翻日志或重新交代背景；会话归档可检索在结构上成立，属工作流推理，尚无用户反馈佐证。
        evidence_ids: []
      - gate: consensus
        status: insufficient
        reason: 143 颗星、40 个 fork 属早期关注度，可归因到本产品，但量级小，无用户评价或持续采用证据，共识未成立。
        evidence_ids: []
      - gate: model
        status: insufficient
        reason: 开源项目无定价页，买方不明；可能向个人开发者免费、向团队收存档或协作费用，这是判断而非已验证事实。
        evidence_ids: []
      - gate: truth
        status: supported
        reason: 本地归档与关键词检索是确定性技术交付，贴近找回上下文这一第一性目标；检索质量与实际效果尚无公开数据。
        evidence_ids: []
      next_validation: 抓取仓库 README 与使用文档，核验检索的具体方式（是否全文索引、可否按项目或时间过滤）以及是否出现团队协作或付费计划。
