    summary_en: When developers run several coding agents at once on macOS, a fake LED strip beside the
      Dock shows each agent's status on screen, so the user can tell which agent is still running and
      which has finished without switching back to each terminal window. Which agents are supported and
      how status maps to the strip are not stated in the public material and remain unverified.
    inspiration_en: The trend is that coding agents move from one-off chats to always-on background tasks,
      making status visibility a new friction point. An entry point is small teams running several agents
      at once, turning the status light into a signal that can live on desk hardware or a team board rather
      than a single developer's desktop ornament.
