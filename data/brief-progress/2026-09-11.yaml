    event_summary_en: On September 10, 2026, AWS announced that the Amazon Quick desktop application is
      now generally available on macOS and Windows, alongside a new activity feed for the iOS and Android
      mobile experience that consolidates email, calendar, and CRM content, with data kept inside the
      customer's environment.
