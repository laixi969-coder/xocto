    inspiration_en: 'Trend: customer research is moving from manual interviews and manual coding to AI-run
      interviews and synthesis, and is being bundled into larger enterprise software. Entry: start with
      consumer or SaaS teams that run frequent user research, charging per study or per delivered conclusion
      rather than per seat.'
    req_initial:
