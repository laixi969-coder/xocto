          into their own service and control call cost and latency when shipping image or video generation
          features.
        pain_zh: 自建推理要处理 GPU 采购、扩缩容与多模型适配，团队不愿承担这部分工程与资本开支；不解决则功能上线被算力和运维拖住。
        pain_en: Self-hosting inference means GPU procurement, scaling and multi-model adaptation, engineering
          and capital costs teams would rather avoid; unresolved, feature launches stall on compute and
          operations.
        current_alternative_zh: 团队此前多自建 GPU 集群、直接对接单一模型厂商 API，或在不同供应商之间手工切换。
