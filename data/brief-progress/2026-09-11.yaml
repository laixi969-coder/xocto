        - ev-1e454d31f9e7bcf9
      - gate: consensus
        status: insufficient
        reason: 仅有一份早期名单收录，没有客户案例、部署记录或重复使用证据，无法判断是否形成共识。
        evidence_ids:
        - ev-1e454d31f9e7bcf9
      - gate: model
        status: insufficient
        reason: 买方可能是企业安全预算，但候选未披露定价、计费方式或采购路径，属判断而非已验证事实。
        evidence_ids:
        - ev-1e454d31f9e7bcf9
      - gate: truth
        status: insufficient
        reason: 无法核对它是否贴近代理放行这一第一性目标，也看不到人工复核边界与交付确定性。
        evidence_ids:
        - ev-1e454d31f9e7bcf9
      next_validation: 收集 Fable Security 官方产品页或文档，确认它接收的输入、执行的动作与交付物，以及是否公布定价或客户案例。
