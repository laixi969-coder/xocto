        status: insufficient
        reason: 生成结果是否贴近真实报表需求、能否确定性交付，公开材料只有作者自述，缺少可复现实测。
        evidence_ids:
        - ev-3bacd525145acabf
      next_validation: 收集该库的仓库 issue 与可复现示例，确认 agent 生成的表格在真实报表场景中是否需要大量人工返工。
