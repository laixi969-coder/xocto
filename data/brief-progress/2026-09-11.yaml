    - China
    open_source: false
    summary_zh: 独立开发者在自己找选题时，要翻遍各推广平台和 Google Trends，手动记录哪些新站流量在涨、哪些词根搜索量突然变高。Sitehunter 定时抓取这些平台与词根数据，按增长排序输出网站榜单和关键词榜单，并附上可提交外链的目录站及其流量指标，用户拿到的是待复刻的选题清单和推广路径，具体抓取范围与数据口径仍待核验。
    inspiration: 趋势：独立开发者的选题判断正从个人经验转向可监控的公开数据流，谁先把“新站起量+新词暴涨”做成持续信号，谁就握住了小团队选品的入口。切入：从做独立站、小工具出海的中文开发者切入，先卖选题情报订阅，再考虑按榜单或
      API 调用收费；不要做通用榜单站，要绑定“域名新注册且增长快”这一条可复刻的判据。
    summary_en: Indie developers hunting for a niche must trawl launch platforms and Google Trends by
      hand to note which new sites are gaining traffic and which keyword roots are spiking. Sitehunter
      periodically scrapes those platforms and keyword roots, ranks sites and keywords by growth, and
      lists link-submission directories with traffic metrics, handing users a shortlist of ideas to clone
      plus a promotion path; the exact crawl scope and data definitions still need verification.
    inspiration_en: 'Trend: niche selection by indie developers is shifting from personal hunch to a monitorable
      public data stream; whoever turns ''new site rising + new keyword spiking'' into a continuous signal
      owns the entry point for small-team product picking. Entry: start with Chinese-speaking indie developers
      shipping small overseas tools, sell a niche-intelligence subscription first, then consider charging
      per list or API call; avoid a generic ranking site and anchor on the single criterion of newly registered
      domains growing fast.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队增长负责人在准备开新项目时，需要处理各推广平台的新品列表、网站流量数据和 Google Trends 词根数据，从中挑出值得复刻的选题和可提交的外链目录。
        job_en: An indie developer or small-team growth owner preparing a new project must work through
          launch-platform new-product lists, site traffic data and Google Trends keyword roots to pick
          ideas worth cloning and directories worth submitting to.
        pain_zh: 手动逐个平台翻找效率低，找到的站往往没有流量，无法判断方向能不能赚钱；词根查询要一个个手动跑，机会窗口在翻找过程中就过去了。
        pain_en: Manual platform-by-platform browsing is slow, the sites found often have no traffic so
          the direction cannot be judged, and keyword roots must be queried one by one, so the opportunity
          window closes while searching.
        current_alternative_zh: 靠个人经验在推广平台、Similarweb 类工具和 Google Trends 之间来回切换，用表格手工记录候选网站和词根。
        current_alternative_en: Switching by hand between launch platforms, Similarweb-style tools and
          Google Trends, logging candidate sites and keyword roots in a spreadsheet.
        usage_reason_zh: 推断：相比手工逐个平台翻找，它把新站发布、流量变化和词根暴涨合并成按增长排序的持续榜单，省掉的是“先发现候选”这一步，让开发者直接进入判断和复刻环节；因此正在找下一个选题、又缺少稳定信息源的独立开发者会先试用它。
        usage_reason_en: 'Inference: versus manual platform browsing, it merges new launches, traffic
          changes and keyword spikes into continuously ranked growth lists, removing the ''find candidates
          first'' step so developers go straight to judging and cloning; hence indie developers seeking
          a next niche without a stable information source would try it first.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是独立开发者找选题时信息分散、候选站无流量可验证的痛点，旧行为是手工翻平台和逐个查词根，痛点真实且高频；但公开材料只有作者自述，尚无外部用户采用证据。
        evidence_ids:
        - ev-6f1f8e5f98773dc0
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区发布帖和两条评论，没有独立用户反馈或持续使用记录，无法判断开发者是否已把它纳入日常选题流程。
        evidence_ids:
        - ev-6f1f8e5f98773dc0
      - gate: model
        status: insufficient
        reason: 目前以分享免费体验换取使用，未披露定价、付费用户或按榜单/API 计费的路径；买方可能是独立开发者个人或小团队，这是判断而非已验证事实。
        evidence_ids:
        - ev-6f1f8e5f98773dc0
      - gate: truth
        status: insufficient
        reason: 抓取范围、数据口径和榜单是否真能指向可赚钱方向均未公开，作者本人也在帖中询问是否存在真实需求，交付确定性尚未核验。
        evidence_ids:
        - ev-6f1f8e5f98773dc0
      next_validation: 收集 Sitehunter 官方页面或公开更新中关于数据来源、抓取频率与榜单口径的说明，以及是否出现付费或 API 计费页面。
