  memory-bridge:
    slug: memory-bridge
    name: memory-bridge
    decision: watching
    event_summary_zh: 2026年8月29日发布的记忆桥 MemoryBridge 是一个跨设备、跨平台的 AI 共享记忆层开源实现（CDSMP），公开仓库星标从 85 增至 92，无
      fork、无未决 issue，未见定价或客户信息。
    event_summary_en: Published on 29 August 2026, MemoryBridge is an open-source cross-device, cross-platform
      shared memory layer for AI (a CDSMP implementation); public repository stars rose from 85 to 92,
      with no forks, no open issues and no pricing or customer information.
    category: 基础层
    project_type: open_source
    industries:
    - 软件与信息服务
    industries_en:
    - Software and information services
    jobs:
    - 个人用户与开发者在多台设备、多个 AI 客户端之间切换时，把对话记忆与偏好同步到同一份可复用记忆里
    jobs_en:
    - Individuals and developers switching between multiple devices and AI clients, syncing conversation
      memory and preferences into one reusable store
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 个人用户与开发者在多台设备、多个 AI 客户端之间切换时使用它，把对话记忆与偏好写入一个跨设备共享的记忆层，再在另一台设备或另一个客户端里读回；目前是开源实现，具体同步范围、隐私边界与人工确认环节仍待核验。
    inspiration: 记忆正在从单个应用的内部状态变成用户自己的资产，谁掌握跨应用记忆，谁就掌握切换成本。切入不是再做一层协议，而是面向有明确隐私要求的场景（如律所、诊所）做可审计的本地记忆托管，或按设备数、按存储量收费；公开材料尚不足以判断开发者是否真的会迁移记忆。
    summary_en: Individuals and developers use it when switching between multiple devices and AI clients,
      writing conversation memory and preferences into a cross-device shared memory layer and reading
      them back on another device or client; it is currently an open-source implementation, and sync scope,
      privacy boundaries and human confirmation steps remain unverified.
    inspiration_en: Memory is turning from an app's internal state into a user-owned asset, and whoever
      holds cross-app memory holds switching costs. The opening is not another protocol layer but auditable
      local memory hosting for privacy-sensitive settings such as law firms or clinics, priced per device
      or per stored volume; public material is not yet enough to judge whether developers will actually
      migrate their memory.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户与开发者在多台设备、多个 AI 客户端之间切换时，需要把对话记忆与偏好同步到同一份可复用记忆里，避免每次重新交代背景。
        job_en: Individuals and developers switching between multiple devices and AI clients need to sync
          conversation memory and preferences into one reusable store instead of restating context each
          time.
        pain_zh: 记忆被锁在单个应用或单台设备里，换客户端就要重新输入背景，重复交代既费时又容易遗漏关键偏好。
        pain_en: Memory is locked inside one app or device, so switching clients means re-entering context,
          which is time-consuming and easily drops key preferences.
        current_alternative_zh: 用户手动复制粘贴历史对话，或依赖各平台自带的账号同步，跨平台时只能重新开始。
        current_alternative_en: Users manually copy and paste past conversations, or rely on each platform's
          own account sync, starting over when crossing platforms.
        usage_reason_zh: 推断：相较手动复制粘贴或依赖单平台同步，它把记忆抽成跨设备可读写的独立层，省去换设备时重新交代背景这一步，因此同时使用多个 AI 客户端的开发者会尝试接入；但仓库无
          fork、无 issue 讨论，缺少真实迁移与留存证据。
        usage_reason_en: 'Inference: compared with manual copy-paste or single-platform sync, it abstracts
          memory into an independent layer readable and writable across devices, removing the step of
          restating context when switching devices, so developers using several AI clients would try to
          integrate it; the repository has no forks or issue discussion, so real migration and retention
          evidence is missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨设备跨客户端记忆丢失的需求，痛点是重复交代背景，属工作流推理而非用户口述。
        evidence_ids:
        - ev-f266a2c77e61ecf8
        - ev-fe322f2470e63267
      - gate: consensus
        status: insufficient
        reason: 星标从 85 增至 92，但无 fork、无 issue 讨论，看不出开发者是否真的接入或复现。
        evidence_ids:
        - ev-f266a2c77e61ecf8
        - ev-fe322f2470e63267
      - gate: model
        status: insufficient
        reason: 开源项目未见定价页或商业主体，付费路径不明，属判断而非已验证事实。
        evidence_ids:
        - ev-f266a2c77e61ecf8
        - ev-fe322f2470e63267
      - gate: truth
        status: insufficient
        reason: 未说明记忆存储位置、加密方式与用户确认边界，隐私与安全承诺能否确定性交付尚不可核验。
        evidence_ids:
        - ev-f266a2c77e61ecf8
        - ev-fe322f2470e63267
      next_validation: 收集该仓库的 README 与 issue/discussion，核验其记忆存储方式、隐私边界与是否有开发者实际接入。
