  physical-ai-takes-the-wheel-how-the-worlds-robotaxi-leaders:
    slug: physical-ai-takes-the-wheel-how-the-worlds-robotaxi-leaders
    name: NVIDIA
    decision: market_context
    summary_zh: NVIDIA 于 2026 年 9 月 10 日发文指出，全球 robotaxi 市场作为物理 AI 的首个商业化突破，预计到 2035 年达到 4000 亿美元规模，运营中的商用车辆将超过
      600 万辆，且多家头部 robotaxi 企业正基于 NVIDIA 全栈开放平台构建车队。这表明物理 AI 正从单点部署进入车队规模化阶段，将带动对车载算力、训练基础设施、仿真与车队运维平台的需求，改变
      AI 应用的交付与竞争格局。
    summary_en: On September 10, 2026, NVIDIA published that the global robotaxi market, physical AI's
      first commercial breakthrough, is projected to reach $400 billion by 2035 with over 6 million commercial
      vehicles in operation, and that leading robotaxi operators are building their fleets on NVIDIA's
      full-stack open platform. This indicates physical AI is moving from single deployments to fleet-scale
      operation, driving demand for vehicle compute, training infrastructure, simulation, and fleet operations
      tooling, and reshaping how AI applications are delivered and competed.
