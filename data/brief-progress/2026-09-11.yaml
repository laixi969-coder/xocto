    inspiration: 趋势是组件库开始把 agent 当作第一使用者，用原语约束生成结果而不是让模型自由写 UI。切入可考虑为财务、销售分析这类高度依赖透视表的岗位提供按报表交付的服务，而不是再发一个通用表格组件。
    summary_en: A front-end developer or data analyst who needs to display grids and pivot tables lets
      a coding agent call the library's primitives to generate the grid from a specification; which table
      capabilities are covered and whether output needs manual adjustment is only described by the author
      and still needs verification.
    inspiration_en: The trend is component libraries treating agents as the primary user, constraining
      generated output with primitives instead of letting models write UI freely. A wedge could be delivering
      finished reports for finance or sales analysis roles that live on pivot tables, rather than publishing
      another general-purpose grid component.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
