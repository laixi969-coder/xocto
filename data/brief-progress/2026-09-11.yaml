    summary_zh: 面向在应用里调用大模型与 MCP 工具的开发团队：当模型要执行外部工具调用时，Conduct 在调用发出前接收这些请求并做规则校验与拦截，最终给出放行或阻断的结果，仍需开发者自行配置规则并确认边界。具体流程与交付形态仍待核验。
