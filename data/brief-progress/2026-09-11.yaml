      AI 套件，通用 BI 的轻量入口和分析师的临时取数环节面临直接竞争（推断）；本次公告未披露定价、客户或采用数据。
    summary_en: 'On September 10, 2026, OpenAI shipped the Data agent inside ChatGPT Work: business users
      connect company data and ask in natural language; the AI runs the analysis, surfaces insights, and
      returns interactive dashboards rather than a text-only answer. The old chain of request, analyst-written
      queries, board building, and revision rounds is compressed into one prompt (inference). Impact:
      natural-language dashboarding now ships inside a mainstream office AI suite, putting direct competitive
      pressure on lightweight BI entry points and ad-hoc data-pull work (inference); the announcement
      disclosed no pricing, customers, or adoption figures.'
