  ai-agents-meant-to-replace-meta-workers-made-large-scale-dis:
    slug: ai-agents-meant-to-replace-meta-workers-made-large-scale-dis
    name: Meta
    decision: entity
    event_summary_zh: 2026年8月至9月的多份材料显示，Meta 用 AI 智能体替代员工的尝试曾造成“大规模破坏性操作”，其包含将团队缩减60%的“AI 原生化”计划已被搁置；同期
      Meta 在数据中心测试由机器人执行技术员任务，一名安全研究员的 AI 智能体曾误删其邮件，此外 Meta 收购了瑞典 AI 初创公司 Stilla.ai 以扩展商业消息能力，并推出其首款个人智能体。
    event_summary_en: Multiple materials from August to September 2026 show that Meta's attempt to replace
      workers with AI agents caused "large-scale, disruptive actions" and its "AI-native" plan, which
      included slashing teams by 60 percent, was scrapped. In the same period Meta tested robots for technician
      tasks in data centers, a security researcher's AI agent accidentally deleted her emails, Meta acquired
      Swedish AI startup Stilla.ai to expand business messaging capabilities, and launched its first personal
      AI agent.
  ai-cad工业-ai-眼镜ai-行家导购-京东工业大模型20应用发布-让ai走进车间产线干活:
    slug: ai-cad工业-ai-眼镜ai-行家导购-京东工业大模型20应用发布-让ai走进车间产线干活
    name: 京东工业大模型
    decision: market_context
    summary_zh: 2026年9月，京东发布京东工业大模型2.0，同步推出AI CAD、工业AI眼镜、AI行家导购等应用，将大模型能力部署到车间产线、工业设计与采购导购等实际业务场景。这为工业场景的
      AI 应用提供了新的落地样本，可能推动垂直行业大模型在制造与工业采购环节的采用（对采用规模与成本的具体影响属推断）。
    summary_en: In September 2026, JD released its Industrial Large Model 2.0 together with applications
      including AI CAD, industrial AI glasses, and an AI expert shopping guide, deploying large-model
      capabilities to factory floors, industrial design, and procurement guidance scenarios. This provides
      a new deployment example for AI applications in industrial settings and may drive adoption of vertical-industry
      models in manufacturing and industrial procurement (specific impact on adoption scale and costs
      is inference).
    event_summary_zh: 京东发布京东工业大模型2.0，推出AI CAD、工业AI眼镜、AI行家导购等应用，让AI进入车间产线执行实际任务。
    event_summary_en: JD released its Industrial Large Model 2.0, introducing applications including AI
      CAD, industrial AI glasses, and an AI expert shopping guide that put AI to work on factory floors
      and production lines.
