      are reluctant to hand every holding to a cloud bookkeeping service, and local-first is becoming
      a selling point. The entry point is the privacy-sensitive individual or household, starting with
      multi-account aggregation and net-worth tracking, then considering annual subscription or one-time
      purchase; no pricing is disclosed in public material, so none is assumed.'
