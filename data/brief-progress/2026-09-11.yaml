      FP8/MXFP4 量化、缓存与内核相关的多处问题。
    event_summary_en: public model community released Transformers v5.17.0, adding support for new model
      architectures including Hy4-Preview (a 780B-parameter MoE model activating 49B parameters per token
      with a 1M-token context window), VibeVoice (multi-speaker long-form speech synthesis), NeoMME and
      NeoMME-Retriever (multimodal encoders from H Company), Fun-ASR-Nano (an 800M-parameter speech recognition
      model from Alibaba DAMO Academy), Kimi Linear (a hybrid linear attention architecture from Moonshot
      AI), and Canary-1B-v2 (a multilingual ASR and speech translation model from NVIDIA). The release
      also reduces per-decode-step accelerator synchronization to cut generation overhead and fixes multiple
      FP8/MXFP4 quantization, cache, and kernel issues.
