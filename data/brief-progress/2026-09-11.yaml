  chatgpt-to-face-tougher-regulation-in-the-eu:
    slug: chatgpt-to-face-tougher-regulation-in-the-eu
    name: ChatGPT
    decision: market_context
    summary_zh: 2026 年 8 月，欧盟依据《数字服务法》（DSA）将 OpenAI 的 ChatGPT 认定为“超大型在线搜索引擎”，Reddit 也同期被纳入同类监管，这使生成式 AI
      助手首次落入与大型社交平台相同的最高监管层级。OpenAI 需要对 ChatGPT 在未成年人保护、用户心理健康及非法内容传播方面的风险承担缓解义务，这意味着其在欧盟的内容审核与合规成本将上升；此类义务是否会影响
      AI 产品在欧盟的功能设计与上线节奏，属于推断。
    summary_en: In August 2026, EU regulators classified OpenAI's ChatGPT as a Very Large Online Search
      Engine under the Digital Services Act, with Reddit designated in the same tier, placing a generative
      AI assistant under the regime's strictest obligations for the first time. OpenAI must mitigate risks
      around minors, user mental health, and the spread of illegal content, raising its content-moderation
      and compliance costs in the EU; any impact on how AI features are designed or rolled out in the
      EU remains an inference.
    event_summary_zh: 欧盟将 ChatGPT 认定为《数字服务法》下的超大型在线搜索引擎，要求 OpenAI 就其对未成年人、用户心理健康及非法内容传播的影响承担风险缓解责任。
    event_summary_en: The EU designated ChatGPT as a Very Large Online Search Engine under the Digital
      Services Act, holding OpenAI accountable for mitigating risks related to minors, user mental health,
      and the spread of illegal content.
