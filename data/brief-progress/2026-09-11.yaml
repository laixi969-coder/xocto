      the clinical question to it, and it retrieves and summarizes evidence-based literature, returning
      sourced answers for doctors to verify before use; the exact input scope and human-confirmation flow
      are not stated in public materials.
    inspiration_en: 'Trend: vertical AI is moving from general Q&A to tools that own domain data and workflow,
      and healthcare is among the clearest willingness-to-pay settings. Entry: start from clinical literature
      retrieval and evidence-based Q&A, but data sources, actual clinician use and payment model need
      checking, and whether the window is already taken is unclear.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 临床医生在诊疗或查房时，就具体医学问题检索并核对循证文献，形成可引用的判断依据。
        job_en: Clinicians searching and verifying evidence-based literature on specific medical questions
          during consultations or rounds to form citable judgments.
        pain_zh: 医学文献量大且更新快，医生在门诊时间压力下难以快速找到并核对可靠证据。
        pain_en: Medical literature is vast and fast-moving, and doctors under clinic time pressure struggle
          to quickly find and verify reliable evidence.
        current_alternative_zh: 手动检索 PubMed 等数据库、查阅指南，或依赖同事经验与记忆。
        current_alternative_en: Manually searching databases such as PubMed, consulting guidelines, or
          relying on colleagues' experience and memory.
