      CRM 方向的 AI 代理应用。
    event_summary_en: On August 31, 2026, Clarify was named to Madrona's 2026 Intelligent Applications
      40 in the Early stage, listed among AI agent applications for CRM.
    category: AI + 商业
    project_type: new_application
