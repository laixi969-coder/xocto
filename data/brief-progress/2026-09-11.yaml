      writing posts, replying to comments, and planning the week, feeding in account positioning and raw
      material; the AI generates posts, comments, and replies from hook templates and scores drafts for
      AI traces, and the user gets publishable drafts and a score, still confirming before posting.
    inspiration_en: 'Trend: social account operations are being split into reusable skill packs, with
      writing, replying, and scoring as separate steps. Entry: start with agencies or B2B sellers, bind
      hook templates to industry corpora, and charge per account or per output rather than selling generic
      prompts.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 做个人品牌或替客户代运营 LinkedIn 的人，在写帖、回评和排周计划时，把账号定位与素材交给它，要完成的是产出可发布的帖子、评论和回复。
        job_en: People building a personal brand or running LinkedIn for clients hand over account positioning
          and raw material when writing posts, replying, and planning the week, aiming to produce publishable
          posts, comments, and replies.
        pain_zh: 持续写帖和回评耗时，通用 AI 写出的内容带明显机器味，容易被读者识别，运营者还要逐条改写。
        pain_en: Writing posts and replying consistently is time-consuming, and generic AI output carries
          an obvious machine tone that readers notice, forcing the operator to rewrite each item.
        current_alternative_zh: 旧做法是自己写或让通用聊天工具起草，再人工改写去味，钩子结构和周计划靠个人经验。
        current_alternative_en: The old way is writing by hand or drafting with a general chatbot, then
          manually rewriting to remove the AI tone, with hooks and weekly plans relying on personal experience.
        usage_reason_zh: 推断：相较通用聊天工具，它把钩子模板、评论回复和去 AI 痕迹打分串成一条流程，省去逐条改写这一步，因此高频发帖的运营者会在日常排期时选择它。
        usage_reason_en: 'Inference: compared with a general chatbot, it chains hook templates, comment
          replies, and AI-trace scoring into one flow, removing the per-item rewriting step, so high-frequency
          operators would pick it for daily scheduling.'
        current_alternative_en_note: ''
      gates:
      - gate: value
        status: supported
        reason: 它解决持续运营 LinkedIn 账号时写帖回评耗时、AI 内容易被识别的问题，旧做法是手写或通用工具加人工改写，结构上成立。
        evidence_ids:
        - ev-9ac628d3b5f21050
        - ev-5a30f044a25566eb
      - gate: consensus
        status: insufficient
        reason: 仓库收藏数上升说明有开发者关注，但没有公开的持续使用或客户采用证据，无法判断是否进入稳定工作流。
        evidence_ids:
        - ev-5a30f044a25566eb
      - gate: model
        status: insufficient
        reason: 公开材料标注为免费技能包，未披露任何付费路径，收入来源只能推断。
        evidence_ids:
        - ev-9ac628d3b5f21050
      - gate: truth
        status: insufficient
        reason: 去 AI 痕迹打分与钩子模板的实际效果没有可核对的结果数据，交付质量尚不清楚。
        evidence_ids:
        - ev-9ac628d3b5f21050
      next_validation: 收集该仓库的 issue、discussion 或使用说明，核验技能包的实际产出质量与是否有付费或商用路径。
