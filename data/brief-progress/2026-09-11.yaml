    summary_zh: Mac 用户在开会或会后整理纪要时打开它，不用把录音或文字上传云端，模型在本机处理会议内容并生成笔记，笔记保留在本地设备；具体输入形式、能否转写音频及交付细节仍待核验。
    inspiration: 趋势：会议记录工具正从云端转录转向本机处理，隐私合规成为新的差异化卖点。切入：律所、医疗、财税等不允许会议内容出内网的行业需要本地化记录，可按合规审计能力向团队收费。
    summary_en: Mac users open it during or after meetings to produce notes; instead of uploading audio
      or text to the cloud, a model processes meeting content on-device and keeps notes local. Exact inputs,
      whether it transcribes audio, and deliverables remain unverified.
    inspiration_en: 'Trend: meeting-note tools are shifting from cloud transcription to on-device processing,
      making privacy a selling point. Entry: serve law, healthcare, and finance teams that cannot let
      meeting content leave their network, possibly charging teams for compliance-grade local recording.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 需要记会议纪要的 Mac 用户（如咨询顾问、销售、项目经理），在客户会议或内部例会中面对不便上传云端的讨论内容，要在会中或会后快速得到一份可直接使用的会议笔记。
        job_en: Mac users who need meeting minutes—consultants, salespeople, project managers—facing discussions
          too sensitive to upload, wanting usable meeting notes during or right after the meeting.
        pain_zh: 云端会议记录工具会把录音和转写文本传到第三方服务器，涉密或客户敏感会议不敢用；人工边听边记又让人无法专注讨论，会后还要花时间整理。
        pain_en: Cloud note-takers send recordings and transcripts to third-party servers, so sensitive
          meetings go unrecorded; manual note-taking distracts from the discussion and still needs cleanup
          afterwards.
        current_alternative_zh: 现做法是用 Otter、Fireflies 这类云端转写工具，或在允许记录的场合人工记要点、会后凭记忆和录音补写纪要。
        current_alternative_en: Today they use cloud transcription tools like Otter or Fireflies, or take
          manual notes where allowed and reconstruct minutes from memory and recordings afterwards.
        usage_reason_zh: 相比云端工具，它在设备本地完成转写与笔记生成，录音和笔记不出机器，敏感会议也能放心记录；这是基于产品能力的推断，尚无用户反馈或案例支持。
        usage_reason_en: Versus cloud tools, processing happens on the device so audio and notes never
          leave the machine, letting users record sensitive meetings—this is an inference from product
          claims, not yet backed by user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决会中手动记笔记、会后整理纪要的负担，痛点是敏感会议不敢用云端录音工具；本机处理让人放心记录，属工作流推理，采用证据尚无。
        evidence_ids:
        - ev-40631c7669bcd1e6
      - gate: consensus
        status: insufficient
        reason: 仅上线页一句话，无用户评价、客户案例或可归因到该产品的使用数据，关注度无从核验；即使有榜单流量也不属于持续采用证据。
        evidence_ids: []
      - gate: model
        status: insufficient
        reason: 无定价页与买方信息，钱可能来自个人订阅（to C）或团队采购（to B），这只是判断而非已验证事实，需等官方定价披露。
        evidence_ids: []
      - gate: truth
        status: insufficient
        reason: 本机转写与总结质量、能否确定性交付好用的纪要均无实测，隐私承诺与笔记准确性之间的取舍也未验证。
        evidence_ids: []
      next_validation: 抓取其官网产品页与定价信息，核对具体输入（是否转写音频）、本机运行要求与收费方式，作为下一条可自动收集的公开证据。
