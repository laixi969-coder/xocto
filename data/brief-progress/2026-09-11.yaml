          a local tool, works with account and transaction records, and completes asset aggregation and
          net-worth tracking.
        pain_zh: 公开材料只说明产品是私有、本地优先的个人理财，没有描述用户遇到的具体困难，也没有说明旧做法哪里让人不满。
