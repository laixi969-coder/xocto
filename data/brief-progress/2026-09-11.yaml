        status: insufficient
        reason: 付费主体、定价与单位经济尚未核验；这是商业证据缺口，不反推问题不存在。
        evidence_ids: []
      - gate: truth
        status: insufficient
        reason: 交付能否稳定发生、以及人工与安全边界，尚缺可复现的公开证据。
        evidence_ids: []
      next_validation: 公开补证：追踪项目文档、issue 和 discussion，确认谁在何种强场景部署、替代了什么旧流程。
