  navierstokesandeuler:
    slug: navierstokesandeuler
    name: NavierStokesAndEuler
    decision: watching
    event_summary_zh: OpenAI 于 2026 年 9 月 8 日在 公开代码仓库 发布 NavierStokesAndEuler 仓库，公开伴随 Navier-Stokes 与
      Euler 结果的 Lean 形式化证明证书；截至 9 月 11 日该仓库获得 1,715 星、165 次 fork，无开放 issue。
    event_summary_en: On 8 September 2026 OpenAI published the NavierStokesAndEuler repository on public
      code repository, releasing Lean certificates accompanying Navier-Stokes and Euler results; by 11
      September the repository had 1,715 stars and 165 forks with no open issues.
    category: 基础层
    project_type: open_source
    industries:
    - 数学与基础科学研究
    - 高等教育与学术出版
    industries_en:
    - Mathematical and basic science research
    - Higher education and academic publishing
    jobs:
    - 数学研究者与形式化验证工程师
    jobs_en:
    - Mathematics researchers and formal verification engineers
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 数学研究者和形式化验证工程师在核验偏微分方程与流体力学相关证明时，打开这个仓库，让 Lean 证明助手接收随论文结果一同发布的证书文件并逐条检查推导步骤；最终得到的是机器可复核的证明通过或失败结果，人工仍需判断这些结果在数学上意味着什么。具体覆盖范围与配套论文的对应关系仍待核验。
    inspiration: 趋势是前沿模型团队开始把形式化证明证书当作研究成果的公开交付物，而不只是论文附录。切入可以放在数学、密码学、芯片验证这类对推导正确性有硬要求的领域：把“证明可被机器复核”做成审稿、教学或合规环节的交付标准，而不是再做一个通用定理证明器。
    summary_en: Mathematics researchers and formal verification engineers checking proofs in partial differential
      equations and fluid mechanics open this repository so the Lean proof assistant can ingest the certificate
      files released alongside the results and check each derivation step; the deliverable is a machine-checkable
      pass or fail, while humans still judge what the results mean mathematically. The exact coverage
      and its mapping to accompanying papers remain to be verified.
    inspiration_en: 'The trend is that frontier model teams now ship formal proof certificates as public
      research deliverables rather than paper appendices. The opening is in fields with hard correctness
      requirements such as mathematics, cryptography and chip verification: make machine-checkable proofs
      a delivery standard for peer review, teaching or compliance, instead of building another general
      theorem prover.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 数学研究者和形式化验证工程师在核验偏微分方程与流体力学相关证明时，处理随结果发布的 Lean 证书文件，要完成的任务是让证明助手逐条检查推导是否成立。
        job_en: Mathematics researchers and formal verification engineers verifying proofs in partial
          differential equations and fluid mechanics work with the Lean certificate files released alongside
          the results, aiming to have the proof assistant check each derivation step.
        pain_zh: 这类证明的推导链条长、人工复核成本高，且论文中的关键步骤容易在转写和引用中出错；公开材料未说明此前这些证明由谁、用什么方式核验。
        pain_en: Such proofs have long derivation chains and are costly to check by hand, and key steps
          in papers are easily corrupted in transcription and citation; the public material does not say
          who previously verified these proofs or how.
        current_alternative_zh: 公开材料未提供旧做法，只能推断此前依赖同行人工阅读论文与附录，缺少可机器复核的证书。
        current_alternative_en: The public material provides no prior practice; it can only be inferred
          that peer review relied on humans reading papers and appendices without machine-checkable certificates.
        usage_reason_zh: 推断：相较人工逐行阅读证明，该仓库让 Lean 直接接收证书文件并机械检查每一步，把“这一步是否成立”从人工判断变成可复核结果，因此需要为推导正确性负责的研究者会在核验阶段使用它；但公开材料未显示任何研究者已将其纳入日常工作流。
        usage_reason_en: 'Inference: compared with reading proofs line by line, this repository lets Lean
          ingest the certificate files and mechanically check each step, turning ''does this step hold''
          from human judgement into a checkable result, so researchers accountable for derivation correctness
          would use it at the verification stage; however, the public material shows no researcher has
          yet put it into a daily workflow.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决的是证明推导可被机器复核的需求，痛点在于人工核验链条长且易错；但公开材料未说明此前由谁、用什么方式核验，旧行为与不采用的后果都写不出来。
        evidence_ids:
        - ev-f4c0fef408881008
        - ev-5fdc7a8ab2a2f13f
      - gate: consensus
        status: insufficient
        reason: 1,715 星与 165 次 fork 只说明开源社区关注度，没有用户反馈、采用案例或重复使用证据，无法判断是否形成共识。
        evidence_ids:
        - ev-5fdc7a8ab2a2f13f
      - gate: model
        status: insufficient
        reason: 仓库为公开开源项目，未见定价、付费路径或机构采购信息；谁付钱、按什么计价均无公开材料支持。
        evidence_ids:
        - ev-f4c0fef408881008
      - gate: truth
        status: insufficient
        reason: 无法从公开材料确认证书覆盖范围、与配套论文的对应关系，以及检查结果是否被研究者实际采信，交付确定性未核验。
        evidence_ids:
        - ev-f4c0fef408881008
        - ev-5fdc7a8ab2a2f13f
      next_validation: 收集该仓库的 README、issue 或 discussion，确认 Lean 证书覆盖哪些具体结果、与哪篇论文对应，以及是否有研究者公开说明将其用于核验。
