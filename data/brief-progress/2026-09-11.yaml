    summary_zh: 数据工程师在把生产库数据复制到测试或分析环境前打开它，处理的是 SQL 数据库里的表与字段；工具扫描出敏感数据、执行遮蔽，并让用户复核遮蔽是否生效，最终交付一份可核验的脱敏结果。具体支持的数据库类型、遮蔽规则与复核方式仍待核验。
    inspiration: 趋势是数据合规从流程文档下沉到数据库操作本身，脱敏开始变成复制数据前的一个动作。切入可放在受监管行业的数据交付环节：把扫描、遮蔽、复核做成一次可留痕的作业，按库或按次收费，而不是卖一个通用工具。
    summary_en: A data engineer opens it before copying production database data into test or analytics
      environments, working on tables and fields inside a SQL database; the tool discovers sensitive data,
      applies masking, and lets the user verify that masking took effect, delivering a checkable de-identified
      result. The supported database types, masking rules and verification method still need verification.
    inspiration_en: 'The trend is that data compliance is moving from process documents down into database
      operations, where masking becomes a step before copying data. The entry point is the data delivery
      step in regulated industries: make discovery, masking and verification one traceable job billed
      per database or per run, rather than selling a generic tool.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 数据工程师在把生产库数据复制到测试或分析环境前，扫描并遮蔽手机号、证件号等敏感字段，并复核遮蔽结果。
        job_en: A data engineer scans and masks sensitive fields such as phone numbers and ID numbers
          before copying production database data into test or analytics environments, then verifies the
          masking result.
        pain_zh: 生产数据直接进测试环境会带来合规与泄露风险，人工逐表找敏感字段既慢又容易漏。
        pain_en: Copying production data straight into test environments creates compliance and leak risk,
          and finding sensitive fields table by table by hand is slow and easy to miss.
        current_alternative_zh: 手写 SQL 查询找字段、用脚本或数据库自带函数做遮蔽，靠人工检查清单确认。
        current_alternative_en: Hand-written SQL queries to find fields, scripts or built-in database
          functions to mask, and manual checklists to confirm.
        usage_reason_zh: 推断：相较手写脚本，它把发现、遮蔽、复核收在一次操作里，减少逐表排查和事后核对这一步负担，因此需要频繁向测试环境交付数据、又缺少专职合规工具的小团队会先试用它。
        usage_reason_en: 'Inference: compared with hand-written scripts, it folds discovery, masking and
          verification into one operation, cutting the table-by-table search and after-the-fact checking
          step, so small teams that frequently ship data to test environments without dedicated compliance
          tooling would try it first.'
      gates:
