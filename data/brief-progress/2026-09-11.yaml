  李飞飞发布全球首个多模态世界模型:
    slug: 李飞飞发布全球首个多模态世界模型
    name: World Labs
    decision: market_context
    summary_zh: 2026年9月，李飞飞创办的World Labs发布多模态世界模型：以一张静态图像为输入，补全底层3D场景结构，输出可交互的3D世界，并可用作机器人训练场。该发布将“单图生成可交互3D环境”推向产品级，意味着机器人仿真、具身智能训练与3D内容生产可能从人工建模转向模型生成，从而降低构建训练环境和3D内容的成本与门槛（推断）。
    summary_en: In September 2026, World Labs, founded by Fei-Fei Li, released a multimodal world model
      that takes a single static image as input, completes the underlying 3D scene structure, and outputs
      an interactive 3D world that can also serve as a training ground for robots. The release brings
      single-image-to-interactive-3D generation to a product grade, suggesting that 3D content production
      and robot simulation environments could shift from manual modeling to model-based generation, lowering
      the cost and barrier of building training environments for embodied AI (inference).
    event_summary_zh: World Labs（李飞飞创办）发布多模态世界模型：输入一张静态图像即可补全底层3D场景结构并生成可交互的3D世界，同时可用于为机器人构建训练场。
    event_summary_en: World Labs, founded by Fei-Fei Li, released a multimodal world model that takes
      a single static image as input, completes the underlying 3D scene structure to produce an interactive
      3D world, and can also be used to build training grounds for robots.
