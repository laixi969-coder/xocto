  reduce-inference-cold-starts-on-amazon-sagemaker-hyperpod-wi:
    slug: reduce-inference-cold-starts-on-amazon-sagemaker-hyperpod-wi
    name: Amazon SageMaker HyperPod
    decision: market_context
    summary_zh: AWS 于 2026 年 9 月 10 日宣布 Amazon SageMaker HyperPod 支持推理模型缓存，将模型权重和容器镜像预加载到集群节点，使 pod 直接读取本地
      NVMe 存储而非通过网络下载，推理冷启动从数十分钟缩短到秒级。这降低了在 SageMaker 上部署大模型推理的等待时间和运维成本，尤其有利于频繁更新模型和弹性扩缩容的 AI 应用场景。
    summary_en: On September 10, 2026, AWS announced that Amazon SageMaker HyperPod now supports model
      caching for inference, pre-loading model weights and container images onto cluster nodes so pods
      read from local NVMe storage instead of downloading over the network, cutting inference cold starts
      from tens of minutes to seconds. This reduces wait times and operational overhead for serving large
      models on SageMaker, particularly benefiting AI applications with frequent model updates and elastic
      scaling.
    event_summary_zh: Amazon SageMaker HyperPod 新增推理模型缓存功能，通过节点本地 NVMe 预载权重与镜像，将推理冷启动从数十分钟降至秒级。
    event_summary_en: Amazon SageMaker HyperPod added model caching for inference, pre-loading weights
      and images onto node-local NVMe storage to cut inference cold starts from tens of minutes to seconds.
  reduce-llm-latency-with-prefix-aware-routing-on-amazon-sagem:
    slug: reduce-llm-latency-with-prefix-aware-routing-on-amazon-sagem
    name: Amazon SageMaker Inference
    decision: market_context
    summary_zh: AWS 于 2026 年 9 月 10 日为 Amazon SageMaker Inference 推出前缀感知路由，将共享相同提示前缀的请求路由到同一实例以保持 KV 缓存热度；在
      Llama 3.1 70B 基准上，P50 首 token 时间最高降低 77%，KV 缓存命中率从约 25% 提升至 80% 以上。这直接降低 LLM 应用的推理延迟和缓存成本，使多轮对话和共享系统提示类工作负载更节省算力。
    summary_en: On September 10, 2026, AWS launched prefix-aware routing on Amazon SageMaker Inference,
      sending requests that share the same prompt prefix to the same instance to keep the KV cache warm;
      on Llama 3.1 70B benchmarks it reduced P50 time-to-first-token by up to 77% and raised KV cache
      hit rates from about 25% to over 80%. This directly lowers latency and cache costs for LLM applications,
      making multi-turn and shared-system-prompt workloads more compute-efficient.
    event_summary_zh: Amazon SageMaker Inference 上线前缀感知路由，在 Llama 3.1 70B 基准上将 P50 首 token 时间最多降低 77%，KV
      缓存命中率从约 25% 升至 80% 以上。
    event_summary_en: Amazon SageMaker Inference launched prefix-aware routing, cutting P50 time-to-first-token
      by up to 77% and lifting KV cache hit rates from about 25% to over 80% on Llama 3.1 70B benchmarks.
