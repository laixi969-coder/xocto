        usage_reason_en: 'Inference: it merges search, filtering and summarization into one question that
          returns sourced answers, cutting the back-and-forth across multiple databases, so time-pressed
          clinicians needing quick evidence may choose it; public materials offer no evidence of sustained
          clinician use or payment.'
      gates:
