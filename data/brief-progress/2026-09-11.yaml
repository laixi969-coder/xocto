        job_en: Individual investors doing stock research need to judge buy/sell logic from real market
          and fundamental data; the materials are stock prices, filings and market data, and the task
          is producing a grounded investment analysis.
        pain_zh: 通用大模型拿不到成体系的授权市场数据，直接提问只能得到泛泛或失真的分析；自己订阅数据终端并手工整理又要花大量时间和钱。
