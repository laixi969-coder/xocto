    regions_en: []
    open_source: true
    summary_zh: 开发者在自己电脑上打开已登录的 Chrome，让 Claude Code、Codex、Cursor 或 Gemini CLI 这类 agent 通过 MCP 与浏览器扩展接管页面操作，处理需要登录态的后台、表单或数据抓取任务，最终由
      agent 直接完成页面动作；具体支持哪些站点与操作边界仍待核验。
    inspiration: 趋势是 agent 正从沙箱浏览器转向用户真实登录态，登录墙后的重复操作第一次可以被自动化。切入可考虑电商后台、广告投放、跨境卖家运营这类每天在登录后台里点几十次的岗位，按可完成的流程或结果收费，而不是卖一个浏览器插件。
    summary_en: A developer opens their own logged-in Chrome on their machine and lets an agent such as
      Claude Code, Codex, Cursor or Gemini CLI take over page actions through MCP and a browser extension,
      handling logged-in back-office, form or scraping tasks; which sites and action boundaries are supported
      still needs verification.
    inspiration_en: The trend is agents moving from sandboxed browsers into the user's real logged-in
      session, so repetitive work behind a login wall becomes automatable for the first time. A wedge
      could be e-commerce back offices, ad operations or cross-border seller workflows where staff click
      through logged-in dashboards dozens of times a day, charging per completed flow or outcome rather
      than selling a browser plug-in.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或运营人员需要在已登录的电商后台、广告平台或内部系统里反复执行同一套页面操作（填表、导出、改价），希望把这段流程交给 agent 自动跑完。
        job_en: A developer or operator needs to repeat the same set of page actions (form filling, exporting,
          price edits) inside a logged-in e-commerce, ad or internal system, and wants an agent to run
          that flow automatically.
        pain_zh: 登录态和验证码让沙箱浏览器无法进入真实后台，人工只能自己一遍遍点，脚本又要单独维护 cookie 与登录逻辑。
        pain_en: Logins and captchas keep sandboxed browsers out of real back offices, so people click
          through manually while scripts need separate cookie and login handling.
        current_alternative_zh: 人工在浏览器里重复操作，或写 Playwright/Selenium 脚本并自行维护登录态，或使用云端浏览器服务。
        current_alternative_en: Manual repetition in the browser, self-maintained Playwright/Selenium
          scripts with their own session handling, or cloud browser services.
        usage_reason_zh: 推断：它复用用户本机已登录的 Chrome，省掉了为每个站点单独配置登录态这一步，因此需要频繁操作登录后台的开发者会先试它；但公开材料没有留存或复购证据，长期是否留在工作流里尚不清楚。
        usage_reason_en: 'Inference: it reuses the user''s already logged-in local Chrome, removing the
          step of configuring sessions per site, so developers who frequently operate logged-in back offices
          would try it first; public material shows no retention or repeat-use evidence, so long-term
          workflow stickiness is unclear.'
      gates:
      - gate: value
        status: supported
        reason: 它解决登录态下重复页面操作的问题，痛点具体且旧做法是人工点击或自维护脚本，结构上成立。
        evidence_ids:
        - ev-41502e9c03214554
        - ev-18ba421b72593f7e
