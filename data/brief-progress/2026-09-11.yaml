    summary_zh: 2026年9月，中国AI芯片厂商在高带宽内存（HBM）供应短缺的背景下上调芯片价格。这是供给受限驱动的算力价格变化，意味着依赖国产AI芯片的训练与推理成本可能上升，进而推高中国市场上AI应用的交付成本；具体涨价幅度与涉及厂商待进一步材料确认（影响为推断）。
    summary_en: In September 2026, Chinese AI chipmakers raised chip prices amid a shortage of high-bandwidth
      memory (HBM). This supply-constrained price change implies potentially higher training and inference
      costs for workloads relying on domestic Chinese chips, which could raise the delivery cost of AI
      applications in the Chinese market; the exact magnitude and affected vendors remain unconfirmed
      (impact is inference).
    event_summary_zh: 中国AI芯片厂商在HBM供应短缺背景下上调芯片价格（2026年9月10日报道）。
    event_summary_en: Chinese AI chipmakers raised chip prices amid a shortage of high-bandwidth memory
      (HBM), reported September 10, 2026.
