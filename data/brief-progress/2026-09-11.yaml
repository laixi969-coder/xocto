      - gate: truth
        status: insufficient
        reason: 答案是否可稳定溯源、是否需医生二次确认、错误责任边界如何，公开材料未给出可核对结果。
        evidence_ids:
        - ev-4834c91d28be53ee
      next_validation: 收集 OpenEvidence 官方定价页或医院客户案例，核对付费方、部署方式与临床使用结果。
  openreality:
    slug: openreality
    name: Open Reality
    decision: watching
    event_summary_zh: 项目将 MCP 工具、可自托管 broker 与 VGGT-SLAM 库合并为单一 BSD-2-Clause 开源仓库，星标由 52 增至 56。
    event_summary_en: The project merged its MCP tools, a self-hostable broker and the VGGT-SLAM library
      into a single BSD-2-Clause repo; stars rose from 52 to 56.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 软件开发者
    jobs_en:
    - Software developers
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者想让 AI 理解真实空间时，用手机拍一段视频；项目用 VGGT-SLAM 重建三维场景，并通过 MCP 接口供 Claude、Codex、Cursor 查询，交付可自托管的场景查询服务。具体用户流程与交付效果仍待核验。
    inspiration: 趋势：物理世界的三维数据正从激光扫描等专业设备走向手机视频，AI 代理开始要直接查询真实空间。切入：不做通用重建工具，选房产带看、工地巡检、保险查勘等具体行业，做拍视频即交付可查询数字孪生并按场景收费。
    summary_en: Developers who need an AI to understand a real space record a phone video; the project
      rebuilds it as a 3D scene with VGGT-SLAM and exposes it via MCP for Claude, Codex or Cursor, self-hostable.
      User workflow and delivery quality remain unverified.
    inspiration_en: 'Trend: 3D capture is moving from laser scanners to phone video, and AI agents increasingly
      query real spaces. Entry: pick one vertical such as property tours, site inspection or insurance
      survey, deliver queryable digital twins per video and charge per scene.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 空间数字化团队或开发者拿到一段手机拍摄的现场视频，需要把它变成可被 AI 代理查询的三维场景，用于后续的空间问答或标注任务。
        job_en: A spatial digitisation team or developer takes a phone video of a site and needs it turned
          into a 3D scene that AI agents can query for later spatial Q&A or annotation.
        pain_zh: 过去要得到可查询的三维场景，需要激光扫描仪、专业重建软件和人工建模，设备贵、周期长，普通团队拿不到。
        pain_en: Getting a queryable 3D scene used to require laser scanners, professional reconstruction
          software and manual modelling, which is expensive, slow and out of reach for small teams.
        current_alternative_zh: 用激光扫描加专业建模外包，或干脆放弃三维化，只靠照片和文字描述沟通空间。
        current_alternative_en: Outsourcing laser scanning plus manual modelling, or skipping 3D entirely
          and communicating space through photos and text.
        usage_reason_zh: 推断：它把重建与查询接口放进同一个可自托管仓库，开发者不必自己拼 SLAM 与代理协议，就能让 Claude、Codex、Cursor 直接读取场景，因此做空间类
          AI 应用的团队在需要低成本三维输入时会先试它。
        usage_reason_en: 'Inference: it puts reconstruction and the query interface in one self-hostable
          repo, so developers need not stitch SLAM to an agent protocol themselves and Claude, Codex or
          Cursor can read the scene directly; teams building spatial AI apps would try it first for cheap
          3D input.'
      gates:
      - gate: value
        status: supported
        reason: 它解决手机视频转可查询三维场景的需求，痛点是不用激光扫描也能让 AI 理解空间；买方与付费路径公开材料未说明。
        evidence_ids:
        - ev-7cd524f7fbc4a5f1
        - ev-b2a97c629e47c0e3
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标从 52 增至 56，缺少用户评价、客户案例或行业采用证据，无法判断共识是否形成。
        evidence_ids:
        - ev-7cd524f7fbc4a5f1
        - ev-b2a97c629e47c0e3
      - gate: model
        status: insufficient
        reason: 未披露定价、买方或收费方式，钱可能来自企业自托管部署或服务，属判断而非已验证事实。
        evidence_ids:
        - ev-7cd524f7fbc4a5f1
      - gate: truth
        status: insufficient
        reason: 重建精度、自托管部署成本与人工复核边界均无公开材料，交付确定性尚不能核对。
        evidence_ids:
        - ev-7cd524f7fbc4a5f1
        - ev-b2a97c629e47c0e3
      next_validation: 收集该仓库的部署文档与 issue/discussion，确认手机视频重建的实际精度、自托管成本与是否有企业用户报告使用结果。
