    jobs:
    - 希望沉淀个人经验的专家
    jobs_en:
    - Experts preserving personal know-how
    regions:
    - 全球
    regions_en:
    - Global
    open_source: true
    summary_zh: 个人想把自己的知识、记忆和决策沉淀成 AI 分身时打开它；提交个人经验与判断材料，系统提炼成开源、可检查的代理分身；用户拿到一个能以本人视角应答的分身，具体提炼流程与交付形态仍待核验。
    inspiration: 趋势：个人记忆与分身正成为 agent 的下一个必争层，谁掌握你的上下文谁留住你。切入：别做通用分身，可从律师、医生等重复答疑的专业人士切入，按回答次数卖结果。
    summary_en: Individuals feed their knowledge, memories and decisions into this open-source tool, which
      distills them into an inspectable AI agent twin that answers in their voice; the exact distillation
      pipeline and deliverable remain unverified.
    inspiration_en: 'Trend: personal memory and agent twins are becoming the retention layer of the agent
      stack. Entry: skip the generic twin; start with professionals who answer the same questions daily,
      such as lawyers or doctors, and charge per answered consultation.'
    req_initial:
      verdict: pseudo_demand
      signal_level: 需求存疑
      demand_read:
        job_zh: 独立顾问或专业人士在需要反复向客户、同事解释自己的判断依据时，整理自己的笔记、历史决策和问答记录，希望得到一个能替自己按本人立场作答的分身。
        job_en: Independent consultants or professionals who repeatedly explain their reasoning to clients
          and colleagues organize their notes, past decisions and Q&A records, hoping for a twin that
          answers in their own stance.
        pain_zh: 个人经验散落在笔记、聊天和记忆里，每次被问都要重新讲一遍，无法复用；但公开材料只说明它能提炼知识，没有说明提炼后回答的准确度由谁负责。
        pain_en: Personal experience is scattered across notes, chats and memory, and must be re-explained
          every time; yet the public material only says it distills knowledge, without saying who is accountable
          for the accuracy of the twin's answers.
        current_alternative_zh: 旧做法是自己写文档、做 FAQ 或录课程，把经验一次性讲清楚，之后靠人肉答疑。
        current_alternative_en: The old way is writing docs, building an FAQ or recording a course to
          explain experience once, then answering follow-up questions manually.
