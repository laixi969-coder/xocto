      holdings and transaction records, and the local program categorizes, aggregates and computes net
      worth, producing a personal asset view that stays on the machine rather than in the cloud. Public
      material only states 'private, local-first personal finance'; the import formats, any AI involvement
      and the delivered output still need verification.
