      - gate: consensus
        status: insufficient
        reason: 社区仅有少量打分测试讨论，未见持续使用或采纳信号。
        evidence_ids:
        - ev-eed41ff955d7019b
      - gate: model
        status: insufficient
        reason: 公开材料未提供明确的商业化变现模式或付费方案。
        evidence_ids:
        - ev-eed41ff955d7019b
      - gate: truth
        status: challenged
        reason: 无法对创业想法的商业成功率提供确定性交付或可信保证。
