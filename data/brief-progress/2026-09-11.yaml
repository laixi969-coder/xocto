  a-milestone-in-expanding-access-to-ai:
    slug: a-milestone-in-expanding-access-to-ai
    name: OpenAI
    decision: market_context
    summary_zh: OpenAI 通过 ChatGPT Ads 推出全球扩张，年化收入已达 10 亿美元，提供免费及低价选项，显著降低 AI 进入门槛，推动 AI 在更广泛行业的采用与交付，并对竞争对手形成价格与功能双重压力。
    summary_en: OpenAI’s ChatGPT Ads expansion has achieved a $1 billion annualized revenue run‑rate,
      offering free and affordable options worldwide. This lowers the cost of entry for AI, accelerates
      adoption across diverse sectors, and pressures competitors with both pricing and feature advantages.
    event_summary_zh: ChatGPT Ads 年化收入已达 10 亿美元，已在全球范围内扩张，提供免费和低价选项，进一步扩大 AI 的可访问性。
    event_summary_en: ChatGPT Ads has reached a $1 billion annualized revenue run‑rate, expanded globally,
      and offers free and affordable options, further expanding AI accessibility.
  acto-achieves-veeva-gold-product-partner-status-following-a:
    slug: acto-achieves-veeva-gold-product-partner-status-following-a
    name: ACTO
    decision: market_context
    summary_zh: ACTO 与 Veeva 共同合作近十年后，获得 Veeva Gold Product Partner 认证，表明其在生命科学领域的 AI 驱动销售与运营解决方案已被 Veeva
      认可。此认证提升了 ACTO 在 Veeva 生态系统中的可见度与合作深度，可能降低客户获取成本并加速 AI 工具在医药销售流程中的部署。
    summary_en: ACTO, after nearly a decade of collaboration with Veeva, has earned Veeva Gold Product
      Partner status, indicating that its AI‑driven sales and operations solutions for life sciences are
      recognized within the Veeva ecosystem. This certification enhances ACTO’s visibility and integration
      depth with Veeva, potentially reducing customer acquisition costs and accelerating the deployment
      of AI tools in pharmaceutical sales workflows.
    event_summary_zh: ACTO 获得 Veeva Gold Product Partner 认证。
    event_summary_en: ACTO earned Veeva Gold Product Partner status.
