    event_summary_zh: 2026年8月31日，Fable Security 被列入 Madrona 2026 年 Intelligent Applications 40 早期阶段名单；同一批被点名的
      JetStream Security 与 AI Underwriting Company 分别覆盖治理与可见性、人力风险管理、保险与认证，Fable Security 由 CrowdStrike、Attivo、SentinelOne、Abnormal
      Security 等安全公司背景的人创立。
    event_summary_en: On August 31, 2026, Fable Security was named to Madrona's 2026 Intelligent Applications
      40 list in the Early stage; the same batch named JetStream Security and AI Underwriting Company
      covering governance and visibility, human risk management, and insurance and certification respectively,
      and Fable Security was built by veterans of CrowdStrike, Attivo, SentinelOne and Abnormal Security.
    category: AI + 商业
    project_type: new_application
    industries:
    - 企业信息安全
    - 金融保险
    industries_en:
    - Enterprise Information Security
    - Finance and Insurance
    jobs:
    - 企业安全负责人
    - AI 平台运维负责人
    jobs_en:
    - Enterprise Security Lead
    - AI Platform Operations Lead
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 企业安全或 AI 平台负责人要在内部放行自主 AI 代理时，需要先处理代理的权限、行为可见性与风险归属问题；Fable Security 面向这一环节提供治理与人力风险相关能力，但候选材料未给出它具体接收什么输入、执行什么动作、交付什么可核对结果，具体流程与交付仍待核验。
    inspiration: 趋势是自主代理进入企业后，放行决策本身成了新工作，安全团队需要能对代理行为负责的依据。切入可从受监管行业（金融、医疗）的代理上线评审环节进入，卖的是可审计的放行材料而非又一个安全控制台；价格与计费方式未披露，不得编造。
    summary_en: When an enterprise security or AI platform lead wants to let autonomous AI agents run
      internally, they must first deal with agent permissions, behaviour visibility and risk ownership;
      Fable Security targets this step with governance and human-risk capabilities, but the candidate
      material does not state what inputs it takes, what actions it performs or what checkable output
      it delivers, so the concrete workflow and deliverable remain unverified.
    inspiration_en: 'The trend is that once autonomous agents enter the enterprise, the approval decision
      itself becomes new work, and security teams need evidence they can be accountable for. Entry point:
      the agent go-live review inside regulated industries such as finance and healthcare, selling auditable
      approval material rather than another security console; pricing and billing model are undisclosed
      and must not be invented.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 企业安全负责人或 AI 平台负责人在把自主 AI 代理接入内部系统前，需要评估代理的权限范围、行为可见性与风险归属，并形成可对内交代的放行依据。
        job_en: An enterprise security lead or AI platform lead must, before connecting autonomous AI
          agents to internal systems, assess agent permissions, behaviour visibility and risk ownership,
          and produce an internally defensible approval basis.
        pain_zh: 自主代理会自行调用工具和系统，传统以人和终端为中心的安全流程无法说明代理做了什么、该由谁负责；不解决则上线审批卡住或风险敞口无人认领。
        pain_en: Autonomous agents call tools and systems on their own, and traditional human- and endpoint-centric
          security processes cannot explain what an agent did or who owns the risk; unresolved, either
          go-live approval stalls or the exposure goes unclaimed.
        current_alternative_zh: 企业目前多靠人工评审、内部安全清单、通用可观测性工具或干脆暂缓上线来绕过，缺少针对代理的专门流程。
        current_alternative_en: Enterprises currently work around this with manual reviews, internal security
          checklists, generic observability tools, or simply delaying rollout; there is no dedicated agent-specific
          process.
        usage_reason_zh: 推断：若它能把代理的权限与行为记录整理成可审计的放行材料，就能省掉安全团队逐条手工取证这一步，受监管行业里负责上线评审的人会因此选择它；但候选材料未说明具体动作与交付物，这一因果尚未被公开事实支持。
        usage_reason_en: 'Inference: if it turns agent permission and behaviour records into auditable
          approval material, it removes the step of security teams manually gathering evidence item by
          item, which is why go-live reviewers in regulated industries would choose it; however the candidate
          material does not describe the concrete action or deliverable, so this causal link is not yet
          supported by public facts.'
      gates:
