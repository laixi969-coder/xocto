    summary_zh: 2026 年 9 月，破产的 Spirit 即将向 Google 出售数据一事引发越来越多的反对声音，批评者提出“破产不能成为 AI 的新圈地运动”。该事实表明破产程序正被视作
      AI 公司获取大规模数据的潜在渠道，若交易推进，可能影响 AI 训练数据的获取成本、合规边界，并引来监管与隐私审查（后两点为推断）。
    summary_en: In September 2026, bankrupt Spirit's looming data sale to Google has drawn mounting objections,
      with critics warning that bankruptcy cannot become the new land grab for AI. The fact shows bankruptcy
      proceedings are being treated as a potential channel for AI companies to acquire large-scale data;
      if the sale proceeds, it could affect the cost and compliance boundaries of AI training data and
      attract regulatory and privacy scrutiny (the latter two are inferences).
    event_summary_zh: 2026 年 9 月，处于破产程序的 Spirit 即将向 Google 出售其数据，引发公开反对，批评者称“破产不能成为 AI 的新圈地运动”。
    event_summary_en: In September 2026, Spirit, currently in bankruptcy proceedings, is moving toward
      selling its data to Google, prompting public objections with critics warning that bankruptcy must
      not become the new land grab for AI.
