        status: insufficient
        reason: 状态映射是否准确、支持哪些代理、出错时能否可靠提示均未说明，交付确定性无法核对。
        evidence_ids: []
      next_validation: 收集该仓库的 README、issue 与 discussion，核对它支持哪些编码代理、状态如何映射到灯带，以及是否有用户反馈长期使用。
