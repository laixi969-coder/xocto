      on that dataset, and returns grounded analysis general chatbots cannot produce; exact coverage and
      delivery remain unverified.
    inspiration_en: 'Trend: general-purpose models hit a data wall in financial analysis, and exclusively
      licensed data is becoming the new moat. Entry point: serve individual investors or small research
      desks who cannot afford terminals, selling data-driven conclusions rather than seats; pricing is
      undisclosed, so no claims.'
