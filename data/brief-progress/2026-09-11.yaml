    inspiration: 趋势是 agent 开始接管终端这类长会话、有状态的工作环境，而不只是补全一行命令。切入可考虑把这种常驻会话能力包成面向运维或数据工程的托管服务，按托管的机器或任务收费，而不是再做一个终端外壳。
    summary_en: A developer runs Hydra in the local terminal, where a resident PTY daemon hosts sessions
      so an agent can execute commands in a real terminal environment and keep session state; how it orchestrates
      tasks and what it delivers is only described at the architecture level, so the flow and output still
      need verification.
    inspiration_en: The trend is agents taking over long-lived, stateful environments like the terminal
      rather than just completing a single command. A wedge could be packaging this resident-session capability
      as a managed service for ops or data engineering teams, charging per managed machine or task instead
      of shipping another terminal shell.
