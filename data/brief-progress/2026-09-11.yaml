        current_alternative_en: Public material does not mention how users previously tracked finances,
          so it is unclear whether it replaces spreadsheets, cloud bookkeeping apps or broker statements.
        usage_reason_zh: 材料未提供任何用户反馈、客户案例或采用证据，无法说明用户为何选择它而非旧做法；仅凭“本地优先”这一功能描述不足以构成使用理由，属于推断缺口。
