    summary_zh: 临床医生在诊疗或查房遇到具体医学问题时，向它提出临床问题，由它检索并汇总循证医学文献，返回带出处的答案供医生核对后用于判断；具体输入范围与人工确认流程公开材料未说明。
    inspiration: 趋势：垂直领域 AI 正从通用问答转向'拥有领域数据与工作流'的专用工具，医疗是其中付费意愿最明确的场景之一。切入：可从临床文献检索与循证问答切入，但需先确认其数据来源、医生实际使用与付费方式，窗口是否已被头部占据尚不明确。
