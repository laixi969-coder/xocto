  native-is-now-the-future-of-mobile-at-shopify:
    slug: native-is-now-the-future-of-mobile-at-shopify
    name: Shopify
    decision: market_context
    event_summary_zh: Shopify 于 2026 年 9 月 10 日发布博客，宣布移动应用从 React Native 回归 Swift 与 Kotlin 双原生代码库，理由是
      AI 编程代理已能承担足够多的双端实现、翻译、测试与评审工作；其维护的 react-native-skia 与 flash-list 将移交新维护方，restyle 计划 2026 年底归档。
    event_summary_en: On September 10, 2026, Shopify published a blog post announcing that its mobile
      apps are moving from React Native back to separate Swift and Kotlin codebases, citing AI coding
      agents now handling enough of the dual-platform implementation, translation, testing, and review
      work; its react-native-skia and flash-list libraries will move to new maintainers, and restyle will
      be archived at the end of 2026.
    open_source: false
    summary_zh: 2026 年 9 月 10 日，Shopify 宣布移动应用从 React Native 迁回 Swift 与 Kotlin 双原生代码库：2020 年选跨平台是为了避免同一功能做两遍，如今其判断是
      AI 编程代理已能完成足够多的双端实现、翻译、测试与评审，双代码库的维护成本不再一票否决。这直接冲击跨端框架「省一遍人力」的核心卖点（推断；仅一家公司的决策，不代表行业已全面转向）；同时 react-native-skia、flash-list
      将移交新维护方，restyle 定于 2026 年底归档，React Native 生态维护格局出现具体变动。
    summary_en: On September 10, 2026, Shopify announced it is moving its mobile apps from React Native
      back to separate Swift and Kotlin codebases. It adopted React Native in 2020 to avoid building the
      same features twice; it now judges that AI coding agents can handle enough of the implementation,
      translation, testing, and review work that maintaining two codebases is no longer the deciding factor.
      This attacks the core pitch of cross-platform frameworks—saving one copy of the labor (inference;
      one company's decision does not mean the industry has flipped). Its react-native-skia and flash-list
      libraries move to new maintainers, and restyle will be archived by end of 2026.
