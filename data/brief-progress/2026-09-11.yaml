        job_en: A product designer moving interface mockups toward delivery works on screens and components
          previously assembled by hand in traditional design tools, aiming to get from mockup to a deliverable
          interface.
        pain_zh: 候选资料未提供任何用户痛点、抱怨或旧流程耗时描述，无法确认哪一步让人难受。
        pain_en: The candidate material provides no user pain, complaint or time cost from the old workflow,
          so which step hurts cannot be confirmed.
