  chert:
    slug: chert
    name: Chert
    decision: watching
    event_summary_zh: 2026 年 9 月 9 日至 10 日间，Chert 以“FaceTime 版 Vapi”的定位出现在产品发布与社区讨论中，同期有报道称 AI 代理正在向公共服务大量提交新请求。
    event_summary_en: Between September 9 and 10, 2026, Chert appeared in product launches and community
      discussion positioned as 'Vapi for FaceTime', while a report noted AI agents are flooding public
      services with new requests.
    category: AI + 开发
    project_type: new_application
    industries:
    - 公共服务
    - 客户服务
    - 软件
    industries_en:
    - Public Services
    - Customer Service
    - Software
    jobs:
    - 应用开发者
    - 客服自动化负责人
    - 公共服务运营人员
    jobs_en:
    - Application developer
    - Customer service automation lead
    - Public service operations staff
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 面向需要把视频通话变成可编程接口的开发者：他们原本要自行搭建音视频采集与对话编排，Chert 让开发者用少量代码接入 AI 视频代理，在通话中接收画面与语音并生成回应，最终交付可嵌入应用的视频代理能力；具体流程与交付仍待核验。
    inspiration: 视频通话正在被当作可编程接口，趋势是实时音视频从会议工具变成代理入口。切入可放在远程核验、远程问诊或政务视频窗口这类需要身份与画面确认的环节，按通话次数或核验结果收费，而不是再做一个通用视频代理框架。
    summary_en: 'For developers who need to turn video calls into a programmable interface: instead of
      building audio-video capture and dialogue orchestration themselves, Chert lets them add AI video
      agents with a few lines of code, receiving video and speech during a call and generating responses.
      The deliverable is an embeddable video agent capability; the exact flow and delivery remain unverified.'
    inspiration_en: Video calls are being treated as a programmable interface, with real-time audio-video
      moving from meeting tool to agent entry point. The opening is remote verification, telemedicine
      or government video counters where identity and visual confirmation matter, charging per call or
      per verified outcome rather than building another generic video agent framework.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 应用开发者在需要让 AI 参与视频通话时，处理实时画面与语音流，要完成可编程的视频代理接入。
        job_en: An application developer who needs AI to take part in video calls handles live video and
          audio streams to deliver a programmable video agent integration.
        pain_zh: 视频通话的实时音视频链路与对话编排需要自行搭建，接入门槛高，难以快速验证场景。
        pain_en: The real-time audio-video pipeline and dialogue orchestration for video calls must be
          built in-house, raising the integration barrier and slowing scenario validation.
        current_alternative_zh: 开发者通常用通用实时音视频 SDK 自行拼接，或干脆放弃视频形态只做语音与文字代理。
        current_alternative_en: Developers usually stitch together general real-time audio-video SDKs
          themselves, or drop video entirely and build only voice and text agents.
        usage_reason_zh: 推断：相较自行拼接音视频 SDK，Chert 把视频代理封装成少量代码即可调用的接口，减少实时链路搭建这一步，因此需要快速验证视频场景的开发者会先试用；公开材料未提供留存或付费证据。
        usage_reason_en: 'Inference: compared with assembling audio-video SDKs, Chert wraps video agents
          into an interface callable with a few lines of code, removing the real-time pipeline build step,
          so developers validating video scenarios quickly would try it first; public materials show no
          retention or payment evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决把 AI 接入视频通话的需求，痛点是实时音视频链路自建成本高，属于可识别的工程刚需。
        evidence_ids:
        - ev-ad3bf338cfc8bb58
        - ev-31e172e6c2715561
      - gate: consensus
        status: insufficient
        reason: 社区讨论有一定热度，但缺少开发者采用规模或客户案例，共识强度无法确认。
        evidence_ids:
        - ev-ad3bf338cfc8bb58
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与买方，按调用量或按席位收费均为推断，尚未核验。
        evidence_ids:
        - ev-ad3bf338cfc8bb58
      - gate: truth
        status: insufficient
        reason: 视频代理的交付确定性、身份核验与人工边界无公开材料支持，无法核对。
        evidence_ids:
        - ev-31e172e6c2715561
      next_validation: 收集 Chert 官方文档与定价页，核验其接入方式、计费单位与已公开的使用案例。
