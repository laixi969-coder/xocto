    event_summary_zh: Anthropic 于2026年9月10日发布 anthropic-sdk-python v1.5.0：为 Managed Agents 新增 auto 模式工具权限与
      content_too_large web_fetch 错误码，支持在 Managed Agents 会话中免授权令牌挂载公开代码仓库，新增 Message.to_param() 与 BetaMessage.to_param()，并允许在
      messages.create、parse、stream、count_tokens 中直接传入工具对象，同时包含凭证安全与错误处理等多项修复。
    event_summary_en: Anthropic released anthropic-sdk-python v1.5.0 on September 10, 2026, adding auto
      mode tool permissions for Managed Agents, a content_too_large web_fetch error code, support for
      mounting public code repositories without an authorization token in Managed Agents sessions, Message.to_param()
      and BetaMessage.to_param(), and direct tool objects in messages.create, parse, stream, and count_tokens,
      alongside credential-security and error-handling fixes.
  any-nix-package-live-in-your-browser:
