    name: OpenAI
    decision: market_context
    event_summary_zh: 本次新增事实：OpenAI 于 2026 年 9 月 8 日公布一份由其未发布模型生成的纳维–斯托克斯千禧年大奖问题解答，附书面论证与 Lean 形式化证明；NYU
      数学教授 Tristan Buckmaster 随即对涉及其与现供职 Anthropic 的数学家 Levent Alpöge 的合作提出不当行为指控，本材料未显示独立验证结论。
    event_summary_en: 'New fact in this event: On September 8, 2026, OpenAI published an AI-generated
      resolution to the Navier–Stokes Millennium Prize Problem produced by an unreleased model, including
      a writeup and a formal proof in Lean; NYU mathematics professor Tristan Buckmaster promptly raised
      misconduct accusations concerning his collaboration with mathematician Levent Alpöge, now at Anthropic.
      This material shows no independent verification.'
    open_source: false
    summary_zh: 2026 年 9 月 8 日，OpenAI 公布一份由其未发布模型生成的纳维–斯托克斯千禧年大奖问题解答，含论证文章和 Lean 形式化证明，NYU 教授 Tristan
      Buckmaster 随即指控相关合作存在不当行为，材料未显示独立验证结论。对 AI 应用而言，这表明前沿模型开始产出附机器可查证明的研究级数学结果（推断：形式化验证环节在可信 AI 交付中的分量可能上升）；单次发布不能推断数学研究行业已整体转向
      AI 协作。
    summary_en: 'On September 8, 2026, OpenAI published an AI-generated resolution to the Navier–Stokes
      Millennium Prize Problem from an unreleased model, with a writeup and a formal proof in Lean; NYU
      professor Tristan Buckmaster promptly accused collaborators of misconduct, and this material shows
      no independent verification. For AI applications, this shows frontier models beginning to produce
      research-grade mathematical results with machine-checkable proofs (inferred: formal verification
      may carry more weight in trustworthy AI delivery); a single release does not imply mathematical
      research as a whole has shifted to AI collaboration.'
