    event_summary_zh: 2026年8月26日发布的开源项目，通过 MCP 加 Chrome 扩展让 Claude Code、Codex、Cursor、Gemini CLI 等 agent
      直接操控用户本机已登录的 Chrome；仓库星标从156增至171。
    event_summary_en: An open-source project published on 2026-08-26 that uses MCP plus a Chrome extension
      to let agents such as Claude Code, Codex, Cursor and Gemini CLI drive the user's own logged-in Chrome;
      repository stars rose from 156 to 171.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与互联网服务
    - 专业服务
    industries_en:
    - Software and internet services
    - Professional services
