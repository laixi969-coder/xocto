        reason: 它解决医生在时间压力下快速获取可核对循证依据的需求，痛点刚性且旧流程明确为手动检索文献库。
        evidence_ids:
        - ev-4834c91d28be53ee
      - gate: consensus
        status: insufficient
        reason: 仅见其被列入一份行业榜单，属关注度信号，不能说明医生群体的持续采用。
        evidence_ids:
        - ev-4834c91d28be53ee
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与买方结构，医院采购还是个人订阅属判断而非已验证事实。
        evidence_ids:
