      session logs into a day-level view of work, including every prompt and commit; it ships as a single
      Go binary that runs locally and sends no data anywhere.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
