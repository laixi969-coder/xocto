  cartesia:
    slug: cartesia
    name: Cartesia
    decision: watching
    event_summary_zh: 2026 年 8 月 31 日，Cartesia 被列入 Madrona 2026 Intelligent Applications 40 的 Enabler
      阶段名单，该名单描述其为在底层提供实时语音模型，与 Wispr Flow、ElevenLabs、HeyGen 同处语音与视频生成赛道。
    event_summary_en: On August 31, 2026, Cartesia was named to Madrona's 2026 Intelligent Applications
      40 in the Enabler stage, described as powering real-time speech models under the hood alongside
      Wispr Flow, ElevenLabs and HeyGen in voice and video generation.
    category: 基础层
    project_type: new_application
    industries:
    - 客户服务
    - 媒体与娱乐
    - 软件
    industries_en:
    - Customer Service
    - Media & Entertainment
    - Software
    jobs:
    - 语音应用开发者
    - 客服产品负责人
    - 内容制作团队
    jobs_en:
    - Voice application developer
    - Customer service product lead
    - Content production team
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 面向需要把语音交互嵌入自己产品的开发团队：他们原本要自行拼接语音识别、合成与对话编排，Cartesia 提供实时语音模型接口，让开发者把语音输入转成可实时回应的语音输出，最终交付的是可接入的语音能力，具体延迟、定价与人工复核环节仍待核验。
    inspiration: 语音正在从“录音转文字”变成实时对话的底层能力，趋势是模型层被少数供应商收拢。切入不在再造一个语音模型，而在客服、教育、无障碍等具体场景里，把实时语音接到已有工单、课程或呼叫流程上，按通话时长或解决量收费。
    summary_en: 'For development teams embedding voice interaction into their own products: instead of
      stitching together speech recognition, synthesis and dialogue orchestration, Cartesia offers real-time
      speech model interfaces so developers can turn voice input into spoken responses in real time. The
      deliverable is an integrable voice capability; latency, pricing and human review steps remain unverified.'
    inspiration_en: Voice is shifting from transcription into a real-time conversational layer, and the
      trend is consolidation of that layer among a few model suppliers. The opening is not another speech
      model but wiring real-time voice into existing ticketing, course or call-center workflows in customer
      service, education and accessibility, charging by call minutes or resolved cases.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 语音应用开发者或客服产品负责人在搭建需要实时语音应答的产品时，处理用户语音输入与对话状态，要完成低延迟的语音回复交付。
        job_en: A voice application developer or customer service product lead building a product that
          needs real-time spoken responses handles user voice input and dialogue state to deliver low-latency
          spoken replies.
        pain_zh: 自建语音链路要分别处理识别、合成与打断逻辑，延迟和自然度难以同时达标，调试成本高。
        pain_en: Building the voice pipeline in-house means handling recognition, synthesis and interruption
          logic separately, making it hard to hit both latency and naturalness targets while debugging
          costs stay high.
        current_alternative_zh: 团队通常自行组合多家语音 API，或直接使用 ElevenLabs 等成品语音服务，再自行拼接对话编排。
        current_alternative_en: Teams typically combine several speech APIs themselves, or use finished
          voice services such as ElevenLabs and wire dialogue orchestration on top.
        usage_reason_zh: 推断：相较自行拼接多家 API，Cartesia 把实时语音模型作为单一接口提供，减少团队在延迟调优和链路拼接上的工作量，因此需要快速上线语音交互的团队会优先试用；公开材料未给出留存或复购证据。
        usage_reason_en: 'Inference: compared with stitching multiple APIs, Cartesia exposes real-time
          speech models as a single interface, cutting the work of latency tuning and pipeline assembly,
          so teams needing to ship voice interaction quickly would try it first; public materials show
          no retention or repeat-purchase evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决的是把实时语音接入自有产品的需求，痛点是自建语音链路延迟与自然度难兼顾，属于刚性工程问题。
        evidence_ids:
        - ev-daf147da4ddbb21f
      - gate: consensus
        status: insufficient
        reason: 仅有一份行业名单收录，缺少开发者采用规模或社区讨论证据，共识强度无法判断。
        evidence_ids:
        - ev-daf147da4ddbb21f
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与买方结构，按用量或按席位收费均为推断，尚未核验。
        evidence_ids:
        - ev-daf147da4ddbb21f
      - gate: truth
        status: insufficient
        reason: 实时语音交付的确定性、延迟承诺与人工边界均无公开材料支持，无法核对。
        evidence_ids:
        - ev-daf147da4ddbb21f
      next_validation: 收集 Cartesia 官方定价页与开发者文档，核验其计费方式、延迟承诺与接入案例。
