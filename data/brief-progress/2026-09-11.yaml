        reason: 它解决 agent 生成表格结构混乱、交互缺失的问题，旧做法是人工配置组件或事后修补，结构上成立。
        evidence_ids:
        - ev-3bacd525145acabf
      - gate: consensus
        status: insufficient
        reason: 仅6点、0条评论，没有用户反馈或采用案例，无法判断是否有人真正使用。
        evidence_ids:
        - ev-3bacd525145acabf
      - gate: model
        status: insufficient
        reason: 公开材料未说明定价或买方，开源组件如何收费只是判断，不是已验证事实。
