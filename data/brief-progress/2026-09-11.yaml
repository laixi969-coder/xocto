          forcing people to rewrite sorting, paging and pivot logic.
        current_alternative_zh: 人工使用成熟表格组件库逐项配置，或让 agent 直接写表格代码后再人工修补。
        current_alternative_en: Manually configuring an established grid component library, or letting
          an agent write grid code and patching it afterwards.
        usage_reason_zh: 推断：把表格能力收敛成 agent 可调用的原语，减少了生成后重写排序与透视逻辑这一步，因此常让 agent 产出数据界面的开发者会先试；公开材料没有采用或留存证据。
        usage_reason_en: 'Inference: collapsing grid capability into agent-callable primitives removes
          the step of rewriting sorting and pivot logic after generation, so developers who routinely
          have agents produce data interfaces would try it first; public material shows no adoption or
          retention evidence.'
      gates:
