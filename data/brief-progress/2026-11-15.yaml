  floorplan:
    slug: floorplan
    name: floorplan
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 接手陌生代码库的开发者需要快速弄清模块如何连接，以便定位改动点
