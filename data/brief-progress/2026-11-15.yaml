      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，没有用户评价或社区讨论说明谁在什么场景持续使用。
        evidence_ids:
        - ev-0ac07ecbb2dab536
        - ev-3dc8382c1825a84e
      - gate: model
        status: insufficient
        reason: 开源插件，未见定价、付费或按结果收费路径，钱从哪来是判断而非已验证事实。
        evidence_ids:
        - ev-0ac07ecbb2dab536
      - gate: truth
        status: insufficient
        reason: 依赖宿主工作台，交付是否稳定、人工确认边界如何，公开材料未说明。
        evidence_ids:
        - ev-0ac07ecbb2dab536
