    summary_zh: 黑石旗下数据中心运营商 QTS 的私募债认购遇阻，发行规模缩水六成，显示 AI 数据中心融资端出现需求降温迹象；若这一变化延续，可能推高 AI 基础设施的融资成本并放缓算力扩张节奏（推断）。
