        usage_reason_zh: 相较手动逐步点击或自行搭建自动化脚本，Pinky 让桌面端 MCP 代理或手机端自身把指令下发到手机执行，并在过程中保留人工确认，减少逐步手动操作与脚本配置的负担；推断需要跨应用重复操作、又要求可控的个人用户与开发者会在这种情况下选择它。
        usage_reason_en: Compared with tapping step by step by hand or building automation scripts, Pinky
          lets a desktop MCP agent or the phone itself dispatch instructions to the phone and keeps a
          human in the loop, reducing manual step-by-step work and script setup; by inference, individuals
          and developers who repeat cross-app actions and want control would choose it in such cases.
      gates:
      - gate: value
        status: supported
        reason: 它解决手机上跨应用重复操作只能手动逐步点、且全自动代理缺少人工确认的痛点，替代手动点击与自建脚本，结构上成立，属工作流推理。
        evidence_ids:
