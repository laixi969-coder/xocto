        reason: 它解决拆解视频时逐镜头判断制作方式并整理复刻方案的需求，痛点在于人工逐帧看片慢且依赖经验，旧替代是手写分镜。
        evidence_ids:
        - ev-66287ae872b76a59
        - ev-6b98df28145b1038
      - gate: consensus
        status: insufficient
        reason: 仓库收藏数持续上升说明开发者关注度，但缺少编导或投放团队实际使用的反馈与案例，无法确认强场景。
        evidence_ids:
        - ev-2ea84cfabe48c929
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方式与买方；可能来自企业定制或按条拆解服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-2ea84cfabe48c929
      - gate: truth
        status: insufficient
        reason: 逐镜头判断制作方式的准确率与复刻建议是否可执行尚未核验，人工复核边界不清。
        evidence_ids:
        - ev-6b98df28145b1038
      next_validation: 收集该仓库 issue 与 discussion 中用户对拆解准确率和复刻方案可用性的实际反馈。
