      - gate: truth
        status: insufficient
        reason: 未见实测、误报率或部署文档，检查能否确定性交付仍待核验。
        evidence_ids:
        - ev-960f80ab2b95a06e
      next_validation: 收集该仓库 README 与 issue 中的实测示例和误报讨论，核验上线前检查的确定性。
    event_summary_zh: 2026 年 11 月初公开的 Claude Code 技能仓库，用于 AI 快速搭建应用的上线前检查；采集期内星标 65。
