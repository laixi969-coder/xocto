    - 高等教育
    industries_en:
    - academic research
    - higher education
    jobs:
    - 科研人员在写论文或做文献综述时，需要检索论文、核对出处并把笔记整理进文献库
    jobs_en:
    - Researchers searching papers, verifying citations and organizing notes into a reference library
      while writing papers or literature reviews
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 科研人员在写论文或做文献综述时，在 DeepSeek Harness 会话里打开这个插件，让它检索论文并附上出处，经人工审批后把条目导入文献库，再把笔记线索交给同会话的其他插件；最终拿到带引用的文献条目和可继续处理的笔记。具体检索来源、引用格式与交付形态仍待核验。
    inspiration: 趋势：文献检索、引用核对与笔记整理正被拆进对话式工作流，插件把“搜—核—入库”串成一步。切入：面向高校课题组和独立研究者，从文献综述这一高频环节进入，按课题或按篇收费的卖法可探索，价格未披露。
    summary_en: While writing a paper or literature review, a researcher opens this plugin inside a DeepSeek
      Harness session; it searches papers with citations, imports approved entries into a reference library
      and hands note leads to other plugins in the same session. The user ends up with cited references
      and notes ready for further work. Search sources, citation formats and delivery details still need
      verification.
    inspiration_en: 'Trend: literature search, citation checking and note organization are being pulled
      into conversational workflows, with one plugin chaining search, verification and library import.
      Entry: target university labs and independent researchers at the literature-review step; per-project
      or per-paper pricing is possible but undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 科研人员在写论文或做文献综述时，需要检索相关论文、核对出处，并把有用条目和笔记整理进自己的文献库。
        job_en: Researchers writing papers or literature reviews need to find relevant papers, verify
          citations and file useful entries and notes into their own reference library.
        pain_zh: 检索、核对引用和手工录入文献库分散在多个工具里，重复搬运容易漏引或错引；这是工作流推理，公开材料未给出用户抱怨。
        pain_en: Searching, checking citations and manually entering references are split across tools,
          and repeated copying risks missing or wrong citations; this is workflow inference, not documented
          user complaints.
        current_alternative_zh: 用通用搜索引擎或学术数据库检索，再手工把条目录入 Zotero、EndNote 等文献管理软件，并自行核对出处。
        current_alternative_en: Searching via general search engines or academic databases, then manually
          entering entries into Zotero, EndNote or similar reference managers and checking sources by
          hand.
        usage_reason_zh: 推断：插件在对话会话内直接完成检索并附带出处，经审批后导入文献库，省去在检索页与文献管理软件之间复制粘贴和逐条核对出处的一步，因此常做文献综述的研究者会在会话中直接调用它。
        usage_reason_en: 'Inference: the plugin searches with citations inside the chat session and imports
          approved entries into the library, removing the copy-paste and manual source-checking step between
          search pages and reference managers, so researchers doing frequent literature reviews would
          call it in-session.'
      gates:
      - gate: value
        status: supported
        reason: 它解决文献检索、出处核对与入库分散的问题，痛点具体且交付可确定；但公开材料未给出用户抱怨或采用证据。
        evidence_ids:
        - ev-6fc27bac620287a9
        - ev-32fb2299b29e19c0
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从163增至220的关注度信号，没有用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-6fc27bac620287a9
        - ev-32fb2299b29e19c0
      - gate: model
        status: insufficient
        reason: 未披露定价、付费方或采购路径；研究者个人订阅或机构采购均属推断，不是已验证事实。
        evidence_ids:
        - ev-6fc27bac620287a9
      - gate: truth
        status: insufficient
        reason: 检索来源、引用准确性与审批入库的确定性交付尚未核验，也未看到留存或重复使用证据。
        evidence_ids:
        - ev-6fc27bac620287a9
        - ev-32fb2299b29e19c0
      next_validation: 收集该插件官方文档或仓库 README 中关于检索数据源、引用格式与审批入库流程的说明，以核验交付是否确定。
