  ainews-the-no-ai-slop-manifesto:
    slug: ainews-the-no-ai-slop-manifesto
    name: The No AI Slop Manifesto
    decision: market_context
    summary_zh: 2026年11月，在AIE CODE会议闭幕演讲中提出并由多位演讲者联署的《No AI Slop Manifesto》公开发布，同期llama.cpp与ggml发布1.0并移除35个废弃函数，SGLang也在峰会上宣布1.0。该宣言为团队讨论AI生成内容质量提供了工具，开源推理栈进入稳定版本则降低了自托管部署的不确定性；但材料未给出采用规模或成本数据，对行业整体影响仍属推断。
    summary_en: In November 2026, the No AI Slop Manifesto was published after being introduced in an
      AIE CODE closing keynote and cosigned by many speakers; in the same period llama.cpp and ggml reached
      1.0 with 35 deprecated functions removed from the public header, and SGLang announced 1.0 at its
      summit. The manifesto offers a discussion tool for teams on AI-generated content quality, while
      stable 1.0 releases of open-source inference stacks reduce uncertainty for self-hosted deployment;
      the material provides no adoption-scale or cost data, so broader industry impact remains inference.
    event_summary_zh: 《No AI Slop Manifesto》在AIE CODE闭幕演讲中提出并获多位演讲者联署公开发布；同期llama.cpp与ggml发布1.0并移除35个废弃函数，SGLang宣布1.0。
    event_summary_en: The No AI Slop Manifesto was introduced in an AIE CODE closing keynote and published
      with cosignatures from many speakers; meanwhile llama.cpp and ggml reached 1.0 with 35 deprecated
      functions removed, and SGLang announced 1.0.
