    name: 豆包工作
    decision: watching
    event_summary_zh: 2026年9月，飞书发布8.0版并与豆包工作原生融合，飞书CEO谢欣称把智能体当作“一等公民”；同期有报道称豆包工作上线，办公场景出现独立客户端趋势。具体功能边界、定价与客户采用情况未在候选材料中披露。
