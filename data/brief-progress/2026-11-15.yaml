  artificialanalysis:
    slug: artificialanalysis
    name: Artificial Analysis
    decision: queued
    event_summary_zh: 2026年10月28日，Artificial Analysis 发布 Intelligence Index v5；10月29日，Gemini 4 Carbon
      在该指数上排名第一；11月9日，Claude Fable 5.2 以 65 分成为该指数迄今最高分。
    event_summary_en: On 28 October 2026, Artificial Analysis released Intelligence Index v5; on 29 October,
      Gemini 4 Carbon ranked first on that index; on 9 November, Claude Fable 5.2 scored 65, the highest
      so far on the index.
    category: 基础层
    project_type: new_application
    industries:
    - 软件与信息服务
    - 企业采购
    - 投资研究
    industries_en:
    - Software and IT services
    - Corporate procurement
    - Investment research
    jobs:
    - 模型选型负责人或技术采购人员在评估多家模型供应商时，需要把候选模型放到统一口径下比较，以决定采购或集成哪一个
    - AI 产品团队在发布前需要判断所选模型在自身任务上的相对表现，以决定是否更换模型或调整成本结构
    jobs_en:
    - Model selection leads or technical buyers comparing multiple model vendors under a common yardstick
      to decide which to procure or integrate
    - AI product teams judging how candidate models perform on their own tasks before launch, to decide
      whether to switch models or change cost structure
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 模型选型负责人或技术采购人员在比较多家模型供应商时，打开 Artificial Analysis 查看统一口径的模型评分与排名；它接收模型评测结果并汇总成指数与榜单，用户拿到可横向比较的分数和名次，用于采购或集成决策。其自定义评测工具
      Optima 的具体流程与交付仍待核验。
    inspiration: 趋势：模型数量与版本迭代加快，买方越来越需要一个跨厂商的统一比较口径，而不是各家自报的跑分。切入：从有采购决策权的企业 AI 平台团队或投资机构入手，卖可复现的私有任务评测报告而非公开榜单；公开材料未披露其定价与客户，具体卖法仍待核验。
    summary_en: Model selection leads or technical buyers comparing multiple model vendors open Artificial
      Analysis to view model scores and rankings under a common yardstick; it takes evaluation results
      and aggregates them into an index and leaderboard, giving users comparable scores and ranks for
      procurement or integration decisions. The workflow and deliverables of its custom-benchmark tool
      Optima remain unverified.
    inspiration_en: 'Trend: as model count and version churn accelerate, buyers increasingly need a cross-vendor
      common yardstick rather than vendor-reported scores. Entry: start with enterprise AI platform teams
      or investment firms that hold procurement decisions, selling reproducible private-task evaluation
      reports rather than a public leaderboard; its pricing and customers are not disclosed, so the selling
      model remains unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 模型选型负责人或技术采购人员在评估多家模型供应商时，需要把候选模型放到统一口径下比较，以决定采购或集成哪一个。
        job_en: Model selection leads or technical buyers comparing multiple model vendors need a common
          yardstick to decide which to procure or integrate.
        pain_zh: 各家模型自报跑分口径不一，买方难以判断哪个模型在自己的任务上更合适，选错会带来集成返工和成本浪费。
        pain_en: Vendors report scores on inconsistent bases, so buyers struggle to judge which model
          fits their own tasks; a wrong pick means rework and wasted cost.
        current_alternative_zh: 买方通常依赖厂商自报的基准、零散的第三方评测文章或内部临时测试来比较模型。
        current_alternative_en: Buyers typically rely on vendor-reported benchmarks, scattered third-party
          evaluation write-ups, or ad hoc internal tests to compare models.
        usage_reason_zh: 推断：相较厂商自报跑分和零散评测，它把多个模型放到同一指数与榜单口径下，减少买方自行拼接口径的那一步，因此有采购决策权的团队会在选型阶段查看它；公开材料未提供其付费或留存证据。
        usage_reason_en: 'Inference: compared with vendor-reported scores and scattered evaluations, it
          places multiple models under one index and leaderboard, removing the step of reconciling inconsistent
          bases, so teams with procurement decisions consult it during selection; public materials provide
          no payment or retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决买方在多家模型间缺少统一比较口径的问题，痛点在于选错模型的返工与成本，旧做法是依赖厂商自报跑分。
        evidence_ids:
        - ev-f21ad2839c01ec8f
        - ev-08610498cc06a990
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度较高，但公开材料未显示企业采购方已把它作为标准选型依据。
        evidence_ids:
        - ev-08610498cc06a990
      - gate: model
        status: insufficient
        reason: 未披露定价、客户或付费路径；买方可能是企业采购或投资机构，这是判断而非已验证事实。
        evidence_ids:
        - ev-f21ad2839c01ec8f
      - gate: truth
        status: insufficient
        reason: 指数版本迭代与榜首更替显示评测口径仍在变动，其评分能否稳定对应真实任务表现尚缺独立核验。
        evidence_ids:
        - ev-747d4fca34723fa0
        - ev-eea56632755da0e1
      next_validation: 收集 Artificial Analysis 官方定价页或其 Optima 自定义评测的产品文档，确认其是否提供付费的企业级评测服务及交付形式。
  aula:
    slug: aula
    name: aula
    decision: watching
    event_summary_zh: 开源仓库 aula 于 2026-10-28 发布，可将笔记、幻灯片、录音和往年试题或一个主题转成课程，并配本地 AI 导师练习；仓库星标从 43 增至 56，仍属早期信号。
    event_summary_en: The open-source repository aula was published on 2026-10-28, turning notes, slides,
      recordings and past exams or a topic into a course with a local AI tutor; repository stars rose
      from 43 to 56, still an early signal.
    category: AI + 效率
    project_type: open_source
    industries:
    - 教育
    industries_en:
    - Education
    jobs:
    - 学生或自学者在备考时把课堂笔记、幻灯片和往年试题整理成可练习的课程与模拟题
    jobs_en:
    - Students or self-learners preparing for exams turn class notes, slides and past exams into practice
      courses and mock tests
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 备考的学生或自学者打开它，把已有的课堂笔记、幻灯片、录音和往年试题（或只给一个主题）交给它，它生成带图表和 3D 的课程、随答随判的练习、闪卡和模拟考试，AI 导师在本地运行；用户拿到一套可自测的学习材料，具体生成质量与判分准确性仍待核验。
    inspiration: 趋势：学习材料正从“人整理、人出题”转向由个人资料直接生成可练习的课程。切入：从医学院、资格考试、语言考试这类有大量往年真题和固定考纲的人群进入，按科目或按套模拟卷收费，而不是做面向所有人的通用学习助手。
    summary_en: A student or self-learner preparing for exams opens it, feeds in existing class notes,
      slides, recordings and past exams (or just a topic), and it generates lessons with figures and 3D,
      exercises checked as you answer, flashcards and mock exams, with the AI tutor running locally; the
      user gets a self-testable study set, while generation quality and grading accuracy remain to be
      verified.
    inspiration_en: 'Trend: study material is shifting from hand-organized notes and hand-written questions
      to practice courses generated directly from personal materials. Entry: start with medical, professional-licensing
      or language-exam candidates who have large past-paper sets and fixed syllabi, charging per subject
      or per mock-exam set rather than building a general study assistant for everyone.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 备考的学生或自学者在复习阶段，把课堂笔记、幻灯片、录音和往年试题整理成可反复练习的课程、闪卡和模拟卷，以完成自测和查漏。
        job_en: Students or self-learners in the revision phase turn class notes, slides, recordings and
          past exams into repeatable courses, flashcards and mock papers to self-test and find gaps.
        pain_zh: 整理笔记、出练习题和做模拟卷通常要手工完成，耗时且难以覆盖全部考点；现有通用聊天工具需要用户自己拆题、自己判分。
        pain_en: Organizing notes, writing practice questions and assembling mock papers is usually manual,
          slow and hard to cover all exam points; general chat tools require users to split questions
          and grade themselves.
        current_alternative_zh: 手工整理笔记、用题库或往年真题刷题、用通用聊天工具临时提问，或购买付费课程和题库。
        current_alternative_en: Hand-organizing notes, drilling with question banks or past papers, asking
          general chat tools ad hoc, or buying paid courses and question banks.
        usage_reason_zh: 推断：它把“整理资料—出题—判分”合并成一次输入后的连续动作，用户不必再逐题搬运和自评，因此在手头已有大量个人资料、需要成体系自测时会选择它；是否长期留在复习流程中缺少留存证据。
        usage_reason_en: 'Inference: it merges organizing materials, writing questions and grading into
          one continuous action after a single input, so users need not move questions one by one or self-grade;
          they would choose it when holding large personal materials and needing systematic self-testing,
          though retention evidence is missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决备考者整理资料、出题和自测的负担，旧做法是手工整理与刷题库，痛点具体且交付可核对。
        evidence_ids:
        - ev-7696fccde43bd8fa
        - ev-3830b0767ccc1f3e
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标从 43 增至 56，属关注度信号，缺少用户评价或使用反馈说明场景是否成立。
        evidence_ids:
        - ev-7696fccde43bd8fa
        - ev-3830b0767ccc1f3e
      - gate: model
        status: insufficient
        reason: 项目免费开源，未见定价或付费路径，买方与收入模式只能推断，不能视为已验证。
        evidence_ids:
        - ev-3830b0767ccc1f3e
      - gate: truth
        status: insufficient
        reason: 本地运行与随答判分是承诺，但生成课程与判分的准确性、人工复核边界缺少公开材料。
        evidence_ids:
        - ev-7696fccde43bd8fa
      next_validation: 收集该仓库的 issue 与讨论，查看用户对生成课程质量和判分准确性的实际反馈。
  auto-ontology-mcp:
    slug: auto-ontology-mcp
    name: auto-ontology-mcp
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 开发者把个人知识库接入 Claude、ChatGPT 等 MCP 客户端，让助手在回答时调用已有笔记与语义层
    - 开发者把 NVIDIA Auto Ontology 的语义层封装为 MCP 服务，供支持 MCP 的助手读取
    jobs_en:
    - Developers connect a personal knowledge base to MCP clients such as Claude and ChatGPT so the assistant
      can call existing notes and a semantic layer when answering
    - Developers wrap NVIDIA Auto Ontology's semantic layer as an MCP service for MCP-capable assistants
      to read
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在把个人知识库和 NVIDIA Auto Ontology 的语义层接入 Claude、ChatGPT 等 MCP 客户端时打开它：它把知识库与语义层封装成 MCP
      服务，让助手在回答时读取这些内容，且无需 LLM API key。用户最终拿到的是可被 MCP 客户端调用的知识接口；具体检索质量、权限边界与交付形态仍待核验。
    inspiration: 趋势：个人知识库正从独立笔记应用变成助手可调用的语义接口，MCP 成为接入层。切入：面向已有大量笔记或内部术语表的团队，把行业术语、客户档案做成可被助手读取的语义层，按接入的知识库或席位收费；但需先确认它比直接上传文档检索多解决了哪一步。
    summary_en: 'Developers open this when connecting a personal knowledge base and NVIDIA Auto Ontology''s
      semantic layer to MCP clients such as Claude and ChatGPT: it wraps the knowledge base and semantic
      layer as an MCP service that assistants read while answering, with no LLM API key required. The
      deliverable is a knowledge interface callable by MCP clients; retrieval quality, permission boundaries
      and delivery form still need verification.'
    inspiration_en: 'Trend: personal knowledge bases are shifting from standalone note apps into semantic
      interfaces that assistants can call, with MCP as the access layer. Entry: target teams with large
      note collections or internal glossaries, package industry terms and customer profiles as an assistant-readable
      semantic layer, and charge per connected knowledge base or seat; first confirm what step it saves
      beyond uploading documents for retrieval.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或知识工作者把已有笔记、术语表和 NVIDIA Auto Ontology 语义层接入 Claude、ChatGPT 等 MCP 客户端，让助手回答时能调用这些内容。
        job_en: Developers or knowledge workers connect existing notes, glossaries and NVIDIA Auto Ontology's
          semantic layer to MCP clients such as Claude and ChatGPT so assistants can call that content
          when answering.
        pain_zh: 助手默认不了解个人或团队的私有知识与术语，每次对话都要重新粘贴材料，长文档检索也难保证术语一致。
        pain_en: Assistants do not know personal or team private knowledge and terminology by default,
          so users re-paste material each session and long-document retrieval rarely keeps terms consistent.
        current_alternative_zh: 手动把文档粘贴进对话、上传文件让助手临时检索，或自建向量检索脚本再接入助手。
        current_alternative_en: Manually pasting documents into chats, uploading files for temporary retrieval,
          or building a custom vector-search script and wiring it to the assistant.
        usage_reason_zh: 推断：相较每次粘贴或临时上传，它把知识库与语义层一次性封装成 MCP 服务，助手在对话中直接调用，省去重复搬运材料这一步；需要跨会话复用私有知识的开发者会因此选择它。
        usage_reason_en: 'Inference: instead of pasting or uploading each time, it wraps the knowledge
          base and semantic layer once as an MCP service that assistants call during conversation, removing
          the repeated material-shuttling step; developers who need to reuse private knowledge across
          sessions would choose it for this.'
      gates:
      - gate: value
