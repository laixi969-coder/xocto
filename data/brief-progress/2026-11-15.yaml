  sedimem:
    slug: sedimem
    name: sedimem
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用多个编码代理的开发者，在跨会话继续同一项目时，需要把此前结论、约束和冲突记录整理成可复用记忆，避免重复交代背景
    jobs_en:
    - Developers using multiple coding agents who resume the same project across sessions need prior conclusions,
      constraints and conflicting notes consolidated into reusable memory instead of re-explaining context
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex CLI 等编码代理的开发者，在跨会话继续同一项目时，会打开 sedimem，把此前对话中产生的结论、约束与冲突记录写入一份只追加的本地记忆层，由代理按写入规则去重、标记冲突并裁决过时条目；用户最终得到可供多个代理共用的记忆文件，具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：编码代理从单次对话走向长期项目协作，记忆的整洁与冲突处理开始成为独立环节。切入：面向同时使用多个编码代理的小型开发团队，从“跨会话上下文交接”这一具体节点进入，可按团队或项目提供记忆治理与审计服务；公开材料尚未披露定价与付费路径。
    summary_en: Developers using coding agents such as Claude Code and Codex CLI open sedimem when resuming
      a project across sessions, writing conclusions, constraints and conflicting notes from earlier conversations
      into an append-only local memory layer; the agent applies write rules to deduplicate, flag conflicts
      and adjudicate stale entries. The user ends up with a memory file shared across agents, though the
      exact delivery form and human confirmation step still need verification.
    inspiration_en: 'Trend: coding agents are moving from one-off chats to long-running project collaboration,
      making memory hygiene and conflict handling a separate step. Entry: target small dev teams using
      several coding agents at once, starting from the cross-session context handoff, and sell memory
      governance or audit per team or project; public materials do not yet disclose pricing or a payment
      path.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用多个编码代理的开发者，在跨会话继续同一项目时，需要把此前结论、约束和冲突记录整理成可复用记忆，避免重复交代背景。
        job_en: Developers using multiple coding agents who resume the same project across sessions need
          prior conclusions, constraints and conflicting notes consolidated into reusable memory instead
          of re-explaining context.
        pain_zh: 多个代理各自保存上下文，容易产生重复、冲突和过时条目，开发者每次续接都要重新核对哪条结论仍然有效。
        pain_en: Each agent keeps its own context, producing duplicates, conflicts and stale entries,
          so developers must re-check which conclusions still hold every time they resume.
        current_alternative_zh: 旧做法是手动维护项目说明文件、在每次对话里重新粘贴背景，或依赖单个代理自带的会话记忆。
        current_alternative_en: The old approach is manually maintaining project notes, re-pasting context
          in each conversation, or relying on a single agent's built-in session memory.
        usage_reason_zh: 推断：sedimem 通过只追加的真相层与写入卫生规则，在写入时就去重和标记冲突，减少开发者每次续接时人工比对多条记忆的步骤，因此同时使用多个编码代理、项目周期较长的开发者会考虑它。
        usage_reason_en: 'Inference: sedimem uses an append-only truth layer and write-hygiene rules to
          deduplicate and flag conflicts at write time, cutting the manual step of comparing multiple
          memory entries on each resume, so developers running several coding agents on longer projects
          would consider it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理跨会话时记忆重复、冲突与过时的问题，痛点具体且旧替代是手工维护说明文件；买方尚不清晰。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
        - ev-6323a1f4f6d5faa7
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 64 增至 88 的关注度信号，没有用户评价或采用案例说明开发者已把它放进工作流。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
        - ev-6323a1f4f6d5faa7
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或商业交付路径，钱可能来自团队订阅或托管服务，属判断而非已验证事实。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
      - gate: truth
        status: insufficient
        reason: 记忆裁决由代理自动完成，公开材料未说明冲突裁决出错时的人工复核边界与安全约束。
        evidence_ids:
        - ev-d4b3f0604b1b6ada
      next_validation: 收集 sedimem 仓库的 issue 与 discussion，查看开发者是否报告跨会话复用、冲突裁决结果及重复使用情况。
