    summary_zh: 3D 美术或手办制作者手上只有一张参考图时，打开这个开源工具，它按该图配准多个视角并做贴图拟合，在 Blender 中重放生成可对照原图测量的立体雕塑；最终交付是可在 Blender
      里继续编辑的模型，比例是否准确仍需人工核对。
    inspiration: 趋势：单图到可测量三维模型的门槛正在下降，3D 内容生产的前段从手工建模转向图像驱动。切入：面向手办、桌游模型和电商 3D 展示的小工作室，按件交付可打印模型，而不是卖建模软件席位；价格未披露，需自行定价。
