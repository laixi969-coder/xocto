  friday-2:
    slug: friday-2
    name: friday
    decision: watching
    event_summary_zh: 2026年10月26日公开的开源项目 friday 在约三周内仓库星标从57增至65，提供让 Claude Code、Codex、Cursor 等编码代理在同一共享看板上分工并互相检查的本地多代理协作方式。
    event_summary_en: The open-source project friday, published on 2026-10-26, grew its repository stars
      from 57 to 65 in about three weeks, offering a local multi-agent setup where Claude Code, Codex,
      Cursor and others split work on a shared board and check each other's output.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用多个编码代理的开发者，在并行处理同一代码库的多项任务时，需要让各代理分工、互查并汇总结果
    jobs_en:
    - Developers running multiple coding agents who need to split, cross-check and consolidate work across
      parallel tasks in one codebase
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用多个编码代理的开发者，在同时推进同一代码库的多项任务时打开 friday，它让 Claude Code、Codex、Cursor 等代理在共享看板上分工，各自在独立 git
      worktree 中执行并互相检查，最终由开发者拿到汇总后的改动并自行确认合并。具体协作流程与交付质量仍待核验。
    inspiration: 趋势是编码代理从单次对话走向多代理并行，协调与互查本身成为新环节。切入可面向需要并行改多个模块的小型工程团队，卖的是任务分派与结果核对，而非又一个编码模型；开源免费意味着收费点须落在托管、审计或团队协作上。
    summary_en: When developers run several coding agents on one codebase, friday lets Claude Code, Codex,
      Cursor and others split work on a shared board, each executing in its own git worktree and checking
      each other's output, so the developer receives consolidated changes to confirm and merge. The concrete
      workflow and delivery quality still need verification.
    inspiration_en: The trend is coding agents moving from single chats to parallel multi-agent work,
      making coordination and cross-checking a new step. The opening is small engineering teams that need
      to change several modules at once, selling task dispatch and result checking rather than another
      coding model; being free and open source means monetization must sit in hosting, audit or team collaboration.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用多个编码代理的开发者，在并行处理同一代码库的多项任务时，需要让各代理分工、互查并汇总结果。
        job_en: Developers running multiple coding agents who need to split, cross-check and consolidate
          work across parallel tasks in one codebase.
        pain_zh: 多个代理各自在终端里跑，改动容易冲突，谁做了什么、是否互相覆盖需要人工比对，合并前缺少统一的核对环节。
        pain_en: Multiple agents run in separate terminals, changes easily conflict, and tracking who
          did what or whether work was overwritten requires manual comparison, with no unified check before
          merging.
        current_alternative_zh: 开发者手动开多个终端或窗口，逐个复制任务、人工比对 diff 并自行合并。
        current_alternative_en: Developers manually open several terminals or windows, paste tasks one
          by one, compare diffs by hand and merge themselves.
        usage_reason_zh: 推断：friday 把任务分派到共享看板，并让每个代理在独立 git worktree 中执行、互相检查，减少开发者逐个切换终端和人工比对冲突的步骤，因此并行改多个模块的开发者会在任务量上升时选择它。
        usage_reason_en: 'Inference: friday dispatches tasks on a shared board and has each agent work
          in its own git worktree and check the others, cutting the steps of switching terminals and manually
          comparing conflicts, so developers changing several modules in parallel would pick it as task
          volume grows.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时的分工、冲突与互查问题，旧做法是人工开多终端比对 diff，痛点具体且不解决的代价是合并出错。
        evidence_ids:
        - ev-b5ae833ccd8d677e
        - ev-450dfdfb267bd0ee
      - gate: consensus
        status: insufficient
