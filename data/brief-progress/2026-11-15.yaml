        job_en: Content creators or community operators writing copy, comments, or scripts for Chinese
          internet audiences encounter slang the model does not know and must look up the meaning before
          rewriting the prompt.
        pain_zh: 模型对新鲜梗和黑话只能硬猜，产出语义错位，创作者要反复人工纠正或自己搜索，增加一轮返工。
        pain_en: Models can only guess at fresh slang, producing semantic mismatches that creators must
          repeatedly correct by hand or research themselves, adding a rework round.
        current_alternative_zh: 创作者自己搜索梗义、手动在提示词里补充解释，或直接接受模型猜错后人工改写。
        current_alternative_en: Creators search slang meanings themselves, manually add explanations to
          prompts, or accept wrong guesses and rewrite by hand.
        usage_reason_zh: 相较手动搜索再补提示词，该工具用词库自动查词并注入上下文，省掉创作者逐条查义和改写提示词这一步；推断，面向高频产出中文网络内容的团队会因此选择它，但词库覆盖与准确率尚无公开验证。
        usage_reason_en: Compared with manual searching and prompt patching, the tool looks up terms automatically
          and injects definitions, removing the step of researching each term and rewriting the prompt;
          this is an inference, and teams producing Chinese internet content at high volume would choose
          it, though glossary coverage and accuracy are not publicly verified.
      gates:
      - gate: value
        status: supported
        reason: 它解决模型不认识中文新梗导致产出语义错位的问题，痛点是内容创作者要人工查义和返工；旧做法是手动搜索并补提示词。
        evidence_ids:
        - ev-6ec38c974c7797eb
        - ev-12dfe795ad51a35f
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 65 增至 80，属关注度信号，不能证明创作者已把它留在工作流；缺少用户评价或使用案例。
        evidence_ids:
        - ev-6ec38c974c7797eb
        - ev-12dfe795ad51a35f
      - gate: model
        status: insufficient
        reason: 开源项目未见定价、付费或商业交付路径；词库社区共创可能带来订阅或按量收费，但这是判断而非已验证事实。
        evidence_ids:
        - ev-12dfe795ad51a35f
      - gate: truth
        status: insufficient
        reason: 词库规模与自动注入是公开说明，但覆盖准确率、误注入风险和人工确认边界均无公开材料。
        evidence_ids:
        - ev-6ec38c974c7797eb
      next_validation: 收集该仓库的 issue、discussion 或 README 更新，核验词库覆盖范围、注入准确率与用户实际使用反馈。
