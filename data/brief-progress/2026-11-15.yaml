          directly as a voice assistant; users must find images and handle flashing and device faults
          themselves, with scattered steps and high failure risk.
        current_alternative_zh: 旧做法是放弃闲置设备、另买语音音箱，或自行拼凑零散论坛教程与上游镜像仓库。
