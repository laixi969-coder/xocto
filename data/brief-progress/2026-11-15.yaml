      agent, which reads screen content and taps on their behalf via accessibility permissions, executing
      multi-step flows by voice command; users get a sequence of executed actions, though the concrete
      workflow, delivery boundary and human confirmation step still need verification.
    inspiration_en: 'Trend: on-device phone agents are starting to operate apps directly through system
      accessibility permissions rather than only chatting. Entry: start from high-frequency repetitive
      tasks such as phone errands for elderly or visually impaired users, or bulk order handling for e-commerce
      support, charging per completed flow or by subscription; permission compliance and failure rollback
      must be confirmed first.'
