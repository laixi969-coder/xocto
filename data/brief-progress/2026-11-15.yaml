    - 三维与特效制作人员在需要由代理批量生成或驱动 3D、VFX 资产时，用 vork 作为无界面引擎执行渲染与特效任务
    jobs_en:
    - 3D and VFX artists use vork as a headless engine to run rendering and effects tasks when agents
      need to generate or drive 3D and VFX assets at scale
    regions: []
    regions_en: []
    open_source: true
    summary_zh: vork 是面向代理的无界面 3D 与 VFX 引擎，处于研究预览阶段。三维与特效制作人员在需要由代理批量驱动 3D、特效任务时接入它执行渲染与特效动作；具体输入格式、输出交付物与人工确认环节，材料未说明，具体流程或交付仍待核验。
    inspiration: 趋势：3D 与特效制作开始把渲染引擎做成可供代理调用的无界面组件，让自动化流程直接产出资产。切入：可从短剧、广告等需要大量低成本特效镜头的团队切入，按产出镜头或资产收费；材料未披露定价，属推断。
    summary_en: vork is a headless 3D and VFX engine for agents, currently a research preview. 3D and
      VFX artists plug it in when agents need to drive 3D and effects tasks at scale; the input formats,
      delivered outputs and human confirmation steps are not described, so the concrete workflow and delivery
      still need verification.
    inspiration_en: 'Trend: 3D and VFX production is turning the render engine into a headless component
      agents can call, letting automated pipelines produce assets directly. Entry: start with short-drama
      or ad teams that need many low-cost effects shots, charging per delivered shot or asset; pricing
      is not disclosed, so this is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维与特效制作人员在需要由代理批量生成或驱动 3D、VFX 资产时，用 vork 作为无界面引擎执行渲染与特效任务。
        job_en: 3D and VFX artists use vork as a headless engine to run rendering and effects tasks when
          agents need to generate or drive 3D and VFX assets at scale.
        pain_zh: 传统 3D 与特效软件依赖人工界面操作，难以被自动化代理批量调用，重复镜头制作耗时。
        pain_en: Traditional 3D and VFX software relies on manual GUI operation, is hard for automated
          agents to call at scale, and repetitive shot work is slow.
        current_alternative_zh: 制作人员手动在三维软件中建模、调特效并逐镜渲染，或自行编写脚本串联流程。
        current_alternative_en: Artists manually model, tune effects and render shot by shot in 3D software,
          or write their own scripts to chain the pipeline.
        usage_reason_zh: 推断：把引擎做成无界面、可被代理调用的组件，减少人工逐镜操作这一步；仓库星数只反映关注度，不能证明用户已长期使用。
        usage_reason_en: 'Inference: making the engine headless and callable by agents removes the step
          of manual per-shot operation; repository stars only show attention and do not prove sustained
          use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 3D 与特效制作难以被自动化代理批量调用的问题，旧做法是人工逐镜操作，痛点具体。
        evidence_ids:
        - ev-3f1b7305e5390fa8
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 324 增至 1576 只说明关注度上升，无用户评价或采用案例。
        evidence_ids:
        - ev-6e37cd456e485ef2
        - ev-3f1b7305e5390fa8
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露；买方可能是特效工作室或内容团队，属判断而非事实。
        evidence_ids:
        - ev-3f1b7305e5390fa8
      - gate: truth
        status: insufficient
        reason: 仍为研究预览，未说明输出质量、渲染确定性与人工审核边界，交付确定性无法核对。
        evidence_ids:
        - ev-3f1b7305e5390fa8
      next_validation: 收集 vork 仓库的 issue 与 discussion，核对实际输出格式、渲染确定性及是否有制作团队报告使用结果。
  yogurt-2:
    slug: yogurt-2
    name: yogurt
    decision: queued
    event_summary_zh: 2026年11月10日发布的 yogurt 以免费开源形式提供本地运行的 AI 会议记录，定位为 Granola 的替代品，支持 Mac、Windows 和 Linux；开源仓库关注度在数日内从约
      452 升至 1,498。
    event_summary_en: Released on 10 November 2026, yogurt offers free, open-source AI meeting notes that
      run locally as an alternative to Granola across Mac, Windows and Linux; repository attention rose
      from about 452 to 1,498 within days.
    category: AI + 效率
    project_type: open_source
    industries:
    - 企业通用职能
    - 专业服务
    industries_en:
    - general business functions
    - professional services
    jobs:
    - 销售或咨询顾问在客户通话后整理会议纪要与待办
    - 项目经理在跨部门会议后汇总决策与行动项
    jobs_en:
    - sales or consultants drafting meeting notes and action items after client calls
    - project managers summarizing decisions and action items after cross-team meetings
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 销售、顾问或项目经理在开完客户通话或跨部门会议后，打开 yogurt 让它在本机录制并转写会议，再生成纪要与待办；音频与文本留在本地电脑，用户拿到可编辑的会议记录，仍需自己核对关键结论。具体导出与协作流程仍待核验。
    inspiration: 趋势：会议记录正从云端 SaaS 转向本地运行、开源可自托管的形态，隐私成为选型理由。切入：可从对录音外流敏感的律所、财税与医疗咨询团队进入，卖部署与合规支持而非按席位订阅；免费开源本体不构成收费壁垒。
    summary_en: After a client call or cross-team meeting, salespeople, consultants or project managers
      open yogurt to record and transcribe locally, then generate notes and action items; audio and text
      stay on the local computer and users get an editable record they still must check for key conclusions.
      Export and collaboration flows remain to be verified.
    inspiration_en: 'Trend: meeting notes are shifting from cloud SaaS toward local, open-source, self-hostable
      forms, with privacy as a selection reason. Entry: start with law, tax and healthcare advisory teams
      sensitive to recording leaks, selling deployment and compliance support rather than seats; the free
      open-source core is not a moat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 销售、顾问或项目经理在客户通话或跨部门会议结束后，处理录音与转写文本，要产出可分享的纪要和待办清单。
        job_en: After client calls or cross-team meetings, salespeople, consultants or project managers
          process recordings and transcripts to produce shareable notes and action lists.
        pain_zh: 手工记笔记会漏掉决策与承诺，会后补写耗时；把录音上传到云端 SaaS 又让涉及客户隐私的团队担心数据外流。
        pain_en: Manual note-taking misses decisions and commitments and takes time to reconstruct; uploading
          recordings to cloud SaaS raises data-leak concerns for teams handling client privacy.
        current_alternative_zh: 人工手记加会后补写，或使用 Granola 等云端会议记录工具，或干脆不记录。
        current_alternative_en: Manual notes plus post-meeting write-ups, cloud note tools such as Granola,
          or no record at all.
        usage_reason_zh: 相较云端工具，yogurt 在本机完成录制、转写与纪要生成，用户不必先把敏感录音交给第三方，从而减少一道数据外传的顾虑；对隐私敏感的团队会因此选择它，这是基于产品能力的推断。
        usage_reason_en: Compared with cloud tools, yogurt records, transcribes and drafts notes on the
          local machine, so users need not hand sensitive recordings to a third party first, removing
          one data-export concern; privacy-sensitive teams would choose it on that basis, an inference
          from product capability.
      gates:
      - gate: value
        status: supported
        reason: 它解决会后整理纪要与待办的需求，痛点是手记遗漏与云端录音的隐私顾虑，旧做法是人工补写或云端工具。
        evidence_ids:
        - ev-f0c1b734304379e1
        - ev-feef1d8bcf98339b
      - gate: consensus
        status: insufficient
        reason: 开源仓库关注度快速上升说明有开发者兴趣，但没有用户评价或团队采用证据，无法判断是否进入日常工作流。
        evidence_ids:
        - ev-feef1d8bcf98339b
      - gate: model
        status: insufficient
        reason: 免费开源，未见定价或付费路径；可能的收入来自企业部署与支持，这是判断而非已验证事实。
        evidence_ids:
        - ev-f0c1b734304379e1
      - gate: truth
        status: insufficient
        reason: 本地运行降低隐私风险，但转写与纪要准确性、导出与协作能力尚未核验，交付确定性待查。
        evidence_ids:
        - ev-f0c1b734304379e1
      next_validation: 收集 yogurt 官方文档或仓库 issue/discussion 中关于转写准确率、导出格式与团队协作能力的公开说明。
  youtube-research-skills:
