        reason: 它解决代理生成分析时不懂业务口径、产出错误指标的问题，痛点落在返工与下游报表，旧做法是手写 SQL 加人工复核。
        evidence_ids:
        - ev-bf21f913dc5dca4d
      - gate: consensus
        status: insufficient
        reason: 仅有发布页一句宣称，未见用户评价、客户案例或使用数据，无法判断是否形成采用共识。
        evidence_ids:
