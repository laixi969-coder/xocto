    event_summary_zh: 2026年10月29日，Granola 在会议记录产品中加入听写功能，此前 Wispr 已在听写应用中增加会议记录；同时 Granola 入选 Madrona
      2026 年 Intelligent Applications 40 中期阶段名单，并被描述为从个人效率工具转向企业知识层。
    event_summary_en: On October 29, 2026, Granola added a dictation feature to its meeting notetaker
      after Wispr added meeting notes to its dictation app; Granola was also named to Madrona's 2026 Intelligent
      Applications 40 in the mid stage and described as repositioning from an individual productivity
      tool toward an enterprise knowledge layer.
    category: AI + 效率
    project_type: new_application
    industries:
    - 专业服务
    - 企业管理
    industries_en:
    - professional services
    - enterprise management
    jobs:
    - 会议参与者在不打断对话的情况下记录讨论，会后整理成可检索的会议纪要与待办
    - 个人用户在写作或输入场景中口述内容，直接得到整理后的文字
    jobs_en:
    - Meeting participants capture discussion without interrupting it and turn it into searchable notes
