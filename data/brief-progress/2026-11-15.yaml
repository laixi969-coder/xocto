        status: insufficient
        reason: 仅有仓库星数缓慢增长，属于关注度信号，缺少学习者完成课程或持续使用的公开反馈。
        evidence_ids:
        - ev-95d9d35e6e1c0596
        - ev-e39551137978aee2
      - gate: model
        status: insufficient
        reason: 开源教程未披露课程定价、付费路径或企业培训采购，买方与收入模式尚不明确，这是判断而非已验证事实。
        evidence_ids:
