    inspiration: 趋势：编码代理开始长时间自主运行，人从“坐在终端前”变成“随时被叫去确认”，远程接管成为新环节。切入：从需要长时间跑代理、又常离开工位的独立开发者或小团队切入，卖自托管部署与安全审计，而非卖
      token。
    summary_en: When developers using the pi coding agent step away from their computer, they can open
      Pi-Remote in a mobile browser to watch the running terminal session, answer the agent's prompts
      and send commands; it relays traffic end-to-end encrypted through a self-hosted relay. The deliverable
      is remotely advancing or correcting a coding task; the exact workflow and delivery still need verification.
    inspiration_en: 'Trend: coding agents now run autonomously for long stretches, so people shift from
      sitting at the terminal to being called back to confirm, making remote takeover a new step. Entry:
      start with solo developers or small teams who run long agent jobs and often leave their desks, selling
      self-hosted deployment and security review rather than tokens.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 pi 编码代理的开发者离开电脑时，用手机浏览器查看正在运行的终端会话、回答代理提问并发送指令，推进或纠正编码任务。
        job_en: A developer using the pi coding agent, when away from the computer, uses a mobile browser
          to view the running terminal session, answer the agent's prompts and send commands to advance
          or correct the coding task.
        pain_zh: 编码代理长时间运行会中途停下来等确认，人不在电脑前就只能干等或中断任务，工作流被卡住。
        pain_en: Long-running coding agents pause mid-run for confirmation; if the person is away from
          the computer they can only wait or interrupt the task, stalling the workflow.
        current_alternative_zh: 旧做法是守在终端前，或用通用远程桌面、SSH 客户端连回电脑，操作笨重且暴露面大。
        current_alternative_en: The old way is to stay at the terminal, or connect back via generic remote
          desktop or SSH clients, which is clunky and widens the attack surface.
        usage_reason_zh: 相较守在终端或通用远程桌面，它把代理会话直接镜像到手机浏览器，省去配置完整远程桌面这一步，让开发者在外出时也能回答确认；这是基于产品能力的推断，尚无用户反馈佐证。
        usage_reason_en: Compared with staying at the terminal or using generic remote desktop, it mirrors
          the agent session straight to a mobile browser, skipping full remote-desktop setup so developers
          can answer confirmations while away; this is an inference from product capability, not yet backed
          by user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理运行中需人工确认、人不在场就卡住的问题，痛点具体，交付是远程推进任务。
        evidence_ids:
        - ev-ad3104b5c7212cb3
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，无用户评价或采用案例，无法判断是否形成使用共识。
        evidence_ids:
        - ev-c1e54d65e3124fb3
      - gate: model
        status: insufficient
        reason: 开源自托管，未见定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-ad3104b5c7212cb3
      - gate: truth
        status: insufficient
        reason: 端到端加密与自托管中继是设计承诺，缺少安全审计或实测材料佐证。
        evidence_ids:
        - ev-0864a1263247f676
      next_validation: 收集 Pi-Remote 仓库的 issue 与 discussion，查看是否有用户报告实际远程接管编码代理的使用场景与安全反馈。
