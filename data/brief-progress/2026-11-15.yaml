    jobs_en:
    - Crypto developers or on-chain analysts building or debugging AI agents need the agent to read Elysium
      (Kinetiq's Arbitrum Orbit L2 on Hyperliquid) chain state and perform interactions, completing agent-to-chain
      read/write integration
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向构建 AI 代理的加密开发者：当代理需要读取或操作 Elysium（Kinetiq 在 Hyperliquid 上的 Arbitrum Orbit L2）时，这个开源
      MCP 服务把链上读取与交互动作交给代理执行，开发者拿到的是代理可调用的链上接口。具体支持哪些合约、写入权限与人工确认边界仍待核验。
    inspiration: 趋势：AI 代理开始被接到具体链和具体业务系统上，而不是停在通用对话。切入：从某条新 L2 或某个垂直链上业务（如做市、清算监控）的代理接入层进入，卖托管与权限审计而非单纯连接器；该链生态规模与真实调用量尚未核验。
    summary_en: 'For crypto developers building AI agents: when an agent needs to read or act on Elysium
      (Kinetiq''s Arbitrum Orbit L2 on Hyperliquid), this open-source MCP server hands chain reads and
      interactions to the agent, giving developers callable on-chain interfaces. Which contracts, write
      permissions and human-confirmation boundaries are covered still needs verification.'
    inspiration_en: 'Trend: AI agents are being wired into specific chains and business systems rather
      than staying generic chat. Entry: start from the agent integration layer of a new L2 or a vertical
      on-chain business (market making, liquidation monitoring) and sell hosting plus permission auditing
      rather than a plain connector; the chain''s ecosystem size and real call volume are unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 加密开发者或链上分析人员在构建或调试 AI 代理时，需要让代理读取 Elysium 链上状态并发起交互，完成代理与链的读写对接。
        job_en: Crypto developers or on-chain analysts building or debugging AI agents need the agent
          to read Elysium chain state and perform interactions, completing agent-to-chain read/write integration.
        pain_zh: 代理要操作链上数据，原本需自行封装 RPC 调用、合约 ABI 与权限控制，重复且易错；不解决则代理只能停在建议层，无法执行链上动作。
        pain_en: For an agent to act on chain data, teams previously had to wrap RPC calls, contract ABIs
          and permission controls themselves, which is repetitive and error-prone; without it the agent
          stays at the advice layer and cannot execute on-chain actions.
        current_alternative_zh: 开发者自行编写 RPC 与合约调用脚本，或使用通用链上 SDK 手工接入代理。
        current_alternative_en: Developers hand-write RPC and contract call scripts, or manually wire
          agents through generic on-chain SDKs.
        usage_reason_zh: 推断：相较自写 RPC 与 ABI 封装，该 MCP 服务把链上读取与交互封装成代理可直接调用的接口，减少对接环节；但仓库仅显示星数缓慢增长，缺少调用量、issue
          讨论或使用案例，无法确认开发者已将其留在工作流。
        usage_reason_en: 'Inference: compared with hand-written RPC and ABI wrappers, this MCP server
          packages chain reads and interactions into interfaces an agent can call directly, cutting integration
          steps; however the repo only shows slow star growth, with no call volume, issue discussion or
          usage cases, so it is unconfirmed that developers keep it in their workflow.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理读取并操作特定 L2 链上状态的需求，痛点是把 RPC、ABI 与权限封装重复做一遍；不解决则代理无法执行链上动作。
        evidence_ids:
        - ev-bed640ec337e67a9
        - ev-24781e23c40b41ad
      - gate: consensus
        status: insufficient
        reason: 仅见仓库星数从 144 缓慢增至 160，无 issue、讨论或外部采用描述，无法判断开发者是否形成使用共识。
        evidence_ids:
        - ev-bed640ec337e67a9
        - ev-24781e23c40b41ad
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价、托管服务或付费路径，买方与收入模式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-24781e23c40b41ad
      - gate: truth
        status: insufficient
        reason: 写入权限、人工确认边界与安全审计材料均未提供，无法核对代理执行链上动作时的确定性交付与风险控制。
        evidence_ids:
        - ev-bed640ec337e67a9
      next_validation: 收集该仓库的 README 与 issue/discussion，核对其支持的链上读写范围、权限与人工确认机制。
  exact:
