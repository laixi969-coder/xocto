        - ev-bbca0778ce257805
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数持续增长，属关注度信号，缺少用户评价或客户案例说明真实采用与持续使用。
        evidence_ids:
        - ev-516bbd0779c19f3a
        - ev-bbca0778ce257805
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，谁付钱、按什么收费尚不明确，这是判断而非已验证事实。
        evidence_ids:
        - ev-bbca0778ce257805
      - gate: truth
        status: insufficient
        reason: 人工在环确认与手机端执行贴近可控目标，但支持哪些应用、安全边界与确定性交付仍缺公开材料。
        evidence_ids:
        - ev-daab53a18c227f21
      next_validation: 收集 Pinky 仓库的 README、issue 与 discussion，核验其支持的应用范围、人工确认机制与安全边界。
