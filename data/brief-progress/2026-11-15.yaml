        usage_reason_en: 'Inference: compared with manually querying and screenshotting each assistant,
          Profound collects multiple AI answers and compares brand descriptions in one place, removing
          the step of finding and organizing each answer so teams can locate specific misstatements before
          revising content; brand teams whose deals are affected by AI channels would choose it during
          quarterly content reviews. Payment and retention evidence does not appear in the public material.'
