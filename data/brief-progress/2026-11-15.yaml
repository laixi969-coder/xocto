  vibe-shield:
    slug: vibe-shield
    name: vibe-shield
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息安全
    industries_en:
    - software development
    - information security
    jobs:
    - 使用 AI 生成 Next.js、Supabase 与 TypeScript 应用的开发者，在提交或上线前用静态扫描检查代码中的安全漏洞与 MCP/Skill 投毒风险
    jobs_en:
    - Developers building AI-generated Next.js, Supabase and TypeScript apps run a static scan before
      commit or launch to check for security flaws and MCP/Skill poisoning risks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向用 AI 生成 Next.js、Supabase 与 TypeScript 应用的开发者，在提交或上线前打开它，对生成代码做 92 条规则的静态安全扫描，覆盖 OWASP
      Top 10:2025 与 MCP/Skill 投毒风险，输出问题清单供人工修复确认。具体误报率与修复闭环仍待核验。
    inspiration: 趋势：AI 生成代码让“写完即上线”变快，安全审查这一步被甩在后面，扫描器开始贴着生成工作流走。切入：从独立开发者和小团队的 Supabase/Next.js 上线前检查切入，可做按次扫描或接入
      CI 的卖法；但规则质量与误报控制才是壁垒，不是规则条数。
    summary_en: For developers building AI-generated Next.js, Supabase and TypeScript apps, it runs a
      92-rule static security scan on generated code before commit or launch, covering OWASP Top 10:2025
      and MCP/Skill poisoning risks, and returns a findings list for manual fixing. False-positive rate
      and fix loop still need verification.
    inspiration_en: 'Trend: AI-generated code speeds up ship-to-production, leaving security review behind,
      so scanners are moving into the generation workflow. Entry: start with pre-launch checks for indie
      developers and small teams on Supabase/Next.js, sold per scan or via CI; rule quality and false-positive
      control, not rule count, are the moat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 用 AI 生成 Next.js、Supabase 与 TypeScript 应用的开发者，在提交或上线前对生成代码做安全扫描，找出漏洞与投毒风险并修复。
        job_en: Developers building AI-generated Next.js, Supabase and TypeScript apps scan generated
          code before commit or launch to find vulnerabilities and poisoning risks and fix them.
        pain_zh: AI 生成的代码量大且作者未必逐行读懂，安全审查容易被跳过；不查就上线可能留下可被利用的漏洞。
        pain_en: AI-generated code is voluminous and not always fully read by its author, so security
          review gets skipped; shipping unchecked can leave exploitable flaws.
        current_alternative_zh: 靠人工逐行读代码、通用 SAST 工具或上线后才发现问题。
        current_alternative_en: Manual line-by-line review, generic SAST tools, or discovering issues
          after launch.
        usage_reason_zh: 推断：相较通用 SAST，它把规则对准 AI 生成栈（Next.js、Supabase、MCP/Skill 投毒），开发者不必自己配置规则集就能在提交前拿到针对性问题清单，因此小团队在快速上线场景下会试用。
        usage_reason_en: 'Inference: unlike generic SAST, its rules target the AI-generated stack (Next.js,
          Supabase, MCP/Skill poisoning), so developers get a targeted findings list before commit without
          configuring rule sets, which is why small teams shipping fast would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 生成代码上线前缺少安全审查的问题，痛点是不查就上线会留下漏洞；旧做法是人工读码或通用扫描。
        evidence_ids:
        - ev-782e3a1281ae5b83
      - gate: consensus
        status: insufficient
        reason: 仅 42 星，无用户评价或采用案例，无法判断开发者是否真的把它放进工作流。
        evidence_ids:
        - ev-782e3a1281ae5b83
      - gate: model
        status: insufficient
        reason: 开源项目，未见付费、赞助或企业采购路径，买方与收费方式不明。
        evidence_ids:
        - ev-782e3a1281ae5b83
      - gate: truth
        status: insufficient
        reason: 92 条规则的误报率、覆盖深度与修复闭环均无公开材料，交付确定性未核验。
