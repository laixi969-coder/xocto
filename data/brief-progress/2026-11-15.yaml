  open-source-ai-without-jensen:
    slug: open-source-ai-without-jensen
    name: NVIDIA
    decision: market_context
    summary_zh: 2026年11月，NVIDIA CEO 黄仁勋辞职，被视为美国开放模型生态的重大挫折。材料指出，NVIDIA 支持开放模型是出于自身财务利益，即避免少数客户自研芯片、削弱其利润；而黄仁勋此前对开放生态的大规模资金投入很可能随之收缩。推断：若投入收缩，依赖
      NVIDIA 资助的开放模型团队将面临融资与算力成本上升，开放模型供给与竞争格局可能向少数闭源厂商集中。
    summary_en: 'In November 2026, Nvidia CEO Jensen Huang resigned, described as a major setback for
      the US open-model ecosystem. The material notes that Nvidia''s support for open models serves its
      own financial interest by preventing a few customers from building their own chips and eroding its
      profits, and that Huang''s large-scale funding of the open ecosystem will very likely dry up. Inference:
      if that funding contracts, open-model teams relying on Nvidia money face higher financing and compute
      costs, and open-model supply and competition may concentrate toward a few closed providers.'
    event_summary_zh: 2026年11月，NVIDIA CEO 黄仁勋辞职；材料称其对开放模型生态的大规模资金投入很可能收缩。
    event_summary_en: In November 2026, Nvidia CEO Jensen Huang resigned; the material says his large-scale
      funding of the open-model ecosystem will very likely dry up.
