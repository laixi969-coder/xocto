      - gate: consensus
        status: insufficient
        reason: 融资与估值说明资本关注，但不能证明品牌团队已把它留在日常流程；缺少客户案例或持续使用证据。
        evidence_ids:
        - ev-89426cf9b222b466
        - ev-00462f89c8f1fa45
      - gate: model
        status: insufficient
        reason: 候选材料未给出定价、计费单位或采购方，无法判断收入来自品牌订阅还是按项目收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-89426cf9b222b466
      - gate: truth
        status: insufficient
        reason: 监测 AI 回答并给出修正建议的承诺能否确定性交付、改动是否真被模型采纳，公开材料未说明，存在结果不可控风险。
        evidence_ids:
        - ev-89426cf9b222b466
      next_validation: 收集 Profound 官方定价页或公开客户案例，确认计费单位与品牌团队的实际使用结果。
  prokbot-plus:
