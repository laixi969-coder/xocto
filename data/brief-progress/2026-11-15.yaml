        status: insufficient
        reason: 未披露定价、买方与计费方式，钱可能来自 to B 数据团队，但这是判断而非已验证事实。
        evidence_ids:
        - ev-bf21f913dc5dca4d
      - gate: truth
        status: insufficient
        reason: 25% 错误减少的测试口径与基线未公开，交付是否确定发生、人工复核边界如何划分均无法核对。
        evidence_ids:
        - ev-bf21f913dc5dca4d
      next_validation: 收集 Dex Semantics 官方文档或定价页，核对其语义层如何接入数据源、25% 错误减少的测试口径与计费方式。
