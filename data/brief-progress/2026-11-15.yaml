    jobs:
    - 开发者在用 AI 编码代理完成一次改动后，需要审阅计划、关键决策与代码差异，以决定是否合并
    jobs_en:
    - Developers reviewing the plan, key decisions and code diff after an AI coding agent makes a change,
      to decide whether to merge
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在让 AI 编码代理改完代码后，打开这套指令与技能集合，按“计划—批判性审查—差异审计”三段流程逐项检查代理给出的方案和最终代码差异，再决定是否合并。它交付的是一套可复用的审查流程与提示材料，具体效果和人工确认环节仍待核验。
    inspiration: 趋势：AI 编码代理产出代码的速度已超过人工审阅速度，审查环节本身开始被产品化。切入：从受监管行业或外包交付团队的代码合并前审查入手，把审查记录做成可交付的合规材料，而不是再做一个写代码的助手。
    summary_en: After an AI coding agent changes code, developers open this instruction and skill set
      and walk through a three-stage flow — planning, critical review, diff audit — checking the agent's
      plan and final diff before deciding whether to merge. It delivers a reusable review process and
      prompt material; concrete results and the human sign-off step still need verification.
    inspiration_en: 'Trend: AI coding agents now produce code faster than humans can review it, so the
      review step itself is becoming a product. Entry: start with pre-merge review for regulated industries
      or outsourced delivery teams, and turn review records into deliverable compliance material rather
      than building another code-writing assistant.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在 AI 编码代理完成一次改动后，需要审阅计划、关键决策与代码差异，以决定是否合并。
        job_en: After an AI coding agent makes a change, developers review the plan, key decisions and
          code diff to decide whether to merge.
        pain_zh: 代理一次生成大量代码，人工逐行核对耗时且容易漏掉设计层面的错误；不审查就合并会带来返工和线上风险。
        pain_en: An agent generates a large amount of code at once; line-by-line human checking is slow
          and easily misses design-level errors, and merging without review causes rework and production
          risk.
        current_alternative_zh: 靠人工读 diff、口头约定提示词、零散的个人经验，或直接信任代理输出。
        current_alternative_en: Reading diffs by hand, informal prompt conventions, scattered personal
          experience, or simply trusting the agent's output.
        usage_reason_zh: 推断：它把审查拆成计划、批判性审查、差异审计三个固定步骤，让开发者在合并前按清单逐项核对，减少“凭感觉看一遍 diff”的遗漏；经常使用编码代理的团队在改动较大时会选择它。
        usage_reason_en: 'Inference: it splits review into three fixed steps — planning, critical review,
          diff audit — so developers check items against a list before merging, reducing the omissions
          of a quick eyeball pass over the diff; teams that use coding agents heavily would pick it for
          larger changes.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 生成代码后人工审查慢、易漏设计错误的问题，痛点具体且不审查有返工代价；但公开材料只有仓库说明，缺少实际使用反馈。
        evidence_ids:
        - ev-044bec796ff489f1
      - gate: consensus
        status: insufficient
        reason: 仓库有 135 星、20 次分叉，说明有开发者关注，但没有讨论、issue 或采用案例证明它进入团队流程。
        evidence_ids:
        - ev-044bec796ff489f1
      - gate: model
        status: insufficient
        reason: 开源免费，未见付费路径或服务化交付；谁付钱尚不明确，这是判断而非已验证事实。
        evidence_ids:
        - ev-044bec796ff489f1
      - gate: truth
        status: insufficient
        reason: 审查流程能否稳定减少缺陷、是否依赖特定代理，公开材料未给出可复现结果，需看实际使用记录。
        evidence_ids:
        - ev-044bec796ff489f1
      next_validation: 收集该仓库的 issue、discussion 或使用案例，确认三段审查流程在真实合并前审查中的实际效果与采用情况。
