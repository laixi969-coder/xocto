      on their behalf, completing a sequence of actions that the user then confirms
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安卓用户在多应用间做重复操作时，打开这个本地运行的代理，由它读取屏幕内容并通过无障碍权限代为点击、按语音指令执行多步流程；用户最终拿到一串已执行的操作，但具体流程、交付边界与人工确认环节仍待核验。
    inspiration: 趋势：手机端代理开始尝试用系统无障碍权限直接操作应用，而不是只做对话。切入：可从老年人或视障用户的手机代办、或电商客服批量处理订单这类高频重复操作切入，按代办的流程数或订阅收费；但需先确认权限合规与失败回滚机制。
