        status: insufficient
        reason: 开源插件，未见定价、付费或赞助路径，买方与收费方式均未披露，这是判断不是已验证事实。
        evidence_ids:
        - ev-01642c7a98acdf22
      - gate: truth
        status: insufficient
        reason: 方法卡能否确定性改善提示词结果、引文核对是否可靠，缺少可复现实测或用户反馈支持。
        evidence_ids:
