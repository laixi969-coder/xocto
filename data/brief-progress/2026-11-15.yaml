      they supply table schemas and semantic definitions, and the agent builds analytics from them. It
      claims 25% fewer errors, but the concrete workflow, delivery format and human review step still
      need verification.'
    inspiration_en: 'Trend: the bottleneck for analytics agents is shifting from writing queries to understanding
      business definitions, making the semantic layer a chargeable middle layer. Entry: start from one
      vertical''s metric dictionary (e.g. retail or SaaS finance) and charge per connected data source
      or per delivered definition document rather than selling a generic tool.'
