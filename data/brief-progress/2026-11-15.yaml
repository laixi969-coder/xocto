      Claude Code 会话微调智能体模型；仓库星标从11月9日的263升至11月15日的324。
    event_summary_en: On 2026-11-07, drost-ai released an open-source Agent Skill that fine-tunes an agentic
      model with Tinker on a user's own Claude Code sessions, working in Claude Code, Codex and OpenCode;
      repository stars rose from 263 on 2026-11-09 to 324 on 2026-11-15.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code 等编码智能体的开发者，在反复纠正同一类错误后，把历史会话整理成训练数据并提交微调，得到更贴合自身代码习惯的模型
    jobs_en:
    - Developers using coding agents such as Claude Code who, after repeatedly correcting the same errors,
      turn past sessions into training data and submit a fine-tune to get a model closer to their own
      code habits
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex 或 OpenCode 的开发者，在发现智能体反复犯同类错误时，打开这个技能，让它读取自己过往的编码会话并交给 Tinker 微调模型；最终得到的是按个人会话调过的模型，训练数据筛选与效果仍需用户自行确认。
    inspiration: 趋势：编码智能体的个人历史会话正被当作可训练资产，模型定制从厂商侧下沉到个人开发者。切入：可从团队共享的代码评审与修复记录入手，为小型工程团队做按仓库定制的微调服务，按次交付调好的模型而非卖工具。
    summary_en: Developers using Claude Code, Codex or OpenCode open this skill when the agent keeps repeating
      the same mistakes; it reads their past coding sessions and hands them to Tinker for fine-tuning.
      The deliverable is a model tuned on personal sessions, while data selection and results still need
      the user's own check.
    inspiration_en: 'Trend: personal session histories of coding agents are becoming trainable assets,
      pushing model customization from vendors down to individual developers. Wedge: start from a team''s
      shared code review and fix records and offer per-repository fine-tuning to small engineering teams,
      delivering a tuned model per engagement rather than selling a tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码智能体的开发者，在多次纠正同类错误后，把历史会话整理成训练数据并提交微调，得到更贴合自身习惯的模型。
        job_en: Developers using coding agents who, after repeatedly correcting the same errors, turn
          past sessions into training data and submit a fine-tune to get a model closer to their own habits.
        pain_zh: 通用编码模型不了解个人或团队的代码约定，用户只能每次在提示里重复纠正，纠正成本反复发生。
        pain_en: General coding models do not know a person's or team's conventions, so users must repeat
          corrections in prompts each time, paying the cost over and over.
        current_alternative_zh: 旧做法是每次手动写更长的提示、维护规则文件，或干脆放弃定制直接用默认模型。
        current_alternative_en: The old way is to write longer prompts each time, maintain rule files,
          or give up on customization and use the default model.
        usage_reason_zh: 推断：它把已有会话直接转成微调输入，省去用户自己收集、清洗并提交训练数据这一步，因此反复踩同一坑的开发者会尝试用它换掉逐次改提示的做法。
        usage_reason_en: 'Inference: it turns existing sessions directly into fine-tuning input, removing
          the step of collecting, cleaning and submitting training data by hand, so developers hitting
          the same pitfalls may try it instead of editing prompts each time.'
      gates:
      - gate: value
        status: supported
        reason: 它解决通用编码模型不懂个人约定、用户需反复纠正提示的痛点，旧替代是手写长提示或规则文件，结构上成立。
        evidence_ids:
        - ev-e5fba299052f60be
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，缺少用户反馈或采用案例说明开发者是否真的把它放进工作流。
        evidence_ids:
        - ev-f3ee2aef8791743e
      - gate: model
        status: insufficient
        reason: 开源项目，付费方与收费路径未在材料中披露，可能靠 Tinker 平台或服务收费，属判断非事实。
        evidence_ids:
        - ev-e5fba299052f60be
      - gate: truth
        status: insufficient
        reason: 微调效果、数据筛选质量与是否贴近真实编码目标均无公开实测，交付确定性未核验。
        evidence_ids:
        - ev-6c4b2fe252f55167
      next_validation: 收集该仓库的 issue 或 discussion，查看用户是否报告微调后模型在真实编码任务上的效果与重复使用情况。
