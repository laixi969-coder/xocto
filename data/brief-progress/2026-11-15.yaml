    - An animator or indie developer without a mocap rig feeds one two-camera AI video, and the tool reads
      joints and fits a rig to deliver a usable GLB animation
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 独立游戏关卡美术在灰盒阶段打开它：把整关灰盒和相机规划交给工具，图像模型按视角绘制并投影烘焙，输出带真实阴影的 glTF 关卡资产，接缝和光照仍需人工确认。同仓库的 anymove
      则接收一段双机位 AI 视频，读取关节并拟合骨骼，输出 GLB 动画。具体流程与交付质量仍待核验。
    inspiration: 趋势：游戏美术的贴图与动捕这两段重手工环节，正被拆成“输入灰盒或视频、输出可直接进引擎的资产”的独立工具。切入：从独立游戏团队和小型动画工作室的关卡贴图、生物动捕环节进入，卖按资产或按项目计费的结果，而不是卖编辑器席位；先解决接缝与光照一致性这类可核对的质量问题。
    summary_en: 'An indie game level artist opens it at the gray-blockout stage: the tool takes the whole
      blockout and a camera plan, image models paint per view and project and bake, and it outputs a glTF
      level asset with real shadows, while seams and lighting still need human checks. The same repository''s
      anymove takes one two-camera AI video, reads joints and fits a rig to output a GLB animation. The
      exact workflow and delivery quality still need verification.'
    inspiration_en: 'Trend: two heavily manual game-art steps, texturing and motion capture, are being
      split into standalone tools that take a blockout or a video and return engine-ready assets. Entry:
      start with level texturing and creature mocap for indie game teams and small animation studios,
      selling per-asset or per-project results rather than editor seats, and first solve checkable quality
      issues such as seam and lighting consistency.'
