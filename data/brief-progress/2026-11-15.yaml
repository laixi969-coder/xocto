    summary_zh: 内容创作者或社区运营者在写面向中文互联网受众的文案时，遇到模型不认识的梗和黑话，原本要自己搜索再改写提示词；该开源项目用约 6792 条梗词库自动查词并把释义注入上下文，让模型按词义生成，用户拿到的是带正确梗义的输出，仍需自己判断用法是否合适。具体交付流程与词库质量仍待核验。
    inspiration: 趋势：中文互联网的黑话和梗更新极快，通用模型的知识更新跟不上，垂直词库正在成为内容生产链上的独立供给。切入：从网络社区运营、短视频脚本和营销文案团队切入，按词库订阅或按内容条数收费，而不是卖通用插件；词库的持续维护和社区共创是模型能力抹平后仍留得住的壁垒。
    summary_en: Content creators or community operators writing copy for Chinese internet audiences hit
      slang the model does not know and previously had to search it themselves and rewrite the prompt.
      This open-source project uses a glossary of roughly 6,792 slang terms to look up words automatically
      and inject definitions into context so the model generates with the right meaning; users get output
      with correct slang sense but still judge whether the usage fits. The exact delivery flow and glossary
      quality remain to be verified.
    inspiration_en: 'Trend: Chinese internet slang turns over fast and general models lag, so vertical
      glossaries are becoming a separate supply layer in content production. Entry: start with community
      operations, short-video scripting, and marketing copy teams, charging by glossary subscription or
      per content piece rather than selling a generic plugin; continuous glossary upkeep and community
      contribution are the moat that survives model parity.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
