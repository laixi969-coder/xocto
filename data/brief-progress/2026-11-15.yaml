      position and hands a storyboard image plus time-stamped subtitle lines to an agent before each segment
      ends, and the agent replies aloud in a floating window while also hearing room audio. The user gets
      voice commentary synced to playback; delivery quality and any human confirmation step remain unverified.
    inspiration_en: 'Trend: video consumption is shifting from one-way playback toward agent-companioned
      interpretation, where the input is not the whole video but shots and dialogue cut by playback position.
      Entry: start from long-video contexts that need segment-by-segment understanding, such as film commentary,
      language learning or course review, charging by content length or subscription; today there is only
      an open-source repository and slowly rising stars, with no payment or retention evidence.'
