    inspiration: 趋势：视频消费正从单向播放转向与智能体同步的伴随式解读，输入不再是整段视频，而是按播放位置切出的画面与台词。切入：可从影视解说、语言学习或课程复习这类需要逐段理解的长视频场景进入，按内容时长或订阅收费；目前只有开源仓库与缓慢增长的星标，尚无付费与留存证据。
