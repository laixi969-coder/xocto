    - consumer electronics
    jobs:
    - 家庭用户在客厅用电视找片和切换应用时，通过手机遥控和自定义主屏整理观看入口，并可选让 Claude 助手按语音或文字请求执行操作
    - 家庭用户安装和配置电视主屏时，把仓库交给自己的 AI 编码代理完成部署
    jobs_en:
    - Home viewers browsing shows and switching apps on a living-room TV use a phone remote and custom
      home screen to organize viewing entry points, optionally asking a Claude assistant to act on spoken
      or typed requests
    - Home users setting up the TV home screen hand the repository to their own AI coding agent to complete
      deployment
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 家庭用户在客厅打开 Google TV 时，原本要在系统默认主屏和遥控器之间找片、切应用；couch-tv 用自建主屏和手机遥控承接这些操作，并可选接入 Claude 助手按请求执行动作。用户最终得到一套自己部署的电视主屏与遥控界面，安装需把仓库交给自己的
      AI 编码代理完成，具体交付细节仍待核验。
    inspiration: 趋势：电视这类封闭客厅入口开始被开源项目用自建主屏和手机遥控拆开，AI 助手只是可选附加层。切入：面向愿意折腾的家庭影音用户或小型民宿、酒店客房，卖预配置的电视主屏与遥控部署服务，而不是卖模型能力；付费路径尚未披露。
    summary_en: When viewers open Google TV in the living room, they normally hunt for shows and switch
      apps between the default home screen and the remote; couch-tv replaces this with a self-hosted home
      screen and phone remote, with an optional Claude assistant acting on requests. Users end up with
      their own deployed TV home screen and remote interface, installed by handing the repository to their
      own AI coding agent; delivery details still need verification.
    inspiration_en: 'Trend: closed living-room TV entry points are being pried open by open-source custom
      home screens and phone remotes, with the AI assistant only an optional layer. Entry: target tinkerer
      home-theater users or small homestays and hotel rooms with a preconfigured TV home-screen and remote
      deployment service rather than model access; the payment path is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 家庭用户在客厅用 Google TV 找片、切应用时，通过自建主屏和手机遥控整理观看入口，并可选让 Claude 助手按请求执行操作。
        job_en: Home viewers finding shows and switching apps on a living-room Google TV use a custom
          home screen and phone remote to organize entry points, optionally asking a Claude assistant
          to act on requests.
        pain_zh: 系统默认主屏推荐杂乱、遥控器输入慢，用户要在多个应用间反复切换才能找到想看的内容。
        pain_en: The default home screen is cluttered with recommendations and remote input is slow, forcing
          users to hop between apps to find what they want.
        current_alternative_zh: 沿用电视自带主屏与实体遥控器，或额外接一个电视盒子。
        current_alternative_en: Stick with the TV's built-in home screen and physical remote, or add a
          separate streaming box.
        usage_reason_zh: 推断：自建主屏把常用入口集中到一屏、手机遥控替代方向键逐格移动，减少找片时的切换步骤；愿意自行部署的技术型家庭用户会因此选择它，但尚无用户反馈证明其被长期留在日常观看流程中。
        usage_reason_en: 'Inference: a custom home screen consolidates frequent entries on one page and
          a phone remote replaces grid-by-grid D-pad movement, cutting steps when hunting for shows; technically
          inclined households willing to self-deploy would choose it, but no user feedback yet shows it
          staying in daily viewing routines.'
      gates:
      - gate: value
        status: supported
        reason: 它解决客厅电视找片与切应用时主屏杂乱、遥控输入慢的问题，替代自带主屏和实体遥控，属于具体旧流程改造。
        evidence_ids:
        - ev-bbc3d1067eb0e459
        - ev-b99d118eda3f5437
      - gate: consensus
        status: insufficient
        reason: 收藏数在两周内快速增长，但只有仓库指标，没有用户评价或讨论说明谁在什么场景下持续使用。
        evidence_ids:
        - ev-8c934e3ac209e74a
        - ev-b99d118eda3f5437
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是自部署用户或民宿酒店等小 B，属判断而非已验证事实。
        evidence_ids:
        - ev-b99d118eda3f5437
      - gate: truth
        status: insufficient
        reason: 安装依赖用户自己的 AI 编码代理，部署门槛与长期稳定性缺少实测和议题处理情况佐证。
        evidence_ids:
