      CSV 报表；价目需手工导入 CSV，具体对账流程与准确度仍待核验。
    inspiration: 趋势：模型调用从单一供应商变成多家混用，费用核对正从财务手工表格变成需要专门工具的一步。切入：从已同时接入多家模型、有月度对账压力的中小开发团队或代运营服务商进入，卖的是可交付的对账报表而非看板本身；开源版可作获客入口，托管与审计留痕是可能的付费点（推断）。
    summary_en: 'At month-end, engineering teams open this local dashboard to reconcile model-call spend:
      they load call volumes, token counts and peak/off-peak price tables from multiple providers, break
      costs down by provider and model, match them against official invoices, and export HTML, PDF or
      CSV reports. Price tables are imported manually via CSV, and the exact reconciliation flow and accuracy
      still need verification.'
    inspiration_en: 'Trend: model usage is spreading across multiple providers, so cost reconciliation
      is moving from ad-hoc finance spreadsheets into a dedicated step. Entry: start with small engineering
      teams or outsourced ops vendors already juggling several model providers and facing monthly reconciliation
      pain, selling the delivered reconciliation report rather than the dashboard; the open-source build
      can be the acquisition hook, with hosted reconciliation and audit trails as plausible paid layers
      (inference).'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发团队负责人或财务对接人，在月底核对多家模型平台账单时，处理调用量、token 与峰谷价目表，完成费用归集与官方账单对账。
        job_en: Engineering leads or finance liaisons reconciling multi-provider model bills at month-end,
          working from call logs, token counts and peak/off-peak price tables to allocate spend and match
          official invoices.
        pain_zh: 多家平台的计费口径、峰谷价与账单格式不一致，手工在表格里归集容易漏项或算错，对不上官方账单时难以定位差异。
        pain_en: Billing units, peak/off-peak rates and invoice formats differ across providers; manual
          spreadsheet roll-ups miss line items or miscalculate, and discrepancies against official invoices
          are hard to trace.
        current_alternative_zh: 用电子表格手工汇总各平台用量，或直接看各家控制台自带的账单页，再人工比对。
        current_alternative_en: Manually aggregating usage in spreadsheets, or reading each provider's
          own console billing page and comparing by hand.
        usage_reason_zh: 它把多平台用量与价目表汇到一处，按供应商和模型拆分并直接与官方账单对账，省去在多个控制台和表格之间来回搬运与重算的那一步；推断对同时用多家模型、需要月度费用归集的小团队有吸引力。
        usage_reason_en: 'It consolidates multi-provider usage and price tables in one place, splits costs
          by provider and model and reconciles directly against official invoices, removing the step of
          shuttling data between consoles and spreadsheets and recalculating; inference: attractive to
          small teams using several model providers that need monthly cost allocation.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多平台模型账单归集与对账的需求，痛点是计费口径不一、手工汇总易错；买方尚不明确，可能是团队负责人或财务。
        evidence_ids:
        - ev-9f6a1beb79f1f235
        - ev-ef9efa990cec9738
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度随时间上升，缺少用户评价或客户案例说明谁在什么场景下持续使用。
        evidence_ids:
        - ev-7f185029f636f6d4
        - ev-ef9efa990cec9738
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，钱可能来自托管服务或企业定制，这是判断而非已验证事实。
        evidence_ids:
        - ev-ef9efa990cec9738
      - gate: truth
        status: insufficient
        reason: 价目需手工导入 CSV，对账准确度与人工确认边界未见公开说明，交付确定性待核验。
        evidence_ids:
        - ev-9f6a1beb79f1f235
      next_validation: 收集该仓库的 issue 或 discussion，确认用户实际对账场景、价目导入方式与对账差异处理流程。
