          codebases is too heavy, read a ~1,400-line Python teaching implementation covering goal mode,
          permissions, skills and MCP wiring, so they can reproduce or modify a minimal agent loop themselves.
        pain_zh: 主流代理框架代码量大、抽象层多，开发者想弄清权限、目标模式与上下文压缩如何串起来时，往往只能靠零散博客和调试猜测，学习成本高。
