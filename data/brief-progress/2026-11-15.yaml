          real browser, handling pages and sessions to read data or execute a flow.
        pain_zh: 许多后台操作没有可用 API，或需要登录态与验证码，代理在无头环境里难以稳定复现用户真实会话，人工只能反复手动点击。
        pain_en: Many back-office operations lack usable APIs or require login state and captchas; agents
          in headless environments struggle to reproduce a real user session, forcing repeated manual
          clicking.
        current_alternative_zh: 旧做法是人工在浏览器里逐步操作，或用脚本与无头浏览器自行维护登录态，遇到验证和页面变化就中断。
        current_alternative_en: The old way is manual step-by-step browser work, or self-maintained scripts
          and headless browsers that break on verification and page changes.
        usage_reason_zh: 推断：它通过扩展把代理接到用户已登录的真实浏览器，省去单独搭建登录态与无头环境这一步，因此需要操作登录后台的开发者会在自动化网页任务时选择它；公开材料未给出留存或客户案例。
        usage_reason_en: 'Inference: by attaching the agent to the user''s already-logged-in real browser
          via an extension, it removes the step of building separate login state and headless environments,
          so developers automating logged-in consoles would pick it for web tasks; public materials show
          no retention or customer cases.'
      gates:
