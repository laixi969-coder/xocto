  verdict:
    slug: verdict
    name: verdict
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息技术服务
    industries_en:
    - software development
    - IT services
    jobs:
    - AI 代理开发者在上线前检查代理工具调用是否真的达成目标，而不是只看退出码为 0
    jobs_en:
    - AI agent developers verifying before launch that agent tool calls actually achieved the goal, not
      just that exit code is 0
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在给 AI 代理接入外部工具、准备上线时打开它，把代理的工具调用结果交给这个本地语义校验器判断是否真的完成了任务，而不是只看退出码是否为 0；用户拿到的是对调用是否达标的判定。具体接入方式、误判率和交付形态仍待核验。
    inspiration: 趋势：代理开始替人执行真实操作后，“命令跑完”和“事情办成”之间的差距成了新的风险点。切入：从需要审计代理行为的开发团队或代理平台运维环节进入，按校验次数或审计报告收费；但该仓库公开信息仅一句描述，尚无使用与付费证据。
    summary_en: Developers open it when wiring AI agents to external tools before launch, feeding the
      agent's tool-call results to a local semantic verifier that judges whether the task was actually
      accomplished rather than only whether exit code was 0; the user gets a pass/fail judgment on the
      call. Integration method, error rate and delivery form still need verification.
    inspiration_en: 'Trend: as agents perform real actions, the gap between ''the command ran'' and ''the
      task got done'' becomes a new risk point. Entry: start from dev teams or agent-platform operators
      who need to audit agent behavior, charging per verification or per audit report; the repo''s public
      info is a single description with no usage or payment evidence yet.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: AI 代理开发者在把代理接入外部工具、准备上线前，需要判断代理的每次工具调用是否真的完成了预期任务，而不是只看退出码。
        job_en: AI agent developers, before launch, need to judge whether each agent tool call actually
          completed the intended task, not just whether the exit code was 0.
        pain_zh: 退出码为 0 并不等于事情办成，代理可能调用了工具却做错事，开发者缺少一个能核对语义结果的环节。
        pain_en: Exit code 0 does not mean the task succeeded; an agent may call a tool and do the wrong
          thing, and developers lack a step to check the semantic result.
        current_alternative_zh: 目前多靠人工抽查日志、写断言测试或事后发现故障，缺少对工具调用结果的语义校验。
        current_alternative_en: Today it is mostly manual log spot-checks, assertion tests, or discovering
          failures after the fact, with no semantic check on tool-call results.
        usage_reason_zh: 相较人工抽查日志，它把工具调用结果直接交给本地语义校验器给出是否达标的判定，减少逐条读日志的负担；这是基于功能描述的工作流推理，尚无用户反馈证实。
        usage_reason_en: Compared with manual log spot-checks, it feeds tool-call results to a local semantic
          verifier that returns a pass/fail judgment, cutting the burden of reading logs line by line;
          this is workflow inference from the feature description, not yet backed by user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决代理工具调用“跑完不等于办成”的核对需求，痛点具体；但公开材料只有一句描述，交付确定性未核验。
        evidence_ids:
        - ev-527ec2a531a34147
        - ev-68d4248ae03d7d5a
      - gate: consensus
        status: insufficient
        reason: 仓库星标数在采集期内从 236 降到 94，属关注度波动，不能证明持续采用；无用户评价或案例。
        evidence_ids:
        - ev-527ec2a531a34147
        - ev-68d4248ae03d7d5a
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是开发团队或代理平台，属判断而非已验证事实。
        evidence_ids:
        - ev-68d4248ae03d7d5a
      - gate: truth
        status: insufficient
        reason: 未见误判率、实测或部署文档，能否确定性交付语义判定仍待核验。
        evidence_ids:
        - ev-68d4248ae03d7d5a
      next_validation: 收集该仓库 README 与 issue/discussion 中的实测示例和误判讨论，核验语义校验的确定性。
    event_summary_zh: 2026 年 11 月初公开的本地语义校验器仓库，用于判断 AI 代理工具调用是否真的完成任务；采集期内星标数从 236 降至 94。
    event_summary_en: A local semantic verifier repo published in early November 2026 to judge whether
      AI agent tool calls actually complete tasks; stars fell from 236 to 94 during collection.
