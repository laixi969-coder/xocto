    open_source: true
    summary_zh: 开发者在自己的 Mac、Windows 或 Linux 上打开 tucano，把已有的 Claude Code、Codex、OpenCode 或 Pi 组织成多个代理，让它们分频道讨论、写代码、互相审查并调用本机工具；涉及真实世界操作时暂停等待开发者确认。最终交付是经人工放行的代码与操作结果，具体流程与交付仍待核验。
    inspiration: 趋势：编码代理正从单次对话走向多代理分工与互审，控制权留在本地成为卖点。切入：可从需要审计留痕的受监管软件团队进入，把“谁批准了哪一步”做成可导出的记录，而不是再做一个代理编排界面；价格未披露。
    summary_en: On their own Mac, Windows or Linux machine, developers open tucano to organize existing
      Claude Code, Codex, OpenCode or Pi instances into multiple agents that talk in channels, write code,
      review each other and call local tools; any real-world action pauses for the developer's approval.
      The deliverable is human-approved code and actions; the exact workflow and delivery still need verification.
    inspiration_en: 'Trend: coding agents are moving from single chats to multi-agent division of labor
      and peer review, with local control as the selling point. Entry: start with regulated software teams
      that need audit trails, making ''who approved which step'' an exportable record rather than building
      another orchestration UI; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在本地机器上让多个编码代理分工写代码、互相审查并调用已有工具，涉及真实世界操作时由开发者逐项确认。
        job_en: Developers run multiple coding agents on a local machine to write code, review each other
          and call existing tools, approving each real-world action themselves.
        pain_zh: 单个编码代理容易在长任务中漏改、自审失效，且直接执行外部操作风险高；开发者要反复切换窗口手工核对。
        pain_en: A single coding agent can miss changes and self-review poorly on long tasks, and executing
          external actions directly is risky; developers must switch windows and check by hand.
        current_alternative_zh: 开发者通常在一个终端里跑单个代理，靠人工复制上下文、手动审查 diff，或自己写脚本串联多个工具。
        current_alternative_en: Developers typically run one agent in a terminal, copy context by hand,
          review diffs manually, or script several tools together themselves.
        usage_reason_zh: 推断：tucano 把多个代理放进同一频道并让它们互审，同时把真实世界操作挡在人工确认之后，减少开发者手工搬运上下文和逐条核对外部动作的步骤，因此需要多代理协作又要求可控执行的开发者会试用它。
        usage_reason_en: 'Inference: tucano puts several agents in shared channels to review each other
          and gates real-world actions behind human approval, cutting the manual context-shuttling and
          action-checking steps, so developers who want multi-agent work with controlled execution would
          try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理协作与执行可控的需求：代理互审减少漏改，真实操作需人工放行降低误操作后果；痛点具体，替代方式是手工串联。
        evidence_ids:
        - ev-0998a0b82ab2f8f4
        - ev-216d46d8494de865
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 348 增至 410 的关注度信号，没有用户评价或团队采用案例说明它进入日常工作流。
        evidence_ids:
        - ev-0998a0b82ab2f8f4
        - ev-216d46d8494de865
      - gate: model
        status: insufficient
        reason: 公开材料未说明定价、买方或收费方式；开源项目可能靠托管或支持收费，这是判断不是已验证事实。
        evidence_ids:
        - ev-216d46d8494de865
      - gate: truth
        status: insufficient
        reason: 人工确认边界是合理设计，但未核验代理互审是否真能减少返工，也未看到交付结果或安全边界的实测。
        evidence_ids:
        - ev-0998a0b82ab2f8f4
      next_validation: 收集 tucano 仓库的 issue 与 discussion，确认开发者是否报告代理互审减少了返工或人工确认环节的实际使用记录。
    event_summary_zh: tucano 于 2026 年 10 月 28 日发布，提供在本地运行多代理编码协作的开源工具；仓库星数在 11 月 10 日至 15 日间由 348 升至 410。
    event_summary_en: tucano was published on October 28, 2026 as an open-source tool for running multi-agent
      coding collaboration locally; its repository stars rose from 348 to 410 between November 10 and
      15.
