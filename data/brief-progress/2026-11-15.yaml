      - gate: truth
        status: insufficient
        reason: 付款由本人确认降低了误下单风险，但比价准确性与库存同步能否稳定交付尚无公开材料。
        evidence_ids:
        - ev-8df9d9bbb637cfe7
      next_validation: 收集该开源仓库的 issue 与 discussion，查看用户对跨店比价准确性和购物车同步的实际反馈。
