      manually opening several apps to an assistant running them. Entry: start in a small market like
      Denmark where online grocery penetration is high and chains are concentrated, beginning with the
      high-frequency weekly list; possible models are household subscription or retailer referral fees,
      with no disclosed pricing.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 丹麦家庭在每周采购前，把商品清单交给 AI 助手，让它跨三家线上超市搜索同款、比价并放入购物车，本人确认后付款。
        job_en: Before the weekly shop, Danish households give a shopping list to an AI assistant that
          searches the same items across three online grocers, compares prices and fills the cart, with
          the person confirming and paying.
        pain_zh: 同一份清单要在多个超市 App 间反复切换、逐项比价和凑单，耗时且容易漏项；不做的后果是多花钱或买漏。
        pain_en: The same list must be re-entered across several grocer apps to compare prices and build
          a basket, which is slow and error-prone; skipping it means overpaying or missing items.
        current_alternative_zh: 用户手动打开各家超市 App 或网页，逐项搜索、记价格、分别加购；也有比价网站，但通常不直接落到购物车。
        current_alternative_en: Users manually open each grocer's app or site, search item by item, note
          prices and add to separate carts; comparison sites exist but usually do not fill the cart.
        usage_reason_zh: 推断：相较手动切换多个 App，它把“搜索同款—比价—加购”合并为一次对话动作，减少重复输入和逐项记录，因此常做线上采购、对价格敏感的家庭会在每周固定清单场景选择它；付款仍由本人把关。
        usage_reason_en: 'Inference: versus switching between apps by hand, it merges searching, comparing
          and cart-filling into one conversational action, cutting repeated entry and manual note-taking,
          so price-sensitive households who shop online regularly would choose it for the weekly list;
          payment stays with the person.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨多家线上超市比价与凑单的重复劳动，痛点具体、频率高，旧做法是手动切换 App 逐项记录，价值结构成立。
