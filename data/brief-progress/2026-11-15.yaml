          and camera plan to the tool for a shadowed glTF level asset; an animator without a mocap rig
          trades a two-camera video for a GLB skeletal animation.
        pain_zh: 整关贴图和生物动捕原本是耗时的手工环节，小团队缺少动捕棚和足够美术工时，灰盒到可玩画面之间周期长。
        pain_en: Whole-level texturing and creature mocap are time-consuming manual steps; small teams
          lack mocap stages and enough art hours, so the gap from blockout to playable visuals is long.
        current_alternative_zh: 手工在引擎或 DCC 软件里逐面贴图、用素材库拼贴，动捕则租棚、买设备或手 K 关键帧。
