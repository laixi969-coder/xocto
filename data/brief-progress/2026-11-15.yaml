    summary_zh: 短视频编导或广告投放人员在拆解一条竞品或爆款视频时打开它，把整段视频交给系统逐镜头判断是实拍、AI 生成还是代码制作，并按 VIDEO.md 格式输出拆解结果与复刻思路；最终交付是一份可照着拍的镜头级方案，具体复刻建议的准确度与人工复核环节仍待核验。
    inspiration: 趋势：视频生成能力普及后，稀缺的不再是“生成一条片”，而是看懂一条片为什么有效并复刻其结构。切入：从广告投放素材拆解或短视频代运营的选题环节进入，把逐镜头拆解做成按条计费的复刻报告，卖给需要批量复刻爆款的投放团队，而非卖给个人创作者。
    summary_en: 'A short-video director or ad buyer opens it when breaking down a competitor or viral
      video: the whole clip is passed in, each shot is judged as filmed, AI-generated or coded, and the
      breakdown plus remake guidance is output in the VIDEO.md format. The deliverable is a shot-level
      plan others can shoot from; the accuracy of remake suggestions and the human review step still need
      verification.'
    inspiration_en: 'Trend: as video generation spreads, the scarce skill is no longer making a clip but
      understanding why one works and reproducing its structure. Entry: start from ad-creative breakdown
      or short-video agency topic selection, selling per-clip remake reports to teams that must reproduce
      hits in volume rather than to individual creators.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 短视频编导和广告投放人员在拆解竞品或爆款素材时，需要逐镜头判断画面是实拍、AI 生成还是代码制作，并整理出可复刻的拍摄与制作方案。
        job_en: Short-video directors and ad buyers breaking down competitor or viral creatives must judge
          each shot as filmed, AI-generated or coded and produce a reproducible production plan.
        pain_zh: 过去靠人反复暂停、逐帧看片、凭经验猜制作方式，再手写分镜；一条片拆解耗时长，判断依赖个人经验，团队之间难以复用。
        pain_en: Previously people paused repeatedly, watched frame by frame, guessed the production method
          from experience and hand-wrote storyboards; one breakdown is slow, judgment depends on individual
          experience and is hard to reuse across a team.
        current_alternative_zh: 人工逐帧看片加手写分镜文档，或直接凭感觉模仿拍摄，没有结构化的镜头级拆解记录。
        current_alternative_en: Manual frame-by-frame viewing plus hand-written storyboard docs, or simply
          imitating by feel, with no structured shot-level breakdown record.
        usage_reason_zh: 推断：相较人工逐帧看片，它把整段视频一次性拆成镜头级条目并标注制作方式，省去反复暂停和凭经验猜测这一步，输出可直接复用的 VIDEO.md 结构；需要批量拆解竞品素材的编导和投放团队会因此选择它。
        usage_reason_en: 'Inference: versus manual frame-by-frame viewing, it breaks a whole video into
          shot-level entries with production-method labels in one pass, removing repeated pausing and
          experience-based guessing and outputting a reusable VIDEO.md structure; directors and ad teams
          breaking down many competitor clips would choose it for this.'
      gates:
      - gate: value
