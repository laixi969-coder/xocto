    summary_en: When switching projects or handing work to a coding agent, developers open devvm to spin
      up an isolated VM per project with the full toolchain; it takes the project code and dependency
      setup, provisions the environment and hands it to the user or agent to start coding, delivering
      a runnable, non-conflicting sandbox. The exact workflow and delivery still need verification.
    inspiration_en: 'Trend: coding agents now execute code, making environment isolation a precondition
      for agents to run safely rather than a personal habit. Entry: start with teams that need agents
      to run tests and install dependencies, charging per project or per concurrent sandbox and turning
      environment setup into a deliverable runtime unit; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在切换项目或让编码代理接手任务时，需要为每个项目准备隔离且带完整工具链的运行环境，避免依赖冲突并让代理安全执行代码。
        job_en: Developers switching projects or handing tasks to a coding agent need an isolated per-project
          runtime with the full toolchain, avoiding dependency conflicts and letting the agent execute
          code safely.
        pain_zh: 多项目共用本机环境时依赖互相污染，代理直接在本机跑代码有风险，手工配置环境耗时且难复现。
        pain_en: Shared local environments let dependencies contaminate each other, running agent code
          on the host is risky, and manual environment setup is slow and hard to reproduce.
        current_alternative_zh: 开发者通常手工配置本机环境、用容器或虚拟机脚本自行搭建，或依赖云端开发环境，需要自己维护工具链与隔离。
        current_alternative_en: Developers typically configure local machines by hand, script their own
          containers or VMs, or rely on cloud dev environments, maintaining toolchains and isolation themselves.
        usage_reason_zh: 推断：相较手工配置本机或自建容器，devvm 以每个项目一台预装工具链的隔离虚拟机为单位，省去逐项目装依赖和担心代理污染本机的步骤，因此需要让编码代理安全跑代码的开发者会在多项目切换时选择它。
        usage_reason_en: 'Inference: versus hand-configuring machines or self-built containers, devvm
          provisions one isolated VM per project with the toolchain preinstalled, removing per-project
          dependency setup and the risk of agents contaminating the host, so developers letting coding
          agents run code would choose it when switching among projects.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多项目环境隔离与代理安全执行代码的需求，痛点是依赖污染和手工配置耗时，旧做法是手工搭本机或容器。
        evidence_ids:
        - ev-4c62c9261ef2cc44
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度持续上升，缺少用户评价或客户案例说明真实采用与使用场景。
        evidence_ids:
        - ev-c91083c26490dbb7
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未见定价或付费路径，买方与收费方式仍不明确，这是判断不是已验证事实。
        evidence_ids:
        - ev-c91083c26490dbb7
      - gate: truth
        status: insufficient
        reason: 隔离沙箱贴近开发第一性目标，但缺少交付确定性、安全边界与人工确认环节的公开说明。
        evidence_ids:
        - ev-4c62c9261ef2cc44
      next_validation: 收集 devvm 官方文档或仓库 issue/discussion，核验其环境隔离方式、代理执行边界与是否有付费或托管方案。
