    name: youtube-research-skills
    decision: watching
    event_summary_zh: 2026年11月4日发布的 youtube-research-skills 提供一组面向 YouTube 研究的 AI agent 技能，覆盖爆款视频识别、细分赛道验证、竞品与评论挖掘、标题与缩略图构思、脚本拆解及赞助商线索；开源仓库关注度数日内从约
      51 升至 87。
    event_summary_en: Released on 4 November 2026, youtube-research-skills offers a set of AI agent skills
      for YouTube research covering outlier video detection, niche validation, competitor and comment
      mining, title and thumbnail concepts, script breakdowns and sponsor prospecting; repository attention
      rose from about 51 to 87 within days.
    category: AI + 创作
    project_type: open_source
    industries:
    - 内容创作
    - 数字营销
    industries_en:
    - content creation
    - digital marketing
    jobs:
    - YouTube 频道运营者在选题阶段分析竞品爆款视频与评论，确定下一个视频方向
    - 内容创作者在接洽赞助前梳理同类频道与品牌合作线索
    jobs_en:
    - YouTube channel operators analyzing competitor outlier videos and comments during topic selection
      to decide the next video
    - content creators mapping similar channels and brand collaboration leads before approaching sponsors
    regions: []
    regions_en: []
    open_source: true
    summary_zh: YouTube 频道运营者在选题或接洽赞助前，通过这组技能让 Claude Code、Cursor 等 agent 抓取并分析竞品视频、评论与标题模式，输出爆款识别、细分赛道验证和赞助线索；用户拿到研究结论后仍需自己判断选题与商务可行性。具体数据来源与交付格式仍待核验。
    inspiration: 趋势：内容研究正从人工翻看榜单转向由 agent 调用结构化数据完成竞品与评论分析。切入：可面向中小 MCN 或独立频道做按报告收费的选题与赞助匹配服务，而非卖技能包；壁垒在数据抓取与频道库，不在提示词。
    summary_en: Before choosing topics or approaching sponsors, YouTube channel operators use these skills
      to have agents such as Claude Code or Cursor pull and analyze competitor videos, comments and title
      patterns, producing outlier detection, niche validation and sponsor leads; users still judge topic
      and business viability themselves. Data sources and output formats remain to be verified.
    inspiration_en: 'Trend: content research is moving from manually scanning rankings to agents analyzing
      competitor and comment data. Entry: serve small MCNs or independent channels with per-report topic
      and sponsor matching rather than selling skill packs; the moat is data access and a channel database,
      not prompts.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: YouTube 频道运营者在选题和接洽赞助阶段，处理竞品视频、评论与标题数据，要判断下一个视频方向并找到可谈的品牌。
        job_en: At topic-selection and sponsor-outreach stages, YouTube channel operators process competitor
          videos, comments and title data to decide the next video direction and find brands to approach.
        pain_zh: 人工翻看竞品频道、统计评论和整理赞助线索耗时且零散，容易错过细分赛道机会。
        pain_en: Manually scanning competitor channels, tallying comments and compiling sponsor leads
          is slow and scattered, easily missing niche opportunities.
        current_alternative_zh: 人工浏览 YouTube 榜单与竞品频道，配合表格记录，或使用通用搜索与聊天工具。
        current_alternative_en: Manually browsing YouTube rankings and competitor channels with spreadsheets,
          or using general search and chat tools.
        usage_reason_zh: 相较人工翻看，这组技能让 agent 直接抓取并汇总竞品视频、评论与标题模式，把分散的浏览与统计合并成一份研究结论，减少逐条翻页的负担；这是基于功能描述的推断，尚无用户反馈佐证。
        usage_reason_en: Compared with manual browsing, these skills let an agent pull and aggregate competitor
          videos, comments and title patterns into one research output, cutting page-by-page scanning;
          this is an inference from the feature description, not yet backed by user feedback.
      gates:
      - gate: value
        status: supported
        reason: 它解决选题与赞助线索收集的需求，痛点是人工翻看竞品与统计评论耗时零散，旧做法是手动浏览加表格。
        evidence_ids:
        - ev-b0d897b11356039d
      - gate: consensus
        status: insufficient
        reason: 仓库关注度小幅上升，但无用户评价或频道采用证据，无法判断是否被持续使用。
        evidence_ids:
        - ev-b0d897b11356039d
      - gate: model
        status: insufficient
        reason: 开源技能包，未见定价或付费路径；可能的收入来自 TubeLab 平台服务，这是判断而非已验证事实。
        evidence_ids:
        - ev-578e8c5fff957363
      - gate: truth
        status: insufficient
        reason: 依赖第三方数据抓取，数据来源合规性与结果准确性未核验，交付确定性待查。
        evidence_ids:
        - ev-b0d897b11356039d
      next_validation: 收集 TubeLab 官方页面或仓库文档中关于数据来源、输出样例与使用限制的公开说明。
