  grim-prompter:
    slug: grim-prompter
    name: grim-prompter
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    - 信息安全
    industries_en:
    - Software and IT Services
    - Information Security
    jobs:
    - 安全工程师在代码库进入上线或审计前，把仓库交给编码代理，生成带证据追溯的威胁模型以确定要修的风险点
    jobs_en:
    - Security engineers hand a repository to a coding agent before release or audit to produce an evidence-traced
      threat model that identifies which risks to fix
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安全工程师在代码库上线或审计前，把仓库交给 Claude Code、Codex 等编码代理，由它按 36 类架构与 29 种方法生成带证据追溯的威胁模型；用户拿到一份可核对来源的风险清单，具体流程与人工复核边界仍待核验。
    inspiration: 趋势：威胁建模这类原本靠资深安全人员手工梳理的评审工作，正被拆成可由编码代理执行的步骤。切入：从需要合规审计的中小软件团队或外包交付方进入，按项目交付威胁模型报告而非卖工具，但定价与客户案例尚未披露。
    summary_en: Before release or audit, security engineers point a repository at coding agents such as
      Claude Code or Codex, which generate an evidence-traced threat model across 36 architectures and
      29 methods; users get a risk list with traceable sources, while the exact workflow and human review
      boundary remain unverified.
    inspiration_en: 'Trend: threat modeling, once hand-built by senior security staff, is being broken
      into steps a coding agent can execute. Entry: start with small software teams or outsourced delivery
      firms facing compliance audits, selling a per-project threat model report rather than a tool, though
      pricing and customer cases are not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师在代码库上线或审计前，把仓库交给编码代理，生成带证据追溯的威胁模型，确定要修的风险点。
        job_en: Security engineers hand a repository to a coding agent before release or audit to produce
          an evidence-traced threat model and decide which risks to fix.
        pain_zh: 威胁建模依赖资深安全人员手工梳理架构与攻击面，耗时且难以在每次迭代前完成，小团队常直接跳过。
        pain_en: Threat modeling relies on senior security staff manually mapping architecture and attack
          surface; it is slow, hard to repeat before each iteration, and small teams often skip it.
        current_alternative_zh: 人工白板评审、通用安全扫描器或事后渗透测试，前者慢，后者偏事后。
        current_alternative_en: Manual whiteboard reviews, generic security scanners, or post-hoc penetration
          tests; the first is slow and the latter is retrospective.
        usage_reason_zh: 推断：相较人工评审，它让编码代理直接读取仓库并按既定架构与方法产出带来源追溯的威胁模型，减少从零梳理架构这一步，因此缺少专职安全人员的团队在审计前可能选用。
        usage_reason_en: 'Inference: versus manual review, it lets a coding agent read the repo and produce
          a source-traced threat model using predefined architectures and methods, removing the from-scratch
          architecture mapping step, so teams lacking dedicated security staff may adopt it before audits.'
      gates:
      - gate: value
        status: supported
        reason: 它解决上线前威胁建模耗时、小团队常跳过的问题，痛点刚性且交付物可核对；买方与付费路径尚不清楚。
        evidence_ids:
        - ev-39ba3121475eaf4a
        - ev-445f593ae64066cd
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、客户案例或重复使用证据，无法判断是否进入日常工作流。
        evidence_ids:
        - ev-445f593ae64066cd
      - gate: model
        status: insufficient
        reason: 开源 MIT 项目，未见定价、商业主体或付费路径，钱从哪来无法从公开材料判断。
        evidence_ids:
        - ev-39ba3121475eaf4a
      - gate: truth
        status: insufficient
        reason: 威胁模型质量与误报率缺少可复现实测或独立评价，人工复核边界未披露。
        evidence_ids:
        - ev-39ba3121475eaf4a
      next_validation: 收集该仓库的 issue、discussion 或 README 中的使用示例与实测输出，核验威胁模型质量与人工复核边界。
  grounds:
    slug: grounds
    name: grounds
    decision: watching
    category: AI + 生活
    project_type: new_application
    industries:
    - 航空运输
    - 公共信息服务
    industries_en:
    - air transportation
    - public information services
    jobs:
    - 航班大面积停飞时，旅客或关注出行的人打开实时地图查看美国境内航班状态，以判断自己的行程是否受影响
    jobs_en:
    - During a nationwide ground stop, travelers or people tracking flights open a live map of U.S. flight
      status to judge whether their own trip is affected
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 在美国联邦航空管理局全国停飞期间，旅客或关注出行的人打开一张美国航班实时地图，查看哪些航班受影响，以判断自己的行程。候选材料只说明这是停飞当晚的实时航班地图，AI 具体接收什么、执行什么动作，以及最终交付形式仍待核验。
    inspiration: 趋势：突发航空管制时，公众对“我的航班现在怎样”的即时可视化需求会瞬间集中爆发。切入：可从航空出行信息或旅行保险场景进入，做停飞、延误时的行程影响查询与改签提示；但需先确认它是否真用了
      AI，还是纯数据可视化。
    summary_en: During a nationwide FAA ground stop, travelers or people tracking flights open a live
      map of U.S. flights to see which flights are affected and judge their own trip. The candidate material
      only describes a live flight map for the night of the ground stop; what the AI receives, what action
      it performs, and the final deliverable still need verification.
    inspiration_en: 'Trend: during sudden aviation restrictions, public demand for instant ''what is happening
      to my flight'' visualization spikes. Entry: start from air-travel information or travel-insurance
      scenarios, offering trip-impact lookup and rebooking prompts during ground stops and delays; first
      confirm whether AI is actually used or this is pure data visualization.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 航班大面积停飞时，旅客或关注出行的人打开实时地图查看美国境内航班状态，以判断自己的行程是否受影响。
        job_en: During a nationwide ground stop, travelers or people tracking flights open a live map
          of U.S. flight status to judge whether their own trip is affected.
        pain_zh: 突发停飞时，官方信息分散，旅客难以快速判断自己的航班是否受影响。
        pain_en: During a sudden ground stop, official information is scattered and travelers struggle
          to quickly judge whether their own flight is affected.
        current_alternative_zh: 查看航空公司通知、机场公告或新闻直播。
        current_alternative_en: Checking airline notices, airport announcements, or live news coverage.
        usage_reason_zh: 推断：一张聚合的实时地图把分散的航班状态集中呈现，省去旅客在多个渠道间来回核对；但材料未说明它是否用 AI，也未给出留存或重复使用证据。
        usage_reason_en: 'Inference: one aggregated live map centralizes scattered flight status, saving
          travelers from cross-checking multiple channels; but the material does not show whether AI is
          used, nor any retention or repeat-use evidence.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决突发停飞时旅客判断行程的需求，痛点真实；但材料只说明是实时航班地图，未说明 AI 具体做什么，交付是否确定仍待核验。
        evidence_ids:
        - ev-3542286ca4338d0b
        - ev-fba9c2c6647fd3e1
      - gate: consensus
        status: insufficient
        reason: 只有一次停飞事件期间的社区讨论热度，无法判断是否形成持续使用场景。
        evidence_ids:
        - ev-3542286ca4338d0b
      - gate: model
        status: insufficient
        reason: 材料未披露定价、买方或收费方式，钱从哪来无法判断。
        evidence_ids:
        - ev-3542286ca4338d0b
        - ev-fba9c2c6647fd3e1
      - gate: truth
