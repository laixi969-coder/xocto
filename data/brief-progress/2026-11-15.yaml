  agent-autoloop:
    slug: agent-autoloop
    name: agent-autoloop
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者让命令行编码代理在后台持续执行多步任务，遇到不确定的决策时通过卡片请求人工确认
    jobs_en:
    - Developers let a command-line coding agent keep working through multi-step tasks in the background
      and request human confirmation via cards when it is unsure
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在命令行里启动编码代理后，由它在后台自行接续多步任务并跟进，遇到拿不准的环节才推送一张确认卡片请人拍板；用户最终拿到的是代理完成的任务结果和待确认决策。具体支持哪些任务类型、卡片如何交互、交付如何核验，公开材料仅有一句简介，仍待核验。
    inspiration: 趋势：编码代理正从“一问一答”走向“后台长跑、只在关键节点找人”，人的角色从逐步操作变成审批。切入：可从需要人工签核的环节切入，例如代码合并前、对外发送前、涉及付费或数据改动的操作，把“何时必须叫人”做成可配置的审批层，按团队或按审批次数收费；但该仓库目前只有一句简介和星标增长，尚无文档与使用证据。
    summary_en: After a developer starts a coding agent in the command line, it picks up and follows through
      on multi-step tasks in the background, and only pushes a confirmation card for a human decision
      when it is unsure; the user ends up with the agent's completed task output plus pending decisions.
      Which task types are supported, how the cards work and how delivery is verified are not shown beyond
      a one-line description and still need checking.
    inspiration_en: 'Trend: coding agents are moving from one-shot Q&A to long background runs that call
      a human only at key checkpoints, turning the person into an approver. Entry: build the approval
      layer around the moments that need sign-off, such as before a merge, before an outbound send, or
      before a paid or data-changing action, making ''when to call a human'' configurable and charging
      per team or per approval; today the repository offers only a one-line description and star growth,
      with no docs or usage evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在命令行启动编码代理处理多步开发任务，希望它后台持续推进，只在拿不准的决策点由人确认。
        job_en: A developer starts a coding agent in the command line for a multi-step development task
          and wants it to keep going in the background, with a human confirming only the uncertain decision
          points.
        pain_zh: 长任务中代理会卡在需要判断的岔口，人要么全程盯着逐步放行，要么放手后跑偏返工；两种都消耗注意力。
        pain_en: 'On long tasks the agent stalls at judgment calls: either the person watches and releases
          every step, or lets go and reworks a wrong turn; both consume attention.'
        current_alternative_zh: 人工逐步确认每一步，或让代理无人值守跑完再整体检查返工。
        current_alternative_en: Manually confirming each step, or letting the agent run unattended and
          reviewing and reworking the whole result afterwards.
        usage_reason_zh: 推断：它把“何时需要人”从全程盯守收敛为少数确认卡片，减少逐步放行的操作负担，并让长任务不必因一次判断中断；需要长跑多步任务的开发者会因此选择它，但仓库尚无文档或使用反馈支撑这一点。
        usage_reason_en: 'Inference: it narrows ''when a human is needed'' from constant watching to a
          few confirmation cards, cutting the step-by-step release burden and letting long tasks continue
          past a single judgment call; developers running long multi-step tasks would choose it for that,
          though the repository has no docs or user feedback yet to support this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长任务代理卡在判断点、人需全程盯守或事后返工的问题，痛点具体；但仅有简介，交付确定性未核验。
        evidence_ids:
        - ev-987ec897e7bda904
        - ev-7bddc98bd5801fdf
      - gate: consensus
        status: insufficient
        reason: 星标从约4300增至5300，说明关注度上升，但没有文档、issue 讨论或用户反馈证明真实采用。
        evidence_ids:
        - ev-987ec897e7bda904
        - ev-7bddc98bd5801fdf
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径；钱可能来自托管服务或团队版，属推断。
        evidence_ids:
        - ev-7bddc98bd5801fdf
      - gate: truth
        status: insufficient
        reason: 确认卡片能否可靠拦截风险操作、代理跑偏时如何回退，公开材料未说明，安全边界待核验。
        evidence_ids:
        - ev-987ec897e7bda904
      next_validation: 收集该仓库的 README 与 issue/discussion，确认支持的任务类型、确认卡片机制与是否有真实使用反馈。
  agentdeck:
    slug: agentdeck
    name: agentdeck
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者同时运行多个 AI 编码代理时，在桌面硬件小屏上查看代理状态、模型配额与 Mac 运行状况，以便决定何时切换或暂停任务
    jobs_en:
    - Developers running several AI coding agents check agent status, model quotas and Mac health on a
      small desk display to decide when to switch or pause tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者把 Ulanzi D200 小屏改造成桌面看板，用来显示 AI 编码代理的运行状态、模型配额和 Mac 健康信息，不需要厂商应用或改固件。用户最终在硬件屏上看到状态汇总，具体支持哪些代理、刷新方式和告警方式仍待核验。
    inspiration: 趋势：多代理并行编码正在把“盯任务”变成一项独立的桌面监控需求，硬件小屏成了新的信息出口。切入：从同时跑多个编码代理的独立开发者和小团队入手，做代理状态与配额的可视化，可考虑按设备或团队席位卖，但公开材料未披露价格。
    summary_en: Developers repurpose an Ulanzi D200 small screen as a desk dashboard showing AI coding
      agent status, model quotas and Mac health, without a vendor app or firmware changes. Users get a
      status summary on the hardware display; which agents are supported, refresh behavior and alerting
      still need verification.
    inspiration_en: 'Trend: parallel multi-agent coding is turning task monitoring into a separate desk-level
      need, with small hardware screens as a new information outlet. Entry: start with solo developers
      and small teams running several coding agents, visualizing agent status and quotas; selling per
      device or per team seat is plausible, but no public pricing is disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者同时运行多个 AI 编码代理时，需要在一个固定位置看到各代理是否在跑、配额还剩多少、机器是否吃紧，再决定下一步操作。
        job_en: When running several AI coding agents at once, a developer needs one fixed place to see
          whether each agent is running, how much quota remains and whether the machine is strained, before
          deciding the next action.
        pain_zh: 多代理并行后，状态分散在多个终端窗口和网页后台，切换查看会打断编码节奏，配额耗尽或机器过热也容易被忽略。
        pain_en: With parallel agents, status is scattered across terminal windows and web dashboards;
          switching to check breaks coding flow, and quota exhaustion or machine strain is easily missed.
        current_alternative_zh: 开发者目前靠切换终端标签、查看各模型厂商后台或系统监控工具来拼凑状态，没有统一的小屏视图。
        current_alternative_en: Developers currently piece status together by switching terminal tabs,
          checking each model vendor's dashboard or using system monitors, with no unified small-screen
          view.
        usage_reason_zh: 推断：它把代理状态、配额和机器健康集中到常亮的硬件小屏上，省去反复切换窗口这一步，因此同时跑多个代理、又不想打断编码的开发者会在长时间任务期间选择它。
        usage_reason_en: 'Inference: it consolidates agent status, quotas and machine health onto an always-on
          small hardware screen, removing repeated window switching, so developers running several agents
          who want to avoid interrupting coding would choose it during long tasks.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理并行时状态分散、需反复切换窗口查看的问题，痛点具体且与编码任务直接相关。
        evidence_ids:
        - ev-12492f5cacebe603
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，缺少用户评价或讨论说明开发者是否真的把它放进日常流程。
        evidence_ids:
        - ev-d130cc3c8fc56f67
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或商业交付路径，买方与收费方式不明。
        evidence_ids:
        - ev-12492f5cacebe603
      - gate: truth
        status: insufficient
        reason: 依赖特定硬件型号，支持范围与稳定性未见文档，能否确定性交付待核验。
        evidence_ids:
        - ev-12492f5cacebe603
      next_validation: 收集该仓库 README 与 issue/discussion，确认支持的代理与硬件型号、刷新与告警机制及是否有用户报告长期使用。
