    inspiration: 趋势：出行平台正把停车这类线下履约环节收进主应用，把一次行程的终点从下车延伸到车位。切入：可从商场、机场、医院等停车紧张且需提前锁位的场景切入，与停车场运营方按预订或履约结果分成；材料未披露定价，属推断。
    summary_en: Uber users approaching a destination can find, compare and reserve a parking spot inside
      the Uber app, replacing the old flow of leaving the app to locate parking and then booking separately.
      The candidate material gives only this one-line description; what the AI receives, what action it
      performs, and the final delivery and human confirmation steps still need verification.
    inspiration_en: 'Trend: mobility platforms are pulling offline fulfillment steps like parking into
      the main app, extending a trip''s endpoint from drop-off to a reserved space. Entry: start with
      malls, airports or hospitals where parking is scarce and must be locked in early, and share revenue
      with parking operators per booking or fulfilled result; pricing is not disclosed, so this is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 司机在接近目的地时，需要在 Uber 应用内查找、比较并预订停车位，完成出行最后一环。
        job_en: As drivers approach a destination, they need to find, compare and reserve a parking spot
          inside the Uber app to finish the last leg of the trip.
        pain_zh: 停车信息分散在多个应用和现场标识中，临时找位耗时且可能无位，行程终点体验断裂。
        pain_en: Parking information is scattered across apps and on-site signs; finding a spot on the
          fly is slow and may fail, breaking the end-of-trip experience.
        current_alternative_zh: 用户跳出 Uber，另开停车应用或到场后现场找位、排队缴费。
        current_alternative_en: Users leave Uber, open a separate parking app, or hunt for a spot and
          pay on site after arriving.
        usage_reason_zh: 推断：把查找、比较、预订收进同一应用，减少跳出应用和到场找位这一步；材料未给出用户反馈或采用数据，选择动机属推断。
        usage_reason_en: 'Inference: folding search, comparison and reservation into one app removes the
          step of leaving the app and hunting on arrival; no user feedback or adoption data is given,
          so the motive is inferred.'
      gates:
      - gate: value
        status: supported
        reason: 它解决出行终点找位难、信息分散的问题，旧做法是跳出应用另找停车；痛点具体，但 AI 具体动作未说明。
        evidence_ids:
        - ev-e69e21042159f1e7
      - gate: consensus
        status: insufficient
        reason: 仅有功能描述，无用户评价、采用或重复使用证据，无法判断是否形成使用习惯。
        evidence_ids:
        - ev-e69e21042159f1e7
      - gate: model
        status: insufficient
        reason: 买方可能是 Uber 或停车场运营方，但材料未披露定价、分成或采购方式，属判断而非事实。
        evidence_ids:
        - ev-e69e21042159f1e7
      - gate: truth
        status: insufficient
        reason: 未说明车位数据来源、预订是否确定生效及取消规则，交付确定性无法核对。
        evidence_ids:
        - ev-e69e21042159f1e7
      next_validation: 收集 Uber 官方关于 Parking 功能的说明页或帮助文档，核对车位数据来源、预订确认与取消规则。
  vork:
