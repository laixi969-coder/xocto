        job_en: Independent media operators or course editors making series covers, image sets and knowledge
          cards need multiple images to keep the same art style, palette, layout and character poses,
          and must deliver a publishable set.
        pain_zh: 逐张重新设定风格会让成套图风格漂移，返工和统一调整占用大量时间；这是从功能结构推断的痛点，尚无用户反馈直接佐证。
        pain_en: Re-specifying style image by image makes sets drift visually, and rework plus manual
          alignment consumes much time; this pain is inferred from product structure, not yet backed by
          user feedback.
        current_alternative_zh: 旧做法是逐张写提示词、手动调色与排版，或在设计软件里人工统一风格；也可能直接放弃一致性。
        current_alternative_en: The old way is writing prompts per image, manually adjusting color and
          layout, or aligning style by hand in design software; some simply give up on consistency.
        usage_reason_zh: 相较逐张重设，它把画风、配色、版式、人物与姿势抽成共享素材，一次设定即可复用到单张与套图，减少重复设定和统一返工这一步；推断做系列封面的运营者会因此选择它。
        usage_reason_en: Compared with re-specifying each image, it extracts style, palette, layout, character
          and pose into shared assets reused across single images and sets, cutting the repeated setup
          and alignment step; operators making series covers would likely choose it for this reason (inference).
      gates:
