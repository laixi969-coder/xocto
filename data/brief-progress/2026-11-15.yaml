        usage_reason_zh: 相较自查或临时找人看，它把多项上线前检查打包成一次扫描并给出通俗报告，减少逐项排查的负担；这是基于功能描述的工作流推理，尚无用户反馈证实。
        usage_reason_en: Compared with self-checks or ad-hoc review, it bundles multiple pre-launch checks
