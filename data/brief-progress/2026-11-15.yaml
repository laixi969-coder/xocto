        evidence_ids:
        - ev-ec5989d051fec1a0
        - ev-09bbb624c6ed96cd
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或商业主体，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-09bbb624c6ed96cd
      - gate: truth
        status: insufficient
        reason: 真实浏览器操作涉及账号安全与人工接管边界，公开材料未说明权限控制与失败处理，交付确定性待核验。
        evidence_ids:
