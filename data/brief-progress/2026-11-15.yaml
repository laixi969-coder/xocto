      so an AI host with voice, an avatar and chat memory runs continuously on a single server, replies
      to viewers and produces posts; the deliverable is a runnable streaming and posting workflow, while
      actual stream quality, platform compliance and human handover remain unverified.
    inspiration_en: The trend is live-stream supply shifting from human shift scheduling to self-hosted,
      always-on AI hosts, with single-server deployment lowering the fixed cost of continuous broadcasting.
      The entry point is overnight and off-peak stand-in hosting for small merchants or cross-border shops,
      charged by streaming hours or sessions; platform labeling and compliance rules for AI hosts, and
      whether viewers accept them, decide whether this becomes a business, and public materials do not
      yet cover them.
