        usage_reason_zh: 推断：若 Saccade 能稳定输出与页面元素对应的语义状态，代理可省去自行解析 DOM 和比对截图的一步，减少因页面变化导致的误操作；但公开材料只有一句简介，无法确认它是否真的减少了这一步。
