      remain to be verified.
    inspiration_en: 'Trend: AI agents are moving into building and testing cross-platform apps, not just
      generating code snippets. Entry: target small teams shipping multi-platform apps, starting at the
      step where the agent runs and verifies changes on every platform; per-project or per-verification
      pricing is conceivable, but no price is disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 应用开发者维护一份代码，需要它在网页、macOS、iOS 和 Linux 上原生运行，并让 AI 代理在各平台上构建、运行、查看和测试，以完成多端交付。
        job_en: App developers keep one codebase that must run natively on web, macOS, iOS and Linux,
          and have an AI agent build, run, see and test it on each platform to deliver across devices.
        pain_zh: 多端应用要分别搭建、运行和验证，代理改完代码后往往无法在每端确认是否真的跑通，验证环节要人工重复。
        pain_en: Multi-platform apps must be set up, run and verified separately, and after an agent edits
          code it often cannot confirm each platform actually works, forcing repeated manual verification.
        current_alternative_zh: 开发者用各平台各自的工具链分别构建和手动测试，或依赖只生成代码、不负责多端运行的编码助手。
        current_alternative_en: Developers use each platform's own toolchain to build and test manually,
          or rely on coding assistants that only generate code and do not run it across platforms.
        usage_reason_zh: 推断：相较逐端手动构建和测试，它让 AI 代理在同一份代码上直接在各平台运行并查看结果，减少“改完还要逐端验证”这一步；需要多端交付且已在用代理写代码的团队会因此选择它。
        usage_reason_en: 'Inference: versus building and testing each platform by hand, it lets an AI
          agent run and see results on every platform from one codebase, removing the step of verifying
          each target after edits; teams shipping multi-platform apps that already use agents to write
          code would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多端应用改完后需逐端构建与验证的痛点，让代理在同一代码上运行并查看各平台结果，旧做法是各平台工具链手动测试。
        evidence_ids:
        - ev-f7475baecce9219a
        - ev-31158b529d8ace41
      - gate: consensus
        status: insufficient
        reason: 仓库关注度在数日内快速上升，但只有星标数据，缺少开发者实际采用、issue 讨论或使用反馈来证明共识。
        evidence_ids:
        - ev-31158b529d8ace41
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明谁付费、是否有托管或企业版收费路径，买方与收入模式尚不清晰。
        evidence_ids:
        - ev-f7475baecce9219a
      - gate: truth
        status: insufficient
        reason: 尚未看到代理在各平台运行与测试结果是否可靠、人工确认边界如何，交付确定性缺少可核验材料。
        evidence_ids:
        - ev-31158b529d8ace41
      next_validation: 收集该仓库的 issue 与 discussion，确认开发者是否报告代理在多端运行和测试中的实际结果与失败场景。
  ff-ruyijs:
    slug: ff-ruyijs
    name: ff-ruyijs
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
