    summary_zh: effect-atlas 面向给网站加动效的前端开发者和设计师：它提供用纯 JavaScript 写好的网页动效代码，供用户交给自己的 AI 助手直接嵌入站点，免费使用。公开材料未说明动效数量、授权条款与最终页面效果如何核对，具体流程仍待核验。
    inspiration: 趋势：动效库正从“人读文档抄代码”改成“喂给 AI 直接落地”，代码库开始为模型消费而写。切入：可做面向特定行业站点（地产楼盘页、品牌营销落地页）的动效成品包，按项目或按页收费，卖“上线即用的页面效果”而非组件库；价格未披露，需核验。
    summary_en: 'effect-atlas targets front-end developers and designers adding motion to websites: it
      supplies web motion effects written in plain JavaScript for users to hand to their own AI assistant
      and embed directly into a site, free to use. Public material does not state how many effects exist,
      the license terms, or how the final page result is checked; the concrete flow still needs verification.'
    inspiration_en: 'Trend: motion libraries are shifting from "a human reads docs and copies code" to
      "feed it to an AI and ship," so code libraries are being written for model consumption. Entry: build
      finished motion packs for specific site types (real-estate listing pages, brand campaign landing
      pages) and charge per project or per page, selling "page effects ready to go live" rather than a
      component library; pricing is undisclosed and needs checking.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 前端开发者或设计师在给营销页或产品站加动效时，需要拿到可直接嵌入的 JavaScript 动效代码，并让 AI 助手完成接入。
        job_en: A front-end developer or designer adding motion to a marketing or product site needs embeddable
          JavaScript effect code and has an AI assistant wire it in.
        pain_zh: 动效通常要自己写或从文档里改，交给 AI 生成又常出错；用户要的是能直接落地的现成代码。
        pain_en: Motion is usually hand-written or adapted from docs, and AI-generated motion often breaks;
          users want ready code that lands directly.
        current_alternative_zh: 自己写 CSS/JS 动效、从通用动效库抄改，或让 AI 从零生成再反复调试。
        current_alternative_en: Writing CSS/JS motion by hand, copying and adapting from general motion
          libraries, or having an AI generate from scratch and debugging repeatedly.
        usage_reason_zh: 推断：把纯 JavaScript 动效整理成 AI 可直接读取并嵌入的形式，省去用户从文档改写和调试生成代码这一步，因此需要快速给站点加动效的前端与设计人员会在赶页面时选用。
        usage_reason_en: 'Inference: packaging plain JavaScript effects in a form an AI can read and embed
          removes the step of adapting docs and debugging generated code, so front-end and design people
          who need motion on a site fast would pick it when a page is due.'
      gates:
