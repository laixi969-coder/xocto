    summary_zh: Mac 用户在写代码或写文档时打开它，用语音口述代替键盘输入；它在本机把语音转成文字，并可通过语音钩子把内容送入 Claude Code 等编辑环境，用户拿到的是可直接使用的文字或指令，具体识别准确率与人工校对环节仍待核验。
