    summary_zh: 团队在自建聊天频道里把任务交给常驻 AI 代理，代理可调用工具、浏览器和记忆执行，操作需人工审批；用户最终在频道或私聊里拿到执行结果与审批记录。具体交付质量与留存仍待核验。
    inspiration: 趋势是把 AI 代理放进团队日常沟通流，而不是另开一个代理界面。切入可考虑面向需要数据不出内网的行业团队，按私有部署与审批合规收费；但公开材料只有仓库热度，尚无付费与留存证据。
    summary_en: Teams hand tasks to persistent AI agents inside a self-hosted chat workspace; agents call
      tools, a browser and memory, and actions require human approval. Users get results and an approval
      trail in channels or DMs. Delivery quality and retention remain unverified.
    inspiration_en: The trend is putting AI agents into the team's everyday communication flow rather
      than a separate agent UI. A wedge is selling private deployment plus approval compliance to teams
      that cannot send data outside their network; public material shows only repository traction, with
      no payment or retention evidence.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发或运营团队在自建聊天工具中，把代码审查、资料检索、例行操作等任务交给常驻 AI 代理，并在频道内审批其动作。
        job_en: Development or operations teams assign code review, document lookup and routine operations
          to persistent AI agents inside a self-hosted chat tool, approving their actions in-channel.
        pain_zh: 团队既想让代理直接干活，又不愿把内部对话和操作交给外部 SaaS，且需要可追溯的审批；现有做法是在聊天工具与代理界面之间来回切换。
        pain_en: Teams want agents to do real work without handing internal conversations and actions
          to an external SaaS, and they need an auditable approval step; today they switch between chat
          tools and agent interfaces.
        current_alternative_zh: 用 Slack 或飞书等外部协作工具加独立代理产品，或自建脚本与机器人，审批与权限分散在多个系统。
        current_alternative_en: External collaboration tools such as Slack plus separate agent products,
          or self-built scripts and bots, with approvals and permissions scattered across systems.
        usage_reason_zh: 推断：代理直接驻留在团队已有的频道里，任务、工具调用与审批在同一处完成，省去在聊天工具和代理界面之间搬运上下文这一步，因此重视数据自持与审批留痕的团队会选它。
        usage_reason_en: 'Inference: agents live in the team''s existing channels, so tasks, tool calls
          and approvals happen in one place, removing the step of moving context between chat tools and
          agent UIs; teams that value data ownership and approval trails would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决团队让代理干活又要数据自持与审批的需求，痛点具体；但交付质量与留存尚无公开证据。
        evidence_ids:
        - ev-45dbb5c54903b0d4
        - ev-c2c74e330336fd18
      - gate: consensus
        status: insufficient
        reason: 仓库星数从约 320 增至 1,405，说明关注度上升，但无用户评价或客户案例证明持续采用。
        evidence_ids:
        - ev-45dbb5c54903b0d4
        - ev-e563127c97281c5c
        - ev-c2c74e330336fd18
      - gate: model
        status: insufficient
        reason: 开源 AGPL 项目，付费路径未披露；可能靠托管或企业支持收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-c2c74e330336fd18
      - gate: truth
        status: insufficient
        reason: 代理拥有浏览器与工具权限，安全边界和人工审批是否可靠尚缺部署文档与实测。
        evidence_ids:
        - ev-e563127c97281c5c
      next_validation: 收集该仓库的部署文档与 issue/discussion，核实审批机制、权限边界及是否有团队实际长期使用。
