  agent-traffic:
    slug: agent-traffic
    name: agent-traffic
    decision: watching
    event_summary_zh: 2026年11月10日，Mintlify 发布 agent-traffic，用于把 AI 代理、AI 爬虫、搜索爬虫与机器人流量同真人访问区分开；开源仓库在11月10日至15日间星标从64增至78。
    event_summary_en: On 2026-11-10, Mintlify released agent-traffic, which distinguishes AI agents, AI
      crawlers, search crawlers and bots from human visitors; the open-source repository's stars rose
      from 64 to 78 between 2026-11-10 and 2026-11-15.
    category: AI + 开发
    project_type: open_source
    industries:
    - 网站运营
    - 软件与信息服务
    industries_en:
    - website operations
    - software and IT services
    jobs:
    - 网站运营或数据分析人员在查看访问日志与流量报表时，需要把 AI 代理、爬虫与真人访问分开，以判断真实用户行为和内容被机器读取的情况
    jobs_en:
    - Website operations or analytics staff reviewing access logs and traffic reports need to separate
      AI agents and crawlers from human visits to judge real user behavior and how content is read by
      machines
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 网站运营或数据分析人员在查看访问日志与流量报表时打开它，原本混杂的访问记录需要人工按 UA 和来源猜测哪些是真人。它接收访问流量信息，把 AI 代理、AI 爬虫、搜索爬虫与机器人从真人访问中区分出来，最终给出分类后的流量结果；具体接入方式、识别准确度和交付形态仍待核验。
    inspiration: 趋势是网站流量正在被 AI 代理和爬虫重新切分，真人访问与机器访问的边界成为新的计量问题。切入可从内容站、电商和 SaaS 的流量分析环节进入，卖的是“哪些访问值得当作真实用户”的判断，而非又一个通用分析面板；具体计费方式未披露。
    summary_en: Website operations or analytics staff open it when reviewing access logs and traffic reports,
      where mixed records previously required guessing which visits were human from user agents and referrers.
      It takes traffic information and separates AI agents, AI crawlers, search crawlers and bots from
      human visits, returning classified traffic results; integration method, detection accuracy and delivery
      form still need verification.
    inspiration_en: The trend is that website traffic is being re-divided by AI agents and crawlers, making
      the boundary between human and machine visits a new measurement problem. The entry point is the
      traffic analysis step of content sites, e-commerce and SaaS, selling the judgment of which visits
      count as real users rather than another generic analytics dashboard; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 网站运营或数据分析人员在查看访问日志与流量报表时，处理混杂的访问记录，要完成区分真人访问与 AI 代理、爬虫流量的任务。
        job_en: Website operations or analytics staff reviewing access logs and traffic reports handle
          mixed visit records to separate human visits from AI agent and crawler traffic.
        pain_zh: AI 代理与爬虫大量进入网站后，原有按 UA 和来源判断真人的做法容易误判，导致真实用户行为和内容被机器读取的情况混在一起，难以据此做决策。
        pain_en: As AI agents and crawlers increasingly hit websites, the old practice of judging humans
          by user agent and referrer easily misclassifies, mixing real user behavior with machine reads
          of content and making decisions unreliable.
        current_alternative_zh: 目前多依赖通用网站分析工具自带的机器人过滤、UA 规则或人工排查日志。
        current_alternative_en: Today this mostly relies on built-in bot filtering in general analytics
          tools, user-agent rules, or manual log inspection.
        usage_reason_zh: 推断：相较通用分析工具的粗粒度机器人过滤，它把 AI 代理、AI 爬虫、搜索爬虫与机器人分别识别，减少运营人员逐条核对日志的负担，因此需要区分机器与真人流量的内容站和
          SaaS 运营者会在分析访问数据时选择它；识别准确度与持续使用尚无公开证据。
        usage_reason_en: 'Inference: compared with coarse bot filtering in general analytics tools, it
          identifies AI agents, AI crawlers, search crawlers and bots separately, reducing the burden
          of checking logs entry by entry, so content-site and SaaS operators needing to separate machine
          from human traffic would choose it when analyzing visits; accuracy and sustained use lack public
          evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决网站运营者区分真人访问与 AI 代理、爬虫流量的需求，痛点在于原有 UA 规则易误判；买方尚不明确。
        evidence_ids:
        - ev-79e5dc49f954fa67
        - ev-8ef74db5aef6f9ca
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标从64增至78的关注度信号，没有用户评价或客户案例说明实际采用。
        evidence_ids:
        - ev-79e5dc49f954fa67
        - ev-8ef74db5aef6f9ca
      - gate: model
        status: insufficient
        reason: 未披露定价与付费路径，钱可能来自开源采用后的托管服务或企业版，这是判断而非已验证事实。
        evidence_ids:
        - ev-8ef74db5aef6f9ca
      - gate: truth
        status: insufficient
        reason: 识别准确度、误判边界与人工复核方式均无公开材料，承诺能否确定性交付尚未核验。
        evidence_ids:
        - ev-79e5dc49f954fa67
      next_validation: 收集 agent-traffic 官方文档或仓库 README 中关于识别方法、准确度与部署方式的说明。
