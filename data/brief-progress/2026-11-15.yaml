        status: supported
        reason: 它解决给网站加动效时自己写或改文档代码的负担，旧做法明确，交付是可嵌入的代码。
        evidence_ids:
        - ev-8183b6d44451a060
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 43 缓升至 88，属关注度信号，不能证明开发者已把它留在工作流里。
        evidence_ids:
        - ev-8f00613c404aa8f2
        - ev-8183b6d44451a060
      - gate: model
        status: insufficient
        reason: 标注免费使用，未见定价或付费路径；买方可能是开发者个人或代理公司，这是判断不是已验证事实。
        evidence_ids:
        - ev-8183b6d44451a060
      - gate: truth
        status: insufficient
        reason: 未披露动效数量、授权条款与页面效果核对方式，交付确定性无法核验。
        evidence_ids:
        - ev-8183b6d44451a060
      next_validation: 收集 effect-atlas 仓库的 README 与 issue/discussion，确认动效数量、授权条款以及是否有开发者反馈实际嵌入站点后的效果。
  granola:
    slug: granola
    name: Granola
