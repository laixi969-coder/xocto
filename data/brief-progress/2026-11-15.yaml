          AI agent must operate Android apps while they keep using the phone.
        pain_zh: agent 在手机上操作应用会占用前台屏幕，用户无法同时使用手机；多步自动化流程因此难以在真机上并行跑。
        pain_en: An agent operating apps on a phone occupies the foreground screen, so the user cannot
          use the phone at the same time; multi-step automation flows are therefore hard to run in parallel
          on a real device.
        current_alternative_zh: 旧做法是用多台真机或模拟器、或等用户不用手机时再跑自动化脚本，需要额外设备与排期。
        current_alternative_en: The old approach is extra physical devices or emulators, or running automation
          scripts only when the user is not using the phone, requiring extra hardware and scheduling.
        usage_reason_zh: 推断：它用不可见的后台虚拟屏承载 agent 的操作，省去占用前台或另备设备这一步，因此需要边用手机边跑 agent 的开发者会选它；目前缺少用户反馈与稳定性证据。
        usage_reason_en: 'Inference: it hosts the agent''s actions on an invisible background virtual
          display, removing the step of occupying the foreground or preparing another device, so developers
          who need to run agents while using the phone would choose it; user feedback and stability evidence
          are currently missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 agent 操作手机时占用前台、无法并行使用的问题，痛点具体且旧替代需额外设备或排期。
        evidence_ids:
        - ev-610b3f3f6b276678
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 46 增至 67 的关注度信号，缺少用户评价或采用案例。
        evidence_ids:
        - ev-610b3f3f6b276678
        - ev-9110e7b21e00693b
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方或商业路径，买方与收费方式不明。
        evidence_ids:
        - ev-610b3f3f6b276678
      - gate: truth
        status: insufficient
        reason: 非 root 方案在主流机型上的兼容性与操作稳定性未披露，交付确定性待核验。
        evidence_ids:
        - ev-610b3f3f6b276678
      next_validation: 收集该仓库的 issue 与 discussion，确认非 root 后台虚拟屏在主流安卓机型上的兼容范围与实际操作稳定性。
  agentero-dsh-plugin:
