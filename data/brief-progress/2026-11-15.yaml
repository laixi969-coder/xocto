    summary_zh: 用 AI 快速搭出应用的独立开发者在上线前打开它，作为 Claude Code 技能扫描代码中的泄露密钥、访问控制、问题依赖、成本失控、未完成代码和 Docker/托管就绪度，输出一份通俗报告。用户拿到的是上线前检查清单式报告，仍需人工确认修复。
