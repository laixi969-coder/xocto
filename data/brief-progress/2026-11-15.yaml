  backendskills:
    slug: backendskills
    name: backendskills
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 后端工程师在让编码代理生成后端代码后，检查并修复演示能跑但生产环境会出错的问题
    jobs_en:
    - Backend engineers reviewing and fixing backend code generated by coding agents that passes demos
      but breaks in production
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 后端工程师在让 Claude Code、Codex、Cursor 等编码代理写后端代码时，打开这套规则集，让代理在生成阶段就避开会导致生产故障的写法；仓库自述在 150 次运行中，关键错误从无规则时的
      25 次降到有规则时的 2 次。用户最终拿到的是代理产出的后端代码，仍需工程师自行复核，具体覆盖哪些错误类型与交付流程仍待核验。
    inspiration: 趋势：编码代理已能写出可演示的后端代码，但生产可靠性成为新的瓶颈，规则与检查层开始被单独产品化。切入：从有合规或高可用要求的后端团队入手，把“生产事故清单”做成可审计的规则包，按团队或按项目收费；仓库目前只有少量关注度，尚无付费与采用证据。
    summary_en: Backend engineers working with coding agents such as Claude Code, Codex and Cursor open
      this rule set so the agent avoids patterns that cause production failures while generating backend
      code; the repository claims critical mistakes fell from 25 to 2 in 150 runs. The deliverable is
      still agent-written backend code that engineers must review, and which error classes and delivery
      flow it covers remains to be verified.
    inspiration_en: 'Trend: coding agents can already produce demo-ready backend code, making production
      reliability the new bottleneck and turning rule and check layers into standalone products. Entry:
      start with backend teams facing compliance or uptime requirements, packaging a production-incident
      checklist as auditable rule packs sold per team or per project; the repository has only modest attention
      and no payment or adoption evidence yet.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 后端工程师在编码代理生成后端代码后，需要检查并修复那些演示能跑、上线却会出错的部分，例如错误处理、并发与数据一致性。
        job_en: After a coding agent generates backend code, backend engineers must review and fix parts
          that pass demos but fail in production, such as error handling, concurrency and data consistency.
        pain_zh: 代理生成的代码往往在演示中正常，却在生产环境暴露关键错误；工程师要逐行排查，返工成本高，且问题上线后代价更大。
        pain_en: Agent-generated code often works in demos but exposes critical errors in production;
          engineers must inspect line by line, rework is costly, and failures after launch are worse.
        current_alternative_zh: 工程师依赖人工代码评审、既有 lint 与测试，或反复给代理补充提示词来规避问题。
        current_alternative_en: Engineers rely on manual code review, existing linters and tests, or repeatedly
          adding prompts to steer the agent.
        usage_reason_zh: 推断：相较人工评审和零散提示词，这套规则在代理生成阶段就约束后端写法，仓库自述把 150 次运行中的关键错误从 25 次降到 2 次，因此需要控制上线风险的后端团队会在使用编码代理时选用它；尚无用户反馈或客户案例支持这一动机。
        usage_reason_en: 'Inference: unlike manual review and ad-hoc prompts, these rules constrain backend
          patterns during generation, and the repository claims critical mistakes dropped from 25 to 2
          in 150 runs, so backend teams managing launch risk would adopt it when using coding agents;
          no user feedback or customer cases support this motive yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理生成的后端代码在生产环境出错的问题，痛点具体且不处理的后果明确；规则集本身是公开事实，效果数字来自仓库自述。
        evidence_ids:
        - ev-d313b6031d39282c
      - gate: consensus
        status: insufficient
        reason: 仓库关注度从 43 增至 59，属规模信号，不能证明持续采用；缺少用户评价或团队使用案例。
        evidence_ids:
        - ev-5b657ae7617718a6
        - ev-d313b6031d39282c
      - gate: model
        status: insufficient
        reason: 开源仓库，未见定价、付费或企业采购路径；买方可能是使用编码代理的工程团队，这是判断而非已验证事实。
        evidence_ids:
        - ev-d313b6031d39282c
      - gate: truth
        status: insufficient
        reason: 25/150 与 2/150 的对比来自仓库自述，未见可复现的测试方法或第三方复核，交付确定性仍待核验。
        evidence_ids:
        - ev-d313b6031d39282c
      next_validation: 收集该仓库的 issue、discussion 或 README 中可复现的测试方法与用户使用反馈，核验关键错误下降数字是否可重复。
  baseten:
    slug: baseten
    name: Baseten
    decision: market_context
    event_summary_zh: 2026年10月30日至31日，多家媒体报道 Baseten 正以约300亿美元估值启动新一轮融资，估值较2026年6月水平翻倍以上；此前它被列入 Madrona
      2026 Intelligent Applications 40 的 Enabler 阶段。该事实表明，GPU 容量与多模型路由需求超过供给，推理基础设施的资本竞争加剧，AI 应用方的算力成本与供应商选择将受此影响（推断）。
    event_summary_en: On October 30–31, 2026, multiple outlets reported that Baseten is raising a new
      round at a roughly $30 billion valuation, more than double its June 2026 level; it was also named
      to Madrona's 2026 Intelligent Applications 40 in the Enabler stage. This indicates that demand for
      GPU capacity and multi-model routing exceeds supply, intensifying capital competition in inference
      infrastructure and affecting AI application developers' compute costs and vendor choices (inference).
    category: 基础层
    project_type: ai_transformation
    industries:
    - 云计算与基础设施
    - 人工智能
    industries_en:
    - Cloud Computing & Infrastructure
    - Artificial Intelligence
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Baseten 是面向开发者的模型推理部署与托管平台，属于 AI 应用的基础设施层，而非面向具体行业工作流的独立应用。本次新增事实是融资估值报道，不构成新的产品工作流变化。
    inspiration: 推理基础设施的估值翻倍说明模型部署与路由已成为 AI 应用的成本瓶颈；对创业者而言，机会不在再建一个通用推理平台与资本雄厚的玩家正面竞争，而在于围绕特定行业的合规、私有部署或结果计费环节切入。
    summary_en: Baseten is a model inference deployment and hosting platform for developers, sitting in
      the infrastructure layer rather than being a standalone application for a specific industry workflow.
      The new fact here is a funding valuation report, not a new product workflow change.
    inspiration_en: Doubling valuations in inference infrastructure show that model deployment and routing
      have become a cost bottleneck for AI applications; for founders, the opening is not another general-purpose
      inference platform competing head-on with well-capitalized players, but specific industries' compliance,
      private deployment, or outcome-based billing layers.
  blendclone-2:
    slug: blendclone-2
    name: BlendClone
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 影视与动画制作
    - 游戏开发
    - 三维设计与可视化
    industries_en:
    - Film and Animation Production
    - Game Development
    - 3D Design and Visualization
    jobs:
    - 三维美术师拿到一段参考视频后，需要把它还原成可编辑的 Blender 场景，用于二次修改或复用镜头
    - 动画或广告制作团队在复刻参考镜头时，需要把视频里的构图、物体和镜头关系转成可继续编辑的工程文件
    jobs_en:
    - A 3D artist receives a reference video and needs to rebuild it as an editable Blender scene for
      revision or shot reuse
    - An animation or advertising team reproducing a reference shot needs the video's composition, objects
      and camera relationships turned into a continuing editable project file
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师拿到一段参考视频后，BlendClone 会分析画面中的场景结构，用声明式编译方式生成可编辑的 Blender 工程，并给出与原视频的并排保真度评分，最终导出 .blend
      文件；人工仍需在 Blender 里核对和修改。具体识别精度与交付完整度仍待核验。
    inspiration: 趋势：视频正被当作三维场景的输入规格，而不只是成片素材，参考镜头复刻这一步开始被自动化。切入：从广告和短片的镜头复刻环节进入，面向接外包的三维美术师或小型制作团队，按复刻镜头数或项目交付收费，而不是卖通用生成工具。
    summary_en: When a 3D artist has a reference video, BlendClone analyzes the scene structure in the
      footage, compiles it declaratively into an editable Blender project, scores fidelity side by side
      against the source video, and exports a .blend file; a human still has to check and revise it in
      Blender. Recognition accuracy and delivery completeness remain to be verified.
    inspiration_en: 'Trend: video is becoming an input spec for 3D scenes rather than only finished footage,
      and the reference-shot reconstruction step is starting to be automated. Entry: start from the shot-reproduction
      step in ads and short films, targeting freelance 3D artists or small production teams, charging
      per reproduced shot or per delivered project rather than selling a generic generation tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师或小型制作团队拿到客户给的参考视频，需要把它还原成可继续编辑的 Blender 场景，用于改镜头或复用布景。
        job_en: A 3D artist or small production team receives a client's reference video and needs to
          rebuild it as a continuing editable Blender scene for shot changes or set reuse.
        pain_zh: 从视频手工重建场景要逐帧判断物体、材质和镜头关系，再在 Blender 里一件件搭，耗时且容易和原片对不上。
        pain_en: Manually rebuilding a scene from video means judging objects, materials and camera relationships
          frame by frame, then building each piece in Blender, which is slow and easily drifts from the
          source.
        current_alternative_zh: 现在多靠美术师看片手工建模、对位镜头，或用通用图生三维工具再导入 Blender 修补。
        current_alternative_en: Today artists mostly watch the footage and model by hand, match the camera
          manually, or use generic image-to-3D tools and then patch in Blender.
        usage_reason_zh: 推断：它把视频直接编译成可编辑工程并给出并排保真度评分，省去从零搭建场景和反复对片比对的步骤，因此接外包复刻镜头的三维美术师会在赶工期时选择它；是否长期留在工作流尚无公开证据。
        usage_reason_en: 'Inference: it compiles video directly into an editable project and scores fidelity
          side by side, removing the from-scratch scene build and repeated comparison against the source,
          so freelance 3D artists reproducing shots under deadline would choose it; there is no public
          evidence yet that it stays in the workflow long term.'
      gates:
      - gate: value
        status: supported
        reason: 它解决从参考视频重建可编辑三维场景的需求，痛点是手工建模与镜头对位耗时且易偏离原片，旧替代行为明确。
        evidence_ids:
        - ev-5d6a2630340468bc
        - ev-ced374323fefed99
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库约 66 星与 23 个未关闭 issue，缺少用户评价或客户案例说明谁在实际使用。
        evidence_ids:
        - ev-ced374323fefed99
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价页或付费路径；买方可能是接外包的美术师或制作团队，这是判断而非已验证事实。
        evidence_ids:
        - ev-5d6a2630340468bc
      - gate: truth
        status: insufficient
        reason: 保真度评分能否确定性交付、导出工程是否可直接使用，公开材料未给出可复现实测。
        evidence_ids:
        - ev-5d6a2630340468bc
      next_validation: 收集该仓库的 issue 与 discussion，确认用户对导出 .blend 工程可用性和保真度评分的实际反馈。
  blender-53:
    slug: blender-53
    name: Blender 5.3
    decision: market_context
    project_type: open_source
    open_source: true
    summary_zh: Blender 5.3 于 2026 年 11 月发布，将 3D Gaussian splats 原生纳入 Blender。对 AI 应用的含义是：从照片或视频重建的三维场景可以直接进入主流开源三维软件的工作流，减少格式转换与外部插件环节，但这一变化本身不是独立产品。
    summary_en: Blender 5.3, released in November 2026, brings 3D Gaussian splats natively into Blender.
      For AI applications this means scenes reconstructed from photos or video can enter the mainstream
      open-source 3D workflow directly, cutting format conversion and external plugins, but the change
      itself is not a standalone product.
    event_summary_zh: 2026 年 11 月 13 日，Blender 5.3 发布，将 3D Gaussian splats 作为原生功能引入 Blender。
    event_summary_en: On November 13, 2026, Blender 5.3 was released, bringing 3D Gaussian splats into
      Blender as a native feature.
  blender-ai-mcp-addon-4:
    slug: blender-ai-mcp-addon-4
    name: blender-ai-mcp-addon
    decision: watching
    event_summary_zh: 该开源仓库在 2026-11-12 发布后三天内，仓库星标从 45 增至 340，同期开放 issue 达 43 个；除仓库描述外，尚无客户案例、定价或使用留存数据。
    event_summary_en: After its 2026-11-12 release, this open-source repository's stars rose from 45 to
      340 within three days, with 43 open issues; beyond the repository description there are no customer
      cases, pricing, or retention data.
    category: AI + 创作
    project_type: open_source
    industries:
    - 游戏开发
    - 影视动画
    - 工业设计与建筑可视化
    industries_en:
    - game development
    - film and animation
    - industrial design and architectural visualization
    jobs:
    - 3D 美术师在 Blender 中搭建或修改场景时，用自然语言描述需求，由插件调用 bpy 脚本执行建模、材质与场景操作，最终得到可检查的场景改动
    jobs_en:
    - 3D artists building or revising scenes in Blender describe requirements in natural language, and
      the add-on runs bpy scripts to perform modeling, material and scene operations, producing inspectable
      scene changes
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 3D 美术师在 Blender 里搭建或修改场景时，原本要手写 bpy 脚本或逐步点选操作；该插件把自然语言需求交给接入的模型，由模型生成并执行场景操作脚本，用户拿到改动后的场景，仍需自行检查结果。具体流程与交付质量待核验。
    inspiration: 趋势是 3D 内容生产开始把脚本层交给模型生成，而非只做贴图或渲染加速。切入可放在小型游戏或动画外包团队：他们缺专职技术美术，最痛的是重复的批量场景操作，可按项目或按场景交付收费，但需先证明生成脚本的出错率可控。
    summary_en: When 3D artists build or revise scenes in Blender, they previously had to hand-write bpy
      scripts or click through operations step by step; this add-on passes natural-language requests to
      a connected model, which generates and runs scene-operation scripts, leaving the user with a modified
      scene that still needs checking. The exact workflow and delivery quality remain to be verified.
    inspiration_en: The trend is that 3D content production is handing the scripting layer to models rather
      than only speeding up texturing or rendering. The entry point could be small game or animation outsourcing
      teams lacking a dedicated technical artist, whose pain is repetitive batch scene operations; charging
      per project or per scene is plausible, but the error rate of generated scripts must first be shown
      to be manageable.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 3D 美术师在 Blender 中搭建或修改场景时，用自然语言描述需求，由插件调用 bpy 脚本执行建模、材质与场景操作，最终得到可检查的场景改动。
        job_en: 3D artists building or revising scenes in Blender describe requirements in natural language,
          and the add-on runs bpy scripts to perform modeling, material and scene operations, producing
          inspectable scene changes.
        pain_zh: Blender 的脚本与节点操作门槛高，批量或重复的场景修改需要手写 bpy 代码或逐步点选，非技术美术人员难以独立完成。
        pain_en: Blender's scripting and node operations have a high barrier; batch or repetitive scene
          edits require hand-written bpy code or step-by-step clicking, which non-technical artists struggle
          to do alone.
        current_alternative_zh: 手写 bpy 脚本、使用现成插件、或请技术美术代做；也有用户直接手动逐步操作。
        current_alternative_en: Hand-writing bpy scripts, using existing add-ons, or asking a technical
          artist to do it; some users simply operate manually step by step.
        usage_reason_zh: 推断：相较手写脚本，用户用自然语言描述即可让模型生成并执行场景操作，省去查 API 和调试脚本的一步；对缺技术美术的小团队，这降低了批量修改场景的门槛，因此可能被选用。
        usage_reason_en: 'Inference: compared with hand-writing scripts, users can describe needs in natural
          language and let the model generate and run scene operations, skipping the step of looking up
