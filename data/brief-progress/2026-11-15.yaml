        - ev-9ad0507a84df5504
      - gate: consensus
        status: insufficient
        reason: 只有开源仓库收藏数增长，缺少用户评价或使用反馈，无法判断是否形成稳定使用习惯。
        evidence_ids:
        - ev-9ad0507a84df5504
      - gate: model
        status: insufficient
        reason: 未披露定价或收费方式，买方可能是家庭订阅或零售商导流，属判断而非已验证事实。
        evidence_ids:
