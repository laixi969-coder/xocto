  uncut:
    slug: uncut
    name: uncut
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在把编码代理接入自有脚本或 CI 时，需要代理以可脚本化的方式接收指令并返回完整输出，避免结果被截断
    jobs_en:
    - Developers wiring a coding agent into their own scripts or CI need the agent to accept instructions
      in a scriptable way and return complete output without truncation
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在把编码代理接入脚本或 CI 时打开它：它以单个静态二进制、四个工具和标准输入输出接收指令并执行编码任务，返回不截断的结果；具体支持哪些任务、交付如何校验仍待核验。
    inspiration: 趋势：编码代理正从聊天界面下沉为可嵌入流水线的命令行组件，谁掌握“可脚本化、结果不丢”的接口谁就贴近工程流程。切入：从需要把代理嵌进自有构建或运维脚本的小团队入手，卖可审计的调用与输出完整性，而非再做一个对话前端。
    summary_en: 'Developers open it when wiring a coding agent into scripts or CI: it takes instructions
      through a single static binary, four tools and plain stdin/stdout, runs coding tasks and returns
      untruncated output; which tasks it covers and how delivery is verified still need checking.'
    inspiration_en: 'Trend: coding agents are sinking from chat UIs into embeddable command-line components,
      and whoever owns a scriptable, lossless interface sits closest to engineering workflows. Entry:
      start with small teams embedding an agent into their own build or ops scripts, selling auditable
      invocation and output integrity rather than another chat front end.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在把编码代理接入自有脚本或 CI 流水线时，需要代理以标准输入输出接收指令并返回完整、不被截断的执行结果。
        job_en: Developers embedding a coding agent into their own scripts or CI pipelines need the agent
          to take instructions over stdin/stdout and return complete, untruncated execution output.
        pain_zh: 现有代理多以交互界面为主，接入脚本时输出可能被截断或难以稳定调用，导致自动化步骤需要人工补看和重跑。
        pain_en: Existing agents are mostly interactive, so scripted use risks truncated output or unstable
          invocation, forcing manual review and reruns in automated steps.
        current_alternative_zh: 开发者自行封装通用模型接口或使用交互式编码助手，再手工复制结果进脚本。
        current_alternative_en: Developers wrap general model APIs themselves or use interactive coding
          assistants and manually copy results into scripts.
        usage_reason_zh: 推断：相较自行封装接口，它用单个静态二进制和固定四个工具把调用收敛为可脚本化的标准输入输出，减少适配与结果截断后的返工，因此需要把代理嵌入构建或运维脚本的开发者会试用它。
        usage_reason_en: 'Inference: versus self-wrapping APIs, it narrows invocation to scriptable stdin/stdout
          via one static binary and four fixed tools, cutting integration work and reruns after truncation,
          so developers embedding an agent into build or ops scripts would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决把编码代理嵌入脚本时调用不稳、输出被截断的问题，痛点具体且旧做法是手工封装或复制，结构上成立。
        evidence_ids:
        - ev-07404ebad4050e8b
        - ev-66c44b8793c38dc5
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度变化，缺少用户反馈或采用案例说明开发者是否真的把它放进工作流。
        evidence_ids:
        - ev-66c44b8793c38dc5
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-07404ebad4050e8b
      - gate: truth
        status: insufficient
        reason: 未核验其输出完整性与任务覆盖是否如描述，也缺少与现有代理的可复现对比。
        evidence_ids:
        - ev-07404ebad4050e8b
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者是否报告把它接入脚本或 CI 的实际使用与输出完整性结果。
