  gguf-neuron-explorer:
    slug: gguf-neuron-explorer
    name: gguf-neuron-explorer
    decision: watching
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 模型研究者或本地部署工程师在调试 llama.cpp 上的 GGUF 模型行为时，定位并调整 MLP 神经元，导出控制向量
    - 开源模型开发者在排查模型输出异常时，用 3D 界面查看神经元排序并通过 MCP 服务接入调试流程
    jobs_en:
    - Model researchers or local-deployment engineers locate and steer MLP neurons of GGUF models on llama.cpp
      and export control vectors when debugging model behavior
    - Open-source model developers inspect neuron rankings in a 3D interface and connect via an MCP server
      to debug abnormal model outputs
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向在 llama.cpp 上运行 GGUF 模型的研究者与工程师：打开工具后对模型的 MLP 神经元做查找、排序与干预，并导出控制向量，界面提供 3D 视图和 MCP 服务接入。用户最终拿到的是可导出的控制向量与神经元排序结果，具体调试流程与交付仍待核验。
    inspiration: 趋势：本地开源模型的调试正从黑箱试错走向可观测、可干预的神经元级工具。切入：面向做模型微调与安全对齐的小团队，卖可复现的神经元定位与干预报告，而非再做一个通用推理前端；仓库仅百级星标，采用规模尚未显现。
    summary_en: 'For researchers and engineers running GGUF models on llama.cpp: the tool finds, ranks
      and steers MLP neurons and exports control vectors, with a 3D web UI and an MCP server. Users get
      exportable control vectors and neuron rankings; the concrete debugging workflow and deliverables
      still need verification.'
    inspiration_en: 'Trend: debugging local open-source models is moving from black-box trial and error
      toward observable, steerable neuron-level tooling. Entry: target small teams doing fine-tuning and
      safety alignment and sell reproducible neuron-locating and steering reports rather than another
      generic inference front end; the repo has only about a hundred stars, so adoption is not yet visible.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 在 llama.cpp 上跑 GGUF 模型的研究者或工程师，在模型输出异常或需要定向调整行为时，处理模型内部 MLP 神经元，要完成定位、排序、干预并导出控制向量。
        job_en: A researcher or engineer running GGUF models on llama.cpp, when outputs are abnormal or
          behavior needs steering, works on internal MLP neurons to locate, rank, steer and export control
          vectors.
        pain_zh: 过去只能靠改提示词或整体重训来调模型行为，定位不到具体神经元，试错成本高且结果难复现。
        pain_en: Previously behavior was adjusted only by prompt tweaks or full retraining, with no way
          to locate specific neurons, making trial and error costly and hard to reproduce.
        current_alternative_zh: 手工写脚本读取权重、凭经验猜测，或用通用可视化工具，缺少针对 GGUF 与 llama.cpp 的现成流程。
        current_alternative_en: Hand-written scripts to read weights, guesswork, or generic visualization
          tools, with no ready workflow for GGUF and llama.cpp.
        usage_reason_zh: 推断：它把神经元查找、排序、干预和向量导出收进一个界面，省去自建脚本与反复试错这一步，因此做本地模型调试与对齐的开发者会在排查具体行为时选择它。
        usage_reason_en: 'Inference: it bundles neuron finding, ranking, steering and vector export into
          one interface, removing the need to build scripts and retry repeatedly, so developers debugging
          and aligning local models would pick it when investigating specific behaviors.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地模型行为调试中定位不到具体神经元、只能整体重训的痛点，旧流程是手写脚本加试错，结构上成立。
        evidence_ids:
        - ev-60df0d9a8ffe8061
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 73 缓慢增至 104，属关注度而非持续采用，缺少 issue、讨论或用户案例。
        evidence_ids:
        - ev-499304d1daa44b90
        - ev-60df0d9a8ffe8061
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或商业交付路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-60df0d9a8ffe8061
      - gate: truth
        status: insufficient
        reason: 神经元干预结果是否稳定可复现、导出向量是否真能改变模型行为，公开材料未给出实测。
        evidence_ids:
        - ev-60df0d9a8ffe8061
      next_validation: 收集仓库 issue、discussion 或 README 中的可复现实测与使用案例，确认神经元干预与向量导出的实际效果。
