    inspiration: 趋势：代码理解正从读文件、画架构图变成由模型直接产出可交互的结构说明。切入：可从接手遗留系统的外包团队或并购后技术整合场景进入，按一次代码库梳理交付，而非卖通用开发工具。
    summary_en: Developers open it before taking over an unfamiliar codebase or making changes, hand the
      repository to Claude or Codex, and get an interactive plain-English map of how the app fits together
      to judge module connections; the exact generation flow and deliverable still need verification.
    inspiration_en: 'Trend: code comprehension is shifting from reading files and drawing architecture
      diagrams to models producing interactive structural explanations. Entry: start with outsourced teams
      inheriting legacy systems or post-acquisition technical integration, selling a one-off codebase
      walkthrough rather than a generic dev tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 接手陌生或遗留代码库的开发者，在准备改动前需要弄清各模块如何连接、改动会牵动哪里。
        job_en: Developers inheriting an unfamiliar or legacy codebase need to understand how modules
          connect and what a change will affect before editing.
        pain_zh: 读文件、追调用链和手画架构图耗时且容易漏掉跨模块依赖，改动前理解成本高。
        pain_en: Reading files, tracing call chains and hand-drawing architecture diagrams is slow and
          easily misses cross-module dependencies, making pre-change understanding costly.
        current_alternative_zh: 逐文件阅读、全局搜索、手绘架构图，或直接问通用编程助手零散解释。
        current_alternative_en: Reading files one by one, global search, hand-drawn architecture diagrams,
          or asking a general coding assistant for scattered explanations.
        usage_reason_zh: 推断：它把整仓库一次性交给模型生成可交互结构图，省去开发者自己逐层梳理调用关系这一步，接手遗留系统的团队在需要快速定位改动范围时会选择它；尚无留存或付费证据。
        usage_reason_en: 'Inference: it hands the whole repository to a model to produce an interactive
          structural map, removing the step of manually tracing call relationships layer by layer; teams
          inheriting legacy systems would choose it when they need to locate change scope quickly. No
          retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决接手陌生代码库时理解模块连接与改动影响的需求，痛点是阅读与追调用链耗时，旧做法明确。
        evidence_ids:
        - ev-93e9d64279622b90
        - ev-a456bd6157850900
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数持续上升，属关注度信号，缺少用户反馈或采用案例说明真实使用场景。
        evidence_ids:
        - ev-a456bd6157850900
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或商业交付路径，买方与收入模式不明。
        evidence_ids:
        - ev-93e9d64279622b90
      - gate: truth
        status: insufficient
        reason: 依赖 Claude 或 Codex 生成结构图，准确性与人工复核边界未在材料中说明，交付确定性待核验。
        evidence_ids:
        - ev-93e9d64279622b90
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对生成结构图准确性、可交互程度和实际使用场景的反馈。
