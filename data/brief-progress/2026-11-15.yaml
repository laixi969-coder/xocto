  dsh-see-now:
    slug: dsh-see-now
    name: dsh-see-now
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - software and IT services
    jobs:
    - 开发者或自动化使用者需要在长时间运行的桌面任务中，让模型持续读取屏幕画面并判断当前状态时，处理连续变化的界面帧并控制送入模型的图像量
    jobs_en:
    - Developers or automation users who need a model to continuously read the screen and judge the current
      state during long-running desktop tasks, handling continuously changing interface frames while limiting
      the volume of images sent to the model
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向需要让模型持续读取桌面画面的开发者：它按画面变化量筛选帧，再把多帧拼成一张图送入模型，静止画面几乎不消耗 token。用户拿到的是可接入自己流程的屏幕观察组件；具体接入方式与交付形态仍待核验。
    inspiration: 趋势是让模型持续感知桌面状态，成本瓶颈从模型能力转到“送多少帧”。切入可放在需要长时间盯屏的重复操作场景，如客服工单、后台对账、测试回放，按节省的图像调用量或按任务结果收费；目前只有开源关注度，尚无付费与留存证据。
    summary_en: 'For developers who need a model to keep reading the desktop screen: it filters frames
      by how much the picture changed and tiles several frames into one image before sending them to the
      model, so a static screen costs almost no tokens. Users get a screen-observation component they
      can wire into their own pipeline; the exact integration and delivery form still need verification.'
    inspiration_en: The trend is continuous model awareness of desktop state, where the cost bottleneck
      shifts from model capability to how many frames get sent. An entry point is long screen-watching
      repetitive work such as support tickets, back-office reconciliation or test replay, charged by saved
      image calls or by task outcome; currently there is only open-source attention, with no payment or
      retention evidence.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或自动化使用者需要在长时间运行的桌面任务中，让模型持续读取屏幕画面并判断当前状态，处理连续变化的界面帧并控制送入模型的图像量。
        job_en: Developers or automation users need a model to continuously read the screen and judge
          the current state during long-running desktop tasks, handling continuously changing interface
          frames while limiting the volume of images sent to the model.
        pain_zh: 逐帧把屏幕截图送进模型会迅速推高图像 token 成本，静止画面重复传输尤其浪费；不解决则长时间盯屏的自动化任务在成本上不可行。
        pain_en: Sending every screen frame to a model quickly raises image-token cost, and resending
          static screens is especially wasteful; without a fix, long screen-watching automation is not
          viable on cost.
        current_alternative_zh: 现有做法是定时截屏后整帧送入模型，或由人手动观察屏幕再操作，前者成本高，后者无法持续。
        current_alternative_en: The current approach is periodic full-frame screenshots sent to a model,
          or a person watching the screen and acting manually; the former is costly and the latter cannot
          run continuously.
        usage_reason_zh: 推断：相较定时整帧截屏，它先按变化量筛掉静止帧，再把多帧拼成一张图，减少送入模型的图像数量，因此长时间运行的桌面自动化使用者会在意图像成本时选择它；尚无用户反馈或客户案例证实这一动机。
        usage_reason_en: 'Inference: compared with periodic full-frame screenshots, it first drops static
          frames by change amount and tiles several frames into one image, cutting the number of images
          sent to the model, so users running long desktop automation who care about image cost would
          choose it; no user feedback or customer case yet confirms this motive.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长时间桌面任务中模型持续读屏的图像成本问题，痛点是逐帧传输浪费 token，旧做法是定时整帧截屏或人工盯屏，结构上成立。
        evidence_ids:
        - ev-61bd5d41e0239be6
        - ev-2f0448f4f5dbfaf8
      - gate: consensus
        status: insufficient
        reason: 只有开源仓库关注度随时间上升，没有用户评价、客户案例或采用场景说明，无法判断是否形成使用共识。
        evidence_ids:
        - ev-2f0448f4f5dbfaf8
      - gate: model
        status: insufficient
