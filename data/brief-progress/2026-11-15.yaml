  crommacode:
    slug: crommacode
    name: CrommaCode
    decision: watching
    event_summary_zh: CrommaAI 于 2026 年 11 月 12 日上线 CrommaCode，一个把 Claude Code、Codex、Gemini CLI、Cursor
      CLI 或 OpenCode 的运行过程以游戏化界面呈现、并可派发多个工作代理的 IDE，宣称对 macOS、Windows、Linux 免费；仓库收藏数为 50。
    event_summary_en: CrommaAI launched CrommaCode on 2026-11-12, an IDE that renders Claude Code, Codex,
      Gemini CLI, Cursor CLI or OpenCode runs as a game and can dispatch a swarm of worker agents, stated
      as free for macOS, Windows and Linux; the repository has 50 stars.
