  ai-video-factory:
    slug: ai-video-factory
    name: AI-Video-Factory
    decision: watching
    event_summary_zh: 该开源仓库自述可从单一选题生成完整的多语言 YouTube 视频，由 Claude 代理完成写作、规划、绘图与审校，并保留人工在 Studio 中把关；仓库星标从
      2026-11-10 记录的 232 增至 2026-11-15 的 439，但未提供用户案例、付费或留存数据。
    event_summary_en: The open-source repository describes turning a single topic into a finished multilingual
      YouTube video, with Claude agents handling writing, planning, drawing and review while a human stays
      in control in a Studio; repository stars rose from 232 recorded on 2026-11-10 to 439 on 2026-11-15,
      with no user cases, payment or retention data provided.
