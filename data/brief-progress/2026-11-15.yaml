      through its platform to run inference tasks. The new fact is its second data breach in weeks, involving
      customer chat transcripts and other data; the exact scope and remediation still need verification.
    inspiration_en: Scarce inference capacity keeps customers from leaving after a security incident,
      showing that competition at the infrastructure layer has shifted from price to supply certainty;
      the opening is multi-model routing and isolated deployment for compliance-sensitive industries,
      not another general inference platform.
