      handles screenshots or raw DOM, and Saccade aims to supply live semantic browser state for the agent
      to read and act on. The input format, delivery interface and human confirmation step still need
      verification.'
    inspiration_en: The trend is agents needing a layer that understands web pages instead of consuming
      pixels and DOM directly. An entry point could be old workflows with high accuracy demands, such
      as price comparison or back-office form filling, charged on verifiable task completion; but the
      repository currently offers only a one-line description and little discussion, with mechanism and
      delivery unexpanded.
