    open_source: true
    summary_zh: 丹麦家庭在每周线上采购时，把想买的商品交给 AI 助手，由它调用 nemlig.com、BilkaToGo、Rema1000 的接口搜索同款、加入购物车并比较价格；用户最终自己核对并完成付款。具体比价口径与交付细节仍待核验。
    inspiration: 趋势：日常采购的比价与凑单正从人肉开多个 App 切到由助手代跑。切入：先做丹麦这类线上杂货渗透高、连锁集中的小市场，从“每周固定清单”这一高频环节进入，可向家庭订阅或向零售商收导流费，价格未披露。
