    - 开发团队在私有部署的聊天频道里让 AI 代理调用工具与浏览器完成重复任务，并保留人工审批记录
    jobs_en:
    - Engineering teams assign recurring tasks such as code review and document lookup to persistent AI
      agents inside a self-hosted chat workspace and approve their actions in-channel
    - Development teams let AI agents call tools and a browser to finish repetitive tasks in a privately
      deployed chat workspace while keeping an approval trail
    regions: []
