        - ev-525cd3ff7a4cb002
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标从 42 缓慢升至 46，属于关注度而非采用证据，没有用户评价或使用场景描述。
        evidence_ids:
        - ev-6e1a9050a0a62311
        - ev-bce98fcfe7782863
        - ev-0e72e370fd87b51d
        - ev-525cd3ff7a4cb002
      - gate: model
        status: insufficient
        reason: 仓库未披露定价、付费路径或买方，开源插件形态下钱可能来自订阅或内容平台采购，这是判断不是已验证事实。
        evidence_ids:
        - ev-525cd3ff7a4cb002
      - gate: truth
        status: insufficient
        reason: 同步播放与悬浮窗出声的承诺能否稳定交付、解释是否贴近剧情，缺少可复现实测与用户反馈。
        evidence_ids:
