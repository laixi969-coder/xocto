      Bot 的服务端方案，并附带 Windows、macOS、iOS 客户端补丁及一个非官方 Android 应用；仓库星标从 41 增至 49。
    event_summary_en: On 9 November 2026, developer ferretgeek published the prokbot-plus repository,
      offering a self-hosted Grok Bot server for x86_64 and ARM64 Linux, plus Windows, macOS and iOS client
      patches and an unofficial Android app; repository stars rose from 41 to 49.
    category: 通用助手
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
