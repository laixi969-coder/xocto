      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 直播运营或小商家在夜间、低峰或人手不足时，需要让直播间保持在线和互动，用 AI 主播承接语音、形象、聊天回复和发帖。
        job_en: Live-stream operators or small merchants need to keep a stream online and interactive
          at night, during off-peak hours or when short-staffed, using an AI host for voice, avatar, chat
          replies and posts.
        pain_zh: 真人主播排班成本高、无法长时间在线，低峰时段停播会损失曝光和互动；这是从直播运营的排班与人力约束推导出的痛点，公开材料未给出用户抱怨。
        pain_en: Human hosts are costly to schedule and cannot stay online for long, and going offline
          in off-peak hours loses exposure and interaction; this pain is inferred from live-stream scheduling
          and staffing constraints, not from published user complaints.
        current_alternative_zh: 真人主播轮班、录播循环、或购买商业虚拟主播服务；open-yoki 的差异是单服务器自托管。
        current_alternative_en: Rotating human hosts, looping recorded streams, or buying commercial virtual-host
          services; open-yoki differs by being self-hosted on a single server.
        usage_reason_zh: 推断：相较真人轮班或录播循环，它把语音、形象、聊天记忆和发帖放在一台服务器上运行，运营者不必为每个时段安排真人，也能让直播间在低峰时段继续回复观众；是否真的被长期留在工作流中，缺少留存或客户案例证据。
        usage_reason_en: 'Inference: compared with human shifts or looping recordings, it runs voice,
          avatar, chat memory and posting on one server, so operators need not staff every time slot and
          the stream can keep replying to viewers in off-peak hours; whether it stays in workflows long
          term lacks retention or customer-case evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决低峰与无人值守时段直播间停播、互动中断的问题，痛点是排班成本与在线时长约束；买方与付费路径尚未公开。
        evidence_ids:
        - ev-e8ff91294b2feab7
        - ev-742f36dfd06d8754
      - gate: consensus
        status: insufficient
        reason: 只有仓库关注度随时间小幅上升，没有用户评价、客户案例或平台采用证据，无法判断运营者是否真的把它用于开播。
        evidence_ids:
        - ev-e8ff91294b2feab7
        - ev-742f36dfd06d8754
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或收费方式，钱可能来自商家自建、代运营服务或后续托管，均属推断而非已验证事实。
        evidence_ids:
        - ev-742f36dfd06d8754
      - gate: truth
        status: insufficient
        reason: 平台对 AI 主播的标注与合规要求、观众接受度、人工接管边界均未在材料中出现，交付能否稳定发生尚不清楚。
        evidence_ids:
        - ev-e8ff91294b2feab7
      next_validation: 收集该仓库的 README、部署文档与 issue/discussion，确认实际开播流程、平台合规说明与人工接管方式。
