      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 数据分析师或业务运营在让 AI 代理生成指标与查询时，处理数据表结构与语义定义，要产出可用且口径一致的分析结果。
        job_en: Analysts or business operators, when having an AI agent generate metrics and queries,
          work from table schemas and semantic definitions to produce usable, consistently defined analytics.
        pain_zh: 代理不理解业务口径时会生成错误指标或错配字段，分析师需逐条核对并返工，错误成本落在下游报表与决策上。
        pain_en: When agents do not understand business definitions they produce wrong metrics or mismatched
          fields, forcing analysts to check and rework each one, with error costs landing on downstream
          reports and decisions.
        current_alternative_zh: 目前多由分析师手写 SQL 与指标定义，或在提示词中手工粘贴口径说明，再人工复核代理输出。
        current_alternative_en: Today analysts mostly hand-write SQL and metric definitions, or paste
          definitions into prompts manually, then review agent output by hand.
        usage_reason_zh: 推断：相较手工粘贴口径，它把语义定义作为代理可读取的输入层，减少反复解释口径与逐条纠错这一步；但错误减少 25% 的基线未公开，尚不能确认实际改善幅度。
        usage_reason_en: 'Inference: compared with pasting definitions by hand, it supplies semantic definitions
          as an input layer the agent can read, cutting the step of re-explaining definitions and correcting
          each error; however the baseline for the 25% reduction is undisclosed, so the actual improvement
          cannot yet be confirmed.'
      gates:
      - gate: value
