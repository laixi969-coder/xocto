  ai-video-edit-workflow:
    slug: ai-video-edit-workflow
    name: ai-video-edit-workflow
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 内容创作
    - 视频营销
    industries_en:
    - content creation
    - video marketing
    jobs:
    - 短视频创作者或营销人员在拿到原始素材后，填写表单生成剪辑简报，让命令行代理分析视频并合成带特效、音乐与转场的成片
    jobs_en:
    - Short-video creators or marketers who, after receiving raw footage, fill a form to generate an editing
      brief and let a command-line agent analyze the video and assemble a cut with effects, music and
      transitions
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 短视频创作者或营销人员拿到原始素材后，先填一张表单生成剪辑简报，再由 Claude Code、Codex 或 Gemini CLI 这类命令行代理分析视频，调用 Remotion
      透明图层与 ffmpeg 合成带 25 种特效、镜头检测和音乐的成片。用户最终拿到一条自动剪好的视频，但具体交付质量与人工复核环节仍待核验。
    inspiration: 趋势：视频剪辑正从“人拖时间线”转向“写简报、代理执行”的批处理形态，剪辑师的角色被推向审片与定调。切入：从电商商品视频、本地商家探店片这类量大、模板化、单条预算低的素材切入，按条收费或按批量打包，先做“简报→成片→人工过一遍”的半自动流水线，而不是抢专业影视后期。
    summary_en: After receiving raw footage, short-video creators or marketers fill a form to generate
      an editing brief; a command-line agent such as Claude Code, Codex or Gemini CLI then analyzes the
      video and uses Remotion transparent layers plus ffmpeg to assemble a cut with 25 effects, shot detection
      and music. The user gets an auto-edited video, though delivery quality and the human review step
      still need verification.
    inspiration_en: 'Trend: video editing is shifting from dragging a timeline to writing a brief and
      letting an agent batch-execute, pushing editors toward review and tone-setting. Entry: start with
      high-volume, template-like, low-budget-per-clip footage such as e-commerce product videos or local-merchant
      promos, charging per clip or per batch, building a semi-automatic brief-to-cut pipeline with a human
      pass rather than competing in professional post-production.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 短视频创作者或营销人员在拿到原始素材后，需要快速产出一条带特效、音乐和转场的成片用于投放或发布。
        job_en: Short-video creators or marketers need to quickly produce a finished clip with effects,
          music and transitions from raw footage for publishing or ads.
        pain_zh: 手工在剪辑软件里逐段切、加转场、配乐、套特效，单条耗时且重复；批量素材时人力跟不上。
        pain_en: Manually cutting, adding transitions, scoring and applying effects clip by clip in editing
          software is slow and repetitive; human capacity cannot keep up with batch footage.
        current_alternative_zh: 用剪映、Premiere 等剪辑软件手工操作，或外包给剪辑师按条付费。
        current_alternative_en: Manual work in editors like CapCut or Premiere, or outsourcing to editors
          paid per clip.
        usage_reason_zh: 推断：用户填一张表单生成简报，代理自动完成镜头检测、特效叠加与音轨合成，省去逐段手动剪辑这一步，因此批量出片、预算有限的创作者会在素材多、模板化程度高时选择它；公开材料尚无留存或付费证据。
        usage_reason_en: 'Inference: users fill a form to generate a brief and the agent automatically
          handles shot detection, effect overlay and audio assembly, removing the manual clip-by-clip
          step, so budget-limited creators producing at volume would choose it when footage is plentiful
          and template-like; public materials show no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决从原始素材到带特效成片的重复剪辑任务，痛点明确且旧流程可指认；交付质量与人工复核边界尚不清楚。
        evidence_ids:
        - ev-3f03fc02c8ac9326
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 41 缓慢增至 61，属关注度信号，不能证明持续采用或强场景共识。
        evidence_ids:
        - ev-6869f11a1d32c987
        - ev-3f03fc02c8ac9326
      - gate: model
        status: insufficient
        reason: 未见定价页、付费路径或买方说明；开源项目可能靠服务或托管收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-3f03fc02c8ac9326
      - gate: truth
        status: insufficient
        reason: 依赖通用命令行代理与 ffmpeg 拼装，模型能力可被抹平；成片是否达到可发布标准、人工返工量多大均无公开证据。
        evidence_ids:
        - ev-3f03fc02c8ac9326
      next_validation: 收集该仓库的 issue 与 discussion，查看用户实际反馈的成片质量、返工环节与使用频率。
