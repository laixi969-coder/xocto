        current_alternative_zh: 开发者手动截断对话、重开会话，或依赖模型自带的上下文压缩。
        current_alternative_en: Developers manually truncate conversations, restart sessions, or rely
          on built-in context compaction.
        usage_reason_zh: 推断：它把压缩放在已完成轮次上并保留前缀缓存，减少手工截断这一步，同时避免缓存失效带来的重复计算，因此长会话开发者会尝试它。
        usage_reason_en: 'Inference: it compresses finished turns while keeping the prefix cache, removing
