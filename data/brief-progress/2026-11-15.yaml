    summary_zh: 开发者在长时间编码对话中打开它，处理不断膨胀的上下文材料；它把已完成的对话轮次就地压缩并保留前缀缓存，让后续调用继续复用缓存。用户最终拿到更短的上下文与更低的重复计算，具体压缩质量与交付流程仍待核验。
