    summary_zh: 面向需要让 AI 代理操作网页的开发者：它由一个 MCP 服务器和一个 Chromium 扩展组成，让代理接入用户已登录的真实浏览器，在页面上执行操作。用户最终拿到的是代理在真实浏览器中完成的页面动作或读取结果；具体支持哪些站点、失败后如何人工接管，仍待核验。
    inspiration: 趋势是 AI 代理从调用 API 转向直接操作真实浏览器，登录态和会话成为新的接入点。切入可从电商后台、SaaS 运营后台这类需要登录的重复网页操作入手，按任务或按席位向运营团队售卖，而不是只做开发者插件。
    summary_en: 'For developers who need AI agents to operate web pages: it consists of an MCP server
      and a Chromium extension that let an agent attach to the user''s real, already-logged-in browser
      and act on pages. The deliverable is the page action or data read performed in that real browser;
      which sites are supported and how humans take over on failure still need verification.'
    inspiration_en: The trend is agents moving from calling APIs to operating real browsers, making login
      state and sessions the new integration point. An entry could target repetitive logged-in web operations
      in e-commerce or SaaS admin consoles, sold per task or per seat to operations teams rather than
      as a developer-only plugin.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
