  cheap-ag-2:
    slug: cheap-ag-2
    name: cheap-ag
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code 或 Codex 的开发者遇到订阅额度上限时，把编码任务交给更便宜的模型生成代码，再由测试决定哪些改动可以合入
    jobs_en:
    - Developers using Claude Code or Codex who hit subscription usage limits route coding tasks to a
      cheaper model to generate code, then let tests decide which changes ship
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 或 Codex 的开发者，在订阅额度用尽、任务被限流时打开它：它把编码任务交给一个更便宜的模型逐行生成代码，再由测试结果决定哪些改动可以合入，用户拿到的是通过测试的代码改动，而不是模型对话。具体如何接入现有仓库、测试如何判定、人工复核边界仍待核验。
    inspiration: 趋势：编码代理的订阅额度成了新的成本瓶颈，围绕“额度套利”的中间层开始出现。切入：面向被额度卡住的小团队开发者，卖的是“按通过测试的改动计费”的编码外包层，而不是再做一个编码助手；但这类套利层依赖上游定价与条款，先要确认它是否合规可持续。
    summary_en: 'Developers using Claude Code or Codex open it when subscription limits are hit: it routes
      coding tasks to a cheaper model that writes code line by line, and test results decide which changes
      ship, so the user gets test-passing code changes rather than a chat. How it plugs into existing
      repos, how tests gate merges, and where humans must review remain unverified.'
    inspiration_en: 'Trend: coding-agent subscription quotas have become a new cost bottleneck, spawning
      arbitrage layers around them. Entry: sell to small teams blocked by quotas, charging per test-passing
      change rather than shipping another coding assistant; but such arbitrage depends on upstream pricing
      and terms, so compliance and durability need checking first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 或 Codex 的开发者，在订阅额度触顶、编码任务被限流时，把具体编码任务交给更便宜的模型生成代码，再由测试决定哪些改动可以合入。
        job_en: Developers on Claude Code or Codex, when subscription quotas are exhausted and coding
          tasks are throttled, hand specific coding tasks to a cheaper model to generate code, then let
          tests decide which changes ship.
        pain_zh: 编码代理的订阅额度有限，额度用尽后任务中断，开发者要么等额度重置，要么升级更贵的套餐，编码节奏被打断。
        pain_en: Coding-agent subscriptions have finite quotas; once exhausted, tasks stall and developers
          must wait for reset or upgrade to pricier plans, breaking their coding rhythm.
        current_alternative_zh: 旧做法是等额度重置、升级套餐，或手动切换到更便宜的模型并自行检查生成代码是否正确。
        current_alternative_en: The old way is waiting for quota reset, upgrading plans, or manually switching
          to a cheaper model and checking generated code by hand.
        usage_reason_zh: 推断：相较手动切换模型并逐段自查，它把“便宜模型生成、测试判定合入”串成一个动作，减少开发者逐行核对生成代码的负担；被额度卡住、又有现成测试的开发者会因此选择它。
        usage_reason_en: 'Inference: versus manually switching models and self-checking each block, it
          chains cheap-model generation with test-gated merges into one action, cutting the burden of
          line-by-line review; developers blocked by quotas who already have tests would pick it for that.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理额度用尽后任务中断的问题，痛点是刚性的；用测试判定合入让交付结果可核对，但接入与复核边界仍待核验。
        evidence_ids:
        - ev-894bb737134166c3
        - ev-88d82abb67bfa40e
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 317 缓慢增至 331，属关注度而非采用证据；没有用户反馈或客户案例说明开发者已把它留在工作流里。
        evidence_ids:
        - ev-894bb737134166c3
        - ev-88d82abb67bfa40e
      - gate: model
        status: insufficient
        reason: 公开材料未说明收费方式与买方；若靠转卖更便宜模型的 token 差价，则接近模型聚合，付费路径与可持续性不明。
        evidence_ids:
        - ev-894bb737134166c3
      - gate: truth
        status: insufficient
        reason: “测试决定合入”能否确定性交付、是否依赖上游条款允许，公开材料未给出；需核验其与上游服务条款的合规性。
        evidence_ids:
        - ev-894bb737134166c3
        - ev-6b63fc8492e1de37
      next_validation: 收集 cheap-ag 官方仓库的 README 与 issue/discussion，核验其接入方式、测试判定流程及是否说明与上游模型服务条款的合规边界。
