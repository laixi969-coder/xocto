        job_zh: 独立游戏关卡美术在灰盒阶段需要为整关铺贴图，把灰盒和相机规划交给工具，拿到带阴影的 glTF 关卡资产；动画师在无动捕设备时用双机位视频换取 GLB 骨骼动画。
