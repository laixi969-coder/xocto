  resend:
    slug: resend
    name: Resend
    decision: queued
    event_summary_zh: 2026年11月的一档独立播客讨论了一项 AEO 研究：在研究者可提取的 102 次邮件服务推荐中，Claude Code 有 64 次首选 Resend，SendGrid
      仅 7 次首选但作为备选出现 55 次；Resend 首席执行官 Zeno Rocha 自 2024 年起公开讨论 AEO。Resend 另被列入 Madrona 2026 Intelligent
      Applications 40 早期阶段名单。
    event_summary_en: A November 2026 independent podcast discussed an AEO study in which Claude Code
      picked Resend first in 64 of 102 extractable email recommendations, while SendGrid was first seven
      times but appeared as an alternative 55 times; Resend CEO Zeno Rocha has publicly discussed AEO
      since 2024. Resend was also named to Madrona's 2026 Intelligent Applications 40 early-stage list.
    category: AI + 开发
    project_type: new_application
    industries:
    - 软件与互联网服务
    - 开发者工具
    industries_en:
    - Software and Internet Services
    - Developer Tools
    jobs:
    - 开发者在给应用接入事务性邮件时，让编码代理生成发送代码并选择邮件服务商，需要代理给出可直接落地的集成方案
    - 开发者在排查邮件送达与域名配置时，需要按文档完成 DNS 与 API 配置并确认发送结果
    jobs_en:
    - When adding transactional email to an app, a developer asks a coding agent to generate sending code
      and pick an email provider, needing an integration the agent can implement directly
    - When troubleshooting email delivery and domain setup, a developer follows documentation to configure
      DNS and the API and confirm sending results
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 开发者在给应用接入事务性邮件时，编码代理会读取 Resend 的文档与接口并生成发送代码，开发者拿到可运行的集成方案后再自行配置域名与密钥并确认送达。它把过去在多个邮件服务商文档间比对、手写
      SDK 调用的环节，压缩为代理直接给出可采纳的补丁；具体流程与交付仍待核验。
    inspiration: 趋势是编码代理开始替开发者做选型，文档能否被代理读懂、能否一次生成可运行代码，正在成为开发者基础设施的分发入口。切入可面向需要被代理推荐的 API 与 SaaS 供应商，卖“让代理首选你”的文档与示例改造服务；也可从邮件之外的事务性接口切入，但需先核验代理推荐与实际采用之间的转化。
    summary_en: When a developer adds transactional email to an app, a coding agent reads Resend's documentation
      and API and generates sending code; the developer receives a runnable integration, then configures
      domains and keys and confirms delivery. It compresses the old step of comparing several providers'
      docs and hand-writing SDK calls into a patch the agent can adopt directly; the exact workflow and
      delivery still need verification.
    inspiration_en: The trend is coding agents making vendor choices for developers, so whether docs can
      be read by an agent and turned into runnable code is becoming a distribution channel for developer
      infrastructure. The entry point is serving API and SaaS vendors who need to be agent-recommended,
      selling documentation and example rewrites that make an agent pick them first; adjacent transactional
      APIs are possible, but the link between agent recommendation and actual adoption needs verification.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在给应用接入事务性邮件时，让编码代理生成发送代码并选择邮件服务商，需要代理给出可直接落地的集成方案。
        job_en: When adding transactional email to an app, a developer asks a coding agent to generate
          sending code and pick an email provider, needing an integration the agent can implement directly.
        pain_zh: 邮件服务商的文档、SDK 与域名配置分散，开发者要逐个比对并手写调用；代理若推荐了文档不完整的服务商，开发者还要回头返工。
        pain_en: Provider docs, SDKs and domain setup are scattered, so developers compare them and hand-write
          calls; if an agent recommends a provider with incomplete docs, the developer has to redo the
          work.
        current_alternative_zh: 开发者自行搜索并阅读 SendGrid、Postmark 等服务商文档，手写 SDK 调用，或沿用公司已有的邮件服务。
        current_alternative_en: Developers search and read docs from SendGrid, Postmark and others, hand-write
          SDK calls, or stay with the company's existing email service.
        usage_reason_zh: 推断：相较逐个翻文档再手写调用，Resend 的文档与示例能被编码代理直接读取并生成可运行代码，减少开发者比对与试错这一步，因此让代理代写集成的开发者会在选型时倾向它；代理推荐是否转化为实际采用仍缺公开证据。
        usage_reason_en: 'Inference: rather than reading each provider''s docs and hand-writing calls,
          Resend''s docs and examples can be read by a coding agent to produce runnable code, removing
          a comparison and trial step, so developers who delegate integration to an agent may lean toward
          it; public evidence that agent recommendations convert into adoption is still missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者接入事务性邮件时比对文档、手写调用的负担，旧流程明确且不采用会拖慢上线；买方是使用邮件服务的开发团队。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: consensus
        status: insufficient
        reason: 只有一档播客转述的代理推荐研究，缺少开发者实际采用与持续使用的公开数据。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与付费结构，买方可能是开发团队按发送量付费，但这是判断而非已验证事实。
        evidence_ids:
        - ev-9b623a318120e7c8
      - gate: truth
        status: supported
        reason: 邮件送达与域名配置可核对，代理生成的代码需开发者确认后上线，交付边界清楚。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      next_validation: 收集 Resend 官方定价页与公开客户案例，核对按发送量计费的档位及企业采用情况。
