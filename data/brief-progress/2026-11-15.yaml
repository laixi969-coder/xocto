        evidence_ids:
        - ev-0f6b9060899f35ae
        - ev-c473e8d2a5c103a3
      - gate: model
        status: insufficient
        reason: 免费开源，未见付费路径或按结果收费设计；买方可能是小团队订阅或托管服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-0f6b9060899f35ae
      - gate: truth
        status: insufficient
        reason: 自行试玩能否稳定覆盖玩法回归、diff 是否可审阅，公开材料未给出实测或案例，交付确定性待核验。
