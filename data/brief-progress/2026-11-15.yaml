          synced to playback, to keep up with the plot or lesson.
        pain_zh: 独自看长视频时，遇到看不懂的镜头或台词只能暂停、回看或另开搜索，理解被打断；现有字幕只给文字，不解释画面。
        pain_en: Watching a long video alone, a viewer who misses a shot or line must pause, rewind or
          open a separate search, breaking comprehension; existing subtitles give text but do not explain
          the image.
        current_alternative_zh: 旧做法是暂停回看、开弹幕或另开搜索查剧情，或干脆放弃理解继续看。
        current_alternative_en: The old way is to pause and rewind, read danmaku comments, search separately
          for plot explanations, or simply give up and keep watching.
        usage_reason_zh: 推断：相较暂停回看和另开搜索，它把分镜画面与带秒台词按播放位置自动交给智能体并在悬浮窗出声，省去用户自己截取片段和描述画面的步骤，因此独自看长视频且需要即时解释的人会尝试它；尚无用户反馈证明持续使用。
        usage_reason_en: 'Inference: compared with pausing, rewinding and searching separately, it automatically
          hands the storyboard image and time-stamped lines to an agent by playback position and speaks
          in a floating window, removing the step of capturing clips and describing images, so people
          watching long videos alone who need instant explanation may try it; no user feedback yet shows
          sustained use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决独自看长视频时理解被打断的问题，痛点具体，交付是按播放进度同步的语音解释；但解释是否准确尚未核验。
