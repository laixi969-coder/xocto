      demand_read:
        job_zh: 教研员或学校教学管理者在听评课与教研活动后，处理课堂记录与教学材料，要形成可追溯、可复用的教研结论。
        job_en: Teaching-research staff or school instructional leaders process classroom records and
          teaching materials after lesson observation to form traceable, reusable teaching-research conclusions.
        pain_zh: 传统教研依赖听课笔记与主观评议，结论难以追溯，跨课例复用成本高。
        pain_en: Traditional teaching research relies on observation notes and subjective commentary,
          making conclusions hard to trace and costly to reuse across lessons.
        current_alternative_zh: 人工听课记录、纸质评课表与教研会口头讨论。
        current_alternative_en: Manual observation notes, paper evaluation forms, and verbal discussion
          in teaching-research meetings.
        usage_reason_zh: 推断：若系统能把课堂记录自动整理为带证据的教研结论，可减少教研员手工整理与回溯的步骤，因此区县教研室或学校教研组在常规听评课后可能选用；实际采用尚未核验。
        usage_reason_en: 'Inference: if the system can automatically turn classroom records into evidence-backed
          teaching-research conclusions, it reduces manual organizing and tracing work for teaching-research
          staff, so district offices or school research groups may adopt it after routine lesson observation;
          actual adoption is unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决教研结论难追溯、难复用的问题，痛点具体；但材料未说明系统具体接收与输出什么。
        evidence_ids:
        - ev-880be68ae9d54797
      - gate: consensus
        status: insufficient
        reason: 仅有发布报道，未见学校或教研机构的采用与评价。
        evidence_ids:
        - ev-880be68ae9d54797
      - gate: model
        status: insufficient
        reason: 买方可能是学校或教育主管部门，但材料未披露定价与采购方式，这是判断不是事实。
        evidence_ids:
        - ev-880be68ae9d54797
      - gate: truth
        status: insufficient
        reason: 循证教研的交付是否确定、人工复核边界如何，材料未说明。
