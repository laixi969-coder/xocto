          especially tedious; handing the phone to a fully automatic agent risks losing control without
          a controllable human confirmation step.
        current_alternative_zh: 目前多靠手动操作手机，或用桌面端自动化脚本、手机自动化测试工具，但这些通常面向开发者、配置门槛高，且缺少人工在环确认。
        current_alternative_en: Today people mostly operate phones by hand, or use desktop automation
          scripts and mobile test-automation tools, which are usually developer-oriented, hard to configure
