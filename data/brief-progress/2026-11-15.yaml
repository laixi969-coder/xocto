    regions_en:
    - Global
    open_source: true
    summary_zh: 普通网民在浏览社交媒体或新闻网页时，扩展在本地对页面上的图片和视频做 AI 生成判定并就地标注，用户拿到一个可疑提示，是否采信仍需自己判断。具体检测准确率、误报情况和标注呈现方式仍待核验。
    inspiration: 趋势：AI 生成图像和视频进入日常信息流后，普通读者对“这张图是不是真的”的判断成本上升，检测能力正从平台后台走向用户端。切入：可从新闻事实核查、二手交易与房产挂牌图片审核这类对图片真实性有直接利益的人群切入，按核查次数或机构席位收费；但检测准确率与误报率是这类产品能否被信任的前提，需先核验。
    summary_en: When ordinary users browse social media or news pages, the extension runs on-device checks
      on page images and video and flags likely AI-generated content in place; the user gets a suspicion
      signal and still decides whether to trust it. Detection accuracy, false-positive behavior and how
      flags are displayed remain to be verified.
    inspiration_en: 'Trend: as AI-generated images and video enter everyday feeds, judging whether a picture
      is real gets costlier for ordinary readers, and detection is moving from platform backends to the
      user side. Entry: start with news fact-checking, second-hand marketplaces or property-listing image
      review, where image authenticity has direct stakes, and charge per check or per institutional seat;
      detection accuracy and false-positive rates are the precondition for trust and need verification
      first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 普通网民或内容核查人员在浏览网页时遇到可疑图片或视频，需要就地判断其是否为 AI 生成，再决定是否采信或送人工复核。
        job_en: Ordinary users or content reviewers encountering a suspicious image or video while browsing
          need an on-the-spot judgment on whether it is AI-generated before trusting it or sending it
          to manual review.
        pain_zh: AI 生成图像和视频混入信息流后，肉眼判断真假困难，逐张另找检测工具或人工核查耗时，误信会带来误导传播或错误决策。
        pain_en: Once AI-generated images and video mix into feeds, telling real from fake by eye is hard;
          checking each item with a separate tool or by hand costs time, and misplaced trust spreads misinformation
          or leads to wrong decisions.
        current_alternative_zh: 目前多靠肉眼经验判断、平台自带标注、或把图片另存后上传到独立检测网站逐张核验。
        current_alternative_en: Today people rely on visual intuition, platform-provided labels, or saving
          the image and uploading it to a standalone detection site one by one.
        usage_reason_zh: 相较另开检测网站逐张上传，扩展在浏览页面时就地完成检测并标注，省去保存、切换和上传的步骤；推断对高频浏览可疑素材的核查人员更有吸引力，但检测准确率与误报率尚无公开证据。
        usage_reason_en: Compared with opening a detection site and uploading each image, the extension
          checks and flags content in place while browsing, removing the save-switch-upload steps; by
          inference this appeals to reviewers who frequently scan suspicious material, though public evidence
          on accuracy and false positives is lacking.
      gates:
      - gate: value
        status: supported
        reason: 它解决浏览时判断图片视频是否 AI 生成的需求，痛点是肉眼难辨且逐张另找工具费时，旧替代行为明确。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数这一关注度信号，没有用户反馈或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或机构采购路径，商业模式只能推断。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: truth
        status: insufficient
        reason: 本地检测的准确率、误报率和人工复核边界均未公开，承诺能否确定性交付无法核对。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      next_validation: 收集该开源仓库的 issue、discussion 或官方文档中关于检测准确率、误报率与人工复核边界的公开说明。
  hill-climb:
    slug: hill-climb
    name: Hill-Climb
    decision: watching
    event_summary_zh: 2026年11月2日发布的开源技能，供 Claude Code 与 Codex 使用：每次改动只有在锁定的测试或基准分数变好时才被保留，仓库星标从11月12日的56增至11月15日的136。
    event_summary_en: 'An open-source skill published on 2026-11-02 for Claude Code and Codex: each change
      is kept only if a locked test or benchmark scores better; repository stars rose from 56 on 2026-11-12
      to 136 on 2026-11-15.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 使用编码代理的开发者，在代理声称任务完成后，用锁定的测试或基准复核改动，决定是否保留这次提交
    jobs_en:
    - Developers using coding agents who, after the agent claims a task is done, re-check the change against
      a locked test or benchmark and decide whether to keep the commit
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 或 Codex 的开发者，在代理声称任务完成后，把改动交给 Hill-Climb，由它用事先锁定的测试或基准打分，只有分数变好的改动才被保留，最终得到一份经过分数筛选的提交结果；锁定标准由谁设定、人工复核如何介入，具体流程仍待核验。
    inspiration: 趋势：编码代理开始自己写代码后，“它说做完了”与“真的做对了”之间的验收环节成了新的瓶颈。切入：从对交付结果负责的团队入手，把可量化的验收标准前置成合同式门槛，按通过的改动或验收报告收费，而不是再卖一个编码助手。
    summary_en: Developers using Claude Code or Codex hand each change to Hill-Climb after the agent claims
      the task is done; it scores the change against a pre-locked test or benchmark and keeps only changes
      that score better, yielding a commit set filtered by score. Who sets the locked standard and how
      human review enters the flow still need verification.
    inspiration_en: 'Trend: once coding agents write code themselves, verifying that ''done'' really means
      correct becomes the new bottleneck. Entry: target teams accountable for delivered results, turn
      measurable acceptance criteria into a contract-like gate up front, and charge per accepted change
      or acceptance report rather than selling another coding assistant.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者，在代理声称任务完成后，用锁定的测试或基准复核改动，决定是否保留这次提交。
        job_en: Developers using coding agents who, after the agent claims a task is done, re-check the
          change against a locked test or benchmark and decide whether to keep the commit.
        pain_zh: 编码代理常声称完成，但改动可能让其他功能退化；开发者要逐次人工比对测试结果，判断哪次改动真的更好。
        pain_en: Coding agents often claim completion while a change may regress other behavior; developers
          must manually compare test results each time to judge which change is actually better.
        current_alternative_zh: 开发者自己跑测试、看 diff、凭经验决定是否合并，或直接信任代理的完成声明。
        current_alternative_en: Developers run tests themselves, read diffs and decide by experience whether
          to merge, or simply trust the agent's completion claim.
        usage_reason_zh: 推断：相较人工逐次比对，它把验收标准提前锁定，并在每次改动后自动打分、只保留分数变好的版本，省去开发者判断“这次是否更好”的一步；对频繁使用编码代理、又担心回归的开发者更有吸引力。
        usage_reason_en: 'Inference: instead of manual comparison each time, it locks acceptance criteria
          in advance, scores every change automatically and keeps only versions that score better, removing
          the developer''s step of judging ''is this better''; most attractive to developers who use coding
          agents heavily and worry about regressions.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理声称完成后改动是否真的更好、是否引入回归的验收问题，痛点在频繁使用代理时刚性，交付是经分数筛选的改动集。
        evidence_ids:
        - ev-f257c0bd23f6314e
        - ev-84e206b40e2f20f5
      - gate: consensus
        status: insufficient
        reason: 只有仓库星标增长，没有用户评价或团队采用案例，无法判断开发者是否把它留在工作流里。
        evidence_ids:
        - ev-9742cd784d933573
        - ev-84e206b40e2f20f5
