        - ev-3b41dc5bc460ef24
      - gate: consensus
        status: insufficient
        reason: 星标从60增至125只说明关注度，没有用户评价、案例或重复使用证据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-1fd74b6d91efec23
        - ev-3b41dc5bc460ef24
      - gate: model
        status: insufficient
        reason: 公开材料未说明谁付钱、如何收费，开源项目可能靠捐赠或后续商业化，这是判断而非已验证事实。
        evidence_ids:
        - ev-3b41dc5bc460ef24
      - gate: truth
        status: insufficient
        reason: 无障碍权限代操作涉及隐私与误操作风险，公开材料未见安全边界、人工确认或失败处理说明。
        evidence_ids:
        - ev-1fd74b6d91efec23
