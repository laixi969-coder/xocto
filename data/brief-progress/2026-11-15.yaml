      Work, with Feishu CEO Xie Xin describing agents as "first-class citizens"; reports also said Doubao
      Work launched, with standalone clients becoming common in office scenarios. Feature boundaries,
      pricing and customer adoption are not disclosed in the candidate material.
    category: AI + 效率
    project_type: new_application
    industries:
    - 企业协同办公
    - 软件与信息服务
    industries_en:
    - Enterprise collaboration software
    - Software and IT services
    jobs:
    - 企业员工在飞书内处理文档、消息与任务时，调用智能体完成跨应用的信息整理与待办推进，并自行确认结果
    - 企业管理者在协同办公平台内配置智能体，把重复的审批、汇总与通知流程交给它执行
    jobs_en:
    - Employees working in Feishu on documents, messages and tasks invoke agents to consolidate cross-app
      information and advance to-dos, then confirm results themselves
    - Managers configure agents inside the collaboration platform to run repetitive approval, summary
      and notification flows
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 企业员工在飞书里处理文档、消息和待办时，可以调用与飞书8.0原生融合的豆包工作智能体，由它跨应用整理信息并推进任务，用户再确认结果。具体接收哪些材料、执行哪些动作以及交付形态，候选材料尚未说明，仍需核验。
    inspiration: 趋势是办公套件把智能体当作平台内的一等公民，而不是外挂一个聊天框；切入可考虑从某个具体职能的重复流程（如合同审批汇总、周报归集）做深，卖给已在用协同平台的中型企业，按流程结果而非席位数计价。
    summary_en: When employees handle documents, messages and to-dos in Feishu, they can invoke Doubao
      Work agents natively integrated with Feishu 8.0 to consolidate information across apps and push
      tasks forward, with users confirming results. Which materials it ingests, what actions it performs
      and the delivery format are not described in the candidate material and need verification.
    inspiration_en: The trend is office suites treating agents as first-class citizens inside the platform
      rather than bolting on a chat box; an entry point is to go deep on one function's repetitive flow
      (e.g. contract approval summaries, weekly report roll-ups) and sell to mid-size firms already on
      a collaboration platform, priced by process outcome rather than seats.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业员工在飞书内处理文档、消息与待办时，需要把分散在多个应用里的信息汇总并推进下一步任务，目前由人手动复制、整理和催办。
        job_en: Employees in Feishu handling documents, messages and to-dos need to consolidate information
          scattered across apps and advance the next task, currently done by manual copying, sorting and
          chasing.
        pain_zh: 跨应用信息分散、汇总与催办占用大量时间，遗漏和延迟直接影响协作结果；这是办公场景的刚性摩擦。
        pain_en: Information scattered across apps makes consolidation and follow-up time-consuming, and
          omissions or delays directly hurt collaboration outcomes; this is rigid friction in office work.
        current_alternative_zh: 员工手动在多个应用间复制粘贴、写汇总文档、逐个发消息催办，或使用平台自带的简单自动化规则。
        current_alternative_en: Employees manually copy-paste across apps, write summary documents, message
          people one by one, or use simple built-in automation rules.
        usage_reason_zh: 推断：相较手动汇总，智能体在飞书内直接读取相关文档与消息并生成待办和汇总，减少复制整理这一步；已在飞书办公的团队在跨应用协作频繁时会优先试用，但候选材料未提供用户反馈或留存证据。
        usage_reason_en: 'Inference: versus manual consolidation, the agent reads relevant documents and
          messages inside Feishu and produces to-dos and summaries, cutting the copy-and-sort step; teams
          already on Feishu with frequent cross-app collaboration would try it first, though the candidate
          material offers no user feedback or retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨应用信息汇总与待办推进的刚性摩擦，旧做法是人工复制整理，价值结构成立；买方与付费方式尚不清楚。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: consensus
        status: insufficient
        reason: 仅有媒体报道称飞书与豆包工作融合，缺少用户采用、评价或使用规模数据，共识环节证据不足。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: model
        status: insufficient
        reason: 候选未披露定价、计费方式或买方，无法判断收入来自企业订阅还是平台捆绑，属判断而非已验证事实。
        evidence_ids:
        - ev-3d7dc64ced8edd77
      - gate: truth
        status: insufficient
        reason: 智能体在办公流程中的交付确定性与人工确认边界未说明，缺少可核验的交付结果材料。
        evidence_ids:
        - ev-3d7dc64ced8edd77
      next_validation: 收集豆包工作官方产品页或飞书8.0发布说明，核验其具体功能、定价与人工确认边界。
