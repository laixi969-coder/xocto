  edna:
    slug: edna
    name: EDNA
    decision: watching
    category: 基础层
    project_type: new_application
    industries: []
    industries_en: []
    jobs:
    - 终端用户在本地设备上使用 AI 时，让 AI 感知其在场状态与操作情境，以调整交互
    jobs_en:
    - End users running AI on a local device let the AI sense their presence and operating context to
      adjust the interaction
    regions: []
    regions_en: []
    open_source: false
    summary_zh: EDNA 面向在本地设备上使用 AI 的用户：它在本机采集人的在场与操作信号，交给 AI 作为感知输入，让交互能随用户状态变化。公开材料只给出“100% 端侧人体感知”一句，具体采集哪些信号、如何交付给应用、用户最终拿到什么可核对结果仍待核验。
    inspiration: 趋势：AI 交互正从“用户打字提问”往“设备先感知人”走，端侧感知把隐私成本压到本地。切入：可从需要长时间在屏前工作的岗位（客服、设计、远程协作）切入，卖“在场状态→自动调整提醒与界面”的结果，而非卖传感器
      SDK；具体形态与收费未披露，需先核验。
    summary_en: 'EDNA targets people using AI on a local device: it captures human presence and operating
      signals on-device and feeds them to the AI as perception input so the interaction can respond to
      the user''s state. Public material gives only the line "100% on-device human sensing"; which signals
      are captured, how they reach applications, and what verifiable result the user gets still need checking.'
    inspiration_en: 'Trend: AI interaction is moving from "user types a prompt" toward "the device senses
      the person first," with on-device sensing pushing privacy cost to the local machine. Entry: start
      with roles that sit in front of a screen for long stretches (support, design, remote collaboration)
      and sell the outcome "presence state → auto-adjusted alerts and UI" rather than a sensor SDK; form
      and pricing are undisclosed and need checking.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 本地设备上的 AI 使用者在工作时，让 AI 通过端侧人体感知了解其在场与操作情境，以调整交互。
        job_en: A local-device AI user at work lets the AI learn their presence and operating context
          through on-device human sensing to adjust the interaction.
        pain_zh: 公开材料未说明用户具体卡在哪一步；只能推断：AI 不知道用户是否在场、在做什么，交互需要用户反复手动说明状态。
        pain_en: Public material does not say which step users are stuck on; at most one can infer the
          AI does not know whether the user is present or what they are doing, so users must repeatedly
          state their state by hand.
        current_alternative_zh: 用户手动输入状态、切换模式，或干脆不用感知类功能；公开材料未给出替代做法。
        current_alternative_en: Users type their state manually, switch modes, or skip sensing features
          altogether; public material gives no alternative.
        usage_reason_zh: 推断：若端侧感知能自动把在场状态传给 AI，可省去用户每次手动说明状态这一步；但采集内容、交付方式和可核对结果均未披露，无法确认用户会因此选用。
        usage_reason_en: 'Inference: if on-device sensing automatically passes presence state to the AI,
          it could remove the step of stating state each time; but captured content, delivery and verifiable
          results are undisclosed, so it is unclear users would choose it.'
      gates:
      - gate: value
        status: insufficient
        reason: 只知“端侧人体感知”，说不清用户要完成什么任务、哪一步难受、不解决会失去什么，价值结构无法还原。
        evidence_ids:
        - ev-cf8d6b43cef01dd6
      - gate: consensus
        status: insufficient
        reason: 仅 5 点、1 条评论的社区讨论，不足以说明有人围绕该场景形成共识。
        evidence_ids:
        - ev-cf8d6b43cef01dd6
      - gate: model
        status: insufficient
        reason: 未披露买方、定价或收费方式，无法判断钱从哪来；这是判断，不是已验证事实。
        evidence_ids:
        - ev-cf8d6b43cef01dd6
      - gate: truth
        status: insufficient
        reason: 无法核对感知是否准确、隐私边界如何、交付是否确定发生。
        evidence_ids:
        - ev-cf8d6b43cef01dd6
      next_validation: 收集 EDNA 官方产品页或文档，确认它采集哪些端侧信号、以何种接口交付给应用，以及是否有可复现的演示或使用说明。
  effect-atlas:
