        - ev-8e93543fa7640a55
      - gate: consensus
        status: insufficient
        reason: 只有仓库星标缓慢增长，缺少用户评价、客户案例或社区讨论说明谁在什么场景下持续使用。
        evidence_ids:
        - ev-92bb770a0317a738
        - ev-1a34fb3beb3e2fea
      - gate: model
        status: insufficient
        reason: 开源项目未见定价、付费或采购路径，钱可能来自工作室自建或后续商业版，属判断而非已验证事实。
