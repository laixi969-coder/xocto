      registers multiple views against it, runs map-fitting passes and replays the result in Blender as
      a sculpt measurable against the image; the deliverable is a model editable in Blender, and proportion
      accuracy still needs human checking.
    inspiration_en: 'Trend: the barrier from a single image to a measurable 3D model is falling, shifting
      the front of 3D production from manual modeling to image-driven generation. Entry: target small
      studios doing figurines, tabletop models and e-commerce 3D displays, selling printable models per
      piece rather than software seats; pricing is undisclosed and must be set by the seller.'
