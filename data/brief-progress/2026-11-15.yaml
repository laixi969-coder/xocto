    jobs:
    - 安全工程师或代码审计人员在评估被 BLA 加固混淆过的代码库时，用 LASIK 静态还原可读源码，再交给编码代理或人工审计
    jobs_en:
    - Security engineers or code auditors evaluating a codebase hardened by BLA use LASIK to statically
      restore readable source before handing it to a coding agent or human review
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安全或审计人员在遇到被 BLA（Blind LLM Agents）加固、编码代理读不懂的代码库时，用 LASIK 这个静态命令行工具和 MCP 服务把加固还原成可读源码，再交给编码代理或人工审计；它不执行目标代码。具体还原范围与交付质量仍待核验。
    inspiration: 趋势：编码代理开始被当作代码读者，于是出现专门为“让代理读懂”而做的预处理层。切入：从安全审计、代码尽调这类需要读第三方加固代码的场景进入，按次或按项目卖还原报告，而不是卖通用工具。
    summary_en: When security or audit staff meet a codebase hardened by BLA (Blind LLM Agents) that coding
      agents cannot read, they use LASIK, a static CLI and MCP server, to restore readable source before
      handing it to an agent or human review; it never executes the target. The exact restoration scope
      and output quality remain to be verified.
    inspiration_en: 'Trend: coding agents are now treated as code readers, spawning a preprocessing layer
      built to make code legible to them. Entry: start from security audits and code due diligence that
      must read third-party hardened code, selling a per-case restoration report rather than a generic
      tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师或代码审计人员在评估被 BLA 加固混淆过的代码库时，用 LASIK 静态还原可读源码，再交给编码代理或人工审计。
        job_en: Security engineers or code auditors evaluating a codebase hardened by BLA use LASIK to
          statically restore readable source before handing it to a coding agent or human review.
        pain_zh: 加固后的代码让编码代理和审计人员读不到真实逻辑，人工逐段还原耗时且易漏。
        pain_en: Hardened code hides real logic from coding agents and auditors, and manual piece-by-piece
          restoration is slow and error-prone.
        current_alternative_zh: 人工阅读混淆代码、手写脚本还原，或直接放弃让代理参与审计。
        current_alternative_en: Humans read obfuscated code by hand, write ad-hoc scripts to restore it,
          or simply drop agents from the audit.
        usage_reason_zh: 推断：相较人工逐段还原，LASIK 用静态方式一次性把加固代码转成可读源码且不执行目标，减少了手工还原这一步，因此需要读第三方加固代码的审计人员会在评估时选用它。
        usage_reason_en: 'Inference: versus manual piece-by-piece restoration, LASIK statically converts
          hardened code into readable source in one pass without executing the target, removing the manual
          restoration step, so auditors facing third-party hardened code would pick it during evaluation.'
      gates:
      - gate: value
        status: supported
        reason: 它解决加固代码让代理和审计人员读不懂的问题，痛点具体，不采用则只能人工还原或放弃代理参与。
        evidence_ids:
        - ev-50276d845fb7f4c8
        - ev-eff7cd0455c5a8b8
      - gate: consensus
        status: insufficient
