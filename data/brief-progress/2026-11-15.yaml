    project_type: new_application
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在同时运行多个编码代理时，用游戏化界面观察各代理进度并派发新的工作代理，以完成代码修改任务
    - 开发者在本地安装并配置该 IDE，接入已有的编码代理命令行工具
    jobs_en:
    - Developers running several coding agents at once watch each agent's progress in a gamified view
      and dispatch new worker agents to complete code changes
    - Developers install and configure the IDE locally and connect their existing coding-agent command-line
      tools
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 开发者在同时跑多个编码代理时，原本要在多个终端窗口间切换查看进度；CrommaCode 把这些代理的运行过程收进一个游戏化界面，并允许派发多个工作代理执行编码任务。用户最终得到一个可观察、可派活的代理工作台，具体交付与人工确认环节仍待核验。
    inspiration: 趋势：编码代理从单次对话走向多代理并行，观察和调度这些代理本身成了新界面需求。切入：面向同时使用多个编码代理的独立开发者或小团队，卖代理编排与进度可视化的席位订阅；价格未披露，且该层可能被代理厂商自带界面吞并。
    summary_en: When developers run several coding agents at once, they normally switch between terminal
      windows to check progress; CrommaCode gathers these agent runs into a gamified interface and lets
      users dispatch multiple worker agents on coding tasks. Users end up with an observable, dispatchable
      agent workbench; delivery and human-confirmation steps still need verification.
    inspiration_en: 'Trend: coding agents are moving from single conversations to parallel multi-agent
      runs, making observation and dispatch a new interface need. Entry: target indie developers or small
      teams already using several coding agents with a seat subscription for agent orchestration and progress
      visibility; pricing is undisclosed and agent vendors'' built-in interfaces may absorb this layer.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同时运行多个编码代理时，用游戏化界面观察各代理进度并派发新的工作代理，完成代码修改任务。
        job_en: Developers running several coding agents at once watch each agent's progress in a gamified
          view and dispatch new worker agents to complete code changes.
        pain_zh: 多代理并行时进度分散在多个终端，开发者难以一眼看清谁在做什么、卡在哪一步。
        pain_en: With parallel agents, progress is scattered across terminals, making it hard to see at
          a glance who is doing what and where they are stuck.
        current_alternative_zh: 开多个终端窗口或标签页，逐个切换查看各编码代理的输出。
        current_alternative_en: Open multiple terminal windows or tabs and switch between them to read
          each coding agent's output.
        usage_reason_zh: 推断：把多个代理的运行状态集中到一个界面并支持一键派发，减少在终端间来回切换和手动重述任务的步骤；已同时使用多个编码代理的开发者会在并行任务时选择它，但尚无用户反馈证明其进入日常开发流程。
        usage_reason_en: 'Inference: consolidating several agents'' status into one view with one-click
          dispatch cuts switching between terminals and manually restating tasks; developers already running
          multiple coding agents would pick it for parallel work, but no user feedback yet shows it entering
          daily development routines.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时进度分散、切换终端查看的问题，替代多窗口手动切换，属于具体旧流程改造。
        evidence_ids:
        - ev-c34fa628c8fca205
      - gate: consensus
        status: insufficient
        reason: 仅有 50 个仓库收藏，没有用户评价或讨论说明开发者是否真的用它管理日常代理任务。
        evidence_ids:
        - ev-c34fa628c8fca205
      - gate: model
        status: insufficient
        reason: 宣称免费但未披露后续收费方式，买方可能是个人开发者或小团队，属判断而非已验证事实。
        evidence_ids:
        - ev-c34fa628c8fca205
      - gate: truth
        status: insufficient
        reason: 游戏化界面是否贴近编码任务的第一性目标、派发代理后的人工确认边界，均缺少实测材料。
        evidence_ids:
        - ev-c34fa628c8fca205
      next_validation: 收集该产品官方文档或仓库 issue 中关于多代理派发、人工确认与免费后收费方式的公开说明。
