    summary_en: Developers open it during long coding conversations to handle growing context material;
      it compresses finished turns in place while keeping the prefix cache so later calls can reuse it.
      Users get shorter context and less repeated computation; compression quality and delivery flow still
      need verification.
    inspiration_en: 'Trend: long-session context cost is becoming a daily burden for coding agents, and
      compression is treated as a separate step rather than a built-in model feature. Entry: start with
      teams or agent-framework maintainers running long sessions, charging on saved tokens and cache hits,
      though pricing is undisclosed.'
