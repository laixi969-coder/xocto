      suggestions, with humans still confirming whether changes land. Monitoring scope, deliverable format
      and pricing are not given in the candidate material, so workflow details remain to be verified.
    inspiration_en: The trend is brand budget shifting from traditional search rankings toward being mentioned
      and recommended inside AI answers, where the measured object becomes generated text rather than
      a link. Entry could start with frequently asked consumer categories and local service merchants,
      charging per monitored category or per corrected result; the category already has a high-valuation
      leader, so a generic monitoring product has little window, and the opening is more likely in vertical-specific
      wording correction and content rewrite delivery.
