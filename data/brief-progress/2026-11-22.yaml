      shifting creation from clicking buttons to issuing instructions an agent executes. Entry: start
      with teams that need batches of visuals, such as e-commerce or ad creative, and sell the batch-production
      workflow that connects an agent to an existing generation account rather than another generation
      model; pricing is undisclosed and must not be assumed.'
