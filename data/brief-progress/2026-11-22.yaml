        job_zh: 前端开发者用编码代理生成页面时，需要让代理产出结构合理、视觉可用的界面，并把它变成可交付的前端代码。
        job_en: Front-end developers using coding agents to generate pages need the agent to produce structurally
          sound, visually usable interfaces and turn them into deliverable front-end code.
        pain_zh: 编码代理默认生成的界面往往千篇一律、可用性差，开发者要反复手工修改样式和布局，返工成本高。
