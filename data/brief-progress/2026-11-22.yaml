        - ev-5d76672898b1984c
      - gate: model
        status: insufficient
        reason: 开源技能无定价与付费路径，买方可能是独立开发者或外包团队，但公开材料未披露任何收费或采购事实，属判断而非已验证。
        evidence_ids:
