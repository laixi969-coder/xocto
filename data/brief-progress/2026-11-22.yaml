    regions: []
    regions_en: []
    open_source: true
    summary_zh: 用 AI 生成 Next.js、Supabase 与 TypeScript 应用的开发者，在提交或上线前打开它，对代码与 SKILL.md 做静态扫描；它按 92 条规则检查密钥泄露、Supabase
      行级权限和提示注入，输出问题清单，修复仍需开发者自行确认。具体误报率与修复流程仍待核验。
    inspiration: 趋势是 AI 生成代码把安全审查从上线前挪到生成后即刻，审查对象也从人手写的代码扩到提示与技能文件。切入可做面向非安全背景独立开发者的按次扫描或上线前检查服务，卖结果而非卖工具；但需先证明规则准确度。
    summary_en: Developers building AI-generated Next.js, Supabase and TypeScript apps open it before
      committing or launching to statically scan code and SKILL.md files; it checks 92 rules covering
      leaked secrets, Supabase row-level permissions and prompt injection, and outputs an issue list that
      developers still confirm and fix themselves. False-positive rate and fix workflow remain unverified.
    inspiration_en: The trend is that AI-generated code moves security review from pre-launch to right
      after generation, and the review target expands from hand-written code to prompts and skill files.
      The opening is a per-scan or pre-launch check sold to non-security solo developers as an outcome,
      not a tool; rule accuracy must be proven first.
