    inspiration_en: 'Trend: team collaboration surfaces are becoming the workplace for AI agents, sharing
      context and approvals with people in the same channel. Entry: start with engineering teams that
      care about data sovereignty yet want agents to act directly, selling self-hosted deployment plus
      approval audit rather than another general chat entry; pricing is undisclosed and not assumed.'
    req_initial:
