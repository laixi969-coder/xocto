      tool-call results on the premise that "exit code 0 is not proof"; repository stars swung from 236
      to a 40–95 range during November, latest at 41 stars and 3 forks, with no pricing or customer information.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - Software development
    jobs:
    - 构建 AI agent 的开发者在上线前处理 agent 工具调用的返回结果，要判断调用是否真的成功而非仅退出码为 0
    jobs_en:
    - Developers building AI agents handle agent tool-call return values before launch, needing to judge
      whether a call truly succeeded rather than merely exited with code 0
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 构建 AI agent 的开发者在测试或上线前打开它，把 agent 工具调用的返回结果交给这个本地校验器做语义判断，拿到通过或失败的结论，用来发现退出码为 0 但实际未完成的情况；具体校验规则与集成方式仍待核验。
    inspiration: 趋势是 agent 开始替人执行有副作用的操作，而“命令跑完”与“事情办成”之间的缝隙成了新的故障源。切入可做 agent 执行结果的验收层，按调用量或按团队订阅收费；但需先确认它比通用断言库多解决了哪一步。
    summary_en: Developers building AI agents open it before testing or launch, feeding agent tool-call
      return values to this local verifier for a semantic judgement and getting a pass or fail result,
      used to catch calls that exited 0 without actually completing; the verification rules and integration
      path remain unverified.
    inspiration_en: 'The trend: agents increasingly perform actions with side effects, and the gap between
      "the command ran" and "the task got done" becomes a new failure source. An entry point is an acceptance
      layer for agent execution results, sold per call or per team subscription; it must first be shown
      what it adds beyond a generic assertion library.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 构建 AI agent 的开发者在测试与上线前，处理 agent 工具调用的返回结果，要判断这次调用是否真的完成了任务，而不只是进程退出码为 0。
        job_en: Developers building AI agents handle agent tool-call return values during testing and
          before launch, judging whether the call actually completed the task rather than merely exiting
          with code 0.
        pain_zh: agent 调用外部工具时，退出码为 0 可能掩盖参数错误、空结果或副作用未发生，开发者要人工逐条核对返回内容，否则错误会静默流入下游。
        pain_en: When an agent calls external tools, exit code 0 can mask wrong parameters, empty results
          or side effects that never happened, forcing developers to inspect return values by hand or
          let errors flow silently downstream.
        current_alternative_zh: 开发者目前靠手写断言、日志检查或通用测试框架校验返回内容，agent 场景下缺少针对语义结果的现成检查。
        current_alternative_en: Developers currently rely on hand-written assertions, log inspection or
