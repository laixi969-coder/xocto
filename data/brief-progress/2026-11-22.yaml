    summary_zh: 腾讯混元是腾讯的大模型系列，本次新增的是Hy4与低价版Hy4 flash两款模型发布，以及团队面向开发者的公开答疑。对应用层而言，可核对的变化是单任务推理成本被压低（报道口径为Hy4的二十分之一），这会降低调用大模型做批量任务的成本门槛；但报道未给出应用侧采用或付费数据，具体影响仍待核验。
