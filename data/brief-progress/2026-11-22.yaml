        job_en: Crypto traders testing automated strategies let an AI assistant place orders on bytx's
          paper-trading endpoints via MCP and CLI, confirming each action before any real trade.
        pain_zh: 让 AI 直接操作交易账户风险高，手动在交易所界面反复下单和记录模拟结果又费时，策略验证缺少可审计的中间层。
