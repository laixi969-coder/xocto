      can rebuild a website using only browser exploration. Users are researchers or engineering evaluators;
      the input is a target site, the agent browses it and produces a rebuild, which is used to measure
      agent capability. The scoring rubric and delivery format still need verification.
    inspiration_en: 'Trend: website rebuilding is being used as a task to test browser-agent capability,
      showing agents moving from answering questions to operating interfaces and delivering artifacts.
      Entry: start from site-migration or competitor-page replication work at web studios and e-commerce
      operators, compare agent rebuilds against manual restoration, and charge per migrated site or page.
      It is currently only a benchmark with no productized delivery evidence.'
