    - local consumer services
    - travel booking
    - retail e-commerce
    jobs:
    - 忙碌的个人在临时需要采购食材、订周末火车票或安排送花时，用短信或电话把需求交给助手，由它代为在手机和电脑上完成下单或预订，用户拿到已执行的订单或预订结果
    - 个人在周末想打球时，通过短信让助手查找并落实可用球场，用户拿到场地信息或预订结果
    jobs_en:
    - A busy individual who suddenly needs groceries, a weekend train ticket, or flowers sends the request
      by text or phone and has the assistant place the order or booking on phone and computer, receiving
      an executed order or reservation
    - An individual wanting to play a sport at the weekend texts the assistant to find and secure an available
      court, receiving venue information or a booking result
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 忙碌的个人在临时要买食材、订周末火车票、买日用品、送花或找球场时，打开短信或打电话给 Instinct，把需求直接说出来；助手代替用户在手机和电脑上执行下单、预订等操作，用户拿到已完成的订单或预订结果。具体执行范围、失败处理和人工确认环节仍待核验。
    inspiration: 趋势是助手从“回答问题”走向“替人操作真实账户和网站完成交易”，把跨应用的多步点击压缩成一句话。切入可放在高频、低金额、失败代价小的本地生活代办，例如周末出行与生鲜补货，按成功订单收费；但支付授权、退款责任和失败兜底是这类产品必须先解决的交付问题。
    summary_en: When a busy individual suddenly needs ingredients, a weekend train ticket, groceries,
      flowers, or a court, they text or call Instinct and state the request; the assistant performs ordering
      and booking actions on phone and computer on the user's behalf, and the user receives a completed
      order or reservation. The exact execution scope, failure handling, and human confirmation steps
      still need verification.
    inspiration_en: The trend is assistants moving from answering questions to operating real accounts
      and websites to complete transactions, compressing multi-app clicking into one sentence. The entry
      point could be high-frequency, low-value local errands with cheap failure, such as weekend travel
      and grocery restocking, charged per successful order; payment authorization, refund liability, and
      failure fallback are delivery problems such a product must solve first.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 忙碌的个人在临时需要采购食材、订周末火车票、买日用品、送花或找球场时，用短信或电话把需求交给助手，由它代为在手机和电脑上完成下单或预订，用户拿到已执行的订单或预订结果。
        job_en: A busy individual who suddenly needs groceries, a weekend train ticket, daily goods, flowers,
          or a court hands the request to the assistant by text or phone, has it place the order or booking
          on phone and computer, and receives an executed order or reservation.
        pain_zh: 这些琐事分散在多个应用和网站，需要用户自己切换、填表、比价并盯完成；临时想起时还要中断手头工作。
        pain_en: These errands are spread across multiple apps and websites, requiring the user to switch,
          fill forms, compare, and track completion; remembering them suddenly also interrupts current
          work.
        current_alternative_zh: 用户自己在各应用里搜索、下单和预订，或请家人朋友代办；现有通用助手多停留在给建议和链接，不直接完成交易。
        current_alternative_en: Users search, order, and book themselves across apps, or ask family and
          friends; existing general assistants mostly give advice and links rather than completing transactions.
        usage_reason_zh: 推断：相较用户自己在多个应用间切换下单，Instinct 通过短信或电话接收一句话需求并直接操作手机和电脑执行，减少的是“打开应用—搜索—填表—确认”这一串步骤，因此怕麻烦、时间碎片化的用户会在临时琐事上选择它；公开材料尚未给出成功率、退款或重复使用证据。
        usage_reason_en: 'Inference: compared with users switching among apps to order themselves, Instinct
          takes a one-sentence request by text or phone and directly operates phone and computer to execute
          it, removing the open-search-fill-confirm sequence, so users who dislike hassle and have fragmented
          time would choose it for sudden errands; public materials do not yet show success rates, refunds,
          or repeat use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决临时采购、订票、送花、找球场等琐事要在多个应用间手动操作的问题，痛点具体且不解决的后果是时间被占用或事情被拖延；买方尚不清晰。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-770b0fa6cb4c42d6
      - gate: consensus
        status: insufficient
        reason: 官网只给出可代办事项清单，没有用户评价、客户案例或采用数据，无法判断用户是否真的把这类任务交给它。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-40c38047ef2de745
      - gate: model
        status: insufficient
        reason: 未披露定价、收费方式或谁付费；按成功订单抽成还是订阅只是推断，尚无公开付费证据。
        evidence_ids:
        - ev-770b0fa6cb4c42d6
      - gate: truth
        status: insufficient
        reason: 代操作真实账户涉及支付授权、失败退款和隐私边界，公开材料未说明这些环节如何确定性交付。
