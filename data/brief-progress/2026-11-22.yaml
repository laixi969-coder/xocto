          cloud companion products lock users to one model and platform, with no self-chosen model or
          local deployment.
        current_alternative_zh: 通用聊天助手、云端角色陪伴应用，或自己拼装 Live2D/VRM 形象与语音模型。
        current_alternative_en: General chat assistants, cloud character-companion apps, or self-assembling
          Live2D/VRM avatars with voice models.
        usage_reason_zh: 推断：相较通用聊天助手，它把 3D 形象、实时语音和情绪状态打包成一个可直接运行的角色，用户省去自己拼接形象、语音与模型接口的步骤，因此愿意自部署的陪伴用户会在想要可换模型、可自定义角色时选择它。
        usage_reason_en: 'Inference: versus general chat assistants, it packages a 3D avatar, real-time
          voice and emotional state into one runnable character, sparing users from stitching avatar,
          voice and model APIs themselves, so self-hosting companion users would pick it when they want
          a swappable model and customizable character.'
      gates:
      - gate: value
        status: supported
        reason: 它解决独处时缺少随时可对话对象、且云端陪伴绑定单一模型的问题，痛点真实；交付为可运行角色，但记忆与情绪效果未核验。
        evidence_ids:
        - ev-e1d52f1d231ab95b
        - ev-6e79ff7825589422
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标从约 99 增至 683 的关注度信号，无用户评价或采用案例说明谁在持续使用。
        evidence_ids:
        - ev-e1d52f1d231ab95b
        - ev-6e79ff7825589422
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或托管服务收入路径；买方可能是自部署个人用户或未来的托管订阅，属判断非事实。
        evidence_ids:
        - ev-6e79ff7825589422
      - gate: truth
        status: insufficient
        reason: 情绪状态与长期记忆能否确定性交付、角色是否贴近陪伴第一性目标，公开材料未给出可复现实测。
        evidence_ids:
        - ev-e1d52f1d231ab95b
      next_validation: 收集该开源仓库的 issue 与 discussion，查看用户对记忆、语音延迟和部署体验的实际反馈。
