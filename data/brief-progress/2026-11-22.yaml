          with sound, feed scripts or prompts into a studio running on their own GPUs to generate video
          and stills, then review and edit them into a final cut.
        pain_zh: 云端视频生成按次计费，产量一高成本迅速累积，且素材要反复上传下载，创作者难以控制单条成本。
