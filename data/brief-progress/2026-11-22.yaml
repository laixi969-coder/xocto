        current_alternative_zh: 交易者目前多在交易所自带模拟盘手动下单，或用脚本自行对接 API，再人工记录结果。
        current_alternative_en: Traders today place orders manually in exchange paper-trading sandboxes
          or wire their own scripts to APIs and log results by hand.
        usage_reason_zh: 推断：相较手动模拟盘，它把下单动作交给 AI 助手执行但默认停在纸面交易并要求逐笔确认，减少了脚本对接与手工记录这一步，因此重视可审计性的散户和小型量化团队会在策略试跑阶段选择它。
        usage_reason_en: 'Inference: versus manual paper trading, it lets the AI assistant execute orders
