        pain_zh: 多版本产出散落在不同对话里，人工来回切换比对、复述上下文和补记选择理由很费事，事后也难以解释为什么选了这个版本。
        pain_en: Multiple outputs scatter across conversations; switching back and forth to compare, restating
          context and jotting down reasons is tedious, and later it is hard to explain why a version was
          chosen.
