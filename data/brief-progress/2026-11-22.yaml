    inspiration: 趋势是内容生产从“单点生成”走向“从灵感到分镜的一条龙草稿”，把选题到素材的多个断点压进同一处。切入可考虑面向特定垂类自媒体（如本地探店、家装、母婴）做带行业模板与素材库的版本，按产出条数或代运营服务收费；公开材料未披露价格。
    summary_en: Independent media creators record an idea in one sentence, and the tool generates a script,
      cover image, illustrations and a shot list, delivering a set of editable content assets; humans
      still review and publish. Generation quality, export formats and workflow details remain to be verified.
    inspiration_en: The trend is content production moving from single-point generation to an end-to-end
      draft from idea to shot list, compressing several handoff steps into one place. An entry point is
      vertical-specific editions (local food reviews, home renovation, parenting) with industry templates
      and asset libraries, sold per output or as managed service; no pricing is disclosed in public materials.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自媒体创作者在灵感出现时用一句话记录，随后需要产出脚本、封面、配图与分镜，用于完成一条可发布的短视频或图文内容。
        job_en: Independent media creators capture an idea in one sentence, then need a script, cover
          image, illustrations and a shot list to finish a publishable short video or post.
        pain_zh: 灵感、脚本、封面、配图和分镜分散在多个工具与手工环节，创作者要在写作、设计、排版之间反复切换，单条内容的准备时间被拉长。
        pain_en: Ideas, scripts, covers, illustrations and shot lists are scattered across multiple tools
          and manual steps, forcing creators to switch between writing, design and layout, which lengthens
          preparation time per piece.
        current_alternative_zh: 创作者通常用笔记软件记灵感，再用通用聊天助手写脚本，用设计工具或模板做封面配图，分镜靠手写或表格整理。
        current_alternative_en: Creators typically note ideas in note apps, write scripts with general
