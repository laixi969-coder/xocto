      signal_level: 初步成立
      demand_read:
        job_zh: 警务人员在执勤、写报告或处理投诉时，需要核对本部门规程与地方条例，并据此形成合规的处置说明或文书。
        job_en: Police officers checking department protocols and local ordinances while on duty, writing
          reports or handling complaints, and producing compliant disposition notes or documents.
        pain_zh: 部门专属法律、条例和规程不在公开互联网上，通用助手答不准；查错一步可能带来纪律或法律责任。
        pain_en: Department-specific laws, ordinances and protocols are not on the public internet, so
