        job_en: Developers building AI-generated Next.js and Supabase apps run a pre-commit or pre-launch
          security self-check on secrets exposure, database row-level permissions and prompt-injection
          risks, and get a fixable issue list.
        pain_zh: AI 快速生成的代码常把密钥、宽松的数据库权限和可疑提示留在仓库里，开发者缺乏安全背景，不查就可能把漏洞带上线。
        pain_en: Fast AI-generated code often leaves secrets, loose database permissions and suspicious
          prompts in the repo, and developers without a security background may ship vulnerabilities unchecked.
        current_alternative_zh: 靠人工逐行读代码、通用 SAST 工具或上线后才发现问题；这些做法要么慢，要么不覆盖 Supabase 权限与提示注入。
