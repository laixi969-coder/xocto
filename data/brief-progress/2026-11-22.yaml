  blender-ai-copilot-lab:
    slug: blender-ai-copilot-lab
    name: blender-ai-copilot-lab
    decision: watching
    event_summary_zh: 该开源仓库于2026年11月12日发布，描述为在Blender内以管理者—执行者—审阅者代理团队执行多步场景简报，带任务看板、审阅发现、每个受阻任务一次纠正尝试、命名撤销和内置MCP服务器；仓库星标从11月14日的176升至11月16日的506，此后稳定在约505–507。
    event_summary_en: The open-source repository was published on 2026-11-12, describing manager–worker–reviewer
      agent teams inside Blender that run multi-step scene briefs with a live task board, review findings,
      one correction attempt per blocked task, named undo and a built-in MCP server; repository stars
      rose from 176 on 2026-11-14 to 506 on 2026-11-16 and then held at roughly 505–507.
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与游戏美术
    - 影视与广告制作
    industries_en:
    - 3D animation and game art
    - Film and advertising production
    jobs:
    - 三维美术师在接到分镜或场景简报时，让代理团队在Blender内搭建并调整场景，再通过任务看板与审阅记录逐项确认或撤销改动
    jobs_en:
    - 3D artists receiving a storyboard or scene brief let agent teams build and adjust the scene inside
      Blender, then confirm or undo changes item by item through the task board and review findings
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师接到场景简报后，在Blender里打开它，由管理者、执行者、审阅者三类代理按多步任务搭建和修改场景；用户通过实时任务看板查看审阅发现，对受阻任务只允许一次纠正，并可命名撤销改动，最终拿到一份可逐项核对的场景改动结果，仍需人工确认。具体交付质量与流程细节仍待核验。
    inspiration: 趋势：三维内容生产正从“人手动摆场景”转向“人审阅代理产出的场景改动”，审阅与撤销成为核心界面。切入：从影视广告或游戏外包的场景预演环节进入，按可交付的场景版本或审阅轮次收费，而不是卖插件席位；先解决代理改坏场景后难以回退这一具体痛点。
    summary_en: After receiving a scene brief, a 3D artist opens it in Blender and manager, worker and
      reviewer agents build and modify the scene across multi-step tasks; the user watches review findings
      on a live task board, gets one correction attempt per blocked task, can undo changes by name, and
      ends with an item-by-item checkable set of scene changes that still needs human confirmation. Delivery
      quality and workflow details remain to be verified.
    inspiration_en: 'Trend: 3D content production is shifting from hand-placing scenes to humans reviewing
      agent-made scene changes, with review and undo becoming the core interface. Entry: start from scene
      previsualization in film/advertising or game outsourcing, charging per delivered scene version or
      review round rather than per plugin seat, and first solve the concrete pain that agent edits are
      hard to roll back.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在接到分镜或场景简报时，需要把文字需求变成Blender里可用的场景，并逐项检查代理改动是否正确。
        job_en: When a 3D artist receives a storyboard or scene brief, they must turn the written request
          into a usable Blender scene and check each agent change for correctness.
        pain_zh: 场景搭建与反复修改耗时，代理自动改动后难以定位和回退错误，审阅成本高。
        pain_en: Scene building and repeated revision are time-consuming, and after automated agent edits
          it is hard to locate and roll back errors, making review costly.
        current_alternative_zh: 美术师手动在Blender中建模与摆放，或用通用聊天助手生成脚本再手工调试。
        current_alternative_en: Artists model and place objects manually in Blender, or use general chat
          assistants to generate scripts and then debug them by hand.
        usage_reason_zh: 推断：相较手动搭建或脚本调试，它把多步场景任务拆给代理执行，并用任务看板、审阅发现和命名撤销把“改坏了怎么回退”变成可核对的一步，因此需要快速试场景版本的美术师会在预演阶段选择它。
        usage_reason_en: 'Inference: compared with manual building or script debugging, it splits multi-step
          scene tasks across agents and turns ''how to roll back a bad edit'' into a checkable step via
          the task board, review findings and named undo, so artists who need fast scene iterations would
          choose it during previsualization.'
      gates:
      - gate: value
        status: supported
        reason: 它解决三维美术师把文字简报变成可审阅场景改动的需求，痛点是搭建耗时与代理改动难回退；买方尚不清晰。
        evidence_ids:
        - ev-75b60ac3ea1a4964
        - ev-bf66136e6ca06eb0
      - gate: consensus
        status: insufficient
        reason: 仓库星标短期上升后走平，只能说明关注度，缺少用户评价或客户案例证明持续采用。
        evidence_ids:
        - ev-38a700f364bcab61
        - ev-bf4771e3721705b6
      - gate: model
        status: insufficient
        reason: 开源项目未见定价、付费路径或采购方信息，钱从哪来无法核验。
        evidence_ids:
        - ev-bf66136e6ca06eb0
      - gate: truth
        status: insufficient
        reason: 审阅与撤销机制贴近第一性目标，但缺少可复现实测证明代理产出的场景质量与确定性交付。
        evidence_ids:
        - ev-75b60ac3ea1a4964
        - ev-7f6eeb413c7d3ba1
      next_validation: 收集该仓库的issue与discussion，查看是否有用户报告实际场景任务中的产出质量、回退使用与重复使用情况。
