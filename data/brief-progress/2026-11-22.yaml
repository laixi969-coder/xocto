      token 消耗。用户最终拿到的是可被助手复用的本地项目记忆；具体记忆范围、命中效果和交付形式仍待核验。
    inspiration: 趋势是编码助手的使用成本开始被单独当成一层来优化，记忆与上下文管理从模型内置能力外溢成第三方组件。切入可从有大量遗留代码、会话频繁中断的软件团队入手，卖法可围绕按项目或按席位的上下文治理服务，但公开材料未披露价格，需先确认记忆准确率与节省效果。
    summary_en: Developers working in Claude Code open this local memory tool during repeated sessions
      in one project; it receives project information through an MCP server and hooks and stores it for
      later sessions, aiming to cut token spend from re-reading code. The user gets reusable local project
      memory for the assistant; the exact memory scope, hit rate and delivery form still need verification.
    inspiration_en: 'The trend is that cost control for coding assistants is becoming its own layer, with
      memory and context management spilling out of built-in model features into third-party components.
      Entry point: software teams with large legacy codebases and frequent session breaks; a per-project
      or per-seat context-governance offering is conceivable, but no price is disclosed, so memory accuracy
      and savings must be confirmed first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 的开发者在一个持续多轮的项目里，需要让助手记住此前的代码与决策，避免每次重新读取同一批文件。
        job_en: A developer using Claude Code in a long multi-turn project needs the assistant to remember
          earlier code and decisions instead of re-reading the same files each time.
        pain_zh: 长会话中重复读取代码既消耗 token 也拖慢响应，上下文丢失后开发者要重新粘贴或解释背景。
        pain_en: Re-reading code in long sessions burns tokens and slows responses, and when context is
          lost the developer must re-paste or re-explain background.
        current_alternative_zh: 开发者目前靠手动粘贴关键文件、维护说明文档或在会话中重复交代背景来维持上下文。
        current_alternative_en: Developers currently keep context by manually pasting key files, maintaining
          notes, or restating background within the session.
        usage_reason_zh: 推断：它通过 MCP 服务和钩子自动把项目信息写入本地记忆并在后续会话调用，省去开发者每次手动粘贴和重述背景这一步，因此频繁在同一项目里迭代的开发者会尝试它；节省幅度尚未有公开实测。
        usage_reason_en: 'Inference: through an MCP server and hooks it automatically writes project information
          into local memory and recalls it in later sessions, removing the manual paste-and-restate step,
          so developers iterating in one project would try it; public measurements of the savings are
          not yet available.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长会话中上下文丢失与重复读取代码的负担，痛点具体且旧替代是手动粘贴，结构上成立；节省幅度属推断。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
        - ev-94e506a4c8a37389
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 87 增至 135 的关注度信号，没有用户反馈或采用案例说明开发者已把它留在工作流里。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
        - ev-94e506a4c8a37389
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方；可能靠托管版或团队支持收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-94e506a4c8a37389
      - gate: truth
        status: insufficient
        reason: 记忆准确率、误召回风险与 token 实际节省均无公开数据，交付能否确定性发生尚未核验。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者是否报告记忆命中、误召回或 token 节省的可复现结果。
