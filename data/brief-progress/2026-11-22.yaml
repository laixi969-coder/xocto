      prior object was whole-repo access; it limits which public code repository paths a developer or
      agent can read so the agent works inside a designated directory. The deliverable is a scoped repository
      access range; the exact authorization flow and delivery form still need verification.
    inspiration_en: 'Trend: as AI coding agents enter team repositories, permission boundaries become
      a new friction point. Entry: start with teams that need outside agents or contractors to read only
      part of the code, selling access governance per repository or path rather than another coding assistant;
      pricing is undisclosed and must not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发团队在让 AI 编码代理或外部协作者读取代码仓库时，需要按目录或文件路径限定可见范围，以完成代码修改或审查任务。
        job_en: Development teams need to scope what an AI coding agent or outside collaborator can read
          in a repository by directory or file path when it performs code changes or reviews.
        pain_zh: 仓库级授权要么给得太多、要么反复手工配置，代理读到无关或敏感代码时难以追责；这是从产品说明推导的工作流判断。
        pain_en: Repo-level permissions either grant too much or require repeated manual setup, and it
          is hard to attribute when an agent reads irrelevant or sensitive code; this is a workflow inference
          from the product description.
        current_alternative_zh: 用 公开代码仓库 自带的分支、团队与只读权限手工配置，或干脆给代理完整仓库访问。
        current_alternative_en: Manually configuring public code repository branches, teams and read-only
          permissions, or simply granting the agent full repository access.
        usage_reason_zh: 推断：相较手工配置仓库权限，它把授权粒度下沉到路径，减少为每个代理单独裁剪可见范围的那一步，因此需要让外部代理只读部分代码的团队会尝试它；尚无用户反馈支持长期使用。
        usage_reason_en: 'Inference: compared with manually configuring repo permissions, it pushes authorization
          down to the path level, removing the step of tailoring visible scope for each agent, so teams
          needing outside agents to read only part of the code would try it; no user feedback yet supports
          sustained use.'
      gates:
      - gate: value
