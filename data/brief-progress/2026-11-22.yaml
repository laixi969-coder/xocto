      models take a target protein and candidate molecules, predict the bound conformation and binding
      strength, and propose new molecules designed to bind the target; researchers then pick candidates
      for lab validation, with experimental confirmation still done by humans.'
    inspiration_en: 'Trend: early-stage drug screening is moving from pure lab trial-and-error to compute-first-then-test,
      and open models plus a platform API put this within reach of smaller players. Entry: start with
      small biotechs and university spin-outs, charge per target or per candidate assessment, and link
      prediction to lab validation as a deliverable pipeline; pricing and customer cases are not disclosed.'
