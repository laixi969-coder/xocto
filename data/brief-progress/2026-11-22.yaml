        status: insufficient
        reason: 未披露定价、买方类型或收费方式，无法判断收入路径。
        evidence_ids:
        - ev-5b120865a8190b0b
      - gate: truth
        status: insufficient
        reason: 无法核验权限是否真正生效、能否确定性交付，以及人工复核边界。
        evidence_ids:
        - ev-5b120865a8190b0b
      next_validation: 收集 gitroots 官方文档或定价页，确认路径级授权的实际配置方式与收费模式。
