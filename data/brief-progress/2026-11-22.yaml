    open_source: true
    summary_zh: 面向断网或基础设施中断场景，用户打开它查阅生存、地图与重建类知识，AI 在本地离线接收提问并给出可操作指引；最终交付是离线可读的知识与操作说明，具体交互流程与交付形态仍待核验。
    inspiration: 趋势：离线、本地可用的知识助手开始被当作基础设施中断时的备份方案，而不是在线搜索的补充。切入：可从应急管理、偏远地区教育与户外人群进入，卖法可能是机构采购的离线知识包或培训交付，价格未披露。
