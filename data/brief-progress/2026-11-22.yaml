        evidence_ids:
        - ev-782e3a1281ae5b83
        - ev-714913da084e2255
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或企业采购路径，钱可能来自开源赞助或后续托管服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-714913da084e2255
      - gate: truth
        status: insufficient
        reason: 规则数量与覆盖范围有说明，但误报率、修复确定性和人工边界没有公开材料，交付能否稳定发生仍不清楚。
