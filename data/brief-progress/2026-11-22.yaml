    summary_zh: 安卓手机用户在需要跨应用完成重复点击、填写和页面切换时，打开这个本地运行的代理，用语音或指令让它读取屏幕并代为执行一串操作，最终拿到已完成的手机操作结果；具体支持哪些应用、失败如何回退、哪些步骤需人工确认，公开材料仍待核验。
    inspiration: 趋势：手机端代理正从“聊天问答”走向直接操作界面，把跨应用重复操作交给本地模型执行。切入：可从电商客服、外呼跟进、老年辅助这类高频跨应用操作人群切入，按代执行的任务量或托管设备收费；但无障碍权限带来的安全与合规边界，是这类产品必须先解决的门槛。
