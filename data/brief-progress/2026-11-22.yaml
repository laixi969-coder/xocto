    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code、Codex 或 OpenCode 的开发者，在发现代理反复不按自己项目习惯改代码时，打开这个 Skill，把历史编码会话作为训练材料交给 Tinker
      微调一个 agentic 模型，最终得到一个按自己会话风格工作的模型；微调后的效果是否稳定、替换流程是否顺畅，公开材料尚未说明，具体流程或交付仍待核验。
    inspiration: 趋势：编码代理的竞争正从“谁的模型强”转向“谁能让模型贴合单个团队的代码习惯”，会话记录本身开始被当作可训练资产。切入：面向有固定代码规范的中小研发团队，做“会话采集—清洗—微调—回归对比”的托管服务，按项目或按次微调收费；不要从通用模型训练平台切入，那里已被基础层占据。
    summary_en: Developers using Claude Code, Codex or OpenCode who find the agent repeatedly ignoring
      their project's conventions open this Skill, feed past coding sessions to Tinker as training material,
      and get an agentic model tuned to their own session style; whether the tuned model stays reliable
      and how smooth the swap is are not covered by public material, so the exact workflow and deliverable
      still need verification.
    inspiration_en: 'Trend: competition among coding agents is shifting from raw model strength to fitting
      a single team''s coding habits, and session logs are starting to be treated as trainable assets.
      Entry: offer small engineering teams with fixed code standards a hosted collect-clean-fine-tune-regression
      service billed per project or per run; do not enter as a general model-training platform, which
      the infrastructure layer already occupies.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者，在代理反复不遵守本项目命名、结构和修改习惯时，把历史编码会话整理为训练材料，微调出贴合自己工作方式的模型并替换默认模型。
        job_en: Developers using coding agents, when the agent repeatedly ignores the project's naming,
          structure and editing habits, turn past coding sessions into training material, fine-tune a
          model that fits their way of working, and replace the default model.
        pain_zh: 通用编码代理不了解单个仓库的隐性约定，开发者每次都要在提示里重复说明或手工改回，重复劳动且容易漏改。
        pain_en: General coding agents do not know a single repository's implicit conventions, so developers
          restate them in prompts or hand-fix output every time, which is repetitive and error-prone.
        current_alternative_zh: 写更长的项目说明文件、在每次会话里重复提示、维护自定义规则或直接用人工审查兜底。
        current_alternative_en: Writing longer project instruction files, repeating prompts in every session,
          maintaining custom rules, or falling back on manual review.
