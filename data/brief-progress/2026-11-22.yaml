    jobs:
    - 开发者同时运行多个编码代理时，需要查看每个代理的进度与输出，并决定下一步派发什么任务
    - 开发者需要把同一批编码任务分派给多个代理并汇总结果
    jobs_en:
    - A developer running several coding agents needs to see each agent's progress and output and decide
      what to dispatch next
    - A developer needs to split a batch of coding tasks across multiple agents and collect the results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在同时运行 Claude Code、Codex、Gemini CLI 等编码代理时打开它，把各代理的执行过程以游戏化界面呈现，并可向一组工作代理派发任务；最终拿到的是代理运行状态与任务分派结果，具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：编码代理从单次对话走向多代理并行，如何观察和调度这些代理成为新的操作界面问题。切入：面向已自建多代理流水线的工程团队，从“代理运行可视化与任务派发”这一环节进入，可考虑按团队席位或私有部署收费，但公开材料未披露定价。
    summary_en: When developers run several coding agents such as Claude Code, Codex or Gemini CLI at
      once, they open this to watch each agent's execution in a gamified view and dispatch tasks to a
      group of worker agents; what they get is agent status and task dispatch, while the exact deliverable
      and human confirmation step still need verification.
    inspiration_en: 'Trend: coding agents are moving from single chats to parallel multi-agent runs, making
      how to observe and orchestrate them a new interface problem. Entry: target engineering teams already
      running multi-agent pipelines, starting from agent-run visibility and task dispatch, with per-seat
      or private-deployment pricing as a possible model, though no pricing is disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在并行运行多个编码代理时，需要掌握每个代理的执行进度与产出，并决定把下一批任务派给哪个代理。
        job_en: A developer running multiple coding agents in parallel needs to track each agent's progress
          and output and decide which agent gets the next batch of tasks.
        pain_zh: 多个代理同时运行时，输出分散在各终端，开发者难以一眼看清谁在做什么、卡在哪里，切换与核对成本高。
        pain_en: With several agents running at once, output is scattered across terminals, so the developer
          struggles to see who is doing what and where things are stuck, making switching and checking
          costly.
        current_alternative_zh: 开发者通常在多个终端窗口或标签页之间手动切换，逐个查看代理日志。
        current_alternative_en: Developers typically switch manually among multiple terminal windows or
          tabs and read each agent's log one by one.
        usage_reason_zh: 推断：它把多个代理的运行状态收进一个游戏化视图并支持批量派发任务，减少在终端间来回切换和逐个核对日志的步骤，因此同时跑多个代理的开发者会尝试它；尚无留存或付费证据。
        usage_reason_en: 'Inference: it gathers several agents'' run states into one gamified view and
          supports dispatching tasks in batches, cutting the step of switching between terminals and checking
          logs one by one, so developers running many agents may try it; no retention or payment evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理并行时状态分散、难以调度的问题，痛点具体，旧做法是手动切换终端查看日志。
        evidence_ids:
        - ev-cc2f4919eb64e3c0
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或采用案例说明开发者为何选择它。
        evidence_ids:
        - ev-cc2f4919eb64e3c0
        - ev-c34fa628c8fca205
      - gate: model
        status: insufficient
        reason: 标注免费，未见定价页或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-cc2f4919eb64e3c0
      - gate: truth
        status: insufficient
        reason: 游戏化界面是否贴近调度代理的第一性目标、能否确定性交付任务结果，公开材料未说明。
        evidence_ids:
        - ev-cc2f4919eb64e3c0
      next_validation: 收集 CrommaCode 官方定价页或仓库 issue/discussion，确认其收费方式与用户对多代理调度的实际使用反馈。
