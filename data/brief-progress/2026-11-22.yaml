    - software development
    jobs:
    - 使用 AI 编码代理的开发者，在让代理开始写代码前，需要把需求整理成计划，并在合并前审查代理产出的代码差异
    jobs_en:
    - Developers using AI coding agents who need to turn requirements into a plan before the agent writes
