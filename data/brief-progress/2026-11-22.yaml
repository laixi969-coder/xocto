          in one sentence, generate a playable prototype in the DeepSeek Harness sidebar, swap in AI art,
          and publish to public code repository Pages or Cloudflare in one click.
        pain_zh: 小游戏从想法到可玩原型要写代码、找美术、配部署，业余创作者往往卡在工程与素材环节，想法难以快速验证。
        pain_en: Turning a small-game idea into a playable prototype requires coding, art sourcing and
          deployment setup; hobbyist creators often stall at engineering and assets, so ideas are hard
          to validate quickly.
        current_alternative_zh: 用游戏引擎手写原型、在素材站找美术、手动配置静态托管，或干脆放弃只停留在想法阶段。
