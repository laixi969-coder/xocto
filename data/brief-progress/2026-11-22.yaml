      repository stars rise from 261 to 306 between November 12 and 22, staying largely flat over the
      period.
  inkling-2-mini:
    slug: inkling-2-mini
    name: Inkling 2 Mini
    decision: market_context
    event_summary_zh: Thinking Machines Lab 于 2026 年 11 月 20 日发布开源权重模型 Inkling 2 Mini，权重约 20GB，官方演示在 48GB
      内存的 MacBook Pro 上离线运行，模型卡推荐 32GB 及以上内存的 Apple silicon 或 32GB 及以上显存的 GPU。
    event_summary_en: Thinking Machines Lab released the open-weight model Inkling 2 Mini on November
      20, 2026, with roughly 20GB of weights; the official demo ran offline on a 48GB MacBook Pro, and
      the model card recommends Apple silicon with 32GB or more memory, or GPUs with 32GB or more VRAM.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 这是一次开源权重模型发布，不是独立应用：开发者下载权重后可在本地设备上离线推理。它对应用层的影响在于本地部署的显存与内存门槛，具体能支撑哪些应用工作流仍待核验。
    inspiration: 开源权重模型把推理能力推向本地设备，趋势是应用层可以不再完全依赖云端 API，但 32GB 级内存或显存的门槛仍把普通笔记本用户挡在外面。切入可考虑面向有数据不出本地要求的行业（如律所、诊所、制造质检）做本地部署与调优交付，而非再做一个通用模型。
    summary_en: 'This is an open-weight model release rather than a standalone application: developers
      download the weights and run inference offline on local devices. Its relevance to the application
      layer lies in the memory and VRAM thresholds for local deployment; which application workflows it
      can actually support remains to be verified.'
    inspiration_en: Open-weight models push inference onto local devices, suggesting the application layer
      need not depend entirely on cloud APIs, yet the 32GB-class memory or VRAM threshold still excludes
      ordinary laptop users. A possible entry is local deployment and tuning delivery for industries with
      data-residency constraints, such as law firms, clinics or manufacturing inspection, rather than
      another general model.
