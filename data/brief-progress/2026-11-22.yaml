        current_alternative_zh: 翻纸质或内部手册、问同事或部门法务，通用聊天工具只能给泛化答案。
        current_alternative_en: Flipping through paper or internal manuals, asking colleagues or department
          legal staff; general chat tools only give generic answers.
        usage_reason_zh: 推断：相较翻手册和问同事，它把部门专属文本作为检索与作答依据，减少定位条款这一步，让执勤人员更快拿到可引用的处置依据；因此有强制合规手册的执法部门会在现场问答和报告复核时选择它。
        usage_reason_en: 'Inference: versus manuals and asking colleagues, it grounds retrieval and answers
