        status: insufficient
        reason: 未披露定价、买方或收费方式，钱可能来自网站运营方或安全团队，但这是判断而非已验证事实。
        evidence_ids:
        - ev-79e5dc49f954fa67
      - gate: truth
        status: insufficient
        reason: 识别准确率、部署形态与人工确认边界均未核验，无法判断交付是否确定发生。
        evidence_ids:
        - ev-79e5dc49f954fa67
      next_validation: 收集该开源仓库的 README 与 issue/discussion，核验其识别 AI 代理的具体方法、部署形态与准确率说明。
