      - gate: truth
        status: insufficient
        reason: 依赖特定硬件型号，未说明状态读取方式与安全边界，能否稳定交付多代理监控仍待核验。
        evidence_ids:
        - ev-2394dc4924b15a33
      next_validation: 收集该仓库 README 与 issue/discussion，确认它实际读取哪些代理状态、如何触发操作，以及是否有用户报告日常使用。
