        reason: 材料未披露定价、买方类型或付费方式，收入模式只能推断为团队订阅，属判断而非已验证事实。
        evidence_ids:
        - ev-a7843ecc17096013
      - gate: truth
        status: insufficient
        reason: 未核验其纪要准确率、人工确认边界与数据合规处理，交付确定性尚不明确。
        evidence_ids:
