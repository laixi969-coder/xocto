  image-to-sculpt:
    slug: image-to-sculpt
    name: image-to-sculpt
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 3D 建模与数字内容制作
    - 游戏与影视美术
    industries_en:
    - 3D modeling and digital content production
    - Game and film art
    jobs:
    - 3D 美术师或独立创作者在只有一张参考图时，用编码代理驱动该工具生成与参考图对齐的 3D 雕塑，并在 Blender 中回放检查结果
    jobs_en:
    - A 3D artist or independent creator with only one reference image uses a coding agent to drive this
      tool to produce a 3D sculpt aligned to that image, then replays it in Blender to inspect the result
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 3D 美术师或独立创作者手上只有一张参考图时，可让编码代理调用这个开源工具，按该图生成带配准视角和贴图拟合步骤的 3D 雕塑，并在 Blender 中回放与延时记录。最终交付是可在
      Blender 中检查的模型；具体精度、人工修模量和适用题材仍待核验。
    inspiration: 趋势：单图到可编辑 3D 资产的链路正从研究演示走向可被代理调用的工作流。切入：面向游戏道具、手办与电商展示的小型美术团队，从“只有一张参考图、需要快速出可修初模”这一环节进入，按件或按项目交付初模，而非卖通用建模工具。
    summary_en: When a 3D artist or independent creator has only one reference image, a coding agent can
      drive this open-source tool to generate a 3D sculpt with registered views and map-fitting passes,
      then replay it in Blender with a timelapse. The deliverable is a model inspectable in Blender; accuracy,
      manual cleanup effort and suitable subject matter still need verification.
    inspiration_en: 'Trend: the path from a single image to an editable 3D asset is moving from research
      demos toward workflows that agents can call. Entry: target small art teams doing game props, figurines
      and e-commerce display, starting at the step of turning one reference image into a quickly fixable
      base mesh, selling per-asset or per-project base models rather than a general modeling tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 3D 美术师或独立创作者只有一张参考图时，用编码代理驱动该工具生成与图对齐的 3D 雕塑，并在 Blender 中回放检查。
        job_en: A 3D artist or independent creator with only one reference image uses a coding agent to
          drive the tool to generate an image-aligned 3D sculpt and replays it in Blender to inspect.
        pain_zh: 从单张图手工起模需要反复对位、调比例和贴图，耗时且依赖经验；没有初模时后续修模无从下手。
        pain_en: Hand-building a model from a single image requires repeated alignment, proportion tuning
          and texturing; it is slow and experience-dependent, and without a base mesh there is nothing
          to refine.
        current_alternative_zh: 手工在 Blender 等软件中从参考图起模，或使用图生 3D 的通用服务再人工修整。
        current_en: Manually building a base mesh from a reference image in Blender or similar software,
          or using general image-to-3D services and then fixing by hand.
        usage_reason_zh: 推断：相较纯手工起模，它把配准视角与贴图拟合做成可重放的步骤，减少从零对位的第一轮工作量，让只有单图的美术师先拿到可修初模；是否真的省时取决于生成精度，公开材料未给出实测。
        usage_reason_en: 'Inference: versus purely manual base-mesh building, it turns view registration
          and map fitting into replayable steps, cutting the first round of from-scratch alignment so
          an artist with one image gets a fixable base mesh; actual time savings depend on generation
          accuracy, which public materials do not measure.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单图起 3D 初模时反复对位与调比例的痛点，交付可在 Blender 检查的模型，旧流程与不采用代价清楚。
        evidence_ids:
        - ev-4e0fe8228dd751d3
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、案例或重复使用证据，无法判断美术师是否真把它放进工作流。
        evidence_ids:
        - ev-99f9da20bd21b272
        - ev-4e0fe8228dd751d3
      - gate: model
        status: insufficient
        reason: 开源项目未见定价或付费路径；可能靠定制交付或后续商业版收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-4e0fe8228dd751d3
      - gate: truth
        status: insufficient
        reason: 贴近起模这一第一性目标，但生成精度、人工修模量和适用题材未公开，交付确定性尚不能核对。
        evidence_ids:
        - ev-4e0fe8228dd751d3
      next_validation: 收集该仓库的 issue、discussion 或示例输出，核对生成模型与参考图的对齐精度及人工修模量。
