      - gate: truth
        status: insufficient
        reason: 未核验手势识别在实际游戏中的稳定性与延迟，交付确定性待查。
        evidence_ids:
        - ev-7741666f95b1e876
      next_validation: 收集该仓库的 issue、discussion 或示例游戏在线试玩页面，核验手势识别在实际游戏中的可用性与使用者反馈。
