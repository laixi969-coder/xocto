    inspiration: 趋势是 AI 编码代理开始下沉到被主流工具放弃的旧运行环境；切入可看工业控制、老旧收银与嵌入式维护团队，他们缺的是能在原环境里直接改代码的人手，而不是又一个现代 IDE
      插件。
    summary_en: 'For developers still maintaining DOS programs: an AI coding agent runs inside the DOS
      environment, takes source code and change requests, and delivers modified code; the supported models,
      runtime and human review steps still need verification.'
    inspiration_en: The trend is AI coding agents moving into legacy runtimes abandoned by mainstream
      tooling; the opening is industrial control, old point-of-sale and embedded maintenance teams that
      lack hands able to edit code in the original environment, not another modern IDE plugin.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 维护 DOS 遗留程序的开发者在需要修改或排查老代码时，把 DOS 环境下的源码交给 AI 代理，期望拿到可运行的修改结果。
        job_en: Developers maintaining DOS legacy programs hand source code in a DOS environment to an
          AI agent when modifying or debugging old code, expecting runnable changes.
        pain_zh: DOS 环境缺少现代编辑器和 AI 辅助，老代码改动只能靠人工逐行阅读与试错，能读懂这类代码的人越来越少。
        pain_en: DOS environments lack modern editors and AI assistance, so changes to old code rely on
          manual reading and trial and error, and fewer people can read such code.
        current_alternative_zh: 开发者把代码导出到现代机器上借助通用 AI 助手修改，再拷回 DOS 环境调试，或完全手工修改。
        current_alternative_en: Developers export code to a modern machine, edit it with general AI assistants,
          copy it back to DOS to debug, or edit entirely by hand.
        usage_reason_zh: 推断：代理直接在 DOS 环境内读取源码并执行改动，省去导出、外部修改、回拷调试的往返，因此维护老旧系统的开发者会在原环境内直接尝试它。
        usage_reason_en: 'Inference: the agent reads and edits source inside the DOS environment, removing
          the export-edit-copy-back loop, so maintainers of old systems would try it in place.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 DOS 遗留代码缺少现代编辑与 AI 辅助、改动只能手工试错的问题，痛点具体且不解决的代价是维护成本持续上升。
        evidence_ids:
        - ev-0436354555c7f378
      - gate: consensus
        status: insufficient
        reason: 仅有社区讨论热度，未见维护遗留系统的开发者群体明确表达采用或持续使用。
        evidence_ids:
        - ev-0436354555c7f378
      - gate: model
        status: insufficient
        reason: 未见定价、付费方式或买方信息，钱可能来自个人开发者或企业维护合同，属判断而非已验证事实。
        evidence_ids:
        - ev-0436354555c7f378
      - gate: truth
        status: insufficient
        reason: 无法确认代理在 DOS 环境中的实际改动质量与人工确认边界，交付确定性尚未核验。
        evidence_ids:
        - ev-0436354555c7f378
      next_validation: 收集 ClawDOS 官方页面或仓库中的使用说明与 issue 讨论，核验其在 DOS 环境内的实际改动流程与人工确认环节。
