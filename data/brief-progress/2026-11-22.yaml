    - 知识工作者在向通用助手提问前，需要把分散的个人笔记组织成可被模型调用的语义结构
    jobs_en:
    - A personal knowledge manager connects an existing knowledge base to Claude, ChatGPT and other clients
      so the assistant can retrieve and answer through a semantic layer
    - A knowledge worker organizes scattered personal notes into a semantic structure that a general assistant
      can call before asking questions
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人知识管理者把已有笔记和 NVIDIA Auto Ontology 的语义层封装成 MCP 服务，接入 Claude、ChatGPT 等客户端；助手据此检索个人知识库并作答，无需自备模型
      API key。具体检索质量、交付形态与人工确认环节仍待核验。
    inspiration: 趋势：通用助手正被要求接入个人私有知识，语义层成为把笔记变成可调用资产的一环。切入：面向律师、咨询顾问等资料密集的个人执业者，把其既有文档整理成可被助手检索的语义库并按整理或维护收费；价格未披露，需先核验检索准确度。
    summary_en: A personal knowledge manager wraps existing notes and NVIDIA Auto Ontology's semantic
      layer into an MCP server for Claude, ChatGPT and other clients; the assistant retrieves from the
      personal knowledge base to answer, without a separate model API key. Retrieval quality, delivery
      form and human review steps still need verification.
    inspiration_en: 'Trend: general assistants are being asked to reach private personal knowledge, and
      semantic layers turn notes into callable assets. Entry: target document-heavy solo practitioners
      such as lawyers and consultants, organizing their existing files into an assistant-retrievable semantic
      base and charging for setup or upkeep; pricing is undisclosed and retrieval accuracy needs checking
      first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人知识管理者在整理笔记与资料时，把已有知识库接入 Claude、ChatGPT 等客户端，让助手按语义层检索并回答。
        job_en: A personal knowledge manager connects an existing knowledge base to Claude, ChatGPT and
          other clients so the assistant can retrieve and answer through a semantic layer.
        pain_zh: 通用助手不了解个人笔记内容，用户每次都要手动粘贴或重新描述背景，私有资料难以被稳定调用。
        pain_en: General assistants do not know the contents of personal notes, so users must paste or
          re-describe context each time and private material is hard to call reliably.
        current_alternative_zh: 手动复制粘贴笔记到对话框，或自建检索脚本与向量库，再自行拼接提示词。
        current_alternative_en: Manually copying notes into the chat box, or building a retrieval script
          and vector store and assembling prompts by hand.
        usage_reason_zh: 推断：它把语义层封装成 MCP 服务，客户端可直接调用个人知识库，省去每次手动粘贴与拼接提示词这一步；资料密集且已在用通用助手的个人执业者会因此选择它，但检索准确度与长期使用尚无公开证据。
        usage_reason_en: 'Inference: it packages the semantic layer as an MCP server so clients can call
          the personal knowledge base directly, removing the manual paste-and-prompt step; document-heavy
          solo practitioners already using general assistants would choose it, but retrieval accuracy
          and sustained use lack public evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决通用助手读不到个人笔记、每次需手动粘贴背景的问题，旧做法是复制粘贴或自建检索，痛点具体；检索质量仍待核验。
        evidence_ids:
