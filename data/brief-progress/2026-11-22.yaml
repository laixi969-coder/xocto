    inspiration: 趋势是陪伴型角色从云端订阅走向可自部署、可换模型的开源形态，用户开始自己掌控角色形象与对话后端。切入可从愿意折腾本地模型的二次元陪伴人群入手，卖托管部署、角色形象与语音包，或按角色订阅；但公开材料未披露任何定价或付费路径，这是判断不是事实。
