      which deconstructs the hook and script into a Viral DNA report and produces 10 costed variants;
      users get selectable rewritten scripts plus cost estimates, while final production and ad placement
      still need human confirmation. The concrete workflow and delivery quality remain to be verified.
    inspiration_en: 'Trend: short-video ad testing is moving from manual teardown of each hit toward agent
      workflows that handle deconstruction and batch rewriting. Entry: target small cross-border ad teams
      and sell a deconstruction report plus variant pack rather than seats; the moat is ad-result data
      flowing back, not the model.'
