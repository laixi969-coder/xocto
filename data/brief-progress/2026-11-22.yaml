    summary_zh: 安全测试人员在 Burp Suite 里抓完流量后，选中目标请求并指定 IDOR、XSS、SQLi、SSRF 等审查目标，插件让 AI 对这段流量做安全审查，输出带严重度看板、描述、复现步骤、影响、PoC
      与 CWE/CVE 的报告，并可导出 HTML/MD/JSON；人工仍需复核结论。具体审查流程与误报情况仍待核验。
    inspiration: 趋势：渗透测试的“看流量找漏洞”这一步开始被 AI 插件接管，产出直接对齐可交付的漏洞报告格式。切入：从安全服务商和乙方渗透测试团队的交付环节进入，把报告撰写与复现步骤整理做成按份或按项目计费的交付物，而非卖插件本身；误报率与人工复核成本是能否成立的关键。
    summary_en: After capturing traffic in Burp Suite, a security tester selects target requests and specifies
      review goals such as IDOR, XSS, SQLi or SSRF; the plugin has AI review that traffic and returns
      a severity dashboard with description, reproduction steps, impact, PoC and CWE/CVE, exportable to
      HTML/MD/JSON. Human review is still required. The exact review flow and false-positive rate remain
      to be verified.
    inspiration_en: 'Trend: the ''read traffic, find vulnerabilities'' step of penetration testing is
      being taken over by an AI plugin whose output matches a deliverable vulnerability report. Entry:
      start from the delivery step of security consultancies and pentest teams, selling report writing
      and reproduction-step assembly per report or per project rather than the plugin itself; false-positive
      rate and human review cost decide whether this holds.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全测试人员在 Burp Suite 抓包后，从流量中挑选请求并指定 IDOR、XSS、SQLi、SSRF 等审查目标，要产出一份含复现步骤、影响、PoC 与 CWE/CVE
          的漏洞报告。
        job_en: After capturing traffic in Burp Suite, a security tester picks requests and specifies
          review goals such as IDOR, XSS, SQLi or SSRF, and must produce a vulnerability report with reproduction
          steps, impact, PoC and CWE/CVE.
        pain_zh: 人工逐条看流量、判断漏洞类型、写复现步骤和影响描述耗时且重复，报告格式还要手工整理。
        pain_en: Manually reading each request, judging vulnerability type, and writing reproduction steps
          and impact is slow and repetitive, and the report format must be assembled by hand.
        current_alternative_zh: 测试人员靠经验手工审流量，或用通用大模型粘贴请求片段，再自己整理成报告。
        current_alternative_en: Testers review traffic manually by experience, or paste request snippets
          into a general LLM and assemble the report themselves.
        usage_reason_zh: 推断：插件直接在 Burp 内接收已抓取的流量并按指定审查目标输出结构化报告，省去把请求复制到外部模型再手工整理复现步骤与 CWE/CVE 的一步；安全测试人员在需要快速出报告时会选择它，但误报仍需人工复核。
        usage_reason_en: 'Inference: the plugin takes already-captured traffic inside Burp and outputs
          a structured report per specified review goal, removing the step of copying requests to an external
          model and manually assembling reproduction steps and CWE/CVE; testers needing fast reports would
          choose it, though false positives still need human review.'
      gates:
      - gate: value
        status: supported
        reason: 它解决安全测试人员从抓包流量到漏洞报告之间手工审查与撰写报告的需求，痛点具体且重复；买方与付费路径尚不明确。
        evidence_ids:
        - ev-3901e046d33cfdcc
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或客户案例说明测试人员是否真的把它放进工作流。
        evidence_ids:
        - ev-3901e046d33cfdcc
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或收费方式，钱可能来自安全服务商按报告付费，这是判断而非已验证事实。
        evidence_ids:
        - ev-3901e046d33cfdcc
      - gate: truth
        status: insufficient
        reason: AI 安全审查的误报与漏报直接影响交付可信度，公开材料未给出准确率或人工复核边界。
        evidence_ids:
        - ev-3901e046d33cfdcc
      next_validation: 收集该仓库 issue/discussion 中关于误报率与人工复核流程的公开讨论，或官方 README 中的实测结果说明。
