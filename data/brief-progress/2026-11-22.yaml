      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，属关注度而非采用证据，缺少用户反馈或案例说明谁在持续使用。
        evidence_ids:
        - ev-6bcfa9d021df0de8
        - ev-9730a8e1d1534c00
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或商业交付方式，钱从哪来无法从公开材料判断。
        evidence_ids:
        - ev-9730a8e1d1534c00
      - gate: truth
        status: insufficient
        reason: 依赖第三方语义层与客户端协议，检索准确度、隐私边界和人工确认环节均无公开材料支持。
        evidence_ids:
        - ev-9730a8e1d1534c00
      next_validation: 收集该仓库的 issue 与 discussion，查看用户实际报告的检索准确度、接入流程与重复使用情况。
