        current_alternative_en: Picking icons one by one from icon libraries, manually recoloring and
          resizing, or having a designer produce a separate animated set.
        usage_reason_zh: 推断：相较逐个找图再手工调整，编码代理在写界面的同一流程里按统一风格生成图标，省去跨工具找图和格式转换这一步，因此需要成套动效图标的前端开发者会在搭建界面时选择它。
        usage_reason_en: 'Inference: compared with hunting for icons and adjusting them by hand, the coding
          agent generates icons in a consistent style within the same interface-building flow, removing
          the cross-tool search and format-conversion step, so front-end developers needing a full animated
          set would pick it while building UI.'
      gates:
      - gate: value
