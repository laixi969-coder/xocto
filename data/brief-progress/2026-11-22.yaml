        reason: 它解决断网时查不到可执行生存与重建知识的问题，痛点在基础设施中断时刚性，交付为离线可读指引；具体交互流程仍待核验。
        evidence_ids:
        - ev-30291aca7f1a956a
        - ev-b3d97435fdbf5d68
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 1838 增至 2885 的关注度信号，缺少用户评价、使用场景描述或社区讨论来证明真实采用。
        evidence_ids:
        - ev-30291aca7f1a956a
        - ev-b3d97435fdbf5d68
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或机构采购路径；这是判断，不是已验证事实。
        evidence_ids:
        - ev-b3d97435fdbf5d68
      - gate: truth
        status: insufficient
        reason: 离线知识库与本地问答贴近断网场景的第一性目标，但缺少实测确认离线可用性、知识准确性与人工复核边界。
        evidence_ids:
        - ev-30291aca7f1a956a
        - ev-b3d97435fdbf5d68
      next_validation: 收集该仓库 README 与 issue/discussion 中关于离线部署方式、知识来源与实测可用性的公开说明。
