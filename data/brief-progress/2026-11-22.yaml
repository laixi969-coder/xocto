      to call tools and complete multi-step operations inside a sandbox; it receives a task and dispatches
      tools, but what it finally delivers and how a human confirms it are not stated in public material,
      so the concrete workflow and deliverable remain to be verified.
    inspiration_en: The trend is that general agent runtimes are being reproduced in open source at scale,
      so a sandbox that runs tools no longer differentiates. The entry point should abandon the generic
