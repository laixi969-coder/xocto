  shipyard-3:
    slug: shipyard-3
    name: Shipyard
    decision: watching
    event_summary_zh: 2026年11月16日，Shipyard 在公开产品页发布面向 Claude、Cursor 和 Codex 的 MCP 集成自动化工具，宣称让这些编码助手自动完成第三方集成配置。
