        reason: 它解决执勤与写报告时核对部门专属规程的需求，痛点是通用工具答不准且出错有责任后果，旧做法是翻手册问同事。
        evidence_ids:
        - ev-602aa536ef7e712e
      - gate: consensus
        status: insufficient
        reason: 仅有融资与定位报道，未见警局采购、部署或一线使用反馈，买方共识未核验。
        evidence_ids:
        - ev-602aa536ef7e712e
      - gate: model
        status: insufficient
        reason: 报道未披露定价与收费方式，买方可能是警局预算，属推断而非已验证事实。
        evidence_ids:
        - ev-602aa536ef7e712e
      - gate: truth
        status: insufficient
        reason: 部门专属文本作为依据贴近合规目标，但答案准确性、人工复核边界与责任归属未见公开说明。
        evidence_ids:
        - ev-602aa536ef7e712e
