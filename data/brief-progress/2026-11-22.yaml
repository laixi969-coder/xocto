  halfsize:
    slug: halfsize
    name: halfsize
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 社交媒体与即时通讯
    - 内容创作
    industries_en:
    - Social Media & Messaging
    - Content Creation
    jobs:
    - 内容创作者或运营人员在把视频发到 Discord、微信、WhatsApp 等有附件大小上限的平台前，需要把视频压到指定体积并尽量保住画质
    jobs_en:
    - Content creators or community operators need to shrink a video to a platform's attachment size limit
      (Discord, WeChat, WhatsApp) while preserving quality before uploading
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 内容创作者或社群运营在把视频发到 Discord、微信、WhatsApp 等有附件体积上限的平台前，打开 halfsize，把原视频交给它，由本地 FFmpeg 压到指定大小，HDR
      转 SDR，并用 VMAF/SSIM 给出画质对比；用户拿到一个可直接上传的文件。它也能作为 MCP 服务被 AI 代理调用。具体压缩参数与画质取舍仍需人工确认。
    inspiration: 趋势：平台附件体积上限长期逼着用户自己找压缩工具，而“压到精确大小且可核对画质”正被做成可被 AI 代理调用的本地能力。切入：从社群运营、短视频分发这类每天要过体积关的人入手，卖按次或按批的批量压缩与画质报告，而不是再做一个通用转码器。
    summary_en: Before uploading to platforms with attachment size caps (Discord, WeChat, WhatsApp), content
      creators or community operators open halfsize, hand it the original video, and local FFmpeg compresses
      it to an exact target size, tone-maps HDR to SDR, and reports VMAF/SSIM quality comparison; the
      user gets an upload-ready file. It can also run as an MCP server for AI agents. Exact compression
      settings and quality trade-offs still need human confirmation.
    inspiration_en: 'Trend: platform attachment caps keep pushing users to find their own compressors,
      and ''hit an exact size with checkable quality'' is being packaged as a local capability AI agents
      can call. Wedge: start with community operators and short-video distributors who hit the size limit
      daily, selling per-batch compression plus quality reports rather than another generic transcoder.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容创作者或社群运营在把视频发到有附件体积上限的平台前，需要把视频压到指定大小并尽量保住画质。
        job_en: Content creators or community operators need to compress a video to a platform's attachment
          size limit while preserving quality before uploading.
        pain_zh: 平台硬性体积上限会让原视频无法上传，用户要么反复试参数、要么牺牲画质，且难以判断压缩后画质损失多少。
        pain_en: Hard platform size caps block uploads; users either retry parameters repeatedly or sacrifice
          quality, and can't easily judge how much quality was lost.
        current_alternative_zh: 用通用转码软件手动调码率、在线压缩网站（有隐私与体积限制）或直接降低分辨率重传。
        current_alternative_en: Manually tuning bitrate in generic transcoders, online compression sites
          (privacy and size limits), or simply downscaling and re-uploading.
        usage_reason_zh: 相较手动调参，它直接以目标体积为输入自动求解压缩参数，并给出 VMAF/SSIM 画质对比，减少反复试错这一步；推断需要频繁过体积关的社群运营会因此选择它。
        usage_reason_en: Versus manual parameter tuning, it takes the target size as input, solves compression
          settings automatically, and reports VMAF/SSIM quality comparison, removing the trial-and-error
          step; inferred that operators who frequently hit size caps would choose it for this.
      gates:
      - gate: value
        status: supported
        reason: 它解决视频因平台体积上限无法上传、且压缩后画质难判断的痛点，以目标体积为输入并给出画质对比，旧流程是手动调参或在线压缩。
        evidence_ids:
        - ev-e471d968415d8a5e
        - ev-852ac0ca90f16c91
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标缓慢增长，缺少用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-6f251074cff83987
      - gate: model
        status: insufficient
        reason: 开源本地工具，未见定价或付费路径，钱可能来自个人或团队赞助，这是判断不是已验证事实。
        evidence_ids:
        - ev-852ac0ca90f16c91
      - gate: truth
        status: insufficient
        reason: 压缩结果可核对，但缺少留存、复购或重复使用证据，无法确认已进入稳定工作流。
        evidence_ids:
        - ev-6f251074cff83987
      next_validation: 收集该仓库的 issue/discussion 或独立评价，确认用户是否在真实上传场景中反复使用并反馈画质取舍。
