      skill inside coding agents such as Claude Code and Codex, which draw animated icons in a consistent
      style; it also ships 2,600+ React, Vue and SVG icons to browse. The deliverable is icon assets that
      can go straight into a project, though generation quality and the human review step still need verification.
    inspiration_en: 'Trend: coding agents are starting to take on small interface-asset production, turning
      icons from a stock-library search into an agent drawing in a given style. Entry: target indie developers
      and small design teams at the interface-building step where a consistent animated icon set is needed,
      potentially selling icon packs or per-project delivery; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 前端开发者在搭建界面时，需要为按钮、导航等元素补齐风格统一的图标，并希望编码代理直接产出可用的 React、Vue 或 SVG 资源。
        job_en: Front-end developers building an interface need consistent icons for buttons and navigation,
          and want coding agents to output usable React, Vue or SVG assets directly.
        pain_zh: 图标风格不统一、动效制作和格式转换要手工反复调整，是界面搭建中琐碎但必须完成的一步。
