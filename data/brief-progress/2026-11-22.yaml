      that lights up tool calls, model steps, hooks, skills and subagents as they execute; repository
      stars rose from 1,056 to 1,107 and interface languages from 7 to 8.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Claude Code 的开发者在其代理连续执行多步工具调用时，需要判断当前进行到哪一步、哪些 hooks 与子代理被触发，以便决定是否中断或调整指令
    jobs_en:
    - Developers using Claude Code who, while an agent runs a long chain of tool calls, need to see which
      step, hook or subagent is active in order to decide whether to interrupt or adjust the prompt
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 的开发者在其代理连续执行多步工具调用时打开这个本地侧边面板，面板接收工具调用、模型步骤、hooks、skills 与子代理的运行事件并实时点亮对应节点，让开发者看到当前执行到哪一步；最终交付是一张可观察的执行地图，具体能否回放或导出仍待核验。
    inspiration: 趋势是代理执行链变长后，可观察性从日志文件变成开发者愿意常驻查看的界面；切入可面向把 Claude Code 接入内部流程的团队，做执行审计与中断控制，而不是再做一个通用编码助手。
    summary_en: Developers using Claude Code open this local side panel while an agent runs a multi-step
      chain; it receives tool-call, model-step, hook, skill and subagent events and lights up the corresponding
      nodes in real time so the developer can see which step is executing. The deliverable is an observable
      execution map; whether runs can be replayed or exported still needs verification.
    inspiration_en: The trend is that as agent execution chains lengthen, observability shifts from log
      files to an interface developers keep open; the entry point is teams wiring Claude Code into internal
      workflows, selling execution audit and interrupt control rather than another general coding assistant.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 的开发者在其代理连续执行多步工具调用时，需要判断当前进行到哪一步、哪些 hooks 与子代理被触发，以便决定是否中断或调整指令。
        job_en: Developers using Claude Code who, while an agent runs a long chain of tool calls, need
          to see which step, hook or subagent is active in order to decide whether to interrupt or adjust
          the prompt.
        pain_zh: 代理执行过程默认以滚动文本呈现，步骤一多就难以分辨当前动作与已触发环节，出错时定位成本高。
        pain_en: Agent execution is normally shown as scrolling text, so with many steps it is hard to
          tell the current action from already-triggered parts, and locating a failure is costly.
        current_alternative_zh: 开发者目前靠翻看终端输出、日志文件或反复追问代理来还原执行过程。
        current_alternative_en: Developers currently reconstruct execution by scrolling terminal output,
          reading log files or repeatedly asking the agent what it did.
        usage_reason_zh: 相较翻日志，它把工具调用与子代理事件直接映射到实时点亮的节点上，减少人工比对时间戳与输出行这一步；推断关注执行可控性的开发者会在长链路调试时选择它。
        usage_reason_en: Compared with reading logs, it maps tool-call and subagent events onto nodes
          that light up in real time, removing the manual step of matching timestamps to output lines;
          by inference, developers who care about execution control will pick it when debugging long chains.
      gates:
      - gate: value
        status: supported
        reason: 它解决代理多步执行时看不清当前步骤的痛点，旧做法是翻日志，交付是可观察的执行地图。
        evidence_ids:
        - ev-91eb21caca17eb14
        - ev-06a7bf31f262a6ce
      - gate: consensus
        status: insufficient
        reason: 星标增长只说明关注度，缺少用户反馈说明它是否被长期留在调试流程里。
        evidence_ids:
        - ev-06a7bf31f262a6ce
      - gate: model
        status: insufficient
        reason: 开源本地工具，公开材料未披露任何收费或赞助路径，买方不明。
        evidence_ids:
        - ev-91eb21caca17eb14
      - gate: truth
        status: insufficient
        reason: 展示的是执行事件而非结果校验，能否帮助定位错误尚无公开案例支持。
        evidence_ids:
        - ev-91eb21caca17eb14
      next_validation: 收集该仓库 issue 与 discussion 中开发者描述的实际调试场景，确认它是否被用于定位执行错误。
