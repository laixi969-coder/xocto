    summary_zh: 开发团队在自托管的 Slack 式频道和私信里，把 Claude、ChatGPT/Codex、Gemini 或 Grok 驱动的代理拉进来，代理可调用 MCP 工具、使用自己的电脑与浏览器、按例程和记忆执行任务，成员在频道内审批。用户拿到的是频道里可追溯的任务执行与审批记录；具体交付质量与部署门槛仍待核验。
    inspiration: 趋势：团队协作界面正在变成 AI 代理的工作场所，代理与人在同一频道里共享上下文和审批。切入：从对数据主权敏感、又想让代理直接动手的工程团队入手，卖自托管部署与审批审计，而不是再做一个通用聊天入口；价格未披露，不预设。
