        pain_en: Away from a computer, developers cannot run their development environment and must wait
          to return to a desk; sending code or data to a remote server adds privacy and connectivity dependence.
        current_alternative_zh: 旧做法是回到电脑上运行本地环境，或通过远程服务器、云端 IDE 处理，需要联网并上传材料。
        current_alternative_en: The old approach is returning to a computer to run a local environment,
          or using a remote server or cloud IDE, which requires connectivity and uploading materials.
        usage_reason_zh: 推断：相较远程服务器或云端 IDE，它把运行环境放在设备本机，减少上传代码与等待联网这一步，因此在意数据不出设备和离线可用的开发者会在移动场景选择它；尚无用户反馈或留存证据支持长期使用。
        usage_reason_en: 'Inference: versus a remote server or cloud IDE, it keeps the runtime on the
          device, removing the upload-and-wait-for-network step, so developers who care about data staying
          on-device and offline use may choose it on mobile; no user feedback or retention evidence yet
          supports long-term use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者离开电脑时无法运行开发环境、又不愿上传代码到远程服务器的问题，痛点具体且交付为移动端运行结果。
        evidence_ids:
        - ev-b8707466451e8cb8
        - ev-4f025dbdacbba4ba
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 294 增至 415 的关注度信号，缺少用户评价或采用数据说明开发者是否真的在移动场景使用。
        evidence_ids:
        - ev-b8707466451e8cb8
        - ev-4f025dbdacbba4ba
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价、付费方式或买方，钱可能来自个人开发者或应用内购买，这是判断而非已验证事实。
        evidence_ids:
        - ev-4f025dbdacbba4ba
      - gate: truth
        status: insufficient
        reason: 本机运行能否在手机上确定性完成开发任务、任务范围与人工确认边界均未核验，需看实际可复现结果。
        evidence_ids:
        - ev-b8707466451e8cb8
      next_validation: 收集 fish-pocket 官方应用页或仓库文档中关于可运行任务范围、离线能力与定价的公开说明。
    event_summary_zh: 2026 年 11 月 5 日发布的 fish-pocket 提供在 iPhone 和 iPad 本机运行 DeepSeek Harness 的原生 iOS 版本，无需连接电脑或服务器；其仓库星数在
      11 月 17 日至 22 日间由 294 增至 415。
    event_summary_en: Released on 5 November 2026, fish-pocket offers a native iOS build that runs DeepSeek
      Harness on iPhone and iPad without a computer or server; its repository stars rose from 294 to 415
      between 17 and 22 November.
