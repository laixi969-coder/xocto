  fireworks-ai:
    slug: fireworks-ai
    name: Fireworks AI
    decision: market_context
    event_summary_zh: 2026年11月，Fireworks AI 在数周内第二次通报安全事件，黑客经由该平台访问了 Notion 客户的聊天记录；同期报道称客户因 GPU 供给紧张而非安全因素继续留用，并称其正以开放模型作为
      Anthropic 的替代方案。这属于模型推理供给层的竞争与信任问题，不是独立应用产品的新增事实。
    event_summary_en: In November 2026, Fireworks AI notified customers of a second security incident
      within weeks, with hackers reaching Notion customers' chat transcripts through the platform; reports
      also said customers stay because of GPU scarcity rather than security, and that it positions open
      models as an alternative to Anthropic. This is a competition and trust issue in the model-inference
      supply layer, not a new fact about a standalone application product.
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 模型推理与托管服务商，向应用开发者提供开放模型的调用与 GPU 容量。本次材料只涉及安全事件与供给紧张，未提供可核验的定价、客户付费或交付细节。
    inspiration: 推理供给层正在以开放模型替代闭源模型作为卖点，但连续安全事件说明这一层的信任成本在上升；对应用创业者的含义是，模型路由与数据隔离会成为采购时的实际门槛，而不是单纯比价。
    summary_en: A model inference and hosting provider that gives application developers access to open
      models and GPU capacity. The material here covers only security incidents and supply tightness,
      with no verifiable pricing, customer payment or delivery details.
    inspiration_en: The inference layer is selling open models as a substitute for closed ones, but repeated
      breaches show trust costs rising in this layer; for application founders this means model routing
      and data isolation become real procurement thresholds rather than pure price comparisons.
