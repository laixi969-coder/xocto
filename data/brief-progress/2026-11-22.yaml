          which change and what it altered, pushing review burden onto developers.
        current_alternative_zh: 旧做法是用 Git 分支、提交记录和人工代码审查管理改动，代理产出也塞进同一套流程。
        current_alternative_en: The old approach uses Git branches, commit history and manual code review,
