  100b-in-company-value-one-shared-ambition-european-tech-lead:
    slug: 100b-in-company-value-one-shared-ambition-european-tech-lead
    name: Slush 2026 European Tech Leaders Declaration
    decision: market_context
    summary_zh: 2026年11月，35位以上欧洲科技创始人与企业领袖在Slush 2026发表联合宣言，代表逾1000亿欧元公司价值和11.5万个岗位，呼吁欧洲科技政策作出三项根本性调整。该宣言本身不构成产品，但反映欧洲科技资本动员与政策游说正在组织化，可能影响欧洲AI创业公司的融资环境与监管取向。
    summary_en: In November 2026, more than 35 European tech founders and business leaders issued a joint
      declaration at Slush 2026, representing over EUR 100 billion in company value and 115,000 jobs,
      calling for three fundamental shifts in European tech policy. The declaration is not a product,
      but it shows organized capital mobilization and policy lobbying in European tech, which could affect
      financing conditions and regulatory direction for European AI startups.
    event_summary_zh: 35位以上欧洲科技创始人与企业领袖于2026年11月在Slush 2026发表联合宣言，代表逾1000亿欧元公司价值和11.5万个岗位，提出三项科技政策改革诉求。
    event_summary_en: More than 35 European tech founders and business leaders issued a joint declaration
      at Slush 2026 in November 2026, representing over EUR 100 billion in company value and 115,000 jobs,
      setting out three tech policy reform demands.
