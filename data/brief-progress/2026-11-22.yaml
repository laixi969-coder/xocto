  instinct:
    slug: instinct
    name: Instinct
    decision: watching
    event_summary_zh: 2026年10月至11月，Instinct 官网持续展示同一产品说明：用户可通过短信或电话让助手代为下单食材、预订周末回家的火车票、购买日用品、送花和查找周末球场，并称其能像用户一样操作手机和电脑；本批材料未出现定价、客户案例、使用量或融资等新增事实。
    event_summary_en: 'From October to November 2026, Instinct''s site repeatedly described the same product:
      users can text or call the assistant to order recipe ingredients, book a train home for the weekend,
      buy groceries, send flowers, and find a court for the weekend, with the claim that it can use a
      phone and computer as the user does. This batch contains no new facts on pricing, customer cases,
      usage, or funding.'
