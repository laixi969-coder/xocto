      motion effects and would otherwise hand-write them or pull in an animation library; effect-atlas
      offers web motion effects written in plain JavaScript and aimed at AI coding assistants, so the
      assistant can write the effect code into the site. The user ends up with embeddable motion code;
      the exact delivery form and human review step still need verification.
