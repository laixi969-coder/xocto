  open-guardrail-2:
    slug: open-guardrail-2
    name: open-guardrail
    decision: watching
    category: 基础层
    project_type: open_source
    industries:
    - 企业软件与自动化运维
    industries_en:
    - enterprise software and automation operations
    jobs:
    - 企业在让 AI 代理执行自动化工作流时，需要按版本化策略对代理动作做允许或拒绝判定，并留下可审计的证据记录
    jobs_en:
    - Enterprises running AI agents in automated workflows need versioned policies to allow or deny agent
      actions and keep auditable evidence records
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 企业在让 AI 代理执行自动化工作流时，用它对代理动作按版本化策略做允许或拒绝判定，并留下结构化证据供审计。具体部署与合规效果仍待核验。
    inspiration: 趋势：AI 代理从“说什么”转向“做什么”，动作级管控与可审计成为落地前提。切入：面向已有代理自动化流程的企业，从动作放行与审计留痕这一环节进入，卖点是可审计的允许/拒绝判定，而非内容过滤；价格未披露。
    summary_en: When enterprises let AI agents run automated workflows, this tool allows or denies agent
      actions against versioned policies and keeps structured evidence for audit. Deployment and compliance
      outcomes remain to be verified.
    inspiration_en: 'Trend: AI agents shift from what they say to what they do, making action-level control
      and auditability a precondition for deployment. Entry: target enterprises with existing agent automation
      at the action-approval and audit-trail step, selling auditable allow/deny decisions rather than
      content filtering; pricing undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业在让 AI 代理执行自动化工作流时，需要按版本化策略对代理动作做允许或拒绝判定，并留下可审计证据。
        job_en: When enterprises run AI agents in automated workflows, they need versioned policies to
          allow or deny agent actions and keep auditable evidence.
        pain_zh: 代理动作一旦出错或越权后果严重，缺少可追溯的放行记录难以审计与追责。
        pain_en: A wrong or overreaching agent action is costly, and without traceable approval records
          auditing and accountability are hard.
        current_alternative_zh: 靠人工审查代理输出或事后日志排查，缺少动作级、版本化的放行机制。
        current_alternative_en: Relying on manual review of agent output or after-the-fact log checks,
          lacking action-level, versioned approval.
        usage_reason_zh: 相较事后日志排查，它在动作执行前按策略判定并留存结构化证据，减少事后追责与审计这一步，因此有代理自动化的企业会选用（推断）。
        usage_reason_en: Versus after-the-fact log checks, it decides before action execution against
          policies and keeps structured evidence, cutting the accountability and audit step, so enterprises
          with agent automation would choose it (inference).
      gates:
      - gate: value
        status: supported
        reason: 它解决代理动作越权与审计留痕的痛点，旧做法是人工审查或事后日志排查。
        evidence_ids:
        - ev-84420ce79d95de0c
        - ev-f4a3294805d5c14c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标，缺少企业实际部署或客户案例，采用共识未形成。
        evidence_ids:
        - ev-84420ce79d95de0c
        - ev-f4a3294805d5c14c
      - gate: model
        status: insufficient
        reason: 开源项目未披露商业化与买方，付费路径尚未核验。
        evidence_ids:
        - ev-84420ce79d95de0c
        - ev-f4a3294805d5c14c
      - gate: truth
        status: insufficient
        reason: 动作级放行贴近安全第一性目标，但判定确定性与合规效果缺少公开验证。
        evidence_ids:
        - ev-84420ce79d95de0c
        - ev-f4a3294805d5c14c
      next_validation: 查看 open-guardrail 官方文档或仓库 issue，确认策略判定的确定性与企业部署案例。
