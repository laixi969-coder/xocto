    inspiration: 趋势：小游戏原型从写代码、找美术、配部署的多步流程，被压缩成一句话加一键发布，说明创作工具正往“描述即交付”走。切入：可从独立游戏社群、Game Jam 或教学场景进入，卖托管与素材包而非单纯生成；但需先确认生成结果是否真能玩、发布后是否有人持续使用。
