    inspiration: 趋势：药物发现的前端筛选正从纯实验试错转向“先算后测”，开源模型加平台 API 让这类能力不再只属于大药企。切入：从中小生物技术公司和高校转化实验室切入，按靶点或按候选评估结果收费，把模型预测与实验室验证串成一条可交付链路；具体定价与客户案例尚未披露。
