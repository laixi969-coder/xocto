  mep:
    slug: mep
    name: MEP (Motion Edit Protocol)
    decision: watching
    event_summary_zh: 2026年11月19日出现一个名为 MEP（Motion Edit Protocol）的开源文件协议，宣称让任意 AI 助手编辑视频项目；公开仓库显示 59 个星标、6
      个分叉、0 个未关闭 issue。
    event_summary_en: On 19 November 2026, an open file-based protocol called MEP (Motion Edit Protocol)
      appeared, claiming to let any AI assistant edit a video project; the public repository shows 59
      stars, 6 forks and 0 open issues.
    category: AI + 创作
    project_type: open_source
    industries:
    - 视频制作
    - 影视后期
    industries_en:
    - video production
    - post-production
    jobs:
    - 视频剪辑师或后期团队在已有剪辑工程中需要批量修改片段、字幕或时间线时，把工程文件交给 AI 助手按指令改写，再回到剪辑软件核对成片
    jobs_en:
    - Video editors or post-production teams who need to batch-modify clips, subtitles or timelines in
      an existing edit hand the project file to an AI assistant to rewrite per instructions, then check
      the result back in the editing software
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 视频剪辑师在已有剪辑工程里要批量改片段、字幕或时间线时，把工程文件交给 AI 助手，由助手按指令改写项目文件，用户再回到剪辑软件核对成片。候选只给出协议定位与仓库星标，具体支持哪些剪辑软件、能改哪些字段、交付是否可确定仍待核验。
    inspiration: 趋势：剪辑工程正被抽成可被 AI 读写的文件格式，而不是让模型直接生成视频。切入：从后期团队重复性最高的字幕对齐、版本替换、批量裁切入手，按项目或按次交付改写后的工程文件；协议本身不是壁垒，绑定某类剪辑软件的实际兼容与回滚能力才是。
    summary_en: When video editors need to batch-modify clips, subtitles or timelines in an existing edit,
      they hand the project file to an AI assistant, which rewrites the project file per instructions,
      and the user checks the result back in the editing software. The candidate only gives the protocol
      positioning and repository stars; which editors are supported, which fields can be changed and whether
      delivery is deterministic still need verification.
    inspiration_en: 'Trend: editing projects are being abstracted into file formats that AI can read and
      write, rather than having models generate video directly. Entry: start from the most repetitive
      post-production tasks — subtitle alignment, version swaps, batch trimming — and deliver the rewritten
      project file per project or per run; the protocol itself is not the moat, real compatibility and
      rollback for a specific editing tool is.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 视频剪辑师或后期团队在已有剪辑工程中需要批量修改片段、字幕或时间线时，把工程文件交给 AI 助手按指令改写，再回到剪辑软件核对成片。
        job_en: Video editors or post-production teams who need to batch-modify clips, subtitles or timelines
          in an existing edit hand the project file to an AI assistant to rewrite per instructions, then
          check the result back in the editing software.
        pain_zh: 批量改动目前靠人工在时间线上逐条操作或写脚本，重复且易漏；剪辑软件自带脚本能力门槛高，非技术剪辑师难以自行完成。
        pain_en: Batch changes are currently done by hand on the timeline item by item or by writing scripts,
          which is repetitive and error-prone; built-in scripting in editing software is high-threshold
          and hard for non-technical editors.
        current_alternative_zh: 人工逐条修改、剪辑软件内置脚本或插件、导出后重新剪辑；这些方式要么慢，要么需要编程能力。
        current_alternative_en: Manual item-by-item edits, built-in scripts or plugins in editing software,
          or re-editing after export; these are either slow or require programming ability.
        usage_reason_zh: 推断：若协议真能让 AI 助手直接读写工程文件，剪辑师可用自然语言描述批量改动，省去逐条操作或写脚本这一步，再回软件核对；因此会在重复性批量修改场景下选择它。协议的实际兼容范围与可回滚性尚未公开，这是判断而非已验证事实。
        usage_reason_en: 'Inference: if the protocol really lets an AI assistant read and write project
          files directly, editors can describe batch changes in natural language, skipping item-by-item
          edits or scripting, then verify in the software; that is why they would choose it for repetitive
          batch changes. Actual compatibility and rollback are not yet public; this is a judgment, not
          verified fact.'
      gates:
      - gate: value
        status: supported
        reason: 它解决剪辑工程中批量改片段、字幕、时间线的重复劳动，旧做法是人工逐条改或写脚本，痛点具体且刚性；但协议实际能改哪些字段尚未公开。
        evidence_ids:
        - ev-065f7712a497bf68
      - gate: consensus
        status: insufficient
        reason: 仅有 59 个星标和 6 个分叉，属于关注度信号，没有剪辑师采用、案例或社区讨论支持共识。
        evidence_ids:
        - ev-065f7712a497bf68
      - gate: model
        status: insufficient
        reason: 开源协议本身没有披露收费方式；钱可能来自围绕协议的商业剪辑工具或服务，这是判断，不是已验证事实。
        evidence_ids:
        - ev-065f7712a497bf68
      - gate: truth
        status: insufficient
        reason: 未说明支持哪些剪辑软件、改写是否可回滚、人工核对边界；承诺能否确定性交付仍缺公开材料。
        evidence_ids:
        - ev-065f7712a497bf68
      next_validation: 收集该协议仓库的 README 与 issue/discussion，确认其声明支持的剪辑软件、可改写字段与回滚机制。
