        usage_reason_zh: 推断：相较逐个合成再测的旧流程，模型在合成前先给出结合构象、结合强度和新分子建议，减少无效候选进入实验室的那一步，因此预算有限、缺少内部计算团队的中小生物技术公司更可能选择它。
        usage_reason_en: 'Inference: compared with synthesizing and testing one by one, the models give
