    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 AI 编码代理的开发者，在让代理动手写代码前，会打开这套指令与技能集，把需求整理成计划；代理产出代码后，再按“计划→批判性审查→差异审计”三段流程检查改动。用户最终拿到的是经过人工确认的审查结论，具体交付形态仍待核验。
    inspiration: 趋势：AI 编码代理开始写越来越多代码，审查代理产出正在成为新的瓶颈环节，而不是写代码本身。切入：从需要合规留痕的团队切入，把三段审查流程做成可审计的合并前检查，按团队或仓库收费；目前只有开源指令集，没有付费路径证据。
    summary_en: 'Developers using AI coding agents open this instruction and skill set to turn requirements
      into a plan before the agent writes code, then check the resulting changes through a three-stage
      flow: planning, critical review, and diff audit. The user ends up with a human-confirmed review
      conclusion; the exact delivery format still needs verification.'
    inspiration_en: 'Trend: as AI coding agents write more code, reviewing agent output is becoming the
      new bottleneck rather than writing itself. Entry: target teams that need auditable records, packaging
      the three-stage review as a pre-merge check sold per team or repository; today it is only an open
      instruction set with no evidence of a paid path.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 AI 编码代理的开发者，在让代理开始写代码前，需要把需求整理成计划，并在合并前审查代理产出的代码差异。
        job_en: Developers using AI coding agents need to turn requirements into a plan before the agent
          writes code, and audit the agent's code diff before merging.
        pain_zh: 代理一次生成大量改动，人工逐行核对成本高，容易漏掉错误或越界修改；缺少固定审查步骤时质量依赖个人习惯。
        pain_en: An agent produces large changes at once, making line-by-line human checking costly and
          prone to missing errors or out-of-scope edits; without a fixed review step, quality depends
          on individual habits.
        current_alternative_zh: 开发者各自写提示词、靠代码评审工具或人工通读差异，流程不统一。
        current_alternative_en: Developers write their own prompts and rely on code review tools or manually
          reading diffs, with no consistent process.
        usage_reason_zh: 推断：它把审查拆成计划、批判性审查、差异审计三个固定步骤，让开发者在代理产出后按同一顺序检查，减少自行设计审查流程的负担；是否被长期留在工作流中缺少证据。
        usage_reason_en: 'Inference: it splits review into three fixed steps—planning, critical review,
          diff audit—so developers check agent output in the same order, reducing the burden of designing
          a review process themselves; evidence that it stays in workflows long-term is missing.'
      gates:
