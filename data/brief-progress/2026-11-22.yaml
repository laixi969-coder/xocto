    inspiration: 趋势：会议记录正从人工速记转向由 AI 直接产出结构化纪要，资本愿意为这一环节单独下注。切入：可从律所、咨询、猎头等高频客户会议人群进入，按会议场次或团队席位收费；但通用会议助手已密集，需在行业术语与合规留痕上做出差异。
    summary_en: Professionals such as consultants and sales staff open Granola during client meetings;
      it takes in meeting audio and the user's rough notes and turns them into structured meeting records
      that the user then edits into minutes and action items. The exact deliverable format and human confirmation
      step still need verification.
    inspiration_en: 'Trend: meeting notes are shifting from manual shorthand to AI-produced structured
      minutes, and capital is willing to bet on this step alone. Entry: start with high-frequency client-meeting
      users such as law firms, consultancies and recruiters, charging per meeting or per team seat; generic
      meeting assistants are already crowded, so differentiation must come from industry terminology and
      compliance-grade records.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 咨询顾问、销售在客户会议中边听边记，会后要把零散笔记整理成纪要和待办。
        job_en: Consultants and sales staff take notes during client meetings and afterwards must turn
          scattered notes into minutes and action items.
        pain_zh: 会议中同时倾听与记录会分散注意力，会后手工整理纪要耗时且容易漏掉承诺事项。
        pain_en: Listening and note-taking at once splits attention, and manually writing up minutes afterwards
          is slow and easily drops commitments.
        current_alternative_zh: 人工速记加会后手写纪要，或使用通用录音转写工具再自行整理。
        current_alternative_en: Manual shorthand plus hand-written minutes afterwards, or generic transcription
          tools followed by manual cleanup.
        usage_reason_zh: 推断：Granola 在会议进行中直接接收音频与用户要点，省去会后从录音重新听写这一步，让用户拿到可编辑的结构化记录；经常开客户会议且需要留痕的专业人士会因此选择它。
        usage_reason_en: 'Inference: Granola ingests audio and user notes during the meeting, removing
          the post-meeting step of re-listening to recordings and giving users an editable structured
          record; professionals with frequent client meetings who need a paper trail would choose it for
          this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决会议中记录分散、会后整理纪要耗时且易漏项的需求，痛点具体且高频，旧做法是人工速记加手写纪要。
        evidence_ids:
        - ev-a7843ecc17096013
      - gate: consensus
        status: insufficient
        reason: 仅有融资榜单提及，缺少用户评价、客户案例或持续使用证据，无法判断共识是否形成。
        evidence_ids:
