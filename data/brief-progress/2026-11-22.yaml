        job_en: Researchers or engineering evaluators testing browser-agent capability have an agent rebuild
          a page using only browsing of a target site, then compare agent performance.
        pain_zh: 缺少统一任务来衡量代理能否把浏览到的界面还原成可用站点，评估者只能各自搭测试，结果难以横向比较。
        pain_en: There is no shared task for measuring whether an agent can turn a browsed interface into
          a working site, so evaluators build their own tests and results are hard to compare.
        current_alternative_zh: 评估者自行编写网页任务脚本，或直接人工复刻页面来对比代理输出。
        current_alternative_en: Evaluators write their own web-task scripts or manually replicate pages
