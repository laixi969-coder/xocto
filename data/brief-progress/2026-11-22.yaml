      that hold large internal rulebooks, where the moat is inaccessible department-level text rather
      than the model. Entry: start with police, fire and corrections agencies that have mandatory compliance
      manuals, charge per department document library, and begin with on-duty Q&A and report compliance
      checks.'
    req_initial:
