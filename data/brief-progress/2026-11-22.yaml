  ainews-riemann-hypothesis-provedtwice-independently:
    slug: ainews-riemann-hypothesis-provedtwice-independently
    name: Claude
    decision: market_context
    summary_zh: Anthropic的Levent Alpöge于2026年11月发布由Claude生成、附Lean形式化代码的黎曼猜想证明笔记，同期另一位数学家发布其12年人工证明；这显示前沿模型在形式化数学证明中的角色上升，但证明仍需多年验证，尚不能推断数学研究整体已转向AI。
    summary_en: In November 2026, Anthropic's Levent Alpöge released a Claude-generated Riemann Hypothesis
      proof note with Lean formalization code, while another mathematician released a 12-year human proof;
      this shows frontier models taking a larger role in formal math proofs, but verification will take
      years and it cannot be inferred that mathematical research as a whole has shifted to AI.
    event_summary_zh: Anthropic的Levent Alpöge发布由Claude驱动、附约1.3GB Lean代码的黎曼猜想证明笔记，同期Alessandro Masullo发布其历时12年的940页人工证明。
    event_summary_en: Anthropic's Levent Alpöge released a Claude-driven Riemann Hypothesis proof note
      with about 1.3GB of Lean code, while Alessandro Masullo released his 940-page, 12-year human proof.
