      - gate: truth
        status: insufficient
        reason: 未见成片质量、投放结果或人工复核边界的公开材料，交付确定性无法核对。
        evidence_ids:
        - ev-b81b5b4aa29d62a4
      next_validation: 收集 ViralForge 仓库的 issue、discussion 或 README 中的实际使用示例与输出样例，核对拆解报告与变体的交付质量。
