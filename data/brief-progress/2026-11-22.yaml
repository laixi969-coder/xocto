    summary_zh: 短视频运营在要复刻一条爆款时，把对标视频交给 ViralForge，它拆出钩子与脚本形成 Viral DNA 报告，再产出 10 个带成本的变体；用户拿到的是可挑选的改写脚本与成本估算，最终成片与投放仍需人工确认。具体流程与交付质量仍待核验。
