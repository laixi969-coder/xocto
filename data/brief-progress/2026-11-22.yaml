    summary_en: For teams making explainer videos and product demos, users hand a script to an AI agent,
      and local voice synthesis, word-level timing and a canvas renderer produce a narrated MP4. It is
      the visual interface for Explainroo, free and open source; the final video still needs human review
      of visuals and narration.
    inspiration_en: 'Trend: explainer video production is shifting from editing software to a script-in,
      video-out agent pipeline, with narration and timing handled by local models. Entry: start with SaaS
      release notes and developer documentation demos, charging per finished video and turning script-to-video
      into a repeatable pipeline; the open-source UI itself is hard to monetize, so value sits in hosting
      and templates.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 市场与产品团队在需要制作产品演示或讲解视频时，把写好的脚本交给代理，生成带旁白的 MP4。
        job_en: Marketing and product teams producing product demos or explainer videos hand a written
          script to an agent to generate a narrated MP4.
        pain_zh: 讲解视频要写脚本、录音、对齐字幕、逐帧排版，小团队往往没有剪辑人手，外包一条视频周期长且改稿贵。
        pain_en: Explainer videos require scripting, recording, subtitle alignment and frame-by-frame
          layout; small teams often lack editors, and outsourcing one video is slow and costly to revise.
        current_alternative_zh: 人工用剪辑软件制作，或外包给视频工作室，或用通用 AI 视频工具再手工拼接。
        current_alternative_en: Manual editing in video software, outsourcing to a video studio, or using
          general AI video tools and stitching manually.
        usage_reason_zh: 推断：它把脚本直接转成带旁白与词级时间对齐的成片，省去录音、对齐字幕和排版三步手工操作，因此需要频繁产出演示视频的产品与市场团队会在脚本已就绪时选择它。
        usage_reason_en: 'Inference: it turns a script directly into a finished video with narration and
          word-level timing, removing the manual steps of recording, subtitle alignment and layout, so
          product and marketing teams producing demos frequently would choose it once the script is ready.'
      gates:
