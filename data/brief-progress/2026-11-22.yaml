  dsh-grok-search:
    slug: dsh-grok-search
    name: dsh-grok-search
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在为 DeepSeek Harness 配置联网检索时，接入并切换多个搜索服务商，让代理能稳定取回网页结果
    jobs_en:
    - Developers wiring web search into DeepSeek Harness, connecting and switching among multiple search
      providers so the agent reliably retrieves web results
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在为 DeepSeek Harness 配置联网检索时打开它，把 Grok 主搜索与 Tavily、Exa、TinyFish、Firecrawl 等备用检索源接入同一入口；主源失败时自动回退，用户拿到的是代理可持续取回网页结果的检索链路。具体交付形态与配置流程仍待核验。
    inspiration: 趋势：代理的检索可靠性正从模型能力问题变成工程配置问题，多源回退开始被单独做成组件。切入：面向自建代理的小团队或代理托管服务商，按可用的检索结果或调用量计费，把“检索不中断”当作可承诺的交付，而不是再做一个通用搜索框。
    summary_en: Developers open this while configuring web search for DeepSeek Harness, connecting Grok
      search as the primary source with Tavily, Exa, TinyFish and Firecrawl as fallbacks in one entry
      point; when the primary fails it falls back automatically, giving the agent a retrieval chain that
      keeps returning web results. The exact delivery form and setup flow still need verification.
    inspiration_en: 'Trend: retrieval reliability for agents is shifting from a model-capability problem
      to an engineering-configuration problem, with multi-source fallback packaged as its own component.
      Wedge: target small teams running their own agents or agent-hosting providers, charging per usable
      retrieval result or call volume and promising uninterrupted retrieval as the deliverable rather
      than building another general search box.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在为 DeepSeek Harness 配置联网检索时，需要把主搜索与多个备用检索源接进同一入口，让代理在某个源失败时仍能取回网页结果。
        job_en: While configuring web search for DeepSeek Harness, developers need to connect a primary
          search source and several fallbacks into one entry point so the agent still retrieves web results
          when one source fails.
        pain_zh: 单一搜索源限流或失败会让代理任务中断，开发者要自己写重试与切换逻辑，并分别对接多家检索服务的接口。
        pain_en: A single search source hitting rate limits or failing interrupts agent tasks, forcing
          developers to write their own retry and switching logic and integrate several search APIs separately.
        current_alternative_zh: 开发者通常在代理里手写单一搜索 API 调用，失败后手动换源或重跑任务。
        current_alternative_en: Developers typically hand-code a single search API call inside the agent
          and manually switch sources or rerun the task after failure.
        usage_reason_zh: 推断：它把多家检索源封装成带自动回退的统一入口，开发者省去逐个对接和编写切换逻辑这一步，因此在自建代理需要稳定联网检索时会选择它；尚无公开的持续使用或付费证据。
        usage_reason_en: 'Inference: it wraps multiple search providers into one entry point with automatic
          fallback, sparing developers the step of integrating each API and writing switching logic, so
          teams building agents that need reliable web retrieval would pick it; no public evidence of
          sustained use or payment yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理联网检索时单源失败导致任务中断的问题，痛点是刚性的；开发者原本要手写多源对接与切换，买方是自建代理的开发者或团队。
        evidence_ids:
        - ev-510f4dd2f1e13935
        - ev-cd1063f98edacc38
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏数从 41 缓慢升至 91，属于关注度信号，没有用户反馈或采用案例说明它已进入工作流。
        evidence_ids:
        - ev-510f4dd2f1e13935
        - ev-cd1063f98edacc38
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或商业交付路径；钱可能来自开发者自用或托管服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-cd1063f98edacc38
      - gate: truth
        status: insufficient
        reason: 回退机制能否确定性交付、失败时结果质量如何，公开材料未说明；也未见安全与人工确认边界。
        evidence_ids:
        - ev-510f4dd2f1e13935
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者是否报告实际接入后的检索失败率或回退效果。
    event_summary_zh: 2026 年 11 月，该开源项目为 DeepSeek Harness 提供可视化 Grok 主搜索与 Tavily、Exa、TinyFish、Firecrawl
      自动回退，仓库收藏数在约三周内从 41 增至 91。
    event_summary_en: In November 2026, this open-source project added a visual Grok primary search with
      automatic fallback to Tavily, Exa, TinyFish and Firecrawl for DeepSeek Harness; repository stars
      rose from 41 to 91 over about three weeks.
  dsh-live-compact-2:
    slug: dsh-live-compact-2
    name: dsh-live-compact
    decision: watching
    event_summary_zh: 该开源仓库自 2026-11-03 发布后，公开星标从 291 增至 333，期间开放 issue 39 个；除此之外没有发布、客户、定价或采用数据。
