        current_alternative_en: Developers write styles themselves, reuse existing component libraries
          or design-system templates, or manually adjust agent output page by page afterwards.
        usage_reason_zh: 推断：它把一套 UI/UX 规则直接交给编码代理，在生成阶段就约束页面结构与样式，减少事后逐页返工这一步；因此频繁用代理搭界面的前端开发者会在需要快速产出可用页面时选择它。
        usage_reason_en: 'Inference: it hands a set of UI/UX rules directly to the coding agent, constraining
          page structure and styling at generation time and cutting the later page-by-page rework step;
          front-end developers who frequently build interfaces with agents would choose it when they need
          usable pages fast.'
      gates:
