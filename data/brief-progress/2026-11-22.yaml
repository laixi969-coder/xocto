    summary_zh: 开发团队在把 AI 编码代理接入代码仓库时打开它，原来要处理的是整个仓库的访问权限；它按路径限定开发者或代理可读的 公开代码仓库 内容，让代理在指定目录内工作。用户最终拿到的是受限的仓库访问范围，具体授权流程与交付形态仍待核验。
