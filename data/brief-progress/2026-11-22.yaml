      model-driven tasks; the report gives no application-side adoption or payment data, so concrete impact
      remains to be verified.
    inspiration_en: 'Trend: leading model vendors are using cheap small models to win developer volume,
      pushing inference costs down fast. Entry: avoid competing on general model capability; convert the
      cost drop into outcome-priced services for one vertical legacy workflow, such as batch document
      checking or long-file archiving, starting where unit price sensitivity and task repetition are high;
      window and buyer still need per-industry verification.'
