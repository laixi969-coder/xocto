        reason: 它解决策略验证时不敢让 AI 碰真实账户、手动模拟又费时的问题，默认纸面交易加逐笔确认对应可核对的交付。
        evidence_ids:
        - ev-fe10ef7b8ea85151
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库约 90 星，缺少用户评价、客户案例或采用数据，无法判断交易者是否真的把它放进工作流。
        evidence_ids:
        - ev-fe10ef7b8ea85151
        - ev-5e1202f5597ce2c6
      - gate: model
        status: insufficient
        reason: 公开材料未说明收费方式与买方，开源仓库本身不体现付费路径，这是判断而非已验证事实。
        evidence_ids:
        - ev-fe10ef7b8ea85151
      - gate: truth
        status: insufficient
        reason: 默认模拟与人工放行是贴近交易安全边界的设计，但风控、结算与真实下单链路未见文档，交付确定性待核验。
        evidence_ids:
        - ev-fe10ef7b8ea85151
      next_validation: 收集 bytx 官方文档或仓库 README 中关于模拟盘与真实下单切换、风控与结算流程的说明。
