  agy-fast:
    slug: agy-fast
    name: agy-fast
    decision: watching
    event_summary_zh: 2026-11-19 发布的 agy-fast 是一个面向 Google Antigravity（CLI/桌面/IDE）的非侵入式 MCP 加速插件，作者称其可减少
      34% 的 LLM 轮次、31% 的 token 配额消耗和 40% 的上传流量，且不改变原生界面与 diff；仓库星标从 188 增至 255。
    event_summary_en: Released on 2026-11-19, agy-fast is a non-invasive MCP accelerator plugin for Google
      Antigravity (CLI/desktop/IDE); its author claims it cuts LLM turns by 34%, token quota use by 31%
      and upload traffic by 40% without changing the native UI or diffs. Repository stars rose from 188
      to 255.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用 Google Antigravity 的开发者在一个会话里反复调用 MCP 工具、处理代码与上下文材料时，需要在不改动原生界面和 diff 的前提下压缩模型轮次与 token 消耗，完成同一编码任务
    jobs_en:
    - Developers using Google Antigravity who repeatedly call MCP tools within a session and handle code
      and context material need to complete the same coding task while cutting model turns and token use
      without altering the native UI or diffs
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Google Antigravity 的开发者在一个会话里反复调用 MCP 工具、处理代码与上下文材料时，这个插件在中间层拦截并压缩发给模型的请求，据作者称可减少 34%
      的模型轮次、31% 的 token 配额消耗和 40% 的上传流量，同时不改动原生界面与 diff；用户最终拿到的是同一编码任务下更少的调用与配额消耗，具体压缩机制与效果仍需核验。
    inspiration: 趋势：编码代理的竞争正从模型能力转向单次任务的 token 与轮次成本，围绕特定 IDE/代理的“省配额”中间层开始出现。切入：可从重度使用 Antigravity 或类似代理的团队切入，按节省的配额或席位收费；但该插件绑定单一平台，平台一旦内置压缩即被抹平，需先确认压缩是否改变输出质量。
    summary_en: When developers using Google Antigravity repeatedly call MCP tools and handle code and
      context material in one session, this plugin intercepts and compresses requests to the model at
      a middle layer; its author claims 34% fewer model turns, 31% less token quota use and 40% less upload
      traffic without changing the native UI or diffs. Users get fewer calls and lower quota use for the
      same coding task; the compression mechanism and real effect still need verification.
    inspiration_en: 'Trend: competition among coding agents is shifting from raw model capability to per-task
      token and turn cost, spawning ''quota-saving'' middle layers around specific IDEs and agents. Entry:
      target teams that heavily use Antigravity or similar agents and charge by saved quota or seat; but
      the plugin is tied to one platform and would be erased if the platform builds in compression, so
      first confirm whether compression changes output quality.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Google Antigravity 的开发者在一个会话里反复调用 MCP 工具、处理代码与上下文材料时，需要在不改动原生界面和 diff 的前提下压缩模型轮次与 token
          消耗，完成同一编码任务。
        job_en: Developers using Google Antigravity who repeatedly call MCP tools and handle code and
          context material in one session need to complete the same coding task while cutting model turns
          and token use without altering the native UI or diffs.
        pain_zh: 代理式编码会话中工具调用轮次多、token 配额消耗快、上传流量大，用户要么频繁撞到配额上限，要么为同一任务付出更多调用成本。
        pain_en: Agentic coding sessions involve many tool-call turns, fast token quota burn and heavy
          upload traffic, so users either hit quota limits often or pay more calls for the same task.
        current_alternative_zh: 旧做法是手动精简上下文、减少工具调用或直接接受更高的配额消耗与费用，没有现成的非侵入式压缩层。
        current_alternative_en: The prior approach is manually trimming context, reducing tool calls,
          or simply accepting higher quota use and cost; there is no ready non-invasive compression layer.
        usage_reason_zh: 推断：相较手动精简上下文，该插件在请求层自动压缩，减少模型轮次与 token 配额消耗，因此重度使用 Antigravity 且受配额约束的开发者会在长会话中选用它；是否影响输出质量尚未核验。
        usage_reason_en: 'Inference: compared with manually trimming context, the plugin compresses at
          the request layer automatically, cutting model turns and token quota use, so developers who
          heavily use Antigravity and are quota-constrained would choose it in long sessions; whether
          output quality is affected is not yet verified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理式编码会话中轮次多、token 配额消耗快的问题，旧做法是手动精简上下文或接受更高费用，痛点具体且可核对。
        evidence_ids:
        - ev-6285173aa97ba2fb
        - ev-0f902ce331e23ca2
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 188 增至 255 只说明关注度，缺少用户反馈或案例证明它被持续留在工作流里。
        evidence_ids:
        - ev-0f902ce331e23ca2
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露；可能来自企业支持或托管服务，这是判断而非已验证事实。
        evidence_ids:
        - ev-6285173aa97ba2fb
      - gate: truth
        status: insufficient
        reason: 压缩是否改变输出质量、是否贴近编码任务的第一性目标，公开材料未给出可复现实测。
        evidence_ids:
        - ev-6285173aa97ba2fb
      next_validation: 收集仓库 issue/discussion 中关于压缩后输出质量与配额节省的可复现实测反馈。
