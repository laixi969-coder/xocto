        job_en: A non-technical founder or small-team lead wants to turn a web app idea into something
          launchable, which previously required hiring developers or learning to code.
        pain_zh: 从想法到可运行应用之间存在技能与时间门槛，外包沟通成本高、周期长，早期验证阶段尤其难承受。
