      tarobird moves those terminal sessions into a desktop and mobile messaging interface: up to 12 side-by-side
      chats, goals split into tasks, bots messaging each other, and sessions resumed from a phone. The
      user gets centrally managed multi-agent sessions and task division; delivery quality and human confirmation
      steps remain to be verified.'
    inspiration_en: The trend is that once agents run in parallel, managing sessions becomes its own burden
      and the interface layer shifts from terminal to messaging-style collaboration. A possible entry
      is a hosted multi-agent workbench for small teams that do not code but use agents for document work
      or scripted batch jobs, charged per task or seat; first confirm whether non-technical users will
      actually pay for session management.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 在电脑上同时跑多个命令行 AI 代理的人，需要在离开电脑时用手机查看进度、恢复某个会话，并把一个目标拆给多个代理分头完成。
        job_en: People running several command-line AI agents on a computer need to check progress from
          a phone, resume a specific session while away, and split one goal across multiple agents.
        pain_zh: 多个终端窗口分散、切走就看不到进度、手机上无法接续，代理之间也无法互相传递任务，用户要自己记哪个窗口在做什么。
        pain_en: Multiple terminal windows are scattered, progress is invisible once you step away, sessions
          cannot be continued on a phone, and agents cannot hand tasks to each other, so the user must
          remember what each window is doing.
        current_alternative_zh: 用户目前靠多个终端标签页、tmux 或远程桌面手动切换和记录，缺少统一的多代理会话视图。
        current_alternative_en: Users currently juggle multiple terminal tabs, tmux or remote desktop
          and track sessions by hand, with no unified multi-agent session view.
        usage_reason_zh: 推断：tarobird 把终端会话映射成聊天窗口并支持手机恢复，减少了切换窗口和手动记录这一步负担，因此经常离开电脑但仍要盯代理进度的人会尝试它；是否长期留在工作流尚无留存证据。
        usage_reason_en: 'Inference: tarobird maps terminal sessions into chat windows and supports phone
          resume, removing the step of switching windows and tracking sessions by hand, so people who
          leave the desk but still monitor agents may try it; there is no retention evidence that it stays
          in the workflow.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多代理并行时会话分散、离开电脑就断线、任务无法分派的痛点，旧做法是手动管理多个终端，需求结构成立。
        evidence_ids:
        - ev-35e7367306a68fba
        - ev-f02647ff061a1023
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 42 增至 160 的关注度信号，缺少用户评价或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-35e7367306a68fba
        - ev-f02647ff061a1023
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方式或买方，收入路径是判断而非已验证事实。
        evidence_ids:
        - ev-f02647ff061a1023
      - gate: truth
        status: insufficient
        reason: 会话恢复与多代理协作能否稳定交付、人工确认边界如何，公开材料未给出可复现实测。
        evidence_ids:
        - ev-35e7367306a68fba
      next_validation: 收集 tarobird 仓库的 issue 与 discussion，确认用户实际报告的多代理会话恢复与任务分派使用情况。
