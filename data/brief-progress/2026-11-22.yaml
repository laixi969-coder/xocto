  researcher-plants-2m-canaries-into-the-ai-supply-chain-a-pri:
    slug: researcher-plants-2m-canaries-into-the-ai-supply-chain-a-pri
    name: AI supply chain data leakage research
    decision: market_context
    summary_zh: 研究人员在经由 AI 路由服务（如 OpenRouter、Vercel 等网关）转发的请求中植入 200 万个数字诱饵，发现敏感信息在 AI 服务链条中大量泄露。该发现表明，企业通过第三方路由接入模型时，凭证与提示数据可能外泄，这会抬高
      AI 应用在安全合规上的采用门槛，并推动对网关与推理链路的数据保护需求（推断）。
    summary_en: Researchers planted 2 million digital tripwires in requests routed through AI broker services
      such as OpenRouter and Vercel gateways and found sensitive information leaking extensively across
      the AI service chain. The finding indicates that credentials and prompt data can leak when enterprises
      reach models through third-party routers, raising the security and compliance bar for AI adoption
      and driving demand for data protection across gateways and inference chains (inference).
    event_summary_zh: 一项实验在经由 AI 路由服务转发的请求中植入 200 万个数字诱饵，发现 AWS 访问密钥、SSH 密码和唯一 URL 等敏感数据在 AI 服务链条中被大量泄露。
    event_summary_en: An experiment planted 2 million digital tripwires in requests routed through AI
      broker services and found sensitive data such as AWS access keys, SSH passwords and unique URLs
      leaking extensively across the AI service chain.
