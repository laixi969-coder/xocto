    open_source: false
    summary_zh: 这是腾讯2026年三季度财报披露的AI投入结构：单季资本开支814亿元、同比增527%，新AI业务对经营利润的净影响扩大到约152亿元。它说明大厂正把当期现金换成算力与模型，对应用层意味着推理供给更充足、但平台自研AI产品与外部应用在入口和分发上的竞争会更直接（推断）。
    inspiration: 趋势：头部平台把资本开支推到单季814亿元量级，算力与模型成本结构正在被平台自己吸收，应用层的模型调用门槛会继续下降。切入：不要在通用入口上与平台自研助手正面竞争，可从平台尚未覆盖的垂直旧流程切入，例如把某个行业的单据、报告或合规材料做成按结果交付的服务；具体卖法需依据该行业既有采购方式判断，未披露价格不臆测。
    summary_en: 'This is the AI spending structure disclosed in Tencent''s Q3 2026 results: quarterly
      capex of RMB 81.4 billion, up 527% year on year, with the net impact of new AI businesses on operating
      profit widening to about RMB 15.2 billion. It shows the platform is converting current cash into
      compute and models, which implies more abundant inference supply for application layers but more
      direct competition over entry points and distribution between platform-built AI products and outside
      apps (inference).'
    inspiration_en: 'Trend: a leading platform pushing quarterly capex to the RMB 81.4 billion level means
      compute and model costs are being absorbed by the platform itself, and the barrier to calling models
      keeps falling for application builders. Entry: avoid head-on competition with platform-built assistants
      at the general entry point; instead target vertical legacy workflows the platform has not covered,
      such as turning a specific industry''s forms, reports or compliance documents into an outcome-priced
      service, with the selling model judged by that industry''s existing procurement rather than invented
      prices.'
  重控制轻渲染达瓦科技的-ai-视频工业路线:
    slug: 重控制轻渲染达瓦科技的-ai-视频工业路线
    name: 达瓦科技
    decision: queued
    event_summary_zh: 2026年11月22日极客公园刊出对谈，达瓦科技CTO朱子威与CPO李宗兴披露：公司2023年从2014年起运营的重庆永川科技影视片场业务中分拆成立，今年连续完成Pre-A轮与A轮融资，累计约5亿元人民币；自研控制层基座模型Latent
      Stage，并推出面向专业内容团队的离线生成产品FilmOS与可在单张消费级显卡实时运行的世界模型Scenes AI，依托片场积累的约180TB结构化拍摄过程数据。
    event_summary_en: In an interview published by public reporting on 22 November 2026, Daewa Technology
      CTO Zhu Ziwei and CPO Li Zongxing disclosed that the company was spun out in 2023 from a technology
      film-studio business operating in Yongchuan, Chongqing since 2014; it closed Pre-A and A rounds
      this year for roughly RMB 500 million in total; it built an in-house control-layer foundation model,
      Latent Stage, and launched FilmOS, an offline generation product for professional content teams,
      and Scenes AI, a world model that runs in real time on a single consumer GPU, drawing on about 180TB
      of structured on-set production data.
    category: AI + 创作
    project_type: new_application
    industries:
    - 影视制作
    - 广告与内容制作
    industries_en:
    - Film and television production
    - Advertising and content production
    jobs:
    - 影视制片与导演在开机前用剧本、机位、灯光和动作方案预演镜头，需要先拿到可控的预演画面再决定是否实拍
    - 内容制作团队在成片前需要反复生成候选镜头，从中挑出可用素材进入后期
    jobs_en:
    - Film producers and directors preview shots from scripts, camera positions, lighting and motion plans
      before shooting, needing controllable previsualization frames before committing to a shoot
    - Content production teams generate repeated candidate shots before final cut and select usable footage
      for post-production
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 专业影视团队在开机前或后期挑镜头时，原本要反复用生成模型抽卡或直接实拍试错；达瓦科技把人物、动作、镜头、灯光、场景的控制单独做成一层模型，再交给渲染层出画面，用户拿到的是可先审看再决定是否实拍的预演或候选镜头，人工仍需确认可用性。具体交付流程与计费方式仍待核验。
    inspiration: 趋势：视频生成正从“抽卡出片”转向把片场里的控制知识做成可复用的一层，谁掌握过程数据谁就能稳定交付。切入：从有实拍预算的影视与广告制作公司进入，先卖预演和分镜验证这一环节，按项目或按镜头计价，而不是卖通用生成工具。
    summary_en: Professional film teams choosing shots before a shoot or in post-production previously
      had to repeatedly sample generative models or test on set; Daewa separates control of characters,
      motion, camera, lighting and scenes into its own model layer and hands rendering to a separate layer,
      so users get previews or candidate shots to review before deciding what to shoot, with human sign-off
      still required. The exact delivery workflow and pricing remain to be verified.
    inspiration_en: 'Trend: video generation is moving from lucky-draw output toward turning on-set control
      knowledge into a reusable layer, where whoever holds process data can deliver reliably. Entry: start
      with film and advertising production companies that already have shooting budgets, selling previsualization
      and storyboard validation per project or per shot rather than a generic generation tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 影视制片与导演在开机前，依据剧本、机位、灯光和动作方案，需要拿到可控的预演画面，再决定哪些镜头值得实拍。
        job_en: Before shooting, film producers and directors need controllable preview footage derived
          from scripts, camera positions, lighting and motion plans, so they can decide which shots are
          worth filming.
        pain_zh: 现有生成模型要反复抽卡才出可用画面，算力和时间成本高；直接实拍试错则烧掉场地与人力预算。
        pain_en: Current generative models need repeated sampling before usable frames appear, burning
          compute and time, while trial-and-error on set consumes location and crew budgets.
        current_alternative_zh: 用通用视频生成模型反复生成筛选，或直接进片场实拍试错，再用后期修补。
        current_alternative_en: Repeatedly generating and filtering with general video models, or shooting
          on set by trial and error and fixing in post.
        usage_reason_zh: 推断：把人物、动作、镜头、灯光、场景的控制单独建模，减少每次生成都要重新描述和反复抽卡的步骤，使预演画面更贴近既定拍摄方案，因此有实拍预算的制片方会在开机前用它替代纯抽卡或直接试拍。
        usage_reason_en: 'Inference: modeling control of characters, motion, camera, lighting and scenes
          separately cuts the re-prompting and repeated sampling per generation, making previews closer
          to the planned shoot, so producers with shooting budgets would use it before filming instead
          of pure sampling or trial shoots.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开机前镜头预演与候选画面筛选的需求，痛点是抽卡成本高和实拍试错贵，旧流程与不采用后果清楚。
        evidence_ids:
        - ev-ca49baca088a2274
      - gate: consensus
        status: insufficient
        reason: 仅有创始团队对谈，未见专业制作团队的公开采用或评价，场景强度可判断但共识证据缺一环。
        evidence_ids:
        - ev-ca49baca088a2274
      - gate: model
        status: insufficient
        reason: 未披露FilmOS与Scenes AI的定价、按项目还是按席位收费，买方可能是制作公司，但付费路径尚未公开。
        evidence_ids:
        - ev-ca49baca088a2274
      - gate: truth
        status: insufficient
        reason: 片场过程数据是差异化壁垒，但控制层能否稳定交付工业级画面、人工复核边界如何，公开材料未给出可核对结果。
        evidence_ids:
        - ev-ca49baca088a2274
      next_validation: 收集FilmOS的官方产品页或部署文档，确认其输入、输出与计费方式，以及是否列出专业制作团队的公开案例。
