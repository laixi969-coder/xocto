      map and rebuilding knowledge; the AI runs locally offline to answer questions and give actionable
      guidance. The deliverable is offline-readable knowledge and instructions; the exact interaction
      flow and delivery format still need verification.
    inspiration_en: 'Trend: offline, locally runnable knowledge assistants are being treated as a backup
      when infrastructure fails, not just a supplement to online search. Entry: start from emergency management,
      remote-area education and outdoor users; possible selling models are institutionally procured offline
      knowledge packs or training delivery, with pricing undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 在断网、灾害或偏远环境下，普通人或社区组织者需要就生存、地图与重建问题获得可执行的指引，并据此完成具体操作。
        job_en: In offline, disaster or remote settings, ordinary people or community organizers need
          actionable guidance on survival, maps and rebuilding, and then carry out concrete steps.
        pain_zh: 断网时在线搜索与云端助手不可用，纸质手册检索慢且难以按情境给出步骤，用户容易在关键操作上卡住。
