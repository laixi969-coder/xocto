    summary_en: Website operators open it when reviewing access logs or configuring anti-bot rules to
      separate AI agents and search crawlers from human visitors, for traffic analytics or allow/rate-limit
      decisions. The identification method, deployment form, and final deliverable still need verification.
    inspiration_en: 'Trend: AI agents now visit sites on their own, redrawing the line between human and
      machine in analytics and anti-bot rules. Entry: start with website operations, digital publishing,
      or security teams that must separate AI crawls from human visits, deliver verifiable identification
      and allow-listing first, then consider per-site or per-traffic pricing; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 网站运营者或安全工程师在查看访问日志、做流量分析或配置反爬策略时，需要把 AI 代理、搜索引擎爬虫与真人访客区分开，以便决定放行、限流或统计口径。
        job_en: Website operators or security engineers reviewing access logs, doing traffic analytics,
          or configuring anti-bot rules need to separate AI agents and search crawlers from human visitors
          to decide on allow-listing, rate limiting, or analytics attribution.
        pain_zh: AI 代理和爬虫混入真人流量后，访问统计失真，反爬规则要么误伤搜索引擎、要么放过机器流量，运营者难以判断该拦谁、该放谁。
        pain_en: When AI agents and crawlers blend into human traffic, analytics become distorted and
          anti-bot rules either block search engines or let bot traffic through, leaving operators unsure
          whom to block or allow.
        current_alternative_zh: 目前多靠 User-Agent 规则、IP 名单或通用反爬服务手工区分，维护成本高且对新型 AI 代理识别有限。
        current_alternative_en: Today operators mostly rely on User-Agent rules, IP lists, or generic
          anti-bot services, which are costly to maintain and limited at recognizing newer AI agents.
        usage_reason_zh: 推断：相较手工维护 UA 与 IP 规则，它把识别 AI 代理、搜索爬虫和机器人做成一个专门动作，减少逐条维护名单的负担，让需要区分流量来源的运营或安全团队在配置放行与限流时选择它；实际识别准确率与部署方式尚未核验。
        usage_reason_en: 'Inference: compared with manually maintaining UA and IP rules, it turns distinguishing
          AI agents, search crawlers, and bots into a dedicated action, reducing list-maintenance burden,
          so operations or security teams needing traffic-source separation may choose it when configuring
          allow-listing and rate limits; actual accuracy and deployment are unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决把 AI 代理、爬虫与真人访客区分开的识别需求，痛点在于流量统计失真和反爬误伤，旧做法是手工维护 UA/IP 规则。
        evidence_ids:
        - ev-79e5dc49f954fa67
        - ev-f928f0976b89f098
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数缓慢增长，缺少用户评价、客户案例或采用规模，无法判断是否形成共识。
        evidence_ids:
