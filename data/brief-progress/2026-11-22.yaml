      speaks to a 3D VRoid avatar; it takes real-time voice and generates emotionally stateful replies
      via OpenRouter or Ollama models, giving the user a self-deployable, model-swappable companion character.
      How memory and emotion shape long-term dialogue, and whether delivery is reliable, still need verification.
    inspiration_en: The trend is companion characters moving from cloud subscriptions to self-deployable,
      model-swappable open-source forms where users control avatar and dialogue backend. An entry point
      is the anime-companion crowd willing to tinker with local models, selling hosted deployment, avatar
      and voice packs, or per-character subscriptions; no pricing or payment path is disclosed, so this
      is judgment, not fact.
