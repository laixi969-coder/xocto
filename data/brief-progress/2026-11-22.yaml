    summary_zh: 营销人员或本地商家在需要做调研、定位、文案、落地页、SEO、广告和邮件时，把这批材料交给 AI 代理，由 32 个 MIT 许可的预设技能分别执行对应步骤，产出营销初稿；最终发布仍需人工确认。具体交付形态与使用流程仍待核验。
    inspiration: 趋势：营销工作正被拆成可交给 AI 代理逐段执行的技能包，而不是一个通用聊天框。切入：面向本地商家或单一行业，把调研到投放的固定步骤做成可复用流程，按产出或代运营收费；目前只有开源技能集，尚无定价与客户案例。
    summary_en: Marketers or local business owners hand research, positioning, copy, landing pages, SEO,
      ads and email materials to an AI agent, which runs 32 MIT-licensed preset skills to produce marketing
      drafts; publishing still needs human confirmation. The exact delivery format and workflow remain
      to be verified.
    inspiration_en: 'Trend: marketing work is being split into agent-executable skill packs rather than
      one chat box. Entry: package the fixed steps from research to ad delivery for local businesses or
      a single industry, charging per output or as managed service; today it is only an open-source skill
      set with no pricing or customer cases.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 营销人员或本地商家在准备调研、定位、文案、落地页、SEO、广告和邮件时，把材料交给 AI 代理，按技能流程产出可用的营销初稿。
        job_en: Marketers or local business owners preparing research, positioning, copy, landing pages,
          SEO, ads and email hand materials to an AI agent to produce usable marketing drafts via skill
          workflows.
        pain_zh: 营销各环节分散在多个工具和模板里，重复起草与改写占用大量时间，小团队和本地商家缺少成体系的流程。
        pain_en: Marketing steps are scattered across tools and templates; repetitive drafting and rewriting
          consume time, and small teams and local businesses lack a systematic process.
        current_alternative_zh: 用通用聊天助手逐条提问、套用零散模板，或外包给代理公司手工完成。
        current_alternative_en: Asking a general chat assistant step by step, using scattered templates,
          or outsourcing to an agency for manual work.
        usage_reason_zh: 相较逐条向通用助手提问，它把调研、定位、文案、SEO 等步骤固化为可复用的技能，减少每次重新组织提示与流程的负担；推断营销人员和小商家会因流程可复用而选择它，但尚无用户反馈或客户案例支持。
        usage_reason_en: Compared with asking a general assistant step by step, it fixes research, positioning,
          copy and SEO into reusable skills, reducing the burden of re-organizing prompts and process
          each time; inferred that marketers and small businesses would choose it for reusable process,
          but no user feedback or customer cases support this yet.
      gates:
      - gate: value
        status: supported
        reason: 它解决营销多环节重复起草、流程零散的问题，痛点具体且旧做法可识别；但交付确定性与人工确认边界仍待核验。
        evidence_ids:
        - ev-1b490daf75f4beb7
        - ev-5e87afd5f48f6f7f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属于关注度信号，不能证明营销人员已持续采用或形成共识。
        evidence_ids:
        - ev-5e87afd5f48f6f7f
      - gate: model
        status: insufficient
        reason: MIT 开源、无定价页与客户案例，买方与付费路径未披露，这是判断而非已验证事实。
        evidence_ids:
        - ev-1b490daf75f4beb7
      - gate: truth
        status: insufficient
        reason: 技能集贴近营销任务，但缺少实际产出质量、人工确认边界与重复使用证据。
        evidence_ids:
        - ev-1b490daf75f4beb7
      next_validation: 收集该开源仓库的 issue、discussion 或官方文档，核验实际使用流程、产出示例与是否有付费或代运营形态。
    event_summary_zh: 2026 年 11 月 16 日发布 boring-marketing-skills，提供 32 个 MIT 许可的营销技能供 AI 代理调用，覆盖调研、定位、文案、落地页、SEO、广告、邮件与本地商家包；仓库星数在数日内从约
      199 升至 777。
    event_summary_en: On November 16, 2026, boring-marketing-skills launched 32 MIT-licensed marketing
      skills for AI agents covering research, positioning, copy, landing pages, SEO, ads, email and a
      local-business pack; repository stars rose from about 199 to 777 within days.
