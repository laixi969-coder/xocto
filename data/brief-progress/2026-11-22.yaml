    jobs:
    - 独立开发者或小团队负责人把一项开发任务拆给多个 AI 角色，并核对各角色交付的证据与交接结果
    jobs_en:
    - A solo developer or small-team lead splits a development task across multiple AI roles and checks
      the evidence and handoff each role delivers
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 一个人带多个 AI 角色干活时，打开这套角色与分组模板，把任务派给不同角色，并要求每个角色提交证据、说明步骤、完成交接。用户拿到的是按角色分工的产出与核证记录，最终判断仍由人做；具体流程与交付形态仍待核验。
    inspiration: 趋势：单人借助多个 AI 角色承担团队式分工，正在从零散提示词变成可复用的角色与交接规范。切入：可从需要留痕与复核的交付环节进入，例如外包开发、审计式代码评审或受监管行业的文档产出，按项目或按核证结果收费；目前只有开源关注度，尚无付费与留存证据。
    summary_en: When one person directs several AI roles, this toolkit assigns tasks across predefined
      roles and group templates and asks each role to submit evidence, explain its steps and hand off
      work. The user gets role-based outputs plus a review record, with the final judgment left to the
      human; the exact workflow and deliverables still need verification.
    inspiration_en: 'Trend: one person orchestrating multiple AI roles is moving from ad-hoc prompts toward
      reusable role and handoff conventions. Entry: start where traceability and review matter, such as
      outsourced development, audit-style code review or regulated document production, charging per project
      or per verified result; so far there is only open-source attention, with no payment or retention
      evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队负责人把一项开发任务拆给多个 AI 角色，并核对各角色交付的证据与交接结果。
        job_en: A solo developer or small-team lead splits a development task across multiple AI roles
          and checks the evidence and handoff each role delivers.
        pain_zh: 一个人同时驱动多个 AI 角色时，任务边界、证据和交接容易散落在对话里，返工与核对成本高。
        pain_en: When one person drives several AI roles at once, task boundaries, evidence and handoffs
          scatter across conversations, raising rework and checking costs.
        current_alternative_zh: 现在多靠手工写提示词、在多个对话窗口间复制粘贴，并靠人自己记任务与复核。
        current_alternative_en: Today people mostly hand-write prompts, copy between chat windows, and
          track tasks and reviews themselves.
        usage_reason_zh: 推断：它把角色分工、证据提交和交接写成固定模板，减少每次重新组织提示词和人工追查交付来源的步骤，因此需要留痕复核的单人开发者或小团队会尝试它。
        usage_reason_en: 'Inference: it fixes role division, evidence submission and handoff into templates,
          cutting the step of re-organizing prompts and manually tracing where deliverables came from,
          so solo developers or small teams needing traceable review would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决一人统筹多个 AI 角色时任务边界与证据散乱、复核成本高的问题，旧做法是手工提示词与复制粘贴，痛点具体。
        evidence_ids:
        - ev-9c262e959ef87b92
      - gate: consensus
        status: insufficient
        reason: 只有仓库关注度随时间小幅上升，缺少使用者反馈或案例说明谁在什么场景下持续使用。
        evidence_ids:
        - ev-9f5dc8f23f0acfc8
        - ev-e8d1a0c9d86a38a9
      - gate: model
        status: insufficient
        reason: 开源项目未见定价、付费或企业采购信息，钱从哪来尚不清楚，这是判断不是已验证事实。
        evidence_ids:
        - ev-9c262e959ef87b92
      - gate: truth
        status: insufficient
        reason: 模板化角色与证据交接贴近复核需求，但缺少可复现实测证明交付结果确定发生。
        evidence_ids:
        - ev-9c262e959ef87b92
      next_validation: 收集该仓库的 issue 与 discussion，查看使用者是否报告实际按角色分工完成并复核了真实任务。
