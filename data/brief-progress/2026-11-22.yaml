      code snippets consumed directly by AI coding assistants, so the delivery target becomes the code-generating
      model rather than a designer. Entry: start with independent site sellers and landing-page outsourcing
      teams, selling motion packs that AI can write in per set or per page; it is currently free with
      no pricing or payment signal yet.'
