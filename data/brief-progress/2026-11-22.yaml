      and publish to public code repository Pages or Cloudflare in one click. The user ends up with a
      playable, hosted game page; generation quality and the manual editing step still need verification.
    inspiration_en: 'Trend: small-game prototyping is being compressed from writing code, sourcing art
      and configuring deployment into one sentence plus one-click publish, pointing to description-as-delivery
      creation tools. Entry: start from indie game communities, game jams or teaching settings, selling
      hosting and asset packs rather than raw generation; first confirm the output is actually playable
      and that published games see continued use.'
