    summary_zh: 研究团队 TIGER-AI-Lab 发布的评测基准，考察 AI 代理能否仅靠浏览器探索重建网站。使用者是研究或工程评估者，输入是目标网站，代理在浏览器中浏览后产出重建结果，用于衡量代理能力；具体评分口径与交付形式仍待核验。
    inspiration: 趋势：网页重建正被当作检验浏览器代理能力的任务，说明代理从“回答问题”走向“操作界面并交付产物”。切入：可从建站公司或电商运营的旧站迁移、竞品页面复刻环节进入，把代理重建结果与人工还原做对照，按迁移站点或页面数量计费；目前只是评测基准，尚无产品化交付证据。
