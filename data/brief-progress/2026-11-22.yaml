    summary_zh: 面向量化研究者的开源 LLM 交易代理评测与回测项目。研究者在评估交易代理时打开它，用冻结时点的行情、VIX 与新闻数据回测代理决策，并做未来信息泄漏检查；最终得到榜单排名与回测结果，具体评测口径与实盘接入仍待核验。
