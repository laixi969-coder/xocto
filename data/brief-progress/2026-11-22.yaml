      apps, they open this locally running agent and give it a voice or text instruction; it reads the
      screen and executes the sequence, returning a completed phone action. Which apps are supported,
      how failures roll back and which steps need human confirmation still need verification from public
      materials.
    inspiration_en: 'Trend: phone-side agents are moving from chat Q&A to directly operating the interface,
      handing cross-app repetitive actions to local models. Entry: target high-frequency cross-app operators
      such as e-commerce support, outbound follow-up and elderly assistance, charging per executed task
      or per managed device; the accessibility-permission security and compliance boundary is the gate
      such products must solve first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安卓手机用户在需要跨多个应用完成重复点击、填写和页面切换时，让本地代理读取屏幕并代为执行一串操作，最终得到已完成的手机操作结果，关键步骤仍需用户确认。
        job_en: Android users who need repetitive taps, form fills and page switches across multiple apps
          let a local agent read the screen and execute the sequence, receiving a completed phone action
          with key steps still confirmed by the user.
        pain_zh: 跨应用重复操作要人一步步点，耗时且易错；对不熟悉界面的用户（如老年人、客服人员）尤其麻烦。
        pain_en: Cross-app repetitive actions require step-by-step manual tapping, which is slow and error-prone,
          especially for users unfamiliar with the interface such as elderly people or support staff.
        current_alternative_zh: 手动逐屏操作，或使用安卓自带的宏、自动化脚本和第三方自动化工具，需要自己编写规则。
        current_alternative_en: Manual screen-by-screen operation, or Android macros, automation scripts
          and third-party automation tools that require users to write their own rules.
        usage_reason_zh: 推断：相较手写自动化脚本，产品通过语音指令加屏幕读取直接执行操作链，省去用户自己拆解步骤和写规则的一步；对需要频繁跨应用操作又不写代码的用户，这是选择它的原因。
        usage_reason_en: 'Inference: compared with hand-written automation scripts, the product executes
          the action chain directly from a voice instruction plus screen reading, removing the step of
          users decomposing tasks and writing rules; that is why non-coding users with frequent cross-app
          operations would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨应用重复操作耗时易错的问题，旧做法是手动点击或自写脚本，痛点具体；但支持范围与失败回退未核验。
        evidence_ids:
        - ev-5f9fd1c54ab5e7e5
        - ev-1aef00ffe2dece27
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、issue 讨论或采用案例，无法判断是否形成共识。
        evidence_ids:
        - ev-1aef00ffe2dece27
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或商业主体，钱从哪来无法判断。
        evidence_ids:
        - ev-5f9fd1c54ab5e7e5
      - gate: truth
        status: challenged
        reason: 依赖无障碍权限自动操作手机，安全、隐私与平台政策风险高，承诺能否确定性交付尚未核验。
        evidence_ids:
        - ev-5f9fd1c54ab5e7e5
