        usage_reason_zh: 推断：相较让 AI 凭空生成或自己手写，effect-atlas 提供现成的纯 JavaScript 动效作为参考，AI 助手可直接据此写入站点，减少从零构思和调试动效这一步；适合需要快速给落地页加动效的前端或独立站运营者。
        usage_reason_en: 'Inference: compared with letting AI generate from nothing or hand-writing, effect-atlas
