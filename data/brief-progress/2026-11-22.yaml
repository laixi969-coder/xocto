      adding Thinking Machines Lab's multimodal model Inkling 2 Mini (text and image inputs, text outputs,
      24 decoder layers with layers 6-17 looped three times to compensate). This is a version update of
      an open-source model library, not a standalone application; its effect is to let developers integrate
      new multimodal weights faster, a base-layer supply change whose real impact on application cost
      and competition needs more material and cannot be read as an industry-wide shift.
