  euinc-calls-on-von-der-leyen-to-withdraw-and-re-table-eu-inc:
    slug: euinc-calls-on-von-der-leyen-to-withdraw-and-re-table-eu-inc
    name: EU Inc
    decision: market_context
    summary_zh: 2026 年 11 月 19 日，欧盟成员国理事会谈判授权削弱了欧盟委员会 EU Inc 提案中的注册自由选择与员工股票期权条款，EU–INC 与 Startups for
      Europe 因此呼吁撤回并重新提交原提案。该监管变化影响欧洲创业公司设立与股权激励安排，进而影响 AI 创业公司在欧洲的落地与人才竞争。
    summary_en: On 19 November 2026, the Council's negotiating mandate weakened the European Commission's
      EU Inc proposal on free choice of registration and employee stock options, prompting EU–INC and
      Startups for Europe to call for withdrawing and re-tabling the original proposal. The regulatory
      change affects how European startups incorporate and structure equity incentives, which in turn
      affects where AI startups set up and compete for talent.
    event_summary_zh: EU–INC 与 Startups for Europe 于 2026 年 11 月 19 日呼吁欧盟委员会主席冯德莱恩撤回并重新提交 EU Inc 提案，指理事会
      10 月 19 日谈判授权削弱了注册地自由选择并限制员工股票期权至 750 名员工或 1.5 亿欧元营收。
    event_summary_en: On 19 November 2026, EU–INC and Startups for Europe called on European Commission
      President von der Leyen to withdraw and re-table the EU Inc proposal, saying the Council's 19 October
      negotiating mandate weakened free choice of registration and capped employee stock options at 750
      employees or €150 million in turnover.
