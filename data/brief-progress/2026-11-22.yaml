        usage_reason_zh: 推断：相较外包或无代码工具，它把“描述需求—生成可运行代码—部署”压缩到同一界面内，减少把需求翻译成技术规格和逐页搭建的步骤，因此需要快速验证想法的非技术创业者会在原型阶段选择它；公开材料未提供留存或复购证据。
