    jobs:
    - 读者在浏览新闻或社交信息流时，对图片和视频是否为 AI 生成做判断，以决定是否采信或转发
    - 编辑在审核外部投稿或转载素材时，逐张核查图像来源与真实性
    jobs_en:
    - Readers judging whether images and videos in news or social feeds are AI-generated before trusting
      or sharing them
    - Editors checking the provenance and authenticity of externally sourced images during review
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 用户在浏览网页时，浏览器扩展在本地对页面中的图片和视频做 AI 生成判定并给出标记，无需把素材上传到服务器；用户拿到的是逐张素材的提示标记，最终是否采信仍由用户自己判断。具体判定准确率、误报处理和交付形式仍待核验。
    inspiration: 趋势：AI 生成图像和视频进入日常信息流后，真实性核验从平台责任下沉到读者和编辑的每一次浏览动作。切入：可从新闻编辑室、事实核查机构和内容审核团队进入，把逐张人工溯源换成浏览时自动标记，卖法可围绕团队级核验记录而非个人插件，价格未披露。
    summary_en: While browsing, a browser extension runs on-device detection on page images and videos
      and flags which ones appear AI-generated, without uploading the material to a server; the user gets
      per-asset flags and still makes the final trust call. Detection accuracy, false-positive handling
      and delivery format remain unverified.
    inspiration_en: 'Trend: as AI-generated images and video fill everyday feeds, authenticity checking
      shifts from platform duty down to each reader''s and editor''s browsing moment. Entry: start with
      newsrooms, fact-checking units and content-review teams, replacing manual per-image provenance checks
      with automatic in-browse flags; a team-level verification record rather than a personal plugin is
      a possible model, pricing undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 读者在浏览新闻或社交信息流时，对图片和视频是否为 AI 生成做判断，以决定是否采信或转发；编辑在审核外部素材时逐张核查真实性。
        job_en: Readers judging whether images and videos in news or social feeds are AI-generated before
          trusting or sharing them; editors checking authenticity of external material image by image.
        pain_zh: AI 生成内容混入信息流后，人工肉眼难以分辨，误信或误转会带来声誉和事实错误成本；逐张溯源又耗时。
        pain_en: Once AI-generated content mixes into feeds, the human eye struggles to tell it apart,
          and mis-trusting or mis-sharing carries reputational and factual-error costs, while per-image
          provenance checks are slow.
        current_alternative_zh: 读者凭直觉判断或依赖平台标注；编辑用反向图片搜索、元数据检查和人工经验逐张核对。
        current_alternative_en: Readers rely on gut feel or platform labels; editors use reverse image
          search, metadata checks and manual experience image by image.
        usage_reason_zh: 推断：相较逐张反向搜索，扩展在浏览当下就地给出标记，省去把素材另存再送检的一步，因此频繁处理外部图像的编辑和事实核查人员会在浏览环节选用它；准确率与误报情况尚未公开。
        usage_reason_en: 'Inference: versus per-image reverse search, the extension flags assets in place
          at browse time, removing the save-and-submit step, so editors and fact-checkers handling external
          images often would pick it up while browsing; accuracy and false-positive rates are not public.'
      gates:
      - gate: value
        status: supported
        reason: 它解决浏览时分辨 AI 生成图像视频的需求，痛点是肉眼难辨与逐张溯源耗时，旧做法为反向搜索和人工经验，结构上成立。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
        - ev-4a20a46ff87a58d6
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度缓慢增长，缺少用户评价、客户案例或编辑室采用证据，无法判断是否进入实际工作流。
        evidence_ids:
        - ev-4a20a46ff87a58d6
      - gate: model
        status: insufficient
        reason: 开源本地运行，未见定价、付费路径或团队采购信息，买方与收费方式均未披露，这是判断不是已验证事实。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: truth
        status: insufficient
        reason: 本地检测能否确定性交付、误报如何处理、模型更新后是否失效均无公开材料，交付确定性待核验。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      next_validation: 收集该开源仓库的 issue 与 discussion，查看用户报告的检测准确率、误报和实际使用场景反馈。
    event_summary_zh: 2026 年 11 月中旬，hikaku-extension 作为开源浏览器扩展发布，在本地标记浏览页面中的 AI 生成图像和视频，支持 Chrome、Edge
      和 Firefox；仓库关注度在数日内小幅波动上升。
    event_summary_en: In mid-November 2026, hikaku-extension launched as an open-source browser extension
      that flags AI-generated images and video on browsed pages locally, supporting Chrome, Edge and Firefox;
      repository attention rose modestly with fluctuation over several days.
