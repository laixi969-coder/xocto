      vendor app or firmware changes. The user gets an always-on desktop status view; which agents are
      supported, refresh method and alerting still need verification.'
    inspiration_en: 'Trend: as AI coding agents move from single chats to parallel always-on tasks, developers
      start needing peripheral ''agent run monitoring'' tools. Entry: start with solo developers and small
      engineering teams needing a multi-agent control panel, first status and quota visibility, then consider
      per-seat or hosted pricing; only an open-source repo exists and the paid path is undisclosed.'
