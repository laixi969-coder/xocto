      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工程团队负责人在多模型、多工具并行使用时，把各平台用量与账单材料交给助手，要查清 AI 预算去向并决定削减哪一项。
        job_en: Engineering leads running several models and tools hand usage and billing material to
          the assistant to find where the AI budget went and decide what to cut.
        pain_zh: AI 花费分散在多个平台与订阅中，负责人难以归因到具体工具或团队，超支往往在账单出来后才被发现。
        pain_en: AI spend is spread across platforms and subscriptions, hard to attribute to a tool or
          team, and overspend is usually noticed only after the bill arrives.
        current_alternative_zh: 目前靠人工导出各平台账单、拼表格核对，或直接凭印象砍订阅。
        current_alternative_en: Today teams export each platform's bill, reconcile in spreadsheets, or
          cut subscriptions on impression.
        usage_reason_zh: 推断：相较人工导出多平台账单再拼表，TraxAgent 在已有对话工具里直接读取用量并给出归因与修正项，省掉汇总这一步；多工具并用且预算吃紧的工程团队会因此试用。
        usage_reason_en: 'Inference: versus manually exporting and merging bills, TraxAgent reads usage
          inside the existing chat tool and returns attribution and fixes, removing the aggregation step;
          engineering teams with many tools and tight budgets would try it for that.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多平台 AI 花费难归因、超支事后才发现的问题，痛点具体；买方为使用多工具的工程团队，付费路径未公开。
        evidence_ids:
        - ev-9130d35204ef24f4
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标这一关注度信号，缺少用户反馈或团队采用证据，不能说明持续使用。
        evidence_ids:
        - ev-9130d35204ef24f4
