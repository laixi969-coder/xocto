    name: 74% Trust AI Agents for Shopping Advice, Balk at Checkout
    decision: market_context
    summary_zh: 一项调查称74%的用户信任AI智能体提供购物建议，但在结账环节犹豫，显示AI购物智能体的采用受制于交易环节的信任缺口，可能影响电商智能体的转化与商业化路径；该结论基于单一调查。
