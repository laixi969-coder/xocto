        current_alternative_zh: 开发者目前靠切换终端标签、逐个打开模型后台页面，或凭记忆估算配额，没有统一的常驻视图。
        current_alternative_en: Developers currently switch terminal tabs, open each model's dashboard
          page, or estimate quota from memory, with no unified always-on view.
        usage_reason_zh: 推断：它把代理状态、配额和机器健康汇总到一块常驻小屏，省去在终端与网页后台之间反复切换查看这一步，因此同时跑多个代理、又不想频繁切窗的开发者会在长时间编码时选择它；是否长期留在工作流尚无留存证据。
