    - 普通用户在转发或引用网络图片视频前，需要快速判断素材真伪
    jobs_en:
    - fact-checking editors reviewing suspicious images and videos in news or social feeds to decide whether
      to use or label them
    - ordinary users checking whether an image or video is authentic before sharing or citing it
    regions: []
    regions_en: []
