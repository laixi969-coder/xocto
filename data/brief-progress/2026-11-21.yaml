    inspiration: 趋势是编码代理的产出质量开始由外挂的领域规范决定，而不只是模型本身。切入可考虑为特定行业（如地产挂牌页、电商详情页）提供可核对的界面规范包，按项目或按团队授权收费；目前只有开源关注度，尚无付费与采用证据。
    summary_en: Developers using coding agents to generate interfaces invoke this skill at the page-generation
      step so the agent follows a set of interface design conventions for layout and interaction, reducing
      default template-like output. The user receives interface code from the agent and must still check
      usability; the specific conventions and delivery flow remain to be verified.
    inspiration_en: The trend is that coding-agent output quality starts to depend on external domain
      conventions rather than the model alone. An entry point is packaging checkable interface conventions
      for specific industries (property listing pages, e-commerce detail pages) and charging per project
      or per team; currently there is only open-source attention, with no payment or adoption evidence.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 前端或独立开发者用编码代理生成页面时，需要代理按可用的界面规范产出布局与交互，并自行判断结果是否可用。
        job_en: Front-end or solo developers generating pages with coding agents need the agent to produce
          layout and interaction following usable interface conventions, and must judge whether the result
          is usable.
        pain_zh: 编码代理默认产出模板化、可用性差的界面，开发者要反复返工调整布局与交互，这一步负担落在人身上。
        pain_en: Coding agents default to template-like, poorly usable interfaces, forcing developers
          to repeatedly rework layout and interaction by hand.
        current_alternative_zh: 开发者自己写设计规范提示词、参考现成组件库，或事后手工修改代理产出的界面。
        current_alternative_en: Developers write their own design-convention prompts, rely on existing
          component libraries, or manually fix agent output afterwards.
        usage_reason_zh: 推断：它把界面规范预先封装成代理可调用的技能，在生成阶段就约束布局与交互，减少事后逐页返工这一步；面向频繁用代理做前端页面的开发者。公开材料未提供使用反馈或留存证据。
        usage_reason_en: 'Inference: it packages interface conventions into a skill the agent can invoke,
          constraining layout and interaction at generation time and reducing page-by-page rework afterwards;
          aimed at developers who frequently build front-end pages with agents. Public materials provide
          no usage feedback or retention evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理产出界面模板化、可用性差的问题，开发者需事后返工；旧做法是自写提示词或手工改界面，痛点具体。
        evidence_ids:
        - ev-5aecd47a7df3ff0e
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库关注度缓慢增长，缺少用户评价或采用案例，无法判断是否形成使用共识。
        evidence_ids:
        - ev-7a841c2d3bea94a9
        - ev-5aecd47a7df3ff0e
      - gate: model
        status: insufficient
        reason: 未见定价、付费或授权方式，买方可能是开发者个人或团队，属判断而非已验证事实。
        evidence_ids:
        - ev-5aecd47a7df3ff0e
      - gate: truth
        status: insufficient
        reason: 规范内容与产出是否真能确定性改善可用性，缺少可复现实测或用户反馈。
        evidence_ids:
        - ev-5aecd47a7df3ff0e
      next_validation: 收集该仓库的 issue、discussion 或可复现实测，核对使用该技能前后代理产出界面的可用性差异。
