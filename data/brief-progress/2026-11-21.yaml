    jobs_en:
    - Email administrators or brand-protection owners investigating which senders spoof their domain and
      deciding whether to allow or block them when suspicious mail or DMARC setup arises
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 企业邮箱管理员在发现有人冒用自家域名发信时打开它，输入域名后由系统汇总 DMARC 报告，指出哪些发送源在冒名以及是否通过验证，最终给出可疑发送方清单供人工判断拦截或放行；具体报告解析深度与交付形式仍待核验。
    inspiration: 趋势是品牌冒名与邮件欺诈的排查正从人工翻看原始 DMARC 报告，转向由工具直接给出可疑发送方清单。切入可从中小企业或代理商入手，把“谁在冒名”做成按域名或按月的订阅式监测，而非再做一个通用安全套件。
    summary_en: An email administrator who finds someone spoofing the company domain opens this tool,
      enters the domain, and the system aggregates DMARC reports to show which senders are impersonating
      it and whether they passed authentication, ending with a suspicious-sender list for a human to block
      or allow; the depth of report parsing and delivery format still need verification.
    inspiration_en: The trend is that investigating brand spoofing and email fraud is moving from manually
      reading raw DMARC reports to tools that hand back a suspicious-sender list. The entry point is small
      businesses or agencies, selling domain-level or monthly monitoring of who is impersonating a brand
      rather than another general security suite.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业邮箱管理员或品牌负责人在收到冒名邮件投诉或配置 DMARC 时，需要从大量原始报告中找出哪些发送源在冒用域名，并决定拦截还是放行。
        job_en: An email administrator or brand owner, facing spoofing complaints or DMARC setup, must
          find which senders impersonate the domain from large volumes of raw reports and decide whether
          to block or allow them.
        pain_zh: 原始 DMARC 报告是机器可读的 XML，人工逐条翻看耗时且容易漏掉真正的冒名源，导致品牌被钓鱼利用而迟迟未处理。
        pain_en: Raw DMARC reports are machine-readable XML; reading them by hand is slow and easily misses
          real impersonators, leaving a brand exposed to phishing for longer.
        current_alternative_zh: 管理员手动下载并解析 DMARC XML 报告，或依赖现有邮件安全网关和第三方 DMARC 分析服务。
        current_alternative_en: Administrators manually download and parse DMARC XML reports, or rely
          on existing email security gateways and third-party DMARC analysis services.
        usage_reason_zh: 推断：相较人工翻 XML，它把报告汇总成可疑发送方清单，减少逐条比对这一步，让管理员在收到冒名投诉时更快定位来源；是否比现有 DMARC 分析服务更准尚未核验。
        usage_reason_en: 'Inference: versus reading XML by hand, it aggregates reports into a suspicious-sender
          list, cutting the line-by-line comparison step so administrators locate sources faster after
          a spoofing complaint; whether it is more accurate than existing DMARC analysis services is unverified.'
      gates:
      - gate: value
        status: supported
        reason: 它解决从原始 DMARC 报告中找出冒名发送源的需求，痛点是人工解析 XML 耗时且易漏，旧做法明确存在。
        evidence_ids:
        - ev-790f887246640511
      - gate: consensus
        status: insufficient
        reason: 仅有产品一句话说明，没有用户评价、客户案例或采用数据，无法判断管理员是否真的会换用它。
        evidence_ids:
        - ev-790f887246640511
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，可能是中小企业自购或安全代理商采购，付费路径尚不清楚。
        evidence_ids:
