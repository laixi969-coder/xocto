        status: supported
        reason: 它解决从数小时长视频与直播中挑出可发布短片段并成片的需求，痛点是人工回看耗时易漏，旧做法是手动打点或外包剪辑。
        evidence_ids:
        - ev-f3c205537ba85918
        - ev-bd5f4fe01ad2770d
      - gate: consensus
        status: insufficient
        reason: 仓库收藏一周内从 130 升至 1553，属关注度信号，尚无用户评价或客户案例说明持续采用。
        evidence_ids:
        - ev-f3c205537ba85918
        - ev-bd5f4fe01ad2770d
      - gate: model
        status: insufficient
        reason: 开源自托管、自带密钥，付费方可能是自建团队或二次分发者，公开材料未见定价或采购路径，属判断非事实。
        evidence_ids:
        - ev-bd5f4fe01ad2770d
      - gate: truth
        status: insufficient
        reason: 剪辑结果需人工确认，交付确定性尚可；但缺少成片质量与重复使用的公开证据。
        evidence_ids:
        - ev-bd5f4fe01ad2770d
