          cards generate a continuous camera move and narration timing inside a coding agent to get a
          playable film.
        pain_zh: 手工剪辑要逐帧摆放素材、对齐旁白与转场，重复且耗时；非专业剪辑者难以做出连贯镜头。
        pain_en: Manual editing requires placing every asset frame by frame and aligning narration with
          transitions, which is repetitive and slow; non-editors struggle to produce a coherent camera
          move.
        current_alternative_zh: 用剪辑软件手工拼接，或用文生视频工具生成零散片段后再拼，旁白与画面节奏需人工反复对齐。
