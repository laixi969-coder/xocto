        job_zh: 织造设计师或手工艺者在准备上机织造时，把布料实物照片转成可编辑的织机纹样草稿，以便修改后上机试织。
        job_en: A weaving designer or craftsperson preparing a loom converts a photo of a physical fabric
          into an editable loom draft for revision before test weaving.
        pain_zh: 从实物布料反推织机纹样通常要靠有经验的人看图拆解，耗时且依赖个人经验；照片转纹样若不准，上机试织就会反复返工。
        pain_en: Reverse-engineering a loom pattern from a physical fabric usually relies on an experienced
          person reading the cloth by eye, which is slow and person-dependent; if the photo-to-draft conversion
          is inaccurate, test weaving means repeated rework.
        current_alternative_zh: 目前多由老师傅手工拆纹、用通用图像软件描图，或直接放弃复刻；公开材料未说明 ThreadLore 相较这些做法的具体差异。
        current_alternative_en: Today this is mostly done by an experienced weaver manually decoding the
          pattern, tracing it in general image software, or simply giving up on replication; public material
          does not state how ThreadLore differs from these approaches.
        usage_reason_zh: 推断：若 ThreadLore 能把照片直接转成可编辑纹样，用户可省去手工描图这一步，直接在草稿上修改后上机；但纹样准确度与可编辑程度尚无公开证据，因此是否会被长期采用仍缺一环。
        usage_reason_en: 'Inference: if ThreadLore can turn a photo directly into an editable draft, users
          skip the manual tracing step and revise the draft before weaving; however, there is no public
          evidence on pattern accuracy or editability, so long-term adoption still lacks a link.'
      gates:
      - gate: value
        status: supported
        reason: 它解决从实物布料反推可编辑织机纹样这一具体任务，旧做法依赖老师傅手工拆纹，痛点与替代行为清楚。
        evidence_ids:
        - ev-817e7a8af68258de
      - gate: consensus
        status: insufficient
        reason: 仅有产品页一句说明，没有用户评价、客户案例或使用数据，无法判断织造从业者是否真的需要。
        evidence_ids:
        - ev-817e7a8af68258de
      - gate: model
        status: insufficient
        reason: 未披露定价、买方与收费方式；可能是工作室自用工具或按纹样收费，属判断而非已验证事实。
        evidence_ids:
        - ev-817e7a8af68258de
      - gate: truth
        status: insufficient
        reason: 纹样准确度、可编辑程度与是否需人工校正均无公开材料，交付确定性无法核对。
        evidence_ids:
        - ev-817e7a8af68258de
      next_validation: 收集 ThreadLore 官方产品页或演示材料，核验照片转纹样的准确度、可编辑程度与是否需人工校正。
