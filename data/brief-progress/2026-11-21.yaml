      options.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 产品团队在功能上线后，需要把用户行为事件汇总成使用情况视图，判断哪些功能被真正采用。
        job_en: After a feature ships, product teams need to aggregate user behavior events into usage
          views to judge which features are actually adopted.
        pain_zh: 缺少行为数据时，团队只能靠访谈和猜测判断功能价值；自建埋点与报表又要投入工程资源。
        pain_en: Without behavior data, teams judge feature value by interviews and guesswork; building
          tracking and reporting in-house consumes engineering time.
        current_alternative_zh: 商业产品分析 SaaS、自建埋点加 BI 报表，或直接用数据库查询日志。
        current_alternative_en: Commercial product analytics SaaS, self-built tracking plus BI reports,
          or querying logs directly in a database.
        usage_reason_zh: 推断：对数据不能出内网的团队，自部署开源方案省去采购与合规审批环节，并可直接改代码适配自有埋点；但候选未给出接入成本与留存证据，选择动机尚不能确认为事实。
        usage_reason_en: 'Inference: for teams whose data cannot leave their network, a self-hosted open
