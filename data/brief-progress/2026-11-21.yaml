    jobs_en:
    - 'Clinicians or medical graduate students preparing a submission: searching PubMed, organizing statistics,
      drafting Chinese/English manuscripts, and completing journal selection and peer-review revisions'
    - Medical researchers and clinicians searching PubMed, drafting manuscripts in Chinese and English,
      and handling journal submission and peer-review revisions
    regions:
    - 中国
    regions_en:
    - China
    open_source: true
    summary_zh: 中国医生和医学研究生在准备投稿时，会在 Claude Code 或 Codex 中调用这套 32 个技能，让 AI 检索 PubMed 文献、整理统计结果、起草中英文论文并处理选刊与审稿修回；最终交付是可供作者核对修改的稿件与投稿材料，具体流程和交付质量仍待核验。
    inspiration: 趋势：医学写作这类高门槛、强格式的旧流程，正被拆成可复用的技能包，直接嵌进医生已有的编码式助手。切入：从中国医院科研岗和医学研究生入手，把文献检索、统计和投稿格式做成按篇或按项目收费的交付服务，而不是只卖技能包；价格未披露，需自行设计。
    summary_en: Chinese clinicians and medical graduate students preparing a submission call this set
      of 32 skills inside Claude Code or Codex, having the AI search PubMed, organize statistics, draft
      Chinese/English manuscripts, and handle journal selection and peer-review revisions; the deliverable
      is a draft and submission package the author must check, and the exact workflow and output quality
      still need verification.
    inspiration_en: 'Trend: medical writing, a high-barrier, format-heavy legacy workflow, is being broken
      into reusable skill packs embedded in the coding assistants doctors already use. Entry: start with
      hospital research roles and medical graduate students in China and sell per-manuscript or per-project
      delivery of literature search, statistics, and submission formatting rather than just a skill pack;
      pricing is undisclosed and must be designed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 中国医生和医学研究生在准备投稿时，需要检索 PubMed 文献、整理统计结果、撰写中英文论文，并完成选刊与审稿修回。
        job_en: Chinese clinicians and medical graduate students preparing a submission need to search
          PubMed, organize statistics, write Chinese/English manuscripts, and complete journal selection
          and peer-review revisions.
        pain_zh: 医学论文写作门槛高、格式与统计要求严，非英语母语作者还要跨语言写作，选刊和修回反复耗时；这是工作流推理，公开材料未给出用户抱怨原文。
        pain_en: Medical manuscript writing has high barriers with strict formatting and statistics requirements;
          non-native English authors must also write across languages, and journal selection and revisions
          are repeatedly time-consuming. This is workflow inference; public materials do not quote user
          complaints.
        current_alternative_zh: 医生通常自己手工检索文献、用统计软件分析、请同行或润色机构改稿，再逐家比对期刊投稿要求。
        current_alternative_en: Doctors typically search literature manually, analyze with statistics
          software, ask colleagues or editing services to revise drafts, and compare journal requirements
          one by one.
        usage_reason_zh: 推断：相较手工检索与逐段写作，这套技能让 AI 在助手内直接完成 PubMed 检索、统计整理和初稿起草，减少从零搜集与成稿的步骤，因此时间紧、缺乏写作支持的医生和研究生会在投稿前选择它；尚无留存或付费证据。
        usage_reason_en: 'Inference: versus manual search and paragraph-by-paragraph writing, these skills
          let the AI directly run PubMed searches, organize statistics, and draft inside the assistant,
          cutting the from-scratch gathering and drafting steps, so time-pressed doctors and students
          with little writing support would choose it before submission; no retention or payment evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决医学论文从文献检索、统计整理到中英写作与投稿的刚性任务，旧流程手工且耗时，结构上成立；买方与付费未核验。
        evidence_ids:
        - ev-93df87267bd30e6b
        - ev-64fe5c7c6744fad7
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标约 370 且长期平稳，属于关注度而非持续采用，缺少用户评价或使用案例。
        evidence_ids:
        - ev-93df87267bd30e6b
        - ev-55c32be37e723e02
      - gate: model
        status: insufficient
        reason: 开源技能包未披露定价或收费路径，钱可能来自个人订阅或机构采购，这是判断不是已验证事实。
        evidence_ids:
        - ev-64fe5c7c6744fad7
      - gate: truth
        status: insufficient
        reason: 交付质量、统计与文献引用是否可靠、人工核对边界均无公开材料，需进一步核验。
