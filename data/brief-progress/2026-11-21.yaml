      signal_level: 初步成立
      demand_read:
        job_zh: 播客或直播运营者在长视频、直播结束后，要从数小时素材中挑出可发布的短片段并剪成成片。
        job_en: Podcast or live-stream operators, after a long video or live session, must pick publishable
          short clips from hours of footage and cut them into finished clips.
        pain_zh: 人工逐段回看数小时素材找高光耗时且易漏，剪辑排期被拖长；不做的后果是长内容无法转化为可分发短片。
        pain_en: Manually reviewing hours of footage for highlights is slow and error-prone, delaying
          editing schedules; skipping it means long content never becomes distributable clips.
        current_alternative_zh: 运营者用剪辑软件逐段回看、手动打点，或外包给剪辑师，按条或按工时付费。
        current_alternative_en: Operators scrub footage in editing software and mark points by hand, or
          outsource to editors paid per clip or per hour.
        usage_reason_zh: 推断：相较人工逐段回看，它让模型先定位高光片段再出片，减少“找片段”这一步的负担，因此需要批量产出短片的播客与直播团队会在长素材处理时选择它；自托管与自带密钥也让成本可控。
        usage_reason_en: 'Inference: versus manual scrubbing, it has the model locate highlights first
          and then produce clips, cutting the ''find the segment'' step, so podcast and live teams needing
          batch short clips would choose it for long footage; self-hosting and bring-your-own-key also
          keep cost controllable.'
      gates:
