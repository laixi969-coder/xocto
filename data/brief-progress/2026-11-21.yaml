    inspiration: 趋势是旅行规划从“搜索加攻略”转向由代理直接串起行程与预订；切入可放在某一类高决策成本行程（如多国联程、亲子长线），以按行程或按成功预订收费的方式对结果负责，而不是再做一个攻略聚合页。
    summary_en: Travellers open it after fixing destination and dates, handing over flight, lodging and
      local-activity information that used to be scattered across guides, comparison sites and booking
      platforms; it produces an itinerary and attempts bookings. The user receives an executable plan
      plus booking actions, while which steps are fully automated versus human-confirmed still needs verification.
    inspiration_en: The trend is travel planning moving from search-plus-guides to agents that chain itinerary
      and booking directly. The entry point is a high-decision-cost trip type such as multi-country routing
      or long family trips, charging per itinerary or per successful booking to own the outcome rather
      than building another guide aggregator.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自由行旅客在确定目的地和日期后，需要把航班、住宿与当地活动排成一份可执行的行程并完成预订。
        job_en: Independent travellers, once destination and dates are fixed, need to assemble flights,
          lodging and local activities into an executable itinerary and complete bookings.
        pain_zh: 行程信息分散在攻略、比价网站和多个预订平台，旅客要反复切换、手工比对时间与价格，且一处改动会牵动后续安排。
        pain_en: Itinerary information is scattered across guides, comparison sites and multiple booking
          platforms; travellers switch repeatedly, manually reconcile times and prices, and one change
          cascades through later plans.
        current_alternative_zh: 旅客目前用搜索引擎、攻略社区、表格和多个预订 App 手工拼行程，再逐个平台下单。
        current_alternative_en: Travellers currently use search engines, guide communities, spreadsheets
          and several booking apps to assemble itineraries by hand, then order platform by platform.
        usage_reason_zh: 推断：相较手工拼表，它把航班、住宿与活动信息收进同一次对话并直接产出可执行行程，减少反复切换与比对这一步；愿意为省下规划时间付费的旅客会在长线或多段行程时选择它，但公开材料尚未显示实际采用或留存。
        usage_reason_en: 'Inference: compared with manual spreadsheets, it gathers flights, lodging and
          activities into one conversation and outputs an executable itinerary, removing the repeated
          switching and comparison step; travellers willing to pay to save planning time would choose
          it for long or multi-leg trips, though public material shows no actual adoption or retention
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决旅客把分散信息拼成可执行行程并完成预订的需求，痛点是反复切换与手工比对，旧行为清晰；买方是否为旅客本人尚未核验。
        evidence_ids:
        - ev-e2c5d4905f0db377
      - gate: consensus
        status: insufficient
        reason: 仅有产品定位描述，没有用户评价、社区讨论或采用迹象，无法判断旅客是否认可由代理代劳规划与预订。
        evidence_ids:
        - ev-e2c5d4905f0db377
      - gate: model
        status: insufficient
        reason: 未披露定价与收费方式，无法判断按行程、按预订还是订阅收费；这是判断，不是已验证事实。
        evidence_ids:
        - ev-e2c5d4905f0db377
      - gate: truth
        status: insufficient
        reason: 预订环节涉及价格与库存的确定性交付，公开材料未说明失败或改签时如何处理，人工确认边界不清。
        evidence_ids:
        - ev-e2c5d4905f0db377
      next_validation: 收集 Tripmojo 官方定价页或预订流程说明，确认其收费方式与预订失败、改签时的人工介入边界。
