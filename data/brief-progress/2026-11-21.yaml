    summary_zh: AI评估非营利组织METR在2026年11月20日更新其“时间跨度”图表，新增耗时更长和更开放的任务，发现部分能力仍沿指数轨迹提升，但模型在需要判断力的任务上不如编码任务。这一评估口径变化影响外界对AI能力边界的判断，进而影响企业在编码之外采用AI的预期与交付评估；此为推断。
    summary_en: On November 20, 2026, AI evaluation nonprofit METR updated its time-horizon plot with
      longer and more open-ended tasks, finding some capabilities still improving exponentially while
      models are weaker on judgment-heavy tasks than on coding. This shift in evaluation framing affects
      how observers judge AI capability limits and thus how firms set adoption and delivery expectations
      beyond coding; this is an inference.
