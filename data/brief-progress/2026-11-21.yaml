        - ev-56ac8935bd45a4cc
      - gate: consensus
        status: insufficient
        reason: 只有仓库星数增长，缺少用户评价、issue 讨论或采用案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-56ac8935bd45a4cc
      - gate: model
        status: insufficient
