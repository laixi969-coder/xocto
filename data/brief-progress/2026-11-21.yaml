        usage_reason_zh: 推断：它把时间去向本地记录下来并写回复盘，减少开发者手动翻日志、凭印象改配置这一步，因此需要审计助手返工原因的开发者会在长会话后选择它；是否真的改善结果尚无公开证据。
        usage_reason_en: 'Inference: it records time attribution locally and writes the review back, removing
