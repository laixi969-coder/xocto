        evidence_ids:
        - ev-30728d45c10e22cd
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或商业交付路径，谁付钱尚不清楚；这是判断，不是已验证事实。
        evidence_ids:
        - ev-45d64ed4b6c14af9
      - gate: truth
        status: insufficient
        reason: 界面是否真正降低操作负担、能否确定性交付代理结果，缺少可复现实测与文档说明。
        evidence_ids:
