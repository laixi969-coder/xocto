    - 3D animation and game art
    - digital content production
    jobs:
    - 三维美术师在 Blender 中调整场景或模型时，让 AI 提出逐步工具调用，由人逐步批准、执行、撤销，完成建模或场景修改
    jobs_en:
    - 3D artists adjusting a scene or model in Blender let an AI propose step-by-step tool calls that
      a human approves, executes and undoes to complete modeling or scene edits
    regions: []
    regions_en: []
    open_source: true
    summary_zh: Blender 用户在做场景或模型修改时，打开这个插件式工作台，AI 把每次编辑拆成受监督的工具调用，先提出、再经人批准后按顺序执行，当前步骤后可取消、可按名称撤销。用户最终拿到的是可逐步核对和回退的编辑结果；具体交付形态与人工确认边界仍待核验。
    inspiration: 趋势：三维创作里的 AI 正从“一键生成”转向“可审批、可撤销的受控编辑”，把风险控制做进工作流本身。切入：面向游戏美术外包、动画工作室的资产修改环节，卖可审计的批量改模与场景调整，而不是卖生成模型。
    summary_en: When Blender users need to modify a scene or model, they open this add-on-style workbench;
      the AI turns each edit into a supervised tool call that is proposed, approved by a human, then executed
      in sequence, cancellable after the current step and undoable by name. The user gets step-by-step
      checkable and reversible edits; the exact delivery form and human-confirmation boundary still need
      verification.
    inspiration_en: 'Trend: AI in 3D creation is moving from one-click generation toward controlled, approvable
      and undoable edits, building risk control into the workflow itself. Entry: target asset-revision
      steps at game-art outsourcing and animation studios, selling auditable batch model and scene edits
      rather than a generation model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在 Blender 中修改场景或模型时，需要让 AI 参与建模操作，同时保留逐步审批和撤销的控制权。
        job_en: 3D artists modifying a scene or model in Blender want AI to take part in modeling operations
          while keeping step-by-step approval and undo control.
        pain_zh: 直接用生成式 AI 改三维资产容易一次改动过大、难以回退，美术师不敢把正式资产交给它。
        pain_en: Direct generative AI edits to 3D assets tend to change too much at once and are hard
          to roll back, so artists hesitate to hand over production assets.
        current_alternative_zh: 美术师目前多在 Blender 里手工逐步操作，或使用生成式工具后人工重做和修补。
        current_alternative_en: Artists currently work step by step by hand in Blender, or use generative
          tools and then manually redo and patch the results.
        usage_reason_zh: 相较手工逐步操作或生成后返工，它把每次 AI 编辑变成先提出、经人批准再执行的工具调用，并支持按名称撤销，减少返工与不可控改动的负担；这是基于功能结构的工作流推理。
        usage_reason_en: Compared with manual step-by-step work or redoing generative output, it turns
          each AI edit into a tool call that is proposed, human-approved and then executed, with undo
          by name, reducing rework and uncontrolled changes; this is workflow reasoning from the feature
          structure.
      gates:
      - gate: value
        status: supported
        reason: 它解决三维美术师让 AI 参与建模却怕不可控改动的需求，痛点在于返工与无法回退；买方尚不明确。
        evidence_ids:
        - ev-63286206de4c2dd0
      - gate: consensus
        status: insufficient
        reason: 仓库星数从 45 升至约 514 后趋平，属关注度信号，缺少用户反馈或采用证据。
        evidence_ids:
        - ev-1775dc050c84fe16
        - ev-63286206de4c2dd0
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或商业交付路径，钱可能来自工作室定制或服务，属判断非事实。
        evidence_ids:
        - ev-63286206de4c2dd0
      - gate: truth
        status: insufficient
        reason: 受控审批与撤销贴近美术工作第一性目标，但缺少实际交付结果与人工边界验证。
        evidence_ids:
        - ev-63286206de4c2dd0
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有美术师报告实际用于正式资产修改及撤销、审批流程的效果。
    event_summary_zh: 2026 年 11 月 12 日该开源仓库发布，提供受监督的 Blender AI 编辑工作流；此后数日仓库星数从 45 升至约 514 并趋平。
    event_summary_en: On 12 November 2026 this open-source repository appeared, offering a supervised
      Blender AI editing workflow; over the following days its stars rose from 45 to about 514 and then
      flattened.
