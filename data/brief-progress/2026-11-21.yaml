        - ev-a2f043189310166e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度从 50 增至 111，属关注度信号，未见用户评价或团队采用案例。
        evidence_ids:
        - ev-c34fa628c8fca205
        - ev-a2f043189310166e
