  atlas-2:
    slug: atlas-2
    name: atlas
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - Software Development
    jobs:
    - 使用 Claude Code 的开发者，在跨会话继续同一代码库任务时，需要重新交代项目背景与约定，希望减少重复输入和上下文消耗
    jobs_en:
    - Developers using Claude Code who resume work on the same codebase across sessions must restate project
      context and conventions, and want to cut repeated input and context consumption
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 的开发者在新会话或切换任务时，原本要重新粘贴项目背景、约定和文件线索；atlas 通过本地 MCP 服务与钩子保存项目记忆，在会话中把这些上下文交给模型，并声称减少
      token 消耗。用户最终拿到的是带项目记忆的编码会话，具体记忆范围、召回准确度和交付效果仍待核验。
    inspiration: 趋势：编码助手正从单次对话走向需要长期项目记忆的工作流，围绕上下文管理和 token 成本的周边工具开始出现。切入：面向长期维护同一代码库的小团队或独立开发者，从“跨会话恢复项目状态”这一环节进入；可考虑按团队席位或按节省的调用量收费，但公开材料未披露定价，属推断。
    summary_en: Developers using Claude Code normally re-paste project background, conventions and file
      pointers when starting a new session or switching tasks. atlas stores project memory locally through
      an MCP server and hooks, feeds that context into the session, and claims to reduce token consumption.
      The user gets a coding session with project memory; the memory scope, recall accuracy and delivery
      results still need verification.
    inspiration_en: 'Trend: coding assistants are moving from one-off chats to workflows that need long-term
      project memory, spawning tools around context management and token cost. Entry: target small teams
      or solo developers maintaining one codebase over time, starting from the step of restoring project
      state across sessions; per-seat or usage-based pricing is conceivable but not disclosed, so this
      is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 的开发者，在跨会话继续同一代码库任务时，需要重新交代项目背景与约定，希望减少重复输入和上下文消耗。
        job_en: Developers using Claude Code who resume work on the same codebase across sessions must
          restate project context and conventions, and want to cut repeated input and context consumption.
        pain_zh: 每次新会话都要手工重建上下文，既费时又容易遗漏约定，长上下文还推高调用成本。
        pain_en: Each new session requires manually rebuilding context, which is time-consuming, easy
          to omit conventions, and long context raises call costs.
        current_alternative_zh: 开发者通常手动粘贴说明文件、维护 CLAUDE.md 之类的项目说明，或反复重述需求。
        current_alternative_en: Developers typically paste instruction files by hand, maintain project
          notes such as CLAUDE.md, or restate requirements repeatedly.
        usage_reason_zh: 推断：atlas 通过本地 MCP 服务与钩子自动保存并注入项目记忆，省去每次会话手工重建上下文这一步，因此长期维护同一代码库、在意 token 成本的开发者会在新会话开始时选择它；公开材料尚无留存或复购证据。
        usage_reason_en: 'Inference: atlas automatically saves and injects project memory via a local
          MCP server and hooks, removing the manual step of rebuilding context each session, so developers
          maintaining one codebase long-term and watching token costs would choose it at session start;
          public materials show no retention or repeat-use evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨会话重建项目上下文的重复劳动与 token 成本，痛点具体，旧替代是手工粘贴说明文件。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 87 增至 133，属关注度信号，不能证明持续采用或团队共识。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
        - ev-041ca5058d4e0ab7
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或商业交付方式，买方与收费模式不明。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
      - gate: truth
        status: insufficient
        reason: 记忆召回准确度、是否会注入错误上下文以及安全边界均无公开材料支持。
        evidence_ids:
        - ev-3aad9d33e8b9d4b4
      next_validation: 收集 atlas 仓库的 issue 与 discussion，核验开发者对记忆召回准确度和实际 token 节省的反馈。
  auto-ontology-mcp:
    slug: auto-ontology-mcp
    name: auto-ontology-mcp
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 个人知识管理者在整理笔记与资料时，把已有知识库接入 Claude、ChatGPT 等客户端，让助手基于自己的语义层回答和检索
    - 知识工作者在需要跨资料查询时，通过 MCP 客户端调用个人知识库，完成基于自有内容的问答
    jobs_en:
    - Personal knowledge managers connect an existing knowledge base to Claude, ChatGPT and other clients
      so the assistant answers and retrieves based on their own semantic layer
    - Knowledge workers query across their own materials through an MCP client to get answers grounded
      in personal content
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人知识管理者在整理笔记和资料后，把已有知识库与 NVIDIA Auto Ontology 语义层封装成 MCP 服务，接入 Claude、ChatGPT 等客户端；AI
      接收用户提问后检索这份个人知识库作答，用户拿到基于自有内容的回答。具体检索质量、交付形态与人工确认环节仍待核验。
    inspiration: 趋势：个人知识库正从独立笔记应用转向被通用助手直接调用的语义层，谁掌握结构化个人数据谁就有入口价值。切入：面向律师、咨询顾问这类资料密集且需反复查证的人群，把他们的案卷或项目资料做成可被助手调用的私有语义层，按接入或维护收费；但需先核验检索准确度与真实复用情况。
    summary_en: Personal knowledge managers wrap an existing knowledge base and NVIDIA Auto Ontology semantic
      layer as an MCP server and connect it to Claude, ChatGPT and other clients; the AI retrieves from
      this personal knowledge base to answer questions, and users get answers grounded in their own content.
      Retrieval quality, delivery form and human confirmation steps remain to be verified.
    inspiration_en: 'Trend: personal knowledge bases are shifting from standalone note apps to semantic
      layers that general assistants call directly, so whoever structures personal data holds entry value.
      Entry: target document-heavy people such as lawyers and consultants, turning their case or project
      files into a private semantic layer assistants can call, charging for setup or maintenance; retrieval
      accuracy and real reuse still need verification.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人知识管理者在整理笔记与资料时，把已有知识库接入 Claude、ChatGPT 等客户端，让助手基于自己的语义层回答和检索。
        job_en: Personal knowledge managers connect an existing knowledge base to Claude, ChatGPT and
          other clients so the assistant answers and retrieves based on their own semantic layer.
        pain_zh: 通用助手不了解个人积累的资料，用户每次都要手动粘贴或重新描述背景，跨资料查询费时且容易遗漏。
        pain_en: General assistants do not know a person's accumulated materials, so users must paste
          or re-explain context each time, making cross-document queries slow and error-prone.
        current_alternative_zh: 手动复制粘贴笔记到对话框，或依赖笔记软件自带的搜索，缺乏让助手直接调用个人知识库的通道。
        current_en: Manually copying notes into a chat box or relying on built-in search in note apps,
          with no channel for the assistant to call the personal knowledge base directly.
        usage_reason_zh: 推断：它把个人知识库封装成 MCP 服务，助手可直接检索而非用户手动搬运资料，减少每次重新粘贴和描述背景这一步，因此资料密集、需反复查证的用户会在跨资料问答时选择它；实际检索准确度与持续使用尚无公开证据。
        usage_reason_en: 'Inference: it wraps the personal knowledge base as an MCP server so the assistant
          retrieves directly instead of the user moving materials by hand, removing the step of re-pasting
          and re-describing context, so document-heavy users doing cross-document Q&A may choose it; retrieval
          accuracy and sustained use lack public evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决通用助手不了解个人资料、每次需手动搬运背景的痛点，结构上成立，属工作流推理。
        evidence_ids:
        - ev-e15a5abb47944b0e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属关注度而非持续采用，缺少用户反馈或案例。
        evidence_ids:
        - ev-a83a7754e9835053
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露，买方与收费方式不明，属判断非事实。
        evidence_ids:
        - ev-e15a5abb47944b0e
      - gate: truth
        status: insufficient
        reason: 检索准确度、人工确认边界与安全处理未见公开材料，交付确定性待核验。
        evidence_ids:
        - ev-6bcfa9d021df0de8
      next_validation: 收集该仓库的 issue/discussion 与 README 中的使用说明，核验检索准确度、部署方式与是否有真实复用反馈。
