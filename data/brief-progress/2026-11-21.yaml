      demand_read:
        job_zh: 事实核查编辑或普通用户在浏览新闻、社交信息流或商品页时，面对可疑图片和视频，需要判断其是否为AI生成，以决定是否采用、转发或标注。
        job_en: Fact-checking editors or ordinary users facing suspicious images and videos in news, social
          feeds or product pages need to judge whether they are AI-generated before using, sharing or
          labeling them.
        pain_zh: AI生成素材越来越逼真，人工肉眼难以分辨；把素材上传到第三方检测服务又涉及隐私和额外步骤。
        pain_en: AI-generated assets look increasingly realistic and are hard to judge by eye, while uploading
          them to third-party detection services raises privacy concerns and adds steps.
        current_alternative_zh: 靠肉眼经验判断、反向图片搜索，或把素材上传到在线检测网站逐张核查。
        current_alternative_en: Judging by eye, reverse image search, or uploading each asset to online
          detection sites one by one.
        usage_reason_zh: 推断：扩展在浏览时本地完成检测并就地标记，省去把每张素材另存再上传到检测站的步骤，也避免素材外传；因此频繁核查网络素材的编辑或审核人员会在日常浏览中选用它。检测准确率尚未公开，是选择时的关键未知。
        usage_reason_en: 'Inference: the extension detects locally during browsing and marks assets in
          place, removing the save-and-upload step to detection sites and avoiding sending material out;
          editors or reviewers who frequently check web assets would therefore adopt it in daily browsing.
          Detection accuracy is not public and remains the key unknown.'
      gates:
