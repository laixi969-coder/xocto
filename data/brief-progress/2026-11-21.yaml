      moves and narration timing, turning editing decisions into reusable scripts. Entry: target independent
      creators and small marketing teams doing data explainers, city walks or travel documentaries, selling
      per finished film or template subscriptions; first confirm which manual editing step it actually
      removes.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容创作者或营销人员在需要把一组照片、地图或数据卡片做成带旁白的解说短片时，在编码代理里生成连续镜头与配音节奏，拿到一段可播放的成片。
