    open_source: false
    summary_zh: 品牌营销或内容负责人需要检查自家产品在 ChatGPT 等 AI 助手回答里是否被提及、被引用，以及竞品是否被推荐；Profound 接收品牌相关问题，向多个 AI 模型发起查询并汇总回答中的提及与引用，输出可对比的监测结果，供团队据此修改对外内容。具体监测口径、交付形式与人工复核环节仍待核验。
    inspiration: 趋势是品牌预算正从“搜索排名”迁移到“AI 回答里是否被引用”，监测与优化对象从网页关键词变成模型输出。切入可先服务已有内容团队、预算明确的中大型消费品牌，按监测的品牌与问题集打包收费；但该赛道已出现高估值头部，正面做通用监测工具窗口收窄，更现实的是绑定某一行业的内容改写与投放执行。
    summary_en: Brand marketing or content leads need to check whether their products are mentioned or
      cited in AI assistant answers such as ChatGPT, and whether competitors are recommended; Profound
      takes brand-related questions, queries multiple AI models and aggregates mentions and citations
      in the answers into comparable monitoring results that teams use to revise external content. The
      exact monitoring scope, deliverable format and human review step still need verification.
    inspiration_en: The trend is that brand budgets are shifting from search rankings to whether a brand
      is cited in AI answers, so the object of monitoring and optimization moves from web keywords to
      model outputs. Entry could start with mid-to-large consumer brands that already have content teams
      and clear budgets, sold as a package per monitored brand and question set; however, a highly valued
      leader already exists, so a generic monitoring tool faces a narrowing window, and tying the product
      to content rewriting and placement execution in one industry is more realistic.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 品牌营销与内容负责人在规划对外内容与投放时，需要弄清自家产品在 AI 助手回答中被提及、被引用的程度，以及竞品被推荐的情况，据此决定改哪些页面和内容。
        job_en: Brand marketing and content leads planning external content and campaigns need to understand
          how often their products are mentioned and cited in AI assistant answers and which competitors
          are recommended, then decide which pages and content to revise.
        pain_zh: 用户获取信息的入口部分转向 AI 回答，品牌在搜索结果里的排名不再直接对应曝光；团队缺少系统方法查看模型回答里提到了谁，只能人工逐条提问，难以横向比较。
        pain_en: Part of the information-seeking entry point has shifted to AI answers, so search rankings
          no longer map directly to visibility; teams lack a systematic way to see who is mentioned in
          model answers and can only ask questions manually, making comparison hard.
        current_alternative_zh: 旧做法是 SEO 关键词排名工具加人工在 ChatGPT 等助手里逐个提问、截图记录；部分团队干脆不做，只凭零散观察判断。
        current_alternative_en: The old approach is SEO keyword-ranking tools plus manually asking ChatGPT
          and similar assistants one by one and recording screenshots; some teams skip it and judge from
          scattered observations.
        usage_reason_zh: 推断：相较人工逐条提问，Profound 用同一组品牌问题批量查询多个模型并汇总提及与引用，把“逐个模型手动问、手动记”压缩成一次可对比的监测结果，因此需要定期向管理层汇报
          AI 可见度的品牌与内容团队会在季度复盘时选择它；公开材料未提供留存或复购证据。
        usage_reason_en: 'Inference: compared with asking each model manually, Profound batch-queries
          multiple models with the same brand question set and aggregates mentions and citations, compressing
          manual per-model asking and recording into one comparable monitoring result, so brand and content
          teams that must regularly report AI visibility to management would choose it during quarterly
          reviews; public materials provide no retention or repeat-purchase evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决品牌在 AI 回答中是否被提及、被引用的可见度问题，痛点是搜索排名不再对应曝光且人工逐条提问难比较；买方与付费路径尚未公开。
        evidence_ids:
        - ev-89426cf9b222b466
      - gate: consensus
        status: insufficient
        reason: 只有融资与估值报道，没有客户案例、用户评价或采用规模，无法判断团队是否已把它纳入常规工作流。
        evidence_ids:
        - ev-89426cf9b222b466
        - ev-8bb85a350f48c940
      - gate: model
        status: insufficient
        reason: 公开材料未说明按品牌、按问题集还是按席位收费，也未披露收入或合同结构，钱从哪来只能推断为品牌方市场预算。
        evidence_ids:
        - ev-89426cf9b222b466
      - gate: truth
        status: insufficient
        reason: 监测结果依赖第三方模型回答，模型输出变化快，产品能否稳定交付可核对结论、人工复核边界如何，公开材料未说明。
        evidence_ids:
        - ev-89426cf9b222b466
      next_validation: 收集 Profound 官方定价页或公开客户案例，确认其按什么单位收费以及是否有品牌方公开的使用与续约说明。
