  blender-ai-copilot-lab:
    slug: blender-ai-copilot-lab
    name: blender-ai-copilot-lab
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与游戏美术
    - 影视与广告制作
    industries_en:
    - 3D animation and game art
    - Film and advertising production
    jobs:
    - 三维美术师在接到分镜或场景需求时，把多步骤场景搭建交给受监督的智能体团队，并在任务板上逐项复核与撤销
    - 3D artists handing multi-step scene briefs to supervised agent teams and reviewing or undoing each
      task on a board
    jobs_en:
    - 3D artists handing multi-step scene briefs to supervised agent teams and reviewing or undoing each
      task on a board
    - 3D artists handing multi-step scene briefs to supervised agent teams and reviewing or undoing each
      task on a board
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在接到分镜或场景需求时，把多步骤场景搭建交给由管理者、执行者、复核者组成的智能体团队，在实时任务板上查看复核结论，每个受阻任务只允许一次纠正，并可命名撤销。用户最终拿到的是可回退的场景改动与任务记录，具体交付质量仍待核验。
    inspiration: 趋势：三维内容生产开始把“分镜到场景”的重复搭建拆成可监督的智能体任务，而不是一次性生成。切入：从独立游戏美术外包和广告预演这类按镜头交付的小团队进入，卖“可回退的场景搭建工时”，而不是卖插件席位；价格未披露，需先验证美术师是否愿意把真实项目交给它。
    summary_en: When 3D artists receive a storyboard or scene brief, they hand multi-step scene building
      to a manager–worker–reviewer agent team, watch review findings on a live task board, allow one correction
      per blocked task, and undo by name. The output is reversible scene edits plus a task record; delivery
      quality is still unverified.
    inspiration_en: 'Trend: 3D production is splitting storyboard-to-scene grunt work into supervised
      agent tasks rather than one-shot generation. Entry: start with small per-shot teams in indie game
      art outsourcing and ad previs, selling reversible scene-building hours rather than plugin seats;
      pricing is undisclosed and whether artists trust real projects to it remains unverified.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师接到分镜或场景需求后，需要把建模、摆放、灯光等多步骤搭建完成并交付可用场景，过程中要能逐项复核和回退。
        job_en: After receiving a storyboard or scene brief, 3D artists must complete multi-step building
          such as modeling, layout and lighting and deliver a usable scene, with per-step review and rollback.
        pain_zh: 多步骤场景搭建重复且耗时，一次性生成难以局部修正，出错后往往要整段重做，复核责任不清。
        pain_en: Multi-step scene building is repetitive and slow; one-shot generation is hard to fix
          locally, errors often force full rework, and review ownership is unclear.
        current_alternative_zh: 美术师手工在 Blender 里逐步搭建，或用一次性生成工具出图后再手动修补，缺少任务级复核与撤销记录。
        current_alternative_en: Artists build step by step by hand in Blender, or use one-shot generators
          and then patch manually, without task-level review or undo records.
        usage_reason_zh: 推断：相较一次性生成后手工返工，它把场景拆成带复核结论和命名撤销的任务，让美术师只重做受阻的那一步，因此承接多镜头外包的小团队在需要可回退改动时会选择它；尚无留存或客户案例证据。
        usage_reason_en: 'Inference: versus one-shot generation followed by manual rework, it splits scenes
          into tasks with review findings and named undo so artists redo only the blocked step; small
          multi-shot outsourcing teams needing reversible edits would choose it. No retention or customer-case
          evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多步骤场景搭建重复、出错需整段重做的问题，任务级复核与命名撤销对应可回退交付，痛点具体。
        evidence_ids:
        - ev-75b60ac3ea1a4964
        - ev-bf4771e3721705b6
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度在数日内从 176 升至约 506，属关注度信号，未见美术师评价或采用案例。
        evidence_ids:
        - ev-75b60ac3ea1a4964
        - ev-7f6eeb413c7d3ba1
        - ev-bf4771e3721705b6
      - gate: model
        status: insufficient
        reason: 开源项目未见定价、付费路径或买方说明，钱可能来自工作室自建或后续商业版，属判断而非已验证事实。
        evidence_ids:
        - ev-bf4771e3721705b6
      - gate: truth
        status: insufficient
        reason: 复核与撤销机制贴近可回退交付，但未见实际场景产出质量、安全边界或人工确认流程的公开材料。
        evidence_ids:
        - ev-75b60ac3ea1a4964
        - ev-66a61432d95c3a03
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有美术师报告真实项目中的场景交付结果与撤销使用情况。
