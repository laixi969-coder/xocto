      communications and task material to the assistant, which organizes, reminds and pushes the next
      step; what users receive is a consolidated, followed-up list of items. The exact input scope and
      delivery format still need verification.
    inspiration_en: The trend is general assistants entering through personal daily chores and using funding
      speed to buy habit. The opening is not head-on general chat but running one high-frequency chore
      (appointments, bills, client follow-up) to a checkable result, charged per outcome or by subscription
      to individuals or small teams.
