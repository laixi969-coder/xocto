        - ev-386de55365024c82
      - gate: consensus
        status: insufficient
        reason: 星标从288增至322、有38个未关闭议题，说明有开发者关注与讨论，但没有采用规模或持续使用的证据。
        evidence_ids:
        - ev-e45cf3594697a933
        - ev-386de55365024c82
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、商业主体或付费路径；钱可能来自企业支持或托管服务，这是判断而非已验证事实。
        evidence_ids:
        - ev-386de55365024c82
      - gate: truth
        status: insufficient
        reason: 压缩是否真的保住缓存、兼容哪些模型与工具、是否影响回答质量，公开材料均未说明，需看文档或可复现实测。
        evidence_ids:
