    name: Profound
    decision: queued
    event_summary_zh: 2026年9月15日，公开资料 报道 Profound 完成 1.8 亿美元 D 轮融资、估值 18 亿美元，距其 9600 万美元 C 轮不到七个月；同批报道未披露客户数、收入或留存数据。
