    jobs:
    - 开发者同时运行多个编码代理时，在 Herdr App 中切换 Spaces/Agents 或 Focus 侧栏，查看各代理状态并决定下一步操作
    jobs_en:
    - Developers running several coding agents switch between Spaces/Agents or a Focus sidebar in Herdr
      App to check each agent's status and decide the next action
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 这是 Herdr App 的一个开源布局扩展，为同时运行多个编码代理的开发者提供类似 T3 Code 的界面：可在 Spaces/Agents 视图与 Focus 侧栏之间切换，并带有
      T3 风格的 Settle 交互。用户最终拿到的是一个可切换的代理工作台视图；具体交付流程与人工确认环节仍待核验。
    inspiration: 趋势：编码代理从单个对话走向多代理并行，界面层开始出现“代理工作台”这类细分需求。切入：可从独立开发者和小型工程团队的多代理调度面板切入，先解决代理状态可见与切换成本，再考虑按团队席位或托管服务收费；价格未披露，属推断。
    summary_en: 'An open-source layout extension for Herdr App that gives developers running multiple
      coding agents a T3 Code-like interface: switching between a Spaces/Agents view and a Focus sidebar,
      with T3-style Settle interactions. The user gets a switchable agent workbench view; the concrete
      delivery flow and human confirmation steps still need verification.'
    inspiration_en: 'Trend: coding agents are moving from a single chat to parallel multi-agent work,
      and an interface layer for an ''agent workbench'' is emerging. Entry: start with a multi-agent control
      panel for indie developers and small engineering teams, first making agent status visible and switching
      cheaper, then consider per-seat or hosted pricing; pricing is undisclosed and this is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同时运行多个编码代理时，打开 Herdr App 的 Spaces/Agents 或 Focus 侧栏，查看各代理进度并切换到需要处理的那个。
        job_en: When running several coding agents at once, a developer opens Herdr App's Spaces/Agents
          or Focus sidebar to check each agent's progress and switch to the one needing attention.
        pain_zh: 多代理并行时，状态分散在多个窗口，开发者需要反复切换才能知道哪个代理卡住或完成，注意力被界面管理消耗。
        pain_en: With parallel agents, status is scattered across windows, so developers must switch repeatedly
          to learn which agent is stuck or done, spending attention on interface management.
        current_alternative_zh: 目前多靠多个终端标签、编辑器分屏或手工记录来跟踪各代理，缺少统一的代理视图。
        current_alternative_en: Today this is mostly handled with multiple terminal tabs, editor splits
          or manual notes to track each agent, without a unified agent view.
        usage_reason_zh: 推断：相较在多个终端标签间来回切换，该扩展把代理状态集中到一个可切换的侧栏视图，减少定位和切换这一步负担，因此同时跑多个编码代理的开发者会在并行任务增多时选择它。
        usage_reason_en: 'Inference: compared with switching among terminal tabs, this extension consolidates
          agent status into one switchable sidebar view, cutting the step of locating and switching, so
          developers running several coding agents would pick it as parallel tasks grow.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时状态分散、切换频繁的问题，痛点具体且不解决会拖慢任务推进；买方尚不清晰。
