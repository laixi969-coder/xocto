      project claims an AI agent can drive the app and produce the demo video, but public material does
      not detail its inputs, recording and editing steps, or output format, so the concrete workflow and
      deliverable still need verification.
    inspiration_en: 'Trend: demo videos are moving from manual screen capture and editing toward agents
      that operate the app and record it, selling the finished clip rather than the tool. Entry: start
      with release notes, app-store previews and docs demos for indie developers and small SaaS teams,
      delivering finished videos per clip or project instead of an editor; first confirm whether its recording
      and editing chain really removes the manual editing step.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或产品团队在发布新功能前，需要把应用操作过程录成演示视频，用于文档、更新说明或推广。
        job_en: Independent developers or product teams need to record an app walkthrough as a demo video
          for docs, release notes or promotion before shipping a feature.
        pain_zh: 手动录屏、剪辑、配音耗时，且要反复重录以匹配最终界面；不做的代价是文档和发布说明缺少直观演示。
        pain_en: Manual screen recording, editing and voiceover take time and require re-recording to
          match the final UI; skipping it leaves docs and release notes without a clear visual demo.
        current_alternative_zh: 人工用录屏软件加剪辑工具制作，或外包给视频制作者。
        current_alternative_en: Manual screen recording plus editing tools, or outsourcing to a video
          producer.
        usage_reason_zh: 推断：若代理能直接操作应用并按流程录制，用户可省去手动操作与初剪这一步，因此需要频繁出演示视频的独立开发者会尝试；但公开材料未说明录制与剪辑的具体动作，也未提供用户反馈或重复使用证据。
        usage_reason_en: 'Inference: if the agent can operate the app and record the flow directly, users
          skip manual operation and first-cut editing, so indie developers who need demo videos often
          would try it; however public material does not describe the recording and editing actions, nor
          offer user feedback or repeat-use evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决发布前制作应用演示视频的需求，痛点是手动录屏剪辑耗时；旧流程与不做的后果可还原，但具体交付细节未披露。
        evidence_ids:
        - ev-40408b374ec7a808
        - ev-8668a26df398183b
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从41缓慢增至81，属关注度信号，不能证明持续采用或强场景共识。
        evidence_ids:
        - ev-40408b374ec7a808
        - ev-8668a26df398183b
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径、买方或按结果收费方式，钱从哪来尚不清楚。
        evidence_ids:
        - ev-8668a26df398183b
      - gate: truth
        status: insufficient
        reason: 未说明代理操作应用与录制剪辑的确定性交付，也未披露人工确认边界，承诺能否稳定兑现待核验。
        evidence_ids:
        - ev-40408b374ec7a808
      next_validation: 收集该仓库 README 与 issue/discussion，确认其录制与剪辑链路、输入输出格式及是否有用户实际使用反馈。
  sketchcraft:
    slug: sketchcraft
    name: sketchcraft
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 工业设计
    - 建筑与空间设计
    - 制造业
    industries_en:
    - industrial design
    - architecture and spatial design
    - manufacturing
    jobs:
    - 产品设计师在早期概念阶段把草图轮廓拉伸成可检查的三维体块，用于和结构或客户确认外形
    - 建筑或空间设计人员在方案初期把平面轮廓快速拉成体量模型，用于讨论空间关系
    jobs_en:
    - Product designers turning a sketched outline into an inspectable 3D massing model during early concept
      work, to confirm shape with engineering or clients
    - Architects and spatial designers extruding a plan outline into a massing model in early schematic
      design, to discuss spatial relationships
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向需要快速把二维轮廓变成三维体块的设计人员：用户先画出轮廓，再通过推拉操作把它拉成三维模型；产品以 Rust 编写的桌面应用、命令行工具和 MCP 服务三种形态提供。用户最终拿到的是可查看的三维体块模型，具体导出格式、精度与人工复核环节仍待核验。
    inspiration: 趋势：三维建模的入口正在从“学一套复杂建模软件”前移到“画个轮廓就能拉出体块”，并且以 MCP 服务形态暴露给 AI 代理调用。切入：从建筑方案初期和产品概念草图这两个“只需要体块、不需要精修”的环节进入，卖点可以是把草图到体块的等待时间压到分钟级；但开源项目本身没有收费路径，需先看是否出现按项目或按席位收费的托管版本。
    summary_en: 'For designers who need to turn a 2D outline into a 3D mass quickly: the user draws an
      outline and pulls it up into a 3D model; it ships as a Rust desktop app, a CLI and an MCP server.
      The deliverable is a viewable 3D massing model; export formats, precision and any human review step
      still need verification.'
    inspiration_en: 'Trend: the entry point to 3D modeling is moving from learning a full modeling suite
      to sketching an outline and pulling it up, and it is exposed as an MCP server for AI agents to call.
      Wedge: start with early architectural schematic design and product concept sketching, where only
      massing is needed, and sell on cutting sketch-to-mass time to minutes; the open-source project itself
      has no revenue path, so watch for a hosted version priced per project or per seat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 产品设计师或建筑方案设计人员在概念阶段，手里只有一张手绘或二维轮廓图，需要快速得到可讨论的三维体块，用于和同事、结构方或客户确认外形与体量。
        job_en: A product designer or architect in concept phase holds only a hand-drawn or 2D outline
          and needs a discussable 3D mass quickly, to confirm shape and volume with colleagues, structural
          engineers or clients.
        pain_zh: 从二维轮廓到三维体块，在传统建模软件里要先建面、再拉伸、再调整，步骤多且需要软件熟练度；概念阶段反复改形时，每次改动都要重走一遍流程。
        pain_en: Going from a 2D outline to a 3D mass in conventional modeling software means creating
          faces, extruding and adjusting, which takes many steps and software fluency; when the shape
          changes repeatedly in concept phase, each change repeats the whole flow.
        current_alternative_zh: 用 SketchUp、Rhino 或 Blender 等桌面建模软件手工推拉；不会建模的人则画多张透视图或找人代做，反馈周期以天计。
        current_alternative_en: Manual push/pull in desktop modeling tools such as SketchUp, Rhino or
          Blender; people who cannot model draw multiple perspective sketches or ask someone else, with
          feedback cycles measured in days.
        usage_reason_zh: 推断：相较在完整建模软件里从零建面再拉伸，它把“画轮廓—推拉成体块”压缩成一步核心动作，并额外提供命令行与 MCP 服务，使 AI 代理或脚本可以直接生成体块，减少概念阶段反复改形时的重复操作；因此会在只需要体块、不需要精修的场景下被选择。
        usage_reason_en: 'Inference: compared with building faces from scratch and extruding in a full
          modeling suite, it compresses draw-outline-and-pull into one core action and adds a CLI and
          MCP server so agents or scripts can generate masses directly, cutting repeated work when shapes
          change in concept phase; that is why it would be chosen where only massing, not detailing, is
          needed.'
      gates:
      - gate: value
        status: supported
        reason: 它解决概念阶段把二维轮廓快速变成三维体块的需求，痛点是传统建模软件步骤多、改形重复；交付物是可查看的体块模型，结构上成立，属工作流推理。
        evidence_ids:
        - ev-16558312a843ac68
        - ev-b7dc4ceea3b0122e
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 74 增至 111，属关注度信号，不能证明设计人员已把它放进日常工作流；缺少用户评价或客户案例。
        evidence_ids:
        - ev-16558312a843ac68
        - ev-54074c26fad37eae
        - ev-b7dc4ceea3b0122e
      - gate: model
        status: insufficient
        reason: 开源项目无公开定价与付费路径，买方可能是个人设计师或设计团队，但这是判断而非已验证事实；是否出现托管收费版本未知。
        evidence_ids:
        - ev-b7dc4ceea3b0122e
      - gate: truth
        status: insufficient
        reason: 推拉建模本身是成熟能力，产品贴近概念阶段第一性目标；但导出格式、精度与人工复核边界未在材料中说明，交付确定性待核验。
        evidence_ids:
        - ev-16558312a843ac68
      next_validation: 收集该仓库的 README、发布说明与 issue 讨论，确认支持的导出格式、建模精度和 MCP 服务实际调用方式。
  skywake:
    slug: skywake
