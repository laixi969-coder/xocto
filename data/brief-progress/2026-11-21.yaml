        pain_en: Chaining multi-step tool operations by hand is error-prone and slow, but the candidate
          material does not say which concrete tasks it targets or how severe the pain is.
        current_alternative_zh: 用户自行编写脚本、使用其他 Agent 框架，或手动逐步操作工具。
