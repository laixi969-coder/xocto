        reason: 它解决浏览时判断图片视频是否为AI生成的需求，痛点是肉眼难辨且上传检测有隐私与步骤负担，旧做法是反向搜图或在线检测站。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
        - ev-dd49b6d68e23e448
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数缓慢增长，缺少用户评价、编辑室采用或客户案例，无法判断是否进入真实工作流。
        evidence_ids:
        - ev-dd49b6d68e23e448
        - ev-a2383bf131f3d5ae
      - gate: model
        status: insufficient
        reason: 开源免费，未见定价、机构订阅或按核查量收费的公开材料，买方与付费路径尚不明确，这是判断而非已验证事实。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
      - gate: truth
        status: insufficient
        reason: 检测准确率、误报率和模型更新方式均未披露，能否确定性交付“可信标记”无法核验。
        evidence_ids:
        - ev-6d3f6ce7a9afc4b9
        - ev-e89aec1fe2806952
      next_validation: 收集该扩展官方页面或仓库文档中关于检测准确率、误报率与模型来源的公开说明。
    event_summary_zh: 2026年11月中旬，开源浏览器扩展hikaku-extension公开，可在Chrome、Edge和Firefox中本地标记疑似AI生成的图片和视频；其仓库星数在数日内从约319升至约400后回落至396。
    event_summary_en: In mid-November 2026, the open-source browser extension hikaku-extension launched,
      flagging suspected AI-generated images and videos locally in Chrome, Edge and Firefox; its repository
      stars rose from about 319 to roughly 400 within days before easing to 396.
  hill-climb:
    slug: hill-climb
    name: Hill-Climb
    decision: watching
    event_summary_zh: 2026年11月2日发布的开源技能，为 Claude Code 与 Codex 增加“证明完成”环节：每次改动只有在锁定测试或基准分数变好时才被保留；仓库星标从11月12日的56增至11月21日的144。
    event_summary_en: 'An open-source skill released on 2 November 2026 that adds a ''prove done'' step
      to Claude Code and Codex: a change is kept only if a locked test or benchmark scores better; repository
      stars rose from 56 on 12 November to 144 on 21 November.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用编码代理的开发者让代理修改代码后，需要判断这次改动是否真的让测试或基准变好，以决定保留还是回退
    jobs_en:
    - Developers using coding agents need to judge whether an agent's code change actually improved a
      test or benchmark, in order to keep or revert it
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 或 Codex 的开发者让代理改完代码后，Hill-Climb 接收这次改动，用预先锁定的测试或基准打分，只有分数变好才保留，否则回退；用户拿到的是被测试门槛筛过的代码版本，测试本身是否可靠仍需人工设定和确认。
    inspiration: 趋势：编码代理开始被要求对“完成”负责，而不是只交出一段看似合理的代码。切入：从对交付质量有硬指标的团队进入，例如有回归测试套件的后端团队或需要基准不倒退的算法团队，把“改动必须过锁定测试”做成可审计的提交门槛；具体卖法未披露。
    summary_en: After a developer lets Claude Code or Codex change code, Hill-Climb takes that change,
      scores it against a pre-locked test or benchmark, and keeps it only if the score improves, otherwise
      reverting it; the user gets a code version filtered by a test gate, while whether the test itself
      is trustworthy still needs human setup and confirmation.
    inspiration_en: 'Trend: coding agents are being asked to answer for ''done'', not just produce plausible
      code. Entry: start with teams that have hard quality metrics, such as backend teams with regression
      suites or algorithm teams whose benchmarks must not regress, and make ''a change must pass a locked
      test'' an auditable commit gate; the pricing model is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者让代理修改代码后，需要判断这次改动是否真的让测试或基准变好，以决定保留还是回退。
        job_en: Developers using coding agents need to judge whether an agent's code change actually improved
          a test or benchmark, in order to keep or revert it.
        pain_zh: 编码代理常声称任务完成，但改动可能让测试变差或基准倒退，开发者要逐次人工复核，负担重且容易漏掉回归。
        pain_en: Coding agents often claim a task is done while the change may worsen tests or regress
          benchmarks, forcing developers to review each change manually, which is heavy and easy to miss
          regressions.
        current_alternative_zh: 开发者手动运行测试、对比基准结果，或凭阅读代码判断是否保留改动。
        current_alternative_en: Developers manually run tests, compare benchmark results, or judge by
          reading the code whether to keep a change.
        usage_reason_zh: 相较手动跑测试再逐条比对，Hill-Climb 在每次改动后自动用锁定测试或基准打分，分数不变好就回退，省去开发者逐次判断是否回归的一步；推断，有回归测试套件的团队会在代理频繁改代码时选择它。
        usage_reason_en: Compared with manually running tests and comparing results, Hill-Climb automatically
          scores each change against a locked test or benchmark and reverts it when the score does not
          improve, removing the step of judging regressions change by change; this is an inference, and
          teams with regression suites would choose it when agents change code frequently.
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理声称完成但改动可能让测试或基准倒退的问题，痛点具体，回退动作可核对。
        evidence_ids:
        - ev-f257c0bd23f6314e
        - ev-588a1d38638926b0
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标增长，缺少用户反馈或团队采用案例，无法判断是否进入日常工作流。
        evidence_ids:
        - ev-588a1d38638926b0
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，这是判断而非已验证事实。
        evidence_ids:
        - ev-f257c0bd23f6314e
      - gate: truth
        status: insufficient
        reason: 锁定测试本身是否可靠、能否防作弊尚未核验，交付确定性取决于测试质量。
        evidence_ids:
        - ev-f257c0bd23f6314e
      next_validation: 收集仓库 issue 与 discussion，查看使用者是否报告测试锁定与回退在真实项目中生效。
