    inspiration: 趋势：家庭看护这类原本依赖专用硬件的场景，正被“人人已有的手机 + 软件”重新拆解，硬件门槛被绕开。切入：从新生儿家庭和临时看护场景进入，卖点应是夜间看护的可靠性与隐私，而不是通用摄像头；可考虑按月订阅或与月嫂、月子中心合作分发，价格未披露，不得编造。
    summary_en: New parents open two phones at night or when briefly away from the nursery, using one
      as a camera pointed at the baby and the other to watch, instead of buying a dedicated baby monitor.
      The candidate material only states 'turn two phones into a baby monitor'; what the AI receives,
      what actions it performs, and whether it delivers cry detection or anomaly alerts are unstated,
      so the concrete workflow and deliverable remain to be verified.
    inspiration_en: 'Trend: home caregiving scenarios that once depended on dedicated hardware are being
      unbundled by ''phones people already own plus software'', bypassing the hardware barrier. Entry:
      start with newborn families and temporary caregiving, selling reliability and privacy of night-time
      monitoring rather than a generic camera; consider monthly subscription or distribution via maternity-care
      services, with no disclosed pricing invented.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 新手父母在夜间或短暂离开婴儿房时，需要持续看到和听到婴儿状态，用两部手机分别充当摄像头和查看端完成看护。
        job_en: New parents need to keep seeing and hearing the baby at night or when briefly away from
          the nursery, using two phones as camera and viewer to complete caregiving.
        pain_zh: 专用婴儿监视器要额外购买和布线，临时看护或外出时又未必带得走；家长在夜里需要随时确认婴儿是否安好，不看的代价是错过异常。
        pain_en: Dedicated baby monitors require extra purchase and wiring and are not portable for temporary
          care or travel; parents need to confirm the baby is fine at night, and the cost of not checking
          is missing an anomaly.
        current_alternative_zh: 购买专用婴儿监视器，或直接用手机视频通话、开着摄像头 App 让另一台设备看画面。
        current_alternative_en: Buying a dedicated baby monitor, or simply using a phone video call or
          a camera app so another device can watch the feed.
        usage_reason_zh: 推断：相较买专用硬件，它把已有的两部手机直接变成摄像头和查看端，省去采购与布线的步骤，因此临时看护、旅行或预算敏感的新手父母会在需要快速搭起看护时选择它；但材料未说明
          AI 具体做了什么，也未提供留存或复购证据。
        usage_reason_en: 'Inference: versus buying dedicated hardware, it turns two existing phones directly
          into camera and viewer, removing the purchase and wiring step, so temporary caregivers, travelers,
          or budget-sensitive new parents would choose it when they need to set up monitoring quickly;
          however, the material does not state what the AI specifically does, nor provide retention or
          repeat-use evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决夜间或临时看护时持续查看婴儿的需求，痛点是专用监视器要额外购买且不便携；旧替代是买硬件或开视频通话，结构上成立，但 AI 具体动作未说明。
        evidence_ids:
        - ev-6af84ec0baee4b79
      - gate: consensus
        status: insufficient
        reason: 只有一句产品描述，没有用户评价、采用规模或社区讨论，无法判断家长是否真的会从专用监视器转过来。
        evidence_ids:
        - ev-6af84ec0baee4b79
      - gate: model
        status: insufficient
        reason: 未披露定价与付费方式，买方可能是家庭订阅或与看护机构合作，这是判断而非已验证事实。
        evidence_ids:
        - ev-6af84ec0baee4b79
      - gate: truth
        status: insufficient
        reason: 未说明隐私与安全边界、画面是否上传、AI 是否做哭声或异常识别，交付确定性无法核对。
        evidence_ids:
        - ev-6af84ec0baee4b79
      next_validation: 收集该产品官方页面或应用商店说明，核对其是否披露 AI 识别能力、隐私处理方式与定价。
  backendskills:
    slug: backendskills
    name: backendskills
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 后端开发者用 Claude Code、Codex 或 Cursor 生成后端代码后，需要检查并修正演示能跑、上线却出错的实现
    jobs_en:
    - Backend developers reviewing and fixing AI-generated backend code that works in demos but fails
      in production, using Claude Code, Codex or Cursor
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 后端开发者用 Claude Code、Codex 或 Cursor 生成后端代码时，在提交前打开这套技能规则，让编码代理按其中的后端约束检查并改写实现。作者自述的对比是：未加载时
      150 次运行出现 25 次关键错误，加载后为 2 次；用户拿到的是被约束过的代码改动，仍需自己复核。具体覆盖哪些后端错误类型与交付形式仍待核验。
    inspiration: 趋势是编码代理的瓶颈从“能不能写出代码”转向“写出的代码能不能上线”，约束与检查正从模型能力里被拆成独立供给。切入可放在给外包团队或小型 SaaS 团队卖按项目验收的后端代码审查规则包，而不是再做一个编码助手；作者自述的
      25/150 与 2/150 对比尚未见第三方复现。
    summary_en: When backend developers generate backend code with Claude Code, Codex or Cursor, they
      load this set of skill rules before committing so the coding agent checks and rewrites the implementation
      against backend constraints. The author reports 25 critical mistakes in 150 runs without it versus
      2 with it; users get constrained code changes and still review them. Which backend error classes
      are covered and the delivery format still need verification.
    inspiration_en: The trend is that the bottleneck for coding agents is shifting from whether code can
      be written to whether it can ship, so constraints and checks are being split out as standalone supply.
      The entry point is selling project-accepted backend code review rule packs to outsourcing teams
      or small SaaS teams, not another coding assistant; the author's 25/150 versus 2/150 claim has no
      third-party replication yet.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 后端开发者用 Claude Code、Codex 或 Cursor 生成后端代码后，在合并前需要逐项检查鉴权、错误处理、并发等实现，避免演示能跑、上线出错。
        job_en: After generating backend code with Claude Code, Codex or Cursor, backend developers must
          check auth, error handling and concurrency before merging so demos that run do not break in
          production.
        pain_zh: AI 生成的后端代码常在演示中通过、在生产中暴露关键错误，开发者要花时间逐行排查，漏检的代价是线上故障。
        pain_en: AI-generated backend code often passes demos and exposes critical errors in production,
          forcing line-by-line review; a missed check becomes an outage.
        current_alternative_zh: 开发者靠人工代码评审、既有 linter 与测试，或反复向代理追加提示来约束输出。
        current_alternative_en: Developers rely on manual code review, existing linters and tests, or
          repeated follow-up prompts to the agent to constrain output.
        usage_reason_zh: 推断：相较每次重新写提示，这套规则把后端约束固化成代理可直接加载的检查项，在生成阶段就减少一类错误，因此频繁用编码代理写后端的开发者会在合并前加载它；作者自述的错误率对比尚无第三方复现。
        usage_reason_en: 'Inference: instead of rewriting prompts each time, the rules fix backend constraints
          as checks the agent can load, cutting one error class at generation time, so developers who
          often use coding agents for backend work would load it before merging; the author''s error-rate
          comparison has no third-party replication.'
      gates:
      - gate: value
        status: supported
        reason: 它解决 AI 生成后端代码演示能跑、上线出错的问题，痛点是线上故障，旧做法是人工逐行评审；作者自述的错误率对比支持结构成立，但未经第三方复现。
        evidence_ids:
        - ev-5b657ae7617718a6
        - ev-1a4815a2c1cad9e2
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 43 缓慢增至 61，属关注度而非采用证据；没有 issue、讨论或用户反馈说明开发者已把它放进日常流程。
        evidence_ids:
        - ev-5b657ae7617718a6
        - ev-1a4815a2c1cad9e2
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价或付费路径；可能的买方是使用编码代理的团队，但这是判断，不是已验证事实。
        evidence_ids:
        - ev-1a4815a2c1cad9e2
      - gate: truth
        status: insufficient
        reason: 25/150 与 2/150 的对比来自作者自述，未见测试方法、错误类型清单或独立复现，交付是否确定仍缺一环。
        evidence_ids:
        - ev-5b657ae7617718a6
      next_validation: 收集该仓库 README 或 issue 中公开的测试方法、覆盖的错误类型清单，以及是否有第三方复现其 25/150 与 2/150 对比的记录。
