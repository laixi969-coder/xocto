  agent-vscreen:
    slug: agent-vscreen
    name: agent-vscreen
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 移动应用开发
    - 自动化测试
    industries_en:
    - mobile app development
    - automated testing
    jobs:
    - 安卓自动化开发者或测试人员在需要让手机 agent 操作其他应用时，用后台虚拟屏运行任务，同时自己继续使用手机前台
    jobs_en:
    - Android automation developers or testers who need a phone agent to operate other apps run the task
      on a background virtual display while continuing to use the phone foreground
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安卓自动化开发者或测试人员在需要让手机 agent 操作其他应用时，打开 agent-vscreen，它通过 Shizuku 在不可见的虚拟屏上运行 agent 对应用的操作，用户可继续使用手机前台；交付是后台执行的任务结果，具体流程与稳定性仍待核验。
    inspiration: 趋势：手机 agent 开始需要“不占用用户屏幕”的执行环境，后台副屏把 agent 操作与人的使用解耦。切入：从安卓自动化测试、批量应用操作这类已有旧流程的团队进入，按设备或任务量卖托管执行环境，而非只做开源库。
    summary_en: Android automation developers or testers who need a phone agent to operate other apps
      open agent-vscreen; it uses Shizuku to run the agent's app operations on an invisible virtual display
      while the user keeps using the phone foreground. The deliverable is the background task result;
      the concrete workflow and stability still need verification.
    inspiration_en: 'Trend: phone agents increasingly need an execution environment that does not occupy
      the user''s screen, decoupling agent operation from human use. Entry: start with Android automated
      testing and batch app-operation teams that already have an old workflow, selling hosted execution
      per device or task volume rather than only an open-source library.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安卓自动化开发者或测试人员要让手机 agent 操作其他应用，同时不希望占用自己正在用的手机前台。
        job_en: Android automation developers or testers want a phone agent to operate other apps without
          occupying the phone foreground they are using.
        pain_zh: 手机 agent 直接操作会抢占屏幕，人机无法同时使用同一台设备，自动化任务与日常使用互相打断。
        pain_en: A phone agent operating directly seizes the screen, so human and agent cannot use the
          same device at once, and automation tasks interrupt daily use.
        current_alternative_zh: 旧做法是准备多台真机或模拟器，或等用户不用手机时再跑任务。
        current_alternative_en: The old approach is to prepare multiple physical devices or emulators,
          or run tasks only when the user is not using the phone.
        usage_reason_zh: 推断：它通过 Shizuku 在不可见虚拟屏上运行 agent 操作，省去额外备机和等待空闲这一步，因此需要并行使用手机与跑自动化的开发者会选它；持续使用证据尚缺。
        usage_reason_en: 'Inference: it runs agent operations on an invisible virtual display via Shizuku,
          removing the step of provisioning extra devices or waiting for idle time, so developers who
          need to use the phone and run automation in parallel would choose it; evidence of sustained
          use is still missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决手机 agent 抢占屏幕、人机不能同时用一台设备的问题，旧做法是备多机或等空闲，痛点具体。
        evidence_ids:
        - ev-dcb5f2c0094fdf98
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数从 86 增至 156 的关注度信号，缺少用户评价或采用案例说明真实使用。
        evidence_ids:
        - ev-dcb5f2c0094fdf98
        - ev-31de0204c9f20c89
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方或商业模式，买方与收费路径是判断而非已验证事实。
        evidence_ids:
        - ev-31de0204c9f20c89
      - gate: truth
        status: insufficient
        reason: 依赖 Shizuku 与安卓权限边界，交付稳定性和安全边界缺少公开实测材料。
        evidence_ids:
        - ev-dcb5f2c0094fdf98
      next_validation: 收集该仓库 issue/discussion 中关于实际部署、稳定性与使用场景的公开讨论。
    event_summary_zh: 2026-11-07 发布 agent-vscreen，一个通过 Shizuku 在不可见虚拟屏上运行安卓 AI agent 操作的开源工具，仓库星数在 11
      月 16 日至 21 日间从 86 增至 156。
    event_summary_en: On 2026-11-07 agent-vscreen was released, an open-source tool that runs Android
      AI agent operations on an invisible virtual display via Shizuku; repository stars rose from 86 to
      156 between 2026-11-16 and 2026-11-21.
  artificialanalysis:
    slug: artificialanalysis
    name: Artificial Analysis
    decision: queued
    event_summary_zh: 2026年10月28日，Artificial Analysis 发布 Intelligence Index v5；10月29日 Gemini 4 Carbon
      在该指数上登顶，11月9日 Claude Fable 5.2 以 65 分成为该指数迄今最高分。
    event_summary_en: On 28 October 2026 Artificial Analysis released Intelligence Index v5; on 29 October
      Gemini 4 Carbon took the top spot on that index, and on 9 November Claude Fable 5.2 scored 65, the
      highest so far on the index.
    category: 基础层
    project_type: new_application
    industries:
    - 软件与信息服务
    - 企业采购与合规
    industries_en:
    - Software and IT services
    - Enterprise procurement and compliance
    jobs:
    - 模型选型负责人需要在多个候选大模型之间做采购或上线决策时，依据统一指数与分项评测对比能力与成本，形成可向团队解释的选型结论
    - AI 产品团队在版本迭代前需要判断新模型是否值得切换时，查看同一套基准下的分数与价格对比，决定是否迁移
    jobs_en:
    - A model-selection owner comparing candidate large models for procurement or launch decisions uses
      a unified index and sub-scores to compare capability and cost and produce an explainable selection
      conclusion
    - An AI product team deciding whether to switch models before a release checks scores and price comparisons
      under the same benchmark to decide on migration
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 模型选型负责人或 AI 产品团队在比较多个大模型、决定采购或切换时，打开 Artificial Analysis 查看统一指数与分项评测；平台接收各家模型的评测结果并汇总成排名与对比，用户拿到可引用的分数和位次，但具体评测方法与商业交付方式仍待核验。
    inspiration: 趋势：模型数量与版本迭代速度已让“选哪个模型”本身成为一项持续工作，第三方评测正从媒体内容变成采购依据。切入：面向需要向管理层解释选型理由的企业 AI 团队，做可复现的私有任务集评测与选型报告，按次或按项目收费；不与公开榜单比覆盖面，而是比贴合自身业务的可解释性。
    summary_en: When a model-selection owner or AI product team compares several large models before a
      purchase or switch, they open Artificial Analysis to view a unified index and sub-scores; the platform
      aggregates evaluation results across vendors into rankings and comparisons, and the user gets citable
      scores and positions, though the exact evaluation method and commercial delivery still need verification.
    inspiration_en: 'Trend: the number of models and the pace of version releases have made ''which model
      to pick'' a recurring job, and third-party evaluation is shifting from media content to procurement
      input. Entry: serve enterprise AI teams that must justify model choices to management with reproducible
      private-task-set evaluations and selection reports, priced per run or per project; compete on explainability
      for the buyer''s own business rather than on leaderboard coverage.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 模型选型负责人或 AI 产品团队在采购、上线或版本切换前，需要对比多个大模型的能力与价格，形成可向团队解释的选型结论。
        job_en: A model-selection owner or AI product team needs to compare capability and price across
          several large models before procurement, launch or a version switch, and produce an explainable
          selection conclusion.
        pain_zh: 模型版本密集发布、厂商自报数据口径不一，选型者缺少统一可比的第三方分数，容易凭印象或单一演示做决定。
        pain_en: Models ship frequently and vendor-reported numbers use inconsistent methods, so selectors
          lack unified comparable third-party scores and tend to decide on impressions or a single demo.
        current_alternative_zh: 阅读厂商发布博客、自行跑小样本测试、参考同行口碑或媒体评测文章。
        current_alternative_en: Reading vendor launch blogs, running small self-built tests, relying on
          peer word of mouth or media evaluation articles.
        usage_reason_zh: 相较自行拼凑厂商数据，它把多家模型放在同一指数与分项下对比，减少选型者逐家核对口径的步骤；推断需要向管理层解释选型理由的团队会因此选用，但公开材料未显示其被长期留在采购流程中的证据。
        usage_reason_en: Compared with assembling vendor numbers by hand, it places multiple models under
          one index and sub-scores, cutting the step of reconciling each vendor's methodology; by inference,
          teams that must justify choices to management would pick it, though public material does not
          show it being retained in procurement workflows.
      gates:
      - gate: value
        status: supported
        reason: 它解决模型选型时缺少统一可比分数的问题，痛点是版本密集发布下选型者难以向团队解释依据；买方可能是企业 AI 团队，公开材料未核验。
        evidence_ids:
        - ev-f21ad2839c01ec8f
        - ev-08610498cc06a990
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度较高，但公开材料未显示企业采购方已把它作为标准依据，共识卡在场景落地一环。
        evidence_ids:
        - ev-08610498cc06a990
      - gate: model
        status: insufficient
        reason: 未读到定价页或付费路径，钱可能来自企业订阅或报告服务，这是判断而非已验证事实。
        evidence_ids:
        - ev-f21ad2839c01ec8f
      - gate: truth
        status: insufficient
        reason: 评测方法是否可复现、能否确定性交付选型结论尚未核验，存在第三方评测被厂商反向优化的风险。
        evidence_ids:
        - ev-08610498cc06a990
      next_validation: 收集 Artificial Analysis 官方定价或企业服务页面，确认其是否提供付费的定制评测或选型报告。
