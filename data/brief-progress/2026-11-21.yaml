        - ev-aab811d8fd67789b
      - gate: model
        status: insufficient
        reason: 标注免费使用，未见定价、付费路径或买方信息，商业化方式不明。
        evidence_ids:
        - ev-18b8768ca7515825
      - gate: truth
        status: insufficient
