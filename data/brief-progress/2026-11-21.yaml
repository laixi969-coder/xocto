    summary_en: Developers or technical users open this open-source project when they need an AI to call
      multiple tools and complete multi-step operations inside an isolated environment; the agent executes
      tool calls in a sandbox and returns the results. Which tasks it targets, the deliverable format
      and where humans confirm remain to be verified.
