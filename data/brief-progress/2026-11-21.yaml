    open_source: true
    summary_zh: 丹麦家庭在每周线上采购时打开它：对话助手通过这个开源服务在 nemlig.com、BilkaToGo、Rema1000 三家超市检索商品、比价并把商品加入购物车，用户自己完成确认与付款，最终拿到一份待下单的购物车和价格对比。目前只覆盖丹麦市场，具体交付流程仍待核验。
    inspiration: 趋势：日常采购的比价与加购正被拆成可由助手调用的接口，而不是又一个购物 App。切入：从丹麦这类线上杂货渗透高、多连锁并存的市场进入，先做跨店比价与凑单，再向订阅制家庭采购清单或按成交抽佣演进；价格未披露，属推断。
    summary_en: 'A Danish household opens it before the weekly online grocery run: a chat assistant uses
      this open-source server to search items, compare prices and fill carts across nemlig.com, BilkaToGo
      and Rema1000, while the person confirms and pays, ending with a ready-to-order cart and price comparison.
      It covers only Denmark so far, and the exact delivery flow still needs verification.'
    inspiration_en: 'Trend: routine grocery price-checking and cart-filling is being exposed as an interface
      an assistant can call, not another shopping app. Entry: start in markets like Denmark where online
      groceries are common and several chains compete, do cross-store price comparison and basket building
      first, then move toward subscription shopping lists or per-order commission; pricing is undisclosed
      and this is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 丹麦家庭在每周采购前，让对话助手在多家线上超市检索同一商品、比较价格并把选定商品加入购物车，本人确认后付款。
        job_en: Before the weekly grocery run, a Danish household has a chat assistant search the same
          item across several online supermarkets, compare prices and fill the cart, then confirms and
          pays itself.
        pain_zh: 同一件杂货分散在多家连锁，逐店打开网页比价、重复加购费时，且容易漏掉更便宜的选项。
        pain_en: The same grocery item is spread across several chains, so opening each site to compare
          and re-adding items is slow and easily misses cheaper options.
        current_alternative_zh: 用户手动在 nemlig.com、BilkaToGo、Rema1000 等网站或 App 之间切换，逐个搜索、记价、分别加购。
        current_alternative_en: Users manually switch between nemlig.com, BilkaToGo, Rema1000 and similar
          sites or apps, searching, noting prices and adding items one by one.
        usage_reason_zh: 相较逐店手动比价，该服务让助手一次性跨店检索并直接写入购物车，省去重复搜索与加购这一步；付款仍由本人完成，因此适合在意价格、常做多店采购的丹麦家庭。此为基于功能的推断。
        usage_reason_en: Compared with manual per-store comparison, the server lets an assistant search
