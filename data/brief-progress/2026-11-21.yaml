        evidence_ids:
        - ev-c320cb5354d7f9fa
      - gate: truth
        status: insufficient
        reason: 候选未说明 AI 在其中的具体作用，无法确认它是 AI 改造还是纯性能分析工具，交付确定性也待核验。
        evidence_ids:
        - ev-c320cb5354d7f9fa
      next_validation: 收集 What The Fork 官方产品页与定价页，确认完整版价格、AI 在构建诊断中的具体作用及是否有客户案例。
  devvm:
    slug: devvm
