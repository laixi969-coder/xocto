    name: AI router supply chain
    decision: market_context
    summary_zh: 2026年11月，研究者通过向 AI 路由服务网络植入 200 万个数字诱饵，发现经由 OpenRouter、Vercel 等 AI 网关转发的请求会大量泄露 AWS 密钥、SSH
      密码等敏感数据。这意味着依赖第三方路由来降低推理成本的 AI 应用面临额外的数据安全与合规成本，企业采用时需重新评估网关环节的信任边界（推断）。
    summary_en: In November 2026, researchers planted 2 million digital tripwires across a network of
      AI routing services and found that requests forwarded through AI gateways such as OpenRouter and
      Vercel leaked sensitive data including AWS keys and SSH passwords at scale. This implies that AI
      applications relying on third-party routers to lower inference costs face added data-security and
      compliance burdens, and adopters must reassess trust boundaries at the gateway layer (inference).
    event_summary_zh: 研究者向 AI 服务链植入 200 万个数字诱饵，发现经 AI 路由网关转发的请求会大规模泄露 AWS 密钥、SSH 密码等敏感信息。
    event_summary_en: Researchers planted 2 million digital tripwires in the AI service chain and found
      that requests routed through AI gateways leaked sensitive information such as AWS keys and SSH passwords
      at scale.
