        status: insufficient
        reason: 开源项目，未披露定价、买方或收费方式；是否面向团队付费属判断而非已验证事实。
        evidence_ids:
        - ev-899bc11881a598cc
      - gate: truth
        status: insufficient
        reason: 无法核对它接入哪些编码代理、完成状态是否可信、人工确认边界在哪，交付确定性未明。
