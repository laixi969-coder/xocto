  resend:
    slug: resend
    name: Resend
    decision: queued
    event_summary_zh: Resend 入选 Madrona 2026 年 Intelligent Applications 40 早期阶段名单；另有一段 2026 年 11 月的播客讨论称，在一项
      AEO 研究中，Claude Code 在可提取的 102 次邮件推荐里有 64 次首选 Resend，而 SendGrid 仅 7 次首选、55 次作为备选出现。
    event_summary_en: Resend was named to Madrona's 2026 Intelligent Applications 40 (Early stage); a
      November 2026 podcast discussion also reports that in one AEO study Claude Code picked Resend first
      in 64 of 102 extractable email recommendations, while SendGrid was first only 7 times and appeared
      as an alternative 55 times.
    category: AI + 开发
    project_type: new_application
    industries:
    - 软件开发
    - 互联网服务
    industries_en:
    - software development
    - internet services
    jobs:
    - 开发者在为应用接入事务性邮件时，让编码代理生成发信代码并选择邮件服务商，需要拿到可运行的集成方案
    jobs_en:
    - Developers wiring transactional email into an app ask a coding agent to generate sending code and
      pick an email provider, and need a runnable integration
    regions:
    - 全球
    regions_en:
    - global
    open_source: false
    summary_zh: 开发者在应用里接入注册确认、密码重置等事务性邮件时，把需求交给编码代理，代理会直接生成调用某家邮件 API 的代码。Resend 提供发信 API 与集成文档，用户最终拿到可运行的发送代码和投递结果；具体定价与人工确认环节仍待核验。
    inspiration: 趋势是编码代理开始替开发者做技术选型，被代理默认推荐的供应商会先拿到集成机会。切入可放在“让代理读懂并优先选用”的文档与示例层，面向 API 类基础设施厂商提供可被代理检索和复现的接入材料，卖法未披露。
    summary_en: When developers add signup confirmation or password reset email to an app, they hand the
      task to a coding agent, which writes code calling a specific email API. Resend offers a sending
      API and integration docs, so the user gets runnable sending code and delivery results; pricing and
      human review steps still need verification.
    inspiration_en: The trend is coding agents making technology choices for developers, so providers
      an agent recommends by default get the integration first. The opening is documentation and examples
      that agents can read and prefer, sold to API infrastructure vendors as agent-retrievable integration
      material; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在应用需要发送注册确认、密码重置等事务性邮件时，让编码代理生成集成代码并选定邮件服务商，要拿到能直接运行的发送方案。
        job_en: When an app needs transactional email such as signup confirmation or password reset, developers
          ask a coding agent to generate integration code and choose a provider, aiming for a directly
          runnable sending setup.
        pain_zh: 邮件服务商众多，开发者要自行比较 API、文档与投递表现；代理若选错，后续替换要改代码和配置，返工成本落在开发者身上。
        pain_en: There are many email providers and developers must compare APIs, docs and deliverability
          themselves; if the agent picks wrong, switching later means changing code and configuration,
          and the rework falls on the developer.
        current_alternative_zh: 旧做法是开发者自己搜索比较 SendGrid、Postmark 等服务商，读文档手写集成，或沿用公司已有的邮件服务。
        current_alternative_en: The old way is for developers to search and compare providers like SendGrid
          or Postmark, read docs and hand-write the integration, or reuse the company's existing email
          service.
        usage_reason_zh: 推断：Resend 的文档与示例若能被编码代理直接检索并生成可运行代码，就省去开发者逐个比较服务商和手写接入这一步；当开发者把选型交给代理并接受生成的补丁时，会倾向沿用代理首选的供应商。
        usage_reason_en: 'Inference: if Resend''s docs and examples are directly retrievable by coding
          agents and yield runnable code, developers skip comparing providers one by one and hand-writing
          the integration; when they delegate selection to the agent and accept the patch, they tend to
          stay with the agent''s first choice.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者接入事务性邮件时要比较服务商并手写集成的问题，旧流程和返工代价清楚；买方是使用该 API 的开发团队。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: consensus
        status: insufficient
        reason: 只有一项 AEO 研究的转述和播客讨论，缺少开发者实际采用、留存或客户案例的公开证据。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
        - ev-9b623a318120e7c8
      - gate: model
        status: insufficient
        reason: 公开材料未给出定价与付费方式，按用量收费还是订阅制无法核验，买方付费路径只能推断。
        evidence_ids:
        - ev-9b623a318120e7c8
      - gate: truth
        status: supported
        reason: 邮件发送是应用上线必经环节，交付是确定可核对的投递结果；代理推荐只是入口，不改变任务刚性。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      next_validation: 收集 Resend 官方定价页，核验其按量或订阅的收费结构与是否披露客户案例。
