        pain_zh: 上市前调研周期长、数据分散，判断依赖人工整合；此为对市场研究旧流程的推断，材料未直接说明痛点。
        pain_en: Pre-launch research is slow and data is fragmented, with judgment relying on manual synthesis;
          this is an inference about the old research workflow, not stated in the material.
        current_alternative_zh: 委托市场研究机构做人工调研与报告，或内部团队手工汇总数据。
        current_alternative_en: Commissioning a research firm for manual studies and reports, or internal
          teams manually aggregating data.
        usage_reason_zh: 推断：若产品能把分散的消费者洞察数据自动汇总为上市判断，可省去人工整合这一步；但材料只有标题，无法确认具体动作与交付，选择动机缺少事实支持。
        usage_reason_en: 'Inference: if the product automatically aggregates fragmented consumer insight
          into a launch judgment, it removes the manual synthesis step; but only a headline exists, so
          the concrete action and deliverable cannot be confirmed and motivation lacks factual support.'
      gates:
      - gate: value
        status: insufficient
        reason: 它可能解决上市前调研数据分散、判断依赖人工整合的问题，但材料只有标题，无法确认具体任务与交付。
        evidence_ids:
        - ev-3d652279f7f1c8f9
      - gate: consensus
        status: insufficient
        reason: 未进入：无用户采用、评价或客户案例证据。
        evidence_ids:
        - ev-3d652279f7f1c8f9
      - gate: model
        status: insufficient
        reason: 未进入：未披露定价与买方，无法判断付费路径。
        evidence_ids:
        - ev-3d652279f7f1c8f9
      - gate: truth
        status: insufficient
        reason: 未进入：无法核验其分析是否贴近上市决策的第一性目标。
        evidence_ids:
        - ev-3d652279f7f1c8f9
      next_validation: 收集 Kantar 或 Quilt.AI 官方页面关于 LaunchSignals 的产品说明与定价，核验其输入材料与交付形式。
