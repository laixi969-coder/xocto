        pain_en: Going from idea to finished piece requires switching among several tools, with script,
          cover, illustrations and shot list made separately, so preparing one piece is slow and often
          stalls mid-way.
        current_alternative_zh: 用通用聊天助手写脚本，再用设计或绘图工具做封面配图，分镜靠手写或表格整理。
        current_alternative_en: Writing scripts with a general chat assistant, making covers and images
          in design or drawing tools, and organizing shot lists by hand or in spreadsheets.
        usage_reason_zh: 推断：它把灵感记录到脚本、封面、配图、分镜的多个步骤收进同一工作台，减少在工具间搬运素材和重复描述需求的那一步，因此需要批量产出短视频素材的创作者会尝试它；尚无留存或复购证据。
