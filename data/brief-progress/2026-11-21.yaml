    summary_zh: 用户浏览网页时，浏览器扩展在本地对页面中的图片和视频做AI生成检测并给出标记，无需上传素材。用户拿到的是逐张素材的疑似AI生成提示，最终是否采信仍需人工判断；检测准确率与误报情况在现有材料中未披露。
    inspiration: 趋势：AI生成内容泛滥让“素材真伪”成为浏览环节的新判断负担，检测正从专业工具下沉到日常浏览。切入：可从新闻编辑室、事实核查机构或二手交易平台的素材审核环节进入，按核查量或机构订阅收费；面向普通用户的免费扩展难以直接变现，需先证明检测准确率。
    summary_en: While browsing, the extension runs on-device detection on images and videos in the page
      and flags suspected AI-generated material without uploading it. Users get per-asset suspicion markers
      and still decide themselves whether to trust the content; detection accuracy and false-positive
      rates are not disclosed in the available material.
    inspiration_en: 'Trend: the flood of AI-generated media turns ''is this asset real'' into a routine
      judgment burden at the browsing step, pushing detection from specialist tools into everyday workflows.
      Entry: start with newsrooms, fact-checking desks or marketplace content review, charging per check
      or by institutional subscription; a free consumer extension has no clear revenue path until accuracy
      is demonstrated.'
    req_initial:
