      signal_level: 初步成立
      demand_read:
        job_zh: 在 Windows 上使用 DeepSeek Harness 的运营或客服人员，在需要处理微信渠道工单时，把请求交给多智能体编排，按策略自动受理并记录到工单板。
        job_en: Operations or support staff using DeepSeek Harness on Windows hand WeChat-channel requests
          to multi-agent orchestration that auto-accepts per policy and logs to a ticket board.
        pain_zh: 微信渠道的工单受理依赖人工逐条查看与分派，重复且易漏，缺少策略化自动受理。
