  depth-pro-2-sharp-and-temporally-consistent-metric-monocular:
    slug: depth-pro-2-sharp-and-temporally-consistent-metric-monocular
    name: Depth Pro 2
    decision: market_context
    event_summary_zh: 苹果于2026年11月20日发布Depth Pro 2研究，称其单一网络可同时处理图像与视频，在原生分辨率下输出度量准确、边界锐利且时间一致的深度图，并声称优于此前方法。这是模型层面的研究发布，不是独立应用；对AI应用的含义是：视频与图像的单目深度估计在一致性与锐度上的取舍被压缩，依赖深度输入的三维重建、视频后期与空间内容工具可减少逐帧修补环节（推断）。
    event_summary_en: On 2026-11-20 Apple published Depth Pro 2 research, describing a single network
      that handles both images and video and predicts metrically accurate, sharp and temporally consistent
      depth maps at native resolution, claiming to outperform prior methods. This is a model-level research
      release, not a standalone application; for AI applications it means the trade-off between temporal
      consistency and boundary sharpness in monocular depth is narrowed, so 3D reconstruction, video post-production
      and spatial content tools that depend on depth input may need less per-frame cleanup (inference).
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是苹果发布的一项单目深度估计研究：输入普通图像或视频，模型在原生分辨率下直接输出度量准确的深度图，并同时兼顾边界锐度与帧间时间一致性。它本身不是面向终端用户的产品，具体应用流程与交付仍待核验。
    inspiration: 趋势：深度估计正从“单帧好看”转向“视频里也稳定”，这会把三维重建、视频后期和空间内容的前置处理成本压低。切入：可从需要逐帧修深度的视频后期或房产、家装的实景三维环节进入，卖按项目交付的成片或模型，而非卖模型本身。
    summary_en: 'This is Apple''s monocular depth estimation research: given ordinary images or video,
      the model outputs metrically accurate depth maps at native resolution while balancing boundary sharpness
      and frame-to-frame temporal consistency. It is not itself an end-user product, and the concrete
      application workflow and delivery remain to be verified.'
    inspiration_en: 'Trend: depth estimation is shifting from good single frames to stable video, which
      lowers the preprocessing cost for 3D reconstruction, video post-production and spatial content.
      Entry: start from video post-production or real-estate and interior walkthrough 3D capture that
      currently needs per-frame depth cleanup, selling delivered footage or models per project rather
      than the model itself.'
