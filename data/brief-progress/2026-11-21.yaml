        usage_reason_zh: 推断：它把启动、查看和切换代理会话从敲命令变成界面点击，减少记忆命令与翻找终端输出的步骤，因此偏好本地原生工具、又不想离开 pi 代理的开发者会在多会话并行时选择它；尚无用户反馈或留存证据支持这一动机。
        usage_reason_en: 'Inference: it turns launching, viewing and switching agent sessions from typed
