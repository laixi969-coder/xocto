          the candidate gives no onboarding cost or retention evidence, so the motive is not yet a fact.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决功能上线后判断采用情况的需求，痛点成立；但候选只有一句仓库描述，无法确认埋点接入、报表交付与旧流程替代的具体环节。
        evidence_ids:
        - ev-7e43b136aed823e2
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区提交与 5 个点数、0 条评论，没有产品团队采用或讨论证据，无法判断共识卡在哪一环。
        evidence_ids:
        - ev-7e43b136aed823e2
      - gate: model
        status: insufficient
        reason: 开源项目，付费方可能是自托管企业客户或托管服务订阅，但候选未披露任何定价、托管方案或商业主体，属判断而非事实。
        evidence_ids:
        - ev-7e43b136aed823e2
      - gate: truth
        status: insufficient
        reason: 无法核对埋点准确性、数据归属与人工确认边界；仓库描述过短，承诺能否确定性交付未知。
        evidence_ids:
        - ev-7e43b136aed823e2
      next_validation: 收集该仓库的 README 与部署文档，确认埋点接入方式、自托管要求与是否提供托管付费方案。
