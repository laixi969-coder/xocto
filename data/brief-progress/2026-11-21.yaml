  signal-is-blocking-gemini-and-siri-ai-from-reading-your-scre:
    slug: signal-is-blocking-gemini-and-siri-ai-from-reading-your-scre
    name: Signal
    decision: market_context
    event_summary_zh: 2026年11月20日，Signal 宣布在 Android 与 iOS 上限制截图，并允许 iOS 用户阻止 Siri 的 AI 扫描屏幕内容；其总裁 Meredith
      Whittaker 称操作系统内置的屏幕理解型 AI 代理正在削弱应用独立保证隐私的能力，并呼吁系统方给开发者提供控制代理可访问数据的工具。
    event_summary_en: On November 20, 2026, Signal said it is restricting screenshots on Android and iOS
      and letting iOS users block Siri's AI from scanning on-screen content; its president Meredith Whittaker
      said OS-level screen-reading AI agents are undermining apps' ability to independently guarantee
      privacy, and urged OS providers to give developers tools to control what agents can access.
    summary_zh: 这是一次平台政策层面的冲突：操作系统把屏幕理解型 AI 代理做进系统，而通讯应用只能靠限制截图来防守。对 AI 应用的含义是，屏幕上下文这类数据入口的可用性将由系统方与应用方的博弈决定，依赖读取他人应用界面的代理类产品面临被切断输入的风险，隐私敏感场景的交付确定性下降。
    summary_en: 'This is a platform-policy conflict: OS vendors are building screen-reading AI agents
      into the system, and messaging apps can only defend by restricting screenshots. For AI applications
      it means access to on-screen context will be decided by bargaining between OS and app makers; agent
      products that depend on reading other apps'' interfaces face losing their input, and delivery certainty
      drops in privacy-sensitive settings.'
    inspiration: 趋势是系统级 AI 代理开始争夺屏幕数据，应用方开始反向设防；切入不在做另一个隐私通讯工具，而在为应用开发者提供声明式控制代理可读范围的中间层，或为合规敏感行业提供可审计的屏幕数据访问记录。
    inspiration_en: The trend is OS-level AI agents competing for screen data while apps push back; the
      opening is not another private messenger but a declarative layer letting app developers bound what
      agents can read, or auditable screen-data access records for compliance-sensitive industries.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 不适用：这是平台政策事件，不是独立产品。
        job_en: 'Not applicable: a platform policy event, not a standalone product.'
        pain_zh: 不适用。
        pain_en: Not applicable.
        current_alternative_zh: 不适用。
        current_alternative_en: Not applicable.
        usage_reason_zh: 不适用。
        usage_reason_en: Not applicable.
      gates:
