      explainer film, they invoke this skill inside Claude Code, Codex, Cursor or Gemini CLI; it takes
      those materials, generates one continuous camera move in code and times the visuals to the voice,
      delivering a playable narrated short film, while final quality and the human review step remain
      unverified.
