    summary_zh: 研究团队对 Qwen3-8B 的每个神经元做映射分析并公开结果，面向关注模型内部结构与可解释性的研究者；是否提供可复用工具或服务、具体交付形式仍待核验。
    inspiration: 趋势是模型可解释性从论文走向逐神经元级别的工程化分析；切入可考虑为需要审计或压缩自有模型的团队提供可复现的神经元级诊断报告，但当前只有研究发布，尚无付费路径证据。
