  court:
    slug: court
    name: Court
    decision: market_context
    summary_zh: 2026年11月，美国一家法院裁定，警方不得以AI生成的“合理根据”作为搜查依据，因为这种做法不符合第四修正案的要求。这一裁决为执法部门使用AI辅助生成证据材料划定了法律边界，意味着面向公共部门的AI工具在合规审查和人工复核环节需要增加投入；该影响仅限执法取证场景，不能据此推断其他AI应用领域也出现同等监管转向。
    summary_en: In November 2026, a US court ruled that police may not rely on AI-generated 'probable
      cause' because doing so does not satisfy the Fourth Amendment. The ruling sets a legal boundary
      on law-enforcement use of AI to produce evidentiary material, implying that public-sector AI tools
      will need more compliance review and human verification; the effect is confined to law-enforcement
      evidence gathering and does not support a claim that other AI application areas face a comparable
      regulatory shift.
    event_summary_zh: 2026年11月19日，一家法院裁定第四修正案不允许警方使用AI生成的“合理根据”。
    event_summary_en: On November 19, 2026, a court ruled that the Fourth Amendment does not permit police
