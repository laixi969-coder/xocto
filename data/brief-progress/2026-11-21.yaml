        - ev-8bab2b8cf46081aa
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，钱可能来自团队订阅或托管服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-8bab2b8cf46081aa
      - gate: truth
        status: insufficient
        reason: 记录粒度、复盘是否真能改善助手表现均无公开验证，交付确定性待核验。
