    - 丹麦家庭在每周采购前，让对话助手通过该服务在多家线上超市检索同一商品、比较价格并把选定商品加入购物车，最后由本人确认下单付款
    jobs_en:
    - Danish households, before a weekly grocery run, let a chat assistant use this server to search the
      same item across several online supermarkets, compare prices and fill the cart, with the person
      confirming and paying at the end
