    summary_en: Developers of statically compiled C++/Rust/CMake projects open it when local builds slow
      down; the tool takes build-process data and shows per-stage compile time and file reads/writes to
      help locate the header, module or dependency slowing the build. The free tier shows detail for only
      about 10% of the process, and the full deliverable and human-confirmation flow still need verification.
    inspiration_en: 'Trend: build-performance diagnosis, once done by hand with logs and commented-out
      sections, is being packaged as a visual product. Entry: start with teams maintaining large hand-written
      C++/CMake codebases and charge per project or per diagnostic report rather than selling to all developers;
      the candidate does not specify AI''s role, so confirm whether this is a real AI transformation or
      a pure profiling tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: C++/CMake 开发者在本地构建变慢时，查看各编译环节耗时与文件读写，定位拖慢构建的头文件、模块或依赖。
        job_en: C++/CMake developers investigating a slow local build by inspecting per-stage compile
          time and file reads/writes to locate the header, module or dependency that slows it down.
        pain_zh: 大型静态编译项目构建慢，开发者只能靠加日志、逐段注释、反复重编来猜瓶颈，单次排查耗时长且打断开发节奏。
        pain_en: Large statically compiled projects build slowly, and developers can only guess bottlenecks
          by adding logs, commenting out sections and rebuilding repeatedly, which is slow and disrupts
          flow.
        current_alternative_zh: 手工加计时日志、逐段注释代码、用通用 profiler 或凭经验猜测依赖关系。
        current_en: Hand-added timing logs, commenting out code section by section, generic profilers,
