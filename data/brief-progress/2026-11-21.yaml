        - ev-2a64858cae3ef060
        - ev-8db66faf1d268dca
      - gate: consensus
        status: insufficient
        reason: 只有仓库星标缓慢增长，缺少用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-8db66faf1d268dca
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或商业交付路径，买方是判断不是事实。
        evidence_ids:
        - ev-2a64858cae3ef060
      - gate: truth
        status: supported
        reason: 交付物是一次性 Windows Sandbox，边界清楚；但测试结果是否自动回传、人工确认哪一步未说明，需核验。
