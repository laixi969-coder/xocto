        status: insufficient
        reason: 开源项目，公开材料未披露定价、买方或收费方式，钱从哪来无法核验。
        evidence_ids:
        - ev-b794e20a50c12aba
      - gate: truth
        status: insufficient
        reason: 贴近真实设备操作这一目标，但账号、支付与隐私安全边界及人工确认环节未见说明。
        evidence_ids:
        - ev-6d88af1fcbaa7745
      next_validation: 收集仓库 issue 与 discussion 中关于真实测试场景、失败案例与安全边界的公开讨论。
  profound:
