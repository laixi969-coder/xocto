        job_en: Solo developers or small teams running several AI coding agents need a desk display showing
          each agent's status, model quota and Mac health so they can decide when to switch or pause tasks.
        pain_zh: 多代理并行后，状态散落在多个终端窗口和网页后台，切换查看打断编码，配额耗尽或机器过热也不易及时察觉。
        pain_en: With parallel agents, status is scattered across terminal windows and web dashboards;
          switching to check interrupts coding, and quota exhaustion or machine overheating is easy to
