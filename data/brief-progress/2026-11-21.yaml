  github-28:
    slug: github-28
    name: Anti-Claude
    decision: watching
    event_summary_zh: 2026年11月20日，开发者在社区发帖介绍自制的免改包客户端改造工具 Anti-Claude，为某桌面端 AI 客户端增加工具调用前的流内进度说明、多阶段任务的
      TodoWrite 进度卡、上下文占用圆环和分层模型菜单。
    event_summary_en: On 2026-11-20, a developer posted a self-built, no-patch client customization tool
      called Anti-Claude, adding in-stream progress notes before tool calls, a TodoWrite progress card
      for multi-step tasks, a context-usage ring and a tiered model menu to a desktop AI client.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用桌面端 AI 编程客户端的开发者，在连续调用多个工具的长任务中，需要看清 Agent 查到哪一步、还剩多少上下文，以便决定是否干预或换模型
    jobs_en:
    - Developers using a desktop AI coding client who, during long multi-tool tasks, need to see which
      step the agent reached and how much context remains, to decide whether to intervene or switch models
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用桌面端 AI 编程客户端的开发者，在 Agent 连续调用十几个工具的长任务里打开它：它把原本折叠隐藏的推理与工具记录改成流内逐句汇报，并渲染随任务推进的进度卡和上下文占用圆环，让用户中途看到查到哪一步、上下文还剩多少；最终交付仍是原客户端的执行结果，具体安装与兼容范围仍待核验。
    inspiration: 趋势是 AI 编程客户端的交互体验正被用户自行改造，黑盒执行与上下文不可见成为新的摩擦点。切入可从重度使用 Agent 的独立开发者和小团队入手，做可观测性与会话治理的轻量外挂，卖法可考虑按团队订阅或随客户端版本维护收费，但价格未披露。
    summary_en: 'Developers using a desktop AI coding client open it during long tasks where the agent
      calls a dozen or more tools: it turns folded-away reasoning and tool logs into in-stream step-by-step
      notes, and renders a progress card plus a context-usage ring, so users can see which step was reached
      and how much context is left. The final output is still the client''s own execution result; installation
      and compatibility scope remain to be verified.'
    inspiration_en: The trend is that users are customizing the interaction layer of AI coding clients
      themselves, as black-box execution and invisible context become new friction. The entry point is
      heavy agent users among indie developers and small teams, selling lightweight observability and
      session-governance add-ons, possibly via team subscription or per-client-version maintenance, though
      no price is disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用桌面端 AI 编程客户端的开发者，在 Agent 连续调用多个工具的长任务中，需要判断它查到哪一步、上下文是否将满，以决定是否打断、补充信息或切换模型。
        job_en: Developers on a desktop AI coding client, during long multi-tool agent tasks, need to
          judge which step it reached and whether context is nearly full, to decide whether to interrupt,
          add information or switch models.
        pain_zh: 客户端默认把推理和工具记录折叠隐藏，连续调用十几个工具也不出声，跑完只留一个耗时外框，中途无法判断进展；上下文占用也不可见，容易在不知情时触顶。
        pain_en: The client folds away reasoning and tool logs by default, stays silent across a dozen
          tool calls and leaves only a duration frame at the end, so progress is unreadable mid-run; context
          usage is also invisible, so limits can be hit unknowingly.
        current_alternative_zh: 用户此前靠 Claude Desktop 和 Claude Code 的交互节奏，或手动展开折叠块、凭经验估算上下文，没有统一的进度与占用视图。
        current_alternative_en: Users previously relied on the interaction rhythm of Claude Desktop and
          Claude Code, or manually expanded folded blocks and estimated context by experience, with no
          unified progress or usage view.
        usage_reason_zh: 推断：相较手动展开折叠块和凭经验估算，它在每次工具调用前插入一两句进度说明、用随任务滚动的进度卡替代正文里的 Markdown 清单，并常驻显示上下文圆环，减少用户反复翻找和猜测的那一步，因此重度使用
          Agent 的开发者会在长任务中选择它。
        usage_reason_en: 'Inference: versus manually expanding folded blocks and guessing context, it
          inserts a one-line progress note before each tool call, replaces in-body Markdown checklists
          with a scrolling progress card, and keeps a context ring visible, removing the step of hunting
          and guessing, so heavy agent users would pick it for long tasks.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长任务中 Agent 执行黑盒、上下文不可见的问题，痛点具体且不解决的后果是可核对的中断判断失误；买方尚不清晰。
        evidence_ids:
        - ev-2873fbb1ce81d5cc
      - gate: consensus
        status: insufficient
        reason: 仅有一条社区发帖与少量评论，未见独立用户反馈或持续采用证据，强场景存在但共识未形成。
        evidence_ids:
        - ev-2873fbb1ce81d5cc
      - gate: model
        status: insufficient
        reason: 开源免改包工具，未见定价、赞助或商业交付路径，钱可能来自开发者个人或团队订阅，这是判断不是已验证事实。
        evidence_ids:
        - ev-2873fbb1ce81d5cc
      - gate: truth
        status: insufficient
        reason: 依赖特定客户端版本与全局协作规则，客户端更新可能使其失效，承诺能否确定性交付尚未核验。
        evidence_ids:
        - ev-2873fbb1ce81d5cc
      next_validation: 收集该仓库的 README、issue 与 release 记录，核验其支持的客户端版本、安装方式与用户反馈。
