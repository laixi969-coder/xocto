        usage_reason_zh: 推断：动效库以纯 JavaScript 且面向 AI 读取的方式组织，AI 助手可直接取用可运行片段，减少用户从教程复制、改参数、调兼容的步骤，因此需要快速给落地页加动效的前端和独立站运营者会在赶页面时选择它。
