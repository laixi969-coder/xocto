    summary_zh: 播客或直播运营者在长视频、直播结束后打开它，把整段素材交给自托管流程，由用户自带的 AI 密钥识别可剪的高光片段并生成短片；用户拿到的是可发布的剪辑结果，仍需人工确认片段取舍与成片。具体导出格式与人工复核环节仍待核验。
    inspiration: 趋势：长视频与直播的二次剪辑正从人工逐帧回看，转为由模型先定位高光再出片，且自托管、自带密钥的形态把成本压到用户自己的模型账单上。切入：从播客、赛事直播、知识类长视频的运营团队进入，卖“每条可发布短片”的结果而非席位；也可做面向
      MCN 的批量交付，价格未披露不臆测。
    summary_en: Podcast or live-stream operators open it after a long video or live session, hand the
      full footage to a self-hosted pipeline where their own AI key identifies highlight segments and
      produces short clips; the user gets publishable cuts but still confirms segment choice and final
      output. Export formats and the human review step remain to be verified.
    inspiration_en: 'Trend: re-clipping long video and live streams is shifting from manual frame-by-frame
      review to models locating highlights first, with self-hosting and bring-your-own-key pushing cost
      onto the user''s own model bill. Entry: start with podcast, sports live and knowledge long-video
      operations teams, selling per publishable clip rather than seats; batch delivery for MCNs is possible,
      price undisclosed and not assumed.'
    event_summary_zh: 2026-11-14 起，PeakCut 仓库公开，定位为长视频与直播的 AI 剪辑、自托管并自带 AI 密钥；此后一周仓库收藏数从 130 持续升至 1553，fork
      达 497，显示开源社区关注度快速上升。
    event_summary_en: Since 2026-11-14 the PeakCut repository has been public, positioned as AI clipping
      for long video and live streams, self-hosted with bring-your-own AI key; over the following week
      repository stars rose steadily from 130 to 1,553 with 497 forks, indicating fast-growing open-source
      attention.
