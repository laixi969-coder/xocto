        usage_reason_en: 'Inference: compared with hand-adding logs and bisecting sections, it visualizes
          per-stage build time and file reads/writes in one pass, removing repeated rebuilds and guesswork,
          so developers maintaining large hand-written C++/CMake codebases with frequent slow builds would
          choose it when diagnosing build bottlenecks.'
      gates:
