      indicating adoption of AI shopping agents is constrained by a trust gap at the transaction stage,
      which could affect conversion and monetization of e-commerce agents; the finding rests on a single
      survey.
    event_summary_zh: 一项调查显示74%的用户信任AI智能体的购物建议，但在结账时犹豫。
