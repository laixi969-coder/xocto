      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或商业交付路径，钱从哪来无法从公开材料判断。
        evidence_ids:
        - ev-07c89ed95297d1bb
      - gate: truth
        status: insufficient
        reason: 界面层扩展依赖 Herdr App 本身，能否确定性交付多代理调度结果缺少实测与文档支持。
        evidence_ids:
