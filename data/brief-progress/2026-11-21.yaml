      or Cursor through TraxAgent's read-only MCP server, which reads usage and spend data and flags overspending;
      users get cost attribution and fix suggestions but still decide the changes themselves. The exact
      data sources and billing definitions need verification.
    inspiration_en: The trend is AI spend becoming a cost line that must be managed, with teams reading
      model bills like cloud bills. The opening is small engineering teams using many tools, charged per
      connected billing source or seat, starting with attribution before budget control.
