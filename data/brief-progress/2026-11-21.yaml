      it records locally where time went and writes the review back into the agent's instructions, skills
      or tools. The user gets an auditable improvement record, while judging whether the change helped
      remains manual. Recording granularity and delivery format still need verification.
    inspiration_en: 'Trend: coding agents are shifting from one-off Q&A to long autonomous runs, making
      how to measure and correct their behavior a separate problem. Entry: start with engineering teams
      that need to audit agent rework, selling verifiable session reviews and config-change records rather
      than another coding agent.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 或 Codex 的开发者，在长时间让编程助手执行任务后，需要复盘时间花在哪一步、哪些指令或工具导致返工，并据此修改助手指令与技能配置。
        job_en: Developers using Claude Code or Codex who, after long agent sessions, need to review where
          time went and which instructions or tools caused rework, then revise the agent's instructions
          and skills accordingly.
        pain_zh: 编程助手自主执行时，返工和卡点分散在长会话里，开发者难以说清哪条指令或工具拖慢了结果，只能凭印象调整配置。
        pain_en: When coding agents run autonomously, rework and stalls are scattered across long sessions;
          developers cannot easily tell which instruction or tool slowed the result and adjust config
          by impression.
        current_alternative_zh: 开发者目前靠翻看会话日志、手动记录或凭记忆调整助手指令，缺少结构化的时间去向与改进对照。
        current_alternative_en: Developers currently scroll session logs, take manual notes or adjust
