    summary_zh: 新手父母在夜间或短暂离开婴儿房时，打开两部手机，把其中一部当作摄像头对准婴儿，另一部用来查看画面，替代购买专用婴儿监视器。候选材料只给出“把两部手机变成婴儿监视器”这一句，AI
