      - gate: consensus
        status: insufficient
        reason: 未进入：市场背景不做共识判定。
        evidence_ids:
        - ev-b67948693c5b7ddf
      - gate: model
        status: insufficient
        reason: 未进入：市场背景不做模式判定。
        evidence_ids:
