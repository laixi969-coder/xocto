        status: insufficient
        reason: 产品标注免费，未见定价页或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-a2f043189310166e
      - gate: truth
        status: insufficient
        reason: 未见代理运行结果是否可核对、分派是否可靠的材料，交付确定性待核验。
        evidence_ids:
        - ev-c34fa628c8fca205
