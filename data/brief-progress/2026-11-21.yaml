        evidence_ids:
        - ev-a8934059ab556068
        - ev-99eb635d816af0d1
      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度缓慢上升，缺少用户评价或采用数据，无法判断是否形成使用共识。
        evidence_ids:
        - ev-99eb635d816af0d1
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或抽佣路径，钱从哪来属未知，不能据此否定需求。
        evidence_ids:
        - ev-a8934059ab556068
      - gate: truth
        status: insufficient
        reason: 付款由用户确认降低了误下单风险，但仅覆盖丹麦三家超市，交付确定性与安全边界仍待核验。
        evidence_ids:
        - ev-8adb45d665f634a7
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有丹麦用户报告实际用其完成跨店比价与下单的重复使用记录。
