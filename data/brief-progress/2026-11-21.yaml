        usage_reason_zh: 推断：相较手工开虚拟机，它把“创建干净 Windows 环境”变成一次可调用的动作，省去装系统与清理步骤，因此需要频繁验证安装包的 Windows 开发者会在重复测试时选择它；公开材料尚无留存或付费证据。
        usage_reason_en: 'Inference: compared with manually creating VMs, it turns ''create a clean Windows
          environment'' into a single callable action, removing system-install and cleanup steps, so Windows
