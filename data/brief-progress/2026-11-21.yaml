    summary_zh: 软件工程师在接到缺陷修复或小功能任务时，把代码库和任务描述交给这个开源代理，由它在隔离环境中运行命令、修改文件并产出补丁供人工审查。候选材料只说明它是 Devin 的开源替代，具体任务编排、交付形态与人工确认环节仍待核验。
