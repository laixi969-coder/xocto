        evidence_ids:
        - ev-76d5fdaacb5de6e9
      - gate: truth
        status: insufficient
        reason: 卡片审批能否确定性拦住错误、任务边界与安全人工边界如何，公开材料未给出可核验细节。
        evidence_ids:
        - ev-76d5fdaacb5de6e9
      next_validation: 收集该仓库的 issue / discussion 与 README 部署文档，核验卡片审批机制、支持的任务类型与人工确认边界。
