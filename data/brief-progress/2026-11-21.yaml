      WeChat-channel requests through multi-agent orchestration that auto-accepts per policy and logs
      to a ticket board, with an eval toolchain; delivery quality and human-review boundaries remain to
      be verified.
    inspiration_en: 'Trend: multi-agent orchestration is moving from developer frameworks down to concrete
      channels (like WeChat) and ticket flows, getting closer to frontline operations. Entry: target small
      merchants or local service teams relying on WeChat support, selling per-ticket-accepted results
      rather than a generic orchestration framework; pricing is undisclosed and not invented.'
    req_initial:
