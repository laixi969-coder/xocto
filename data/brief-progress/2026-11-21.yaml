      is free and only repository attention growth is visible, so pricing and retention evidence are still
      missing.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同一台机器上并行运行多个编码代理时，需要知道每个代理在做什么、卡在哪，并把新任务分派给空闲代理。
        job_en: When a developer runs several coding agents in parallel on one machine, they need to know
          what each agent is doing and where it is stuck, and to assign new tasks to idle agents.
        pain_zh: 多代理并行后，终端输出分散，开发者要逐个窗口切换才能判断进度和失败原因，难以统一调度。
        pain_en: With parallel agents, terminal output is scattered, so developers must switch between
          windows to judge progress and failures, making unified dispatch hard.
        current_alternative_zh: 逐个打开终端窗口或标签页查看各代理输出，手动复制任务到对应会话。
        current_alternative_en: Opening separate terminal windows or tabs to read each agent's output
          and manually copying tasks into the right session.
        usage_reason_zh: 推断：它把多个代理的运行状态收进一个可视化界面并支持批量分派，减少逐个窗口切换和手动复制任务这一步；需要同时跑多个代理的开发者会因此试用，但尚无用户反馈或留存证据支持长期使用。
        usage_reason_en: 'Inference: it consolidates multiple agents'' run states into one visual interface
          with batch dispatch, removing the step of switching windows and copying tasks by hand; developers
          running several agents would try it, but no user feedback or retention evidence supports long-term
          use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时状态分散、难以调度的问题，痛点来自代理并行这一新工作方式，旧做法是逐个终端窗口查看。
        evidence_ids:
