    summary_zh: 移动测试人员或普通用户在需要操作真实 iPhone 上的 App 时打开它：本地代理读取手机屏幕，在真实 App 内执行点击、输入和滑动，使用用户自己的模型账号，无需越狱或额外硬件。用户最终得到的是代理在设备上完成的操作结果，具体流程与交付仍待核验。
    inspiration: 趋势是代理开始直接操作真实移动设备，绕开 App 未开放接口的限制。切入可放在移动应用回归测试与上架前验收这类重复点击密集、结果可核对的环节，按测试轮次或设备时长收费；消费端自动化则需先解决账号与支付安全边界。
    summary_en: 'Mobile testers or ordinary users open it when they need to operate apps on a real iPhone:
      a local agent reads the phone screen and performs taps, typing and swipes inside real apps using
      the user''s own model account, with no jailbreak or extra hardware. The user gets the operations
      carried out on the device; the exact workflow and delivery still need verification.'
    inspiration_en: The trend is agents operating real mobile devices directly, bypassing apps that expose
      no interface. The entry point is repetitive, verifiable work such as mobile regression testing and
      pre-release acceptance, sold per test round or device hour; consumer automation first needs clear
      account and payment safety boundaries.
