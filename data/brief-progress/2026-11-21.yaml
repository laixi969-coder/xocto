    inspiration: 趋势：AI 编码代理开始把“从零做出一款可玩的小游戏”压缩成一次技能调用，游戏原型制作的门槛在下降。切入：面向独立游戏团队或游戏美术外包，从“可试玩原型”这一环节进入，按原型或按关卡交付收费；但可玩性、素材版权和后续迭代仍需要人工把关。
    summary_en: Indie developers or small teams wanting to quickly validate a browser 3D action game idea
      hand this skill to Claude Code or Codex, which generates art assets and three.js single-page code,
      yielding a demo playable directly in the browser such as Wusuo Shanmen. The exact workflow and delivery
      quality still need verification.
    inspiration_en: 'Trend: AI coding agents are compressing ''build a playable small game from scratch''
      into a single skill call, lowering the bar for game prototyping. Entry: target indie game teams
      or art outsourcing, starting from the playable-prototype step and charging per prototype or per
      level; playability, asset rights and iteration still need human review.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队在验证一个浏览器 3D 动作游戏想法时，把技能交给 Claude Code 或 Codex，由 AI 生成素材和 three.js 单页代码，拿到可试玩的演示。
        job_en: Indie developers or small teams validating a browser 3D action game idea hand the skill
          to Claude Code or Codex, which generates assets and three.js single-page code to produce a playable
          demo.
        pain_zh: 过去做可玩原型需要程序、美术和关卡分别投入，周期长、成本高，想法验证往往卡在做出第一个能玩的版本之前。
        pain_en: Previously a playable prototype required separate programming, art and level design effort
