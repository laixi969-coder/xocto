    summary_zh: C++、Rust、CMake 等静态编译项目的开发者在本地构建变慢时打开它，工具接收构建过程数据，展示每个编译环节的耗时和涉及的文件读写，帮助定位拖慢构建的头文件、模块或依赖。免费版只显示约
      10% 流程的详细信息，完整交付与人工确认方式仍待核验。
    inspiration: 趋势：构建性能诊断这类原本靠开发者手工加日志、逐段注释排查的旧流程，开始被做成可视化产品。切入：从手工维护大型 C++/CMake 代码库的团队进入，按项目或按诊断报告收费，而不是卖给所有开发者；但候选未说明
