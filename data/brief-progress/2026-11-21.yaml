        - ev-c0a6bb7eb36f24ba
      - gate: consensus
        status: insufficient
        reason: 仅见仓库约 47 星，无用户评价或采用讨论，无法判断是否有强场景共识。
        evidence_ids:
        - ev-c0a6bb7eb36f24ba
      - gate: model
        status: insufficient
        reason: 开源项目，未见托管服务定价或付费路径，买方与收费方式不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-021910321c06c2fa
      - gate: truth
        status: insufficient
        reason: 未见部署文档或可复现实测，承诺能否确定性交付尚不可核对。
        evidence_ids:
        - ev-021910321c06c2fa
      next_validation: 收集 skywake 官方文档或仓库 README 中的部署与接入说明，核对文件版本化与检索是否可复现。
