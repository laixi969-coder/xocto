  globalhackmap:
    slug: globalhackmap
    name: globalhackmap
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: AI + 开发
    project_type: new_application
    industries:
    - 信息安全
    - 企业IT运维
    industries_en:
    - Information Security
    - Enterprise IT Operations
    jobs:
    - 安全运维人员在漏洞披露后，需要从多个来源汇总新漏洞与在野利用信息，判断自家资产是否受影响并安排修复
    - 企业IT管理员在收到漏洞预警时，需要核对受影响系统并执行补丁或缓解措施
    jobs_en:
    - Security operations staff need to aggregate newly disclosed vulnerabilities and active exploits
      from multiple sources after a disclosure, judge whether their assets are affected, and schedule
      fixes
    - Enterprise IT administrators need to check affected systems and apply patches or mitigations when
      a vulnerability alert arrives
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安全运维人员在新漏洞或入侵事件披露后打开它，把分散的漏洞、在野利用与泄露事件汇总到一张全球地图上，并附来源链接与一键修复入口；用户据此判断哪些事件与自己相关并安排处置，具体修复动作与人工确认边界仍待核验。
    inspiration: 趋势：漏洞与入侵信息正从邮件列表、厂商公告分散流向可交互的实时视图，安全团队对“先看哪里”的聚合需求在上升。切入：从中小企业没有专职威胁情报岗这一环进入，把地图做成按资产清单过滤的告警订阅，按企业资产数量或告警条数收费，而不是卖通用看板。
    summary_en: After a new vulnerability or breach is disclosed, security operations staff open it to
      see scattered vulnerabilities, active exploits and breach events aggregated on one global map with
      source links and one-click fix entry points; they use it to judge which events concern them and
      plan response, while the exact fix actions and human confirmation boundary still need verification.
    inspiration_en: 'Trend: vulnerability and breach information is moving from mailing lists and vendor
      advisories into interactive real-time views, raising demand among security teams for aggregation
      that answers ''where do I look first''. Entry: target small and mid-size firms without a dedicated
      threat-intelligence role, turning the map into alert subscriptions filtered by asset inventory,
      priced by asset count or alert volume rather than sold as a generic dashboard.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全运维人员在新漏洞或在野利用披露后，需要从多个来源汇总信息，判断自家资产是否受影响并安排修复。
        job_en: After a new vulnerability or active exploit is disclosed, security operations staff need
          to aggregate information from multiple sources, judge whether their assets are affected, and
          schedule fixes.
        pain_zh: 漏洞与入侵信息分散在厂商公告、邮件列表和新闻里，人工逐条比对资产既慢又容易漏掉在野利用。
        pain_en: Vulnerability and breach information is scattered across vendor advisories, mailing lists
          and news, so manually matching it against assets is slow and easily misses active exploits.
        current_alternative_zh: 安全团队目前靠订阅邮件列表、浏览厂商公告和通用漏洞库，再手工整理成内部通报。
        current_alternative_en: Security teams currently subscribe to mailing lists, browse vendor advisories
          and general vulnerability databases, then manually compile internal briefings.
        usage_reason_zh: 推断：相较逐站浏览公告，它把漏洞、在野利用与泄露事件合并到一张带来源链接的地图上，减少跨来源搜集这一步，让没有专职情报岗的团队先看到需要处置的事件；是否被长期留在工作流中缺少留存证据。
        usage_reason_en: 'Inference: compared with browsing advisories site by site, it merges vulnerabilities,
          active exploits and breach events into one map with source links, cutting the cross-source collection
          step so teams without a dedicated intelligence role see events needing response first; evidence
          that it stays in the workflow long term is missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决漏洞与入侵信息分散、人工比对资产慢且易漏在野利用的问题，旧行为是逐站浏览公告再手工整理，结构上成立。
        evidence_ids:
        - ev-e69057c782093da1
        - ev-30a2969fb5ed709b
      - gate: consensus
        status: insufficient
        reason: 仓库收藏数缓慢增长，只能说明关注度，缺少安全团队实际采用或订阅的公开证据。
        evidence_ids:
        - ev-e69057c782093da1
        - ev-30a2969fb5ed709b
      - gate: model
        status: insufficient
        reason: 未见定价页或付费路径，买方可能是企业安全预算，但这是判断而非已验证事实。
        evidence_ids:
        - ev-30a2969fb5ed709b
      - gate: truth
        status: insufficient
        reason: “一键修复”能否确定性交付、是否需人工确认边界，公开材料未说明。
        evidence_ids:
        - ev-e69057c782093da1
      next_validation: 收集该项目的官方说明或仓库 issue/discussion，核实“一键修复”的实际动作范围与是否需要人工确认。
  gpucanvas:
    slug: gpucanvas
    name: gpucanvas
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与互联网服务
    - 数字设计与创意服务
    industries_en:
    - Software and Internet Services
    - Digital Design and Creative Services
    jobs:
    - 前端或创意开发者在搭建含大量动态界面元素的可视化页面时，把成千上万个实时 DOM 节点放到无限画布上，用编辑器选择、移动、缩放并叠加着色器与转场，再由 AI 代理读取并指向这些节点以完成布局调整
    - 设计工程师在制作交互式展示或数据密集界面时，需要让 AI 理解画布上每个元素的位置与内容，从而定位并修改指定节点
    jobs_en:
    - Front-end or creative developers building visual pages with many dynamic UI elements place thousands
      of live DOM nodes on an infinite canvas, use an editor to select, move, resize and apply shaders
      and transitions, then have an AI agent read and point at those nodes to adjust layout
    - Design engineers making interactive showcases or data-dense interfaces need the AI to understand
      each element's position and content on the canvas so it can locate and modify a specific node
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 前端或创意开发者打开它，把成千上万个实时 DOM 节点铺到一张无限画布上；GPU 负责绘制，编辑器负责选中、移动和缩放，着色器与转场作用在这些节点上，AI 代理可以读取节点并指向它们。用户最终拿到一张可编辑、可被
      AI 定位的节点画布，具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：把实时 DOM 节点搬上 GPU 画布，并让 AI 代理能读取和指向画布元素，说明“AI 能看懂并操作可视化界面”正从截图识别走向结构化节点操作。切入：可从数据密集的仪表盘、交互式展示页或设计工具切入，卖点是让
      AI 直接定位并改动画布上的具体节点，而不是重画整页；目前只有开源仓库与星数，付费路径未披露。
    summary_en: Front-end or creative developers open it to lay thousands of live DOM nodes onto an infinite
      canvas; the GPU draws them, an editor selects, moves and resizes them, shaders and transitions act
      on those nodes, and an AI agent can read and point at them. The user ends up with an editable node
      canvas that an AI can locate elements on; the exact deliverable and human confirmation step still
      need verification.
    inspiration_en: 'Trend: moving live DOM nodes onto a GPU canvas and letting an AI agent read and point
      at canvas elements shows AI understanding of visual interfaces shifting from screenshot recognition
      to structured node operations. Entry: start from data-dense dashboards, interactive showcase pages
      or design tools, selling the ability for AI to locate and edit specific canvas nodes rather than
      redraw a whole page; only an open-source repo and star counts are public, with no disclosed payment
      path.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 前端或创意开发者在搭建含大量动态元素的可视化页面时，把成千上万个实时 DOM 节点放到无限画布上，用编辑器选择、移动、缩放并叠加着色器与转场，再由 AI 代理读取并指向节点完成布局调整。
        job_en: Front-end or creative developers building visual pages with many dynamic elements place
          thousands of live DOM nodes on an infinite canvas, use an editor to select, move, resize and
          apply shaders and transitions, then have an AI agent read and point at nodes to adjust layout.
        pain_zh: 大量实时 DOM 节点在常规页面里渲染和操作会卡顿，AI 也难以定位画布上的具体元素，导致调整布局和让 AI 改界面都要靠人工逐点处理。
        pain_en: Many live DOM nodes render and manipulate slowly on ordinary pages, and AI struggles
          to locate specific canvas elements, so layout tweaks and AI-driven UI edits require manual point-by-point
          work.
        current_alternative_zh: 旧做法是用普通 DOM 或 Canvas 库自行优化渲染，AI 改界面则靠截图识别或人工描述位置，再手动定位元素。
        current_alternative_en: The old way is hand-optimizing rendering with plain DOM or Canvas libraries,
          while AI UI edits rely on screenshot recognition or manual position descriptions followed by
          hand-locating elements.
        usage_reason_zh: 推断：它把绘制交给 GPU、把选中与变换交给编辑器，并让 AI 代理直接读取和指向节点，从而省去人工在卡顿页面里逐个定位元素这一步；需要处理大量动态节点又要让
          AI 精确改界面的开发者会因此选择它。
        usage_reason_en: 'Inference: it offloads drawing to the GPU, selection and transforms to an editor,
          and lets an AI agent read and point at nodes directly, removing the manual step of locating
          elements one by one on a laggy page; developers handling many dynamic nodes who need precise
          AI UI edits would choose it for this.'
      gates:
      - gate: value
        status: supported
        reason: 它解决大量实时 DOM 节点渲染卡顿、AI 难以定位画布元素的问题，痛点具体且交付可确定；买方尚不清晰。
        evidence_ids:
        - ev-3760e0274be97f02
        - ev-e44e7cc4ab441cb2
      - gate: consensus
        status: insufficient
        reason: 只有开源仓库星数缓慢增长，属于关注度信号，缺少用户评价或采用案例说明谁在什么场景使用。
        evidence_ids:
        - ev-3760e0274be97f02
        - ev-8edf79f48d9ff24e
      - gate: model
        status: insufficient
        reason: 未披露定价或付费路径，开源项目可能靠赞助或托管服务变现，这是判断而非已验证事实。
        evidence_ids:
        - ev-e44e7cc4ab441cb2
      - gate: truth
        status: insufficient
        reason: AI 代理读取和指向节点能否稳定交付、人工确认边界如何，公开材料未说明，需进一步核验。
        evidence_ids:
        - ev-3760e0274be97f02
      next_validation: 收集该开源仓库的 issue、discussion 或官方文档，确认 AI 代理读取与指向节点的实际使用方式及是否有托管或付费版本。
  granola:
    slug: granola
    name: Granola
    decision: queued
    event_summary_zh: 2026年10月29日，Granola 在会议记录产品中加入听写功能，此前 Wispr 已在听写应用中增加会议记录；Granola 同时入选 Madrona 2026
      年 Intelligent Applications 40 中阶段名单，并被描述为从个人效率工具转向企业知识层。
    event_summary_en: On 2026-10-29 Granola added a dictation feature to its meeting notetaker, after
      Wispr added meeting notes to its dictation app; Granola was also named to Madrona's 2026 Intelligent
      Applications 40 (mid stage) and described as repositioning from an individual productivity tool
      toward an enterprise knowledge layer.
    category: AI + 效率
    project_type: new_application
    industries:
    - 专业服务
    - 企业管理
    industries_en:
    - professional services
    - enterprise management
    jobs:
    - 会议参与者在不中断对话的情况下记录讨论并整理后续待办
    - 销售与客户成功人员在客户通话后整理纪要与跟进事项
    jobs_en:
    - meeting participants capturing discussion without interrupting the conversation and turning it into
      follow-ups
    - sales and customer success staff turning client calls into notes and next actions
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 会议参与者打开 Granola 后，它接收会议中的语音与对话内容，转成结构化笔记，并新增听写入口把口述内容转成文字；用户拿到的是可编辑的会议记录与后续材料，仍需本人确认措辞与待办。企业知识层的具体交付流程仍待核验。
    inspiration: 趋势是语音与会议记录工具正从个人效率插件向企业知识沉淀层靠拢，听写与会议记录两个入口在互相侵入。切入可放在垂直行业的具体会议场景，例如律所客户会谈、地产带看复盘或医疗问诊记录，卖的是可核对的纪要与跟进结果，而不是通用转写时长。
    summary_en: A meeting participant opens Granola, which takes in the spoken conversation, turns it
      into structured notes, and now also offers a dictation entry point that converts speech to text;
      the user gets an editable record and follow-up material, still confirming wording and action items.
      The concrete delivery of an enterprise knowledge layer remains to be verified.
    inspiration_en: The trend is voice and meeting-capture tools converging from individual productivity
      add-ons toward enterprise knowledge layers, with dictation and notetaking invading each other. The
      opening is a vertical meeting scenario such as law-firm client consultations, real-estate showing
      debriefs or clinic visit notes, selling verifiable minutes and follow-ups rather than generic transcription
      hours.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 会议参与者在不打断对话的情况下记录讨论内容，并在会后整理成纪要和待办事项。
        job_en: Meeting participants capture the discussion without interrupting it and turn it into minutes
          and action items afterwards.
        pain_zh: 边听边记会分散注意力，会后凭记忆补纪要容易漏掉承诺与责任人；听写与记录分属两个工具时还要来回切换。
        pain_en: Taking notes while listening splits attention, and reconstructing minutes from memory
          loses commitments and owners; when dictation and notetaking are separate tools, users switch
          back and forth.
        current_alternative_zh: 手写笔记、录音后人工整理，或使用通用转写工具再手工编辑成纪要。
        current_alternative_en: Handwritten notes, recording and manually writing up minutes, or generic
          transcription tools edited by hand.
        usage_reason_zh: 推断：Granola 在会议进行中直接接收语音并生成结构化笔记，把“会后重听录音再逐段整理”这一步压缩为校对已有草稿；新增听写让同一入口也能处理口述材料，减少工具切换。经常开客户会、需要可核对纪要的人会因此选择它。
        usage_reason_en: 'Inference: Granola captures speech during the meeting and produces structured
          notes, compressing the step of replaying recordings and writing up minutes into editing an existing
          draft; the new dictation lets the same entry point handle spoken material, reducing tool switching.
          People in frequent client meetings who need verifiable minutes would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决会议中记录与倾听冲突、会后补纪要漏项的问题，旧做法是手记加人工整理，结构上成立；企业知识层的交付尚属推断。
        evidence_ids:
        - ev-6604734c13a60cb5
      - gate: consensus
        status: insufficient
        reason: 仅有入选行业名单与功能发布报道，缺少用户评价或客户案例说明会议记录被持续采用。
        evidence_ids:
        - ev-6604734c13a60cb5
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与买方结构，企业知识层的付费路径是判断而非已验证事实。
        evidence_ids:
        - ev-6604734c13a60cb5
      - gate: truth
        status: insufficient
        reason: 听写与会议记录合并后，纪要准确性、说话人区分与人工确认边界缺少可核验材料。
        evidence_ids:
        - ev-6604734c13a60cb5
      next_validation: 收集 Granola 官方定价页或客户案例页，确认企业知识层交付的具体形态与计费方式。
