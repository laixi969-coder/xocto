    name: Trump threatens ‘tremendous tax’ for moving AI data centers outside the US
    decision: market_context
    summary_zh: 2026年11月20日，美国总统特朗普在中美、美俄领导人峰会后表示，将对在美国境外建设数据中心的公司征收“巨额税”，并称不会允许本国公司到海外建数据中心。该表态目前只是威胁，尚无立法或实施细则。若落地，将改变AI算力基础设施的选址与成本结构，进而影响AI应用的训练与推理成本及交付布局；具体影响取决于后续政策细节，属推断。
    summary_en: On November 20, 2026, following summits with the Chinese and Russian presidents, US President
      Donald Trump said he would impose a "tremendous tax" on companies that build data centers outside
      the US, saying he would not allow US companies to build them abroad. The statement is currently
      only a threat, with no legislation or implementing rules. If enacted, it would change where AI compute
      infrastructure is sited and how much it costs, affecting the training and inference costs and delivery
      footprint of AI applications; the specific impact depends on later policy details and is an inference.
    event_summary_zh: 特朗普公开威胁对在境外建设数据中心的公司征收“巨额税”，并称不会允许美国公司到海外建数据中心。
    event_summary_en: Trump publicly threatened a "tremendous tax" on companies building data centers
      outside the US and said he would not allow US companies to build them abroad.
