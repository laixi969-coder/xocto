      source, so ''can run tools'' alone no longer differentiates. Entry: skip building another general
      agent framework; start from repetitive operations in one specific industry (e.g. reconciliation,
      report assembly) and package sandboxed execution into checkable deliverables, charging per output
      rather than per seat.'
