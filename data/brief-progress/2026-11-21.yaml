  豆包工作上线ai巨头狂卷办公场景独立客户端成标配:
    slug: 豆包工作上线ai巨头狂卷办公场景独立客户端成标配
    name: 豆包工作
    decision: watching
    event_summary_zh: 2026年9月，飞书发布8.0版并与豆包工作原生融合，飞书方面称把智能体当作“一等公民”；同期有报道称豆包工作上线，办公场景出现独立客户端趋势。具体功能边界、定价与用户采用数据未在材料中披露。
    event_summary_en: In September 2026, Feishu released version 8.0 with native integration of Doubao
      Work, with Feishu describing agents as "first-class citizens"; reports also said Doubao Work launched
      as a standalone client for office scenarios. Feature boundaries, pricing and adoption data were
      not disclosed in the materials.
    category: AI + 效率
    project_type: new_application
    industries:
    - 企业协同办公
    - 软件与信息服务
    industries_en:
    - Enterprise collaboration software
    - Software and IT services
    jobs:
    - 企业员工在飞书内处理文档、消息与任务时，调用智能体完成跨应用的信息整理与待办推进
    - 企业管理者在协同平台中配置智能体，把重复的审批、汇总与通知流程交给它执行
    jobs_en:
    - Enterprise employees invoke agents inside Feishu to consolidate cross-app information and advance
      to-dos while handling documents, messages and tasks
    - Managers configure agents in the collaboration platform to run repetitive approval, summary and
      notification workflows
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 企业员工在飞书等协同办公平台里处理文档、消息和任务时，可以调用豆包工作这一智能体入口，由它接收办公上下文并执行信息整理、任务推进等动作；用户最终拿到的是平台内的处理结果或待办推进，人工仍需确认关键内容。具体可执行动作、交付边界与计费方式仍待核验。
    inspiration: 趋势是协同办公平台把智能体从插件升级为原生入口，办公套件开始围绕“谁执行任务”而非“谁打开文档”重构。切入可考虑从飞书生态之外的垂直行业办公流程入手，例如律所案卷流转、货代单证核对，按流程结果而非席位收费；但需先确认豆包工作的实际能力边界，避免与其正面重叠。
    summary_en: When employees handle documents, messages and tasks inside collaboration platforms such
      as Feishu, they can invoke Doubao Work as an agent entry point that receives office context and
      performs actions such as consolidating information and advancing tasks; users get in-platform results
      or progressed to-dos, with humans still confirming key content. Executable actions, delivery boundaries
      and billing remain to be verified.
    inspiration_en: The trend is collaboration platforms upgrading agents from plug-ins to native entry
      points, rebuilding office suites around who executes tasks rather than who opens documents. An entry
      could be vertical office workflows outside the Feishu ecosystem, such as law-firm case handoffs
      or freight forwarding document checks, charged by process outcome rather than seats; first confirm
      Doubao Work's actual capability boundaries to avoid direct overlap.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业员工在飞书内处理文档、消息与任务时，需要把分散在多个应用里的信息汇总并推进待办，希望由智能体直接执行而不是自己逐条复制粘贴。
        job_en: Employees working in Feishu on documents, messages and tasks need to consolidate information
          scattered across apps and advance to-dos, preferring an agent to execute rather than copying
          and pasting item by item.
        pain_zh: 办公信息分散在文档、聊天和任务系统中，人工汇总与跟进耗时且容易遗漏；不处理的后果是任务延误和信息不同步。
        pain_en: Office information is scattered across documents, chats and task systems; manual consolidation
          and follow-up is time-consuming and error-prone, with delays and desynchronized information
          as consequences.
        current_alternative_zh: 员工手动在多个应用间切换、复制粘贴，或使用平台内已有的自动化规则和第三方插件完成汇总与提醒。
        current_alternative_en: Employees manually switch between apps and copy-paste, or use existing
          automation rules and third-party plug-ins in the platform for summaries and reminders.
        usage_reason_zh: 推断：相较手动跨应用整理，豆包工作作为飞书原生智能体入口可直接接收办公上下文并执行整理与推进动作，减少切换和复制这一步负担；经常在飞书内处理多来源信息的团队会在任务密集时选择它，但实际留存与付费尚无公开证据。
        usage_reason_en: 'Inference: compared with manual cross-app consolidation, Doubao Work as a native
          Feishu agent entry can directly receive office context and execute consolidation and advancement
          actions, reducing the switching and copying step; teams frequently handling multi-source information
          in Feishu would choose it during task-heavy periods, though retention and payment evidence is
          not public.'
      gates:
      - gate: value
        status: supported
        reason: 它解决办公信息分散、人工汇总与跟进耗时的问题，痛点具体且不处理会延误任务；买方与计费方式尚不清晰。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: consensus
        status: insufficient
        reason: 仅有平台发布与媒体报道，缺少用户采用、留存或客户案例证据，无法判断共识是否形成。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: model
        status: insufficient
        reason: 材料未披露定价、付费方或采购方式，钱从哪来只能作为判断而非事实。
        evidence_ids:
        - ev-ccc63841d29abcbb
      - gate: truth
        status: insufficient
        reason: 智能体执行办公任务涉及权限与人工确认边界，材料未说明交付是否确定发生及安全边界。
        evidence_ids:
        - ev-3d7dc64ced8edd77
      next_validation: 收集豆包工作官方产品页或飞书8.0发布文档，核对其可执行动作、权限边界与计费方式。
  财跃星辰发布finwork-v10-金融智能体开启按岗位交付规模化落地新阶段:
    slug: 财跃星辰发布finwork-v10-金融智能体开启按岗位交付规模化落地新阶段
    name: FinWork
    decision: watching
    event_summary_zh: 财跃星辰于2026年11月21日发布金融智能体FinWork V1.0，宣称以“按岗位交付”的方式在金融业务中规模化落地；公开材料未给出具体岗位、交付物、客户或定价。
    event_summary_en: On November 21, 2026, Caiyue Xingchen released FinWork V1.0, a financial agent it
      says is delivered per job role and deployed at scale in financial work; the public material gives
      no specific roles, deliverables, customers or pricing.
    category: AI + 商业
    project_type: new_application
    industries:
    - 金融
    industries_en:
    - Financial services
    jobs:
    - 金融机构业务岗在办理具体业务时处理内部资料与流程，需完成岗位职责内的分析与产出（具体岗位与交付物仍待核验）
    jobs_en:
    - Staff at financial institutions handling internal materials and processes for a specific role, producing
      role-level analysis and output (specific roles and deliverables still unverified)
    regions:
    - 中国
    regions_en:
    - China
    open_source: false
    summary_zh: 金融机构的岗位人员可能在办理具体业务时打开它，把原本由人工整理的业务资料交给智能体处理，以得到岗位职责内的分析或产出；但公开材料只说明“按岗位交付”，具体接收什么材料、执行哪一步、交付什么结果以及人工如何复核，均仍待核验。
    inspiration: 趋势是金融智能体从通用问答转向按岗位打包交付，卖点从模型能力变成岗位职责的完成度。切入可考虑从银行、券商中某个重复性强的岗位环节入手，按岗位或按产出计费；但该产品尚未披露岗位清单与交付标准，窗口与壁垒都还看不清。
    summary_en: Staff at financial institutions may open it while handling a specific business task, handing
      over materials that people used to organize by hand to get role-level analysis or output; however,
      the public material only says it is delivered per job role, and what it ingests, which step it performs,
      what it delivers and how humans review it all remain unverified.
    inspiration_en: The trend is financial agents moving from general chat to packaged delivery per job
      role, with the selling point shifting from model capability to how completely a role's duties are
      done. An entry could be one repetitive role step in a bank or brokerage, priced per role or per
      output; but the product has not disclosed its role list or delivery standard, so the window and
      moat are unclear.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 金融机构的岗位人员在办理具体业务时，需要处理内部业务资料与流程，完成岗位职责内的分析与产出；具体岗位和交付物仍待核验。
        job_en: Staff at financial institutions handling a specific business task need to process internal
          materials and processes and complete role-level analysis and output; the specific roles and
          deliverables remain unverified.
        pain_zh: 金融业务中大量资料整理、口径核对与初稿撰写仍靠人工，重复且耗时，出错后返工成本高；这是从“按岗位交付”这一说法作出的推断。
        pain_en: Much material organization, figure reconciliation and first-draft writing in financial
          work is still manual, repetitive and slow, with costly rework after errors; this is an inference
          from the 'delivered per job role' claim.
        current_alternative_zh: 目前多由岗位人员手工整理资料、用通用办公软件和表格完成分析，或采购传统金融数据终端与内部系统，再人工拼接成产出。
        current_alternative_en: Today role staff mostly organize materials by hand, analyze with general
          office software and spreadsheets, or buy traditional financial data terminals and internal systems
          and then assemble output manually.
        usage_reason_zh: 推断：若智能体真能按岗位职责直接接收业务资料并产出可用初稿，就省去人工从零整理与起草的那一步，岗位人员只需复核；但公开材料未给出交付样例，尚不能确认这一步负担确实被减少。
        usage_reason_en: 'Inference: if the agent really takes business materials per role and produces
          a usable first draft, it removes the step of organizing and drafting from scratch, leaving staff
          to review; but no delivery sample is public, so the reduction is not yet confirmed.'
      gates:
      - gate: value
        status: supported
        reason: 它解决金融岗位人员手工整理资料、核对口径并起草产出的需求，痛点是重复劳动与返工成本；买方与定价未披露。
        evidence_ids:
        - ev-10f01ef03a3685f4
        - ev-d657ff0e35c6a040
      - gate: consensus
        status: insufficient
        reason: 仅有发布报道，未见客户名单、使用反馈或岗位清单，无法判断岗位人员是否真的把它纳入工作流。
        evidence_ids:
        - ev-10f01ef03a3685f4
      - gate: model
        status: insufficient
        reason: 未披露定价、计费方式与买方，按岗位交付是否按席位或按产出收费无法核验。
        evidence_ids:
        - ev-d657ff0e35c6a040
      - gate: truth
        status: insufficient
        reason: 金融场景对准确性与合规要求高，公开材料未说明人工复核边界与交付确定性。
        evidence_ids:
        - ev-10f01ef03a3685f4
      next_validation: 收集FinWork V1.0的官方产品页或发布稿，确认其列出的具体岗位、交付物样例与定价方式。
