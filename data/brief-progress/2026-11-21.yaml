    jobs:
    - 开发者在命令行里让编码 Agent 在后台连续处理多步任务，遇到不确定的决策时通过卡片请求人工拍板
    jobs_en:
    - Developers let a command-line coding agent run multi-step tasks in the background and request human
      sign-off via cards when it is unsure
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在命令行里启动编码 Agent 后，它会在后台自己接活、连续跟进多步任务，平时不打扰人；遇到拿不准的环节才弹出卡片请人拍板。用户最终拿到的是被推进到待确认状态的任务结果，关键决策仍由人确认。具体支持哪些任务类型、交付边界如何，仍待核验。
    inspiration: 趋势：编码 Agent 正从“一问一答”走向“后台长跑、只在关键点找人”，人的角色从逐步操作变成审批节点。切入：可从需要多步连续执行、又必须留人工确认的旧流程进入，例如运维变更、数据清洗、批量内容处理；卖法可围绕“按任务结果收费”或“按审批节点计费”，但公开材料未披露价格，需核验。
    summary_en: After a developer starts a coding agent in the command line, it picks up work in the background
      and follows multi-step tasks through, staying quiet until it hits something uncertain and then raises
      a card for a human to decide. The user gets a task pushed to a pending-confirmation state, with
      key decisions still made by a person. Which task types it supports and where delivery stops still
      need verification.
    inspiration_en: 'Trend: coding agents are moving from one-shot Q&A toward long background runs that
      only pull a human in at key points, turning the person into an approval node. Entry: target old
      workflows that need multi-step execution but must keep human sign-off, such as ops changes, data
      cleaning or batch content processing; pricing could be tied to task outcomes or approval steps,
      but no public price is disclosed and needs verification.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在命令行里让编码 Agent 在后台连续处理多步任务，遇到不确定的决策时通过卡片请求人工拍板。
        job_en: Developers let a command-line coding agent run multi-step tasks in the background and
          request human sign-off via cards when it is unsure.
        pain_zh: 多步编码任务需要人一直盯着逐步确认，既打断专注又拖慢进度；完全放手又怕 Agent 在关键处走错。
        pain_en: Multi-step coding tasks require constant step-by-step confirmation, breaking focus and
          slowing progress, while fully letting go risks the agent going wrong at critical points.
        current_alternative_zh: 开发者目前多靠手动逐步提示、反复检查 Agent 输出，或干脆自己完成多步任务。
        current_alternative_en: Developers currently prompt step by step, repeatedly check agent output,
          or just do multi-step tasks themselves.
        usage_reason_zh: 推断：相较逐步手动提示，它让 Agent 在后台连续推进多步任务，只在不确定处弹卡片请人拍板，减少了人逐步确认的负担，因此需要长跑任务又要保留关键审批的开发者会选用它。
        usage_reason_en: 'Inference: compared with step-by-step manual prompting, it lets the agent push
          multi-step tasks forward in the background and only raises cards at uncertain points, cutting
          the burden of stepwise confirmation, so developers who need long runs but keep key approvals
          would choose it.'
      gates:
