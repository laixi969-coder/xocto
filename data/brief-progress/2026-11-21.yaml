    summary_zh: 使用 DeepSeek Harness 的开发者在一段会话结束后，打开这个看板插件，让它从会话记录中提取任务目标、进度和遗留问题，并生成子任务与产物清单，用于会话交接；最终交付是看板上的任务卡片，具体提取准确度与人工确认环节仍待核验。
