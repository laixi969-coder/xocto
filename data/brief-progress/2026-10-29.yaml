    name: Anthropic
    decision: market_context
    summary_zh: Anthropic 招聘负责人于 2026 年 10 月表示已停止在招聘中使用传统编程面试，理由是 Claude 在 React 等编程任务上已优于人类候选人。这一变化表明
      AI 编程能力正在改变工程岗位的招聘与技能评估标准，对 AI 辅助开发工具的采用和人才竞争具有示范意义；但仅凭一家公司的招聘调整，不能推断整个行业已普遍放弃编程面试（推断）。
    summary_en: An Anthropic hiring manager said in October 2026 that the company has stopped using traditional
      coding interviews, citing Claude's superior performance on tasks such as React challenges. The change
      shows AI coding capability reshaping how engineering roles are assessed and hired, with implications
      for adoption of AI coding tools and talent competition; however, one company's hiring change does
      not establish that the whole industry has abandoned coding interviews (inference).
    event_summary_zh: Anthropic 招聘负责人公开表示已停止使用传统编程面试，理由是 Claude 在相关编程任务上表现优于候选人。
    event_summary_en: An Anthropic hiring manager publicly said the company has stopped using traditional
      coding interviews because Claude now outperforms candidates on the relevant coding tasks.
