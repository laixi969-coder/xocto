    summary_zh: 2026年10月27日有报道称，亚马逊在 Nova 模型持续表现不佳后裁撤其 AI 部门。若属实，这将削弱亚马逊自研基础模型作为第三方 AI 应用底层选项的可靠性，并可能促使开发者转向其他模型供应商；该影响为推断，材料未给出具体裁员规模或业务数据。
    summary_en: On 2026-10-27, reports said Amazon is gutting its AI division after sustained failure
      of its Nova models. If accurate, this weakens Amazon's in-house foundation models as a dependable
      base layer for third-party AI applications and could push developers toward other model providers;
      this impact is inferred, as the material gives no specific headcount or business figures.
    event_summary_zh: 2026年10月27日有报道称，亚马逊在 Nova 模型持续失败后裁撤其 AI 部门。
