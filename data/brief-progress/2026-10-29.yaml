      /v1/realtime 与 /tts 端点实现服务器实时音频输入输出；同时新增 DeepSeek V4.1 Flash、SenseNova U1、Beam、Kolibri-1、Flint、Muse
      Spark、Granite Switch Decision 等架构支持，核心层将稀疏注意力（QSA/DSA）重构为融合掩码算子，并为宿主驻留的 MoE 专家引入 50/50 SLRU 缓存。
    event_summary_en: llama.cpp released v0.8.0, adding support for the LiquidAI LFM3 family (text, vision,
      audio and omni), an experimental streaming-audio API in mtmd, and realtime audio input/output in
      the server via new /v1/realtime and /tts endpoints; it also added architectures including DeepSeek
      V4.1 Flash, SenseNova U1, Beam, Kolibri-1, Flint, Muse Spark and Granite Switch Decision, reworked
      sparse attention (QSA/DSA) onto a fused masking op in the core, and introduced a 50/50 SLRU cache
      for host-resident MoE experts.
  github-octoverse-2026:
    slug: github-octoverse-2026
    name: Octoverse 2026
    decision: market_context
    summary_zh: 2026年10月28日，该平台执行副总裁 Jay Parikh 在年度开发者大会上公布 Octoverse 2026 报告：合并拉取请求在不到一年内增至每月 2.2 亿次，提交量增至每月
      73.8 亿次，新仓库创建速率翻倍至每月 3030 万个。报告将这一增长归因于智能体工程（agentic engineering）的普及，意味着 AI 编码代理正显著改变软件开发的工作量与交付节奏，并推高代码托管与审查环节的负载（推断）。
    summary_en: 'On October 28, 2026, the platform''s EVP Jay Parikh announced the Octoverse 2026 report
      at its annual developer conference: merged pull requests tripled in under a year to 220 million
      per month, commits rose to 7.38 billion per month, and new repository creation doubled to 30.3 million
      per month. The report attributes the surge to agentic engineering, implying that AI coding agents
      are materially changing software development volume and delivery cadence and raising load on code
      hosting and review workflows (inference).'
    event_summary_zh: 该平台于 2026 年 10 月 28 日发布 Octoverse 2026 报告，披露合并拉取请求达每月 2.2 亿次、提交达每月 73.8 亿次、新仓库达每月
      3030 万个，并将增长归因于智能体工程。
    event_summary_en: The platform released its Octoverse 2026 report on October 28, 2026, disclosing
      220 million merged pull requests per month, 7.38 billion commits per month and 30.3 million new
      repositories per month, attributing the growth to agentic engineering.
