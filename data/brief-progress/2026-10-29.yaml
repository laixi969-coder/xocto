    summary_zh: 2026年10月报道指出，谷歌在继续为AI投入大量资金的同时，其搜索业务已受到冲击；这意味着生成式AI正在改变搜索入口的竞争格局，对依赖搜索流量的AI应用分发与获客成本带来不确定性（推断）。
