    summary_zh: 亚马逊工程负责人Terk Terkowitz于2026年10月向开发者表态：若当前AI工具对某项工作无益，应记录原因并与同伴和管理者沟通，这被视为判断力的体现。该表态反映大型企业在内部推广AI编码工具时开始容纳“不适用”场景，可能影响AI开发工具的采用节奏与评估方式；对整体行业的影响属推断。
    summary_en: Amazon engineering leader Terk Terkowitz told developers in October 2026 that if current
      AI tooling does not benefit a piece of work, they should document why and share it with peers and
      managers, framing this as a demonstration of judgment. The statement reflects large enterprises
      accommodating 'not applicable' cases while rolling out AI coding tools internally, which could affect
      the pace of adoption and how AI developer tools are evaluated; the broader industry effect is an
      inference.
    event_summary_zh: 亚马逊工程负责人Terk Terkowitz于2026年10月发文，鼓励开发者记录AI工具无法帮助其工作的原因并向上反馈。
