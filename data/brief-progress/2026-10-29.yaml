  meta-says-it8217ll-probably-delay-its-controversial-new-busi:
    slug: meta-says-it8217ll-probably-delay-its-controversial-new-busi
    name: Meta
    decision: market_context
    summary_zh: Meta 于 2026 年 10 月 28 日表示，因出版商对其 AI 训练相关条款的反对，可能将原定 10 月 30 日生效的新商业条款推迟至 11 月 20 日之后，并称在未与行业组织充分磋商前不会改动政策。这意味着平台内容用于模型训练的使用边界仍不确定，依赖平台内容与分发渠道的
      AI 应用在数据合规与内容授权上面临持续的政策风险（推断）。
    summary_en: On October 28, 2026, Meta said it may push its new business terms, originally due to take
      effect October 30, past November 20 amid publisher backlash over AI training provisions, and said
      it would not change policy without full consultation with industry groups. The boundary for using
      platform content in model training therefore remains unsettled, leaving AI applications that depend
      on platform content and distribution exposed to continuing policy risk on data compliance and content
      licensing (inference).
    event_summary_zh: Meta 通讯负责人 Andy Stone 表示，公司可能将新商业条款的实施推迟至 11 月 20 日之后，此前该条款因涉及用 Facebook 与 Instagram
      上的新闻网站内容训练 AI 而遭出版商反对，Meta 已删除相关“训练”表述。
    event_summary_en: Meta communications head Andy Stone said the company may delay implementation of
      its new business terms past November 20 after publishers objected to provisions that appeared to
      permit training AI on news sites using Facebook and Instagram; Meta has since removed the "train"
      language.
