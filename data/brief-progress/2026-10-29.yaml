    name: Texas data center opposition
    decision: market_context
    summary_zh: 2026 年 10 月，得克萨斯州奥斯汀周边多地出现针对数据中心的反对：Taylor 拟建项目遭抵制，Temple 市长与市议员因数据中心开发面临罢免，San Marcos
      成为得州首个禁止数据中心的城市。这一地方性阻力意味着 AI 算力扩张在选址、审批与社区关系上面临更高成本与更长周期，进而影响 AI 应用的算力供给与部署节奏（推断）。
    summary_en: 'In October 2026, opposition to data centers emerged across the Austin area in Texas:
      a planned project in Taylor faced resistance, the mayor and city council members in Temple faced
      recall attempts over data center development, and San Marcos became the first city in Texas to ban
      data centers. This local resistance implies higher costs and longer timelines for AI compute expansion
      in siting, permitting and community relations, which in turn affects compute supply and deployment
      pace for AI applications (inference).'
