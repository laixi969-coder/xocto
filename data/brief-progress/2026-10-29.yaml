    summary_zh: OpenAI的Ted Sanders于2026年10月公开解释其模型命名规则：模型按Luna<Terra<Sol<Astra排序，版本号同时表示发布顺序、与其他版本的关系及改进幅度。该说明让外部开发者能更准确判断模型规模与每token成本、可靠性之间的关系，有助于应用方做选型与成本预估；对采用率的具体影响属推断。
    summary_en: 'OpenAI''s Ted Sanders publicly explained in October 2026 the company''s model naming
      conventions: models are ordered Luna < Terra < Sol < Astra, and version numbers simultaneously signal
      release order, relationship to other releases, and magnitude of improvement. The explanation lets
      outside developers better judge the link between model size, per-token cost, and reliability, helping
      application builders with selection and cost estimation; the specific effect on adoption is an inference.'
    event_summary_zh: OpenAI的Ted Sanders于2026年10月公开说明模型命名规则，包括Luna<Terra<Sol<Astra的规模排序及版本号含义。
    event_summary_en: OpenAI's Ted Sanders publicly explained the model naming conventions in October
      2026, including the Luna < Terra < Sol < Astra size ordering and what version numbers signify.
  quoting-terk-terkowitz:
