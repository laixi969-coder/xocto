  creating-ai-value-with-enterprise-context:
    slug: creating-ai-value-with-enterprise-context
    name: Creating AI value with enterprise context
    decision: market_context
    summary_zh: 一项针对企业的调查显示，所有受访企业都在一定程度上使用 AI，但仅 16% 从部署中获得变革性价值，40% 仅在特定任务或团队看到中等收益，23% 收益极小或没有；38%
      仍处于试点阶段，35% 用于辅助员工工作，仅 12% 将 AI 智能体投入生产。这表明企业 AI 采用仍集中在试点与辅助场景，规模化交付与价值兑现存在明显落差。
    summary_en: A survey of enterprises found that all respondents use AI to some degree, but only 16%
      extract transformative value from deployments, 40% see moderate gains in specific tasks or teams,
      and 23% see minimal or no returns; 38% are still piloting use cases, 35% use AI to assist employees,
      and just 12% have AI agents in production. This indicates enterprise AI adoption remains concentrated
      in pilots and assistance scenarios, with a clear gap between deployment and scaled value delivery.
    event_summary_zh: 一项企业调查显示，仅 16% 的受访企业从 AI 部署中获得变革性价值，12% 已将 AI 智能体投入生产。
    event_summary_en: An enterprise survey found only 16% of respondents extract transformative value
      from AI deployments, and just 12% have AI agents in production.
