  野村ai军备竞赛有75的概率继续2027年存储芯片短缺已基本锁定:
    slug: 野村ai军备竞赛有75的概率继续2027年存储芯片短缺已基本锁定
    name: 野村：AI军备竞赛有75%的概率继续，2027年存储芯片短缺已基本锁定
    decision: market_context
    summary_zh: 野村在2026年10月25日发布判断，认为AI军备竞赛有75%的概率继续，2027年存储芯片短缺已基本锁定。这一判断指向AI算力扩张对存储供给的持续挤压，若短缺兑现，将推高AI训练与推理的硬件成本，并加剧云厂商与模型厂商在算力资源上的竞争；该结论为机构预测而非已发生事实。
    summary_en: Nomura stated on October 25, 2026 that it sees a 75% probability the AI arms race continues
      and that a memory chip shortage in 2027 is essentially locked in. The view points to sustained pressure
      on memory supply from AI compute expansion; if realized, it would raise hardware costs for AI training
      and inference and intensify competition for compute among cloud and model providers. This is a forecast,
      not a realized event.
    event_summary_zh: 野村于2026年10月25日给出判断：AI军备竞赛有75%的概率继续，2027年存储芯片短缺已基本锁定。
    event_summary_en: On October 25, 2026, Nomura stated it sees a 75% probability that the AI arms race
      continues and that a memory chip shortage in 2027 is essentially locked in.
