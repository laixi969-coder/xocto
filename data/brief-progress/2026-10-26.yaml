  metas-new-business-terms-make-customers-liable-for-its-ais-m:
    slug: metas-new-business-terms-make-customers-liable-for-its-ais-m
    name: Meta
    decision: market_context
    summary_zh: Meta 于 2026 年 10 月修改商业条款，将 AI 输出错误的责任转移给使用其 AI 的企业客户。这一责任分配变化提高了企业采用生成式 AI 的合规与法律风险成本，可能促使客户在合同中增加赔偿与保险安排，并影响其选择供应商时的风险评估。
    summary_en: In October 2026, Meta revised its business terms to shift liability for errors in its
      AI outputs onto enterprise customers using its AI. This reallocation raises the compliance and legal
      risk cost of adopting generative AI for enterprises, potentially prompting customers to add indemnity
      and insurance arrangements to contracts and affecting how they weigh vendor risk.
    event_summary_zh: Meta 修改商业条款，使用其 AI 的客户需对 AI 输出错误承担责任。
    event_summary_en: Meta revised its business terms so that customers using its AI bear liability for
      the AI's mistakes.
