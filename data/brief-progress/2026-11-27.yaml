      with a self-defined character; it stores conversation in local memory and can optionally reply by
      voice, giving the user an interaction that carries context forward. How characters are configured,
      the scope of memory and the voice pipeline still need verification.
    inspiration_en: 'Trend: character companionship is moving from generic chat toward personalized characters
      with long-term memory and voice, where local memory makes privacy and offline use a differentiator.
      Entry: start with fan-fiction, tabletop or virtual-streamer communities that already have defined
      characters, owning the character-card and memory-management step; the repository only describes
      a prototype and no payment path is disclosed, so this is inference.'
