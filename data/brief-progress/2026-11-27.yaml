    jobs_en:
    - knowledge workers handling heavy inbound email who triage their inbox and decide reply order
    regions: []
    regions_en: []
    open_source: false
    summary_zh: Kagi 的用户在收件箱里打开它，面对的是每天涌入的来信；按公开标语，它要把“需要你回复的人”排到前面，但具体接收什么材料、执行什么排序或摘要动作、最终交付什么界面，公开材料均未说明，具体流程或交付仍待核验。
