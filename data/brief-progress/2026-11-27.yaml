      demand_read:
        job_zh: 来信密集的知识工作者在每天打开收件箱时，要从大量邮件中判断哪些人需要自己先回复，并排出处理顺序。
        job_en: Knowledge workers with heavy inbound open their inbox daily and must judge which senders
          need a reply first, then order their work.
        pain_zh: 收件箱按时间排列，重要来信被淹没，判断优先级要逐封阅读，漏回会直接损失客户或关系。
        pain_en: Inboxes sort by time, important mail gets buried, prioritizing requires reading each
          message, and a missed reply costs a client or relationship.
        current_alternative_zh: 现在靠人工逐封扫读、加星标、建规则或文件夹，或借助通用邮件客户端的搜索与标签。
        current_alternative_en: Today people scan manually, star messages, build rules and folders, or
          rely on search and labels in generic mail clients.
        usage_reason_zh: 推断：若它真能按“谁在等你回复”重排收件箱，用户可跳过逐封判断优先级这一步，直接进入回复；但公开材料未说明排序依据与准确度，这一因果尚未被核验。
        usage_reason_en: 'Inference: if it truly reorders the inbox by who is waiting on a reply, users
          skip the per-message priority judgment and go straight to replying; the public material does
          not explain the ranking basis or accuracy, so this causal link is unverified.'
      gates:
