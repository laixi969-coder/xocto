  garimpo:
    slug: garimpo
    name: garimpo
    decision: queued
    event_summary_zh: 2026年11月24日公开的开源项目 garimpo 在仓库中获得约218个星标、68次分叉，描述其从 Google Maps 找商家、生成带商家名称的预览网站、在
      WhatsApp 沟通并通过 Pix、Mercado Pago 或 Stripe 收款，付款后自动成交，可运行在个人电脑、VPS 或 Vercel，并提供供 Claude Code、Codex、n8n
      调用的 API。
    event_summary_en: The open-source project garimpo, published around November 24, 2026, has about 218
      repository stars and 68 forks; it describes finding businesses on Google Maps, generating a preview
      website bearing each business's name, conversing on WhatsApp and charging via Pix, Mercado Pago
      or Stripe, closing automatically after payment, running on a personal computer, VPS or Vercel, with
      an API for Claude Code, Codex and n8n.
    category: AI + 商业
    project_type: open_source
    industries:
    - 小微企业服务
    - 本地生活服务
    - 数字营销
    industries_en:
    - small business services
    - local services
    - digital marketing
    jobs:
    - 自由职业者或小型建站服务商在开发本地小商户客户时，从 Google Maps 筛选商家、生成带商家名称的预览网站、在 WhatsApp 跟进并收款，以完成从找客户到成交的整条流程
    jobs_en:
    - Freelancers or small web-service providers prospecting local merchants pull businesses from Google
      Maps, generate a preview site bearing the merchant's name, follow up on WhatsApp and collect payment,
      completing the lead-to-close flow
    regions:
    - 巴西
    regions_en:
    - Brazil
    open_source: true
    summary_zh: 面向巴西本地小商户的建站与获客服务商，在找客户这一步打开它：它从 Google Maps 抓取商家，自动生成一个带该商家名称的预览网站，再通过 WhatsApp 联系并发送
      Pix、Mercado Pago 或 Stripe 收款链接，付款后流程自动结束。用户拿到的是可发给商家的预览站和收款动作；具体成交效果与人工确认环节仍待核验。
    inspiration: 趋势：获客、建站、沟通、收款被串成一条可自动跑完的流水线，卖的不再是工具而是“一个能收钱的客户”。切入：从巴西等 Pix 即时支付普及、小商户缺网站的市场进入，按成交或按站点收费；也可只做“地图找商家→预览站”这一段，把沟通与收款留给本地服务商。
    summary_en: 'For web-service providers selling to small local merchants in Brazil, it is opened at
      the prospecting step: it pulls businesses from Google Maps, auto-generates a preview site bearing
      each merchant''s name, contacts them on WhatsApp and sends Pix, Mercado Pago or Stripe payment links,
      ending the flow automatically after payment. The user gets a preview site to send and a payment
      action; actual close rates and the human confirmation step still need verification.'
    inspiration_en: 'Trend: prospecting, site building, messaging and payment are chained into one automatable
      pipeline, selling a payable customer rather than a tool. Entry: start in markets where instant payment
      like Pix is widespread and small merchants lack websites, charging per close or per site; or own
      only the map-to-preview step and leave messaging and collection to local providers.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 自由职业者或小型建站服务商要开发本地小商户客户：从 Google Maps 找商家、做预览站、在 WhatsApp 跟进并收款，完成从线索到成交。
        job_en: 'Freelancers or small web-service providers prospecting local merchants: find businesses
          on Google Maps, build a preview site, follow up on WhatsApp and collect payment, from lead to
          close.'
        pain_zh: 找商家、逐个做样品站、反复在 WhatsApp 沟通、再单独收款，每一步都要手工切换工具，线索多时做不过来，也容易在跟进环节流失。
        pain_en: Finding merchants, building a sample site for each, messaging repeatedly on WhatsApp
          and collecting payment separately means manual tool-switching; at volume it does not scale and
          leads drop in follow-up.
        current_alternative_zh: 用表格或地图手工整理商家名单，用建站工具逐个搭样品，用 WhatsApp 手动发消息，再用支付链接或银行转账收款。
        current_alternative_en: Manually compiling merchant lists from maps or spreadsheets, building
          samples one by one in site builders, messaging by hand on WhatsApp, and collecting via payment
          links or bank transfer.
        usage_reason_zh: 推断：相较手工逐个搭站和跟进，它把“地图找商家→生成带商家名的预览站→WhatsApp 发送→收款链接”连成一次可重复执行的动作，省去为每个商家单独建站和整理联系记录的那一步，因此接单量大的本地建站服务商会选择它。
        usage_reason_en: 'Inference: versus building and following up by hand, it chains map search, name-bearing
          preview generation, WhatsApp outreach and payment links into one repeatable action, removing
          the per-merchant site-building and contact-logging step, so high-volume local web providers
          would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地建站服务商从找商家到收款的整条手工流程，痛点具体且不采用就会流失线索；买方是服务商自身，是否付费未核验。
        evidence_ids:
        - ev-37f8dcb3f534dd51
        - ev-bbfac00b92e024cf
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标与分叉，属于关注度信号，未见商家或服务商的使用反馈与持续采用证据。
        evidence_ids:
        - ev-bbfac00b92e024cf
      - gate: model
        status: insufficient
        reason: 开源项目本身不披露收费方式，钱可能来自服务商自用或二次分发，属判断而非已验证事实。
        evidence_ids:
        - ev-37f8dcb3f534dd51
      - gate: truth
        status: insufficient
        reason: 自动生成的预览站与 WhatsApp 群发是否被商家接受、成交是否真实发生，公开材料未给出结果数据。
        evidence_ids:
        - ev-37f8dcb3f534dd51
      next_validation: 收集该仓库的 issue 与 discussion，查找是否有服务商报告实际成交或商家反馈的公开记录。
