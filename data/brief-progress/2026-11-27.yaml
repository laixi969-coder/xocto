    summary_en: A Nov 26, 2026 report said AI is disrupting the commercial imaging market, pressuring
      photographers' orders while tool companies seek new growth. This implies image-generation AI is
      substituting part of commercial shooting demand, squeezing traditional imaging service revenue and
      shifting value toward tools and platforms; the material gives no order-decline figures or company
      data, so the impact is a directional inference.
    event_summary_zh: 2026年11月26日报道称，AI冲击商业影像市场，摄影师订单承压，工具公司正在寻找增量。
