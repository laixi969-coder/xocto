        status: insufficient
        reason: 未披露定价与买方，推断可能面向个人订阅或团队席位，但这是判断而非已验证事实。
        evidence_ids:
        - ev-b1bc165032a07c10
      - gate: truth
        status: insufficient
        reason: 隐私邮箱承诺能否确定性交付、排序是否准确、人工是否仍需复核，公开材料均未说明。
        evidence_ids:
