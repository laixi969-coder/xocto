        usage_reason_zh: 推断：相较手动复制汇总或另开通用聊天窗口，豆包工作与飞书8.0原生融合，智能体可直接在协同办公主流程中接收文档与消息并执行整理或任务操作，减少来回切换与重复转写这一步；需要把办公材料直接变成任务结果的团队会因此选择它。
        usage_reason_en: 'Inference: compared with manual copying and consolidation or opening a separate
          general chat window, Doubao Work is natively integrated with Feishu 8.0, so agents can take
          in documents and messages within the core collaboration workflow and carry out organizing or
          task actions, removing the step of switching back and forth and retyping; teams that need office
          material turned directly into task outcomes would choose it for this reason.'
      gates:
      - gate: value
        status: supported
        reason: 它解决办公材料分散、人工汇总耗时的问题，智能体在协同办公主流程中接收文档与消息并执行任务，痛点与旧替代行为可还原；买方与付费方式尚未公开。
