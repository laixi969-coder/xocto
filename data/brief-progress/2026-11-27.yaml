      round and reached a $1 billion valuation about four months after launch; who opens it at which work
      step, what material it receives, what actions it performs and what it delivers are not provided,
      so the concrete workflow and output still need verification.
    inspiration_en: 'Trend: a general AI assistant reaching a large round and a high valuation within
      months shows capital betting on assistants as the default entry point for everyday tasks. Entry:
      the frontal window for general assistants is occupied by capital and distribution, so newcomers
      should enter through one high-frequency task for a specific group, turning a defined kind of material
      into a deliverable result rather than building another all-purpose chat entry; pricing is undisclosed
      and not assumed.'
