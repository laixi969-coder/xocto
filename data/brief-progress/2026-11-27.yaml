    summary_zh: 个人在临时要买食材、订周末火车票、买日用品、订花或找球场时，用短信或电话把需求发给 Instinct，它像人一样操作手机和电脑代为下单或预订，用户拿到已执行的订单或预订结果，仍需自己确认。具体执行范围、失败处理和收费方式在公开材料中未说明，流程与交付仍待核验。
    inspiration: 趋势：个人助理正从“回答问题”走向“替你操作手机和电脑完成下单、订票这类有明确结果的杂事”。切入：可从高频、低金额、失败代价小的本地生活代办切入，例如周末家庭采购与场地预订，按成功完成的订单收费；但支付授权、退款责任和失败兜底是必须先解决的环节，公开材料尚未披露这些机制。
    summary_en: When an individual suddenly needs groceries, a weekend train ticket, household supplies,
      flowers, or a court, they text or call Instinct, which operates a phone and computer like a person
      to place the order or booking; the user gets an executed order or reservation and still confirms
      it. Public material does not state execution scope, failure handling, or pricing, so the workflow
      and delivery remain unverified.
    inspiration_en: 'Trend: personal assistants are moving from answering questions to operating a phone
      and computer to finish concrete chores such as ordering and booking. Entry: start with frequent,
      low-value local errands where failure is cheap, such as weekend household shopping and court booking,
      and charge per completed order; payment authorization, refund liability, and failure fallback must
      be solved first, and public material does not yet disclose them.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在临时需要采购食材、订周末火车票、买日用品、订花或找球场时，用短信或电话把需求交给助手，由它代为操作手机和电脑完成下单或预订，用户拿到已执行的订单或预订结果并自行确认。
        job_en: An individual who suddenly needs groceries, a weekend train ticket, household supplies,
          flowers, or a court sends the request by text or phone; the assistant operates a phone and computer
          to place the order or booking and returns an executed result for the user to confirm.
        pain_zh: 这些杂事单笔金额小但要在多个应用间切换、填地址、比价和反复确认，打断正在做的事；不做的后果是要么拖延，要么花时间自己跑完整个下单流程。
        pain_en: These errands are small in value but require switching between apps, entering addresses,
          comparing options, and repeated confirmation, interrupting whatever the user is doing; skipping
          them means delay or spending time completing the whole ordering flow manually.
        current_alternative_zh: 用户现在自己在电商、生鲜、铁路和场馆预订应用里逐项操作，或让家人朋友代办；通用对话助手能给出建议但通常不能直接完成下单。
        current_alternative_en: Users currently operate e-commerce, grocery, rail, and venue-booking apps
          themselves, or ask family and friends; general chat assistants can advise but usually cannot
          complete the order.
        usage_reason_zh: 推断：相较自己在多个应用里逐项下单，Instinct 通过短信或电话接收一句需求并直接操作手机和电脑完成下单或预订，省去切换应用和填写信息的步骤，因此怕麻烦、时间碎片化的个人会在临时采购和周末出行安排时尝试它；公开材料尚无留存或复购证据。
        usage_reason_en: 'Inference: compared with ordering item by item across apps, Instinct takes one
          text or call and operates a phone and computer to complete the order or booking, removing app
          switching and form filling, so convenience-seeking individuals with fragmented time may try
          it for ad-hoc shopping and weekend plans; public material shows no retention or repeat-use evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决个人临时采购、订票、订场地这类杂事要在多个应用间切换和填写信息的麻烦，旧做法是自己逐项操作或找人代办，不做的后果是拖延或占用时间；买方是个人用户，付费方式未披露。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-40c38047ef2de745
      - gate: consensus
        status: insufficient
        reason: 公开材料只有官网产品说明，没有用户评价、客户案例或采用数据，无法判断用户是否真的把这类代办交给它；场景本身清晰，卡在采用证据。
        evidence_ids:
        - ev-fb85b5d60137bdcd
        - ev-770b0fa6cb4c42d6
      - gate: model
        status: insufficient
        reason: 官网未披露定价、收费方式或买方结构；推断可能按订单或订阅向个人收费，但这是判断而非已验证事实，支付授权与退款责任也未说明。
        evidence_ids:
        - ev-0b8efa462a241b8b
      - gate: truth
        status: insufficient
        reason: 代为下单涉及支付授权、失败兜底和退款责任，公开材料未说明它如何保证订单确定性交付，也未说明人工接管边界，需核验后才能判断承诺能否兑现。
        evidence_ids:
        - ev-40c38047ef2de745
        - ev-770b0fa6cb4c42d6
      next_validation: 收集 Instinct 官网的定价页或帮助文档，确认其收费方式、支付授权与下单失败时的退款和人工接管规则。
