  sample-reverse-spec-flow:
    slug: sample-reverse-spec-flow
    name: sample-reverse-spec-flow
    decision: watching
    event_summary_zh: 2026年11月13日，AWS 的示例仓库发布该工作流：用 AI 编码代理把现有源码反向生成带 path:line 引用的规格说明，并由独立校验代理核对；仓库星标从48增至79。
    event_summary_en: 'On 2026-11-13, an AWS samples repository published this workflow: an AI coding
      agent turns existing source code into specifications with path:line citations, checked by a separate
      verifier agent; repository stars rose from 48 to 79.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 维护遗留系统的工程师在接手无文档代码库时，让 AI 代理读取源码并产出带行号引用的规格说明，再由校验代理核对后用于维护或重构
    jobs_en:
    - Engineers maintaining legacy systems, when taking over an undocumented codebase, have an AI agent
      read the source and produce line-cited specifications, verified by a checker agent, for maintenance
      or refactoring
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 接手无文档旧代码库的工程师打开它，把现有源码交给 AI 编码代理，代理逐条生成带 path:line 引用的规格说明，再由独立校验代理核对；用户拿到可追溯的规格文档，用于维护现有系统或按规格重做应用，最终判断仍需人工确认。
    inspiration: 趋势：AI 编码正从“写新代码”转向“读懂存量代码”，规格成为人与代理之间的中间交付物。切入：从外包维护、遗留系统迁移这类无文档代码库密集的环节进入，按项目交付规格文档而非卖席位；仓库目前只是示例，尚无付费与采用证据。
    summary_en: Engineers inheriting an undocumented legacy codebase open it, hand the existing source
      to an AI coding agent that writes specifications with path:line citations, and a separate verifier
      agent checks them; users get a traceable spec document for maintaining the system or rebuilding
      the app spec-first, with final judgment still human.
    inspiration_en: 'Trend: AI coding is shifting from writing new code to reading existing code, with
      specs as the handoff artifact between people and agents. Entry: start where undocumented codebases
      cluster, such as outsourced maintenance and legacy migration, selling delivered spec documents per
      project rather than seats; the repo is only a sample with no payment or adoption evidence yet.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 维护遗留系统的工程师在接手无文档代码库时，让 AI 代理读取源码并产出带行号引用的规格说明，再由校验代理核对后用于维护或重构。
        job_en: Engineers maintaining legacy systems, when taking over an undocumented codebase, have
          an AI agent read the source and produce line-cited specifications, verified by a checker agent,
          for maintenance or refactoring.
        pain_zh: 旧代码库缺少文档，工程师只能逐文件阅读、口头询问原作者或凭猜测改动，理解成本高且改动风险大。
        pain_en: Legacy codebases lack documentation, so engineers read file by file, ask original authors
          informally, or change code by guesswork, with high comprehension cost and change risk.
        current_alternative_zh: 人工通读源码、翻找零散注释与提交记录，或依赖离职同事的口头说明；也有团队用通用编码助手做零散问答，但缺少可追溯的规格产出。
        current_alternative_en: Manually reading source, hunting scattered comments and commit history,
          or relying on departing colleagues' verbal notes; some teams use general coding assistants for
          ad-hoc Q&A but get no traceable spec output.
        usage_reason_zh: 相较人工通读，它让代理一次性产出逐条带 path:line 引用的规格，并由独立校验代理核对，减少“读完仍说不清依据”的返工；推断接手遗留系统的团队在需要可审计文档时会选择它。
        usage_reason_en: Compared with manual reading, it has the agent produce specifications with per-statement
          path:line citations, checked by a separate verifier agent, reducing rework when readers cannot
          trace the basis; by inference, teams inheriting legacy systems choose it when auditable documentation
          is needed.
      gates:
      - gate: value
        status: supported
        reason: 它解决接手无文档旧代码库时理解成本高、改动依据不清的痛点，产出带行号引用且经校验的规格，交付可核对。
        evidence_ids:
        - ev-38ef00d4553688c6
      - gate: consensus
        status: insufficient
        reason: 仓库星标从48增至79，属关注度信号，未见用户评价或团队采用案例，无法判断是否进入日常工作流。
        evidence_ids:
        - ev-b02c5595da1e060e
        - ev-38ef00d4553688c6
      - gate: model
        status: insufficient
        reason: 这是 AWS 示例仓库，未见定价、付费路径或买方说明；谁付钱只能推断为需要遗留系统维护的企业或外包团队。
        evidence_ids:
        - ev-38ef00d4553688c6
      - gate: truth
        status: supported
        reason: 规格逐条引用源码位置并由独立代理校验，贴近“理解代码”的第一性目标；但校验代理能否覆盖全部语义仍缺实测。
        evidence_ids:
        - ev-38ef00d4553688c6
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有团队报告在真实遗留代码库上使用并复用的记录。
