    open_source: false
    summary_zh: 非技术创业者或小商家在需要一个小型移动应用时，在对话里描述想要的应用，系统据此生成一个可在手机上打开的初版应用，用于验证想法或内部试用。具体生成范围、可修改程度与交付形态仍待核验。
    inspiration: 趋势：把“描述需求”直接变成可运行应用，正在把应用开发的前置环节从写代码前移到说清需求。切入：从餐饮、零售、地产中介这类只需要预约、展示、登记等单一流程的小商家入手，按可上架的成品或按次交付收费，而不是卖开发工具；先解决生成后如何修改和上架这一段。
    summary_en: When a non-technical founder or small merchant needs a small mobile app, they describe
      it in chat and the system generates an initial app that opens on a phone, for idea validation or
      internal trial. The generation scope, editability and delivery format still need verification.
    inspiration_en: 'Trend: turning a described requirement directly into a runnable app moves the front
      step of app building from writing code to stating the need clearly. Entry: start with small merchants
      in food service, retail or real-estate brokerage that need only one flow such as booking, display
      or registration, and charge per delivered or publishable app rather than selling a dev tool; first
      solve how generated apps are edited and published.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 非技术创业者或小商家想要一个只做预约、展示或登记的小型移动应用，在对话里描述需求，拿到可在手机上打开的初版用于验证或内部试用。
        job_en: A non-technical founder or small merchant wants a small mobile app for booking, display
          or registration only; they describe it in chat and get an initial version that opens on a phone
          for validation or internal trial.
        pain_zh: 这类人没有开发能力，找外包要反复沟通需求、报价和排期，周期长且前期成本高；自己用建站或低代码工具又常卡在移动端打包与上架。
        pain_en: Such users cannot code; outsourcing requires repeated requirement discussions, quotes
          and scheduling with long lead times and high upfront cost, while site builders and low-code
          tools often stall at mobile packaging and store publishing.
        current_alternative_zh: 找外包或兼职开发者、用低代码/建站工具自行搭建，或干脆用微信群、表单和现成 SaaS 模板凑合。
        current_alternative_en: Hiring an agency or freelance developer, self-building with low-code or
          site builders, or making do with chat groups, forms and off-the-shelf SaaS templates.
        usage_reason_zh: 推断：相较先写需求文档再等外包排期，它把“说清想要什么”直接变成可打开的应用，省去需求转译和首轮开发等待，因此没有技术团队、只想先验证想法的小商家会在起步阶段试用；但生成后能否修改、能否上架尚无公开证据。
        usage_reason_en: 'Inference: compared with writing a spec and waiting for an agency schedule,
          it turns a stated need directly into an openable app, skipping requirement translation and the
          first development wait, so small merchants without a technical team who want to validate an
          idea would try it early; whether generated apps can be edited or published has no public evidence
          yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决非技术小商家想要一个简单移动应用却不会开发、外包又慢又贵的问题，旧做法是外包或低代码拼凑，痛点具体且交付可指向可打开的应用。
        evidence_ids:
        - ev-8762c6367fcf3a19
      - gate: consensus
        status: insufficient
        reason: 仅有产品页一句描述，没有用户评价、案例或采用数据，无法判断非技术用户是否真的会用它替代外包。
        evidence_ids:
        - ev-8762c6367fcf3a19
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，推断可能按次或按成品向小商家收费，但这是判断而非已验证事实。
        evidence_ids:
        - ev-8762c6367fcf3a19
      - gate: truth
        status: insufficient
        reason: 生成的应用能否修改、能否上架、由谁确认结果均未说明，交付确定性无法核对。
        evidence_ids:
        - ev-8762c6367fcf3a19
      next_validation: 收集 iwantmy.app 官方产品页或文档中关于生成应用可修改范围、导出与上架方式的说明。
