  linger:
    slug: linger
    name: Linger
    decision: watching
    category: 通用助手
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 个人用户在本地电脑上处理私人文件与日常任务时，让本地代理读取本机材料并执行操作
    - 个人用户在不愿把资料上传云端时，用本地模型完成问答与任务处理
    jobs_en:
    - Individual users running a local agent on their own PC to read local materials and carry out everyday
      tasks
    - Individual users completing Q&A and tasks with a local model when they do not want to upload materials
      to the cloud
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人用户在自己的电脑上打开 Linger，把原本要交给云端助手的本机文件与日常任务交给本地运行的代理处理；它通过模型与运行框架的协同设计，让普通电脑也能跑起本地模型。用户最终拿到在本机完成的处理结果，具体支持哪些任务、交付形态与人工确认环节仍待核验。
    inspiration: 趋势是个人代理开始往本地跑，把隐私敏感的资料留在设备上，绕开对云端大厂入口的依赖。切入可考虑对数据不能出本机有硬约束的人群，例如处理合同、病历草稿或客户资料的小团队与自由职业者，卖法可以是本地部署与维护服务；但本地算力门槛与体验差距仍是待解环节。
    summary_en: Individual users open Linger on their own PC and hand local files and everyday tasks to
      an agent that runs on the machine instead of a cloud assistant; it co-designs model and runtime
      so ordinary computers can run local models. Users get results produced locally, while which tasks
      are supported, the delivery form and any human confirmation step still need verification.
    inspiration_en: The trend is personal agents moving on-device, keeping sensitive material on the machine
      and bypassing cloud gatekeepers. An entry point is people with hard constraints that data cannot
      leave the PC, such as small teams and freelancers handling contracts, draft medical notes or client
      records, sold as local deployment and maintenance; local compute limits and experience gaps remain
      open problems.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在自己的电脑上处理不愿上传云端的私人文件与日常任务时，让本地代理读取本机材料并完成问答或操作。
        job_en: Individual users working on private files and everyday tasks they do not want to upload,
          letting a local agent read local materials and complete Q&A or actions on their own PC.
        pain_zh: 把敏感资料交给云端助手存在隐私与数据外流顾虑，而完全不用 AI 又要手工完成整理、检索与写作。
        pain_en: Handing sensitive material to cloud assistants raises privacy and data-leakage concerns,
          while doing without AI means manual sorting, searching and writing.
        current_alternative_zh: 使用云端通用助手，或干脆手工处理本机文件；部分用户自行搭建本地模型环境。
        current_alternative_en: Using cloud general assistants, or handling local files by hand; some
          users set up local model environments themselves.
        usage_reason_zh: 推断：相较云端助手，Linger 把模型与运行框架一起放在本机，用户不必先把文件上传即可处理，因此对数据不能出设备、又缺少自行搭建本地环境能力的用户，会在处理敏感材料时选择它；公开材料尚未给出留存或重复使用证据。
        usage_reason_en: 'Inference: unlike cloud assistants, Linger keeps model and runtime on the machine
          so users can process files without uploading first; users whose data cannot leave the device
          and who lack the skill to build a local setup themselves would choose it for sensitive material.
          Public material gives no retention or repeat-use evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决不愿把私人资料交给云端时的本地处理需求，痛点是有隐私顾虑又要用 AI 辅助，旧做法是云端助手或纯手工；交付能否稳定发生仍待核验。
        evidence_ids:
        - ev-44138ed38a41146c
        - ev-3e389a76f0b02aa3
      - gate: consensus
        status: insufficient
        reason: 仓库关注度持续上升，但只有星标与 fork 等关注度信号，没有用户评价或采用案例说明谁在什么场景下持续使用。
        evidence_ids:
        - ev-3e389a76f0b02aa3
        - ev-c9530a9a4540d33e
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或商业交付路径；这是判断，不是已验证事实。
        evidence_ids:
        - ev-44138ed38a41146c
      - gate: truth
        status: insufficient
        reason: 本地运行贴近隐私诉求，但普通电脑上的实际可用性、任务完成质量与人工边界均无公开实测支持。
        evidence_ids:
        - ev-3e389a76f0b02aa3
      next_validation: 收集 Linger 仓库的 issue 与 discussion，确认用户实际用它处理哪些本机任务、是否重复使用及遇到的主要失败环节。
