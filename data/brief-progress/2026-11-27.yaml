    summary_zh: 个人量化投资者或研究员在评估美股交易策略时，把冻结时点的历史价格、VIX 和新闻交给 LLM 智能体回测，每次运行做前视检查，并在公开榜单上对比不同智能体表现；用户拿到回测结果与排名，是否接入实盘仍需自行判断。具体交付流程与实盘风控细节仍待核验。
    inspiration: 趋势：LLM 智能体进入金融回测，竞争点从“能不能生成信号”转向“回测是否可复现、是否偷看未来”。切入：可从独立量化爱好者和小型投研团队入手，卖可审计的回测与榜单服务，而非直接卖交易信号；实盘接入的合规与风控是尚未拆开的环节。
