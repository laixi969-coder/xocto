        - ev-9b7b877f5939153f
      - gate: consensus
        status: insufficient
        reason: 星标从约 2.15 万升至约 2.40 万，只说明关注度上升，不能证明开发者已把它放进工作流。
        evidence_ids:
        - ev-c0e57330d198fe4a
        - ev-9b7b877f5939153f
      - gate: model
        status: insufficient
        reason: 未进入：材料未披露任何定价、买方或收费方式，无法判断钱从哪来。
        evidence_ids:
        - ev-9b7b877f5939153f
      - gate: truth
        status: insufficient
        reason: 未进入：缺少功能说明与交付结果，无法核对它是否贴近任务第一性目标或能否确定性交付。
