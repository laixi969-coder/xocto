        usage_reason_zh: 推断：Nexus 通过 MCP 把本地文件、终端与 Git 直接暴露给网页助手，并按用户设定权限执行，省去复制粘贴与手动搬运上下文这一步，因此在意权限边界的开发者在处理本地仓库任务时会选择它。
        usage_reason_en: 'Inference: Nexus exposes local files, terminals, and Git to the web assistant
