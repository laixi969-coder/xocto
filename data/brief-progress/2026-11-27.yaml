        current_alternative_zh: 现有做法是经纪商或后台人员人工逐页翻阅文件并手工标记缺失项。
        current_alternative_en: The current approach is brokers or back-office staff manually paging through
          documents and flagging missing items by hand.
        usage_reason_zh: 推断：产品把文件审查交给自动流程，减少人工逐页翻阅与手工标记缺失项这一步，使经纪商在申请量集中时更快得到完整性结论；材料未提供用户反馈或客户案例支持该动机。
