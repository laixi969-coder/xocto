    inspiration_en: 'Trend: small, highly curated offline social matching is being repackaged as a subscription
      service, with people paying for ''one arranged meeting'' rather than browsing their own contacts.
      Entry: start with one specific occupational group in one city (e.g. junior City of London professionals
      or independent designers) and charge per match or per quarter; the moat is local curation and fulfilment,
      not model capability.'
