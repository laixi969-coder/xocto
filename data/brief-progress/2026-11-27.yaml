  dsh-projects:
    slug: dsh-projects
    name: DSH-projects
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者用一句话描述目标后，由插件追问不清楚之处并并行执行任务，最后取回完成的工作
    jobs_en:
    - Developers state a one-sentence goal, the plugin asks clarifying questions, runs tasks in parallel
      and returns finished work
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在 DeepSeek Harness 里用一句话给出目标，插件先追问不清楚的地方，再并行跑任务并把完成结果交回。它替代的是开发者自己拆解任务、逐条下发并汇总的步骤；具体交付质量与人工复核环节仍待核验。
    inspiration: 趋势：围绕单一模型工作台做“目标进、成品出”的编排插件正在出现，说明竞争从模型能力转向任务拆解与回收这一层。切入：可从需要批量并行处理同类任务的开发团队或数据整理场景进入，按完成的任务量或项目交付计费；但插件依附于特定工作台，迁移风险高，需先确认它是否真能减少返工。
    summary_en: Inside DeepSeek Harness, a developer states a goal in one sentence; the plugin asks what
      is unclear, runs tasks in parallel and returns finished work. It replaces the developer's own steps
      of splitting tasks, dispatching them one by one and merging results; delivery quality and the human
      review step still need verification.
    inspiration_en: 'Trend: orchestration plugins around a single model workbench that take a goal and
      return finished work are appearing, shifting competition from raw model ability to task decomposition
      and result collection. Entry: target development teams or data-cleanup workflows that need many
      similar tasks run in parallel, charging per completed task or project; but the plugin depends on
      one workbench, so lock-in risk is high and whether it truly cuts rework must be checked first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者面对一个笼统目标时，需要把它拆成可执行子任务并逐条跟进，最后汇总成可用产出。
        job_en: Given a broad goal, a developer must split it into executable subtasks, track each one
          and merge them into usable output.
        pain_zh: 拆解、逐条下发和汇总结果占用大量时间，目标含糊时还要反复澄清，容易返工。
        pain_en: Splitting, dispatching and merging results takes much time, and vague goals force repeated
          clarification and rework.
        current_alternative_zh: 开发者手动在对话式模型里逐条提问、自己记录进度并拼接结果。
        current_alternative_en: Developers manually prompt a chat model step by step, track progress themselves
          and stitch results together.
        usage_reason_zh: 推断：插件先追问不清楚之处再并行执行，减少了开发者自己拆任务和逐条催问的步骤，因此面对多子任务目标的人会尝试它；但尚无用户反馈证明它减少了返工。
        usage_reason_en: 'Inference: by asking clarifying questions first and then running tasks in parallel,
          the plugin removes the developer''s own steps of splitting tasks and chasing each one, so people
          facing multi-subtask goals may try it; no user feedback yet shows it reduces rework.'
      gates:
      - gate: value
        status: supported
        reason: 它解决把笼统目标拆成子任务并汇总的负担，旧做法是手动逐条提问，痛点具体；但交付是否可靠仍缺证据。
        evidence_ids:
        - ev-14c28413bc99312e
        - ev-355de3737d76df12
      - gate: consensus
        status: insufficient
        reason: 只有仓库收藏数在增长，没有用户评价或讨论说明谁在什么场景持续使用。
        evidence_ids:
        - ev-355de3737d76df12
      - gate: model
        status: insufficient
        reason: 开源插件，未见定价或付费路径；买方可能是开发者个人或团队，属判断而非已验证事实。
        evidence_ids:
        - ev-14c28413bc99312e
      - gate: truth
        status: insufficient
        reason: 依附特定工作台，承诺的“完成工作”能否确定性交付、人工复核边界如何，公开材料未说明。
        evidence_ids:
        - ev-14c28413bc99312e
      next_validation: 收集该仓库的 issue 与 discussion，查看使用者报告的实际任务类型、返工情况和人工复核环节。
    event_summary_zh: 2026 年 11 月 17 日发布的开源插件 DSH-projects 在 DeepSeek Harness 上提供一句话目标、追问澄清、并行执行并交回结果的工作流；仓库收藏数从
      11 月 24 日的 422 增至 11 月 27 日的 506。
    event_summary_en: 'Open-source plugin DSH-projects, published on 17 November 2026, offers a workflow
      on DeepSeek Harness: one-sentence goal, clarifying questions, parallel execution and returned results;
      repository stars rose from 422 on 24 November to 506 on 27 November.'
