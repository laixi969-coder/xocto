        evidence_ids:
        - ev-5ca15e26646a01ee
      - gate: model
        status: insufficient
        reason: MIT 免费开源，未见定价、付费路径或代运营收费模式，钱从哪来尚不明确，这是判断不是已验证事实。
        evidence_ids:
