    summary_zh: 开发者在用网页版 AI 助手处理本地代码时，通过 Nexus 以 MCP 把助手接到本地文件、终端、Git 和桌面工具，并按用户设定的权限执行读取或操作；最终交付是助手在本地环境完成的具体动作，权限边界由用户控制。具体支持哪些工具、失败如何处理仍待核验。
    inspiration: 趋势是网页 AI 助手与本地开发环境的连接正被标准化为可授权通道，权限控制成为独立一层。切入可从需要审计与最小授权的团队开发场景进入，卖合规可控的本地接入与权限策略，而非再做一个通用助手。
    summary_en: When developers use web-based AI assistants on local code, Nexus connects the assistant
      via MCP to local files, terminals, Git, and desktop tools, executing reads or actions under user-set
      permissions. The deliverable is the concrete action performed in the local environment, with the
      user controlling permission boundaries. Which tools are supported and how failures are handled still
      need verification.
    inspiration_en: 'The trend is that linking web AI assistants to local dev environments is being standardized
      as an authorizable channel, with permission control becoming its own layer. Entry point: team development
      scenarios needing audit and least-privilege access, selling controllable local access and permission
      policy rather than another general assistant.'
