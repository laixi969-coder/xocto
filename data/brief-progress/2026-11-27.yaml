      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在应用需要发送注册确认、密码重置等事务性邮件时，让编码助手生成发送代码并选定邮件服务商，随后完成域名验证与投递配置。
        job_en: When an app needs transactional email such as signup confirmations and password resets,
          developers ask a coding assistant to generate sending code and pick a provider, then complete
          domain verification and delivery setup.
        pain_zh: 邮件接入涉及 API 调用、域名 DNS 记录、退信与垃圾邮件处理，开发者不熟悉时容易卡在送达失败；选错服务商后迁移成本高。
        pain_en: Email integration involves API calls, domain DNS records, and bounce or spam handling;
          unfamiliar developers get stuck on failed delivery, and migrating after picking the wrong provider
