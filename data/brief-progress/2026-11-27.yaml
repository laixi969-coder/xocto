      prices, VIX and news to LLM agents for backtesting, with a look-ahead check on every run and a public
      leaderboard comparing agents; users get backtest results and rankings, while live-trading risk controls
      remain to be verified.
    inspiration_en: 'Trend: LLM agents are entering financial backtesting, and the battleground shifts
      from generating signals to reproducible, look-ahead-free evaluation. Entry: target independent quant
      hobbyists and small research teams with auditable backtesting and leaderboard services rather than
      trading signals; live-trading compliance and risk control remain an unopened step.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人量化投资者或研究员在评估美股交易策略时，把冻结时点的历史价格、VIX 与新闻交给 LLM 智能体回测，并核对是否偷看未来数据。
        job_en: Individual quant investors or researchers backtest US stock strategies by feeding point-in-time
          prices, VIX and news to LLM agents and checking for look-ahead bias.
        pain_zh: LLM 交易智能体的回测常因数据泄漏或偷看未来而虚高，投资者难以判断策略是否真实有效。
        pain_en: LLM trading agent backtests are often inflated by data leakage or look-ahead bias, making
          it hard to judge whether a strategy truly works.
        current_alternative_zh: 自己写脚本回测、用通用量化框架，或直接相信智能体给出的收益曲线。
        current_alternative_en: Writing custom backtest scripts, using generic quant frameworks, or simply
