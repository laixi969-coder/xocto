        usage_reason_en: 'Inference: it merges build import, real PoB calculation and Wiki/trade lookups
          into one conversational request, removing window-switching and manual entry, so players would
          pick it when tuning a build and needing quick number checks; no retention or payment evidence
          yet.'
      gates:
