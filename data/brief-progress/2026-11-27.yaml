  英国央行警告ai融资规模与广度威胁金融稳定:
    slug: 英国央行警告ai融资规模与广度威胁金融稳定
    name: 英国央行
    decision: market_context
    summary_zh: 英国央行警告AI相关融资的规模与广度已对金融稳定构成威胁，大型科技公司债务及表外承诺合计超过4万亿美元。这意味着AI基础设施扩张的杠杆与隐性负债正在成为监管关注对象，若融资环境收紧，AI应用与模型开发的资本成本可能上升，行业竞争将更依赖自有现金流而非债务扩张。
    summary_en: The Bank of England warned that the scale and breadth of AI-related financing threatens
      financial stability, with large technology companies' debt and off-balance-sheet commitments exceeding
      $4 trillion. This means the leverage and hidden liabilities behind AI infrastructure expansion are
      becoming a regulatory concern; if financing conditions tighten, the cost of capital for AI applications
      and model development could rise, and competition will depend more on internal cash flow than debt-funded
      expansion.
    event_summary_zh: 英国央行公开警告AI融资的规模与广度威胁金融稳定，并指出大型科技公司债务及表外承诺合计超过4万亿美元。
    event_summary_en: The Bank of England publicly warned that the scale and breadth of AI financing threatens
      financial stability, noting that large technology companies' debt and off-balance-sheet commitments
      together exceed $4 trillion.
  英国央行警告ai融资风险:
