    inspiration: 趋势：把专业桌面工具的计算内核开放给 AI 代理调用，正在把“玩家自己开软件逐项点算”变成对话式查询。切入：从硬核游戏社区这类自带高密度数据与付费意愿的玩家群进入，围绕构筑校验、装备比价做结果型服务，而非再做一个通用聊天入口。
