          hand, or use commercial companion apps; the former has no persistent memory and the latter keeps
          data on the platform side.
        usage_reason_zh: 推断：相较每次手动重述设定，它把角色设定与对话历史存在本地并由程序自动带入下一轮，减少重复交代这一步，因此在意隐私、想长期维持同一角色的用户会试用；尚无留存或付费证据。
