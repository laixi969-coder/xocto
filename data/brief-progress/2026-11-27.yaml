    summary_zh: 安全研究人员或移动开发者在分析 Android 应用的原生库时打开它，把 ARM64 的 .so 二进制交给模拟器执行，工具做零拷贝追踪并通过 RPC/MCP 接口返回执行信息；用户拿到的是可复核的追踪结果，具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：移动端逆向与原生库分析长期依赖零散脚本和商业逆向工具，开源侧出现把模拟执行与追踪打包成可调用服务的尝试。切入：从移动应用安全审计与合规检测团队进入，按分析任务或私有部署收费；但当前只有仓库描述与星标，真实使用与付费路径未公开。
    summary_en: 'Security researchers or mobile developers open it when analyzing Android native libraries:
      they hand an ARM64 .so binary to the emulator, which performs zero-copy tracing and exposes execution
      information via RPC/MCP interfaces. Users get traceable execution output; the exact deliverable
      and human review step still need verification.'
    inspiration_en: 'Trend: mobile reverse engineering and native library analysis have long relied on
      scattered scripts and commercial reversing tools; open source is starting to package emulated execution
      and tracing as callable services. Entry: start with mobile app security audit and compliance teams,
      charging per analysis task or private deployment; currently only a repository description and stars
      are public, with real usage and payment paths undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全研究人员在审计 Android 应用时，需要观察 ARM64 原生库的执行过程，用该工具追踪二进制调用并定位可疑行为。
        job_en: Security researchers auditing Android apps need to observe ARM64 native library execution,
          using the tool to trace binary calls and locate suspicious behavior.
        pain_zh: 原生 .so 库不透明，静态分析难以还原真实执行路径，人工逆向耗时且容易漏掉动态加载行为。
        pain_en: Native .so libraries are opaque; static analysis struggles to reconstruct real execution
          paths, and manual reversing is slow and prone to missing dynamic loading behavior.
        current_alternative_zh: 使用商业逆向工具、自行拼装模拟器与脚本，或依赖日志和崩溃堆栈间接推断。
        current_alternative_en: Commercial reversing tools, self-assembled emulators and scripts, or indirect
          inference from logs and crash stacks.
        usage_reason_zh: 推断：相较手工拼装模拟环境，它把模拟执行与零拷贝追踪合并为一次调用，减少搭建环境和编写追踪脚本的步骤，因此需要反复分析原生库的安全团队会在审计任务中选择它；尚无用户反馈或案例支持这一动机。
        usage_reason_en: 'Inference: compared with hand-assembling emulation environments, it merges emulated
          execution and zero-copy tracing into one call, cutting environment setup and tracing-script
          work, so security teams repeatedly analyzing native libraries would choose it for audit tasks;
          no user feedback or case studies support this motive yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决原生库执行不可见的问题，痛点具体且不采用会漏掉动态行为；交付为可复核的追踪结果。
        evidence_ids:
        - ev-048176d65c017613
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标与分叉，缺少用户评价、issue 讨论或采用案例，无法判断是否形成使用共识。
        evidence_ids:
        - ev-048176d65c017613
      - gate: model
        status: insufficient
        reason: 公开材料未说明定价、部署方式或买方，开源项目可能靠服务或私有部署变现，这是判断不是已验证事实。
        evidence_ids:
        - ev-048176d65c017613
      - gate: truth
        status: insufficient
        reason: 未核验追踪结果准确性、对混淆或加固应用的覆盖，以及人工复核边界。
        evidence_ids:
        - ev-048176d65c017613
      next_validation: 收集该仓库的 issue 与 discussion，确认是否有安全团队报告实际审计任务中的使用与结果。
