  saccade:
    slug: saccade
    name: Saccade
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - AI 代理开发者在代理需要读取网页内容时，把浏览器页面转成可供代理判断的语义信息，以完成网页操作任务
    jobs_en:
    - AI agent developers converting browser pages into semantic information an agent can act on, so the
      agent can complete web tasks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向构建网页操作代理的开发者：代理在浏览器里执行任务时，需要先读懂页面上的按钮、表单和文本。Saccade 试图把实时浏览器页面转成代理可用的语义信息，让代理据此决定下一步动作；具体输入格式、接入方式和交付结果仍待核验。
    inspiration: 趋势是代理开始直接操作真实网页，页面理解成为新的中间层。切入可考虑电商后台、政务表单、跨境平台运营等页面结构复杂且人工重复操作的场景，按代理成功完成的网页任务收费；但需先确认它比截图加视觉模型更稳定。
    summary_en: 'For developers building web-operating agents: while an agent runs a task in a browser,
      it must first understand the buttons, forms and text on the page. Saccade aims to turn live browser
      pages into semantic information the agent can act on; its input format, integration path and delivered
      output still need verification.'
    inspiration_en: The trend is agents operating real web pages directly, making page understanding a
      new middle layer. A possible entry is complex, repetitive page workflows such as e-commerce back
      offices, government forms or cross-border platform operations, charged per completed web task; first
      confirm it is more reliable than screenshots plus vision models.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: AI 代理开发者在代理需要读取网页内容时，把浏览器页面转成可供代理判断的语义信息，以完成网页操作任务。
        job_en: AI agent developers converting browser pages into semantic information an agent can act
          on, so the agent can complete web tasks.
        pain_zh: 网页结构杂乱，代理靠截图或原始 DOM 判断容易点错、漏填，开发者要反复调试页面解析。
        pain_en: Web pages are messy; agents judging from screenshots or raw DOM easily click wrong or
          miss fields, forcing developers to repeatedly debug page parsing.
        current_alternative_zh: 开发者自己写选择器、用截图加视觉模型，或依赖浏览器自动化框架的固定脚本。
        current_alternative_en: Developers write their own selectors, use screenshots plus vision models,
          or rely on fixed scripts in browser automation frameworks.
        usage_reason_zh: 推断：若它能把页面实时转成结构化语义，开发者可少写一层选择器和容错逻辑，在页面改版频繁时减少脚本维护；目前只有一句项目简介，尚无用户反馈或实测支持。
        usage_reason_en: 'Inference: if it converts pages into structured semantics in real time, developers
          could skip a layer of selectors and fault tolerance and cut script maintenance when pages change
          often; only a one-line description exists, with no user feedback or tests yet.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决代理读不懂网页的问题，痛点真实，但材料只有一句简介，无法确认输入、动作与交付闭环。
        evidence_ids:
        - ev-44791e4c5db47fcd
      - gate: consensus
        status: insufficient
        reason: 仅 5 个社区点数、无评论，没有采用或讨论证据。
        evidence_ids:
        - ev-44791e4c5db47fcd
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费方或商业交付方式。
        evidence_ids:
        - ev-44791e4c5db47fcd
      - gate: truth
        status: insufficient
        reason: 无法核对语义提取的准确率、延迟与人工确认边界。
        evidence_ids:
        - ev-44791e4c5db47fcd
      next_validation: 收集该仓库 README 与 issue/discussion，确认页面语义提取的具体输入输出、接入方式和可复现实测结果。
