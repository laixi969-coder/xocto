        evidence_ids:
        - ev-b6f653c1d07e51e8
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或商业交付路径，谁付钱尚不明确，这是判断不是已验证事实。
        evidence_ids:
        - ev-dd8dd47d037c3ac9
      - gate: truth
        status: insufficient
        reason: 权限模型是否可靠、支持哪些工具与失败处理均未在材料中说明，交付确定性待核验。
        evidence_ids:
        - ev-dd8dd47d037c3ac9
