    inspiration_en: 'Trend: marketing work is being split into skills an AI agent executes step by step,
      rather than one generic generate button. Entry: start with local businesses that lack dedicated
      marketers, chaining research and positioning through landing-page copy into one deliverable workflow,
      charged per output or as managed service; today it is only an open-source skill pack with no pricing
      or customer cases.'
