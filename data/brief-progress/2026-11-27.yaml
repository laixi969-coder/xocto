    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发团队在合并代码前打开 arnold，它接收 公开代码仓库 或 GitLab 的拉取请求与合并请求，用团队自带的 OpenAI 兼容模型做审查并把发现以行内评论写回代码托管平台，同时提供带优先级的合并队列和审查工作区；最终交付是审查意见与排队后的合并动作，人工仍需确认是否合并。具体流程与交付细节仍待核验。
    inspiration: 趋势：代码审查正从托管平台内置功能变成可自托管、可换模型的独立环节，团队开始在意审查数据不出内网。切入：面向有合规或私有部署要求的中大型研发团队，从合并队列与审查记录留痕这一环进入，按自托管部署与支持收费；但该方向已有成熟商业产品，需先确认差异化。
    summary_en: Before merging code, engineering teams open arnold, which takes public code repository
      or GitLab pull/merge requests, runs review with a team-supplied OpenAI-compatible model, and posts
      findings back as inline comments, alongside a prioritised merge queue and review workspace. The
      deliverable is review comments plus queued merges; humans still confirm the merge. Exact workflow
      and delivery remain to be verified.
    inspiration_en: 'Trend: code review is becoming a self-hostable, model-swappable layer separate from
      the forge, as teams care about keeping review data inside their network. Entry: target mid-to-large
      engineering teams with compliance or private-deployment needs, starting from merge queue and review
      audit trail, sold as self-hosted deployment and support; established commercial rivals exist, so
      differentiation must be confirmed first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发团队在合并代码前，需要处理 公开代码仓库 或 GitLab 上的拉取请求与合并请求，完成审查并决定合并顺序。
        job_en: Before merging, engineering teams must process pull/merge requests on public code repository
          or GitLab, complete review, and decide merge order.
        pain_zh: 审查意见分散在托管平台里，合并顺序靠人工协调，且把代码送进外部审查服务会触碰私有部署与合规顾虑。
        pain_en: Review comments are scattered in the forge, merge order is coordinated manually, and
          sending code to external review services raises private-deployment and compliance concerns.
        current_alternative_zh: 使用 公开代码仓库/GitLab 内置审查、人工排队合并，或接入商业代码审查服务。
        current_alternative_en: Using built-in public code repository/GitLab review, manually ordering
          merges, or adopting commercial code review services.
        usage_reason_zh: 推断：团队若已有自托管与自带模型的要求，arnold 把审查发现直接写回拉取请求并提供带优先级的合并队列，省去在托管平台与外部审查工具之间搬运上下文和人工排队的步骤，因此有私有部署诉求的团队会选它。
        usage_reason_en: 'Inference: for teams requiring self-hosting and bring-your-own models, arnold
          posts findings straight back to the pull request and provides a prioritised merge queue, removing
          the step of shuttling context between forge and external review tools and manually ordering
          merges, so private-deployment teams would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决合并前代码审查与合并排序的需求，痛点是审查分散与私有部署顾虑；买方与付费路径尚不清晰。
        evidence_ids:
        - ev-510842251ef21f7e
        - ev-350454cb83564b9b
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标与分支数，缺少团队采用、客户案例或社区讨论证据。
        evidence_ids:
        - ev-350454cb83564b9b
      - gate: model
        status: insufficient
        reason: 未披露定价或商业收费方式，自托管开源如何变现未知，这是判断不是已验证事实。
        evidence_ids:
        - ev-510842251ef21f7e
      - gate: truth
        status: insufficient
        reason: 审查结果是否可靠、人工确认边界如何设定，公开材料未说明，需看文档与实测。
        evidence_ids:
        - ev-510842251ef21f7e
      next_validation: 收集 arnold 官方文档或仓库 issue/discussion 中关于部署方式、模型接入与审查结果确认流程的公开说明。
    event_summary_zh: PhonePe 于 2026 年 11 月公开 arnold 自托管代码审查平台，支持 公开代码仓库/GitLab 拉取请求、带优先级的合并队列与自带 OpenAI
      兼容模型的 AI 审查，仓库约 45 星。
    event_summary_en: PhonePe publicly released arnold in November 2026, a self-hosted code review platform
      supporting public code repository/GitLab pull requests, a prioritised merge queue, and AI review
      with bring-your-own OpenAI-compatible models; the repository has about 45 stars.
