      demand_read:
        job_zh: 开发者在接手陌生或大型代码库时，需要先弄清结构，再让 AI 在已批准的范围内改动代码，完成一次可控的变更。
        job_en: When taking over an unfamiliar or large codebase, a developer needs to understand its
