      and deployment barriers from the application layer down to infrastructure. Entry: serve mid-sized
      firms that must run large models on their own servers or private cloud with deployment tuning and
      managed operations, charged per cluster or call volume; avoid head-on competition with general inference
      frameworks and start from compliance-driven industry deployments.'
