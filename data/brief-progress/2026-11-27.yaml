    open_source: true
    summary_zh: 使用 AI 编码代理的开发者，在让代理动手改代码前，会打开这套指令与技能集合，按规划、批判性审查、差异审计三段流程处理代理产出的改动，最终拿到一份可复核的审查结论；是否合入仍由开发者确认。具体交付形态与流程细节仍待核验。
    inspiration: 趋势：AI 编码代理开始大量改代码后，审查代理产出本身成了新的瓶颈环节。切入：可从需要合规留痕的团队切入，把三段审查做成可审计的合入前检查，按团队或仓库收费；目前只有开源仓库，尚无定价或客户证据。
    summary_en: Developers using AI coding agents open this instruction and skill collection before letting
      an agent change code, running a planning, critical-review and diff-audit pipeline over the agent's
      output to get a reviewable conclusion; the developer still confirms whether to merge. The exact
      delivery form and process details remain to be verified.
    inspiration_en: 'Trend: once AI coding agents change code at volume, reviewing agent output becomes
      the new bottleneck. Entry: target teams needing audit trails, packaging the three-stage review as
      a pre-merge check billed per team or repository; today it is only an open-source repo with no pricing
      or customer evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 AI 编码代理的开发者，在代理产出代码改动后、合入之前，处理这些改动并判断能否安全合入。
        job_en: Developers using AI coding agents handle agent-produced code changes after generation
          and before merge, deciding whether they are safe to merge.
        pain_zh: 代理一次产出大量改动，人工逐行审查负担重，容易漏掉关键差异；不审查就合入会带来质量与安全风险。
        pain_en: Agents produce large change sets at once, making line-by-line human review heavy and
          prone to missing key diffs; merging without review brings quality and security risk.
        current_alternative_zh: 开发者靠人工读 diff、代码评审或代理自带的简单检查来把关。
        current_alternative_en: Developers rely on manual diff reading, code review, or the agent's own
          simple checks.
        usage_reason_zh: 推断：相较人工逐行读 diff，它把审查拆成规划、批判性审查、差异审计三步固定流程，减少遗漏关键改动的负担，因此需要可复核审查的开发者会在合入前选用它。
        usage_reason_en: 'Inference: versus reading diffs line by line, it splits review into fixed planning,
          critical-review and diff-audit steps, reducing the burden of missing key changes, so developers
          needing reviewable checks would pick it before merging.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理大量改代码后人工审查负担重、易漏关键差异的问题，旧做法是人工读 diff，痛点刚性。
        evidence_ids:
        - ev-56ab02953bfc171f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标缓慢增长，缺少用户评价或团队采用证据，无法判断共识。
        evidence_ids:
        - ev-6b12b153ed1e5436
      - gate: model
        status: insufficient
        reason: 开源仓库未见定价、付费或商业交付路径，买方与收费方式不明。
        evidence_ids:
        - ev-56ab02953bfc171f
      - gate: truth
        status: insufficient
        reason: 未见实测或客户案例证明审查流程能确定性拦住问题改动，交付效果待核验。
        evidence_ids:
        - ev-56ab02953bfc171f
      next_validation: 收集该仓库的 issue、discussion 或 README 中的实测与使用案例，核验三段审查流程的实际拦截效果。
