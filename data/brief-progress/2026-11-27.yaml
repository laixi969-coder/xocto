          using specialized tools, which is repetitive and slow; skipping it leaves characters stuck in
          fixed orientations.
        current_alternative_zh: 手工逐帧绘制旋转动画，或用传统2D骨骼/伪3D工具处理，再手动导入游戏引擎。
        current_alternative_en: Hand-drawing rotation frames, or using traditional 2D skeletal/fake-3D
          tools, then manually importing into the game engine.
        usage_reason_zh: 推断：相较逐帧手绘，它让编码代理直接读取四张视图并生成可旋转精灵，省去逐帧推导这一步；像素画师在已有四视图、需要快速出可旋转角色时会选择它。仓库星数增长只说明关注度，不能证明持续使用。
