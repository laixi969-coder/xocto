          Postmark, or reuse a company account, then hand-write code and DNS settings from documentation.
        usage_reason_zh: 推断：编码助手直接生成可运行的发送代码并默认选中 Resend，省去开发者逐个对比文档和手写接入代码这一步；被助手优先推荐会提高首次试用概率，但公开材料未显示留存或付费数据。
        usage_reason_en: 'Inference: the coding assistant generates runnable sending code and defaults
          to Resend, removing the step of comparing docs and hand-writing integration code; being recommended
          first raises trial probability, but public materials show no retention or payment data.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者接入事务性邮件时卡在 API、域名与送达配置的问题，旧做法是查文档手写代码，痛点具体且不解决的后果是邮件发不出。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: consensus
        status: insufficient
        reason: 助手优先推荐说明选型入口在变，但推荐次数不等于开发者持续采用，缺少集成后留存或复购证据。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与付费客户，买方可能是按发送量付费的开发者团队，这是判断而非已验证事实。
        evidence_ids:
        - ev-9b623a318120e7c8
      - gate: truth
        status: supported
        reason: 邮件发送是上线必需环节，交付可核对为邮件是否送达；被助手默认选中会缩短接入路径，但需自行处理退信与合规。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      next_validation: 收集 Resend 官方定价页与公开客户案例，核验按发送量计费方式及付费团队的实际使用情况。
