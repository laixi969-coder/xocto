        reason: 它解决经纪商受理申请时逐份人工审查文件、易漏项的问题，旧流程与不采用的后果可还原。
        evidence_ids:
        - ev-dc00080b83e838a1
      - gate: consensus
        status: insufficient
        reason: 仅有扩展文件审查的报道标题，没有客户采用或用户评价证据。
        evidence_ids:
        - ev-dc00080b83e838a1
      - gate: model
        status: insufficient
        reason: 买方可能是经纪机构，但定价与收费方式未披露；这是判断，不是已验证事实。
        evidence_ids:
        - ev-dc00080b83e838a1
      - gate: truth
        status: insufficient
        reason: 审查结论能否被合规部门直接采信、人工复核边界如何，材料未说明。
        evidence_ids:
        - ev-dc00080b83e838a1
      next_validation: 收集 Curvestone AI 官方产品页或客户案例，确认其文件审查的输入类型、输出结论与人工复核方式。
