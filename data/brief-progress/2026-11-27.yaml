    jobs:
    - 开发者在本地磁盘被构建产物、模拟器和 AI 代理工作树占满时，用菜单栏应用或命令行找出可安全删除的缓存并释放空间
    jobs_en:
    - Developers whose local disk is filled by build artifacts, simulators and AI agent worktrees use
      a menu bar app or CLI to locate safely removable caches and free space
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在本地磁盘被构建产物、模拟器缓存和 AI 代理工作树占满时打开它，工具扫描这些目录并标出可安全删除的部分，用户确认后释放空间；交付是清理动作和回收的磁盘容量，删除前仍需人工确认。具体扫描规则与安全边界仍待核验。
    inspiration: 趋势：AI 代理开始批量生成工作树和缓存，本地磁盘占用从偶发问题变成持续性的开发环境维护负担。切入：从重度使用编码代理的团队或 CI 之外的本地开发环境入手，卖可审计的清理策略与团队级磁盘配额，而不是单机小工具；是否收费未披露。
    summary_en: When local disk is filled by build artifacts, simulator caches and AI agent worktrees,
      developers open this tool to scan those directories and mark what can be safely removed; the deliverable
      is a cleanup action and reclaimed disk space, with human confirmation before deletion. Scan rules
      and safety boundaries still need verification.
    inspiration_en: 'Trend: AI agents now generate worktrees and caches in bulk, turning local disk usage
      from an occasional annoyance into ongoing dev-environment upkeep. Entry: start with teams that lean
      heavily on coding agents and sell auditable cleanup policies and team-level disk quotas rather than
      a single-machine utility; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在本地磁盘被构建产物、模拟器和 AI 代理工作树占满时，用菜单栏应用或命令行找出可安全删除的缓存并释放空间。
        job_en: Developers whose local disk is filled by build artifacts, simulators and AI agent worktrees
          use a menu bar app or CLI to locate safely removable caches and free space.
        pain_zh: 缓存和工作树分散在多个隐藏目录，手动排查费时且容易误删，磁盘满会直接中断构建和代理任务。
        pain_en: Caches and worktrees are scattered across hidden directories; manual hunting is slow
          and error-prone, and a full disk halts builds and agent tasks.
        current_alternative_zh: 开发者通常手动翻找目录、凭经验删除，或使用系统存储管理这类通用清理工具。
        current_alternative_en: Developers typically hunt through directories by hand, delete based on
          experience, or use generic system storage cleaners.
        usage_reason_zh: 推断：相较手动翻目录，它把构建缓存、模拟器和代理工作树集中识别并标注可安全删除项，减少逐个目录排查这一步，并在删除前保留确认，因此磁盘频繁被占满的开发者会在构建失败或空间告警时选择它。
        usage_reason_en: 'Inference: versus manual directory hunting, it identifies build caches, simulators
          and agent worktrees in one place and flags safe-to-delete items, removing the step of checking
          each directory while keeping confirmation before deletion, so developers who repeatedly run
          out of disk choose it when builds fail or space alerts fire.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地磁盘被构建缓存和代理工作树占满的问题，痛点在构建中断时很直接，旧做法是手动翻目录删除。
        evidence_ids:
        - ev-0cc84052d3b3cd04
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或客户案例说明谁在持续使用。
        evidence_ids:
        - ev-0cc84052d3b3cd04
        - ev-adc4aa337d364f41
      - gate: model
        status: insufficient
        reason: 未披露定价或付费路径，开源项目如何变现不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-0cc84052d3b3cd04
      - gate: truth
        status: insufficient
        reason: 删除安全边界和扫描规则未见公开说明，误删风险是否被确定性控制仍待核验。
        evidence_ids:
        - ev-adc4aa337d364f41
      next_validation: 收集该仓库的 issue 与 discussion，确认用户对误删风险和扫描覆盖范围的反馈。
  pop-agent:
    slug: pop-agent
    name: PopAgent
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 使用编码代理的开发者需要在代理推理过程中查看思路并中途纠正方向
    jobs_en:
    - Developers using coding agents need to watch the agent's reasoning and correct it mid-turn
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用编码代理的开发者在一个本地网页界面里打开 Codex、Claude Code、OpenCode 等代理的会话，实时查看代理的推理流，并在某一轮尚未结束时插入纠正；会话仍保存在各引擎自己的文件里，不建数据库、不需账号。用户最终拿到的是被中途修正后的代理执行结果，具体纠正效果与交付质量仍待核验。
    inspiration: 趋势：编码代理的瓶颈正从“能不能写代码”转向“人能不能在它跑偏前介入”，可观测与中途干预成为一层新需求。切入：从需要审计代理每一步的团队场景进入，例如把会话记录与纠正动作沉淀为可复核的交付凭证；卖法未披露，不宜假设按席位收费。
    summary_en: Developers using coding agents open sessions from Codex, Claude Code, OpenCode and similar
      engines in a local web interface, watch the agent's reasoning stream in real time, and inject a
      correction before the current turn ends; sessions stay in each engine's own files with no database
      or account. The user gets an agent run that was corrected mid-course, though the actual effect of
      corrections and delivery quality still need verification.
    inspiration_en: 'Trend: the bottleneck for coding agents is shifting from whether they can write code
      to whether a human can intervene before they drift, creating a new layer of observability and mid-turn
      control. Entry: start with teams that must audit each agent step, for example turning session logs
      and corrections into reviewable delivery records; pricing is undisclosed and should not be assumed
      to be per-seat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者在一个任务进行中打开本地界面，查看代理的推理流与工具调用，并在发现方向错误时于当前轮次内插入纠正，最终得到修正后的代码改动。
        job_en: A developer using a coding agent opens a local interface during a task, watches the agent's
          reasoning stream and tool calls, and injects a correction within the current turn when the direction
          is wrong, ending with a corrected code change.
        pain_zh: 编码代理一次跑很久，跑偏后只能等它结束再重来，浪费一轮时间和上下文；现有终端输出难以回看和定位错误步骤。
        pain_en: Coding agents run for long stretches; when they drift, the user must wait for the run
          to finish and restart, wasting a turn and context, and terminal output is hard to review or
          pinpoint the wrong step.
        current_alternative_zh: 直接在各代理自带的终端或 IDE 界面里运行，靠滚动日志观察，出错后中断并重新下指令。
        current_alternative_en: Running agents in their own terminal or IDE interfaces, watching scrolling
          logs, and interrupting and re-prompting after an error.
        usage_reason_zh: 相较中断重来的旧做法，它在同一轮内接收纠正并保留会话在原引擎文件中，减少一次完整重跑；推断需要频繁监督代理的开发者会因此选择它，但尚无用户反馈或留存证据支持长期使用。
        usage_reason_en: Compared with interrupting and restarting, it accepts a correction within the
          same turn and keeps sessions in the engine's own files, avoiding one full rerun; by inference,
          developers who frequently supervise agents would choose it, though no user feedback or retention
          evidence yet supports sustained use.
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理跑偏后只能整轮重来的问题，痛点在长任务中刚性，交付是修正后的代码改动。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数，缺少用户评价或团队采用案例，无法判断开发者是否已把它放进日常工作流。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是个人开发者或团队，付费路径尚不明确，这是判断而非事实。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
      - gate: truth
        status: insufficient
        reason: 中途纠正能否稳定改善代理输出、是否引入新的误操作，缺少可复现实测与安全边界说明。
        evidence_ids:
        - ev-f2cbad9a6b5ae884
      next_validation: 收集该仓库的 issue 与 discussion，查看开发者对中途纠正效果和实际使用场景的公开反馈。
  portable:
    slug: portable
    name: Portable
    decision: watching
    category: AI + 商业
    project_type: new_application
    industries: []
    industries_en: []
    jobs:
    - 让 AI 代理代表用户执行任务的一方需要与代理签署可核验的协议以约定权限与责任
    jobs_en:
    - Parties delegating tasks to AI agents need signed, verifiable agreements with agents defining permissions
      and liability
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 候选材料只给出“为 AI 代理签署协议”这一句描述，指向一个让代理在约定权限与责任下执行任务的协议层；谁在什么工作节点打开它、AI 接收什么材料、最终交付何种可核验文件，均未在材料中说明，具体流程与交付仍待核验。
    inspiration: 趋势：代理开始替人执行有后果的动作，权限与责任需要可签署的凭证，而不只是提示词约束。切入：可从需要对外担责的代理任务进入，例如代客户下单或代提交材料时留下可审计的授权记录；卖法未披露。
    summary_en: The candidate material offers only the phrase "signed agreements for AI agents", pointing
      to a protocol layer that lets agents act under agreed permissions and liability. Who opens it at
      which work step, what materials the AI receives, and what verifiable document is delivered are not
      described, so the concrete workflow and deliverable still need verification.
    inspiration_en: 'Trend: agents are beginning to take consequential actions on people''s behalf, so
      permissions and liability need signable credentials rather than prompt-level constraints. Entry:
      start with agent tasks that carry external accountability, such as placing orders or submitting
      filings for a client while leaving an auditable authorization record; pricing is undisclosed.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 把任务委托给 AI 代理的一方，在代理执行有后果的动作前，需要一份可核验的签署协议来约定代理能做什么、出错由谁负责。
        job_en: A party delegating tasks to an AI agent needs a verifiable signed agreement before the
          agent takes consequential actions, defining what the agent may do and who bears responsibility
          for errors.
        pain_zh: 代理替人执行动作时缺少可追溯的授权与责任凭证，一旦出错难以界定归属；但材料未说明这一痛点已被哪些用户实际遇到。
        pain_en: When agents act on someone's behalf there is no traceable authorization or liability
          record, making fault hard to assign after an error; the material does not show which users have
          actually hit this pain.
        current_alternative_zh: 目前多依赖平台服务条款、提示词约束或人工逐次确认，材料未给出可对照的旧流程。
        current_alternative_en: Today this mostly relies on platform terms of service, prompt constraints,
          or manual per-action confirmation; the material gives no comparable prior workflow.
        usage_reason_zh: 若协议能在代理执行前自动生成并留存签署记录，可省去事后人工补授权的一步；推断对需要对外担责的代理任务有吸引力，但材料未提供任何采用或使用证据。
        usage_reason_en: If agreements can be generated before an agent acts and the signed record retained,
          it removes a manual post-hoc authorization step; by inference this appeals to agent tasks with
          external accountability, but the material provides no adoption or usage evidence.
      gates:
      - gate: value
        status: insufficient
        reason: 只能看出它想为代理行为提供签署凭证，但解决什么具体任务、谁在什么节点使用都未说明，价值结构无法还原。
        evidence_ids:
        - ev-0e79d9b0b0a76043
      - gate: consensus
        status: insufficient
        reason: 仅有少量社区讨论，没有用户反馈或客户案例说明谁需要这类协议。
        evidence_ids:
        - ev-0e79d9b0b0a76043
        - ev-dd07c26d4687836e
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，可能是平台方或企业法务，付费路径完全未知，这是判断而非事实。
        evidence_ids:
        - ev-0e79d9b0b0a76043
      - gate: truth
        status: insufficient
        reason: 签署协议是否具备法律效力、如何与代理执行绑定，材料未提供任何可核验说明。
        evidence_ids:
        - ev-0e79d9b0b0a76043
      next_validation: 收集该项目的官方文档页面，确认协议的具体内容、签署流程与适用场景。
