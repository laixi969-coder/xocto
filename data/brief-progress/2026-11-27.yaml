      to a coding assistant, which writes the email API calls and picks a provider; Resend supplies the
      sending API and domain/deliverability setup, and the developer gets runnable sending code and delivery
      results, while still checking domain and bounce handling before launch.
    inspiration_en: 'Trend: coding assistants now make technology choices for developers, so email services
      recommended first by models get the integration opportunity, shifting the selection entry point
      from doc search to assistant answers. Wedge: for China-based SaaS exporters and independent store
      sellers, offer transactional email billed by volume with Chinese-language domain setup and bounce
      troubleshooting, selling on ''getting connected in one pass after the assistant recommends you''.'
