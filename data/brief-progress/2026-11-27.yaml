        - ev-783243f4e1337ae3
      - gate: model
        status: insufficient
        reason: 未披露定价、计价方式与买方类型，是项目制还是产品制无法判断，属判断而非已验证事实。
        evidence_ids:
        - ev-c5efca2d0e1a7061
      - gate: truth
        status: insufficient
        reason: 无法核对硬件配置、模型支持范围与运维边界，交付能否确定性发生尚缺材料。
        evidence_ids:
        - ev-783243f4e1337ae3
      next_validation: 收集威云创达官方产品页或方案文档，核对其硬件配置、支持的模型、部署方式与报价口径。
