        pain_zh: 过去要么自己学前端与后端、要么雇开发者或外包，从想法到可演示版本要数周且成本高；改动一次就要重新走一轮沟通与排期。
        pain_en: Previously they either learned front end and back end themselves or hired developers
          or agencies, taking weeks and high cost from idea to a demoable version; each change required
          another round of communication and scheduling.
        current_alternative_zh: 雇自由开发者或外包团队、用网站搭建工具手工拖拽、或直接用模板建站；部分人用通用代码助手逐段写代码。
        current_alternative_en: Hiring freelance developers or agencies, manually dragging in website
          builders, or using templates directly; some use general code assistants to write code piece
