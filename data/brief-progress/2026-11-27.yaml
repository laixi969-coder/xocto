    slug: 成本低九成开源权重magi-2-带动视频模型进入大掀桌时代
    name: MAGI-2
    decision: market_context
    event_summary_zh: 2026年11月25日，Sand.ai 宣布计划尽快开源 480B 总参数的 MAGI-2 音视频统一模型全量权重，并给出 1080P 下 0.5 元/秒的 API
      刊例价，称不到 Seedance 2.5 同规格的十分之一。这是模型权重与调用价格的供给变化，不是独立应用产品；对视频生成应用意味着推理成本与私有化部署门槛可能下降，但实际交付质量与本地部署可行性仍待核验（推断）。
