    jobs_en:
    - Content moderation or forensic staff receiving a suspected AI-generated video report or claim need
      to inspect appearance, physics, on-screen text and audio segment by segment to judge authenticity
      and produce a reviewable conclusion
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 内容审核或取证人员遇到疑似AI生成的视频时，打开这个开源工具，由主调查代理按选定时间段调用子代理，分别检查画面、物理规律、常识、屏幕文字和音频，最终给出视频是否伪造的判断线索；具体交付格式与人工复核流程仍待核验。
    inspiration: 趋势：AI生成视频的检测正从单一分类器转向按时间段拆解、多维度交叉核查的代理流程。切入：可从内容平台审核、保险理赔取证这类已有明确旧流程的环节进入，把检测结论与人工复核记录打包成按次交付的取证报告，而非卖通用检测工具。
    summary_en: When content moderators or forensic staff encounter a suspected AI-generated video, they
      open this open-source tool; a main investigator agent calls inspector sub-agents on chosen time
      windows to check appearance, physics, common sense, on-screen text and audio, producing clues on
      whether the video is fake. The exact deliverable format and human review workflow still need verification.
    inspiration_en: 'Trend: AI-generated video detection is moving from a single classifier to an agent
      workflow that splits footage by time window and cross-checks multiple dimensions. Entry: start from
      content-platform moderation or insurance claims forensics, where an old manual process already exists,
      and package detection conclusions with human review records as a per-case forensic report rather
      than a generic detection tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 内容审核或取证人员在收到疑似AI生成的视频举报或理赔材料时，需要逐段核查画面、物理规律、屏幕文字与音频，判断视频真伪并形成可复核的结论。
        job_en: Content moderation or forensic staff receiving a suspected AI-generated video report or
          claim need to inspect appearance, physics, on-screen text and audio segment by segment to judge
          authenticity and produce a reviewable conclusion.
        pain_zh: AI生成视频越来越逼真，人工逐帧核查耗时且容易漏看物理与音频破绽；单一检测模型只给一个分数，难以说明哪一段、哪一维度可疑。
        pain_en: AI-generated videos are increasingly realistic; manual frame-by-frame review is slow
          and misses physics or audio flaws, while a single detection model gives only a score and cannot
          explain which segment or dimension is suspicious.
        current_alternative_zh: 目前多依赖人工逐段观看、通用检测模型打分或第三方取证服务，结论往往缺少分段时间窗与多维度依据。
        current_alternative_en: Today people rely on manual segment-by-segment viewing, generic detection
          model scores or third-party forensic services, and conclusions often lack time-window and multi-dimension
          evidence.
        usage_reason_zh: 推断：相较人工逐段观看或单一模型打分，它按选定时间段调用子代理分别检查画面、物理、常识、文字和音频，把可疑点定位到具体片段与维度，减少人工全片复看的负担，因此内容审核与理赔取证人员会在需要可解释结论时选择它。
        usage_reason_en: 'Inference: compared with manual segment viewing or a single model score, it
          calls sub-agents on chosen time windows to check appearance, physics, common sense, text and
          audio separately, locating suspicious points to specific segments and dimensions and reducing
          the burden of re-watching the whole video, so moderation and claims staff would choose it when
          they need explainable conclusions.'
      gates:
      - gate: value
        status: supported
        reason: 它解决疑似AI生成视频的真伪核查需求，痛点是人工逐帧观看耗时且单一模型无法定位可疑片段；买方尚不清晰。
        evidence_ids:
        - ev-469178394f2aa36c
        - ev-6d1be121b5d56141
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星标从63增至71的关注度信号，没有内容平台、律所或保险机构的采用或客户案例。
        evidence_ids:
        - ev-469178394f2aa36c
        - ev-6d1be121b5d56141
      - gate: model
        status: insufficient
        reason: 未披露定价或收费方式，钱可能来自平台审核采购、取证服务或开源支持，这是判断而非已验证事实。
        evidence_ids:
        - ev-6d1be121b5d56141
      - gate: truth
        status: insufficient
        reason: 多代理分维度核查贴近取证第一性目标，但检测准确率、误报率与人工复核边界均未公开，交付确定性待核验。
        evidence_ids:
        - ev-469178394f2aa36c
      next_validation: 收集该仓库的README、评测结果或issue讨论，确认检测准确率、误报率与输出交付格式。
