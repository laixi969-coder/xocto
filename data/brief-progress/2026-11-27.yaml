    summary_zh: Mac 用户在任意应用里写邮件、文档或作业时打开它，把正在输入的文字交给本地运行的语法检查，得到修改建议；原文是否离开本机、具体支持哪些应用与语言，候选材料未说明，具体流程或交付仍待核验。
