        job_zh: 流放之路玩家在赛季中调整角色构筑时，处理构筑代码、装备与天赋数据，要判断某项改动是否真的提升输出或生存。
        job_en: Path of Exile players adjusting a build mid-league handle build codes, gear and passive
          data, and need to judge whether a change actually improves damage or survivability.
        pain_zh: Path of Building 是桌面软件，逐项导入、点算和对照 Wiki 与交易价格步骤繁琐，玩家容易算错或漏查。
