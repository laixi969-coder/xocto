      - gate: consensus
        status: insufficient
        reason: 未进入：只有一句产品定位，没有用户反馈、采用或社区讨论可判断共识卡在哪一环。
        evidence_ids:
        - ev-5210baf41887af14
      - gate: model
        status: insufficient
        reason: 未进入：材料未披露买方、定价或收费方式，无法判断钱从哪来。
        evidence_ids:
        - ev-5210baf41887af14
      - gate: truth
        status: insufficient
        reason: 未进入：无法核对记忆的写入、检索与纠错是否贴近真实工作目标，也无安全边界说明。
        evidence_ids:
        - ev-5210baf41887af14
      next_validation: 收集 Remora 官方产品页或文档，确认它存储什么、如何检索、面向哪类代理工作流以及是否公开定价。
