        - ev-1636f6ab7960cc8e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，属于关注度信号，未见用户评价或团队采用案例，无法判断共识是否形成。
        evidence_ids:
        - ev-1636f6ab7960cc8e
      - gate: model
        status: insufficient
        reason: 产品标注免费，未见定价页或付费路径，买方与收费方式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-cc2f4919eb64e3c0
      - gate: truth
        status: insufficient
        reason: 游戏化界面是否贴近开发者调度代理的第一性目标、能否确定性交付，缺少实测与人工边界说明。
        evidence_ids:
        - ev-cc2f4919eb64e3c0
      next_validation: 收集 CrommaCode 官方文档或仓库 issue/discussion 中关于多代理调度实际使用与交付结果的公开记录。
    event_summary_zh: CrommaCode 于 2026 年 11 月发布面向编码代理的游戏化 IDE，支持观察 Claude Code、Codex、Gemini CLI 等代理运行并向一组工作代理派发任务，免费提供
