  fuck-data-brokerspy:
    slug: fuck-data-brokerspy
    name: Fuck_data_brokers.py
    decision: watching
    category: AI + 生活
    project_type: open_source
    industries:
    - 个人数据隐私
    - 消费者权益
    industries_en:
    - personal data privacy
    - consumer rights
    jobs:
    - 个人在发现自己的信息被数据经纪商收录时，用脚本整理并提交删除请求，以完成数据清除
    jobs_en:
    - An individual who finds their information listed by data brokers uses a script to organize and submit
      removal requests to complete data deletion
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人在发现自己的姓名、住址等信息被数据经纪商收录时，打开这个开源脚本，由它整理并批量提交删除请求，最终拿到各经纪商的处理回执；具体覆盖哪些经纪商、是否需人工逐条确认仍待核验。
    inspiration: 数据经纪商删除请求长期靠人手工逐家填表，这个脚本把重复劳动自动化，说明隐私清除正从个人维权变成可批量交付的服务。切入可从面向普通消费者的按次清除服务或面向律所的证据整理环节进入，价格未披露。
    summary_en: When an individual finds their name or address listed by data brokers, they run this open-source
      script, which organizes and submits removal requests in bulk and returns each broker's response;
      which brokers are covered and whether manual confirmation is still needed remain unverified.
    inspiration_en: Data-broker removal requests have long meant manually filling forms broker by broker;
      this script automates the repetition, showing privacy cleanup is shifting from individual activism
      to a batchable service. Entry could be a per-request removal service for consumers or evidence preparation
      for law firms; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人发现自己的信息被数据经纪商公开收录时，需要逐家提交删除请求以清除曝光。
        job_en: When an individual finds their information publicly listed by data brokers, they need
          to submit removal requests broker by broker to clear the exposure.
        pain_zh: 经纪商数量多、每家表单不同，手工逐条提交耗时且容易漏掉，不处理的后果是个人信息长期可被检索。
        pain_en: There are many brokers with different forms; manual submission is slow and easy to miss,
          and the consequence of inaction is that personal information stays searchable.
        current_alternative_zh: 手工逐家访问经纪商网站填表，或购买付费清除服务。
        current_alternative_en: Manually visiting each broker's site to fill forms, or paying for a removal
          service.
        usage_reason_zh: 推断：脚本把逐家填表的重复步骤合并为一次批量提交，减少手工录入负担，因此在意隐私曝光、又不愿付费订阅清除服务的个人会尝试它。
        usage_reason_en: 'Inference: the script merges broker-by-broker form filling into one batch submission,
          cutting manual entry, so individuals concerned about exposure who do not want a paid removal
          subscription would try it.'
      gates:
      - gate: value
