  ai债务风险加剧coreweave英伟达信用违约风险指标双双创历史新高:
    slug: ai债务风险加剧coreweave英伟达信用违约风险指标双双创历史新高
    name: CoreWeave
    decision: market_context
    summary_zh: 2026年11月25日报道显示，CoreWeave与英伟达的信用违约风险指标双双创历史新高，反映市场对AI算力扩张所依赖的债务融资结构担忧上升。若融资成本因此抬升，将推高AI基础设施与云算力的资金成本，进而影响AI应用方的算力定价与交付节奏；此为基于信用指标变化的推断，材料未给出具体数值或行业整体转向证据。
    summary_en: A Nov 25, 2026 report said credit default risk indicators for CoreWeave and Nvidia both
      hit record highs, signaling rising concern over the debt-financed structure behind AI compute expansion.
      Higher financing costs would raise the capital cost of AI infrastructure and cloud compute, affecting
      compute pricing and delivery pace for AI application builders; this is an inference from the credit
      indicator change, as the material gives no specific figures or evidence of an industry-wide shift.
    event_summary_zh: 2026年11月25日报道称，CoreWeave与英伟达的信用违约风险指标双双创历史新高。
    event_summary_en: A Nov 25, 2026 report said credit default risk indicators for CoreWeave and Nvidia
      both reached record highs.
