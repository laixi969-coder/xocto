      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 候选材料未说明具体使用者与工作节点；从标题只能推断它面向需要让智能体连续执行多步任务的开发者或团队，但处理什么材料、完成什么任务均未披露。
        job_en: The candidate material does not identify users or work steps; the title only suggests
          it targets developers or teams who want an agent to carry out multi-step tasks, but the material
          handled and the task completed are not disclosed.
        pain_zh: 若按标题推断，痛点是现有对话式模型需要人逐步拆解和搬运任务；但材料没有给出任何用户抱怨、旧流程或采用行为，痛点无法从公开事实确认。
        pain_en: Inferred from the title, the pain would be that conversational models require people
          to break down and shuttle tasks step by step; but the material gives no user complaints, prior
          workflow or adoption behavior, so the pain cannot be confirmed from public facts.
        current_alternative_zh: 候选材料未提及现有替代方式，无法判断用户此前是用脚本、其他智能体框架还是人工完成同类任务。
        current_alternative_en: The candidate material mentions no current alternative, so it is impossible
          to tell whether users previously used scripts, other agent frameworks or manual work for similar
          tasks.
