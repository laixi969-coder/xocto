      confirmation.
    inspiration_en: 'Trend: AI coding tools collecting sessions and telemetry by default is creating a
      niche need for verifiable privacy shutdown. Entry: serve teams with code-confidentiality requirements
      via an auditable local proxy or compliance configuration bundle, selling a reviewable capture report
      rather than the switch itself; the payment path is not disclosed.'
