      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标等关注度信号，缺少用户反馈或客户案例说明谁在实际使用。
        evidence_ids:
        - ev-d6c6fe537b6d8ef5
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或买方，钱可能来自个人订阅或机构服务，属判断非事实。
        evidence_ids:
        - ev-d6c6fe537b6d8ef5
      - gate: truth
        status: insufficient
        reason: 回测可复现性有前视检查支撑，但实盘接入的风控与合规边界未在材料中说明。
        evidence_ids:
        - ev-d6c6fe537b6d8ef5
