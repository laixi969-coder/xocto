    summary_en: Researchers open this repository when reproducing or reviewing the ART paper to obtain
      the data package released alongside it; AI performs no concrete action here, as the repository is
      only a distribution vehicle for data and materials. What users ultimately get is downloadable data
      files, while the content, format, and accompanying workflow remain to be verified.
    inspiration_en: 'Trend: frontier model labs are beginning to publish paper companion data separately,
      making reproduction and audit part of the research workflow. Entry: serve research teams or model
      evaluation organizations that need to reproduce experiments with data versioning and reproduction
      records; the repository discloses no data content yet, so the specific entry point cannot be judged.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 研究者在复现或审阅 ART 论文时，打开该仓库获取随论文发布的数据包，以核对论文结论。
        job_en: Researchers open this repository when reproducing or reviewing the ART paper to obtain
          the companion data package and check the paper's conclusions.
        pain_zh: 论文配套数据若分散或缺失，复现者需要自行寻找材料，核对结论的成本上升；但该仓库未披露数据内容，痛点强度无法从公开材料确认。
        pain_en: When companion data is scattered or missing, replicators must hunt for materials, raising
          the cost of checking conclusions; however, the repository discloses no data content, so pain
          intensity cannot be confirmed from public material.
        current_alternative_zh: 复现者通常依赖论文附录、作者个人主页或邮件索取数据。
        current_alternative_en: Replicators typically rely on paper appendices, author homepages, or email
          requests for data.
        usage_reason_zh: 推断：若该仓库确实集中提供论文数据，复现者可省去逐处搜集材料的一步；但目前仅有仓库自述，缺少数据内容与使用记录，无法确认用户会因此选择它。
        usage_reason_en: 'Inference: if the repository indeed centralizes the paper data, replicators
          could skip the step of gathering materials piecemeal; but only a repository self-description
          exists, lacking data content and usage records, so it cannot be confirmed that users would choose
          it for this reason.'
      gates:
      - gate: value
        status: insufficient
        reason: 它试图解决论文数据获取与复现核对的问题，但仓库未披露数据内容，连具体任务与痛点强度都难以还原。
        evidence_ids:
        - ev-5270689d337a1fd1
        - ev-2f80ff0f3dfd5bf0
      - gate: consensus
        status: insufficient
        reason: 仅有2个星标，无社区讨论或采用记录，无法判断研究者是否认可这一分发方式。
        evidence_ids:
        - ev-296bd647dca7af59
        - ev-11c9464e7e04a4e1
      - gate: model
        status: insufficient
        reason: 未披露定价、付费方或资助关系，作为公开数据包其商业路径不明。
        evidence_ids:
        - ev-5270689d337a1fd1
      - gate: truth
        status: insufficient
        reason: 无法核对数据是否完整、可复现，也未见人工确认或安全边界说明。
        evidence_ids:
        - ev-2f80ff0f3dfd5bf0
      next_validation: 收集该仓库的 README 与论文页面，确认数据内容、格式与复现说明是否公开。
