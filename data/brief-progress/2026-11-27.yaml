    inspiration: 趋势：AI 代理开始需要跨会话保留上下文，记忆正被单独拆成一层。切入：可从客服、销售跟进这类需要记住历史对话的岗位切入，但必须先看清它存什么、怎么取、谁来清理错误记忆；目前材料不足以判断卖法。
    summary_en: The candidate material only states that this is a long-term memory layer for AI agents.
      It does not say who opens it at which work step, what material it receives, what action it performs,
      or what it delivers; the concrete workflow and output remain unverified.
    inspiration_en: 'Trend: AI agents increasingly need to retain context across sessions, and memory
      is being split out as its own layer. Entry: customer support or sales follow-up roles that must
      remember past conversations could be a starting point, but what is stored, how it is retrieved,
      and who corrects bad memories must be clarified first; the material is too thin to judge a selling
      model.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 候选资料未说明具体使用者与工作节点，无法还原谁在处理什么材料、要完成什么任务。
        job_en: The candidate material does not identify a specific user or work step, so it is impossible
          to reconstruct who handles what material to complete what task.
        pain_zh: 只知代理需要长期记忆，但不知道缺少记忆时用户在哪一步受挫、后果是什么。
        pain_en: It is only known that agents need long-term memory; it is unclear at which step users
          are hurt without it or what the consequence is.
        current_alternative_zh: 公开材料未提及现有替代做法，例如手工拼接上下文、外挂向量库或每次重述背景。
        current_alternative_en: The public material does not mention current alternatives, such as manually
          stitching context, bolting on a vector store, or restating background each time.
        usage_reason_zh: 无法判断：材料没有说明它相较旧做法减少了哪一步负担或改善了哪项可核对结果。
        usage_reason_en: 'Cannot be judged: the material does not say which step it removes versus the
          old approach or which checkable result it improves.'
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决代理跨会话记忆的问题，但材料未说明具体任务、痛点强度与不采用的后果，价值结构无法还原。
        evidence_ids:
