        status: insufficient
        reason: 仅有平台发布与媒体报道，缺少员工实际使用、留存或客户案例，无法判断智能体是否进入日常办公习惯。
        evidence_ids:
        - ev-ccc63841d29abcbb
        - ev-3d7dc64ced8edd77
      - gate: model
        status: insufficient
        reason: 未披露豆包工作的定价、计费方式或企业采购路径，钱从哪一方来只能推断为依托飞书的企业订阅。
        evidence_ids:
        - ev-ccc63841d29abcbb
      - gate: truth
        status: insufficient
        reason: 智能体在办公流程中的交付是否确定、人工确认边界如何设定，公开材料未说明，需核验实际任务完成质量。
        evidence_ids:
        - ev-3d7dc64ced8edd77
      next_validation: 收集飞书或豆包工作官方发布的智能体使用说明与客户案例页面，核验具体办公任务交付形态与人工确认环节。
