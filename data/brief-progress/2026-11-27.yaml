      a 480B-parameter unified audio-video model, and listed an API price of RMB 0.5 per second at 1080P,
      claimed to be under one tenth of Seedance 2.5 at the same specification. This is a change in model
      weights and API pricing supply, not a standalone application product; for video-generation applications
      it may lower inference cost and the barrier to private deployment, though actual output quality
      and local deployment feasibility remain to be verified (inference).
