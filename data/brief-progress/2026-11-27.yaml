      privacy-sensitive writers will trade delivery format for text that never leaves the machine. Entry:
      start with lawyers, clinicians and journalists who cannot upload drafts to third parties, offering
      offline-deployable proofreading and compliance checks, potentially sold as private team deployment;
      pricing is not disclosed.'
