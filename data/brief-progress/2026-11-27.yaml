          grammar in place without switching to a web tool or copying the whole text out.
        pain_zh: 云端语法工具要求把草稿上传到第三方，对合同、病历、未发表稿件这类材料构成泄露风险；切换应用复制粘贴也打断写作。
        pain_en: Cloud grammar tools require uploading drafts to a third party, which is a leak risk for
