      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 放射科医生在乳腺筛查阅片时处理乳腺影像，需要完成病灶识别与报告，AI 结果仍需医生确认。
        job_en: Radiologists reading mammography screening images need to identify lesions and complete
          reports, with AI output still confirmed by the physician.
        pain_zh: 乳腺筛查阅片量大且对漏诊敏感，医生逐张判读耗时，复核压力集中。
