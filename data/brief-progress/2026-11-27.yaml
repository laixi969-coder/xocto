        evidence_ids:
        - ev-8a92b705a0336f70
      - gate: model
        status: insufficient
        reason: 未披露定价与买方，可能面向独立站卖家或营销团队的按次诊断，属推断，付费路径未核验。
        evidence_ids:
        - ev-8a92b705a0336f70
      - gate: truth
        status: insufficient
        reason: 代理读取视角是否贴近真实代理行为、检查结果能否确定性交付，公开材料未说明。
        evidence_ids:
        - ev-8a92b705a0336f70
      next_validation: 收集 Bifura 官方产品页或文档，核验其检查输出的具体形式、是否给出修改建议以及定价页。
