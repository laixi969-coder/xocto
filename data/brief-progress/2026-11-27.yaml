    open_source: true
    summary_zh: 开发者会在本地或远程项目目录上打开它，把文件夹交给代理读取、搜索、修改并执行命令，还可经 SSH 管理远程服务器目录；内置 Work Director 跟踪任务并在停滞、偏离或等待操作时提醒。用户最终拿到的是在授权范围内完成的文件改动与命令执行结果，提示词、知识、日志和密钥保留在本地；具体交付质量与人工确认环节仍待核验。
    inspiration: 趋势：编码代理正从聊天窗口转向能直接操作项目目录和远程服务器的桌面工作台，并把任务监控做进产品。切入：可从需要本地数据不出内网的中小开发团队或运维外包切入，卖点是权限可控的目录级代理加任务偏离告警；目前只有仓库描述与星数，尚无定价、客户或留存证据。
    summary_en: Developers open it on a local or remote project directory and hand the folder to an agent
      that reads, searches, edits and runs commands, with SSH access to remote server directories; a built-in
      Work Director tracks tasks and alerts on stalls, drift or waiting actions. The deliverable is file
      changes and command results within granted permissions, with prompts, knowledge, logs and keys kept
      local; delivery quality and human confirmation steps remain unverified.
    inspiration_en: 'Trend: coding agents are moving from chat windows to desktop workbenches that operate
      directly on project folders and remote servers, with task monitoring built in. Entry: target small
      dev teams or outsourced ops that need data to stay on-premise, selling permission-scoped directory
      agents plus drift alerts; only a repo description and star counts exist, with no pricing, customer
      or retention evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者或运维在本地或远程项目目录上，把文件夹交给代理读取、搜索、修改并执行命令，同时需要知道任务是否停滞、偏离或等待人工操作。
        job_en: Developers or ops hand a local or remote project folder to an agent to read, search, edit
          and run commands, while needing to know whether the task has stalled, drifted or is waiting
          on a human.
        pain_zh: 在终端与聊天窗口之间来回搬运上下文、手动盯长任务是否跑偏，是编码代理使用中的实际负担；远程服务器目录还需另开 SSH 工具。
        pain_en: Copying context between terminal and chat and manually watching long tasks for drift
          is a real burden in agent coding; remote server directories also require a separate SSH tool.
        current_alternative_zh: 用通用聊天助手粘贴代码片段，再手动在编辑器或终端执行；远程操作另开 SSH 客户端，任务进度靠人盯着。
        current_alternative_en: Paste snippets into a general chat assistant, then manually run them in
          an editor or terminal; remote work uses a separate SSH client and progress is watched by a person.
        usage_reason_zh: 推断：它把读取、搜索、修改、执行和远程目录管理收进同一桌面工作台，并用 Work Director 在停滞或偏离时提醒，减少在多个工具间搬运上下文和人工盯守这一步；需要本地数据不外传且要操作远程目录的开发者会因此选择它。
        usage_reason_en: 'Inference: it folds reading, searching, editing, execution and remote directory
          management into one desktop workbench and alerts via Work Director on stalls or drift, cutting
          the step of moving context between tools and watching manually; developers who need local data
          to stay on-premise and must touch remote directories would choose it for that.'
      gates:
      - gate: value
