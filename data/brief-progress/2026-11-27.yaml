          image by image and video by video whether it is AI-generated, in order to decide whether to
          use it, label its source, or block it.
        pain_zh: AI 生成图像和视频大量进入信息流，人工凭肉眼判断真假既慢又容易出错，误用会带来事实错误或误导传播的后果。
        pain_en: AI-generated images and video are flooding feeds; judging authenticity by eye is slow
          and error-prone, and misuse causes factual errors or spreads misinformation.
        current_alternative_zh: 目前多靠人工肉眼判断、反向图片搜索或零散的外部检测网站，逐张处理，流程分散。
        current_alternative_en: Today people mostly rely on visual judgement, reverse image search, or
          scattered external detection sites, handling items one by one in a fragmented flow.
        usage_reason_zh: 相较逐张打开外部检测网站或凭经验判断，扩展在浏览页面时于本地直接标出疑似 AI 生成内容，省去把素材导出再送检的一步；推断，这类用户会在需要快速筛查大量网页素材时选择它，实际准确率与误报仍待核验。
        usage_reason_en: Compared with opening external detection sites item by item or judging by experience,
          the extension flags likely AI-generated content locally while browsing, removing the step of
          exporting material for checking; this is an inference, and such users would choose it when screening
          large volumes of web material quickly, while actual accuracy and false positives still need
          verification.
      gates:
