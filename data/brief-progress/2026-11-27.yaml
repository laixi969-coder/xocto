    jobs:
    - 教师或自学者在准备讲解材料时，把知识点交给系统，生成可逐步播放的白板动画课程，用于课堂或自学演示
    jobs_en:
    - Teachers or self-learners preparing explanation materials hand a topic to the system to generate
      a step-by-step playable whiteboard animation lesson for classroom or self-study use
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 自学者或教师在需要把知识点讲成可视化过程时，打开这个开源白板导师，输入主题后由模型逐笔生成白板动画课程并可交互回放；仓库还附带 Claude、Gemini、DeepSeek
      在 288 次生成、64 块盲评白板上的对比。最终交付是一段可播放的讲解动画，具体课程质量与人工校对环节仍待核验。
    inspiration: 趋势：把大模型从“文字答疑”推向“逐笔演算的板书讲解”，教育内容的生成开始比拼过程可视化而非答案本身。切入：可从需要标准化讲解的细分人群进入，例如教辅机构把同一知识点批量做成可复用板书课件，或面向自学者的按课程付费；模型对比数据本身也可做成选型服务。
    summary_en: When a self-learner or teacher needs to turn a topic into a visual explanation, they open
      this open-source whiteboard tutor, enter the topic, and a model draws a stroke-by-stroke whiteboard
      animation lesson with interactive playback. The repo also ships a comparison of Claude, Gemini and
      DeepSeek across 288 generation runs and 64 blind-reviewed boards. The deliverable is a playable
      explanation animation; lesson quality and human review steps still need verification.
    inspiration_en: 'Trend: LLMs are moving from text Q&A toward stroke-by-stroke board explanations,
      so educational content generation competes on visualizing the process rather than the answer. Entry:
      start with a narrow audience that needs standardized explanations, such as tutoring firms batch-producing
      reusable board lessons per topic, or per-course sales to self-learners; the model comparison data
      itself could become a selection service.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 教师或自学者在准备讲解材料时，把知识点交给系统，生成可逐步播放的白板动画课程，用于课堂或自学演示。
        job_en: Teachers or self-learners preparing explanation materials hand a topic to the system to
          generate a step-by-step playable whiteboard animation lesson for classroom or self-study use.
        pain_zh: 把抽象知识点讲清楚需要手绘板书或逐帧做动画，费时且依赖个人讲解能力；纯文字答疑难以展示推导过程。
        pain_en: Explaining abstract concepts clearly requires hand-drawn boards or frame-by-frame animation,
          which is time-consuming and depends on individual teaching skill; text-only Q&A struggles to
          show the derivation process.
        current_alternative_zh: 教师手写板书、用 PPT 配图，或用视频剪辑软件逐帧制作讲解动画；自学者看现成视频或文字教程。
        current_alternative_en: Teachers write on boards, use slide decks with images, or edit frame-by-frame
          explainer videos; self-learners watch existing videos or read text tutorials.
        usage_reason_zh: 推断：相较手绘板书或逐帧剪辑，它让模型直接逐笔生成可回放的白板动画，省去绘制与排版步骤，因此需要批量产出可视化讲解的教师或教辅机构会在备课时选择它；是否被长期留在工作流尚无留存证据。
        usage_reason_en: 'Inference: versus hand-drawing boards or frame-by-frame editing, it has the
          model generate a replayable stroke-by-stroke whiteboard animation directly, removing the drawing
          and layout steps, so teachers or tutoring firms needing batch visual explanations would pick
          it when preparing lessons; there is no retention evidence yet that it stays in the workflow.'
      gates:
      - gate: value
        status: supported
        reason: 它解决把知识点讲成可视化推导过程的需求，痛点是手绘板书或逐帧动画费时且依赖个人讲解能力，结构上成立。
        evidence_ids:
        - ev-9b2983e3083ac92d
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 546 增至 574，属关注度信号，不能证明教师或学生已持续采用。
        evidence_ids:
        - ev-9b2983e3083ac92d
        - ev-a6dab891b47762f9
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费方、定价或按结果收费路径，买方与收入模式仍是判断而非事实。
        evidence_ids:
        - ev-9b2983e3083ac92d
      - gate: truth
        status: insufficient
        reason: 逐笔生成能否稳定产出可用的讲解动画、人工校对负担多大，公开材料未给出实测或用户反馈。
        evidence_ids:
        - ev-9b2983e3083ac92d
      next_validation: 收集该仓库的 issue/discussion 或官方演示页，核验生成课程的实际质量、人工校对环节与是否有教育机构采用案例。
