    name: llama.cpp
    decision: market_context
    event_summary_zh: 2026年11月26日，llama.cpp 发布 v1.1.0：新增 Inkling 2 系列、Domyn Edge 4B、Zaya1 8B 等模型支持，把 DFlash
      投机解码拆成独立草稿方法，弃用旧 llama_batch API 改用 llama_batch_ext，并加入 Kokoro、Zonos3-Mini、MiniMax-Music3、YuE2 等一批语音与音频模型，以及按
      bpw 或体积预算自动逐张量量化、llama-server 槽位调度重构。
    event_summary_en: 'On 2026-11-26, llama.cpp released v1.1.0: it added support for the Inkling 2 family,
      Domyn Edge 4B, Zaya1 8B and others, split DFlash speculative decoding into separate draft methods,
      deprecated the old llama_batch API in favour of llama_batch_ext, and brought in a batch of speech
      and audio models such as Kokoro, Zonos3-Mini, MiniMax-Music3 and YuE2, plus automatic per-tensor
      quantization targeting a bpw or size budget and a slot-scheduling refactor in llama-server.'
