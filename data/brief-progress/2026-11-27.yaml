    inspiration: 趋势：编码助手正在替开发者做技术选型，被模型优先推荐的邮件服务会先拿到集成机会，选型入口从文档搜索转向助手回答。切入：面向中国出海 SaaS 与独立站卖家，做按发送量计费、带中文域名配置与退信排查支持的事务性邮件服务，把“助手推荐后能否一次接通”作为卖点。
