      handing pending changes to agents for review, fixes and approval suggestions before engineers confirm
      the merge; the exact approval boundaries and delivery flow still need verification.
    inspiration_en: 'The trend is that code review shifts from humans reading every diff to agents reviewing
      first and humans confirming last. The opening is pull-request governance for regulated industries
      or small teams: sell the reviewed-and-cleared outcome per change, not another editor plugin; permissions
      and audit trails are the moat.'
