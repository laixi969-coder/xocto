    summary_zh: 企业员工在飞书等协同办公平台里处理文档、消息和任务时，打开豆包工作，由智能体接收这些办公材料并执行整理、生成或任务操作，最终产出可用的办公结果；与飞书8.0原生融合后，智能体被放进协同办公主流程。具体交付形态与人工确认环节仍待核验。
    inspiration: 趋势：办公智能体正从独立聊天窗口进入协同办公主流程，飞书把智能体当作“一等公民”是平台级信号。切入：可从具体职能的办公流程切入，例如合同审阅、周报汇总、客户跟进记录整理，按流程结果收费，而不是再做一个通用办公助手；豆包工作依托飞书生态，正面做通用办公入口的窗口已很窄。
    summary_en: When employees handle documents, messages and tasks inside collaboration platforms such
      as Feishu, they open Doubao Work and let agents take in that office material and carry out organizing,
      generating or task actions, producing usable office output; after native integration with Feishu
      8.0, agents sit inside the core collaboration workflow. The exact deliverables and human confirmation
      steps still need verification.
    inspiration_en: 'Trend: office agents are moving from standalone chat windows into the core collaboration
      workflow, and Feishu treating agents as "first-class citizens" is a platform-level signal. Entry:
      target specific functional workflows such as contract review, weekly report consolidation or client
      follow-up notes, and charge for workflow outcomes rather than building another general office assistant;
      with Doubao Work backed by the Feishu ecosystem, the window for a head-on general office entry is
      narrow.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业员工在飞书内处理文档、消息与任务时，需要把分散的办公材料整理成可执行的任务或可交付的文档，并调用智能体完成这一步。
