        usage_reason_en: 'Inference: compared with self-assembly, an integrated hardware-software package
          bundles hardware and supporting software, cutting trial-and-error in selection and adaptation,
          so smaller organizations under compliance constraints without a dedicated AI ops team are more
          likely to choose it; actual delivery outcomes lack public cases.'
      gates:
      - gate: value
        status: supported
        reason: 它解决数据不能出内网时如何本地跑AI模型的需求，痛点是合规与自建门槛；买方与交付细节不清写在模式关。
        evidence_ids:
