        usage_reason_zh: 推断：相较外包或手工拖拽，用户用一句需求描述就能得到可运行页面并连续修改，省去写需求文档、比价、排期和反复沟通这几步，因此没有工程团队、又需要快速拿到可演示或可上线站点的小团队会在验证想法或赶演示节点时选择它。
        usage_reason_en: 'Inference: compared with outsourcing or manual dragging, a single requirement
          description yields a runnable page that can be revised continuously, removing the steps of writing
          specs, comparing quotes, scheduling and repeated communication; small teams without engineers
          that need a demoable or launchable site quickly would choose it when validating an idea or hitting
          a demo deadline.'
      gates:
      - gate: value
        status: supported
        reason: 它解决非技术团队把想法变成可运行网页应用的需求，痛点是雇人或外包周期长、成本高、改动慢；旧替代行为明确，交付为可部署站点，结构上成立。
