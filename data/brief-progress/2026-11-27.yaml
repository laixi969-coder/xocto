        pain_en: Local businesses and small teams often lack dedicated marketers; research, positioning,
          copy and SEO are scattered across tools and manual steps, causing repetitive work and uneven
          quality.
        current_alternative_zh: 旧做法是营销人员手工做调研、写定位文档和文案，或用通用聊天助手零散生成，再人工拼接成页面与广告素材。
