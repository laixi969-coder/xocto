      刊例价，称不到 Seedance 2.5 同规格的十分之一。这是模型供给与调用价格的变化，不是独立应用产品；对视频生成应用而言，推理成本与私有化部署门槛可能下降，但实际生成质量与本地部署可行性仍待核验（推断）。
    inspiration: 视频生成模型权重开放与按秒计价下探，可能把成本压力从模型层转移到应用层；切入可考虑为广告、电商短视频等具体行业做按成片交付的生成服务，而非再卖模型调用。
    summary_en: On November 25, 2026, Sand.ai announced plans to open-source the full weights of MAGI-2,
      a 480B-parameter unified audio-video model, and published an API list price of RMB 0.5 per second
