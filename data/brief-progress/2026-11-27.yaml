      through it. The new facts are two security incidents affecting downstream customer data and reporting
      that customers stay despite this because of tight GPU supply; pricing and delivery terms remain
      unverified.
    inspiration_en: 'Trend: inference capacity is scarce and security incidents propagate down the supply
