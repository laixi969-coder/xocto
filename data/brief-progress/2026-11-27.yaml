    open_source: true
    summary_zh: 开发者在维护既有代码库时打开它，让工具删除死代码、无用文件、依赖和资源；工具以项目自带测试是否仍通过作为每次删减的保留条件，最终交付一个更小且测试仍通过的代码库，删减是否保留仍需用户自己的测试确认。具体由谁执行删减、如何回滚，资料未说明，流程仍待核验。
    inspiration: 趋势：代码清理这类原本靠人工逐文件排查的维护工作，开始被拆成“删一步、跑测试、留或不留”的可验证循环。切入：从接手遗留系统、依赖臃肿的团队切入，按清理后的仓库或按项目收费；但需先确认它是否真能自动定位死代码，而非只提供删减脚本。
    summary_en: Developers maintaining an existing codebase open it to delete dead code, unused files,
      dependencies and assets; the tool keeps each cut only if the project's own tests still pass, delivering
      a smaller codebase that still passes tests, with the user's tests as the final check. Who performs
      the cuts and how rollback works is not stated, so the workflow still needs verification.
    inspiration_en: 'Trend: code cleanup, once manual file-by-file maintenance, is being reframed as a
      verifiable loop of cut, run tests, keep or revert. Entry: target teams inheriting legacy systems
      with bloated dependencies, charging per cleaned repository or per project; first confirm it actually
      locates dead code rather than just offering a deletion script.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在维护既有代码库时，让工具删除死代码、文件和依赖，并用现有测试判断每次删减是否可保留。
        job_en: Developers maintaining an existing codebase let the tool delete dead code, files and dependencies,
          using existing tests to decide whether each cut can be kept.
        pain_zh: 遗留代码库中死代码与冗余依赖越积越多，人工排查删减风险高、耗时长，删错还可能破坏功能。
        pain_en: Dead code and redundant dependencies accumulate in legacy codebases; manual cleanup is
          slow and risky, and a wrong deletion can break functionality.
        current_alternative_zh: 开发者手工搜索引用、逐个删除并跑测试，或依赖 linter 与人工代码审查。
        current_alternative_en: Developers manually search references, delete one by one and run tests,
          or rely on linters and manual code review.
        usage_reason_zh: 相较手工逐文件排查，它把删减与测试通过绑定为保留条件，减少“删了再回滚”的反复负担；推断接手遗留系统的团队会因此选择它，但自动化程度与回滚机制尚未核验。
        usage_reason_en: Compared with manual file-by-file checks, it ties each cut to passing tests as
          the keep condition, reducing the delete-then-revert churn; teams inheriting legacy systems would
          likely choose it, but automation depth and rollback are unverified.
      gates:
      - gate: value
        status: supported
        reason: 它解决遗留代码库清理死代码与冗余依赖的需求，痛点是人工删减慢且易出错，现有替代是手工排查加测试。
        evidence_ids:
        - ev-062b372f127848a9
        - ev-c3be2b0ad5d398df
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标与简介，缺少用户反馈或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-c3be2b0ad5d398df
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明付费路径或商业交付方式，买方与收费模式不明。
        evidence_ids:
        - ev-062b372f127848a9
      - gate: truth
        status: insufficient
        reason: 未核验其是否真能自动定位死代码、删减是否可回滚，以及测试覆盖不足时如何保证交付确定性。
        evidence_ids:
        - ev-062b372f127848a9
      next_validation: 收集该仓库的 README 与 issue/discussion，确认死代码定位方式、回滚机制及是否有真实项目使用案例。
