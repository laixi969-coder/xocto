      fake-3D sprite for in-game display
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 像素画师或独立游戏开发者手里已有角色正面、侧面、背面等四张视图时，在 Claude Code、Codex、Cursor 等编码代理中调用这个技能，把四张像素视图合成为可旋转的伪3D精灵。最终交付是可旋转的精灵素材，具体输出格式与人工校对环节仍待核验。
    inspiration: 趋势：像素游戏与独立游戏的美术资产正被拆成可由编码代理执行的单步工序，代理开始承担素材加工而非只写代码。切入：从独立游戏工作室和像素画外包团队进入，按角色或按套素材交付可旋转精灵，而不是卖通用工具；付费路径尚未披露。
