        usage_reason_en: The material offers only a repository title and star growth; stars are attention
          evidence and cannot explain why users choose it. Without feature docs, usage documentation or
          user feedback, it cannot be shown which step it removes versus the old way; this is an inference
          gap, not a verified fact.
      gates:
      - gate: value
        status: insufficient
        reason: 它想解决什么需求、什么痛点都写不出来：材料只有标题与星标，没有使用者、材料、动作与交付，价值关无法成立。
