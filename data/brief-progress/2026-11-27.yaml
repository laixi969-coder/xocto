      public tagline it surfaces the people who need a reply first, but what it ingests, what ranking
      or summarization it performs and what it delivers are not disclosed, so the concrete workflow and
      output remain unverified.
    inspiration_en: 'Trend: high-frequency email workflows are being re-sorted by "who needs me" rather
      than by time, with privacy as a differentiator. Entry: start with lawyers, consultants and founders
      whose inbound volume and reply priority map directly to revenue, selling a prioritized reply queue
      rather than another inbox client; pricing is undisclosed and must not be assumed.'
    req_initial:
      verdict: true_demand
