  the-new-york-times-warns-photographers-not-to-update-photosh:
    slug: the-new-york-times-warns-photographers-not-to-update-photosh
    name: Adobe Photoshop
    decision: market_context
    summary_zh: 2026年11月，Adobe 发布 Photoshop 2027 更新，新增包括 AI Assistant 在内的多项 AI 功能；《纽约时报》摄影负责人 Meaghan
      Looram 与 Josh Haner 在内部邮件中要求自由摄影师暂不升级，理由是这些功能可能使照片元数据被标记为 AI 生成。对 AI 应用的含义是：生成式功能嵌入专业创作工具后，内容溯源与元数据合规成为交付环节的新约束，专业媒体客户可能因此推迟采用新版本（推断）。
    summary_en: In November 2026, Adobe shipped the Photoshop 2027 update with several new AI features,
      including an AI Assistant; New York Times photography leaders Meaghan Looram and Josh Haner asked
      freelance photographers in an internal email not to upgrade, because those features can cause photo
      metadata to be flagged as AI-generated. For AI adoption, this means content provenance and metadata
      compliance become a delivery constraint once generative features are embedded in professional creative
      tools, and professional media customers may delay adopting new versions (inference).
    event_summary_zh: Adobe 于 2026 年 11 月发布 Photoshop 2027 更新，加入 AI Assistant 等新 AI 功能；《纽约时报》摄影部门负责人 Meaghan
      Looram 和 Josh Haner 发邮件要求自由摄影师不要升级，称相关功能可能导致照片元数据被标记为 AI 生成。
    event_summary_en: Adobe released the Photoshop 2027 update in November 2026 with new AI features including
      an AI Assistant; New York Times photography leaders Meaghan Looram and Josh Haner emailed freelance
      photographers asking them not to upgrade, saying the features can result in metadata identifying
      photographs as AI-generated.
