      与 Hy4 flash 等模型支持，将 DFlash 投机解码拆分为独立草稿方法，弃用旧 llama_batch API 改用 llama_batch_ext，并引入 Kokoro、Zonos3-Mini、VoxCPM2、MiniMax-Music3、Fish
      S2、Kyutai Hibiki 等大量 TTS 与音频模型，以及按 bpw 或体积预算的逐张量自动量化与 llama-server 槽位调度重构。
    event_summary_en: llama.cpp v1.1.0 adds support for the Inkling 2 family (base, Mini and DSpark),
      Domyn Edge 4B, Zaya1 8B, RAON-1-mini and Hy4 flash, splits DFlash speculative decoding into separate
      draft methods, deprecates the old llama_batch API in favour of llama_batch_ext, and brings a large
      set of TTS and audio models including Kokoro, Zonos3-Mini, VoxCPM2, MiniMax-Music3, Fish S2 and
      Kyutai Hibiki, along with automatic per-tensor quantization targeting a bpw or size budget and a
      slot-scheduling refactor in llama-server.
