    summary_zh: 浏览网页时，事实核查编辑或内容审核员遇到可疑图片和视频，扩展在本地设备上直接判断并标出疑似 AI 生成的内容，用户据此决定是否采用或标注来源。检测在本地运行、不上传素材，但具体判定准确率与误报情况仍待核验。
    inspiration: 趋势：AI 生成图像和视频大量进入信息流，判断“这张图是不是真的”正从人工经验变成需要工具辅助的日常动作。切入：从新闻事实核查、内容审核这类对误用后果敏感的团队切入，卖点可以是可审计的判定记录与误报申诉流程，而非单次检测；公开材料未披露定价，具体卖法待核验。
    summary_en: While browsing the web, a fact-checking editor or content moderator who meets a suspicious
      image or video gets a local, on-device judgement flagging likely AI-generated content, then decides
      whether to use it or label its source. Detection runs locally without uploading material, but the
      actual accuracy and false-positive rate still need verification.
    inspiration_en: 'Trend: AI-generated images and video are flooding information feeds, so judging whether
      an image is real is shifting from human experience to tool-assisted routine work. Entry: start with
      news fact-checking and content moderation teams sensitive to misuse, selling auditable judgement
      records and a false-positive appeal flow rather than one-off detection; public material discloses
      no pricing, so the selling model needs verification.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 事实核查编辑或内容审核员在浏览社交媒体、新闻页面时，对页面上的图片和视频逐张判断是否为 AI 生成，以便决定是否采用、标注来源或拦截。
