      code locally, then lets AI edit only the parts the developer has approved, delivering a controlled
      code change. Supported languages, approval granularity and delivery format still need verification.'
    inspiration_en: 'Trend: the bottleneck in AI coding is shifting from whether code can be generated
      to whether the edit scope is controllable and the code stays private. Entry: target software teams
      with compliance or confidentiality constraints, starting from the step where code never leaves the
      local machine and every change needs approval, charging per seat or via private deployment; public
      materials do not disclose pricing.'
    req_initial:
