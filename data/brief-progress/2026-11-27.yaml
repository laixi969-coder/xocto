      - gate: consensus
        status: insufficient
        reason: 星标从 58 增至 332 说明有关注，但没有 issue、讨论或用户反馈证明它被持续使用。
        evidence_ids:
        - ev-3049a78c2e0b10aa
        - ev-2a537b2c4531201b
