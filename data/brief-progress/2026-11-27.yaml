        usage_reason_zh: 推断：相较自建回测，它把冻结时点数据与逐次前视检查打包成可复现流程，并给出公开榜单，减少投资者自行排查数据泄漏的步骤，因此关注回测可信度的量化爱好者会试用。
        usage_reason_en: 'Inference: versus self-built backtests, it packages point-in-time data and per-run
          look-ahead checks into a reproducible flow with a public leaderboard, cutting the step of manually
          hunting data leakage, so quant hobbyists who care about backtest credibility would try it.'
