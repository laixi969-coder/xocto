        current_alternative_zh: 人工阅读简历、用关键词筛选系统，或直接调用通用大模型打分。
        current_alternative_en: Reading resumes by hand, using keyword-based filters, or calling a general
          LLM to score resumes.
        usage_reason_zh: 推断：它要求每个分数附简历原文引用并做盲筛脱敏，把“模型为什么给这个分”变成可核对的一步，减少招聘人员复核依据的负担，因此有合规要求、简历量大的招聘团队会试用。
        usage_reason_en: 'Inference: it requires a resume quote behind every score and applies blind redaction,
          making ''why this score'' checkable and reducing the reviewer''s burden of verifying rationale,
          so compliance-bound teams with high resume volume would try it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决简历初筛耗时且模型打分不可追溯的问题，交付为带原文引用的分数与人工审批结果。
        evidence_ids:
        - ev-34bffab573a46c37
      - gate: consensus
        status: insufficient
        reason: 仅有约八十星关注，缺少招聘团队采用或评价证据。
        evidence_ids:
        - ev-34bffab573a46c37
      - gate: model
        status: insufficient
        reason: 开源项目，未披露定价与买方，是否有人为可审计筛选付费尚不清楚。
        evidence_ids:
        - ev-34bffab573a46c37
      - gate: truth
        status: insufficient
        reason: 打分准确率、本地部署成本与人工复核实际负担均无公开材料。
        evidence_ids:
        - ev-34bffab573a46c37
      next_validation: 收集该仓库的 issue 与部署文档，查看招聘场景下的打分准确率与本地部署成本反馈。
