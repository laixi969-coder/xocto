    event_summary_en: On 26 November 2026 it was reported that Swedish payments company Trustly closed
      a USD 60 million equity round to fund AI product development. The public material gives only the
      amount and the intended use, with no specific AI product, pricing or customer adoption disclosed.
    category: AI + 商业
    project_type: ai_transformation
    industries:
    - 支付与金融服务
    industries_en:
