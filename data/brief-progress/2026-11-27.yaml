    inspiration: 趋势：考公这类高竞争、资料密集的应试场景，正被自部署的 AI 学习系统拆成资料解析、出卷、批改、学情四步。切入：从省考细分科目或某类申论批改切入，卖按套卷或按批改份数的结果，而非卖工具；需先解决评分可信度。
    summary_en: Exam candidates open it to feed national and provincial civil service exam notes and past
      papers into the system; the AI parses materials, mines knowledge points, generates and grades tests,
      and outputs a skill map and learning feedback. It is local-first and self-hosted; grading accuracy
      and human review steps remain unverified.
    inspiration_en: 'Trend: high-stakes, material-heavy exam prep like civil service tests is being split
      by self-hosted AI into parsing, test generation, grading and feedback. Entry: start with one provincial
      subject or essay grading, selling per-paper or per-grading results rather than a tool; scoring credibility
      must be solved first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 备考国考、省考的考生在整理讲义、真题和错题时，把材料交给系统，要完成知识点梳理、模拟出卷、批改和查漏补缺。
        job_en: Candidates preparing for national and provincial civil service exams feed notes, past
          papers and mistakes into the system to organize knowledge points, generate mock tests, get grading
          and close learning gaps.
        pain_zh: 考公资料量大、科目多，考生自己整理知识框架和批改申论耗时且缺反馈；旧做法靠报班、买题库和人工批改，成本高、反馈慢。
        pain_en: Civil service prep involves large volumes across many subjects; candidates spend long
          hours building knowledge frameworks and grading essays with little feedback. The old way relies
          on paid classes, question banks and human grading, which is costly and slow.
        current_alternative_zh: 线下/线上培训班、纸质题库、通用大模型问答，以及考生自己手抄整理错题本。
        current_alternative_en: Offline or online prep classes, paper question banks, general LLM chat,
          and candidates hand-copying their own mistake notebooks.
        usage_reason_zh: 推断：相较通用大模型逐条问答，它把资料解析、出卷、批改和学情串成一条闭环，减少考生自己拆知识点和手动对答案的步骤；愿意自部署、重视本地资料隐私的考生会因此选择它。
        usage_reason_en: 'Inference: unlike one-off LLM Q&A, it chains parsing, test generation, grading
          and feedback into one loop, cutting the steps of manually breaking down knowledge points and
          checking answers; candidates willing to self-host and protect local materials would choose it.'
      gates:
