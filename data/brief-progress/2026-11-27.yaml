  slopsquatshield:
    slug: slopsquatshield
    name: SlopSquatShield
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 信息安全
    industries_en:
    - software development
    - information security
    jobs:
    - 开发者在让 AI 编码代理安装依赖包时，拦截不存在或疑似抢注的包名，避免把恶意包装进项目
    - 安全或平台工程师在提交与 IDE 环节设置检查，阻止团队误引入仿冒包
    jobs_en:
    - Developers intercepting nonexistent or lookalike package names when letting an AI coding agent install
      dependencies, to avoid pulling malicious packages into the project
    - Security or platform engineers setting checks at commit and IDE stages to stop teams from importing
      impersonated packages
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在让 AI 编码代理安装 npm、PyPI 或 Maven 包时，它检查包名是否存在或像抢注陷阱并拦截，可在终端、代理钩子、提交和 IDE 中运行，最终给出放行或阻断；误报率与拦截规则仍待核验。
    inspiration: 趋势：AI 编码代理自动装包让“幻觉包名被抢注”成为新的供应链攻击面。切入：从使用代理写代码的团队进入，把检查嵌进提交与 IDE 环节，卖团队级策略与审计而非单次扫描；拦截准确率是待核验的一环。
    summary_en: When a developer lets an AI coding agent install npm, PyPI or Maven packages, it checks
      whether names exist or look like squatting traps and blocks them, running in terminal, agent hooks,
      commit and IDE, returning allow or block; false-positive rate and rules remain unverified.
    inspiration_en: 'Trend: agents installing packages automatically turn hallucinated names into a new
      supply-chain attack surface. Wedge: enter through teams coding with agents, embed checks at commit
      and IDE stages, and sell team-level policy and audit rather than one-off scans; interception accuracy
      is the open question.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在让 AI 编码代理安装依赖时，需要确认包名真实存在且不是仿冒抢注，才能把包安全装进项目。
        job_en: A developer letting an AI coding agent install dependencies needs to confirm package names
          are real and not impersonation traps before installing them safely.
        pain_zh: 代理会编造不存在的包名，攻击者可抢先注册同名包，一旦装上就引入恶意代码，事后排查代价高。
        pain_en: Agents invent nonexistent package names that attackers can pre-register, injecting malicious
          code once installed, with costly after-the-fact cleanup.
        current_alternative_zh: 人工逐个核对包名，或依赖事后扫描与代码评审发现问题。
        current_alternative_en: Manually checking each package name, or relying on after-the-fact scanning
          and code review.
        usage_reason_zh: 推断：它在装包动作发生前就拦截可疑名称，省去事后排查与人工核对这一步，因此使用代理写代码的团队会在提交和 IDE 环节启用它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: it blocks suspicious names before installation, skipping manual checking
          and after-the-fact cleanup, so teams coding with agents would enable it at commit and IDE stages;
          no user feedback or retention evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理自动装包时误装不存在或仿冒包名的需求，痛点是不拦截就要承担恶意代码与事后排查；属工作流推理。
        evidence_ids:
        - ev-d95f3b0d0d99186e
      - gate: consensus
        status: insufficient
        reason: 仅有一个仓库星数信号，没有用户评价、客户案例或团队采用说明。
        evidence_ids:
        - ev-d95f3b0d0d99186e
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或企业采购路径；买方可能是安全预算充足的研发团队，这是判断不是已验证事实。
        evidence_ids:
        - ev-d95f3b0d0d99186e
      - gate: truth
        status: insufficient
        reason: 拦截规则、误报率与对真实抢注包的识别能力未核验，交付确定性存疑。
        evidence_ids:
        - ev-d95f3b0d0d99186e
      next_validation: 收集该仓库的 README 与 issue，核验拦截规则来源、误报处理方式以及是否有团队实际部署的公开记录。
