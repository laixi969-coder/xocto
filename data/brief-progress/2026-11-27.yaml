    regions: []
    regions_en: []
    open_source: true
    summary_zh: 设计师在概念阶段画完二维轮廓后打开它，把轮廓推拉成三维体块，得到可继续编辑的基础模型；它同时提供桌面端、命令行和 MCP 接口，具体建模精度与导出格式仍待核验。
    inspiration: 趋势：三维建模的入口正从复杂 CAD 界面向“先画轮廓再推拉”的轻量动作迁移，并开始暴露给 AI 代理调用。切入：从工业设计或建筑方案的概念阶段进入，卖按项目或按席位的早期造型工具，而非替代完整
      CAD；代理接口能否稳定产出可用几何体是待核验的一环。
    summary_en: Designers sketch a 2D outline and pull it into a 3D block to get an editable base model;
      it ships as a desktop app, CLI and MCP interface, while modeling precision and export formats remain
      unverified.
    inspiration_en: 'Trend: the entry point to 3D modeling is shifting from heavy CAD interfaces toward
      a lightweight sketch-then-pull action, now exposed to AI agents. Wedge: enter at the concept stage
      of industrial or architectural design and sell early-form tools per project or seat rather than
      replacing full CAD; whether the agent interface reliably yields usable geometry is the open question.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 产品设计师或建筑从业者在概念阶段拿到手绘或二维轮廓草图，需要快速得到可推拉的三维体块，用于确认造型方向。
