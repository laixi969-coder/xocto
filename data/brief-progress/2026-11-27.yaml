        evidence_ids:
        - ev-af5b5dad4c2a66bb
      - gate: truth
        status: insufficient
        reason: 依赖 PoB 计算与第三方数据源，准确性可核对，但未见实测或错误率材料。
        evidence_ids:
        - ev-af5b5dad4c2a66bb
      next_validation: 收集仓库 issue 与 discussion 中玩家对计算结果准确性和使用场景的反馈。
