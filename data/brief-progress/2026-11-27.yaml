    open_source: false
    summary_zh: 开发者在 IDE 里改完代码、准备提交前打开它，把这次改动交给 QA 代理执行验证，再拿到一份可核对的检查结果；具体覆盖哪些测试类型、失败后如何回传修复建议，公开材料未说明，流程与交付仍待核验。
    inspiration: 趋势：代码生成变便宜后，验证改动是否破坏既有功能成为新的瓶颈环节。切入：从已有自动化测试但维护成本高的中小研发团队进入，把回归验证做成按次或按项目计费的交付，而不是再卖一个编辑器插件。
    summary_en: Before committing, a developer opens it in the IDE and hands the change to QA agents for
      verification, receiving a checkable result; which test types are covered and how failures feed back
      fixes are not stated publicly, so the workflow and deliverable remain unverified.
    inspiration_en: 'Trend: as code generation gets cheap, verifying that a change does not break existing
      behavior becomes the new bottleneck. Entry: start with small and mid-size engineering teams that
      already have automated tests but struggle to maintain them, selling regression verification per
      run or per project rather than another editor plugin.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在 IDE 中完成一次代码改动后，需要在合并前确认它没有破坏既有功能，并拿到可核对的验证结果。
        job_en: After finishing a code change in the IDE, a developer needs to confirm before merging
          that existing functionality still works and obtain a checkable verification result.
        pain_zh: 回归测试的编写与维护成本高，开发者常在提交前跳过完整验证，缺陷因此流到测试或线上环节才被发现。
        pain_en: Writing and maintaining regression tests is costly, so developers often skip full verification
          before committing, and defects surface only in QA or production.
        current_alternative_zh: 依赖手写单元与端到端测试、CI 流水线，或人工点检关键路径；小团队往往只做冒烟测试。
        current_alternative_en: Hand-written unit and end-to-end tests, CI pipelines, or manual checks
          of critical paths; small teams often only run smoke tests.
        usage_reason_zh: 推断：它把验证动作放进开发者已在使用的 IDE，改动后直接触发 QA 代理执行检查，省去切换到测试平台或另写脚本的一步；对测试维护负担重、又想在合并前多一道检查的团队更有吸引力。
        usage_reason_en: 'Inference: it places verification inside the IDE developers already use, triggering
          QA agents right after a change and removing the step of switching to a test platform or writing
          scripts; it appeals to teams burdened by test maintenance that want an extra check before merging.'
      gates:
      - gate: value
        status: supported
        reason: 它解决改动合并前缺少可靠回归验证的问题，痛点具体且不验证有线上故障代价；但覆盖范围与交付确定性仅来自一句产品描述。
        evidence_ids:
        - ev-60e0708d3d566926
      - gate: consensus
        status: insufficient
        reason: 仅有发布渠道的一句介绍，没有用户评价、客户案例或采用数据，无法判断开发者是否真的把它放进提交流程。
        evidence_ids:
        - ev-60e0708d3d566926
      - gate: model
        status: insufficient
        reason: 未披露定价、买方是个人开发者还是研发团队，也未说明按席位还是按验证次数收费，付费路径无法核验。
        evidence_ids:
        - ev-60e0708d3d566926
      - gate: truth
        status: insufficient
        reason: 未说明 QA 代理如何生成用例、误报率如何、失败结果是否可复现，承诺能否确定性交付缺少材料。
        evidence_ids:
        - ev-60e0708d3d566926
      next_validation: 收集 QA.tech 官方定价页或文档，确认按什么计价、覆盖哪些测试类型以及验证结果如何回传。
