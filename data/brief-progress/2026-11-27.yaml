          to combine the views into a rotatable fake-3D sprite for in-game display or asset delivery.
        pain_zh: 从四张平面视图手工推导旋转帧需要逐帧绘制或借助专门工具，重复且耗时；不做的后果是角色只能以固定朝向呈现。
