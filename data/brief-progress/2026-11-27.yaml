  94-of-indian-brand-websites-fail-basic-ai-readability-test-s:
    slug: 94-of-indian-brand-websites-fail-basic-ai-readability-test-s
    name: Indian brand websites AI readability study
    decision: market_context
    summary_zh: 一项研究显示，94%的印度品牌网站未通过基础AI可读性测试，表明多数品牌站点缺乏便于AI抓取与理解的结构化内容；这意味着AI应用在品牌信息获取与自动化服务上的数据基础薄弱，可能抬高部署与集成成本（推断）。
    summary_en: A study found that 94% of Indian brand websites fail a basic AI readability test, indicating
      most brand sites lack structured content that AI can readily crawl and interpret; this suggests
      a weak data foundation for AI-driven brand information and automated services, potentially raising
      deployment and integration costs (inference).
    event_summary_zh: 一项研究称，94%的印度品牌网站未通过基础AI可读性测试。
    event_summary_en: A study reported that 94% of Indian brand websites fail a basic AI readability test.
