          office material into executable tasks or deliverable documents, and call agents to complete
          this step.
        pain_zh: 办公材料分散在文档、消息和任务系统中，人工汇总与转写耗时且易漏；不处理的后果是任务延误或信息不一致。
        pain_en: Office material is scattered across documents, messages and task systems; manual consolidation
          and transcription is slow and error-prone, and failing to handle it causes delayed tasks or
          inconsistent information.
        current_alternative_zh: 员工手动在飞书文档、消息和任务之间复制粘贴、逐条汇总，或使用通用聊天助手单独生成内容再贴回。
        current_alternative_en: Employees manually copy and paste between Feishu documents, messages and
          tasks, consolidate item by item, or use a general chat assistant to generate content separately
