        usage_reason_en: 'Inference: compared with handing the whole repository to a general coding assistant
          and reviewing every diff, it first builds a local code map and restricts AI edits to approved
          parts, removing the step of screening out-of-scope changes; teams that care about code confidentiality
          and controllable edits would choose it when taking over an unfamiliar codebase.'
      gates:
      - gate: value
