          needs a pushable 3D massing block quickly to confirm form direction.
        pain_zh: 完整 CAD 建模在概念阶段过重，改一次造型要重走建模流程，早期想法难以低成本试错。
        pain_en: Full CAD modeling is heavy at concept stage; each form change restarts the modeling flow,
          making early ideas costly to try.
        current_alternative_zh: 用完整 CAD 软件手工建模，或先在纸上画草图再交给建模人员。
        current_alternative_en: Hand-modeling in full CAD software, or sketching on paper and handing
          it to a modeler.
        usage_reason_zh: 推断：它把“画轮廓—推拉成体”压缩成一步，省去在 CAD 里重建基础几何的环节，因此概念阶段想快速试造型的设计师会先试它；尚无用户反馈或留存证据。
        usage_reason_en: 'Inference: it compresses sketch-outline-then-pull into one step, skipping rebuilding
          base geometry in CAD, so designers testing forms early would try it first; no user feedback
