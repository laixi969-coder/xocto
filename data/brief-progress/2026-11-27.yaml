    jobs:
    - 竖屏短剧编导在把剧本转成可拍摄分镜时，用这套脚本把故事板、提示词编译和剪辑草稿串成流水线，产出可导入剪辑软件的分镜与草稿并做帧级检查
    jobs_en:
    - Vertical short-drama directors converting a script into shootable storyboards use these scripts
      to chain storyboard, prompt compilation and editing drafts into a pipeline, producing storyboards
      and drafts importable into editing software with frame-level checks
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 竖屏短剧编导在把剧本转成分镜和剪辑草稿时，打开这套脚本，让 AI 按故事板模板生成分镜、编译视频生成提示词，并输出可导入剪映/CapCut 的草稿与帧级质检结果；最终交付是分镜、提示词和剪辑草稿，人工仍需确认画面与节奏。具体流程与交付细节仍待核验。
    inspiration: 趋势：竖屏短剧的产能瓶颈正从拍摄转向分镜与提示词编排，有人开始把编导流程写成可复用的脚本流水线。切入：面向短剧工作室或漫剧团队，按项目或按集交付分镜与剪辑草稿，而不是卖通用工具；需先核验其脚本是否真能稳定产出可用草稿。
    summary_en: When converting a script into storyboards and editing drafts, vertical short-drama directors
      run these scripts so AI generates storyboards from templates, compiles video-generation prompts,
      and outputs drafts importable into Jianying/CapCut plus frame-level QC results; the deliverable
      is storyboards, prompts and editing drafts, with humans still confirming visuals and pacing. The
      exact workflow and deliverables remain to be verified.
    inspiration_en: 'Trend: the bottleneck in vertical short-drama output is shifting from shooting to
      storyboarding and prompt orchestration, and someone is packaging the directing workflow as reusable
      scripts. Entry: target short-drama studios or comic-drama teams, selling storyboards and editing
      drafts per project or per episode rather than a generic tool; first verify whether the scripts reliably
      produce usable drafts.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 竖屏短剧编导在把剧本转成可拍摄分镜和剪辑草稿时，处理故事板、视频生成提示词和剪辑工程文件，要完成从剧本到可导入剪辑软件的分镜与草稿。
        job_en: Vertical short-drama directors converting a script into shootable storyboards and editing
          drafts handle storyboards, video-generation prompts and editing project files, aiming to go
          from script to storyboards and drafts importable into editing software.
        pain_zh: 分镜、提示词和剪辑草稿原本靠人工逐条编写和反复返工，集数多时重复劳动重、一致性难保证。
        pain_en: Storyboards, prompts and editing drafts are normally written and reworked by hand item
          by item; with many episodes the repetition is heavy and consistency is hard to keep.
        current_alternative_zh: 编导手工写分镜表、逐条调提示词，再把素材手动导入剪映/CapCut 拼草稿。
        current_alternative_en: Directors hand-write storyboard sheets, tune prompts one by one, then
          manually import footage into Jianying/CapCut to assemble drafts.
        usage_reason_zh: 推断：这套脚本把故事板模板、提示词编译和草稿导出串成一次执行，减少逐条写分镜和手动拼草稿的步骤，因此集数多、需要稳定产出的短剧团队会尝试它；尚无用户反馈或客户案例支持。
        usage_reason_en: 'Inference: the scripts chain storyboard templates, prompt compilation and draft
          export into one run, cutting the step-by-step storyboard writing and manual draft assembly,
          so short-drama teams with many episodes and a need for stable output would try it; no user feedback
          or customer cases support this yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决短剧编导从剧本到分镜与剪辑草稿的重复手工环节，痛点具体且不采用就要逐条返工；买方尚不明确。
        evidence_ids:
        - ev-6a6319a15dc545a3
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数，缺少用户评价、使用案例或社区讨论，无法判断编导是否真的把它纳入流程。
        evidence_ids:
        - ev-6a6319a15dc545a3
      - gate: model
        status: insufficient
        reason: 未披露定价或收费方式，买方可能是短剧工作室或个体编导，属判断而非已验证事实。
        evidence_ids:
        - ev-6a6319a15dc545a3
      - gate: truth
        status: insufficient
        reason: 脚本能否稳定产出可用分镜与草稿、帧级质检是否可靠，公开材料未给出实测结果。
        evidence_ids:
        - ev-6a6319a15dc545a3
      next_validation: 收集该仓库的 issue、discussion 或 README 中的可复现实测与用户反馈，核验脚本产出的分镜和剪辑草稿是否可直接使用。
  vibe-bill:
    slug: vibe-bill
    name: vibe-bill
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 云计算
    industries_en:
    - software development
    - cloud computing
    jobs:
    - 独立开发者或小团队在把 AI 生成的代码上线前，用它在 Claude Code 里估算 100 到 10 万用户规模下的运行成本，并找出推高账单的代码写法
    jobs_en:
    - Solo developers or small teams run it inside Claude Code before shipping AI-generated code to estimate
      running costs at 100 to 100k users and flag code patterns that inflate the bill
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 独立开发者或小团队在把 AI 生成的代码上线前，在 Claude Code 里调用它，由它读取代码并估算 100、1k、1万、10万用户规模下的运行成本，标出会推高账单的代码写法，最后生成一张可分享的成本回执。具体估算口径与准确度仍待核验。
    inspiration: 趋势：AI 写代码让上线门槛骤降，但云与模型调用成本被推到发布之后才暴露，成本预估正成为新的发布前检查点。切入：从独立开发者和小团队的“上线前成本体检”入手，可做按次出报告或接入
      CI 的卖法，价格未披露。
    summary_en: Before shipping AI-generated code, solo developers or small teams invoke it inside Claude
      Code; it reads the code, estimates running costs at 100, 1k, 10k and 100k users, flags patterns
      that inflate the bill, and renders a shareable cost receipt. Estimation method and accuracy still
      need verification.
    inspiration_en: 'Trend: AI coding lowers the shipping barrier, but cloud and model costs surface only
      after launch, making cost estimation a new pre-launch checkpoint. Entry: start with pre-launch cost
      checks for solo developers and small teams, sold per report or wired into CI; pricing is undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立开发者或小团队在用 AI 生成应用后、正式上线前，处理自己写出的代码，要判断按用户规模增长后每月运行成本大概多少、哪里写法最烧钱。
        job_en: After generating an app with AI and before launch, solo developers or small teams work
          on their own code to judge roughly what monthly running costs will be as users grow and which
          patterns burn the most money.
        pain_zh: AI 生成的代码往往在架构和调用上不节制，成本要等真实流量上来才暴露，届时改造成本高；开发者缺少上线前的成本预判手段。
        pain_en: AI-generated code is often wasteful in architecture and calls; costs surface only with
          real traffic, when rework is expensive, and developers lack a pre-launch cost forecast.
        current_alternative_zh: 靠云厂商账单事后发现、手工翻定价页估算，或凭经验拍脑袋。
        current_alternative_en: Discovering it on cloud bills after the fact, manually reading pricing
          pages, or guessing from experience.
        usage_reason_zh: 推断：它在 Claude Code 内直接读代码并按多档用户规模给出成本估算和烧钱写法清单，把原本要等账单或手工估算的一步提前到上线前完成，因此在意早期成本的独立开发者会在发布前使用它。
        usage_reason_en: 'Inference: it reads code inside Claude Code and returns cost estimates across
          user tiers plus a list of costly patterns, moving a step that used to wait for bills or manual
          math to before launch, so cost-conscious solo developers would use it pre-release.'
      gates:
      - gate: value
        status: supported
        reason: 它解决上线前不知道运行成本、烧钱写法要等账单才暴露的痛点，旧做法是事后看账单或手工估算，结构上成立。
        evidence_ids:
        - ev-41bb8735d9867caf
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，没有用户评价或案例说明开发者是否真的在发布前用它。
        evidence_ids:
        - ev-513bcd45341f0b99
      - gate: model
        status: insufficient
        reason: 开源免费，未见付费路径；可能的买方是开发者本人或团队，属判断而非已验证事实。
        evidence_ids:
        - ev-41bb8735d9867caf
      - gate: truth
        status: insufficient
        reason: 成本估算依赖定价与用量假设，准确度未公开，是否贴近真实账单无法核对。
        evidence_ids:
