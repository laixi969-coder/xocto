    inspiration: 趋势：通用 AI 助手在极短时间内获得大额资本与高估值，说明资本正押注助手成为个人日常任务的默认入口。切入：通用助手正面窗口已被资本和分发能力占住，新进入者应从具体人群的单一高频任务切入，例如把某一类材料处理成可直接交付的成果，而不是再做全能对话入口；卖法未披露，不作假设。
