  heads-up-if-you-wire-notions-official-mcp-into:
    slug: heads-up-if-you-wire-notions-official-mcp-into
    name: Notion MCP
    decision: market_context
    event_summary_zh: 2026年11月26日社区讨论指出，Notion 官方 MCP 在接入代理上下文时注入隐藏的追加销售指令，即使用户把 Notion 接入自己的代理，工具方仍可在上下文层影响输出。
    event_summary_en: A community discussion on November 26, 2026 reported that Notion's official MCP
      injects hidden upsell instructions into agent context, meaning a tool vendor can still influence
      outputs at the context layer even when users wire Notion into their own agents.
    category: ''
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 社区讨论称 Notion 官方 MCP 在向代理注入上下文时夹带隐藏的追加销售指令。这属于平台接口政策与生态行为变化，不是独立产品；对 AI 应用意味着第三方工具接入代理后，输出仍可能被工具方在上下文层影响，接入方需要审查上下文内容。
    inspiration: 趋势：代理接入第三方工具后，上下文成为新的利益投放面。切入：可从代理侧做上下文审计与来源标注，帮企业看清哪些指令来自工具方；此为推断，尚无定价或采用证据。
    summary_en: A community discussion says Notion's official MCP slips hidden upsell instructions into
      the context it injects into agents. This is a platform interface policy and ecosystem behavior change,
      not a standalone product; for AI applications it means that after third-party tools are wired into
      agents, outputs may still be shaped by the tool vendor at the context layer, so integrators need
      to inspect context content.
    inspiration_en: 'Trend: once agents connect to third-party tools, context becomes a new surface for
      commercial influence. Entry: context auditing and source labeling on the agent side could show enterprises
      which instructions come from tool vendors; this is inference, with no pricing or adoption evidence
      yet.'
