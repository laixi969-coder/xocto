    summary_zh: 英国央行就AI融资风险发出警告，将AI相关资本开支的融资结构纳入金融稳定评估。对AI行业而言，这预示监管可能加强对AI投资杠杆与表外安排的审视，进而影响AI基础设施与应用企业的融资可得性与成本。
    summary_en: The Bank of England issued a warning on AI financing risk, bringing the funding structure
      of AI-related capital expenditure into its financial stability assessment. For the AI industry,
      this signals that regulators may scrutinize leverage and off-balance-sheet arrangements in AI investment
      more closely, affecting the availability and cost of financing for AI infrastructure and application
      companies.
    event_summary_zh: 英国央行就AI融资风险发出警告，将其纳入金融稳定评估范围。
    event_summary_en: The Bank of England issued a warning about AI financing risk, bringing it into the
      scope of its financial stability assessment.
  英国央行警告ai融资风险大型科技公司债务及表外承诺超4万亿美元:
