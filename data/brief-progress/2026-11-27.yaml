        usage_reason_en: 'Inference: compared with purely manual image-by-image reading, it embeds AI
          analysis into the reading workflow to flag suspicious regions, reducing the initial screening
          burden; physicians still confirm results, so high-volume screening sites would choose it.'
      gates:
