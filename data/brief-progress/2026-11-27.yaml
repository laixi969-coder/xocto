    jobs_en:
    - A 3D artist with only one reference image uses a coding agent to drive this tool to produce a multi-view
      sculpt aligned to that image, then replays it in Blender to inspect and obtain a model that can
      be further edited
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师手上只有一张参考图时，打开这个开源工具，让编码代理按该图生成配准视角并做贴图拟合，再在 Blender 中回放与延时记录，最终拿到与参考图对齐、可继续修改的雕塑模型；具体精度与人工修整量仍待核验。
    inspiration: 趋势：单图到三维的生成正在从“出个大概形状”走向“按参考图对齐、可回放检查”，这让三维前期草模环节第一次可能被压缩。切入：从游戏与影视美术的外包草模环节进入，按交付的可用模型或修整工时收费，而不是卖工具席位；先解决对齐精度与可编辑性，再谈批量。
    summary_en: When a 3D artist has only one reference image, they open this open-source tool and let
      a coding agent generate registered views and run map-fitting passes against that image, then replay
      and timelapse it in Blender to get a sculpt aligned to the reference that can be further edited;
      actual accuracy and manual cleanup effort remain to be verified.
    inspiration_en: 'Trend: single-image-to-3D is moving from rough shapes to reference-aligned output
      that can be replayed and inspected, which may compress the early blockout stage of 3D work. Entry:
      start with outsourced blockout for game and film art, charging per usable delivered model or cleanup
      hours rather than per seat; solve alignment accuracy and editability first, then scale.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师只有一张参考图时，需要先得到一个与图对齐、可在 Blender 里继续修改的草模，再进入正式建模。
        job_en: With only one reference image, a 3D artist needs a blockout aligned to that image that
          can be edited further in Blender before starting formal modeling.
        pain_zh: 从单张图手工搭草模要反复对视角和比例，耗时且容易偏离参考；不做的后果是前期返工。
        pain_en: Hand-building a blockout from a single image requires repeated view and proportion matching,
          is slow and drifts from the reference; skipping it causes early rework.
        current_alternative_zh: 手工在 Blender 里搭基础网格，或用通用图生三维工具出形状后再人工对齐。
        current_alternative_en: Hand-building base meshes in Blender, or using generic image-to-3D tools
          and then manually aligning the result.
        usage_reason_zh: 推断：它把配准视角与贴图拟合做成可重复的步骤，并在 Blender 中回放，减少手工对视角这一步；需要按参考图精确起模的美术师会因此选择它，但精度是否够用尚无用户反馈支持。
        usage_reason_en: 'Inference: it turns view registration and map fitting into repeatable steps
          and replays them in Blender, reducing manual view matching; artists who need precise reference-based
          blockouts would choose it, but whether accuracy suffices is not yet supported by user feedback.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单图起三维草模时反复对视角、比例的问题，旧做法是手工搭网格，痛点具体；交付能否确定仍待核验。
        evidence_ids:
        - ev-4e0fe8228dd751d3
        - ev-aba47bb02440a73a
      - gate: consensus
        status: insufficient
        reason: 只有仓库星数缓慢增长，没有用户评价或客户案例说明谁在什么场景下持续使用。
        evidence_ids:
        - ev-aba47bb02440a73a
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费或按结果收费的公开材料，买方与收费路径不明。
        evidence_ids:
        - ev-4e0fe8228dd751d3
      - gate: truth
        status: insufficient
        reason: 未见与参考图对齐精度的可复现实测，也未说明人工修整边界，交付确定性无法核对。
        evidence_ids:
        - ev-4e0fe8228dd751d3
      next_validation: 收集该仓库的 issue 与 discussion，核对使用者对参考图对齐精度和 Blender 后续编辑的实际反馈。
