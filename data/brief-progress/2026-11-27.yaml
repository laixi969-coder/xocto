      side, back), they invoke this skill inside coding agents such as Claude Code, Codex or Cursor to
      combine the views into a rotatable fake-3D sprite. The deliverable is a spinnable sprite asset;
      output format and manual review steps still need verification.
    inspiration_en: 'Trend: pixel and indie game art assets are being broken into single steps that coding
      agents can execute, with agents handling asset processing rather than only code. Entry: start from
      indie studios and pixel-art outsourcing teams, selling rotatable sprites per character or per asset
      set rather than a generic tool; the payment path is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 像素画师或独立游戏开发者在已有角色四视图素材时，用编码代理把四张视图合成为可旋转的伪3D精灵，用于游戏内展示或素材交付。
