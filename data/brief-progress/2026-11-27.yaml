    summary_zh: 研究者在复现或审阅 ART 论文时打开这个仓库，获取随论文发布的数据包；AI 在此不执行具体动作，仓库本身只是数据与材料的分发载体。用户最终拿到的是可下载的数据文件，具体内容、格式与配套流程仍待核验。
