    inspiration: 趋势：营销工作正被拆成可交给 AI 代理逐环节执行的技能，而不是一个笼统的生成按钮。切入：从本地商家这类缺专职营销人员的群体进入，把调研、定位到落地页文案串成一条可交付的流程，按产出或代运营收费；目前只有开源技能包，尚无定价与客户案例。
