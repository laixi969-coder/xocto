        usage_reason_zh: 推断：相较通用聊天助手逐条零散生成，这套技能包把研究、定位、文案、SEO 等环节固化为代理可依次执行的步骤，减少用户反复写提示词和拼接产出的负担，因此缺专职营销人员的本地商家或小团队会在需要成套营销材料时选择它。
        usage_reason_en: 'Inference: compared with piecemeal generation in a general chatbot, this skill
          pack fixes research, positioning, copy and SEO into steps an agent can execute in sequence,
          reducing the burden of rewriting prompts and stitching outputs, so local businesses or small
          teams without dedicated marketers would choose it when they need a full set of marketing materials.'
      gates:
