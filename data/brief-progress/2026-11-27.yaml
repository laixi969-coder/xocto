    inspiration: 趋势：影像 AI 正从科研演示走向监管许可后的临床工作流嵌入。切入：从乳腺筛查这类阅片量大、复核责任明确的环节进入，卖点应是可核对的分诊与报告结果，而非模型本身；具体付费方与定价尚未披露。
    summary_en: Radiologists open it while reading mammography screening images; according to the candidate
      material, the product uses AI to analyze mammography images and assist reading, while the exact
      deliverable and human confirmation step still need verification.
    inspiration_en: 'Trend: imaging AI is moving from research demos into clinical workflows after regulatory
      clearance. Entry: start with high-volume, clearly accountable reading steps such as breast screening,
      selling verifiable triage and report outcomes rather than the model itself; payer and pricing are
      not disclosed.'
