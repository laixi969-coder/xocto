      AI coding sessions, with search, filtering, hide/restore, undo, and original session preservation.
      It takes AI conversation history, performs context trimming, and outputs modified session context.
    inspiration_en: The trend is AI coding tools relying more on context, but context management becomes
      a pain point. Entry could be auto-identifying irrelevant context, auto-organizing by project or
      task, as IDE plugins or CI tools, charging per team subscription.
