        current_alternative_en: Manual anonymization or using internal models, but costly or ineffective.
        usage_reason_zh: 开源社区 41 星，有初步关注，但采用证据有限。
        usage_reason_en: 41 stars in the open-source community, initial interest, but limited adoption
          evidence.
