        status: supported
        reason: 解决 AI 代理处理敏感数据时的隐私泄露痛点，痛点刚性（合规风险），交付可确定（假数据替换与恢复）。工作流结构判断。
        evidence_ids:
        - ev-59887305aa2f8833
      - gate: consensus
        status: insufficient
        reason: 开源社区 41 星，关注度低，缺乏社区讨论或用户反馈。
        evidence_ids:
        - ev-59887305aa2f8833
      - gate: model
        status: insufficient
        reason: 未披露定价或商业模式，开源项目，付费路径不明。
        evidence_ids:
        - ev-59887305aa2f8833
      - gate: truth
        status: insufficient
        reason: 产品功能明确，但未验证实际部署效果和安全性。
