          or simply learning on the job by searching as they go.
        usage_reason_zh: 相较拼凑教程，它把 24 周路径、43 个可运行 notebook 和一条贯穿案例放在同一仓库，学习者省去自己搭环境与串联知识点这一步，能直接跑出可核对的结果；推断这类转岗工程师和带新人做
          AI 项目的团队会因此选择它。
        usage_reason_en: Compared with stitching tutorials together, it puts a 24-week path, 43 runnable
          notebooks and one continuous case study in a single repository, removing the step of building
          an environment and linking topics by hand so learners can run checkable results directly; this
          is an inference that such career-switching engineers and teams onboarding newcomers to AI projects
          would choose it.
