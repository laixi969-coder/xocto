      AI 推理能力的重要展示，可能强化 OpenAI 在高难度科学与数学计算领域的竞争定位；目前该结果仍待独立验证。
    summary_en: On September 8, 2026, OpenAI published a blog post claiming it found a solution to the
      Navier-Stokes problem, a major math problem unsolved for roughly 90 years, and the claim has drawn
      controversy. If independently verified (inference), it would be a significant demonstration of frontier
      AI reasoning capability and could strengthen OpenAI's competitive positioning in high-difficulty
      scientific and mathematical computation; the result remains subject to independent verification.
    event_summary_zh: OpenAI 在博客中宣布其获得了约 90 年悬而未决的 Navier-Stokes 数学难题的解，该声明引发外界争议。
    event_summary_en: OpenAI announced in a blog post that it found a solution to the Navier-Stokes problem,
      a major math problem unsolved for around 90 years; the claim has drawn controversy.
