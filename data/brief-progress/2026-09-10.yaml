    name: OpenAI
    decision: market_context
    summary_zh: OpenAI通过未公开的模型与GPT-6 Astra在约88小时内消耗数千亿Token生成并形式化验证了千禧年大奖难题（纳维-斯托克斯存在性与光滑性问题）的解答，同时引发了关于学术首创权及AI实验室利用用户代码会话数据训练模型的争议。这表明前沿大模型正在向高阶科学与数学形式化推理渗透，但也加剧了科研机构对使用专有模型平台导致成果被提前截获或数据泄露的顾虑。
    summary_en: OpenAI utilized unreleased models and GPT-6 Astra to produce and formalize a resolution
      to the Navier-Stokes Millennium Prize problem using hundreds of billions of tokens, triggering controversies
      over academic scooping and the potential use of user prompt data in model training. This demonstrates
      frontier LLMs pushing into formal scientific theorem proving, while intensifying researcher concerns
      over proprietary model data leakage.
    event_summary_zh: OpenAI宣布利用未公开的大模型与GPT-6 Astra验证解决了千禧年大奖难题之一的纳维-斯托克斯问题，耗费数百万次消息与上千亿Token，并引发关于数据隐私和学术优先权的争议。
    event_summary_en: OpenAI announced a resolution to the Navier-Stokes Millennium Prize Problem using
      unreleased internal models and GPT-6 Astra verification, consuming hundreds of billions of tokens
      and sparking controversies over academic priority and prompt data privacy.
