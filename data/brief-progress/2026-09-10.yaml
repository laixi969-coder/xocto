  simplify-and-support-your-torchserve-workloads-using-ray-ser:
    slug: simplify-and-support-your-torchserve-workloads-using-ray-ser
    name: Ray Serve Deep Learning Containers
    decision: market_context
    summary_zh: 2026 年 9 月，AWS 发布 Ray Serve Deep Learning Containers，为已停止维护的 TorchServe 提供受支持的替代路径。该预构建容器预先集成了框架、GPU
      驱动和推理服务层，并给出在 Amazon EKS 单 GPU 节点上部署视觉语言模型的完整示例。对依赖 TorchServe 的团队而言，GPU 推理栈的维护责任正从社区框架转向云厂商托管容器，直接影响
      AI 应用的交付成本、运维负担和推理基础设施选型。
    summary_en: In September 2026, AWS released the Ray Serve Deep Learning Containers as a supported
      replacement path for TorchServe, which is no longer maintained. The prebuilt container bundles the
      framework, GPU drivers, and serving layer, and AWS provides a walkthrough for deploying a vision-language
      model on a single GPU node on Amazon EKS. For teams relying on TorchServe, maintenance of the GPU
      inference stack is shifting from community frameworks to cloud-vendor-supported containers, directly
      affecting delivery cost, operational burden, and inference infrastructure choices for AI applications.
    event_summary_zh: AWS 发布 Ray Serve Deep Learning Containers，用于承接已停止维护的 TorchServe 的工作负载，并提供在 Amazon
      EKS 单 GPU 节点上部署视觉语言模型的迁移方案。
    event_summary_en: AWS released Ray Serve Deep Learning Containers to take over workloads from the
      now-unmaintained TorchServe, with a migration walkthrough for deploying a vision-language model
      on a single GPU node on Amazon EKS.
