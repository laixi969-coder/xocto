      in the PCB (printed circuit board) industry chain, with a continued wave of price increases across
      the PCB supply chain while leveraged funds chase related stocks. For AI applications, this implies
      upward pressure on component and deployment costs for compute hardware (inference regarding the
      cost impact).
    event_summary_zh: 报道称，AI算力需求引爆PCB供求缺口，PCB产业链涨价潮持续，最新融资客抢筹股名单同步出炉。
