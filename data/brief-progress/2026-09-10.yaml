      weighs 254g, runs on the A20 Pro chip, drops the telephoto lens and Face ID in favor of side-mounted
      Touch ID, and iOS 27 adds split-screen on phones for the first time. The iPhone 18 Pro series launched
      alongside from RMB 9,999, while the standard iPhone 18 was delayed to next spring.
