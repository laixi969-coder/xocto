  huggingface-transformers-release-5170:
    slug: huggingface-transformers-release-5170
    name: Hugging Face Transformers
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: 公开模型社区 于 2026-09-09 发布 Transformers v5.17.0，新增六类模型架构支持：HYV4（Hy4-Preview，780B 参数
      MoE、每 token 激活 49B、100 万 token 上下文）、VibeVoice 多说话人长篇语音合成框架、H Company 的 NeoMME/NeoMME-Retriever 多模态多语言基础编码器（260M/800M）、阿里巴巴达摩院
      800M 参数的 Fun-ASR-Nano 语音识别模型、Moonshot AI 的 KimiLinear 混合线性注意力架构、NVIDIA 的 Canary-1B-v2 多语言语音识别与翻译模型；同时将视觉
      2D/3D RoPE 频率计算统一为集中式模块（破坏性变更），生成流程避免每解码步同步加速器以降低每步开销，并修复 VibeVoice 量化缓存、Qwen FP8 embedding、XPU
      上 MXFP4 权重反量化等多个量化与缓存问题。
    event_summary_en: 'public model community released Transformers v5.17.0 on 2026-09-09, adding six
      new model architectures: HYV4 (Hy4-Preview, a 780B-parameter MoE activating 49B parameters per token
      with a 1M-token context), the VibeVoice multi-speaker long-form speech synthesis framework, H Company''s
      NeoMME/NeoMME-Retriever multimodal multilingual foundation encoders (260M/800M), Alibaba DAMO Academy''s
      800M-parameter Fun-ASR-Nano speech recognition model, Moonshot AI''s KimiLinear hybrid linear attention
      architecture, and NVIDIA''s Canary-1B-v2 multilingual ASR and speech translation model. The release
      also standardized vision 2D/3D RoPE frequency computation into a centralized module as a breaking
      change, avoided per-step accelerator synchronization during generation to reduce decode overhead,
      and fixed multiple quantization and cache issues including the VibeVoice quantized cache, Qwen FP8
      embedding handling, and MXFP4 weight dequantization on XPU.'
