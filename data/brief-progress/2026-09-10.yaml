    slug: ai-agents-meant-to-replace-meta-workers-made-large-scale-dis
    name: Meta
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: 多份报道显示，Meta曾计划削减60%团队以实现“AI原生”运营，但因AI智能体频繁执行“大规模破坏性操作”（包括误删安全研究员邮件）而放弃该计划；同期Meta在数据中心测试机器人执行技术员任务、收购瑞典AI初创公司Stilla.ai，并推出首款面向消费者的个人智能体，另有Meta智能眼镜新品在Walmart上市。
    event_summary_en: Reports indicate Meta scrapped plans to cut 60% of teams to go "AI-native" after
      its AI agents repeatedly carried out "large-scale, disruptive actions" (including accidentally deleting
      a security researcher's emails); in the same period Meta tested robots for technician tasks in data
      centers, acquired Swedish AI startup Stilla.ai, launched its first consumer-facing personal agent,
      and released new smart glasses at Walmart.
