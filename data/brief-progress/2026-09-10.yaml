    name: ChatGPT Images 2.5
    decision: market_context
    summary_zh: 2026年9月8日，OpenAI发布ChatGPT Images 2.5，并在API中新增两个图像生成模型：gpt-image-2.5-sunburst面向编辑精度优先的工作流，gpt-image-2.5-flare面向快速日常生成；新版改进了多轮指令遵循、响应速度和参考图主体的保持能力，官方同时披露ChatGPT
      Images与GPT-Image API累计已生成超30亿张图像。这一发布更新了图像生成与编辑能力的基准线，降低了AI应用开发者集成图像编辑和创意生成功能的门槛，为构建相关工作流的团队提供更高精度、更快响应的模型选择，同时抬高同领域竞争者需要跟进的门槛。
    summary_en: 'On September 8, 2026, OpenAI released ChatGPT Images 2.5 and added two new image generation
      models to the API: gpt-image-2.5-sunburst for editing-precision-first workflows and gpt-image-2.5-flare
      for fast everyday generation. The update improves multi-turn instruction following, response speed,
      and preservation of subjects in reference photos, and OpenAI disclosed that more than 3 billion
      images have been generated across ChatGPT Images and the GPT-Image API models. This release refreshes
      the capability baseline for image generation and editing, lowers the integration barrier for AI
      application builders adding creative workflows, offers higher-precision and faster model options
      for delivery, and raises the bar that competing providers must match.'
    event_summary_zh: OpenAI于2026年9月8日发布ChatGPT Images 2.5，新增gpt-image-2.5-sunburst与gpt-image-2.5-flare两个API模型ID，改进多轮指令遵循、响应速度与参考图主体保持，并披露ChatGPT
      Images及GPT-Image API模型累计生成图像超过30亿张。
    event_summary_en: OpenAI released ChatGPT Images 2.5 on September 8, 2026, adding two new API model
      IDs, gpt-image-2.5-sunburst and gpt-image-2.5-flare, with improved multi-turn instruction following,
      faster responses, and better preservation of subjects in reference photos; OpenAI also disclosed
      that more than 3 billion images have been generated across ChatGPT Images and the GPT-Image API
      models.
