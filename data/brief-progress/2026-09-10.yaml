        job_zh: 软件工程师在准备转岗或承接公司 AI 功能开发时，面对零散的文档、博客和付费课程，需要按一条完整路径把机器学习基础、RAG、微调、agent 与 MCP 跑通，并留下可复用的练习代码。
        job_en: Software engineers preparing to change roles or take on AI feature work inside their company
          face scattered docs, blogs and paid courses, and need one complete path to run machine learning
          basics, RAG, fine-tuning, agents and MCP while keeping reusable exercise code.
        pain_zh: 旧做法要在多个平台拼凑教程，环境配置和依赖版本反复出错，学到的片段无法拼成一条可交付的工程流程，转岗准备周期被拉长。
        pain_en: The old approach means stitching tutorials from many platforms, repeatedly fixing environment
          and dependency versions, and ending with fragments that never form a deliverable engineering
          workflow, which stretches out preparation time.
        current_alternative_zh: 付费训练营、零散博客与视频教程、官方文档，或直接在工作中边做边查。
