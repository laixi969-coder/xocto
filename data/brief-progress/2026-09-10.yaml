  icymi-what-landed-for-ai-builders-in-august-2026:
    slug: icymi-what-landed-for-ai-builders-in-august-2026
    name: Amazon Bedrock
    decision: market_context
    summary_zh: 亚马逊云科技（AWS）在 2026 年 8 月对面向 AI 开发者的平台进行了一轮能力扩展：Amazon Bedrock 上的 OpenAI 模型获得百万 token 上下文并支持跨区域推理；Amazon
      Bedrock AgentCore 支持代理在专用算力上持续运行最长 14 天；AWS GovCloud 可用范围扩大；Strands 推出面向物理部署的 Strands Robots。这意味着在
      AWS 上构建长时运行代理、企业级与受监管场景 AI 应用的能力边界和合规可用范围扩大（材料支持）；推断这可能降低跨区域部署与长时代理运行的工程与算力成本，但材料未提供定价数据。
    summary_en: 'In August 2026, AWS rolled out a wave of platform capability expansions for AI builders:
      million-token context for OpenAI models on Amazon Bedrock plus cross-Region inference; Amazon Bedrock
      AgentCore supporting agents that run for up to 14 days on dedicated compute; expanded AWS GovCloud
      availability; and Strands Robots for physical deployment. This means the capability boundary and
      compliance footprint for building long-running agents and enterprise or regulated AI applications
      on AWS has widened (supported by the material). It is an inference that this may lower engineering
      and compute costs for cross-region deployment and long-running agents, as no pricing data is provided.'
    event_summary_zh: AWS 于 2026 年 8 月在 Amazon Bedrock、Amazon Bedrock AgentCore 和 Strands 上线多项新功能：OpenAI
      模型百万 token 上下文、跨区域推理、代理在专用算力上最长运行 14 天、AWS GovCloud 可用范围扩大，以及用于物理部署的 Strands Robots。
    event_summary_en: 'In August 2026, AWS shipped multiple new capabilities across Amazon Bedrock, Amazon
      Bedrock AgentCore, and Strands: million-token context for OpenAI models, cross-Region inference,
      agents running up to 14 days on dedicated compute, expanded AWS GovCloud availability, and Strands
      Robots for physical deployment.'
