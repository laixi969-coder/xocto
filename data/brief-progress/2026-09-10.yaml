  students-who-use-ai-generally-score-worse-at-school:
    slug: students-who-use-ai-generally-score-worse-at-school
    name: OECD PISA AI使用研究
    decision: market_context
    summary_zh: OECD 全球教育报告（PISA）数据显示，使用AI辅助学习的学生在校成绩普遍低于不使用的学生；但报告同时指出，某些类型的AI使用带来轻微提升，尤其在学生被教授批判性评估AI输出的情况下。该事实为教育场景的AI采用提供了效果层面的反面证据，推断上可能增加教育类AI工具证明学业收益的压力，并使批判性使用引导与效果度量成为产品竞争维度。
    summary_en: Data from a global OECD education report (PISA) shows that students who use AI to help
      them study tend to score worse at school than those who do not; the report also notes that certain
      types of AI use give learners a slight boost, especially among students taught to critically assess
      AI output. This provides outcome-level counter-evidence for AI adoption in education, and it can
      plausibly be inferred that education AI tools will face more pressure to demonstrate learning gains,
      making guided critical use and outcome measurement competitive differentiators.
    event_summary_zh: 2026年9月报道的OECD全球教育报告（PISA）数据显示，使用AI辅助学习的学生成绩普遍低于不使用AI的学生，但批判性使用AI的学生可获得轻微提升。
    event_summary_en: Data from a global OECD education report (PISA), reported in September 2026, shows
      that students who use AI to help them study tend to perform worse at school than those who do not,
      while students taught to critically assess AI use see slight gains.
