    slug: benchmarking-small-llm-inference-on-sagemaker-ai-g7-vs-g5-an
    name: Amazon SageMaker AI
    decision: market_context
    summary_zh: 2026年9月8日，Amazon SageMaker AI 发布针对 Qwen3-Coder-30B 与 NVIDIA Nemotron-3-Nano-30B 两个 30B
      级混合专家模型在 G5、G6、G6e、G7 GPU 实例上的推理基准，对比吞吐、延迟与每 token 成本，并称 G7 搭载的 NVIDIA Blackwell GPU 带来可量化的性价比提升。该结果意味着实时小模型推理的单位成本与延迟基准被重新标定，采用方在实例选型上有了更明确的性价比参照，推断会加速中小规模模型在生产环境中的部署。
    summary_en: On September 8, 2026, Amazon SageMaker AI published inference benchmarks for two 30B-class
      Mixture-of-Experts models, Qwen3-Coder-30B and NVIDIA Nemotron-3-Nano-30B, across G5, G6, G6e and
      G7 GPU instances, comparing throughput, latency and cost-per-token, and reporting measurable price-performance
      gains from G7's NVIDIA Blackwell GPUs. The result resets the cost and latency baseline for real-time
      small-model inference, giving adopters a clearer price-performance reference for instance selection
      and, by inference, accelerating production deployment of mid-sized models.
    event_summary_zh: Amazon SageMaker AI 发布 Qwen3-Coder-30B 与 NVIDIA Nemotron-3-Nano-30B 在 G5、G6、G6e、G7
      实例上的推理基准，对比吞吐、延迟与每 token 成本，并称 G7 的 NVIDIA Blackwell GPU 带来可量化的性价比提升。
    event_summary_en: Amazon SageMaker AI published inference benchmarks for Qwen3-Coder-30B and NVIDIA
      Nemotron-3-Nano-30B on G5, G6, G6e and G7 instances, comparing throughput, latency and cost-per-token,
      and reporting measurable price-performance gains from G7's NVIDIA Blackwell GPUs.
