      schools in a new agreement with the American Federation of Teachers (AFT), the second-largest teachers
      union in the US, and its New York City affiliate, one week after two major school systems announced
      a ban on student-facing AI. The agreement sets clearer data privacy and safety expectations for
      AI products in education and may become a compliance threshold for AI vendors in the school market;
      this compliance impact is an inference based on the agreement.
