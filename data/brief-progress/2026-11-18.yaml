        - ev-eeda32f1cd255818
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是团队或企业，但付费路径与交付责任未公开，属判断而非事实。
        evidence_ids:
        - ev-eeda32f1cd255818
      - gate: truth
        status: insufficient
        reason: 插件依赖第三方编码代理，承诺能否确定性交付缺少实测与文档，人工审查边界未说明。
        evidence_ids:
