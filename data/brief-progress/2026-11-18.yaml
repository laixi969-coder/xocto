  image-to-sculpt:
    slug: image-to-sculpt
    name: image-to-sculpt
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维建模与数字内容制作
    - 游戏与影视美术
    industries_en:
    - 3D modeling and digital content production
    - Game and film art
    jobs:
    - 三维美术师拿到一张参考图后，需要据此在 Blender 中重建可用的三维模型，并让比例与轮廓贴合原图
    - 3D artists take a reference image and need to rebuild a usable 3D model in Blender whose proportions
      and silhouette match the image
    jobs_en:
    - 3D artists take a reference image and need to rebuild a usable 3D model in Blender whose proportions
      and silhouette match the image
    - 3D artists take a reference image and need to rebuild a usable 3D model in Blender whose proportions
      and silhouette match the image
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师拿到一张参考图后，在 Blender 里重建模型时打开它：它把单张图片转成按该图对齐的多视角与贴图拟合步骤，并在 Blender 中回放建模过程、输出延时记录。用户最终拿到一个可继续编辑的三维雕刻结果，具体精度与人工修正量仍待核验。
    inspiration: 趋势：单图到三维的生成正在从“出一张渲染图”走向“产出可继续编辑的建模过程”，把参考图到模型这一段手工重建压缩成可回放的步骤。切入：从游戏、影视美术外包里“按参考图快速出草模”的环节进入，按项目或按模型交付收费，而不是卖通用生成工具；开源形态下可先做工作室内部流程插件。
    summary_en: When a 3D artist has a reference image and needs to rebuild the model in Blender, this
      tool turns the single image into registered views and map-fitting passes, replays the sculpting
      in Blender and exports a timelapse. The user ends up with an editable 3D sculpt; actual accuracy
      and how much manual fixing remains are still unverified.
    inspiration_en: 'Trend: single-image-to-3D is moving from producing one render toward producing an
      editable modeling process, compressing the manual rebuild from reference to model into replayable
      steps. Entry: start from the ''quick blockout from a reference'' step in game and film art outsourcing,
      selling per project or per model rather than a generic generator; as open source it can first become
      a studio-internal pipeline plugin.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师或独立建模者拿到一张角色、道具或场景参考图，需要在 Blender 中做出比例和轮廓贴合原图的模型，用于后续贴图、动画或打印。
        job_en: A 3D artist or independent modeler has a reference image of a character, prop or scene
          and needs a Blender model whose proportions and silhouette match it, for later texturing, animation
          or printing.
        pain_zh: 从单张图手工重建三维需要反复比对视角、调比例、重做轮廓，耗时且依赖经验；不做的后果是草模阶段就拖慢整个美术排期。
        pain_en: Rebuilding 3D from a single image by hand means repeatedly comparing views, adjusting
          proportions and redoing silhouettes; it is slow and experience-dependent, and skipping it delays
          the whole art schedule at the blockout stage.
        current_alternative_zh: 旧做法是美术师在 Blender 里手动建低模、用参考图做背景比对，或使用通用图生三维工具后再大量手工修形。
        current_alternative_en: The old way is manual low-poly modeling in Blender with the reference
          as a backdrop, or generic image-to-3D tools followed by heavy manual reshaping.
        usage_reason_zh: 推断：它把单图拆成配准视角与贴图拟合步骤并在 Blender 中回放，减少了美术师逐视角手工比对和重建轮廓的那一步，因此需要按参考图快速出草模的美术师会在建模初期选择它；是否真能减少返工尚无用户反馈支持。
        usage_reason_en: 'Inference: it splits the single image into registered views and map-fitting
          passes and replays them in Blender, removing the step of manually comparing each view and rebuilding
          the silhouette, so artists needing a fast blockout from a reference would pick it early in modeling;
          whether it truly cuts rework is not yet supported by user feedback.'
      gates:
      - gate: value
        status: supported
        reason: 它解决单图到可编辑三维模型的重建需求，痛点是逐视角手工比对与调形耗时；旧流程与不做的后果清楚，属工作流推理。
        evidence_ids:
        - ev-99f9da20bd21b272
        - ev-fb591d990ebcb8da
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、案例或讨论，无法判断美术师是否真的把它放进建模流程。
        evidence_ids:
        - ev-99f9da20bd21b272
        - ev-fb591d990ebcb8da
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价与付费路径；买方可能是工作室或外包团队，这是判断而非已验证事实。
        evidence_ids:
        - ev-99f9da20bd21b272
      - gate: truth
        status: insufficient
        reason: 单图重建的精度、人工修正量和 Blender 回放的实际交付质量均无公开实测，承诺能否确定性交付尚未核验。
        evidence_ids:
        - ev-99f9da20bd21b272
        - ev-fb591d990ebcb8da
      next_validation: 收集该仓库的 issue 与 discussion，查看使用者对单图重建精度、人工修正量和 Blender 回放可用性的实测反馈。
