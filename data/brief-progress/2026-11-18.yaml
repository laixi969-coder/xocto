        pain_zh: AI 生成图像和视频增多，肉眼难以分辨，误信或误转会带来信息失真与信誉损失。
        pain_en: AI-generated images and video are proliferating and are hard to tell apart by eye; mistaken
          trust or sharing causes misinformation and reputational loss.
        current_alternative_zh: 目前多靠人工经验判断，或把图片复制到其他检测工具逐一核验。
        current_alternative_en: Today people mostly rely on manual judgment or copy images into separate
