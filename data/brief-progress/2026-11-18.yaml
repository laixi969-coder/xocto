      in community discussion; its public page offers only the one-line description "self-hosted AI spend
      attribution" and discloses no pricing, customers, or usage data.
    category: AI + 商业
    project_type: new_application
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 工程或财务负责人需要按团队、项目或模型拆分每月 AI 调用开销，以完成预算核对和成本分摊
    jobs_en:
    - Engineering or finance leads need to break down monthly AI API spend by team, project, or model
      to complete budget reconciliation and cost allocation
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 当工程或财务负责人要核对每月 AI 调用账单、把开销分摊到团队或项目时，可以打开这个自托管工具，由它接收用量与费用数据并做归因拆分，最终给出可核对的支出归属结果；具体接入哪些供应商、如何归因以及人工复核环节仍待核验。
    inspiration: 趋势是 AI 调用从试验走向常态后，成本治理开始成为独立环节，而不是云账单的附属项。切入可从已有多模型、多团队用量的中型软件公司或代理服务商入手，卖按账单周期核算的归因报告或对账服务，而非再做一个通用监控面板；价格未披露，不可预设。
    summary_en: When engineering or finance leads need to reconcile monthly AI API bills and allocate
      spend to teams or projects, they can open this self-hosted tool, which takes usage and cost data
      and performs attribution, returning a checkable breakdown of where spend went; which providers it
      connects to, how attribution works, and where humans review remain to be verified.
    inspiration_en: The trend is that as AI calls move from pilots to routine operations, cost governance
      becomes its own step rather than a footnote on the cloud bill. The entry point is mid-sized software
      firms or agencies already running multiple models and teams, selling per-billing-cycle attribution
      reports or reconciliation services rather than another generic dashboard; no pricing is disclosed,
      so none should be assumed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工程或财务负责人在月度结算时，处理多家模型供应商的用量与账单数据，要把开销拆分到团队、项目或客户，完成预算核对与成本分摊。
        job_en: At monthly close, an engineering or finance lead handles usage and billing data from several
          model providers and must split spend across teams, projects, or clients to complete budget reconciliation
          and cost allocation.
        pain_zh: 多供应商、多模型的调用费用分散在不同账单里，缺少统一归属口径时，超支只能事后发现，也无法向内部团队或客户解释成本来源。
        pain_en: Spend across multiple providers and models is scattered across separate bills; without
          a common attribution basis, overruns are found only after the fact and costs cannot be explained
          to internal teams or clients.
        current_alternative_zh: 常见做法是导出各家账单到表格手工汇总，或依赖云厂商自带的分账标签，跨模型时往往对不齐。
        current_alternative_en: The common approach is exporting each provider's bill into spreadsheets
          and summing manually, or relying on cloud-native cost tags, which often fail to line up across
          models.
        usage_reason_zh: 推断：相比手工汇总表格，自托管部署让企业把用量数据留在自己环境内，并直接产出按团队或项目的归属结果，减少逐张账单对账这一步；对数据不能外传、又已多模型并用的团队更有吸引力。
        usage_reason_en: 'Inference: compared with manual spreadsheet roll-ups, self-hosting keeps usage
          data inside the company''s own environment and directly produces team- or project-level attribution,
          removing the step of reconciling each bill by hand; this appeals to teams that cannot export
          data and already use multiple models.'
      gates:
