    inspiration: 趋势：开源 AI 伴侣正把形象、实时语音和本地模型拼成可自部署的完整体验，门槛从模型能力转向角色一致性与长期记忆。切入：面向二次元角色运营方或虚拟主播团队，做角色记忆与人格一致性的托管服务，而非再做一个通用伴侣应用。
