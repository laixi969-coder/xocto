    summary_zh: 企业数据或业务分析师在需要把个人搭的看板、代理和自动化交给同团队复用时打开它，接入日常数据与应用，由 AI 生成并共享这些看板与自动化，团队拿到可共用的工作空间；企业安全与治理由平台侧提供，具体交付流程仍待核验。
    inspiration: 趋势：大厂把 AI 工作空间做成团队共享层，个人产出直接变成组织资产。切入：不要做通用工作空间，可从某个受监管行业（如保险理赔、航空运营）的特定报表与审批链路切入，卖“可审计的共享自动化”，按部门或合规审计次数计价。
    summary_en: 'Enterprise data or business analysts open it when they need to hand their own dashboards,
      agents and automations to teammates: it connects everyday data and applications, AI generates and
      shares those views, and the team gets a common workspace, with enterprise security and governance
      provided by the platform; the exact delivery flow still needs verification.'
    inspiration_en: 'Trend: big cloud vendors are turning AI workspaces into a team sharing layer where
      one person''s output becomes an organisational asset. Entry: avoid a generic workspace; start from
      one regulated industry''s specific reporting and approval chain, such as insurance claims or airline
      operations, and sell auditable shared automation priced per department or per compliance audit.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 企业数据或业务分析师在需要把个人搭建的看板、代理和自动化交给同团队复用时，接入日常数据与应用，产出团队可共用的工作空间。
        job_en: Enterprise data or business analysts who need to hand their own dashboards, agents and
          automations to teammates connect everyday data and applications to produce a workspace the team
          can share.
        pain_zh: 个人做的分析产出散落在各自工具里，团队复用时需重复搭建，且缺乏统一的安全与治理，跨部门推广成本高。
        pain_en: Individually built analysis outputs sit in separate tools, must be rebuilt when teammates
          reuse them, and lack unified security and governance, making cross-team rollout costly.
        current_alternative_zh: 此前多用各自账号下的 BI 看板、表格与脚本手工复制分享，或由 IT 单独搭建内部工具。
        current_alternative_en: Previously teams copied dashboards, spreadsheets and scripts between personal
          accounts by hand, or had IT build internal tools separately.
        usage_reason_zh: 推断：相较手工复制看板与脚本，它把个人产出直接发布为团队可共用对象，并自带企业安全与治理，减少重复搭建和逐项申请权限的步骤，因此需要跨团队复用分析结果的企业用户会选它。
        usage_reason_en: 'Inference: compared with manually copying dashboards and scripts, it publishes
          one person''s output directly as a shared team object with built-in enterprise security and
          governance, cutting rebuilds and per-item permission requests, so enterprises needing cross-team
          reuse of analysis would choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决个人分析产出难以在团队复用、缺乏统一治理的痛点，旧做法是手工复制看板与脚本，需求结构成立。
