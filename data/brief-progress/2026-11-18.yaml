    regions: []
    regions_en: []
    open_source: true
    summary_zh: YouTube 频道运营者在选题、竞品分析和赞助商开发时，把频道与评论数据交给接入 Claude Code、Cursor 等代理的技能包，由 AI 提取异常视频、挖掘评论、生成标题与缩略图概念，最终拿到选题清单和赞助商线索；具体交付质量与人工复核环节仍待核验。
    inspiration: 趋势：内容创作者开始把选题调研从人工翻榜单、看评论，交给可复用的代理技能。切入：面向中小 YouTube 频道或 MCN 的选题与赞助开发环节，按调研报告或赞助线索收费，而非卖技能包本身；需先核验其数据来源与结果质量。
    summary_en: YouTube channel operators doing topic selection, competitor analysis, and sponsor prospecting
      feed channel and comment data to a skill pack used with agents such as Claude Code and Cursor; the
      AI extracts outlier videos, mines comments, and generates title and thumbnail concepts, yielding
      topic lists and sponsor leads. Delivery quality and human review steps remain unverified.
    inspiration_en: 'Trend: content creators are moving topic research from manually scanning rankings
      and comments to reusable agent skills. Entry: target topic selection and sponsor prospecting for
      small YouTube channels or MCNs, charging per research report or sponsor lead rather than selling
      the skill pack; data sources and output quality need verification first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
