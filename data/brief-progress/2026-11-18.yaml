    summary_zh: 使用 AI 编程代理的开发者，在让代理动手改代码前，会打开这套指令与技能集合，按规划、关键审查、差异审计三段流程处理代理产出的改动；最终拿到的是经过分阶段审查的代码变更，是否合并仍由开发者确认。具体交付形态与人工确认边界仍待核验。
    inspiration: 趋势：AI 编程代理已能大量产出代码，瓶颈从“写”转向“审”，围绕审查流程的轻量方法开始被单独沉淀。切入：面向使用代理的中小研发团队，把审查阶段做成可复用的流程模板或按项目收费的审查服务，而不是再做一个编码工具。
    summary_en: Developers using AI coding agents open this instruction and skill set before letting the
      agent change code, running a three-stage flow of planning, critical review and diff audit on the
      agent's output; what they get is a staged-reviewed code change, with the merge decision still made
      by the developer. The exact delivery form and human-confirmation boundary still need verification.
    inspiration_en: 'Trend: AI coding agents now produce large volumes of code, so the bottleneck shifts
      from writing to reviewing, and lightweight review methods are being packaged separately. Entry:
      target small engineering teams using agents with reusable review-stage templates or per-project
      review services, rather than building another coding tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 AI 编程代理的开发者，在代理产出改动后，需要先规划、再对改动做关键审查与差异审计，才能判断这段代码能否合并。
        job_en: Developers using AI coding agents need to plan, then critically review and audit the agent's
          diff before deciding whether the code can be merged.
        pain_zh: 代理一次产出大量改动，人工逐行核对成本高，容易漏掉错误或越界修改；缺少固定审查步骤时，质量依赖个人经验。
        pain_en: Agents produce large diffs at once, making line-by-line human checks costly and easy
          to miss errors or out-of-scope changes; without fixed review steps, quality depends on individual
          experience.
        current_alternative_zh: 开发者通常自己写提示词、临时让代理自查，或直接人工读 diff；没有统一的三段审查流程。
        current_alternative_en: Developers typically write ad-hoc prompts, ask the agent to self-check,
          or read the diff manually, without a unified three-stage review flow.
        usage_reason_zh: 推断：相较临时提示词，它把规划、关键审查、差异审计固化为可复用步骤，减少每次重新设计审查提示的负担，并让审查结果更可核对；使用代理且重视合并质量的开发者会因此选用。
        usage_reason_en: 'Inference: versus ad-hoc prompts, it fixes planning, critical review and diff
          audit into reusable steps, cutting the burden of redesigning review prompts each time and making
          review outcomes more checkable; developers using agents who care about merge quality would choose
          it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理产出代码后如何可靠审查的需求，痛点是人工核对成本高、易漏错，旧做法是临时提示或人工读 diff，结构上成立。
        evidence_ids:
        - ev-044bec796ff489f1
        - ev-fce21dfaa7e8bc7d
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属于关注度证据，缺少用户反馈或团队采用案例，无法判断是否形成共识。
        evidence_ids:
        - ev-fce21dfaa7e8bc7d
      - gate: model
        status: insufficient
        reason: 开源仓库，未见定价、付费或企业采购路径；钱可能来自团队内部节省的审查工时，这是判断而非已验证事实。
        evidence_ids:
        - ev-044bec796ff489f1
      - gate: truth
        status: insufficient
        reason: 审查流程能否确定性拦住错误、人工确认边界如何划分，公开材料未说明，需看实际使用反馈。
        evidence_ids:
        - ev-97c4ea19d327cacf
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有开发者报告实际拦截了代理错误改动或将其纳入团队流程。
