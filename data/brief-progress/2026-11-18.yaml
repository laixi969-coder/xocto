    inspiration: 趋势：会议记录工具正从个人效率工具向企业知识层延伸，语音输入与会议记录两条产品线开始互相侵入。切入：可从垂直行业（如律所、地产经纪、医疗问诊）的会后合规归档与客户跟进环节进入，按会议或案件收费，而非只卖席位。
    summary_en: Sales reps and consultants open Granola during client meetings; it takes in live conversation
      audio and turns it into structured meeting notes and action items, and since October 2026 it can
      also convert dictated speech to text. Users get editable minutes and follow-ups that they still
      must confirm. The exact delivery flow and pricing remain to be verified.
    inspiration_en: 'Trend: meeting-note tools are stretching from personal productivity toward an enterprise
      knowledge layer, and voice dictation and meeting capture are invading each other''s turf. Entry:
      start from the post-meeting compliance filing and client follow-up step in a vertical such as law
      firms, real estate brokerages or clinics, charging per meeting or case rather than per seat.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 销售或咨询顾问在客户会议中边听边记，会后要把对话整理成纪要和待办发给客户与团队。
        job_en: Sales reps or consultants take notes during client meetings and afterward turn the conversation
          into minutes and action items for clients and the team.
        pain_zh: 手写笔记会漏掉细节，会后凭记忆补纪要耗时且易出错，录音回听更慢。
        pain_en: Handwritten notes miss details, reconstructing minutes from memory afterward is slow
          and error-prone, and replaying recordings is even slower.
        current_alternative_zh: 人工笔记加会后手写纪要，或使用通用转写工具再人工整理。
        current_alternative_en: Manual note-taking plus hand-written minutes afterward, or generic transcription
          tools followed by manual cleanup.
        usage_reason_zh: 推断：Granola 在会议进行中直接接收对话并生成结构化纪要与待办，省去会后回听录音和从零起草纪要这一步，因此高频开会的销售与顾问会在客户会议场景选择它；持续使用与付费证据尚未核验。
        usage_reason_en: 'Inference: Granola captures the conversation during the meeting and produces
