    jobs:
    - YouTube 频道运营者在选题和竞品调研时，把频道与评论数据交给 AI 代理，产出选题、标题与赞助商线索
    jobs_en:
    - YouTube channel operators hand channel and comment data to an AI agent during topic selection and
