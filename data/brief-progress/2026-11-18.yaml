      change only when a locked test or benchmark score improves; repository stars rose from 56 on 12
      November to 140 on 18 November.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息服务
    industries_en:
    - Software and IT services
    jobs:
    - 使用编码代理的开发者，在代理声称任务完成后，用锁定测试或基准分数核验每处改动，决定是否保留
    jobs_en:
    - Developers using coding agents who, after the agent claims completion, verify each change against
      a locked test or benchmark score before keeping it
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 Claude Code 或 Codex 的开发者，在编码代理声称任务完成时打开它，把每处改动交给预先锁定的测试或基准打分；只有分数变好的改动才被保留，用户拿到的是经过分数筛选的代码改动，最终是否合并仍需人工确认。
    inspiration: 趋势：编码代理的瓶颈正从“能不能写”转向“怎么证明写对了”，可核验的验收环节开始被单独产品化。切入：从对正确性要求高、又有现成测试集的团队入手，例如有回归测试的 SaaS
      后端或金融系统维护团队，按项目接入验收流程收费，而不是卖通用编码助手。
    summary_en: Developers using Claude Code or Codex open it when a coding agent claims a task is done,
      passing each change to a pre-locked test or benchmark; only changes that improve the score are kept,
      and the user receives score-filtered code changes while the final merge still needs human confirmation.
    inspiration_en: 'Trend: the bottleneck for coding agents is shifting from whether they can write code
      to how they prove it is correct, so verifiable acceptance is becoming its own product layer. Entry:
      start with teams that have strict correctness needs and existing test suites, such as SaaS backend
      or financial-system maintenance teams with regression tests, and charge per project for the acceptance
      step rather than selling another general coding assistant.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用编码代理的开发者，在代理声称任务完成后，用锁定测试或基准分数核验每处改动，决定保留还是回退。
        job_en: Developers using coding agents who, after the agent claims completion, verify each change
          against a locked test or benchmark score to decide whether to keep or revert it.
        pain_zh: 编码代理常声称“已完成”，但改动可能让既有功能退化；人工逐条比对测试结果费时，且容易漏掉回归。
        pain_en: Coding agents often claim completion while changes may regress existing behavior; manually
          comparing test results for each change is slow and easy to miss regressions.
        current_alternative_zh: 开发者手动运行测试、阅读 diff 并凭经验判断是否保留改动，或直接信任代理输出后合并。
        current_alternative_en: Developers manually run tests, read diffs and judge by experience whether
          to keep a change, or simply trust the agent output and merge.
        usage_reason_zh: 推断：它把“跑测试—比分数—决定保留”固化为自动步骤，只有分数变好的改动才留下，减少人工逐条核验的负担，因此有现成测试集的团队在代理批量改代码时会选择它。
        usage_reason_en: 'Inference: it turns run-tests, compare-scores and keep-or-revert into an automated
          step where only score-improving changes survive, reducing manual per-change verification, so
          teams with existing test suites would choose it when agents edit code in bulk.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理声称完成后改动可能退化、人工核验费时的问题，用锁定测试或基准分数决定保留，痛点具体且交付可核对。
        evidence_ids:
        - ev-f257c0bd23f6314e
        - ev-af7038b2616b3030
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从56增至140的关注度信号，没有用户评价或团队采用案例说明它进入日常工作流。
        evidence_ids:
        - ev-f257c0bd23f6314e
        - ev-af7038b2616b3030
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是使用编码代理的工程团队，但付费路径尚无公开材料。
        evidence_ids:
        - ev-af7038b2616b3030
      - gate: truth
        status: insufficient
        reason: 锁定测试或基准能否覆盖真实回归、分数变好是否等于代码正确，公开材料未给出实测结果。
        evidence_ids:
        - ev-f257c0bd23f6314e
      next_validation: 收集仓库 issue 与 discussion 中开发者关于锁定测试覆盖范围和实际保留/回退改动的使用反馈。
