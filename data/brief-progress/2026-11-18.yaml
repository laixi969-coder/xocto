      HPC GPU 与扩展的 Vera CPU 平台，并公布与 IBM 及费米实验室的量子计算合作；其描述的能力是让代理在研究者自有系统上规划实验、运行代码并核对结果。这意味着科研计算栈在仿真之外叠加
