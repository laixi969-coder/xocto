        reason: 仅见约164个星标且一周基本持平，没有译者评价、协作议题或采用讨论，无法判断是否形成使用共识。
        evidence_ids:
        - ev-520f81decf5a8549
      - gate: model
        status: insufficient
        reason: 未见定价、付费路径或服务对象说明；开源项目可能的付费方是出版社或译者，但这是判断而非已验证事实。
        evidence_ids:
        - ev-fe856a830e702629
      - gate: truth
        status: insufficient
        reason: 仓库未展示翻译样章、术语处理方式或人工校订边界，交付能否确定发生尚无法核对。
        evidence_ids:
        - ev-520f81decf5a8549
      next_validation: 收集该仓库的README、发布说明或示例译文章节，核对它如何处理术语与风格一致性以及人工校订环节。
