      exact fix scope and human confirmation steps still need verification.
    inspiration_en: 'Trend: ransomware is now aimed directly at home and small-business NAS, so security
      response shifts from hiring an admin to a single self-check-and-fix command. Entry: target small
      firms, studios and home NAS owners without dedicated IT, selling per-device or per-incident ransomware
      triage and hardening as an outcome rather than a tool; adjacent targets are other NAS vendors and
      backup appliances.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: Synology DSM 7 管理员在设备疑似遭 C3RB3R/.L0CK3D 勒索软件攻击时，用命令行或 AI 代理对 NAS 做审计并执行修复，拿到可核对的检查与处置结果。
