  uncut:
    slug: uncut
    name: uncut
    decision: watching
    event_summary_zh: 2026年11月1日发布的开源无头编码代理运行器 uncut，以单个约7MB静态二进制、四个工具和纯 stdin/stdout 交互为卖点，强调不静默截断输出；公开仓库星标从11月初约600余次波动后回落，11月中旬稳定在约270。
    event_summary_en: uncut, an open-source headless coding-agent harness released on 2026-11-01, ships
      as a single ~7 MB static binary with four tools and plain stdin/stdout, emphasizing no silent truncation
      of output; public repository stars moved from roughly 600 in early November and settled near 270
      by mid-November.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在脚本或CI流水线中调用编码代理处理代码修改任务时，需要可预测的输入输出与完整日志，以便复核代理改动
    jobs_en:
    - Developers invoking a coding agent inside scripts or CI pipelines to make code changes need predictable
      input/output and complete logs so they can review the agent's edits
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在脚本或持续集成流水线里调用编码代理改代码时，打开 uncut：它以单个静态二进制接收标准输入的任务与代码材料，用四个工具执行读写等动作，把完整过程输出到标准输出，让用户拿到可复核的改动记录；人工仍需自行确认改动是否正确。具体工具清单与交付边界仍待核验。
    inspiration: 趋势是编码代理正从聊天窗口下沉为可被脚本调用的命令行零件，谁掌握调用协议谁就掌握入口。切入可放在对审计和可复现有硬要求的团队，例如需要留存代理每一步操作的受监管软件交付或外包验收环节，按流水线接入或私有部署收费；但纯开发者零件若只卖工具、不改某层收费方式，商业天花板有限。
    summary_en: 'When developers call a coding agent from scripts or CI pipelines to change code, they
      open uncut: a single static binary takes the task and code material on stdin, runs four tools to
      perform read/write actions, and streams the full process to stdout so the user gets a reviewable
      record of edits; a human still has to confirm the changes are correct. The exact tool list and delivery
      boundary remain to be verified.'
    inspiration_en: The trend is coding agents sinking from chat windows into script-callable command-line
      parts, where whoever owns the invocation protocol owns the entry point. The opening is teams with
      hard audit and reproducibility requirements, such as regulated software delivery or outsourced acceptance
      that must retain every agent step, sold as pipeline integration or private deployment; but a pure
      developer part that only sells a tool without changing how some layer is charged has a limited ceiling.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在脚本或CI流水线中让编码代理修改代码时，需要拿到完整、未被截断的执行记录，以便复核代理到底改了什么。
        job_en: Developers letting a coding agent modify code inside scripts or CI pipelines need a complete,
          untruncated execution record to review what the agent actually changed.
        pain_zh: 现有编码代理常静默截断输出或隐藏中间步骤，导致改动难以审计，出错后无法定位是哪一步造成的。
        pain_en: Existing coding agents often silently truncate output or hide intermediate steps, making
          changes hard to audit and failures hard to trace to a specific step.
        current_alternative_zh: 开发者目前多用通用编码代理的交互界面或自行拼装脚本，日志不完整时需要重跑或人工比对。
        current_alternative_en: Developers currently use general coding-agent interfaces or hand-assembled
          scripts, and when logs are incomplete they rerun or compare manually.
        usage_reason_zh: 推断：uncut 以单二进制、固定四个工具和纯标准输入输出运行，把代理每一步动作完整写入日志，减少开发者事后重跑或人工比对以还原改动的负担，因此对需要留存代理操作记录的团队更有吸引力。
        usage_reason_en: 'Inference: by running as a single binary with four fixed tools over plain stdin/stdout,
          uncut writes every agent action into the log, reducing the burden of rerunning or manually reconstructing
          changes afterward, which appeals to teams that must retain a record of agent operations.'
      gates:
      - gate: value
        status: supported
        reason: 它解决编码代理输出被截断、改动难审计的痛点，旧做法是重跑或人工比对，结构上成立；买方是否为团队付费尚不清楚。
        evidence_ids:
        - ev-ee0e3ef995d6f8a6
        - ev-c3d3d9149603e29a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标，且从约600回落至约270，属于关注度而非持续采用证据，缺少用户反馈或案例。
        evidence_ids:
        - ev-ee0e3ef995d6f8a6
        - ev-c3d3d9149603e29a
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价页或商业交付方式，钱可能来自企业私有部署或支持服务，这是判断不是已验证事实。
        evidence_ids:
        - ev-c3d3d9149603e29a
      - gate: truth
        status: insufficient
        reason: 承诺不静默截断，但缺少可复现实测与安全边界说明，无法确认在复杂仓库中是否确定性交付。
        evidence_ids:
        - ev-ee0e3ef995d6f8a6
      next_validation: 收集 uncut 官方仓库的 issue 与 discussion，查看开发者是否报告在真实流水线中重复使用及输出完整性表现。
