    inspiration: 趋势：手机端代理开始把「跨 App 手动操作」当作可被代劳的一步，而不是再做一个聊天入口。切入：先挑一类高频、步骤固定、结果可核对的手机任务（如预约、报销填单、比价下单）做深，按完成次数或结果收费；通用全自动代理的信任与失败回退仍是空白。
    summary_en: When Android users face tedious tasks that require repeated tapping, filling and lookups
      across multiple apps and the web, they open Mika and an on-device agent performs those operations,
      returning the finished page or result for the user to check. Which tasks are supported and how failures
      roll back are not stated in public material; the workflow and delivery still need verification.
    inspiration_en: 'Trend: phone-side agents are starting to treat cross-app manual operation as a step
      that can be delegated, rather than building another chat entry. Entry: go deep on one class of frequent,
      fixed-step, checkable phone tasks (booking, expense forms, price comparison and ordering) and charge
      per completion or result; trust and failure rollback for general autonomous agents remain open.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安卓用户在需要跨多个 App 和网页完成订票、填表、查信息等重复操作时，让设备端代理代为点击与填写，自己核对最终结果。
        job_en: Android users who need to complete repetitive cross-app and web tasks such as booking,
          form filling and lookups let an on-device agent perform the taps and entries, then check the
          final result.
        pain_zh: 这类操作步骤多、重复且容易出错，用户要在多个应用间来回切换并手动输入相同信息，耗时且枯燥。
        pain_en: Such tasks involve many repetitive, error-prone steps; users switch between apps and
          re-enter the same information by hand, which is slow and tedious.
        current_alternative_zh: 用户目前手动在多个 App 和网页间切换操作，或依赖各应用自带的有限自动化与脚本工具。
        current_alternative_en: Users currently switch between apps and web pages manually, or rely on
          the limited automation and scripting built into individual apps.
        usage_reason_zh: 推断：相较手动逐步操作，Mika 让设备端代理直接执行点击与填写，减少用户逐屏操作和重复输入的负担，因此需要频繁处理跨 App 琐碎任务的安卓用户会尝试它；但公开材料未给出留存或重复使用证据。
        usage_reason_en: 'Inference: compared with step-by-step manual operation, Mika has an on-device
          agent perform the taps and entries directly, reducing per-screen work and repeated input, so
          Android users with frequent cross-app chores may try it; public material gives no retention
          or repeat-use evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决跨 App 重复操作耗时易错的问题，旧行为是手动切换与输入，结构上成立；具体任务覆盖与失败回退未核验。
