        job_en: YouTube channel operators in the topic-selection and competitor-research stage process
          channel rankings, competitor videos, and comment sections to identify outlier hits, validate
          niches, and form title and sponsor leads.
        pain_zh: 人工翻榜单、逐条读评论、比对竞品标题耗时且容易漏掉信号；不做的后果是选题靠直觉、赞助开发无系统线索。
        pain_en: Manually scanning rankings, reading comments one by one, and comparing competitor titles
          is time-consuming and misses signals; the consequence is intuition-driven topic choices and
          unsystematic sponsor prospecting.
        current_alternative_zh: 运营者通常手动浏览 YouTube 榜单、用表格记录竞品、凭经验写标题，或零散使用通用聊天助手。
        current_alternative_en: Operators typically browse YouTube rankings manually, log competitors
          in spreadsheets, write titles from experience, or use general chat assistants ad hoc.
        usage_reason_zh: 推断：相较手动翻榜单和读评论，该技能包让代理直接接收频道与评论数据并批量输出异常视频、评论主题和标题概念，减少逐条筛选这一步，因此需要定期做竞品与选题调研的频道运营者会在选题周期中选择它；尚无用户反馈证实长期留存。
        usage_reason_en: 'Inference: compared with manually scanning rankings and reading comments, the
          skill pack lets an agent ingest channel and comment data and batch-output outlier videos, comment
          themes, and title concepts, cutting the step-by-step filtering; channel operators doing regular
          competitor and topic research would choose it in their topic cycles. No user feedback yet confirms
          long-term retention.'
      gates:
