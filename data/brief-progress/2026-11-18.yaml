    inspiration: 趋势：AI 代理开始直接操作办公文件，而不是只生成文本，文件读写层成为代理落地的卡点。切入：从需要批量生成或改写合同、报表、课件的团队进入，卖可被代理调用的文档处理能力，而非再做一个面向人的编辑器；价格未披露。
    summary_en: Office workers open documents, spreadsheets, slides, PDFs, Markdown and code files in
      one window, edit and save each one; the same program also exposes a command line that AI agents
      call to read and write those files. The deliverable is the edited file itself; format compatibility
      and the human confirmation step still need verification.
    inspiration_en: 'Trend: AI agents are starting to operate office files directly rather than only generating
      text, making the file read-write layer a bottleneck for agent deployment. Entry: start with teams
      that must batch-generate or rewrite contracts, reports and course decks, and sell agent-callable
      document handling rather than another human-facing editor; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 办公人员和自动化流程需要在同一处打开并编辑文档、表格、幻灯片与 PDF，AI 代理则通过命令行批量读写这些文件以完成后续任务。
        job_en: Office workers and automated pipelines need to open and edit documents, spreadsheets,
          slides and PDFs in one place, while AI agents read and write those files in batch through a
          command line to complete downstream tasks.
        pain_zh: 办公文件分散在多个应用和格式中，代理要操作文件往往得靠脆弱的脚本或人工复制粘贴，格式容易丢失。
        pain_en: Office files are scattered across applications and formats, and agents operating on them
          often rely on fragile scripts or manual copy-paste, with formatting easily lost.
        current_alternative_zh: 用微软 Office、WPS 或 LibreOffice 人工编辑，代理侧则用脚本库或格式转换工具拼接处理。
        current_alternative_en: People edit manually in Microsoft Office, WPS or LibreOffice, while agent
          side stitches together script libraries or format converters.
        usage_reason_zh: 推断：同一程序既提供图形界面又提供代理可调用的命令行，省去在编辑器与脚本之间来回转换文件的一步，需要批量处理办公文件的团队会因此试用；尚无留存或付费证据。
        usage_reason_en: 'Inference: one program offering both a GUI and an agent-callable command line
          removes the step of converting files between an editor and scripts, so teams handling office
          files in batch would try it; no retention or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决办公文件跨格式编辑与代理读写的问题，痛点是格式分散和脚本拼接，旧做法明确存在。
        evidence_ids:
        - ev-318aeae27c0ceaec
        - ev-52c062ac28c849d3
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属于关注度，缺少用户评价或采用案例说明谁在什么场景使用。
        evidence_ids:
        - ev-52c062ac28c849d3
      - gate: model
        status: insufficient
        reason: 开源项目，付费路径未披露；可能靠托管或企业支持收费，这是判断不是事实。
        evidence_ids:
        - ev-318aeae27c0ceaec
      - gate: truth
        status: insufficient
        reason: 格式兼容性、代理调用可靠性和人工确认边界均未在材料中说明，交付确定性待核验。
        evidence_ids:
        - ev-318aeae27c0ceaec
      next_validation: 收集该仓库的 issue 与讨论，确认代理调用命令行编辑真实办公文件时的格式兼容与失败案例。
  websitebench:
    slug: websitebench
    name: WebsiteBench
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    - 网站建设
    industries_en:
    - software development
    - website building
    jobs:
    - 研究人员评测 AI 代理能否仅通过浏览器探索重建网站并比较不同代理表现
    - 开发团队在选型时参考代理重建网站任务的公开评测结果
    jobs_en:
    - Researchers evaluating whether AI agents can rebuild websites through browser exploration alone
      and comparing agent performance
    - Development teams consulting public benchmark results on the website-rebuild task when choosing
      agents
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 这是一个评测基准：考察 AI 代理能否仅通过浏览器探索重建网站，并给出可比较的结果。研究人员和开发团队用它衡量不同代理在网站重建任务上的表现；具体评测规模、评分方式和榜单更新频率仍待核验。
    inspiration: 趋势：代理能力开始用端到端任务而非单步问答来衡量，网站重建成为可复现的评测场景。切入：从需要评估代理能否接手前端改版的团队进入，卖可复现的评测与验收服务，而非再做一个代理；价格未披露。
    summary_en: This is a benchmark that tests whether AI agents can rebuild websites through browser
      exploration alone and reports comparable results. Researchers and development teams use it to measure
      how different agents perform on the website-rebuild task; the benchmark scale, scoring method and
      leaderboard update cadence still need verification.
    inspiration_en: 'Trend: agent capability is increasingly measured by end-to-end tasks rather than
      single-step Q&A, and website rebuilding is becoming a reproducible evaluation scenario. Entry: start
      with teams that need to judge whether an agent can take over a front-end rebuild, and sell reproducible
      evaluation and acceptance services rather than another agent; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 研究人员和开发团队需要判断 AI 代理能否仅靠浏览器探索重建一个网站，并在多个代理之间做可比较的评测。
        job_en: Researchers and development teams need to judge whether an AI agent can rebuild a website
          through browser exploration alone and compare multiple agents on a common evaluation.
        pain_zh: 代理能力宣传多、可复现的端到端评测少，选型时缺少统一任务和评分口径。
        pain_en: Agent capability claims are plentiful but reproducible end-to-end evaluations are scarce,
          leaving selection without a common task and scoring standard.
        current_alternative_zh: 团队自建脚本或零散人工试用，各自口径不同，结果难以横向比较。
        current_alternative_en: Teams build their own scripts or run scattered manual trials with differing
          standards, making results hard to compare across agents.
        usage_reason_zh: 推断：它把网站重建定义成统一任务并公开结果，省去团队自建评测脚本的一步，需要选型或做研究的团队会因此参考它；尚无持续使用或付费证据。
        usage_reason_en: 'Inference: it defines website rebuilding as a common task and publishes results,
          removing the step of building an in-house evaluation harness, so teams doing selection or research
          would consult it; no sustained-use or payment evidence yet.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理能力缺少可复现端到端评测的问题，痛点是选型口径不一，旧做法是自建脚本。
        evidence_ids:
        - ev-db6a105c7d883ef4
        - ev-3c25e7add007dca4
      - gate: consensus
        status: insufficient
        reason: 星数持续增长说明关注度，但缺少研究者或团队实际采用该基准的公开案例。
        evidence_ids:
        - ev-3c25e7add007dca4
      - gate: model
        status: insufficient
        reason: 开源评测项目，付费路径未披露；可能靠企业评测服务收费，这是判断不是事实。
        evidence_ids:
        - ev-db6a105c7d883ef4
      - gate: truth
        status: insufficient
        reason: 评测规模、评分方式和结果稳定性未在材料中说明，能否确定性交付待核验。
        evidence_ids:
        - ev-41de0b93da291a66
      next_validation: 收集该基准的公开榜单或论文页面，确认评测任务规模、评分口径与是否有外部团队引用其结果。
  whiteboard-ai-tutor:
