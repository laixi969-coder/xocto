        - ev-ec9ec707c1545eaf
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、付费路径或商业交付方式，买方与收费模式尚不明确。
        evidence_ids:
        - ev-ec9ec707c1545eaf
      - gate: truth
        status: insufficient
        reason: 无 root 后台副屏的承诺能否在各类应用上稳定交付、是否触发应用风控，公开材料未说明。
        evidence_ids:
        - ev-610b3f3f6b276678
      next_validation: 收集该仓库的 issue 与 discussion，查看用户报告的实际使用场景、兼容性与失败案例。
