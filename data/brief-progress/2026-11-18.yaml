  cwtractors:
    slug: cwtractors
    name: cwtractors
    decision: watching
    event_summary_zh: 2026年11月17日，cwtractors 公布在 A40 显卡上通过 BF16 分块（tiling）取得 1.499 倍加速和 28.5% 动态能耗下降。
    event_summary_en: On 17 November 2026, cwtractors reported a 1.499x speedup and a 28.5% dynamic energy
      reduction on the A40 GPU via BF16 tiling.
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向在 A40 等 GPU 上运行模型推理或训练的工程团队，在需要压低单卡算力成本与能耗时打开；它接收模型计算中的矩阵运算，用 BF16 分块方式重排计算，最终交付更快的单卡吞吐和更低的动态能耗，具体接入方式与适用模型范围仍待核验。
    inspiration: 趋势是推理与训练成本开始被按单卡能耗和吞吐重新核算，而不只是看模型能力。切入可放在已有 GPU 集群、电费与算力预算敏感的推理服务商或自建机房团队，卖法可能是按部署或按节省的算力计费，但公开材料未披露价格。
    summary_en: For engineering teams running model inference or training on GPUs such as the A40, opened
      when they need to cut per-card compute cost and energy use; it takes the matrix operations in model
      computation and reorganizes them with BF16 tiling, delivering higher per-card throughput and lower
      dynamic energy use, while the integration path and supported model range still need verification.
    inspiration_en: The trend is that inference and training costs are being re-accounted by per-card
      energy and throughput, not just model capability. The entry point is inference providers or self-hosted
      data-center teams with existing GPU clusters and sensitivity to power and compute budgets; pricing
      could plausibly be per deployment or per compute saved, but no price is disclosed.
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: GPU 推理或训练团队在单卡算力与电费预算吃紧时，处理模型中的矩阵运算，要在不换硬件的前提下提高吞吐并降低能耗。
        job_en: GPU inference or training teams, when per-card compute and power budgets are tight, process
          the matrix operations in a model to raise throughput and cut energy use without buying new hardware.
        pain_zh: 单卡算力和电费是推理服务的直接成本，现有实现未充分利用 BF16 分块，导致同样的卡跑得更慢、耗电更多。
        pain_en: Per-card compute and electricity are direct costs of inference services; existing implementations
          underuse BF16 tiling, so the same card runs slower and draws more power.
        current_alternative_zh: 沿用框架默认的算子实现、手工调优内核，或直接加卡扩容。
        current_alternative_en: Using framework-default operator implementations, hand-tuning kernels,
          or simply adding more GPUs.
        usage_reason_zh: 推断：若该分块方案能直接替换现有算子并稳定复现 1.499 倍加速与能耗下降，团队可省去手工调优内核这一步；但目前只有单点性能数字，缺少接入文档、适用模型范围和可复现实测，尚不能判断用户会持续选用。
        usage_reason_en: 'Inference: if this tiling scheme can directly replace existing operators and
          reliably reproduce the 1.499x speedup and energy drop, teams could skip hand-tuning kernels;
          but only a single performance figure exists, with no integration docs, supported model range,
          or reproducible test, so sustained adoption cannot yet be judged.'
      gates:
      - gate: value
        status: insufficient
        reason: 它解决单卡吞吐与能耗成本问题，痛点真实，但公开材料只有一项性能数字，未说明接入方式与适用模型，价值交付是否确定仍不清楚。
        evidence_ids:
        - ev-92a1978904e98db7
      - gate: consensus
        status: insufficient
        reason: 仅有少量社区讨论且无评论，没有用户采用或复现反馈，无法判断是否形成共识。
        evidence_ids:
        - ev-92a1978904e98db7
      - gate: model
        status: insufficient
        reason: 未披露买方、定价或交付方式，是开源内核还是商业服务尚不明确，付费路径无法判断。
        evidence_ids:
        - ev-92a1978904e98db7
      - gate: truth
        status: insufficient
        reason: 性能数字未附可复现实验与适用边界，是否在真实推理负载下稳定成立仍需核验。
        evidence_ids:
        - ev-92a1978904e98db7
      next_validation: 收集该项目的官方仓库或文档，核验其接入方式、支持的模型与硬件范围，以及是否有可复现的基准测试脚本。
