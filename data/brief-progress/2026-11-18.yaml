  burp-sectivai:
    slug: burp-sectivai
    name: Sectiv
    decision: watching
    event_summary_zh: 2026年11月4日，开源项目 burp-sectivai 发布，为 Burp Suite 增加基于技能的 AI 安全审查：用户选定抓包流量和审查目标（IDOR、XSS、SQLi、SSRF
      等）后，生成含描述、复现步骤、影响、PoC、CWE/CVE 的严重度面板，并支持 HTML/MD/JSON 导出；截至11月18日仓库约115星。
    event_summary_en: 'On 4 November 2026, the open-source project burp-sectivai was released, adding
      skill-driven AI security review to Burp Suite: users select captured traffic and a review goal (IDOR,
      XSS, SQLi, SSRF, etc.) and receive a severity dashboard with description, reproduction steps, impact,
      PoC and CWE/CVE, exportable as HTML/MD/JSON; the repository had about 115 stars by 18 November.'
    category: AI + 开发
    project_type: open_source
    industries:
    - 信息安全
    - 软件与互联网服务
    industries_en:
    - Information Security
    - Software and Internet Services
    jobs:
    - 渗透测试工程师在完成抓包后，把 Burp 中的请求流量交给插件，按 IDOR、XSS 等目标生成含复现步骤和 PoC 的漏洞报告，再人工复核后交付客户
    - 安全顾问在客户授权测试中，用插件对已捕获流量做初筛，整理成可导出的严重度清单，供人工确认后写入报告
    jobs_en:
    - Penetration testers hand captured Burp request traffic to the plugin after a test, generate vulnerability
      reports with reproduction steps and PoCs for goals such as IDOR or XSS, then manually review before
      client delivery
    - Security consultants use the plugin during authorized client testing to triage captured traffic
      into an exportable severity list for manual confirmation before writing the report
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 渗透测试人员在 Burp Suite 里完成抓包后，选中一段请求流量并指定审查目标（如 IDOR、XSS、SQLi、SSRF），插件让 AI 分析这些请求，输出带描述、复现步骤、影响、PoC
      和 CWE/CVE 的严重度面板，可导出 HTML/MD/JSON；漏洞是否成立仍需人工复核，具体误报率和交付流程仍待核验。
    inspiration: 趋势：安全测试的初筛环节正从人工逐条看请求，转向让模型先按漏洞类型给出候选清单。切入：面向小型渗透测试团队或独立安全顾问，把“抓包后写报告”这一步做成按次或按项目收费的初筛服务，卖点是可复核的复现步骤和
      PoC，而不是替代人工定级。
    summary_en: After capturing traffic in Burp Suite, penetration testers select a set of requests and
      a review goal (e.g. IDOR, XSS, SQLi, SSRF); the plugin has AI analyze those requests and outputs
      a severity dashboard with description, reproduction steps, impact, PoC and CWE/CVE, exportable as
      HTML/MD/JSON. Whether a finding is valid still needs manual review, and false-positive rates and
      delivery workflow remain to be verified.
    inspiration_en: 'Trend: the triage step of security testing is shifting from reading every request
      by hand to having a model first produce a candidate list by vulnerability type. Entry: target small
      penetration-testing teams or independent security consultants and turn the post-capture report-writing
      step into a per-run or per-project triage service, sold on reviewable reproduction steps and PoCs
      rather than replacing human severity rating.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 渗透测试工程师在 Burp Suite 完成抓包后，把请求流量和审查目标交给插件，生成含复现步骤与 PoC 的漏洞清单，人工复核后写入客户报告。
        job_en: After capturing traffic in Burp Suite, penetration testers give the plugin the requests
          and a review goal to produce a vulnerability list with reproduction steps and PoCs, which they
          manually review before writing the client report.
        pain_zh: 抓包后逐条人工判断漏洞类型、写复现步骤和 PoC 耗时且重复，报告撰写常占测试周期很大一部分。
        pain_en: After capture, judging vulnerability types and writing reproduction steps and PoCs by
          hand is slow and repetitive, and report writing often takes a large share of the test cycle.
        current_alternative_zh: 测试人员靠经验逐条查看请求，用笔记或模板手工整理漏洞描述、复现步骤和 PoC，再粘贴进报告。
        current_alternative_en: Testers review requests one by one by experience and manually assemble
          descriptions, reproduction steps and PoCs with notes or templates before pasting them into reports.
        usage_reason_zh: 推断：相较逐条手写，插件直接读取已捕获请求并按指定漏洞类型生成带复现步骤和 PoC 的候选清单，省去从零起草报告条目的步骤；因此需要批量出报告的小团队或独立顾问会在测试收尾阶段选择它，但误报率与人工复核成本尚缺公开证据。
        usage_reason_en: 'Inference: compared with writing each entry by hand, the plugin reads captured
          requests directly and generates candidate findings with reproduction steps and PoCs for a chosen
          vulnerability type, removing the step of drafting report entries from scratch; small teams or
          independent consultants who need batch reports would therefore choose it at the wrap-up stage,
          though public evidence on false-positive rates and review cost is still missing.'
      gates:
      - gate: value
        status: supported
        reason: 它解决抓包后逐条判断漏洞并手写复现步骤与 PoC 的重复劳动，旧流程明确且不做的后果是报告周期拉长；买方尚不清晰。
        evidence_ids:
        - ev-c0006f61b6104ca8
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价、客户案例或重复使用证据，无法判断是否进入日常工作流。
        evidence_ids:
        - ev-c0006f61b6104ca8
        - ev-d7ad1e0f893dea48
      - gate: model
        status: insufficient
        reason: 开源项目未披露收费方式，买方可能是安全团队自建或顾问按项目收费，属判断而非已验证事实。
        evidence_ids:
        - ev-c0006f61b6104ca8
      - gate: truth
        status: insufficient
        reason: AI 生成的漏洞结论需人工复核，误报率、PoC 可复现性和安全边界均无公开材料支持。
        evidence_ids:
        - ev-c0006f61b6104ca8
      next_validation: 收集该仓库的 issue 与 discussion，查看用户对误报率、PoC 可复现性和实际报告使用的反馈。
