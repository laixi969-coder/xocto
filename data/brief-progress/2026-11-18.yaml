        pain_zh: 通用搜索只给链接列表，用户要自己点开、筛选、比对并判断可信度，耗时且容易漏掉关键来源；不解决则调研周期长、结论缺乏出处。
        pain_en: General search returns a list of links, so users must open, filter, compare and judge
          credibility themselves, which is slow and easily misses key sources; without a fix, research
          takes long and conclusions lack citations.
        current_alternative_zh: 旧做法是通用搜索引擎加人工打开多个标签页摘录，或直接问通用聊天助手但拿不到可靠出处。
        current_alternative_en: The old way is a general search engine plus manually opening many tabs
          to take notes, or asking a general chat assistant but getting unreliable sources.
        usage_reason_zh: 相较旧做法，它把检索、阅读和引用整理合并成一次动作，直接交付带出处的答案，减少用户逐个打开和比对来源的步骤；推断需要快速查证且在意出处的分析师与顾问会在调研初期选择它。
        usage_reason_en: Compared with the old way, it merges retrieval, reading and citation assembly
          into one action and delivers a sourced answer directly, cutting the steps of opening and comparing
          sources one by one; by inference, analysts and consultants who need fast verification and care
          about sources will choose it early in research.
      gates:
      - gate: value
        status: supported
        reason: 它解决查证陌生主题时手工开页比对、结论缺出处的问题，痛点刚性且交付可核对；买方具体构成公开材料未细说。
        evidence_ids:
        - ev-65e59f2af88f9ef0
      - gate: consensus
        status: supported
        reason: 年化收入运行率从年初不足 2.5 亿美元升至 10 亿美元，说明已有大规模付费采用，但材料未拆分订阅与企业客户结构。
        evidence_ids:
        - ev-65e59f2af88f9ef0
      - gate: model
        status: insufficient
        reason: 材料只给收入运行率与产品发布，未披露定价结构、毛利与单位经济，付费路径细节仍缺。
        evidence_ids:
        - ev-65e59f2af88f9ef0
      - gate: truth
        status: insufficient
        reason: 检索问答贴近第一性目标，但引用准确性与幻觉边界无公开评测，交付确定性尚不能核验。
        evidence_ids:
        - ev-65e59f2af88f9ef0
      next_validation: 收集 Perplexity 官方定价页，核对其订阅与企业版计费方式及是否按查询或席位收费。
