    inspiration: 趋势：推理基础设施估值一年内翻倍，说明应用层对 GPU 容量与多模型路由的依赖在加深。切入：不在基础设施层正面竞争，而是从对推理成本敏感、需要稳定交付的垂直应用环节进入；价格与毛利未披露，不可假设。
    summary_en: Baseten was named to Madrona's 2026 Intelligent Applications 40 at the Enabler stage;
      concurrent reports put its new funding round at roughly a $30 billion valuation, more than double
      the June level. This reflects GPU capacity and multi-model routing demand outstripping supply and
      fast-rising valuations in the inference infrastructure layer, with no clear leader yet; for application
      builders it means inference supply cost and bargaining power are still shifting, an inference.
    inspiration_en: 'Trend: inference infrastructure valuations doubling within a year show application
      layers depend more on GPU capacity and multi-model routing. Entry: avoid head-on competition in
      infrastructure and enter at vertical application steps sensitive to inference cost and needing reliable
      delivery; pricing and margins are undisclosed and must not be assumed.'
    event_summary_zh: 2026 年 8 月 Baseten 被列入 Madrona 2026 智能应用 40 的 Enabler 阶段；10 月底报道称其启动新一轮融资，估值约 300
      亿美元，较 6 月翻倍以上。
    event_summary_en: In August 2026 Baseten was named to Madrona's 2026 Intelligent Applications 40 at
      the Enabler stage; in late October reports said it launched a new funding round at roughly a $30
      billion valuation, more than double the June level.
