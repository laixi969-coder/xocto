    inspiration: 趋势：AI 生成的全栈应用大量使用 Supabase 这类托管后端，权限配置错误成为新的高频事故点。切入：从“AI 生成应用 + 托管后端”的权限审计这一窄环节进入，可做按项目扫描或上线前付费审计；目前只有开源仓库信号。
    summary_en: Developers of AI-generated Next.js, Supabase and TypeScript apps hand the code to it via
      CLI or MCP server before launch for a 92-rule static security scan, secret detection, Supabase RLS
      audit and prompt-injection guard, receiving an issue list; rule effectiveness and false positives
      still need verification.
    inspiration_en: 'Trend: AI-generated full-stack apps heavily use managed backends like Supabase, making
      permission misconfiguration a frequent new failure point. Wedge: enter the narrow permission-audit
      step for AI-generated apps on managed backends, possibly charging per project scan or pre-launch
      audit; only open-source repo signals exist.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 用 AI 生成 Next.js/Supabase 应用的开发者，在上线前处理自己生成的代码与数据库权限配置，要完成一次安全扫描并拿到问题清单。
        job_en: Developers of AI-generated Next.js/Supabase apps handle their generated code and database
          permission config before launch to complete a security scan and get an issue list.
        pain_zh: AI 生成的代码常把 Supabase 行级权限配错或留下密钥，上线后可能直接暴露数据，开发者自己难以逐条排查。
        pain_en: AI-generated code often misconfigures Supabase row-level permissions or leaves secrets,
          potentially exposing data after launch, and developers struggle to check item by item.
