        pain_zh: AI 生成的代码容易带出硬编码密钥、过宽访问控制和未完成逻辑，上线前没人系统检查，出事代价高。
        pain_en: AI-generated code often carries hardcoded secrets, overly broad access control and unfinished
          logic; nobody checks systematically before launch and the cost of failure is high.
        current_alternative_zh: 靠开发者自己肉眼过一遍、临时问 AI 或直接上线后再补，缺少固定的发布前检查步骤。
        current_alternative_en: Developers eyeball the code, ask an AI ad hoc, or ship first and fix later,
