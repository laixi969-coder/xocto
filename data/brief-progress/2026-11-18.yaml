  govern-and-discover-records-with-common-metadata-in-aws-agen:
    slug: govern-and-discover-records-with-common-metadata-in-aws-agen
    name: AWS Agent Registry
    decision: market_context
    event_summary_zh: 2026年11月17日，AWS 为其 Agent Registry 新增自定义元数据架构：管理员可定义组织级键值字段（业务单元、资源负责人、风险分级、开发环境），并强制登记表中的每个
      agent、MCP server 与 skill 记录填写这些字段。这意味着企业 agent 治理从自由描述转向可强制的结构化登记，对应用方的含义是：agent 的合规与归属信息成为上架前置条件，第三方
      agent 工具若不能对接此类登记与审批流程，进入企业采购的门槛会上升（推断）。
    event_summary_en: 'On 17 November 2026, AWS added custom metadata schemas to its Agent Registry: administrators
      define organization-level key-value fields (business unit, resource owner, risk classification,
      development environment) and every agent, MCP server and skill record in the registry must carry
      them. Enterprise agent governance thus moves from free-text descriptions to enforceable structured
      registration; the implication for application builders is that compliance and ownership metadata
      become a precondition for listing, raising the bar for third-party agent tools that cannot plug
      into such registration and approval flows (inference).'
    category: 基础层
    project_type: ai_transformation
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是 AWS 云平台上的 agent 登记目录，不是独立产品。企业管理员在 agent、MCP server 与 skill 数量增多、需要统一审批与查找时打开它，为每条记录定义并强制填写业务单元、负责人、风险分级等元数据字段，最终得到一份可检索、带审批状态的登记清单；具体治理流程与交付仍待核验。
    inspiration: 趋势：企业 agent 数量膨胀后，治理与登记先于应用价值成为采购前置条件。切入：可从垂直行业的 agent 合规登记与审批留痕切入，例如为受监管行业提供可对接云登记表的元数据填报与审计服务；这是平台能力变化，不是可独立创业的产品。
    summary_en: This is an agent catalog inside the AWS cloud platform, not a standalone product. An enterprise
      administrator opens it when agents, MCP servers and skills proliferate and need unified approval
      and discovery, defines enforced metadata fields such as business unit, owner and risk classification
      for each record, and ends up with a searchable registry carrying approval status; the concrete governance
      workflow and delivery still need verification.
    inspiration_en: 'Trend: once enterprise agents multiply, governance and registration precede application
      value as a procurement precondition. Entry: vertical agent compliance registration and approval
      trails, e.g. metadata filing and audit services that plug into cloud registries for regulated industries;
      this is a platform capability change, not a standalone startup product.'
  gpt62-astra-and-gpt62-sol:
    slug: gpt62-astra-and-gpt62-sol
    name: GPT-6.2 Astra
    decision: market_context
    event_summary_zh: 2026年11月17日，OpenAI 发布 GPT-6.2 Astra 与 GPT-6.2 Sol 两款模型并开放 API（gpt-6.2-astra、gpt-6.2-sol）。Astra
      定价为每百万 token 输入 8 美元、输出 40 美元，为上一代 6 Astra（10/50）的 80%；缓存输入价从每百万 1 美元降至 0.40 美元。Sol 维持 2/10 美元。
    event_summary_en: On 17 November 2026, OpenAI released GPT-6.2 Astra and GPT-6.2 Sol and made them
      available in the API as gpt-6.2-astra and gpt-6.2-sol. Astra is priced at $8 per million input tokens
      and $40 per million output tokens, 80% of the previous 6 Astra ($10/$50); cached input drops from
      $1 to $0.40 per million. Sol stays at $2/$10.
    category: 基础层
    project_type: new_application
    industries: []
    industries_en: []
    jobs: []
    jobs_en: []
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 这是模型厂商的模型发布，不是独立应用。对应用方的直接含义是前沿模型调用价格下探、缓存输入价大幅降低，长时运行的 agent 会话成本随之下降；但单次发布不足以推断整个行业已转向，具体应用层的成本与竞争影响仍取决于各产品的调用结构。
    inspiration: 模型价格下探会重排应用层的成本结构：缓存输入降到每百万 0.40 美元，意味着长会话、多轮检索类工作流的单次成本被压低，原本因调用费过高而不敢做的持续运行场景开始算得过账。切入不在模型本身，而在那些过去因
      token 成本被砍掉的垂直长流程——例如需要反复读取同一批合同、病历或工单的行业助手，可把省下的调用成本转成按结果计价的卖法。
    summary_en: This is a model release from a model vendor, not a standalone application. The direct
      implication for builders is lower frontier-model pricing and a sharply cheaper cached-input rate,
      which reduces the cost of long-running agent sessions; but one release does not show the whole industry
      has shifted, and the application-layer cost and competitive effects depend on each product's call
      mix.
    inspiration_en: 'Falling model prices reshuffle application-layer cost structures: cached input at
      $0.40 per million lowers the per-run cost of long, multi-turn retrieval workflows, making continuously
      running scenarios that were previously priced out start to pencil out. The opening is not the model
      itself but the vertical long-running processes that were cut for token cost — for example industry
      assistants that repeatedly read the same contracts, records or tickets, where saved call cost can
      be turned into outcome-based pricing.'
    req_initial:
      verdict: needs_validation
      signal_level: 需求存疑
      demand_read:
        job_zh: 模型发布本身不构成用户任务；应用开发者是在构建长时 agent 会话时选择调用哪一档模型与缓存策略。
        job_en: A model release is not itself a user task; application developers choose which model tier
          and caching strategy to call when building long-running agent sessions.
        pain_zh: 前沿模型调用成本高，长会话与重复读取同一材料的场景单次费用难以承受。
        pain_en: Frontier model calls are expensive, and long sessions that repeatedly read the same material
          are hard to afford per run.
        current_alternative_zh: 继续使用上一代 6 Astra 或竞品 Claude Fable 5.2，或缩短上下文、减少重试来压成本。
        current_alternative_en: Keep using the previous 6 Astra or the competing Claude Fable 5.2, or
          shorten context and cut retries to control cost.
        usage_reason_zh: 这是模型发布而非独立产品，不存在用户选择该产品的因果链；对开发者的意义是同等任务下调用单价与缓存价更低（推断），因此长时 agent 场景的成本门槛下降。
        usage_reason_en: This is a model release rather than a standalone product, so there is no causal
          chain of users choosing it; for developers the meaning is a lower per-call and cached price
          for the same task (inference), lowering the cost threshold for long-running agent scenarios.
      gates:
      - gate: value
        status: insufficient
        reason: 模型发布不是独立产品，无法按用户任务与旧工作流做价值判定；仅能确认调用价格与缓存价格的具体变化。
        evidence_ids:
        - ev-2024c8d8adee11e5
      - gate: consensus
        status: insufficient
        reason: 未进入：材料只有发布与定价，没有应用层采用或使用数据。
        evidence_ids:
        - ev-2024c8d8adee11e5
      - gate: model
        status: insufficient
        reason: 未进入：模型厂商按 token 收费，但这不是应用产品的付费路径判断。
        evidence_ids:
        - ev-2024c8d8adee11e5
      - gate: truth
        status: insufficient
        reason: 未进入：单次发布不足以推断行业转向，交付与安全边界不在本材料范围内。
        evidence_ids:
        - ev-2024c8d8adee11e5
      next_validation: 收集 OpenAI 官方定价页与 API 文档，核对 gpt-6.2-astra 与 gpt-6.2-sol 的计费口径与缓存价格是否与报道一致。
  harvard-law-dropout-raises-6m-for-blue-voice-to-build-a-harv:
    slug: harvard-law-dropout-raises-6m-for-blue-voice-to-build-a-harv
    name: Blue Voice
    decision: watching
    event_summary_zh: 2026年9月，Blue Voice 获得 600 万美元融资，用于为警员提供实时政策指引的 AI 助手，被媒体称为“警员版 Harvey”。
    event_summary_en: In September 2026, Blue Voice raised $6M to give police officers an AI assistant
      for real-time policy guidance, described in coverage as a 'Harvey for police officers'.
    category: AI + 商业
    project_type: new_application
    industries:
    - 公共安全
    - 执法
    industries_en:
    - public safety
    - law enforcement
    jobs:
    - 警员在执勤或处置现场时，需要查阅部门政策与程序手册，以确认某项操作是否合规并完成记录
    jobs_en:
    - Police officers on patrol or at an incident need to consult department policy and procedure manuals
      to confirm whether an action is compliant and to complete records
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 警员在执勤或处置现场遇到程序疑问时，打开该助手查询部门政策与操作规范，AI 依据政策材料给出实时指引，帮助其判断下一步动作；具体交付形式、是否需人工复核及覆盖的政策范围仍待核验。
    inspiration: 趋势：法律、合规类“专业文档问答”正从律所外溢到执法、保险等强规则行业。切入：从警局政策手册与执勤记录这一旧流程进入，卖法可按部门订阅或按培训/合规审计交付，但公开价格未披露。
    summary_en: When officers face procedural questions on patrol or at an incident, they open this assistant
      to query department policy and operating rules; the AI returns real-time guidance from policy materials
      to help decide the next action. The exact deliverable, human review step and policy coverage still
      need verification.
    inspiration_en: 'Trend: professional document Q&A is spreading from law firms into rule-heavy fields
      such as policing and insurance. Entry: start from the department policy manual and incident-record
      workflow; possible selling models are per-department subscription or training/compliance audit delivery,
      though public pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 警员在执勤或处置现场遇到程序疑问时，需要从部门政策与程序手册中查出一条可执行的操作依据，并据此完成处置与记录。
        job_en: When officers face procedural questions on patrol or at an incident, they must find an
          actionable basis in department policy and procedure manuals and use it to complete the response
          and records.
        pain_zh: 政策手册篇幅长、更新频繁，现场靠记忆或翻纸质/内部系统查找，慢且容易出错；查错或漏查会带来合规与问责风险。
        pain_en: Policy manuals are long and frequently updated; officers rely on memory or searching
          paper/internal systems on scene, which is slow and error-prone, and a wrong or missed lookup
          creates compliance and accountability risk.
        current_alternative_zh: 靠记忆、纸质手册、内部知识库检索，或事后向主管与法务同事询问。
        current_alternative_en: Relying on memory, paper manuals, internal knowledge-base search, or asking
          supervisors and legal colleagues afterward.
        usage_reason_zh: 推断：相较翻手册或问同事，该助手把政策文本直接转成针对当前情境的实时答复，减少现场查找与等待主管回复这一步；警员在执勤中遇到程序不确定时会因此选择它。公开材料尚未给出留存或客户案例。
        usage_reason_en: 'Inference: versus flipping through manuals or asking colleagues, the assistant
          turns policy text into a real-time answer for the current situation, removing the on-scene lookup
          and waiting for a supervisor; officers would choose it when unsure of procedure on duty. Public
          materials do not yet show retention or customer cases.'
      gates:
      - gate: value
        status: supported
        reason: 它解决警员现场查政策慢、易出错的问题，旧做法是记忆、纸质手册或问主管，痛点在合规问责下是刚性的；买方与付费路径尚不清晰。
        evidence_ids:
        - ev-0ad74478edb3f8f4
      - gate: consensus
        status: insufficient
        reason: 仅有融资报道，未见警局采用、试点或用户反馈，场景是否被一线接受尚缺证据。
        evidence_ids:
        - ev-0ad74478edb3f8f4
      - gate: model
        status: insufficient
        reason: 报道未披露定价、采购方式或按部门/席位收费的结构，钱从哪来只能推断为 to G 采购。
        evidence_ids:
        - ev-0ad74478edb3f8f4
      - gate: truth
        status: insufficient
        reason: 政策问答出错涉及执法责任，报道未说明人工复核、责任边界与政策更新机制，交付确定性待核验。
        evidence_ids:
        - ev-0ad74478edb3f8f4
      next_validation: 收集 Blue Voice 官方产品页或警局试点/采购公告，核实其政策数据来源、人工复核流程与收费方式。
  how-loanpro-built-an-agentic-ai-loan-servicing-assistant-wit:
    slug: how-loanpro-built-an-agentic-ai-loan-servicing-assistant-wit
    name: LoanPro
    decision: queued
    event_summary_zh: 2026年11月17日，AWS 与 LoanPro 联合发布案例：LoanPro 借助 AWS 合作伙伴 AllCloud 与 AWS 生成式 AI 创新中心，基于
      Amazon Bedrock 与 Bedrock AgentCore 构建多智能体贷款服务助手，为客服坐席即时汇总借款人上下文并给出下一步建议；据 AllCloud 公布的案例，早期结果显示客服通话时长最多缩短
      15%。
    event_summary_en: 'On 17 November 2026, AWS and LoanPro published a joint case study: LoanPro, working
      with AWS partner AllCloud and the AWS Generative AI Innovation Center, built a multi-agent loan
      servicing assistant on Amazon Bedrock and Bedrock AgentCore that gives servicing agents synthesized
      borrower context and next-step recommendations; early results cited in AllCloud''s published case
      study show customer call times reduced by up to 15 percent.'
    category: AI + 商业
    project_type: ai_transformation
    industries:
    - 金融服务
    - 贷款与信贷
    industries_en:
    - Financial services
    - Lending and credit
    jobs:
    - 贷款服务机构客服坐席在借款人来电时，需从数十个账户字段、交易记录与工作流队列中手工拼出客户背景，再完成答复与下一步处理
    jobs_en:
    - Loan servicing call-center agents who, when a borrower calls, must manually assemble context from
      dozens of account fields, transaction histories and workflow queues before responding and deciding
      the next step
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 贷款服务机构的客服坐席在借款人来电时打开它，原本要跨数十个账户字段、交易记录和工作流队列手工拼出客户背景；AI 接收这些账户与交易材料，汇总出借款人上下文并给出下一步处理建议，坐席据此答复并推进工单，最终交付是更短的通话与更一致的答复，人工仍需确认建议后再执行。
    inspiration: 趋势：贷款服务这类强合规、强流程的旧后台工作，开始把“坐席翻数据拼上下文”这一步交给多智能体完成，而不是只加一个问答框。切入：从贷款、保险理赔等有大量坐席和工单系统的服务环节进入，卖“缩短每通电话的准备时间”这一可核对结果；具体计价方式未披露，需核验。
    summary_en: Loan servicing agents open it when a borrower calls; instead of manually assembling context
      across dozens of account fields, transaction histories and workflow queues, the AI takes those account
      and transaction materials, synthesizes borrower context and recommends next steps, and the agent
      uses that to answer and advance the case, delivering shorter calls and more consistent responses
      while a human still confirms before acting.
    inspiration_en: 'Trend: heavily regulated back-office work such as loan servicing is starting to hand
      the ''agent digs through data to rebuild context'' step to multi-agent systems rather than just
      adding a chat box. Entry: start from servicing operations in lending or insurance claims that have
      many agents and ticketing systems, and sell the checkable result of shorter per-call preparation
      time; pricing is not disclosed and needs verification.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 贷款服务机构的客服坐席在借款人来电时，需要从数十个账户字段、交易记录和工作流队列中拼出客户背景，再完成答复与下一步处理。
        job_en: Loan servicing call-center agents, when a borrower calls, must assemble customer context
          from dozens of account fields, transaction histories and workflow queues, then respond and decide
          the next step.
        pain_zh: 手工拼上下文拉长通话、造成服务质量不一致并让坐席疲惫；不解决的后果是每通电话更慢、答复口径不一。
        pain_en: Manual context assembly lengthens calls, produces inconsistent service quality and frustrates
          agents; the cost of not solving it is slower calls and uneven answers.
        current_alternative_zh: 坐席在多个系统与队列之间手工切换、逐字段查找并自行归纳，再口头答复借款人。
        current_alternative_en: Agents switch among multiple systems and queues, look up fields one by
          one and summarize manually before answering the borrower.
        usage_reason_zh: 相较坐席逐字段手工查找，该助手直接汇总借款人上下文并给出下一步建议，减少通话前的准备步骤；据 AllCloud 案例，早期通话时长最多缩短 15%，这是可核对的结果。推断：坐席会在来电高峰、账户信息分散时选择它。
        usage_reason_en: 'Compared with field-by-field manual lookup, the assistant synthesizes borrower
          context and recommends next steps, cutting the pre-call preparation step; per AllCloud''s case
          study, early call times fell by up to 15 percent, a checkable result. Inference: agents would
          choose it during call peaks when account information is scattered.'
      gates:
      - gate: value
        status: supported
        reason: 它解决坐席来电时手工拼借款人上下文的痛点，旧流程明确、不解决则通话更长且答复不一致，价值结构成立。
        evidence_ids:
        - ev-33fb6db2614e1679
      - gate: consensus
        status: insufficient
        reason: 仅有 AWS 与 LoanPro 联合案例及 AllCloud 公布的早期结果，未见独立客户评价或坐席持续使用数据。
        evidence_ids:
        - ev-33fb6db2614e1679
      - gate: model
        status: insufficient
        reason: 买方应是贷款服务机构，但公开材料未披露定价、席位或按结果计费方式，付费路径属推断。
        evidence_ids:
        - ev-33fb6db2614e1679
      - gate: truth
        status: insufficient
        reason: 通话时长缩短 15% 是早期结果，未见合规审查、人工确认边界与错误率的公开说明。
        evidence_ids:
        - ev-33fb6db2614e1679
      next_validation: 收集 LoanPro 官方产品页或 AllCloud 案例全文，核验该助手的定价与计费方式、部署文档及坐席使用与错误率数据。
