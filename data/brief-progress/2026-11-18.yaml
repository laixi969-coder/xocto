    summary_zh: 消费者在准备购物或预订时打开 Klarna 的 AI 助手，把原本需要自己在多个商家页面检索、比较和下单的材料交给助手处理，由它执行检索与下单或预订动作，用户最终拿到订单或预订结果；具体流程、可用范围和人工确认环节仍待核验。
    inspiration: 趋势：支付与先买后付平台正把入口从结账页前移到“想买什么”的决策环节，助手直接承接购物与预订任务。切入：可从旅行、餐饮等高频预订场景切入，按成交或预订结果向商家收费；Klarna
      自身定价与分成方式未披露，属推断。
    summary_en: When preparing to shop or book, a consumer opens Klarna's AI assistant and hands over
      the material they would otherwise search, compare and order across merchant pages; the assistant
      performs the search and the ordering or booking action, and the user receives an order or booking
      result. The exact workflow, availability and human confirmation steps remain to be verified.
    inspiration_en: 'Trend: payment and buy-now-pay-later platforms are moving their entry point upstream
      from checkout to the ''what should I buy'' decision, with assistants taking on shopping and booking
      tasks directly. Entry: start from high-frequency booking scenarios such as travel and dining and
      charge merchants per completed order or booking; Klarna''s own pricing and revenue share are undisclosed,
      so this is inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
