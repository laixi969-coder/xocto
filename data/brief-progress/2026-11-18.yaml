    slug: ai-era-job-kit
    name: ai-era-job-kit
    decision: watching
    category: AI + 效率
    project_type: open_source
    industries:
    - 软件与信息技术服务
    - 职业培训与就业服务
    industries_en:
    - Software and IT services
    - Career training and employment services
    jobs:
    - 软件工程师求职时整理简历、LinkedIn、公开代码仓库 与作品集，按目标岗位要求改写并准备投递材料
    - Recruiting-focused software engineers organizing resumes, LinkedIn, 公开代码仓库 and portfolios, rewriting
      them against target role requirements before applying
    jobs_en:
    - Software engineers preparing job applications by organizing resumes, LinkedIn, public code repository
      and portfolios and rewriting them against target role requirements
    - Recruiting-focused software engineers organizing resumes, LinkedIn, public code repository and portfolios,
      rewriting them against target role requirements before applying
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 软件工程师在求职投递前打开它，把简历、LinkedIn、公开代码仓库 和作品集交给一组代理，对照 O*NET 与 BLS 的职业数据打分并重写这些材料，最终拿到改写后的求职材料；人工仍需自行确认改写内容是否属实。具体交付形态与使用流程仍待核验。
    inspiration: 趋势：求职材料正从人工逐份改写，转向对照公开职业数据自动打分与重写。切入：可从退役军人、转行工程师等具体求职人群进入，按改写份数或求职辅导打包收费；但该仓库目前只是工作坊配套工具，尚无付费与留存证据。
    summary_en: 'Software engineers open it before applying: they hand resumes, LinkedIn, public code
      repository and portfolios to a set of agents that score and rewrite them against O*NET and BLS occupation
      data, and get back revised application materials; humans still must confirm the rewrites are accurate.
      The exact deliverable and workflow still need verification.'
    inspiration_en: 'Trend: job-application materials are moving from manual rewriting to automatic scoring
      and rewriting against public occupation data. Entry: start with specific job-seeking groups such
      as veterans or career-switching engineers, charging per rewrite or as bundled career coaching; the
      repository is currently a workshop companion with no payment or retention evidence.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 软件工程师在求职投递前，整理简历、LinkedIn、公开代码仓库 与作品集，对照目标岗位要求改写并准备投递材料。
        job_en: Before applying, software engineers organize resumes, LinkedIn, public code repository
          and portfolios and rewrite them against target role requirements.
        pain_zh: 求职材料分散在多个平台，逐份对照岗位要求改写耗时，且难以判断哪些经历该突出。
        pain_en: Application materials are scattered across platforms; rewriting each against role requirements
          is time-consuming and it is hard to judge which experience to highlight.
        current_alternative_zh: 人工逐份修改简历，或使用通用写作助手零散改写，缺少对照职业数据的统一打分。
        current_alternative_en: Manually editing each resume, or piecemeal rewriting with general writing
          assistants, without unified scoring against occupation data.
        usage_reason_zh: 推断：它把简历、LinkedIn、公开代码仓库 与作品集一次性对照 O*NET 与 BLS 数据打分并重写，省去求职者逐平台比对岗位要求的步骤，因此正在集中投递的工程师会尝试它；尚无用户反馈证明持续使用。
        usage_reason_en: 'Inference: it scores and rewrites resumes, LinkedIn, public code repository
          and portfolios in one pass against O*NET and BLS data, removing the step of comparing each platform
          against role requirements, so engineers in an active job search may try it; no user feedback
          yet shows sustained use.'
      gates:
      - gate: value
        status: supported
        reason: 它解决求职材料分散、逐份对照岗位要求改写耗时的问题，交付为改写后的材料，痛点具体；但改写准确性仍需人工确认。
        evidence_ids:
        - ev-751b4006b7105ba3
        - ev-4e9be05b54364a7f
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 51 增至 67 的关注度信号，没有用户评价或采用案例说明谁在什么场景下使用。
        evidence_ids:
        - ev-751b4006b7105ba3
        - ev-4e9be05b54364a7f
      - gate: model
        status: insufficient
        reason: 项目免费开源，未披露付费路径或买方；这是判断，不是已验证事实。
        evidence_ids:
        - ev-4e9be05b54364a7f
      - gate: truth
        status: insufficient
        reason: 未核验改写结果是否准确、是否被求职者重复使用，交付确定性缺少公开证据。
        evidence_ids:
        - ev-751b4006b7105ba3
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有用户报告实际改写结果与重复使用情况。
  ai-video-edit-workflow:
    slug: ai-video-edit-workflow
    name: ai-video-edit-workflow
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 视频制作
    - 内容营销
    industries_en:
    - video production
    - content marketing
    jobs:
    - 独立视频创作者或小团队在拿到原始素材后，填写表单生成剪辑简报，让命令行代理分析视频并用 Remotion 与 ffmpeg 合成带特效和音乐的成片
    jobs_en:
    - Independent video creators or small teams fill a form to generate an editing brief after receiving
      raw footage, then let a command-line agent analyze the video and assemble a cut with effects and
      music via Remotion and ffmpeg
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 独立视频创作者拿到原始素材后，先填一张表单生成剪辑简报，再让 Claude Code、Codex 或 Gemini CLI 这类命令行代理分析视频，用 Remotion 透明图层和
      ffmpeg 合成带 25 种特效、镜头检测和音乐的成片，Windows 支持一键安装。最终交付是自动拼好的视频文件，但成片质量与人工复核环节的具体流程仍待核验。
    inspiration: 趋势：剪辑的“简报—粗剪—套特效”这一段正被拆成可脚本化的流水线，模型只负责看素材和出决策，渲染交给确定性工具。切入：面向接单量大的短视频代运营或电商素材团队，按成片条数收费，先做“套版+卡点+字幕”这类重复度最高的粗剪环节，把人工留给创意和终审。
    summary_en: After receiving raw footage, independent video creators fill a form to generate an editing
      brief, then let a command-line agent such as Claude Code, Codex or Gemini CLI analyze the video
      and assemble a cut with 25 effects, shot detection and music via Remotion transparent layers and
      ffmpeg, with one-click Windows install. The deliverable is an auto-assembled video file, though
      output quality and the human review step still need verification.
    inspiration_en: 'Trend: the brief-to-rough-cut-to-effects stretch of editing is being split into a
      scriptable pipeline where the model only watches footage and makes decisions while rendering goes
      to deterministic tools. Entry: target high-volume short-video agencies or e-commerce asset teams,
      charge per finished cut, and start with the most repetitive rough-cut steps such as templating,
      beat-syncing and captions, leaving creativity and final review to humans.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 独立视频创作者或小团队在拿到原始素材后，需要先形成剪辑简报，再完成粗剪、套特效、配乐并导出成片。
        job_en: Independent video creators or small teams need to turn raw footage into an editing brief,
          then complete a rough cut, apply effects, add music and export a finished video.
        pain_zh: 粗剪、套特效和配乐是重复且耗时的机械步骤，创作者往往在创意之前就被这些操作拖住；不做的后果是交付变慢或外包成本上升。
        pain_en: Rough cutting, applying effects and adding music are repetitive, time-consuming mechanical
          steps that stall creators before the creative work; skipping them means slower delivery or higher
          outsourcing costs.
        current_alternative_zh: 目前多用手动剪辑软件逐条拖时间线，或把粗剪外包给剪辑师，简报靠口头或文档沟通。
        current_alternative_en: Today most creators drag timelines manually in editing software or outsource
          rough cuts to editors, with briefs communicated verbally or in documents.
        usage_reason_zh: 推断：它把“看素材—出剪辑决策—套特效渲染”串成一条命令，创作者只需填表并让代理分析视频，省去逐条拖时间线和手动套特效的步骤，因此接单量大的短视频团队在批量出粗剪时可能选择它；成片是否达到可直接交付的质量尚无公开证据。
        usage_reason_en: 'Inference: it chains footage review, editing decisions and effect rendering
          into one command, so creators only fill a form and let the agent analyze the video, skipping
          manual timeline dragging and effect application; high-volume short-video teams may choose it
          for batch rough cuts, though public evidence that output is delivery-ready is absent.'
      gates:
      - gate: value
        status: supported
        reason: 它解决视频粗剪、套特效和配乐这类重复机械步骤，替代手动拖时间线或外包粗剪，痛点具体且不做的代价是交付变慢。
        evidence_ids:
        - ev-067d540d336dc342
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 54 缓慢增至 63，属关注度信号，没有用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-70a66416f1a9b922
