    - 模型选型负责人或采购方在评估多个大模型时，需要把候选模型放到自己的业务任务上比较，并据此决定采用哪一个
    - AI 产品团队在上线前需要向内部或客户说明所选模型在特定任务上的表现，并留下可复核的评测记录
    jobs_en:
    - Model selection leads or buyers comparing multiple large models need to run candidates against their
      own business tasks and decide which to adopt
    - AI product teams need to justify their model choice on specific tasks to internal stakeholders or
      customers and keep a reviewable evaluation record
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 模型选型人员面对多个候选大模型时，打开 Artificial Analysis 的定制评测工具，把自家用例的题目和评判标准交给它，由它跑分并给出可比较的结果，用于决定采用哪个模型；具体支持哪些任务类型、人工复核环节如何安排，公开材料尚未说明。
    inspiration: 趋势是模型数量与版本迭代速度超过采购方的判断能力，通用榜单已不足以回答“哪个模型适合我的任务”。切入可从有合规或成本压力的企业模型采购环节进入，卖定制评测报告或按次评测，而不是卖榜单订阅；价格未披露。
    summary_en: When choosing among several large models, a model-selection lead opens Artificial Analysis's
      custom benchmark tool, supplies questions and scoring criteria for their own use case, and gets
      comparable scores to decide which model to adopt; which task types are supported and how human review
      fits in are not described in the public material.
    inspiration_en: The trend is that model count and version churn outpace buyers' ability to judge,
      so generic leaderboards no longer answer which model fits a given task. The entry point is enterprise
      model procurement under cost or compliance pressure, selling custom evaluation reports or per-run
      evaluations rather than leaderboard subscriptions; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 模型选型负责人或采购方在多个候选模型之间做决定时，需要把候选模型放到自己的业务任务上比较，产出可向内部交代的选型依据。
        job_en: A model-selection lead or buyer deciding among candidate models needs to compare them
          on their own business tasks and produce a defensible selection rationale.
        pain_zh: 通用榜单的分数与自家任务表现不一致，靠人工逐个试跑成本高且难以复现，选错模型会带来迁移和成本损失。
        pain_en: Generic leaderboard scores diverge from performance on one's own tasks, manual trial
          runs are costly and hard to reproduce, and a wrong pick brings migration and cost losses.
        current_alternative_zh: 依赖公开榜单排名、厂商自报数据，或由工程师手工写脚本逐个模型试跑。
        current_alternative_en: Relying on public leaderboard rankings and vendor-reported numbers, or
          having engineers hand-write scripts to trial each model.
        usage_reason_zh: 推断：相较手工试跑，用户把自家用例的题目和评判标准交给定制评测，由平台统一跑分并输出可比较结果，省去搭建评测脚本和汇总分数这两步，因此有明确选型决策压力的团队会在采购或上线前使用它。
        usage_reason_en: 'Inference: versus manual trial runs, users hand their own questions and scoring
          criteria to a custom benchmark that runs and reports comparable scores, removing the steps of
          building evaluation scripts and aggregating results, so teams facing a concrete selection decision
          use it before procurement or launch.'
      gates:
      - gate: value
        status: supported
        reason: 它解决模型选型时通用榜单无法回答自家任务表现的问题，痛点是选错模型的迁移与成本损失；买方与付费方式尚不明确。
        evidence_ids:
        - ev-f21ad2839c01ec8f
        - ev-08610498cc06a990
      - gate: consensus
        status: insufficient
        reason: 社区讨论热度较高，但公开材料未显示企业采购方已把它纳入选型流程的采用证据。
        evidence_ids:
        - ev-08610498cc06a990
      - gate: model
        status: insufficient
        reason: 未见定价页或付费路径说明，钱可能来自企业评测服务或订阅，这是判断而非已验证事实。
        evidence_ids:
        - ev-f21ad2839c01ec8f
      - gate: truth
        status: insufficient
        reason: 评测结果能否稳定复现、人工复核边界如何，公开材料未说明，需核验其定制评测的方法说明。
        evidence_ids:
        - ev-08610498cc06a990
      next_validation: 收集 Artificial Analysis 定制评测工具的官方方法说明或定价页，确认其任务类型覆盖与结果复现方式。
