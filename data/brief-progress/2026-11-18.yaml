    jobs_en:
    - Readers encountering images or video while browsing need to judge whether they are AI-generated
      before trusting or sharing them
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 读者在浏览网页遇到图片或视频时，浏览器扩展在本地对页面中的图像和视频做 AI 生成检测并给出标记，用户据此决定是否采信或转发；检测结果仍需人工判断，准确率与误报情况在候选材料中未披露。
    inspiration: 趋势是 AI 生成内容泛滥后，核验需求从专业机构下沉到普通浏览场景。切入可考虑面向新闻编辑部、事实核查机构和二手交易平台，把逐张人工核验改为浏览时自动标记，卖法可按机构席位或按核验量计费，但价格未披露。
    summary_en: When readers encounter images or video on a web page, the browser extension runs on-device
      detection for AI-generated content and flags it, helping users decide whether to trust or share
      it; results still need human judgment, and accuracy or false-positive rates are not disclosed in
      the candidate material.
    inspiration_en: The trend is that as AI-generated content spreads, verification shifts from specialist
      institutions down to ordinary browsing. An entry point is newsrooms, fact-checking teams and second-hand
      marketplaces, replacing manual per-image checks with automatic in-browsing flags; pricing could
      be per seat or per verification volume, though no price is disclosed.
