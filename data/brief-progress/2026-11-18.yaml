      usable for training or evaluation, while input formats and human review steps still need verification.
    inspiration_en: The trend is that internal organizational rules are being treated as trainable assets
      rather than mere documents. The entry point is regulation-heavy sectors with frequent policy updates,
      such as financial compliance, clinical procedures or government approvals; pricing could plausibly
      be per policy library or per compilation batch, but no price is disclosed.
