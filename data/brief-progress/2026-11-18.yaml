    summary_en: Developers running a long Claude Code task previously had to guess from scrolling chat
      logs which tool call, model step, hook or subagent was executing; lot-map lights these steps up
      one by one on a live map beside the chat, runs locally and supports seven languages. The user gets
      a visual view of current execution progress; the exact deliverable and human confirmation step still
      need verification.
    inspiration_en: 'The trend is that coding-agent runs are getting longer and less transparent, making
      side-channel observability of what the agent is doing its own layer. Entry point: teams that must
      audit or teach agent behaviour, e.g. retained execution traces for developers in regulated industries
      rather than a real-time animation alone; pricing is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 Claude Code 的开发者在一个较长任务运行中，需要判断工具调用、子代理和钩子执行到哪一步，以决定是否干预或继续等待。
        job_en: A developer using Claude Code during a long task needs to know which tool call, subagent
          or hook is executing, to decide whether to intervene or keep waiting.
        pain_zh: 代理执行过程被埋在滚动日志里，开发者难以快速定位卡在哪一步，出错时排查成本高。
        pain_en: Agent execution is buried in scrolling logs, so developers struggle to locate where it
          stalled and debugging is costly.
        current_alternative_zh: 阅读 Claude Code 的对话输出与日志，或凭经验等待任务结束再看结果。
        current_alternative_en: Reading Claude Code's chat output and logs, or waiting for the task to
          finish and inspecting results afterwards.
        usage_reason_zh: 推断：相较逐行翻日志，lot-map 把工具调用、模型步骤和子代理以实时点亮的方式并列呈现，减少定位当前执行环节的翻找步骤，因此需要盯长任务的开发者会在调试或监督代理时选用它。
        usage_reason_en: 'Inference: versus scrolling logs line by line, lot-map presents tool calls,
          model steps and subagents side by side as they light up, cutting the search step to locate the
          current stage, so developers supervising long tasks would pick it when debugging or monitoring
          an agent.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者在长任务中看不清代理执行到哪一步的问题，痛点具体且不解决的排查代价明确；买方与付费路径尚未披露。
        evidence_ids:
        - ev-53602d83f66333c9
        - ev-697b288bab599b08
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标增长，属于关注度证据，缺少用户评价或重复使用记录来证明已进入日常工作流。
        evidence_ids:
        - ev-697b288bab599b08
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径，钱可能来自赞助或后续商业版，这是判断而非已验证事实。
        evidence_ids:
        - ev-53602d83f66333c9
      - gate: truth
        status: insufficient
        reason: 可视化贴近“看懂代理在做什么”的目标，但本地运行与七语言支持能否确定性反映真实执行状态，缺少实测或文档佐证。
        evidence_ids:
        - ev-c88030e2727bcd51
        - ev-697b288bab599b08
      next_validation: 收集 lot-map 仓库的 issue 与 discussion，查看是否有开发者报告其在真实调试或监督长任务中重复使用并解决了具体定位问题。
