  cut-generative-ai-costs-code-for-rules-models-for-judgment:
    slug: cut-generative-ai-costs-code-for-rules-models-for-judgment
    name: Amazon Bedrock
    decision: market_context
    summary_zh: 2026年11月17日，AWS 发布技术指引，建议在生成式 AI 工作流中把输入校验、格式化、路由等确定性步骤交给代码而非大模型，仅在需要判断的环节调用 Amazon Bedrock
      上的合适模型。该做法针对生产规模下模型调用成本与延迟叠加的问题，意味着 AI 应用的交付成本可通过架构分层降低，竞争重点转向按步骤选择模型与规则。
    summary_en: On November 17, 2026, AWS published technical guidance recommending that deterministic
      steps such as input validation, formatting, and routing in generative AI workflows be handled by
      code rather than large language models, reserving calls to right-sized models on Amazon Bedrock
      for steps requiring judgment. Aimed at the cost and latency stacking of model calls at production
      scale, the approach implies AI application delivery costs can be reduced through architectural layering,
      shifting competition toward per-step choice of models versus rules.
    event_summary_zh: AWS 发布指引，说明如何判断工作流中每一步是否需要调用模型，并映射到确定性代码、受限决策调用或 Amazon Bedrock 上按需选型的模型。
    event_summary_en: AWS published guidance on deciding whether each workflow step needs a model at all,
      mapping options to deterministic code, a constrained decision call, or a right-sized model on Amazon
      Bedrock.
