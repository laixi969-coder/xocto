        - ev-063d2c152ea7e7c3
      - gate: consensus
        status: insufficient
        reason: 仓库星标从50增至70，属关注度信号，没有用户反馈说明它被持续用于日常开发。
        evidence_ids:
        - ev-c34fa628c8fca205
        - ev-063d2c152ea7e7c3
      - gate: model
        status: insufficient
        reason: 材料称免费，未见付费路径；买方可能是个人开发者或小团队，均未披露。
        evidence_ids:
        - ev-063d2c152ea7e7c3
      - gate: truth
        status: insufficient
        reason: 游戏化界面是否贴近多代理调试的第一性目标、派发结果能否确定性交付，材料未提供可核验细节。
        evidence_ids:
        - ev-d5bf4ebfeb9c4b78
      next_validation: 收集该产品官网的定价页与文档，确认是否收费、按什么计价以及多代理派发的实际交付方式。
