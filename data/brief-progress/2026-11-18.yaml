    summary_zh: 面向需要把内部规章变成可执行判断的组织，合规或运营人员在整理政策文件时打开它；它接收组织政策文本，编译成带可验证标签的决策训练数据，用户最终拿到可用于训练或评测的样本集，具体输入格式与人工复核环节仍待核验。
