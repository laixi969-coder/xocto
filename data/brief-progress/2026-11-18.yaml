    slug: lasik
    name: lasik
    decision: watching
    event_summary_zh: ''
    event_summary_en: ''
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息服务
    industries_en:
    - Software and IT services
    jobs:
    - 安全工程师在给编码代理做加固后，需要让代理重新读取真实代码以排查问题，并确认工具不会执行目标代码
    - 安全团队在评估代理权限边界时，需要静态还原被加固遮蔽的代码结构，以核对代理可见范围
    jobs_en:
    - Security engineers need coding agents to read real code again after hardening, while ensuring the
      tool never executes the target
    - Security teams need to statically reconstruct code hidden by hardening to audit what an agent can
      see
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 安全工程师给编码代理做加固（BLA）后，代理读不到真实代码；lasik 以静态命令行与 MCP 服务把被遮蔽的代码还原出来，供代理重新读取，且不执行目标代码。具体还原范围与人工复核环节仍待核验。
    inspiration: 趋势：代理权限加固与代理可读性之间出现新摩擦，安全配置本身成了工作流瓶颈。切入：从给编码代理做安全加固的团队进入，卖“加固后可审计”的配套工具或合规检查，而非通用代码工具。
    summary_en: After security engineers harden coding agents (BLA), the agent can no longer read real
      code; lasik is a static CLI and MCP server that reconstructs the hidden code for the agent to read
      again without executing the target. The exact scope of reconstruction and human review step still
      need verification.
    inspiration_en: 'Trend: a new friction has appeared between agent permission hardening and agent readability,
      making security configuration itself a workflow bottleneck. Entry: start with teams hardening coding
      agents and sell a post-hardening auditability companion or compliance check, not a generic code
      tool.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 安全工程师在给编码代理做加固后，需要让代理重新读取真实代码以排查问题，同时确认工具不会执行目标代码。
        job_en: Security engineers, after hardening coding agents, need the agent to read real code again
          for troubleshooting while ensuring the tool never executes the target.
        pain_zh: 加固遮蔽了代码，代理失去可读性，排查与审计被迫回到人工翻代码，安全配置与可用性互相拉扯。
        pain_en: Hardening hides code and strips agent readability, forcing troubleshooting and audits
          back to manual code reading; security configuration and usability pull against each other.
        current_alternative_zh: 人工逐文件还原或临时放宽加固配置，再让代理读取，过程靠手工且难以复现。
        current_alternative_en: Manually reconstructing files or temporarily loosening hardening so the
          agent can read, a manual and hard-to-reproduce process.
        usage_reason_zh: 推断：相较临时放宽加固，lasik 以静态方式还原被遮蔽代码且不执行目标，减少手工还原与反复调配置的步骤，因此做代理安全加固的团队在排查时会选择它。
        usage_reason_en: 'Inference: compared with temporarily loosening hardening, lasik statically reconstructs
          hidden code without executing the target, cutting manual reconstruction and repeated config
          tweaks, so teams hardening agents would pick it for troubleshooting.'
      gates:
      - gate: value
        status: supported
        reason: 它解决加固后代理读不到代码、排查与审计被迫手工还原的问题，痛点具体且替代行为明确。
        evidence_ids:
        - ev-70f4be4984ff902c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户反馈或客户案例说明谁在什么场景采用。
        evidence_ids:
        - ev-50276d845fb7f4c8
        - ev-70f4be4984ff902c
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径，买方与收费方式不明，属判断而非已验证事实。
        evidence_ids:
        - ev-70f4be4984ff902c
      - gate: truth
        status: insufficient
        reason: 不执行目标代码是安全承诺，但未见独立安全审计或实测材料支撑其确定性交付。
        evidence_ids:
        - ev-70f4be4984ff902c
      next_validation: 收集仓库 issue 与 discussion 中关于还原范围、安全边界和实际使用场景的公开讨论。
