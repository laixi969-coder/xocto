    slug: complexdiscovery
    name: complexdiscovery
    decision: market_context
    summary_zh: 哈佛研究人员发现，AI 编码代理将软件开发的瓶颈从编写代码转移到代码审查环节。这一变化意味着 AI 编码工具的采用会推高对审查与质量保障能力的需求，并可能改变开发团队的交付流程与工具竞争格局（推断）。
    summary_en: Harvard researchers found that AI coding agents have shifted the software development
      bottleneck from writing code to code review. This implies that adoption of AI coding tools raises
      demand for review and quality-assurance capacity and may reshape delivery workflows and tool competition
      (inference).
    event_summary_zh: 哈佛研究人员发现，AI 编码代理将开发瓶颈转移到了代码审查环节。
    event_summary_en: Harvard researchers found that AI coding agents shifted the development bottleneck
      to code review.
