  external-sandboxes-for-coding-agents:
    slug: external-sandboxes-for-coding-agents
    name: External Sandboxes for Coding Agents
    decision: watching
    event_summary_zh: 2026年11月17日，Simon Willison 与 AI 研究实验室 Prime Radiant 合作发布外部沙箱模式，并开源三个沙箱服务器实现（external-sandbox-v86、external-sandbox-container、external-sandbox-quicksand），均提供同一
      localhost API，可让 Pi、Claude Code、Codex 等编码代理把代码执行请求发到独立沙箱内运行。
    event_summary_en: On 17 November 2026, Simon Willison, working with AI research lab Prime Radiant,
      published an external sandbox pattern and released three open-source sandbox server implementations
      (external-sandbox-v86, external-sandbox-container, external-sandbox-quicksand), all exposing the
      same localhost API so coding agents such as Pi, Claude Code and Codex can send code-execution calls
      into a separate sandbox.
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在本地试用编码代理或本地模型时，把代理生成的代码交给独立沙箱执行，避免错误或提示注入破坏本机
    jobs_en:
    - Developers trying coding agents or local models locally route agent-generated code into a separate
      sandbox so mistakes or prompt injection cannot damage the host machine
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在本地试用编码代理或本地模型时，代理要执行生成的代码，原本直接跑在本机上；这套开源沙箱服务器接收代理发来的代码执行请求，在 WebAssembly、Apple Containers
      或 QEMU 隔离环境中运行，返回执行结果，代理本身留在沙箱外。具体流程与交付仍待核验。
    inspiration: 趋势：编码代理开始执行代码后，安全边界从“模型多聪明”转向“代码在哪跑”，隔离执行正成为代理工作流的一层基础设施。切入：可从需要让代理接触真实代码库但又不敢放开本机权限的团队切入，卖托管沙箱或按执行时长计费，而非再做一个编码代理。
    summary_en: When developers try coding agents or local models locally, the agent executes generated
      code, which previously ran directly on the host machine; these open-source sandbox servers receive
      the agent's code-execution calls, run them in WebAssembly, Apple Containers or QEMU isolation, and
      return results while the agent stays outside the sandbox. The exact workflow and delivery still
      need verification.
    inspiration_en: 'Trend: once coding agents execute code, the safety boundary shifts from how smart
      the model is to where the code runs, making isolated execution an infrastructure layer of agent
      workflows. Entry: target teams that want agents to touch real codebases without granting host permissions,
      and sell hosted sandboxes or per-execution-time billing rather than another coding agent.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在本地试用编码代理或本地模型时，需要让代理执行生成的代码，同时避免错误或提示注入对本机造成破坏。
        job_en: Developers trying coding agents or local models locally need the agent to execute generated
          code while preventing mistakes or prompt injection from damaging the host machine.
        pain_zh: 代理直接在本机执行代码，一次错误或提示注入就可能删改文件或执行危险操作，开发者因此不敢放开权限试用本地模型。
        pain_en: Agents executing code directly on the host mean a single mistake or prompt injection
          can delete files or run dangerous operations, so developers hesitate to grant permissions when
          trying local models.
        current_alternative_zh: 旧做法是人工审查每段代码、限制代理权限，或干脆不在本机运行不可信代码。
        current_alternative_en: The old approach is manually reviewing each snippet, restricting agent
          permissions, or simply not running untrusted code on the host.
        usage_reason_zh: 推断：相较人工审查或收紧权限，这套沙箱把代码执行请求转到隔离环境并返回结果，减少了逐段审查和担心破坏本机这一步负担，因此在意安全边界的开发者会在试用本地模型时选择它。
        usage_reason_en: 'Inference: compared with manual review or tightened permissions, these sandboxes
          route code-execution calls into an isolated environment and return results, removing the burden
          of reviewing every snippet and fearing host damage, so security-conscious developers would choose
          it when trying local models.'
      gates:
      - gate: value
        status: supported
        reason: 它解决代理执行代码时本机可能被破坏的需求，痛点具体且不解决的后果明确，旧替代是人工审查或收紧权限。
        evidence_ids:
        - ev-727d1829f631d301
      - gate: consensus
        status: insufficient
        reason: 目前只有作者与实验室的发布说明，缺少独立开发者采用、issue 讨论或复用的公开证据。
        evidence_ids:
        - ev-727d1829f631d301
      - gate: model
        status: insufficient
        reason: 开源实现未披露定价或付费路径，谁付钱尚不清楚，这是判断而非已验证事实。
        evidence_ids:
        - ev-727d1829f631d301
      - gate: truth
        status: supported
        reason: 隔离执行贴近代理安全的第一性目标，交付是确定性的代码执行结果，人工边界清晰。
        evidence_ids:
        - ev-727d1829f631d301
      next_validation: 收集这三个沙箱仓库的 issue、discussion 与独立开发者复现实测，确认是否被实际接入编码代理工作流。
  genesis-ai-raises-500m-at-35b-valuation-to-bring-its-robots:
    slug: genesis-ai-raises-500m-at-35b-valuation-to-bring-its-robots
    name: Genesis AI
    decision: watching
    event_summary_zh: 2026年11月17日，Genesis AI 宣布完成 5 亿美元 A 轮融资，估值 35 亿美元，由 Premji Invest、Khosla Ventures
      和 Eclipse 联合领投，公司自 2024 年成立以来披露融资累计达 6.05 亿美元；此前 2025 年 7 月曾宣布 1.05 亿美元融资。公司同时开发机器人硬件 Eno 与控制软件，初期面向制造、物流和实验室场景。
    event_summary_en: On November 17, 2026, Genesis AI announced a $500 million Series A at a $3.5 billion
      valuation, co-led by Premji Invest, Khosla Ventures and Eclipse, bringing disclosed funding to $605
      million since its 2024 founding; it had previously announced $105 million in July 2025. The company
      develops both the Eno robot and its control software, initially targeting manufacturing, logistics
      and laboratories.
    category: AI + 生活
    project_type: new_application
    industries:
    - 制造业
    - 物流
    - 实验室服务
    industries_en:
    - Manufacturing
    - Logistics
    - Laboratory Services
    jobs:
    - 工厂或仓库运营人员在产线或仓储环节需要机器人完成搬运、装配等物理任务时，用人工示范动作训练机器人并部署到现场
    - 实验室技术员在重复性样品处理环节需要机器人代劳时，用示范数据训练机械臂完成操作
    jobs_en:
    - Factory or warehouse operators training robots to perform physical tasks such as moving and assembly
      on production lines or in warehouses by demonstrating human motions and deploying them on site
    - Lab technicians training robotic arms to handle repetitive sample processing by demonstration data
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 制造、物流和实验室的一线运营者在需要机器人完成搬运、装配或样品处理时，先录制人手动作，再在仿真环境中让机器人反复练习，最后把训练好的技能部署到 Eno 实体机器人上执行物理任务。用户拿到的是可现场运行的机器人作业能力，具体交付节奏与人工复核边界仍待核验。
    inspiration: 趋势：机器人公司开始把“人手示范数据 + 仿真训练”当作通用物理技能的生产方式，资本正押注全栈自建。切入：不要做通用机器人，可从某个高频、动作标准化程度高的单一工位（如仓储分拣、实验室移液）切入，按机器人实际完成的工时或件数收费，而非卖整机。
    summary_en: Frontline operators in manufacturing, logistics and labs who need robots to move, assemble
      or process samples first record human hand motions, then let robots rehearse in simulation, and
      finally deploy the trained skills onto the physical Eno robot. The deliverable is on-site robotic
      task execution; delivery cadence and human review boundaries still need verification.
    inspiration_en: 'Trend: robotics firms are treating human-demonstration data plus simulation training
      as the way to mass-produce general physical skills, with capital backing full-stack builds. Entry:
      avoid general-purpose robots; start from one high-frequency, standardized workstation such as warehouse
      sorting or lab pipetting, and charge by completed robot hours or units rather than selling whole
      machines.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工厂、仓库和实验室的一线运营者需要让机器人完成搬运、装配、样品处理等重复物理任务，用人工示范动作采集数据，再在仿真中训练并部署到实体机器人上执行。
        job_en: Frontline operators in factories, warehouses and labs need robots to perform repetitive
          physical tasks such as moving, assembly and sample handling, capturing data from human demonstrations,
          training in simulation and deploying to physical robots.
        pain_zh: 制造业、物流和实验室的重复体力岗位长期缺人且招工成本高，传统工业机器人编程门槛高、换线慢，难以覆盖多品种小批量任务。
        pain_en: Repetitive manual roles in manufacturing, logistics and labs face persistent labor shortages
          and high hiring costs, while traditional industrial robots require heavy programming and slow
          line changes, struggling with high-mix low-volume tasks.
        current_alternative_zh: 雇佣临时工或操作员手工完成，或采购需专门集成的传统工业机器人并由工程师逐项编程示教。
        current_alternative_en: Hiring temporary workers or operators to do it by hand, or buying traditional
          industrial robots that require dedicated integration and engineer-by-engineer programming and
          teaching.
        usage_reason_zh: 推断：相较人工示教传统机器人，它用人类手部动作录制直接生成训练数据并在仿真中预演，减少现场反复调试和编程的步骤，因此多品种、换线频繁的工厂和实验室更可能选择它。
        usage_reason_en: 'Inference: versus manually teaching traditional robots, it turns recorded human
          hand motions directly into training data and rehearses in simulation, cutting repeated on-site
          debugging and programming, so factories and labs with frequent line changes are more likely
          to choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决制造、物流和实验室重复体力岗位缺人与传统机器人编程慢的痛点，任务与不采用的后果清晰。
        evidence_ids:
        - ev-cb43b3e08db96719
      - gate: consensus
        status: insufficient
        reason: 仅有融资与产品方向披露，未见客户部署、使用反馈或复购证据。
        evidence_ids:
        - ev-cb43b3e08db96719
      - gate: model
        status: insufficient
        reason: 买方为工厂、仓库和实验室，但定价、合同与交付方式未公开，属判断而非已验证事实。
        evidence_ids:
        - ev-cb43b3e08db96719
      - gate: truth
        status: insufficient
        reason: 全栈自建承诺可靠交付，但公开材料未给出实际运行时长、故障率或人工接管边界。
        evidence_ids:
        - ev-cb43b3e08db96719
      next_validation: 收集 Genesis AI 官方客户案例或部署文档，核实 Eno 在制造、物流或实验室场景的实际运行任务、交付周期与人工接管方式。
