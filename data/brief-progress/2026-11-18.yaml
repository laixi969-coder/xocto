        - ev-3b57c4008734eabb
      - gate: consensus
        status: insufficient
        reason: 仅列出将在会上分享的客户名单，未见这些客户的实际使用范围或采用规模。
        evidence_ids:
        - ev-3b57c4008734eabb
      - gate: model
        status: insufficient
        reason: 未披露定价与计费方式，买方可能是企业 IT 预算，但付费路径尚未公开。
        evidence_ids:
