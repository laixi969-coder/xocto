      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在多项目并行或把任务交给编码代理时，需要为每个项目准备带完整工具链的隔离环境，让代理或人能在其中安全写代码、跑命令。
        job_en: When running several projects or delegating to a coding agent, developers need an isolated
          per-project environment with the full toolchain where the agent or a person can safely write
          code and run commands.
        pain_zh: 本地环境依赖互相冲突、代理在共享机器上执行代码有风险、新成员或新代理上手要重复配置环境，这些步骤耗时且容易出错。
