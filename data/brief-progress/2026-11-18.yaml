      they install the webagent browser extension, which passes local files and computer operations to
      the web AI; the user ends up with modified files or executed actions and must verify the result.
      Which operations are supported, the permission boundary and the delivery format still need verification.
    inspiration_en: 'Trend: the bridge between web-based AI and local files or desktop actions is being
      filled in by the open-source community, showing that ''AI can only chat and cannot touch local material''
      is real friction. Entry: start with individual developers and small teams who handle local documents
      and code but do not want to migrate to a new client, beginning with auditable action logs and permission
      confirmation, then consider per-seat or private-deployment pricing; prices are undisclosed and this
      is inference.'
