      task goals, progress and open issues from the session record, creates subtasks and artifact entries,
      and supports handing the session off to the next round or a collaborator. Users get task cards they
      can continue from; extraction accuracy and the human confirmation step still need verification.
    inspiration_en: 'Trend: AI coding sessions are getting longer, and context hand-off between sessions
      is becoming the new friction point rather than code generation itself. Entry: target small teams
      using long-session coding tools, start at the hand-off step between sessions, and charge per seat
      or for private deployment; first confirm whether the extracted results are trustworthy.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 DeepSeek Harness 的开发者在一轮会话结束后，需要从会话记录中整理任务目标、进度与遗留问题，并交接给下一轮会话或协作者。
        job_en: Developers using DeepSeek Harness need to extract task goals, progress and open issues
          from a finished session and hand them off to the next session or a collaborator.
        pain_zh: 长会话结束后，目标、进度和未解决问题散落在对话里，下一轮要重新翻记录重建上下文，容易漏掉未完成事项。
