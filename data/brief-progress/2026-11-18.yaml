      - gate: consensus
        status: insufficient
        reason: 仅有仓库关注度持续上升，缺少用户评价或客户案例说明真实使用场景与满意度。
        evidence_ids:
        - ev-2eca8ab324f59748
      - gate: model
        status: insufficient
        reason: 开源项目，公开材料未说明定价、付费方或商业化路径，买方与收费方式不明。
        evidence_ids:
