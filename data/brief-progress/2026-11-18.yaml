    event_summary_en: After its release on 12 November 2026, the repository's stars rose from 171 to 515,
      with 45 open issues at the same time; beyond the repository's own description there are no customer
      cases, pricing or payment data.
    category: AI + 创作
    project_type: open_source
    industries:
    - 三维动画与游戏美术
    - 影视与广告制作
    industries_en:
    - 3D animation and game art
    - Film and advertising production
    jobs:
    - 三维美术师在接到场景搭建需求时，把文字简报交给插件，由它生成可审阅、可回退的 Blender 场景操作，再逐项确认后落地
    jobs_en:
    - A 3D artist receiving a scene-building brief hands the text brief to the add-on, which produces
      reviewable and reversible Blender scene operations that the artist confirms one by one
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 三维美术师在接到场景搭建简报时，打开 Blender 内的对话工作区，把文字需求交给插件，由它生成可审阅、可回退的场景操作，用户逐项确认后才执行，最终得到修改后的场景；具体交付质量与人工确认比例仍待核验。
    inspiration: 趋势：三维制作里“写需求—改场景”这一步开始被拆成可审阅、可回退的操作序列，而不是一次性生成成品。切入：从游戏美术外包和广告预演这类按镜头交付的小团队进入，卖按场景或按镜头计费的搭建服务，而不是卖插件席位；价格未披露，属推断。
    summary_en: When a 3D artist receives a scene-building brief, they open a chat workspace inside Blender
      and hand the text request to the add-on, which produces reviewable and reversible scene operations
      that run only after the user confirms each one, leaving a modified scene; delivery quality and the
      share of manual confirmation still need verification.
    inspiration_en: 'Trend: in 3D production, the step from written brief to changed scene is being broken
      into reviewable, reversible operations rather than one-shot generation. Entry: start with small
      game-art outsourcing and advertising previs teams that deliver per shot, selling scene- or shot-priced
      build services rather than add-on seats; pricing is undisclosed and this is an inference.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 三维美术师在接到场景搭建或修改简报时，处理文字需求与现有 Blender 工程，要完成可回退的场景改动并交付给下游。
        job_en: A 3D artist receiving a scene-building or revision brief works from text requirements
          and an existing Blender project to make reversible scene changes and hand them downstream.
        pain_zh: 文字简报转成 Blender 操作需要手工逐项建模、摆放和调参，重复且易错；改错后回退成本高。
        pain_en: Turning a text brief into Blender operations means manual modeling, placement and parameter
          tweaking, which is repetitive and error-prone, and undoing mistakes is costly.
        current_alternative_zh: 美术师自己手工操作 Blender，或使用通用对话模型给出步骤再由人照做，缺少可审阅、可回退的操作记录。
        current_alternative_en: Artists operate Blender by hand, or ask a general chat model for steps
          and follow them manually, without a reviewable, reversible operation log.
        usage_reason_zh: 推断：相较手工操作或照抄对话步骤，它把文字需求直接转成可逐项确认、可回退的场景操作，减少了从需求到改动的翻译与返工环节，因此接单量大的三维美术师会在赶镜头交付时选择它。
        usage_reason_en: 'Inference: compared with manual work or copying chat steps, it turns text requirements
          directly into confirmable, reversible scene operations, cutting the translation and rework between
          brief and change, so high-volume 3D artists would pick it when rushing shot deliveries.'
      gates:
      - gate: value
        status: supported
        reason: 它解决文字简报转 Blender 场景改动的手工翻译与返工问题，痛点具体，交付为可审阅可回退的操作序列。
        evidence_ids:
        - ev-ce1f5bca304e7e2d
      - gate: consensus
        status: insufficient
        reason: 仓库收藏数从 171 增至 515 只说明关注度，没有用户评价或客户案例说明谁在什么场景持续使用。
        evidence_ids:
        - ev-60842bc0982ab17a
        - ev-ce1f5bca304e7e2d
      - gate: model
        status: insufficient
        reason: 开源仓库未披露定价、付费路径或买方，钱可能来自工作室采购或服务收费，属判断而非已验证事实。
        evidence_ids:
        - ev-ce1f5bca304e7e2d
      - gate: truth
        status: insufficient
        reason: 45 个未关闭 issue 显示使用中有摩擦，但没有留存、复购或交付结果证据，无法确认长期留在工作流。
        evidence_ids:
        - ev-ce1f5bca304e7e2d
      next_validation: 收集该仓库 issue 与 discussion 中关于实际场景交付、回退操作和付费意愿的公开讨论。
  dsh-watch-together:
    slug: dsh-watch-together
    name: dsh-watch-together
    decision: watching
    category: AI + 创作
    project_type: open_source
    industries:
    - 视频内容创作
    - 在线教育
    industries_en:
    - video content creation
    - online education
    jobs:
    - 视频创作者或学习者独自观看长视频时，需要边看边理解分镜与台词，希望有人同步解说并即时答疑
    - 当观众在观看视频的过程中需要同步理解画面与台词时，由智能体按播放进度提供解说和答疑
    jobs_en:
    - Video creators or learners watching long videos alone need to understand storyboards and dialogue
      while watching, and want synchronized commentary and instant Q&A
    - When viewers need to understand visuals and dialogue while a video plays, an agent provides commentary
      and answers in sync with playback
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 观众在播放视频时打开这个插件，它会跟随真实播放位置，在每段结束前把分镜画面和带秒台词交给智能体；智能体在悬浮窗里出声回应，也能听到房间声音。用户拿到的是与播放进度同步的解说和对话，具体交付质量与人工确认环节仍待核验。
    inspiration: 趋势：视频消费正从单向播放转向与智能体同步的伴随式互动。切入：可从在线课程或影视解说入手，把按播放进度生成的分镜解说做成按课程或按集收费的交付，而非通用插件。
    summary_en: When a viewer plays a video, this plugin follows the real playback position and sends
      a storyboard image plus time-stamped subtitles to an agent before each segment ends; the agent replies
      aloud in a floating window and can also hear room audio. The user gets commentary and dialogue synchronized
      to playback; delivery quality and any human confirmation step remain unverified.
    inspiration_en: 'Trend: video consumption is shifting from one-way playback toward synchronized companion
      interaction with an agent. Entry: start with online courses or film commentary, selling per-course
      or per-episode storyboard commentary rather than a generic plugin.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 观众独自观看长视频时，需要一边看画面一边理解分镜和台词，希望有智能体按播放进度同步解说并即时答疑。
        job_en: A viewer watching a long video alone needs to understand storyboards and dialogue while
          watching, and wants an agent to comment and answer questions in sync with playback.
        pain_zh: 独自看长视频时，遇到难懂的分镜或台词只能暂停、回看或另开搜索，理解被打断；缺少同步的解说与答疑。
        pain_en: Watching long videos alone, a viewer facing confusing shots or dialogue must pause, rewind,
          or open a separate search, breaking comprehension; synchronized commentary and Q&A are missing.
        current_alternative_zh: 旧做法是暂停后自行搜索、看弹幕或评论区、或事后找解说视频，无法与播放进度同步。
        current_alternative_en: The old way is to pause and search, read bullet comments or the comment
          section, or find a commentary video afterward, none synchronized with playback.
        usage_reason_zh: 推断：相较暂停后另行搜索，该插件在每段结束前自动把分镜画面和带秒台词交给智能体，省去用户手动截取和描述画面的步骤，因此独自看课程或影视的观众可能选择它。
        usage_reason_en: 'Inference: compared with pausing to search separately, the plugin automatically
          sends the storyboard image and time-stamped subtitles to the agent before each segment ends,
          removing the manual step of capturing and describing frames, so solo course or film viewers
          may choose it.'
      gates:
      - gate: value
        status: supported
        reason: 它解决独自看长视频时理解分镜与台词被打断的问题，旧做法是暂停搜索或事后找解说，结构上成立，属工作流推理。
        evidence_ids:
        - ev-9a431d4ff3290fda
      - gate: consensus
        status: insufficient
        reason: 仅有开源仓库星数缓慢增长，缺少用户评价或使用场景反馈，无法判断是否形成共识。
        evidence_ids:
        - ev-9a431d4ff3290fda
      - gate: model
        status: insufficient
        reason: 开源插件未披露定价或付费路径，买方与收费方式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-9a431d4ff3290fda
      - gate: truth
        status: insufficient
        reason: 同步解说能否确定性交付、听房间声音的隐私边界如何，公开材料未说明，需进一步核验。
        evidence_ids:
        - ev-9a431d4ff3290fda
      next_validation: 收集该仓库的 issue、discussion 或 README 中的使用示例与部署说明，核验同步解说能否稳定交付及隐私处理方式。
