      the exact delivery form and human confirmation step still need verification.'
    inspiration_en: 'Trend: phone-side agents now need a non-intrusive execution environment, showing
      mobile automation moving from demos to everyday parallel use. Entry: start with developers and small
      teams building Android automation scripts and agents, offering background execution as a metered
      call; e-commerce ops or support roles that batch-operate phone apps are a possible second segment,
      though payer and pricing are undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: Android 自动化开发者或重度用户在手机上让 AI 代理操作其他应用时，需要代理在后台完成点击、填写等操作，同时自己继续使用手机前台。
        job_en: Android automation developers or power users let an AI agent operate other apps on their
          phone, needing the agent to complete taps and form-filling in the background while they keep
          using the foreground.
        pain_zh: 代理直接占用前台屏幕时，用户无法同时用手机，操作被打断；没有 root 权限时又难以隔离出一块可操作的显示区域。
        pain_en: When an agent takes over the foreground screen, the user cannot use the phone at the
          same time and work is interrupted; without root it is hard to isolate an operable display area.
        current_alternative_zh: 旧做法是让代理占用真机前台、用另一台设备或模拟器跑脚本，或依赖 root 权限做自动化。
        current_alternative_en: The old approach is to let the agent occupy the real foreground, run scripts
          on a second device or emulator, or rely on root for automation.
        usage_reason_zh: 它通过 Shizuku 在无 root 情况下创建一块后台虚拟屏，让代理的点击与填写不占用用户前台，从而省去另备设备或中断自己用手机这一步；推断做 Android
          自动化与代理的开发者会因此选择它。
        usage_reason_en: It creates a background virtual screen via Shizuku without root, so the agent's
          taps and form-filling do not occupy the user's foreground, removing the need for a second device
          or interrupting phone use; by inference, Android automation and agent developers would choose
          it for this.
      gates:
      - gate: value
        status: supported
        reason: 它解决代理操作手机时抢占前台、无 root 难隔离显示区的问题，旧做法是另备设备或模拟器，痛点具体。
