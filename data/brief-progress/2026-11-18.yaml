    inspiration: 趋势：长篇文学翻译开始被当作可拆成章节流水线的AI任务，而不是一次性整本丢给模型。切入：面向出版社或独立译者做“术语表+风格约束+逐章校订记录”的长篇译稿工作台，按书或按章交付，而不是卖通用翻译额度；该仓库本身尚未展示这套流程。
    summary_en: Literature enthusiasts or translators working on a long stream-of-consciousness classic
      such as In Search of Lost Time may open this open-source project to have AI produce Chinese translations
      chapter by chapter; the repository only states the translation theme, and the input method, terminology
      and style consistency handling, human review step and final deliverable format remain unverified.
    inspiration_en: 'Trend: long-form literary translation is starting to be treated as a chapter-level
      AI pipeline rather than one whole book handed to a model. Entry: build a long-manuscript workbench
      for publishers or independent translators with glossary, style constraints and per-chapter revision
      logs, sold per book or per chapter rather than as generic translation credits; this repository does
      not yet show that workflow.'
    req_initial:
