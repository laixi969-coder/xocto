        reason: 它解决频道运营者选题与竞品调研中人工翻榜单、读评论耗时且易漏信号的问题，旧流程明确，结构上成立。
        evidence_ids:
        - ev-578e8c5fff957363
      - gate: consensus
        status: insufficient
        reason: 仓库星标两周从51增至115，说明开发者关注度上升，但没有频道运营者的采用或评价证据。
        evidence_ids:
        - ev-78cb1194bf71dbf1
        - ev-578e8c5fff957363
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价、付费路径或买方，开源技能包本身如何变现不明，这是判断不是已验证事实。
        evidence_ids:
        - ev-78cb1194bf71dbf1
      - gate: truth
        status: insufficient
        reason: 未核验其数据来源、输出准确性与人工复核边界，代理生成的选题和赞助线索能否确定性交付仍缺证据。
        evidence_ids:
        - ev-578e8c5fff957363
      next_validation: 收集该仓库的 issue、discussion 或官方文档，核验其数据来源、输出示例与是否有人报告实际用于频道选题。
