      OpenRouter 数据称，2026年2月6日平台上 Agent 的 Token 用量首次超过人类直接调用，到9月底约为后者的七倍，并引用一项覆盖8款模型、500个真实代码问题的研究，称单次问题平均累计消耗约417万
      Token、模型调用费约1.86美元。
    event_summary_en: On 17 November 2026, public reporting published a hands-on report on Tencent Hy4
      flash, framing it as a fast and inexpensive model and arguing that model competition is shifting
      from one-off capability records toward call cost and latency in long agent tasks; the report cites
      OpenRouter data that agent token usage on the platform first exceeded direct human calls on 6 February
      2026 and reached about seven times that level by end-September, and cites a study of 8 models and
      500 real coding problems finding an average of about 4.17 million tokens and roughly $1.86 in model
      fees per problem attempt.
