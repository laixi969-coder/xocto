          campaign uses a CLI or AI agent to audit and fix the NAS, obtaining a checkable inspection and
          remediation result.
        pain_zh: 勒索软件已针对 NAS 这类存储设备，普通用户和小企业没有专职安全人员，手工逐项排查 DSM 配置既慢又容易漏，处置不及时会丢数据。
        pain_en: Ransomware now targets storage devices like NAS; ordinary users and small firms lack
          dedicated security staff, manual DSM configuration checks are slow and error-prone, and delayed
          response risks data loss.
        current_alternative_zh: 靠群晖官方公告和论坛帖子手工逐条核对设置，或请外部运维远程排查；过程依赖个人经验，缺少统一的一次性审计脚本。
        current_alternative_en: Manually checking settings against Synology advisories and forum posts,
