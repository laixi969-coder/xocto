  boubou-2:
    slug: boubou-2
    name: boubou
    decision: watching
    category: 基础层
    project_type: open_source
    industries: []
    industries_en: []
    jobs:
    - 开发者在本地设备上部署语音 AI 时，用一条命令把开源语音模型装到目标设备并跑起来
    - 开发者需要在离线或隐私敏感环境中运行语音识别与合成，而不把音频上传到云端
    jobs_en:
    - Developers deploying voice AI on local devices use a single command to install open-source voice
      models onto the target device and run them
    - Developers need speech recognition and synthesis in offline or privacy-sensitive environments without
      uploading audio to the cloud
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在本地设备上要跑语音 AI 时，打开 boubou，用一条命令把开源语音模型装到目标设备并启动；用户拿到的是本地可运行的语音能力，具体支持哪些语音任务、交付形态与人工确认环节仍待核验。
    inspiration: 趋势：语音模型开源化让“本地跑语音”从大厂云服务下沉到单机部署，隐私与离线场景开始有替代云 API 的选项。切入：从对音频出域敏感的行业（医疗问诊记录、法律取证、客服质检）进入，卖部署与运维而非模型本身；具体价格未披露。
    summary_en: When developers need to run voice AI on a local device, they open boubou and use one command
      to install open-source voice models onto the target device and start them; what they get is locally
      runnable voice capability, while the supported voice tasks, delivery form and human confirmation
      steps still need verification.
    inspiration_en: 'Trend: open-source voice models are pushing local voice deployment from big-cloud
      services down to single-machine installs, giving privacy- and offline-sensitive settings an alternative
      to cloud APIs. Entry: start with sectors where audio cannot leave the premises (clinical notes,
      legal evidence, call-center QA) and sell deployment and operations rather than the model; pricing
      is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在本地设备上部署语音能力时，用一条命令把开源语音模型装到目标设备并跑起来，替代自行拼装推理环境。
        job_en: When deploying voice capability on local devices, developers use one command to install
          open-source voice models onto the target device and run them, replacing hand-assembled inference
          environments.
        pain_zh: 本地跑语音模型要处理依赖、模型权重与设备适配，门槛高；音频上传云端又有隐私与合规顾虑。
        pain_en: Running voice models locally means handling dependencies, model weights and device compatibility,
          which is hard; uploading audio to the cloud raises privacy and compliance concerns.
        current_alternative_zh: 调用云端语音 API，或自行搭建推理环境并逐个适配设备。
        current_alternative_en: Calling cloud speech APIs, or building inference environments by hand
          and adapting each device.
        usage_reason_zh: 推断：相较云 API，它把安装与启动收敛为一条命令，减少环境搭建这一步；对音频不能出域的团队，本地运行本身是可核对的结果改善。是否长期留在工作流缺少留存证据。
        usage_reason_en: 'Inference: versus cloud APIs, it collapses install and launch into one command,
          removing the environment-setup step; for teams whose audio cannot leave the premises, local
          execution is itself a checkable outcome improvement. Whether it stays in workflows lacks retention
          evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决本地部署语音模型的环境搭建与隐私出域问题，痛点具体，旧做法是云 API 或手工搭环境。
        evidence_ids:
        - ev-9c385817a92aed72
        - ev-35ecb653026ea3d9
      - gate: consensus
        status: insufficient
        reason: 仓库星标从 89 缓慢增至 96，属关注度而非采用；缺少用户反馈或案例说明谁在什么场景使用。
        evidence_ids:
        - ev-9c385817a92aed72
        - ev-35ecb653026ea3d9
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、托管服务或企业部署收费路径，买方与付费方式未披露。
        evidence_ids:
        - ev-35ecb653026ea3d9
      - gate: truth
        status: insufficient
        reason: 一条命令部署能否在异构设备上确定性交付、支持哪些语音任务，公开材料未说明。
        evidence_ids:
        - ev-9c385817a92aed72
      next_validation: 收集 boubou 官方文档或仓库 README 中列出的支持设备、语音任务与部署方式，确认一条命令的实际交付边界。
