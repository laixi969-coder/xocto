      lessons across six models (including Claude, Gemini and DeepSeek) and blind-reviewed 64 boards;
      repository stars rose from 63 to 222.
    category: AI + 创作
    project_type: open_source
    industries:
    - 教育
    - 在线学习
    industries_en:
    - Education
    - Online Learning
    jobs:
    - 教师或自学者在准备讲解材料时，把知识点交给模型，让它逐笔画出板书式讲解，再人工核对内容是否准确
    jobs_en:
    - Teachers or self-learners preparing explanatory material hand a topic to the model, which draws
      a whiteboard-style walkthrough stroke by stroke, then check the content for accuracy
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 教师或自学者在准备讲解材料时，把知识点交给它，模型逐笔画出白板式讲解并支持回放；用户拿到一段可播放的板书课程，内容准确性仍需人工核对。具体学科覆盖与交付形态仍待核验。
    inspiration: 趋势：把“讲课”这种连续动作拆成可逐笔生成、可盲评的板书，说明教学内容正在从文字答案转向可回放的讲解过程。切入：从需要大量重复讲解的学科辅导或企业内训入手，卖按课程或按班级交付的板书讲解，而不是卖通用生成工具；价格未披露。
    summary_en: When preparing explanatory material, a teacher or self-learner hands a topic to the tool,
      and the model draws a whiteboard-style walkthrough stroke by stroke with playback; the user gets
      a playable board lesson whose accuracy still needs human checking. Subject coverage and delivery
      format remain to be verified.
    inspiration_en: 'Trend: turning lecturing into a stroke-by-stroke, blind-reviewable artifact shows
      teaching content moving from text answers to replayable explanation. Entry: start with tutoring
      or corporate training that repeats the same explanations, selling board lessons per course or per
      class rather than a generic generator; pricing is undisclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 教师或自学者在准备讲解材料时，把知识点交给模型，让它逐笔画出板书式讲解，再人工核对内容是否准确。
        job_en: Teachers or self-learners preparing explanatory material hand a topic to the model, which
          draws a whiteboard-style walkthrough stroke by stroke, then check the content for accuracy.
        pain_zh: 讲解需要把推理过程一步步写出来，手写板书耗时且难以复用；纯文字答案又缺少过程感。
        pain_en: Explaining requires writing out reasoning step by step; hand-drawn boards are slow and
          hard to reuse, while plain text answers lack the sense of process.
        current_alternative_zh: 教师手写板书或录制讲解视频，自学者看教材和视频，过程慢且难以按需生成。
        current_alternative_en: Teachers hand-draw boards or record explanation videos; self-learners
          read textbooks and watch videos, which is slow and not generated on demand.
        usage_reason_zh: 推断：相较手写板书，它把知识点直接转成逐笔可回放的板书，省去从零绘制这一步，因此需要反复讲解同一内容的教师或辅导者会在备课时选择它；内容准确性仍需人工确认。
        usage_reason_en: 'Inference: versus hand-drawing, it converts a topic directly into a replayable
          stroke-by-stroke board, removing the from-scratch drawing step, so teachers or tutors repeating
          the same content would choose it when preparing lessons; accuracy still needs human confirmation.'
      gates:
      - gate: value
        status: supported
        reason: 它解决讲解过程难以低成本生成的问题，痛点是把推理一步步写出来耗时；旧做法是手写板书或录视频。
        evidence_ids:
        - ev-8c4d1f2b30cdf627
      - gate: consensus
        status: insufficient
        reason: 仓库收藏数从 63 增至 222 只说明关注度，缺少教学者实际采用或重复使用的证据。
        evidence_ids:
        - ev-e52a76348bfe103d
        - ev-8c4d1f2b30cdf627
      - gate: model
        status: insufficient
        reason: 公开材料未说明谁付费、按什么计价，开源项目可能靠捐赠或后续服务，属判断而非已验证事实。
        evidence_ids:
        - ev-8c4d1f2b30cdf627
      - gate: truth
        status: insufficient
        reason: 板书内容准确性依赖模型，材料未说明人工校对与错误纠正机制，交付确定性待核验。
        evidence_ids:
        - ev-d53f7001cd0c8f93
      next_validation: 收集该仓库的 issue 与 discussion，查看是否有教师报告实际用于备课及内容纠错流程。
