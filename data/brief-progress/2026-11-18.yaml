        usage_reason_zh: 推断：插件自动从会话中抽取目标、进度和问题并生成任务卡片，省去用户手动整理交接笔记这一步，因此频繁使用长会话编码的开发者会在会话切换时选择它；尚无用户反馈或留存证据支持长期使用。
        usage_reason_en: 'Inference: the plugin automatically extracts goals, progress and issues from
