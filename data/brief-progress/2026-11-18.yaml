    summary_zh: 英伟达临时 CEO 于 2026 年 11 月表示公司将停止向中国销售芯片，此前创始人兼 CEO 黄仁勋离任。这一市场退出将改变 AI 算力供给的地域格局：中国 AI 应用方需转向其他芯片来源，可能推高采购与迁移成本；同时英伟达让出的份额为其他供应商创造竞争空间（推断）。
    summary_en: 'Nvidia''s interim CEO said in November 2026 that the company is done selling chips to
      China, following the departure of founder and CEO Jensen Huang. The exit reshapes the geography
      of AI compute supply: Chinese AI adopters must turn to other chip sources, likely raising procurement
      and migration costs, while the share Nvidia vacates opens competitive room for other suppliers (inference).'
    event_summary_zh: 英伟达临时 CEO 表示公司已停止向中国销售芯片，此前创始人兼 CEO 黄仁勋离任。
    event_summary_en: Nvidia's interim CEO said the company is done selling chips to China, after founder
      and CEO Jensen Huang's departure.
