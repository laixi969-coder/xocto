        status: insufficient
        reason: 仅有产品页一句描述，无用户评价、采用或社区讨论证据，无法判断共识是否形成。
        evidence_ids:
        - ev-e06ffbab33248749
      - gate: model
        status: insufficient
        reason: 未披露定价、开源许可与付费路径，买方与收费方式不明，这是判断而非已验证事实。
        evidence_ids:
        - ev-e06ffbab33248749
      - gate: truth
        status: insufficient
        reason: 无法确认模拟覆盖哪些 AWS 服务、与官方工具差异及确定性交付，需核验实际可用范围。
        evidence_ids:
        - ev-e06ffbab33248749
