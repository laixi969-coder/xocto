        job_en: Developers need to pick and integrate an email API when a coding agent implements signup
          or notification emails, and ensure messages are delivered after domain setup.
        pain_zh: 邮件接入涉及域名验证、送达率和 API 细节，开发者不愿逐个比较供应商；代理给出的首个推荐往往直接进入代码，后续更换成本高。
        pain_en: Email integration involves domain verification, deliverability and API details, and developers
          dislike comparing vendors one by one; the agent's first recommendation often lands in code,
          making later switching costly.
        current_alternative_zh: 开发者过去自行搜索文档、比较 SendGrid 等老牌服务，或沿用公司已有供应商，再手工接入。
        current_alternative_en: Developers previously searched docs themselves, compared incumbents such
          as SendGrid, or reused the company's existing vendor and integrated manually.
        usage_reason_zh: 推断：Resend 通过面向代理优化的文档与示例，让编码代理在生成接入代码时直接给出可用实现，减少开发者逐个比较和试错配置的步骤，因此会在代理主导选型的场景被采用。
        usage_reason_en: 'Inference: through agent-optimized docs and examples, Resend lets coding agents
          produce a working integration directly, cutting the compare-and-trial configuration steps, so
          it gets adopted where agents drive vendor selection.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者接入邮件 API 时选型与配置的负担，旧流程是自行比较供应商并手工接入，痛点具体且交付可核对。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: consensus
        status: insufficient
        reason: 仅有代理推荐分布的单一研究转述，缺少开发者实际采用与持续使用的公开数据。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价与付费客户，买方可能是开发者或企业，属判断而非已验证事实。
        evidence_ids:
        - ev-9b623a318120e7c8
      - gate: truth
        status: supported
        reason: 邮件发送是确定性交付，代理推荐进入代码后仍需人工确认域名与权限，边界清楚。
        evidence_ids:
        - ev-72a9f3a6d5d0515f
      next_validation: 收集 Resend 官方定价页与公开客户案例，核验付费方式与客户采用情况。
