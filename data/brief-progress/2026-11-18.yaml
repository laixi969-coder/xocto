        reason: 仅见仓库星标从 117 到 126，属关注度信号，没有用户评价、案例或重复使用证据说明开发者已把它放进工作流。
        evidence_ids:
        - ev-f859e161f621eced
        - ev-8985f303efc1ce0c
      - gate: model
        status: insufficient
        reason: 开源插件，未见定价、付费路径或企业部署方式，买方可能是个人开发者或团队，属判断而非已验证事实。
        evidence_ids:
        - ev-f859e161f621eced
      - gate: truth
        status: insufficient
        reason: 从会话自动提取任务目标与问题的准确度、人工确认边界均未披露，交付是否确定仍缺实测材料。
        evidence_ids:
        - ev-f859e161f621eced
        - ev-8985f303efc1ce0c
