          connect real-time voice and face tracking, and route the character into OBS for a live broadcast.
        pain_zh: 过去做一场虚拟主播直播要把人格设定、语音、面部追踪和推流分别用不同工具拼起来，切换和调试成本高，角色还容易失忆、互动断裂。
