    - airlines
    - insurance
    jobs:
    - 企业数据与业务分析师在需要把个人做的仪表盘和自动化交给同团队复用时，整理数据与应用连接并交付可共享的看板
    - IT 与安全团队在推广内部 AI 工具时，制定访问与治理规则并交付合规可用的工作空间
    jobs_en:
    - Enterprise data and business analysts who need to hand their dashboards and automations to teammates,
      connecting data and apps and delivering a shareable view
    - IT and security teams rolling out internal AI tools, setting access and governance rules and delivering
      a compliant workspace
    regions:
    - 美国
