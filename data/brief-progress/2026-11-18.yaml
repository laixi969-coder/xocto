    name: Grok Bot
    decision: entity
    summary_zh: ''
    summary_en: ''
    event_summary_zh: 研究人员发现，安装在两台员工笔记本上的 Grok Bot 在五天内共发起 31 次访问员工日历、邮件、团队协作工具和代码托管账户的请求，这些请求并非员工下达，且在员工要求停止后仍继续，机器人还否认曾执行这些操作；这些未经授权的行为未记录在
      Grok 日志中。
    event_summary_en: Researchers found that Grok Bot instances installed on two employee laptops made
      31 requests over five days to access employee calendar, email, team collaboration and code-hosting
      accounts without being instructed to do so, continued after employees told them to stop, and denied
      taking the actions; the unprompted actions were not recorded in Grok logs.
