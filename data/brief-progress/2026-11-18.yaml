    - 研究人员在写文献综述时，让会话内的助手检索论文、保留出处并把笔记线索交给同会话其他插件
    - 研究生在整理课题资料时，把检索到的论文经审批导入个人文献库
    jobs_en:
    - Researchers writing a literature review ask the in-session assistant to search papers, keep citations,
      and hand note leads to other plugins in the same session
    - Graduate students organizing project material approve and import retrieved papers into a personal
      library
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 面向使用 DeepSeek Harness 的研究人员：在写文献综述或整理课题资料时，插件接收检索请求，搜索论文并附出处，经用户审批后导入文献库，再把笔记线索交给同会话其他插件。用户拿到的是带引用的检索结果和已入库条目；具体检索源、审批界面与交付形态仍待核验。
    inspiration: 趋势：科研检索正从独立文献管理软件挪进对话式工作会话，出处与审批成为可拆分的环节。切入：从高校课题组和独立研究者的文献综述环节进入，卖点不是再做一个文献库，而是把检索、核出处、入库、交接给下一步串成一次会话内动作；可考虑按课题组订阅，但价格未披露。
    summary_en: 'For researchers using DeepSeek Harness: while drafting a literature review or organizing
      project material, the plugin takes a search request, finds papers with citations, imports approved
      items into a library, and hands note leads to other plugins in the same session. Users get cited
      search results and imported entries; the actual sources, approval UI and delivery format still need
      verification.'
    inspiration_en: 'Trend: literature search is moving from standalone reference managers into conversational
      work sessions, with citations and approval becoming separable steps. Entry: start with literature-review
      work in university labs and independent researchers; the pitch is not another reference library
      but chaining search, citation checking, import and hand-off into one in-session action. Lab subscriptions
      are conceivable, but no pricing is disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 研究人员在写文献综述时，让会话内的助手检索论文、核对出处，并把已确认的条目和笔记线索交给同会话的下一步工作。
        job_en: While writing a literature review, a researcher asks the in-session assistant to find
          papers, check citations, and pass confirmed entries and note leads to the next step in the same
          session.
        pain_zh: 文献检索、出处核对和入库分散在搜索引擎、文献管理器和笔记工具之间，手工搬运容易丢引用或重复录入。
        pain_en: Search, citation checking and library import are split across search engines, reference
          managers and note tools; manual transfer loses citations or duplicates entries.
        current_alternative_zh: 研究者通常在 Google Scholar 等检索入口找论文，再手工导入 Zotero 等文献管理器并另记笔记。
        current_alternative_en: Researchers typically find papers via search engines such as Google Scholar,
          then manually import them into reference managers like Zotero and keep notes separately.
        usage_reason_zh: 推断：插件把检索、带出处返回和审批入库放在同一会话里，省去在检索页、文献管理器和笔记之间复制粘贴与重新核对引用的步骤，因此常写综述、需要可追溯出处的研究者会在会话内直接调用它。
        usage_reason_en: 'Inference: by putting search, cited results and approved import in one session,
          the plugin removes copy-paste and re-checking of citations across search pages, reference managers
          and notes, so researchers who write reviews and need traceable sources would invoke it in-session.'
      gates:
      - gate: value
        status: supported
        reason: 它解决文献检索、出处核对与入库分散的问题，痛点是引用易丢、重复录入；旧流程可还原为检索页加文献管理器加笔记，属工作流推理。
        evidence_ids:
        - ev-05e4e0e98e4f143c
        - ev-4a9b3fe9894b990c
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或课题组采用记录，无法判断是否形成稳定使用共识。
        evidence_ids:
        - ev-05e4e0e98e4f143c
        - ev-0be511c8a7171357
      - gate: model
        status: insufficient
        reason: 未披露定价、付费路径或买方；开源插件可能靠宿主平台或课题组订阅变现，这是判断而非已验证事实。
        evidence_ids:
        - ev-05e4e0e98e4f143c
      - gate: truth
        status: insufficient
        reason: 检索源、审批界面与出处准确性均未核验，交付能否确定性发生尚不清楚。
        evidence_ids:
        - ev-05e4e0e98e4f143c
        - ev-32fb2299b29e19c0
      next_validation: 收集该仓库的 README 与 issue/discussion，核验检索源、审批入库流程与出处准确性说明。
    event_summary_zh: 2026-10-30 发布的开源插件 agentero-dsh-plugin 面向 DeepSeek Harness，提供论文检索、带出处返回、审批入库与笔记线索交接；截至
      2026-11-18 仓库星数约 232，期间缓慢增长。
    event_summary_en: The open-source plugin agentero-dsh-plugin, published 2026-10-30 for DeepSeek Harness,
      offers paper search with citations, approved imports and note hand-off; by 2026-11-18 the repository
      had about 232 stars, growing slowly over the period.
  agentes-chat:
    slug: agentes-chat
    name: agentes-chat
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件与信息技术服务
    industries_en:
    - Software and IT services
    jobs:
    - 工程团队在自托管协作频道里让 AI 代理执行带工具与审批的任务
    jobs_en:
    - Engineering teams running AI-agent tasks with tools and approvals inside self-hosted collaboration
      channels
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 工程团队在自托管的 Slack 式频道和私信里，把 Claude、ChatGPT/Codex、Gemini 或 Grok 驱动的代理拉进对话，代理可调用 MCP 工具、使用自己的电脑与浏览器、按例程和记忆执行任务，并需人工审批。用户最终拿到频道内的任务执行结果与审批记录；具体交付形态和部署后的实际工作流仍待核验。
    inspiration: 趋势：团队协作界面正在从“人聊人”变成“人聊人+代理干活”，代理被放进已有频道而非另开工具。切入：从需要数据不出内网、又要代理执行多步操作的研发或运维团队进入，卖自托管部署与审批审计，而不是卖模型调用。
    summary_en: Engineering teams pull Claude-, ChatGPT/Codex-, Gemini- or Grok-powered agents into self-hosted
      Slack-style channels and DMs; agents can call MCP tools, use their own computer and browser, run
      routines with memory, and require human approvals. Users get task results and approval records inside
      the channel; the exact delivery form and post-deployment workflow still need verification.
    inspiration_en: 'Trend: team collaboration is shifting from people-to-people chat to people plus agents
      working in the same channels. Entry: target R&D or ops teams that need data kept on-prem yet want
      agents to execute multi-step tasks, selling self-hosted deployment plus approval audit rather than
      model access.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 工程团队在自托管频道里，把需要多步操作和外部工具的任务交给 AI 代理，并在执行前后由人审批。
        job_en: Engineering teams hand multi-step tasks requiring external tools to AI agents inside self-hosted
          channels, with human approval before and after execution.
        pain_zh: 代理执行任务时散落在多个工具和聊天窗口，缺少统一的对话上下文、工具权限与审批记录，团队难以追踪谁批准了什么。
        pain_en: Agent task execution is scattered across tools and chat windows, lacking unified conversation
          context, tool permissions and approval records, so teams struggle to trace who approved what.
        current_alternative_zh: 团队通常用公有云 Slack 加独立代理工具拼接，或让成员各自在浏览器里手动跑代理，审批靠口头或零散消息。
        current_alternative_en: Teams typically stitch public-cloud Slack with separate agent tools, or
          have members run agents manually in browsers, with approvals handled verbally or in scattered
          messages.
        usage_reason_zh: 推断：相较拼接公有云聊天与独立代理工具，它把代理、MCP 工具、浏览器操作和审批放进同一个自托管频道，减少在多个界面间搬运上下文和另行记录审批的步骤，因此重视数据留在内网且需要可追溯审批的团队会在多步代理任务场景选择它。
        usage_reason_en: 'Inference: compared with stitching public-cloud chat and separate agent tools,
          it puts agents, MCP tools, browser actions and approvals into one self-hosted channel, cutting
          the step of moving context between interfaces and logging approvals separately, so teams that
          keep data on-prem and need traceable approvals would choose it for multi-step agent tasks.'
      gates:
      - gate: value
        status: supported
        reason: 它解决团队让代理执行多步任务时上下文、工具权限与审批分散的问题，痛点具体；但实际交付是否稳定仍缺用户反馈。
        evidence_ids:
        - ev-2a6cae479f013d3e
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数增长，属于关注度信号，缺少团队实际采用或重复使用的公开证据。
        evidence_ids:
        - ev-45dbb5c54903b0d4
        - ev-2a6cae479f013d3e
      - gate: model
        status: insufficient
        reason: 开源自托管，付费路径未披露；可能来自企业部署与支持，但这是判断而非已验证事实。
        evidence_ids:
        - ev-2a6cae479f013d3e
      - gate: truth
        status: insufficient
        reason: 代理带浏览器与工具执行存在安全与人工边界问题，审批机制是加分项，但缺少部署案例与失败处理材料。
        evidence_ids:
        - ev-2a6cae479f013d3e
      next_validation: 收集该仓库的部署文档与 issue/discussion 中关于实际团队使用、审批流程与安全边界的公开记录。
    event_summary_zh: 2026 年 11 月上旬起，agentes-chat 以 AGPL-3.0 开源发布自托管 Slack 替代品，支持多模型代理、MCP 工具、浏览器与审批；仓库星数从
      11 月 12 日的 320 增至 11 月 18 日的 1690。
    event_summary_en: From early November 2026, agentes-chat released an AGPL-3.0 open-source self-hosted
      Slack alternative supporting multi-model agents, MCP tools, a browser and approvals; repository
      stars rose from 320 on Nov 12 to 1,690 on Nov 18.
