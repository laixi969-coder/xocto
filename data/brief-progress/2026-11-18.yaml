  google-makes-it-easier-to-use-gemini-without-training-ai-on:
    slug: google-makes-it-easier-to-use-gemini-without-training-ai-on
    name: Gemini
    decision: market_context
    event_summary_zh: 2026年11月17日，Google 在 Gemini 应用中开始推送把聊天历史与模型训练分开的设置：用户可单独关闭训练用途而保留历史记录；此前只能通过关闭历史来退出训练。
    event_summary_en: On November 17, 2026, Google began rolling out separate settings in the Gemini app
      that decouple chat history from model training, letting users opt out of training while keeping
      their history; previously the only way to opt out was to turn history off.
    summary_zh: 这是 Google 对 Gemini 数据使用与隐私控制方式的调整，属于平台政策变化，而非新的独立产品。它影响用户对聊天数据被用于训练的取舍，但不改变 Gemini 作为通用助手的产品形态。
    summary_en: This is a change to how Google governs data use and privacy controls in Gemini, a platform
      policy shift rather than a new standalone product. It changes the trade-off users face over chat
      data being used for training but does not alter Gemini's form as a general assistant.
    inspiration: 隐私控制与训练数据分离正在成为通用助手的竞争维度：对创业者而言，可关注面向合规敏感行业（法律、医疗、金融）的对话工具，把“数据不被用于训练”做成可核验的默认交付，而不是附加开关。
    inspiration_en: 'Separating privacy controls from training data is becoming a competitive dimension
      for general assistants: founders could target compliance-sensitive sectors (legal, medical, finance)
      with chat tools that make ''data not used for training'' a verifiable default rather than an optional
      toggle.'
  google-to-keep-gemini-chats-for-2-months-up-from-72-hours-ev:
    slug: google-to-keep-gemini-chats-for-2-months-up-from-72-hours-ev
    name: Gemini
    decision: market_context
    event_summary_zh: 2026年11月17日，Google 宣布将 Gemini 聊天记录的保留期从 72 小时延长至两个月，即使关闭历史记录也适用，并将在未来数周全球推送。
    event_summary_en: On November 17, 2026, Google said it will extend Gemini chat retention from 72 hours
      to two months, applying even when history is off, rolling out globally over the coming weeks.
    summary_zh: 这是 Google 对 Gemini 聊天数据保留期限的政策调整，属于平台规则变化，不是独立产品。它延长了用户对话在 Google 侧的留存时间，对数据敏感用户的使用选择构成影响。
    summary_en: This is a policy change to Gemini's chat data retention period, a platform rule shift
      rather than a standalone product. It lengthens how long user conversations persist on Google's side,
      affecting choices for data-sensitive users.
    inspiration: 数据留存期限成为通用助手的信任变量：面向对留存敏感的企业客户，可考虑提供可核验的短留存或本地化对话方案，把留存策略写进交付承诺而非隐私条款。
    inspiration_en: 'Retention periods are becoming a trust variable for general assistants: for retention-sensitive
      enterprise buyers, founders could offer verifiable short-retention or localized conversation options,
      writing retention policy into delivery commitments rather than privacy terms.'
