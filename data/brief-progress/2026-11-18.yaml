  how-arisglobal-scaled-generative-ai-inference-on-amazon-bedr:
    slug: how-arisglobal-scaled-generative-ai-inference-on-amazon-bedr
    name: ArisGlobal LifeSphere NavaX
    decision: queued
    event_summary_zh: 2026年11月17日，ArisGlobal 公开其在 Amazon Bedrock 上运行生命科学 AI 引擎 NavaX 的推理成本实践：随着企业客户增加不同合规要求，共享提示前缀在六个月内增长约150%，单例推理成本上升超过200%；其将缓存对象从源文档改为共享前缀后，降低了有效输入成本，并可在不按比例增加成本的情况下支持更多租户。
    event_summary_en: 'On November 17, 2026, ArisGlobal disclosed how it runs its life-sciences AI engine
      NavaX on Amazon Bedrock: as enterprise customers added distinct compliance requirements, the shared
      prompt prefix grew about 150% over six months and per-case inference cost rose more than 200%; by
      caching the shared prefix instead of each source document, it reduced effective input cost and can
      support more tenants without proportional cost growth.'
    category: AI + 商业
    project_type: ai_transformation
    industries:
    - 制药与生命科学
    - 药物警戒与法规事务
    industries_en:
    - Pharmaceuticals and life sciences
    - Pharmacovigilance and regulatory affairs
    jobs:
    - 药物警戒专员在收到新不良反应报告时，把病例材料交给系统抽取并整理成合规病例，再人工复核提交
    - 法规事务团队在新增合规要求时，用同一引擎处理多租户病例材料并核对输出
    jobs_en:
    - Pharmacovigilance specialists submit adverse-event reports to the system, which extracts and drafts
      compliant cases for human review and submission
    - Regulatory affairs teams process multi-tenant case materials under new compliance requirements and
      check the outputs
    regions:
    - 全球
    regions_en:
    - Global
    open_source: false
    summary_zh: 药物警戒与法规事务团队在收到不良反应报告或新增合规要求时，把病例材料交给 LifeSphere NavaX，由它抽取信息并生成合规病例草稿，人工复核后提交；本次公开的是其多租户推理成本优化，具体交付流程与准确率仍待核验。
    inspiration: 趋势：生命科学合规场景的生成式 AI 已进入多租户与成本治理阶段，竞争点从“能不能生成”转向“合规差异下能否稳定交付”。切入：从药物警戒病例处理这类高频、强合规、人工复核不可省的环节进入，按处理的病例量或合规包收费，而不是卖通用模型接口。
    summary_en: When pharmacovigilance and regulatory teams receive adverse-event reports or new compliance
      requirements, they hand case materials to LifeSphere NavaX, which extracts information and drafts
      compliant cases for human review and submission; this disclosure covers multi-tenant inference cost
      optimization, while the exact delivery workflow and accuracy remain to be verified.
    inspiration_en: 'Trend: generative AI in life-sciences compliance has moved into multi-tenant and
      cost-governance territory, where the contest shifts from generation to reliable delivery under differing
      compliance rules. Entry: start from high-frequency, heavily regulated steps such as adverse-event
      case processing, charging per case or compliance package rather than selling generic model access.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 药物警戒专员在收到新的不良反应报告时，处理病例材料并整理成符合监管要求的病例，交由人工复核后提交。
        job_en: Pharmacovigilance specialists receive new adverse-event reports, process the case materials
          into regulator-compliant cases, and submit them after human review.
        pain_zh: 病例处理量大、合规要求随客户与地区变化，人工逐条整理耗时且易错；多租户合规差异还推高了推理成本。
        pain_en: Case volumes are large and compliance requirements vary by customer and region; manual
          case-by-case drafting is slow and error-prone, and multi-tenant compliance differences also
          raise inference costs.
        current_alternative_zh: 由药物警戒人员手工阅读报告、录入系统并撰写病例，或使用传统规则系统加人工补录。
        current_alternative_en: Pharmacovigilance staff manually read reports, enter them into systems
          and draft cases, or use rule-based systems with manual completion.
        usage_reason_zh: 推断：相较纯人工录入，NavaX 直接接收病例材料并生成合规病例草稿，减少逐条阅读与初稿撰写这一步；合规团队仍需人工复核，因此适合病例量大、合规要求多变的药企在药物警戒环节选用。
        usage_reason_en: 'Inference: compared with purely manual entry, NavaX takes case materials and
          drafts compliant cases, removing the step of reading and drafting each case from scratch; compliance
          teams still review manually, so it suits pharma firms with high case volumes and shifting compliance
          rules in pharmacovigilance.'
      gates:
      - gate: value
        status: supported
        reason: 它解决药物警戒病例处理中人工阅读与初稿撰写耗时、合规差异难统一的问题，旧流程与不处理的后果清楚。
        evidence_ids:
        - ev-1e7dc1ca82c1b211
      - gate: consensus
        status: insufficient
        reason: 公开材料只说明其为生命科学客户服务，未给出具体客户采用规模或持续使用数据。
        evidence_ids:
        - ev-1e7dc1ca82c1b211
      - gate: model
        status: insufficient
        reason: 买方为药企可推断，但定价、按病例计费方式与合同结构未公开，属判断而非已验证事实。
        evidence_ids:
        - ev-1e7dc1ca82c1b211
      - gate: truth
        status: insufficient
        reason: 人工复核边界存在，但病例抽取准确率与监管验收结果未披露，交付确定性仍缺一环。
        evidence_ids:
        - ev-1e7dc1ca82c1b211
      next_validation: 收集 ArisGlobal 官方关于 LifeSphere NavaX 的客户案例或产品页，核验其药物警戒病例处理的准确率指标与人工复核流程。
