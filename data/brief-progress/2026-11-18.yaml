    slug: 依赖债务支持ai热潮这家新兴云厂商融资10亿美元买英伟达gpu租赁给微软
    name: CoreWeave
    decision: market_context
    event_summary_zh: 公开报道显示，CoreWeave 在 2026 年 8 月至 9 月间通过约 10 亿美元融资、3500 万股市价增发及 30 亿美元可转债为 GPU 采购和数据中心扩张筹资，其数据中心债券息票为
