    inspiration: 趋势：勒索软件开始直接瞄准家用和小企业 NAS，安全处置从“请运维上门”变成“一条命令自查自修”。切入：面向没有专职 IT 的小企业、工作室和家庭 NAS 用户，按设备或按次做勒索排查与加固，卖结果而非卖工具；也可先做
