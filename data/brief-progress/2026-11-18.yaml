      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数持续增长，属关注度信号，缺少用户评价或团队采用案例说明真实使用。
        evidence_ids:
        - ev-3c477a282cc66d44
      - gate: model
        status: insufficient
        reason: 公开材料未披露定价、托管服务或付费方式，钱从哪来只能推断为开发者或团队订阅。
        evidence_ids:
        - ev-4c62c9261ef2cc44
      - gate: truth
        status: insufficient
        reason: 隔离沙箱贴近代理安全执行的第一性目标，但交付确定性与人工边界缺少文档或实测支持。
        evidence_ids:
        - ev-4c62c9261ef2cc44
