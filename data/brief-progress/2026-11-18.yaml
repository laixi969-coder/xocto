        job_en: A literary editor or translator must render a multi-million-character foreign classic
          into Chinese while keeping names, terminology and narrative style consistent throughout.
        pain_zh: 人工逐章翻译耗时以年计，通用机器翻译对长句、隐喻和意识流段落常需大幅重写，风格漂移和术语不一致要反复回改。
        pain_en: Manual chapter-by-chapter translation takes years, generic machine translation often
          needs heavy rewriting of long sentences, metaphors and stream-of-consciousness passages, and
          style drift plus inconsistent terminology force repeated rework.
        current_alternative_zh: 出版社组织多位译者分工合译，或先用通用翻译工具出初稿再人工大改，术语表和风格统一靠人工维护。
        current_alternative_en: Publishers assign multiple translators to split the work, or use generic
