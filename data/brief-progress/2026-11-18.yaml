        job_zh: 三维场景美术师或小制作团队接到一段文字创意简报后，要把它变成可渲染的 Blender 场景，用于概念图或预演镜头。
        job_en: A 3D scene artist or small production team receives a one-paragraph creative brief and
          must turn it into a renderable Blender scene for concept frames or previs shots.
        pain_zh: 从简报走到可渲染场景要经过找素材、建道具、摆布局、布光、调机位和调色多道手工步骤，单场景耗时长，早期概念阶段反复改稿成本高。
        pain_en: 'Going from a brief to a renderable scene involves many manual steps: sourcing assets,
          building props, layout, lighting, camera and grading; each scene is slow and early concept iteration
          is costly.'
        current_alternative_zh: 美术师手工在 Blender 里建模摆场，或购买素材库、外包给自由职业者做概念图；也有用文生图工具出平面概念图，但拿不到可编辑的三维场景。
        current_alternative_en: Artists build and lay out scenes by hand in Blender, or buy asset libraries
          and outsource concept art to freelancers; text-to-image tools give flat concept images but not
          an editable 3D scene.
        usage_reason_zh: 推断：相较手工从零搭场，它把简报直接转成道具生成加脚本化布局、布光与机位，省掉找素材和反复摆场的前几步，让美术师从可渲染初稿开始改，因此接简报多、出图频的小团队会在概念阶段先试它。
        usage_reason_en: 'Inference: versus building from scratch by hand, it turns the brief into prop
          generation plus scripted layout, lighting and camera, skipping the early asset-sourcing and
          scene-blocking steps so artists start from a renderable draft; teams with many briefs and frequent
          concept output would try it at the concept stage.'
