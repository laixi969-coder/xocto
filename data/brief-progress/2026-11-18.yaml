      to spin up an isolated VM per project with the full toolchain, where the agent or a person can write
      code and run commands. The deliverable is a reproducible, non-conflicting project sandbox; pricing
      and team collaboration flow still need verification.
    inspiration_en: 'Trend: coding agents now actually execute code, so environment isolation moves from
      a personal habit to a precondition for agents to run safely. Entry: sell hosted per-project reproducible
      sandboxes to teams wiring agents into real repositories, priced by concurrent sandbox or runtime;
      regulated software teams in finance and healthcare are a natural first segment.'
