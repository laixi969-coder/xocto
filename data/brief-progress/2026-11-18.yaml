      Claude Code、Codex 等主流 Agent。具体交付形态与学习效果仍待核验。
    inspiration: 趋势是 Agent 从黑箱产品变成可拆解的教学对象，学习者想看清每一步而非只调 API。切入可做面向转岗开发者或高校课程的 Agent 拆解训练营，按课交付可运行代码与调试记录；是否收费未披露。
    summary_en: 'An AI Agent tutorial for beginners that is also a locally runnable agent: learners start
      from a 100-line minimal loop and add file read/write, command execution, MCP and long-term memory
      lesson by lesson, watch each step in a web view, and finally dissect mainstream agents such as Claude
      Code and Codex. The exact deliverable and learning outcomes still need verification.'
    inspiration_en: The trend is agents turning from black boxes into dissectable teaching objects, with
      learners wanting to see each step rather than just call an API. An entry point is an agent-dissection
      bootcamp for career-switching developers or university courses, delivering runnable code and debugging
      logs per lesson; pricing is not disclosed.
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 零基础学习者或转岗开发者想弄懂 AI Agent 的内部循环，在本地跟着分课教程从最小循环起步，逐步加入文件读写、命令执行、MCP 与记忆，最终能拆解 Claude Code、Codex
          等主流 Agent。
        job_en: A beginner or career-switching developer wants to understand the inner loop of an AI Agent,
          follows a lesson-by-lesson local tutorial from a minimal loop, gradually adds file I/O, command
          execution, MCP and memory, and finally can dissect mainstream agents such as Claude Code and
          Codex.
        pain_zh: 主流 Agent 框架文档分散、抽象层多，初学者难以看清一次任务中模型、工具与记忆如何交互，只能照抄示例或直接调 API，遇到问题无法定位。
        pain_en: Mainstream agent frameworks have scattered docs and many abstraction layers, so beginners
          struggle to see how model, tools and memory interact within one task; they copy examples or
          call APIs directly and cannot locate failures.
        current_alternative_zh: 读零散博客、看官方文档、直接调用现成 Agent 框架或复制开源项目，缺少从最小可运行循环逐层加能力的连贯路径。
        current_alternative_en: Reading scattered blog posts, official docs, directly using existing agent
          frameworks or copying open-source projects, without a coherent path that adds capabilities layer
          by layer from a minimal runnable loop.
        usage_reason_zh: 推断：相较零散文档，它把每一步能力做成可运行的一课，并在网页端展示文件读写、命令执行与记忆过程，学习者能对照代码看到具体动作，减少在抽象框架里猜执行顺序的负担，因此初学者和教学场景会选它。
        usage_reason_en: 'Inference: compared with scattered docs, it turns each capability into a runnable
          lesson and shows file I/O, command execution and memory in a web view, so learners can match
          code to concrete actions and spend less effort guessing execution order inside abstract frameworks;
          beginners and teaching settings would choose it for that.'
      gates:
      - gate: value
        status: supported
        reason: 它解决初学者看不清 Agent 内部循环、只能照抄示例的痛点，把能力拆成可运行课程并展示每一步，旧做法是零散文档与直接调框架。
        evidence_ids:
        - ev-30f6a7b7f3b267f1
        - ev-378d8b6102201538
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星标从 512 增至 545 的关注度信号，缺少学习者完成课程、复访或教学采用的公开证据。
        evidence_ids:
        - ev-30f6a7b7f3b267f1
        - ev-378d8b6102201538
      - gate: model
        status: insufficient
        reason: 开源教程未披露定价或付费路径，买方可能是个人学习者、高校课程或企业培训，均属推断，尚无已验证收入。
        evidence_ids:
        - ev-378d8b6102201538
      - gate: truth
        status: insufficient
        reason: 课程是否真能让学习者独立拆解主流 Agent、交付是否确定，公开材料只描述课程结构，缺少完成结果或反馈。
        evidence_ids:
        - ev-30f6a7b7f3b267f1
      next_validation: 收集该仓库的 issue、discussion 或课程完成反馈，核验学习者是否真正跑通并拆解主流 Agent。
