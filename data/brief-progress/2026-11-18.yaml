    summary_zh: 使用 DeepSeek Harness 的开发者在一轮会话结束后打开这个看板插件，它从会话记录中提取任务目标、进度和遗留问题，生成子任务与产物条目，并支持把会话交接给下一轮或协作者；用户拿到的是可继续推进的任务卡片，具体提取准确度与人工确认环节仍待核验。
