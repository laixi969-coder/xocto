    jobs:
    - 使用 DeepSeek Harness 的开发者查看本地会话日志，核对 token 用量、峰值日、连续使用天数与各服务商费用分摊，以掌握自己的调用成本
    jobs_en:
    - Developers using DeepSeek Harness review local session logs to check token usage, peak days, usage
      streaks and per-provider cost split, in order to track their own API spending
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 使用 DeepSeek Harness Web UI 的开发者，在需要盘点自己一段时间内的调用情况时打开它；它读取本地会话日志，汇总 token 用量、峰值日、连续使用天数、活动热力图和各服务商费用分摊，最终给出一个个人使用统计页。具体统计口径与是否支持导出仍待核验。
    inspiration: 趋势：模型调用成本开始被个人开发者当作需要记账的日常开销，用量与账单可视化从企业级 FinOps 下沉到个人工作台。切入：面向同时接入多家模型服务商的独立开发者与小团队，从“月底对账”这一环节进入，把分散在各家账单里的调用量合成一张可核对的成本表；是否按订阅或按接入服务商数量收费尚未披露。
    summary_en: Developers using the DeepSeek Harness Web UI open this when they need to review their
      own usage over a period; it reads local session logs and aggregates token usage, peak day, usage
      streaks, an activity heatmap and per-provider cost split into a personal usage page. The exact counting
      rules and whether export is supported still need verification.
    inspiration_en: 'Trend: model API spending is becoming a routine expense individual developers track,
      pushing usage and billing visibility from enterprise FinOps down to personal workbenches. Entry:
      target independent developers and small teams who call several model providers, starting from the
      month-end reconciliation step by merging scattered provider bills into one checkable cost table;
      whether it charges by subscription or per connected provider is not disclosed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 使用 DeepSeek Harness 的开发者在一段时间后需要盘点自己的调用情况，处理本地会话日志，完成 token 用量、峰值日与各服务商费用的核对。
        job_en: A developer using DeepSeek Harness periodically reviews their own usage, working from
          local session logs to reconcile token consumption, peak days and per-provider costs.
        pain_zh: 调用分散在多个服务商，账单和用量各在一处，想回答“这个月花了多少、花在哪”要手动翻日志和账单。
        pain_en: Usage is spread across several providers with bills and logs in separate places, so answering
          "how much did I spend this month and on what" requires manually digging through logs and invoices.
        current_alternative_zh: 手动翻查各服务商后台账单，或自己写脚本解析本地日志。
        current_alternative_en: Manually checking each provider's billing dashboard, or writing a script
          to parse local logs.
        usage_reason_zh: 推断：它直接读取本地会话日志并合成一张含 token、峰值日与费用分摊的页面，省去逐家后台对账和自写解析脚本这一步，因此同时接入多家服务商、需要定期核对成本的开发者会在月底盘点时选择它。
        usage_reason_en: 'Inference: it reads local session logs directly and produces one page with tokens,
          peak days and cost split, removing the step of checking each provider dashboard and writing
          a parser, so developers using multiple providers who need periodic cost checks would pick it
          at month-end review.'
      gates:
      - gate: value
        status: supported
        reason: 它解决开发者核对自身模型调用量与多服务商费用的需求，痛点是账单分散、需手动翻日志，旧做法是逐家查后台或自写脚本。
        evidence_ids:
        - ev-a1a6dc1d96ba9658
      - gate: consensus
        status: insufficient
        reason: 仅有仓库星数缓慢增长，缺少用户评价或讨论说明开发者是否真的把它纳入日常对账。
        evidence_ids:
        - ev-a1a6dc1d96ba9658
        - ev-42575731b8f14d41
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价、赞助或付费路径，谁付钱尚不明确，这是判断不是已验证事实。
        evidence_ids:
        - ev-a1a6dc1d96ba9658
      - gate: truth
        status: insufficient
        reason: 统计口径、是否支持导出与多服务商账单准确性均未核验，交付确定性待查。
        evidence_ids:
        - ev-a1a6dc1d96ba9658
      next_validation: 收集该仓库 README 与 issue/discussion，核对其统计口径、支持的服务商范围及是否提供导出或对账功能。
