    open_source: true
    summary_zh: 面向同时推进多个编码任务的开发者：把请求交给按项目划分的管理代理，由它在 git worktree 中并行启动多个工作代理，用户最终拿到各分支的改动结果，仍需人工审查与合并。具体调度规则、冲突处理和交付质量仍待核验。
    inspiration: 趋势：编码代理从单次对话走向多任务并行，瓶颈正从“会不会写”转到“谁分派、谁合并、谁负责”。切入：从需要同时维护多分支的团队或外包交付方进入，卖按项目或按合并结果计费的调度与验收层，而不是再做一个编码模型。
    summary_en: 'For developers running several coding tasks at once: requests go to per-project manager
      agents that launch parallel worker agents in git worktrees, and the user receives the branch changes,
      still needing human review and merge. Scheduling rules, conflict handling and delivery quality remain
      unverified.'
    inspiration_en: 'Trend: coding agents are moving from single conversations to parallel multi-task
      work, so the bottleneck shifts from writing code to dispatching, merging and accountability. Entry:
      start with teams or outsourced delivery shops juggling many branches, selling a dispatch-and-acceptance
      layer billed per project or per merged result rather than another coding model.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在同一代码库上并行推进多个编码任务时，把请求交给按项目划分的管理代理，由其在 git worktree 中运行多个工作代理，最后汇总分支改动供人工审查合并。
        job_en: When a developer runs several coding tasks on one codebase, they hand requests to per-project
          manager agents that run worker agents in git worktrees and collect branch changes for human
          review and merge.
        pain_zh: 多个编码代理同时改动同一仓库时，分支互相覆盖、上下文丢失、合并冲突和进度无人汇总，开发者要手工开分支、盯进度、拼结果。
        pain_en: When several coding agents touch one repository, branches overwrite each other, context
          is lost, merges conflict and nobody summarizes progress, so developers manually branch, track
          and stitch results.
        current_alternative_zh: 开发者逐个开终端会话或手动建 git worktree，自己复制任务、盯每个代理的输出，再手工合并；或只用单个代理串行处理。
        current_alternative_en: Developers open terminal sessions one by one or create git worktrees by
          hand, copy tasks themselves, watch each agent's output and merge manually, or run a single agent
          serially.
        usage_reason_zh: 推断：相较手工开分支和逐个盯代理，它把分派、并行执行和分支隔离收进一个按项目的管理代理，减少开发者反复建 worktree、复制任务和汇总进度的步骤，因此同时维护多任务的团队会在任务量超过单人可盯范围时选择它。
        usage_reason_en: 'Inference: versus manually branching and watching each agent, it folds dispatch,
          parallel execution and branch isolation into one per-project manager agent, cutting the steps
          of creating worktrees, copying tasks and summarizing progress, so teams juggling many tasks
          pick it once volume exceeds what one person can track.'
      gates:
      - gate: value
        status: supported
        reason: 它解决多编码代理并行时分支冲突、上下文丢失和进度无人汇总的问题，旧做法是手工建 worktree 并逐个盯输出，痛点具体；但交付确定性尚未核验。
        evidence_ids:
        - ev-b7f8c4103e202df7
      - gate: consensus
        status: insufficient
        reason: 仅有仓库 142 星与 5 次 fork，没有用户评价、issue 讨论或采用案例，无法判断开发者是否真的把它放进日常流程。
        evidence_ids:
        - ev-b7f8c4103e202df7
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价或付费路径；可能靠托管服务或企业支持收费，这是判断而非已验证事实。
        evidence_ids:
        - ev-b7f8c4103e202df7
      - gate: truth
        status: insufficient
        reason: 调度规则、冲突处理与合并质量未见文档或实测，承诺能否确定性交付仍缺证据。
        evidence_ids:
        - ev-b7f8c4103e202df7
      next_validation: 收集该仓库的 README 与 issue/discussion，核验其调度规则、冲突处理方式及是否有可复现的并行合并实测记录。
