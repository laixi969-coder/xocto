    regions: []
    regions_en: []
    open_source: true
    summary_zh: 个人装机者在组装非苹果硬件、准备安装 macOS 时，把这份指南交给 Codex、Claude Code 等编码 Agent，由 Agent 按步骤指引安装并调试兼容性，最终目标是得到可启动、调优后的系统。具体支持哪些硬件组合、调试到什么程度，公开材料未说明，交付质量仍待核验。
    inspiration: 趋势：把长篇硬件兼容指南改写成 Agent 可执行的步骤，让编码助手承担装机排错这类高门槛手工活。切入：面向黑苹果、Linux 装机、旧设备改造等小众硬件社区，按机型或主板打包可执行的配置与排错流程，卖的是“装得成”的结果而非文档。
    summary_en: Hobbyist PC builders preparing to install macOS on non-Apple hardware hand this guide
      to coding agents such as Codex or Claude Code, which walk them through installation and compatibility
      debugging toward a bootable, tuned system. Which hardware combinations are supported and how far
      debugging goes is not stated publicly; delivery quality remains unverified.
    inspiration_en: 'Trend: long hardware compatibility guides are being rewritten as agent-executable
      steps, letting coding assistants take on high-skill installation and troubleshooting work. Entry:
      target niche hardware communities such as Hackintosh, Linux installs and old-device revival, packaging
      executable configuration and troubleshooting flows per model or motherboard, selling the outcome
      of a working install rather than a document.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人装机爱好者在组装非苹果硬件、准备安装 macOS 时，把硬件清单与指南交给编码 Agent，要完成从配置到调试的可启动系统。
        job_en: A hobbyist PC builder assembling non-Apple hardware and preparing to install macOS hands
          the hardware list and guide to a coding agent to reach a bootable system from configuration
          through debugging.
        pain_zh: 黑苹果安装涉及大量机型、驱动与引导参数匹配，排错靠论坛长帖和试错，单次装机耗时长且容易卡在兼容性问题上。
        pain_en: Hackintosh installs require matching many models, drivers and boot parameters; troubleshooting
          relies on long forum threads and trial and error, making each build slow and prone to compatibility
          dead ends.
        current_alternative_zh: 查阅论坛教程、公开代码仓库 配置仓库和视频教程，手动逐条比对并反复重启试错。
        current_alternative_en: Reading forum tutorials, public code repository config repos and video
          guides, comparing entries manually and rebooting repeatedly by trial and error.
        usage_reason_zh: 推断：相较翻长帖手动比对，Agent 按当前硬件逐步给出下一步动作并解释参数，减少在检索与试错之间来回的负担；装机者在自己硬件组合不被现成教程覆盖时会选择它。
        usage_reason_en: 'Inference: versus manually scanning long threads, the agent gives the next step
          for the current hardware and explains parameters, cutting back-and-forth between searching and
          trial and error; builders choose it when their hardware combination is not covered by existing
          guides.'
      gates:
      - gate: value
        status: supported
        reason: 它解决黑苹果装机中硬件匹配与排错的高门槛问题，旧做法是翻论坛长帖反复试错，痛点具体且不解决的代价是装不成。
        evidence_ids:
        - ev-3c68f6bf76cd707a
      - gate: consensus
        status: insufficient
        reason: 仅有仓库收藏数，缺少用户反馈或装机成功案例，无法判断装机者是否真的按此流程走通。
        evidence_ids:
        - ev-3c68f6bf76cd707a
      - gate: model
        status: insufficient
        reason: 开源项目，未见定价或付费路径；买方可能是个人装机者或装机服务商，属判断而非已验证事实。
        evidence_ids:
        - ev-3c68f6bf76cd707a
      - gate: truth
        status: insufficient
        reason: 指南能否确定性交付可启动系统、覆盖哪些硬件未说明，且黑苹果涉及授权与合规边界需核验。
        evidence_ids:
        - ev-3c68f6bf76cd707a
      next_validation: 收集仓库 issue 与讨论区中用户报告的实际装机成功或失败案例，核验其覆盖的硬件组合与交付结果。
