    summary_zh: 个人开发者或知识工作者在需要让网页版 AI 处理本机文件时，安装浏览器插件 webagent，由它把本地文件与电脑操作交给网页版 AI 执行，用户最终拿到被改动的文件或已执行的操作，并需自行确认结果。具体支持哪些操作、权限边界与交付形态仍待核验。
    inspiration: 趋势：网页版 AI 与本地文件、桌面操作之间的桥接正在被开源社区自发补齐，说明“AI 只能聊天、碰不到本机材料”是真实摩擦。切入：可从需要处理本地文档与代码、又不愿迁移到新客户端的个人开发者和小团队进入，先做可审计的操作日志与权限确认，再考虑按团队席位或私有部署收费；价格未披露，属推断。
