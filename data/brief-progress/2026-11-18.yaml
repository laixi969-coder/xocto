  fireworks-ai:
    slug: fireworks-ai
    name: Fireworks AI
    decision: market_context
    event_summary_zh: 2026年11月9日至16日，多家媒体报道Fireworks AI在数周内第二次遭入侵，攻击者据报可访问包括Notion客户聊天记录在内的数据；有报道称客户因GPU供给紧张而非安全因素继续留用。这是模型推理与GPU供给层的安全与供给事件，不是新的独立应用。
    event_summary_en: Between Nov 9 and Nov 16, 2026, multiple outlets reported that Fireworks AI suffered
      a second breach within weeks, with attackers reportedly reaching data including Notion customer
      chat transcripts; one report said customers stayed because of GPU scarcity rather than security.
      This is a security and supply event in the model-inference and GPU layer, not a new standalone application.
    category: 基础层
    project_type: ai_transformation
    industries:
    - 云计算与AI基础设施
    - 企业软件
    industries_en:
    - Cloud and AI infrastructure
    - Enterprise software
    jobs:
    - AI应用团队在选型推理服务商时评估数据安全与供应链风险
    - 企业安全负责人在第三方模型服务商发生泄露后核查数据暴露范围
    jobs_en:
    - AI application teams assessing data security and supply-chain risk when choosing an inference provider
    - Enterprise security leads scoping data exposure after a third-party model provider breach
    regions:
    - 美国
    regions_en:
    - United States
    open_source: false
    summary_zh: 面向开发者的模型推理与GPU托管服务，本次事件是其在数周内第二次遭入侵，客户数据据报经其链路暴露。对AI应用方的含义是：推理层的安全与供给集中度已成为交付风险，选型时需把数据隔离与供应商事故记录纳入成本。
    inspiration: 趋势：模型推理与GPU供给正集中到少数服务商，一次泄露即可波及下游应用客户的数据。切入：面向使用第三方推理服务的企业做供应商安全尽调与数据流审计，按次或按年收费；也可从需要数据隔离的垂直行业（法律、医疗）切入自托管推理。
    summary_en: A developer-facing model inference and GPU hosting service; this event is its second breach
      in weeks, with customer data reportedly exposed through its pipeline. For AI application builders
      the implication is that security and supply concentration in the inference layer are now delivery
      risks, and data isolation plus vendor incident history must enter provider selection.
    inspiration_en: 'Trend: model inference and GPU supply are concentrating in a few providers, so one
      breach can reach downstream application customers'' data. Entry: vendor security due diligence and
      data-flow audits for companies using third-party inference, sold per engagement or annually; alternatively
      self-hosted inference for verticals such as legal and healthcare that need data isolation.'
