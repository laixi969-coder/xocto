        job_zh: 消费者在计划购物或预订时，把需求交给助手，由它检索商品或服务并完成下单或预订，最终拿到订单或预订结果。
        job_en: A consumer planning a purchase or booking hands the request to the assistant, which searches
          products or services and completes the order or reservation, delivering the order or booking
          result.
        pain_zh: 购物与预订需要在多个商家页面之间反复检索、比较和填写信息，步骤分散且耗时；不采用则要自己完成全部检索与下单动作。
        pain_en: Shopping and booking require repeated searching, comparing and form-filling across merchant
          pages, which is fragmented and time-consuming; without it the consumer does all the searching
          and ordering manually.
        current_alternative_zh: 消费者目前自己在电商或预订平台内搜索筛选，或使用通用对话助手查询信息后再自行下单。
        current_alternative_en: Consumers currently search and filter inside e-commerce or booking platforms
          themselves, or query a general chat assistant and then place the order manually.
        usage_reason_zh: 推断：相较自己在多个页面检索再跳转下单，助手把检索、比较与下单或预订合并为一次委托，减少跨页面切换和重复填写这一步负担，因此怕麻烦、任务明确的购物者会在计划购买或预订时选择它；公开材料未披露实际使用与留存数据。
        usage_reason_en: 'Inference: compared with searching across pages and then jumping to checkout,
