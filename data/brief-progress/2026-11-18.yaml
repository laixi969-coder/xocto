        reason: 开源项目未披露定价或收费方式，买方与付费路径无法从公开材料确认，这是判断不是已验证事实。
        evidence_ids:
        - ev-49c22ba7f4782b2a
      - gate: truth
        status: insufficient
        reason: 依赖图像转 3D 道具与脚本化布光，能否稳定交付可用场景、人工返工多少尚无实测或案例支持。
        evidence_ids:
        - ev-4c14c94374b6c8c6
        - ev-49c22ba7f4782b2a
