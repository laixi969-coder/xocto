      exists; input format, safety boundaries and deliverable remain unverified.'
    inspiration_en: The trend is vision-language-action models moving from robot arms to aircraft, turning
      'see an image plus state a mission' into control signals. Entry could be inspection or mapping,
      where work orders already exist, starting with offline route suggestions confirmed by a licensed
