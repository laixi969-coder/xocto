      demand_read:
        job_zh: React Native 应用开发者在版本发布后排查崩溃与性能退化，需要定位问题代码或配置。
        job_en: React Native developers diagnosing crashes and performance regressions after a release
          and locating the responsible code or configuration.
        pain_zh: 移动应用上线后崩溃与卡顿难以复现，通用监控对 Expo 运行时缺少针对性信息，排查依赖日志与用户反馈，耗时且不完整。
        pain_en: Crashes and jank after release are hard to reproduce, generic monitoring lacks Expo-runtime
          specifics, and diagnosis relies on logs and user reports, which is slow and incomplete.
        current_alternative_zh: 通用 APM 服务、自建日志与崩溃上报、应用商店后台的崩溃统计，以及用户反馈。
        current_alternative_en: General APM services, self-built logging and crash reporting, app store
          crash dashboards, and user reports.
        usage_reason_zh: 推断：若它能把 Expo 运行时指标与具体版本、代码位置关联，开发者可省去在通用监控里手工拼凑上下文的一步，从而在发版后更快定位问题；但公开材料未展示这一关联能力，选择动机尚无事实支持。
        usage_reason_en: 'Inference: if it links Expo runtime metrics to a specific release and code location,
          developers skip manually assembling context in generic monitoring and locate issues faster after
          a release; the public material does not show this linkage, so the reason to choose it is not
          yet factually supported.'
      gates:
