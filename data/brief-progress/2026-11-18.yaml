  agent-autoloop:
    slug: agent-autoloop
    name: agent-autoloop
    decision: watching
    category: AI + 开发
    project_type: open_source
    industries:
    - 软件开发
    industries_en:
    - software development
    jobs:
    - 开发者在命令行里让编码代理在后台持续跟进任务，遇到不确定的决策时通过卡片请求确认
    jobs_en:
    - developers let a command-line coding agent keep working on tasks in the background and request confirmation
      via cards when uncertain
    regions: []
    regions_en: []
    open_source: true
    summary_zh: 开发者在命令行里启动编码代理后，它会在后台自行接续任务并持续跟进，遇到拿不准的环节才发一张卡片请人拍板。用户最终拿到的是代理推进后的任务结果，但具体交付形态、人工确认边界和失败处理方式仍待核验。
    inspiration: 趋势是编码代理从“一问一答”走向“后台长跑、只在关键节点找人”，把人的角色从逐步指挥变成审批。切入可考虑面向需要长时间运行代理的团队，做审批卡片、任务续跑与失败回滚的托管层；开源项目本身如何收费未披露，不宜假设。
    summary_en: After a developer starts a coding agent in the command line, it picks up and follows through
      on tasks in the background, surfacing a card for a human decision only when it is unsure. The user
      ends up with the agent's progressed task output, but the exact deliverable, human-approval boundary
      and failure handling still need verification.
    inspiration_en: 'The trend is coding agents moving from turn-by-turn prompting to long background
      runs that call a human only at key checkpoints, turning the person into an approver. An entry point
      is a hosted layer for teams running long agent sessions: approval cards, task resumption and rollback.
      How the open-source project itself would charge is undisclosed and should not be assumed.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 开发者在命令行里让编码代理在后台持续跟进一项开发任务，代理遇到拿不准的决策时发卡片请开发者确认，开发者据此决定是否放行。
        job_en: A developer lets a command-line coding agent keep following through on a development task
          in the background; when the agent hits an uncertain decision it sends a card for the developer
          to confirm and decide whether to proceed.
        pain_zh: 长任务中代理会停下来等人逐步指挥，开发者必须盯着终端反复确认，无法离开去做别的事；不处理的后果是任务卡住或代理在无人监督下走错方向。
        pain_en: During long tasks the agent stops and waits for step-by-step direction, so the developer
          must watch the terminal and confirm repeatedly instead of doing other work; the cost of not
          solving it is a stalled task or an agent going the wrong way unsupervised.
        current_alternative_zh: 开发者手动在终端里逐步提示代理、逐条确认输出，或干脆不用后台长跑，把任务拆成小段人工推进。
        current_alternative_en: Developers manually prompt the agent step by step in the terminal, confirm
          each output, or avoid long background runs altogether and push tasks forward in small manual
          chunks.
        usage_reason_zh: 推断：相较逐条盯终端确认，它把“持续跟进”交给代理、只在不确定处弹卡片，减少了开发者守在终端逐步放行的负担，因此需要跑较长编码任务的开发者会在离开电脑时选择它；公开材料未提供留存或重复使用证据。
        usage_reason_en: 'Inference: compared with confirming every step in the terminal, it hands follow-through
          to the agent and raises a card only at uncertain points, cutting the burden of sitting at the
          terminal releasing each step, so developers running longer coding tasks would choose it when
          stepping away; public materials provide no retention or repeat-use evidence.'
      gates:
      - gate: value
        status: supported
        reason: 它解决长任务中代理停下等人逐步指挥的问题，痛点是开发者被绑在终端；后台续跑加卡片审批在结构上减少这一步，属工作流推理。
        evidence_ids:
        - ev-385dd850fe5c4993
      - gate: consensus
        status: insufficient
        reason: 只有仓库星数持续上升，属关注度信号，未见用户评价或团队采用说明，无法判断是否形成稳定使用共识。
        evidence_ids:
        - ev-cde718f9adf73b43
        - ev-385dd850fe5c4993
      - gate: model
        status: insufficient
        reason: 开源项目未披露定价、付费方或托管服务，钱可能来自企业自建或后续商业版，这是判断不是已验证事实。
        evidence_ids:
        - ev-385dd850fe5c4993
      - gate: truth
        status: insufficient
        reason: 卡片审批能否确定性交付、代理走错时如何回滚，公开材料未说明，安全与人工边界仍待核验。
        evidence_ids:
        - ev-385dd850fe5c4993
      next_validation: 收集该仓库的 README、issue 与 discussion，核验后台续跑、卡片审批和失败回滚的实际机制与人工边界。
