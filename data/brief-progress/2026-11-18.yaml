    - local consumer services
    - personal errands
    jobs:
    - 个人用户在周末出行或日常采购时，把订票、买菜、送花、找场地等零散事务交给短信或电话里的助手，由它代为操作手机和电脑完成下单，用户拿到已办妥的订单或预约结果
    jobs_en:
    - An individual with scattered weekend or errand tasks hands booking, grocery, flower and venue requests
      to an assistant over text or phone, which operates a phone and computer to place the orders, and
      the user receives completed bookings or purchases
    regions: []
    regions_en: []
    open_source: false
    summary_zh: 个人在需要订票、买菜、送花或找场地时，用短信或电话把请求发给 Instinct，它代替用户操作手机和电脑上的应用完成下单或预约，用户拿到已办妥的结果；具体执行范围、失败处理和人工确认环节仍待核验。
    inspiration: 趋势：助手正从“回答问题”走向“替人操作现有应用”，把跨 App 的零散代办收进一个对话入口。切入：可从高频、低风险、结果可核对的本地生活代办（订场地、订票、送礼）切入，按单次代办收费或与商家分成；支付授权与出错责任是必须先解决的环节。
    summary_en: When someone needs a booking, groceries, flowers or a venue, they send the request to
      Instinct by text or phone; it operates apps on a phone and computer to place the order or reservation
      and the user gets the completed result. Execution scope, failure handling and human confirmation
      still need verification.
    inspiration_en: 'Trend: assistants are moving from answering questions to operating existing apps,
      folding scattered cross-app errands into one conversational entry. Entry: start with high-frequency,
      low-risk, verifiable local errands (venue booking, tickets, gifts), charged per errand or via merchant
      revenue share; payment authorization and error liability must be solved first.'
    req_initial:
      verdict: true_demand
      signal_level: 初步成立
      demand_read:
        job_zh: 个人用户在周末出行、做饭或社交送礼等场景下，把订票、买菜、送花、找球场这类零散事务交给短信或电话里的助手，由它代为操作手机和电脑完成下单，用户拿到已办妥的订单或预约。
        job_en: In weekend travel, cooking or gifting situations, an individual hands scattered tasks
          such as booking tickets, buying groceries, sending flowers or finding a court to an assistant
          over text or phone, which operates a phone and computer to complete the order, and the user
          receives the finished booking or purchase.
        pain_zh: 这些事务分散在多个 App 里，每件都要自己打开、填写、比价和确认，琐碎且打断当前工作；不做的后果是拖延或干脆放弃。
        pain_en: These tasks are spread across many apps, each requiring opening, filling, comparing and
          confirming, which is fiddly and interrupts current work; skipping them means delay or abandonment.
        current_alternative_zh: 用户自己逐个打开外卖、票务、鲜花和场地预订 App 手动操作，或让家人朋友代办；也有通用聊天助手，但通常只给建议而不代为下单。
        current_alternative_en: Users open delivery, ticketing, flower and venue apps one by one and act
          manually, or ask family and friends; general chat assistants exist but usually advise rather
          than place the order.
        usage_reason_zh: 相较逐个 App 手动操作，Instinct 通过短信或电话这一个入口接收自然语言请求，并直接操作手机和电脑上的应用完成下单，省去用户自己切换、填写和确认的步骤；推断在事务零散、用户不便操作手机时更会被选择，实际成功率与出错处理尚无公开证据。
        usage_reason_en: Compared with manual app-by-app operation, Instinct takes a natural-language
          request through one text or phone entry and directly operates apps on a phone and computer to
          complete the order, removing the switching, filling and confirming steps; inference suggests
          it is chosen when tasks are scattered and the user cannot easily operate a phone, while success
          rate and error handling lack public evidence.
      gates:
      - gate: value
        status: supported
        reason: 它解决的是订票、买菜、送礼等零散事务要逐个 App 手动操作的问题，痛点具体且高频；不做的后果是拖延或放弃，旧行为清晰。
        evidence_ids:
        - ev-0b8efa462a241b8b
        - ev-fb85b5d60137bdcd
      - gate: consensus
        status: insufficient
        reason: 只有官网自述，未见用户评价、客户案例或公开使用数据，无法判断是否形成持续采用。
        evidence_ids:
        - ev-fb85b5d60137bdcd
      - gate: model
        status: insufficient
        reason: 官网未披露定价、收费方式或买方；按单次代办收费或订阅是推断，不是已验证事实。
        evidence_ids:
        - ev-0b8efa462a241b8b
      - gate: truth
        status: insufficient
        reason: 代为操作支付与下单涉及授权、出错责任和退款边界，公开材料未说明这些如何确定性交付。
        evidence_ids:
        - ev-fb85b5d60137bdcd
      next_validation: 收集 Instinct 官方定价页或帮助文档，确认其收费方式、支付授权与下单失败时的处理规则。
