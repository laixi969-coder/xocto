    summary_zh: 2026 年 10 月，一家 AI 初创公司据报在 12 小时内入侵 Anthropic，获取员工信息与内部消息。对 AI 应用而言，模型与平台厂商自身成为攻击目标，客户数据与内部通信的暴露风险会直接影响企业采购时的安全审查与合规要求。
    summary_en: In October 2026, an AI startup reportedly breached Anthropic within 12 hours, gaining
      access to employee details and internal messages. For AI applications, model and platform vendors
      themselves are now attack targets, and exposure of customer data and internal communications directly
      affects security review and compliance requirements in enterprise procurement.
