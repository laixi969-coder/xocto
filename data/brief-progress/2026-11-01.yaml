  how-we-took-over-chatgpt-accounts:
    slug: how-we-took-over-chatgpt-accounts
    name: ChatGPT
    decision: market_context
    summary_zh: 2026 年 10 月，安全研究者披露针对 ChatGPT HTML 预览沙箱的攻击链：沙箱 iframe 可经 postMessage 触发父页面 MathLive 虚拟键盘，其
      innerHTML 处理未做来源限制，从而注入无沙箱限制的新 iframe。这意味着在对话产品中嵌入交互式 HTML 应用时，沙箱边界与第三方库的消息处理成为 AI 应用交付中必须审计的安全成本项。
    summary_en: 'In October 2026, security researchers disclosed an attack chain against ChatGPT''s HTML
      preview sandbox: a sandboxed iframe could trigger the parent page''s MathLive virtual keyboard via
      postMessage, whose innerHTML handling lacked origin restrictions, allowing injection of a new iframe
      without sandbox limits. This means that when interactive HTML apps are embedded in chat products,
      sandbox boundaries and third-party library message handling become security costs that must be audited
      in AI application delivery.'
    event_summary_zh: 安全研究者公开针对 ChatGPT HTML 预览沙箱的利用链，可通过 postMessage 与 innerHTML 注入绕过沙箱限制的 iframe。
    event_summary_en: Security researchers published an exploit chain against ChatGPT's HTML preview sandbox
      that uses postMessage and innerHTML to inject an iframe bypassing sandbox restrictions.
