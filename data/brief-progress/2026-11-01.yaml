    name: Etsy
    decision: market_context
    summary_zh: Etsy 于 2026 年 10 月调整平台政策，扩大对卖家内容用于 AI 训练的权利，同时收紧第三方 AI 使用规则。这意味着平台开始把卖家内容作为训练资产纳入自有 AI
      能力，同时限制外部模型获取，可能抬高第三方 AI 工具在电商场景的数据获取成本，并改变卖家内容的使用边界。
    summary_en: Etsy adjusted its platform policy in October 2026, expanding rights to use seller content
      for AI training while tightening rules on third-party AI use. This means the platform is treating
      seller content as a training asset for its own AI capabilities while restricting external model
      access, which could raise data-acquisition costs for third-party AI tools in e-commerce and change
      the boundaries of how seller content may be used.
    event_summary_zh: Etsy 于 2026 年 10 月扩大对卖家内容用于 AI 训练的权利，并收紧第三方 AI 使用规则。
    event_summary_en: Etsy expanded its rights to use seller content for AI training and tightened rules
      on third-party AI use in October 2026.
